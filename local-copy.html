<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat App 2 — Local Copy</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,Arial,sans-serif;background:#05070c;color:#fff}body{overflow:hidden}button{font:inherit;border:0;border-radius:10px;padding:10px 14px;color:#fff;background:#637cff;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#252c3a}.app{height:100%;display:flex;flex-direction:column}.top{padding:18px 22px;border-bottom:1px solid #252d3c;background:#090c13}.row{display:flex;align-items:center;justify-content:space-between;gap:14px}.title{font-size:22px;font-weight:900}.sub{margin-top:5px;color:#8793a8;font:12px monospace}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{padding:12px 22px;border-bottom:1px solid #252d3c;background:#0b0f17;color:#bfc8d8;font:13px monospace}.bar{height:6px;background:#202735}.bar>div{height:100%;width:0;background:linear-gradient(90deg,#536dff,#9eafff);transition:width .25s}.saved{margin:16px 22px;padding:18px;border:1px solid #31523d;border-radius:16px;background:#0c1912}.saved h2{margin:0 0 8px}.saved p{margin:6px 0;color:#9fb0a5;font-size:13px}.location{font:12px monospace;color:#8fd2a4;word-break:break-word}.files{flex:1;overflow:auto;padding:8px 22px 30px}.file{padding:11px 13px;margin:6px 0;border:1px solid #252c39;border-radius:11px;background:#0c1018}.file.ok{border-color:#28543b}.file.err{border-color:#743838;background:#1b0d10}.fileline{display:flex;gap:10px;align-items:center}.name{font:12px monospace;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{color:#77849a;font-size:10px;margin-top:4px}.errtext{color:#ffb1b1;font:10px monospace;margin-top:7px;white-space:pre-wrap}.intro{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 20%,#1c2c52,#070a11 60%,#030509);transition:opacity .7s,visibility .7s}.intro.hide{opacity:0;visibility:hidden}.box{width:min(560px,90vw);padding:28px;text-align:center;border:1px solid #35415a;border-radius:20px;background:#0c111b;box-shadow:0 30px 100px #0008}.box h1{margin:0;font-size:28px}.box p{color:#8996ab;font:12px monospace}.introActions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:18px}.hidden{display:none!important}.small{font-size:11px;color:#76839a;margin-top:10px}
</style>
</head>
<body>
<div class="intro" id="intro"><div class="box"><h1>Chat App 2</h1><p id="introText">Checking this device for a saved copy…</p><div class="introActions" id="introActions"></div><div class="small" id="introLocation"></div></div></div>
<div class="app">
<header class="top"><div class="row"><div><div class="title">Chat App 2 — Local Copy</div><div class="sub">ikirumi11/chat-app2 · main</div></div><div class="actions"><button id="openBtn" class="secondary" disabled>Open Saved</button><button id="fetchBtn">Fetch Newest</button><button id="clearBtn" class="secondary">Delete Saved Copy</button></div></div></header>
<div class="status" id="status">Checking local storage…</div><div class="bar"><div id="progress"></div></div><main class="files" id="files"></main>
</div>
<script>
'use strict';
const OWNER='ikirumi11',REPO='chat-app2',BRANCH='main';
const API=`https://api.github.com/repos/${OWNER}/${REPO}`;
const RAW=`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;
const DB_NAME='chat-app2-permanent-site-copy',DB_VERSION=2,FILES='files',META='meta',META_KEY='saved-copy';
let db=null,tree=[],savedMeta=null;
const $=id=>document.getElementById(id);
function setStatus(t){$('status').textContent=t;$('introText').textContent=t}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function size(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(2)+' MB'}
function openDB(){if(db)return Promise.resolve(db);return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(FILES))d.createObjectStore(FILES,{keyPath:'path'});if(!d.objectStoreNames.contains(META))d.createObjectStore(META,{keyPath:'id'})};r.onsuccess=()=>{db=r.result;db.onversionchange=()=>db.close();resolve(db)};r.onerror=()=>reject(r.error||new Error('IndexedDB unavailable'));r.onblocked=()=>reject(new Error('IndexedDB is blocked by another tab'))})}
async function tx(store,mode,fn){const d=await openDB();return new Promise((resolve,reject)=>{const t=d.transaction(store,mode),s=t.objectStore(store);let result;try{result=fn(s)}catch(e){reject(e);return}t.oncomplete=()=>resolve(result);t.onerror=()=>reject(t.error||new Error('Storage transaction failed'));t.onabort=()=>reject(t.error||new Error('Storage transaction aborted'))})}
async function getAll(){const d=await openDB();return new Promise((resolve,reject)=>{const r=d.transaction(FILES,'readonly').objectStore(FILES).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)})}
async function getMeta(){const d=await openDB();return new Promise((resolve,reject)=>{const r=d.transaction(META,'readonly').objectStore(META).get(META_KEY);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}
async function putFile(f){await tx(FILES,'readwrite',s=>s.put(f))}
async function putMeta(m){await tx(META,'readwrite',s=>s.put(m))}
async function clearAll(){const d=await openDB();await new Promise((resolve,reject)=>{const t=d.transaction([FILES,META],'readwrite');t.objectStore(FILES).clear();t.objectStore(META).clear();t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}
async function requestPersistence(){try{return !!(navigator.storage&&navigator.storage.persist&&await navigator.storage.persist())}catch{return false}}
async function persistentStatus(){try{return !!(navigator.storage&&navigator.storage.persisted&&await navigator.storage.persisted())}catch{return false}}
async function githubTree(){const r=await fetch(`${API}/git/trees/${BRANCH}?recursive=1`,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw new Error(`GitHub HTTP ${r.status}`);const d=await r.json();if(d.truncated)throw new Error('GitHub returned a truncated tree');return(d.tree||[]).filter(x=>x.type==='blob').map(x=>({path:x.path,sha:x.sha,size:x.size||0}))}
function raw(path){return RAW+path.split('/').map(encodeURIComponent).join('/')}
async function blobSha(buffer){const b=new Uint8Array(buffer),h=new TextEncoder().encode(`blob ${b.length}\0`),x=new Uint8Array(h.length+b.length);x.set(h);x.set(b,h.length);const d=await crypto.subtle.digest('SHA-1',x);return [...new Uint8Array(d)].map(v=>v.toString(16).padStart(2,'0')).join('')}
function renderTree(){const box=$('files');box.innerHTML='';for(const f of tree){const e=document.createElement('div');e.className='file';e.id='f-'+CSS.escape(f.path);e.innerHTML=`<div class="fileline"><b>•</b><div class="name"></div><span class="meta"></span></div><div class="errtext"></div>`;e.querySelector('.name').textContent=f.path;e.querySelector('.meta').textContent=size(f.size);box.appendChild(e)}}
function setFile(path,ok,error=''){const e=document.getElementById('f-'+CSS.escape(path));if(!e)return;e.classList.toggle('ok',ok);e.classList.toggle('err',!ok);e.querySelector('b').textContent=ok?'✓':'×';e.querySelector('.errtext').textContent=error}
function localURLMap(files){const m=new Map();for(const f of files)m.set(f.path,URL.createObjectURL(new Blob([f.bytes],{type:mime(f.path)})));return m}
function mime(p){p=p.toLowerCase();if(p.endsWith('.html'))return'text/html';if(p.endsWith('.css'))return'text/css';if(p.endsWith('.js'))return'text/javascript';if(p.endsWith('.json'))return'application/json';if(p.endsWith('.svg'))return'image/svg+xml';if(p.endsWith('.png'))return'image/png';if(p.endsWith('.jpg')||p.endsWith('.jpeg'))return'image/jpeg';if(p.endsWith('.gif'))return'image/gif';if(p.endsWith('.webp'))return'image/webp';if(p.endsWith('.ico'))return'image/x-icon';if(p.endsWith('.mp3'))return'audio/mpeg';if(p.endsWith('.wav'))return'audio/wav';if(p.endsWith('.ogg'))return'audio/ogg';if(p.endsWith('.mp4'))return'video/mp4';if(p.endsWith('.webm'))return'video/webm';if(p.endsWith('.wasm'))return'application/wasm';return'application/octet-stream'}
function norm(p){const a=[];for(const x of p.split('/')){if(!x||x==='.'){continue}if(x==='..')a.pop();else a.push(x)}return a.join('/')}
function resolve(base,target){if(!target)return target;if(/^(https?:|\/\/|data:|blob:|#|mailto:)/i.test(target))return target;const clean=target.split('?')[0].split('#')[0];const b=base.includes('/')?base.slice(0,base.lastIndexOf('/')+1):'';return norm(b+(clean.startsWith('/')?clean.slice(1):clean))}
function rewriteCSS(css,path,map){return css.replace(/url\(\s*(['"]?)(.*?)\1\s*\)/gi,(full,q,t)=>{if(!t||/^(data:|https?:|\/\/)/i.test(t))return full;const r=resolve(path,t);return map.has(r)?`url("${map.get(r)}")`:full})}
function rewriteJS(code,path,map){return code.replace(/(\bfrom\s*)(["'])([^"']+)\2/g,(full,p,q,t)=>{if(!t.startsWith('.')&&!t.startsWith('/'))return full;const r=resolve(path,t);return map.has(r)?p+q+map.get(r)+q:full}).replace(/import\(\s*(["'])([^"']+)\1\s*\)/g,(full,q,t)=>{const r=resolve(path,t);return map.has(r)?`import(${q}${map.get(r)}${q})`:full})}
function buildHTML(source,map){const d=new DOMParser().parseFromString(source,'text/html');d.querySelectorAll('link[rel="stylesheet"][href]').forEach(e=>{const r=resolve('index.html',e.getAttribute('href'));if(map.has(r)){const s=d.createElement('style');const f=loadedFiles.get(r);s.textContent=rewriteCSS(new TextDecoder().decode(f.bytes),r,map);e.replaceWith(s)}});d.querySelectorAll('[src]').forEach(e=>{const r=resolve('index.html',e.getAttribute('src'));if(map.has(r))e.setAttribute('src',map.get(r))});d.querySelectorAll('[poster]').forEach(e=>{const r=resolve('index.html',e.getAttribute('poster'));if(map.has(r))e.setAttribute('poster',map.get(r))});d.querySelectorAll('[style]').forEach(e=>e.setAttribute('style',rewriteCSS(e.getAttribute('style'), 'index.html',map)));d.querySelectorAll('style').forEach(e=>e.textContent=rewriteCSS(e.textContent,'index.html',map));d.querySelectorAll('script[src]').forEach(e=>{const r=resolve('index.html',e.getAttribute('src'));const f=loadedFiles.get(r);if(!f){e.remove();return}const b=new Blob([rewriteJS(new TextDecoder().decode(f.bytes),r,map)],{type:'text/javascript'});e.setAttribute('src',URL.createObjectURL(b));e.removeAttribute('integrity');e.removeAttribute('crossorigin')});return'<!doctype html>\n'+d.documentElement.outerHTML}
let loadedFiles=new Map();
async function openSaved(){const meta=await getMeta();const files=await getAll();if(!meta||!meta.saved||!files.length)throw new Error('No verified saved copy exists on this device.');loadedFiles=new Map(files.map(f=>[f.path,f]));if(!loadedFiles.has('index.html'))throw new Error('Saved copy has no index.html');const map=localURLMap(files);const html=buildHTML(new TextDecoder().decode(loadedFiles.get('index.html').bytes),map);const w=window.open();if(!w)throw new Error('The browser blocked the local-site window. Allow popups for this page.');w.document.open();w.document.write(html);w.document.close()}
async function fetchNewest(){
  $('fetchBtn').disabled=true;$('openBtn').disabled=true;startIntro('Fetching newest GitHub files…');$('files').innerHTML='';$('progress').style.width='0%';
  try{tree=await githubTree();renderTree();if(!tree.length)throw new Error('Repository contains no files');setStatus(`Found ${tree.length} GitHub files. Downloading and verifying…`);let done=0;for(const f of tree){try{const r=await fetch(raw(f.path),{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const b=await r.arrayBuffer();const sha=await blobSha(b);if(sha!==f.sha)throw new Error(`SHA mismatch: GitHub ${f.sha}, downloaded ${sha}`);await putFile({path:f.path,sha:f.sha,size:b.byteLength,bytes:b,savedAt:Date.now()});setFile(f.path,true);done++;$('progress').style.width=(done/tree.length*100)+'%';setStatus(`Verified ${done} / ${tree.length} files…`)}catch(e){setFile(f.path,false,e.message);throw e}}
    const old=await getAll(),wanted=new Set(tree.map(f=>f.path));for(const f of old)if(!wanted.has(f.path))await tx(FILES,'readwrite',s=>s.delete(f.path));
    const persisted=await requestPersistence();const confirmed=await persistentStatus();await putMeta({id:META_KEY,saved:true,repository:`${OWNER}/${REPO}`,branch:BRANCH,fileCount:tree.length,location:`IndexedDB · ${DB_NAME} · ${FILES}`,savedAt:Date.now(),persistentStorage:confirmed||persisted});
    savedMeta=await getMeta();setStatus(`✓ SAVED — ${tree.length} files are verified on this device.`);$('introLocation').textContent=`Location: IndexedDB · ${DB_NAME} · ${FILES}`;$('openBtn').disabled=false;showSavedIntro();
  }catch(e){setStatus(`Save failed: ${e.message}`);$('introLocation').textContent='The copy was not marked SAVED.';try{await tx(META,'readwrite',s=>s.delete(META_KEY))}catch{}showIntroError()}finally{$('fetchBtn').disabled=false}
}
function startIntro(t){$('intro').classList.remove('hide');$('introActions').innerHTML='';$('introLocation').textContent='';setStatus(t)}
function showSavedIntro(){const a=$('introActions');a.innerHTML='';const o=document.createElement('button');o.textContent='Open Saved Copy';o.onclick=()=>{openSaved().then(()=>{$('intro').classList.add('hide')}).catch(e=>setStatus('Open failed: '+e.message))};a.appendChild(o);const f=document.createElement('button');f.className='secondary';f.textContent='Fetch Newest Again';f.onclick=()=>fetchNewest();a.appendChild(f);setTimeout(()=>$('intro').classList.add('hide'),1200)}
function showIntroError(){const a=$('introActions');a.innerHTML='';const f=document.createElement('button');f.textContent='Try Again';f.onclick=fetchNewest;a.appendChild(f);setTimeout(()=>{},0)}
async function init(){try{savedMeta=await getMeta();const files=await getAll();if(savedMeta?.saved&&files.length){$('openBtn').disabled=false;setStatus(`✓ SAVED — ${files.length} files already stored on this device.`);$('introLocation').textContent=`Location: ${savedMeta.location||'IndexedDB local device storage'}`;showSavedIntro()}else{setStatus('No saved copy found.');showIntroError()}}catch(e){setStatus('Local storage check failed: '+e.message);showIntroError()}}
$('fetchBtn').onclick=fetchNewest;$('openBtn').onclick=()=>openSaved().catch(e=>setStatus('Open failed: '+e.message));$('clearBtn').onclick=async()=>{if(!confirm('Delete the saved Chat App 2 copy from this device?'))return;await clearAll();location.reload()};init();
</script>
</body>
</html>
