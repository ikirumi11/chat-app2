name: Fix screen share FPS

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-fps:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch screen-share sender FPS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('screen-share.js')
          s = p.read_text()
          marker = 'function configureScreenShareSenderFPS'
          if marker in s:
              print('FPS patch already present')
              raise SystemExit(0)

          helper = r'''async function configureScreenShareSenderFPS(call){
          const target=Math.max(1,Math.min(144,Number(f)||30));
          const apply=async()=>{
            try{
              const pc=call?.peerConnection;
              if(!pc)return false;
              const senders=pc.getSenders?.()||[];
              let changed=false;
              for(const sender of senders){
                if(sender.track?.kind!=='video')continue;
                try{sender.track.contentHint='motion'}catch{}
                const p=sender.getParameters();
                if(!p||!p.encodings?.length)continue;
                for(const enc of p.encodings){
                  enc.maxFramerate=target;
                  if('priority' in enc)enc.priority='high';
                }
                try{p.degradationPreference='maintain-framerate'}catch{}
                try{await sender.setParameters(p);changed=true}catch{}
              }
              return changed;
            }catch{return false}
          };
          for(let i=0;i<40;i++){
            if(await apply())return;
            await new Promise(r=>setTimeout(r,100));
          }
          }
          '''

          s=s.replace("function makeViewerStream(){", helper+"\nfunction makeViewerStream(){", 1)
          old="try{call.answer(stream);calls.set(call.peer,call);call.on('close',()=>calls.delete(call.peer));call.on('error',()=>calls.delete(call.peer))}"
          new="try{call.answer(stream);configureScreenShareSenderFPS(call);calls.set(call.peer,call);call.on('close',()=>calls.delete(call.peer));call.on('error',()=>calls.delete(call.peer))}"
          if old not in s:
              raise SystemExit('Could not find host answer block')
          s=s.replace(old,new,1)
          p.write_text(s)
          print('Applied screen-share FPS sender patch')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screen-share.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix screen share high FPS transmission"
          git push
