name: Restore app.js after accidental overwrite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.event.before == '30fd35f875498da94fd2d7c5e04c5a4862048bf3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore app.js
        run: |
          git checkout ab148a672386ad582ea76a933ebee097c7583e70 -- app.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Restore app.js after accidental overwrite' || exit 0
          git push
