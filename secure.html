<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self'; connect-src 'self' https://api.github.com https://*.supabase.co wss://*.supabase.co https://www.youtube.com https://*.googlevideo.com; font-src 'self' data: https:;">
<title>Game Chat — Secure Loader</title>
<style>body{margin:0;background:#0f1115;color:#e8ecf1;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}.box{width:min(680px,92vw);padding:28px;border:1px solid #303640;border-radius:18px;background:#171a20;box-shadow:0 18px 60px #0008}.bar{height:8px;background:#292e37;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#6ea8fe;transition:width .2s}.muted{color:#9da5b0}.ok{color:#7ee787}.bad{color:#ff7b72}#log{margin-top:18px;max-height:220px;overflow:auto;white-space:pre-wrap;font:13px ui-monospace,monospace}</style>
</head>
<body>
<div class="box"><h1>🎮 Game Chat</h1><p class="muted" id="status">Securely loading the complete web app…</p><div class="bar"><div class="fill" id="fill"></div></div><div id="log"></div></div>
<script>
(() => {
  'use strict';
  const REPO_API = 'https://api.github.com/repos/ikirumi11/chat-app2/git/trees/main?recursive=1';
  const ROOT = new URL('.', location.href);
  const status = document.getElementById('status');
  const fill = document.getElementById('fill');
  const log = document.getElementById('log');
  const blocked = /^(?:api\/|\.git(?:\/|$)|node_modules(?:\/|$))/i;

  function write(text, cls='') {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = text;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  }
  function setProgress(n) { fill.style.width = Math.max(0, Math.min(100, n)) + '%'; }
  function localUrl(path) {
    if (!path || path.startsWith('/') || path.includes('\\') || path.split('/').some(x => x === '..')) throw new Error('Unsafe repository path');
    return new URL(path, ROOT).href;
  }
  function order(path) {
    const priority = ['games.js','app.js','games-ui.js','game-settings.js','youtube-together.js','chat-features.js','youtube-cleanup.js','global-background.js','local-background.js','solo-game-fix.js','solo-player-fix.js','message-actions.js','extra-games.js','games-premium.js','polls.js','screen-share.js','whiteboard.js','ui-animations.js'];
    const i = priority.indexOf(path);
    return i < 0 ? 1000 : i;
  }
  async function fetchTree() {
    const r = await fetch(REPO_API, {headers:{'Accept':'application/vnd.github+json'}});
    if (!r.ok) throw new Error('GitHub repository manifest failed: HTTP ' + r.status);
    const data = await r.json();
    if (!Array.isArray(data.tree) || data.truncated) throw new Error('Repository tree is missing or truncated');
    return data.tree.filter(x => x && x.type === 'blob' && typeof x.path === 'string');
  }
  async function fetchAllFiles(tree) {
    const files = tree.filter(x => !blocked.test(x.path));
    let done = 0;
    const results = new Map();
    await Promise.all(files.map(async item => {
      const r = await fetch(localUrl(item.path), {cache:'no-store'});
      if (!r.ok) throw new Error(item.path + ' failed: HTTP ' + r.status);
      results.set(item.path, await r.text());
      done++;
      setProgress(15 + done / files.length * 55);
    }));
    return {files, results};
  }
  async function loadCss(paths) {
    for (const path of paths) {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = localUrl(path);
      link.dataset.secureLoader = '1';
      document.head.appendChild(link);
    }
  }
  function loadScript(path) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = localUrl(path);
      s.async = false;
      s.defer = false;
      s.dataset.secureLoader = '1';
      s.onload = resolve;
      s.onerror = () => reject(new Error(path + ' failed to execute'));
      document.body.appendChild(s);
    });
  }
  async function boot() {
    status.textContent = 'Fetching repository manifest…';
    const tree = await fetchTree();
    write('✓ Repository manifest loaded (' + tree.length + ' files)', 'ok');
    setProgress(10);
    status.textContent = 'Fetching every repository file…';
    const {files, results} = await fetchAllFiles(tree);
    write('✓ Fetched ' + files.length + ' deployable files', 'ok');
    write('✓ Server/API files detected: ' + tree.filter(x => /^api\//i.test(x.path)).length + ' (not executed in browser)', 'ok');
    const html = results.get('index.html');
    if (!html) throw new Error('index.html was not found in the repository');
    const doc = new DOMParser().parseFromString(html, 'text/html');
    if (!doc.body) throw new Error('index.html has no body');
    doc.querySelectorAll('script,link[rel="stylesheet"]').forEach(el => el.remove());
    document.body.replaceChildren(...Array.from(doc.body.childNodes).map(n => document.importNode(n, true)));
    const css = files.map(x => x.path).filter(p => /^.+\.css$/i.test(p) && !blocked.test(p)).sort();
    const js = files.map(x => x.path).filter(p => /^.+\.js$/i.test(p) && !blocked.test(p)).sort((a,b) => order(a)-order(b) || a.localeCompare(b));
    status.textContent = 'Loading all browser styles and scripts…';
    await loadCss(css);
    setProgress(80);
    for (let i = 0; i < js.length; i++) {
      write('Loading ' + js[i]);
      await loadScript(js[i]);
      setProgress(80 + (i + 1) / js.length * 18);
    }
    Object.defineProperty(window, '__SECURE_LOADER_READY__', {value:true, configurable:false, enumerable:false});
    setProgress(100);
    write('✓ Game Chat loaded successfully.', 'ok');
    status.textContent = 'Connected. All browser files are loaded.';
  }
  boot().catch(err => {
    console.error(err);
    setProgress(100);
    status.textContent = 'The app could not finish loading.';
    status.className = 'bad';
    write('✕ ' + (err && err.message ? err.message : String(err)), 'bad');
    write('Make sure this page is deployed over HTTPS and the repository files are present.', 'muted');
  });
})();
</script>
</body>
</html>
