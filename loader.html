<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat App 2 Loader</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070c;color:#fff;font-family:Inter,Arial,sans-serif}
#loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05070c;z-index:10}
.card{width:min(560px,calc(100vw - 32px));padding:28px;border:1px solid #242a36;border-radius:18px;background:#0b0f17;box-shadow:0 20px 60px rgba(0,0,0,.45)}
h1{margin:0 0 10px;font-size:24px}
#status{margin:0 0 18px;color:#aeb7c6;line-height:1.5}
.device{padding:14px;border-radius:12px;background:#070a10;border:1px solid #1d2430;word-break:break-all}
.device-label{display:block;color:#7f8a9b;font-size:12px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em}
#deviceId{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:14px}
#error{display:none;margin-top:14px;padding:12px;border-radius:10px;background:#211014;border:1px solid #5d2933;color:#ffb8c0;white-space:pre-wrap}
#site{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#05070c;z-index:20}
</style>
</head>
<body>
<div id="loader">
  <div class="card">
    <h1>Loading Chat App 2</h1>
    <p id="status">Starting loader...</p>
    <div class="device">
      <span class="device-label">Device ID</span>
      <span id="deviceId">Creating...</span>
    </div>
    <div id="error"></div>
  </div>
</div>

<iframe id="site" title="Chat App 2"></iframe>

<script>
(() => {
  const OWNER = "ikirumi11";
  const REPO = "chat-app2";
  const BRANCH = "main";
  const RAW = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;
  const INDEX_URL = RAW + "index.html";
  const DEVICE_KEY = "chat_device_id";

  const loader = document.getElementById("loader");
  const site = document.getElementById("site");
  const status = document.getElementById("status");
  const deviceIdElement = document.getElementById("deviceId");
  const errorElement = document.getElementById("error");

  function createDeviceId(){
    if(window.crypto && typeof window.crypto.randomUUID === "function"){
      return window.crypto.randomUUID();
    }
    return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2) + "-" + Math.random().toString(36).slice(2);
  }

  function getDeviceId(){
    try{
      const saved = localStorage.getItem(DEVICE_KEY);
      if(saved && saved.trim()) return saved.trim();
    }catch(error){}

    const id = createDeviceId();

    try{
      localStorage.setItem(DEVICE_KEY, id);
    }catch(error){}

    return id;
  }

  const deviceId = getDeviceId();
  deviceIdElement.textContent = deviceId;

  // The iframe browsing-context name is the bridge used by Chat App 2.
  // The GitHub app can read window.name before it initializes its own storage.
  site.name = deviceId;

  function showError(error){
    console.error(error);
    status.textContent = "The app could not be loaded.";
    errorElement.style.display = "block";
    errorElement.textContent = error && error.message ? error.message : String(error);
  }

  function injectBase(html){
    if(/<base\s/i.test(html)) return html;
    return html.replace(/<head([^>]*)>/i, `<head$1>\n<base href="${RAW}">`);
  }

  function injectDeviceBridge(html){
    // Keep the device ID available even before app.js is updated to read window.name.
    // This bridge only establishes the value; it does not replace Chat App 2 code.
    const bridge = `<script>(function(){try{var id=String(window.name||"").trim();if(id){try{localStorage.setItem("chat_device_id",id)}catch(e){}window.__CHAT_APP_DEVICE_ID__=id;}}catch(e){}})();<\\/script>`;
    if(/<head([^>]*)>/i.test(html)){
      return html.replace(/<head([^>]*)>/i, `<head$1>\n${bridge}`);
    }
    return bridge + html;
  }

  async function load(){
    try{
      status.textContent = "Downloading the latest GitHub index...";

      const response = await fetch(INDEX_URL, {cache:"no-store"});
      if(!response.ok){
        throw new Error(`GitHub returned HTTP ${response.status} while loading index.html.`);
      }

      let html = await response.text();
      html = injectBase(html);
      html = injectDeviceBridge(html);

      status.textContent = "Starting Chat App 2...";

      site.name = deviceId;
      site.srcdoc = html;

      site.addEventListener("load", () => {
        setTimeout(() => {
          loader.style.display = "none";
          site.style.display = "block";
        }, 100);
      }, {once:true});

      // Prevent a blank page if the load event is delayed.
      setTimeout(() => {
        if(site.srcdoc && loader.style.display !== "none"){
          loader.style.display = "none";
          site.style.display = "block";
        }
      }, 5000);
    }catch(error){
      showError(error);
    }
  }

  load();
})();
</script>
</body>
</html>
