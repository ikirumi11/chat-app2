<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>💬 Chat - Multiplayer Games</title>

<style>
/* ============================================================
   ROOT VARIABLES
============================================================ */
* {
    box-sizing: border-box;
}

:root {
    --bg: #0b0d10;
    --panel: #111419;
    --panel2: #181c22;
    --panel3: #20252d;
    --border: #292f38;
    --text: #edf0f4;
    --muted: #7e8793;
    --accent: #e8eaed;
    --danger: #ff7070;
    --green: #70e0a0;
    --yellow: #e5c66b;
    --radius: 12px;
    --text-size: 16px;
    --word-spacing: 0px;
    --line-spacing: 1.45;
    --ui-scale: 1;
    --notification-bg: #1a2a3a;
    --notification-border: #2a4a5a;
}

/* ============================================================
   RESET & BASE
============================================================ */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
}

body {
    overflow: hidden;
    font-size: calc(16px * var(--ui-scale));
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* ============================================================
   SCROLLBAR
============================================================ */
::-webkit-scrollbar {
    width: 6px;
}
::-webkit-scrollbar-track {
    background: var(--panel);
}
::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover {
    background: var(--muted);
}

/* ============================================================
   HEADER
============================================================ */
.header {
    height: 60px;
    min-height: 60px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
}

.logo-icon {
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border-radius: 10px;
    background: var(--panel2);
    border: 1px solid var(--border);
    font-size: 18px;
}

.logo span {
    font-size: 18px;
}

.channel {
    color: var(--muted);
    font-weight: 400;
    font-size: 14px;
}

.header-actions {
    display: flex;
    gap: 6px;
}

.icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    font-size: 16px;
    display: grid;
    place-items: center;
    transition: 0.15s;
}

.icon-btn:hover {
    filter: brightness(1.15);
    transform: scale(1.05);
}

.icon-btn .badge {
    position: relative;
}

.icon-btn .badge::after {
    content: '';
    position: absolute;
    top: -4px;
    right: -4px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ff4444;
}

/* ============================================================
   MESSAGES
============================================================ */
.messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
}

.message {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
    animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
}

.avatar {
    flex: 0 0 36px;
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border-radius: var(--radius);
    background: var(--panel2);
    border: 1px solid var(--border);
    font-weight: 700;
    font-size: 14px;
    color: var(--text);
    user-select: none;
}

.message-content {
    min-width: 0;
    max-width: min(750px, calc(100vw - 80px));
}

.message-top {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 2px;
    flex-wrap: wrap;
}

.username {
    font-weight: 700;
    font-size: 14px;
}

.time {
    color: var(--muted);
    font-size: 11px;
}

.edited {
    color: var(--muted);
    font-size: 10px;
    font-style: italic;
}

.message-text {
    color: #d8dde4;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-size: var(--text-size);
    word-spacing: var(--word-spacing);
    line-height: var(--line-spacing);
}

.message-image {
    display: block;
    max-width: min(400px, 70vw);
    max-height: 400px;
    margin-top: 6px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #000;
    object-fit: contain;
    cursor: pointer;
}

/* ============================================================
   NOTIFICATIONS
============================================================ */
.notification {
    position: fixed;
    top: 20px;
    right: 20px;
    max-width: 340px;
    padding: 14px 18px;
    border-radius: 12px;
    background: var(--notification-bg);
    border: 1px solid var(--notification-border);
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    z-index: 300;
    animation: slideIn 0.3s ease;
    pointer-events: auto;
}

@keyframes slideIn {
    from { opacity: 0; transform: translateX(40px); }
    to { opacity: 1; transform: translateX(0); }
}

.notification-title {
    font-weight: 700;
    font-size: 13px;
    color: var(--text);
}

.notification-body {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
}

.notification-close {
    position: absolute;
    top: 6px;
    right: 10px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
}

/* ============================================================
   GAME CARDS
============================================================ */
.game-message {
    margin: 0 auto 16px;
    max-width: 900px;
}

.game-card {
    border: 1px solid var(--border);
    border-radius: 16px;
    background: linear-gradient(145deg, var(--panel2), #101318);
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

.game-header {
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 8px;
}

.game-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 17px;
    font-weight: 800;
}

.game-status {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 999px;
    background: #252b33;
    color: #bfc6cf;
    font-weight: 600;
}

.game-status.playing {
    background: #1a3a2a;
    color: #7affb0;
}

.game-body {
    padding: 16px 18px;
}

.game-info {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
}

.game-pill {
    padding: 5px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #13171d;
    color: #bfc6cf;
    font-size: 12px;
}

.game-pill strong {
    color: white;
}

.game-description {
    color: #969faa;
    margin-bottom: 14px;
    line-height: 1.5;
    font-size: 14px;
}

.game-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
}

.game-btn {
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 8px 16px;
    background: #222830;
    color: white;
    font-weight: 700;
    font-size: 13px;
    transition: 0.15s;
}

.game-btn:hover:not(:disabled) {
    filter: brightness(1.15);
    transform: scale(1.02);
}

.game-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.game-btn.primary {
    background: #e8eaed;
    color: #111;
}

.game-btn.green {
    background: #193b2b;
    border-color: #2c6348;
    color: #9bf0bc;
}

.game-btn.danger {
    background: #3a1c20;
    border-color: #71333b;
    color: #ff9292;
}

.game-btn.boss {
    background: #4a1a2a;
    border-color: #8a3a5a;
    color: #ff8aaa;
    font-size: 16px;
    padding: 12px 24px;
}

.game-btn.boss:hover:not(:disabled) {
    background: #5a2a3a;
}

/* ============================================================
   PLAYERS
============================================================ */
.players-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 10px 0;
}

.player-chip {
    padding: 5px 10px;
    border-radius: 8px;
    background: #13171d;
    border: 1px solid var(--border);
    font-size: 12px;
}

.player-chip.host {
    border-color: #65552a;
    color: #ead17a;
}

.turn-banner {
    margin: 10px 0;
    padding: 10px 14px;
    border-radius: 10px;
    background: #151a20;
    border: 1px solid var(--border);
    color: #c8ced6;
    font-size: 14px;
}

.turn-banner strong {
    color: white;
}

/* ============================================================
   TIC TAC TOE
============================================================ */
.ttt {
    display: grid;
    gap: 5px;
    justify-content: center;
    margin: 12px auto;
}

.ttt button {
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #11151b;
    color: white;
    font-weight: 900;
    transition: 0.15s;
    aspect-ratio: 1;
}

.ttt button:hover:not(:disabled) {
    background: #222831;
}

.ttt button:disabled {
    opacity: 0.5;
}

/* ============================================================
   REACTION TIME
============================================================ */
.reaction-area {
    text-align: center;
    padding: 15px;
}

.reaction-box {
    width: 180px;
    height: 180px;
    margin: 12px auto;
    border-radius: 20px;
    border: 3px solid var(--border);
    display: grid;
    place-items: center;
    font-size: 22px;
    font-weight: 700;
    transition: 0.2s;
    cursor: pointer;
    background: #1a1f26;
    color: var(--muted);
    user-select: none;
}

.reaction-box.waiting {
    background: #1a1f26;
    color: var(--muted);
}

.reaction-box.ready {
    background: #1a3a2a;
    border-color: #2a6a4a;
    color: #7affb0;
}

.reaction-box.go {
    background: #3a1a1a;
    border-color: #6a2a2a;
    color: #ff7a7a;
}

.reaction-box.done {
    background: #2a2a4a;
    border-color: #4a4a7a;
    color: #aaaaff;
}

/* ============================================================
   TYPE SENTENCE
============================================================ */
.type-area {
    text-align: center;
    padding: 12px;
}

.type-sentence {
    font-size: 22px;
    font-weight: 700;
    color: white;
    padding: 16px;
    background: #1a1f26;
    border-radius: 12px;
    border: 1px solid var(--border);
    margin: 10px auto;
    max-width: 600px;
    word-break: break-word;
}

.type-input {
    width: 100%;
    max-width: 500px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #101419;
    color: white;
    font-size: 18px;
    text-align: center;
}

.type-input:focus {
    outline: 2px solid var(--accent);
}

.type-stats {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 10px 0;
    color: #9da5b0;
    font-size: 13px;
}

.type-stats strong {
    color: white;
}

/* ============================================================
   BOSS BATTLE
============================================================ */
.boss-area {
    text-align: center;
    padding: 8px;
}

.boss-health-bar {
    width: 100%;
    max-width: 500px;
    height: 28px;
    margin: 10px auto;
    background: #1a1a1a;
    border-radius: 14px;
    border: 2px solid #333;
    overflow: hidden;
    position: relative;
}

.boss-health-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff3333, #ff6a33);
    border-radius: 14px;
    transition: width 0.3s ease;
    width: 100%;
}

.boss-health-text {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 13px;
    color: white;
    text-shadow: 0 0 10px rgba(0,0,0,0.8);
}

.boss-stats {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
    margin: 8px 0;
    color: #9da5b0;
    font-size: 13px;
}

.boss-stats strong {
    color: white;
}

.boss-upgrades {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin: 8px 0;
}

.boss-upgrade-btn {
    padding: 6px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #1a1f26;
    color: white;
    font-size: 12px;
    transition: 0.15s;
}

.boss-upgrade-btn:hover:not(:disabled) {
    background: #2a303a;
    transform: scale(1.05);
}

.boss-upgrade-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
}

.boss-upgrade-btn .cost {
    color: #ffcc44;
    font-weight: 700;
}

.boss-damage-display {
    font-size: 28px;
    font-weight: 900;
    color: #ff6a33;
    margin: 4px 0;
}

.boss-monster-name {
    font-size: 24px;
    font-weight: 900;
    color: #ff4466;
    text-shadow: 0 0 20px rgba(255,68,102,0.3);
}

/* ============================================================
   COMPOSER
============================================================ */
.composer {
    padding: 10px 16px 14px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
}

.composer-box {
    max-width: 1100px;
    margin: auto;
    display: flex;
    align-items: flex-end;
    gap: 6px;
    padding: 6px 8px 6px 12px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 14px;
}

.composer-box textarea {
    flex: 1;
    min-height: 38px;
    max-height: 120px;
    resize: none;
    border: 0;
    outline: none;
    background: transparent;
    color: white;
    padding: 8px 4px;
    font-size: 14px;
    line-height: 1.4;
}

.composer-actions {
    display: flex;
    gap: 4px;
    align-items: center;
}

.composer-btn {
    width: 36px;
    height: 36px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: #adb5c0;
    font-size: 18px;
    display: grid;
    place-items: center;
    transition: 0.15s;
}

.composer-btn:hover {
    background: var(--panel3);
    color: white;
}

.send-btn {
    height: 36px;
    border: 0;
    border-radius: 9px;
    padding: 0 16px;
    background: var(--accent);
    color: #111;
    font-weight: 700;
    font-size: 14px;
    transition: 0.15s;
}

.send-btn:hover:not(:disabled) {
    filter: brightness(1.1);
}

.send-btn:disabled {
    opacity: 0.5;
}

/* ============================================================
   OVERLAYS
============================================================ */
.overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    backdrop-filter: blur(4px);
}

.overlay.show {
    display: flex;
}

.panel {
    width: min(560px, calc(100vw - 20px));
    max-height: calc(100vh - 20px);
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}

.panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--panel);
    z-index: 1;
}

.panel-header h2 {
    margin: 0;
    font-size: 20px;
}

.panel-body {
    padding: 16px 18px;
}

/* ============================================================
   GAME CREATOR
============================================================ */
.game-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
}

.game-choice {
    min-height: 70px;
    padding: 12px;
    text-align: left;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: #151a20;
    color: white;
    font-size: 12px;
    transition: 0.15s;
}

.game-choice:hover {
    background: #20262e;
    transform: scale(1.02);
}

.game-choice strong {
    display: block;
    margin-bottom: 2px;
    font-size: 14px;
}

.game-choice span {
    color: #818b97;
    font-size: 11px;
}

.game-choice .game-players {
    display: inline-block;
    background: #1a1f26;
    padding: 1px 8px;
    border-radius: 10px;
    color: #aab2bd;
    font-size: 10px;
    margin-top: 3px;
}

/* ============================================================
   SETTINGS
============================================================ */
.category {
    margin-bottom: 10px;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    background: var(--panel2);
}

.category-title {
    width: 100%;
    padding: 12px 14px;
    border: 0;
    background: transparent;
    color: var(--text);
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    text-align: left;
    font-size: 14px;
}

.category-body {
    display: none;
    padding: 0 14px 14px;
}

.category.open .category-body {
    display: block;
}

.setting {
    margin-top: 12px;
}

.setting label {
    display: block;
    margin-bottom: 5px;
    color: #aab2bd;
    font-size: 12px;
}

.setting input,
.setting select {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    background: #101419;
    color: white;
    font-size: 13px;
}

.setting input[type="range"] {
    padding: 0;
}

.setting-value {
    color: var(--muted);
    font-size: 11px;
    margin-top: 4px;
}

.save-btn {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    border: 0;
    border-radius: 9px;
    background: var(--accent);
    color: #111;
    font-weight: 700;
    font-size: 14px;
}

.danger-zone {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid #402529;
}

.danger-title {
    color: var(--danger);
    font-weight: 700;
    margin-bottom: 6px;
    font-size: 14px;
}

.danger-zone p {
    color: var(--muted);
    line-height: 1.5;
    font-size: 13px;
}

.danger-btn {
    width: 100%;
    padding: 10px;
    border-radius: 9px;
    border: 1px solid #743333;
    background: #241719;
    color: #ff8585;
    font-weight: 700;
}

/* ============================================================
   EMPTY STATE
============================================================ */
.empty {
    height: 100%;
    min-height: 200px;
    display: grid;
    place-items: center;
    color: #656d78;
    text-align: center;
}

.empty strong {
    display: block;
    color: #aab2bd;
    margin-bottom: 4px;
    font-size: 18px;
}

/* ============================================================
   RESPONSIVE
============================================================ */
@media (max-width: 600px) {
    .header {
        padding: 0 10px;
        height: 54px;
        min-height: 54px;
    }
    .logo span {
        font-size: 15px;
    }
    .channel {
        display: none;
    }
    .messages {
        padding: 12px 10px;
    }
    .message-content {
        max-width: calc(100vw - 70px);
    }
    .game-grid {
        grid-template-columns: 1fr;
    }
    .ttt button {
        font-size: 20px;
    }
    .reaction-box {
        width: 140px;
        height: 140px;
        font-size: 18px;
    }
    .boss-monster-name {
        font-size: 20px;
    }
    .type-sentence {
        font-size: 18px;
        padding: 12px;
    }
    .notification {
        top: 10px;
        right: 10px;
        left: 10px;
        max-width: none;
    }
    .game-header {
        padding: 10px 14px;
    }
    .game-title {
        font-size: 15px;
    }
    .game-body {
        padding: 12px 14px;
    }
}

@media (max-width: 400px) {
    .ttt button {
        font-size: 16px;
    }
    .header-actions .icon-btn {
        width: 34px;
        height: 34px;
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- ============================================================
HEADER
============================================================ -->
<header class="header">
    <div class="logo">
        <div class="logo-icon">💬</div>
        <span>Chat</span>
        <span class="channel"># general</span>
    </div>
    <div class="header-actions">
        <button class="icon-btn" id="gamesBtn" title="Games">🎮</button>
        <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
    </div>
</header>

<!-- ============================================================
MESSAGES
============================================================ -->
<main class="messages" id="messages"></main>

<!-- ============================================================
COMPOSER
============================================================ -->
<div class="composer">
    <div class="composer-box">
        <textarea id="messageInput" rows="1" placeholder="Message #general"></textarea>
        <div class="composer-actions">
            <button class="composer-btn" id="imageBtn" title="Attach image">🖼</button>

<!-- ============================================================
NOTIFICATION CONTAINER
============================================================ -->
<div id="notificationContainer"></div>

<script>

/* ============================================================
   CONFIG
============================================================ */
const API_URL = "/api/messages";
const CHANNEL = "general";
const GAME_PREFIX = "__CHAT_GAME_STATE__:";

/* ============================================================
   DEVICE ID
============================================================ */
let deviceId = localStorage.getItem("chat_device_id");
if (!deviceId) {
    deviceId = (window.crypto && crypto.randomUUID) 
        ? crypto.randomUUID() 
        : Date.now().toString(36) + Math.random().toString(36).slice(2);
    localStorage.setItem("chat_device_id", deviceId);
}

/* ============================================================
   SETTINGS
============================================================ */
const defaults = {
    username: "",
    refreshRate: 500,
    showTimestamps: true,
    notifications: true,
    textSize: 16,
    wordSpacing: 0,
    lineSpacing: 1.45,
    cornerRadius: 12,
    uiScale: 1,
    theme: "dark",
    enterToSend: true,
    autoScroll: true
};

function getSetting(key) {
    const value = localStorage.getItem("chat_" + key);
    if (value === null) return defaults[key];
    if (value === "true" || value === "false") return value === "true";
    const num = Number(value);
    return isNaN(num) ? value : num;
}

let settings = {};
Object.keys(defaults).forEach(key => settings[key] = getSetting(key));

/* ============================================================
   ELEMENTS
============================================================ */
const messagesEl = document.getElementById("messages");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const imageBtn = document.getElementById("imageBtn");
const gamesBtn = document.getElementById("gamesBtn");
const gamesOverlay = document.getElementById("gamesOverlay");
const closeGames = document.getElementById("closeGames");
const settingsBtn = document.getElementById("settingsBtn");
const settingsOverlay = document.getElementById("settingsOverlay");
const closeSettings = document.getElementById("closeSettings");
const saveSettings = document.getElementById("saveSettings");
const usernameInput = document.getElementById("usernameInput");
const deviceIdInput = document.getElementById("deviceIdInput");
const refreshRate = document.getElementById("refreshRate");
const showTimestamps = document.getElementById("showTimestamps");
const notifications = document.getElementById("notifications");
const themeSelect = document.getElementById("themeSelect");
const textSize = document.getElementById("textSize");
const wordSpacing = document.getElementById("wordSpacing");
const lineSpacing = document.getElementById("lineSpacing");
const cornerRadius = document.getElementById("cornerRadius");
const uiScale = document.getElementById("uiScale");
const enterToSend = document.getElementById("enterToSend");
const autoScroll = document.getElementById("autoScroll");
const textSizeValue = document.getElementById("textSizeValue");
const wordSpacingValue = document.getElementById("wordSpacingValue");
const lineSpacingValue = document.getElementById("lineSpacingValue");
const cornerRadiusValue = document.getElementById("cornerRadiusValue");
const uiScaleValue = document.getElementById("uiScaleValue");
const confirmOverlay = document.getElementById("confirmOverlay");
const confirmTitle = document.getElementById("confirmTitle");
const confirmText = document.getElementById("confirmText");
const confirmCancel = document.getElementById("confirmCancel");
const confirmYes = document.getElementById("confirmYes");
const removeEverything = document.getElementById("removeEverything");
const notificationContainer = document.getElementById("notificationContainer");

/* ============================================================
   STATE
============================================================ */
let currentMessages = [];
let games = [];
let refreshTimer = null;
let syncing = false;
let confirmCallback = null;
let renderedElements = new Map();
let seenMessageIds = new Set();
let seenGameIds = new Set();
let pendingImage = null;

/* ============================================================
   GAME TYPES
============================================================ */
const GAME_TYPES = {
    ttt3: { name: "Tic-Tac-Toe 3x3", icon: "⭕", min: 2, max: 2, desc: "Classic 3x3, get 3 in a row", size: 3 },
    ttt4: { name: "Tic-Tac-Toe 4x4", icon: "⭕", min: 2, max: 2, desc: "4x4 grid, get 4 in a row", size: 4 },
    ttt5: { name: "Tic-Tac-Toe 5x5", icon: "⭕", min: 2, max: 2, desc: "5x5 grid, get 5 in a row", size: 5 },
    ttt6: { name: "Tic-Tac-Toe 6x6", icon: "⭕", min: 2, max: 2, desc: "6x6 grid, get 6 in a row", size: 6 },
    reaction: { name: "Reaction Time", icon: "⚡", min: 2, max: 6, desc: "Fastest click wins" },
    type: { name: "Type Sentence", icon: "⌨️", min: 2, max: 6, desc: "Type the sentence fast" },
    boss: { name: "Boss Battle", icon: "👹", min: 2, max: 6, desc: "Defeat the boss together!" }
};

/* ============================================================
   SETTINGS UI
============================================================ */
function loadSettingsUI() {
    usernameInput.value = settings.username;
    deviceIdInput.value = deviceId;
    refreshRate.value = settings.refreshRate;
    showTimestamps.value = String(settings.showTimestamps);
    notifications.value = String(settings.notifications);
    themeSelect.value = settings.theme;
    textSize.value = settings.textSize;
    wordSpacing.value = settings.wordSpacing;
    lineSpacing.value = settings.lineSpacing;
    cornerRadius.value = settings.cornerRadius;
    uiScale.value = settings.uiScale;
    enterToSend.value = String(settings.enterToSend);
    autoScroll.value = String(settings.autoScroll);
    updateRangeLabels();
}

function updateRangeLabels() {
    textSizeValue.textContent = textSize.value + "px";
    wordSpacingValue.textContent = wordSpacing.value + "px";
    lineSpacingValue.textContent = lineSpacing.value;
    cornerRadiusValue.textContent = cornerRadius.value + "px";
    uiScaleValue.textContent = Math.round(Number(uiScale.value) * 100) + "%";
}

function applySettings() {
    document.documentElement.style.setProperty("--text-size", settings.textSize + "px");
    document.documentElement.style.setProperty("--word-spacing", settings.wordSpacing + "px");
    document.documentElement.style.setProperty("--line-spacing", settings.lineSpacing);
    document.documentElement.style.setProperty("--radius", settings.cornerRadius + "px");
    document.documentElement.style.setProperty("--ui-scale", settings.uiScale);
    applyTheme(settings.theme);
    renderedElements.clear();
    seenMessageIds.clear();
    seenGameIds.clear();
    renderMessages();
    restartRefresh();
}

function applyTheme(name) {
    const themes = {
        dark: ["#0b0d10", "#111419"],
        midnight: ["#080b14", "#101522"],
        slate: ["#101418", "#171d22"],
        black: ["#000", "#090909"],
        blue: ["#091018", "#101c29"],
        purple: ["#100b17", "#191021"],
        green: ["#09120d", "#101b15"],
        red: ["#140b0b", "#1e1111"],
        gray: ["#151515", "#202020"],
        light: ["#eeeeee", "#ffffff"],
        oled: ["#000", "#000"]
    };
    const t = themes[name] || themes.dark;
    document.documentElement.style.setProperty("--bg", t[0]);
    document.documentElement.style.setProperty("--panel", t[1]);
    document.body.style.background = t[0];
}

/* ============================================================
   SETTINGS EVENTS
============================================================ */
settingsBtn.onclick = () => { loadSettingsUI(); settingsOverlay.classList.add("show"); };
closeSettings.onclick = () => settingsOverlay.classList.remove("show");
gamesBtn.onclick = () => gamesOverlay.classList.add("show");
closeGames.onclick = () => gamesOverlay.classList.remove("show");

saveSettings.onclick = () => {
    settings.username = usernameInput.value.trim().substring(0, 24);
    settings.refreshRate = Number(refreshRate.value);
    settings.showTimestamps = showTimestamps.value === "true";
    settings.notifications = notifications.value === "true";
    settings.theme = themeSelect.value;
    settings.textSize = Number(textSize.value);
    settings.wordSpacing = Number(wordSpacing.value);
    settings.lineSpacing = Number(lineSpacing.value);
    settings.cornerRadius = Number(cornerRadius.value);
    settings.uiScale = Number(uiScale.value);
    settings.enterToSend = enterToSend.value === "true";
    settings.autoScroll = autoScroll.value === "true";
    Object.keys(settings).forEach(key => localStorage.setItem("chat_" + key, settings[key]));
    applySettings();
    settingsOverlay.classList.remove("show");
};

document.querySelectorAll(".category-title").forEach(btn => {
    btn.onclick = () => btn.parentElement.classList.toggle("open");
});

[textSize, wordSpacing, lineSpacing, cornerRadius, uiScale].forEach(input => {
    input.addEventListener("input", updateRangeLabels);
});

/* ============================================================
   IMAGE PICKER
============================================================ */
imageBtn.onclick = () => {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.onchange = async () => {
        const file = input.files[0];
        if (!file) return;
        try {
            const img = await resizeImage(file, 1500, 1500);
            pendingImage = img;
            messageInput.value = "[Image attached]";
            messageInput.style.color = "#7affb0";
            showNotification("📷 Image attached", "Click send to upload");
        } catch (e) {
            showNotification("❌ Error", "Failed to process image");
        }
    };
    input.click();
};

function resizeImage(file, maxWidth, maxHeight) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                let w = img.width, h = img.height;
                if (w > maxWidth) { h = h * maxWidth / w; w = maxWidth; }
                if (h > maxHeight) { w = w * maxHeight / h; h = maxHeight; }
                const canvas = document.createElement("canvas");
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL("image/jpeg", 0.8));
            };
            img.onerror = reject;
            img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

/* ============================================================
   CHAT SEND
============================================================ */
sendBtn.onclick = sendChatMessage;
messageInput.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && settings.enterToSend) {
        e.preventDefault();
        sendChatMessage();
    }
});
messageInput.addEventListener("input", () => {
    messageInput.style.height = "auto";
    messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + "px";
    if (pendingImage && !messageInput.value.trim()) {
        pendingImage = null;
        messageInput.style.color = "";
    }
});

async function sendChatMessage() {
    const text = messageInput.value.trim();
    const image = pendingImage;
    
    if (!text && !image) return;
    if (!settings.username) {
        settingsBtn.click();
        alert("Set your name in Settings first.");
        return;
    }

    sendBtn.disabled = true;
    try {
        await apiPost({
            username: settings.username,
            channel: CHANNEL,
            message: text || "",
            image: image || null,
            device_id: deviceId
        });
        messageInput.value = "";
        messageInput.style.height = "auto";
        messageInput.style.color = "";
        pendingImage = null;
        await loadMessages();
    } catch (error) {
        alert("Failed to send:\n\n" + error.message);
    } finally {
        sendBtn.disabled = false;
    }
}

/* ============================================================
   API
============================================================ */
async function apiPost(body) {
    const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
    });
    const data = await safeJson(res);
    if (!res.ok) throw new Error(data.error || "Request failed.");
    return data;
}

async function apiDelete(body) {
    const res = await fetch(API_URL, {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
    });
    const data = await safeJson(res);
    if (!res.ok) throw new Error(data.error || "Delete failed.");
    return data;
}

async function safeJson(res) {
    const text = await res.text();
    if (!text) return {};
    try { return JSON.parse(text); } 
    catch { return { error: text }; }
}

/* ============================================================
   LOAD MESSAGES
============================================================ */
async function loadMessages() {
    if (syncing) return;
    syncing = true;
    try {
        const res = await fetch(API_URL + "?channel=" + encodeURIComponent(CHANNEL) + "&_=" + Date.now(), { cache: "no-store" });
        const data = await safeJson(res);
        if (!res.ok) throw new Error(data.error || "Failed to load messages.");
        
        const newMessages = Array.isArray(data.messages) ? data.messages : [];
        const changed = messagesChanged(currentMessages, newMessages);
        
        if (changed) {
            // Check for new messages for notifications
            const oldIds = new Set(currentMessages.map(m => m.id));
            currentMessages = newMessages;
            processGameMessages();
            
            // Detect new messages for notifications
            if (settings.notifications) {
                for (const msg of newMessages) {
                    if (!oldIds.has(msg.id) && !isGameMessage(msg)) {
                        const name = msg.username || "Someone";
                        const content = msg.image ? "📷 sent an image" : msg.message?.substring(0, 50) || "sent a message";
                        showNotification("💬 " + name, content);
                    }
                }
            }
            
            renderMessages();
        }
    } catch (error) {
        if (!currentMessages.length) {
            messagesEl.innerHTML = `<div class="empty"><div><strong>Unable to load messages</strong>${escapeHtml(error.message)}</div></div>`;
        }
    } finally {
        syncing = false;
    }
}

function messagesChanged(old, new) {
    if (old.length !== new.length) return true;
    for (let i = 0; i < old.length; i++) {
        if (old[i].id !== new[i].id || old[i].message !== new[i].message || 
            old[i].username !== new[i].username || old[i].edited !== new[i].edited ||
            old[i].image !== new[i].image) return true;
    }
    return false;
}

/* ============================================================
   GAME MESSAGE PARSING
============================================================ */
function isGameMessage(msg) {
    return msg && typeof msg.message === "string" && msg.message.startsWith(GAME_PREFIX);
}

function parseGameMessage(msg) {
    if (!isGameMessage(msg)) return null;
    try { return JSON.parse(msg.message.substring(GAME_PREFIX.length)); } 
    catch { return null; }
}

function processGameMessages() {
    const map = new Map();
    for (const msg of currentMessages) {
        if (!isGameMessage(msg)) continue;
        const state = parseGameMessage(msg);
        if (!state || state.type !== "game") continue;
        map.set(state.id, {
            ...state,
            messageId: msg.id,
            hostDeviceId: state.hostDeviceId || msg.device_id || ""
        });
    }
    games = [...map.values()];
}

/* ============================================================
   RENDER MESSAGES
============================================================ */
function renderMessages() {
    const wasNearBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 100;
    
    const normal = currentMessages.filter(msg => !isGameMessage(msg));
    const activeGames = games.filter(g => g.status !== "finished" && g.status !== "forcequit");

    if (!normal.length && !activeGames.length) {
        messagesEl.innerHTML = `<div class="empty"><div><strong>No messages yet</strong>Be the first to send something.</div></div>`;
        renderedElements.clear();
        return;
    }

    const fragment = document.createDocumentFragment();
    const elementIds = [];

    for (const msg of normal) {
        const el = createMessageElement(msg);
        fragment.appendChild(el);
        elementIds.push("msg_" + msg.id);
    }

    for (const game of activeGames) {
        const el = createGameElement(game);
        fragment.appendChild(el);
        elementIds.push("game_" + game.id);
    }

    const currentChildren = messagesEl.children;
    const newChildren = Array.from(fragment.children);
    
    // Simple replace if structure changed
    if (currentChildren.length !== newChildren.length || 
        Array.from(currentChildren).some((el, i) => el.dataset?.id !== newChildren[i]?.dataset?.id)) {
        messagesEl.replaceChildren(fragment);
        renderedElements.clear();
        for (const el of newChildren) {
            if (el.dataset?.id) renderedElements.set(el.dataset.id, el);
        }
    } else {
        // Update in place
        for (let i = 0; i < newChildren.length; i++) {
            const newEl = newChildren[i];
            const oldEl = currentChildren[i];
            if (newEl.dataset?.id === oldEl.dataset?.id) {
                oldEl.replaceWith(newEl);
                if (newEl.dataset?.id) renderedElements.set(newEl.dataset.id, newEl);
            } else {
                oldEl.replaceWith(newEl);
                if (newEl.dataset?.id) renderedElements.set(newEl.dataset.id, newEl);
            }
        }
    }

    if (wasNearBottom && settings.autoScroll) {
        requestAnimationFrame(() => { messagesEl.scrollTop = messagesEl.scrollHeight; });
    }
}

/* ============================================================
   CREATE MESSAGE ELEMENT
============================================================ */
function createMessageElement(msg) {
    const item = document.createElement("div");
    item.className = "message";
    item.dataset.id = "msg_" + msg.id;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = (msg.username || "?").charAt(0).toUpperCase();

    const content = document.createElement("div");
    content.className = "message-content";

    const top = document.createElement("div");
    top.className = "message-top";

    const name = document.createElement("span");
    name.className = "username";
    name.textContent = msg.username || "User";
    top.appendChild(name);

    if (settings.showTimestamps && msg.created_at) {
        const time = document.createElement("span");
        time.className = "time";
        time.textContent = formatTime(msg.created_at);
        top.appendChild(time);
    }

    if (msg.edited) {
        const edited = document.createElement("span");
        edited.className = "edited";
        edited.textContent = "(edited)";
        top.appendChild(edited);
    }

    content.appendChild(top);

    if (msg.message) {
        const text = document.createElement("div");
        text.className = "message-text";
        text.textContent = msg.message;
        content.appendChild(text);
    }

    if (msg.image) {
        const img = document.createElement("img");
        img.className = "message-image";
        img.src = msg.image;
        img.loading = "lazy";
        img.alt = "Image";
        img.onclick = () => window.open(msg.image, "_blank");
        content.appendChild(img);
    }

    item.appendChild(avatar);
    item.appendChild(content);
    return item;
}

   GAME CREATION
============================================================ */
document.querySelectorAll(".game-choice").forEach(btn => {
    btn.onclick = () => createGame(btn.dataset.game);
});

async function createGame(gameType) {
    if (!settings.username) {
        settingsBtn.click();
        alert("Set your name before creating a game.");
        return;
    }

    const existing = games.find(g => g.hostDeviceId === deviceId && g.status !== "finished" && g.status !== "forcequit");
    if (existing) {
        alert("You are already hosting a game.");
        gamesOverlay.classList.remove("show");
        return;
    }

    const info = GAME_TYPES[gameType];
    if (!info) return;

    const game = {
        type: "game",
        id: "game_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8),
        gameType: gameType,
        name: info.name,
        icon: info.icon,
        host: settings.username,
        hostDeviceId: deviceId,
        status: "lobby",
        players: [{ deviceId, username: settings.username }],
        maxPlayers: info.max,
        turnIndex: 0,
        createdAt: Date.now(),
        board: [],
        winner: null,
        data: { size: info.size || 0 }
    };

    try {
        await writeGameState(game);
        gamesOverlay.classList.remove("show");
        await loadMessages();
    } catch (error) {
        alert("Could not create game:\n\n" + error.message);
    }
}

async function writeGameState(game) {
    const payload = GAME_PREFIX + JSON.stringify(game);
    await apiPost({
        username: "__GAME__",
        channel: CHANNEL,
        message: payload,
        image: null,
        device_id: game.hostDeviceId
    });
}

/* ============================================================
   CREATE GAME ELEMENT

function createGameElement(game) {

    card.className = "game-card";

    header.className = "game-header";
    const title = document.createElement("div");
    title.className = "game-title";
    title.textContent = game.icon + " " + game.name;
    const status = document.createElement("div");
    status.className = "game-status" + (game.status === "playing" ? " playing" : "");
    status.textContent = game.status === "lobby" ? "WAITING" : "PLAYING";
    header.appendChild(title);
    header.appendChild(status);

    // Body
    const body = document.createElement("div");
    body.className = "game-body";

    // Info
    const info = document.createElement("div");
    info.className = "game-info";
    info.innerHTML = `
        <div class="game-pill">Host: <strong>${escapeHtml(game.host)}</strong></div>
        <div class="game-pill">Players: <strong>${game.players.length}/${game.maxPlayers}</strong></div>
    `;
    body.appendChild(info);

    // Description
    const desc = document.createElement("div");
    desc.className = "game-description";
    desc.textContent = game.status === "lobby" 
        ? "Join before the host starts. Everyone else can spectate."
        : getGameDescription(game);
    body.appendChild(desc);

    // Players
    const players = document.createElement("div");
    players.className = "players-list";
    game.players.forEach(p => {
        const chip = document.createElement("div");
        chip.className = "player-chip" + (p.deviceId === game.hostDeviceId ? " host" : "");
        chip.textContent = p.username + (p.deviceId === game.hostDeviceId ? " 👑" : "");
        players.appendChild(chip);
    });
    body.appendChild(players);

    // Turn
    if (game.status === "playing") {
        const turn = document.createElement("div");
        turn.className = "turn-banner";
        const current = game.players[game.turnIndex % Math.max(game.players.length, 1)];
        if (current) turn.innerHTML = "Current turn: <strong>" + escapeHtml(current.username) + "</strong>";
        body.appendChild(turn);
    }

    // Board
    const board = createGameBoard(game);
    if (board) body.appendChild(board);

    // Actions
    const actions = document.createElement("div");
    actions.className = "game-actions";

    if (game.status === "lobby") {
        const joined = game.players.some(p => p.deviceId === deviceId);
        if (!joined && game.players.length < game.maxPlayers) {
            const join = document.createElement("button");
            join.className = "game-btn green";
            join.textContent = "Join game";
            join.onclick = async () => await joinGame(game);
            actions.appendChild(join);
        } else if (joined) {
            const leave = document.createElement("button");
            leave.className = "game-btn";
            leave.textContent = "Leave";
            leave.onclick = async () => await leaveGame(game);
            actions.appendChild(leave);
        }
        if (game.hostDeviceId === deviceId) {
            const start = document.createElement("button");
            start.className = "game-btn primary";
            start.textContent = "Start game";
            start.disabled = game.players.length < GAME_TYPES[game.gameType].min;
            start.onclick = async () => await startGame(game);
            actions.appendChild(start);
            const quit = document.createElement("button");
            quit.className = "game-btn danger";
            quit.textContent = "Force quit";
            quit.onclick = () => openConfirm("Force quit game?", "Everyone will be removed.", () => forceQuitGame(game));
            actions.appendChild(quit);
        }
    } else if (game.status === "playing") {
        const mine = game.players.some(p => p.deviceId === deviceId);
        if (mine) {
            const leave = document.createElement("button");
            leave.className = "game-btn";
            leave.textContent = "Leave game";
            leave.onclick = async () => await leaveGame(game);
            actions.appendChild(leave);
        }
        if (game.hostDeviceId === deviceId) {
            const quit = document.createElement("button");
            quit.className = "game-btn danger";
            quit.textContent = "Force quit";
            quit.onclick = () => openConfirm("Force quit game?", "Everyone will be removed.", () => forceQuitGame(game));
            actions.appendChild(quit);
        }
    }

    body.appendChild(actions);
    card.appendChild(header);
    card.appendChild(body);
    wrapper.appendChild(card);
    return wrapper;
}

function getGameDescription(game) {

        ttt3: "Classic 3x3 Tic-Tac-Toe. Get 3 in a row to win!",
        ttt4: "4x4 Tic-Tac-Toe. Get 4 in a row to win!",

/* ============================================================
   GAME BOARD
============================================================ */
function createGameBoard(game) {
    if (game.status !== "playing") return null;
    const boards = {
        ttt3: createTTT,
        ttt4: createTTT,
        ttt5: createTTT,
        ttt6: createTTT,
        reaction: createReaction,
        type: createTypeSentence,
        boss: createBossBattle
    };
    return boards[game.gameType] ? boards[game.gameType](game) : null;
}

/* ============================================================
   TIC TAC TOE (3x3, 4x4, 5x5, 6x6)
============================================================ */
function createTTT(game) {
    const size = game.data.size || 3;
    const total = size * size;
    if (!game.data.board || game.data.board.length !== total) {
        game.data.board = Array(total).fill("");
    }

    const board = document.createElement("div");
    board.className = "ttt";
    const btnSize = size <= 3 ? 80 : size <= 4 ? 70 : size <= 5 ? 60 : 50;
    board.style.gridTemplateColumns = `repeat(${size}, ${btnSize}px)`;
    board.style.gridTemplateRows = `repeat(${size}, ${btnSize}px)`;

    const mine = game.players.some(p => p.deviceId === deviceId);
    const current = game.players[game.turnIndex % game.players.length];
    const myTurn = mine && current && current.deviceId === deviceId;

    for (let i = 0; i < total; i++) {
        const btn = document.createElement("button");
        btn.textContent = game.data.board[i] || "";
        btn.style.fontSize = size <= 3 ? "32px" : size <= 4 ? "28px" : size <= 5 ? "24px" : "20px";
        btn.disabled = !myTurn || !!game.data.board[i] || !!game.winner;
        btn.onclick = async () => {
            const copy = JSON.parse(JSON.stringify(game));
            const symbol = copy.turnIndex % 2 === 0 ? "X" : "O";
            copy.data.board[i] = symbol;
            if (checkTTTWin(copy.data.board, size, i, symbol)) {
                copy.winner = current.username;
                copy.status = "finished";
            } else if (copy.data.board.every(c => c)) {
                copy.winner = "draw";
                copy.status = "finished";
            } else {
                copy.turnIndex++;
            }
            await publishGameAndCleanup(game, copy);
        };
        board.appendChild(btn);
    }
    return board;
}

function checkTTTWin(board, size, pos, symbol) {
    const row = Math.floor(pos / size);
    const col = pos % size;
    const dirs = [[1,0],[0,1],[1,1],[1,-1]];
    for (const [dr, dc] of dirs) {
        let count = 1;
        for (const dir of [-1, 1]) {
            let r = row + dr * dir, c = col + dc * dir;
            while (r >= 0 && r < size && c >= 0 && c < size && board[r * size + c] === symbol) {
                count++;
                r += dr * dir;
                c += dc * dir;
            }
        }
        if (count >= size) return true;
    }
    return false;
}

/* ============================================================
   REACTION TIME
============================================================ */
function createReaction(game) {
    const area = document.createElement("div");
    area.className = "reaction-area";

    const mine = game.players.some(p => p.deviceId === deviceId);
    const current = game.players[game.turnIndex % game.players.length];
    const myTurn = mine && current && current.deviceId === deviceId;
    const state = game.data.state || "waiting";

    const box = document.createElement("div");
    box.className = "reaction-box " + state;

    if (state === "waiting") {
        box.textContent = "⏳ Waiting for " + (myTurn ? "you" : current.username);
        if (myTurn) {
            box.onclick = async () => {
                const copy = JSON.parse(JSON.stringify(game));
                copy.data.state = "ready";
                copy.data.startTime = Date.now() + 1000 + Math.random() * 3000;
                await publishGameAndCleanup(game, copy);
            };
        }
    } else if (state === "ready") {
        const remaining = Math.max(0, (game.data.startTime - Date.now()) / 1000);
        box.textContent = "🟢 Get ready... " + remaining.toFixed(1) + "s";
        if (remaining < 0.5 && myTurn) {
            setTimeout(async () => {
                const copy = JSON.parse(JSON.stringify(game));
                copy.data.state = "go";
                copy.data.goTime = Date.now();
                await publishGameAndCleanup(game, copy);
            }, Math.max(0, game.data.startTime - Date.now() + 100));
        }
    } else if (state === "go") {
        box.textContent = "🟢 CLICK NOW!";
        box.style.cursor = "pointer";
        if (myTurn) {
            box.onclick = async () => {
                const time = Date.now() - game.data.goTime;
                const copy = JSON.parse(JSON.stringify(game));
                copy.data.results = copy.data.results || {};
                copy.data.results[deviceId] = time;
                copy.turnIndex++;
                if (copy.turnIndex >= copy.players.length) {
                    let winner = null, best = Infinity;
                    for (const [id, t] of Object.entries(copy.data.results)) {
                        if (t < best) { best = t; winner = copy.players.find(p => p.deviceId === id)?.username; }
                    }
                    copy.winner = winner + " (" + best + "ms)";
                    copy.status = "finished";
                } else {
                    copy.data.state = "waiting";
                }
                await publishGameAndCleanup(game, copy);
            };
        } else {
            box.textContent = "🟢 Waiting for " + current.username;
        }
    }

    area.appendChild(box);

    // Results
    if (Object.keys(game.data.results || {}).length > 0) {
        const div = document.createElement("div");
        div.style.cssText = "color:#9da5b0;margin-top:10px;font-size:13px;";
        const sorted = Object.entries(game.data.results).sort((a,b) => a[1] - b[1]);
        div.innerHTML = sorted.map(([id, time]) => {
            const name = game.players.find(p => p.deviceId === id)?.username || "Unknown";
            return `<div>${escapeHtml(name)}: ${time}ms</div>`;
        }).join("");
        area.appendChild(div);
    }

    return area;
}

/* ============================================================
   TYPE SENTENCE
============================================================ */
function createTypeSentence(game) {
    const area = document.createElement("div");
    area.className = "type-area";

    const sentences = [
        "The quick brown fox jumps over the lazy dog.",
        "Pack my box with five dozen liquor jugs.",
        "How vexingly quick daft zebras jump.",
        "The five boxing wizards jump quickly.",
        "Jazz and swing fans like fast music.",
        "Crazy Fredericka bought many very exquisite opal jewels.",
        "We promptly judged antique ivory buckles for the next prize."
    ];

    const mine = game.players.some(p => p.deviceId === deviceId);
    const current = game.players[game.turnIndex % game.players.length];
    const myTurn = mine && current && current.deviceId === deviceId;

    if (!game.data.sentence) {
        game.data.sentence = sentences[Math.floor(Math.random() * sentences.length)];
        game.data.startTime = 0;
        game.data.results = {};
        game.data.done = false;
    }

    const sentDisplay = document.createElement("div");
    sentDisplay.className = "type-sentence";
    sentDisplay.textContent = game.data.sentence;
    area.appendChild(sentDisplay);

    if (game.winner) {
        const win = document.createElement("div");
        win.className = "turn-banner";
        win.textContent = "🏆 Winner: " + game.winner;
        area.appendChild(win);
        return area;
    }

    if (!myTurn && !game.data.done) {
        const wait = document.createElement("div");
        wait.className = "turn-banner";
        wait.textContent = "Waiting for " + current.username + "...";
        area.appendChild(wait);
        return area;
    }

    if (game.data.done) {
        const done = document.createElement("div");
        done.className = "turn-banner";
        done.textContent = "All players finished!";
        area.appendChild(done);
        return area;
    }

    const input = document.createElement("input");
    input.className = "type-input";
    input.placeholder = "Type the sentence here...";
    input.autofocus = true;

    let started = false;
    input.oninput = async () => {
        if (!started && input.value.length > 0) {
            started = true;
            const copy = JSON.parse(JSON.stringify(game));
            copy.data.startTime = Date.now();
            await publishGameAndCleanup(game, copy);
        }
        if (input.value === game.data.sentence) {
            const time = Date.now() - game.data.startTime;
            const copy = JSON.parse(JSON.stringify(game));
            copy.data.results = copy.data.results || {};
            copy.data.results[deviceId] = time;
            copy.turnIndex++;
            if (copy.turnIndex >= copy.players.length) {
                copy.data.done = true;
                let winner = null, best = Infinity;
                for (const [id, t] of Object.entries(copy.data.results)) {
                    if (t < best) { best = t; winner = copy.players.find(p => p.deviceId === id)?.username; }
                }
                copy.winner = winner + " (" + (best/1000).toFixed(2) + "s)";
                copy.status = "finished";
            }
            await publishGameAndCleanup(game, copy);
        }
    };
    area.appendChild(input);

    const stats = document.createElement("div");
    stats.className = "type-stats";
    const completed = Object.keys(game.data.results || {}).length;
    stats.innerHTML = `
        <div>Completed: <strong>${completed}/${game.players.length}</strong></div>
        <div>Your time: <strong>${game.data.results?.[deviceId] ? (game.data.results[deviceId]/1000).toFixed(2) + 's' : '—'}</strong></div>
    `;
    area.appendChild(stats);

    return area;
}

/* ============================================================
   BOSS BATTLE
============================================================ */
function createBossBattle(game) {
    const area = document.createElement("div");
    area.className = "boss-area";

    const BOSS_MAX_HEALTH = 100000000;

    if (!game.data.bossHealth) {
        game.data.bossHealth = BOSS_MAX_HEALTH;
        game.data.maxHealth = BOSS_MAX_HEALTH;
        game.data.damage = 1;
        game.data.upgrades = {};
        game.data.totalDamageDealt = {};
        game.data.bossDefeated = false;
        game.data.critChance = 0;
        game.data.multiHit = 1;
    }

    const mine = game.players.some(p => p.deviceId === deviceId);
    const health = game.data.bossHealth;
    const maxHealth = game.data.maxHealth;
    const damage = game.data.damage || 1;

    // Monster name
    const name = document.createElement("div");
    name.className = "boss-monster-name";
    const names = ["Cthulhu", "Mega Dragon", "Shadow Lord", "Void Beast", "Eldritch Horror", "Demon King"];
    if (!game.data.monsterName) game.data.monsterName = names[Math.floor(Math.random() * names.length)];
    name.textContent = "👹 " + game.data.monsterName;
    area.appendChild(name);

    // Health bar
    const bar = document.createElement("div");
    bar.className = "boss-health-bar";
    const fill = document.createElement("div");
    fill.className = "boss-health-fill";
    fill.style.width = Math.max(0, (health / maxHealth) * 100) + "%";
    bar.appendChild(fill);
    const text = document.createElement("div");
    text.className = "boss-health-text";
    text.textContent = Math.floor(health).toLocaleString() + " / " + maxHealth.toLocaleString() + " HP";
    bar.appendChild(text);
    area.appendChild(bar);

    // Stats
    const stats = document.createElement("div");
    stats.className = "boss-stats";
    stats.innerHTML = `
        <div>⚔️ Damage: <strong>${damage.toLocaleString()}</strong></div>
        <div>💪 Your damage: <strong>${(game.data.totalDamageDealt?.[deviceId] || 0).toLocaleString()}</strong></div>
        <div>👥 Players: <strong>${game.players.length}</strong></div>
        <div>💥 Crit: <strong>${Math.round((game.data.critChance || 0) * 100)}%</strong></div>
        <div>🌀 Multi: <strong>${game.data.multiHit || 1}x</strong></div>
    `;
    area.appendChild(stats);

    if (game.data.bossDefeated) {
        const win = document.createElement("div");
        win.className = "turn-banner";
        win.style.cssText = "background:#1a3a2a;border-color:#2a6a4a;color:#7affb0;font-size:20px;padding:20px;";
        win.innerHTML = "🎉 BOSS DEFEATED! 🎉<br><span style='font-size:14px;color:#9da5b0;'>The " + game.data.monsterName + " has been slain!</span>";
        area.appendChild(win);
        return area;
    }

    // Attack button
    const attack = document.createElement("button");
    attack.className = "game-btn boss";
    let displayDmg = damage;
    if (Math.random() < (game.data.critChance || 0)) displayDmg = Math.floor(damage * 2);
    const totalDmg = displayDmg * (game.data.multiHit || 1);
    attack.textContent = "⚔️ ATTACK! (" + totalDmg.toLocaleString() + " dmg)";
    attack.onclick = async () => {
        const copy = JSON.parse(JSON.stringify(game));
        let dmg = copy.data.damage || 1;
        let crit = Math.random() < (copy.data.critChance || 0) ? 2 : 1;
        const multi = copy.data.multiHit || 1;
        const total = Math.floor(dmg * crit * multi);
        copy.data.bossHealth = Math.max(0, copy.data.bossHealth - total);
        copy.data.totalDamageDealt = copy.data.totalDamageDealt || {};
        copy.data.totalDamageDealt[deviceId] = (copy.data.totalDamageDealt[deviceId] || 0) + total;
        
        if (copy.data.bossHealth <= 0) {
            copy.data.bossDefeated = true;
            copy.data.bossHealth = 0;
            let mvp = null, maxDmg = -1;
            for (const [id, d] of Object.entries(copy.data.totalDamageDealt)) {
                if (d > maxDmg) { maxDmg = d; mvp = copy.players.find(p => p.deviceId === id)?.username; }
            }
            copy.winner = "🏆 MVP: " + (mvp || "Everyone!") + " 🏆";
            copy.status = "finished";
        }
        if (Math.random() < 0.2 && !copy.data.bossDefeated) {
            copy.data.upgrades = copy.data.upgrades || {};
            copy.data.upgrades[deviceId] = (copy.data.upgrades[deviceId] || 0) + 1;
        }
        await publishGameAndCleanup(game, copy);
    };
    area.appendChild(attack);

    // Damage display
    const dmgDisplay = document.createElement("div");
    dmgDisplay.className = "boss-damage-display";
    dmgDisplay.textContent = "⚔️ " + damage.toLocaleString() + " base damage";
    area.appendChild(dmgDisplay);

    // Upgrades
    const upgradesDiv = document.createElement("div");
    upgradesDiv.className = "boss-upgrades";
    const upgradePoints = game.data.upgrades?.[deviceId] || 0;
    
    const infoDiv = document.createElement("div");
    infoDiv.style.cssText = "width:100%;text-align:center;color:#9da5b0;font-size:12px;";
    infoDiv.textContent = "🔧 Upgrade points: " + upgradePoints;
    upgradesDiv.appendChild(infoDiv);

    const upgradeBtn = (label, cost, icon, action) => {
        const btn = document.createElement("button");
        btn.className = "boss-upgrade-btn";
        btn.innerHTML = `${icon} ${label} <span class="cost">(${cost} pts)</span>`;
        btn.disabled = upgradePoints < cost;
        btn.onclick = async () => {
            const copy = JSON.parse(JSON.stringify(game));
            copy.data.upgrades[deviceId] = (copy.data.upgrades[deviceId] || 0) - cost;
            action(copy);
            await publishGameAndCleanup(game, copy);
        };
        return btn;
    };

    upgradesDiv.appendChild(upgradeBtn("+20% Damage", 5, "⚔️", (c) => {
        c.data.damage = Math.floor((c.data.damage || 1) * 1.2);
    }));

    upgradesDiv.appendChild(upgradeBtn("+10% Crit", 10, "💥", (c) => {
        c.data.critChance = Math.min(1, (c.data.critChance || 0) + 0.1);
    }));

    upgradesDiv.appendChild(upgradeBtn("+1 Multi-hit", 20, "🌀", (c) => {
        c.data.multiHit = (c.data.multiHit || 1) + 1;
    }));

    area.appendChild(upgradesDiv);
    return area;
}

/* ============================================================
   GAME HELPERS
============================================================ */
async function joinGame(game) {
    if (game.status !== "lobby") return;
    if (game.players.some(p => p.deviceId === deviceId)) return;
    if (game.players.length >= game.maxPlayers) return;
    const copy = JSON.parse(JSON.stringify(game));
    copy.players.push({ deviceId, username: settings.username });
    await writeGameState(copy);
    await loadMessages();
}

async function leaveGame(game) {
    const copy = JSON.parse(JSON.stringify(game));
    copy.players = copy.players.filter(p => p.deviceId !== deviceId);
    if (copy.players.length === 0) {
        await removeGameMessages(game);
        await loadMessages();
        return;
    }
    if (game.hostDeviceId === deviceId) {
        const newHost = copy.players[0];
        copy.host = newHost.username;
        copy.hostDeviceId = newHost.deviceId;
    }
    if (copy.status === "playing" && copy.turnIndex >= copy.players.length) copy.turnIndex = 0;
    await writeGameState(copy);
    await deleteStateMessage(game);
    await loadMessages();
}

async function startGame(game) {
    if (game.hostDeviceId !== deviceId) return;
    if (game.players.length < GAME_TYPES[game.gameType].min) return;
    
    const copy = JSON.parse(JSON.stringify(game));
    copy.status = "playing";
    copy.turnIndex = 0;
    
    if (["ttt3","ttt4","ttt5","ttt6"].includes(copy.gameType)) {
        const size = GAME_TYPES[copy.gameType].size || 3;
        copy.data.size = size;
        copy.data.board = Array(size * size).fill("");
    }
    if (copy.gameType === "reaction") {
        copy.data.state = "waiting";
        copy.data.results = {};
    }
    if (copy.gameType === "type") {
        const sentences = [
            "The quick brown fox jumps over the lazy dog.",
            "Pack my box with five dozen liquor jugs.",
            "How vexingly quick daft zebras jump.",
            "The five boxing wizards jump quickly.",
            "Jazz and swing fans like fast music."
        ];
        copy.data.sentence = sentences[Math.floor(Math.random() * sentences.length)];
        copy.data.results = {};
        copy.data.done = false;
    }
    if (copy.gameType === "boss") {
        const maxHealth = 100000000;
        copy.data.bossHealth = maxHealth;
        copy.data.maxHealth = maxHealth;
        copy.data.damage = 1;
        copy.data.upgrades = {};
        copy.data.totalDamageDealt = {};
        copy.data.bossDefeated = false;
        copy.data.critChance = 0;
        copy.data.multiHit = 1;
        const names = ["Cthulhu", "Mega Dragon", "Shadow Lord", "Void Beast", "Eldritch Horror", "Demon King"];
        copy.data.monsterName = names[Math.floor(Math.random() * names.length)];
    }
    
    await publishGameAndCleanup(game, copy);
}

async function forceQuitGame(game) {
    if (game.hostDeviceId !== deviceId) return;
    try {
        await removeGameMessages(game);
        await loadMessages();
    } catch (e) {
        alert("Could not remove game:\n\n" + e.message);
    }
}

async function publishGameAndCleanup(oldGame, newGame) {
    if (newGame.status === "finished") {
        await removeGameMessages(oldGame);
        await loadMessages();
        return;
    }
    await writeGameState(newGame);
    if (oldGame.messageId) {
        try { await apiDelete({ id: oldGame.messageId, device_id: oldGame.hostDeviceId }); } 
        catch { /* ignore */ }
    }
    await loadMessages();
}

async function removeGameMessages(game) {
    const msgs = currentMessages.filter(msg => {
        if (!isGameMessage(msg)) return false;
        const state = parseGameMessage(msg);
        return state && state.id === game.id;
    });
    for (const msg of msgs) {
        try { await apiDelete({ id: msg.id, device_id: game.hostDeviceId }); } 
        catch { /* ignore */ }
    }
}

async function deleteStateMessage(game) {
    if (!game.messageId) return;
    try { await apiDelete({ id: game.messageId, device_id: game.hostDeviceId }); } 
    catch { /* ignore */ }
}

/* ============================================================
   REFRESH
============================================================ */
function restartRefresh() {
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(loadMessages, 500);
}

/* ============================================================
   NOTIFICATIONS
============================================================ */
function showNotification(title, body) {
    if (!settings.notifications) return;
    const container = document.getElementById("notificationContainer");
    const el = document.createElement("div");
    el.className = "notification";
    el.innerHTML = `
        <button class="notification-close">×</button>
        <div class="notification-title">${title}</div>
        <div class="notification-body">${body}</div>
    `;
    el.querySelector(".notification-close").onclick = () => el.remove();
    container.appendChild(el);
    setTimeout(() => { if (el.parentNode) el.remove(); }, 4000);
}

/* ============================================================
   CONFIRM
============================================================ */
function openConfirm(title, text, callback) {
    confirmTitle.textContent = title;
    confirmText.textContent = text;
    confirmCallback = callback;
    confirmOverlay.classList.add("show");
}

confirmCancel.onclick = () => { confirmOverlay.classList.remove("show"); confirmCallback = null; };
confirmYes.onclick = async () => {
    const cb = confirmCallback;
    confirmOverlay.classList.remove("show");
    confirmCallback = null;
    if (cb) try { await cb(); } catch (e) { alert(e.message); }
};

/* ============================================================
   REMOVE EVERYTHING
============================================================ */
removeEverything.onclick = () => {
    openConfirm("Remove everything?", "This permanently removes every message from the chat.", async () => {
        try {
            await apiDelete({ delete_all: true });
            currentMessages = [];
            games = [];
            renderedElements.clear();
            seenMessageIds.clear();
            seenGameIds.clear();
            renderMessages();
        } catch (e) {
            alert("Failed to wipe chat:\n\n" + e.message);
        }
    });
};

/* ============================================================
   HELPERS
============================================================ */
function formatTime(date) {
    if (!date) return "";
    return new Date(date).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function escapeHtml(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

/* ============================================================
   START
============================================================ */
loadSettingsUI();
applySettings();
loadMessages();
