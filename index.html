<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Game Chat</title>

<style>
*{
    box-sizing:border-box;
}

:root{
    --bg:#090b0f;
    --sidebar:#0d1015;
    --panel:#11151c;
    --panel2:#171c24;
    --panel3:#1c222c;
    --border:#252c37;
    --text:#f1f4f8;
    --muted:#7e8794;
    --muted2:#9da6b3;
    --accent:#e9edf2;
    --accentText:#111318;
    --green:#69e39a;
    --red:#ff6f78;
    --yellow:#e5c86b;
    --blue:#72a9ff;
    --radius:12px;
    --text-size:16px;
    --line-spacing:1.45;
    --word-spacing:0px;
    --ui-scale:1;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    font-size:calc(16px * var(--ui-scale));
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible{
    outline:2px solid var(--blue);
    outline-offset:2px;
}

/* =========================
   APP
========================= */

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:
        radial-gradient(
            circle at 80% -20%,
            #ffffff08,
            transparent 35%
        ),
        var(--bg);
}

/* =========================
   HEADER
========================= */

.header{
    height:62px;
    min-height:62px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(13,16,21,.92);
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(18px);
    z-index:10;
}

.logo{
    display:flex;
    align-items:center;
    gap:11px;
    min-width:0;
}

.logo-icon{
    width:36px;
    height:36px;
    display:grid;
    place-items:center;
    border-radius:11px;
    background:var(--panel2);
    border:1px solid var(--border);
    box-shadow:0 5px 20px #0004;
}

.logo-title{
    font-weight:800;
    white-space:nowrap;
}

.channel{
    color:var(--muted);
    font-weight:500;
}

.header-actions{
    display:flex;
    gap:7px;
}

.icon-btn{
    width:38px;
    height:38px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    transition:.15s;
}

.icon-btn:hover{
    background:var(--panel3);
    transform:translateY(-1px);
}

/* =========================
   MESSAGE AREA
========================= */

.messages{
    flex:1;
    overflow-y:auto;
    padding:22px max(18px,calc((100vw - 1050px)/2));
    scroll-behavior:auto;
}

.messages::-webkit-scrollbar,
.panel::-webkit-scrollbar{
    width:9px;
}

.messages::-webkit-scrollbar-thumb,
.panel::-webkit-scrollbar-thumb{
    background:#ffffff14;
    border-radius:20px;
}

.message{
    display:flex;
    gap:11px;
    margin-bottom:8px;
    animation:messageIn .16s ease;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(5px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.message-avatar{
    width:36px;
    height:36px;
    flex:0 0 36px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:var(--panel2);
    border:1px solid var(--border);
    color:#dce2ea;
    font-size:13px;
    font-weight:800;
}

.message-content{
    min-width:0;
    max-width:min(850px,calc(100vw - 100px));
}

.message-card{
    display:inline-block;
    max-width:100%;
    padding:9px 12px 10px;
    border-radius:11px;
    background:var(--panel2);
    border:1px solid #ffffff06;
    box-shadow:0 3px 14px #0002;
}

.message-top{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:3px;
}

.username{
    color:var(--text);
    font-weight:750;
}

.time,
.edited{
    color:var(--muted);
    font-size:10px;
}

.message-text{
    color:#d8dde5;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    font-size:var(--text-size);
    word-spacing:var(--word-spacing);
    line-height:var(--line-spacing);
}

.message-image{
    display:block;
    max-width:min(500px,100%);
    max-height:400px;
    margin-top:8px;
    border-radius:9px;
    border:1px solid var(--border);
}

/* =========================
   GAME CARDS
========================= */

.game-message{
    width:100%;
    max-width:900px;
    margin:15px auto;
    animation:gameIn .2s ease;
}

@keyframes gameIn{
    from{
        opacity:0;
        transform:translateY(8px) scale(.99);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.game-card{
    overflow:hidden;
    border:1px solid var(--border);
    border-radius:17px;
    background:
        linear-gradient(
            145deg,
            var(--panel2),
            var(--panel)
        );
    box-shadow:
        0 18px 50px #0005,
        inset 0 1px #ffffff08;
}

.game-header{
    padding:16px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    border-bottom:1px solid var(--border);
}

.game-title{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
    font-weight:800;
}

.game-title-icon{
    width:35px;
    height:35px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:var(--panel3);
}

.game-name{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.game-status{
    padding:5px 9px;
    border-radius:999px;
    background:#ffffff08;
    color:var(--muted2);
    font-size:11px;
    white-space:nowrap;
}

.game-body{
    padding:18px;
}

.game-info{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:14px;
}

.game-pill{
    padding:6px 9px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#ffffff04;
    color:var(--muted2);
    font-size:11px;
}

.game-pill strong{
    color:var(--text);
}

.game-description{
    color:var(--muted2);
    line-height:1.5;
    margin-bottom:14px;
}

.players-list{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin:12px 0;
}

.player-chip{
    padding:6px 9px;
    border-radius:8px;
    background:#ffffff05;
    border:1px solid var(--border);
    font-size:11px;
    color:#cbd1da;
}

.player-chip.host{
    color:var(--yellow);
    border-color:#806b2d;
    background:#806b2d0d;
}

.turn-banner{
    padding:10px 12px;
    border-radius:10px;
    background:#ffffff05;
    border:1px solid var(--border);
    color:var(--muted2);
    margin:11px 0;
}

.turn-banner strong{
    color:white;
}

.game-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.game-btn{
    border:1px solid var(--border);
    border-radius:9px;
    padding:9px 13px;
    background:var(--panel3);
    color:white;
    font-weight:700;
    transition:.15s;
}

.game-btn:hover:not(:disabled){
    filter:brightness(1.15);
    transform:translateY(-1px);
}

.game-btn.primary{
    background:var(--accent);
    color:var(--accentText);
    border-color:transparent;
}

.game-btn.green{
    background:#153725;
    color:#8af0b2;
    border-color:#2c6544;
}

.game-btn.danger{
    background:#38191d;
    color:#ff9198;
    border-color:#71343b;
}

.game-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
}

/* =========================
   TIC TAC TOE
========================= */

.ttt{
    display:grid;
    gap:5px;
    justify-content:center;
    margin:17px auto;
}

.ttt button{
    border-radius:8px;
    border:1px solid var(--border);
    background:#0d1117;
    color:white;
    font-weight:900;
    transition:.12s;
}

.ttt button:hover:not(:disabled){
    background:#252c36;
}

.ttt button:disabled{
    cursor:not-allowed;
}

/* =========================
   REACTION
========================= */

.reaction-area{
    text-align:center;
    padding:12px;
}

.reaction-box{
    width:190px;
    height:190px;
    margin:15px auto;
    border-radius:20px;
    border:2px solid var(--border);
    display:grid;
    place-items:center;
    font-size:23px;
    font-weight:800;
    cursor:pointer;
    user-select:none;
    transition:.15s;
    background:#151a21;
    color:var(--muted);
}

.reaction-box.ready{
    background:#183a29;
    border-color:#39734f;
    color:#81f2ae;
}

.reaction-box.go{
    background:#411a1d;
    border-color:#81343b;
    color:#ff858c;
}

.reaction-box.done{
    background:#24274b;
    border-color:#484d86;
    color:#aaaefe;
}

/* =========================
   TYPE GAME
========================= */

.type-area{
    text-align:center;
    padding:10px;
}

.type-sentence{
    padding:17px;
    margin:10px auto;
    max-width:650px;
    border-radius:12px;
    background:#ffffff05;
    border:1px solid var(--border);
    font-size:21px;
    font-weight:750;
    word-break:break-word;
}

.type-input{
    width:100%;
    max-width:550px;
    padding:12px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#0d1117;
    color:white;
    text-align:center;
    outline:none;
}

/* =========================
   BOSS
========================= */

.boss-area{
    text-align:center;
}

.boss-monster-name{
    font-size:27px;
    font-weight:900;
    color:#ff6472;
    margin-bottom:10px;
}

.boss-health-bar{
    position:relative;
    width:100%;
    height:27px;
    overflow:hidden;
    border-radius:15px;
    background:#090909;
    border:1px solid var(--border);
}

.boss-health-fill{
    height:100%;
    width:100%;
    background:linear-gradient(
        90deg,
        #d83b49,
        #ff764e
    );
    transition:width .25s;
}

.boss-health-text{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    font-size:12px;
    font-weight:800;
}

.boss-stats{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    margin:12px 0;
    color:var(--muted2);
    font-size:12px;
}

.boss-stats strong{
    color:white;
}

.boss-damage-display{
    font-size:29px;
    font-weight:900;
    color:#ff7651;
}

.boss-upgrades{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin:10px 0;
}

.boss-upgrade-btn{
    padding:8px 13px;
    border-radius:9px;
    border:1px solid var(--border);
    background:var(--panel3);
    color:white;
}

.boss-upgrade-btn:disabled{
    opacity:.35;
}

/* =========================
   COMPOSER
========================= */

.composer{
    padding:11px 16px 15px;
    background:rgba(13,16,21,.94);
    border-top:1px solid var(--border);
    backdrop-filter:blur(18px);
}

.composer-box{
    max-width:1050px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:8px;
    padding:7px;
    border-radius:14px;
    background:var(--panel2);
    border:1px solid var(--border);
    box-shadow:0 8px 30px #0003;
}

textarea{
    flex:1;
    min-height:42px;
    max-height:150px;
    resize:none;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    padding:10px;
}

textarea::placeholder{
    color:#68717e;
}

.send-btn{
    height:42px;
    padding:0 18px;
    border:0;
    border-radius:9px;
    background:var(--accent);
    color:var(--accentText);
    font-weight:800;
}

.send-btn:hover{
    filter:brightness(1.08);
}

.send-btn:disabled{
    opacity:.45;
}

/* =========================
   OVERLAYS
========================= */

.overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
    background:#000b;
    backdrop-filter:blur(8px);
    z-index:100;
}

.overlay.show{
    display:flex;
}

.panel{
    width:min(650px,100%);
    max-height:calc(100vh - 30px);
    overflow-y:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:17px;
    box-shadow:0 30px 100px #000c;
}

.panel-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:17px 18px;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    background:var(--panel);
    z-index:2;
}

.panel-header h2{
    margin:0;
    font-size:19px;
}

.panel-body{
    padding:18px;
}

/* =========================
   CATEGORIES
========================= */

.category{
    margin-bottom:9px;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    background:var(--panel2);
}

.category-title{
    width:100%;
    padding:13px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border:0;
    background:transparent;
    color:white;
    text-align:left;
    font-weight:750;
}

.category-body{
    display:none;
    padding:0 13px 13px;
}

.category.open .category-body{
    display:block;
}

.setting{
    margin-top:13px;
}

.setting label{
    display:block;
    margin-bottom:6px;
    color:var(--muted2);
    font-size:12px;
}

.setting input,
.setting select{
    width:100%;
    padding:10px;
    border-radius:9px;
    border:1px solid var(--border);
    background:#0d1117;
    color:white;
    outline:none;
}

.setting input[type=range]{
    padding:0;
}

.setting-value{
    margin-top:5px;
    color:var(--muted);
    font-size:11px;
}

.save-btn{
    width:100%;
    margin-top:7px;
    padding:12px;
    border:0;
    border-radius:9px;
    background:var(--accent);
    color:var(--accentText);
    font-weight:800;
}

/* =========================
   GAME CREATOR
========================= */

.game-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.game-choice{
    min-height:85px;
    padding:13px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:white;
    text-align:left;
    transition:.15s;
}

.game-choice:hover{
    background:var(--panel3);
    transform:translateY(-1px);
}

.game-choice strong{
    display:block;
    margin-bottom:4px;
}

.game-choice span{
    color:var(--muted);
    font-size:11px;
    line-height:1.4;
}

.game-players{
    display:inline-block;
    margin-top:6px;
    padding:3px 7px;
    border-radius:20px;
    background:#ffffff07;
    color:var(--muted2);
    font-size:10px;
}

/* =========================
   EMPTY
========================= */

.empty{
    min-height:300px;
    display:grid;
    place-items:center;
    text-align:center;
    color:var(--muted);
}

.empty strong{
    display:block;
    color:var(--muted2);
    margin-bottom:5px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:650px){

    .header{
        height:58px;
        min-height:58px;
        padding:0 10px;
    }

    .channel{
        display:none;
    }

    .messages{
        padding:15px 10px;
    }

    .message-content{
        max-width:calc(100vw - 65px);
    }

    .message-avatar{
        width:32px;
        height:32px;
        flex-basis:32px;
    }

    .game-grid{
        grid-template-columns:1fr;
    }

    .game-body{
        padding:14px;
    }

    .reaction-box{
        width:150px;
        height:150px;
    }

    .type-sentence{
        font-size:17px;
    }

    .composer{
        padding:8px;
    }

    .send-btn{
        padding:0 13px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="logo">
        <div class="logo-icon">🎮</div>

        <div class="logo-title">
            Game Chat
        </div>

        <div class="channel">
            # general
        </div>
    </div>

    <div class="header-actions">

        <button
            class="icon-btn"
            id="gamesBtn"
            title="Games"
        >🎮</button>

        <button
            class="icon-btn"
            id="settingsBtn"
            title="Settings"
        >⚙</button>

    </div>

</header>

<main
    class="messages"
    id="messages"
></main>

<div class="composer">

    <div class="composer-box">

        <textarea
            id="messageInput"
            rows="1"
            placeholder="Message #general"
        ></textarea>

        <button
            class="send-btn"
            id="sendBtn"
        >
            Send
        </button>

    </div>

</div>

</div>


<!-- =========================
     GAME CREATOR
========================= -->

<div
    class="overlay"
    id="gamesOverlay"
>

<div class="panel">

<div class="panel-header">

<h2>🎮 Create Game</h2>

<button
    class="icon-btn"
    id="closeGames"
>×</button>

</div>

<div class="panel-body">

<p style="color:var(--muted2);line-height:1.5">
Create a multiplayer game. Other players will automatically
see it and can join.
</p>

<div class="game-grid">

<button class="game-choice" data-game="ttt3">
<strong>⭕ Tic-Tac-Toe 3×3</strong>
<span>Classic 3×3. Get three in a row.</span>
<div class="game-players">2 players</div>
</button>

<button class="game-choice" data-game="ttt4">
<strong>⭕ Tic-Tac-Toe 4×4</strong>
<span>4×4 board. Get four in a row.</span>
<div class="game-players">2 players</div>
</button>

<button class="game-choice" data-game="ttt5">
<strong>⭕ Tic-Tac-Toe 5×5</strong>
<span>5×5 board. Get five in a row.</span>
<div class="game-players">2 players</div>
</button>

<button class="game-choice" data-game="ttt6">
<strong>⭕ Tic-Tac-Toe 6×6</strong>
<span>6×6 board. Get six in a row.</span>
<div class="game-players">2 players</div>
</button>

<button class="game-choice" data-game="reaction">
<strong>⚡ Reaction Time</strong>
<span>React as quickly as possible.</span>
<div class="game-players">2–6 players</div>
</button>

<button class="game-choice" data-game="type">
<strong>⌨️ Type Sentence</strong>
<span>Type the sentence faster than everyone.</span>
<div class="game-players">2–6 players</div>
</button>

<button class="game-choice" data-game="boss">
<strong>👹 Boss Battle</strong>
<span>Work together to defeat the boss.</span>
<div class="game-players">2–6 players</div>
</button>

</div>

</div>
</div>
</div>


<!-- =========================
     SETTINGS
========================= -->

<div
    class="overlay"
    id="settingsOverlay"
>

<div class="panel">

<div class="panel-header">

<h2>Settings</h2>

<button
    class="icon-btn"
    id="closeSettings"
>×</button>

</div>

<div class="panel-body">

<div class="category open">

<button class="category-title">
<span>👤 Profile</span>
<span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Your name</label>

<input
    id="usernameInput"
    maxlength="24"
    placeholder="Enter your name"
>

</div>

<div class="setting">

<label>Device ID</label>

<input
    id="deviceIdInput"
    readonly
>

</div>

</div>
</div>


<div class="category">

<button class="category-title">
<span>📝 Text</span>
<span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Text size</label>

<input
    id="textSize"
    type="range"
    min="12"
    max="24"
    value="16"
>

<div class="setting-value" id="textSizeValue"></div>

</div>

<div class="setting">

<label>Word spacing</label>

<input
    id="wordSpacing"
    type="range"
    min="0"
    max="12"
    value="0"
>

<div class="setting-value" id="wordSpacingValue"></div>

</div>

<div class="setting">

<label>Line spacing</label>

<input
    id="lineSpacing"
    type="range"
    min="1"
    max="2"
    step=".05"
    value="1.45"
>

<div class="setting-value" id="lineSpacingValue"></div>

</div>

</div>
</div>


<div class="category">

<button class="category-title">
<span>💬 Chat</span>
<span>⌄</span>
</button>

<script>

/* =========================================================
   CONFIG
========================================================= */

const API_URL="/api/messages";
const CHANNEL="general";

const GAME_SERVER="__GAME_SERVER__";

const GAME_TIMEOUT=12000;
const GAME_REMOVE_DELAY=3000;


/* =========================================================
   DEVICE ID
========================================================= */

let deviceId=
    localStorage.getItem("chat_device_id");

if(!deviceId){

    deviceId=
        window.crypto &&
        crypto.randomUUID
            ?crypto.randomUUID()
            :
            Date.now().toString(36)+
            Math.random().toString(36).slice(2);

    localStorage.setItem(
        "chat_device_id",
        deviceId
    );
}


/* =========================================================
   SETTINGS
========================================================= */

const defaults={

    username:"",
    refreshRate:500,

    showTimestamps:true,

    textSize:16,
    wordSpacing:0,
    lineSpacing:1.45,

    cornerRadius:12,
    uiScale:1,

    theme:"dark",

    enterToSend:true,
    autoScroll:true
};

function getSetting(key){

    const value=
        localStorage.getItem(
            "chat_"+key
        );

    if(value===null){
        return defaults[key];
    }

    if(value==="true"){
        return true;
    }

    if(value==="false"){
        return false;
    }

    const number=Number(value);

    return Number.isNaN(number)
        ?value
        :number;
}

let settings={};

Object.keys(defaults).forEach(key=>{
    settings[key]=getSetting(key);
});


/* =========================================================
   ELEMENTS
========================================================= */

const messagesEl=
    document.getElementById("messages");

const messageInput=
    document.getElementById("messageInput");

const sendBtn=
    document.getElementById("sendBtn");

const gamesBtn=
    document.getElementById("gamesBtn");

const gamesOverlay=
    document.getElementById("gamesOverlay");

const closeGames=
    document.getElementById("closeGames");

const settingsBtn=
    document.getElementById("settingsBtn");

const settingsOverlay=
    document.getElementById("settingsOverlay");

const closeSettings=
    document.getElementById("closeSettings");

const saveSettings=
    document.getElementById("saveSettings");

const usernameInput=
    document.getElementById("usernameInput");

const deviceIdInput=
    document.getElementById("deviceIdInput");

const refreshRate=
    document.getElementById("refreshRate");

const showTimestamps=
    document.getElementById("showTimestamps");

const themeSelect=
    document.getElementById("themeSelect");

const textSize=
    document.getElementById("textSize");

const wordSpacing=
    document.getElementById("wordSpacing");

const lineSpacing=
    document.getElementById("lineSpacing");

const cornerRadius=
    document.getElementById("cornerRadius");

const uiScale=
    document.getElementById("uiScale");

const enterToSend=
    document.getElementById("enterToSend");

const autoScroll=
    document.getElementById("autoScroll");

const textSizeValue=
    document.getElementById("textSizeValue");

const wordSpacingValue=
    document.getElementById("wordSpacingValue");

const lineSpacingValue=
    document.getElementById("lineSpacingValue");

const cornerRadiusValue=
    document.getElementById("cornerRadiusValue");

const uiScaleValue=
    document.getElementById("uiScaleValue");

const removeEverything=
    document.getElementById("removeEverything");


/* =========================================================
   STATE
========================================================= */

let currentMessages=[];
let games=new Map();

let refreshTimer=null;
let syncing=false;

let renderedMessages=new Map();
let renderedGames=new Map();

let gameObjects=new Map();

let gameLoopTimers=new Map();

let pendingGameUpdates=new Map();


/* =========================================================
   GAME TYPES
========================================================= */

const GAME_TYPES={

    ttt3:{
        name:"Tic-Tac-Toe 3×3",
        icon:"⭕",
        min:2,
        max:2,
        size:3,
        desc:"Get three in a row."
    },

    ttt4:{
        name:"Tic-Tac-Toe 4×4",
        icon:"⭕",
        min:2,
        max:2,
        size:4,
        desc:"Get four in a row."
    },

    ttt5:{
        name:"Tic-Tac-Toe 5×5",
        icon:"⭕",
        min:2,
        max:2,
        size:5,
        desc:"Get five in a row."
    },

    ttt6:{
        name:"Tic-Tac-Toe 6×6",
        icon:"⭕",
        min:2,
        max:2,
        size:6,
        desc:"Get six in a row."
    },

    reaction:{
        name:"Reaction Time",
        icon:"⚡",
        min:2,
        max:6,
        desc:"React faster than everyone."
    },

    type:{
        name:"Type Sentence",
        icon:"⌨️",
        min:2,
        max:6,
        desc:"Type the sentence as quickly as possible."
    },

    boss:{
        name:"Boss Battle",
        icon:"👹",
        min:2,
        max:6,
        desc:"Work together to defeat the boss."
    }
};


/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value){

    const div=document.createElement("div");

    div.textContent=String(value ?? "");

    return div.innerHTML;
}


function getInitial(name){

    name=String(name||"?").trim();

    return name
        ?name.charAt(0).toUpperCase()
        :"?";
}


function formatTime(date){

    const d=new Date(date);

    if(Number.isNaN(d.getTime())){
        return "";
    }

    return d.toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}


function nearBottom(){

    return (
        messagesEl.scrollHeight -
        messagesEl.scrollTop -
        messagesEl.clientHeight
    ) < 120;
}


function makeId(){

    if(window.crypto && crypto.randomUUID){
        return crypto.randomUUID();
    }

    return (
        Date.now().toString(36)+
        Math.random().toString(36).slice(2)
    );
}


/* =========================================================
   SETTINGS UI
========================================================= */

function loadSettingsUI(){

    usernameInput.value=settings.username;

    deviceIdInput.value=deviceId;

    refreshRate.value=settings.refreshRate;

    showTimestamps.value=
        String(settings.showTimestamps);

    themeSelect.value=settings.theme;

    textSize.value=settings.textSize;

    wordSpacing.value=settings.wordSpacing;

    lineSpacing.value=settings.lineSpacing;

    cornerRadius.value=settings.cornerRadius;

    uiScale.value=settings.uiScale;

    enterToSend.value=
        String(settings.enterToSend);

    autoScroll.value=
        String(settings.autoScroll);

    updateRangeLabels();
}


function updateRangeLabels(){

    textSizeValue.textContent=
        textSize.value+"px";

    wordSpacingValue.textContent=
        wordSpacing.value+"px";

    lineSpacingValue.textContent=
        lineSpacing.value;

    cornerRadiusValue.textContent=
        cornerRadius.value+"px";

    uiScaleValue.textContent=
        Math.round(
            Number(uiScale.value)*100
        )+"%";
}


[
    textSize,
    wordSpacing,
    lineSpacing,
    cornerRadius,
    uiScale
].forEach(input=>{
    input.addEventListener(
        "input",
        updateRangeLabels
    );
});


function applyTheme(name){

    const themes={

        dark:{
            bg:"#090b0f",
            panel:"#11151c"
        },

        midnight:{
            bg:"#070a13",
            panel:"#0e1420"
        },

        slate:{
            bg:"#101418",
            panel:"#171d23"
        },

        black:{
            bg:"#000000",
            panel:"#080808"
        },

        blue:{
            bg:"#081018",
            panel:"#101b28"
        },

        purple:{
            bg:"#100a17",
            panel:"#181020"
        },

        green:{
            bg:"#08120d",
            panel:"#101b15"
        },

        red:{
            bg:"#140a0a",
            panel:"#1e1111"
        },

        gray:{
            bg:"#151515",
            panel:"#202020"
        },

        light:{
            bg:"#eceef1",
            panel:"#ffffff"
        }
    };

    const t=
        themes[name]||
        themes.dark;

    document.documentElement.style.setProperty(
        "--bg",
        t.bg
    );

    document.documentElement.style.setProperty(
        "--panel",
        t.panel
    );
}


function applySettings(){

    document.documentElement.style.setProperty(
        "--text-size",
        settings.textSize+"px"
    );

    document.documentElement.style.setProperty(
        "--word-spacing",
        settings.wordSpacing+"px"
    );

    document.documentElement.style.setProperty(
        "--line-spacing",
        settings.lineSpacing
    );

    document.documentElement.style.setProperty(
        "--radius",
        settings.cornerRadius+"px"
    );

    document.documentElement.style.setProperty(
        "--ui-scale",
        settings.uiScale
    );

    applyTheme(settings.theme);

    /*
     IMPORTANT:
     We DO NOT clear renderedMessages here.
     This prevents settings from rebuilding the chat.
    */

    updateExistingMessageStyles();

    restartRefresh();
}


function updateExistingMessageStyles(){

    renderedMessages.forEach(el=>{

        const time=el.querySelector(".time");

        if(time){
            time.style.display=
                settings.showTimestamps
                    ?"inline"
                    :"none";
        }
    });
}


function saveAllSettings(){

    settings.username=
        usernameInput.value.trim();

    settings.refreshRate=
        Number(refreshRate.value);

    settings.showTimestamps=
        showTimestamps.value==="true";

    settings.theme=
        themeSelect.value;

    settings.textSize=
        Number(textSize.value);

    settings.wordSpacing=
        Number(wordSpacing.value);

    settings.lineSpacing=
        Number(lineSpacing.value);

    settings.cornerRadius=
        Number(cornerRadius.value);

    settings.uiScale=
        Number(uiScale.value);

    settings.enterToSend=
        enterToSend.value==="true";

    settings.autoScroll=
        autoScroll.value==="true";

    Object.entries(settings).forEach(
        ([key,value])=>{
            localStorage.setItem(
                "chat_"+key,
                String(value)
            );
        }
    );

    applySettings();

    settingsOverlay.classList.remove(
        "show"
    );
}


/* =========================================================
   SETTINGS EVENTS
========================================================= */

settingsBtn.onclick=()=>{

    loadSettingsUI();

    settingsOverlay.classList.add("show");
};


closeSettings.onclick=()=>{

    settingsOverlay.classList.remove("show");
};


gamesBtn.onclick=()=>{

    gamesOverlay.classList.add("show");
};


closeGames.onclick=()=>{

    gamesOverlay.classList.remove("show");
};


document.querySelectorAll(
    ".category-title"
).forEach(button=>{

    button.onclick=()=>{

        button.parentElement.classList.toggle(
            "open"
        );
    };
});


saveSettings.onclick=
    saveAllSettings;


/* =========================================================
   NORMAL CHAT
========================================================= */

async function sendMessage(){

    const message=
        messageInput.value.trim();

    if(!message){
        return;
    }

    if(!settings.username){

        settingsOverlay.classList.add("show");

        loadSettingsUI();

        usernameInput.focus();

        return;
    }

    sendBtn.disabled=true;

    try{

        const response=
            await fetch(
                API_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        username:
                            settings.username,

                        channel:CHANNEL,

                        message,

                        device_id:deviceId
                    })
                }
            );

        const data=
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error||
                "Could not send message."
            );
        }

        messageInput.value="";

        resizeTextarea();

        /*
         Do not manually rebuild chat.
         The server result is picked up by sync.
        */

        await sync();

    }catch(error){

        alert(error.message);

    }finally{

        sendBtn.disabled=false;
    }
}


sendBtn.onclick=sendMessage;


messageInput.addEventListener(
    "keydown",
    event=>{

        if(
            event.key==="Enter" &&
            !event.shiftKey &&
            settings.enterToSend
        ){

            event.preventDefault();

            sendMessage();
        }
    }
);


function resizeTextarea(){

    messageInput.style.height="auto";

    messageInput.style.height=
        Math.min(
            messageInput.scrollHeight,
            150
        )+"px";
}


messageInput.addEventListener(
    "input",
    resizeTextarea
);


/* =========================================================
   CREATE GAME
========================================================= */

document.querySelectorAll(
    ".game-choice"
).forEach(button=>{

    button.onclick=async()=>{

        const type=
            button.dataset.game;

        await createGame(type);

        gamesOverlay.classList.remove(
            "show"
        );
    };
});


async function createGame(type){

    if(!settings.username){

        settingsOverlay.classList.add("show");

        loadSettingsUI();

        usernameInput.focus();

        return;
    }

    const config=GAME_TYPES[type];

    if(!config){
        return;
    }

    const gameId=makeId();

    const state={

        version:1,

        id:gameId,

        type,

        status:"lobby",

        host:{

            id:deviceId,

            name:settings.username
        },

        players:[

            {
                id:deviceId,
                name:settings.username
            }

        ],

        createdAt:Date.now(),

        startedAt:null,

        finishedAt:null,

        winner:null,

        data:createInitialGameData(type)
    };

    const result=
        await postGameState(state);

    if(!result){
        return;
    }

    await sync();
}


/* =========================================================
   GAME INITIAL STATE
========================================================= */

function createInitialGameData(type){

    if(type.startsWith("ttt")){

        const size=
            GAME_TYPES[type].size;

        return {

            board:
                Array(size*size).fill(""),

            turn:0,

            moves:0
        };
    }


    if(type==="reaction"){

        return {

            phase:"waiting",

            readyAt:null,

            results:{},

            round:0
        };
    }


    if(type==="type"){

        const sentences=[

            "The quick brown fox jumps over the lazy dog.",

            "Games are better when everyone can play together.",

            "Welcome to the multiplayer game chat.",

            "Sometimes the fastest player wins.",

            "Keep your eyes open and react quickly."
        ];

        return {

            sentence:
                sentences[
                    Math.floor(
                        Math.random()*
                        sentences.length
                    )
                ],

            results:{},

            round:0
        };
    }


    if(type==="boss"){

        return {

            hp:100000000,

            maxHp:100000000,

            damage:{},

            upgrades:{}
        };
    }


    return {};
}


/* =========================================================
   GAME SERVER POST
========================================================= */

async function postGameState(state){

    try{

        const response=
            await fetch(
                API_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        game_server:true,

                        device_id:deviceId,

                        channel:CHANNEL,

                        message:
                            JSON.stringify(state)
                    })
                }
            );

        const data=
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error||
                "Could not create game."
            );
        }

        return data.game;

    }catch(error){

        console.error(error);

        alert(error.message);

        return null;
    }
}


/* =========================================================
   GAME PATCH
========================================================= */

async function patchGame(game){

    if(
        !game ||
        !game.serverId ||
        game.host.id!==deviceId
    ){
        return null;
    }

    try{

        const response=
            await fetch(
                API_URL,
                {
                    method:"PATCH",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        id:game.serverId,

                        device_id:deviceId,

                        game_server:true,

                        game_state:
                            JSON.stringify(
                                stripGameForServer(
                                    game
                                )
                            )
                    })
                }
            );

        const data=
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error||
                "Game update failed."
            );
        }

        return data.game;

    }catch(error){

        console.error(
            "GAME PATCH",
            error
        );

        return null;
    }
}


function stripGameForServer(game){

    return {

        version:1,

        id:game.id,

        type:game.type,

        status:game.status,

        host:game.host,

        players:game.players,

        createdAt:game.createdAt,

        startedAt:game.startedAt,

        finishedAt:game.finishedAt,

        winner:game.winner,

        data:game.data
    };
}


/* =========================================================
   DELETE GAME
========================================================= */

async function deleteGame(game){

    if(
        !game ||
        !game.serverId ||
        game.host.id!==deviceId
    ){
        return;
    }

    try{

        await fetch(
            API_URL,
            {
                method:"DELETE",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({

                    game_server:true,

                    id:game.serverId,

                    device_id:deviceId
                })
            }
        );

    }catch(error){

        console.error(
            "GAME DELETE",
            error
        );
    }
}


/* =========================================================
   GAME JOIN
========================================================= */

async function joinGame(game){

    if(!game){
        return;
    }

    if(game.status!=="lobby"){
        return;
    }

    if(
        game.players.some(
            p=>p.id===deviceId
        )
    ){
        return;
    }

    if(
        game.players.length>=
        GAME_TYPES[game.type].max
    ){
        return;
    }

    const updated=
        structuredClone
            ?structuredClone(game)
            :JSON.parse(
                JSON.stringify(game)
            );

    updated.players.push({

        id:deviceId,

        name:
            settings.username||
            "Player"
    });

    if(updated.host.id===deviceId){
        return;
    }

    /*
     Players cannot PATCH because the API only
     allows the host to update game state.

     Therefore joining is done through a special
     game action message.
    */

    await sendGameAction(
        game,
        {
            action:"join",

            player:{
                id:deviceId,
                name:
                    settings.username||
                    "Player"
            }
        }
    );
}


/* =========================================================
   GAME ACTIONS
========================================================= */

async function sendGameAction(game,action){

    /*
     Game actions are sent as normal hidden game
     messages.

     They do not appear in the visible chat because
     the renderer filters __GAME_SERVER__.
    */

    const state={

        actionMessage:true,

        gameId:game.id,

        from:{

            id:deviceId,

            name:
                settings.username||
                "Player"
        },

        action,

        timestamp:Date.now()
    };

    try{

        const response=
            await fetch(
                API_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        game_server:true,

                        device_id:deviceId,

                        channel:CHANNEL,

                        message:
                            JSON.stringify(state)
                    })
                }
            );

        if(!response.ok){

            const data=
                await response.json();

            console.error(
                data.error
            );
        }

    }catch(error){

        console.error(error);
    }
}


/* =========================================================
   SYNC
========================================================= */

async function sync(){

    if(syncing){
        return;
    }

    syncing=true;

    try{

        const response=
            await fetch(
                API_URL+
                "?channel="+
                encodeURIComponent(CHANNEL),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){
            throw new Error(
                "Server returned "+
                response.status
            );
        }

        const result=
            await response.json();

        const serverMessages=
            Array.isArray(result.messages)
                ?result.messages
                :[];

        processServerMessages(
            serverMessages
        );

    }catch(error){

        console.error(
            "SYNC ERROR:",
            error
        );

    }finally{

        syncing=false;
    }
}


/* =========================================================
   PROCESS SERVER DATA
========================================================= */

function processServerMessages(list){

    const oldBottom=nearBottom();

    const normalMessages=
        list.filter(
            m=>
                m.username!==
                GAME_SERVER
        );

    const serverGames=
        list.filter(
            m=>
                m.username===
                GAME_SERVER
        );

    currentMessages=
        normalMessages;

    /*
     Incremental normal-message renderer.
    */

    updateNormalMessages(
        normalMessages
    );

    /*
     Rebuild the GAME MAP only.
     Visible chat is untouched.
    */

    processGames(
        serverGames
    );

    if(
        oldBottom &&
        settings.autoScroll
    ){

        messagesEl.scrollTop=
            messagesEl.scrollHeight;
    }
}


/* =========================================================
   INCREMENTAL MESSAGE RENDERING
========================================================= */

function updateNormalMessages(list){

    const incomingIds=
        new Set(
            list.map(
                m=>String(m.id)
            )
        );

    /*
     Remove only messages that no longer exist.
    */

    renderedMessages.forEach(
        (element,id)=>{

            if(!incomingIds.has(String(id))){

                element.remove();

                renderedMessages.delete(id);
            }
        }
    );

    /*
     Add only messages we have never rendered.
    */

    list.forEach(message=>{

        const id=String(message.id);

        if(renderedMessages.has(id)){

            updateMessageElement(
                renderedMessages.get(id),
                message
            );

            return;
        }

        const element=
            createMessageElement(
                message
            );

        renderedMessages.set(
            id,
            element
        );

        insertMessageInOrder(
            element,
            message
        );
    });
}

/* =========================================================
   INSERT IN CORRECT ORDER
========================================================= */

function insertMessageInOrder(
    element,
    message
){

    const children=
        [
            ...messagesEl.children
        ];

    const targetTime=
        new Date(
            message.created_at
        ).getTime();

    for(const child of children){

        if(
            child.classList.contains(
                "game-message"
            )
        ){
            continue;
        }

        const other=
            currentMessages.find(
                m=>
                    String(m.id)===
                    child.dataset.id
            );

        if(!other){
            continue;
        }

        const otherTime=
            new Date(
                other.created_at
            ).getTime();

        if(targetTime<otherTime){

            messagesEl.insertBefore(
                element,
                child
            );

            return;
        }
    }

    /*
     Keep game cards after chat messages
     by inserting before the first game.
    */

    const firstGame=
        messagesEl.querySelector(
            ".game-message"
        );

    if(firstGame){

        messagesEl.insertBefore(
            element,
            firstGame
        );

    }else{

        messagesEl.appendChild(
            element
        );
    }
}


/* =========================================================
   GAME PROCESSING
========================================================= */

function processGames(serverMessages){

    const gameMessages=
        new Map();

    serverMessages.forEach(message=>{

        let parsed;

        try{

            parsed=
                JSON.parse(
                    message.message
                );

        }catch{

            return;
        }

        if(
            parsed &&
            parsed.actionMessage
        ){

            /*
             Action messages are handled by hosts.
            */

            handleIncomingGameAction(
                message,
                parsed
            );

            return;
        }

        if(
            parsed &&
            parsed.id &&
            parsed.type
        ){

            gameMessages.set(
                parsed.id,
                {
                    ...parsed,
                    serverId:message.id,
                    serverCreatedAt:
                        message.created_at
                }
            );
        }
    });

    /*
     Remove games that disappeared from server.
    */

    games.forEach(
        (game,id)=>{

            if(!gameMessages.has(id)){

                removeGameElement(id);

                games.delete(id);
            }
        }
    );

    /*
     Add/update games.
    */

    gameMessages.forEach(
        (game,id)=>{

            const previous=
                games.get(id);

            games.set(
                id,
                game
            );

            if(!previous){

                createGameElement(
                    game
                );

            }else{

                updateGameElement(
                    game
                );
            }

            runGameLifecycle(
                game
            );
        }
    );
}


/* =========================================================
   GAME ACTION HANDLER
========================================================= */

async function handleIncomingGameAction(
    serverMessage,
    actionMessage
){

    const game=
        games.get(
            actionMessage.gameId
        );

    if(!game){
        return;
    }

    /*
     Only host processes state-changing actions.
    */

    if(
        game.host.id!==deviceId
    ){
        return;
    }

    const action=
        actionMessage.action;

    if(action.action==="join"){

        const player=
            action.player;

        if(
            !player ||
            game.players.some(
                p=>p.id===player.id
            )
        ){
            return;
        }

        if(
            game.players.length >=
            GAME_TYPES[game.type].max
        ){
            return;
        }

        game.players.push({
            id:player.id,
            name:player.name
        });

        await patchGame(game);

        return;
    }

    if(action.action==="tttMove"){

        if(game.status!=="playing"){
            return;
        }

        const playerIndex=
            game.players.findIndex(
                p=>
                    p.id===
                    action.playerId
            );

        if(playerIndex<0){
            return;
        }

        if(
            playerIndex!==
            game.data.turn
        ){
            return;
        }

        const size=
            GAME_TYPES[
                game.type
            ].size;

        const index=
            Number(action.index);

        if(
            index<0 ||
            index>=size*size ||
            game.data.board[index]
        ){
            return;
        }

        game.data.board[index]=
            playerIndex===0
                ?"X"
                :"O";

        game.data.turn=
            game.data.turn===0
                ?1
                :0;

        game.data.moves++;

        const result=
            checkTTT(
                game.data.board,
                size
            );

        if(result){

            game.status="finished";

            game.winner=
                game.players[
                    playerIndex
                ];

            game.finishedAt=
                Date.now();
        }

        if(
            game.data.moves>=size*size &&
            !result
        ){

            game.status="finished";

            game.winner=null;

            game.finishedAt=
                Date.now();
        }

        await patchGame(game);

        return;
    }

    if(action.action==="reactionClick"){

        if(game.status!=="playing"){
            return;
        }

        if(
            game.data.phase!=="go"
        ){
            return;
        }

        if(
            game.data.results[
                action.playerId
            ]
        ){
            return;
        }

        game.data.results[
            action.playerId
        ]=
            Date.now()-
            game.data.readyAt;

        const count=
            Object.keys(
                game.data.results
            ).length;

        if(
            count>=game.players.length
        ){

            const sorted=
                Object.entries(
                    game.data.results
                )
                .sort(
                    (a,b)=>a[1]-b[1]
                );

            game.winner=
                game.players.find(
                    p=>
                        p.id===
                        sorted[0][0]
                );

            game.status="finished";

            game.finishedAt=
                Date.now();
        }

        await patchGame(game);

        return;
    }

    if(action.action==="typeFinish"){

        if(game.status!=="playing"){
            return;
        }

        if(
            game.data.results[
                action.playerId
            ]
        ){
            return;
        }

        if(
            action.text===
            game.data.sentence
        ){

            game.data.results[
                action.playerId
            ]=
                Date.now();

            game.winner=
                game.players.find(
                    p=>
                        p.id===
                        action.playerId
                );

            game.status="finished";

            game.finishedAt=
                Date.now();

            await patchGame(game);
        }

        return;
    }

    if(action.action==="bossDamage"){

        if(game.status!=="playing"){
            return;
        }

        const damage=
            Math.max(
                1,
                Math.min(
                    1000000,
                    Number(action.damage)||1
                )
            );

        game.data.hp=
            Math.max(
                0,
                game.data.hp-damage
            );

        game.data.damage[
            action.playerId
        ]=
            (
                game.data.damage[
                    action.playerId
                ]||0
            )+damage;

        if(game.data.hp<=0){

            game.status="finished";

            game.winner=null;

            game.finishedAt=
                Date.now();
        }

        await patchGame(game);
    }
}


/* =========================================================
   GAME LIFECYCLE
========================================================= */

function runGameLifecycle(game){

    if(
        game.status==="finished" &&
        game.finishedAt
    ){

        const age=
            Date.now()-
            game.finishedAt;

        if(
            age>=GAME_REMOVE_DELAY &&
            game.host.id===deviceId
        ){

            deleteGame(game);

            return;
        }
    }

    /*
     Host heartbeat.
     If a host closes/disconnects, other clients
     remove the stale game locally. The host's game
     message disappears from the server on explicit
     removal. This also prevents stale lobbies.
    */

    if(
        game.status!=="finished" &&
        game.serverCreatedAt
    ){

        const age=
            Date.now()-
            new Date(
                game.serverCreatedAt
            ).getTime();

        if(
            age>GAME_TIMEOUT*3
        ){

            /*
             Only host can actually delete through API.
             Non-host hides the stale game locally.
            */

            if(
                game.host.id===deviceId
            ){

                deleteGame(game);

            }else{

                removeGameElement(
                    game.id
                );

                games.delete(
                    game.id
                );
            }
        }
    }

    /*
     Host heartbeat.
    */

    if(
        game.host.id===deviceId &&
        game.status!=="finished"
    ){

        startHostHeartbeat(game);
    }
}


function startHostHeartbeat(game){

    if(
        gameLoopTimers.has(
            "heartbeat_"+game.id
        )
    ){
        return;
    }

    const timer=
        setInterval(
            async()=>{

                /*
                 The host re-publishes the same
                 state so other clients know it is alive.
                */

                const current=
                    games.get(game.id);

                if(
                    !current ||
                    current.host.id!==deviceId
                ){

                    clearInterval(timer);

                    gameLoopTimers.delete(
                        "heartbeat_"+game.id
                    );

                    return;
                }

                await patchGame(current);

            },
            5000
        );

    gameLoopTimers.set(
        "heartbeat_"+game.id,
        timer
    );
}


/* =========================================================
   GAME ELEMENT
========================================================= */

function createGameElement(game){

    const wrapper=
        document.createElement("div");

    wrapper.className=
        "game-message";

    wrapper.dataset.gameId=
        game.id;

    wrapper.innerHTML=
        buildGameHTML(game);

    messagesEl.appendChild(
        wrapper
    );

    renderedGames.set(
        game.id,
        wrapper
    );

    attachGameEvents(
        wrapper,
        game
    );

    updateGameElement(
        game
    );
}


function updateGameElement(game){

    const wrapper=
        renderedGames.get(
            game.id
        );

    if(!wrapper){
        createGameElement(game);
        return;
    }

    const oldScroll=
        messagesEl.scrollTop;

    wrapper.innerHTML=
        buildGameHTML(game);

    attachGameEvents(
        wrapper,
        game
    );

    messagesEl.scrollTop=
        oldScroll;
}


function removeGameElement(id){

    const element=
        renderedGames.get(id);

    if(element){
        element.remove();

        renderedGames.delete(id);
    }

    const timer=
        gameLoopTimers.get(
            "heartbeat_"+id
        );

    if(timer){

        clearInterval(timer);

        gameLoopTimers.delete(
            "heartbeat_"+id
        );
    }
}

/* =========================================================
   GAME EVENTS
========================================================= */

function attachGameEvents(
    wrapper,
    game
){

    wrapper
        .querySelector(
            '[data-action="join"]'
        )
        ?.addEventListener(
            "click",
            ()=>joinGame(game)
        );


    wrapper
        .querySelector(
            '[data-action="start"]'
        )
        ?.addEventListener(
            "click",
            ()=>startGame(game)
        );


    wrapper
        .querySelector(
            '[data-action="forceStop"]'
        )
        ?.addEventListener(
            "click",
            ()=>deleteGame(game)
        );


    wrapper
        .querySelectorAll(
            "[data-ttt-index]"
        )
        .forEach(button=>{

            button.addEventListener(
                "click",
                ()=>{

                    const index=
                        Number(
                            button.dataset.tttIndex
                        );

                    sendGameAction(
                        game,
                        {
                            action:"tttMove",

                            playerId:
                                deviceId,

                            index
                        }
                    );
                }
            );
        });


    const reaction=
        wrapper.querySelector(
            "[data-reaction]"
        );

    if(reaction){

        reaction.addEventListener(
            "click",
            ()=>{

                sendGameAction(
                    game,
                    {
                        action:
                            "reactionClick",

                        playerId:
                            deviceId
                    }
                );
            }
        );
    }


    const typeInput=
        wrapper.querySelector(
            "[data-type-input]"
        );

    if(typeInput){

        typeInput.addEventListener(
            "keydown",
            event=>{

                if(
                    event.key!=="Enter"
                ){
                    return;
                }

                sendGameAction(
                    game,
                    {
                        action:
                            "typeFinish",

                        playerId:
                            deviceId,

                        text:
                            typeInput.value
                    }
                );
            }
        );
    }


    const damage=
        wrapper.querySelector(
            "[data-boss-damage]"
        );

    if(damage){

        damage.addEventListener(
            "click",
            ()=>{

                sendGameAction(
                    game,
                    {
                        action:
                            "bossDamage",

                        playerId:
                            deviceId,

                        damage:100000
                    }
                );
            }
        );
    }
}


/* =========================================================
   START GAME
========================================================= */

async function startGame(game){

    if(
        game.host.id!==deviceId ||
        game.status!=="lobby"
    ){
        return;
    }

    if(
        game.players.length<
        GAME_TYPES[game.type].min
    ){
        return;
    }

    game.status="playing";

    game.startedAt=
        Date.now();

    if(game.type==="reaction"){

        game.data.phase="waiting";

        game.data.readyAt=null;

        game.data.results={};

        game.data.round++;

    }

    if(game.type==="type"){

        game.data.results={};

        game.data.round++;

    }

    await patchGame(game);

    if(game.type==="reaction"){

        setTimeout(
            async()=>{

                const current=
                    games.get(game.id);

                if(
                    !current ||
                    current.status!=="playing" ||
                    current.host.id!==deviceId
                ){
                    return;
                }

                current.data.phase="go";

                current.data.readyAt=
                    Date.now();

                await patchGame(current);

            },
            1500+
            Math.random()*2500
        );
    }
}


/* =========================================================
   TTT
========================================================= */

function buildTTT(
    game,
    isHost,
    joined
){

    const size=
        GAME_TYPES[
            game.type
        ].size;

    const board=
        game.data.board||[];

    if(game.status==="lobby"){

        return `
<div class="turn-banner">
Join the game, then wait for the host to start.
</div>
`;
    }

    if(game.status==="finished"){

        return `
<div class="turn-banner">
${
    game.winner
        ?`🏆 ${escapeHTML(game.winner.name)} wins!`
        :"Draw!"
}
</div>
`;
    }

    const current=
        game.players[
            game.data.turn||0
        ];

    return `

<div class="turn-banner">

Turn:
<strong>
${escapeHTML(
    current
        ?current.name
        :"Player"
)}
</strong>

</div>

<div
    class="ttt"
    style="
        grid-template-columns:
        repeat(${size},42px)
    "
>

${board.map(
    (cell,index)=>`

<button
    data-ttt-index="${index}"
    style="
        width:42px;
        height:42px;
        font-size:18px;
    "
    ${
        cell ||
        !joined ||
        game.players[
            game.data.turn||0
        ]?.id!==deviceId
        ?"disabled"
        :""
    }
>
${cell}
</button>

`).join("")}

</div>
`;
}


/* =========================================================
   TTT CHECK
========================================================= */

function checkTTT(board,size){

    for(let row=0;row<size;row++){

        const first=
            board[row*size];

        if(!first){
            continue;
        }

        let good=true;

        for(
            let col=1;
            col<size;
            col++
        ){

            if(
                board[
                    row*size+col
                ]!==first
            ){

                good=false;
                break;
            }
        }

        if(good){
            return true;
        }
    }


    for(let col=0;col<size;col++){

        const first=
            board[col];

        if(!first){
            continue;
        }

        let good=true;

        for(
            let row=1;
            row<size;
            row++
        ){

            if(
                board[
                    row*size+col
                ]!==first
            ){

                good=false;
                break;
            }
        }

        if(good){
            return true;
        }
    }


    let first=
        board[0];

    if(first){

        let good=true;

        for(let i=1;i<size;i++){

            if(
                board[
                    i*size+i
                ]!==first
            ){

                good=false;
                break;
            }
        }

        if(good){
            return true;
        }
    }


    first=
        board[size-1];

    if(first){

        let good=true;

        for(let i=1;i<size;i++){

            if(
                board[
                    i*size+
                    (size-1-i)
                ]!==first
            ){

                good=false;
                break;
            }
        }

        if(good){
            return true;
        }
    }

    return false;
}


/* =========================================================
   REACTION
========================================================= */

function buildReaction(
    game,
    isHost,
    joined
){

    if(game.status==="lobby"){

        return `
<div class="turn-banner">
Everyone joins first. The host starts the round.
</div>
`;
    }

    if(game.status==="finished"){

        return `
<div class="reaction-area">

<div class="turn-banner">
🏆 ${
    game.winner
        ?escapeHTML(
            game.winner.name
        )
        :"Winner"
} won!
</div>

</div>
`;
    }

    let text=
        "Wait...";

    let cls="";

    if(game.data.phase==="go"){

        text="CLICK!";

        cls="go";

    }

    return `

<div class="reaction-area">

<div
    class="reaction-box ${cls}"
    data-reaction
>
${text}
</div>

${
    game.data.phase==="waiting"
    ?`
<div class="turn-banner">
Wait for green.
</div>
`
    :""
}

</div>
`;
}


/* =========================================================
   TYPE GAME
========================================================= */

function buildTypeGame(
    game,
    isHost,
    joined
){

    if(game.status==="lobby"){

        return `
<div class="turn-banner">
Wait for the host to start.
</div>
`;
    }

    if(game.status==="finished"){

        return `
<div class="turn-banner">
🏆 ${
    game.winner
        ?escapeHTML(
            game.winner.name
        )
        :"Game finished"
}
</div>
`;
    }

    return `

<div class="type-area">

<div class="type-sentence">
${escapeHTML(
    game.data.sentence
)}
</div>

${
    joined
    ?`
<input
    class="type-input"
    data-type-input
    placeholder="Type it and press Enter..."
    autocomplete="off"
>
`
    :""
}

</div>
`;
}


/* =========================================================
   BOSS
========================================================= */

function buildBoss(
    game,
    isHost,
    joined
){

    if(game.status==="lobby"){

        return `
<div class="turn-banner">
Wait for the host to start the boss fight.
</div>
`;
    }

    const hp=
        Math.max(
            0,
            Number(
                game.data.hp
            )||0
        );

    const maxHp=
        Number(
            game.data.maxHp
        )||100000000;

    const percent=
        Math.max(
            0,
            Math.min(
                100,
                hp/maxHp*100
            )
        );

    if(game.status==="finished"){

        return `
<div class="boss-area">

<div class="boss-monster-name">
👹 BOSS DEFEATED
</div>

<div class="turn-banner">
Everyone wins together!
</div>

</div>
`;
    }

    return `

<div class="boss-area">

<div class="boss-monster-name">
THE BOSS
</div>

<div class="boss-health-bar">

<div
    class="boss-health-fill"
    style="width:${percent}%"
></div>

<div class="boss-health-text">
${Math.floor(hp).toLocaleString()}
/
${Math.floor(maxHp).toLocaleString()}
</div>

</div>

<div class="boss-stats">

<div>
Your damage:
<strong>
${(
    game.data.damage?.[deviceId]||0
).toLocaleString()}
</strong>
</div>

</div>

${
    joined
    ?`
<button
    class="game-btn danger"
    data-boss-damage
>
⚔ Deal 100,000 Damage
</button>
`
    :""
}

</div>
`;
}


/* =========================================================
   DELETE ALL
========================================================= */

removeEverything.onclick=
    async()=>{

        if(
            !confirm(
                "Delete every message and game?"
            )
        ){
            return;
        }

        try{

            const response=
                await fetch(
                    API_URL,
                    {
                        method:"DELETE",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({
                            delete_all:true
                        })
                    }
                );

            if(!response.ok){

                const data=
                    await response.json();

                throw new Error(
                    data.error||
                    "Delete failed."
                );
            }

            /*
             Clear UI only after server deletion.
            */

            renderedMessages.forEach(
                element=>element.remove()
            );

            renderedMessages.clear();

            renderedGames.forEach(
                element=>element.remove()
            );

            renderedGames.clear();

            games.clear();

        }catch(error){

            alert(error.message);
        }
    };


/* =========================================================
   REFRESH
========================================================= */

function restartRefresh(){

    if(refreshTimer){

        clearInterval(
            refreshTimer
        );
    }

    refreshTimer=
        setInterval(
            sync,
            Math.max(
                100,
                Number(
                    settings.refreshRate
                )||500
            )
        );
}


document.addEventListener(
    "visibilitychange",
    ()=>{
        if(
            document.visibilityState===
            "visible"
        ){
            sync();
        }
    }
);


/* =========================================================
   INITIALIZE
========================================================= */

loadSettingsUI();

applySettings();

sync();

restartRefresh();


/* =========================================================
   BEFORE LEAVING
========================================================= */

window.addEventListener(
    "beforeunload",
    ()=>{
        /*
         We intentionally don't use fetch here because
         browsers can terminate normal requests during
         unload.

         The host heartbeat + timeout handles stale games.
        */
    }
);

</script>
