<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MyChat</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
    background: #111214;
    color: white;
}

.app {
    display: flex;
    height: 100vh;
}

/* SIDEBAR */

.sidebar {
    width: 230px;
    background: #18191c;
    padding: 15px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 25px;
}

.channel {
    padding: 11px;
    margin-bottom: 5px;
    border-radius: 5px;
    color: #aaa;
    cursor: pointer;
}

.channel:hover,
.channel.active {
    background: #404249;
    color: white;
}

/* CHAT */

.chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.header {
    height: 60px;
    background: #2b2d31;
    border-bottom: 1px solid #202225;
    display: flex;
    align-items: center;
    padding: 0 20px;
    font-weight: bold;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.message {
    margin-bottom: 18px;
}

.name {
    font-weight: bold;
}

.time {
    color: #777;
    font-size: 11px;
    margin-left: 8px;
}

.text {
    margin-top: 4px;
    color: #ddd;
    white-space: pre-wrap;
}

.input-area {
    padding: 15px;
    background: #2b2d31;
}

.input-box {
    display: flex;
    background: #383a40;
    border-radius: 7px;
    padding: 5px;
}

textarea {
    flex: 1;
    resize: none;
    border: 0;
    outline: 0;
    background: transparent;
    color: white;
    padding: 12px;
    font-size: 15px;
}

.send {
    width: 75px;
    border: 0;
    border-radius: 5px;
    background: #5865f2;
    color: white;
    cursor: pointer;
}

.send:hover {
    background: #4752c4;
}

/* LOGIN */

.login {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.92);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
}

.login-box {
    width: 350px;
    max-width: calc(100% - 30px);
    background: #313338;
    padding: 30px;
    border-radius: 8px;
}

.login-box h1 {
    margin-top: 0;
}

.login-box input {
    width: 100%;
    height: 45px;
    background: #1e1f22;
    border: 0;
    border-radius: 5px;
    color: white;
    padding: 10px;
    margin: 15px 0;
}

.login-box button {
    width: 100%;
    height: 45px;
    background: #5865f2;
    border: 0;
    border-radius: 5px;
    color: white;
    cursor: pointer;
}

.status {
    position: fixed;
    right: 10px;
    top: 10px;
    padding: 7px;
    background: #18191c;
    border-radius: 5px;
    font-size: 12px;
    z-index: 20;
}

.error {
    color: #ed4245;
    margin-top: 10px;
    font-size: 13px;
}

</style>

</head>

<body>

<div
    id="status"
    class="status">
    Connecting...
</div>


<div class="app">

    <div class="sidebar">

        <div class="logo">
            MyChat
        </div>

        <div
            class="channel active"
            onclick="changeChannel('general', this)">
            # general
        </div>

        <div
            class="channel"
            onclick="changeChannel('gaming', this)">
            # gaming
        </div>

        <div
            class="channel"
            onclick="changeChannel('movies', this)">
            # movies
        </div>

    </div>


    <div class="chat">

        <div class="header">

            # <span id="channelName">
                general
            </span>

        </div>


        <div
            id="messages"
            class="messages">
        </div>


        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="messageInput"
                    placeholder="Message #general"
                    rows="1"
                    maxlength="2000">
                </textarea>

                <button
                    id="sendButton"
                    class="send"
                    onclick="sendMessage()">
                    Send
                </button>

            </div>

        </div>

    </div>

</div>


<!-- LOGIN -->

<div
    id="login"
    class="login">

    <div class="login-box">

        <h1>
            Welcome to MyChat
        </h1>

        <p>
            Choose a username
        </p>

        <input
            id="username"
            maxlength="24"
            placeholder="Username">

        <button
            onclick="login()">
            Enter Chat
        </button>

        <div
            id="loginError"
            class="error">
        </div>

    </div>

</div>


<script>

const API =
    "/api/messages";

let username = "";

let currentChannel =
    "general";


/* LOGIN */

function login() {

    const input =
        document.getElementById(
            "username"
        );

    const name =
        input.value.trim();

    if (!name) {

        document.getElementById(
            "loginError"
        ).textContent =
            "Enter a username.";

        return;
    }

    username = name;

    localStorage.setItem(
        "username",
        username
    );

    document.getElementById(
        "login"
    ).style.display =
        "none";

    loadMessages();
}


/* LOAD */

async function loadMessages() {

    try {

        const response =
            await fetch(
                API +
                "?channel=" +
                encodeURIComponent(
                    currentChannel
                )
            );

        const text =
            await response.text();

        let data;

        try {

            data =
                JSON.parse(text);

        } catch {

            throw new Error(
                "Server did not return JSON:\n" +
                text.substring(0,300)
            );
        }

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Server error"
            );
        }

        displayMessages(
            data.messages || []
        );

        setStatus(
            "● Connected",
            true
        );

    } catch(error) {

        console.error(error);

        setStatus(
            "● Error",
            false
        );

        console.error(
            error.message
        );
    }
}


/* DISPLAY */

function displayMessages(
    messages
) {

    const container =
        document.getElementById(
            "messages"
        );

    container.innerHTML = "";

    messages.forEach(
        message => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "message";

            const name =
                document.createElement(
                    "span"
                );

            name.className =
                "name";

            name.textContent =
                message.username;

            const time =
                document.createElement(
                    "span"
                );

            time.className =
                "time";

            time.textContent =
                new Date(
                    message.created_at
                ).toLocaleString();

            const text =
                document.createElement(
                    "div"
                );

            text.className =
                "text";

            text.textContent =
                message.message;

            div.appendChild(name);

            div.appendChild(time);

            div.appendChild(text);

            container.appendChild(div);

        }
    );

    container.scrollTop =
        container.scrollHeight;
}


/* SEND */

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );

    const button =
        document.getElementById(
            "sendButton"
        );

    const message =
        input.value.trim();

    if (!message)
        return;

    button.disabled =
        true;

    try {

        const response =
            await fetch(
                API,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            username:
                                username,

                            channel:
                                currentChannel,

                            message:
                                message

                        })
                }
            );

        const text =
            await response.text();

        let data;

        try {

            data =
                JSON.parse(text);

        } catch {

            throw new Error(
                "Server did not return JSON:\n" +
                text.substring(0,300)
            );
        }

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Could not send message"
            );
        }

        input.value = "";

        await loadMessages();

    } catch(error) {

        alert(
            error.message
        );

        console.error(error);
    }

    button.disabled =
        false;
}


/* CHANNEL */

function changeChannel(
    channel,
    element
) {

    currentChannel =
        channel;

    document
        .querySelectorAll(
            ".channel"
        )
        .forEach(
            item =>
                item.classList.remove(
                    "active"
                )
        );

    element.classList.add(
        "active"
    );

    document.getElementById(
        "channelName"
    ).textContent =
        channel;

    document.getElementById(
        "messageInput"
    ).placeholder =
        "Message #" +
        channel;

    loadMessages();
}


/* STATUS */

function setStatus(
    text,
    good
) {

    const status =
        document.getElementById(
            "status"
        );

    status.textContent =
        text;

    status.style.color =
        good
            ? "#57f287"
            : "#ed4245";
}


/* ENTER */

document
    .getElementById(
        "messageInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }

        }
    );


/* START */

const saved =
    localStorage.getItem(
        "username"
    );

if (saved) {

    username =
        saved;

    document.getElementById(
        "login"
    ).style.display =
        "none";

    loadMessages();
}


setInterval(
    loadMessages,
    3000
);

</script>

</body>

</html>
