<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat</title>

<style>
*{box-sizing:border-box}

:root{
    --bg:#0b0d10;
    --panel:#111419;
    --panel2:#181c22;
    --border:#292f38;
    --text:#edf0f4;
    --muted:#7e8793;
    --accent:#e8eaed;
    --danger:#ff6666;
    --success:#67d38b;
    --radius:12px;
    --text-size:16px;
    --word-spacing:0px;
    --line-spacing:1.45;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

body{
    overflow:hidden;
}

button,input,textarea,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

.header{
    height:64px;
    min-height:64px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel);
    border-bottom:1px solid var(--border);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
}

.logo-icon{
    width:35px;
    height:35px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:var(--panel2);
    border:1px solid var(--border);
}

.channel{
    color:var(--muted);
    font-weight:400;
}

.icon-btn{
    width:39px;
    height:39px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    display:flex;
    gap:11px;
    margin-bottom:17px;
}

.avatar{
    flex:0 0 40px;
    width:40px;
    height:40px;
    display:grid;
    place-items:center;
    border-radius:var(--radius);
    background:var(--panel2);
    border:1px solid var(--border);
    font-weight:700;
}

.message-content{
    min-width:0;
    max-width:min(900px,calc(100vw - 90px));
}

.message-top{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:3px;
}

.username{
    font-weight:700;
}

.time,.edited{
    color:var(--muted);
    font-size:11px;
}

.message-text{
    color:#d8dde4;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    font-size:var(--text-size);
    word-spacing:var(--word-spacing);
    line-height:var(--line-spacing);
}

.message-link{
    color:#7db7ff;
    text-decoration:underline;
    cursor:pointer;
}

.message-image{
    display:block;
    max-width:min(500px,80vw);
    max-height:500px;
    margin-top:8px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:#000;
    object-fit:contain;
    cursor:pointer;
}

/* GAME INVITE */

.game-card{
    width:min(650px,calc(100vw - 70px));
    margin-top:8px;
    background:linear-gradient(145deg,#151a21,#101318);
    border:1px solid #303844;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 10px 35px #0005;
}

.game-card-header{
    padding:15px 17px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
}

.game-title{
    display:flex;
    align-items:center;
    gap:11px;
    font-weight:800;
}

.game-icon{
    width:42px;
    height:42px;
    display:grid;
    place-items:center;
    border-radius:11px;
    background:#202631;
    border:1px solid #363e4b;
    font-size:22px;
}

.game-status{
    color:var(--muted);
    font-size:12px;
}

.game-body{
    padding:16px;
}

.game-description{
    color:#aeb6c2;
    font-size:13px;
    margin-bottom:14px;
}

.game-players{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 12px;
    background:#0d1014;
    border:1px solid var(--border);
    border-radius:10px;
    margin-bottom:12px;
}

.game-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.game-btn{
    border:1px solid #363d49;
    background:#202630;
    color:white;
    border-radius:9px;
    padding:9px 13px;
}

.game-btn:hover{
    filter:brightness(1.15);
}

.game-btn.primary{
    background:#e8eaed;
    color:#111;
}

.game-btn.danger{
    background:#32191c;
    border-color:#6e3035;
    color:#ff8585;
}

.game-btn.success{
    background:#183021;
    border-color:#315f40;
    color:#79db98;
}

.game-board{
    margin-top:14px;
    padding:15px;
    background:#0a0d11;
    border:1px solid var(--border);
    border-radius:12px;
}

.turn-bar{
    padding:10px 12px;
    margin-bottom:12px;
    border-radius:9px;
    background:#171d25;
    color:#cbd2dc;
    font-size:13px;
}

.turn-bar strong{
    color:white;
}

.board{
    display:grid;
    gap:5px;
    justify-content:center;
}

.cell{
    width:58px;
    height:58px;
    border:1px solid #343b46;
    border-radius:8px;
    background:#151a20;
    color:white;
    display:grid;
    place-items:center;
    font-size:25px;
    font-weight:800;
}

.cell:hover{
    background:#202630;
}

.cell:disabled{
    cursor:not-allowed;
    opacity:.75;
}

.game-small{
    color:var(--muted);
    font-size:12px;
    margin-top:9px;
}

/* DICE */

.dice-result{
    font-size:52px;
    text-align:center;
    padding:15px;
}

/* BOARD */

.board-grid{
    display:grid;
    grid-template-columns:repeat(5,48px);
    grid-template-rows:repeat(5,48px);
    gap:4px;
    justify-content:center;
}

.board-cell{
    width:48px;
    height:48px;
    border-radius:7px;
    background:#151a20;
    border:1px solid #303742;
    display:grid;
    place-items:center;
    font-size:20px;
}

/* COMPOSER */

.composer{
    padding:12px 16px 16px;
    background:var(--panel);
    border-top:1px solid var(--border);
}

.composer-box{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:8px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:14px;
}

textarea{
    flex:1;
    min-height:42px;
    max-height:150px;
    resize:none;
    border:0;
    outline:none;
    background:transparent;
    color:white;
    padding:10px;
}

.attach-btn,.send-btn{
    height:42px;
    border:0;
    border-radius:9px;
}

.attach-btn{
    width:42px;
    background:transparent;
    color:#adb5c0;
    font-size:20px;
}

.send-btn{
    padding:0 18px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

/* OVERLAY */

.overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000b;
    z-index:100;
}

.overlay.show{
    display:flex;
}

.panel{
    width:min(600px,calc(100vw - 25px));
    max-height:calc(100vh - 25px);
    overflow-y:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px;
    border-bottom:1px solid var(--border);
}

.panel-header h2{
    margin:0;
}

.panel-body{
    padding:18px;
}

.category{
    margin-bottom:12px;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    background:var(--panel2);
}

.category-title{
    width:100%;
    padding:14px;
    border:0;
    background:transparent;
    color:var(--text);
    display:flex;
    justify-content:space-between;
    font-weight:700;
    text-align:left;
}

.category-body{
    display:none;
    padding:0 14px 14px;
}

.category.open .category-body{
    display:block;
}

.setting{
    margin-top:14px;
}

.setting label{
    display:block;
    margin-bottom:7px;
    color:#aab2bd;
    font-size:13px;
}

.setting input,.setting select{
    width:100%;
    padding:10px;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
    background:#101419;
    color:white;
}

.setting input[type=range]{
    padding:0;
}

.setting-value{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.save-btn{
    width:100%;
    margin-top:8px;
    padding:12px;
    border:0;
    border-radius:9px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

.danger-zone{
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid #402529;
}

.danger-title{
    color:var(--danger);
    font-weight:700;
    margin-bottom:7px;
}

.danger-zone p{
    color:var(--muted);
}

.danger-btn{
    width:100%;
    padding:12px;
    border-radius:9px;
    border:1px solid #743333;
    background:#241719;
    color:#ff8585;
}

/* GAME CREATOR */

.game-list{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:9px;
}

.game-choice{
    padding:15px;
    border-radius:12px;
    background:#171c23;
    border:1px solid var(--border);
    color:white;
    text-align:left;
}

.game-choice:hover{
    background:#202630;
}

.game-choice-icon{
    font-size:28px;
    margin-bottom:8px;
}

.game-choice strong{
    display:block;
}

.game-choice small{
    color:var(--muted);
}

.field{
    margin-top:14px;
}

.field label{
    display:block;
    color:#aab2bd;
    font-size:13px;
    margin-bottom:6px;
}

.field input,.field select{
    width:100%;
    padding:10px;
    border-radius:9px;
    border:1px solid var(--border);
    background:#101419;
    color:white;
}

.context-menu{
    position:fixed;
    display:none;
    width:160px;
    padding:5px;
    z-index:200;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:9px;
}

.context-menu.show{
    display:block;
}

.context-menu button{
    width:100%;
    padding:9px 10px;
    text-align:left;
    border:0;
    background:transparent;
    color:white;
}

.delete-option{
    color:#ff7777!important;
}

.image-viewer{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000f;
    z-index:300;
}

.image-viewer.show{
    display:flex;
}

.full-image{
    max-width:95vw;
    max-height:90vh;
}

.back-image{
    position:absolute;
    top:18px;
    left:18px;
    padding:10px 16px;
    border-radius:9px;
    border:1px solid #3a4049;
    background:#171b21;
    color:white;
}

.dialog{
    width:min(450px,calc(100vw - 30px));
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
}

.dialog h2{
    margin-top:0;
}

.dialog p{
    color:#aab2bd;
    line-height:1.5;
}

.dialog-buttons{
    display:flex;
    gap:8px;
    justify-content:flex-end;
}

.dialog-buttons button{
    padding:10px 16px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#20252c;
    color:white;
}

.dialog-buttons .danger{
    background:#6b2929;
}

.empty{
    height:100%;
    display:grid;
    place-items:center;
    color:#656d78;
    text-align:center;
}

.empty strong{
    display:block;
    color:#aab2bd;
    margin-bottom:5px;
}

@media(max-width:600px){
    .messages{
        padding:15px 10px;
    }

    .channel{
        display:none;
    }

    .message-content{
        max-width:calc(100vw - 70px);
    }

    .game-card{
        width:100%;
    }

    .cell{
        width:46px;
        height:46px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">
    <div class="logo">
        <div class="logo-icon">💬</div>
        <span>Chat</span>
        <span class="channel"># general</span>
    </div>

    <div style="display:flex;gap:7px">
        <button class="icon-btn" id="gamesBtn" title="Games">🎮</button>
        <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
    </div>
</header>

<main class="messages" id="messages"></main>

<div class="composer">
    <div class="composer-box">

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
        >

        <button class="attach-btn" id="attachBtn">＋</button>

        <textarea
            id="messageInput"
            rows="1"
            placeholder="Message #general"
        ></textarea>

        <button class="send-btn" id="sendBtn">Send</button>

    </div>
</div>

</div>


<!-- GAME CREATOR -->

<div class="overlay" id="gamesOverlay">

<div class="panel">

<div class="panel-header">
    <h2>🎮 Games</h2>
    <button class="icon-btn" id="closeGames">×</button>
</div>

<div class="panel-body">

<div id="gameCreator">

<p style="color:#89929e">
Choose a game. You can only host one game at a time.
</p>

<div class="game-list">

<button class="game-choice" data-game="tictactoe">
    <div class="game-choice-icon">❌</div>
    <strong>Tic Tac Toe</strong>
    <small>2 players</small>
</button>

<button class="game-choice" data-game="connect4">
    <div class="game-choice-icon">🔴</div>
    <strong>Connect Four</strong>
    <small>2 players</small>
</button>

<button class="game-choice" data-game="dice">
    <div class="game-choice-icon">🎲</div>
    <strong>Dice Duel</strong>
    <small>2–8 players</small>
</button>

<button class="game-choice" data-game="reaction">
    <div class="game-choice-icon">⚡</div>
    <strong>Reaction</strong>
    <small>2–8 players</small>
</button>

<button class="game-choice" data-game="board">
    <div class="game-choice-icon">♟️</div>
    <strong>Board Race</strong>
    <small>2–8 players</small>
</button>

</div>

<div id="gameSetup" style="display:none">

<div class="field">
<label>Game</label>
<input id="selectedGameName" readonly>
</div>

<div class="field">
<label>Maximum players</label>
<select id="maxPlayers"></select>
</div>

<div style="display:flex;gap:8px;margin-top:15px">

<button class="game-btn" id="cancelGameSetup">
Cancel
</button>

<button class="game-btn primary" id="createGame">
Create game
</button>

</div>

</div>

</div>

</div>
</div>


<!-- SETTINGS -->

<div class="overlay" id="settingsOverlay">

<div class="panel">

<div class="panel-header">
    <h2>Settings</h2>
    <button class="icon-btn" id="closeSettings">×</button>
</div>

<div class="panel-body">

<div class="category open">
<button class="category-title">
<span>👤 Profile</span><span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Your name</label>
<input id="usernameInput" maxlength="24">
</div>

<div class="setting">
<label>Device ID</label>
<input id="deviceIdInput" readonly>
</div>

</div>
</div>


<div class="category">
<button class="category-title">
<span>📝 Text</span><span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Text size</label>
<input id="textSize" type="range" min="12" max="24" step="1">
<div class="setting-value" id="textSizeValue"></div>
</div>

<div class="setting">
<label>Word spacing</label>
<input id="wordSpacing" type="range" min="0" max="12">
<div class="setting-value" id="wordSpacingValue"></div>
</div>

<div class="setting">
<label>Line spacing</label>
<input id="lineSpacing" type="range" min="1" max="2" step=".05">
<div class="setting-value" id="lineSpacingValue"></div>
</div>

</div>
</div>


<div class="category">
<button class="category-title">
<span>💬 Chat</span><span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Refresh rate</label>
<select id="refreshRate">
<option value="10000">10 seconds</option>
<option value="5000">5 seconds</option>
<option value="3000">3 seconds</option>
<option value="2000">2 seconds</option>
<option value="1000">1 second</option>
<option value="500">0.5 seconds</option>
<option value="100">0.1 seconds</option>
</select>
</div>

<div class="setting">
<label>Show timestamps</label>
<select id="showTimestamps">
<option value="true">On</option>
<option value="false">Off</option>
</select>
</div>

<div class="setting">
<label>Compact messages</label>
<select id="compactMessages">
<option value="false">Off</option>
<option value="true">On</option>
</select>
</div>

</div>
</div>


<div class="category">
<button class="category-title">
<span>🎨 Appearance</span><span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Theme</label>
<select id="themeSelect">
<option value="dark">Dark</option>
<option value="midnight">Midnight</option>
<option value="slate">Slate</option>
<option value="black">Pure Black</option>
<option value="blue">Dark Blue</option>
<option value="purple">Dark Purple</option>
<option value="green">Dark Green</option>
<option value="red">Dark Red</option>
<option value="gray">Classic Gray</option>
<option value="light">Light</option>
<option value="oled">OLED</option>
</select>
</div>

<div class="setting">
<label>Corner roundness</label>
<input id="cornerRadius" type="range" min="0" max="25">
<div class="setting-value" id="cornerRadiusValue"></div>
</div>

<div class="setting">
<label>UI scale</label>
<input id="uiScale" type="range" min=".8" max="1.2" step=".05">
<div class="setting-value" id="uiScaleValue"></div>
</div>

</div>
</div>


<div class="category">
<button class="category-title">
<span>⚙️ Behavior</span><span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Enter to send</label>
<select id="enterToSend">
<option value="true">On</option>
<option value="false">Off</option>
</select>
</div>

<div class="setting">
<label>Auto-scroll</label>
<select id="autoScroll">
<option value="true">On</option>
<option value="false">Off</option>
</select>
</div>

<div class="setting">
<label>Confirm before deleting</label>
<select id="confirmDelete">
<option value="true">On</option>
<option value="false">Off</option>
</select>
</div>

</div>
</div>


<button class="save-btn" id="saveSettings">
Save settings
</button>


<div class="danger-zone">

<div class="danger-title">⚠ Danger Zone</div>

<p>
Remove every message from the chat permanently.
This affects everyone.
</p>

<button class="danger-btn" id="removeEverything">
Remove everything
</button>

</div>

</div>
</div>
</div>


<!-- CONTEXT MENU -->

<div class="context-menu" id="contextMenu">

<button id="editMessage">Edit</button>
<button class="delete-option" id="deleteMessage">Delete</button>

</div>


<!-- IMAGE VIEWER -->

<div class="image-viewer" id="imageViewer">

<button class="back-image" id="backImage">
← Back
</button>

<img class="full-image" id="fullImage">

</div>


<!-- CONFIRM -->

<div class="overlay" id="dialogOverlay">

<div class="dialog">

<h2 id="dialogTitle">Confirm</h2>

<p id="dialogText"></p>

<div class="dialog-buttons">

<button id="dialogCancel">Cancel</button>

<button class="danger" id="dialogConfirm">
Yes
</button>

</div>

</div>
</div>


<script>

const API_URL="/api/messages";
const CHANNEL="general";

/*
=========================================================
DEVICE
=========================================================
*/

let deviceId=localStorage.getItem("chat_device_id");

if(!deviceId){

    deviceId=
        crypto.randomUUID();

    localStorage.setItem(
        "chat_device_id",
        deviceId
    );
}


/*
=========================================================
SETTINGS
=========================================================
*/

const defaults={
    username:"",
    theme:"dark",
    refreshRate:500,
    showTimestamps:true,
    compactMessages:false,
    textSize:16,
    wordSpacing:0,
    lineSpacing:1.45,
    cornerRadius:12,
    uiScale:1,
    enterToSend:true,
    autoScroll:true,
    confirmDelete:true
};

function getSetting(key){

    const value=
        localStorage.getItem(
            "chat_"+key
        );

    if(value===null)
        return defaults[key];

    if(
        value==="true"||
        value==="false"
    )
        return value==="true";

    const number=Number(value);

    return Number.isNaN(number)
        ?value
        :number;
}

let settings={};

Object.keys(defaults).forEach(
    key=>{
        settings[key]=getSetting(key);
    }
);


/*
=========================================================
ELEMENTS
=========================================================
*/

const messagesEl=

    const info=
        GAME_INFO[selectedGameType];

        Number(maxPlayers.value);

    if(max<info.min){

        alert(
            "This game requires at least "+
            info.min+
            " players."
        );

        return;
    }

    const active=
        Object.values(games)
        .find(game=>
            game.host_device_id===deviceId &&
            !game.finished
        );

    if(active){

        myHostedGame=active.id;

        alert(
            "You are already hosting a game."
        );

        return;
    }

    const id=
        crypto.randomUUID();

    const state={
        type:"game",
        action:"create",
        game_id:id,
        game_type:selectedGameType,
        host_device_id:deviceId,
        host_name:settings.username,
        max_players:max,
        players:[
            {
                device_id:deviceId,
                username:settings.username
            }
        ],
        started:false,
        finished:false,
        turn_index:0,
        board:createInitialBoard(
            selectedGameType
        ),
        values:{},
        created_at:Date.now()
    };

    myHostedGame=id;

    myJoinedGames.add(id);

    await writeGameState(state);

    gameSetup.style.display="none";
    gameCreator.style.display="block";

    gamesOverlay.classList.remove("show");

    await loadMessages();
};


/*
=========================================================
GAME STATE MESSAGE
=========================================================
*/

async function writeGameState(state){

    const encoded=
        GAME_PREFIX+
        JSON.stringify(state);

    const response=
        await fetch(API_URL,{
            method:"POST",
            headers:{
                "Content-Type":
                    "application/json"
            },
            body:JSON.stringify({
                username:"SYSTEM",
                channel:CHANNEL,
                message:encoded,
                image:null,
                device_id:
                    "GAME_"+state.game_id
            })
        });

    const data=
        await response.json();

    if(!response.ok){

        throw new Error(
            data.error||
            "Could not save game state."
        );
    }

    return data.message;
}


/*
=========================================================
PARSE GAME STATES
=========================================================
*/

function parseGameMessage(message){

    if(
        !message.message||
        !message.message.startsWith(
            GAME_PREFIX
        )
    ){
        return null;
    }

    try{

        return JSON.parse(
            message.message.substring(
                GAME_PREFIX.length
            )
        );

    }catch{

        return null;
    }
}


/*
=========================================================
REFRESH GAME DATA
=========================================================
*/

function refreshGameData(){

    games={};

    currentMessages.forEach(message=>{

        const state=
            parseGameMessage(message);

        if(!state)
            return;

        if(state.finished)
            return;

        /*
        The newest game state is the last one.
        */
        games[state.game_id]={
            ...state,
            message_id:message.id
        };

    });

    /*
    Recalculate our hosted game.
    */
    myHostedGame=null;

    for(const game of Object.values(games)){

        if(
            game.host_device_id===deviceId
        ){

            myHostedGame=
                game.game_id;
        }
    }

    /*
    Remove games where nobody is actually
    still playing.
    */
    for(const game of Object.values(games)){

        if(
            !game.players||
            game.players.length===0
        ){

            cleanupGame(game);
        }
    }
}


/*
=========================================================
GAME ACTIONS
=========================================================
*/

async function gameAction(
    game,
    action,
    extra={}
){

    if(!game)
        return;

    const state={
        ...game,
        ...extra,
        action,
        previous_message_id:
            game.message_id,
        updated_at:Date.now()
    };

    /*
    Never allow someone to start a game
    if minimum players are not present.
    */
    if(
        action==="start" &&
        state.players.length<
        GAME_INFO[state.game_type].min
    ){

        alert(
            "You need at least "+
            GAME_INFO[state.game_type].min+
            " players to start."
        );

        return;
    }

    await writeGameState(state);

    await loadMessages();
}


/*
=========================================================
JOIN
=========================================================
*/

async function joinGame(game){

    if(game.started){

        alert(
            "This game has already started."
        );

        return;
    }

    if(
        game.players.some(
            player=>
                player.device_id===deviceId
        )
    ){

        return;
    }

    if(
        game.players.length>=
        game.max_players
    ){

        alert("This game is full.");

        return;
    }

    const players=[
        ...game.players,
        {
            device_id:deviceId,
            username:settings.username
        }
    ];

    myJoinedGames.add(game.game_id);

    await gameAction(
        game,
        "join",
        {
            players
        }
    );
}


/*
=========================================================
LEAVE
=========================================================
*/

async function leaveGame(game){

    if(!game)
        return;

    const players=
        game.players.filter(
            player=>
                player.device_id!==deviceId
        );

    /*
    If the host leaves, the game is removed.
    */
    if(
        game.host_device_id===deviceId
    ){

        await forceQuitGame(game);

        return;
    }

    /*
    If nobody remains, remove game.
    */
    if(players.length===0){

        await forceQuitGame(game);

        return;
    }

    await gameAction(
        game,
        "leave",
        {
            players
        }
    );

    myJoinedGames.delete(
        game.game_id
    );
}


/*
=========================================================
FORCE QUIT
=========================================================
*/

async function forceQuitGame(game){

    if(!game)
        return;

    if(
        game.host_device_id!==deviceId
    ){

        alert(
            "Only the host can force quit this game."
        );

        return;
    }

    /*
    Mark the game finished first.
    This makes every client hide it.
    */
    const finished={
        ...game,
        finished:true,
        action:"force_quit",
        players:[],
        updated_at:Date.now()
    };

    try{

        /*
        Create a final invisible state.
        */
        await writeGameState(finished);

        /*
        Then delete all invisible messages
        belonging to this game.
        */
        await deleteGameMessages(
            game.game_id
        );

    }catch(error){

        alert(
            "Failed to force quit:\n\n"+
            error.message
        );

        return;
    }

    games[game.game_id]=null;

    myHostedGame=null;

    myJoinedGames.delete(
        game.game_id
    );

    await loadMessages();
}


/*
=========================================================
DELETE ALL GAME MESSAGES
=========================================================
*/

async function deleteGameMessages(gameId){

    /*
    We cannot send arbitrary SQL from the browser.
    Instead request DELETE for every known game
    state message through the API.
    */

    const gameMessages=
        currentMessages.filter(message=>{

            const state=
                parseGameMessage(message);

            return state &&
                state.game_id===gameId;
        });

    for(
        const message of gameMessages
    ){

        try{

            await fetch(
                API_URL,
                {
                    method:"DELETE",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        id:message.id,

                        /*
                        Game messages are owned by
                        their game device id.
                        */
                        device_id:
                            message.device_id
                    })
                }
            );

        }catch(error){

            console.warn(
                "Could not delete game message",
                error
            );
        }
    }
}

CLEANUP

function createInitialBoard(type){

    if(type==="tictactoe")
        return Array(9).fill("");

        return Array(42).fill("");

    if(type==="board")

/*
=========================================================
TURN
=========================================================
*/

function getCurrentPlayer(game){

    if(
        !game.players||
        !game.players.length
    )
        return null;

    return game.players[
        game.turn_index%
        game.players.length
    ];
}

function isMyTurn(game){

    const player=
        getCurrentPlayer(game);

    return !!player &&
        player.device_id===deviceId;
}

function nextTurn(game){

    return (
        game.turn_index+1
    )%game.players.length;
}


/*
=========================================================
TIC TAC TOE
=========================================================
*/

async function playTicTacToe(
    game,
    index
){

    if(!game.started)
        return;

    if(!isMyTurn(game))
        return;

    if(game.board[index])
        return;

    const board=[
        ...game.board
    ];

    const symbol=
        game.turn_index%2===0
        ?"X"
        :"O";

    board[index]=symbol;

    const winner=
        checkTicTacToe(board);

    if(winner){

        await gameAction(
            game,
            "finish",
            {
                board,
                finished:true,
                winner
            }
        );

        await deleteGameMessages(
            game.game_id
        );

        return;
    }

    if(
        board.every(cell=>cell)
    ){

        await gameAction(
            game,
            "finish",
            {
                board,
                finished:true,
                winner:"draw"
            }
        );

        await deleteGameMessages(
            game.game_id
        );

        return;
    }

    await gameAction(
        game,
        "move",
        {
            board,
            turn_index:
                nextTurn(game)
        }
    );
}

function checkTicTacToe(board){

    const lines=[
        [0,1,2],
        [3,4,5],
        [6,7,8],
        [0,3,6],
        [1,4,7],
        [2,5,8],
        [0,4,8],
        [2,4,6]
    ];

    for(
        const line of lines
    ){

        const [
            a,b,c
        ]=line;

        if(
            board[a] &&
            board[a]===board[b] &&
            board[a]===board[c]
        )
            return board[a];
    }

    return null;
}


/*
=========================================================
CONNECT FOUR
=========================================================
*/

async function playConnect4(
    game,
    column
){

    if(!game.started)
        return;

    if(!isMyTurn(game))
        return;

    const board=[
        ...game.board
    ];

    let placed=-1;

    for(
        let row=5;
        row>=0;
        row--
    ){

        const index=
            row*7+column;

        if(!board[index]){

            board[index]=
                game.turn_index%2===0
                ?"🔴"
                :"🟡";

            placed=index;

            break;
        }
    }

    if(placed===-1)
        return;

    const winner=
        checkConnect4(board);

    if(winner){

        await gameAction(
            game,
            "finish",
            {
                board,
                finished:true,
                winner
            }
        );

        await deleteGameMessages(
            game.game_id
        );

        return;
    }

    await gameAction(
        game,
        "move",
        {
            board,
            turn_index:
                nextTurn(game)
        }
    );
}

function checkConnect4(board){

    const directions=[
        [1,0],
        [0,1],
        [1,1],
        [1,-1]
    ];

    for(
        let row=0;
        row<6;
        row++
    ){

        for(
            let col=0;
            col<7;
            col++
        ){

            const index=
                row*7+col;

            const value=
                board[index];

            if(!value)
                continue;

            for(
                const [
                    dr,dc
                ] of directions
            ){

                let count=1;

                for(
                    let step=1;
                    step<4;
                    step++
                ){

                    const r=
                        row+dr*step;

                    const c=
                        col+dc*step;

                    if(
                        r<0||
                        r>=6||
                        c<0||
                        c>=7
                    )
                        break;

                    if(
                        board[
                            r*7+c
                        ]===value
                    )
                        count++;
                    else
                        break;
                }

                if(count>=4)
                    return value;
            }
        }
    }

    return null;
}

DICE

async function rollDice(game){

    if(!game.started)
        return;

    if(!isMyTurn(game))
        return;

    const roll=
        Math.floor(
            Math.random()*6
        )+1;

    const values={
        ...(game.values||{})
    };

    values[deviceId]=roll;

    await gameAction(
        game,
        "roll",
        {
            values,
            turn_index:
                nextTurn(game)
        }
    );
}


/*
=========================================================
REACTION
=========================================================
*/

async function reaction(game){

    if(!game.started)
        return;

    if(!isMyTurn(game))
        return;

    const now=Date.now();

    const start=
        Number(
            game.values?.start||0
        );

    if(
        start &&
        now-start<700
    ){

        return;
    }

    const values={
        ...(game.values||{})
    };

    values.last=
        deviceId;

    values.last_time=
        now;

    values.start=
        now+
        Math.floor(
            Math.random()*2500
        );

    await gameAction(
        game,
        "reaction",
        {
            values,
            turn_index:
                nextTurn(game)
        }
    );
}


/*
=========================================================
BOARD RACE
=========================================================
*/

async function moveBoard(
    game
){

    if(!game.started)
        return;

    if(!isMyTurn(game))
        return;

    const values={
        ...(game.values||{})
    };

    const current=
        Number(
            values[deviceId]||0
        );

    values[deviceId]=
        Math.min(
            24,
            current+
            Math.floor(
                Math.random()*3
            )+1
        );

    const winner=
        Object.entries(values)
        .find(
            ([id,pos])=>
                Number(pos)>=24
        );

    if(winner){

        await gameAction(
            game,
            "finish",
            {
                values,
                finished:true,
                winner:winner[0]
            }
        );

        await deleteGameMessages(
            game.game_id
        );

        return;
    }

    await gameAction(
        game,
        "move",
        {
            values,
            turn_index:
                nextTurn(game)
        }
    );
}

function createGameCard(game){

    const info=
        GAME_INFO[
            game.game_type
        ];

    const card=
        document.createElement("div");

    card.className="game-card";

    const header=
        document.createElement("div");

    header.className=

    const title=
        document.createElement("div");

    title.innerHTML=`
        <div class="game-icon">
            ${info.icon}
        </div>
        <div>
            <div>
                ${escapeHtml(info.name)}
            </div>
            <div class="game-status">
                Hosted by
                ${escapeHtml(game.host_name)}
            </div>
        </div>
    `;

    const status=
        document.createElement("div");

    status.className="game-status";

    status.textContent=
        game.started
        ?"▶ Running"
        :"Waiting";

    header.appendChild(title);
    header.appendChild(status);

    card.appendChild(header);

    const body=
        document.createElement("div");

    body.className="game-body";

    const description=
        document.createElement("div");

    description.className=
        "game-description";

    if(!game.started){

        description.textContent=
            game.host_name+
            " invited you to a game of "+
            info.name+
            ". Join before the host starts.";

    }else{

        description.textContent=
            "Game in progress. You can spectate, but only joined players can play.";
    }

    body.appendChild(description);

    const players=
        document.createElement("div");

    players.className="game-players";

    players.innerHTML=`
        <span>
            👥
            ${game.players.length}
            /${game.max_players}
            players
        </span>
        <span>
            ${game.started
                ?"Started"
                :"Waiting for players"}
        </span>
    `;

    body.appendChild(players);


    const buttons=
        document.createElement("div");

    buttons.className="game-buttons";


    const isPlayer=
        game.players.some(
            p=>
                p.device_id===deviceId
        );


    if(!game.started){

        if(!isPlayer){

            const join=
                document.createElement("button");

            join.className=
                "game-btn success";

            join.textContent="Join";

            join.onclick=async()=>{
                await joinGame(game);
            };

            buttons.appendChild(join);

        }else{

            const leave=
                document.createElement("button");

            leave.className=
                "game-btn";

            leave.textContent="Leave";

            leave.onclick=async()=>{
                await leaveGame(game);
            };

            buttons.appendChild(leave);
        }


        if(
            game.host_device_id===deviceId
        ){

            const start=
                document.createElement("button");

            start.className=
                "game-btn primary";

            const min=
                info.min;

            start.textContent=
                game.players.length>=min
                ?"Start game"
                :"Need "+min+" players";

            start.disabled=
                game.players.length<min;

            start.onclick=async()=>{
                await startGame(game);
            };

            buttons.appendChild(start);


            const quit=
                document.createElement("button");

            quit.className=
                "game-btn danger";

            quit.textContent=
                "Force quit";

            quit.onclick=async()=>{
                await forceQuitGame(game);
            };

            buttons.appendChild(quit);
        }

    }else{

        /*
        Leave is available after starting too.
        */
        if(isPlayer){

            const leave=
                document.createElement("button");

            leave.className=
                "game-btn";

            leave.textContent="Leave";

            leave.onclick=async()=>{
                await leaveGame(game);
            };

            buttons.appendChild(leave);
        }

        if(
            game.host_device_id===deviceId
        ){

            const quit=
                document.createElement("button");

            quit.className=
                "game-btn danger";

            quit.textContent=
                "Force quit";

            quit.onclick=async()=>{
                await forceQuitGame(game);
            };

            buttons.appendChild(quit);
        }
    }

    body.appendChild(buttons);


    /*
    PLAY BOARD
    */

    if(game.started){

        const board=
            document.createElement("div");

        board.className="game-board";

        const turn=
            getCurrentPlayer(game);

        const turnBar=
            document.createElement("div");

        turnBar.className="turn-bar";

        if(turn){

            turnBar.innerHTML=
                "Turn: <strong>"+
                escapeHtml(
                    turn.username
                )+
                "</strong>"+
                (
                    turn.device_id===deviceId
                    ?" — Your turn"
                    :""
                );

        }

        board.appendChild(turnBar);


        renderGameBoard(
            game,
            board,
            isPlayer
        );

        body.appendChild(board);
    }

    card.appendChild(body);

    return card;
}


/*
=========================================================
RENDER GAME BOARD
=========================================================
*/

function renderGameBoard(
    game,
    container,
    isPlayer
){

    if(game.game_type==="tictactoe"){

        const grid=
            document.createElement("div");

        grid.className="board";

        grid.style.gridTemplateColumns=
            "repeat(3,58px)";

        game.board.forEach(
            (value,index)=>{

                const button=
                    document.createElement("button");

                button.className="cell";

                button.textContent=value;

                button.disabled=
                    !isPlayer||
                    !isMyTurn(game)||
                    !!value;

                button.onclick=async()=>{
                    await playTicTacToe(
                        game,
                        index
                    );
                };

                grid.appendChild(button);
            }
        );

        container.appendChild(grid);

        return;
    }


    if(game.game_type==="connect4"){

        const grid=
            document.createElement("div");

        grid.className="board";

        grid.style.gridTemplateColumns=
            "repeat(7,42px)";

        for(
            let col=0;
            col<7;
            col++
        ){

            const button=
                document.createElement("button");

            button.className="game-btn";

            button.textContent="↓";

            button.disabled=
                !isPlayer||
                !isMyTurn(game);

            button.onclick=async()=>{
                await playConnect4(
                    game,
                    col
                );
            };

            grid.appendChild(button);
        }

        game.board.forEach(
            value=>{

                const cell=
                    document.createElement("div");

                cell.className="board-cell";

                cell.style.width="42px";
                cell.style.height="42px";

                cell.textContent=value;

                grid.appendChild(cell);
            }
        );

        container.appendChild(grid);

        return;
    }


    if(game.game_type==="dice"){

        const result=
            document.createElement("div");

        result.className=
            "dice-result";

        const values=
            game.values||{};

        const myRoll=
            values[deviceId];

        result.textContent=
            myRoll||
            "🎲";

        container.appendChild(result);

        const button=
            document.createElement("button");

        button.className=
            "game-btn primary";

        button.textContent=
            "Roll dice";

        button.disabled=
            !isPlayer||
            !isMyTurn(game);

        button.onclick=async()=>{
            await rollDice(game);
        };

        container.appendChild(button);

        return;
    }


    if(game.game_type==="reaction"){

        const button=
            document.createElement("button");

        button.className=
            "game-btn primary";

        button.textContent=
            "⚡ REACT";

        button.disabled=
            !isPlayer||
            !isMyTurn(game);

        button.onclick=async()=>{
            await reaction(game);
        };

        container.appendChild(button);

        return;
    }


    if(game.game_type==="board"){

        const grid=
            document.createElement("div");

        grid.className="board-grid";

        const values=
            game.values||{};

        const positions=
            Object.entries(values);

        for(
            let i=0;
            i<25;
            i++
        ){

            const cell=
                document.createElement("div");

            cell.className=
                "board-cell";

            const playersHere=
                positions.filter(
                    ([id,pos])=>
                        Number(pos)===i
                );

            cell.textContent=
                playersHere.length
                ?"●"
                :"";

            grid.appendChild(cell);
        }

        container.appendChild(grid);

        const move=
            document.createElement("button");

        move.className=
            "game-btn primary";

        move.style.marginTop="10px";

        move.textContent=
            "🎲 Roll & Move";

        move.disabled=
            !isPlayer||
            !isMyTurn(game);

        move.onclick=async()=>{
            await moveBoard(game);
        };

        container.appendChild(move);

        return;
    }
}


/*

RENDER CHAT
=========================================================
*/

function renderMessages(){

    const wasBottom=
        messagesEl.scrollHeight-
        messagesEl.scrollTop-
        messagesEl.clientHeight<100;

    messagesEl.innerHTML="";

    refreshGameData();

    const visibleMessages=
        currentMessages.filter(
            message=>
                !parseGameMessage(message)
        );

    if(
        !visibleMessages.length &&
        !Object.keys(games).length
    ){

        messagesEl.innerHTML=`
            <div class="empty">
                <div>
                    <strong>No messages yet</strong>
                    Be the first to send something.
                </div>
            </div>
        `;
    }


    /*
    Games are inserted at their actual
    chat position instead of being glued
    to the top.
    */
    currentMessages.forEach(
        message=>{

            const game=
                parseGameMessage(message);

            if(game){

                /*
                Only display the newest
                state of each game.
                */
                const latest=
                    games[game.game_id];

                if(
                    latest &&
                    latest.message_id===
                    message.id
                ){

                    messagesEl.appendChild(
                        createGameMessage(
                            latest
                        )
                    );
                }

                return;
            }

            messagesEl.appendChild(
                createNormalMessage(
                    message
                )
            );
        }
    );


    if(
        wasBottom &&
        settings.autoScroll
    ){

        messagesEl.scrollTop=
            messagesEl.scrollHeight;
    }
}

            message.image;

        img.onclick=()=>{
            openImage(
                message.image

        content.appendChild(img);
    }

    item.appendChild(avatar);
    item.appendChild(content);


    if(
        message.device_id &&
        message.device_id===deviceId
    ){

        item.addEventListener(
            "contextmenu",
            event=>{

                event.preventDefault();

                selectedMessage=
                    message;

                        event.clientX,
                        window.innerWidth-170
                    )+"px";

                    Math.min(
                        event.clientY,
                        window.innerHeight-100
                    )+"px";

                contextMenu.classList.add(
                    "show"
                );
            }
        );
    }

    return item;
}

/*
=========================================================
IMAGE
=========================================================
*/

function resizeImage(file){

    return new Promise(
        (resolve,reject)=>{

            const reader=
                new FileReader();

            reader.onload=()=>{

                const img=
                    new Image();

                img.onload=()=>{

                    let width=
                        img.width;

                    let height=
                        img.height;

                    const max=1500;

                    if(
                        width>max||
                        height>max
                    ){

                        const scale=
                            Math.min(
                                max/width,
                                max/height
                            );

                        width=
                            Math.round(
                                width*scale
                            );

                        height=
                            Math.round(
                                height*scale
                            );
                    }

                    const canvas=
                        document.createElement(
                            "canvas"
                        );

                    canvas.width=width;
                    canvas.height=height;

                    canvas
                        .getContext("2d")
                        .drawImage(
                            img,
                            0,
                            0,
                            width,
                            height
                        );

                    resolve(
                        canvas.toDataURL(
                            "image/jpeg",
                            .78
                        )
                    );
                };

                img.onerror=reject;

                img.src=
                    reader.result;
            };

            reader.onerror=reject;

            reader.readAsDataURL(file);
        }
    );
}

/*
=========================================================
LINK SUPPORT
=========================================================
*/

function appendTextWithLinks(
    element,
    text
){

    const urlRegex=
        /(https?:\/\/[^\s]+)/g;

    let last=0;

    text.replace(
        urlRegex,
        (url,offset)=>{

            element.appendChild(
                document.createTextNode(
                    text.substring(
                        last,
                        offset
                    )
                )
            );

            const link=
                document.createElement(
                    "a"
                );

            link.className=
                "message-link";

            link.href=url;

            link.target="_blank";

            link.rel=
                "noopener noreferrer";

            link.textContent=url;

            element.appendChild(link);

            last=
                offset+
                url.length;

            return url;
        }
    );

    element.appendChild(
        document.createTextNode(
            text.substring(last)
        )
    );
}

HELPERS
=========================================================

function formatTime(date){

    if(!date)
        return "";

    return new Date(date)
        .toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );
}

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}
