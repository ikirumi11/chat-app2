<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>
<title>Game Chat</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#0d0f14;
    color:#fff;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

#app{
    width:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

#header{
    height:60px;
    min-height:60px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    background:#151922;
    border-bottom:1px solid #292e39;
}

#title{
    font-size:18px;
    font-weight:800;
}

#channel{
    opacity:.55;
    font-size:13px;
    margin-left:8px;
}

.headerButtons{
    display:flex;
    gap:8px;
}

.headerButton{
    border:0;
    border-radius:12px;
    padding:9px 12px;
    background:#242a36;
    color:#fff;
}

.headerButton:hover{
    background:#303746;
}

/* CHAT */

#messages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:15px;
}

.message{
    display:flex;
    gap:10px;
    margin-bottom:13px;
}

.avatar{
    width:40px;
    height:40px;
    min-width:40px;
    border-radius:12px;
    background:#5865f2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
}

.messageBody{
    min-width:0;
}

.messageName{
    font-size:13px;
    font-weight:800;
    margin-bottom:3px;
}

.messageText{
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    background:#181d26;
    border:1px solid #282e39;
    padding:9px 12px;
    border-radius:13px;
}

/*
 Invisible game-server messages MUST NEVER be rendered
 as normal messages.
*/
.game-server-message{
    display:none !important;
}

/* COMPOSER */

#composer{
    min-height:70px;
    padding:10px;
    display:flex;
    gap:8px;
    background:#151922;
    border-top:1px solid #292e39;
}

#messageInput{
    flex:1;
    min-width:0;
    resize:none;
    border:1px solid #303746;
    outline:none;
    border-radius:14px;
    background:#0d1118;
    color:#fff;
    padding:12px;
}

#messageInput:focus{
    border-color:#5865f2;
}

.composerButton{
    width:48px;
    min-width:48px;
    border:0;
    border-radius:14px;
    background:#242a36;
    color:#fff;
}

#sendButton{
    background:#5865f2;
}

/* GAMES */

#gamesPanel{
    position:fixed;
    left:50%;
    bottom:78px;
    width:min(440px,calc(100% - 20px));
    max-height:min(70vh,600px);
    transform:translate(-50%,calc(100% + 30px));
    opacity:0;
    pointer-events:none;
    transition:
        transform .25s ease,
        opacity .25s ease;
    background:#151922;
    border:1px solid #303746;
    border-radius:18px;
    box-shadow:0 20px 60px #0008;
    overflow:auto;
    z-index:100;
}

#gamesPanel.open{
    transform:translate(-50%,0);
    opacity:1;
    pointer-events:auto;
}

.gamesHeader{
    position:sticky;
    top:0;
    z-index:2;
    padding:14px;
    background:#151922;
    border-bottom:1px solid #292e39;
    font-size:18px;
    font-weight:800;
}

.gameList{
    padding:10px;
    display:grid;
    gap:8px;
}

.gameButton{
    text-align:left;
    border:1px solid #303746;
    border-radius:14px;
    background:#1c222d;
    color:#fff;
    padding:13px;
}

.gameButton:hover{
    background:#252c38;
}

.gameTitle{
    font-weight:800;
}

.gameDescription{
    margin-top:3px;
    opacity:.6;
    font-size:12px;
}

/* GAME CARDS */

.gameCard{
    margin:10px 0 16px 50px;
    max-width:620px;
    background:#171c25;
    border:1px solid #303746;
    border-radius:18px;
    overflow:hidden;
}

.gameTop{
    padding:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #292e39;
}

.gameName{
    font-weight:800;
}

.gameStatus{
    font-size:12px;
    opacity:.65;
}

.gameContent{
    padding:14px;
}

.gameControls{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:12px;
}

.gameControl{
    border:0;
    border-radius:11px;
    padding:9px 12px;
    background:#303746;
    color:#fff;
}

.gameControl.danger{
    background:#9d3030;
}

.gameControl.primary{
    background:#5865f2;
}

/* FINISHED */

.gameFinished{
    padding:30px 15px;
    text-align:center;
}

.gameFinishedIcon{
    font-size:42px;
}

.gameFinishedTitle{
    margin-top:8px;
    font-size:24px;
    font-weight:900;
}

.gameFinishedText{
    margin-top:5px;
    opacity:.6;
}

/* SETTINGS */

#settings{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#0009;
    z-index:200;
    padding:15px;
}

#settings.open{
    display:flex;
}

.settingsBox{
    width:min(440px,100%);
    max-height:90dvh;
    overflow:auto;
    background:#151922;
    border:1px solid #303746;
    border-radius:18px;
    padding:18px;
}

.settingsRow{
    margin-bottom:14px;
}

.settingsRow label{
    display:block;
    margin-bottom:6px;
    font-size:13px;
    opacity:.7;
}

.settingsRow input{
    width:100%;
    border:1px solid #303746;
    border-radius:10px;
    padding:10px;
    background:#0d1118;
    color:#fff;
}

.closeSettings{
    width:100%;
    border:0;
    border-radius:11px;
    padding:11px;
    background:#303746;
    color:#fff;
}

/* MOBILE */

@media(max-width:600px){

    #header{
        height:54px;
        min-height:54px;
    }

    #channel{
        display:none;
    }

    #messages{
        padding:10px;
    }

    .gameCard{
        margin-left:0;
    }

    #composer{
        padding:7px;
        min-height:62px;
    }

    .composerButton{
        width:43px;
        min-width:43px;
    }

    #gamesPanel{
        bottom:68px;
        width:calc(100% - 12px);
    }
}
</style>
</head>

<body>

<div id="app">

    <header id="header">
        <div>
            <span id="title">Game Chat</span>
            <span id="channel">#general</span>
        </div>

        <div class="headerButtons">
            <button
                class="headerButton"
                id="settingsButton"
            >⚙️</button>
        </div>
    </header>

    <main id="messages"></main>

    <div id="composer">

        <button
            class="composerButton"
            id="gamesButton"
            title="Games"
        >🎮</button>

        <input
            id="messageInput"
            placeholder="Message..."
            maxlength="20000"
        >

        <button
            class="composerButton"
            id="sendButton"
        >➤</button>

    </div>

</div>


<!-- GAMES -->

<div id="gamesPanel">

    <div class="gamesHeader">
        🎮 Games
    </div>

    <div class="gameList">

        <button
            class="gameButton"
            data-game="hangman"
        >
            <div class="gameTitle">🔤 Hangman</div>
            <div class="gameDescription">
                Guess the hidden word
            </div>
        </button>

        <button
            class="gameButton"
            data-game="battleship"
        >
            <div class="gameTitle">🚢 Battleship</div>
            <div class="gameDescription">
                Destroy your opponent's fleet
            </div>
        </button>

        <button
            class="gameButton"
            data-game="tictactoe"
        >
            <div class="gameTitle">⭕ Tic-Tac-Toe</div>
            <div class="gameDescription">
                Classic 2-player game
            </div>
        </button>

        <button
            class="gameButton"
            data-game="connect4"
        >
            <div class="gameTitle">🔴 Connect 4</div>
            <div class="gameDescription">
                Connect four pieces
            </div>
        </button>

        <button
            class="gameButton"
            data-game="rockpaperscissors"
        >
            <div class="gameTitle">✊ Rock Paper Scissors</div>
            <div class="gameDescription">
                Choose your move
            </div>
        </button>

    </div>
</div>


<!-- SETTINGS -->

<div id="settings">

    <div class="settingsBox">

        <h2>⚙️ Settings</h2>

        <div class="settingsRow">
            <label>Your name</label>
            <input
                id="usernameInput"
                maxlength="24"
            >
        </div>

        <button
            class="closeSettings"
            id="closeSettings"
        >
            Done
        </button>

    </div>

</div>


<script>

/* =====================================================
   CONFIGURATION
   ===================================================== */

/*
 * Put your deployed Vercel/serverless API URL here.
 *
 * Example:
 *
 * const API_URL = "https://your-site.vercel.app/api/messages";
 */
const API_URL = "/api/messages";

const CHANNEL = "general";

const GAME_SERVER_USERNAME = "__GAME_SERVER__";

const GAME_CLEANUP_DELAY = 3000;

const GAME_HOST_HEARTBEAT_MS = 2000;

const GAME_HOST_TIMEOUT_MS = 5000;


/* =====================================================
   USER / DEVICE
   ===================================================== */

let deviceId =
    localStorage.getItem("chat_device_id");

if(!deviceId){

    deviceId =
        crypto.randomUUID();

    localStorage.setItem(
        "chat_device_id",
        deviceId
    );
}


let username =
    localStorage.getItem("chat_username");

if(!username){

    username =
        "User" +
        Math.floor(
            Math.random() * 9999
        );

    localStorage.setItem(
        "chat_username",
        username
    );
}


document.getElementById(
    "usernameInput"
).value = username;


/* =====================================================
   STATE
   ===================================================== */

let messages = [];

let games = [];

let currentActiveGameId = null;

let gameCleanupTimers = new Map();

let gameHostHeartbeatTimer = null;

let pollingTimer = null;


/* =====================================================
   API
   ===================================================== */

async function apiRequest(
    method,
    body = null
){

    const options = {
        method,
        headers:{
            "Content-Type":
                "application/json"
        }
    };

    if(body !== null){

        options.body =
            JSON.stringify(body);
    }

    const response =
        await fetch(
            API_URL,
            options
        );

    const text =
        await response.text();

    let data = {};

    try{
        data =
            text
                ? JSON.parse(text)
                : {};
    }catch{
        data = {
            error:text
        };
    }

    if(!response.ok){

        throw new Error(
            data.error ||
            "API request failed"
        );
    }

    return data;
}


async function apiGet(){

    return apiRequest(
        "GET"
    + "",
        null
    );
}


async function apiPost(body){

    return apiRequest(
        "POST",
        body
    );
}


async function apiPatch(body){

    return apiRequest(
        "PATCH",
        body
    );
}


async function apiDelete(body){

    return apiRequest(
        "DELETE",
        body
    );
}


/* =====================================================
   CHAT
   ===================================================== */

async function loadMessages(){

    const data =
        await apiGet();

    messages =
        Array.isArray(
            data.messages
        )
            ? data.messages
            : [];

    processGameMessages();

    renderChat();
}


function renderChat(){

    const container =
        document.getElementById(
            "messages"
        );

    container.innerHTML = "";

    for(
        const message
        of messages
    ){

        /*
         * NEVER render game-server
         * messages as chat messages.
         */
        if(
            message.username ===
            GAME_SERVER_USERNAME
        ){
            continue;
        }

        renderNormalMessage(
            message,
            container
        );
    }

    for(
        const game
        of games
    ){

        renderGame(
            game,
            container
        );
    }

    container.scrollTop =
        container.scrollHeight;
}


function renderNormalMessage(
    message,
    container
){

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message";

    const avatar =
        document.createElement(
            "div"
        );

    avatar.className =
        "avatar";

    avatar.textContent =
        (
            message.username ||
            "?"
        )
        .charAt(0)
        .toUpperCase();

    const body =
        document.createElement(
            "div"
        );

    body.className =
        "messageBody";

    const name =
        document.createElement(
            "div"
        );

    name.className =
        "messageName";

    name.textContent =
        message.username;

    const text =
        document.createElement(
            "div"
        );

    text.className =
        "messageText";

    text.textContent =
        message.message;

    body.appendChild(name);
    body.appendChild(text);

    wrapper.appendChild(avatar);
    wrapper.appendChild(body);

    container.appendChild(
        wrapper
    );
}


/* =====================================================
   GAME STATE
   ===================================================== */

function processGameMessages(){

    const nextGames = [];

    for(
        const message
        of messages
    ){

        if(
            message.username !==
            GAME_SERVER_USERNAME
        ){
            continue;
        }

        try{

            const game =
                JSON.parse(
                    message.message
                );

            game.id =
                message.id;

            game.hostDeviceId =
                message.device_id;

            game.serverMessageId =
                message.id;

            game.channel =
                message.channel;

            nextGames.push(
                game
            );

        }catch(error){

            console.warn(
                "Invalid game state:",
                error
            );
        }
    }

    games =
        nextGames;

    for(
        const game
        of games
    ){

        if(
            isFinished(game)
        ){

            scheduleFinishedCleanup(
                game
            );
        }
    }
}


/* =====================================================
   CREATE GAME
   ===================================================== */

async function createGame(
    type
){

    const game = {

        type,

        id:null,

        hostDeviceId:
            deviceId,

        hostUsername:
            username,

        players:[

            {
                deviceId,
                username
            }

        ],

        status:"waiting",

        createdAt:
            Date.now(),

        hostHeartbeat:
            Date.now(),

        settings:
            defaultGameSettings(type),

        data:{}

    };


    const response =
        await apiPost({

            username:
                GAME_SERVER_USERNAME,

            channel:
                CHANNEL,

            message:
                JSON.stringify(game),

            image:null,

            files:[],

            device_id:
                deviceId,

            game_server:true
        });


    if(
        !response.game
    ){

        throw new Error(
            "The API did not return the game."
        );
    }


    /*
     * VERY IMPORTANT:
     *
     * Store the actual Supabase
     * message ID returned by POST.
     *
     * PATCH and DELETE MUST use
     * this exact ID.
     */

    game.id =
        response.game.id;

    game.serverMessageId =
        response.game.id;


    games.push(
        game
    );


    currentActiveGameId =
        game.id;


    startHostHeartbeat(
        game
    );

    renderChat();
}


/* =====================================================
   DEFAULT SETTINGS
   ===================================================== */

function defaultGameSettings(
    type
){

    if(type === "hangman"){

        return {
            maxAttempts:6,
            wordLength:null
        };
    }

    if(type === "battleship"){

        return {
            boardSize:10,
            allowRotation:true
        };
    }

    return {};
}


/* =====================================================
   UPDATE EXISTING GAME
   ===================================================== */

async function updateGame(
    game,
    changes
){

    if(!game) return;

    /*
     * Only the HOST is allowed to PATCH
     * according to your API.
     */

    if(
        String(
            game.hostDeviceId
        ) !==
        String(deviceId)
    ){

        console.warn(
            "Only the host can update this game."
        );

        return;
    }


    Object.assign(
        game,
        changes
    );


    game.hostHeartbeat =
        Date.now();


    const response =
        await apiPatch({

            id:
                game.serverMessageId ||
                game.id,

            device_id:
                deviceId,

            game_server:true,

            game_state:
                JSON.stringify(game)
        });


    if(
        !response.game
    ){

        throw new Error(
            "Game state was not updated."
        );
    }


    renderChat();
}


/* =====================================================
   HOST HEARTBEAT
   ===================================================== */

function startHostHeartbeat(
    game
){

    stopHostHeartbeat();

    if(
        !game ||
        String(
            game.hostDeviceId
        ) !==
        String(deviceId)
    ){

        return;
    }


    const heartbeat =
        async ()=>{

            const current =
                games.find(
                    g =>
                        String(g.id) ===
                        String(game.id)
                );

            if(!current){

                stopHostHeartbeat();

                return;
            }


            current.hostHeartbeat =
                Date.now();


            try{

                await apiPatch({

                    id:
                        current.serverMessageId ||
                        current.id,

                    device_id:
                        deviceId,

                    game_server:true,

                    game_state:
                        JSON.stringify(
                            current
                        )
                });

            }catch(error){

                console.warn(
                    "Host heartbeat failed:",
                    error
                );
            }
        };


    heartbeat();


    gameHostHeartbeatTimer =
        setInterval(
            heartbeat,
            GAME_HOST_HEARTBEAT_MS
        );
}


function stopHostHeartbeat(){

    if(
        gameHostHeartbeatTimer
    ){

        clearInterval(
            gameHostHeartbeatTimer
        );

        gameHostHeartbeatTimer =
            null;
    }
}


/* =====================================================
   LEAVE
   ===================================================== */

async function leaveGame(
    game
){

    if(!game) return;


    /*
     * HOST LEAVING:
     *
     * Your API only allows game-server
     * DELETE when device_id matches
     * the game host.
     *
     * Therefore the host can really
     * delete the invisible message.
     */

    if(
        String(
            game.hostDeviceId
        ) ===
        String(deviceId)
    ){

        await deleteGame(
            game
        );

        return;
    }


    /*
     * NON-HOST:
     *
     * We cannot PATCH the game because
     * your API deliberately rejects it
     * unless the device_id is the host.
     *
     * So we send a leave request through
     * normal chat only if you add server
     * support for it.
     *
     * We do NOT pretend the server changed.
     */

    alert(
        "You left the game on this device. The host controls the shared game state."
    );

    removeGameLocally(
        game
    );
}


/* =====================================================
   FORCE STOP
   ===================================================== */

async function forceStopGame(
    game
){

    if(!game) return;


    if(
        String(
            game.hostDeviceId
        ) !==
        String(deviceId)
    ){

        alert(
            "Only the host can force stop the game."
        );

        return;
    }


    const confirmed =
        confirm(
            "Force stop this game?\n\nThe game and its invisible server message will be deleted."
        );

    if(!confirmed) return;


    await deleteGame(
        game
    );
}


/* =====================================================
   DELETE GAME
   ===================================================== */

async function deleteGame(
    game
){

    if(!game) return;


    try{

        await apiDelete({

            id:
                game.serverMessageId ||
                game.id,

            device_id:
                deviceId,

            game_server:true
        });


        removeGameLocally(
            game
        );


    }catch(error){

        console.error(
            "Game deletion failed:",
            error
        );

        alert(
            "Could not stop the game:\n" +
            error.message
        );
    }
}


function removeGameLocally(
    game
){

    cancelGameCleanup(
        game.id
    );


    games =
        games.filter(
            g =>
                String(g.id) !==
                String(game.id)
        );


    messages =
        messages.filter(
            m =>
                String(m.id) !==
                String(game.id)
        );


    if(
        String(
            currentActiveGameId
        ) ===
        String(game.id)
    ){

        currentActiveGameId =
            null;

        stopHostHeartbeat();
    }


    renderChat();
}


/* =====================================================
   FINISH GAME
   ===================================================== */

function finishGame(
    game,
    winner
){

    if(!game) return;


    game.status =
        "finished";

    game.winner =
        winner;

    game.finishedAt =
        Date.now();


    updateGame(
        game,
        {}
    );


    scheduleFinishedCleanup(
        game
    );
}


function isFinished(
    game
){

    return String(
        game?.status || ""
    ).toLowerCase() ===
        "finished";
}


function scheduleFinishedCleanup(
    game
){

    if(
        !game ||
        !game.id
    ){

        return;
    }


    if(
        gameCleanupTimers.has(
            game.id
        )
    ){

        return;
    }


    const timer =
        setTimeout(
            async ()=>{

                gameCleanupTimers.delete(
                    game.id
                );


                /*
                 * Only the host can perform
                 * the actual DELETE with the
                 * API as currently written.
                 */

                if(
                    String(
                        game.hostDeviceId
                    ) ===
                    String(deviceId)
                ){

                    await deleteGame(
                        game
                    );

                }else{

                    removeGameLocally(
                        game
                    );
                }

            },
            GAME_CLEANUP_DELAY
        );


    gameCleanupTimers.set(
        game.id,
        timer
    );
}


function cancelGameCleanup(
    id
){

    const timer =
        gameCleanupTimers.get(
            id
        );

    if(timer){

        clearTimeout(
            timer
        );

        gameCleanupTimers.delete(
            id
        );
    }
}


/* =====================================================
   GAME UI
   ===================================================== */

function renderGame(
    game,
    container
){

    const card =
        document.createElement(
            "div"
        );

    card.className =
        "gameCard";

    card.dataset.gameId =
        game.id;


    const top =
        document.createElement(
            "div"
        );

    top.className =
        "gameTop";


    const title =
        document.createElement(
            "div"
        );

    title.className =
        "gameName";

    title.textContent =
        game.type;


    const status =
        document.createElement(
            "div"
        );

    status.className =
        "gameStatus";

    status.textContent =
        game.status;


    top.appendChild(
        title
    );

    top.appendChild(
        status
    );


    const content =
        document.createElement(
            "div"
        );

    content.className =
        "gameContent";


    if(
        isFinished(game)
    ){

        content.innerHTML = `
            <div class="gameFinished">
                <div class="gameFinishedIcon">🏆</div>
                <div class="gameFinishedTitle">
                    ${
                        escapeHtml(
                            game.winner ||
                            "Someone"
                        )
                    } won!
                </div>
                <div class="gameFinishedText">
                    Game will close in 3 seconds.
                </div>
            </div>
        `;

    }else{

        content.innerHTML = `
            <div>
                Players:
                ${game.players?.length || 0}/2
            </div>
        `;


        const controls =
            document.createElement(
                "div"
            );

        controls.className =
            "gameControls";


        const leave =
            document.createElement(
                "button"
            );

        leave.className =
            "gameControl";

        leave.textContent =
            "🚪 Leave";


        leave.onclick =
            async ()=>{
                await leaveGame(
                    game
                );
            };


        controls.appendChild(
            leave
        );


        if(
            String(
                game.hostDeviceId
            ) ===
            String(deviceId)
        ){

            const stop =
                document.createElement(
                    "button"
                );

            stop.className =
                "gameControl danger";

            stop.textContent =
                "🛑 Force Stop";


            stop.onclick =
                async ()=>{
                    await forceStopGame(
                        game
                    );
                };


            controls.appendChild(
                stop
            );
        }


        content.appendChild(
            controls
        );
    }


    card.appendChild(
        top
    );

    card.appendChild(
        content
    );


    container.appendChild(
        card
    );
}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(
    value
){

    return String(
        value
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );
}


/* =====================================================
   SEND MESSAGE
   ===================================================== */

async function sendMessage(){

    const input =
        document.getElementById(
            "messageInput"
        );

    const text =
        input.value.trim();


    if(!text) return;


    await apiPost({

        username,

        channel:
            CHANNEL,

        message:
            text,

        image:null,

        files:[],

        device_id:
            deviceId
    });


    input.value = "";

    await loadMessages();
}


/* =====================================================
   BUTTONS
   ===================================================== */

document.getElementById(
    "sendButton"
).onclick =
    sendMessage;


document.getElementById(
    "messageInput"
).addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            sendMessage();
        }
    }
);


document.getElementById(
    "gamesButton"
).onclick =
    ()=>{
        document
            .getElementById(
                "gamesPanel"
            )
            .classList.toggle(
                "open"
            );
    };


document
    .querySelectorAll(
        ".gameButton"
    )
    .forEach(
        button => {

            button.onclick =
                async ()=>{

                    const type =
                        button.dataset.game;

                    document
                        .getElementById(
                            "gamesPanel"
                        )
                        .classList.remove(
                            "open"
                        );

                    try{

                        await createGame(
                            type
                        );

                    }catch(error){

                        alert(
                            "Could not create game:\n" +
                            error.message
                        );
                    }
                };
        }
    );


/* SETTINGS */

document.getElementById(
    "settingsButton"
).onclick =
    ()=>{
        document
            .getElementById(
                "settings"
            )
            .classList.add(
                "open"
            );
    };


document.getElementById(
    "closeSettings"
).onclick =
    ()=>{
        username =
            document
                .getElementById(
                    "usernameInput"
                )
                .value
                .trim()
                .substring(
                    0,
                    24
                ) ||
                "User";

        localStorage.setItem(
            "chat_username",
            username
        );

        document
            .getElementById(
                "settings"
            )
            .classList.remove(
                "open"
            );
    };


/* =====================================================
   POLLING
   ===================================================== */

async function poll(){

    try{

        await loadMessages();

    }catch(error){

        console.warn(
            "Chat update failed:",
            error
        );
    }
}


poll();


pollingTimer =
    setInterval(
        poll,
        1000
    );


/* =====================================================
   PAGE EXIT
   ===================================================== */

window.addEventListener(
    "beforeunload",
    ()=>{
        stopHostHeartbeat();
    }
);

</script>
