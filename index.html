<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Inter,Arial,sans-serif;
    background:#111;
    color:#eee;
}

button,
input,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    background:#111;
}

/* =========================
   HEADER
========================= */

.header{
    height:64px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    padding:0 18px;
    border-bottom:1px solid #292929;
    background:#151515;
}

.logo{
    font-size:20px;
    font-weight:700;
    letter-spacing:.5px;
}

.header-right{
    margin-left:auto;
    display:flex;
    gap:8px;
}

.icon-button{
    width:40px;
    height:40px;
    border:1px solid #333;
    border-radius:9px;
    background:#1c1c1c;
    color:#ddd;
    font-size:18px;
}

.icon-button:hover{
    background:#262626;
}

/* =========================
   CHANNEL
========================= */

.channel-bar{
    height:48px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    padding:0 18px;
    border-bottom:1px solid #292929;
    background:#131313;
}

.channel{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:14px;
    color:#bbb;
}

.channel-icon{
    color:#777;
    font-size:18px;
}

/* =========================
   MESSAGES
========================= */

.messages{
    flex:1;
    overflow-y:auto;
    padding:18px;
    scroll-behavior:auto;
}

.message{
    position:relative;
    max-width:900px;
    margin-bottom:14px;
    padding:10px 13px;
    border-radius:10px;
    background:#181818;
    border:1px solid #292929;
}

.message:hover{
    background:#1b1b1b;
}

.message.mine{
    border-color:#343434;
}

.message-header{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:4px;
}

.username{
    font-size:14px;
    font-weight:700;
    color:#ddd;
}

.time{
    font-size:11px;
    color:#666;
}

.edited{
    font-size:10px;
    color:#666;
    margin-left:2px;
}

.message-text{
    font-size:14px;
    line-height:1.45;
    white-space:pre-wrap;
    word-break:break-word;
}

.message-image{
    display:block;
    max-width:min(600px,100%);
    max-height:600px;
    margin-top:9px;
    border-radius:8px;
    border:1px solid #333;
    cursor:pointer;
    object-fit:contain;
}

/* =========================
   EMPTY
========================= */

.empty{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#555;
    font-size:14px;
}

/* =========================
   COMPOSER
========================= */

.composer{
    flex-shrink:0;
    padding:12px 16px;
    border-top:1px solid #292929;
    background:#151515;
}

.image-preview{
    display:none;
    margin-bottom:8px;
    padding:7px;
    border:1px solid #303030;
    border-radius:8px;
    background:#1b1b1b;
    align-items:center;
    gap:10px;
}

.image-preview.show{
    display:flex;
}

.image-preview img{
    width:52px;
    height:52px;
    object-fit:cover;
    border-radius:6px;
}

.preview-info{
    flex:1;
    min-width:0;
}

.preview-name{
    font-size:12px;
    color:#ccc;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.preview-size{
    font-size:10px;
    color:#666;
    margin-top:3px;
}

.remove-image{
    width:30px;
    height:30px;
    border:0;
    border-radius:6px;
    background:#242424;
    color:#aaa;
}

.composer-row{
    display:flex;
    align-items:flex-end;
    gap:8px;
}

.attach-button{
    width:44px;
    height:44px;
    flex-shrink:0;
    border:1px solid #333;
    border-radius:9px;
    background:#1d1d1d;
    color:#bbb;
    font-size:19px;
}

.attach-button:hover{
    background:#282828;
}

.message-input{
    flex:1;
    min-height:44px;
    max-height:130px;
    resize:none;
    border:1px solid #333;
    border-radius:9px;
    padding:11px 13px;
    outline:none;
    background:#1c1c1c;
    color:#eee;
}

.message-input:focus{
    border-color:#555;
}

.send-button{
    height:44px;
    padding:0 18px;
    border:1px solid #444;
    border-radius:9px;
    background:#252525;
    color:#eee;
    font-weight:600;
}

.send-button:hover{
    background:#303030;
}

.send-button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* =========================
   CONTEXT MENU
========================= */

.context-menu{
    position:fixed;
    z-index:5000;
    display:none;
    min-width:150px;
    padding:5px;
    border:1px solid #363636;
    border-radius:9px;
    background:#181818;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
}

.context-menu.show{
    display:block;
}

.context-menu button{
    width:100%;
    padding:9px 10px;
    border:0;
    border-radius:6px;
    background:transparent;
    color:#ddd;
    text-align:left;
}

.context-menu button:hover{
    background:#292929;
}

.context-delete{
    color:#e07878 !important;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    z-index:3000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.72);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(480px,100%);
    max-height:90vh;
    overflow:auto;
    border:1px solid #363636;
    border-radius:12px;
    background:#171717;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.modal-header{
    display:flex;
    align-items:center;
    padding:16px;
    border-bottom:1px solid #292929;
}

.modal-title{
    font-size:17px;
    font-weight:700;
}

.modal-close{
    margin-left:auto;
    width:34px;
    height:34px;
    border:0;
    border-radius:7px;
    background:#242424;
    color:#bbb;
}

.modal-body{
    padding:16px;
}

.setting{
    margin-bottom:18px;
}

.setting-title{
    margin-bottom:7px;
    font-size:13px;
    font-weight:600;
    color:#bbb;
}

.setting-description{
    margin-top:5px;
    font-size:11px;
    color:#666;
    line-height:1.4;
}

.setting-row{
    display:flex;
    gap:8px;
}

.setting-input{
    flex:1;
    min-width:0;
    height:40px;
    border:1px solid #333;
    border-radius:8px;
    padding:0 11px;
    background:#1d1d1d;
    color:#eee;
    outline:none;
}

.setting-input:focus{
    border-color:#555;
}

.save-button{
    height:40px;
    padding:0 14px;
    border:1px solid #444;
    border-radius:8px;
    background:#272727;
    color:#eee;
}

.save-button:hover{
    background:#303030;
}

.device-id{
    padding:9px;
    overflow:hidden;
    border:1px solid #2c2c2c;
    border-radius:7px;
    background:#121212;
    color:#666;
    font-size:10px;
    word-break:break-all;
}

.danger-button{
    width:100%;
    padding:11px;
    border:1px solid #542d2d;
    border-radius:8px;
    background:#241717;
    color:#e08080;
}

.danger-button:hover{
    background:#301b1b;
}

/* =========================
   EDIT MODAL
========================= */

.edit-input{
    width:100%;
    min-height:100px;
    resize:vertical;
    padding:10px;
    border:1px solid #333;
    border-radius:8px;
    background:#1d1d1d;
    color:#eee;
    outline:none;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:12px;
}

.cancel-button,
.confirm-button{
    padding:9px 14px;
    border-radius:8px;
    border:1px solid #333;
}

.cancel-button{
    background:#222;
    color:#bbb;
}

.confirm-button{
    background:#303030;
    color:#eee;
}

/* =========================
   FULLSCREEN IMAGE
========================= */

.image-viewer{
    position:fixed;
    inset:0;
    z-index:10000;
    display:none;
    background:#000;
}

.image-viewer.show{
    display:flex;
}

.image-viewer img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.image-back{
    position:absolute;
    top:15px;
    left:15px;
    z-index:2;
    width:44px;
    height:44px;
    border:1px solid #444;
    border-radius:9px;
    background:rgba(20,20,20,.85);
    color:#eee;
    font-size:20px;
}

/* =========================
   STATUS
========================= */

.status{
    position:fixed;
    right:16px;
    bottom:78px;
    z-index:2000;
    display:none;
    max-width:350px;
    padding:10px 13px;
    border:1px solid #393939;
    border-radius:8px;
    background:#181818;
    color:#ccc;
    font-size:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.status.show{
    display:block;
}

@media(max-width:600px){
    .header{
        padding:0 12px;
    }

    .messages{
        padding:12px;
    }

    .composer{
        padding:9px;
    }

    .send-button{
        padding:0 13px;
    }

    .message{
        max-width:100%;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <div class="header">

        <div class="logo">
            Chat
        </div>

        <div class="header-right">

            <button
                class="icon-button"
                id="settingsButton"
                title="Settings"
            >
                ⚙
            </button>

        </div>

    </div>


    <!-- CHANNEL -->
    <div class="channel-bar">

        <div class="channel">

            <span class="channel-icon">#</span>

            <span>general</span>

        </div>

    </div>


    <!-- MESSAGES -->
    <div
        class="messages"
        id="messages"
    >

        <div class="empty" id="empty">
            No messages yet.
        </div>

    </div>


    <!-- COMPOSER -->
    <div class="composer">

        <div
            class="image-preview"
            id="imagePreview"
        >

            <img
                id="previewImage"
                src=""
                alt=""
            >

            <div class="preview-info">

                <div
                    class="preview-name"
                    id="previewName"
                >
                    Image
                </div>

                <div
                    class="preview-size"
                    id="previewSize"
                >
                    Ready to send
                </div>

            </div>

            <button
                class="remove-image"
                id="removeImage"
                title="Remove image"
            >
                ×
            </button>

        </div>


        <div class="composer-row">

            <input
                type="file"
                id="imageInput"
                accept="image/*"
                hidden
            >

            <button
                class="attach-button"
                id="attachButton"
                title="Send image"
            >
                +
            </button>

            <textarea
                id="messageInput"
                class="message-input"
                placeholder="Message #general"
                rows="1"
            ></textarea>

            <button
                id="sendButton"
                class="send-button"
            >
                Send
            </button>

        </div>

    </div>

</div>


<!-- CONTEXT MENU -->

<div
    class="context-menu"
    id="contextMenu"
>

    <button id="editMessageButton">
        Edit
    </button>

    <button
        id="deleteMessageButton"
        class="context-delete"
    >
        Delete
    </button>

</div>


<!-- SETTINGS -->

<div
    class="modal"
    id="settingsModal"
>

    <div class="modal-box">

        <div class="modal-header">

            <div class="modal-title">
                Settings
            </div>

            <button
                class="modal-close"
                id="settingsClose"
            >
                ×
            </button>

        </div>


        <div class="modal-body">

            <!-- USERNAME -->

            <div class="setting">

                <div class="setting-title">
                    Username
                </div>

                <div class="setting-row">

                    <input
                        id="usernameSetting"
                        class="setting-input"
                        maxlength="24"
                        placeholder="Your name"
                    >

                    <button
                        id="saveNameButton"
                        class="save-button"
                    >
                        Save
                    </button>

                </div>

                <div class="setting-description">
                    Your username can be changed at any time.
                    Changing it does not change ownership of your messages.
                </div>

            </div>


            <!-- DEVICE ID -->

            <div class="setting">

                <div class="setting-title">
                    Device ID
                </div>

                <div
                    class="device-id"
                    id="deviceIdDisplay"
                >
                </div>

                <div class="setting-description">
                    This ID is used to identify messages belonging to this device.
                    Do not share it publicly.
                </div>

            </div>


            <!-- DANGER -->

            <div class="setting">

                <div class="setting-title">
                    Danger Zone
                </div>

                <button
                    class="danger-button"
                    id="removeEverythingButton"
                >
                    Remove Everything
                </button>

            </div>

        </div>

    </div>

</div>


<!-- EDIT -->

<div
    class="modal"
    id="editModal"
>

    <div class="modal-box">

        <div class="modal-header">

            <div class="modal-title">
                Edit Message
            </div>

            <button
                class="modal-close"
                id="editClose"
            >
                ×
            </button>

        </div>


        <div class="modal-body">

            <textarea
                id="editInput"
                class="edit-input"
                maxlength="2000"
            ></textarea>

            <div class="modal-actions">

                <button
                    class="cancel-button"
                    id="editCancel"
                >
                    Cancel
                </button>

                <button
                    class="confirm-button"
                    id="editSave"
                >
                    Save
                </button>

            </div>

        </div>

    </div>

</div>


<!-- IMAGE VIEWER -->

<div
    class="image-viewer"
    id="imageViewer"
>

    <button
        class="image-back"
        id="imageBack"
    >
        ←
    </button>

    <img
        id="fullscreenImage"
        src=""
        alt=""
    >

</div>


<!-- STATUS -->

<div
    class="status"
    id="status"
></div>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const API_URL = "/api/messages";

const CHANNEL = "general";

const MAX_IMAGE_WIDTH = 1500;

const MAX_IMAGE_HEIGHT = 1500;

const JPEG_QUALITY = 0.82;


/* =========================================================
   ELEMENTS
========================================================= */

const messagesElement =
    document.getElementById("messages");

const emptyElement =
    document.getElementById("empty");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const attachButton =
    document.getElementById("attachButton");

const imageInput =
    document.getElementById("imageInput");

const imagePreview =
    document.getElementById("imagePreview");

const previewImage =
    document.getElementById("previewImage");

const previewName =
    document.getElementById("previewName");

const previewSize =
    document.getElementById("previewSize");

const removeImage =
    document.getElementById("removeImage");

const settingsButton =
    document.getElementById("settingsButton");

const settingsModal =
    document.getElementById("settingsModal");

const settingsClose =
    document.getElementById("settingsClose");

const usernameSetting =
    document.getElementById("usernameSetting");

const saveNameButton =
    document.getElementById("saveNameButton");

const deviceIdDisplay =
    document.getElementById("deviceIdDisplay");

const contextMenu =
    document.getElementById("contextMenu");

const editMessageButton =
    document.getElementById("editMessageButton");

const deleteMessageButton =
    document.getElementById("deleteMessageButton");

const editModal =
    document.getElementById("editModal");

const editClose =
    document.getElementById("editClose");

const editCancel =
    document.getElementById("editCancel");

const editSave =
    document.getElementById("editSave");

const editInput =
    document.getElementById("editInput");

const imageViewer =
    document.getElementById("imageViewer");

const fullscreenImage =
    document.getElementById("fullscreenImage");

const imageBack =
    document.getElementById("imageBack");

const statusElement =
    document.getElementById("status");

const removeEverythingButton =
    document.getElementById("removeEverythingButton");


/* =========================================================
   LOCAL DEVICE ID
========================================================= */

function getDeviceId(){

    let id =
        localStorage.getItem(
            "chat_device_id"
        );

    if(!id){

        id =
            crypto.randomUUID();

        localStorage.setItem(
            "chat_device_id",
            id
        );

    }

    return id;
}

const DEVICE_ID =
    getDeviceId();

deviceIdDisplay.textContent =
    DEVICE_ID;


/* =========================================================
   USERNAME
========================================================= */

function getUsername(){

    return (
        localStorage.getItem(
            "chat_username"
        ) || ""
    ).trim();

}


function setUsername(name){

    name =
        String(name || "")
        .trim()
        .substring(0,24);

    if(!name){

        showStatus(
            "Enter a username."
        );

        return false;

    }

    localStorage.setItem(
        "chat_username",
        name
    );

    return true;

}


/* Load saved name every time settings opens */

function loadSettings(){

    usernameSetting.value =
        getUsername();

}


/* =========================================================
   STATUS
========================================================= */

let statusTimer = null;

function showStatus(text){

    statusElement.textContent =
        text;

    statusElement.classList.add(
        "show"
    );

    clearTimeout(
        statusTimer
    );

    statusTimer =
        setTimeout(
            () => {

                statusElement.classList.remove(
                    "show"
                );

            },
            3000
        );

}


/* =========================================================
   IMAGE STATE
========================================================= */

let selectedImage = null;

let selectedImageName = "";


/* =========================================================
   IMAGE RESIZE
========================================================= */

function resizeImage(file){

    return new Promise(
        (resolve,reject) => {

            const reader =
                new FileReader();

            reader.onload = () => {

                const img =
                    new Image();

                img.onload = () => {

                    let width =
                        img.width;

                    let height =
                        img.height;


                    const scale =
                        Math.min(
                            1,
                            MAX_IMAGE_WIDTH /
                                width,
                            MAX_IMAGE_HEIGHT /
                                height
                        );


                    width =
                        Math.round(
                            width * scale
                        );

                    height =
                        Math.round(
                            height * scale
                        );


                    const canvas =
                        document.createElement(
                            "canvas"
                        );

                    canvas.width =
                        width;

                    canvas.height =
                        height;


                    const ctx =
                        canvas.getContext(
                            "2d"
                        );


                    ctx.drawImage(
                        img,
                        0,
                        0,
                        width,
                        height
                    );


                    const data =
                        canvas.toDataURL(
                            "image/jpeg",
                            JPEG_QUALITY
                        );


                    resolve(data);

                };


                img.onerror = () => {

                    reject(
                        new Error(
                            "Could not load image."
                        )
                    );

                };


                img.src =
                    reader.result;

            };


            reader.onerror = () => {

                reject(
                    new Error(
                        "Could not read image."
                    )
                );

            };


            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =========================================================
   IMAGE SELECT
========================================================= */

attachButton.addEventListener(
    "click",
    () => {

        imageInput.click();

    }
);


imageInput.addEventListener(
    "change",
    async () => {

        const file =
            imageInput.files[0];

        if(!file){
            return;
        }


        try{

            showStatus(
                "Preparing image..."
            );


            selectedImage =
                await resizeImage(
                    file
                );

            selectedImageName =
                file.name;


            previewImage.src =
                selectedImage;

            previewName.textContent =
                selectedImageName;

            previewSize.textContent =
                "Resized to maximum 1500 × 1500";


            imagePreview.classList.add(
                "show"
            );


        }catch(error){

            console.error(error);

            showStatus(
                "Could not process that image."
            );

        }

    }
);


/* =========================================================
   REMOVE SELECTED IMAGE
========================================================= */

removeImage.addEventListener(
    "click",
    clearSelectedImage
);


function clearSelectedImage(){

    selectedImage =
        null;

    selectedImageName =
        "";

    imageInput.value =
        "";

    previewImage.src =
        "";

    imagePreview.classList.remove(
        "show"
    );

}


/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages(){

    try{

        const response =
            await fetch(
                API_URL +
                "?channel=" +
                encodeURIComponent(
                    CHANNEL
                ),
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error ||
                "Failed to load messages."
            );

        }


        renderMessages(
            Array.isArray(
                data.messages
            )
            ? data.messages
            : []
        );


    }catch(error){

        console.error(
            error
        );

        showStatus(
            error.message ||
            "Failed to load messages."
        );

    }

}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(list){

    messagesElement.innerHTML =
        "";


    if(!list.length){

        messagesElement.appendChild(
            emptyElement
        );

        emptyElement.style.display =
            "flex";

        return;

    }


    emptyElement.style.display =
        "none";


    for(const message of list){

        messagesElement.appendChild(
            createMessageElement(
                message
            )
        );

    }


    messagesElement.scrollTop =
        messagesElement.scrollHeight;

}


/* =========================================================
   CREATE MESSAGE
========================================================= */

function createMessageElement(message){

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message";


    if(
        message.device_id &&
        message.device_id === DEVICE_ID
    ){

        wrapper.classList.add(
            "mine"
        );

    }


    wrapper.dataset.id =
        message.id;


    /* Header */

    const header =
        document.createElement(
            "div"
        );

    header.className =
        "message-header";


    const username =
        document.createElement(
            "span"
        );

    username.className =
        "username";

    username.textContent =
        message.username ||
        "Unknown";


    const time =
        document.createElement(
            "span"
        );

    time.className =
        "time";

    if(message.created_at){

        const date =
            new Date(
                message.created_at
            );

        time.textContent =
            date.toLocaleTimeString(
                [],
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );

    }


    header.appendChild(
        username
    );

    header.appendChild(
        time
    );


    /* Edited */

    if(message.edited){

        const edited =
            document.createElement(
                "span"
            );

        edited.className =
            "edited";

        edited.textContent =
            "(edited)";

        header.appendChild(
            edited
        );

    }


    wrapper.appendChild(
        header
    );


    /* Text */

    if(message.message){

        const text =
            document.createElement(
                "div"
            );

        text.className =
            "message-text";

        text.textContent =
            message.message;

        wrapper.appendChild(
            text
        );

    }


    /* Image */

    if(message.image){

        const image =
            document.createElement(
                "img"
            );

        image.className =
            "message-image";

        image.src =
            message.image;

        image.alt =
            "Image";

        image.loading =
            "lazy";


        image.addEventListener(
            "click",
            () => {

                openFullscreenImage(
                    message.image
                );

            }
        );


        wrapper.appendChild(
            image
        );

    }


    /* Right click */

    wrapper.addEventListener(
        "contextmenu",
        event => {

            if(
                message.device_id !==
                DEVICE_ID
            ){

                return;

            }


            event.preventDefault();

            showContextMenu(
                event.clientX,
                event.clientY,
                message
            );

        }
    );


    return wrapper;

}


/* =========================================================
   CONTEXT MENU
========================================================= */

let contextMessage =
    null;


function showContextMenu(
    x,
    y,
    message
){

    contextMessage =
        message;


    contextMenu.style.left =
        x + "px";

    contextMenu.style.top =
        y + "px";


    contextMenu.classList.add(
        "show"
    );

}


function hideContextMenu(){

    contextMenu.classList.remove(
        "show"
    );

    contextMessage =
        null;

}


document.addEventListener(
    "click",
    event => {

        if(
            !contextMenu.contains(
                event.target
            )
        ){

            hideContextMenu();

        }

    }
);


/* =========================================================
   EDIT
========================================================= */

editMessageButton.addEventListener(
    "click",
    () => {

        if(!contextMessage){
            return;
        }


        editInput.value =
            contextMessage.message ||
            "";


        editModal.classList.add(
            "show"
        );


        hideContextMenu();


        setTimeout(
            () => {

                editInput.focus();

            },
            0
        );

    }
);


function closeEdit(){

    editModal.classList.remove(
        "show"
    );

}


editClose.addEventListener(
    "click",
    closeEdit
);

editCancel.addEventListener(
    "click",
    closeEdit
);


editSave.addEventListener(
    "click",
    async () => {

        if(!contextMessage){

            closeEdit();

            return;

        }


        const text =
            editInput.value
            .trim();


        if(!text){

            showStatus(
                "Message cannot be empty."
            );

            return;

        }


        try{

            editSave.disabled =
                true;


            const response =
                await fetch(
                    API_URL,
                    {

                        method:
                            "POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                action:
                                    "edit",

                                id:
                                    contextMessage.id,

                                device_id:
                                    DEVICE_ID,

                                message:
                                    text

                            })

                    }
                );


            const data =
                await response.json();


            if(!response.ok){

                throw new Error(
                    data.error ||
                    "Failed to edit message."
                );

            }


            closeEdit();

            await loadMessages();


        }catch(error){

            showStatus(
                error.message
            );

        }finally{

            editSave.disabled =
                false;

        }

    }
);


/* =========================================================
   DELETE
========================================================= */

deleteMessageButton.addEventListener(
    "click",
    async () => {

        if(!contextMessage){
            return;
        }


        const message =
            contextMessage;


        hideContextMenu();


        const confirmed =
            confirm(
                "Delete this message?"
            );


        if(!confirmed){
            return;
        }


        try{

            const response =
                await fetch(
                    API_URL,
                    {

                        method:
                            "POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                action:
                                    "delete",

                                id:
                                    message.id,

                                device_id:
                                    DEVICE_ID

                            })

                    }
                );


            const data =
                await response.json();


            if(!response.ok){

                throw new Error(
                    data.error ||
                    "Failed to delete message."
                );

            }


            await loadMessages();


        }catch(error){

            showStatus(
                error.message
            );

        }

    }
);


/* =========================================================
   SEND MESSAGE
========================================================= */

sendButton.addEventListener(
    "click",
    sendMessage
);


messageInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


async function sendMessage(){

    const username =
        getUsername();


    if(!username){

        settingsModal.classList.add(
            "show"
        );

        loadSettings();

        usernameSetting.focus();

        showStatus(
            "Set your username first."
        );

        return;

    }


    const text =
        messageInput.value
        .trim();


    if(
        !text &&
        !selectedImage
    ){

        return;

    }


    try{

        sendButton.disabled =
            true;


        const body = {

            action:
                "send",

            username:
                username,

            channel:
                CHANNEL,

            message:
                text,

            image:
                selectedImage,

            device_id:
                DEVICE_ID

        };


        const response =
            await fetch(
                API_URL,
                {

                    method:
                        "POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            body
                        )

                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error ||
                data.fix ||
                "Failed to send message."
            );

        }


        messageInput.value =
            "";

        clearSelectedImage();


        await loadMessages();


    }catch(error){

        console.error(
            error
        );

        showStatus(
            error.message ||
            "Failed to send message."
        );

    }finally{

        sendButton.disabled =
            false;

    }

}


/* =========================================================
   SETTINGS
========================================================= */

settingsButton.addEventListener(
    "click",
    () => {

        loadSettings();

        settingsModal.classList.add(
            "show"
        );

    }
);


settingsClose.addEventListener(
    "click",
    () => {

        settingsModal.classList.remove(
            "show"
        );

    }
);


/* Close modal when clicking outside */

settingsModal.addEventListener(
    "click",
    event => {

        if(
            event.target ===
            settingsModal
        ){

            settingsModal.classList.remove(
                "show"
            );

        }

    }
);


/* =========================================================
   SAVE USERNAME
========================================================= */

saveNameButton.addEventListener(
    "click",
    () => {

        const name =
            usernameSetting.value;


        if(
            setUsername(name)
        ){

            usernameSetting.value =
                getUsername();

            showStatus(
                "Username saved."
            );

        }

    }
);


usernameSetting.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            saveNameButton.click();

        }

    }
);


/* =========================================================
   REMOVE EVERYTHING
========================================================= */

removeEverythingButton.addEventListener(
    "click",
    async () => {

        const first =
            confirm(
                "This will remove every message forever.\n\nAre you sure?"
            );


        if(!first){
            return;
        }


        const second =
            prompt(
                'Type "I KNOW" to continue.'
            );


        if(
            second !==
            "I KNOW"
        ){

            showStatus(
                "Removal cancelled."
            );

            return;

        }


        const third =
            confirm(
                "Last time: are you ULTRA sure?\n\nEvery message will be removed and will have no evidence of existing.\n\nContinue?"
            );


        if(!third){
            return;
        }


        try{

            removeEverythingButton.disabled =
                true;


            const response =
                await fetch(
                    API_URL,
                    {

                        method:
                            "POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                action:
                                    "delete_all",

                                device_id:
                                    DEVICE_ID

                            })

                    }
                );


            const data =
                await response.json();


            if(!response.ok){

                throw new Error(
                    data.error ||
                    "Failed to remove messages."
                );

            }


            showStatus(
                "Messages removed."
            );


            await loadMessages();


        }catch(error){

            showStatus(
                error.message
            );

        }finally{

            removeEverythingButton.disabled =
                false;

        }

    }
);


/* =========================================================
   FULLSCREEN IMAGE
========================================================= */

function openFullscreenImage(src){

    fullscreenImage.src =
        src;

    imageViewer.classList.add(
        "show"
    );

}


function closeFullscreenImage(){

    imageViewer.classList.remove(
        "show"
    );

    fullscreenImage.src =
        "";

}


imageBack.addEventListener(
    "click",
    closeFullscreenImage
);


/* ESC CLOSES IMAGE */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Escape"
        ){

            if(
                imageViewer.classList.contains(
                    "show"
                )
            ){

                closeFullscreenImage();

            }

            if(
                editModal.classList.contains(
                    "show"
                )
            ){

                closeEdit();

            }

            if(
                settingsModal.classList.contains(
                    "show"
                )
            ){

                settingsModal.classList.remove(
                    "show"
                );

            }

        }

    }
);


/* =========================================================
   TEXTAREA AUTO HEIGHT
========================================================= */

messageInput.addEventListener(
    "input",
    () => {

        messageInput.style.height =
            "44px";

        messageInput.style.height =
            Math.min(
                messageInput.scrollHeight,
                130
            ) + "px";

    }
);


/* =========================================================
   START
========================================================= */

loadSettings();

loadMessages();

</script>
