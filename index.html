<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat</title>

<style>
*{
    box-sizing:border-box;
}

:root{
    --bg:#0b0d10;
    --panel:#111419;
    --panel2:#181c22;
    --panel3:#20252d;
    --border:#292f38;
    --text:#edf0f4;
    --muted:#7e8793;
    --accent:#e8eaed;
    --danger:#ff7070;
    --success:#70d99a;
    --warning:#e5c76b;

    --radius:12px;
    --ui-scale:1;
    --text-size:16px;
    --word-spacing:0px;
    --line-spacing:1.45;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

body{
    overflow:hidden;
    font-size:calc(16px * var(--ui-scale));
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

/* =========================================================
   APP
========================================================= */

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

.header{
    height:64px;
    min-height:64px;
    padding:0 18px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:var(--panel);
    border-bottom:1px solid var(--border);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
}

.logo-icon{
    width:35px;
    height:35px;

    display:grid;
    place-items:center;

    border-radius:10px;
    background:var(--panel2);
    border:1px solid var(--border);
}

.channel{
    color:var(--muted);
    font-weight:400;
}

.header-buttons{
    display:flex;
    gap:7px;
}

.icon-btn{
    width:39px;
    height:39px;

    border-radius:10px;
    border:1px solid var(--border);

    background:var(--panel2);
    color:var(--text);
}

.icon-btn:hover{
    filter:brightness(1.15);
}

/* =========================================================
   MESSAGES
========================================================= */

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    display:flex;
    gap:11px;
    margin-bottom:17px;
}

.avatar{
    flex:0 0 40px;

    width:40px;
    height:40px;

    display:grid;
    place-items:center;

    border-radius:var(--radius);
    background:var(--panel2);
    border:1px solid var(--border);

    font-weight:700;
}

.message-content{
    min-width:0;
    max-width:min(850px,calc(100vw - 90px));
}

.message-top{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:3px;
}

.username{
    font-weight:700;
}

.time,
.edited{
    color:var(--muted);
    font-size:11px;
}

.message-text{
    color:#d8dde4;
    white-space:pre-wrap;
    overflow-wrap:anywhere;

    font-size:var(--text-size);
    word-spacing:var(--word-spacing);
    line-height:var(--line-spacing);
}

.message-image{
    display:block;

    max-width:min(500px,80vw);
    max-height:500px;

    margin-top:8px;

    border:1px solid var(--border);
    border-radius:var(--radius);

    background:#000;
    object-fit:contain;

    cursor:pointer;
}

/* =========================================================
   COMPOSER
========================================================= */

.composer{
    padding:12px 16px 16px;

    background:var(--panel);
    border-top:1px solid var(--border);
}

.composer-box{
    max-width:1100px;
    margin:auto;

    display:flex;
    align-items:flex-end;
    gap:7px;

    padding:8px;

    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:14px;
}

textarea{
    flex:1;

    min-height:42px;
    max-height:150px;

    resize:none;

    border:0;
    outline:none;

    background:transparent;
    color:white;

    padding:10px;
}

.attach-btn,
.send-btn{
    height:42px;

    border:0;
    border-radius:9px;
}

.attach-btn{
    width:42px;

    background:transparent;
    color:#adb5c0;

    font-size:20px;
}

.attach-btn:hover{
    background:#242932;
}

.send-btn{
    padding:0 18px;

    background:var(--accent);
    color:#111;

    font-weight:700;
}

.send-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* =========================================================
   OVERLAY
========================================================= */

.overlay{
    position:fixed;
    inset:0;

    display:none;
    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.72);

    z-index:100;
}

.overlay.show{
    display:flex;
}

.panel{
    width:min(620px,calc(100vw - 25px));
    max-height:calc(100vh - 25px);

    overflow-y:auto;

    background:var(--panel);

    border:1px solid var(--border);
    border-radius:15px;

    box-shadow:0 25px 80px #000b;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:18px;

    border-bottom:1px solid var(--border);
}

.panel-header h2{
    margin:0;
}

.panel-body{
    padding:18px;
}

/* =========================================================
   GAMES
========================================================= */

.games-panel{
    width:min(900px,calc(100vw - 25px));
}

.games-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;

    margin-bottom:15px;
}

.games-top h2{
    margin:0;
}

.primary-btn{
    border:0;
    border-radius:9px;

    padding:10px 15px;

    background:var(--accent);
    color:#111;

    font-weight:700;
}

.secondary-btn{
    border:1px solid var(--border);
    border-radius:9px;

    padding:9px 14px;

    background:var(--panel3);
    color:var(--text);
}

.danger-btn{
    border:1px solid #743333;
    border-radius:9px;

    padding:9px 14px;

    background:#241719;
    color:#ff8585;
}

.games-list{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:12px;
}

.game-card{
    background:var(--panel2);

    border:1px solid var(--border);
    border-radius:13px;

    padding:15px;
}

.game-card h3{
    margin:0 0 6px;
}

.game-description{
    color:var(--muted);
    font-size:13px;
    min-height:38px;
}

.game-status{
    display:flex;
    align-items:center;
    gap:6px;

    margin:10px 0;

    font-size:12px;
}

.status-dot{
    width:8px;
    height:8px;

    border-radius:50%;

    background:var(--success);
}

.status-dot.waiting{
    background:var(--warning);
}

.game-card-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
}

.players-small{
    color:var(--muted);
    font-size:12px;
}

.no-games{
    padding:40px 15px;

    text-align:center;

    color:var(--muted);
}

/* =========================================================
   GAME CREATE
========================================================= */

.game-select{
    width:100%;

    margin-bottom:12px;

    padding:11px;

    background:#101419;
    color:white;

    border:1px solid var(--border);
    border-radius:9px;
}

/* =========================================================
   GAME ROOM
========================================================= */

.game-room{
    width:min(800px,calc(100vw - 20px));
}

.game-room-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;

    padding:18px;

    border-bottom:1px solid var(--border);
}

.game-room-title h2{
    margin:0 0 5px;
}

.game-room-title small{
    color:var(--muted);
}

.game-room-body{
    padding:18px;
}

.game-info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;

    margin-bottom:15px;
}

.info-box{
    padding:11px;

    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:10px;
}

.info-label{
    color:var(--muted);
    font-size:11px;
}

.info-value{
    margin-top:3px;
    font-weight:700;
}

.turn-banner{
    padding:12px;

    margin-bottom:15px;

    text-align:center;

    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:10px;

    font-weight:700;
}

.turn-banner.my-turn{
    border-color:#667078;
}

/* =========================================================
   PLAYER LIST
========================================================= */

.player-list{
    display:flex;
    flex-wrap:wrap;
    gap:7px;

    margin-bottom:15px;
}

.player-chip{
    padding:6px 9px;

    background:var(--panel2);

    border:1px solid var(--border);
    border-radius:8px;

    font-size:12px;
}

.player-chip.host{
    border-color:#80734b;
}

.player-chip.me{
    border-color:#657b8b;
}

/* =========================================================
   GAME BOARD
========================================================= */

.board{
    display:grid;

    margin:15px auto;

    width:min(420px,90vw);
}

.tictactoe-board{
    grid-template-columns:repeat(3,1fr);
}

.ttt-cell{
    aspect-ratio:1;

    display:grid;
    place-items:center;

    font-size:clamp(35px,9vw,65px);
    font-weight:800;

    background:var(--panel2);

    border:1px solid var(--border);

    color:var(--text);
}

.ttt-cell:hover{
    background:var(--panel3);
}

.connect-board{
    grid-template-columns:repeat(7,1fr);

    gap:4px;

    padding:8px;

    background:#101419;

    border:1px solid var(--border);
    border-radius:12px;
}

.connect-cell{
    aspect-ratio:1;

    display:grid;
    place-items:center;

    border-radius:50%;

    background:#080a0d;

    border:1px solid var(--border);

    cursor:pointer;
}

.connect-piece{
    width:78%;
    height:78%;

    border-radius:50%;

    background:#777;
}

.connect-piece.red{
    background:#d85c5c;
}

.connect-piece.yellow{
    background:#d9c55b;
}

.dice-area{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:15px;

    padding:30px 10px;
}

.dice{
    width:100px;
    height:100px;

    display:grid;
    place-items:center;

    background:var(--panel2);

    border:1px solid var(--border);
    border-radius:18px;

    font-size:50px;
}

.rps-area{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;

    padding:25px 0;
}

.rps-choice{
    min-width:110px;

    padding:18px 15px;

    background:var(--panel2);

    border:1px solid var(--border);
    border-radius:12px;

    color:var(--text);

    font-weight:700;
}

.rps-choice:hover{
    background:var(--panel3);
}

.highlow-area{
    text-align:center;

    padding:25px 10px;
}

.card-display{
    width:120px;
    height:165px;

    margin:15px auto;

    display:grid;
    place-items:center;

    background:#f0f0f0;
    color:#111;

    border-radius:12px;

    font-size:42px;
    font-weight:800;
}

.highlow-buttons{
    display:flex;
    justify-content:center;
    gap:10px;
}

.game-message{
    margin-top:12px;

    padding:10px;

    text-align:center;

    color:var(--muted);

    background:var(--panel2);

    border-radius:9px;
}

/* =========================================================
   SETTINGS
========================================================= */

.category{
    margin-bottom:12px;

    border:1px solid var(--border);
    border-radius:12px;

    overflow:hidden;

    background:var(--panel2);
}

.category-title{
    width:100%;

    padding:14px;

    border:0;

    background:transparent;
    color:var(--text);

    display:flex;
    justify-content:space-between;

    font-weight:700;

    text-align:left;
}

.category-title span:last-child{
    color:var(--muted);
}

.category-body{
    display:none;

    padding:0 14px 14px;
}

.category.open .category-body{
    display:block;
}

.setting{
    margin-top:14px;
}

.setting label{
    display:block;

    margin-bottom:7px;

    color:#aab2bd;

    font-size:13px;
}

.setting input,
.setting select{
    width:100%;

    padding:10px;

    border:1px solid var(--border);
    border-radius:9px;

    outline:none;

    background:#101419;
    color:white;
}

.setting input[type="range"]{
    padding:0;
}

.setting-value{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.save-btn{
    width:100%;

    margin-top:8px;

    padding:12px;

    border:0;
    border-radius:9px;

    background:var(--accent);
    color:#111;

    font-weight:700;
}

/* =========================================================
   CONTEXT MENU
========================================================= */

.context-menu{
    position:fixed;

    display:none;

    width:160px;

    padding:5px;

    z-index:200;

    background:var(--panel2);

    border:1px solid var(--border);
    border-radius:9px;

    box-shadow:0 15px 40px #0009;
}

.context-menu.show{
    display:block;
}

.context-menu button{
    width:100%;

    padding:9px 10px;

    text-align:left;

    border:0;
    border-radius:6px;

    background:transparent;
    color:var(--text);
}

.context-menu button:hover{
    background:#252b33;
}

.delete-option{
    color:#ff7777!important;
}

/* =========================================================
   IMAGE
========================================================= */

.image-viewer{
    position:fixed;
    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    background:#000f;

    z-index:300;
}

.image-viewer.show{
    display:flex;
}

.full-image{
    max-width:95vw;
    max-height:90vh;

    object-fit:contain;
}

.back-image{
    position:absolute;

    top:18px;
    left:18px;

    padding:10px 16px;

    border-radius:9px;
    border:1px solid #3a4049;

    background:#171b21;
    color:white;
}

/* =========================================================
   DIALOG
========================================================= */

.dialog{
    width:min(450px,calc(100vw - 30px));

    background:var(--panel);

    border:1px solid var(--border);
    border-radius:14px;

    padding:20px;
}

.dialog h2{
    margin-top:0;
}

.dialog p{
    color:#aab2bd;
    line-height:1.5;
}

.dialog-buttons{
    display:flex;
    gap:8px;
    justify-content:flex-end;
}

.dialog-buttons button{
    padding:10px 16px;

    border-radius:8px;
    border:1px solid var(--border);

    background:#20252c;
    color:white;
}

.dialog-buttons .danger{
    background:#6b2929;
    border-color:#813434;
}

/* =========================================================
   DANGER
========================================================= */

.danger-zone{
    margin-top:20px;
    padding-top:20px;

    border-top:1px solid #402529;
}

.danger-title{
    color:var(--danger);
    font-weight:700;

    margin-bottom:7px;
}

.danger-zone p{
    color:var(--muted);
    line-height:1.45;
}

.danger-btn-wide{
    width:100%;

    padding:12px;

    border-radius:9px;

    border:1px solid #743333;

    background:#241719;
    color:#ff8585;
}

/* =========================================================
   EMPTY
========================================================= */

.empty{
    height:100%;

    display:grid;
    place-items:center;

    color:#656d78;

    text-align:center;
}

.empty strong{
    display:block;

    color:#aab2bd;

    margin-bottom:5px;
}

@media(max-width:600px){

    .header{
        padding:0 11px;
    }

    .messages{
        padding:15px 11px;
    }

    .channel{
        display:none;
    }

    .message-content{
        max-width:calc(100vw - 70px);
    }

    .game-info{
        grid-template-columns:1fr;
    }

    .game-room-header{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="logo">
        <div class="logo-icon">💬</div>
        <span>Chat</span>
        <span class="channel"># general</span>
    </div>

    <div class="header-buttons">

        <button
            class="icon-btn"
            id="gamesBtn"
            title="Games"
        >🎮</button>

        <button
            class="icon-btn"
            id="settingsBtn"
            title="Settings"
        >⚙</button>

    </div>

</header>


<main
    class="messages"
    id="messages"
></main>


<div class="composer">

    <div class="composer-box">

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
        >

        <button
            class="attach-btn"
            id="attachBtn"
            title="Choose image"
        >＋</button>

        <textarea
            id="messageInput"
            rows="1"
            placeholder="Message #general"
        ></textarea>

        <button
            class="send-btn"
            id="sendBtn"
        >Send</button>

    </div>

</div>

</div>


<!-- ======================================================
     GAMES LIST
====================================================== -->

<div
    class="overlay"
    id="gamesOverlay"
>

<div class="panel games-panel">

<div class="panel-header">

    <h2>🎮 Games & Activities</h2>

    <button
        class="icon-btn"
        id="closeGames"
    >×</button>

</div>

<div class="panel-body">

<div class="games-top">

    <div>
        <strong>Play together</strong>
        <div style="color:var(--muted);font-size:12px">
            Join before the host starts the game.
        </div>
    </div>

    <button
        class="primary-btn"
        id="createGameBtn"
    >
        + Host Game
    </button>

</div>

<div
    class="games-list"
    id="gamesList"
></div>

</div>
</div>
</div>


<!-- ======================================================
     CREATE GAME
====================================================== -->

<div
    class="overlay"
    id="createGameOverlay"
>

<div class="panel">

<div class="panel-header">

    <h2>Host a Game</h2>

    <button
        class="icon-btn"
        id="closeCreateGame"
    >×</button>

</div>

<div class="panel-body">

<label
    style="display:block;margin-bottom:7px;color:var(--muted)"
>
Choose a game
</label>

<select
    id="gameTypeSelect"
    class="game-select"
>

<option value="tictactoe">
    Tic Tac Toe
</option>

<option value="connect4">
    Connect Four
</option>

<option value="dice">
    Dice Duel
</option>

<option value="rps">
    Rock Paper Scissors
</option>

<option value="highlow">
    High Card
</option>

</select>

<button
    class="primary-btn"
    id="confirmCreateGame"
    style="width:100%"
>
Create Lobby
</button>

</div>
</div>
</div>


<!-- ======================================================
     GAME ROOM
====================================================== -->

<div
    class="overlay"
    id="gameRoomOverlay"
>

<div class="panel game-room">

<div class="game-room-header">

<div class="game-room-title">

<h2 id="gameRoomTitle">
Game
</h2>

<small id="gameRoomStatus">
Waiting for players
</small>

</div>

<div id="gameRoomActions"></div>

</div>

<div class="game-room-body">

<div class="game-info">

<div class="info-box">

<div class="info-label">
HOST
</div>

<div
    class="info-value"
    id="gameHostName"
>
-
</div>

</div>

<div class="info-box">

<div class="info-label">
PLAYERS
</div>

<div
    class="info-value"
    id="gamePlayersCount"
>
0
</div>

</div>

<div class="info-box">

<div class="info-label">
TURN
</div>

<div
    class="info-value"
    id="gameTurnName"
>
-
</div>

</div>

</div>


<div
    class="player-list"
    id="gamePlayerList"
></div>


<div
    class="turn-banner"
    id="turnBanner"
>
Waiting...
</div>


<div id="gameContent"></div>


<div
    class="game-message"
    id="gameMessage"
>
Waiting...
</div>

</div>
</div>
</div>


<!-- ======================================================
     SETTINGS
====================================================== -->

<div
    class="overlay"
    id="settingsOverlay"
>

<div class="panel">

<div class="panel-header">

    <h2>Settings</h2>

    <button
        class="icon-btn"
        id="closeSettings"
    >×</button>

</div>

<div class="panel-body">

<div class="category open">

<button class="category-title">
    <span>👤 Profile</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Your name</label>

<input
    id="usernameInput"
    maxlength="24"
    placeholder="Enter your name"
>

</div>

<div class="setting">

<label>Device ID</label>

<input
    id="deviceIdInput"
    readonly
>

</div>

</div>
</div>


<div class="category">

<button class="category-title">
    <span>📝 Text</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Text size</label>

<input
    id="textSize"
    type="range"
    min="12"
    max="24"
    step="1"
>

<div
    class="setting-value"
    id="textSizeValue"
></div>

</div>

<div class="setting">

<label>Word spacing</label>

<input
    id="wordSpacing"
    type="range"
    min="0"
    max="12"
    step="1"
>

<div

<script>

/* =========================================================
   BASIC CONFIG
========================================================= */

const API_URL="/api/messages";
const CHANNEL="general";

/*
   Special marker.

   These are stored in the SAME messages table,
   but the normal chat renderer ignores them.
*/
const GAME_MARKER="__HIDDEN_GAME_STATE__";


/* =========================================================
   DEVICE
========================================================= */

let deviceId=localStorage.getItem("chat_device_id");

if(!deviceId){

    deviceId=crypto.randomUUID();

    localStorage.setItem(
        "chat_device_id",
        deviceId
    );
}


/* =========================================================
   SETTINGS
========================================================= */

const defaults={

    username:"",
    theme:"dark",

    refreshRate:500,

    showTimestamps:true,
    compactMessages:false,

    textSize:16,
    wordSpacing:0,
    lineSpacing:1.45,

    cornerRadius:12,
    uiScale:1,

    enterToSend:true,
    autoScroll:true,
    confirmDelete:true,

    showGamesButton:true,
    gameRefresh:500,
    gameSounds:true
};

function getSetting(key){

    const value=
        localStorage.getItem("chat_"+key);

    if(value===null){
        return defaults[key];
    }

    if(
        value==="true" ||
        value==="false"
    ){
        return value==="true";
    }

    const number=Number(value);

    return Number.isNaN(number)
        ?value
        :number;
}

let settings={};

Object.keys(defaults).forEach(key=>{
    settings[key]=getSetting(key);
});


/* =========================================================
   ELEMENTS
========================================================= */

const messagesEl=
    document.getElementById("messages");

const messageInput=
    document.getElementById("messageInput");

const sendBtn=
    document.getElementById("sendBtn");

const imageInput=
    document.getElementById("imageInput");

const attachBtn=
    document.getElementById("attachBtn");


const settingsBtn=
    document.getElementById("settingsBtn");

const settingsOverlay=
    document.getElementById("settingsOverlay");

const closeSettings=
    document.getElementById("closeSettings");

const saveSettings=
    document.getElementById("saveSettings");


const gamesBtn=
    document.getElementById("gamesBtn");

const gamesOverlay=
    document.getElementById("gamesOverlay");

const closeGames=
    document.getElementById("closeGames");

const gamesList=
    document.getElementById("gamesList");

const createGameBtn=
    document.getElementById("createGameBtn");

const createGameOverlay=
    document.getElementById("createGameOverlay");

const closeCreateGame=
    document.getElementById("closeCreateGame");

const gameTypeSelect=
    document.getElementById("gameTypeSelect");

const confirmCreateGame=
    document.getElementById("confirmCreateGame");


const gameRoomOverlay=
    document.getElementById("gameRoomOverlay");

const gameRoomTitle=
    document.getElementById("gameRoomTitle");

const gameRoomStatus=
    document.getElementById("gameRoomStatus");

const gameRoomActions=
    document.getElementById("gameRoomActions");

const gameHostName=
    document.getElementById("gameHostName");

const gamePlayersCount=
    document.getElementById("gamePlayersCount");

const gameTurnName=
    document.getElementById("gameTurnName");

    document.getElementById("gamePlayerList");

const turnBanner=
    document.getElementById("turnBanner");

const gameContent=
    document.getElementById("gameContent");

const gameMessage=
    document.getElementById("gameMessage");


/* SETTINGS ELEMENTS */

const usernameInput=
    document.getElementById("usernameInput");

const deviceIdInput=
    document.getElementById("deviceIdInput");

const themeSelect=
    document.getElementById("themeSelect");

const refreshRate=
    document.getElementById("refreshRate");

const showTimestamps=
    document.getElementById("showTimestamps");

const compactMessages=
    document.getElementById("compactMessages");

const lineSpacing=
    document.getElementById("lineSpacing");

    document.getElementById("cornerRadius");

    document.getElementById("confirmDelete");

    document.getElementById("showGamesButton");

    document.getElementById("gameRefresh");

    document.getElementById("gameSounds");

    document.getElementById("textSizeValue");

const wordSpacingValue=
    document.getElementById("wordSpacingValue");

const lineSpacingValue=
    document.getElementById("lineSpacingValue");

const cornerRadiusValue=
    document.getElementById("cornerRadiusValue");

    document.getElementById("uiScaleValue");


/* NORMAL CHAT */

const contextMenu=
    document.getElementById("contextMenu");

const editMessageBtn=
    document.getElementById("editMessage");

const deleteMessageBtn=
    document.getElementById("deleteMessage");


const imageViewer=
    document.getElementById("imageViewer");

const fullImage=
    document.getElementById("fullImage");

    document.getElementById("backImage");

    document.getElementById("dialogOverlay");

    document.getElementById("dialogTitle");

const dialogText=
    document.getElementById("dialogText");

const dialogCancel=
    document.getElementById("dialogCancel");

const dialogConfirm=
    document.getElementById("dialogConfirm");

const removeEverything=
    document.getElementById("removeEverything");


/* =========================================================
   STATE
========================================================= */

let selectedFile=null;
let selectedMessage=null;

let currentMessages=[];

let refreshTimer=null;
let gameTimer=null;

let gameStates=new Map();

let currentGameId=null;

let confirmCallback=null;


/* =========================================================
   GAME DEFINITIONS
========================================================= */

const GAME_DEFINITIONS={

    tictactoe:{
        name:"Tic Tac Toe",
        icon:"❌",
        description:"Classic 3×3 game for two players.",
        maxPlayers:2
    },

    connect4:{
        name:"Connect Four",
        icon:"🔴",
        description:"Connect four pieces in a row.",
        maxPlayers:2
    },

    dice:{
        name:"Dice Duel",
        icon:"🎲",
        description:"Roll against another player.",
        maxPlayers:2
    },

    rps:{
        name:"Rock Paper Scissors",
        icon:"✊",
        description:"Choose your move and beat your opponent.",
        maxPlayers:2
    },

    highlow:{
        name:"High Card",
        icon:"🃏",
        description:"Guess whether the next card is higher or lower.",
        maxPlayers:2
    }

};


/* =========================================================
   ID
========================================================= */

function makeId(){

    if(
        typeof crypto!=="undefined" &&
        crypto.randomUUID
    ){

        return crypto.randomUUID();

    }

    return Date.now()+"_"+Math.random()
        .toString(36)
        .substring(2);
}


/* =========================================================
   GAME STATE MESSAGE
========================================================= */

function encodeGameState(state){

    return GAME_MARKER+
        JSON.stringify(state);
}

function decodeGameState(message){

    if(
        !message ||
        typeof message.message!=="string"
    ){
        return null;
    }

    if(
        !message.message.startsWith(
            GAME_MARKER
        )
    ){
        return null;
    }

    try{

        return JSON.parse(
            message.message.substring(
                GAME_MARKER.length
            )
        );

    }catch{

        return null;

    }
}


/* =========================================================
   POST HIDDEN GAME STATE
========================================================= */

async function saveGameState(state){

    const response=
        await fetch(API_URL,{
            method:"POST",

            headers:{
                "Content-Type":
                    "application/json"
            },

            body:JSON.stringify({

                username:"SYSTEM",

                channel:CHANNEL,

                message:
                    encodeGameState(state),

                image:null,

                device_id:
                    "GAME_"+state.id

            })

        });

    const data=
        await response.json();

    if(!response.ok){

        throw new Error(
            data.error||
            "Could not save game."
        );

    }

    return data;
}


/* =========================================================
   CREATE BASE GAME
========================================================= */

function createBaseGame(type){

    const definition=
        GAME_DEFINITIONS[type];

    return {

        id:makeId(),

        type:type,

        name:definition.name,

        icon:definition.icon,

        hostId:deviceId,

        hostName:
            settings.username,

        status:"lobby",

        createdAt:
            Date.now(),

        startedAt:null,

        players:[],

        turnIndex:0,

        winner:null,

        message:"Waiting for players.",

        data:createGameData(type)

    };
}


function createGameData(type){

    if(type==="tictactoe"){

        return {
            board:Array(9).fill(""),
            symbols:{}
        };

    }

    if(type==="connect4"){

        return {
            board:
                Array(42).fill(""),
            symbols:{}
        };

    }

    if(type==="dice"){

        return {
            rolls:{},
            result:null
        };

    }

    if(type==="rps"){

        return {
            choices:{},
            result:null
        };

    }

    if(type==="highlow"){

        return {
            deck:[],
            currentCard:null,
            nextCard:null,
            guess:null,
            score:{}
        };

    }

    return {};

}


/* =========================================================
   HOST LIMIT
========================================================= */

function userIsHostingGame(){

    for(const state of gameStates.values()){

        if(
            state.status!=="finished" &&
            state.status!=="stopped" &&
            state.hostId===deviceId
        ){

            return state;

        }

    }

    return null;
}


/* =========================================================
   CREATE GAME
========================================================= */

confirmCreateGame.onclick=async()=>{

    if(!settings.username){

        alert(
            "Set your name in Settings first."
        );

        settingsBtn.click();

        return;
    }


    const existing=
        userIsHostingGame();

    if(existing){

        alert(
            "You are already hosting a game.\n\n"+
            "You can only host one game at a time."
        );

        return;
    }


    const type=
        gameTypeSelect.value;

    const state=
        createBaseGame(type);


    /*
       Host automatically joins before starting.
    */

    state.players.push({

        id:deviceId,

        name:settings.username,

        joinedAt:Date.now(),

        symbol:null

    });


    assignSymbols(state);


    try{

        await saveGameState(state);

        createGameOverlay
            .classList.remove("show");

        gamesOverlay
            .classList.remove("show");

        currentGameId=state.id;

        gameRoomOverlay
            .classList.add("show");

        await loadMessages();

        openGame(state.id);

    }catch(error){

        alert(
            "Could not create game:\n\n"+
            error.message
        );

    }

};


/* =========================================================
   JOIN
========================================================= */

async function joinGame(gameId){

    const state=
        gameStates.get(gameId);

    if(!state)return;


    if(
        state.status!=="lobby"
    ){

        alert(
            "This game has already started."
        );

        return;
    }


    if(
        state.players.some(
            p=>p.id===deviceId
        )
    ){

        currentGameId=gameId;

        gamesOverlay
            .classList.remove("show");

        gameRoomOverlay
            .classList.add("show");

        openGame(gameId);

        return;
    }


    const definition=
        GAME_DEFINITIONS[state.type];


    if(
        state.players.length>=
        definition.maxPlayers
    ){

        alert(
            "This game is full."
        );

        return;
    }


    if(!settings.username){

        alert(
            "Set your name in Settings first."
        );

        settingsBtn.click();

        return;
    }


    state.players.push({

        id:deviceId,

        name:settings.username,

        joinedAt:Date.now(),

        symbol:null

    });


    assignSymbols(state);


    await saveGameState(state);

    currentGameId=gameId;

    gamesOverlay
        .classList.remove("show");

    gameRoomOverlay
        .classList.add("show");

    await loadMessages();

    openGame(gameId);
}


/* =========================================================
   ASSIGN SYMBOLS
========================================================= */

function assignSymbols(state){

    if(state.type==="tictactoe"){

        state.players.forEach(
            (player,index)=>{
                player.symbol=
                    index===0
                    ?"X"
                    :"O";
            }
        );

    }


    if(state.type==="connect4"){

        state.players.forEach(
            (player,index)=>{
                player.symbol=
                    index===0
                    ?"R"
                    :"Y";
            }
        );

    }

}


/* =========================================================
   START GAME
========================================================= */

async function startGame(){

    const state=
        gameStates.get(currentGameId);

    if(!state)return;

    if(state.hostId!==deviceId){

        return;
    }


    if(
        state.players.length<2
    ){

        alert(
            "You need at least 2 players."
        );

        return;
    }


    if(state.status!=="lobby"){

        return;
    }


    state.status="running";

    state.startedAt=Date.now();

    state.turnIndex=0;

    state.message=
        "Game started!";


    /*
       IMPORTANT:

       players are NOT allowed to join
       after this point.
    */


    await saveGameState(state);

    await loadMessages();

    openGame(state.id);
}


/* =========================================================
   FORCE STOP
========================================================= */

async function forceStopGame(){

    const state=
        gameStates.get(currentGameId);

    if(!state)return;

    if(state.hostId!==deviceId){

        return;
    }


    if(
        !confirm(
            "Force stop this game?\n\n"+
            "Everyone will be removed from the game."
        )
    ){

        return;
    }


    state.status="stopped";

    state.message=
        "The host stopped the game.";

    state.players=[];

    state.winner=null;


    await saveGameState(state);

    currentGameId=null;

    gameRoomOverlay
        .classList.remove("show");

    await loadMessages();
}


/* =========================================================
   LEAVE
========================================================= */

async function leaveGame(){

    const state=
        gameStates.get(currentGameId);

    if(!state)return;


    /*
       Host cannot simply leave.

       They must force stop.
    */

    if(state.hostId===deviceId){

        alert(
            "You are the host.\n\n"+
            "Use Force Stop to close the game."
        );

        return;
    }


    state.players=
        state.players.filter(
            p=>p.id!==deviceId
        );


    /*
       If a player leaves during a running
       game, the remaining player wins.
    */

    if(
        state.status==="running" &&
        state.players.length===1
    ){

        state.status="finished";

        state.winner=
            state.players[0].id;

        state.message=
            state.players[0].name+
            " wins because the other player left.";

    }


    await saveGameState(state);

    currentGameId=null;

    gameRoomOverlay
        .classList.remove("show");

    await loadMessages();
}


/* =========================================================
   OPEN GAME
========================================================= */

function openGame(gameId){

    const state=
        gameStates.get(gameId);

    if(!state)return;

    currentGameId=gameId;

    gameRoomOverlay
        .classList.add("show");

    renderGameRoom(state);
}


/* =========================================================
   GAME ROOM RENDER
========================================================= */

function renderGameRoom(state){

    const definition=
        GAME_DEFINITIONS[state.type];


    gameRoomTitle.textContent=
        definition.icon+
        " "+
        definition.name;


    gameRoomStatus.textContent=
        state.status==="lobby"
        ?"Waiting for players"
        :
        state.status==="running"
        ?"Game in progress"
        :
        state.status==="stopped"
        ?"Game stopped"
        :
        "Game finished";


    gameHostName.textContent=
        state.hostName;


    gamePlayersCount.textContent=
        state.players.length+
        "/"+
        definition.maxPlayers;


    const turnPlayer=
        state.players[
            state.turnIndex
        ];


    gameTurnName.textContent=
        turnPlayer
        ?turnPlayer.name
        :"";


    renderPlayers(state);


    const myPlayer=
        state.players.find(
            p=>p.id===deviceId
        );


    const isMyTurn=
        state.status==="running" &&
        turnPlayer &&
        turnPlayer.id===deviceId;


    turnBanner.classList.toggle(
        "my-turn",
        isMyTurn
    );


    if(state.status==="lobby"){

        turnBanner.textContent=
            state.players.length+
            " player"+
            (
                state.players.length===1
                ?""
                :"s"
            )+
            " joined. Waiting for host.";

    }else if(state.status==="running"){

        turnBanner.textContent=
            isMyTurn
            ?"🎯 Your turn!"
            :"⏳ "+turnPlayer.name+"'s turn";

    }else if(state.status==="finished"){

        const winner=
            state.players.find(
                p=>p.id===state.winner
            );

        turnBanner.textContent=
            winner
            ?"🏆 "+winner.name+" wins!"
            :"Game finished.";

    }else{

        turnBanner.textContent=
            "🛑 "+state.message;

    }


    renderGameActions(state,myPlayer);

    renderGameContent(state,isMyTurn);

    gameMessage.textContent=
        state.message||"";
}


/* =========================================================
   PLAYERS
========================================================= */

function renderPlayers(state){

    gamePlayerList.innerHTML="";

    state.players.forEach(player=>{

        const chip=
            document.createElement("div");

        chip.className="player-chip";

        if(
            player.id===state.hostId
        ){

            chip.classList.add("host");

        }

        if(
            player.id===deviceId
        ){

            chip.classList.add("me");

        }


        let text=
            player.name;


        if(
            player.id===state.hostId
        ){

            text+=" 👑";

        }


        if(player.symbol){

            text+=" ["+
                player.symbol+
                "]";

        }


        if(
            state.status==="running" &&
            state.players[
                state.turnIndex
            ]?.id===player.id
        ){

            text+=" 🎯";

        }


        chip.textContent=text;

        gamePlayerList.appendChild(chip);

    });

}


/* =========================================================
   GAME ACTION BUTTONS
========================================================= */

function renderGameActions(
    state,
    myPlayer
){

    gameRoomActions.innerHTML="";


    if(
        state.hostId===deviceId
    ){

        if(
            state.status==="lobby"
        ){

            const start=
                document.createElement("button");

            start.className=
                "primary-btn";

            start.textContent=
                "Start Game";

            start.onclick=
                startGame;

            gameRoomActions
                .appendChild(start);

        }


        if(
            state.status==="lobby" ||
            state.status==="running"
        ){

            const stop=
                document.createElement("button");

            stop.className=
                "danger-btn";

            stop.style.marginLeft="6px";

async function playTicTacToe(
    state,
    index
){

    if(state.status!=="running")return;


    const player=
        state.players[
            state.turnIndex
        ];


    if(
        !player ||
        player.id!==deviceId
    ){

        return;
    }


    if(
        state.data.board[index]!==""
    ){

        return;
    }


    state.data.board[index]=
        player.symbol;


    const winner=
        checkTicTacToeWinner(
            state.data.board
        );


    if(winner){

        state.status="finished";

        state.winner=deviceId;

        state.message=
            settings.username+
            " wins!";

    }else if(
        state.data.board.every(
            cell=>cell!==""
        )
    ){

        state.status="finished";

        state.winner=null;

        state.message=
            "Draw!";

    }else{

        state.turnIndex=
            (state.turnIndex+1)%
            state.players.length;

        state.message=
            state.players[
                state.turnIndex
            ].name+
            "'s turn.";

    }


    await saveGameState(state);

    await loadMessages();

}


function checkTicTacToeWinner(board){

    const lines=[

        [0,1,2],
        [3,4,5],
        [6,7,8],

        [0,3,6],
        [1,4,7],
        [2,5,8],

        [0,4,8],
        [2,4,6]

    ];


    for(const line of lines){

        const[a,b,c]=line;

        if(
            board[a] &&
            board[a]===board[b] &&
            board[a]===board[c]
        ){

            return board[a];

        }

    }

    return null;
}

async function playConnect4(
    state,
    col
){

    if(state.status!=="running")return;


    const player=
        state.players[
            state.turnIndex
        ];


    if(
        !player ||
        player.id!==deviceId
    ){

        return;
    }


    let target=-1;


    for(
        let row=5;
        row>=0;
        row--
    ){

        const index=
            row*7+col;

        if(
            state.data.board[index]===""
        ){

            target=index;

            break;

        }

    }


    if(target===-1)return;


    state.data.board[target]=
        player.symbol;


    const winner=
        checkConnectWinner(
            state.data.board,
            target
        );


    if(winner){

        state.status="finished";

        state.winner=deviceId;

        state.message=
            settings.username+
            " wins!";

    }else if(
        state.data.board.every(
            cell=>cell!==""
        )
    ){

        state.status="finished";

        state.message="Draw!";

    }else{

        state.turnIndex=
            (state.turnIndex+1)%
            state.players.length;

        state.message=
            state.players[
                state.turnIndex
            ].name+
            "'s turn.";

    }


    await saveGameState(state);

    await loadMessages();

}


function checkConnectWinner(
    board,
    position
){

    const row=
        Math.floor(position/7);

    const col=
        position%7;

    const player=
        board[position];


    const directions=[

        [1,0],
        [0,1],
        [1,1],
        [1,-1]

    ];


    for(
        const [dr,dc]
        of directions
    ){

        let count=1;


        for(
            const direction
            of [-1,1]
        ){

            let r=row;
            let c=col;


            while(true){

                r+=dr*direction;
                c+=dc*direction;


                if(
                    r<0 ||
                    r>=6 ||
                    c<0 ||
                    c>=7
                ){

                    break;

                }


                if(
                    board[r*7+c]!==player
                ){

                    break;

                }


                count++;

            }

        }


        if(count>=4){

            return true;

        }

    }


    return false;
}

        state.players[

        player.id!==deviceId
    ){

        return;

    const roll=
        Math.floor(
            Math.random()*6
        )+1;


    state.data.rolls[deviceId]=
        roll;


    if(
        Object.keys(
            state.data.rolls
        ).length>=

            state.players.map(

                })

        entries.sort(

        if(
            entries[0].roll===

function makeDeck(){

    const suits=[

        "♥",
        "♦",

    for(
        let value=2;
        value<=14;
        value++
    ){

        for(
            const suit
            of suits
        ){

            deck.push({
                value,
                suit
            });

        }

    }

    return deck;
}

async function playHighLow(
    state,
    guess
){

    if(state.status!=="running")return;


    const player=
        state.players[
            state.turnIndex
        ];


    if(
        !player ||
        player.id!==deviceId
    ){

        return;
    }


    if(
        !state.data.deck.length
    ){

        state.data.deck=
            makeDeck()
            .sort(
                ()=>Math.random()-.5
            );

    }


    const current=
        state.data.currentCard||
        state.data.deck.pop();


    const next=
        state.data.deck.pop();


    state.data.currentCard=
        next;


    const correct=
        guess==="higher"
        ?next.value>=current.value
        :next.value<=current.value;


    if(!correct){

        state.status="finished";

        const winner=
            state.players.find(
                p=>p.id!==deviceId
            );


        state.winner=
            winner?.id||null;


        state.message=
            winner
            ?winner.name+
              " wins!"
            :"Game over.";

    }else{

        state.turnIndex=
            (state.turnIndex+1)%
            state.players.length;

        state.message=
            "Correct! "+
            state.players[
                state.turnIndex
            ].name+
            "'s turn.";

    }


    await saveGameState(state);

    await loadMessages();

}


/* =========================================================

========================================================= */

async function loadMessages(){

    try{

        const response=
            await fetch(
                API_URL+
                "?channel="+
                encodeURIComponent(CHANNEL)
            );


        const data=
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error||
                "Failed to load messages."
            );

        }


        currentMessages=
            Array.isArray(data.messages)
            ?data.messages
            :[];


        processGameMessages();

        renderMessages();

        renderGamesList();


        if(currentGameId){

            const current=
                gameStates.get(
                    currentGameId
                );


            if(current){

                renderGameRoom(current);

            }else{

                gameRoomOverlay
                    .classList.remove(
                        "show"
                    );

                currentGameId=null;

            }

        }


    }catch(error){

        messagesEl.innerHTML=`

            <div class="empty">

                <div>

                    <strong>
                        Unable to load messages
                    </strong>

                    ${escapeHtml(
                        error.message
                    )}

                </div>

            </div>

        `;

    }

}


/* =========================================================
   PROCESS HIDDEN GAME MESSAGES
========================================================= */

function processGameMessages(){

    const map=
        new Map();


    /*
       Every game state is a new message.

       The newest message for each game ID
       becomes the current state.
    */

    for(
        const message
        of currentMessages
    ){

        const state=
            decodeGameState(message);


        if(!state)continue;


        const existing=
            map.get(state.id);


        if(
            !existing ||
            state.updatedAt>=
            (existing.updatedAt||0)
        ){

            state.updatedAt=
                state.updatedAt||
                new Date(
                    message.created_at
                ).getTime()||
                Date.now();


            map.set(
                state.id,
                state
            );

        }

    }


    gameStates=map;


    /*
       If someone else force-stopped a game
       while we were inside it, close it.
    */

    if(currentGameId){

        const state=
            gameStates.get(
                currentGameId
            );


        if(
            !state ||
            state.status==="stopped"
        ){

            gameRoomOverlay
                .classList.remove(
                    "show"
                );

            currentGameId=null;

        }

    }

}

                        event.preventDefault();

                        showContextMenu(
                            event.clientX,
                            event.clientY,
                            message
                        );

                    }
                );

            }


            fragment.appendChild(item);

        }
    );


    messagesEl.replaceChildren(
        fragment
    );


    if(
        wasBottom &&
        settings.autoScroll
    ){

        messagesEl.scrollTop=
            messagesEl.scrollHeight;

    }

}

function applyTheme(name){

    const themes={

        dark:["#0b0d10","#111419"],
        midnight:["#080b14","#101522"],
        slate:["#101418","#171d22"],
        black:["#000","#090909"],
        blue:["#091018","#101c29"],
        purple:["#100b17","#191021"],
        green:["#09120d","#101b15"],
        red:["#140b0b","#1e1111"],
        gray:["#151515","#202020"],
        light:["#eeeeee","#fff"],
        oled:["#000","#000"]

    };


    const t=
        themes[name]||
        themes.dark;


    document.documentElement
        .style
        .setProperty(
            "--bg",
            t[0]
        );


    document.documentElement
        .style
        .setProperty(
            "--panel",
            t[1]
        );


    document.body.style.background=
        t[0];

}

/* =========================================================
   IMAGE RESIZE
========================================================= */

function resizeImage(file){

    return new Promise(
        (resolve,reject)=>{

            const reader=
                new FileReader();


            reader.onload=()=>{

                const img=
                    new Image();


                img.onload=()=>{

                    let width=
                        img.width;

                    let height=
                        img.height;


                    const max=1500;


                    if(
                        width>max ||
                        height>max
                    ){

                        const scale=
                            Math.min(
                                max/width,
                                max/height
                            );


                        width=
                            Math.round(
                                width*scale
                            );

                        height=
                            Math.round(
                                height*scale
                            );

                    }


                    const canvas=
                        document.createElement(
                            "canvas"
                        );


                    canvas.width=
                        width;

                    canvas.height=
                        height;


                    const ctx=
                        canvas.getContext(
                            "2d"
                        );


                    ctx.drawImage(
                        img,
                        0,
                        0,
                        width,
                        height
                    );


                    resolve(
                        canvas.toDataURL(
                            "image/jpeg",
                            .78
                        )
                    );

                };


                img.onerror=reject;

                img.src=
                    reader.result;

            };


            reader.onerror=reject;

            reader.readAsDataURL(file);

        }
    );

}

async function sendMessage(){

    const text=
        messageInput.value.trim();


    if(!settings.username){

        settingsBtn.click();

        usernameInput.focus();

        alert(
            "Set your name in Settings first."
        );

        return;
    }


    if(
        !text &&
        !selectedFile
    ){

        return;

    }


    sendBtn.disabled=true;


    try{

        let image=null;


        if(selectedFile){

            image=
                await resizeImage(
                    selectedFile
                );

        }


        const response=
            await fetch(
                API_URL,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            username:
                                settings.username,

                            channel:
                                CHANNEL,

                            message:text,

                            image:image,

                            device_id:
                                deviceId

                        })

                }
            );


        const data=
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error||
                "Failed to send message."
            );

        }


        messageInput.value="";

        messageInput.style.height=
            "auto";


        selectedFile=null;

        imageInput.value="";

        attachBtn.textContent=
            "＋";


        await loadMessages();


    }catch(error){

        alert(
            "Failed to send:\n\n"+
            error.message
        );

    }finally{

        sendBtn.disabled=false;

    }

}

========================================================= */

function startRefreshTimer(){

    if(refreshTimer){

        clearInterval(
            refreshTimer
        );

    }


    refreshTimer=
        setInterval(
            loadMessages,
            Number(
                settings.refreshRate
            )
        );

}


function startGameTimer(){

    if(gameTimer){

        clearInterval(
            gameTimer
        );

    }


    gameTimer=
        setInterval(
            async()=>{

                /*
                   Games need to refresh independently
                   from normal chat if desired.
                */

                await loadMessages();

            },
            Number(
                settings.gameRefresh
            )
        );

}


/* =========================================================
   HELPERS
========================================================= */

function formatTime(date){

    if(!date)return "";


    return new Date(date)
        .toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

}


function escapeHtml(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}
