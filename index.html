<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyChat</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #111214;
    color: white;
    font-family: Arial, sans-serif;
}

body {
    overflow: hidden;
}

.app {
    display: flex;
    height: 100vh;
}

.sidebar {
    width: 240px;
    background: #18191c;
    display: flex;
    flex-direction: column;
}

.sidebar-header {
    height: 60px;
    display: flex;
    align-items: center;
    padding: 0 18px;
    font-weight: bold;
    border-bottom: 1px solid #111214;
}

.channels {
    padding: 15px 10px;
    flex: 1;
}

.category {
    color: #949ba4;
    font-size: 11px;
    font-weight: bold;
    padding: 8px;
}

.channel {
    padding: 10px;
    margin: 3px 0;
    border-radius: 5px;
    color: #949ba4;
    cursor: pointer;
}

.channel:hover,
.channel.active {
    background: #404249;
    color: white;
}

.chat {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: #2b2d31;
}

.chat-header {
    height: 60px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    border-bottom: 1px solid #202225;
    font-weight: bold;
}

.chat-header span {
    margin-left: 8px;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.message {
    display: flex;
    margin-bottom: 18px;
}

.avatar {
    width: 40px;
    height: 40px;
    min-width: 40px;
    background: #5865f2;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.message-body {
    margin-left: 12px;
    min-width: 0;
}

.message-top {
    display: flex;
    align-items: baseline;
    gap: 8px;
}

.message-name {
    font-weight: bold;
}

.message-time {
    color: #777;
    font-size: 11px;
}

.message-text {
    margin-top: 4px;
    color: #ddd;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.input-area {
    padding: 15px;
}

.input-box {
    display: flex;
    background: #383a40;
    border-radius: 8px;
    padding: 7px;
}

textarea {
    flex: 1;
    min-height: 40px;
    max-height: 150px;
    resize: none;
    border: 0;
    outline: 0;
    background: transparent;
    color: white;
    padding: 10px;
    font-size: 15px;
}

textarea::placeholder {
    color: #999;
}

.send {
    width: 70px;
    border: 0;
    border-radius: 6px;
    background: #5865f2;
    color: white;
    cursor: pointer;
}

.send:hover {
    background: #4752c4;
}

.send:disabled {
    opacity: 0.5;
}

.status {
    position: fixed;
    top: 10px;
    right: 10px;
    padding: 7px 10px;
    background: #18191c;
    border-radius: 5px;
    font-size: 12px;
    z-index: 20;
}

.status.ok {
    color: #57f287;
}

.status.bad {
    color: #ed4245;
}

.login {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.9);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
}

.login-box {
    width: 350px;
    max-width: calc(100% - 30px);
    padding: 30px;
    background: #313338;
    border-radius: 8px;
}

.login-box h1 {
    margin-top: 0;
    text-align: center;
}

.login-box p {
    text-align: center;
    color: #aaa;
}

.login-box input {
    width: 100%;
    height: 45px;
    margin: 15px 0;
    padding: 0 12px;
    border: 0;
    outline: 0;
    border-radius: 5px;
    background: #1e1f22;
    color: white;
}

.login-box button {
    width: 100%;
    height: 45px;
    border: 0;
    border-radius: 5px;
    background: #5865f2;
    color: white;
    cursor: pointer;
}

.error {
    margin-top: 10px;
    color: #ed4245;
    text-align: center;
    font-size: 13px;
}

.empty {
    color: #999;
    text-align: center;
    margin-top: 80px;
}

@media(max-width:700px) {
    .sidebar {
        width: 190px;
    }

    .messages {
        padding: 12px;
    }

    .input-area {
        padding: 10px;
    }
}
</style>
</head>

<body>

<div id="status" class="status">
    Connecting...
</div>

<div class="app">

    <aside class="sidebar">

        <div class="sidebar-header">
            MyChat
        </div>

        <div class="channels">

            <div class="category">
                TEXT CHANNELS
            </div>

            <div
                class="channel active"
                onclick="selectChannel('general', this)">
                # general
            </div>

            <div
                class="channel"
                onclick="selectChannel('gaming', this)">
                # gaming
            </div>

            <div
                class="channel"
                onclick="selectChannel('movies', this)">
                # movies
            </div>

        </div>

    </aside>


    <main class="chat">

        <header class="chat-header">

            #

            <span id="channelName">
                general
            </span>

        </header>


        <div
            id="messages"
            class="messages">
        </div>


        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="messageInput"
                    placeholder="Message #general"
                    maxlength="2000">
                </textarea>

                <button
                    id="sendButton"
                    class="send"
                    onclick="sendMessage()">
                    Send
                </button>

            </div>

        </div>

    </main>

</div>


<div
    id="login"
    class="login">

    <div class="login-box">

        <h1>MyChat</h1>

        <p>
            Choose your username
        </p>

        <input
            id="username"
            maxlength="24"
            autocomplete="off"
            placeholder="Username">

        <button
            onclick="login()">
            Enter Chat
        </button>

        <div
            id="loginError"
            class="error">
        </div>

    </div>

</div>


<script>

const API = "/api/messages";

let username = "";
let currentChannel = "general";
let loading = false;


/* -------------------------
   STATUS
------------------------- */

function setStatus(
    text,
    good
) {

    const status =
        document.getElementById(
            "status"
        );

    status.textContent = text;

    status.className =
        "status " +
        (good ? "ok" : "bad");
}


/* -------------------------
   LOGIN
------------------------- */

function login() {

    const input =
        document.getElementById(
            "username"
        );

    const error =
        document.getElementById(
            "loginError"
        );

    const name =
        input.value.trim();

    if (!name) {

        error.textContent =
            "Enter a username.";

        return;
    }

    if (name.length < 2) {

        error.textContent =
            "Username must be at least 2 characters.";

        return;
    }

    username = name;

    localStorage.setItem(
        "chatUsername",
        username
    );

    document.getElementById(
        "login"
    ).style.display = "none";

    loadMessages();
}


/* -------------------------
   LOAD MESSAGES
------------------------- */

async function loadMessages() {

    if (!username || loading)
        return;

    loading = true;

    try {

        const response =
            await fetch(
                API +
                "?channel=" +
                encodeURIComponent(
                    currentChannel
                ),
                {
                    method: "GET",
                    headers: {
                        "Accept":
                            "application/json"
                    }
                }
            );


        const text =
            await response.text();


        let data;

        try {

            data =
                JSON.parse(text);

        } catch {

            throw new Error(
                "Server did not return JSON. HTTP " +
                response.status +
                "\n\n" +
                text.substring(0,300)
            );

        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Server error"
            );

        }


        displayMessages(
            data.messages || []
        );


        setStatus(
            "● Connected",
            true
        );


    } catch(error) {

        console.error(error);

        setStatus(
            "● Server error",
            false
        );

        console.error(
            error.message
        );

    }

    loading = false;
}


/* -------------------------
   DISPLAY
------------------------- */

function displayMessages(
    messages
) {

    const container =
        document.getElementById(
            "messages"
        );

    container.innerHTML = "";


    if (!messages.length) {

        container.innerHTML = `
            <div class="empty">
                No messages yet.<br>
                Send the first message!
            </div>
        `;

        return;
    }


    messages.forEach(
        message => {

            const wrapper =
                document.createElement(
                    "div"
                );

            wrapper.className =
                "message";


            const avatar =
                document.createElement(
                    "div"
                );

            avatar.className =
                "avatar";

            avatar.textContent =
                (
                    message.username ||
                    "?"
                )
                .charAt(0)
                .toUpperCase();


            const body =
                document.createElement(
                    "div"
                );

            body.className =
                "message-body";


            const top =
                document.createElement(
                    "div"
                );

            top.className =
                "message-top";


            const name =
                document.createElement(
                    "span"
                );

            name.className =
                "message-name";

            name.textContent =
                message.username;


            const time =
                document.createElement(
                    "span"
                );

            time.className =
                "message-time";

            if(message.created_at) {

                time.textContent =
                    new Date(
                        message.created_at
                    ).toLocaleString();

            }


            const text =
                document.createElement(
                    "div"
                );

            text.className =
                "message-text";

            text.textContent =
                message.message;


            top.appendChild(name);
            top.appendChild(time);

            body.appendChild(top);
            body.appendChild(text);

            wrapper.appendChild(avatar);
            wrapper.appendChild(body);

            container.appendChild(wrapper);

        }
    );


    container.scrollTop =
        container.scrollHeight;
}


/* -------------------------
   SEND
------------------------- */

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );

    const button =
        document.getElementById(
            "sendButton"
        );

    const message =
        input.value.trim();


    if (!username) {

        return;
    }


    if (!message) {

        return;
    }


    button.disabled = true;


    try {

        const response =
            await fetch(
                API,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            username:
                                username,

                            channel:
                                currentChannel,

                            message:
                                message

                        })
                }
            );


        const text =
            await response.text();


        let data;

        try {

            data =
                JSON.parse(text);

        } catch {

            throw new Error(
                "Server did not return JSON. HTTP " +
                response.status +
                "\n\n" +
                text.substring(0,300)
            );

        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Could not send message"
            );

        }


        input.value = "";

        await loadMessages();


    } catch(error) {

        console.error(error);

        alert(
            error.message
        );

    }


    button.disabled = false;
}


/* -------------------------
   CHANNELS
------------------------- */

function selectChannel(
    channel,
    element
) {

    currentChannel =
        channel;


    document
        .querySelectorAll(
            ".channel"
        )
        .forEach(
            item =>
                item.classList.remove(
                    "active"
                )
        );


    element.classList.add(
        "active"
    );


    document.getElementById(
        "channelName"
    ).textContent =
        channel;


    document.getElementById(
        "messageInput"
    ).placeholder =
        "Message #" +
        channel;


    loadMessages();
}


/* -------------------------
   ENTER KEY
------------------------- */

document
    .getElementById(
        "messageInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


/* -------------------------
   START
------------------------- */

const savedUsername =
    localStorage.getItem(
        "chatUsername"
    );


if(savedUsername) {

    username =
        savedUsername;

    document.getElementById(
        "login"
    ).style.display =
        "none";

    loadMessages();

}


setInterval(
    loadMessages,
    3000
);

</script>

</body>
</html>
