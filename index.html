<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>General Chat</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0b0b0d;
    color: #eeeeee;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    overflow: hidden;
}

/* =========================
   APP
========================= */

.app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}

/* =========================
   HEADER
========================= */

.header {
    height: 64px;
    min-height: 64px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 18px;

    background: #111114;
    border-bottom: 1px solid #29292e;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.server-icon {
    width: 38px;
    height: 38px;

    border-radius: 10px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #202024;
    color: #ffffff;

    font-weight: bold;
}

.server-info {
    display: flex;
    flex-direction: column;
}

.server-name {
    font-size: 15px;
    font-weight: 700;
}

.server-sub {
    font-size: 12px;
    color: #77777f;
}

.settings-button {
    width: 40px;
    height: 40px;

    border: 0;
    border-radius: 9px;

    background: #1b1b20;
    color: #dddddd;

    font-size: 20px;
    cursor: pointer;
}

.settings-button:hover {
    background: #27272d;
}

/* =========================
   CONTENT
========================= */

.content {
    flex: 1;
    min-height: 0;
    display: flex;
}

/* =========================
   CHANNEL BAR
========================= */

.sidebar {
    width: 230px;
    min-width: 230px;

    background: #0f0f12;
    border-right: 1px solid #242429;

    padding: 18px 12px;
}

.sidebar-title {
    font-size: 11px;
    font-weight: bold;

    color: #696970;

    text-transform: uppercase;

    margin: 0 8px 10px;
}

.channel {
    width: 100%;

    border: 0;
    border-radius: 7px;

    background: #202024;
    color: #ffffff;

    padding: 10px 12px;

    text-align: left;

    cursor: default;

    font-size: 14px;
}

.channel::before {
    content: "# ";
    color: #77777f;
}

/* =========================
   CHAT
========================= */

.chat {
    flex: 1;
    min-width: 0;
    min-height: 0;

    display: flex;
    flex-direction: column;

    background: #0b0b0d;
}

.messages {
    flex: 1;
    min-height: 0;

    overflow-y: auto;

    padding: 20px;

    scroll-behavior: auto;
}

.messages::-webkit-scrollbar {
    width: 8px;
}

.messages::-webkit-scrollbar-track {
    background: transparent;
}

.messages::-webkit-scrollbar-thumb {
    background: #29292e;
    border-radius: 20px;
}

/* =========================
   MESSAGE
========================= */

.message {
    position: relative;

    display: flex;
    gap: 12px;

    padding: 7px 10px;
    margin-bottom: 2px;

    border-radius: 7px;

    transition: none;
}

.message:hover {
    background: #111115;
}

.avatar {
    width: 36px;
    height: 36px;

    min-width: 36px;

    border-radius: 9px;

    background: #242429;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 14px;
    font-weight: bold;

    color: #dddddd;
}

.message-content {
    min-width: 0;
    flex: 1;
}

.message-top {
    display: flex;
    align-items: baseline;
    gap: 8px;
}

.username {
    font-size: 14px;
    font-weight: 700;
}

.time {
    font-size: 10px;
    color: #626269;
}

.edited {
    font-size: 10px;
    color: #67676f;
}

.message-text {
    margin-top: 3px;

    color: #dddddf;

    font-size: 14px;

    line-height: 1.45;

    white-space: pre-wrap;

    word-break: break-word;
}

.message-image {
    display: block;

    max-width: min(500px, 80vw);
    max-height: 500px;

    margin-top: 8px;

    border-radius: 8px;

    cursor: pointer;

    object-fit: contain;

    background: #111115;
}

/* =========================
   CONTEXT MENU
========================= */

.context-menu {
    position: fixed;

    display: none;

    z-index: 1000;

    width: 150px;

    background: #18181c;

    border: 1px solid #303037;

    border-radius: 8px;

    box-shadow: 0 10px 30px rgba(0,0,0,.45);

    overflow: hidden;
}

.context-item {
    width: 100%;

    border: 0;

    background: transparent;

    color: #dddddd;

    text-align: left;

    padding: 11px 13px;

    cursor: pointer;

    font-size: 13px;
}

.context-item:hover {
    background: #29292f;
}

.context-item.delete:hover {
    background: #4a1e22;
    color: #ffb8bd;
}

/* =========================
   INPUT
========================= */

.composer {
    padding: 12px 18px 16px;

    border-top: 1px solid #242429;

    background: #0e0e11;
}

.selected-file {
    display: none;

    margin-bottom: 8px;

    padding: 7px 10px;

    background: #19191d;

    border: 1px solid #2c2c32;

    border-radius: 7px;

    font-size: 12px;

    color: #9999a1;
}

.input-row {
    display: flex;
    gap: 8px;
}

.attach-button,
.send-button {
    width: 44px;
    min-width: 44px;

    border: 0;
    border-radius: 8px;

    cursor: pointer;
}

.attach-button {
    background: #1c1c21;
    color: #dddddd;

    font-size: 19px;
}

.attach-button:hover {
    background: #29292f;
}

.send-button {
    background: #e5e5e5;
    color: #101012;

    font-weight: bold;
}

.send-button:hover {
    background: #ffffff;
}

.message-input {
    flex: 1;

    min-width: 0;

    resize: none;

    height: 44px;

    padding: 12px;

    border: 1px solid #2c2c31;

    border-radius: 8px;

    outline: none;

    background: #18181c;
    color: #eeeeee;

    font-family: inherit;
    font-size: 14px;
}

.message-input:focus {
    border-color: #55555e;
}

/* =========================
   SETTINGS
========================= */

.overlay {
    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    z-index: 2000;

    background: rgba(0,0,0,.65);
}

.settings {
    width: min(460px, calc(100% - 30px));

    background: #151519;

    border: 1px solid #303037;

    border-radius: 12px;

    box-shadow: 0 20px 60px rgba(0,0,0,.6);

    overflow: hidden;
}

.settings-header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    padding: 16px;

    border-bottom: 1px solid #2a2a30;
}

.settings-title {
    font-size: 16px;
    font-weight: bold;
}

.close-settings {
    border: 0;

    background: transparent;

    color: #999;

    font-size: 22px;

    cursor: pointer;
}

.settings-body {
    padding: 18px;
}

.setting-label {
    display: block;

    margin-bottom: 7px;

    font-size: 12px;

    color: #85858d;
}

.name-input {
    width: 100%;

    padding: 11px;

    border-radius: 7px;

    border: 1px solid #303037;

    outline: none;

    background: #0e0e11;

    color: white;
}

.name-input:focus {
    border-color: #5b5b65;
}

.save-name {
    margin-top: 9px;

    border: 0;

    border-radius: 7px;

    padding: 9px 13px;

    background: #eeeeee;

    color: #111;

    cursor: pointer;

    font-weight: bold;
}

.device-box {
    margin-top: 20px;

    padding: 12px;

    background: #0d0d10;

    border: 1px solid #29292f;

    border-radius: 8px;
}

.device-title {
    color: #77777f;

    font-size: 11px;

    margin-bottom: 5px;
}

.device-id {
    font-family: monospace;

    font-size: 11px;

    color: #b7b7bd;

    word-break: break-all;
}

/* =========================
   FULLSCREEN IMAGE
========================= */

.image-viewer {
    position: fixed;

    inset: 0;

    display: none;

    z-index: 5000;

    background: #000;

    align-items: center;
    justify-content: center;
}

.fullscreen-image {
    max-width: 100vw;
    max-height: 100vh;

    width: auto;
    height: auto;

    object-fit: contain;
}

.back-image {
    position: absolute;

    top: 18px;
    left: 18px;

    z-index: 2;

    border: 1px solid #38383e;

    border-radius: 8px;

    background: rgba(20,20,23,.9);

    color: white;

    padding: 10px 15px;

    cursor: pointer;

    font-weight: bold;
}

/* =========================
   TOAST
========================= */

.toast {
    position: fixed;

    left: 50%;
    bottom: 90px;

    transform: translateX(-50%);

    display: none;

    z-index: 6000;

    background: #202025;

    border: 1px solid #36363d;

    color: white;

    padding: 10px 14px;

    border-radius: 8px;

    font-size: 13px;

    box-shadow: 0 10px 30px rgba(0,0,0,.4);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .sidebar {
        display: none;
    }

    .messages {
        padding: 12px 8px;
    }

    .composer {
        padding: 9px;
    }

    .message-image {
        max-width: 85vw;
        max-height: 400px;
    }

}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="header-left">

            <div class="server-icon">
                C
            </div>

            <div class="server-info">

                <div class="server-name">
                    Chat
                </div>

                <div class="server-sub">
                    General
                </div>

            </div>

        </div>

        <button
            class="settings-button"
            id="settingsButton">
            ⚙
        </button>

    </header>


    <!-- CONTENT -->

    <div class="content">

        <aside class="sidebar">

            <div class="sidebar-title">
                Channels
            </div>

            <div class="channel">
                general
            </div>

        </aside>


        <main class="chat">

            <div
                class="messages"
                id="messages">
            </div>


            <div class="composer">

                <div
                    class="selected-file"
                    id="selectedFile">
                </div>

                <div class="input-row">

                    <input
                        type="file"
                        id="imageInput"
                        accept="image/*"
                        hidden>

                    <button
                        class="attach-button"
                        id="attachButton"
                        title="Send image">
                        +
                    </button>

                    <textarea
                        id="messageInput"
                        class="message-input"
                        placeholder="Message #general..."
                        maxlength="2000"></textarea>

                    <button
                        class="send-button"
                        id="sendButton">
                        Send
                    </button>

                </div>

            </div>

        </main>

    </div>

</div>


<!-- CONTEXT MENU -->

<div
    class="context-menu"
    id="contextMenu">

    <button
        class="context-item"
        id="editButton">
        Edit
    </button>

    <button
        class="context-item delete"
        id="deleteButton">
        Delete
    </button>

</div>


<!-- SETTINGS -->

<div
    class="overlay"
    id="settingsOverlay">

    <div class="settings">

        <div class="settings-header">

            <div class="settings-title">
                Settings
            </div>

            <button
                class="close-settings"
                id="closeSettings">
                ×
            </button>

        </div>

        <div class="settings-body">

            <label class="setting-label">
                Display name
            </label>

            <input
                id="nameInput"
                class="name-input"
                maxlength="24"
                placeholder="Enter your name">

            <button
                class="save-name"
                id="saveName">
                Save name
            </button>


            <div class="device-box">

                <div class="device-title">
                    DEVICE ID
                </div>

                <div
                    class="device-id"
                    id="deviceIdDisplay">
                </div>

            </div>

        </div>

    </div>

</div>


<!-- IMAGE VIEWER -->

<div
    class="image-viewer"
    id="imageViewer">

    <button
        class="back-image"
        id="backImage">
        ← Back
    </button>

    <img
        class="fullscreen-image"
        id="fullscreenImage">

</div>


<!-- TOAST -->

<div
    class="toast"
    id="toast">
</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const API_URL = "/api/messages";

const CHANNEL = "general";


/* =====================================================
   ELEMENTS
===================================================== */

const messagesElement =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const imageInput =
    document.getElementById("imageInput");

const attachButton =
    document.getElementById("attachButton");

const selectedFile =
    document.getElementById("selectedFile");

const contextMenu =
    document.getElementById("contextMenu");

const editButton =
    document.getElementById("editButton");

const deleteButton =
    document.getElementById("deleteButton");

const settingsButton =
    document.getElementById("settingsButton");

const settingsOverlay =
    document.getElementById("settingsOverlay");

const closeSettings =
    document.getElementById("closeSettings");

const nameInput =
    document.getElementById("nameInput");

const saveName =
    document.getElementById("saveName");

const deviceIdDisplay =
    document.getElementById("deviceIdDisplay");

const imageViewer =
    document.getElementById("imageViewer");

const fullscreenImage =
    document.getElementById("fullscreenImage");

const backImage =
    document.getElementById("backImage");

const toast =
    document.getElementById("toast");


/* =====================================================
   DEVICE ID
===================================================== */

let deviceId =
    localStorage.getItem("chat_device_id");


if (!deviceId) {

    deviceId =
        crypto.randomUUID();

    localStorage.setItem(
        "chat_device_id",
        deviceId
    );

}


/* =====================================================
   NAME
===================================================== */

function getName() {

    const name =
        localStorage.getItem(
            "chat_display_name"
        );

    if (!name) {

        return deviceId;

    }

    const clean =
        name.trim().substring(0, 24);

    return clean || deviceId;

}


nameInput.value =
    localStorage.getItem(
        "chat_display_name"
    ) || "";


deviceIdDisplay.textContent =
    deviceId;


/* =====================================================
   TOAST
===================================================== */

let toastTimer = null;


function showToast(text) {

    toast.textContent = text;

    toast.style.display =
        "block";

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(() => {

            toast.style.display =
                "none";

        }, 3500);

}


/* =====================================================
   SETTINGS
===================================================== */

settingsButton.onclick =
    () => {

        nameInput.value =
            localStorage.getItem(
                "chat_display_name"
            ) || "";

        settingsOverlay.style.display =
            "flex";

    };


closeSettings.onclick =
    () => {

        settingsOverlay.style.display =
            "none";

    };


settingsOverlay.onclick =
    event => {

        if (
            event.target ===
            settingsOverlay
        ) {

            settingsOverlay.style.display =
                "none";

        }

    };


saveName.onclick =
    () => {

        const name =
            nameInput.value
                .trim()
                .substring(0, 24);

        if (name) {

            localStorage.setItem(
                "chat_display_name",
                name
            );

        } else {

            localStorage.removeItem(
                "chat_display_name"
            );

        }

        showToast(
            name
                ? "Name saved."
                : "Name removed. Your device ID will be used."
        );

        settingsOverlay.style.display =
            "none";

    };


/* =====================================================
   IMAGE SELECTION
===================================================== */

attachButton.onclick =
    () => {

        imageInput.click();

    };


imageInput.onchange =
    () => {

        if (
            imageInput.files &&
            imageInput.files[0]
        ) {

            selectedFile.textContent =
                "Image selected: " +
                imageInput.files[0].name;

            selectedFile.style.display =
                "block";

        } else {

            selectedFile.style.display =
                "none";

        }

    };


/* =====================================================
   RESIZE IMAGE
===================================================== */

function resizeImage(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                event => {

                    const img =
                        new Image();

                    img.onload =
                        () => {

                            const maxSize =
                                1500;

                            let width =
                                img.width;

                            let height =
                                img.height;


                            if (
                                width >
                                maxSize ||
                                height >
                                maxSize
                            ) {

                                const scale =
                                    Math.min(
                                        maxSize / width,
                                        maxSize / height
                                    );

                                width =
                                    Math.round(
                                        width * scale
                                    );

                                height =
                                    Math.round(
                                        height * scale
                                    );

                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );

                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );


                            resolve(
                                canvas.toDataURL(
                                    "image/jpeg",
                                    0.82
                                )
                            );

                        };


                    img.onerror =
                        () => {

                            reject(
                                new Error(
                                    "Could not load image."
                                )
                            );

                        };


                    img.src =
                        event.target.result;

                };


            reader.onerror =
                () => {

                    reject(
                        new Error(
                            "Could not read image."
                        )
                    );

                };


            reader.readAsDataURL(file);

        }
    );

}


/* =====================================================
   SEND
===================================================== */

async function sendMessage() {

    const text =
        messageInput.value
            .trim();

    const file =
        imageInput.files &&
        imageInput.files[0];


    if (!text && !file) {

        return;

    }


    sendButton.disabled =
        true;


    try {

        let image =
            null;


        if (file) {

            if (
                !file.type.startsWith(
                    "image/"
                )
            ) {

                throw new Error(
                    "Please choose an image."
                );

            }


            image =
                await resizeImage(
                    file
                );

        }


        const response =
            await fetch(
                API_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            username:
                                getName(),

                            channel:
                                CHANNEL,

                            message:
                                text,

                            image:
                                image,

                            device_id:
                                deviceId

                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.fix ||
                data.error ||
                "Failed to send message."
            );

        }


        messageInput.value =
            "";

        imageInput.value =
            "";

        selectedFile.style.display =
            "none";


        await loadMessages(
            true
        );

    } catch (error) {

        showToast(
            error.message
        );

    } finally {

        sendButton.disabled =
            false;

        messageInput.focus();

    }

}


/* =====================================================
   SEND BUTTON
===================================================== */

sendButton.onclick =
    sendMessage;


messageInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   LOAD MESSAGES
===================================================== */

let loadingMessages =
    false;


async function loadMessages(
    scrollBottom = false
) {

    if (loadingMessages) {

        return;

    }


    loadingMessages =
        true;


    try {

        const response =
            await fetch(
                API_URL +
                "?channel=" +
                encodeURIComponent(
                    CHANNEL
                ),
                {
                    cache:
                        "no-store"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.fix ||
                data.error ||
                "Failed to load messages."
            );

        }


        renderMessages(
            data.messages || []
        );


        if (scrollBottom) {

            messagesElement.scrollTop =
                messagesElement.scrollHeight;

        }

    } catch (error) {

        showToast(
            error.message
        );

    } finally {

        loadingMessages =
            false;

    }

}


/* =====================================================
   RENDER
===================================================== */

function renderMessages(
    messages
) {

    const wasAtBottom =
        messagesElement.scrollHeight -
        messagesElement.scrollTop -
        messagesElement.clientHeight <
        80;


    const fragment =
        document.createDocumentFragment();


    for (
        const msg of messages
    ) {

        const element =
            createMessageElement(
                msg
            );

        fragment.appendChild(
            element
        );

    }


    messagesElement.replaceChildren(
        fragment
    );


    if (wasAtBottom) {

        messagesElement.scrollTop =
            messagesElement.scrollHeight;

    }

}


/* =====================================================
   CREATE MESSAGE
===================================================== */

function createMessageElement(
    msg
) {

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message";


    wrapper.dataset.id =
        msg.id;


    wrapper.dataset.deviceId =
        msg.device_id ||
        msg.author_device_id ||
        "";


    /* AVATAR */

    const avatar =
        document.createElement(
            "div"
        );

    avatar.className =
        "avatar";


    const username =
        msg.username ||
        msg.author_device_id ||
        "Unknown";


    avatar.textContent =
        username
            .charAt(0)
            .toUpperCase();


    /* CONTENT */

    const content =
        document.createElement(
            "div"
        );

    content.className =
        "message-content";


    /* TOP */

    const top =
        document.createElement(
            "div"
        );

    top.className =
        "message-top";


    const name =
        document.createElement(
            "span"
        );

    name.className =
        "username";

    name.textContent =
        username;


    top.appendChild(
        name
    );


    if (msg.created_at) {

        const time =
            document.createElement(
                "span"
            );

        time.className =
            "time";

        const date =
            new Date(
                msg.created_at
            );

        time.textContent =
            date.toLocaleTimeString(
                [],
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        top.appendChild(
            time
        );

    }


    if (msg.edited) {

        const edited =
            document.createElement(
                "span"
            );

        edited.className =
            "edited";

        edited.textContent =
            "(edited)";

        top.appendChild(
            edited
        );

    }


    content.appendChild(
        top
    );


    /* TEXT */

    if (msg.message) {

        const text =
            document.createElement(
                "div"
            );

        text.className =
            "message-text";

        text.textContent =
            msg.message;

        content.appendChild(
            text
        );

    }


    /* IMAGE */

    if (msg.image) {

        const image =
            document.createElement(
                "img"
            );

        image.className =
            "message-image";

        image.src =
            msg.image;

        image.alt =
            "Image";


        image.onclick =
            () => {

                openImage(
                    msg.image
                );

            };


        content.appendChild(
            image
        );

    }


    wrapper.appendChild(
        avatar
    );

    wrapper.appendChild(
        content
    );


    /* RIGHT CLICK */

    wrapper.addEventListener(
        "contextmenu",
        event => {

            event.preventDefault();

            showContextMenu(
                event.clientX,
                event.clientY,
                msg
            );

        }
    );


    return wrapper;

}


/* =====================================================
   CONTEXT MENU
===================================================== */

let selectedMessage =
    null;


function showContextMenu(
    x,
    y,
    message
) {

    selectedMessage =
        message;


    const ownerId =
        message.device_id ||
        message.author_device_id ||
        "";


    const myId =
        deviceId;


    if (
        ownerId !== myId
    ) {

        hideContextMenu();

        return;

    }


    contextMenu.style.display =
        "block";


    contextMenu.style.left =
        x + "px";


    contextMenu.style.top =
        y + "px";

}


function hideContextMenu() {

    contextMenu.style.display =
        "none";

    selectedMessage =
        null;

}


document.addEventListener(
    "click",
    event => {

        if (
            !contextMenu.contains(
                event.target
            )
        ) {

            hideContextMenu();

        }

    }
);


/* =====================================================
   EDIT
===================================================== */

editButton.onclick =
    async () => {

        if (!selectedMessage) {

            return;

        }


        const current =
            selectedMessage.message ||
            "";


        const newText =
            prompt(
                "Edit your message:",
                current
            );


        hideContextMenu();


        if (
            newText === null
        ) {

            return;

        }


        const cleaned =
            newText
                .trim()
                .substring(
                    0,
                    2000
                );


        if (
            !cleaned
        ) {

            showToast(
                "Message cannot be empty."
            );

            return;

        }


        try {

            const response =
                await fetch(
                    API_URL,
                    {

                        method:
                            "PATCH",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                id:
                                    selectedMessage.id,

                                message:
                                    cleaned,

                                device_id:
                                    deviceId

                            })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.fix ||
                    data.error ||
                    "Could not edit message."
                );

            }


            await loadMessages();

        } catch (error) {

            showToast(
                error.message
            );

        }

    };


/* =====================================================
   DELETE
===================================================== */

deleteButton.onclick =
    async () => {

        if (!selectedMessage) {

            return;

        }


        const message =
            selectedMessage;


        hideContextMenu();


        const yes =
            confirm(
                "Delete this message permanently?"
            );


        if (!yes) {

            return;

        }


        try {

            const response =
                await fetch(
                    API_URL +
                    "?id=" +
                    encodeURIComponent(
                        message.id
                    ) +
                    "&device_id=" +
                    encodeURIComponent(
                        deviceId
                    ),
                    {

                        method:
                            "DELETE"

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.fix ||
                    data.error ||
                    "Could not delete message."
                );

            }


            await loadMessages();

        } catch (error) {

            showToast(
                error.message
            );

        }

    };


/* =====================================================
   IMAGE VIEWER
===================================================== */

function openImage(
    src
) {

    fullscreenImage.src =
        src;

    imageViewer.style.display =
        "flex";

}


function closeImage() {

    imageViewer.style.display =
        "none";

    fullscreenImage.src =
        "";

}


backImage.onclick =
    closeImage;


imageViewer.onclick =
    event => {

        if (
            event.target ===
            imageViewer
        ) {

            closeImage();

        }

    };


document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeImage();

        }

    }
);


/* =====================================================
   START
===================================================== */

loadMessages(
    true
);


/* =====================================================
   REFRESH
   No fade effects.
===================================================== */

setInterval(
    () => {

        loadMessages(
            false
        );

    },
    2000
);

</script>
