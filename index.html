<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Game Chat</title>

<style>
*{
    box-sizing:border-box;
}

:root{
    --bg:#090b0f;
    --surface:#101319;
    --surface2:#151a21;
    --surface3:#1b212a;
    --surface4:#222934;
    --border:#272e38;
    --text:#f2f4f7;
    --muted:#7f8997;
    --muted2:#9ba4b0;
    --accent:#e8ebef;
    --accentText:#0b0d10;
    --success:#58d890;
    --danger:#ff6868;
    --warning:#e4bd5d;

    --radius:12px;
    --text-size:16px;
    --word-spacing:0px;
    --line-spacing:1.45;
    --ui-scale:1;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
}

body{
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    font-size:calc(16px * var(--ui-scale));
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    cursor:not-allowed;
    opacity:.45;
}

/* =========================================================
   APP
========================================================= */

.app{
    width:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
    background:
        radial-gradient(
            circle at top left,
            rgba(255,255,255,.025),
            transparent 35%
        ),
        var(--bg);
}

/* =========================================================
   HEADER
========================================================= */

.header{
    height:68px;
    min-height:68px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    border-bottom:1px solid var(--border);
    background:rgba(16,19,25,.94);
    backdrop-filter:blur(20px);
    position:relative;
    z-index:5;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.brand-icon{
    width:40px;
    height:40px;
    border-radius:11px;
    display:grid;
    place-items:center;
    background:linear-gradient(
        145deg,
        #202630,
        #12161c
    );
    border:1px solid var(--border);
    box-shadow:0 5px 20px #0005;
    font-size:19px;
}

.brand-text{
    min-width:0;
}

.brand-name{
    font-size:15px;
    font-weight:800;
    letter-spacing:-.2px;
}

.channel{
    margin-top:2px;
    color:var(--muted);
    font-size:12px;
}

.header-actions{
    display:flex;
    gap:7px;
}

.icon-button{
    width:40px;
    height:40px;
    border-radius:11px;
    border:1px solid var(--border);
    background:var(--surface2);
    color:var(--text);
    display:grid;
    place-items:center;
    transition:
        background .15s,
        transform .15s,
        border-color .15s;
}

.icon-button:hover{
    background:var(--surface3);
    border-color:#343d49;
    transform:translateY(-1px);
}

/* =========================================================
   CHAT
========================================================= */

.messages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:24px max(16px,calc((100vw - 1050px) / 2));
    scroll-behavior:auto;
}

.messages::-webkit-scrollbar{
    width:8px;
}

.messages::-webkit-scrollbar-track{
    background:transparent;
}

.messages::-webkit-scrollbar-thumb{
    background:#252b34;
    border-radius:20px;
}

.message{
    display:flex;
    gap:11px;
    margin-bottom:9px;
    animation:messageIn .18s ease;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(4px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.avatar{
    width:37px;
    height:37px;
    min-width:37px;
    border-radius:11px;
    display:grid;
    place-items:center;
    background:var(--surface2);
    border:1px solid var(--border);
    color:#dce1e8;
    font-size:13px;
    font-weight:800;
}

.message-body{
    min-width:0;
    max-width:800px;
}

.message-card{
    display:inline-block;
    max-width:100%;
    padding:8px 12px 9px;
    border:1px solid var(--border);
    border-radius:4px 12px 12px 12px;
    background:linear-gradient(
        145deg,
        rgba(27,32,40,.96),
        rgba(20,24,30,.96)
    );
    box-shadow:0 3px 15px rgba(0,0,0,.12);
}

.message-top{
    display:flex;
    align-items:center;
    gap:7px;
    margin-bottom:3px;
}

.username{
    font-size:13px;
    font-weight:800;
    color:#fff;
}

.time{
    color:var(--muted);
    font-size:10px;
}

.edited{
    color:var(--muted);
    font-size:10px;
}

.message-text{
    color:#d9dee5;
    font-size:var(--text-size);
    line-height:var(--line-spacing);
    word-spacing:var(--word-spacing);
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.message-image{
    display:block;
    max-width:420px;
    max-height:400px;
    margin-top:8px;
    border-radius:9px;
    border:1px solid var(--border);
}

/* =========================================================
   EMPTY
========================================================= */

.empty{
    height:100%;
    min-height:250px;
    display:grid;
    place-items:center;
    text-align:center;
    color:var(--muted);
}

.empty-icon{
    font-size:35px;
    margin-bottom:10px;
    opacity:.5;
}

.empty strong{
    display:block;
    color:#b7bec8;
    margin-bottom:5px;
}

/* =========================================================
   COMPOSER
========================================================= */

.composer{
    padding:12px 16px 17px;
    border-top:1px solid var(--border);
    background:rgba(16,19,25,.96);
    backdrop-filter:blur(20px);
}

.composer-inner{
    width:min(900px,100%);
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:8px;
    padding:7px;
    background:var(--surface2);
    border:1px solid var(--border);
    border-radius:15px;
    box-shadow:0 8px 30px #0003;
}

.message-input{
    flex:1;
    min-width:0;
    min-height:42px;
    max-height:150px;
    padding:10px 11px;
    border:0;
    outline:0;
    resize:none;
    background:transparent;
    color:white;
}

.message-input::placeholder{
    color:#66707d;
}

.send-button{
    height:42px;
    padding:0 17px;
    border:0;
    border-radius:10px;
    background:var(--accent);
    color:var(--accentText);
    font-weight:800;
    transition:transform .15s,filter .15s;
}

.send-button:hover{
    filter:brightness(1.08);
    transform:translateY(-1px);
}

/* =========================================================
   OVERLAY
========================================================= */

.overlay{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:14px;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(10px);
}

.overlay.show{
    display:flex;
}

.modal{
    width:min(650px,100%);
    max-height:min(850px,calc(100dvh - 28px));
    overflow:auto;
    border:1px solid var(--border);
    border-radius:17px;
    background:var(--surface);
    box-shadow:0 30px 100px #000b;
}

.modal.large{
    width:min(900px,100%);
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:17px 18px;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:2;
    background:rgba(16,19,25,.97);
    backdrop-filter:blur(15px);
}

.modal-title{
    font-size:17px;
    font-weight:800;
}

.modal-body{
    padding:18px;
}

/* =========================================================
   GAME CREATOR
========================================================= */

.game-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.game-choice{
    min-height:105px;
    padding:15px;
    text-align:left;
    border:1px solid var(--border);
    border-radius:13px;
    background:var(--surface2);
    color:white;
    transition:
        background .15s,
        transform .15s,
        border-color .15s;
}

.game-choice:hover{
    background:var(--surface3);
    border-color:#37404c;
    transform:translateY(-2px);
}

.game-choice strong{
    display:block;
    font-size:14px;
    margin-bottom:5px;
}

.game-choice span{
    display:block;
    color:var(--muted);
    font-size:11px;
    line-height:1.4;
}

.game-players{
    display:inline-block;
    margin-top:10px;
    padding:4px 8px;
    border-radius:7px;
    background:#10141a;
    border:1px solid var(--border);
    color:#aeb6c1;
    font-size:10px;
}

/* =========================================================
   SETTINGS
========================================================= */

.category{
    margin-bottom:9px;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    background:var(--surface2);
}

.category-title{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px;
    border:0;
    background:transparent;
    color:white;
    text-align:left;
    font-weight:750;
}

.category-title:hover{
    background:rgba(255,255,255,.025);
}

.category-body{
    display:none;
    padding:0 14px 15px;
}

.category.open .category-body{
    display:block;
}

.setting{
    margin-top:13px;
}

.setting label{
    display:block;
    margin-bottom:7px;
    color:#abb4bf;
    font-size:12px;
}

.setting input,
.setting select{
    width:100%;
    padding:10px 11px;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
    background:#0e1217;
    color:white;
}

.setting input:focus,
.setting select:focus{
    border-color:#515b68;
}

.setting input[type="range"]{
    padding:0;
}

.setting-value{
    margin-top:5px;
    color:var(--muted);
    font-size:11px;
}

.save-button{
    width:100%;
    margin-top:5px;
    padding:12px;
    border:0;
    border-radius:10px;
    background:var(--accent);
    color:#111;
    font-weight:800;
}

/* =========================================================
   DANGER
========================================================= */

.danger-zone{
    margin-top:20px;
    padding-top:18px;
    border-top:1px solid #42252a;
}

.danger-title{
    color:var(--danger);
    font-weight:800;
}

.danger-description{
    color:var(--muted);
    line-height:1.5;
    font-size:12px;
}

.danger-button{
    width:100%;
    padding:11px;
    border:1px solid #683039;
    border-radius:9px;
    background:#251519;
    color:#ff8585;
}

/* =========================================================
   GAME CARD
========================================================= */

.game-message{
    margin:0 auto 15px;
    max-width:900px;
}

.game-card{
    overflow:hidden;
    border:1px solid var(--border);
    border-radius:16px;
    background:
        radial-gradient(
            circle at top right,
            rgba(255,255,255,.035),
            transparent 35%
        ),
        var(--surface2);
    box-shadow:0 12px 40px #0003;
}

.game-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:15px 17px;
    border-bottom:1px solid var(--border);
}

.game-name{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:15px;
    font-weight:850;
}

.game-host{
    color:var(--muted);
    font-size:10px;
}

.game-status{
    padding:5px 8px;
    border-radius:999px;
    border:1px solid var(--border);
    background:#10151b;
    color:#aeb6c1;
    font-size:10px;
}

.game-status.running{
    color:#82e7aa;
    border-color:#24573c;
    background:#112319;
}

.game-status.finished{
    color:#8f98a5;
}

.game-body{
    padding:16px;
}

.game-description{
    margin:0 0 13px;
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
}

.players{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin:10px 0 13px;
}

.player{
    padding:6px 9px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#10151b;
    color:#bdc5cf;
    font-size:11px;
}

.player.host{
    color:#e4c86f;
    border-color:#5d4d28;
}

.game-actions{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.game-button{
    padding:9px 13px;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--surface3);
    color:white;
    font-weight:750;
    font-size:12px;
}

.game-button:hover:not(:disabled){
    filter:brightness(1.12);
}

.game-button.primary{
    background:#e9ebee;
    color:#101216;
}

.game-button.success{
    background:#173525;
    border-color:#285c40;
    color:#91edb3;
}

.game-button.danger{
    background:#351a1e;
    border-color:#683139;
    color:#ff8a8a;
}

.game-button.small{
    padding:6px 9px;
    font-size:10px;
}

/* =========================================================
   TIC TAC TOE
========================================================= */

.ttt-board{
    display:grid;
    gap:5px;
    width:min(430px,100%);
    margin:18px auto;
}

.ttt-cell{
    aspect-ratio:1;
    border:1px solid var(--border);
    border-radius:9px;
    background:#0e1319;
    color:white;
    font-size:clamp(18px,5vw,31px);
    font-weight:900;
    transition:.12s;
}

.ttt-cell:hover:not(:disabled){
    background:#202630;
}

.ttt-cell.x{
    color:#f0f2f5;
}

.ttt-cell.o{
    color:#8d98a8;
}

.turn{
    margin:10px 0;
    padding:9px 11px;
    text-align:center;
    border-radius:9px;
    border:1px solid var(--border);
    background:#11161c;
    color:#aeb6c1;
    font-size:12px;
}

.turn strong{
    color:white;
}

/* =========================================================
   REACTION
========================================================= */

.reaction-box{
    width:min(280px,75vw);
    aspect-ratio:1;
    margin:20px auto;
    display:grid;
    place-items:center;
    border-radius:20px;
    border:3px solid #303640;
    background:#151a21;
    color:#808995;
    font-size:23px;
    font-weight:850;
    user-select:none;
    transition:.15s;
}

.reaction-box.ready{
    background:#183c29;
    border-color:#3c8c5b;
    color:#8cffb5;
}

.reaction-box.go{
    background:#472024;
    border-color:#9a414c;
    color:#ff8585;
}

.reaction-box.done{
    background:#25223a;
    border-color:#514b78;
    color:#b9b2ff;
}

/* =========================================================
   TYPE GAME
========================================================= */

.type-sentence{
    margin:16px auto;
    width:min(700px,100%);
    padding:17px;
    border-radius:11px;
    background:#10151b;
    border:1px solid var(--border);
    text-align:center;
    font-size:19px;
    font-weight:750;
    line-height:1.5;
}

.type-input{
    display:block;
    width:min(600px,100%);
    margin:auto;
    padding:12px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#0d1217;
    color:white;
    outline:0;
}

.type-input:focus{
    border-color:#515b68;
}

.stats{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin:12px 0;
}

.stat{
    padding:7px 10px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#10151b;
    color:#8f98a5;
    font-size:11px;
}

.stat strong{
    color:white;
}

/* =========================================================
   BOSS
========================================================= */

.boss-title{
    text-align:center;
    font-size:27px;
    font-weight:950;
    color:#ff6572;
    margin:8px 0;
}

.boss-hp{
    position:relative;
    width:100%;
    height:28px;
    overflow:hidden;
    border-radius:14px;
    border:1px solid #513039;
    background:#160f12;
}

.boss-hp-fill{
    height:100%;
    width:100%;
    background:linear-gradient(
        90deg,
        #c93a49,
        #ff6b50
    );
    transition:width .25s;
}

.boss-hp-text{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    color:white;
    font-size:11px;
    font-weight:850;
}

.boss-damage{
    text-align:center;
    margin:10px 0;
    color:#ff8a6b;
    font-size:24px;
    font-weight:950;
}

.boss-upgrades{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:7px;
}

.upgrade{
    padding:8px 11px;
    border:1px solid var(--border);
    border-radius:9px;
    background:#11161c;
    color:white;
    font-size:11px;
}

.upgrade span{
    display:block;
    color:#e5c66b;
    margin-top:3px;
}

/* =========================================================
   CONFIRM
========================================================= */

.confirm-buttons{
    display:flex;
    gap:8px;
    justify-content:flex-end;
}

/* =========================================================
   TOAST
========================================================= */

.toast-container{
    position:fixed;
    right:18px;
    bottom:85px;
    z-index:500;
    display:flex;
    flex-direction:column;
    gap:7px;
    pointer-events:none;
}

.toast{
    max-width:320px;
    padding:11px 13px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#171c23;
    color:#dce1e7;
    box-shadow:0 10px 30px #0006;
    font-size:12px;
    animation:toastIn .2s ease;
}

@keyframes toastIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:650px){

    .header{
        padding:0 11px;
        height:61px;
        min-height:61px;
    }

    .brand-icon{
        width:36px;
        height:36px;
    }

    .messages{
        padding:16px 10px;
    }

    .message-body{
        max-width:calc(100vw - 60px);
    }

    .message-card{
        max-width:100%;
    }

    .game-grid{
        grid-template-columns:1fr;
    }

    .game-header{
        padding:13px;
    }

    .game-body{
        padding:13px;
    }

    .composer{
        padding:8px 9px 10px;
    }

    .send-button{
        padding:0 13px;
    }

    .modal-body{
        padding:13px;
    }

    .modal{
        border-radius:14px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="brand">

        <div class="brand-icon">🎮</div>

        <div class="brand-text">
            <div class="brand-name">
                Game Chat
            </div>

            <div class="channel">
                # general
            </div>
        </div>

    </div>

    <div class="header-actions">

        <button
            class="icon-button"
            id="gamesButton"
            title="Games"
        >🎮</button>

        <button
            class="icon-button"
            id="settingsButton"
            title="Settings"
        >⚙</button>

    </div>

</header>


<main
    class="messages"
    id="messages"
></main>


<div class="composer">

    <div class="composer-inner">

        <textarea
            id="messageInput"
            class="message-input"
            rows="1"
            maxlength="2000"
            placeholder="Message #general"
        ></textarea>

        <button
            id="sendButton"
            class="send-button"
        >
            Send
        </button>

    </div>

</div>

</div>


<!-- =====================================================
     GAMES MODAL
===================================================== -->

<div
    class="overlay"
    id="gamesOverlay"
>

<div class="modal">

    <div class="modal-header">

        <div class="modal-title">
            Create a game
        </div>

        <button
            class="icon-button"
            id="closeGames"
        >×</button>

    </div>

    <div class="modal-body">

        <p
            style="
            color:var(--muted);
            font-size:12px;
            line-height:1.5;
            margin-top:0;
            "
        >
            Create a multiplayer game. Everyone in the chat
            will see it automatically.
        </p>

        <div class="game-grid">

            <button
                class="game-choice"
                data-create-game="ttt3"
            >
                <strong>⭕ Tic-Tac-Toe 3×3</strong>
                <span>
                    Classic three in a row.
                </span>
                <div class="game-players">
                    2 players
                </div>
            </button>

            <button
                class="game-choice"
                data-create-game="ttt4"
            >
                <strong>⭕ Tic-Tac-Toe 4×4</strong>
                <span>
                    Four in a row wins.
                </span>
                <div class="game-players">
                    2 players
                </div>
            </button>

            <button
                class="game-choice"
                data-create-game="ttt5"
            >
                <strong>⭕ Tic-Tac-Toe 5×5</strong>

async function apiGet(){

        await fetch(

            "?channel="+

            {
                method:"GET",
                cache:"no-store"
            }
        );

    if(!response.ok){

        throw new Error(
            "Server returned "+
            response.status
        );

    }

    const data=
        await response.json();

    return Array.isArray(data.messages)
        ? data.messages
        : [];

}

                headers:{

                body:
                    JSON.stringify({
                        ...body,
                        channel:CHANNEL
                    })
            }
        );

    const data=
        await response.json()
            .catch(()=>({}));

    if(!response.ok){

        throw new Error(
            data.error ||
            "Request failed"
        );

    }

    return data;

}

/* =========================================================

========================================================= */

function isNearBottom(){

    return (
        messages.scrollHeight -
        messages.scrollTop -
        messages.clientHeight
    ) < 100;

}


function renderNormalMessages(){

    const oldBottom=
        isNearBottom();

    const activeIds=
        new Set(
            normalMessages.map(
                m=>String(m.id)
            )
        );

    /* REMOVE MISSING */

    for(
        const [id,element]
        of renderedMessages
    ){

        if(!activeIds.has(id)){

            element.remove();

            renderedMessages.delete(id);

        }

    }

    /* ADD / UPDATE */

    for(const msg of normalMessages){

        const id=
            String(msg.id);

        let element=
            renderedMessages.get(id);

        if(!element){

            element=
                createMessageElement(msg);

            renderedMessages.set(
                id,
                element
            );

            insertMessageInOrder(
                element,
                msg
            );

        }else{

            updateMessageElement(
                element,
                msg
            );

        }

    }

    if(
        settings.autoScroll &&
        oldBottom
    ){

        messages.scrollTop=
            messages.scrollHeight;

    }

}


function insertMessageInOrder(
    element,
    msg
){

    const targetTime=
        new Date(
            msg.created_at
        ).getTime();

    const children=
        [...messages.children];

    for(const child of children){

        if(
            !child.dataset ||
            !child.dataset.messageId
        ){
            continue;
        }

        const other=
            normalMessages.find(
                m=>
                    String(m.id)===
                    child.dataset.messageId
            );

        if(!other){
            continue;
        }

        const otherTime=
            new Date(
                other.created_at
            ).getTime();

        if(targetTime<otherTime){

            messages.insertBefore(
                element,
                child
            );

            return;

        }

    }

    messages.appendChild(element);

}


function createMessageElement(msg){

    const element=
        document.createElement("div");

    element.className="message";

    element.dataset.messageId=
        String(msg.id);

    const avatar=
        document.createElement("div");

    avatar.className="avatar";

    avatar.textContent=
        getInitials(

function updateMessageElement(
    element,
    msg
){

    const name=
        element.querySelector(
            ".username"
        );

    const time=
        element.querySelector(
            ".time"
        );

    const edited=
        element.querySelector(
            ".edited"
        );

    const text=
        element.querySelector(
            ".message-text"
        );

        msg.username ||
        "Anonymous";

        const date=
            new Date(
                msg.created_at
            );

        time.textContent=
            date.toLocaleTimeString(
                [],
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );

    }else{

        time.textContent="";

    }

    edited.textContent=
        msg.edited
            ? "edited"
            : "";

    text.textContent=
        msg.message || "";

}


function getInitials(name){

    const value=
        String(name || "?")
            .trim();

    if(!value){
        return "?";
    }

    const parts=
        value.split(/\s+/);

    if(parts.length===1){

        return parts[0]
            .substring(0,2)
            .toUpperCase();

    }

    return (
        parts[0][0]+
        parts[1][0]
    ).toUpperCase();

}


/* =========================================================
   GAME STATE PARSING
========================================================= */

function parseGameMessage(msg){

    if(
        msg.username!==
        GAME_SERVER
    ){

        return null;

    }

    try{

        const data=
            JSON.parse(
                msg.message
            );

        if(
            data &&
            data.kind
        ){

            return {
                data,
                message:msg
            };

        }

    }catch(error){

        /* old/invalid hidden messages */

    }

    return null;

}


function collectGames(serverMessages){

    const states=
        new Map();

    const actions=[];

    for(const msg of serverMessages){

        const parsed=
            parseGameMessage(msg);

        if(!parsed){
            continue;
        }

        const data=
            parsed.data;

        if(data.kind==="game"){

            if(
                !data.gameId
            ){
                continue;
            }

            states.set(
                data.gameId,
                {
                    ...data,
                    _message:msg
                }
            );

        }

        if(data.kind==="action"){

            actions.push({
                ...data,
                _message:msg
            });

        }

    }

    return {
        states,
        actions
    };

}


/* =========================================================
   GAME HOST ACTION PROCESSING
========================================================= */

async function processHostActions(
    gameStates,
    actions
){

    for(
        const [gameId,game]
        of gameStates
    ){

        if(
            game.hostDeviceId !==
            deviceId
        ){
            continue;
        }

        const relevant=
            actions.filter(
                action=>
                    action.gameId===
                    gameId
            );

        if(!relevant.length){
            continue;
        }

        let changed=false;

        for(const action of relevant){

            const result=
                applyGameAction(
                    game,
                    action
                );

            if(result){
                changed=true;
            }

        }

        if(changed){

            game.updatedAt=
                now();

            try{

                await updateGame(
                    game
                );

            }catch(error){

                console.error(
                    "Game update failed",
                    error
                );

            }

        }

    }

}


function applyGameAction(
    game,
    action
){

    if(
        !game ||
        game.status==="finished"
    ){
        return false;
    }

    if(
        !action.playerId
    ){
        return false;
    }

    const player=
        game.players.find(
            p=>
                p.id===
                action.playerId
        );

    /* JOIN */

    if(
        action.action==="join"
    ){

        if(player){
            return false;
        }

        if(
            game.players.length>=
            game.maxPlayers
        ){
            return false;
        }

        game.players.push({
            id:action.playerId,
            name:
                action.name ||
                "Player",
            joinedAt:now()
        });

        return true;

    }


    if(!player){
        return false;
    }


    /* START REQUEST */

    if(
        action.action==="start"
    ){

        if(
            game.hostDeviceId===
            action.playerId
        ){

            return startGameState(
                game
            );

        }

        return false;

    }


    /* FORCE STOP */

    if(
        action.action==="forceStop"
    ){

        if(
            game.hostDeviceId===
            action.playerId
        ){

            game.status=
                "finished";

            game.result={
                type:"stopped",
                message:
                    "Game stopped by host."
            };

            game.finishedAt=
                now();

            return true;

        }

        return false;

    }


    /* GAME-SPECIFIC */

    if(
        game.type.startsWith("ttt")
    ){

        if(
            action.action==="tttMove"
        ){

            return handleTTTMove(
                game,
                player,
                action
            );

        }

    }


    if(
        game.type==="reaction"
    ){

        if(
            action.action==="reactionClick"
        ){

            return handleReactionClick(
                game,
                player,
                action
            );

        }

    }


    if(
        game.type==="type"
    ){

        if(
            action.action==="typeSubmit"
        ){

            return handleTypeSubmit(
                game,
                player,
                action
            );

        }

    }


    if(
        game.type==="boss"
    ){

        if(
            action.action==="bossAttack"
        ){

            return handleBossAttack(
                game,
                player
            );

        }

    }

    return false;

}


/* =========================================================
   TTT
========================================================= */

function startGameState(game){

    if(
        game.players.length<
        game.minPlayers
    ){
        return false;
    }

    game.status="running";

    game.startedAt=
        now();

    if(
        game.type.startsWith("ttt")
    ){

        const size=
            GAME_TYPES[
                game.type
            ].size;

        game.ttt={
            size,
            board:
                Array(
                    size*size
                ).fill(""),
            turn:
                0,
            winner:null,
            moves:0
        };

    }


    if(game.type==="reaction"){

        game.reaction={
            phase:"waiting",
            goAt:
                now()+
                2000+
                Math.random()*4000,
            clicks:{},
            results:{}
        };

    }


    if(game.type==="type"){

        const sentences=[
            "The quick fox jumps over the quiet hill.",
            "Everyone in the game is ready to play.",
            "The fastest player wins this round.",
            "Welcome to the multiplayer game chat.",
            "Sometimes the simplest games are the most fun.",
            "A good player knows when to wait and when to move."
        ];

        game.typeGame={
            sentence:
                sentences[
                    Math.floor(
                        Math.random()*
                        sentences.length
                    )
                ],
            results:{}
        };

    }


    if(game.type==="boss"){

        game.boss={
            maxHp:100000000,
            hp:100000000,
            damage:100,
            hits:{}
        };

    }

    return true;

}


function handleTTTMove(
    game,
    player,
    action
){

    if(
        game.status!=="running" ||
        !game.ttt
    ){
        return false;
    }

    const players=
        game.players;

    const currentPlayer=
        players[
            game.ttt.turn %
            players.length
        ];

    if(
        currentPlayer.id!==
        player.id
    ){
        return false;
    }

    const index=
        Number(action.index);

    const size=
        game.ttt.size;

    if(
        !Number.isInteger(index) ||
        index<0 ||
        index>=size*size
    ){
        return false;
    }

    if(
        game.ttt.board[index]
    ){
        return false;
    }

    const symbol=
        game.ttt.turn%2===0
            ? "X"
            : "O";

    game.ttt.board[index]=
        symbol;

    game.ttt.moves++;

    if(
        checkTTTWin(
            game.ttt.board,
            size,
            index,
            symbol
        )
    ){

        game.ttt.winner=
            player.id;

        game.status=
            "finished";

        game.result={
            type:"winner",
            playerId:
                player.id,
            name:
                player.name
        };

        game.finishedAt=
            now();

        return true;

    }

    if(
        game.ttt.moves>=
        size*size
    ){

        game.status=
            "finished";

        game.result={
            type:"draw"
        };

        game.finishedAt=
            now();

        return true;

    }

    game.ttt.turn++;

    return true;

}


function checkTTTWin(
    board,
    size,
    index,
    symbol
){

    const row=
        Math.floor(index/size);

    const col=
        index%size;


    const directions=[
        [1,0],
        [0,1],
        [1,1],
        [1,-1]
    ];


    for(
        const [dr,dc]
        of directions
    ){

        let count=1;

        for(
            let direction=1;
            direction<6;
            direction++
        ){

            const r=
                row+
                dr*
                direction;

            const c=
                col+
                dc*
                direction;

            if(
                r<0 ||
                r>=size ||
                c<0 ||
                c>=size
            ){
                break;
            }

            if(
                board[
                    r*size+c
                ]===
                symbol
            ){
                count++;
            }else{
                break;
            }

        }

        for(
            let direction=1;
            direction<6;
            direction++
        ){

            const r=
                row-
                dr*
                direction;

            const c=
                col-
                dc*
                direction;

            if(
                r<0 ||
                r>=size ||
                c<0 ||
                c>=size
            ){
                break;
            }

            if(
                board[
                    r*size+c
                ]===
                symbol
            ){
                count++;
            }else{
                break;
            }

        }

        if(count>=size){
            return true;
        }

    }

    return false;

}


/* =========================================================
   REACTION
========================================================= */

function updateReactionGame(
    game
){

    if(
        game.type!=="reaction" ||
        game.status!=="running" ||
        !game.reaction
    ){
        return false;
    }

    if(
        game.reaction.phase==="waiting" &&
        now()>=
        game.reaction.goAt
    ){

        game.reaction.phase="go";

        game.reaction.goTimestamp=
            now();

        return true;

    }

    return false;

}


function handleReactionClick(
    game,
    player,
    action
){

    if(
        !game.reaction ||
        game.reaction.phase!=="go"
    ){
        return false;
    }

    if(
        game.reaction.clicks[player.id]
    ){
        return false;
    }

    const reactionTime=
        Math.max(
            0,
            Number(action.timestamp)-
            Number(
                game.reaction.goTimestamp
            )
        );

    game.reaction.clicks[
        player.id
    ]={
        time:reactionTime,
        name:player.name
    };

    game.reaction.results[
        player.id
    ]=reactionTime;

    if(
        Object.keys(
            game.reaction.clicks
        ).length>=
        game.players.length
    ){

        finishReaction(game);

    }

    return true;

}


function finishReaction(game){

    const results=
        Object.entries(
            game.reaction.results
        )
        .sort(
            (a,b)=>a[1]-b[1]
        );

    game.status="finished";

    if(results.length){

        const winner=
            game.players.find(
                p=>
                    p.id===
                    results[0][0]
            );

        game.result={
            type:"winner",
            playerId:
                results[0][0],
            name:
                winner?.name ||
                "Winner",
            time:
                results[0][1]
        };

    }

    game.finishedAt=
        now();

}


/* =========================================================
   TYPE GAME
========================================================= */

function handleTypeSubmit(
    game,
    player,
    action
){

    if(
        game.status!=="running" ||
        !game.typeGame
    ){
        return false;
    }

    if(
        game.typeGame.results[
            player.id
        ]
    ){
        return false;
    }

    if(
        String(action.text || "")
        !==
        game.typeGame.sentence
    ){
        return false;
    }

    game.typeGame.results[
        player.id
    ]={
        time:
            Number(action.timestamp)-
            Number(game.startedAt),
        name:
            player.name
    };

    if(
        Object.keys(
            game.typeGame.results
        ).length>=
        game.players.length
    ){

        finishTypeGame(game);

    }

    return true;

}


function finishTypeGame(game){

    const results=
        Object.entries(
            game.typeGame.results
        )
        .sort(
            (a,b)=>
                a[1].time-
                b[1].time
        );

    if(!results.length){
        return;
    }

    const winner=
        results[0][1];

    game.status=
        "finished";

    game.result={
        type:"winner",
        playerId:
            results[0][0],
        name:
            winner.name,
        time:
            winner.time
    };

    game.finishedAt=
        now();

}


/* =========================================================
   BOSS
========================================================= */

function handleBossAttack(
    game,
    player
){

    if(
        game.status!=="running" ||
        !game.boss
    ){
        return false;
    }

    const last=
        game.boss.hits[
            player.id
        ] || 0;

    if(
        now()-last<250
    ){
        return false;
    }

    game.boss.hits[
        player.id
    ]=now();

    game.boss.hp=
        Math.max(
            0,
            game.boss.hp-
            game.boss.damage
        );

    if(game.boss.hp<=0){

        game.status=
            "finished";

        game.result={
            type:"bossDefeated"
        };

        game.finishedAt=
            now();

    }

    return true;

}

    });

function cleanGameState(game){

    const copy=
        JSON.parse(
            JSON.stringify(game)
        );

    delete copy._message;

    return copy;

}

    if(!config){
        return;
    }

                joinedAt:now()
            }

   ACTION MESSAGES
========================================================= */

async function sendGameAction(
    game,
    action
){

    const key=
        game.gameId+
        ":"+
        action.action;

    if(
        actionCooldowns[key] &&
        now()-
        actionCooldowns[key]<
        150
    ){
        return;
    }

    actionCooldowns[key]=
        now();

    try{

        await apiPost({

            username:
                GAME_SERVER,

            device_id:
                deviceId,

            game_server:true,

            message:
                JSON.stringify({

                    kind:"action",

                    gameId:
                        game.gameId,

                    action:
                        action.action,

                    playerId:
                        deviceId,

                    name:
                        gameUsername(),

                    timestamp:
                        now(),

                    ...action

                })

        });

    }catch(error){

        toast(
            error.message
        );

    }

}


/* =========================================================
   JOIN
========================================================= */

async function joinGame(game){

    if(
        game.players.some(
            p=>p.id===deviceId
        )
    ){

        toast(
            "You are already in this game"
        );

        return;

    }

    if(
        game.players.length>=
        game.maxPlayers
    ){

        toast(
            "Game is full"
        );

        return;

    }

    await sendGameAction(
        game,
        {
            action:"join"
        }
    );

    toast(
        "Join request sent"
    );

}


/* =========================================================
   START / STOP
========================================================= */

async function requestStart(game){

    if(
        game.hostDeviceId===
        deviceId
    ){

        /* host can immediately process */

        const copy=
            JSON.parse(
                JSON.stringify(game)
            );

        if(
            copy.players.length<
            copy.minPlayers
        ){

            toast(
                "Need at least "+
                copy.minPlayers+
                " players"
            );

            return;

        }

        if(copy.status!=="lobby"){
            return;
        }

        startGameState(copy);

        try{

            await updateGame({
                ...copy,
                _message:
                    game._message
            });

            await poll();

        }catch(error){

            toast(
                error.message
            );

        }

    }else{

        await sendGameAction(
            game,
            {
                action:"start"
            }
        );

    }

}


async function forceStop(game){

    if(
        game.hostDeviceId!==
        deviceId
    ){
        return;
    }

    const copy=
        JSON.parse(
            JSON.stringify(game)
        );

    copy.status=
        "finished";

    copy.result={
        type:"stopped",
        message:
            "Game stopped by host."
    };

    copy.finishedAt=
        now();

    try{

        await updateGame({
            ...copy,
            _message:
                game._message
        });

        await poll();

    }catch(error){

        toast(
            error.message
        );

    }

}


/* =========================================================
   GAME CARD RENDER
========================================================= */

function renderGames(){

    const active=
        new Set();

    for(
        const [id,game]
        of games
    ){

        active.add(id);

        let element=
            renderedGames.get(id);

        if(!element){

            element=
                document.createElement(
                    "div"
                );

            element.className=
                "game-message";

            element.dataset.gameId=
                id;

            renderedGames.set(
                id,
                element
            );

            messages.appendChild(
                element
            );

        }

        updateGameElement(
            element,
            game
        );

    }


    for(
        const [id,element]
        of renderedGames
    ){

        if(!active.has(id)){

            element.remove();

            renderedGames.delete(id);

        }

    }

}

        );

    let html=`

            </div>

        </div>

        <div class="game-status ${statusClass}">
            ${statusText}
        </div>

    </div>

    <div class="game-body">

        <div class="players">

                        ? "👑 "
                        : ""
                }

                ${escapeHTML(
                    player.name
                )}

            </div>

`;

    }

    html+=`

        </div>
`;

    if(
        game.status==="lobby"
    ){

        html+=`

        <p class="game-description">

            ${

            }/
            ${
                game.maxPlayers
            } joined.
        </p>

    }


    if(
        game.status==="finished"
    ){

        html+=`

        isHost
    ){

        html+=`

            <button
                class="game-button primary"
                data-action="start"
                ${
                    game.players.length<
                    game.minPlayers
                        ? "disabled"
                        : ""
                }
            >
                Start
            </button>

`;

    }


    if(
        isHost &&
        game.status!=="finished"
    ){

        html+=`

            <button
                class="game-button danger"
                data-action="stop"
            >
                Force stop
            </button>

`;

    }


    html+=`

        </div>

    </div>

</div>
`;

    return html;

}


/* =========================================================
   RUNNING GAME HTML
========================================================= */

function buildRunningGame(game){

    if(
        game.type.startsWith("ttt")
    ){

        return buildTTT(
            game
        );

    }

    if(game.type==="reaction"){

        return buildReaction(
            game
        );

    }

    if(game.type==="type"){

        return buildType(
            game
        );

    }

    if(game.type==="boss"){

        return buildBoss(
            game
        );

    }

    return "";

}


/* =========================================================
   TTT UI
========================================================= */

function buildTTT(game){

    const size=
        game.ttt.size;

    const joined=
        game.players.some(
            p=>p.id===deviceId
        );

    const current=
        game.players[
            game.ttt.turn %
            game.players.length
        ];

    let html=`

        <div class="turn">

            ${
                joined &&
                current.id===deviceId
                    ? "<strong>Your turn</strong>"
                    :
                    "Turn: <strong>"+
                    escapeHTML(
                        current.name
                    )+
                    "</strong>"
            }

        </div>

        <div
            class="ttt-board"
            style="
                grid-template-columns:
                repeat(${size},1fr)
            "
        >
`;

    game.ttt.board.forEach(
        (value,index)=>{

            html+=`

            <button
                class="ttt-cell ${
                    value==="X"
                        ? "x"
                        : value==="O"
                            ? "o"
                            : ""
                }"
                data-ttt-index="${index}"
                ${
                    value ||
                    !joined ||
                    current.id!==deviceId
                        ? "disabled"
                        : ""
                }
            >
                ${value || ""}
            </button>

`;

        }
    );

    html+=`

        </div>
`;

    return html;

}


/* =========================================================
   REACTION UI
========================================================= */

function buildReaction(game){

    const phase=
        game.reaction?.phase ||
        "waiting";

    const clicked=
        Boolean(
            game.reaction?.clicks?.[
                deviceId
            ]
        );

    let text="WAIT";

    if(phase==="go"){
        text=
            clicked
                ? "DONE"
                : "CLICK!";
    }

    if(
        phase==="waiting"
    ){
        text="WAIT...";
    }

    return `

        <div class="turn">
            ${
                phase==="go"
                    ? "GO!"
                    : "Wait for green..."
            }
        </div>

        <div
            class="reaction-box ${
                phase==="go"
                    ? "go"
                    : "waiting"
            }"
            data-reaction
        >
            ${text}
        </div>

        <div class="stats">

            ${
                Object.entries(
                    game.reaction?.results ||
                    {}
                )
                .map(
                    ([id,time])=>{
                        const p=
                            game.players.find(
                                x=>x.id===id
                            );

                        return `
                        <div class="stat">
                            ${escapeHTML(
                                p?.name ||
                                "Player"
                            )}
                            <strong>
                                ${time} ms
                            </strong>
                        </div>
                        `;
                    }
                )
                .join("")
            }

        </div>
`;

}


/* =========================================================
   TYPE UI
========================================================= */

function buildType(game){

    const joined=
        game.players.some(
            p=>p.id===deviceId
        );

    const completed=
        Boolean(
            game.typeGame?.results?.[
                deviceId
            ]
        );

    return `

        <div class="type-sentence">
            ${escapeHTML(
                game.typeGame.sentence
            )}
        </div>

        ${
            joined &&
            !completed
                ? `
                    <input
                        class="type-input"
                        data-type-input
                        placeholder="Type the sentence..."
                        autocomplete="off"
                    >
                `
                : ""
        }

        ${
            completed
                ? `
                    <div class="turn">
                        ✓ Your answer has been submitted.
                    </div>
                `
                : ""
        }

        <div class="stats">

            ${
                Object.entries(
                    game.typeGame.results
                )
                .map(
                    ([id,result])=>`
                        <div class="stat">
                            ${
                                escapeHTML(
                                    result.name
                                )
                            }
                            <strong>
                                ${result.time} ms
                            </strong>
                        </div>
                    `
                )
                .join("")
            }

        </div>
`;

}


/* =========================================================
   BOSS UI
========================================================= */

function buildBoss(game){

    const hp=
        game.boss.hp;

    const max=
        game.boss.maxHp;

    const percent=
        Math.max(
            0,
            Math.min(
                100,
                hp/max*100
            )
        );

    const joined=
        game.players.some(
            p=>p.id===deviceId
        );

    return `

        <div class="boss-title">
            THE BOSS
        </div>

        <div class="boss-hp">

            <div
                class="boss-hp-fill"
                style="width:${percent}%"
            ></div>

            <div class="boss-hp-text">
                ${formatNumber(hp)}
                /
                ${formatNumber(max)}
                HP
            </div>

        </div>

        <div class="boss-damage">
            ${formatNumber(
                game.boss.damage
            )}
            damage / hit
        </div>

        <div class="boss-upgrades">

            <button
                class="upgrade"
                data-boss-attack
                ${
                    joined
                        ? ""
                        : "disabled"
                }
            >
                ⚔ Attack
                <span>
                    ${
                        joined
                            ? "CLICK"
                            : "JOIN FIRST"
                    }
                </span>
            </button>

        </div>

`;

}


function formatNumber(value){

    return Number(
        value || 0
    ).toLocaleString();

}


/* =========================================================
   RESULT
========================================================= */

function getGameResultText(game){

    if(!game.result){

        return "Game finished.";

    }

    if(
        game.result.type==="winner"
    ){

        if(
            game.type==="reaction"
        ){

            return (
                game.result.name+
                " won with "+
                game.result.time+
                " ms!"
            );

        }

        if(
            game.type==="type"
        ){

            return (
                game.result.name+
                " typed it first!"
            );

        }

        return (
            game.result.name+
            " won!"
        );

    }

    if(
        game.result.type==="draw"
    ){
        return "Draw!";
    }

    if(
        game.result.type===
        "bossDefeated"
    ){
        return "👹 Boss defeated!";
    }

    if(
        game.result.type===
        "stopped"
    ){
        return "Game stopped by host.";
    }

    return "Game finished.";

}


/* =========================================================
   GAME EVENTS
========================================================= */

function attachGameEvents(
    element,
    game
){

    const join=
        element.querySelector(
            '[data-action="join"]'
        );

    if(join){

        join.onclick=()=>{

            joinGame(game);

        };

    }


    const start=
        element.querySelector(
            '[data-action="start"]'
        );

    if(start){

        start.onclick=()=>{

            requestStart(game);

        };

    }


    const stop=
        element.querySelector(
            '[data-action="stop"]'
        );

    if(stop){

        stop.onclick=()=>{

            confirmAction(
                "Stop game?",
                "This will immediately stop the game.",
                ()=>forceStop(game)
            );

        };

    }


    element
        .querySelectorAll(
            "[data-ttt-index]"
        )
        .forEach(button=>{

            button.onclick=()=>{

                sendGameAction(
                    game,
                    {
                        action:
                            "tttMove",

                        index:
                            Number(
                                button
                                    .dataset
                                    .tttIndex
                            )
                    }
                );

            };

        });


    const reaction=
        element.querySelector(
            "[data-reaction]"
        );

    if(reaction){

        reaction.onclick=()=>{

            if(
                game.reaction?.phase!=="go"
            ){
                return;
            }

            if(
                game.reaction.clicks[
                    deviceId
                ]
            ){
                return;
            }

            sendGameAction(
                game,
                {
                    action:
                        "reactionClick",

                    timestamp:
                        now()
                }
            );

        };

    }


    const typeInput=
        element.querySelector(
            "[data-type-input]"
        );

    if(typeInput){

        const key=
            "type_"+game.gameId;

        if(
            localGameInputs[key]
        ){

            typeInput.value=
                localGameInputs[key];

        }

        typeInput.addEventListener(
            "input",
            ()=>{
                localGameInputs[key]=
                    typeInput.value;
            }
        );

        typeInput.addEventListener(
            "keydown",
            event=>{

                if(
                    event.key==="Enter"
                ){

                    event.preventDefault();

                    sendGameAction(
                        game,
                        {
                            action:
                                "typeSubmit",

                            text:
                                typeInput.value,

                            timestamp:
                                now()
                        }
                    );

                }

            }
        );

    }


    const attack=
        element.querySelector(
            "[data-boss-attack]"
        );

    if(attack){

        attack.onclick=()=>{

            sendGameAction(
                game,
                {
                    action:
                        "bossAttack"
                }
            );

        };

    }

}


/* =========================================================
   HIDDEN GAME MESSAGE CLEANUP
========================================================= */

function cleanDeadGames(){

    const timestamp=
        now();

    for(
        const [id,game]
        of games
    ){

        /* Finished games disappear after 3 sec */

        if(
            game.status==="finished" &&
            game.finishedAt &&
            timestamp-
            game.finishedAt >=
            DONE_REMOVE_DELAY
        ){

            games.delete(id);

            continue;

        }


        /* Host heartbeat */

        if(
            game.status!=="finished" &&
            game.hostDeviceId!==deviceId
        ){

            const heartbeat=
                Number(
                    game.heartbeat ||
                    game.updatedAt ||
                    game.createdAt ||
                    0
                );

            if(
                timestamp-
                heartbeat >
                HEARTBEAT_TIMEOUT
            ){

                games.delete(id);

            }

        }

    }

}


/* =========================================================
   HOST HEARTBEAT
========================================================= */

async function heartbeatGames(){

    const owned=
        [...games.values()]
        .filter(
            game=>
                game.hostDeviceId===
                deviceId &&
                game.status!=="finished"
        );

    for(const game of owned){

        const copy=
            JSON.parse(
                JSON.stringify(game)
            );

        copy.heartbeat=
            now();

        copy.updatedAt=
            now();

        try{

            await updateGame({
                ...copy,
                _message:
                    game._message
            });

        }catch(error){

            console.error(
                "Heartbeat error",
                error
            );

        }

    }

}


/* =========================================================
   POLL
========================================================= */

async function poll(){

    if(polling){
        return;
    }

    polling=true;

    try{

        const fetched=
            await apiGet();

        lastServerMessages=
            fetched;

        const oldNormalIds=
            new Set(
                normalMessages.map(
                    m=>String(m.id)
                )
            );

        const oldGames=
            new Map(games);

        allMessages=
            fetched;

        normalMessages=
            fetched.filter(
                msg=>
                    msg.username!==
                    GAME_SERVER
            );

        gameMessages=
            fetched.filter(
                msg=>
                    msg.username===
                    GAME_SERVER
            );


        const collected=
            collectGames(
                gameMessages
            );


        /*
         * IMPORTANT:
         * Process host actions BEFORE displaying
         * the new game state.
         */

        await processHostActions(
            collected.states,
            collected.actions
        );


        /*
         * Re-fetch if this client is a host and
         * just changed a game.
         */

        if(
            collected.actions.length
        ){

            const refreshed=
                await apiGet();

            allMessages=
                refreshed;

            normalMessages=
                refreshed.filter(
                    msg=>
                        msg.username!==
                        GAME_SERVER
                );

            gameMessages=
                refreshed.filter(
                    msg=>
                        msg.username===
                        GAME_SERVER
                );

            const second=
                collectGames(
                    gameMessages
                );

            games=
                second.states;

        }else{

            games=
                collected.states;

        }


        cleanDeadGames();

        renderNormalMessages();

        renderGames();


        /*
         * Keep chat order correct.
         */

        sortVisibleMessages();


        if(
            !oldNormalIds.size &&
            normalMessages.length
        ){

            messages.scrollTop=
                messages.scrollHeight;

        }


    }catch(error){

        console.error(
            "Polling error:",
            error
        );

    }finally{

        polling=false;

    }

}


function sortVisibleMessages(){

    const elements=
        [...messages.children];

    elements.sort(
        (a,b)=>{

            const aGame=
                a.dataset.gameId;

            const bGame=
                b.dataset.gameId;

            if(aGame && !bGame){
                return 1;
            }

            if(!aGame && bGame){
                return -1;
            }

            if(aGame && bGame){

                const ga=
                    games.get(aGame);

                const gb=
                    games.get(bGame);

                return (
                    Number(
                        ga?.createdAt ||
                        0
                    )-
                    Number(
                        gb?.createdAt ||
                        0
                    )
                );

            }

            const ma=
                normalMessages.find(
                    m=>
                        String(m.id)===
                        a.dataset.messageId
                );

            const mb=
                normalMessages.find(
                    m=>
                        String(m.id)===
                        b.dataset.messageId
                );

            return (
                new Date(
                    ma?.created_at || 0
                )-
                new Date(
                    mb?.created_at || 0
                )
            );

        }
    );

    for(const element of elements){

        messages.appendChild(
            element
        );

    }

}


/* =========================================================
   HOST GAME TICK
========================================================= */

async function hostGameTick(){

    const owned=
        [...games.values()]
        .filter(
            game=>
                game.hostDeviceId===
                deviceId &&
                game.status==="running"
        );

    let changed=false;

    for(const game of owned){

        if(
            game.type==="reaction"
        ){

            if(
                updateReactionGame(game)
            ){

                changed=true;

            }

        }

    }

    if(changed){

        for(const game of owned){

            try{

                await updateGame({
                    ...game,
                    _message:
                        game._message
                });

            }catch(error){

                console.error(
                    error
                );

            }

        }

        await poll();

    }

}


/* =========================================================
   POLLING LOOP
========================================================= */

function restartPolling(){

    if(pollTimer){

        clearInterval(
            pollTimer
        );

    }

    poll();

    pollTimer=
        setInterval(
            poll,
            Number(
                settings.refreshRate
            )
        );

}


setInterval(
    heartbeatGames,
    2500
);


setInterval(
    hostGameTick,
    250
);


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

    const text=
        messageInput.value.trim();

    if(!text){
        return;
    }

    sendButton.disabled=true;

    try{

        await apiPost({

            username:
                usernameValue(),

            device_id:
                deviceId,

            message:text

        });

        messageInput.value="";

        autoResize();

        await poll();

        messages.scrollTop=
            messages.scrollHeight;

    }catch(error){

        toast(
            error.message
        );

    }finally{

        sendButton.disabled=false;

        messageInput.focus();

    }

}


sendButton.onclick=
    sendMessage;


messageInput.addEventListener(
    "keydown",
    event=>{

        if(
            event.key==="Enter" &&
            !event.shiftKey &&
            settings.enterToSend
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


messageInput.addEventListener(
    "input",
    autoResize
);


function autoResize(){

    messageInput.style.height=
        "auto";

    messageInput.style.height=
        Math.min(
            150,
            messageInput.scrollHeight
        )+
        "px";

}

settingsButton.onclick=()=>{

closeGames.onclick=()=>{

    );

document

   CREATE GAME BUTTONS

document

    )

        button.onclick=()=>{

/* =========================================================
   CONFIRM
========================================================= */

function confirmAction(
    title,
    text,
    callback
){

    confirmTitle.textContent=
        title;

    confirmText.textContent=
        text;

    confirmCallback=
        callback;

    openOverlay(
        confirmOverlay
    );

}


confirmCancel.onclick=()=>{

    confirmCallback=null;

    closeOverlay(
        confirmOverlay
    );

};


confirmYes.onclick=async()=>{

    const callback=
        confirmCallback;

    confirmCallback=null;

    closeOverlay(
        confirmOverlay
    );

    if(callback){

        await callback();

    }

};


/* =========================================================
   DELETE EVERYTHING
========================================================= */

deleteEverything.onclick=()=>{

    confirmAction(
        "Delete everything?",
        "This permanently removes all chat messages and hidden game states.",
        async()=>{

            try{

                await apiDelete({
                    delete_all:true
                });

                renderedMessages.forEach(
                    element=>
                        element.remove()
                );

                renderedGames.forEach(
                    element=>
                        element.remove()
                );

                renderedMessages.clear();
                renderedGames.clear();

                normalMessages=[];
                games.clear();

                await poll();

                toast(
                    "Everything deleted"
                );

            }catch(error){

                toast(
                    error.message
                );

            }

        }
    );

};


/* =========================================================
   INITIALIZE
========================================================= */

applySettings();

loadSettingsUI();

restartPolling();

messageInput.focus();


/* =========================================================
   PAGE VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    ()=>{

        if(
            !document.hidden
        ){

            poll();

        }

    }
);


/* =========================================================
   BEFORE UNLOAD
========================================================= */

/*
 * Do NOT delete the game here.
 *
 * Browsers do not reliably allow async DELETE requests
 * during page unload.
 *
 * Other clients detect a missing host through heartbeat
 * timeout instead.
 */


/* =========================================================
   LIGHTWEIGHT HOST KEEPALIVE
========================================================= */

window.addEventListener(
    "focus",
    ()=>{

        poll();

    }
);

</script>
