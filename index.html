<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat</title>

<style>
*{box-sizing:border-box}

:root{
    --bg:#0b0d10;
    --panel:#111419;
    --panel2:#181c22;
    --border:#292f38;
    --text:#edf0f4;
    --muted:#7e8793;
    --accent:#e8eaed;
    --danger:#ff7070;
    --radius:12px;
    --ui-scale:1;
    --text-size:16px;
    --word-spacing:0px;
    --line-spacing:1.45;
    --message-gap:17px;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

body{
    overflow:hidden;
    font-size:calc(16px * var(--ui-scale));
}

button,input,textarea,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:64px;
    min-height:64px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel);
    border-bottom:1px solid var(--border);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
}

.logo-icon{
    width:35px;
    height:35px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:var(--panel2);
    border:1px solid var(--border);
}

.channel{
    color:var(--muted);
    font-weight:400;
}

.icon-btn{
    width:39px;
    height:39px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
}

.icon-btn:hover{
    filter:brightness(1.15);
}

/* MESSAGES */

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    display:flex;
    gap:11px;
    margin-bottom:var(--message-gap);
}

.message.compact{
    margin-bottom:7px;
}

.avatar{
    flex:0 0 40px;
    width:40px;
    height:40px;
    display:grid;
    place-items:center;
    border-radius:var(--radius);
    background:var(--panel2);
    border:1px solid var(--border);
    font-weight:700;
}

.message-content{
    min-width:0;
    max-width:min(850px,calc(100vw - 90px));
}

.message-top{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:3px;
}

.username{
    font-weight:700;
}

.time,.edited{
    color:var(--muted);
    font-size:11px;
}

.message-text{
    color:#d8dde4;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    font-size:var(--text-size);
    word-spacing:var(--word-spacing);
    line-height:var(--line-spacing);
}

.message-link{
    color:#8eb9ff;
    text-decoration:underline;
    cursor:pointer;
}

.message-link:hover{
    filter:brightness(1.25);
}

.message-image{
    display:block;
    max-width:min(500px,80vw);
    max-height:500px;
    margin-top:8px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:#000;
    object-fit:contain;
    cursor:pointer;
}

/* COMPOSER */

.composer{
    padding:12px 16px 16px;
    background:var(--panel);
    border-top:1px solid var(--border);
}

.composer-box{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:8px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:14px;
}

textarea{
    flex:1;
    min-height:42px;
    max-height:150px;
    resize:none;
    border:0;
    outline:none;
    background:transparent;
    color:white;
    padding:10px;
}

.attach-btn,
.send-btn{
    height:42px;
    border:0;
    border-radius:9px;
}

.attach-btn{
    width:42px;
    background:transparent;
    color:#adb5c0;
    font-size:20px;
}

.attach-btn:hover{
    background:#242932;
}

.send-btn{
    padding:0 18px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

.send-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* OVERLAYS */

.overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.72);
    z-index:100;
}

.overlay.show{
    display:flex;
}

.panel{
    width:min(560px,calc(100vw - 25px));
    max-height:calc(100vh - 25px);
    overflow-y:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
    box-shadow:0 25px 80px #000b;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px;
    border-bottom:1px solid var(--border);
}

.panel-header h2{
    margin:0;
}

.panel-body{
    padding:18px;
}

/* SETTINGS */

.category{
    margin-bottom:12px;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    background:var(--panel2);
}

.category-title{
    width:100%;
    padding:14px;
    border:0;
    background:transparent;
    color:var(--text);
    display:flex;
    justify-content:space-between;
    font-weight:700;
    text-align:left;
}

.category-title span:last-child{
    color:var(--muted);
}

.category-body{
    display:none;
    padding:0 14px 14px;
}

.category.open .category-body{
    display:block;
}

.setting{
    margin-top:14px;
}

.setting label{
    display:block;
    margin-bottom:7px;
    color:#aab2bd;
    font-size:13px;
}

.setting input,
.setting select{
    width:100%;
    padding:10px;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
    background:#101419;
    color:white;
}

.setting input[type="range"]{
    padding:0;
}

.setting-value{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.save-btn,
.test-btn{
    width:100%;
    margin-top:8px;
    padding:12px;
    border:0;
    border-radius:9px;
    font-weight:700;
}

.save-btn{
    background:var(--accent);
    color:#111;
}

.test-btn{
    background:#242b34;
    border:1px solid var(--border);
    color:white;
}

.test-btn:hover{
    filter:brightness(1.15);
}

/* DANGER */

.danger-zone{
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid #402529;
}

.danger-title{
    color:var(--danger);
    font-weight:700;
    margin-bottom:7px;
}

.danger-zone p{
    color:var(--muted);
    line-height:1.45;
}

.danger-btn{
    width:100%;
    padding:12px;
    border-radius:9px;
    border:1px solid #743333;
    background:#241719;
    color:#ff8585;
}

/* CONTEXT */

.context-menu{
    position:fixed;
    display:none;
    width:160px;
    padding:5px;
    z-index:200;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:9px;
    box-shadow:0 15px 40px #0009;
}

.context-menu.show{
    display:block;
}

.context-menu button{
    width:100%;
    padding:9px 10px;
    text-align:left;
    border:0;
    border-radius:6px;
    background:transparent;
    color:var(--text);
}

.context-menu button:hover{
    background:#252b33;
}

.delete-option{
    color:#ff7777!important;
}

/* IMAGE VIEWER */

.image-viewer{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000f;
    z-index:300;
}

.image-viewer.show{
    display:flex;
}

.full-image{
    max-width:95vw;
    max-height:90vh;
    object-fit:contain;
}

.back-image{
    position:absolute;
    top:18px;
    left:18px;
    padding:10px 16px;
    border-radius:9px;
    border:1px solid #3a4049;
    background:#171b21;
    color:white;
}

/* DIALOG */

.dialog{
    width:min(450px,calc(100vw - 30px));
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
}

.dialog h2{
    margin-top:0;
}

.dialog p{
    color:#aab2bd;
    line-height:1.5;
}

.dialog-buttons{
    display:flex;
    gap:8px;
    justify-content:flex-end;
}

.dialog-buttons button{
    padding:10px 16px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#20252c;
    color:white;
}

.dialog-buttons .danger{
    background:#6b2929;
    border-color:#813434;
}

/* EMPTY */

.empty{
    height:100%;
    display:grid;
    place-items:center;
    color:#656d78;
    text-align:center;
}

.empty strong{
    display:block;
    color:#aab2bd;
    margin-bottom:5px;
}

@media(max-width:600px){

    .header{
        padding:0 11px;
    }

    .messages{
        padding:15px 11px;
    }

    .channel{
        display:none;
    }

    .message-content{
        max-width:calc(100vw - 70px);
    }

}
</style>
</head>

<body>

<div class="app">

<header class="header">

<div class="logo">
<div class="logo-icon">💬</div>
<span>Chat</span>
<span class="channel"># general</span>
</div>

<button class="icon-btn" id="settingsBtn">⚙</button>

</header>

<main class="messages" id="messages"></main>

<div class="composer">

<div class="composer-box">

<input
type="file"
id="imageInput"
accept="image/*"
hidden
>

<button
class="attach-btn"
id="attachBtn"
title="Choose image"
>＋</button>

<textarea
id="messageInput"
rows="1"
placeholder="Message #general"
></textarea>

<button
class="send-btn"
id="sendBtn"
>Send</button>

</div>

</div>

</div>


<!-- SETTINGS -->

<div class="overlay" id="settingsOverlay">

<div class="panel">

<div class="panel-header">

<h2>Settings</h2>

<button class="icon-btn" id="closeSettings">×</button>

</div>

<div class="panel-body">


<!-- PROFILE -->

<div class="category open">

<button class="category-title">
<span>👤 Profile</span>
<span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Your name</label>
<input id="usernameInput" maxlength="24" placeholder="Enter your name">
</div>

<div class="setting">
<label>Device ID</label>
<input id="deviceIdInput" readonly>
</div>

</div>
</div>


<!-- TEXT -->

<div class="category">

<button class="category-title">
<span>📝 Text</span>
<span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Text size</label>
<input id="textSize" type="range" min="12" max="28" step="1">
<div class="setting-value" id="textSizeValue"></div>
</div>

<div class="setting">
<label>Word spacing</label>
<input id="wordSpacing" type="range" min="0" max="12" step="1">
<div class="setting-value" id="wordSpacingValue"></div>
</div>

<div class="setting">
<label>Line spacing</label>
<input id="lineSpacing" type="range" min="1" max="2" step=".05">
<div class="setting-value" id="lineSpacingValue"></div>
</div>

<div class="setting">
<label>Message density</label>
<select id="messageDensity">
<option value="normal">Normal</option>
<option value="compact">Compact</option>
<option value="spacious">Spacious</option>
</select>
</div>

</div>
</div>


<!-- CHAT -->

<div class="category">

<button class="category-title">
<span>💬 Chat</span>
<span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Refresh rate</label>
<select id="refreshRate">
<option value="10000">10 seconds</option>
<option value="5000">5 seconds</option>
<option value="3000">3 seconds</option>
<option value="2000">2 seconds</option>
<option value="1000">1 second</option>
<option value="500">0.5 seconds</option>
<option value="100">0.1 seconds</option>
</select>
</div>

<div class="setting">
<label>Show timestamps</label>
<select id="showTimestamps">
<option value="true">On</option>
<option value="false">Off</option>
</select>
</div>

<div class="setting">
<label>Timestamp format</label>
<select id="timestampFormat">
<option value="short">12:34</option>
<option value="seconds">12:34:56</option>
<option value="full">Date + time</option>
</select>
</div>

<div class="setting">
<label>Auto-scroll</label>
<select id="autoScroll">
<option value="true">On</option>
<option value="false">Off</option>
</select>
</div>

</div>
</div>


<!-- APPEARANCE -->

<div class="category">

<button class="category-title">
<span>🎨 Appearance</span>
<span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Theme</label>

<select id="themeSelect">

<option value="dark">Dark</option>
<option value="midnight">Midnight</option>
<option value="slate">Slate</option>
<option value="black">Pure Black</option>
<option value="blue">Dark Blue</option>
<option value="purple">Dark Purple</option>
<option value="green">Dark Green</option>
<option value="red">Dark Red</option>
<option value="gray">Classic Gray</option>
<option value="light">Light</option>
<option value="oled">OLED</option>
<option value="carbon">Carbon</option>
<option value="steel">Steel</option>
<option value="terminal">Terminal</option>
<option value="brown">Dark Brown</option>

</select>
</div>

<div class="setting">
<label>Corner roundness</label>
<input id="cornerRadius" type="range" min="0" max="25">
<div class="setting-value" id="cornerRadiusValue"></div>
</div>

<div class="setting">
<label>UI scale</label>
<input id="uiScale" type="range" min=".8" max="1.2" step=".05">
<div class="setting-value" id="uiScaleValue"></div>
</div>

</div>
</div>


<!-- NOTIFICATIONS -->

<div class="category">

<button class="category-title">
<span>🔔 Notifications</span>
<span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Desktop notifications</label>
<select id="desktopNotifications">
<option value="false">Off</option>
<option value="true">On</option>
</select>
</div>

<div class="setting">
<label>Notify only when chat is hidden</label>
<select id="hiddenOnly">
<option value="true">On</option>
<option value="false">Off</option>
</select>
</div>

<div class="setting">
<label>Notification sound</label>
<select id="notificationSound">

<option value="false">Off</option>
<option value="true">On</option>

</select>
</div>

<div class="setting">
<label>Sound theme</label>

<select id="soundTheme">

<option value="classic">1 — Classic</option>
<option value="soft">2 — Soft</option>
<option value="digital">3 — Digital</option>
<option value="pop">4 — Pop</option>
<option value="bell">5 — Bell</option>
<option value="chime">6 — Chime</option>
<option value="retro">7 — Retro</option>
<option value="computer">8 — Computer</option>
<option value="alert">9 — Alert</option>
<option value="warning">10 — Warning</option>
<option value="alarm">11 — Nuclear Alarm</option>
<option value="opera">12 — Opera</option>
<option value="synth">13 — Synth</option>
<option value="pulse">14 — Pulse</option>
<option value="space">15 — Space</option>

</select>
</div>

<div class="setting">
<label>Sound duration</label>

<input
id="soundDuration"
type="range"
min="100"
max="5000"
step="100"
>

<div
class="setting-value"
id="soundDurationValue"
></div>

</div>

<div class="setting">
<label>Sound volume</label>

<input
id="soundVolume"
type="range"
min="0"
max="100"
step="1"
>

<div
class="setting-value"
id="soundVolumeValue"
></div>

</div>

<div class="setting">
<label>Notification preview</label>

<select id="notificationPreview">
<option value="full">Show message</option>
<option value="name">Name only</option>
<option value="generic">New message</option>
</select>
</div>

<button
class="test-btn"
id="testNotification"
>
🔔 Test Windows notification
</button>

</div>
</div>


<!-- LINKS -->

<div class="category">

<button class="category-title">
<span>🔗 Links & Media</span>
<span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Clickable links</label>

<select id="clickableLinks">
<option value="true">On</option>
<option value="false">Off</option>
</select>
</div>

<div class="setting">
<label>Automatic image links</label>

<select id="imageLinks">
<option value="true">On</option>
<option value="false">Off</option>
</select>
</div>

<div class="setting">
<label>Open links in new tab</label>

<select id="newTabLinks">
<option value="true">On</option>
<option value="false">Off</option>
</select>
</div>

</div>
</div>


<!-- BEHAVIOR -->

<div class="category">

<button class="category-title">
<span>⚙️ Behavior</span>
<span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Enter to send</label>

<select id="enterToSend">
<option value="true">On</option>
<option value="false">Off</option>
</select>
</div>

<div class="setting">
<label>Confirm before deleting</label>

<select id="confirmDelete">
<option value="true">On</option>
<option value="false">Off</option>
</select>
</div>

<div class="setting">
<label>Keep composer text after failed send</label>

<select id="keepText">
<option value="true">On</option>
<option value="false">Off</option>
</select>
</div>

</div>
</div>


<button class="save-btn" id="saveSettings">
Save settings
</button>


<!-- DANGER -->

<div class="danger-zone">

<div class="danger-title">
⚠ Danger Zone
</div>

<p>
Remove every message from the chat permanently.
This affects everyone using the chat.
</p>

<button class="danger-btn" id="removeEverything">
Remove everything
</button>

</div>

</div>
</div>
</div>


<!-- CONTEXT MENU -->

<div class="context-menu" id="contextMenu">

<button id="editMessage">Edit</button>

<button
class="delete-option"
id="deleteMessage"
>
Delete
</button>

</div>


<!-- IMAGE VIEWER -->

<div class="image-viewer" id="imageViewer">

<button
class="back-image"
id="backImage"
>
← Back
</button>

<img
class="full-image"
id="fullImage"
alt="Full image"
>

</div>


<!-- DIALOG -->

<div class="overlay" id="dialogOverlay">

<div class="dialog">

<h2 id="dialogTitle">Confirm</h2>

<p id="dialogText"></p>

<div class="dialog-buttons">

<button id="dialogCancel">
Cancel
</button>

<button
class="danger"
id="dialogConfirm"
>
Yes
</button>

</div>

</div>
</div>


<script>

const API_URL="/api/messages";
const CHANNEL="general";


/* DEVICE */

let deviceId=localStorage.getItem("chat_device_id");

if(!deviceId){

    deviceId=
        crypto.randomUUID();

    localStorage.setItem(
        "chat_device_id",
        deviceId
    );

}


/* SETTINGS */

const defaults={

username:"",

theme:"dark",

refreshRate:500,

showTimestamps:true,

timestampFormat:"short",

autoScroll:true,

textSize:16,

wordSpacing:0,

lineSpacing:1.45,

messageDensity:"normal",

cornerRadius:12,

uiScale:1,

desktopNotifications:false,

hiddenOnly:true,

notificationSound:true,

soundTheme:"classic",

soundDuration:1000,

soundVolume:70,

notificationPreview:"full",

clickableLinks:true,

imageLinks:true,

newTabLinks:true,

enterToSend:true,

confirmDelete:true,

keepText:true

};


function getSetting(key){

const value=
localStorage.getItem(
"chat_"+key
);

if(value===null){

return defaults[key];

}

if(
value==="true"||
value==="false"
){

return value==="true";

}

const number=Number(value);

return Number.isNaN(number)
?value
:number;

}


let settings={};

Object.keys(defaults).forEach(
key=>{
settings[key]=getSetting(key);
});


/* ELEMENTS */

const messagesEl=
document.getElementById("messages");

const messageInput=
document.getElementById("messageInput");

const sendBtn=
document.getElementById("sendBtn");

const imageInput=
document.getElementById("imageInput");

const attachBtn=
document.getElementById("attachBtn");

const settingsBtn=
document.getElementById("settingsBtn");

const settingsOverlay=
document.getElementById("settingsOverlay");

const closeSettings=
document.getElementById("closeSettings");

const saveSettings=
document.getElementById("saveSettings");

const usernameInput=
document.getElementById("usernameInput");

const deviceIdInput=
document.getElementById("deviceIdInput");

const themeSelect=
document.getElementById("themeSelect");

const refreshRate=
document.getElementById("refreshRate");

const showTimestamps=
document.getElementById("showTimestamps");

const timestampFormat=
document.getElementById("timestampFormat");

const autoScroll=
document.getElementById("autoScroll");

const textSize=
document.getElementById("textSize");

const wordSpacing=
document.getElementById("wordSpacing");

const lineSpacing=
document.getElementById("lineSpacing");

const messageDensity=
document.getElementById("messageDensity");

const cornerRadius=
document.getElementById("cornerRadius");

const uiScale=
document.getElementById("uiScale");

const desktopNotifications=
document.getElementById("desktopNotifications");

const hiddenOnly=
document.getElementById("hiddenOnly");

const notificationSound=
document.getElementById("notificationSound");

const soundTheme=
document.getElementById("soundTheme");

const soundDuration=
document.getElementById("soundDuration");

const soundVolume=
document.getElementById("soundVolume");

const notificationPreview=
document.getElementById("notificationPreview");

const clickableLinks=
document.getElementById("clickableLinks");

const imageLinks=
document.getElementById("imageLinks");

const newTabLinks=
document.getElementById("newTabLinks");

const enterToSend=
document.getElementById("enterToSend");

/* IMAGE RESIZE */

function resizeImage(file){

return new Promise(
(resolve,reject)=>{

const reader=new FileReader();

reader.onload=()=>{

const img=new Image();

img.onload=()=>{

let width=img.width;
let height=img.height;

const max=1500;

if(width>max||height>max){

const scale=Math.min(
max/width,
max/height
);

width=Math.round(width*scale);
height=Math.round(height*scale);

}

const canvas=
document.createElement("canvas");

canvas.width=width;
canvas.height=height;

const ctx=
canvas.getContext("2d");

ctx.drawImage(
img,
0,
0,
width,
height
);

resolve(
canvas.toDataURL(
"image/jpeg",
.78
)
);

};

img.onerror=reject;

img.src=reader.result;

};

reader.onerror=reject;

reader.readAsDataURL(file);

});

}

/* LOAD */

async function loadMessages(){

try{

const response=
await fetch(
API_URL+
"?channel="+
encodeURIComponent(CHANNEL)
);

const data=
await response.json();

if(!response.ok){

throw new Error(
data.error||
"Failed to load messages."
);

}

const oldMessages=
currentMessages;

currentMessages=
Array.isArray(data.messages)
?data.messages
:[];


/*
Detect newly received messages.
*/

if(oldMessages.length){

const oldIds=
new Set(
oldMessages.map(m=>String(m.id))
);

const newMessages=
currentMessages.filter(
m=>!oldIds.has(String(m.id))
);

for(const message of newMessages){

handleIncomingNotification(message);

}

}

renderMessages();

}catch(error){

messagesEl.innerHTML=`

<div class="empty">

<div>

<strong>
Unable to load messages
</strong>

${escapeHtml(error.message)}

</div>

</div>

`;

}

}


/* NOTIFICATION PERMISSION */

async function requestNotificationPermission(){

if(!("Notification" in window)){

alert(
"Your browser does not support desktop notifications."
);

return false;

}

if(Notification.permission==="granted")
return true;

if(Notification.permission==="denied"){

alert(
"Notifications are blocked in your browser. Allow notifications for this site in browser settings."
);

return false;

}

const permission=
await Notification.requestPermission();

return permission==="granted";

}


/* NOTIFICATION */

let lastNotificationId=null;

function handleIncomingNotification(message){

if(!message)
return;

if(
String(message.device_id)===
String(deviceId)
)
return;

if(
settings.hiddenOnly &&
document.visibilityState!=="hidden"
)
return;

if(
settings.desktopNotifications
){

showWindowsNotification(message);

}

if(
settings.notificationSound
){

if(document.visibilityState==="hidden"){

playNotificationSound(
settings.soundTheme,
settings.soundDuration,
settings.soundVolume
);

}

}

}


/* WINDOWS NOTIFICATION */

async function showWindowsNotification(message){

const allowed=
await requestNotificationPermission();

if(!allowed)
return;

let body="New message";

if(settings.notificationPreview==="name"){

body=
(message.username||"Someone")+
" sent a message";

}

else if(
settings.notificationPreview==="full"
){

body=
(message.message||
(message.image?"📷 Image":"New message"))
.substring(0,180);

}

const title=
(message.username||"Chat")+
" • #"+CHANNEL;


/*
Browser notifications behave like Windows
notifications on supported Windows browsers.
*/

try{

const notification=
new Notification(
title,
{
body:body,
tag:"chat-"+message.id,
renotify:true,
silent:true
}
);

notification.onclick=()=>{

window.focus();

notification.close();

};

}catch(error){

console.warn(
"Notification failed:",
error
);

}

}

/* AUDIO */

function getAudioContext(){

if(!audioContext){

audioContext=
new (
window.AudioContext||
window.webkitAudioContext
)();

}

if(
audioContext.state==="suspended"
){

audioContext.resume();

}

}


/*
These sounds are synthesized locally.
No external audio files are needed.
*/

function playTone(
ctx,
frequency,
start,
duration,
volume,
type="sine"
){

const oscillator=
ctx.createOscillator();

const gain=
ctx.createGain();

oscillator.type=type;

oscillator.frequency
.setValueAtTime(
frequency,
start
);

gain.gain.setValueAtTime(
0,
start
);

gain.gain.linearRampToValueAtTime(
volume,
start+.015
);

gain.gain.exponentialRampToValueAtTime(
.001,
start+duration
);

oscillator.connect(gain);

gain.connect(ctx.destination);

oscillator.start(start);

oscillator.stop(
start+duration+.03
);

}


/* 15 SOUND THEMES */

function playNotificationSound(
theme,
duration,
volume
){

const ctx=
getAudioContext();

const now=
ctx.currentTime;

const maxDuration=
Math.max(
.1,
duration/1000
);

const master=
Math.max(
0,
Math.min(1,volume/100)
)*.25;


/* 1 CLASSIC */

if(theme==="classic"){

playTone(
ctx,
880,
now,
Math.min(.18,maxDuration),
master
);

playTone(
ctx,
1175,
now+.19,
Math.min(.22,maxDuration-.19),
master
);

return;

}


/* 2 SOFT */

if(theme==="soft"){

playTone(
ctx,
523.25,
now,
Math.min(.35,maxDuration),
master*.65
);

playTone(
ctx,
659.25,
now+.25,
Math.min(.45,maxDuration-.25),
master*.65
);

return;

}


/* 3 DIGITAL */

if(theme==="digital"){

playTone(
ctx,
1000,
now,
.07,
master,
"square"
);

playTone(
ctx,
1500,
now+.09,
.09,
master,
"square"
);

return;

}


/* 4 POP */

if(theme==="pop"){

playTone(
ctx,
660,
now,
.12,
master,
"sine"
);

playTone(
ctx,
880,
now+.12,
.16,
master,
"sine"
);

return;

}


/* 5 BELL */

if(theme==="bell"){

playTone(
ctx,
784,
now,
.7,
master*.7
);

playTone(
ctx,
1174,
now,
.9,
master*.45
);

return;

}


/* 6 CHIME */

if(theme==="chime"){

const notes=[
523.25,
659.25,
783.99
];

notes.forEach(
(f,i)=>{

playTone(
ctx,
f,
now+i*.18,
Math.min(
.7,
maxDuration-i*.18
),
master*.6
);

});

return;

}


/* 7 RETRO */

if(theme==="retro"){

playTone(
ctx,
440,
now,
.1,
master,
"square"
);

playTone(
ctx,
660,
now+.12,
.1,
master,
"square"
);

playTone(
ctx,
880,
now+.24,
.13,
master,
"square"
);

return;

}


/* 8 COMPUTER */

if(theme==="computer"){

playTone(
ctx,
600,
now,
.06,
master,
"square"
);

playTone(
ctx,
900,
now+.08,
.06,
master,
"square"
);

playTone(
ctx,
1200,
now+.16,
.08,
master,
"square"
);

return;

}


/* 9 ALERT */

if(theme==="alert"){

playTone(
ctx,
740,
now,
.18,
master,
"sawtooth"
);

playTone(
ctx,
540,
now+.2,
.18,
master,
"sawtooth"
);

return;

}


/* 10 WARNING */

if(theme==="warning"){

playTone(
ctx,
500,
now,
.3,
master,
"sawtooth"
);

playTone(
ctx,
500,
now+.35,
.3,
master,
"sawtooth"
);

return;

}


/* 11 NUCLEAR ALARM */

if(theme==="alarm"){

const cycles=
Math.max(
1,
Math.ceil(maxDuration/.8)
);

for(let i=0;i<cycles;i++){

const t=
now+i*.8;

playTone(
ctx,
420,
t,
.35,
master,
"sawtooth"
);

playTone(
ctx,
820,
t+.35,
.35,
master,
"sawtooth"
);

}

return;

}


/* 12 OPERA */

if(theme==="opera"){

/*
A synthetic vocal-like sequence.
It is an original melody, not a recording.
*/

const notes=[
261.63,
329.63,
392,
329.63,
293.66,
349.23,
440,
392,
329.63,
392,
523.25
];

const noteLength=
Math.min(
.28,
maxDuration/notes.length
);

notes.forEach(
(f,i)=>{

const t=
now+i*noteLength;

playTone(
ctx,
f,
t,
Math.max(
.08,
noteLength*.9
),
master*.55,
"sine"
);

});

return;

}


/* 13 SYNTH */

if(theme==="synth"){

const notes=[
220,
330,
440,
660
];

notes.forEach(
(f,i)=>{

playTone(
ctx,
f,
now+i*.12,
.2,
master,
"triangle"
);

});

return;

}


/* 14 PULSE */

if(theme==="pulse"){

for(
let i=0;
i<4;
i++
){

playTone(
ctx,
700,
now+i*.16,
.07,
master,
"square"
);

}

return;

}


/* 15 SPACE */

if(theme==="space"){

playTone(
ctx,
180,
now,
.5,
master*.5,
"sine"
);

playTone(
ctx,
270,
now+.2,
.7,
master*.4,
"triangle"
);

playTone(
ctx,
540,
now+.4,
.8,
master*.3,
"sine"
);

}

}

if(message.image){

img.onclick=()=>{

item.appendChild(avatar);

item.appendChild(content);


/* ONLY OWNER CONTEXT MENU */

if(

){

item.addEventListener(

event=>{

showContextMenu(
event.clientX,
event.clientY,

);

});

}

fragment.appendChild(item);

});

messagesEl.replaceChildren(fragment);

if(
wasBottom &&
settings.autoScroll
){

messagesEl.scrollTop=
messagesEl.scrollHeight;

}

}


/* LINK PARSER */

function createMessageContent(text){

const container=
document.createElement("div");

container.className=
"message-text";

if(!settings.clickableLinks){

container.textContent=text;

return container;

}

const urlRegex=
/(https?:\/\/[^\s<]+)/gi;

let last=0;

let match;

while(
(match=urlRegex.exec(text))!==null
){

const before=
text.slice(
last,
match.index
);

if(before){

container.appendChild(
document.createTextNode(before)
);

}

let url=
match[0];

let punctuation="";

/*
Remove common punctuation from the URL.
*/

while(
/[.,!?;:)\]}]$/.test(url)
){

punctuation=
url.slice(-1)+
punctuation;

url=url.slice(0,-1);

}

const isImage=
settings.imageLinks &&
isImageUrl(url);

if(isImage){

const img=
document.createElement("img");

img.className=
"message-image";

img.src=url;

img.alt="Linked image";

img.loading="lazy";

img.onclick=()=>{
openImage(url);
};

container.appendChild(img);

}else{

const link=
document.createElement("a");

link.className=
"message-link";

link.href=url;

link.textContent=url;

link.rel=
"noopener noreferrer";

if(settings.newTabLinks){

link.target="_blank";

}

container.appendChild(link);

}

if(punctuation){

container.appendChild(
document.createTextNode(
punctuation
)
);

}

last=
match.index+
match[0].length;

}

const after=
text.slice(last);

if(after){

container.appendChild(
document.createTextNode(after)
);

}

return container;

}


function isImageUrl(url){

return /\.(jpg|jpeg|png|gif|webp|bmp|svg)(\?.*)?$/i
.test(url);

}


/* CONTEXT MENU */

function showContextMenu(
x,
y,
message
){

selectedMessage=message;

contextMenu.style.left=
Math.min(
x,
window.innerWidth-170
)+"px";

contextMenu.style.top=
Math.min(
y,
window.innerHeight-100
)+"px";

contextMenu.classList.add("show");

}


document.addEventListener(
"click",
()=>{
contextMenu.classList.remove("show");
}
);


/* EDIT */

editMessageBtn.onclick=
async event=>{

event.stopPropagation();

contextMenu.classList.remove("show");

if(!selectedMessage)
return;

const newText=
prompt(
"Edit message:",
selectedMessage.message||""
);

if(newText===null)
return;

try{

const response=
await fetch(
API_URL,
{

method:"PATCH",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

id:selectedMessage.id,

device_id:deviceId,

message:newText.trim()

})

});

const data=
await response.json();

if(!response.ok){

throw new Error(
data.error||
"Failed to edit message."
);

}

await loadMessages();

}catch(error){

alert(
"Failed to edit:\n\n"+
error.message
);

}

};


/* DELETE */

deleteMessageBtn.onclick=
event=>{

event.stopPropagation();

contextMenu.classList.remove(
"show"
);

if(!selectedMessage)
return;

if(settings.confirmDelete){

openConfirm(
"Delete message?",
"This message will be permanently removed.",
deleteSelectedMessage
);

}else{

deleteSelectedMessage();

}

};


async function deleteSelectedMessage(){

if(!selectedMessage)
return;

try{

const response=
await fetch(
API_URL,
{

method:"DELETE",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

id:selectedMessage.id,

device_id:deviceId

})

});

const data=
await response.json();

if(!response.ok){

throw new Error(
data.error||
"Failed to delete message."
);

}

selectedMessage=null;

await loadMessages();

}catch(error){

alert(
"Failed to delete:\n\n"+
error.message
);

}

}


/* IMAGE VIEWER */

function openImage(src){

fullImage.src=src;

imageViewer.classList.add(
"show"
);

}


function closeImage(){

imageViewer.classList.remove(
"show"
);

fullImage.src="";

}


backImage.onclick=closeImage;


imageViewer.onclick=event=>{

if(event.target===imageViewer){

closeImage();

}

};


document.addEventListener(
"keydown",
event=>{

if(
event.key==="Escape" &&
imageViewer.classList.contains("show")
){

closeImage();

}

});


/* CONFIRM */

function openConfirm(
title,
text,
callback
){

dialogTitle.textContent=
title;

dialogText.textContent=
text;

confirmCallback=
callback;

dialogOverlay.classList.add(
"show"
);

}


dialogCancel.onclick=()=>{

dialogOverlay.classList.remove(
"show"
);

confirmCallback=null;

};


dialogConfirm.onclick=
async()=>{

const callback=
confirmCallback;

dialogOverlay.classList.remove(
"show"
);

confirmCallback=null;

if(callback){

await callback();

}

};


/* REMOVE EVERYTHING */

removeEverything.onclick=()=>{

openConfirm(
"Remove everything?",
"This will permanently remove every message and image from the chat for EVERYONE.",
()=>{

openConfirm(
"I know",
"You understand that the entire chat history will be deleted.",
()=>{

openConfirm(
"Are you ultra sure?",
"Every stored message will be permanently removed.",
permanentlyDeleteEverything
);

});

}
);

};


async function permanentlyDeleteEverything(){

try{

const response=
await fetch(
API_URL,
{

method:"DELETE",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
delete_all:true
})

});

const data=
await response.json();

if(!response.ok){

throw new Error(
data.error||
"Failed to remove everything."
);

}

currentMessages=[];

renderMessages();

alert(
"The entire chat has been wiped."
);

}catch(error){

alert(
"Failed to wipe chat:\n\n"+
error.message
);

}

}


/* REFRESH */

function startRefreshTimer(){

if(refreshTimer){

clearInterval(refreshTimer);

}

refreshTimer=
setInterval(
loadMessages,
Number(settings.refreshRate)
);

}


/* TIME */

function formatTime(date){

if(!date)
return "";

const d=
new Date(date);

if(settings.timestampFormat==="full"){

return d.toLocaleString();

}

if(settings.timestampFormat==="seconds"){

return d.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit",
second:"2-digit"
}
);

}

return d.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
);

}


/* ESCAPE */

function escapeHtml(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

IMPORTANT:

because browsers block autoplay.
*/

document.addEventListener(
"click",
()=>{

try{

if(audioContext &&
audioContext.state==="suspended"
){

audioContext.resume();

}

}catch(e){}

},
{passive:true}
);

Register service worker if you create /sw.js.

*/

if("serviceWorker" in navigator){

()=>{

.register("/sw.js")

)
)
.catch(
error=>console.warn(

)
);

});

}
