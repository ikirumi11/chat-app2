function createNumberGuess(game){
    const area=document.createElement("div");
    area.className="numberguess-area";

    const maxNumber=game.data.settings?.maxNumber||100;
    const mine=game.players.some(p=>p.deviceId===deviceId);
    const current=game.players[game.turnIndex%game.players.length];
    const myTurn=mine&&current&&current.deviceId===deviceId;

    if(!game.data.secretNumber){
        game.data.secretNumber=Math.floor(Math.random()*maxNumber)+1;
        game.data.guesses=[];
        game.data.hint="🔢 Guess 1-"+maxNumber;
    }

    if(game.winner){
        const win=document.createElement("div");
        win.className="turn-banner";
        win.textContent="🎉 "+game.winner+" guessed it! The number was "+game.data.secretNumber;
        area.appendChild(win);
        return area;
    }

    if(!myTurn){
        const waiting=document.createElement("div");
        waiting.className="turn-banner";
        waiting.textContent="Waiting for "+current.username+"...";
        area.appendChild(waiting);
        return area;
    }

    const hint=document.createElement("div");
    hint.className="numberguess-hint";
    hint.textContent=game.data.hint||"🔢 Guess a number";
    area.appendChild(hint);

    const input=document.createElement("input");
    input.className="numberguess-input";
    input.type="number";
    input.min=1;
    input.max=maxNumber;
    input.placeholder="Guess...";
    input.autofocus=true;
    input.onkeydown=async(e)=>{
        if(e.key==="Enter"){
            const guess=parseInt(input.value);
            if(isNaN(guess)||guess<1||guess>maxNumber)return;
            const copy=JSON.parse(JSON.stringify(game));
            const secret=copy.data.secretNumber;
            if(guess===secret){copy.winner=current.username;copy.status="finished";}
            else{copy.data.hint=guess<secret?"⬆ Higher! ("+guess+")":"⬇ Lower! ("+guess+")";copy.data.guesses.push({player:current.username,guess});copy.turnIndex++;}
            input.value="";
            await publishGameAndCleanup(game,copy);
        }
    };
    area.appendChild(input);

    if(game.data.guesses&&game.data.guesses.length>0){
        const guessesDiv=document.createElement("div");
        guessesDiv.style.cssText="color:#6a7a8a;font-size:11px;margin-top:8px;";
        const lastGuesses=game.data.guesses.slice(-5);
        guessesDiv.textContent="Recent: "+lastGuesses.map(g=>g.player+"→"+g.guess).join(", ");
        area.appendChild(guessesDiv);
    }

    return area;
}


/* =====================================================
   TARGET CLICK
===================================================== */

function createTarget(game){
    const area=document.createElement("div");
    area.className="target-area";

    const mine=game.players.some(p=>p.deviceId===deviceId);
    const current=game.players[game.turnIndex%game.players.length];
    const myTurn=mine&&current&&current.deviceId===deviceId;

    const totalTargets=game.data.settings?.targets||5;
    const state=game.data.state||"waiting";
    const hits=game.data.hits||0;
    const total=game.data.total||0;
    const results=game.data.results||{};

    const box=document.createElement("div");
    box.className="target-box";

    if(state==="waiting"&&myTurn){
        box.onclick=async()=>{
            const copy=JSON.parse(JSON.stringify(game));
            copy.data.state="playing";
            copy.data.hits=0;copy.data.total=0;copy.data.startTime=Date.now();
            copy.data.targets=[];copy.data.targetIndex=0;copy.data.totalTargets=totalTargets;
            spawnTarget(copy);
            await publishGameAndCleanup(game,copy);
        };
        box.innerHTML=`<div style="display:grid;place-items:center;height:100%;color:#6a7a8a;font-size:18px;">👆 Click to start (${totalTargets} targets)</div>`;
    }else if(state==="playing"){
        const targetPos=game.data.targets||[];
        const targetIndex=game.data.targetIndex||0;
        if(targetIndex<totalTargets){
            const pos=targetPos[targetIndex]||{x:50,y:50};
            const dot=document.createElement("div");
            dot.className="target-dot";
            dot.style.left=pos.x+"%";
            dot.style.top=pos.y+"%";
            if(myTurn){
                dot.onclick=async()=>{
                    const copy=JSON.parse(JSON.stringify(game));
                    copy.data.hits=(copy.data.hits||0)+1;
                    copy.data.total=(copy.data.total||0)+1;
                    copy.data.targetIndex=(copy.data.targetIndex||0)+1;
                    if(copy.data.targetIndex>=totalTargets){
                        const time=Date.now()-copy.data.startTime;
                        copy.data.results[deviceId]={hits:copy.data.hits,total:copy.data.total,time:time,accuracy:Math.round((copy.data.hits/copy.data.total)*100)};
                        copy.data.state="done";
                        copy.turnIndex++;
                        if(copy.turnIndex>=copy.players.length){
                            let winner=null,bestScore=-1;
                            for(const [id,res] of Object.entries(copy.data.results)){
                                const score=res.hits*100+(100-res.time/10);
                                if(score>bestScore){bestScore=score;winner=copy.players.find(p=>p.deviceId===id)?.username;}
                            }
                            copy.winner=winner;copy.status="finished";
                        }else{copy.data.state="waiting";}
                    }else{spawnTarget(copy);}
                    await publishGameAndCleanup(game,copy);
                };
            }
            box.appendChild(dot);
        }
    }else if(state==="done"){
        const res=results[deviceId];
        if(res){
            box.innerHTML=`<div style="display:grid;place-items:center;height:100%;color:#7affb0;font-size:18px;">✅ Done!<br>Hits: ${res.hits}/${res.total}<br>Accuracy: ${res.accuracy}%<br>Time: ${(res.time/1000).toFixed(1)}s</div>`;
        }else{
            box.innerHTML=`<div style="display:grid;place-items:center;height:100%;color:#6a7a8a;font-size:18px;">⏳ Waiting for others...</div>`;
        }
    }

    area.appendChild(box);

    const stats=document.createElement("div");
    stats.className="target-stats";
    stats.innerHTML=`<div>Hits: <strong>${hits}</strong></div><div>Total: <strong>${total}</strong></div><div>Accuracy: <strong>${total>0?Math.round((hits/total)*100):0}%</strong></div>`;
    area.appendChild(stats);

    return area;
}

function spawnTarget(game){
    const x=10+Math.random()*80;
    const y=10+Math.random()*80;
    game.data.targets=game.data.targets||[];
    game.data.targets.push({x,y});
}


/* =====================================================
   QUICK DRAW
===================================================== */

function createQuickDraw(game){
    const area=document.createElement("div");
    area.className="quickdraw-area";

    const mine=game.players.some(p=>p.deviceId===deviceId);
    const current=game.players[game.turnIndex%game.players.length];
    const myTurn=mine&&current&&current.deviceId===deviceId;

    const state=game.data.state||"waiting";
    const round=game.data.round||0;
    const results=game.data.results||{};
    const totalRounds=game.data.settings?.rounds||3;

    const box=document.createElement("div");
    box.className="quickdraw-box "+state;

    if(state==="waiting"){
        box.textContent="⏳ Round "+(round+1)+"/"+totalRounds+"\nWaiting for "+(myTurn?"you":current.username);
        if(myTurn){
            box.onclick=async()=>{
                const copy=JSON.parse(JSON.stringify(game));
                copy.data.state="countdown";
                copy.data.startTime=Date.now()+1000+Math.random()*3000;
                copy.data.round=round;
                await publishGameAndCleanup(game,copy);
            };
        }
    }else if(state==="countdown"){
        const remaining=Math.max(0,(game.data.startTime-Date.now())/1000);
        box.textContent="⏳ "+Math.ceil(remaining);
        if(remaining<0.5&&myTurn){
            setTimeout(async()=>{
                const copy=JSON.parse(JSON.stringify(game));
                copy.data.state="draw";
                copy.data.drawTime=Date.now();
                await publishGameAndCleanup(game,copy);
            },Math.max(0,game.data.startTime-Date.now()+100));
        }
    }else if(state==="draw"){
        box.textContent="🟢 DRAW! CLICK!";
        if(myTurn){
            box.onclick=async()=>{
                const reactionTime=Date.now()-game.data.drawTime;
                const copy=JSON.parse(JSON.stringify(game));
                copy.data.results[deviceId]=reactionTime;
                copy.turnIndex++;
                copy.data.round=(round+1);
                if(copy.data.round>=totalRounds){
                    let winner=null,best=Infinity;
                    const averages={};
                    for(const player of copy.players){
                        const times=[];
                        for(const [id,time] of Object.entries(copy.data.results||{})){
                            if(id===player.deviceId) times.push(time);
                        }
                        if(times.length>0) averages[player.deviceId]=times.reduce((a,b)=>a+b,0)/times.length;
                    }
                    for(const [id,avg] of Object.entries(averages)){
                        if(avg<best){best=avg;winner=copy.players.find(p=>p.deviceId===id)?.username;}
                    }
                    copy.winner=winner+" ("+Math.round(best)+"ms avg)";
                    copy.status="finished";
                }else{copy.data.state="waiting";}
                await publishGameAndCleanup(game,copy);
            };
        }else{
            box.textContent="🟢 Waiting for "+current.username+"...";
        }
    }else if(state==="punish"){
        box.textContent="❌ Too early! Punished!";
        box.classList.add("punish");
        setTimeout(async()=>{
            const copy=JSON.parse(JSON.stringify(game));
            copy.data.state="waiting";
            copy.turnIndex++;
            await publishGameAndCleanup(game,copy);
        },1000);
    }

    area.appendChild(box);

    if(Object.keys(results).length>0){
        const resultsDiv=document.createElement("div");
        resultsDiv.style.cssText="color:#9da5b0;margin-top:8px;font-size:12px;";
        const sorted=Object.entries(results).sort((a,b)=>a[1]-b[1]);
        resultsDiv.innerHTML=sorted.map(([id,time])=>{
            const name=game.players.find(p=>p.deviceId===id)?.username||"Unknown";
            return `<span style="margin:0 6px;">${escapeHtml(name)}: ${time}ms</span>`;
        }).join("");
        area.appendChild(resultsDiv);
    }

    return area;
}

function createTypeSentence(game){
    const area=document.createElement("div");
    area.className="type-area";

    const sentences=[
        "The quick brown fox jumps over the lazy dog.",
        "Pack my box with five dozen liquor jugs.",
        "How vexingly quick daft zebras jump.",

    ];

        game.data.results={};

    }

        win.className="turn-banner";
        win.textContent="🏆 Winner: "+game.winner;

    }

        const waiting=document.createElement("div");

        area.appendChild(waiting);
        return area;
    }

        done.textContent="All players finished!";

        if(input.value===sentence){
            const time=Date.now()-game.data.startTime;

                copy.data.done=true;
                let winner=null,best=Infinity;
                for(const [id,t] of Object.entries(copy.data.results)){
                    if(t<best){best=t;winner=copy.players.find(p=>p.deviceId===id)?.username;}
                }

    area.appendChild(stats);

/* =====================================================
   GAME HELPERS
===================================================== */

async function joinGame(game){
    if(game.status!=="lobby"||game.players.some(p=>p.deviceId===deviceId)||game.players.length>=game.maxPlayers)return;
    const copy=JSON.parse(JSON.stringify(game));
    copy.players.push({deviceId,username:settings.username});
    await writeGameState(copy);
    await loadMessages();
}

async function leaveGame(game){
    const copy=JSON.parse(JSON.stringify(game));
    copy.players=copy.players.filter(p=>p.deviceId!==deviceId);
    if(copy.players.length===0){await removeGameMessages(game);await loadMessages();return;}
    if(game.hostDeviceId===deviceId){const newHost=copy.players[0];copy.host=newHost.username;copy.hostDeviceId=newHost.deviceId;}
    if(copy.status==="playing"&&copy.turnIndex>=copy.players.length)copy.turnIndex=0;
    await writeGameState(copy);
    await deleteStateMessage(game);
    await loadMessages();
}

async function startGame(game){
    if(game.hostDeviceId!==deviceId||game.players.length<(game.minPlayers||1))return;
    const copy=JSON.parse(JSON.stringify(game));
    copy.status="playing";
    copy.turnIndex=0;
    const settings=copy.data.settings||{};
    
    // Initialize game data
    const initMap={
        ttt:()=>{const s=settings.boardSize||3;copy.data.board=Array(s*s).fill("");},
        connect4:()=>{const s=settings.boardSize||"7x6";const[c,r]=s.split('x').map(Number);copy.data.board=Array(c*r).fill("");},
        memory:()=>{
            const gs=settings.gridSize||4;
            const emojis=["🍎","🍊","🍋","🍇","🍉","🍓","🍑","🍒","🥝","🍍","🥭","🍌","🍈","🫐","🍐","🥥"];
            const pairs=(gs*gs)/2;
            let cards=[...emojis.slice(0,pairs),...emojis.slice(0,pairs)];
            for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}
            copy.data.cards=cards;copy.data.flipped=[];copy.data.matched=[];copy.data.scores={};
        },
        reaction:()=>{copy.data.state="waiting";copy.data.startTime=0;copy.data.results={};copy.data.goTime=0;},
        boss:()=>{const maxH=settings.bossHealth||100000000;copy.data.bossHealth=maxH;copy.data.maxHealth=maxH;copy.data.damage=1;copy.data.upgrades={};copy.data.totalDamageDealt={};copy.data.bossDefeated=false;copy.data.critChance=0;copy.data.multiHit=1;const n=["Cthulhu","Mega Dragon","Shadow Lord","Void Beast","Demon King"];copy.data.monsterName=n[Math.floor(Math.random()*n.length)];},
        coinflip:()=>{copy.data.state="waiting";copy.data.choices={};copy.data.scores={};copy.data.coinResult=null;},
        numberguess:()=>{const max=settings.maxNumber||100;copy.data.secretNumber=Math.floor(Math.random()*max)+1;copy.data.guesses=[];copy.data.hint="🔢 Guess 1-"+max;},
        target:()=>{copy.data.state="waiting";copy.data.hits=0;copy.data.total=0;copy.data.startTime=0;copy.data.results={};copy.data.targets=[];copy.data.targetIndex=0;copy.data.totalTargets=settings.targets||5;},
        quickdraw:()=>{copy.data.state="waiting";copy.data.round=0;copy.data.results={};copy.data.startTime=0;copy.data.drawTime=0;},
        type:()=>{const s=["The quick brown fox jumps over the lazy dog.","Pack my box with five dozen liquor jugs.","How vexingly quick daft zebras jump.","The five boxing wizards jump quickly.","Jazz and swing fans like fast music."];copy.data.sentence=s[Math.floor(Math.random()*s.length)];copy.data.startTime=0;copy.data.results={};copy.data.done=false;}
    };
    if(initMap[game.gameType]) initMap[game.gameType]();
    await publishGameAndCleanup(game,copy);
}

async function forceQuitGame(game){
    if(game.hostDeviceId!==deviceId)return;
    try{await removeGameMessages(game);await loadMessages();}
    catch(error){showNotification("Could not remove game: "+error.message,"❌");}
}

async function publishGameAndCleanup(oldGame,newGame){
    if(newGame.status==="finished"){
        await removeGameMessages(oldGame);
        await loadMessages();
        return;
    }
    await writeGameState(newGame);
    if(oldGame.messageId){
        try{await apiDelete({id:oldGame.messageId,device_id:oldGame.hostDeviceId});}catch{}
    }
    await loadMessages();
}

async function removeGameMessages(game){
    const gameMessages=currentMessages.filter(msg=>{
        if(!isGameMessage(msg))return false;
        const state=parseGameMessage(msg);
        return state&&state.id===game.id;
    });
    for(const msg of gameMessages){
        try{await apiDelete({id:msg.id,device_id:game.hostDeviceId});}catch{}
    }
}

async function deleteStateMessage(game){
    if(!game.messageId)return;
    try{await apiDelete({id:game.messageId,device_id:game.hostDeviceId});}catch{}
}

    confirmOverlay.classList.remove("show");
    confirmCallback=null;
    if(callback){try{await callback();}catch(error){showNotification(error.message,"❌");}}
};


/* =====================================================
   REMOVE EVERYTHING
===================================================== */

removeEverything.onclick=()=>{
    openConfirm("Remove everything?","This permanently removes every message.",async()=>{
        try{
            await apiDelete({delete_all:true});
            currentMessages=[];
            games=[];
            renderedElements.clear();
            seenMessageIds.clear();
            seenGameIds.clear();
            renderMessages();
            showNotification("Everything cleared!","🗑️");
        }catch(error){
            showNotification("Failed to wipe: "+error.message,"❌");
        }
    });
};


/* =====================================================
   REFRESH
===================================================== */

function restartRefresh(){
    if(refreshTimer)clearInterval(refreshTimer);
    refreshTimer=setInterval(loadMessages,500);
}


/* =====================================================
   HELPERS
===================================================== */

function formatTime(date){
    if(!date)return"";
    return new Date(date).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
}

function escapeHtml(value){
    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}
