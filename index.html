<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat App</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
    background: #111214;
    color: white;
}

body {
    overflow: hidden;
}


/* =========================
   APP
========================= */

.app {
    width: 100%;
    height: 100%;
    display: flex;
}


/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 230px;
    background: #18191c;
    padding: 15px;
    flex-shrink: 0;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 25px;
}

.channel {
    padding: 11px;
    margin-bottom: 5px;
    border-radius: 6px;
    color: #aaa;
    cursor: pointer;
    user-select: none;
}

.channel:hover {
    background: #303136;
    color: white;
}

.channel.active {
    background: #404249;
    color: white;
}


/* =========================
   CHAT
========================= */

.chat {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.header {
    height: 60px;
    background: #2b2d31;
    border-bottom: 1px solid #202225;
    display: flex;
    align-items: center;
    padding: 0 20px;
    font-weight: bold;
    flex-shrink: 0;
}

.header-hash {
    color: #949ba4;
    margin-right: 8px;
}


/* =========================
   MESSAGES
========================= */

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.message {
    margin-bottom: 18px;
}

.message-top {
    display: flex;
    align-items: center;
    gap: 8px;
}

.username {
    font-weight: bold;
}

.time {
    color: #777;
    font-size: 11px;
}

.message-text {
    margin-top: 5px;
    color: #ddd;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}


/* =========================
   EMPTY
========================= */

.empty {
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #777;
    text-align: center;
}


/* =========================
   INPUT
========================= */

.input-area {
    background: #2b2d31;
    padding: 15px;
    flex-shrink: 0;
}

.input-box {
    display: flex;
    align-items: flex-end;
    background: #383a40;
    border-radius: 7px;
    padding: 5px;
}

textarea {
    flex: 1;
    min-height: 45px;
    max-height: 150px;
    resize: none;
    border: 0;
    outline: 0;
    background: transparent;
    color: white;
    padding: 12px;
    font-size: 15px;
    font-family: Arial, sans-serif;
}

textarea::placeholder {
    color: #999;
}

.send-button {
    width: 75px;
    height: 40px;
    margin: 2px;
    border: 0;
    border-radius: 5px;
    background: #5865f2;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.send-button:hover {
    background: #4752c4;
}

.send-button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}


/* =========================
   LOGIN
========================= */

.login {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 100;
}

.login-box {
    width: 380px;
    max-width: calc(100% - 30px);
    background: #313338;
    padding: 30px;
    border-radius: 8px;
}

.login-box h1 {
    margin-top: 0;
}

.login-box p {
    color: #aaa;
}

.login-input {
    width: 100%;
    height: 45px;
    background: #1e1f22;
    border: 0;
    border-radius: 5px;
    color: white;
    padding: 10px;
    outline: none;
    margin: 15px 0;
}

.login-button {
    width: 100%;
    height: 45px;
    background: #5865f2;
    border: 0;
    border-radius: 5px;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.login-button:hover {
    background: #4752c4;
}

.login-error {
    color: #ed4245;
    margin-top: 12px;
}


/* =========================
   STATUS
========================= */

.status {
    position: fixed;
    right: 10px;
    top: 10px;
    padding: 7px 10px;
    border-radius: 5px;
    background: #18191c;
    font-size: 12px;
    z-index: 50;
}

.status.connecting {
    color: #faa61a;
}

.status.connected {
    color: #57f287;
}

.status.error {
    color: #ed4245;
}


/* =========================
   ERROR WINDOW
========================= */

.error-screen {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 200;
    overflow-y: auto;
}

.error-box {
    width: 700px;
    max-width: 100%;
    background: #2b2d31;
    border: 1px solid #ed4245;
    border-radius: 8px;
    padding: 25px;
}

.error-title {
    color: #ed4245;
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 15px;
}

.error-code {
    background: #18191c;
    border-radius: 5px;
    padding: 15px;
    color: #ff7777;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-family: monospace;
    max-height: 300px;
    overflow-y: auto;
}

.error-fix {
    margin-top: 20px;
    color: #ddd;
    white-space: pre-wrap;
    line-height: 1.6;
}

.error-buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.error-button {
    padding: 10px 15px;
    border: 0;
    border-radius: 5px;
    background: #5865f2;
    color: white;
    cursor: pointer;
}

.error-button:hover {
    background: #4752c4;
}

.copy-success {
    display: none;
    margin-top: 10px;
    color: #57f287;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

    .sidebar {
        width: 150px;
    }

    .messages {
        padding: 12px;
    }

    .input-area {
        padding: 8px;
    }

}

</style>
</head>


<body>


<!-- =========================
     STATUS
========================= -->

<div
    id="status"
    class="status connecting">

    Connecting...

</div>


<!-- =========================
     APP
========================= -->

<div class="app">


    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="logo">
            MyChat
        </div>


        <div
            class="channel active"
            onclick="changeChannel('general', this)">

            # general

        </div>


        <div
            class="channel"
            onclick="changeChannel('gaming', this)">

            # gaming

        </div>


        <div
            class="channel"
            onclick="changeChannel('movies', this)">

            # movies

        </div>

    </div>


    <!-- CHAT -->

    <div class="chat">


        <!-- HEADER -->

        <div class="header">

            <span class="header-hash">
                #
            </span>

            <span id="channelName">
                general
            </span>

        </div>


        <!-- MESSAGES -->

        <div
            id="messages"
            class="messages">

            <div class="empty">
                Loading messages...
            </div>

        </div>


        <!-- INPUT -->

        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="messageInput"
                    rows="1"
                    maxlength="2000"
                    placeholder="Message #general">
                </textarea>


                <button
                    id="sendButton"
                    class="send-button"
                    onclick="sendMessage()">

                    Send

                </button>

            </div>

        </div>

    </div>

</div>


<!-- =========================
     LOGIN
========================= -->

<div
    id="login"
    class="login">

    <div class="login-box">

        <h1>
            Welcome to MyChat
        </h1>

        <p>
            Choose a username to enter.
        </p>


        <input
            id="username"
            class="login-input"
            maxlength="24"
            autocomplete="off"
            placeholder="Username">


        <button
            class="login-button"
            onclick="login()">

            Enter Chat

        </button>


        <div
            id="loginError"
            class="login-error">
        </div>

    </div>

</div>


<!-- =========================
     ERROR SCREEN
========================= -->

<div
    id="errorScreen"
    class="error-screen">

    <div class="error-box">

        <div class="error-title">
            ⚠ Connection Error
        </div>


        <div
            id="errorCode"
            class="error-code">
        </div>


        <div
            id="errorFix"
            class="error-fix">
        </div>


        <div class="error-buttons">

            <button
                class="error-button"
                onclick="testServer()">

                🔄 Test Server

            </button>


            <button
                class="error-button"
                onclick="copyError()">

                📋 Copy Error

            </button>


            <button
                class="error-button"
                onclick="closeError()">

                Close

            </button>

        </div>


        <div
            id="copySuccess"
            class="copy-success">

            Error copied.

        </div>

    </div>

</div>


<script>


/* =========================
   SETTINGS
========================= */

const API_URL =
    "/api/messages";


let username = "";

let currentChannel =
    "general";

let lastError =
    "";


/* =========================
   STATUS
========================= */

function setStatus(
    text,
    type
) {

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        text;


    status.className =
        "status " +
        type;

}


/* =========================
   LOGIN
========================= */

function login() {

    const input =
        document.getElementById(
            "username"
        );


    const error =
        document.getElementById(
            "loginError"
        );


    const name =
        input.value.trim();


    if (!name) {

        error.textContent =
            "Please enter a username.";

        return;

    }


    if (name.length < 2) {

        error.textContent =
            "Username must be at least 2 characters.";

        return;

    }


    username =
        name;


    localStorage.setItem(
        "chat_username",
        username
    );


    document.getElementById(
        "login"
    ).style.display =
        "none";


    loadMessages();

}


/* =========================
   ERROR FIX
========================= */

function getFix(
    error
) {

    const e =
        error.toLowerCase();


    if (
        e.includes("404") ||
        e.includes("not_found")
    ) {

        return `The Vercel API was not found.

Check your GitHub structure:

index.html
api/
    messages.js

messages.js MUST be inside the api folder.

Then redeploy Vercel.`;

    }


    if (
        e.includes("401") ||
        e.includes("unauthorized")
    ) {

        return `Supabase rejected the key.

Check your Supabase credentials.

IMPORTANT:
Do not put a private server key in a public GitHub repository.

Use a Vercel Environment Variable for the private key.`;

    }


    if (
        e.includes("403") ||
        e.includes("forbidden")
    ) {

        return `The request was forbidden.

Check your Supabase permissions and API key.`;

    }


    if (
        e.includes("relation") ||
        e.includes("table") ||
        e.includes("messages")
    ) {

        return `Supabase may not have the correct messages table.

Your table should be called:

messages

It needs these columns:

id
username
channel
message
created_at`;

    }


    if (
        e.includes("failed to fetch")
    ) {

        return `Your browser could not reach the API.

Your API should be:

/api/messages

Test this directly in your browser:

YOUR-VERCEL-SITE/api/messages?channel=general

You already tested this successfully if it returns:

{"success":true,"messages":[]}

If that works but this page still fails, check that this HTML is deployed to the SAME Vercel project.`;

    }


    if (
        e.includes("invalid json") ||
        e.includes("did not return json")
    ) {

        return `The server returned something that was not JSON.

Open:

/api/messages?channel=general

in your browser and check what it returns.`;

    }


    return `Unknown server error.

The exact server response is shown above.

Copy it and send it to me.

DO NOT send your Supabase private key.`;

}


/* =========================
   SHOW ERROR
========================= */

function showError(
    error
) {

    lastError =
        String(error);


    document.getElementById(
        "errorCode"
    ).textContent =
        lastError;


    document.getElementById(
        "errorFix"
    ).textContent =
        getFix(lastError);


    document.getElementById(
        "errorScreen"
    ).style.display =
        "flex";


    setStatus(
        "● Error",
        "error"
    );

}


/* =========================
   CLOSE ERROR
========================= */

function closeError() {

    document.getElementById(
        "errorScreen"
    ).style.display =
        "none";

}


/* =========================
   TEST SERVER
========================= */

async function testServer() {

    closeError();

    await loadMessages();

}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages() {

    setStatus(
        "Connecting...",
        "connecting"
    );


    try {

        const url =
            API_URL +
            "?channel=" +
            encodeURIComponent(
                currentChannel
            );


        const response =
            await fetch(
                url,
                {
                    method: "GET",

                    headers: {
                        "Accept":
                            "application/json"
                    },

                    cache: "no-store"
                }
            );


        const text =
            await response.text();


        let data;


        try {

            data =
                JSON.parse(text);

        }
        catch {

            throw new Error(
                "SERVER DID NOT RETURN JSON\n\n" +
                "HTTP STATUS: " +
                response.status +
                "\n\n" +
                "SERVER RESPONSE:\n" +
                text.substring(
                    0,
                    2000
                )
            );

        }


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status +
                "\n\n" +
                (
                    data.error ||
                    "Unknown server error"
                ) +
                "\n\n" +
                (
                    data.fix ||
                    ""
                )
            );

        }


        displayMessages(
            data.messages || []
        );


        setStatus(
            "● Connected",
            "connected"
        );


    }
    catch (error) {

        console.error(
            "CHAT ERROR:",
            error
        );


        let message =
            error.message ||
            String(error);


        if (
            message ===
            "Failed to fetch"
        ) {

            message =
                "FAILED TO FETCH\n\n" +
                "The browser could not reach:\n" +
                window.location.origin +
                API_URL +
                "\n\n" +
                "However, if opening:\n" +
                window.location.origin +
                API_URL +
                "?channel=general\n\n" +
                "returns {\"success\":true,\"messages\":[]}, " +
                "then the API itself is working.\n\n" +
                "Make sure this HTML is deployed on the same Vercel project.";

        }


        showError(
            message
        );

    }

}


/* =========================
   DISPLAY MESSAGES
========================= */

function displayMessages(
    messages
) {

    const container =
        document.getElementById(
            "messages"
        );


    container.innerHTML = "";


    if (
        !Array.isArray(messages) ||
        messages.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                No messages yet.<br>
                Send the first message!

            </div>

        `;

        return;

    }


    messages.forEach(
        message => {

            const wrapper =
                document.createElement(
                    "div"
                );


            wrapper.className =
                "message";


            const top =
                document.createElement(
                    "div"
                );


            top.className =
                "message-top";


            const name =
                document.createElement(
                    "span"
                );


            name.className =
                "username";


            name.textContent =
                message.username ||
                "Unknown";


            const time =
                document.createElement(
                    "span"
                );


            time.className =
                "time";


            if (
                message.created_at
            ) {

                const date =
                    new Date(
                        message.created_at
                    );


                time.textContent =
                    date.toLocaleString();

            }


            const text =
                document.createElement(
                    "div"
                );


            text.className =
                "message-text";


            text.textContent =
                message.message ||
                "";


            top.appendChild(
                name
            );


            top.appendChild(
                time
            );


            wrapper.appendChild(
                top
            );


            wrapper.appendChild(
                text
            );


            container.appendChild(
                wrapper
            );

        }
    );


    container.scrollTop =
        container.scrollHeight;

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );


    const button =
        document.getElementById(
            "sendButton"
        );


    const message =
        input.value.trim();


    if (!username) {

        alert(
            "Please choose a username first."
        );

        return;

    }


    if (!message) {

        return;

    }


    button.disabled =
        true;


    try {

        setStatus(
            "Sending...",
            "connecting"
        );


        const response =
            await fetch(
                API_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            username:
                                username,

                            channel:
                                currentChannel,

                            message:
                                message

                        })

                }
            );


        const text =
            await response.text();


        let data;


        try {

            data =
                JSON.parse(text);

        }
        catch {

            throw new Error(
                "SERVER DID NOT RETURN JSON\n\n" +
                "HTTP STATUS: " +
                response.status +
                "\n\n" +
                "SERVER RESPONSE:\n" +
                text.substring(
                    0,
                    2000
                )
            );

        }


        if (!response.ok) {

            throw new Error(

                "HTTP " +
                response.status +
                "\n\n" +

                (
                    data.error ||
                    "Message could not be sent."
                ) +

                "\n\n" +

                (
                    data.fix ||
                    ""
                )

            );

        }


        input.value =
            "";


        await loadMessages();


    }
    catch (error) {

        console.error(
            "SEND ERROR:",
            error
        );


        let message =
            error.message ||
            String(error);


        if (
            message ===
            "Failed to fetch"
        ) {

            message =
                "FAILED TO FETCH\n\n" +
                "The browser could not reach " +
                API_URL +
                "\n\n" +
                "Test this URL directly:\n" +
                window.location.origin +
                API_URL +
                "?channel=general";

        }


        showError(
            message
        );

    }


    button.disabled =
        false;

}


/* =========================
   CHANNELS
========================= */

function changeChannel(
    channel,
    element
) {

    currentChannel =
        channel;


    document
        .querySelectorAll(
            ".channel"
        )
        .forEach(
            item => {

                item.classList.remove(
                    "active"
                );

            }
        );


    element.classList.add(
        "active"
    );


    document.getElementById(
        "channelName"
    ).textContent =
        channel;


    document.getElementById(
        "messageInput"
    ).placeholder =
        "Message #" +
        channel;


    loadMessages();

}


/* =========================
   COPY ERROR
========================= */

async function copyError() {

    try {

        await navigator.clipboard.writeText(
            lastError
        );


        const success =
            document.getElementById(
                "copySuccess"
            );


        success.style.display =
            "block";


        setTimeout(
            () => {

                success.style.display =
                    "none";

            },
            2000
        );

    }
    catch {

        alert(
            lastError
        );

    }

}


/* =========================
   ENTER TO SEND
========================= */

document
    .getElementById(
        "messageInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


/* =========================
   LOAD SAVED USER
========================= */

const savedUsername =
    localStorage.getItem(
        "chat_username"
    );


if (savedUsername) {

    username =
        savedUsername;


    document.getElementById(
        "login"
    ).style.display =
        "none";

}


/* =========================
   START
========================= */

loadMessages();


/* =========================
   AUTO REFRESH
========================= */

setInterval(
    function() {

        if (username) {

            loadMessages();

        }

    },
    5000
);

</script>

</body>
</html>
