<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat</title>

<style>
*{box-sizing:border-box}

:root{
    --bg:#0b0d10;
    --panel:#111419;
    --panel2:#181c22;
    --border:#292e36;
    --text:#eef1f5;
    --muted:#7c8591;
    --hover:#242a32;
    --button:#e8eaed;
    --buttonText:#111;
    --danger:#7a3030;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

body{
    overflow:hidden;
}

button,input,textarea,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:64px;
    min-height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
}

.logo-icon{
    width:35px;
    height:35px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:var(--panel2);
    border:1px solid var(--border);
}

.channel{
    color:var(--muted);
    font-weight:400;
    font-size:14px;
}

.header-buttons{
    display:flex;
    gap:8px;
}

.icon-btn{
    width:38px;
    height:38px;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--panel2);
    color:var(--text);
}

.icon-btn:hover{
    background:var(--hover);
}

/* MESSAGES */

.messages{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    padding:20px;
}

.message{
    display:flex;
    gap:11px;
    margin-bottom:18px;
    position:relative;
}

.avatar{
    flex:0 0 40px;
    width:40px;
    height:40px;
    border-radius:10px;
    display:grid;
    place-items:center;
    background:var(--panel2);
    border:1px solid var(--border);
    font-weight:700;
}

.message-content{
    min-width:0;
    max-width:min(850px,calc(100vw - 90px));
}

.message-top{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:3px;
}

.username{
    font-weight:700;
}

.time{
    color:var(--muted);
    font-size:11px;
}

.edited{
    color:var(--muted);
    font-size:10px;
}

.message-text{
    white-space:pre-wrap;
    word-break:break-word;
    line-height:1.45;
    color:#d9dde3;
}

.message-image{
    display:block;
    max-width:min(500px,80vw);
    max-height:500px;
    margin-top:8px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#000;
    object-fit:contain;
    cursor:pointer;
}

/* COMPOSER */

.composer{
    padding:12px 16px 16px;
    background:var(--panel);
    border-top:1px solid var(--border);
}

.composer-box{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:8px;
    padding:8px;
    border:1px solid var(--border);
    border-radius:13px;
    background:var(--panel2);
}

textarea{
    flex:1;
    min-height:42px;
    max-height:150px;
    resize:none;
    outline:none;
    border:0;
    background:transparent;
    color:white;
    padding:10px;
}

textarea::placeholder{
    color:var(--muted);
}

.attach-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:9px;
    background:transparent;
    color:#adb5c0;
    font-size:20px;
}

.attach-btn:hover{
    background:var(--hover);
}

.send-btn{
    height:42px;
    padding:0 18px;
    border:0;
    border-radius:9px;
    background:var(--button);
    color:var(--buttonText);
    font-weight:700;
}

.send-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* OVERLAY */

.overlay{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.7);
}

.overlay.show{
    display:flex;
}

.panel{
    width:min(480px,calc(100vw - 30px));
    max-height:calc(100vh - 30px);
    overflow:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
    box-shadow:0 25px 80px rgba(0,0,0,.6);
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px;
    border-bottom:1px solid var(--border);
}

.panel-header h2{
    margin:0;
    font-size:18px;
}

.panel-body{
    padding:18px;
}

.setting{
    margin-bottom:20px;
}

.setting label{
    display:block;
    margin-bottom:7px;
    color:#aab2bd;
    font-size:13px;
}

.setting input,
.setting select{
    width:100%;
    padding:11px;
    border-radius:9px;
    border:1px solid var(--border);
    outline:none;
    background:var(--panel2);
    color:var(--text);
}

.save-btn{
    width:100%;
    padding:11px;
    border:0;
    border-radius:9px;
    background:var(--button);
    color:var(--buttonText);
    font-weight:700;
}

/* DANGER */

.danger-zone{
    margin-top:25px;
    padding-top:20px;
    border-top:1px solid #422626;
}

.danger-title{
    color:#ff7777;
    font-weight:700;
}

.danger-zone p{
    color:#9da5af;
    line-height:1.45;
}

.danger-btn{
    width:100%;
    padding:11px;
    border-radius:9px;
    border:1px solid #743333;
    background:#241719;
    color:#ff8585;
}

.danger-btn:hover{
    background:#321c1e;
}

/* CONTEXT MENU */

.context-menu{
    position:fixed;
    z-index:200;
    display:none;
    width:160px;
    padding:5px;
    border:1px solid #343a43;
    border-radius:9px;
    background:#171b21;
    box-shadow:0 15px 40px rgba(0,0,0,.6);
}

.context-menu.show{
    display:block;
}

.context-menu button{
    width:100%;
    text-align:left;
    padding:9px 10px;
    border:0;
    border-radius:6px;
    background:transparent;
    color:#eee;
}

.context-menu button:hover{
    background:#252b33;
}

.context-menu .delete-option{
    color:#ff7777;
}

/* IMAGE VIEWER */

.image-viewer{
    position:fixed;
    inset:0;
    z-index:300;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.97);
}

.image-viewer.show{
    display:flex;
}

.full-image{
    max-width:95vw;
    max-height:90vh;
    object-fit:contain;
}

.back-image{
    position:absolute;
    top:18px;
    left:18px;
    padding:10px 16px;
    border-radius:9px;
    border:1px solid #3a4049;
    background:#171b21;
    color:white;
}

/* DIALOG */

.dialog{
    width:min(450px,calc(100vw - 30px));
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
}

.dialog h2{
    margin-top:0;
}

.dialog p{
    color:#aab2bd;
    line-height:1.5;
}

.dialog-buttons{
    display:flex;
    gap:8px;
    justify-content:flex-end;
    margin-top:18px;
}

.dialog-buttons button{
    padding:10px 16px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#20252c;
    color:white;
}

.dialog-buttons .danger{
    background:#6b2929;
    border-color:#813434;
}

/* EMPTY */

.empty{
    height:100%;
    display:grid;
    place-items:center;
    color:#656d78;
    text-align:center;
}

.empty strong{
    display:block;
    color:#aab2bd;
    margin-bottom:5px;
}

/* MOBILE */

@media(max-width:600px){

    .header{
        padding:0 11px;
    }

    .messages{
        padding:15px 11px;
    }

    .message-content{
        max-width:calc(100vw - 70px);
    }

    .channel{
        display:none;
    }

    .logo{
        font-size:16px;
    }

    .message-image{
        max-width:80vw;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="logo">

        <div class="logo-icon">
            💬
        </div>

        <span>Chat</span>

        <span class="channel">
            # general
        </span>

    </div>

    <div class="header-buttons">

        <button
            class="icon-btn"
            id="settingsBtn"
            title="Settings"
        >⚙</button>

    </div>

</header>


<main
    class="messages"
    id="messages"
></main>


<div class="composer">

    <div class="composer-box">

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
        >

        <button
            class="attach-btn"
            id="attachBtn"
            title="Choose image"
        >＋</button>

        <textarea
            id="messageInput"
            rows="1"
            placeholder="Message #general"
        ></textarea>

        <button
            class="send-btn"
            id="sendBtn"
        >Send</button>

    </div>

</div>

</div>


<!-- SETTINGS -->

<div
    class="overlay"
    id="settingsOverlay"
>

<div class="panel">

<div class="panel-header">

    <h2>Settings</h2>

    <button
        class="icon-btn"
        id="closeSettings"
    >×</button>

</div>

<div class="panel-body">

<div class="setting">

<label>Your name</label>

<input
    id="usernameInput"
    maxlength="24"
    placeholder="Enter your name"
>

</div>


<div class="setting">

<label>Theme</label>

<select id="themeSelect">

<option value="dark">Dark</option>
<option value="midnight">Midnight</option>
<option value="slate">Slate</option>
<option value="black">Pure Black</option>
<option value="blue">Dark Blue</option>
<option value="purple">Dark Purple</option>
<option value="green">Dark Green</option>
<option value="red">Dark Red</option>
<option value="gray">Classic Gray</option>
<option value="light">Light</option>
<option value="oled">OLED</option>

</select>

</div>


<div class="setting">

<label>Message refresh rate</label>

<select id="refreshSelect">

<option value="10000">10 seconds</option>
<option value="5000">5 seconds</option>
<option value="3000">3 seconds</option>
<option value="2000">2 seconds</option>
<option value="1000">1 second</option>
<option value="500">0.5 seconds</option>
<option value="100">0.1 seconds</option>

</select>

</div>


<button
    class="save-btn"
    id="saveSettings"
>
Save settings
</button>


<div class="danger-zone">

<div class="danger-title">
Danger zone
</div>

<p>
Remove every message from the entire chat for
everyone. This is not limited to your device.
</p>

<button
    class="danger-btn"
    id="removeEverything"
>
Remove everything
</button>

</div>

</div>
</div>
</div>


<!-- CONTEXT MENU -->

<div
    class="context-menu"
    id="contextMenu"
>

<button id="editMessage">
Edit
</button>

<button
    class="delete-option"
    id="deleteMessage"
>
Delete
</button>

</div>


<!-- IMAGE VIEWER -->

<div
    class="image-viewer"
    id="imageViewer"
>

<button
    class="back-image"
    id="backImage"
>
← Back
</button>

<img
    class="full-image"
    id="fullImage"
    alt="Full image"
>

</div>


<!-- CONFIRM DIALOG -->

<div
    class="overlay"
    id="dialogOverlay"
>

<div class="dialog">

<h2 id="dialogTitle">
Confirm
</h2>

<p id="dialogText"></p>

<div class="dialog-buttons">

<button id="dialogCancel">
Cancel
</button>

<button
    class="danger"
    id="dialogConfirm"
>
Yes
</button>

</div>

</div>

</div>


<script>

const API_URL="/api/messages";
const CHANNEL="general";


/* DEVICE ID */

let deviceId=
localStorage.getItem("chat_device_id");

if(!deviceId){

    deviceId=
        crypto.randomUUID();

    localStorage.setItem(
        "chat_device_id",
        deviceId
    );
}


/* SETTINGS */

let username=
localStorage.getItem("chat_username") || "";

let theme=
localStorage.getItem("chat_theme") || "dark";

let refreshRate=
Number(
    localStorage.getItem(
        "chat_refresh_rate"
    )
) || 500;


/* ELEMENTS */

const messagesEl=
document.getElementById("messages");

const messageInput=
document.getElementById("messageInput");

const sendBtn=
document.getElementById("sendBtn");

const imageInput=
document.getElementById("imageInput");

const attachBtn=
document.getElementById("attachBtn");

const settingsBtn=
document.getElementById("settingsBtn");

const settingsOverlay=
document.getElementById("settingsOverlay");

const closeSettings=
document.getElementById("closeSettings");

const usernameInput=
document.getElementById("usernameInput");

const themeSelect=
document.getElementById("themeSelect");

const refreshSelect=
document.getElementById("refreshSelect");

const saveSettings=
document.getElementById("saveSettings");

const removeEverything=
document.getElementById("removeEverything");

const contextMenu=
document.getElementById("contextMenu");

const editMessageBtn=
document.getElementById("editMessage");

const deleteMessageBtn=
document.getElementById("deleteMessage");

const imageViewer=
document.getElementById("imageViewer");

const fullImage=
document.getElementById("fullImage");

const backImage=
document.getElementById("backImage");

const dialogOverlay=
document.getElementById("dialogOverlay");

const dialogTitle=
document.getElementById("dialogTitle");

const dialogText=
document.getElementById("dialogText");

const dialogCancel=
document.getElementById("dialogCancel");

const dialogConfirm=
document.getElementById("dialogConfirm");


let selectedMessage=null;
let selectedFile=null;
let currentMessages=[];
let refreshTimer=null;
let confirmCallback=null;


/* THEMES */

function applyTheme(name){

    const themes={

        dark:["#0b0d10","#111419"],
        midnight:["#080b14","#101522"],
        slate:["#101418","#171d22"],
        black:["#000","#090909"],
        blue:["#091018","#101c29"],
        purple:["#100b17","#191021"],
        green:["#09120d","#101b15"],
        red:["#140b0b","#1e1111"],
        gray:["#151515","#202020"],
        light:["#eeeeee","#fff"],
        oled:["#000","#000"]

    };

    const t=
        themes[name] ||
        themes.dark;

    document.documentElement
        .style.setProperty(
            "--bg",
            t[0]
        );

    document.documentElement
        .style.setProperty(
            "--panel",
            t[1]
        );

    document.body.style.background=
        t[0];
}


/* START SETTINGS */

applyTheme(theme);

themeSelect.value=theme;
refreshSelect.value=
    String(refreshRate);

usernameInput.value=username;


/* SETTINGS OPEN */

settingsBtn.onclick=()=>{

    usernameInput.value=username;
    themeSelect.value=theme;
    refreshSelect.value=
        String(refreshRate);

    settingsOverlay.classList.add("show");

};


closeSettings.onclick=()=>{

    settingsOverlay.classList.remove("show");

};


saveSettings.onclick=()=>{

    const newName=
        usernameInput.value
            .trim()
            .substring(0,24);

    username=
        newName || "User";

    theme=
        themeSelect.value;

    refreshRate=
        Number(
            refreshSelect.value
        );

    localStorage.setItem(
        "chat_username",
        username
    );

    localStorage.setItem(
        "chat_theme",
        theme
    );

    localStorage.setItem(
        "chat_refresh_rate",
        refreshRate
    );

    applyTheme(theme);

    settingsOverlay.classList.remove("show");

    startRefreshTimer();

};


/* TEXTAREA */

messageInput.addEventListener(
    "input",
    ()=>{

        messageInput.style.height="auto";

        messageInput.style.height=
            Math.min(
                messageInput.scrollHeight,
                150
            )+"px";

    }
);


/* IMAGE */

attachBtn.onclick=()=>{
    imageInput.click();
};

imageInput.onchange=()=>{

    selectedFile=
        imageInput.files[0] || null;

    attachBtn.textContent=
        selectedFile ? "✓" : "＋";

};


/* RESIZE IMAGE */

function resizeImage(file){

    return new Promise(
        (resolve,reject)=>{

            const reader=
                new FileReader();

            reader.onload=()=>{

                const img=
                    new Image();

                img.onload=()=>{

                    let w=img.width;
                    let h=img.height;

                    const max=1500;

                    if(w>max || h>max){

                        const scale=
                            Math.min(
                                max/w,
                                max/h
                            );

                        w=Math.round(w*scale);
                        h=Math.round(h*scale);

                    }

                    const canvas=
                        document.createElement(
                            "canvas"
                        );

                    canvas.width=w;
                    canvas.height=h;

                    const ctx=
                        canvas.getContext(
                            "2d"
                        );

                    ctx.drawImage(
                        img,
                        0,
                        0,
                        w,
                        h
                    );

                    resolve(
                        canvas.toDataURL(
                            "image/jpeg",
                            .78
                        )
                    );

                };

                img.onerror=reject;
                img.src=reader.result;

            };

            reader.onerror=reject;

            reader.readAsDataURL(file);

        }
    );

}


/* SEND */

sendBtn.onclick=sendMessage;

messageInput.addEventListener(
    "keydown",
    e=>{

        if(
            e.key==="Enter" &&
            !e.shiftKey
        ){

            e.preventDefault();
            sendMessage();

        }

    }
);


async function sendMessage(){

    if(!username){

        settingsOverlay.classList.add("show");
        usernameInput.focus();
        return;

    }

    const text=
        messageInput.value.trim();

    if(!text && !selectedFile){
        return;
    }

    sendBtn.disabled=true;

    try{

        let image=null;

        if(selectedFile){

            image=
                await resizeImage(
                    selectedFile
                );

        }

        const response=
            await fetch(
                API_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        username,
                        channel:CHANNEL,
                        message:text,
                        image,
                        device_id:deviceId

                    })
                }
            );

        const data=
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Failed to send."
            );

        }

        messageInput.value="";
        messageInput.style.height="auto";

        selectedFile=null;
        imageInput.value="";
        attachBtn.textContent="＋";

        await loadMessages();

    }catch(error){

        alert(
            "Failed to send:\n\n"+
            error.message
        );

    }finally{

        sendBtn.disabled=false;

    }

}


/* LOAD */

async function loadMessages(){

    try{

        const response=
            await fetch(
                API_URL+
                "?channel="+
                encodeURIComponent(
                    CHANNEL
                ),
                {
                    cache:"no-store"
                }
            );

        const data=
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Failed to load messages."
            );

        }

        currentMessages=
            Array.isArray(
                data.messages
            )
            ? data.messages
            : [];

        renderMessages();

    }catch(error){

        messagesEl.innerHTML=
        `<div class="empty">
            <div>
                <strong>Unable to load messages</strong>
                ${escapeHtml(error.message)}
            </div>
        </div>`;

    }

}


/* RENDER */

function renderMessages(){

    const wasBottom=
        messagesEl.scrollHeight -
        messagesEl.scrollTop -
        messagesEl.clientHeight < 100;

    if(!currentMessages.length){

        messagesEl.innerHTML=
        `<div class="empty">
            <div>
                <strong>No messages yet</strong>
                Be the first to send something.
            </div>
        </div>`;

        return;
    }

    const fragment=
        document.createDocumentFragment();

    currentMessages.forEach(message=>{

        const item=
            document.createElement("div");

        item.className="message";

        item.dataset.id=
            message.id;

        item.dataset.deviceId=
            message.device_id || "";


        const avatar=
            document.createElement("div");

        avatar.className="avatar";

        avatar.textContent=
            (
                message.username ||
                "?"
            )
            .charAt(0)
            .toUpperCase();


        const content=
            document.createElement("div");

        content.className=
            "message-content";


        const top=
            document.createElement("div");

        top.className="message-top";


        const name=
            document.createElement("span");

        name.className="username";

        name.textContent=
            message.username ||
            "User";


        const time=
            document.createElement("span");

        time.className="time";

        time.textContent=
            formatTime(
                message.created_at
            );


        top.appendChild(name);
        top.appendChild(time);


        if(message.edited){

            const edited=
                document.createElement("span");

            edited.className="edited";

            edited.textContent=
                "(edited)";

            top.appendChild(edited);

        }


        content.appendChild(top);


        if(message.message){

            const text=
                document.createElement("div");

            text.className=
                "message-text";

            text.textContent=
                message.message;

            content.appendChild(text);

        }


        if(message.image){

            const img=
                document.createElement("img");

            img.className=
                "message-image";

            img.src=
                message.image;

            img.alt="Image";

            img.onclick=()=>{
                openImage(
                    message.image
                );
            };

            content.appendChild(img);

        }


        item.appendChild(avatar);
        item.appendChild(content);


        /* ONLY YOUR DEVICE */

        item.addEventListener(
            "contextmenu",
            event=>{

                event.preventDefault();

                if(
                    message.device_id ===
                    deviceId
                ){

                    showContextMenu(
                        event.clientX,
                        event.clientY,
                        message
                    );

                }

            }
        );


        fragment.appendChild(item);

    });


    messagesEl.replaceChildren(
        fragment
    );


    if(wasBottom){

        messagesEl.scrollTop=
            messagesEl.scrollHeight;

    }

}


/* CONTEXT MENU */

function showContextMenu(x,y,message){

    selectedMessage=message;

    contextMenu.style.left=
        Math.min(
            x,
            window.innerWidth-170
        )+"px";

    contextMenu.style.top=
        Math.min(
            y,
            window.innerHeight-100
        )+"px";

    contextMenu.classList.add("show");

}


document.addEventListener(
    "click",
    ()=>{
        contextMenu.classList.remove("show");
    }
);


/* EDIT */

editMessageBtn.onclick=
async e=>{

    e.stopPropagation();

    contextMenu.classList.remove("show");

    if(!selectedMessage)return;

    /* DEVICE CHECK AGAIN */

    if(
        selectedMessage.device_id !==
        deviceId
    ){

        alert(
            "You can only edit your own messages."
        );

        return;

    }

    const newText=
        prompt(
            "Edit message:",
            selectedMessage.message || ""
        );

    if(newText===null)return;

    try{

        const response=
            await fetch(
                API_URL,
                {
                    method:"PATCH",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        id:
                            selectedMessage.id,

                        device_id:
                            deviceId,

                        message:
                            newText.trim()

                    })
                }
            );

        const data=
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Failed to edit."
            );

        }

        await loadMessages();

    }catch(error){

        alert(
            "Failed to edit:\n\n"+
            error.message
        );

    }

};


/* DELETE */

deleteMessageBtn.onclick=
e=>{

    e.stopPropagation();

    contextMenu.classList.remove("show");

    if(!selectedMessage)return;

    if(
        selectedMessage.device_id !==
        deviceId
    ){

        alert(
            "You can only delete your own messages."
        );

        return;

    }

    openConfirm(
        "Delete message?",
        "This message will be permanently removed.",
        deleteSelectedMessage
    );

};


async function deleteSelectedMessage(){

    if(!selectedMessage)return;

    try{

        const response=
            await fetch(
                API_URL,
                {
                    method:"DELETE",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        id:
                            selectedMessage.id,

                        device_id:
                            deviceId

                    })
                }
            );

        const data=
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Failed to delete."
            );

        }

        selectedMessage=null;

        await loadMessages();

    }catch(error){

        alert(
            "Failed to delete:\n\n"+
            error.message
        );

    }

}


/* IMAGE */

function openImage(src){

    fullImage.src=src;

    imageViewer.classList.add("show");

}

function closeImage(){

    imageViewer.classList.remove("show");

    fullImage.src="";

}

backImage.onclick=closeImage;

imageViewer.onclick=e=>{

    if(e.target===imageViewer){
        closeImage();
    }

};


/* CONFIRM */

function openConfirm(
    title,
    text,
    callback
){

    dialogTitle.textContent=title;
    dialogText.textContent=text;

    confirmCallback=callback;

    dialogOverlay.classList.add("show");

}


dialogCancel.onclick=()=>{

    dialogOverlay.classList.remove("show");

    confirmCallback=null;

};


dialogConfirm.onclick=async()=>{

    const callback=
        confirmCallback;

    dialogOverlay.classList.remove("show");

    confirmCallback=null;

    if(callback){
        await callback();
    }

};


/* GLOBAL REMOVE EVERYTHING */

removeEverything.onclick=()=>{

    openConfirm(
        "Remove everything?",
        "This will permanently remove EVERY message from the entire chat for EVERYONE.",
        ()=>{
            openConfirm(
                "I know",
                "Every stored message will be permanently deleted. This affects every user.",
                ()=>{
                    openConfirm(
                        "Are you sure?",
                        "There will be no messages left in the database.",
                        ()=>{
                            openConfirm(
                                "Last time",
                                "Are you ultra sure every memory is being removed and has no evidence of existing?",
                                permanentlyDeleteEverything
                            );
                        }
                    );
                }
            );
        }
    );

};


/* IMPORTANT:
   NO DEVICE ID IS SENT HERE.
   This is intentionally GLOBAL.
*/

async function permanentlyDeleteEverything(){

    try{

        const response=
            await fetch(
                API_URL,
                {
                    method:"DELETE",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        delete_all:true
                    })
                }
            );

        const data=
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Failed to remove everything."
            );

        }

        currentMessages=[];

        renderMessages();

        settingsOverlay.classList.remove("show");

        alert(
            "Every message has been removed for everyone."
        );

    }catch(error){

        alert(
            "Failed to remove everything:\n\n"+
            error.message
        );

    }

}


/* REFRESH */

function startRefreshTimer(){

    if(refreshTimer){
        clearInterval(refreshTimer);
    }

    refreshTimer=
        setInterval(
            loadMessages,
            refreshRate
        );

}


/* HELPERS */

function formatTime(date){

    if(!date)return "";

    return new Date(date)
        .toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

}


function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* START */

loadMessages();

startRefreshTimer();

</script>
