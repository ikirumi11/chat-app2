<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyChat</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    font-family:Arial,sans-serif;
    background:#111214;
    color:#fff;
}

body{overflow:hidden}

.app{
    display:flex;
    height:100vh;
}

.sidebar{
    width:230px;
    background:#18191c;
    padding:15px;
}

.logo{
    font-size:22px;
    font-weight:bold;
    margin-bottom:25px;
}

.channel{
    padding:11px;
    margin-bottom:5px;
    border-radius:5px;
    color:#aaa;
    cursor:pointer;
}

.channel:hover,
.channel.active{
    background:#404249;
    color:#fff;
}

.chat{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

.header{
    height:60px;
    background:#2b2d31;
    border-bottom:1px solid #202225;
    display:flex;
    align-items:center;
    padding:0 20px;
    font-weight:bold;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    margin-bottom:18px;
}

.name{
    font-weight:bold;
}

.time{
    color:#777;
    font-size:11px;
    margin-left:8px;
}

.text{
    margin-top:4px;
    color:#ddd;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.input-area{
    padding:15px;
    background:#2b2d31;
}

.input-box{
    display:flex;
    background:#383a40;
    border-radius:7px;
    padding:5px;
}

textarea{
    flex:1;
    resize:none;
    border:0;
    outline:0;
    background:transparent;
    color:#fff;
    padding:12px;
    font-size:15px;
}

.send{
    width:75px;
    border:0;
    border-radius:5px;
    background:#5865f2;
    color:#fff;
    cursor:pointer;
}

.send:hover{
    background:#4752c4;
}

.send:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.login{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.92);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:10;
}

.login-box{
    width:370px;
    max-width:calc(100% - 30px);
    background:#313338;
    padding:30px;
    border-radius:8px;
}

.login-box h1{
    margin-top:0;
}

.login-box input{
    width:100%;
    height:45px;
    background:#1e1f22;
    border:0;
    border-radius:5px;
    color:#fff;
    padding:10px;
    margin:15px 0;
}

.login-box button{
    width:100%;
    height:45px;
    background:#5865f2;
    border:0;
    border-radius:5px;
    color:#fff;
    cursor:pointer;
}

.status{
    position:fixed;
    right:10px;
    top:10px;
    padding:7px 10px;
    background:#18191c;
    border-radius:5px;
    font-size:12px;
    z-index:20;
}

.status.ok{
    color:#57f287;
}

.status.bad{
    color:#ed4245;
}

.error-screen{
    position:fixed;
    inset:0;
    background:#111214;
    display:none;
    justify-content:center;
    align-items:center;
    padding:20px;
    z-index:100;
    overflow:auto;
}

.error-box{
    width:700px;
    max-width:100%;
    background:#2b2d31;
    border:1px solid #ed4245;
    border-radius:8px;
    padding:25px;
}

.error-title{
    color:#ed4245;
    font-size:22px;
    font-weight:bold;
    margin-bottom:15px;
}

.error-code{
    background:#18191c;
    border-radius:5px;
    padding:15px;
    color:#ff7777;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    font-family:monospace;
    max-height:250px;
    overflow:auto;
}

.error-fix{
    margin-top:20px;
    color:#ddd;
    white-space:pre-wrap;
    line-height:1.6;
}

.error-buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.error-buttons button{
    padding:10px 15px;
    border:0;
    border-radius:5px;
    background:#5865f2;
    color:#fff;
    cursor:pointer;
}

.copy-success{
    color:#57f287;
    margin-top:10px;
    display:none;
}

@media(max-width:700px){
    .sidebar{
        width:170px;
    }

    .messages{
        padding:12px;
    }

    .input-area{
        padding:10px;
    }
}
</style>
</head>

<body>

<div id="status" class="status">
Connecting...
</div>

<div class="app">

    <div class="sidebar">

        <div class="logo">
            MyChat
        </div>

        <div
            class="channel active"
            onclick="changeChannel('general',this)">
            # general
        </div>

        <div
            class="channel"
            onclick="changeChannel('gaming',this)">
            # gaming
        </div>

        <div
            class="channel"
            onclick="changeChannel('movies',this)">
            # movies
        </div>

    </div>

    <div class="chat">

        <div class="header">
            # <span id="channelName">general</span>
        </div>

        <div
            id="messages"
            class="messages">
        </div>

        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="messageInput"
                    rows="1"
                    maxlength="2000"
                    placeholder="Message #general">
                </textarea>

                <button
                    id="sendButton"
                    class="send"
                    onclick="sendMessage()">
                    Send
                </button>

            </div>

        </div>

    </div>

</div>


<div id="login" class="login">

    <div class="login-box">

        <h1>Welcome to MyChat</h1>

        <p>Choose a username</p>

        <input
            id="username"
            maxlength="24"
            placeholder="Username">

        <button onclick="login()">
            Enter Chat
        </button>

        <div
            id="loginError"
            style="color:#ed4245;margin-top:12px">
        </div>

    </div>

</div>


<div id="errorScreen" class="error-screen">

    <div class="error-box">

        <div class="error-title">
            ⚠ CHAT SERVER ERROR
        </div>

        <div
            id="errorCode"
            class="error-code">
        </div>

        <div
            id="errorFix"
            class="error-fix">
        </div>

        <div class="error-buttons">

            <button onclick="testServer()">
                🔄 Test Again
            </button>

            <button onclick="copyError()">
                📋 Copy Error
            </button>

        </div>

        <div
            id="copySuccess"
            class="copy-success">
            Error copied!
        </div>

    </div>

</div>


<script>

const API="/api/messages";

let username="";
let currentChannel="general";

let lastFullError="";


function setStatus(text,good){

    const status=
        document.getElementById("status");

    status.textContent=text;

    status.className=
        "status "+
        (good ? "ok" : "bad");
}


function login(){

    const input=
        document.getElementById("username");

    const error=
        document.getElementById("loginError");

    const name=
        input.value.trim();

    if(!name){

        error.textContent=
            "Enter a username.";

        return;
    }

    if(name.length<2){

        error.textContent=
            "Username must be at least 2 characters.";

        return;
    }

    username=name;

    localStorage.setItem(
        "chat_username",
        username
    );

    document.getElementById(
        "login"
    ).style.display="none";

    loadMessages();
}


function getFix(error){

    const e=
        error.toLowerCase();


    if(e.includes("supabase_url")){

        return `WHAT IT MEANS:

Vercel cannot find your SUPABASE_URL.

HOW TO FIX:

1. Open Vercel.
2. Open your chat project.
3. Go to Settings.
4. Go to Environment Variables.
5. Add:

SUPABASE_URL

6. Put your Supabase Project URL as the value.
7. Save it.
8. Redeploy your Vercel project.`;
    }


    if(
        e.includes("service_role") ||
        e.includes("supabase_service_role_key")
    ){

        return `WHAT IT MEANS:

Vercel cannot find your Supabase secret key.

HOW TO FIX:

1. Open Vercel.
2. Open your chat project.
3. Settings.
4. Environment Variables.
5. Add:

SUPABASE_SERVICE_ROLE_KEY

6. Put your Supabase service_role key as the value.
7. Save it.
8. Redeploy Vercel.

DO NOT put this key inside index.html.`;
    }


    if(
        e.includes("messages") &&
        (
            e.includes("relation") ||
            e.includes("table")
        )
    ){

        return `WHAT IT MEANS:

Supabase cannot find the messages table.

HOW TO FIX:

Open Supabase → Table Editor.

You need a table called:

messages

It should contain:

id
username
channel
message
created_at`;
    }


    if(e.includes("404")){

        return `WHAT IT MEANS:

Vercel cannot find the API.

HOW TO FIX:

Your GitHub structure must be exactly:

index.html
api/
    messages.js

Make sure messages.js is INSIDE the api folder.

Then commit the files and redeploy Vercel.`;
    }


    if(e.includes("401")){

        return `WHAT IT MEANS:

Supabase rejected the API key.

HOW TO FIX:

Go to Supabase → Project Settings → API.

Copy the service_role key again.

Then go to Vercel → Settings → Environment Variables.

Replace:

SUPABASE_SERVICE_ROLE_KEY

Then redeploy Vercel.`;
    }


    if(e.includes("403")){

        return `WHAT IT MEANS:

The request was forbidden.

HOW TO FIX:

Check your Supabase API key.

Make sure you are using the service_role key in Vercel.

Do NOT put it in index.html.`;
    }


    if(e.includes("500")){

        return `WHAT IT MEANS:

The server returned an internal error.

HOW TO FIX:

The exact server response is shown above.

Copy the error and send it to me.

I can identify the problem from that error.`;
    }


    if(e.includes("failed to fetch")){

        return `WHAT IT MEANS:

Your browser could not reach the API.

HOW TO FIX:

Test this URL:

/api/messages?channel=general

If it shows 404, the api/messages.js file is in the wrong place.

If it shows another error, send me that error.`;
    }


    if(e.includes("did not return json")){

        return `WHAT IT MEANS:

Vercel returned something other than JSON.

HOW TO FIX:

Open:

/api/messages?channel=general

in your browser.

Copy everything you see and send it to me.`;
    }


    return `I don't recognize this error yet.

Send me the exact error shown above.

DO NOT send your Supabase service_role key.

I can use the error message to tell you exactly what needs fixing.`;
}


function showError(error){

    lastFullError=error;

    document.getElementById(
        "errorCode"
    ).textContent=error;

    document.getElementById(
        "errorFix"
    ).textContent=getFix(error);

    document.getElementById(
        "errorScreen"
    ).style.display="flex";

    setStatus(
        "● Error",
        false
    );
}


function hideError(){

    document.getElementById(
        "errorScreen"
    ).style.display="none";
}


async function testServer(){

    hideError();

    await loadMessages();
}


async function loadMessages(){

    try{

        const response=
            await fetch(
                API+
                "?channel="+
                encodeURIComponent(
                    currentChannel
                ),
                {
                    method:"GET",
                    headers:{
                        "Accept":
                            "application/json"
                    }
                }
            );


        const text=
            await response.text();


        let data;


        try{

            data=
                JSON.parse(text);

        }catch{

            throw new Error(
                "Server did not return JSON.\n\n"+
                "HTTP STATUS: "+
                response.status+
                "\n\n"+
                "SERVER RESPONSE:\n"+
                text.substring(0,1500)
            );
        }


        if(!response.ok){

            throw new Error(
                "HTTP "+
                response.status+
                "\n\n"+
                (
                    data.error ||
                    "Unknown server error"
                )
            );
        }


        displayMessages(
            data.messages||[]
        );


        setStatus(
            "● Connected",
            true
        );


    }catch(error){

        console.error(error);

        showError(
            error.message
        );
    }
}


function displayMessages(messages){

    const container=
        document.getElementById(
            "messages"
        );

    container.innerHTML="";


    messages.forEach(message=>{

        const div=
            document.createElement("div");

        div.className="message";


        const name=
            document.createElement("span");

        name.className="name";

        name.textContent=
            message.username;


        const time=
            document.createElement("span");

        time.className="time";

        if(message.created_at){

            time.textContent=
                new Date(
                    message.created_at
                ).toLocaleString();
        }


        const text=
            document.createElement("div");

        text.className="text";

        text.textContent=
            message.message;


        div.appendChild(name);

        div.appendChild(time);

        div.appendChild(text);

        container.appendChild(div);

    });


    container.scrollTop=
        container.scrollHeight;
}


async function sendMessage(){

    const input=
        document.getElementById(
            "messageInput"
        );

    const button=
        document.getElementById(
            "sendButton"
        );


    const message=
        input.value.trim();


    if(!username){

        alert(
            "Choose a username first."
        );

        return;
    }


    if(!message){

        return;
    }


    button.disabled=true;


    try{

        const response=
            await fetch(
                API,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            username:
                                username,

                            channel:
                                currentChannel,

                            message:
                                message

                        })
                }
            );


        const text=
            await response.text();


        let data;


        try{

            data=
                JSON.parse(text);

        }catch{

            throw new Error(
                "Server did not return JSON.\n\n"+
                "HTTP STATUS: "+
                response.status+
                "\n\n"+
                "SERVER RESPONSE:\n"+
                text.substring(0,1500)
            );
        }


        if(!response.ok){

            throw new Error(
                "HTTP "+
                response.status+
                "\n\n"+
                (
                    data.error ||
                    "Unknown server error"
                )
            );
        }


        input.value="";

        await loadMessages();


    }catch(error){

        console.error(error);

        showError(
            error.message
        );
    }


    button.disabled=false;
}


function changeChannel(
    channel,
    element
){

    currentChannel=
        channel;


    document
        .querySelectorAll(
            ".channel"
        )
        .forEach(item=>{

            item.classList.remove(
                "active"
            );

        });


    element.classList.add(
        "active"
    );


    document.getElementById(
        "channelName"
    ).textContent=
        channel;


    document.getElementById(
        "messageInput"
    ).placeholder=
        "Message #"+
        channel;


    loadMessages();
}


async function copyError(){

    try{

        await navigator.clipboard.writeText(
            lastFullError
        );

        document.getElementById(
            "copySuccess"
        ).style.display=
            "block";

        setTimeout(()=>{

            document.getElementById(
                "copySuccess"
            ).style.display=
                "none";

        },2000);

    }catch{

        alert(
            lastFullError
        );
    }
}


document
    .getElementById(
        "messageInput"
    )
    .addEventListener(
        "keydown",
        event=>{

            if(
                event.key==="Enter" &&
                !event.shiftKey
            ){

                event.preventDefault();

                sendMessage();
            }

        }
    );


const savedUsername=
    localStorage.getItem(
        "chat_username"
    );


if(savedUsername){

    username=
        savedUsername;

    document.getElementById(
        "login"
    ).style.display=
        "none";

    loadMessages();
}


setInterval(
    ()=>{

        if(username){

            loadMessages();

        }

    },
    5000
);

</script>

</body>
</html>
