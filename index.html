<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>Chat</title>

<style>

*{
    box-sizing:border-box;
}

:root{

    --bg:#0b0d10;
    --panel:#111419;
    --panel2:#181c22;
    --panel3:#20252d;

    --border:#292f38;

    --text:#edf0f4;
    --muted:#7e8793;

    --accent:#e8eaed;

    --danger:#ff7070;

    --radius:12px;

    --text-size:16px;
    --word-spacing:0px;
    --line-spacing:1.45;

    --ui-scale:1;
}

html,
body{

    margin:0;

    width:100%;
    height:100%;

    background:var(--bg);

    color:var(--text);

    font-family:
        Inter,
        Arial,
        sans-serif;
}

body{

    overflow:hidden;

    font-size:
        calc(
            16px *
            var(--ui-scale)
        );
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{

    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;
}


/* HEADER */

.header{

    height:64px;
    min-height:64px;

    padding:
        0 18px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    background:
        var(--panel);

    border-bottom:
        1px solid var(--border);
}

.logo{

    display:flex;

    align-items:center;

    gap:10px;

    font-weight:700;
}

.logo-icon{

    width:35px;
    height:35px;

    display:grid;

    place-items:center;

    border-radius:10px;

    background:
        var(--panel2);

    border:
        1px solid var(--border);
}

.channel{

    color:var(--muted);

    font-weight:400;
}

.header-buttons{

    display:flex;

    gap:7px;
}

.icon-btn{

    width:39px;
    height:39px;

    border-radius:10px;

    border:
        1px solid var(--border);

    background:
        var(--panel2);

    color:var(--text);
}

.icon-btn:hover{

    filter:
        brightness(1.15);
}


/* MESSAGES */

.messages{

    flex:1;

    overflow-y:auto;

    padding:20px;
}

.message{

    display:flex;

    gap:11px;

    margin-bottom:17px;
}

.avatar{

    flex:
        0 0 40px;

    width:40px;
    height:40px;

    display:grid;

    place-items:center;

    border-radius:
        var(--radius);

    background:
        var(--panel2);

    border:
        1px solid var(--border);

    font-weight:700;
}

.message-content{

    min-width:0;

    max-width:
        min(
            850px,
            calc(
                100vw - 90px
            )
        );
}

.message-top{

    display:flex;

    align-items:
        baseline;

    gap:8px;

    margin-bottom:3px;
}

.username{

    font-weight:700;
}

.time,
.edited{

    color:var(--muted);

    font-size:11px;
}

.message-text{

    color:#d8dde4;

    white-space:pre-wrap;

    overflow-wrap:anywhere;

    font-size:
        var(--text-size);

    word-spacing:
        var(--word-spacing);

    line-height:
        var(--line-spacing);
}

.message-image{

    display:block;

    max-width:
        min(
            500px,
            80vw
        );

    max-height:500px;

    margin-top:8px;

    border:
        1px solid var(--border);

    border-radius:
        var(--radius);

    background:#000;

    object-fit:contain;

    cursor:pointer;
}


/* GAME */

.game-card{

    width:
        min(
            650px,
            calc(
                100vw - 75px
            )
        );

    margin-top:6px;

    border:
        1px solid var(--border);

    border-radius:
        16px;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            var(--panel2),
            #101318
        );

    box-shadow:
        0 12px 40px #0005;
}

.game-header{

    padding:15px 16px;

    display:flex;

    justify-content:
        space-between;

    align-items:center;

    border-bottom:
        1px solid var(--border);
}

.game-title{

    font-weight:800;

    font-size:17px;
}

.game-host{

    color:var(--muted);

    font-size:12px;

    margin-top:3px;
}

.game-body{

    padding:16px;
}

.game-status{

    display:flex;

    flex-wrap:wrap;

    gap:8px;

    margin-bottom:13px;
}

.game-pill{

    padding:
        6px 9px;

    border-radius:8px;

    background:
        #252b33;

    color:#cbd1d9;

    font-size:12px;
}

.game-turn{

    padding:11px;

    border-radius:10px;

    background:#0e1115;

    border:
        1px solid var(--border);

    margin-bottom:14px;

    font-weight:700;
}

.game-buttons{

    display:flex;

    flex-wrap:wrap;

    gap:7px;
}

.game-button{

    padding:
        9px 13px;

    border-radius:9px;

    border:
        1px solid var(--border);

    background:
        #252b33;

    color:white;
}

.game-button:hover{

    filter:
        brightness(1.15);
}

.game-button.primary{

    background:
        var(--accent);

    color:#111;

    font-weight:700;
}

.game-button.danger{

    background:
        #391d21;

    border-color:
        #71343b;

    color:#ff8a8a;
}

.game-players{

    margin-top:14px;

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                130px,
                1fr
            )
        );

    gap:7px;
}

.player{

    padding:9px;

    border-radius:9px;

    background:#12161b;

    border:
        1px solid var(--border);

    font-size:13px;
}

.player.host{

    border-color:
        #59616c;
}

.player-name{

    font-weight:700;
}

.player-role{

    color:var(--muted);

    font-size:10px;

    margin-top:2px;
}


/* GAME BOARD */

.game-board{

    margin:
        15px auto;

    width:
        min(
            400px,
            100%
        );
}


/* TIC TAC TOE */

.ttt-board{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:7px;
}

.ttt-cell{

    aspect-ratio:1;

    border:
        1px solid var(--border);

    border-radius:10px;

    background:
        #101419;

    color:white;

    font-size:
        clamp(
            30px,
            8vw,
            55px
        );

    font-weight:800;
}


/* CONNECT FOUR */

.connect-board{

    display:grid;

    grid-template-columns:
        repeat(7,1fr);

    gap:4px;

    padding:8px;

    background:
        #151b25;

    border-radius:12px;
}

.connect-cell{

    aspect-ratio:1;

    border-radius:50%;

    background:
        #090c10;

    border:
        1px solid #2c333d;

    cursor:pointer;
}

.connect-cell.R{

    background:
        #d95858;
}

.connect-cell.Y{

    background:
        #e1c957;
}


/* REVERSI */

.reversi-board{

    display:grid;

    grid-template-columns:
        repeat(8,1fr);

    gap:2px;

    padding:5px;

    background:
        #27382d;

    border-radius:10px;
}

.reversi-cell{

    aspect-ratio:1;

    display:grid;

    place-items:center;

    background:
        #31563b;

    border:0;

    padding:2px;
}

.reversi-piece{

    width:80%;
    height:80%;

    border-radius:50%;

    background:#111;

    box-shadow:
        inset 0 2px 2px #fff2;
}

.reversi-piece.W{

    background:#eee;
}


/* DICE */

.dice-area{

    display:grid;

    gap:10px;
}

.dice-result{

    padding:14px;

    border-radius:11px;

    background:
        #0d1014;

    border:
        1px solid var(--border);
}

.dice-number{

    font-size:35px;

    font-weight:900;
}


/* RPS */

.rps-buttons{

    display:flex;

    flex-wrap:wrap;

    gap:8px;

    justify-content:center;
}

.rps-choice{

    min-width:110px;

    padding:15px;

    border-radius:12px;

    border:
        1px solid var(--border);

    background:
        #151a20;

    color:white;

    font-size:20px;
}


/* COMPOSER */

.composer{

    padding:
        12px 16px 16px;

    background:
        var(--panel);

    border-top:
        1px solid var(--border);
}

.composer-box{

    max-width:1100px;

    margin:auto;

    display:flex;

    align-items:flex-end;

    gap:7px;

    padding:8px;

    background:
        var(--panel2);

    border:
        1px solid var(--border);

    border-radius:14px;
}

textarea{

    flex:1;

    min-height:42px;

    max-height:150px;

    resize:none;

    border:0;

    outline:none;

    background:transparent;

    color:white;

    padding:10px;
}

.attach-btn,
.send-btn{

    height:42px;

    border:0;

    border-radius:9px;
}

.attach-btn{

    width:42px;

    background:transparent;

    color:#adb5c0;

    font-size:20px;
}

.attach-btn:hover{

    background:#242932;
}

.send-btn{

    padding:
        0 18px;

    background:
        var(--accent);

    color:#111;

    font-weight:700;
}

.send-btn:disabled{

    opacity:.5;

    cursor:not-allowed;
}


/* OVERLAY */

.overlay{

    position:fixed;

    inset:0;

    display:none;

    align-items:center;

    justify-content:center;

    background:
        rgba(
            0,
            0,
            0,
            .72
        );

    z-index:100;
}

.overlay.show{

    display:flex;
}

.panel{

    width:
        min(
            600px,
            calc(
                100vw - 25px
            )
        );

    max-height:
        calc(
            100vh - 25px
        );

    overflow-y:auto;

    background:
        var(--panel);

    border:
        1px solid var(--border);

    border-radius:15px;

    box-shadow:
        0 25px 80px #000b;
}

.panel-header{

    display:flex;

    justify-content:
        space-between;

    align-items:center;

    padding:18px;

    border-bottom:
        1px solid var(--border);
}

.panel-header h2{

    margin:0;
}

.panel-body{

    padding:18px;
}


/* SETTINGS */

.category{

    margin-bottom:12px;

    border:
        1px solid var(--border);

    border-radius:12px;

    overflow:hidden;

    background:
        var(--panel2);
}

.category-title{

    width:100%;

    padding:14px;

    border:0;

    background:transparent;

    color:var(--text);

    display:flex;

    justify-content:
        space-between;

    font-weight:700;

    text-align:left;
}

.category-body{

    display:none;

    padding:
        0 14px 14px;
}

.category.open
.category-body{

    display:block;
}

.setting{

    margin-top:14px;
}

.setting label{

    display:block;

    margin-bottom:7px;

    color:#aab2bd;

    font-size:13px;
}

.setting input,
.setting select{

    width:100%;

    padding:10px;

    border:
        1px solid var(--border);

    border-radius:9px;

    outline:none;

    background:#101419;

    color:white;
}

.setting input[type="range"]{

    padding:0;
}

.setting-value{

    color:var(--muted);

    font-size:12px;

    margin-top:5px;
}

.save-btn{

    width:100%;

    margin-top:8px;

    padding:12px;

    border:0;

    border-radius:9px;

    background:
        var(--accent);

    color:#111;

    font-weight:700;
}


/* DANGER */

.danger-zone{

    margin-top:20px;

    padding-top:20px;

    border-top:
        1px solid #402529;
}

.danger-title{

    color:var(--danger);

    font-weight:700;

    margin-bottom:7px;
}

.danger-zone p{

    color:var(--muted);

    line-height:1.45;
}

.danger-btn{

    width:100%;

    padding:12px;

    border-radius:9px;

    border:
        1px solid #743333;

    background:#241719;

    color:#ff8585;
}


/* CONTEXT MENU */

.context-menu{

    position:fixed;

    display:none;

    width:160px;

    padding:5px;

    z-index:200;

    background:
        var(--panel2);

    border:
        1px solid var(--border);

    border-radius:9px;

    box-shadow:
        0 15px 40px #0009;
}

.context-menu.show{

    display:block;
}

.context-menu button{

    width:100%;

    padding:9px 10px;

    text-align:left;

    border:0;

    border-radius:6px;

    background:transparent;

    color:var(--text);
}

.context-menu button:hover{

    background:#252b33;
}

.delete-option{

    color:#ff7777!important;
}


/* IMAGE VIEWER */

.image-viewer{

    position:fixed;

    inset:0;

    display:none;

    align-items:center;

    justify-content:center;

    background:#000f;

    z-index:300;
}

.image-viewer.show{

    display:flex;
}

.full-image{

    max-width:95vw;

    max-height:90vh;

    object-fit:contain;
}

.back-image{

    position:absolute;

    top:18px;

    left:18px;

    padding:10px 16px;

    border-radius:9px;

    border:
        1px solid #3a4049;

    background:#171b21;

    color:white;
}


/* DIALOG */

.dialog{

    width:
        min(
            450px,
            calc(
                100vw - 30px
            )
        );

    background:
        var(--panel);

    border:
        1px solid var(--border);

    border-radius:14px;

    padding:20px;
}

.dialog h2{

    margin-top:0;
}

.dialog p{

    color:#aab2bd;

    line-height:1.5;
}

.dialog-buttons{

    display:flex;

    gap:8px;

    justify-content:flex-end;
}

.dialog-buttons button{

    padding:10px 16px;

    border-radius:8px;

    border:
        1px solid var(--border);

    background:#20252c;

    color:white;
}

.dialog-buttons .danger{

    background:#6b2929;

    border-color:#813434;
}


/* EMPTY */

.empty{

    height:100%;

    display:grid;

    place-items:center;

    color:#656d78;

    text-align:center;
}

.empty strong{

    display:block;

    color:#aab2bd;

    margin-bottom:5px;
}


@media(max-width:600px){

    .header{

        padding:
            0 11px;
    }

    .messages{

        padding:
            15px 11px;
    }

    .channel{

        display:none;
    }

    .message-content{

        max-width:
            calc(
                100vw - 70px
            );
    }

    .game-card{

        width:
            calc(
                100vw - 70px
            );
    }
}

</style>

</head>

<body>

<div class="app">

<header class="header">

    <div class="logo">

        <div class="logo-icon">
            💬
        </div>

        <span>
            Chat
        </span>

        <span class="channel">
            # general
        </span>

    </div>

    <div class="header-buttons">

        <button
            class="icon-btn"
            id="gamesBtn"
            title="Games"
        >
            🎮
        </button>

        <button
            class="icon-btn"
            id="settingsBtn"
            title="Settings"
        >
            ⚙
        </button>

    </div>

</header>


<main
    class="messages"
    id="messages"
></main>


<div class="composer">

    <div class="composer-box">

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
        >

        <button
            class="attach-btn"
            id="attachBtn"
        >
            ＋
        </button>

        <textarea
            id="messageInput"
            rows="1"
            placeholder="Message #general"
        ></textarea>

        <button
            class="send-btn"
            id="sendBtn"
        >
            Send
        </button>

    </div>

</div>

</div>


<!-- GAMES -->

<div
    class="overlay"
    id="gamesOverlay"
>

<div class="panel">

<div class="panel-header">

    <h2>
        🎮 Games
    </h2>

    <button
        class="icon-btn"
        id="closeGames"
    >
        ×
    </button>

</div>

<div class="panel-body">

    <p
        style="
            color:var(--muted);
            line-height:1.5;
        "
    >
        Start a game and it will appear directly
        inside the chat. Players must join before
        the host starts the game.
    </p>

    <div
        id="gameChoices"
        style="
            display:grid;
            gap:8px;
        "
    ></div>

</div>

</div>

</div>


<!-- SETTINGS -->

<div
    class="overlay"
    id="settingsOverlay"
>

<div class="panel">

<div class="panel-header">

    <h2>
        Settings
    </h2>

    <button
        class="icon-btn"
        id="closeSettings"
    >
        ×
    </button>

</div>

<div class="panel-body">


<div class="category open">

<button class="category-title">

    <span>
        👤 Profile
    </span>

    <span>
        ⌄
    </span>

</button>

<div class="category-body">

<div class="setting">

<label>
    Your name
</label>

<input
    id="usernameInput"
    maxlength="24"
    placeholder="Enter your name"
>

</div>

<div class="setting">

<label>
    Device ID
</label>

<input
    id="deviceIdInput"
    readonly
>

</div>

</div>

</div>


<div class="category">

<button class="category-title">

    <span>
        📝 Text
    </span>

    <span>
        ⌄
    </span>

</button>

<div class="category-body">

<div class="setting">

<label>
    Text size
</label>

<input
    id="textSize"
    type="range"
    min="12"
    max="24"
    step="1"
>

<div
    class="setting-value"
    id="textSizeValue"
></div>

</div>

<div class="setting">

<label>
    Word spacing
</label>

<input
    id="wordSpacing"
    type="range"
    min="0"
    max="12"
>

<div
    class="setting-value"
    id="wordSpacingValue"
></div>

</div>

<div class="setting">

<label>
    Line spacing
</label>

<input
    id="lineSpacing"
    type="range"
    min="1"
    max="2"
    step=".05"
>

<div
    class="setting-value"
    id="lineSpacingValue"
></div>

</div>

</div>

</div>


<div class="category">

<button class="category-title">

    <span>
        💬 Chat
    </span>

    <span>
        ⌄
    </span>

</button>

<div class="category-body">

<div class="setting">

<label>
    Refresh rate
</label>

<select id="refreshRate">

<option value="10000">
    10 seconds
</option>

<option value="5000">
    5 seconds
</option>

<option value="3000">
    3 seconds
</option>

<option value="2000">
    2 seconds
</option>

<option value="1000">
    1 second
</option>

<option value="500">
    0.5 seconds
</option>

<option value="100">
    0.1 seconds
</option>

</select>

</div>

<div class="setting">

<label>
    Show timestamps
</label>

<select id="showTimestamps">

<option value="true">
    On
</option>

<option value="false">
    Off
</option>

</select>

</div>

<div class="setting">

<label>
    Compact messages
</label>

<select id="compactMessages">

<option value="false">
    Off
</option>

<option value="true">
    On
</option>

</select>

</div>

</div>

</div>


<div class="category">

<button class="category-title">

    <span>
        🎨 Appearance
    </span>

    <span>
        ⌄
    </span>

</button>

<div class="category-body">

<div class="setting">

<label>
    Theme
</label>

<select id="themeSelect">

<option value="dark">
    Dark
</option>

<option value="midnight">
    Midnight
</option>

<option value="slate">
    Slate
</option>

<option value="black">
    Pure Black
</option>

<option value="blue">
    Dark Blue
</option>

<option value="purple">
    Dark Purple
</option>

<option value="green">
    Dark Green
</option>

<option value="red">
    Dark Red
</option>

<option value="gray">
    Classic Gray
</option>

<option value="light">
    Light
</option>

</select>

</div>

<div class="setting">

<label>
    Corner roundness
</label>

<input
    id="cornerRadius"
    type="range"
    min="0"
    max="25"
>

<div
    class="setting-value"
    id="cornerRadiusValue"
></div>

</div>

<div class="setting">

<label>
    UI scale
</label>

<input
    id="uiScale"
    type="range"
    min=".8"
    max="1.2"
    step=".05"
>

<div
    class="setting-value"
    id="uiScaleValue"
></div>

</div>

</div>

</div>


<div class="category">

<button class="category-title">

    <span>
        ⚙️ Behavior
    </span>

    <span>
        ⌄
    </span>

</button>

<div class="category-body">

<div class="setting">

<label>
    Enter to send
</label>

<select id="enterToSend">

<option value="true">
    On
</option>

<option value="false">
    Off
</option>

</select>

</div>

<div class="setting">

<label>

        crypto.randomUUID();

    localStorage.setItem(
        "chat_device_id",

    username:"",

    theme:"dark",

    refreshRate:500,

    showTimestamps:true,

    compactMessages:false,

    textSize:16,

    wordSpacing:0,

    lineSpacing:1.45,

    cornerRadius:12,

    uiScale:1,

    enterToSend:true,

    autoScroll:true,

    confirmDelete:true
};


function getSetting(key){

    const value =
        localStorage.getItem(
            "chat_" + key
        );

    if (
        value === null
    ) {
        return defaults[key];
    }

    if (
        value === "true" ||
        value === "false"
    ) {
        return value === "true";
    }

    const number =
        Number(value);

    return Number.isNaN(number)
        ? value
        : number;
}

Object.keys(

).forEach(
    key =>
        settings[key] =

);

        ],

            "#080b14",
            "#101522"
        ],

        slate:[
            "#101418",
            "#171d22"
        ],

        black:[
            "#000",
            "#090909"
        ],

        blue:[
            "#091018",
            "#101c29"
        ],

        purple:[
            "#100b17",
            "#191021"
        ],

        green:[
            "#09120d",
            "#101b15"
        ],

        red:[
            "#140b0b",
            "#1e1111"
        ],

        gray:[
            "#151515",
            "#202020"
        ],

        light:[
            "#eeeeee",
            "#ffffff"
        ]
    };

    const theme =
        themes[name] ||
        themes.dark;

    document.documentElement
        .style
        .setProperty(
            "--bg",
            theme[0]
        );

    document.documentElement
        .style
        .setProperty(
            "--panel",
            theme[1]
        );
}


/*
=========================================================
CHAT
=========================================================
*/

async function load(){

    try {

        const response =
            await fetch(
                API_URL +
                "?channel=" +
                encodeURIComponent(
                    CHANNEL
                ),
                {
                    cache:"no-store"
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Unable to load chat."
            );
        }

        currentMessages =
            Array.isArray(
                data.messages
            )
                ? data.messages
                : [];

        currentGames =
            Array.isArray(
                data.games
            )
                ? data.games
                : [];

        render();

    } catch(error) {

        console.error(error);

        if (!currentMessages.length) {

            messagesEl.innerHTML = `
                <div class="empty">
                    <div>
                        <strong>
                            Unable to load messages
                        </strong>
                        ${escapeHtml(
                            error.message
                        )}
                    </div>
                </div>
            `;
        }
    }
}


function render(){

    const wasBottom =
        messagesEl.scrollHeight -
        messagesEl.scrollTop -
        messagesEl.clientHeight
        < 100;

    const fragment =
        document.createDocumentFragment();

    /*
    NORMAL CHAT
    */

    currentMessages.forEach(
        message => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "message";

            const avatar =
                document.createElement(
                    "div"
                );

            avatar.className =
                "avatar";

            avatar.textContent =
                (
                    message.username ||
                    "?"
                )
                    .charAt(0)
                    .toUpperCase();

            const content =
                document.createElement(
                    "div"
                );

            content.className =
                "message-content";

            const top =
                document.createElement(
                    "div"
                );

            top.className =
                "message-top";

            const username =
                document.createElement(
                    "span"
                );

            username.className =
                "username";

            username.textContent =
                message.username ||
                "User";

            top.appendChild(
                username
            );

            if (
                settings.showTimestamps
            ) {

                const time =
                    document.createElement(
                        "span"
                    );

                time.className =
                    "time";

                time.textContent =
                    formatTime(
                        message.created_at
                    );

                top.appendChild(
                    time
                );
            }

            if (message.edited) {

                const edited =
                    document.createElement(
                        "span"
                    );

                edited.className =
                    "edited";

                edited.textContent =
                    "(edited)";

                top.appendChild(
                    edited
                );
            }

            content.appendChild(
                top
            );

            if (message.message) {

                const text =
                    document.createElement(
                        "div"
                    );

                text.className =
                    "message-text";

                text.textContent =
                    message.message;

                /*
                Link support
                */

                convertLinks(
                    text,
                    message.message
                );

                content.appendChild(
                    text
                );
            }

            if (message.image) {

                const img =
                    document.createElement(
                        "img"
                    );

                img.className =
                    "message-image";

                img.src =
                    message.image;

                img.onclick =
                    () =>
                        openImage(
                            message.image
                        );

                content.appendChild(
                    img
                );
            }

            item.appendChild(
                avatar
            );

            item.appendChild(
                content
            );

            if (
                message.device_id ===
                deviceId
            ) {

                item.addEventListener(
                    "contextmenu",
                    event => {

                        event.preventDefault();

                        selectedMessage =
                            message;

                        contextMenu.style.left =
                            Math.min(
                                event.clientX,
                                window.innerWidth -
                                170
                            ) + "px";

                        contextMenu.style.top =
                            Math.min(
                                event.clientY,
                                window.innerHeight -
                                100
                            ) + "px";

                        contextMenu
                            .classList
                            .add("show");
                    }
                );
            }

            fragment.appendChild(
                item
            );
        }
    );


    /*
    GAMES APPEAR DIRECTLY IN CHAT
    */

    currentGames.forEach(
        game => {

            const gameMessage =
                createGameMessage(
                    game
                );

            fragment.appendChild(
                gameMessage
            );
        }
    );


    if (
        !fragment.childNodes.length
    ) {

        messagesEl.innerHTML = `
            <div class="empty">
                <div>
                    <strong>
                        No messages yet
                    </strong>
                    Be the first to send something.
                </div>
            </div>
        `;

        return;
    }

    messagesEl.replaceChildren(
        fragment
    );

    if (
        wasBottom &&
        settings.autoScroll
    ) {

        messagesEl.scrollTop =
            messagesEl.scrollHeight;
    }
}


/*
=========================================================
LINK SUPPORT
=========================================================
*/

function convertLinks(
    element,
    text
){

    const urlRegex =
        /(https?:\/\/[^\s]+)/g;

    const parts =
        text.split(
            urlRegex
        );

    element.textContent = "";

    parts.forEach(
        part => {

            if (
                /^https?:\/\//i
                    .test(part)
            ) {

                const link =
                    document.createElement(
                        "a"
                    );

                link.href =
                    part;

                link.target =
                    "_blank";

                link.rel =
                    "noopener noreferrer";

                link.textContent =
                    part;

                link.style.color =
                    "#8ab4ff";

                element.appendChild(
                    link
                );

            } else {

                element.appendChild(
                    document.createTextNode(
                        part
                    )
                );
            }
        }
    );
}


/*
=========================================================
GAME CARD
=========================================================
*/

function createGameMessage(game){

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message";

    const avatar =
        document.createElement(
            "div"
        );

    avatar.className =
        "avatar";

    avatar.textContent =
        "🎮";

    const content =
        document.createElement(
            "div"
        );

    content.className =
        "message-content";

    const top =
        document.createElement(
            "div"
        );

    top.className =
        "message-top";

    const title =
        document.createElement(
            "span"
        );

    title.className =
        "username";

    title.textContent =
        game.host +
        " invited you to a game of " +
        game.name;

    top.appendChild(
        title
    );

    content.appendChild(
        top
    );

    const card =
        document.createElement(
            "div"
        );

    card.className =
        "game-card";

    const header =
        document.createElement(
            "div"
        );

    header.className =
        "game-header";

    const headerText =
        document.createElement(
            "div"
        );

    const titleText =
        document.createElement(
            "div"
        );

    titleText.className =
        "game-title";

    titleText.textContent =
        "🎮 " +
        game.name;

    const hostText =
        document.createElement(
            "div"
        );

    hostText.className =
        "game-host";

    hostText.textContent =
        "Host: " +
        game.host;

    headerText.appendChild(
        titleText
    );

    headerText.appendChild(
        hostText
    );

    header.appendChild(
        headerText
    );

    card.appendChild(
        header
    );


    const body =
        document.createElement(
            "div"
        );

    body.className =
        "game-body";


    const status =
        document.createElement(
            "div"
        );

    status.className =
        "game-status";

    addPill(
        status,
        game.players.length +
        " / " +
        game.maxPlayers +
        " players"
    );

    addPill(
        status,
        game.started
            ? "Game started"
            : "Waiting for players"
    );

    body.appendChild(
        status
    );


    if (game.started) {

        const turn =
            document.createElement(
                "div"
            );

        turn.className =
            "game-turn";

        if (game.finished) {

            turn.textContent =
                game.winner === "Draw"
                    ? "🤝 Draw!"
                    : "🏆 Winner: " +
                      game.winner;

        } else {

            const current =
                game.players[
                    game.turnIndex
                ];

            turn.textContent =
                current
                    ? "🎯 Turn: " +
                      current.username
                    : "Waiting...";
        }

        body.appendChild(
            turn
        );
    }


    /*
    PLAYING AREA
    */

    if (
        game.started &&
        !game.finished
    ) {

        const board =
            createBoard(
                game
            );

        if (board) {

            board.className +=
                " game-board";

            body.appendChild(
                board
            );
        }
    }


    /*
    PLAYERS
    */

    const players =
        document.createElement(
            "div"
        );

    players.className =
        "game-players";

    game.players.forEach(
        player => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "player";

            if (
                player.deviceId ===
                game.hostDeviceId
            ) {
                item.classList.add(
                    "host"
                );
            }

            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "player-name";

            name.textContent =
                player.username;

            const role =
                document.createElement(
                    "div"
                );

            role.className =
                "player-role";

            role.textContent =
                player.deviceId ===
                game.hostDeviceId
                    ? "HOST"
                    : "PLAYER";

            item.appendChild(
                name
            );

            item.appendChild(
                role
            );

            players.appendChild(
                item
            );
        }
    );

    body.appendChild(
        players
    );


    /*
    BUTTONS
    */

    const buttons =
        document.createElement(
            "div"
        );

    buttons.className =
        "game-buttons";


    const joined =
        game.players.some(
            p =>
                p.deviceId ===
                deviceId
        );

    const isHost =
        game.hostDeviceId ===
        deviceId;


    if (
        !game.started &&
        !joined
    ) {

        const join =
            gameButton(
                "🎮 Join",
                "primary"
            );

        join.onclick =
            () =>
                gameAction(
                    game,
                    "join",
                    {
                        username:
                            settings.username
                    }
                );

        buttons.appendChild(
            join
        );
    }


    if (
        !game.started &&
        joined &&
        !isHost
    ) {

        const leave =
            gameButton(
                "← Leave"
            );

        leave.onclick =
            () =>
                gameAction(
                    game,
                    "leave"
                );

        buttons.appendChild(
            leave
        );
    }


    if (
        !game.started &&
        isHost
    ) {

        const start =
            gameButton(
                "▶ Start",
                "primary"
            );

        start.onclick =
            () =>
                gameAction(
                    game,
                    "start"
                );

        buttons.appendChild(
            start
        );

        const quit =
            gameButton(
                "✕ Force Quit",
                "danger"
            );

        quit.onclick =
            () =>
                gameAction(
                    game,
                    "force_quit"
                );

        buttons.appendChild(
            quit
        );
    }


    if (
        game.started &&
        !game.finished &&
        joined &&
        !isHost
    ) {

        const leave =
            gameButton(
                "← Leave"
            );

        leave.onclick =
            () =>
                gameAction(
                    game,
                    "leave"
                );

        buttons.appendChild(
            leave
        );
    }


    if (
        game.started &&
        !game.finished &&
        isHost
    ) {

        const quit =
            gameButton(
                "✕ Force Quit",
                "danger"
            );

        quit.onclick =
            () =>
                gameAction(
                    game,
                    "force_quit"
                );

        buttons.appendChild(
            quit
        );
    }


    /*
    SPECTATE LABEL
    */

    if (
        game.started &&
        !joined
    ) {

        const spectating =
            document.createElement(
                "span"
            );

        spectating.style.color =
            "var(--muted)";

        spectating.style.fontSize =
            "12px";

        spectating.style.padding =
            "9px";

        spectating.textContent =
            "👁 Spectating";

        buttons.appendChild(
            spectating
        );
    }


    if (
        buttons.children.length
    ) {

        body.appendChild(
            buttons
        );
    }


    card.appendChild(
        body
    );

    content.appendChild(
        card
    );

    wrapper.appendChild(
        avatar
    );

    wrapper.appendChild(
        content
    );

    return wrapper;
}

/*

=========================================================
*/

function createBoard(game){

    if (
        game.type ===
        "tictactoe"
    ) {
        return createTicTacToe(
            game
        );
    }

    if (
        game.type ===
        "connectfour"
    ) {
        return createConnectFour(
            game
        );
    }

    if (
        game.type ===
        "dice"
    ) {
        return createDice(
            game
        );
    }

    if (
        game.type ===
        "reversi"
    ) {
        return createReversi(
            game
        );
    }

    if (
        game.type ===
        "rps"
    ) {
        return createRPS(
            game
        );
    }

    return null;
}


/*

=========================================================
*/

function createTicTacToe(game){

    const board =
        document.createElement(
            "div"
        );

    board.className =
        "ttt-board";

    game.board.forEach(
        (value,index) => {

            const cell =
                document.createElement(
                    "button"
                );

            cell.className =
                "ttt-cell";

            cell.textContent =
                value;

            cell.disabled =
                Boolean(value) ||
                !isMyTurn(game);

            cell.onclick =
                () =>
                    gameAction(
                        game,
                        "move",
                        {
                            index
                        }
                    );

            board.appendChild(
                cell
            );
        }
    );

    return board;
}

/*
=========================================================
GAME ACTION
=========================================================
*/

async function gameAction(
    game,
    action,
    data = {}
){

    if (gameActionBusy) {
        return;
    }

    gameActionBusy = true;

    try {

        const response =
            await fetch(
                API_URL,
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            action:
                                "game_action",

                            game_id:
                                game._dbId,

                            game_action:
                                action,

                            device_id:
                                deviceId,

                            data
                        })
                }
            );

        const result =
            await response.json();

        if (!response.ok) {

            throw new Error(
                result.error ||
                "Game action failed."
            );
        }

        if (
            result.removed
        ) {

            currentGames =
                currentGames.filter(
                    g =>
                        g._dbId !==
                        game._dbId
                );

        } else if (
            result.game
        ) {

            const index =
                currentGames.findIndex(
                    g =>
                        g._dbId ===
                        game._dbId
                );

            if (index >= 0) {

                currentGames[index] =
                    result.game;

                currentGames[index]._dbId =
                    game._dbId;
            }
        }

        render();

    } catch(error) {

        alert(
            "Game error:\n\n" +
            error.message
        );

    } finally {

        gameActionBusy = false;
    }
}

async function createGame(type){

    if (!settings.username) {

        settingsBtn.click();

        alert(
            "Set your name first."
        );

        return;
    }

    const alreadyHosting =
        currentGames.some(
            game =>
                game.hostDeviceId ===
                deviceId
        );

    if (alreadyHosting) {

        alert(
            "You already host a game."
        );

        return;
    }

    try {

        const response =
            await fetch(
                API_URL,
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            action:
                                "create_game",

                            game_type:
                                type,

                            username:
                                settings.username,

                            device_id:
                                deviceId
                        })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Unable to create game."
            );
        }

        if (data.game) {

            currentGames.push(
                data.game
            );
        }

        gamesOverlay
            .classList
            .remove("show");

        render();

        messagesEl.scrollTop =
            messagesEl.scrollHeight;

    } catch(error) {

        alert(
            "Could not create game:\n\n" +
            error.message
        );
    }
}

async function sendMessage(){

    const text =
        messageInput.value.trim();

    if (!settings.username) {

        settingsBtn.click();

        alert(
            "Set your name in Settings first."
        );

        return;
    }

    if (!text && !selectedFile) {
        return;
    }

    sendBtn.disabled = true;

    try {

        let image = null;

        if (selectedFile) {

            image =
                await resizeImage(
                    selectedFile
                );
        }

        const response =
            await fetch(
                API_URL,
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            action:
                                "send_message",

                            username:
                                settings.username,

                            channel:
                                CHANNEL,

                            message:
                                text,

                            image,

                            device_id:
                                deviceId
                        })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Failed to send."
            );
        }

        messageInput.value = "";

        messageInput.style.height =
            "auto";

        selectedFile = null;

        imageInput.value = "";

        attachBtn.textContent =
            "＋";

        await load();

    } catch(error) {

        alert(
            "Failed to send:\n\n" +
            error.message
        );

    } finally {

        sendBtn.disabled = false;
    }
}

function resizeImage(file){

    return new Promise(
        (resolve,reject) => {

            const reader =
                new FileReader();

            reader.onload = () => {

                const img =
                    new Image();

                img.onload = () => {

                    let width =
                        img.width;

                    let height =
                        img.height;

                    const max =
                        1500;

                    if (
                        width > max ||
                        height > max
                    ) {

                        const scale =
                            Math.min(
                                max / width,
                                max / height
                            );

                        width =
                            Math.round(
                                width *
                                scale
                            );

                        height =
                            Math.round(
                                height *
                                scale
                            );
                    }

                    const canvas =
                        document.createElement(
                            "canvas"
                        );

                    canvas.width =
                        width;

                    canvas.height =
                        height;

                    const ctx =
                        canvas.getContext(
                            "2d"
                        );

                    ctx.drawImage(
                        img,
                        0,
                        0,
                        width,
                        height
                    );

                    resolve(
                        canvas.toDataURL(
                            "image/jpeg",
                            .78
                        )
                    );
                };

                img.onerror =
                    reject;

                img.src =
                    reader.result;
            };

            reader.onerror =
                reject;

            reader.readAsDataURL(
                file
            );
        }
    );
}

/*
=========================================================
GAME SYNC
=========================================================

Games ALWAYS synchronize every 0.5 seconds,
independently from the normal chat refresh.
=========================================================
*/

async function syncGames(){

    try {

        const response =
            await fetch(
                API_URL +
                "?channel=" +
                encodeURIComponent(
                    CHANNEL
                ),
                {
                    cache:"no-store"
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            return;
        }

        const newGames =
            Array.isArray(
                data.games
            )
                ? data.games
                : [];

        /*
        Replace local game states.

        This also automatically removes a game
        locally when the server deleted its
        temporary hidden message.
        */

        currentGames =
            newGames;

        render();

    } catch {

        /*
        Don't spam the user if a single
        synchronization request fails.
        */
    }
}


function startGameSync(){

    if (gameTimer) {

        clearInterval(
            gameTimer
        );
    }

    gameTimer =
        setInterval(
            syncGames,
            GAME_SYNC
        );
}


/*
=========================================================
TIME
=========================================================
*/

function formatTime(date){

    if (!date) {
        return "";
    }

    return new Date(
        date
    ).toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}


function escapeHtml(value){

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}
