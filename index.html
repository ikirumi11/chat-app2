<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat App 2</title>
<style>
:root{--bg:#08090d;--panel:#11131a;--panel2:#171a23;--line:#282c38;--text:#f5f7fb;--muted:#8f96a6;--accent:#756cff;--accent2:#5b52ed}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:radial-gradient(circle at 50% -20%,#24223d 0,#0c0d12 45%,#08090d 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}button{border:0;color:white;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:13px;padding:11px 15px;cursor:pointer;transition:transform .18s,filter .18s,box-shadow .18s}button:hover{filter:brightness(1.12);transform:translateY(-1px);box-shadow:0 8px 24px #0005}button:active{transform:scale(.97)}
input{border:1px solid var(--line);background:#0d0f15;color:white;border-radius:13px;padding:12px 14px;outline:none;transition:border .2s,box-shadow .2s}input:focus{border-color:#6f68ff;box-shadow:0 0 0 3px #756cff18}.hidden{display:none!important}
.app{height:100%;max-width:1050px;margin:auto;display:flex;flex-direction:column;animation:appIn .45s ease}.top{min-height:72px;padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px;background:#0b0c11d9;backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:11px}.logo,.heroLogo{background:linear-gradient(135deg,#857dff,#5148db);box-shadow:0 10px 30px #635bff38}.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:900}.title{font-weight:800;font-size:17px}.status{font-size:12px;color:var(--muted);margin-top:2px}.topActions{display:flex;gap:8px}.ghost{background:#181b24;border:1px solid var(--line);color:#e7e9ef;box-shadow:none}
.room{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;background:#0d0f14}.room input{flex:1;min-width:0}.room button{white-space:nowrap}
.messages{flex:1;overflow:auto;padding:22px 18px;scroll-behavior:smooth}.messages::-webkit-scrollbar{width:8px}.messages::-webkit-scrollbar-thumb{background:#2b2f3a;border-radius:10px}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);animation:float 3s ease-in-out infinite}.emptyIcon{font-size:42px;margin-bottom:10px}
.msg{max-width:min(78%,650px);margin:0 0 13px;padding:11px 13px;border:1px solid #292d38;background:linear-gradient(145deg,#171a22,#11131a);border-radius:17px 17px 17px 5px;animation:msgIn .28s cubic-bezier(.2,.8,.2,1)}.msg.mine{margin-left:auto;background:linear-gradient(145deg,#5f57e8,#4941bf);border-color:#716aff;border-radius:17px 17px 5px 17px}
.name{font-size:11px;color:#aeb4c3;margin-bottom:4px;font-weight:700}.mine .name{color:#dddfff}.text{white-space:pre-wrap;word-break:break-word;line-height:1.45}
.fileCard{margin-top:7px;border-radius:13px;overflow:hidden;background:#080a0f35;border:1px solid #ffffff18}.fileCard img,.fileCard video{display:block;width:100%;max-height:390px;object-fit:contain;background:#050608}.fileMeta{padding:10px 11px;display:flex;align-items:center;gap:9px}.fileIcon{font-size:24px}.fileInfo{min-width:0;flex:1}.fileName{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fileSize{font-size:11px;opacity:.65;margin-top:2px}.download{padding:8px 10px;border-radius:10px;flex:none;color:white;text-decoration:none;background:#ffffff16}
.progress{height:3px;background:#ffffff14}.progress i{display:block;height:100%;width:0;background:#9b95ff;transition:width .15s}
.send{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:9px;background:#0b0d12e8;backdrop-filter:blur(18px)}.send input{flex:1;min-width:0}.attach{width:46px;padding:0;font-size:22px;background:#181b24;border:1px solid var(--line);box-shadow:none}.sendBtn{width:82px}
.panel{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 10%,#28254a 0,#0a0b10 55%,#07080b 100%);z-index:10}.card{width:min(460px,100%);padding:30px;border:1px solid #303442;background:#11131ddd;backdrop-filter:blur(24px);border-radius:25px;box-shadow:0 30px 90px #0009;animation:cardIn .5s cubic-bezier(.2,.8,.2,1)}.heroLogo{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:27px;font-weight:900;margin-bottom:18px}.card h1{margin:0;font-size:29px;letter-spacing:-.7px}.card p{color:#9da3b2;line-height:1.55;margin:9px 0 20px}.row{display:flex;gap:9px;margin-top:10px}.row>*{flex:1}.small{font-size:12px;color:#707787;margin-top:13px}.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);padding:10px 14px;border-radius:12px;background:#171a22;border:1px solid #343846;opacity:0;pointer-events:none;transition:.25s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes appIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media(max-width:600px){.top{padding:12px}.messages{padding:16px 11px}.msg{max-width:88%}.room input{font-size:13px}.sendBtn{width:62px}.card{padding:24px}.topActions .ghost:first-child{display:none}}
</style>
</head>
<body>
<div id="join" class="panel"><div class="card"><div class="heroLogo">✦</div><h1>Chat App 2</h1><p>Fast browser-to-browser chat with text, images, videos and files. Media is sent through the connected WebRTC peers.</p><input id="name" maxlength="30" placeholder="Your name"><div class="row"><input id="room" maxlength="40" placeholder="Room code"><button id="joinBtn">Join room</button></div><div class="small">Use the same room code on each browser. Signaling only helps peers find each other.</div></div></div>
<div id="app" class="app hidden"><header class="top"><div class="brand"><div class="logo">✦</div><div><div class="title">Chat App 2</div><div id="status" class="status">Connecting…</div></div></div><div class="topActions"><button id="copyBtn" class="ghost">Copy room</button><button id="leaveBtn" class="ghost">Leave</button></div></header><div class="room"><input id="roomDisplay" readonly><button id="copyRoomBtn">Copy</button></div><main id="messages" class="messages"><div class="empty"><div><div class="emptyIcon">✦</div><div>Join the room from another browser to start chatting.</div></div></div></main><form id="send" class="send"><input id="fileInput" type="file" multiple accept="image/*,video/*,*/*" class="hidden"><button type="button" id="attachBtn" class="attach" title="Send files">＋</button><input id="message" autocomplete="off" placeholder="Write a message…"><button class="sendBtn">Send</button></form></div><div id="toast" class="toast"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=id=>document.getElementById(id);let peer=null,room="",name="",connections=new Map(),transfers=new Map();const CHUNK=48*1024;
const clean=s=>String(s||"").trim().replace(/[^a-zA-Z0-9_-]/g,"-").slice(0,40),formatSize=n=>n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":n<1073741824?(n/1048576).toFixed(1)+" MB":(n/1073741824).toFixed(1)+" GB";
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>$("toast").classList.remove("show"),1800)}
function setStatus(){let n=connections.size;$("status").textContent=n?n+" peer"+(n===1?"":"s")+" connected":"Waiting for peers"}
function scroll(){let b=$("messages");b.scrollTop=b.scrollHeight}
function renderFile(f){
 let card=document.createElement("div");card.className="fileCard",url=URL.createObjectURL(f.blob);
 if(f.type.startsWith("image/")){let x=document.createElement("img");x.src=url;x.alt=f.name;card.append(x)}
 else if(f.type.startsWith("video/")){let x=document.createElement("video");x.src=url;x.controls=true;x.playsInline=true;card.append(x)}
 let meta=document.createElement("div");meta.className="fileMeta";let icon=document.createElement("div");icon.className="fileIcon";icon.textContent=f.type.startsWith("image/")?"🖼️":f.type.startsWith("video/")?"🎬":"📎";let info=document.createElement("div");info.className="fileInfo";let nm=document.createElement("div");nm.className="fileName";nm.textContent=f.name;let sz=document.createElement("div");sz.className="fileSize";sz.textContent=formatSize(f.size);info.append(nm,sz);let dl=document.createElement("a");dl.className="download";dl.textContent="Save";dl.href=url;dl.download=f.name;meta.append(icon,info,dl);card.append(meta);return card
}
function addMessage(d,mine=false){
 let box=$("messages"),empty=box.querySelector(".empty");if(empty)empty.remove();let el=document.createElement("div");el.className="msg"+(mine?" mine":"");let n=document.createElement("div");n.className="name";n.textContent=mine?"You":d.name||"Guest";el.append(n);if(d.text){let t=document.createElement("div");t.className="text";t.textContent=d.text;el.append(t)}if(d.file)el.append(renderFile(d.file));box.append(el);scroll()
}
function broadcast(d,except){for(let [id,c] of connections)if(id!==except&&c.open)try{c.send(d)}catch(e){}}
function receiveChunk(d,from){
 let t=transfers.get(d.id);if(!t){t={name:d.name,size:d.size,type:d.mime,chunks:[],received:0,total:d.total};transfers.set(d.id,t)}
 t.chunks[d.index]=d.chunk;t.received++;broadcast(d,from);
 if(d.end){let blob=new Blob(t.chunks,{type:t.type||"application/octet-stream"});transfers.delete(d.id);addMessage({name:d.sender||"Guest",file:{name:t.name,size:t.size,type:t.type,blob}},false)}
}
async function sendFile(file){
 if(!connections.size){toast("Connect to a peer first");return}
 let id=name+"-"+Date.now()+"-"+Math.random().toString(36).slice(2),total=Math.ceil(file.size/CHUNK)||1;addMessage({file:{name:file.name,size:file.size,type:file.type,blob:file}},true);
 let msg=$("messages").lastElementChild,bar=document.createElement("div");bar.className="progress";let i=document.createElement("i");bar.append(i);msg.querySelector(".fileCard").append(bar);
 for(let n=0;n<total;n++){let chunk=await file.slice(n*CHUNK,(n+1)*CHUNK).arrayBuffer();broadcast({type:"file",id,name:file.name,size:file.size,mime:file.type,total,index:n,chunk,sender:name,end:n===total-1});i.style.width=((n+1)/total*100)+"%";await new Promise(r=>setTimeout(r,0))}setTimeout(()=>bar.remove(),500)
}
function attach(c){
 connections.set(c.peer,c);setStatus();c.on("open",()=>{setStatus();try{c.send({type:"hello",name})}catch(e){}});c.on("data",d=>{if(d.type==="hello"){if(d.name)addMessage({name:d.name,text:"joined the room"});return}if(d.type==="chat"){addMessage(d);broadcast(d,c.peer);return}if(d.type==="file"){receiveChunk(d,c.peer)}});c.on("close",()=>{connections.delete(c.peer);setStatus()});c.on("error",()=>{connections.delete(c.peer);setStatus()})
}
function connectTo(id){if(!peer||id===peer.id||connections.has(id))return;attach(peer.connect(id,{reliable:true}))}
function start(){
 room=clean($("room").value)||Math.random().toString(36).slice(2,8);name=($("name").value.trim()||"Guest").slice(0,30);$("roomDisplay").value=room;$("join").classList.add("hidden");$("app").classList.remove("hidden");let prefix="p2p-chat-"+room+"-";peer=new Peer(prefix+Math.random().toString(36).slice(2,8),{host:"0.peerjs.com",port:443,path:"/",secure:true});
 peer.on("open",id=>{setStatus();let key="p2p-known-"+room,known=[];try{known=JSON.parse(localStorage.getItem(key)||"[]")}catch(e){}known.filter(x=>x!==id).forEach(connectTo);known.push(id);localStorage.setItem(key,JSON.stringify([...new Set(known)].slice(-30)))});peer.on("connection",attach);peer.on("error",e=>{toast("Connection error: "+e.type);$("status").textContent="Connection error"})
}
$("joinBtn").onclick=start;$("room").addEventListener("keydown",e=>{if(e.key==="Enter")start()});
$("send").onsubmit=e=>{e.preventDefault();let text=$("message").value.trim();if(!text)return;let d={type:"chat",name,text,time:Date.now()};addMessage(d,true);broadcast(d);$("message").value="";$("message").focus()};
$("attachBtn").onclick=()=>$("fileInput").click();$("fileInput").onchange=e=>{[...e.target.files].forEach(sendFile);e.target.value=""};
async function copyRoom(){try{await navigator.clipboard.writeText(room);toast("Room code copied")}catch(e){toast(room)}}$("copyBtn").onclick=copyRoom;$("copyRoomBtn").onclick=copyRoom;$("leaveBtn").onclick=()=>location.reload();
</script></body></html>
