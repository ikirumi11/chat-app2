<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat - Multiplayer Games</title>

<style>
*{
    box-sizing:border-box;
}

:root{
    --bg:#0b0d10;
    --panel:#111419;
    --panel2:#181c22;
    --panel3:#20252d;
    --border:#292f38;
    --text:#edf0f4;
    --muted:#7e8793;
    --accent:#e8eaed;
    --danger:#ff7070;
    --green:#70e0a0;
    --yellow:#e5c66b;
    --radius:12px;
    --text-size:16px;
    --word-spacing:0px;
    --line-spacing:1.45;
    --ui-scale:1;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

body{
    overflow:hidden;
    font-size:calc(16px * var(--ui-scale));
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:64px;
    min-height:64px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel);
    border-bottom:1px solid var(--border);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
}

.logo-icon{
    width:35px;
    height:35px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:var(--panel2);
    border:1px solid var(--border);
}

.channel{
    color:var(--muted);
    font-weight:400;
}

.header-actions{
    display:flex;
    gap:7px;
}

.icon-btn{
    width:39px;
    height:39px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
}

.icon-btn:hover{
    filter:brightness(1.15);
}

/* MESSAGES */

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    display:flex;
    gap:11px;
    margin-bottom:17px;
}

.avatar{
    flex:0 0 40px;
    width:40px;
    height:40px;
    display:grid;
    place-items:center;
    border-radius:var(--radius);
    background:var(--panel2);
    border:1px solid var(--border);
    font-weight:700;
}

.message-content{
    min-width:0;
    max-width:min(850px,calc(100vw - 90px));
}

.message-top{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:3px;
}

.username{
    font-weight:700;
}

.time,
.edited{
    color:var(--muted);
    font-size:11px;
}

.message-text{
    color:#d8dde4;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    font-size:var(--text-size);
    word-spacing:var(--word-spacing);
    line-height:var(--line-spacing);
}

/* GAME CARDS */

.game-message{
    margin:0 auto 18px;
    max-width:900px;
}

.game-card{
    border:1px solid var(--border);
    border-radius:16px;
    background:linear-gradient(
        145deg,
        var(--panel2),
        #101318
    );
    overflow:hidden;
    box-shadow:0 12px 40px #0005;
}

.game-header{
    padding:17px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
}

.game-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:18px;
    font-weight:800;
}

.game-status{
    font-size:12px;
    padding:6px 9px;
    border-radius:999px;
    background:#252b33;
    color:#bfc6cf;
}

.game-body{
    padding:18px;
}

.game-info{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:15px;
}

.game-pill{
    padding:7px 10px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#13171d;
    color:#bfc6cf;
    font-size:12px;
}

.game-pill strong{
    color:white;
}

.game-description{
    color:#969faa;
    margin-bottom:16px;
    line-height:1.45;
}

.game-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.game-btn{
    border:1px solid var(--border);
    border-radius:9px;
    padding:10px 14px;
    background:#222830;
    color:white;
    font-weight:700;
}

.game-btn:hover{
    filter:brightness(1.15);
}

.game-btn.primary{
    background:#e8eaed;
    color:#111;
}

.game-btn.green{
    background:#193b2b;
    border-color:#2c6348;
    color:#9bf0bc;
}

.game-btn.danger{
    background:#3a1c20;
    border-color:#71333b;
    color:#ff9292;
}

.game-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.game-btn.boss{
    background:#4a1a2a;
    border-color:#8a3a5a;
    color:#ff8aaa;
    font-size:18px;
    padding:15px 25px;
}

.game-btn.boss:hover:not(:disabled){
    background:#5a2a3a;
}

/* PLAYERS */

.players-list{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin:13px 0;
}

.player-chip{
    padding:7px 10px;
    border-radius:8px;
    background:#13171d;
    border:1px solid var(--border);
    font-size:12px;
}

.player-chip.host{
    border-color:#65552a;
    color:#ead17a;
}

.turn-banner{
    margin:12px 0;
    padding:11px 13px;
    border-radius:10px;
    background:#151a20;
    border:1px solid var(--border);
    color:#c8ced6;
}

.turn-banner strong{
    color:white;
}

/* TIC TAC TOE */

.ttt{
    display:grid;
    gap:5px;
    justify-content:center;
    margin:15px auto;
}

.ttt button{
    border-radius:8px;
    border:1px solid var(--border);
    background:#11151b;
    color:white;
    font-size:28px;
    font-weight:900;
    transition:0.15s;
}

.ttt button:hover:not(:disabled){
    background:#222831;
}

/* 4 IN A ROW */

.four-row-board{
    display:grid;
    gap:4px;
    padding:8px;
    margin:10px auto;
    background:#11161d;
    border:1px solid var(--border);
    border-radius:12px;
}

.four-row-cell{
    border-radius:50%;
    background:#252b33;
    border:1px solid #343b45;
    transition:0.15s;
}

.four-row-cell.red{
    background:#d65353;
}

.four-row-cell.yellow{
    background:#e0c454;
}

.four-row-cell:hover:not(.taken){
    opacity:0.7;
    cursor:pointer;
}

/* REACTION TIME */

.reaction-area{
    text-align:center;
    padding:20px;
}

.reaction-box{
    width:200px;
    height:200px;
    margin:15px auto;
    border-radius:20px;
    border:3px solid var(--border);
    display:grid;
    place-items:center;
    font-size:24px;
    font-weight:700;
    transition:0.2s;
    cursor:pointer;
    background:#1a1f26;
    color:var(--muted);
}

.reaction-box.waiting{
    background:#1a1f26;
    color:var(--muted);
}

.reaction-box.ready{
    background:#1a3a2a;
    border-color:#2a6a4a;
    color:#7affb0;
}

.reaction-box.go{
    background:#3a1a1a;
    border-color:#6a2a2a;
    color:#ff7a7a;
}

.reaction-box.done{
    background:#2a2a4a;
    border-color:#4a4a7a;
    color:#aaaaff;
}

/* BOSS BATTLE */

.boss-area{
    text-align:center;
    padding:10px;
}

.boss-health-bar{
    width:100%;
    max-width:500px;
    height:30px;
    margin:10px auto;
    background:#1a1a1a;
    border-radius:15px;
    border:2px solid #333;
    overflow:hidden;
    position:relative;
}

.boss-health-fill{
    height:100%;
    background:linear-gradient(90deg,#ff3333,#ff6a33);
    border-radius:15px;
    transition:width 0.3s ease;
    width:100%;
}

.boss-health-text{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    font-weight:700;
    font-size:14px;
    color:white;
    text-shadow:0 0 10px rgba(0,0,0,0.8);
}

.boss-stats{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin:10px 0;
    color:#9da5b0;
    font-size:14px;
}

.boss-stats strong{
    color:white;
}

.boss-upgrades{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    margin:10px 0;
}

.boss-upgrade-btn{
    padding:8px 16px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#1a1f26;
    color:white;
    font-size:12px;
    transition:0.15s;
}

.boss-upgrade-btn:hover:not(:disabled){
    background:#2a303a;
    transform:scale(1.05);
}

.boss-upgrade-btn:disabled{
    opacity:0.3;
    cursor:not-allowed;
}

.boss-upgrade-btn .cost{
    color:#ffcc44;
    font-weight:700;
}

.boss-damage-display{
    font-size:32px;
    font-weight:900;
    color:#ff6a33;
    margin:5px 0;
}

.boss-monster-name{
    font-size:28px;
    font-weight:900;
    color:#ff4466;
    text-shadow:0 0 20px rgba(255,68,102,0.3);
}

.boss-turn-indicator{
    margin:10px 0;
    padding:10px;
    border-radius:10px;
    background:#151a20;
    border:1px solid var(--border);
}

/* COMPOSER */

.composer{
    padding:12px 16px 16px;
    background:var(--panel);
    border-top:1px solid var(--border);
}

.composer-box{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:8px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:14px;
}

textarea{
    flex:1;
    min-height:42px;
    max-height:150px;
    resize:none;
    border:0;
    outline:none;
    background:transparent;
    color:white;
    padding:10px;
}

.send-btn{
    height:42px;
    border:0;
    border-radius:9px;
    padding:0 18px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

.send-btn:disabled{
    opacity:.5;
}

/* OVERLAYS */

.overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000b;
    z-index:100;
}

.overlay.show{
    display:flex;
}

.panel{
    width:min(620px,calc(100vw - 25px));
    max-height:calc(100vh - 25px);
    overflow-y:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
    box-shadow:0 25px 80px #000b;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px;
    border-bottom:1px solid var(--border);
}

.panel-header h2{
    margin:0;
}

.panel-body{
    padding:18px;
}

/* CATEGORIES */

.category{
    margin-bottom:12px;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    background:var(--panel2);
}

.category-title{
    width:100%;
    padding:14px;
    border:0;
    background:transparent;
    color:var(--text);
    display:flex;
    justify-content:space-between;
    font-weight:700;
    text-align:left;
}

.category-body{
    display:none;
    padding:0 14px 14px;
}

.category.open .category-body{
    display:block;
}

.setting{
    margin-top:14px;
}

.setting label{
    display:block;
    margin-bottom:7px;
    color:#aab2bd;
    font-size:13px;
}

.setting input,
.setting select{
    width:100%;
    padding:10px;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
    background:#101419;
    color:white;
}

.setting input[type=range]{
    padding:0;
}

.setting-value{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.save-btn{
    width:100%;
    margin-top:8px;
    padding:12px;
    border:0;
    border-radius:9px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

/* GAME CREATOR */

.game-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.game-choice{
    min-height:80px;
    padding:13px;
    text-align:left;
    border-radius:12px;
    border:1px solid var(--border);
    background:#151a20;
    color:white;
    font-size:13px;
}

.game-choice:hover{
    background:#20262e;
}

.game-choice strong{
    display:block;
    margin-bottom:3px;
    font-size:15px;
}

.game-choice span{
    color:#818b97;
    font-size:11px;
}

.game-choice .game-players{
    display:inline-block;
    background:#1a1f26;
    padding:1px 8px;
    border-radius:10px;
    color:#aab2bd;
    font-size:10px;
    margin-top:4px;
}

.game-choice .game-options{
    font-size:10px;
    color:#6a7a8a;
    margin-top:3px;
}

/* DANGER */

.danger-zone{
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid #402529;
}

.danger-title{
    color:var(--danger);
    font-weight:700;
    margin-bottom:7px;
}

.danger-zone p{
    color:var(--muted);
    line-height:1.45;
}

.danger-btn{
    width:100%;
    padding:12px;
    border-radius:9px;
    border:1px solid #743333;
    background:#241719;
    color:#ff8585;
}

/* EMPTY */

.empty{
    height:100%;
    min-height:200px;
    display:grid;
    place-items:center;
    color:#656d78;
    text-align:center;
}

.empty strong{
    display:block;
    color:#aab2bd;
    margin-bottom:5px;
}

/* TYPE SENTENCE */

.type-area{
    text-align:center;
    padding:15px;
}

.type-sentence{
    font-size:24px;
    font-weight:700;
    color:white;
    padding:20px;
    background:#1a1f26;
    border-radius:12px;
    border:1px solid var(--border);
    margin:10px auto;
    max-width:600px;
    word-break:break-word;
}

.type-input{
    width:100%;
    max-width:500px;
    padding:12px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#101419;
    color:white;
    font-size:18px;
    text-align:center;
}

.type-input:focus{
    outline:2px solid var(--accent);
}

.type-stats{
    display:flex;
    justify-content:center;
    gap:20px;
    margin:10px 0;
    color:#9da5b0;
}

.type-stats strong{
    color:white;
}

@media(max-width:600px){

    .header{
        padding:0 11px;
    }

    .messages{
        padding:15px 11px;
    }

    .channel{
        display:none;
    }

    .message-content{
        max-width:calc(100vw - 70px);
    }

    .game-grid{
        grid-template-columns:1fr;
    }

    .ttt button{
        font-size:20px;
    }

    .reaction-box{
        width:150px;
        height:150px;
        font-size:18px;
    }

    .boss-monster-name{
        font-size:22px;
    }

    .type-sentence{
        font-size:18px;
        padding:15px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="logo">
        <div class="logo-icon">🎮</div>
        <span>Game Chat</span>
        <span class="channel"># general</span>
    </div>

    <div class="header-actions">

        <button
            class="icon-btn"
            id="gamesBtn"
            title="Games"
        >🎮</button>

        <button
            class="icon-btn"
            id="settingsBtn"
            title="Settings"
        >⚙</button>

    </div>

</header>

<main
    class="messages"
    id="messages"
></main>

<div class="composer">

    <div class="composer-box">

        <textarea
            id="messageInput"
            rows="1"
            placeholder="Message #general"
        ></textarea>

        <button
            class="send-btn"
            id="sendBtn"
        >Send</button>

    </div>

</div>

</div>


<!-- GAME CREATOR -->

<div
    class="overlay"
    id="gamesOverlay"
>

<div class="panel">

<div class="panel-header">

    <h2>🎮 Create Game</h2>

    <button
        class="icon-btn"
        id="closeGames"
    >×</button>

</div>

<div class="panel-body">

<p style="color:#929aa5;line-height:1.5">
Choose a game to create a lobby. Others can join before you start.
</p>

<div class="game-grid">

<button class="game-choice" data-game="ttt">
    <strong>⭕ Tic-Tac-Toe</strong>
    <span>Classic 3x3, 4x4, 5x5 or 6x6</span>
    <div class="game-players">2 players</div>
    <div class="game-options">Board size: 3-6</div>
</button>

<button class="game-choice" data-game="fourrow">
    <strong>🔴 4 in a Row</strong>
    <span>Connect 4 discs to win</span>
    <div class="game-players">2 players</div>
    <div class="game-options">7x6 or 8x7 board</div>
</button>

<button class="game-choice" data-game="reaction">
    <strong>⚡ Reaction Time</strong>
    <span>Click when the screen turns green</span>
    <div class="game-players">2-6 players</div>
</button>

<button class="game-choice" data-game="type">
    <strong>⌨️ Type Sentence</strong>
    <span>Type the sentence as fast as you can</span>
    <div class="game-players">2-6 players</div>
</button>

<button class="game-choice" data-game="boss">
    <strong>👹 Boss Battle</strong>
    <span>Upgrade weapons, defeat the monster!</span>
    <div class="game-players">2-6 players</div>
</button>

</div>

</div>
</div>
</div>


<!-- SETTINGS -->

<div
    class="overlay"
    id="settingsOverlay"
>

<div class="panel">

<div class="panel-header">

    <h2>Settings</h2>

    <button
        class="icon-btn"
        id="closeSettings"
    >×</button>

</div>

<div class="panel-body">

<div class="category open">

<button class="category-title">
    <span>👤 Profile</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Your name</label>

<input
    id="usernameInput"
    maxlength="24"
    placeholder="Enter your name"
>

</div>

<div class="setting">

<label>Device ID</label>

<input
    id="deviceIdInput"
    readonly
>

</div>

</div>
</div>


<div class="category">

<button class="category-title">
    <span>📝 Text</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Text size</label>

<input
    id="textSize"
    type="range"
    min="12"
    max="24"
    value="16"
>

<div
    class="setting-value"
    id="textSizeValue"
></div>

</div>

<div class="setting">

<label>Word spacing</label>

<input
    id="wordSpacing"
    type="range"
    min="0"
    max="12"
    value="0"
>

<div
    class="setting-value"
    id="wordSpacingValue"
></div>

</div>

<div class="setting">

<label>Line spacing</label>

<input
    id="lineSpacing"
    type="range"
    min="1"
    max="2"
    step=".05"
    value="1.45"
>

<div
    class="setting-value"
    id="lineSpacingValue"
></div>

</div>

</div>
</div>


<div class="category">

<button class="category-title">
    <span>💬 Chat</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Refresh rate</label>

<select id="refreshRate">

<option value="10000">10 seconds</option>
<option value="5000">5 seconds</option>
<option value="3000">3 seconds</option>
<option value="2000">2 seconds</option>
<option value="1000">1 second</option>
<option value="500" selected>0.5 seconds</option>
<option value="100">0.1 seconds</option>

</select>

</div>

<div class="setting">

<label>Show timestamps</label>

<select id="showTimestamps">
<option value="true">On</option>
<option value="false">Off</option>
</select>

</div>

</div>
</div>


<div class="category">

<button class="category-title">
    <span>🎨 Appearance</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Theme</label>

<select id="themeSelect">

<option value="dark">Dark</option>
<option value="midnight">Midnight</option>
<option value="slate">Slate</option>
<option value="black">Pure Black</option>
<option value="blue">Dark Blue</option>
<option value="purple">Dark Purple</option>
<option value="green">Dark Green</option>
<option value="red">Dark Red</option>
<option value="gray">Classic Gray</option>
<option value="light">Light</option>
<option value="oled">OLED</option>

<script>

/* =====================================================
   CONFIG

const API_URL="/api/messages";
const CHANNEL="general";

const GAME_PREFIX="__CHAT_GAME_STATE__:";


/* =====================================================
   DEVICE
===================================================== */

let deviceId=localStorage.getItem("chat_device_id");

if(!deviceId){

    if(window.crypto && crypto.randomUUID){
        deviceId=crypto.randomUUID();
    }else{
        deviceId=
            Date.now().toString(36)+

    }

    localStorage.setItem(
        "chat_device_id",

    );
}


/* =====================================================

===================================================== */

const defaults={

    username:"",
    refreshRate:500,

    showTimestamps:true,

    wordSpacing:0,
    lineSpacing:1.45,

    cornerRadius:12,
    uiScale:1,

    theme:"dark",

    enterToSend:true,
    autoScroll:true
};

function getSetting(key){

    const value=
        localStorage.getItem(
            "chat_"+key
        );

    if(value===null){
        return defaults[key];
    }

    if(
        value==="true" ||
        value==="false"
    ){
        return value==="true";
    }

    const number=Number(value);

    return Number.isNaN(number)

}

let settings={};

Object.keys(defaults).forEach(key=>{

/* =====================================================

/* =====================================================

===================================================== */

let currentMessages=[];

/* =====================================================

===================================================== */

function updateRangeLabels(){

        wordSpacing.value+"px";

function applySettings(){

    document.documentElement.style.setProperty(
        "--text-size",
        settings.textSize+"px"
    );

    document.documentElement.style.setProperty(
        "--word-spacing",
        settings.wordSpacing+"px"
    );

    document.documentElement.style.setProperty(
        "--line-spacing",
        settings.lineSpacing
    );

    document.documentElement.style.setProperty(
        "--radius",
        settings.cornerRadius+"px"
    );

    document.documentElement.style.setProperty(
        "--ui-scale",
        settings.uiScale
    );

    applyTheme(
        settings.theme
    );

    renderedElements.clear();
    seenMessageIds.clear();
    seenGameIds.clear();
    renderMessages();
    restartRefresh();
}


function applyTheme(name){

    const themes={

        dark:["#0b0d10","#111419"],
        midnight:["#080b14","#101522"],
        slate:["#101418","#171d22"],
        black:["#000","#090909"],
        blue:["#091018","#101c29"],
        purple:["#100b17","#191021"],
        green:["#09120d","#101b15"],
        red:["#140b0b","#1e1111"],
        gray:["#151515","#202020"],
        light:["#eeeeee","#ffffff"],
        oled:["#000","#000"]
    };

    const t=
        themes[name] ||
        themes.dark;

    document.documentElement.style.setProperty(
        "--bg",
        t[0]
    );

    document.documentElement.style.setProperty(
        "--panel",
        t[1]
    );

/* =====================================================
   SETTINGS EVENTS

settingsBtn.onclick=()=>{

document.querySelectorAll(
    ".category-title"
).forEach(button=>{

        button.parentElement
            .classList.toggle("open");

    };
});


[
    textSize,
    wordSpacing,
    lineSpacing,
    cornerRadius,
    uiScale
].forEach(input=>{

    input.addEventListener(
        "input",

    );

});


/* =====================================================
   CHAT SEND
===================================================== */

sendBtn.onclick=
    sendChatMessage;


messageInput.addEventListener(
    "keydown",
    event=>{

        if(
            event.key==="Enter" &&
            !event.shiftKey &&
            settings.enterToSend
        ){

            event.preventDefault();

            sendChatMessage();
        }

    }
);


messageInput.addEventListener(
    "input",
    ()=>{

        messageInput.style.height=
            "auto";

        messageInput.style.height=
            Math.min(
                messageInput.scrollHeight,
                150
            )+"px";
    }
);


async function sendChatMessage(){

    const text=
        messageInput.value
            .trim();

    if(!text)return;

    if(!settings.username){

        settingsBtn.click();

        alert(
            "Set your name in Settings first."
        );

        return;
    }

    sendBtn.disabled=true;

    try{

        await apiPost({

            username:
                settings.username,

            channel:
                CHANNEL,

            message:
                text,

            image:null,

            device_id:
                deviceId
        });

        messageInput.value="";
        messageInput.style.height=
            "auto";

        await loadMessages();

    }catch(error){

        alert(
            "Failed to send:\n\n"+
            error.message
        );

    }finally{

        sendBtn.disabled=false;

    }
}


/* =====================================================
   API
===================================================== */

async function apiPost(body){

    const response=
        await fetch(
            API_URL,
            {
                method:"POST",
                headers:{
                    "Content-Type":
                        "application/json"
                },
                body:
                    JSON.stringify(body)
            }
        );

    const data=
        await safeJson(response);

    if(!response.ok){

        throw new Error(
            data.error ||
            "Request failed."
        );
    }

    return data;
}


async function apiDelete(body){

    const response=
        await fetch(
            API_URL,
            {
                method:"DELETE",
                headers:{
                    "Content-Type":
                        "application/json"
                },
                body:
                    JSON.stringify(body)
            }
        );

    const data=
        await safeJson(response);

    if(!response.ok){

        throw new Error(
            data.error ||
            "Delete failed."
        );
    }

    return data;
}


async function apiPatch(body){

    const response=
        await fetch(
            API_URL,
            {
                method:"PATCH",
                headers:{
                    "Content-Type":
                        "application/json"
                },
                body:
                    JSON.stringify(body)
            }
        );

    const data=
        await safeJson(response);

    if(!response.ok){

        throw new Error(
            data.error ||
            "Update failed."
        );
    }

    return data;
}


async function safeJson(response){

    const text=
        await response.text();

    if(!text)return {};

    try{
        return JSON.parse(text);
    }catch{
        return {
            error:text
        };
    }
}


/* =====================================================
   LOAD MESSAGES
===================================================== */

async function loadMessages(){

    if(syncing)return;

    syncing=true;

    try{

        const response=
            await fetch(
                API_URL+
                "?channel="+
                encodeURIComponent(
                    CHANNEL
                )+
                "&_="+
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        const data=
            await safeJson(response);

        if(!response.ok){

            throw new Error(
                data.error ||
                "Failed to load messages."
            );
        }

        const newMessages=
            Array.isArray(
                data.messages
            )
            ?data.messages
            :[];

        const changeInfo = getMessageChanges(currentMessages, newMessages);
        
        if (changeInfo.changed) {
            let hasNewMessages = false;
            let hasNewGames = false;
            
            for (const msg of newMessages) {
                if (!seenMessageIds.has(msg.id)) {
                    if (!isGameMessage(msg)) {
                        hasNewMessages = true;
                    }
                    seenMessageIds.add(msg.id);
                }
            }
            
            const oldGames = [...games];
            currentMessages = newMessages;
            processGameMessages();
            
            for (const game of games) {
                if (!seenGameIds.has(game.id)) {
                    hasNewGames = true;
                    seenGameIds.add(game.id);
                }
            }
            
            const oldGameIds = new Set(oldGames.map(g => g.id));
            const newGameIds = new Set(games.map(g => g.id));
            for (const id of oldGameIds) {
                if (!newGameIds.has(id)) {
                    seenGameIds.delete(id);
                }
            }
            
            const shouldScroll = settings.autoScroll && (hasNewMessages || hasNewGames);
            const wasNearBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 100;
            
            renderMessages(shouldScroll || (wasNearBottom && settings.autoScroll));
        }

    }catch(error){

        if(
            !currentMessages.length
        ){

            messagesEl.innerHTML=`
                <div class="empty">
                    <div>
                        <strong>Unable to load messages</strong>
                        ${escapeHtml(
                            error.message
                        )}
                    </div>
                </div>
            `;
        }

    }finally{

        syncing=false;
    }
}

function getMessageChanges(oldMessages, newMessages) {
    if (oldMessages.length !== newMessages.length) {
        return { changed: true };
    }
    
    let changed = false;
    for (let i = 0; i < oldMessages.length; i++) {
        const oldMsg = oldMessages[i];
        const newMsg = newMessages[i];
        
        if (oldMsg.id !== newMsg.id || 
            oldMsg.message !== newMsg.message || 
            oldMsg.username !== newMsg.username || 
            oldMsg.edited !== newMsg.edited) {
            changed = true;
            break;
        }
    }
    
    return { changed };
}


/* =====================================================
   GAME MESSAGE PARSING
===================================================== */

function isGameMessage(message){

    return (
        message &&
        typeof message.message==="string" &&
        message.message.startsWith(
            GAME_PREFIX
        )
    );
}


function parseGameMessage(message){

    if(!isGameMessage(message)){
        return null;
    }

    try{

        return JSON.parse(
            message.message.substring(
                GAME_PREFIX.length
            )
        );

    }catch{

        return null;
    }
}


function processGameMessages(){

    const map=new Map();

    for(const message of currentMessages){

        if(!isGameMessage(message)){
            continue;
        }

        const state=
            parseGameMessage(message);

        if(!state){
            continue;
        }

        if(
            state.type!=="game"
        ){
            continue;
        }

        map.set(
            state.id,
            {
                ...state,
                messageId:
                    message.id,
                hostDeviceId:
                    state.hostDeviceId ||
                    message.device_id ||
                    ""
            }
        );
    }

    games=[
        ...map.values()
    ];
}


/* =====================================================
   RENDER MESSAGES
===================================================== */

function renderMessages(shouldAutoScroll){

    const normal =
        currentMessages.filter(
            message =>
                !isGameMessage(message)
        );

    const activeGames =
        games.filter(
            game =>
                game.status !== "finished" &&
                game.status !== "forcequit"
        );

    if (!normal.length && !activeGames.length) {
        messagesEl.innerHTML = `
            <div class="empty">
                <div>
                    <strong>No messages yet</strong>
                    Be the first to send something.
                </div>
            </div>
        `;
        renderedElements.clear();
        return;
    }

    const fragment = document.createDocumentFragment();
    const elementIds = [];

    for (const message of normal) {
        const item = createMessageElement(message);
        fragment.appendChild(item);
        elementIds.push('msg_' + message.id);
    }

    for (const game of activeGames) {
        const gameEl = createGameElement(game);
        fragment.appendChild(gameEl);
        elementIds.push('game_' + game.id);
    }

    const currentChildren = messagesEl.children;
    const currentIds = [];

    for (let i = 0; i < currentChildren.length; i++) {
        const child = currentChildren[i];
        if (child.dataset && child.dataset.id) {
            currentIds.push(child.dataset.id);
        } else {
            currentIds.push('__temp_' + i);
        }
    }

    const newChildren = Array.from(fragment.children);
    
    if (currentIds.length !== elementIds.length || 
        currentIds.some((id, idx) => id !== elementIds[idx])) {
        
        messagesEl.replaceChildren(fragment);
        
        renderedElements.clear();
        for (let i = 0; i < newChildren.length; i++) {
            const el = newChildren[i];
            if (el.dataset && el.dataset.id) {
                renderedElements.set(el.dataset.id, el);
            }
        }
        
        if (shouldAutoScroll && settings.autoScroll) {
            requestAnimationFrame(() => {
                messagesEl.scrollTop = messagesEl.scrollHeight;
            });
        }
        
        return;
    }

    let hasNewElement = false;
    
    for (let i = 0; i < newChildren.length; i++) {
        const newEl = newChildren[i];
        const oldEl = currentChildren[i];
        
        if (newEl.dataset && newEl.dataset.id !== oldEl.dataset.id) {
            hasNewElement = true;
        }
        
        if (newEl.dataset && newEl.dataset.id === oldEl.dataset.id) {
            oldEl.replaceWith(newEl);
            renderedElements.set(newEl.dataset.id, newEl);
        } else {
            oldEl.replaceWith(newEl);
            if (newEl.dataset && newEl.dataset.id) {
                renderedElements.set(newEl.dataset.id, newEl);
            }
            hasNewElement = true;
        }
    }

    const validIds = new Set(elementIds);
    for (const [id, el] of renderedElements) {
        if (!validIds.has(id)) {
            renderedElements.delete(id);
        }
    }

    if (shouldAutoScroll && settings.autoScroll) {
        requestAnimationFrame(() => {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        });
    }
}


/* =====================================================
   CREATE MESSAGE ELEMENT
===================================================== */

function createMessageElement(message) {

    const item =
        document.createElement("div");

    item.className = "message";
    item.dataset.id = 'msg_' + message.id;

    const avatar =
        document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
        (
            message.username ||
            "?"
        )
        .charAt(0)
        .toUpperCase();

    const content =
        document.createElement("div");

    content.className =
        "message-content";

    const top =
        document.createElement("div");

    top.className =
        "message-top";

    const name =
        document.createElement("span");

    name.className =
        "username";

    name.textContent =
        message.username ||
        "User";

    top.appendChild(name);

    if (settings.showTimestamps) {

        const time =
            document.createElement("span");

        time.className = "time";

        time.textContent =
            formatTime(
                message.created_at
            );

        top.appendChild(time);
    }

    if (message.edited) {

        const edited =
            document.createElement("span");

        edited.className =
            "edited";

        edited.textContent =
            "(edited)";

        top.appendChild(edited);
    }

    content.appendChild(top);

    if (message.message) {

        const text =
            document.createElement("div");

        text.className =
            "message-text";

        text.textContent =
            message.message;

        content.appendChild(text);
    }

    item.appendChild(avatar);
    item.appendChild(content);

    return item;
}


/* =====================================================
   GAME CREATION
===================================================== */

document.querySelectorAll(
    ".game-choice"
).forEach(button=>{

    button.onclick=()=>{

        createGame(
            button.dataset.game
        );
    };
});


async function createGame(gameType){

    if(!settings.username){

        settingsBtn.click();

        alert(
            "Set your name before creating a game."
        );

        return;
    }

    const existing=
        games.find(
            game=>
                game.hostDeviceId===
                    deviceId &&
                game.status!=="finished" &&
                game.status!=="forcequit"
        );

    if(existing){

        alert(
            "You are already hosting a game."
        );

        gamesOverlay.classList.remove(
            "show"
        );

        return;
    }

    const info=
        GAME_TYPES[gameType];

    if(!info)return;

    const game={

        type:"game",

        id:
            "game_"+

            Date.now().toString(36)+

            "_"+

            Math.random()
                .toString(36)
                .slice(2,8),

        gameType,

        name:
            info.name,

        icon:
            info.icon,

        host:
            settings.username,

        hostDeviceId:
            deviceId,

        status:
            "lobby",

        players:[

            {
                deviceId,
                username:
                    settings.username
            }

        ],

        maxPlayers:
            info.max,

        turnIndex:0,

        createdAt:
            Date.now(),

        board:[],

        winner:null,

        data:{}
    };

    // Game-specific options
    if (gameType === "ttt") {
        game.data.boardSize = 3;
    }
    if (gameType === "fourrow") {
        game.data.boardSize = "7x6";
    }

    try{

        await writeGameState(
            game
        );

        gamesOverlay.classList.remove(
            "show"
        );

        await loadMessages();

            "Could not create game:\n\n"+
            error.message
        );
    }
}

            leave.className = "game-btn";
            leave.textContent = "Leave";
            leave.onclick = async () => await leaveGame(game);
            actions.appendChild(leave);
        }

        if (game.hostDeviceId === deviceId) {
            const start = document.createElement("button");
            start.className = "game-btn primary";
            start.textContent = "Start game";
            start.disabled = game.players.length < GAME_TYPES[game.gameType].min;
            start.onclick = async () => await startGame(game);
            actions.appendChild(start);

            const quit = document.createElement("button");
            quit.className = "game-btn danger";
            quit.textContent = "Force quit";
            quit.onclick = () => openConfirm("Force quit game?", "Everyone will be removed from this game.", () => forceQuitGame(game));
            actions.appendChild(quit);
        }
    } else if (game.status === "playing") {
        const mine = game.players.some(p => p.deviceId === deviceId);
        
        if (mine) {
            const leave = document.createElement("button");
            leave.className = "game-btn";
            leave.textContent = "Leave game";
            leave.onclick = async () => await leaveGame(game);
            actions.appendChild(leave);
        }

        if (game.hostDeviceId === deviceId) {
            const quit = document.createElement("button");
            quit.className = "game-btn danger";
            quit.textContent = "Force quit";
            quit.onclick = () => openConfirm("Force quit game?", "Everyone will be removed.", () => forceQuitGame(game));
            actions.appendChild(quit);
        }
    }

    body.appendChild(actions);
    card.appendChild(header);
    card.appendChild(body);
    wrapper.appendChild(card);

    return wrapper;
}

/* =====================================================
   GAME BOARD - DISPATCHER
===================================================== */

function createGameBoard(game){
    if (game.status !== "playing") return null;
    
    const boards = {
        ttt: createTTT,
        fourrow: createFourRow,
        reaction: createReaction,
        type: createTypeSentence,
        boss: createBossBattle
    };
    
    return boards[game.gameType] ? boards[game.gameType](game) : null;
}


/* =====================================================
   TIC TAC TOE (3x3, 4x4, 5x5, 6x6)
===================================================== */

function createTTT(game){
    const size = game.data.boardSize || 3;
    const total = size * size;
    const winCount = game.data.winCount || size;
    
    if (!game.data.board || game.data.board.length !== total) {
        game.data.board = Array(total).fill("");
        game.data.winCount = size;
    }

    const board = document.createElement("div");
    board.className = "ttt";
    board.style.gridTemplateColumns = `repeat(${size}, ${size <= 3 ? 80 : size <= 4 ? 70 : size <= 5 ? 60 : 50}px)`;
    board.style.gridTemplateRows = `repeat(${size}, ${size <= 3 ? 80 : size <= 4 ? 70 : size <= 5 ? 60 : 50}px)`;

    const mine = game.players.some(p => p.deviceId === deviceId);
    const current = game.players[game.turnIndex % game.players.length];
    const myTurn = mine && current && current.deviceId === deviceId;

    for (let i = 0; i < total; i++) {
        const button = document.createElement("button");
        button.textContent = game.data.board[i] || "";
        button.style.fontSize = size <= 3 ? "32px" : size <= 4 ? "28px" : size <= 5 ? "24px" : "20px";
        button.disabled = !myTurn || !!game.data.board[i] || !!game.winner;
        button.onclick = async () => {
            const copy = JSON.parse(JSON.stringify(game));
            const idx = copy.turnIndex % copy.players.length;
            const symbol = idx === 0 ? "X" : "O";
            copy.data.board[i] = symbol;
            
            if (checkTTTWin(copy.data.board, size, i, symbol)) {
                copy.winner = current.username;
                copy.status = "finished";
            } else if (copy.data.board.every(c => c)) {
                copy.winner = "draw";
                copy.status = "finished";
            } else {
                copy.turnIndex++;
            }
            await publishGameAndCleanup(game, copy);
        };
        board.appendChild(button);
    }
    return board;
}

function checkTTTWin(board, size, pos, symbol){
    const row = Math.floor(pos / size);
    const col = pos % size;
    const winCount = size; // Need full line for Tic-Tac-Toe
    
    const dirs = [[1,0],[0,1],[1,1],[1,-1]];
    for (const [dr, dc] of dirs) {
        let count = 1;
        for (const dir of [-1,1]) {
            let r = row + dr * dir, c = col + dc * dir;
            while (r >= 0 && r < size && c >= 0 && c < size && board[r * size + c] === symbol) {
                count++;
                r += dr * dir;
                c += dc * dir;
            }
        }
        if (count >= winCount) return true;
    }
    return false;
}


/* =====================================================
   4 IN A ROW
===================================================== */

function createFourRow(game){
    const boardSize = game.data.boardSize || "7x6";
    const [cols, rows] = boardSize.split('x').map(Number);
    const total = cols * rows;
    
    if (!game.data.board || game.data.board.length !== total) {
        game.data.board = Array(total).fill("");
    }

    const board = document.createElement("div");
    board.className = "four-row-board";
    board.style.gridTemplateColumns = `repeat(${cols}, ${cols <= 7 ? 42 : 38}px)`;
    board.style.gridTemplateRows = `repeat(${rows}, ${cols <= 7 ? 42 : 38}px)`;

    const mine = game.players.some(p => p.deviceId === deviceId);
    const current = game.players[game.turnIndex % game.players.length];
    const myTurn = mine && current && current.deviceId === deviceId;

    // Determine player colors
    const playerColors = game.data.playerColors || {};
    if (Object.keys(playerColors).length === 0) {
        game.players.forEach((p, idx) => {
            playerColors[p.deviceId] = idx === 0 ? "red" : "yellow";
        });
        game.data.playerColors = playerColors;
    }
    const myColor = playerColors[deviceId];

    for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
            const index = row * cols + col;
            const cell = document.createElement("div");
            cell.className = "four-row-cell";
            if (game.data.board[index] === "red") cell.classList.add("red");
            if (game.data.board[index] === "yellow") cell.classList.add("yellow");
            if (game.data.board[index]) cell.classList.add("taken");
            
            if (!game.data.board[index] && myTurn && !game.winner) {
                cell.onclick = async () => {
                    // Find lowest empty cell in this column
                    let placed = -1;
                    for (let r = rows - 1; r >= 0; r--) {
                        const idx = r * cols + col;
                        if (!game.data.board[idx]) {
                            placed = idx;
                            break;
                        }
                    }
                    if (placed === -1) return;
                    
                    const copy = JSON.parse(JSON.stringify(game));
                    const color = copy.turnIndex % 2 === 0 ? "red" : "yellow";
                    copy.data.board[placed] = color;
                    
                    if (checkFourRowWin(copy.data.board, cols, rows, placed, color)) {
                        copy.winner = current.username;
                        copy.status = "finished";
                    } else if (copy.data.board.every(c => c)) {
                        copy.winner = "draw";
                        copy.status = "finished";
                    } else {
                        copy.turnIndex++;
                    }
                    await publishGameAndCleanup(game, copy);
                };
            }
            board.appendChild(cell);
        }
    }
    return board;
}

function checkFourRowWin(board, cols, rows, pos, color){
    const row = Math.floor(pos / cols);
    const col = pos % cols;
    const dirs = [[1,0],[0,1],[1,1],[1,-1]];
    for (const [dr, dc] of dirs) {
        let count = 1;
        for (const dir of [-1,1]) {
            let r = row + dr * dir, c = col + dc * dir;
            while (r >= 0 && r < rows && c >= 0 && c < cols && board[r * cols + c] === color) {
                count++;
                r += dr * dir;
                c += dc * dir;
            }
        }
        if (count >= 4) return true;
    }
    return false;
}


/* =====================================================
   REACTION TIME
===================================================== */

function createReaction(game){
    const area = document.createElement("div");
    area.className = "reaction-area";

    const mine = game.players.some(p => p.deviceId === deviceId);
    const current = game.players[game.turnIndex % game.players.length];
    const myTurn = mine && current && current.deviceId === deviceId;

    const state = game.data.state || "waiting";
    const startTime = game.data.startTime || 0;
    const results = game.data.results || {};

    const box = document.createElement("div");
    box.className = "reaction-box " + state;

    if (state === "waiting") {
        box.textContent = "⏳ Waiting for " + (myTurn ? "you" : current.username) + "...";
        if (myTurn) {
            box.onclick = async () => {
                const copy = JSON.parse(JSON.stringify(game));
                copy.data.state = "ready";
                copy.data.startTime = Date.now() + 1000 + Math.random() * 3000;
                await publishGameAndCleanup(game, copy);
            };
        }
    } else if (state === "ready") {
        const remaining = Math.max(0, (startTime - Date.now()) / 1000);
        box.textContent = "🟢 Get ready... " + remaining.toFixed(1) + "s";
        // Auto transition to go
        if (remaining < 0.5 && myTurn) {
            setTimeout(async () => {
                const copy = JSON.parse(JSON.stringify(game));
                copy.data.state = "go";
                copy.data.goTime = Date.now();
                await publishGameAndCleanup(game, copy);
            }, Math.max(0, startTime - Date.now() + 100));
        }
    } else if (state === "go") {
        box.textContent = "🟢 CLICK NOW!";
        box.style.cursor = "pointer";
        if (myTurn) {
            box.onclick = async () => {
                const reactionTime = Date.now() - game.data.goTime;
                const copy = JSON.parse(JSON.stringify(game));
                copy.data.results = copy.data.results || {};
                copy.data.results[deviceId] = reactionTime;
                copy.turnIndex++;
                if (copy.turnIndex >= copy.players.length) {
                    // All done - find winner
                    let winner = null;
                    let best = Infinity;
                    for (const [id, time] of Object.entries(copy.data.results)) {
                        if (time < best) {
                            best = time;
                            winner = copy.players.find(p => p.deviceId === id)?.username;
                        }
                    }
                    copy.winner = winner + " (" + best + "ms)";
                    copy.status = "finished";
                } else {
                    copy.data.state = "waiting";
                }
                await publishGameAndCleanup(game, copy);
            };
        } else {
            box.textContent = "🟢 Waiting for " + current.username + "...";
        }
    } else if (state === "done") {
        box.textContent = "✅ Done!";
        box.classList.add("done");
    }

    area.appendChild(box);

    // Show results
    if (Object.keys(results).length > 0) {
        const resultsDiv = document.createElement("div");
        resultsDiv.style.cssText = "color:#9da5b0;margin-top:10px;";
        const sorted = Object.entries(results).sort((a,b) => a[1] - b[1]);
        resultsDiv.innerHTML = sorted.map(([id, time]) => {
            const name = game.players.find(p => p.deviceId === id)?.username || "Unknown";
            return `<div>${escapeHtml(name)}: ${time}ms</div>`;
        }).join("");
        area.appendChild(resultsDiv);
    }

    return area;
}

function createTypeSentence(game){

        "Pack my box with five dozen liquor jugs.",
        "How vexingly quick daft zebras jump.",
        "The five boxing wizards jump quickly.",
        "Jazz and swing fans like fast music.",
        "Crazy Fredericka bought many very exquisite opal jewels.",
        "We promptly judged antique ivory buckles for the next prize.",
        "A quacking duck flew over the busy highway.",
        "The amazing spider web sparkled in the morning dew.",
        "Bright vixens jump; dozy fowl quack."
    ];

    const mine = game.players.some(p => p.deviceId === deviceId);
    const current = game.players[game.turnIndex % game.players.length];
    const myTurn = mine && current && current.deviceId === deviceId;

    if (!game.data.sentence) {
        game.data.sentence = sentences[Math.floor(Math.random() * sentences.length)];
        game.data.startTime = 0;
        game.data.results = {};
        game.data.done = false;
    }

    const sentence = game.data.sentence;
    const results = game.data.results || {};

    // Show sentence
    const sentDisplay = document.createElement("div");
    sentDisplay.className = "type-sentence";
    sentDisplay.textContent = sentence;
    area.appendChild(sentDisplay);

    if (game.winner) {
        const win = document.createElement("div");
        win.className = "turn-banner";
        win.textContent = "🏆 Winner: " + game.winner;
        area.appendChild(win);
        return area;
    }

    if (!myTurn && !game.data.done) {
        const waiting = document.createElement("div");
        waiting.className = "turn-banner";
        waiting.textContent = "Waiting for " + current.username + "...";
        area.appendChild(waiting);
        return area;
    }

    if (game.data.done) {
        const done = document.createElement("div");
        done.className = "turn-banner";
        done.textContent = "All players finished!";
        area.appendChild(done);
        return area;
    }

    // Input for typing
    const input = document.createElement("input");
    input.className = "type-input";
    input.placeholder = "Type the sentence here...";
    input.autofocus = true;

    // Start timer on first input
    let started = false;

    input.oninput = async () => {
        if (!started && input.value.length > 0) {
            started = true;
            const copy = JSON.parse(JSON.stringify(game));
            copy.data.startTime = Date.now();
            await publishGameAndCleanup(game, copy);
        }

        if (input.value === sentence) {
            const time = Date.now() - game.data.startTime;
            const copy = JSON.parse(JSON.stringify(game));
            copy.data.results = copy.data.results || {};
            copy.data.results[deviceId] = time;
            copy.turnIndex++;
            
            if (copy.turnIndex >= copy.players.length) {
                copy.data.done = true;
                let winner = null;
                let best = Infinity;
                for (const [id, t] of Object.entries(copy.data.results)) {
                    if (t < best) {
                        best = t;
                        winner = copy.players.find(p => p.deviceId === id)?.username;
                    }
                }
                copy.winner = winner + " (" + (best/1000).toFixed(2) + "s)";
                copy.status = "finished";
            }
            await publishGameAndCleanup(game, copy);
        }
    };

    area.appendChild(input);

    // Stats
    const stats = document.createElement("div");
    stats.className = "type-stats";
    const completed = Object.keys(results).length;
    stats.innerHTML = `
        <div>Completed: <strong>${completed}/${game.players.length}</strong></div>
        <div>Your time: <strong>${results[deviceId] ? (results[deviceId]/1000).toFixed(2) + 's' : '—'}</strong></div>
    `;
    area.appendChild(stats);

    return area;
}

    dmgUpgrade.onclick = async () => {
        const copy = JSON.parse(JSON.stringify(game));
        copy.data.upgrades = copy.data.upgrades || {};
        copy.data.upgrades[deviceId] = (copy.data.upgrades[deviceId] || 0) - upgradeCosts.damage;
        copy.data.damage = Math.floor((copy.data.damage || 1) * 1.1);
        await publishGameAndCleanup(game, copy);
    };
    upgradesDiv.appendChild(dmgUpgrade);

    // Crit upgrade
    const critUpgrade = document.createElement("button");
    critUpgrade.className = "boss-upgrade-btn";
    critUpgrade.innerHTML = `💥 +5% Crit Chance <span class="cost">(${upgradeCosts.crit} pts)</span>`;
    critUpgrade.disabled = upgradePoints < upgradeCosts.crit;
    critUpgrade.onclick = async () => {
        const copy = JSON.parse(JSON.stringify(game));
        copy.data.upgrades = copy.data.upgrades || {};
        copy.data.upgrades[deviceId] = (copy.data.upgrades[deviceId] || 0) - upgradeCosts.crit;
        copy.data.critChance = (copy.data.critChance || 0) + 0.05;
        await publishGameAndCleanup(game, copy);
    };
    upgradesDiv.appendChild(critUpgrade);

    // Multi-hit upgrade
    const multiUpgrade = document.createElement("button");
    multiUpgrade.className = "boss-upgrade-btn";
    multiUpgrade.innerHTML = `🌀 +1 Multi-hit <span class="cost">(${upgradeCosts.multi} pts)</span>`;
    multiUpgrade.disabled = upgradePoints < upgradeCosts.multi;
    multiUpgrade.onclick = async () => {
        const copy = JSON.parse(JSON.stringify(game));
        copy.data.upgrades = copy.data.upgrades || {};
        copy.data.upgrades[deviceId] = (copy.data.upgrades[deviceId] || 0) - upgradeCosts.multi;
        copy.data.multiHit = (copy.data.multiHit || 1) + 1;
        await publishGameAndCleanup(game, copy);
    };
    upgradesDiv.appendChild(multiUpgrade);

    area.appendChild(upgradesDiv);

    return area;
}


/* =====================================================
   GAME HELPERS
===================================================== */

async function joinGame(game){
    if (game.status !== "lobby") return;
    if (game.players.some(p => p.deviceId === deviceId)) return;
    if (game.players.length >= game.maxPlayers) return;
    
    const copy = JSON.parse(JSON.stringify(game));
    copy.players.push({ deviceId, username: settings.username });
    await writeGameState(copy);
    await loadMessages();
}

async function leaveGame(game){
    const copy = JSON.parse(JSON.stringify(game));
    copy.players = copy.players.filter(p => p.deviceId !== deviceId);
    
    if (copy.players.length === 0) {
        await removeGameMessages(game);
        await loadMessages();
        return;
    }
    
    if (game.hostDeviceId === deviceId) {
        const newHost = copy.players[0];
        copy.host = newHost.username;
        copy.hostDeviceId = newHost.deviceId;
    }
    
    if (copy.status === "playing" && copy.turnIndex >= copy.players.length) {
        copy.turnIndex = 0;
    }
    
    await writeGameState(copy);
    await deleteStateMessage(game);
    await loadMessages();
}

async function startGame(game){
    if (game.hostDeviceId !== deviceId) return;
    if (game.players.length < GAME_TYPES[game.gameType].min) return;
    
    const copy = JSON.parse(JSON.stringify(game));
    copy.status = "playing";
    copy.turnIndex = 0;
    
    // Initialize game-specific data
    if (copy.gameType === "ttt") {
        if (!copy.data.boardSize) copy.data.boardSize = 3;
        copy.data.board = Array(copy.data.boardSize * copy.data.boardSize).fill("");
    }
    if (copy.gameType === "fourrow") {
        if (!copy.data.boardSize) copy.data.boardSize = "7x6";
        const [cols, rows] = copy.data.boardSize.split('x').map(Number);
        copy.data.board = Array(cols * rows).fill("");
        copy.data.playerColors = {};
        copy.players.forEach((p, idx) => {
            copy.data.playerColors[p.deviceId] = idx === 0 ? "red" : "yellow";
        });
    }
    if (copy.gameType === "reaction") {
        copy.data.state = "waiting";
        copy.data.startTime = 0;
        copy.data.results = {};
        copy.data.goTime = 0;
    }
    if (copy.gameType === "type") {
        const sentences = [
            "The quick brown fox jumps over the lazy dog.",
            "Pack my box with five dozen liquor jugs.",
            "How vexingly quick daft zebras jump.",
            "The five boxing wizards jump quickly.",
            "Jazz and swing fans like fast music.",
            "Crazy Fredericka bought many very exquisite opal jewels.",
            "We promptly judged antique ivory buckles for the next prize."
        ];
        copy.data.sentence = sentences[Math.floor(Math.random() * sentences.length)];
        copy.data.startTime = 0;
        copy.data.results = {};
        copy.data.done = false;
    }
    if (copy.gameType === "boss") {
        copy.data.bossHealth = 100000000;
        copy.data.maxHealth = 100000000;
        copy.data.damage = 1;
        copy.data.upgrades = {};
        copy.data.totalDamageDealt = {};
        copy.data.bossDefeated = false;
        copy.data.critChance = 0;
        copy.data.multiHit = 1;
        const names = ["Cthulhu", "Mega Dragon", "Shadow Lord", "Void Beast", "Eldritch Horror", "Demon King"];
        copy.data.monsterName = names[Math.floor(Math.random() * names.length)];
    }
    
    await publishGameAndCleanup(game, copy);
}

async function forceQuitGame(game){
    if (game.hostDeviceId !== deviceId) return;
    try {
        await removeGameMessages(game);
        await loadMessages();
    } catch(error) {
        alert("Could not remove game:\n\n" + error.message);
    }
}

async function publishGameAndCleanup(oldGame, newGame){
    if (newGame.status === "finished") {
        await removeGameMessages(oldGame);
        await loadMessages();
        return;
    }
    
    await writeGameState(newGame);
    
    if (oldGame.messageId) {
        try {
            await apiDelete({ id: oldGame.messageId, device_id: oldGame.hostDeviceId });
        } catch {}
    }
    
    await loadMessages();
}

async function removeGameMessages(game){
    const gameMessages = currentMessages.filter(message => {
        if (!isGameMessage(message)) return false;
        const state = parseGameMessage(message);
        return state && state.id === game.id;
    });
    
    for (const message of gameMessages) {
        try {
            await apiDelete({ id: message.id, device_id: game.hostDeviceId });
        } catch {}
    }
}

async function deleteStateMessage(game){
    if (!game.messageId) return;
    try {
        await apiDelete({ id: game.messageId, device_id: game.hostDeviceId });
    } catch {}
}


/* =====================================================
   REFRESH
===================================================== */

function restartRefresh(){
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(loadMessages, 500);
}


/* =====================================================
   CONFIRM
===================================================== */

function openConfirm(title, text, callback){
    confirmTitle.textContent = title;
    confirmText.textContent = text;
    confirmCallback = callback;
    confirmOverlay.classList.add("show");
}

confirmCancel.onclick = () => {
    confirmOverlay.classList.remove("show");
    confirmCallback = null;
};

confirmYes.onclick = async () => {
    const callback = confirmCallback;
    confirmOverlay.classList.remove("show");
    confirmCallback = null;
    if (callback) {
        try { await callback(); } 
        catch(error) { alert(error.message); }
    }
};


/* =====================================================
   REMOVE EVERYTHING
===================================================== */

removeEverything.onclick = () => {
    openConfirm("Remove everything?", "This permanently removes every message from the chat.", async () => {
        try {
            await apiDelete({ delete_all: true });
            currentMessages = [];
            games = [];
            renderedElements.clear();
            seenMessageIds.clear();
            seenGameIds.clear();
            renderMessages();
        } catch(error) {
            alert("Failed to wipe chat:\n\n" + error.message);
        }
    });
};


/* =====================================================
   HELPERS
===================================================== */

function formatTime(date){
    if (!date) return "";
    return new Date(date).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function escapeHtml(value){
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =====================================================
   START
===================================================== */

loadSettingsUI();
applySettings();
loadMessages();
