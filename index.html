<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat</title>

<style>
*{box-sizing:border-box}

:root{
    --bg:#0b0d10;
    --panel:#111419;
    --panel2:#181c22;
    --border:#292f38;
    --text:#edf0f4;
    --muted:#7e8793;
    --accent:#e8eaed;
    --danger:#ff7070;
    --radius:12px;
    --ui-scale:1;
    --text-size:16px;
    --word-spacing:0px;
    --line-spacing:1.45;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

body{
    overflow:hidden;
    font-size:calc(16px * var(--ui-scale));
}

button,input,textarea,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:64px;
    min-height:64px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel);
    border-bottom:1px solid var(--border);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
}

.logo-icon{
    width:35px;
    height:35px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:var(--panel2);
    border:1px solid var(--border);
}

.channel{
    color:var(--muted);
    font-weight:400;
}

.icon-btn{
    width:39px;
    height:39px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
}

.icon-btn:hover{
    filter:brightness(1.15);
}

/* MESSAGES */

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    display:flex;
    gap:11px;
    margin-bottom:17px;
}

.message.compact{
    margin-bottom:7px;
}

.avatar{
    flex:0 0 40px;
    width:40px;
    height:40px;
    display:grid;
    place-items:center;
    border-radius:var(--radius);
    background:var(--panel2);
    border:1px solid var(--border);
    font-weight:700;
}

.message-content{
    min-width:0;
    max-width:min(850px,calc(100vw - 90px));
}

.message-top{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:3px;
}

.username{
    font-weight:700;
}

.time,.edited{
    color:var(--muted);
    font-size:11px;
}

.message-text{
    color:#d8dde4;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    font-size:var(--text-size);
    word-spacing:var(--word-spacing);
    line-height:var(--line-spacing);
}

.message-image{
    display:block;
    max-width:min(500px,80vw);
    max-height:500px;
    margin-top:8px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:#000;
    object-fit:contain;
    cursor:pointer;
}

/* COMPOSER */

.composer{
    padding:12px 16px 16px;
    background:var(--panel);
    border-top:1px solid var(--border);
}

.composer-box{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:8px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:14px;
}

textarea{
    flex:1;
    min-height:42px;
    max-height:150px;
    resize:none;
    border:0;
    outline:none;
    background:transparent;
    color:white;
    padding:10px;
}

.attach-btn,
.send-btn{
    height:42px;
    border:0;
    border-radius:9px;
}

.attach-btn{
    width:42px;
    background:transparent;
    color:#adb5c0;
    font-size:20px;
}

.attach-btn:hover{
    background:#242932;
}

.send-btn{
    padding:0 18px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

.send-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* OVERLAYS */

.overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.72);
    z-index:100;
}

.overlay.show{
    display:flex;
}

.panel{
    width:min(560px,calc(100vw - 25px));
    max-height:calc(100vh - 25px);
    overflow-y:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
    box-shadow:0 25px 80px #000b;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px;
    border-bottom:1px solid var(--border);
}

.panel-header h2{
    margin:0;
}

.panel-body{
    padding:18px;
}

/* SETTINGS */

.category{
    margin-bottom:12px;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    background:var(--panel2);
}

.category-title{
    width:100%;
    padding:14px;
    border:0;
    background:transparent;
    color:var(--text);
    display:flex;
    justify-content:space-between;
    font-weight:700;
    text-align:left;
}

.category-title span:last-child{
    color:var(--muted);
}

.category-body{
    display:none;
    padding:0 14px 14px;
}

.category.open .category-body{
    display:block;
}

.setting{
    margin-top:14px;
}

.setting label{
    display:block;
    margin-bottom:7px;
    color:#aab2bd;
    font-size:13px;
}

.setting input,
.setting select{
    width:100%;
    padding:10px;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
    background:#101419;
    color:white;
}

.setting input[type="range"]{
    padding:0;
}

.setting-value{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.info{
    margin-top:7px;
    color:var(--muted);
    font-size:12px;
    line-height:1.45;
}

.save-btn{
    width:100%;
    margin-top:8px;
    padding:12px;
    border:0;
    border-radius:9px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

.permission-btn{
    width:100%;
    margin-top:10px;
    padding:11px;
    border:1px solid var(--border);
    border-radius:9px;
    background:#20252c;
    color:white;
}

/* DANGER */

.danger-zone{
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid #402529;
}

.danger-title{
    color:var(--danger);
    font-weight:700;
    margin-bottom:7px;
}

.danger-zone p{
    color:var(--muted);
    line-height:1.45;
}

.danger-btn{
    width:100%;
    padding:12px;
    border-radius:9px;
    border:1px solid #743333;
    background:#241719;
    color:#ff8585;
}

/* CONTEXT MENU */

.context-menu{
    position:fixed;
    display:none;
    width:160px;
    padding:5px;
    z-index:200;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:9px;
    box-shadow:0 15px 40px #0009;
}

.context-menu.show{
    display:block;
}

.context-menu button{
    width:100%;
    padding:9px 10px;
    text-align:left;
    border:0;
    border-radius:6px;
    background:transparent;
    color:var(--text);
}

.context-menu button:hover{
    background:#252b33;
}

.delete-option{
    color:#ff7777!important;
}

/* IMAGE VIEWER */

.image-viewer{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000f;
    z-index:300;
}

.image-viewer.show{
    display:flex;
}

.full-image{
    max-width:95vw;
    max-height:90vh;
    object-fit:contain;
}

.back-image{
    position:absolute;
    top:18px;
    left:18px;
    padding:10px 16px;
    border-radius:9px;
    border:1px solid #3a4049;
    background:#171b21;
    color:white;
}

/* DIALOG */

.dialog{
    width:min(450px,calc(100vw - 30px));
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
}

.dialog h2{
    margin-top:0;
}

.dialog p{
    color:#aab2bd;
    line-height:1.5;
}

.dialog-buttons{
    display:flex;
    gap:8px;
    justify-content:flex-end;
}

.dialog-buttons button{
    padding:10px 16px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#20252c;
    color:white;
}

.dialog-buttons .danger{
    background:#6b2929;
    border-color:#813434;
}

/* EMPTY */

.empty{
    height:100%;
    display:grid;
    place-items:center;
    color:#656d78;
    text-align:center;
}

.empty strong{
    display:block;
    color:#aab2bd;
    margin-bottom:5px;
}

/* NOTIFICATION STATUS */

.notification-status{
    padding:9px 10px;
    border-radius:8px;
    background:#101419;
    border:1px solid var(--border);
    color:var(--muted);
    font-size:12px;
    line-height:1.4;
}

.notification-status.ready{
    color:#9be7ad;
}

.notification-status.denied{
    color:#ff8585;
}

@media(max-width:600px){

    .header{
        padding:0 11px;
    }

    .messages{
        padding:15px 11px;
    }

    .channel{
        display:none;
    }

    .message-content{
        max-width:calc(100vw - 70px);
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="logo">
        <div class="logo-icon">💬</div>
        <span>Chat</span>
        <span class="channel"># general</span>
    </div>

    <button
        class="icon-btn"
        id="settingsBtn"
        title="Settings"
    >⚙</button>

</header>

<main class="messages" id="messages"></main>

<div class="composer">

    <div class="composer-box">

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
        >

        <button
            class="attach-btn"
            id="attachBtn"
            title="Choose image"
        >＋</button>

        <textarea
            id="messageInput"
            rows="1"
            placeholder="Message #general"
        ></textarea>

        <button
            class="send-btn"
            id="sendBtn"
        >Send</button>

    </div>

</div>

</div>


<!-- SETTINGS -->

<div class="overlay" id="settingsOverlay">

<div class="panel">

<div class="panel-header">

    <h2>Settings</h2>

    <button class="icon-btn" id="closeSettings">×</button>

</div>

<div class="panel-body">


<!-- PROFILE -->

<div class="category open">

<button class="category-title">
    <span>👤 Profile</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Your name</label>

<input
    id="usernameInput"
    maxlength="24"
    placeholder="Enter your name"
>

</div>

<div class="setting">

<label>Device ID</label>

<input id="deviceIdInput" readonly>

</div>

</div>
</div>


<!-- TEXT -->

<div class="category">

<button class="category-title">
    <span>📝 Text</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Text size</label>

<input
    id="textSize"
    type="range"
    min="12"
    max="24"
    step="1"
>

<div class="setting-value" id="textSizeValue"></div>

</div>

<div class="setting">

<label>Word spacing</label>

<input
    id="wordSpacing"
    type="range"
    min="0"
    max="12"
    step="1"
>

<div class="setting-value" id="wordSpacingValue"></div>

</div>

<div class="setting">

<label>Line spacing</label>

<input
    id="lineSpacing"
    type="range"
    min="1"
    max="2"
    step=".05"
>

<div class="setting-value" id="lineSpacingValue"></div>

</div>

</div>
</div>


<!-- CHAT -->

<div class="category">

<button class="category-title">
    <span>💬 Chat</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Refresh rate</label>

<select id="refreshRate">
<option value="10000">10 seconds</option>
<option value="5000">5 seconds</option>
<option value="3000">3 seconds</option>
<option value="2000">2 seconds</option>
<option value="1000">1 second</option>
<option value="500" selected>0.5 seconds</option>
<option value="100">0.1 seconds</option>
</select>

</div>

<div class="setting">

<label>Show timestamps</label>

<select id="showTimestamps">
<option value="true">On</option>
<option value="false">Off</option>
</select>

</div>

<div class="setting">

<label>Compact messages</label>

<select id="compactMessages">
<option value="false">Off</option>
<option value="true">On</option>
</select>

</div>

</div>
</div>


<!-- APPEARANCE -->

<div class="category">

<button class="category-title">
    <span>🎨 Appearance</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Theme</label>

<select id="themeSelect">
<option value="dark">Dark</option>
<option value="midnight">Midnight</option>
<option value="slate">Slate</option>
<option value="black">Pure Black</option>
<option value="blue">Dark Blue</option>
<option value="purple">Dark Purple</option>
<option value="green">Dark Green</option>
<option value="red">Dark Red</option>
<option value="gray">Classic Gray</option>
<option value="light">Light</option>
<option value="oled">OLED</option>
</select>

</div>

<div class="setting">

<label>Corner roundness</label>

<input
    id="cornerRadius"
    type="range"
    min="0"
    max="25"
>

<div class="setting-value" id="cornerRadiusValue"></div>

</div>

<div class="setting">

<label>UI scale</label>

<input
    id="uiScale"
    type="range"
    min=".8"
    max="1.2"
    step=".05"
>

<div class="setting-value" id="uiScaleValue"></div>

</div>

</div>
</div>


<!-- NOTIFICATIONS -->

<div class="category">

<button class="category-title">
    <span>🔔 Notifications</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Notification sound</label>

<select id="notificationSound">

<option value="false">Off</option>
<option value="true">On</option>

</select>

</div>


<div class="setting">

<label>Notification sound type</label>

<select id="notificationType">

<option value="1">1 — Soft Click</option>
<option value="2">2 — Pop</option>
<option value="3">3 — Double Beep</option>
<option value="4">4 — Digital</option>
<option value="5">5 — Bell</option>
<option value="6">6 — Chime</option>
<option value="7">7 — Pulse</option>
<option value="8">8 — Alert</option>
<option value="9">9 — Retro</option>
<option value="10">10 — Deep Ping</option>
<option value="11">11 — Emergency Alarm</option>

</select>

</div>


<div class="setting">

<label>Notification volume</label>

<input
    id="notificationVolume"
    type="range"
    min="0"
    max="100"
    step="1"
>

<div
    class="setting-value"
    id="notificationVolumeValue"
></div>

</div>


<div class="setting">

<label>Notification duration</label>

<select id="notificationDuration">

<option value="250">0.25 second</option>
<option value="500">0.5 second</option>
<option value="1000">1 second</option>
<option value="1500">1.5 seconds</option>
<option value="2000">2 seconds</option>
<option value="3000">3 seconds</option>
<option value="5000">5 seconds</option>
</select>

</div>


<div class="setting">

<label>Desktop notifications</label>

<select id="desktopNotifications">

<option value="false">Off</option>
<option value="true">On</option>

</select>

</div>


<div class="setting">

<label>Mention notifications</label>

<select id="mentionNotifications">

<option value="false">Off</option>
<option value="true">On</option>

</select>

</div>


<div class="setting">

<div
    class="notification-status"
    id="notificationStatus"
>
Checking notification permission...
</div>

<button
    class="permission-btn"
    id="enableNotifications"
>
Enable Windows/Desktop Notifications
</button>

<button
    class="permission-btn"
    id="testNotification"
>
Test Notification
</button>

</div>

</div>
</div>


<!-- BEHAVIOR -->

<div class="category">

<button class="category-title">
    <span>⚙️ Behavior</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Enter to send</label>

<select id="enterToSend">
<option value="true">On</option>
<option value="false">Off</option>
</select>

</div>

<div class="setting">

<label>Auto-scroll</label>

<select id="autoScroll">
<option value="true">On</option>
<option value="false">Off</option>
</select>

</div>

<div class="setting">

<label>Confirm before deleting</label>

<select id="confirmDelete">
<option value="true">On</option>
<option value="false">Off</option>
</select>

</div>

</div>
</div>


<button class="save-btn" id="saveSettings">
Save settings
</button>


<!-- DANGER -->

<div class="danger-zone">

<div class="danger-title">
    ⚠ Danger Zone
</div>

<p>
Remove every message from the chat permanently.
This affects everyone using the chat.
</p>

<button class="danger-btn" id="removeEverything">
Remove everything
</button>

</div>

</div>
</div>
</div>


<!-- CONTEXT MENU -->

<div class="context-menu" id="contextMenu">

<button id="editMessage">Edit</button>

<button class="delete-option" id="deleteMessage">
Delete
</button>

</div>


<!-- IMAGE VIEWER -->

<div class="image-viewer" id="imageViewer">

<button class="back-image" id="backImage">
← Back
</button>

<img
    class="full-image"
    id="fullImage"
    alt="Full image"
>

</div>


<!-- DIALOG -->

<div class="overlay" id="dialogOverlay">

<div class="dialog">

<h2 id="dialogTitle">Confirm</h2>

<p id="dialogText"></p>

<div class="dialog-buttons">

<button id="dialogCancel">
Cancel
</button>

<button class="danger" id="dialogConfirm">
Yes
</button>

</div>

</div>
</div>


<script>

const API_URL="/api/messages";
const CHANNEL="general";


/* =========================================================
   DEVICE
========================================================= */

let deviceId=localStorage.getItem("chat_device_id");

if(!deviceId){

    deviceId=crypto.randomUUID();

    localStorage.setItem(
        "chat_device_id",
        deviceId
    );
}


/* =========================================================
   SETTINGS DEFAULTS
========================================================= */

const defaults={

    username:"",

    theme:"dark",

    refreshRate:500,

    showTimestamps:true,

    compactMessages:false,

    textSize:16,

    wordSpacing:0,

    lineSpacing:1.45,

    cornerRadius:12,

    uiScale:1,

    notificationSound:false,

    notificationType:1,

    notificationVolume:70,

    notificationDuration:1000,

    desktopNotifications:false,

    mentionNotifications:false,

    enterToSend:true,

    autoScroll:true,

    confirmDelete:true
};


function getSetting(key){

    const value=
        localStorage.getItem("chat_"+key);

    if(value===null){

        return defaults[key];

    }

    if(
        value==="true" ||
        value==="false"
    ){

        return value==="true";

    }

    const number=Number(value);

    return Number.isNaN(number)
        ?value
        :number;
}


let settings={};

Object.keys(defaults).forEach(key=>{

    settings[key]=getSetting(key);

});


/* =========================================================
   ELEMENTS
========================================================= */

const messagesEl=
    document.getElementById("messages");

const messageInput=
    document.getElementById("messageInput");

const sendBtn=
    document.getElementById("sendBtn");

const imageInput=
    document.getElementById("imageInput");

const attachBtn=
    document.getElementById("attachBtn");

const settingsBtn=
    document.getElementById("settingsBtn");

const settingsOverlay=
    document.getElementById("settingsOverlay");

const closeSettings=
    document.getElementById("closeSettings");

const saveSettings=
    document.getElementById("saveSettings");

const usernameInput=
    document.getElementById("usernameInput");

const deviceIdInput=
    document.getElementById("deviceIdInput");

const themeSelect=
    document.getElementById("themeSelect");

const refreshRate=
    document.getElementById("refreshRate");

const showTimestamps=
    document.getElementById("showTimestamps");

const compactMessages=
    document.getElementById("compactMessages");

const textSize=
    document.getElementById("textSize");

const wordSpacing=
    document.getElementById("wordSpacing");

const lineSpacing=
    document.getElementById("lineSpacing");

const cornerRadius=
    document.getElementById("cornerRadius");

const uiScale=
    document.getElementById("uiScale");

const notificationSound=
    document.getElementById("notificationSound");

const notificationType=
    document.getElementById("notificationType");

const notificationVolume=
    document.getElementById("notificationVolume");

const notificationDuration=
    document.getElementById("notificationDuration");

const desktopNotifications=
    document.getElementById("desktopNotifications");

const mentionNotifications=
    document.getElementById("mentionNotifications");

const enterToSend=
    document.getElementById("enterToSend");

const autoScroll=
    document.getElementById("autoScroll");

const confirmDelete=
    document.getElementById("confirmDelete");

const enableNotifications=
    document.getElementById("enableNotifications");

const testNotification=
    document.getElementById("testNotification");

const notificationStatus=
    document.getElementById("notificationStatus");

const contextMenu=
    document.getElementById("contextMenu");

const editMessageBtn=
    document.getElementById("editMessage");

const deleteMessageBtn=
    document.getElementById("deleteMessage");

const imageViewer=
    document.getElementById("imageViewer");

const fullImage=
    document.getElementById("fullImage");

const backImage=
    document.getElementById("backImage");

const dialogOverlay=
    document.getElementById("dialogOverlay");

const dialogTitle=
    document.getElementById("dialogTitle");

const dialogText=
    document.getElementById("dialogText");

const dialogCancel=
    document.getElementById("dialogCancel");

const dialogConfirm=
    document.getElementById("dialogConfirm");

const removeEverything=

/* =========================================================
   AUDIO ENGINE
========================================================= */

function getAudioContext(){

    if(!audioContext){

        const AudioContextClass=
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioContextClass){
            return null;
        }

        audioContext=
            new AudioContextClass();

    }

    if(audioContext.state==="suspended"){

        audioContext.resume().catch(()=>{});

    }

    return audioContext;
}


function tone(
    ctx,
    destination,
    frequency,
    start,
    duration,
    type="sine",
    volume=0.15
){

    const oscillator=
        ctx.createOscillator();

    const gain=
        ctx.createGain();

    oscillator.type=type;

    oscillator.frequency.setValueAtTime(
        frequency,
        start
    );

    gain.gain.setValueAtTime(
        0,
        start
    );

    gain.gain.linearRampToValueAtTime(
        volume,
        start+0.015
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        start+Math.max(duration,0.03)
    );

    oscillator.connect(gain);

    gain.connect(destination);

    oscillator.start(start);

    oscillator.stop(
        start+Math.max(duration,0.04)
    );
}


/*
    11 different notification sounds.

    #11 is a fictional emergency alarm,
    not a reproduction of a real-world warning signal.
*/

function playNotificationSound(){

    if(!settings.notificationSound){
        return;
    }

    const ctx=getAudioContext();

    if(!ctx){
        return;
    }

    const master=
        ctx.createGain();

    const volume=
        Math.max(
            0,
            Math.min(
                100,
                settings.notificationVolume
            )
        )/100;

    master.gain.value=
        volume*0.22;

    master.connect(
        ctx.destination
    );

    const now=
        ctx.currentTime+0.01;

    const maxDuration=
        Math.max(
            0.1,
            Number(settings.notificationDuration)/1000
        );

    const type=
        Number(settings.notificationType);


    if(type===1){

        /* Soft click */

        tone(
            ctx,
            master,
            900,
            now,
            Math.min(.12,maxDuration),
            "sine",
            .7
        );

    }


    else if(type===2){

        /* Pop */

        tone(
            ctx,
            master,
            520,
            now,
            Math.min(.14,maxDuration),
            "sine",
            .8
        );

        tone(
            ctx,
            master,
            760,
            now+.04,
            Math.min(.12,maxDuration-.04),
            "sine",
            .5
        );

    }


    else if(type===3){

        /* Double beep */

        tone(
            ctx,
            master,
            700,
            now,
            Math.min(.13,maxDuration),
            "square",
            .5
        );

        if(maxDuration>.18){

            tone(
                ctx,
                master,
                900,
                now+.16,
                Math.min(.13,maxDuration-.16),
                "square",
                .5
            );

        }

    }


    else if(type===4){

        /* Digital */

        tone(
            ctx,
            master,
            1000,
            now,
            Math.min(.08,maxDuration),
            "square",
            .45
        );

        if(maxDuration>.12){

            tone(
                ctx,
                master,
                650,
                now+.1,
                Math.min(.08,maxDuration-.1),
                "square",
                .45
            );

        }

        if(maxDuration>.24){

            tone(
                ctx,
                master,
                1200,
                now+.2,
                Math.min(.08,maxDuration-.2),
                "square",
                .45
            );

        }

    }


    else if(type===5){

        /* Bell */

        tone(
            ctx,
            master,
            620,
            now,
            Math.min(.7,maxDuration),
            "sine",
            .75
        );

        tone(
            ctx,
            master,
            930,
            now+.015,
            Math.min(.55,maxDuration),
            "sine",
            .4
        );

    }


    else if(type===6){

        /* Chime */

        tone(
            ctx,
            master,
            523.25,
            now,
            Math.min(.35,maxDuration),
            "sine",
            .55
        );

        if(maxDuration>.15){

            tone(
                ctx,
                master,
                659.25,
                now+.13,
                Math.min(.35,maxDuration-.13),
                "sine",
                .5
            );

        }

        if(maxDuration>.3){

            tone(
                ctx,
                master,
                783.99,
                now+.26,
                Math.min(.4,maxDuration-.26),
                "sine",
                .45
            );

        }

    }


    else if(type===7){

        /* Pulse */

        tone(
            ctx,
            master,
            400,
            now,
            Math.min(.12,maxDuration),
            "triangle",
            .8
        );

        if(maxDuration>.2){

            tone(
                ctx,
                master,
                400,
                now+.2,
                Math.min(.12,maxDuration-.2),
                "triangle",
                .8
            );

        }

    }


    else if(type===8){

        /* Alert */

        tone(
            ctx,
            master,
            880,
            now,
            Math.min(.22,maxDuration),
            "square",
            .5
        );

        if(maxDuration>.27){

            tone(
                ctx,
                master,
                660,
                now+.25,
                Math.min(.22,maxDuration-.25),
                "square",
                .5
            );

        }

    }


    else if(type===9){

        /* Retro */

        tone(
            ctx,
            master,
            440,
            now,
            Math.min(.1,maxDuration),
            "square",
            .45
        );

        if(maxDuration>.13){

            tone(
                ctx,
                master,
                660,
                now+.12,
                Math.min(.1,maxDuration-.12),
                "square",
                .45
            );

        }

        if(maxDuration>.26){

            tone(
                ctx,
                master,
                880,
                now+.25,
                Math.min(.1,maxDuration-.25),
                "square",
                .45
            );

        }

    }


    else if(type===10){

        /* Deep ping */

        tone(
            ctx,
            master,
            220,
            now,
            Math.min(.55,maxDuration),
            "sine",
            .8
        );

        tone(
            ctx,
            master,
            440,
            now+.04,
            Math.min(.4,maxDuration-.04),
            "sine",
            .3
        );

    }


    else if(type===11){

        /*
            Fictional emergency alarm.

            Uses an escalating alternating warning
            tone rather than reproducing an actual
            nuclear/public-warning siren.
        */

        const step=
            Math.min(
                .7,
                Math.max(
                    .18,
                    maxDuration/4
                )
            );

        let position=0;

        let high=true;

        while(position<maxDuration){

            const length=
                Math.min(
                    step,
                    maxDuration-position
                );

            tone(
                ctx,
                master,
                high ? 760 : 430,
                now+position,
                length,
                "sawtooth",
                .38
            );

            high=!high;

            position+=length+.035;

        }

    }

}

/* =========================================================
   DESKTOP / WINDOWS NOTIFICATIONS
========================================================= */

function updateNotificationStatus(){

    if(!("Notification" in window)){

        notificationStatus.textContent=
            "Desktop notifications are not supported by this browser.";

        notificationStatus.className=
            "notification-status denied";

        return;
    }


    if(Notification.permission==="granted"){

        notificationStatus.textContent=
            "✓ Desktop notifications are enabled.";

        notificationStatus.className=
            "notification-status ready";

    }

    else if(Notification.permission==="denied"){

        notificationStatus.textContent=
            "Notifications are blocked. Allow them in your browser/site permissions.";

        notificationStatus.className=
            "notification-status denied";

    }

    else{

        notificationStatus.textContent=
            "Desktop notifications are not enabled yet.";

        notificationStatus.className=
            "notification-status";

    }

}


async function requestNotificationPermission(){

    if(!("Notification" in window)){

        alert(
            "Desktop notifications are not supported by this browser."
        );

        return false;
    }


    try{

        const permission=
            await Notification.requestPermission();

        updateNotificationStatus();

        return permission==="granted";

    }catch(error){

        console.error(
            "Notification permission error:",
            error
        );

        return false;

    }

}


function showDesktopNotification(message){

    if(
        !settings.desktopNotifications
    ){
        return;
    }


    if(
        !("Notification" in window)
    ){
        return;
    }


    if(
        Notification.permission!=="granted"
    ){
        return;
    }


    /*
        This uses the browser Notification API.
        On Windows, supported browsers normally
        display it through the Windows notification system.
    */

    try{

        const title=
            message.username||
            "New message";

        let body=
            message.message||
            "Sent an image";


        if(body.length>180){

            body=
                body.substring(0,180)+"…";

        }


        const notification=
            new Notification(
                title,
                {
                    body:body,
                    tag:"chat-"+message.id,
                    renotify:true,
                    silent:true
                }
            );


        notification.onclick=()=>{

            window.focus();

            notification.close();

        };

    }catch(error){

        console.error(
            "Desktop notification error:",
            error
        );

    }

}

/* =========================================================
   IMAGE RESIZE
========================================================= */

function resizeImage(file){

    return new Promise(
        (resolve,reject)=>{

            const reader=
                new FileReader();

            reader.onload=()=>{

                const img=
                    new Image();

                img.onload=()=>{

                    let width=
                        img.width;

                    let height=
                        img.height;

                    const max=1500;


                    if(
                        width>max ||
                        height>max
                    ){

                        const scale=
                            Math.min(
                                max/width,
                                max/height
                            );

                        width=
                            Math.round(
                                width*scale
                            );

                        height=
                            Math.round(
                                height*scale
                            );

                    }


                    const canvas=
                        document.createElement(
                            "canvas"
                        );

                    canvas.width=
                        width;

                    canvas.height=
                        height;


                    const ctx=
                        canvas.getContext(
                            "2d"
                        );


                    ctx.drawImage(
                        img,
                        0,
                        0,
                        width,
                        height
                    );


                    resolve(
                        canvas.toDataURL(
                            "image/jpeg",
                            .78
                        )
                    );

                };


                img.onerror=reject;

                img.src=
                    reader.result;

            };


            reader.onerror=reject;

            reader.readAsDataURL(file);

        }
    );

}

async function sendMessage(){

    const text=
        messageInput.value.trim();


    if(!settings.username){

        settingsBtn.click();

            "Set your name in Settings first."
        );

    sendBtn.disabled=true;


    try{

        let image=null;


        if(selectedFile){

            image=
                await resizeImage(
                    selectedFile
                );

        }


        const response=
            await fetch(
                API_URL,
                {
                    method:"POST",

                    headers:{

                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            channel:
                                CHANNEL,

                            message:
                                text,

                            image:
                                image,

                            device_id:
                                deviceId

                        })

                }
            );


        const data=
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error||

            );

        }


        messageInput.value="";

        messageInput.style.height=
            "auto";


        selectedFile=null;

        imageInput.value="";

        attachBtn.textContent="＋";


        await loadMessages();


    }catch(error){

        alert(
            "Failed to send:\n\n"+
            error.message
        );

    }finally{

        sendBtn.disabled=false;

    }

}


/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages(){

    try{

        const response=
            await fetch(
                API_URL+
                "?channel="+
                encodeURIComponent(
                    CHANNEL
                )
            );


        const data=
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error||
                "Failed to load messages."
            );

        }


        const incoming=
            Array.isArray(data.messages)
            ?data.messages
            :[];


        /*
            First load establishes the known messages.
            This prevents every old message from producing
            a notification when the page starts.
        */

        if(!hasLoadedMessages){

            incoming.forEach(message=>{

                knownMessageIds.add(
                    String(message.id)
                );

            });

            hasLoadedMessages=true;

        }

        else{

            incoming.forEach(message=>{

                const id=
                    String(message.id);


                if(
                    !knownMessageIds.has(id)
                ){

                    knownMessageIds.add(id);


                    const fromMe=
                        message.device_id &&
                        message.device_id===deviceId;


                    const mentionsMe=
                        message.message &&
                        settings.username &&
                        message.message
                        .toLowerCase()
                        .includes(
                            "@"+
                            settings.username
                            .toLowerCase()
                        );


                    if(!fromMe){

                        const shouldNotify=
                            settings.mentionNotifications
                            ?mentionsMe
                            :true;


                        if(shouldNotify){

                            playNotificationSound();

                            showDesktopNotification(
                                message
                            );

                        }

                    }

                }

            });


            /*
                Prevent the set from growing forever.
            */

            if(
                knownMessageIds.size>1000
            ){

                knownMessageIds=
                    new Set(
                        incoming.map(
                            m=>String(m.id)
                        )
                    );

            }

        }


        currentMessages=
            incoming;


        renderMessages();


    }catch(error){

        messagesEl.innerHTML=`

            <div class="empty">

                <div>

                    <strong>
                        Unable to load messages
                    </strong>

                    ${escapeHtml(
                        error.message
                    )}

                </div>

            </div>

        `;

    }

}


/* =========================================================
   RENDER
========================================================= */

function renderMessages(){

    const wasBottom=
        messagesEl.scrollHeight-
        messagesEl.scrollTop-
        messagesEl.clientHeight
        <100;


    if(!currentMessages.length){

        messagesEl.innerHTML=`

            <div class="empty">

                <div>

                    <strong>
                        No messages yet
                    </strong>

                    Be the first to send something.

                </div>

            </div>

        `;

        return;

    }


    const fragment=
        document.createDocumentFragment();


    currentMessages.forEach(
        message=>{

            const item=
                document.createElement(
                    "div"
                );


            item.className=
                "message";


            if(settings.compactMessages){

                item.classList.add(
                    "compact"
                );

            }


            item.dataset.id=
                message.id;


            const avatar=
                document.createElement(
                    "div"
                );


            avatar.className=
                "avatar";


            avatar.textContent=
                (message.username||"?")
                .charAt(0)
                .toUpperCase();


            const content=
                document.createElement(
                    "div"
                );


            content.className=
                "message-content";


            const top=
                document.createElement(
                    "div"
                );


            top.className=
                "message-top";


            const name=
                document.createElement(
                    "span"
                );


            name.className=
                "username";


            name.textContent=
                message.username||
                "User";


            top.appendChild(name);


            if(settings.showTimestamps){

                const time=
                    document.createElement(
                        "span"
                    );


                time.className=
                    "time";


                time.textContent=
                    formatTime(
                        message.created_at
                    );


                top.appendChild(time);

            }


            if(message.edited){

                const edited=
                    document.createElement(
                        "span"
                    );


                edited.className=
                    "edited";


                edited.textContent=
                    "(edited)";


                top.appendChild(
                    edited
                );

            }


            content.appendChild(top);


            if(message.message){

                const text=
                    document.createElement(
                        "div"
                    );


                text.className=
                    "message-text";


                text.textContent=
                    message.message;


                content.appendChild(
                    text
                );

            }


            if(message.image){

                const img=
                    document.createElement(
                        "img"
                    );


                img.className=
                    "message-image";


                img.src=
                    message.image;


                img.alt=
                    "Image";


                img.onclick=()=>{

                    openImage(
                        message.image
                    );

                };


                content.appendChild(
                    img
                );

            }


            item.appendChild(
                avatar
            );

            item.appendChild(
                content
            );


            /*
                Only allow the normal context menu
                for your own messages.
            */

            if(
                message.device_id &&
                message.device_id===deviceId
            ){

                item.addEventListener(
                    "contextmenu",
                    event=>{

                        event.preventDefault();

                        showContextMenu(
                            event.clientX,
                            event.clientY,
                            message
                        );

                    }
                );

            }


            fragment.appendChild(
                item
            );

        }
    );


    messagesEl.replaceChildren(
        fragment
    );


    if(
        wasBottom &&
        settings.autoScroll
    ){

        messagesEl.scrollTop=
            messagesEl.scrollHeight;

    }

}


/* =========================================================
   CONTEXT MENU
========================================================= */

function showContextMenu(
    x,
    y,
    message
){

    selectedMessage=
        message;


    contextMenu.style.left=
        Math.min(
            x,
            window.innerWidth-170
        )+"px";


    contextMenu.style.top=
        Math.min(
            y,
            window.innerHeight-100
        )+"px";


    contextMenu.classList.add(
        "show"
    );

}


document.addEventListener(
    "click",
    ()=>{

        contextMenu.classList.remove(
            "show"
        );

    }
);


/* =========================================================
   EDIT
========================================================= */

editMessageBtn.onclick=
    async event=>{

        event.stopPropagation();

        contextMenu.classList.remove(
            "show"
        );


        if(!selectedMessage){
            return;
        }


        const newText=
            prompt(
                "Edit message:",
                selectedMessage.message||""
            );


        if(newText===null){
            return;
        }


        try{

            const response=
                await fetch(
                    API_URL,
                    {
                        method:"PATCH",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                id:
                                    selectedMessage.id,

                                device_id:
                                    deviceId,

                                message:
                                    newText.trim()

                            })

                    }
                );


            const data=
                await response.json();


            if(!response.ok){

                throw new Error(
                    data.error||
                    "Failed to edit message."
                );

            }


            await loadMessages();


        }catch(error){

            alert(
                "Failed to edit:\n\n"+
                error.message
            );

        }

    };


/* =========================================================
   DELETE
========================================================= */

deleteMessageBtn.onclick=
    event=>{

        event.stopPropagation();

        contextMenu.classList.remove(
            "show"
        );


        if(!selectedMessage){
            return;
        }


        if(settings.confirmDelete){

            openConfirm(
                "Delete message?",
                "This message will be permanently removed.",
                deleteSelectedMessage
            );

        }else{

            deleteSelectedMessage();

        }

    };


async function deleteSelectedMessage(){

    if(!selectedMessage){
        return;
    }


    try{

        const response=
            await fetch(
                API_URL,
                {
                    method:"DELETE",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            id:
                                selectedMessage.id,

                            device_id:
                                deviceId

                        })

                }
            );


        const data=
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error||
                "Failed to delete message."
            );

        }


        selectedMessage=null;

        await loadMessages();


    }catch(error){

        alert(
            "Failed to delete:\n\n"+
            error.message
        );

    }

}


/* =========================================================
   IMAGE VIEWER
========================================================= */

function openImage(src){

    fullImage.src=
        src;

    imageViewer.classList.add(
        "show"
    );

}


function closeImage(){

    imageViewer.classList.remove(
        "show"
    );

    fullImage.src="";

}


backImage.onclick=
    closeImage;


imageViewer.onclick=
    event=>{

        if(
            event.target===
            imageViewer
        ){

            closeImage();

        }

    };


document.addEventListener(
    "keydown",
    event=>{

        if(
            event.key==="Escape" &&
            imageViewer.classList.contains(
                "show"
            )
        ){

            closeImage();

        }

    }
);


/* =========================================================
   CONFIRM
========================================================= */

function openConfirm(
    title,
    text,
    callback
){

    dialogTitle.textContent=
        title;

    dialogText.textContent=
        text;

    confirmCallback=
        callback;

    dialogOverlay.classList.add(
        "show"
    );

}


dialogCancel.onclick=()=>{

    dialogOverlay.classList.remove(
        "show"
    );

    confirmCallback=null;

};


dialogConfirm.onclick=
    async()=>{

        const callback=
            confirmCallback;


        dialogOverlay.classList.remove(
            "show"
        );


        confirmCallback=null;


        if(callback){

            await callback();

        }

    };


/* =========================================================
   REMOVE EVERYTHING
========================================================= */

removeEverything.onclick=()=>{

    openConfirm(

        "Remove everything?",

        "This will permanently remove every message and image from the chat for EVERYONE.",

        ()=>{

            openConfirm(

                "I know",

                "You understand that the entire chat history will be deleted.",

                ()=>{

                    openConfirm(

                        "Are you ultra sure?",

                        "Last time: every stored message and image will be permanently removed and there will be no chat history left.",

                        permanentlyDeleteEverything

                    );

                }

            );

        }

    );

};


async function permanentlyDeleteEverything(){

    try{

        const response=
            await fetch(
                API_URL,
                {
                    method:"DELETE",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            delete_all:true
                        })

                }
            );


        const data=
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error||
                "Failed to remove everything."
            );

        }


        currentMessages=[];

        knownMessageIds.clear();

        renderMessages();


        alert(
            "The entire chat has been wiped."
        );


    }catch(error){

        alert(
            "Failed to wipe chat:\n\n"+
            error.message
        );

    }

}


/* =========================================================
   REFRESH
========================================================= */

function startRefreshTimer(){

    if(refreshTimer){

        clearInterval(
            refreshTimer
        );

    }


    refreshTimer=
        setInterval(
            loadMessages,
            Number(
                settings.refreshRate
            )
        );

}


/* =========================================================
   HELPERS
========================================================= */

function formatTime(date){

    if(!date){
        return "";
    }


    return new Date(
        date
    ).toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


function escapeHtml(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================================
   START
========================================================= */

loadSettingsUI();

applySettings();

loadMessages();

</script>
