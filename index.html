<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#090b0e;
    color:#e9edf2;
    font-family:Inter,Arial,sans-serif;
}

body{
    overflow:hidden;
}

button,input,textarea,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:64px;
    min-height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    background:#111419;
    border-bottom:1px solid #272c34;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
}

.logo-icon{
    width:36px;
    height:36px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:#1b2027;
    border:1px solid #303640;
}

.channel{
    color:#7f8996;
    font-size:13px;
    font-weight:500;
}

.header-buttons{
    display:flex;
    gap:8px;
}

.icon-btn{
    width:38px;
    height:38px;
    border-radius:9px;
    border:1px solid #303640;
    background:#171b21;
    color:#e8edf2;
}

.icon-btn:hover{
    background:#222831;
}

/* MESSAGES */

.messages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:22px 18px;
}

.message{
    display:flex;
    gap:11px;
    margin-bottom:18px;
}

.avatar{
    flex:0 0 40px;
    width:40px;
    height:40px;
    border-radius:10px;
    display:grid;
    place-items:center;
    background:#20252d;
    border:1px solid #303640;
    font-weight:700;
}

.message-content{
    min-width:0;
    max-width:min(850px,calc(100vw - 90px));
}

.message-top{
    display:flex;
    align-items:center;
    gap:8px;
    min-height:20px;
}

.username{
    font-weight:700;
}

.time{
    font-size:11px;
    color:#68717d;
}

.edited{
    font-size:10px;
    color:#69727e;
}

.message-text{
    margin-top:3px;
    white-space:pre-wrap;
    word-break:break-word;
    line-height:1.45;
    color:#d7dce2;
}

.message-image{
    display:block;
    max-width:min(500px,80vw);
    max-height:500px;
    margin-top:9px;
    border-radius:10px;
    border:1px solid #303640;
    background:#050608;
    object-fit:contain;
    cursor:pointer;
}

/* COMPOSER */

.composer{
    padding:12px 16px 16px;
    background:#111419;
    border-top:1px solid #272c34;
}

.composer-box{
    width:min(1100px,100%);
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:8px;
    padding:8px;
    border:1px solid #303640;
    border-radius:13px;
    background:#181c22;
}

textarea{
    flex:1;
    min-height:42px;
    max-height:150px;
    resize:none;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    padding:10px;
}

textarea::placeholder{
    color:#69727e;
}

.attach-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:9px;
    background:transparent;
    color:#aeb7c2;
    font-size:20px;
}

.attach-btn:hover{
    background:#252b33;
}

.send-btn{
    height:42px;
    padding:0 18px;
    border:0;
    border-radius:9px;
    background:#e8ebee;
    color:#111;
    font-weight:700;
}

.send-btn:hover{
    background:white;
}

.send-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* OVERLAYS */

.overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.72);
    z-index:100;
}

.overlay.show{
    display:flex;
}

/* SETTINGS */

.panel{
    width:min(480px,calc(100vw - 30px));
    max-height:calc(100vh - 30px);
    overflow:auto;
    border-radius:15px;
    background:#12161b;
    border:1px solid #303640;
    box-shadow:0 25px 80px rgba(0,0,0,.6);
}

.panel-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px;
    border-bottom:1px solid #292e36;
}

.panel-header h2{
    margin:0;
}

.panel-body{
    padding:18px;
}

.setting{
    margin-bottom:20px;
}

.setting label{
    display:block;
    margin-bottom:7px;
    color:#9ca5b1;
    font-size:13px;
}

.setting input,
.setting select{
    width:100%;
    padding:11px;
    border-radius:9px;
    border:1px solid #303640;
    outline:0;
    background:#1a1f26;
    color:white;
}

.save-btn{
    width:100%;
    padding:11px;
    border:0;
    border-radius:9px;
    background:#e8ebee;
    color:#111;
    font-weight:700;
}

.danger-zone{
    margin-top:25px;
    padding-top:20px;
    border-top:1px solid #30262a;
}

.danger-title{
    color:#ff7777;
    font-weight:700;
}

.danger-zone p{
    color:#929ba7;
    font-size:13px;
    line-height:1.5;
}

.danger-btn{
    width:100%;
    padding:11px;
    border-radius:9px;
    border:1px solid #743333;
    background:#241719;
    color:#ff8585;
}

/* CONTEXT MENU */

.context-menu{
    position:fixed;
    display:none;
    z-index:200;
    width:160px;
    padding:5px;
    border-radius:9px;
    background:#171b21;
    border:1px solid #343a43;
    box-shadow:0 15px 40px rgba(0,0,0,.55);
}

.context-menu.show{
    display:block;
}

.context-menu button{
    width:100%;
    padding:9px 10px;
    text-align:left;
    border:0;
    border-radius:6px;
    background:transparent;
    color:#e4e8ed;
}

.context-menu button:hover{
    background:#252b33;
}

.context-menu .delete-option{
    color:#ff7777;
}

/* IMAGE VIEWER */

.image-viewer{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.97);
    z-index:300;
}

.image-viewer.show{
    display:flex;
}

.full-image{
    max-width:95vw;
    max-height:90vh;
    object-fit:contain;
}

.back-image{
    position:absolute;
    top:18px;
    left:18px;
    padding:10px 16px;
    border-radius:9px;
    border:1px solid #3a4049;
    background:#171b21;
    color:white;
}

/* DIALOG */

.dialog{
    width:min(450px,calc(100vw - 30px));
    padding:20px;
    border-radius:14px;
    background:#14181e;
    border:1px solid #303640;
}

.dialog h2{
    margin-top:0;
}

.dialog p{
    color:#aab2bd;
    line-height:1.5;
}

.dialog-buttons{
    display:flex;
    justify-content:flex-end;
    gap:8px;
}

.dialog-buttons button{
    padding:10px 16px;
    border-radius:8px;
    border:1px solid #343a43;
    background:#20252c;
    color:white;
}

.dialog-buttons .danger{
    background:#6b2929;
    border-color:#813434;
}

/* EMPTY */

.empty{
    height:100%;
    display:grid;
    place-items:center;
    text-align:center;
    color:#656d78;
}

.empty strong{
    display:block;
    margin-bottom:5px;
    color:#aab2bd;
}

/* MOBILE */

@media(max-width:600px){

    .header{
        padding:0 11px;
    }

    .messages{
        padding:15px 11px;
    }

    .message-content{
        max-width:calc(100vw - 70px);
    }

    .channel{
        display:none;
    }

    .message-image{
        max-width:80vw;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="logo">

        <div class="logo-icon">💬</div>

        <span>Chat</span>

        <span class="channel">
            # general
        </span>

    </div>

    <div class="header-buttons">

        <button
            class="icon-btn"
            id="settingsBtn"
            title="Settings"
        >⚙</button>

    </div>

</header>

<main
    class="messages"
    id="messages"
></main>

<div class="composer">

    <div class="composer-box">

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
        >

        <button
            class="attach-btn"
            id="attachBtn"
            title="Choose image"
        >＋</button>

        <textarea
            id="messageInput"
            rows="1"
            placeholder="Message #general"
        ></textarea>

        <button
            class="send-btn"
            id="sendBtn"
        >Send</button>

    </div>

</div>

</div>


<!-- SETTINGS -->

<div
    class="overlay"
    id="settingsOverlay"
>

<div class="panel">

<div class="panel-header">

<h2>Settings</h2>

<button
    class="icon-btn"
    id="closeSettings"
>×</button>

</div>

<div class="panel-body">

<div class="setting">

<label>Your name</label>

<input
    id="usernameInput"
    maxlength="24"
    placeholder="Your name"
/>

</div>

<div class="setting">

<label>Theme</label>

<select id="themeSelect">

<option value="dark">Dark</option>
<option value="midnight">Midnight</option>
<option value="slate">Slate</option>
<option value="black">Pure Black</option>
<option value="blue">Dark Blue</option>
<option value="purple">Dark Purple</option>
<option value="green">Dark Green</option>
<option value="red">Dark Red</option>
<option value="gray">Classic Gray</option>
<option value="light">Light</option>
<option value="oled">OLED</option>

</select>

</div>

<button
    class="save-btn"
    id="saveSettings"
>
Save settings
</button>

<div class="danger-zone">

<div class="danger-title">
Danger zone
</div>

<p>
Permanently remove messages from the chat.
</p>

<button
    class="danger-btn"
    id="removeEverything"
>
Remove everything
</button>

</div>

</div>

</div>

</div>


<!-- CONTEXT MENU -->

<div
    class="context-menu"
    id="contextMenu"
>

<button id="editMessage">
Edit
</button>

<button
    id="deleteMessage"
    class="delete-option"
>
Delete
</button>

</div>


<!-- IMAGE VIEWER -->

<div
    class="image-viewer"
    id="imageViewer"
>

<button
    class="back-image"
    id="backImage"
>
← Back
</button>

<img
    class="full-image"
    id="fullImage"
    alt="Full image"
/>

</div>


<!-- DIALOG -->

<div
    class="overlay"
    id="dialogOverlay"
>

<div class="dialog">

<h2 id="dialogTitle">
Confirm
</h2>

<p id="dialogText"></p>

<div class="dialog-buttons">

<button id="dialogCancel">
Cancel
</button>

<button
    class="danger"
    id="dialogConfirm"
>
Yes
</button>

</div>

</div>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const API_URL = "/api/messages";
const CHANNEL = "general";


/* =====================================================
   DEVICE ID
===================================================== */

let deviceId =
    localStorage.getItem("chat_device_id");

if(!deviceId){

    deviceId =
        crypto.randomUUID();

    localStorage.setItem(
        "chat_device_id",
        deviceId
    );

}


/* =====================================================
   USERNAME
===================================================== */

let username =
    localStorage.getItem("chat_username");

/*
   IMPORTANT FIX:

   If the user has never chosen a name,
   automatically create one.

   This prevents:

   "Username is required"

   from stopping the Send button.
*/

if(
    !username ||
    !username.trim()
){

    username = "User";

    localStorage.setItem(
        "chat_username",
        username
    );

}


/* =====================================================
   THEME
===================================================== */

let theme =
    localStorage.getItem("chat_theme") ||
    "dark";


/* =====================================================
   ELEMENTS
===================================================== */

const messagesEl =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const imageInput =
    document.getElementById("imageInput");

const attachBtn =
    document.getElementById("attachBtn");

const settingsBtn =
    document.getElementById("settingsBtn");

const settingsOverlay =
    document.getElementById("settingsOverlay");

const closeSettings =
    document.getElementById("closeSettings");

const usernameInput =
    document.getElementById("usernameInput");

const themeSelect =
    document.getElementById("themeSelect");

const saveSettings =
    document.getElementById("saveSettings");

const contextMenu =
    document.getElementById("contextMenu");

const editMessageBtn =
    document.getElementById("editMessage");

const deleteMessageBtn =
    document.getElementById("deleteMessage");

const imageViewer =
    document.getElementById("imageViewer");

const fullImage =
    document.getElementById("fullImage");

const backImage =
    document.getElementById("backImage");

const dialogOverlay =
    document.getElementById("dialogOverlay");

const dialogTitle =
    document.getElementById("dialogTitle");

const dialogText =
    document.getElementById("dialogText");

const dialogCancel =
    document.getElementById("dialogCancel");

const dialogConfirm =
    document.getElementById("dialogConfirm");

const removeEverything =
    document.getElementById("removeEverything");


/* =====================================================
   STATE
===================================================== */

let selectedMessage = null;
let selectedFile = null;
let currentMessages = [];
let confirmCallback = null;


/* =====================================================
   THEMES
===================================================== */

const themes = {

dark:{
    bg:"#090b0e",
    panel:"#111419"
},

midnight:{
    bg:"#080b14",
    panel:"#101522"
},

slate:{
    bg:"#101418",
    panel:"#171d22"
},

black:{
    bg:"#000",
    panel:"#090909"
},

blue:{
    bg:"#091018",
    panel:"#101c29"
},

purple:{
    bg:"#100b17",
    panel:"#191021"
},

green:{
    bg:"#09120d",
    panel:"#101b15"
},

red:{
    bg:"#140b0b",
    panel:"#1e1111"
},

gray:{
    bg:"#151515",
    panel:"#202020"
},

light:{
    bg:"#eeeeee",
    panel:"#fff"
},

oled:{
    bg:"#000",
    panel:"#000"
}

};


function applyTheme(name){

    const selected =
        themes[name] ||
        themes.dark;

    document.documentElement.style.setProperty(
        "--theme-bg",
        selected.bg
    );

    document.body.style.background =
        selected.bg;

    document.querySelector(".header")
        .style.background =
        selected.panel;

    document.querySelector(".composer")
        .style.background =
        selected.panel;

}


/* =====================================================
   INITIAL SETTINGS
===================================================== */

applyTheme(theme);

usernameInput.value =
    username;

themeSelect.value =
    theme;


/* =====================================================
   SETTINGS
===================================================== */

settingsBtn.onclick = () => {

    usernameInput.value =
        username;

    themeSelect.value =
        theme;

    settingsOverlay.classList.add(
        "show"
    );

};

closeSettings.onclick = () => {

    settingsOverlay.classList.remove(
        "show"
    );

};

saveSettings.onclick = () => {

    let newName =
        usernameInput.value
            .trim()
            .substring(0,24);

    if(!newName){

        newName = "User";

    }

    username =
        newName;

    theme =
        themeSelect.value;

    localStorage.setItem(
        "chat_username",
        username
    );

    localStorage.setItem(
        "chat_theme",
        theme
    );

    applyTheme(theme);

    settingsOverlay.classList.remove(
        "show"
    );

};


/* =====================================================
   TEXTAREA
===================================================== */

messageInput.addEventListener(
    "input",
    () => {

        messageInput.style.height =
            "auto";

        messageInput.style.height =
            Math.min(
                messageInput.scrollHeight,
                150
            ) + "px";

    }
);


/* =====================================================
   IMAGE PICKER
===================================================== */

attachBtn.onclick = () => {

    imageInput.click();

};

imageInput.onchange = () => {

    selectedFile =
        imageInput.files[0] ||
        null;

    attachBtn.textContent =
        selectedFile
            ? "✓"
            : "＋";

};


/* =====================================================
   IMAGE RESIZE
   MAX 1500 x 1500
===================================================== */

function resizeImage(file){

    return new Promise(
        (resolve,reject)=>{

            const reader =
                new FileReader();

            reader.onload = () => {

                const img =
                    new Image();

                img.onload = () => {

                    let width =
                        img.width;

                    let height =
                        img.height;

                    const max = 1500;

                    if(
                        width > max ||
                        height > max
                    ){

                        const scale =
                            Math.min(
                                max / width,
                                max / height
                            );

                        width =
                            Math.round(
                                width * scale
                            );

                        height =
                            Math.round(
                                height * scale
                            );

                    }

                    const canvas =
                        document.createElement(
                            "canvas"
                        );

                    canvas.width =
                        width;

                    canvas.height =
                        height;

                    const ctx =
                        canvas.getContext(
                            "2d"
                        );

                    ctx.drawImage(
                        img,
                        0,
                        0,
                        width,
                        height
                    );

                    resolve(
                        canvas.toDataURL(
                            "image/jpeg",
                            .78
                        )
                    );

                };

                img.onerror =
                    reject;

                img.src =
                    reader.result;

            };

            reader.onerror =
                reject;

            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =====================================================
   SEND
===================================================== */

sendBtn.onclick =
    sendMessage;

messageInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


async function sendMessage(){

    /*
       Make absolutely sure a username exists.
    */

    if(
        !username ||
        !username.trim()
    ){

        username = "User";

        localStorage.setItem(
            "chat_username",
            username
        );

    }

    const text =
        messageInput.value.trim();

    if(
        !text &&
        !selectedFile
    ){

        return;

    }

    sendBtn.disabled = true;

    try{

        let image = null;

        if(selectedFile){

            image =
                await resizeImage(
                    selectedFile
                );

        }

        const response =
            await fetch(
                API_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        username:
                            username,

                        channel:
                            CHANNEL,

                        message:
                            text,

                        image:
                            image,

                        device_id:
                            deviceId

                    })
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Failed to send message."
            );

        }

        messageInput.value = "";

        messageInput.style.height =
            "auto";

        selectedFile = null;

        imageInput.value = "";

        attachBtn.textContent =
            "＋";

        await loadMessages();

    }
    catch(error){

        alert(
            "Failed to send:\n\n" +
            error.message
        );

    }
    finally{

        sendBtn.disabled = false;

    }

}


/* =====================================================
   LOAD
===================================================== */

async function loadMessages(){

    try{

        const response =
            await fetch(
                API_URL +
                "?channel=" +
                encodeURIComponent(
                    CHANNEL
                ),
                {
                    cache:"no-store"
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Failed to load messages."
            );

        }

        currentMessages =
            Array.isArray(
                data.messages
            )
            ? data.messages
            : [];

        renderMessages();

    }
    catch(error){

        messagesEl.innerHTML = `
            <div class="empty">
                <div>
                    <strong>Unable to load messages</strong>
                    ${escapeHtml(error.message)}
                </div>
            </div>
        `;

    }

}


/* =====================================================
   RENDER
===================================================== */

function renderMessages(){

    const shouldScroll =
        messagesEl.scrollHeight -
        messagesEl.scrollTop -
        messagesEl.clientHeight <
        120;

    if(!currentMessages.length){

        messagesEl.innerHTML = `
            <div class="empty">
                <div>
                    <strong>No messages yet</strong>
                    Be the first to send something.
                </div>
            </div>
        `;

        return;

    }

    const fragment =
        document.createDocumentFragment();

    for(const message of currentMessages){

        const item =
            document.createElement(
                "div"
            );

        item.className =
            "message";

        item.dataset.id =
            message.id;

        /*
           IMPORTANT:

           Ownership is ONLY determined
           by device_id.

           Username is never used.
        */

        item.dataset.owner =
            message.device_id === deviceId
                ? "true"
                : "false";

        const avatar =
            document.createElement(
                "div"
            );

        avatar.className =
            "avatar";

        avatar.textContent =
            (
                message.username ||
                "?"
            )
            .charAt(0)
            .toUpperCase();

        const content =
            document.createElement(
                "div"
            );

        content.className =
            "message-content";

        const top =
            document.createElement(
                "div"
            );

        top.className =
            "message-top";

        const name =
            document.createElement(
                "span"
            );

        name.className =
            "username";

        name.textContent =
            message.username ||
            "User";

        const time =
            document.createElement(
                "span"
            );

        time.className =
            "time";

        time.textContent =
            formatTime(
                message.created_at
            );

        top.appendChild(name);
        top.appendChild(time);

        if(message.edited){

            const edited =
                document.createElement(
                    "span"
                );

            edited.className =
                "edited";

            edited.textContent =
                "(edited)";

            top.appendChild(
                edited
            );

        }

        content.appendChild(top);

        if(message.message){

            const text =
                document.createElement(
                    "div"
                );

            text.className =
                "message-text";

            text.textContent =
                message.message;

            content.appendChild(text);

        }

        if(message.image){

            const image =
                document.createElement(
                    "img"
                );

            image.className =
                "message-image";

            image.src =
                message.image;

            image.alt =
                "Image";

            image.onclick = () => {

                openImage(
                    message.image
                );

            };

            content.appendChild(
                image
            );

        }

        item.appendChild(
            avatar
        );

        item.appendChild(
            content
        );

        /*
           Right click.

           Only the device that created
           the message can edit/delete it.
        */

        item.addEventListener(
            "contextmenu",
            event => {

                event.preventDefault();

                if(
                    message.device_id ===
                    deviceId
                ){

                    showContextMenu(
                        event.clientX,
                        event.clientY,
                        message
                    );

                }

            }
        );

        fragment.appendChild(
            item
        );

    }

    /*
       replaceChildren is instant.

       No fade.
       No animation.
       No message blinking.
    */

    messagesEl.replaceChildren(
        fragment
    );

    if(shouldScroll){

        messagesEl.scrollTop =
            messagesEl.scrollHeight;

    }

}


/* =====================================================
   CONTEXT MENU
===================================================== */

function showContextMenu(
    x,
    y,
    message
){

    selectedMessage =
        message;

    contextMenu.style.left =
        Math.min(
            x,
            window.innerWidth - 170
        ) + "px";

    contextMenu.style.top =
        Math.min(
            y,
            window.innerHeight - 100
        ) + "px";

    contextMenu.classList.add(
        "show"
    );

}

document.addEventListener(
    "click",
    event => {

        if(
            !contextMenu.contains(
                event.target
            )
        ){

            contextMenu.classList.remove(
                "show"
            );

        }

    }
);


/* =====================================================
   EDIT
===================================================== */

editMessageBtn.onclick =
    async event => {

        event.stopPropagation();

        contextMenu.classList.remove(
            "show"
        );

        if(!selectedMessage){
            return;
        }

        /*
           Double-check ownership.
        */

        if(
            selectedMessage.device_id !==
            deviceId
        ){

            alert(
                "You can only edit your own messages."
            );

            return;

        }

        const newText =
            prompt(
                "Edit message:",
                selectedMessage.message ||
                ""
            );

        if(newText === null){
            return;
        }

        const cleanText =
            newText.trim();

        try{

            const response =
                await fetch(
                    API_URL,
                    {

                        method:"PATCH",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({

                            id:
                                selectedMessage.id,

                            device_id:
                                deviceId,

                            message:
                                cleanText

                        })

                    }
                );

            const data =
                await response.json();

            if(!response.ok){

                throw new Error(
                    data.error ||
                    "Failed to edit message."
                );

            }

            await loadMessages();

        }
        catch(error){

            alert(
                "Failed to edit:\n\n" +
                error.message
            );

        }

    };


/* =====================================================
   DELETE MESSAGE
===================================================== */

deleteMessageBtn.onclick =
    event => {

        event.stopPropagation();

        contextMenu.classList.remove(
            "show"
        );

        if(!selectedMessage){
            return;
        }

        if(
            selectedMessage.device_id !==
            deviceId
        ){

            alert(
                "You can only delete your own messages."
            );

            return;

        }

        openConfirm(
            "Delete message?",
            "This message will be permanently removed.",
            async () => {

                try{

                    const response =
                        await fetch(
                            API_URL,
                            {

                                method:"DELETE",

                                headers:{
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        id:
                                            selectedMessage.id,

                                        device_id:
                                            deviceId

                                    })

                            }
                        );

                    const data =
                        await response.json();

                    if(!response.ok){

                        throw new Error(
                            data.error ||
                            "Failed to delete message."
                        );

                    }

                    await loadMessages();

                }
                catch(error){

                    alert(
                        "Failed to delete:\n\n" +
                        error.message
                    );

                }

            }
        );

    };


/* =====================================================
   IMAGE VIEWER
===================================================== */

function openImage(src){

    fullImage.src =
        src;

    imageViewer.classList.add(
        "show"
    );

}

function closeImage(){

    imageViewer.classList.remove(
        "show"
    );

    fullImage.src = "";

}

backImage.onclick =
    closeImage;

imageViewer.onclick =
    event => {

        if(
            event.target ===
            imageViewer
        ){

            closeImage();

        }

    };

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Escape"
        ){

            closeImage();

        }

    }
);


/* =====================================================
   DIALOG
===================================================== */

function openConfirm(
    title,
    text,
    callback
){

    dialogTitle.textContent =
        title;

    dialogText.textContent =
        text;

    confirmCallback =
        callback;

    dialogOverlay.classList.add(
        "show"
    );

}

dialogCancel.onclick = () => {

    dialogOverlay.classList.remove(
        "show"
    );

    confirmCallback = null;

};

dialogConfirm.onclick =
    async () => {

        const callback =
            confirmCallback;

        dialogOverlay.classList.remove(
            "show"
        );

        confirmCallback = null;

        if(callback){

            await callback();

        }

    };


/* =====================================================
   REMOVE EVERYTHING
===================================================== */

/*
   The UI keeps the three-step confirmation.

   The API deliberately does NOT expose an unrestricted
   public "delete every message" operation because the
   publishable key is public.

   A public endpoint that deletes the entire table would
   allow ANYONE who finds the endpoint to erase the chat.
*/

removeEverything.onclick =
    () => {

        openConfirm(
            "Remove everything?",
            "This would permanently remove every message from the chat.",
            () => {

                openConfirm(
                    "I know",
                    "You are about to permanently delete chat data.",
                    () => {

                        openConfirm(
                            "Are you sure?",
                            "Every stored message would be permanently removed.",
                            () => {

                                openConfirm(
                                    "Last time",
                                    "Are you ultra sure you want to permanently remove the chat data?",
                                    () => {

                                        alert(
                                            "Global deletion is disabled in this public-key version. Add secure server-side admin authentication before enabling it."
                                        );

                                    }
                                );

                            }
                        );

                    }
                );

            }
        );

    };


/* =====================================================
   HELPERS
===================================================== */

function formatTime(date){

    if(!date){
        return "";
    }

    const d =
        new Date(date);

    return d.toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =====================================================
   START
===================================================== */

loadMessages();


/*
   Poll every 3 seconds.

   Rendering is instant and has NO CSS
   fade/opacity animation.
*/

setInterval(
    loadMessages,
    3000
);

</script>
