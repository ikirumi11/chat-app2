<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat</title>

<style>
*{box-sizing:border-box}

:root{
    --bg:#0b0d10;
    --panel:#111419;
    --panel2:#181c22;
    --border:#292f38;
    --text:#edf0f4;
    --muted:#7e8793;
    --accent:#e8eaed;
    --danger:#ff7070;
    --radius:12px;
    --text-size:16px;
    --word-spacing:0px;
    --line-spacing:1.45;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

body{
    overflow:hidden;
}

button,input,textarea,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

.header{
    height:64px;
    min-height:64px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel);
    border-bottom:1px solid var(--border);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
}

.logo-icon{
    width:35px;
    height:35px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:var(--panel2);
    border:1px solid var(--border);
}

.channel{
    color:var(--muted);
    font-weight:400;
}

.icon-btn{
    width:39px;
    height:39px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    display:flex;
    gap:11px;
    margin-bottom:17px;
}

.avatar{
    flex:0 0 40px;
    width:40px;
    height:40px;
    display:grid;
    place-items:center;
    border-radius:var(--radius);
    background:var(--panel2);
    border:1px solid var(--border);
    font-weight:700;
}

.message-content{
    min-width:0;
    max-width:min(850px,calc(100vw - 90px));
}

.message-top{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:3px;
}

.username{
    font-weight:700;
}

.time,.edited{
    color:var(--muted);
    font-size:11px;
}

.message-text{
    color:#d8dde4;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    font-size:var(--text-size);
    word-spacing:var(--word-spacing);
    line-height:var(--line-spacing);
}

.message-image{
    display:block;
    max-width:min(500px,80vw);
    max-height:500px;
    margin-top:8px;
    border:1px solid var(--border);
    border-radius:var(--radius);
}

.composer{
    padding:12px 16px 16px;
    background:var(--panel);
    border-top:1px solid var(--border);
}

.composer-box{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:8px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:14px;
}

textarea{
    flex:1;
    min-height:42px;
    max-height:150px;
    resize:none;
    border:0;
    outline:none;
    background:transparent;
    color:white;
    padding:10px;
}

.attach-btn,.send-btn{
    height:42px;
    border:0;
    border-radius:9px;
}

.attach-btn{
    width:42px;
    background:transparent;
    color:#adb5c0;
}

.send-btn{
    padding:0 18px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

.send-btn:disabled{
    opacity:.5;
}

.overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000b;
    z-index:100;
}

.overlay.show{
    display:flex;
}

.panel{
    width:min(520px,calc(100vw - 25px));
    max-height:calc(100vh - 25px);
    overflow-y:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px;
    border-bottom:1px solid var(--border);
}

.panel-header h2{
    margin:0;
}

.panel-body{
    padding:18px;
}

.category{
    margin-bottom:12px;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    background:var(--panel2);
}

.category-title{
    width:100%;
    padding:14px;
    border:0;
    background:transparent;
    color:var(--text);
    display:flex;
    justify-content:space-between;
    font-weight:700;
    text-align:left;
}

.category-body{
    display:none;
    padding:0 14px 14px;
}

.category.open .category-body{
    display:block;
}

.setting{
    margin-top:14px;
}

.setting label{
    display:block;
    margin-bottom:7px;
    color:#aab2bd;
    font-size:13px;
}

.setting input,.setting select{
    width:100%;
    padding:10px;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
    background:#101419;
    color:white;
}

.save-btn{
    width:100%;
    margin-top:8px;
    padding:12px;
    border:0;
    border-radius:9px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

.danger-zone{
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid #402529;
}

.danger-title{
    color:var(--danger);
    font-weight:700;
    margin-bottom:7px;
}

.danger-btn{
    width:100%;
    padding:12px;
    border-radius:9px;
    border:1px solid #743333;
    background:#241719;
    color:#ff8585;
}

.context-menu{
    position:fixed;
    display:none;
    width:160px;
    padding:5px;
    z-index:200;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:9px;
}

.context-menu.show{
    display:block;
}

.context-menu button{
    width:100%;
    padding:9px;
    text-align:left;
    border:0;
    border-radius:6px;
    background:transparent;
    color:white;
}

.delete-option{
    color:#ff7777!important;
}

/* GAME AREA */

.games-area{
    margin-top:30px;
    padding-top:18px;
    border-top:1px solid var(--border);
}

.games-title{
    color:var(--muted);
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
    margin-bottom:12px;
}

.game-card{
    background:linear-gradient(145deg,#151a21,#101318);
    border:1px solid #303743;
    border-radius:15px;
    padding:16px;
    margin-bottom:12px;
    box-shadow:0 8px 30px #0005;
}

.game-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
}

.game-name{
    font-size:18px;
    font-weight:800;
}

.game-host{
    color:var(--muted);
    font-size:12px;
    margin-top:3px;
}

.game-status{
    color:#aeb7c3;
    font-size:13px;
    margin:10px 0;
}

.game-actions{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.game-actions button,
.game-control{
    border:1px solid #343b46;
    background:#202630;
    color:white;
    padding:9px 12px;
    border-radius:9px;
}

.game-actions .primary{
    background:#eee;
    color:#111;
}

.game-actions .danger{
    color:#ff8888;
    border-color:#713b3b;
}

.game-board{
    margin-top:14px;
    padding:14px;
    background:#0b0e12;
    border:1px solid #252b34;
    border-radius:12px;
}

.turn{
    padding:8px 10px;
    background:#151a21;
    border-radius:8px;
    color:#dfe4ea;
    margin-bottom:12px;
}

.players{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin:10px 0;
}

.player{
    padding:5px 9px;
    border-radius:20px;
    background:#202630;
    font-size:12px;
}

.player.joined{
    border:1px solid #596575;
}

.choice-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.choice-row button{
    min-width:75px;
    padding:10px;
    border:1px solid #343b46;
    border-radius:9px;
    background:#191e25;
    color:white;
}

.number-input{
    display:flex;
    gap:7px;
}

.number-input input{
    flex:1;
    min-width:0;
    padding:10px;
    background:#101419;
    color:white;
    border:1px solid var(--border);
    border-radius:9px;
}

.ttt{
    display:grid;
    grid-template-columns:repeat(3,70px);
    gap:6px;
    justify-content:center;
}

.ttt button{
    width:70px;
    height:70px;
    font-size:28px;
    font-weight:800;
    background:#171c23;
    color:white;
    border:1px solid #343b46;
    border-radius:9px;
}

.connect4{
    display:grid;
    grid-template-columns:repeat(7,42px);
    gap:5px;
    justify-content:center;
}

.connect4 button{
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid #39414d;
    background:#151a20;
    color:white;
    font-weight:bold;
}

.word-input{
    display:flex;
    gap:7px;
}

.word-input input{
    flex:1;
    min-width:0;
    padding:10px;
    border-radius:9px;
    border:1px solid var(--border);
    background:#101419;
    color:white;
}

.log{
    max-height:150px;
    overflow:auto;
    padding:8px;
    background:#090c10;
    border-radius:8px;
    font-size:12px;
    color:#aab2bd;
}

.empty{
    height:100%;
    display:grid;
    place-items:center;
    color:#656d78;
    text-align:center;
}

.empty strong{
    display:block;
    color:#aab2bd;
    margin-bottom:5px;
}

@media(max-width:600px){
    .header{
        padding:0 11px;
    }

    .messages{
        padding:15px 11px;
    }

    .channel{
        display:none;
    }

    .message-content{
        max-width:calc(100vw - 70px);
    }

    .connect4{
        grid-template-columns:repeat(7,35px);
    }

    .connect4 button{
        width:35px;
        height:35px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">
    <div class="logo">
        <div class="logo-icon">💬</div>
        <span>Chat</span>
        <span class="channel"># general</span>
    </div>

    <button class="icon-btn" id="settingsBtn">⚙</button>
</header>

<main class="messages" id="messages"></main>

<div class="composer">
    <div class="composer-box">

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
        >

        <button class="attach-btn" id="attachBtn">＋</button>

        <textarea
            id="messageInput"
            rows="1"
            placeholder="Message #general"
        ></textarea>

        <button class="send-btn" id="sendBtn">
            Send
        </button>

    </div>
</div>

</div>


<!-- SETTINGS -->

<div class="overlay" id="settingsOverlay">

<div class="panel">

<div class="panel-header">
    <h2>Settings</h2>
    <button class="icon-btn" id="closeSettings">×</button>
</div>

<div class="panel-body">

<div class="category open">

<button class="category-title">
    <span>👤 Profile</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Your name</label>
<input id="usernameInput" maxlength="24">
</div>

<div class="setting">
<label>Device ID</label>
<input id="deviceIdInput" readonly>
</div>

</div>
</div>


<div class="category">

<button class="category-title">
    <span>💬 Chat</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Refresh rate</label>
<select id="refreshRate">
<option value="10000">10 seconds</option>
<option value="5000">5 seconds</option>
<option value="3000">3 seconds</option>
<option value="2000">2 seconds</option>
<option value="1000">1 second</option>
<option value="500">0.5 seconds</option>
<option value="100">0.1 seconds</option>
</select>
</div>

<div class="setting">
<label>Show timestamps</label>
<select id="showTimestamps">
<option value="true">On</option>
<option value="false">Off</option>
</select>
</div>

</div>
</div>


<div class="category">

<button class="category-title">
    <span>🎮 Games</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Game refresh</label>
<select id="gameRefresh">
<option value="250">0.25 seconds</option>
<option value="500">0.5 seconds</option>
<option value="1000">1 second</option>
<option value="2000">2 seconds</option>
</select>
</div>

<div class="setting">
<label>Game notifications</label>
<select id="gameNotifications">
<option value="true">On</option>
<option value="false">Off</option>
</select>
</div>

</div>
</div>


<div class="category">

<button class="category-title">
    <span>📝 Text</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Text size</label>
<input id="textSize" type="range" min="12" max="24">
</div>

<div class="setting">
<label>Word spacing</label>
<input id="wordSpacing" type="range" min="0" max="12">
</div>

<div class="setting">
<label>Line spacing</label>
<input id="lineSpacing" type="range" min="1" max="2" step=".05">
</div>

</div>
</div>


<div class="category">

<button class="category-title">
    <span>🎨 Appearance</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Theme</label>

<select id="themeSelect">
<option value="dark">Dark</option>
<option value="midnight">Midnight</option>
<option value="black">Pure Black</option>
<option value="blue">Dark Blue</option>
<option value="purple">Dark Purple</option>
<option value="green">Dark Green</option>
<option value="red">Dark Red</option>
<option value="gray">Classic Gray</option>
<option value="light">Light</option>
</select>

</div>

</div>
</div>


<button class="save-btn" id="saveSettings">
Save settings
</button>


<div class="danger-zone">

<div class="danger-title">
⚠ Danger Zone
</div>

<p>
Remove every message from the chat permanently.
</p>

<button class="danger-btn" id="removeEverything">
Remove everything
</button>

</div>

</div>
</div>
</div>


<!-- CREATE GAME -->

<div class="overlay" id="gameCreateOverlay">

<div class="panel">

<div class="panel-header">
    <h2>🎮 Create Game</h2>
    <button class="icon-btn" id="closeGameCreate">×</button>
</div>

<div class="panel-body">

<div class="setting">
<label>Game</label>

<select id="gameType">

<option value="dice">🎲 Dice Battle</option>
<option value="ttt">❌⭕ Tic-Tac-Toe</option>
<option value="connect4">🔴🟡 Connect 4</option>
<option value="higher">🃏 Higher or Lower</option>
<option value="trivia">🧠 Trivia</option>
<option value="word">🔤 Word Chain</option>
<option value="guess">🎯 Number Guessing</option>
<option value="reversi">⚫⚪ Reversi</option>
<option value="quiz">🏆 Quiz Show</option>
<option value="auction">💰 Auction</option>

</select>
</div>

<div class="setting">
<label>Maximum players</label>

<select id="gameMax">
<option value="2">2</option>
<option value="3">3</option>
<option value="4" selected>4</option>
<option value="5">5</option>
<option value="6">6</option>
<option value="8">8</option>
</select>
</div>

<button class="save-btn" id="createGame">
Create game
</button>

</div>
</div>
</div>


<!-- CONTEXT MENU -->

<div class="context-menu" id="contextMenu">

<button id="editMessage">
Edit
</button>

<button class="delete-option" id="deleteMessage">
Delete
</button>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API_URL="/api/messages";
const CHANNEL="general";

const GAME_REFRESH=500;


/* =========================================================
   DEVICE
========================================================= */

let deviceId=localStorage.getItem("chat_device_id");

if(!deviceId){
    deviceId=crypto.randomUUID();
    localStorage.setItem("chat_device_id",deviceId);
}


/* =========================================================
   SETTINGS
========================================================= */

const defaults={
    username:"",
    refreshRate:500,
    gameRefresh:500,
    gameNotifications:true,
    showTimestamps:true,
    textSize:16,
    wordSpacing:0,
    lineSpacing:1.45,
    theme:"dark"
};

let settings={};

for(const key in defaults){
    const saved=localStorage.getItem("chat_"+key);

    if(saved===null){
        settings[key]=defaults[key];
    }else if(saved==="true"){
        settings[key]=true;
    }else if(saved==="false"){
        settings[key]=false;
    }else if(!Number.isNaN(Number(saved))){
        settings[key]=Number(saved);
    }else{
        settings[key]=saved;
    }
}


/* =========================================================
   ELEMENTS
========================================================= */

const messagesEl=document.getElementById("messages");
const messageInput=document.getElementById("messageInput");
const sendBtn=document.getElementById("sendBtn");
const imageInput=document.getElementById("imageInput");
const attachBtn=document.getElementById("attachBtn");

const settingsBtn=document.getElementById("settingsBtn");
const settingsOverlay=document.getElementById("settingsOverlay");
const closeSettings=document.getElementById("closeSettings");
const saveSettings=document.getElementById("saveSettings");

const usernameInput=document.getElementById("usernameInput");
const deviceIdInput=document.getElementById("deviceIdInput");

const refreshRate=document.getElementById("refreshRate");
const gameRefresh=document.getElementById("gameRefresh");
const gameNotifications=document.getElementById("gameNotifications");

const showTimestamps=document.getElementById("showTimestamps");

const textSize=document.getElementById("textSize");
const wordSpacing=document.getElementById("wordSpacing");
const lineSpacing=document.getElementById("lineSpacing");

const themeSelect=document.getElementById("themeSelect");

const gameCreateOverlay=document.getElementById("gameCreateOverlay");
const closeGameCreate=document.getElementById("closeGameCreate");
const gameType=document.getElementById("gameType");
const gameMax=document.getElementById("gameMax");
const createGameBtn=document.getElementById("createGame");

const contextMenu=document.getElementById("contextMenu");
const editMessageBtn=document.getElementById("editMessage");
const deleteMessageBtn=document.getElementById("deleteMessage");

const removeEverything=document.getElementById("removeEverything");


let currentMessages=[];
let selectedMessage=null;
let selectedFile=null;

let refreshTimer=null;
let gameTimer=null;


/* =========================================================
   THEMES
========================================================= */

function applyTheme(name){

    const themes={
        dark:["#0b0d10","#111419"],
        midnight:["#080b14","#101522"],
        black:["#000","#090909"],
        blue:["#091018","#101c29"],
        purple:["#100b17","#191021"],
        green:["#09120d","#101b15"],
        red:["#140b0b","#1e1111"],
        gray:["#151515","#202020"],
        light:["#eeeeee","#ffffff"]
    };

    const t=themes[name]||themes.dark;

    document.documentElement.style.setProperty("--bg",t[0]);
    document.documentElement.style.setProperty("--panel",t[1]);

    document.body.style.background=t[0];
}


/* =========================================================
   APPLY SETTINGS
========================================================= */

function applySettings(){

    document.documentElement.style.setProperty(
        "--text-size",
        settings.textSize+"px"
    );

    document.documentElement.style.setProperty(
        "--word-spacing",
        settings.wordSpacing+"px"
    );

    document.documentElement.style.setProperty(
        "--line-spacing",
        settings.lineSpacing
    );

    applyTheme(settings.theme);

    startRefresh();
    startGameRefresh();

    renderMessages();
}


/* =========================================================
   SETTINGS UI
========================================================= */

function loadSettingsUI(){

    usernameInput.value=settings.username;
    deviceIdInput.value=deviceId;

    refreshRate.value=settings.refreshRate;
    gameRefresh.value=settings.gameRefresh;
    gameNotifications.value=String(settings.gameNotifications);

    showTimestamps.value=String(settings.showTimestamps);

    textSize.value=settings.textSize;
    wordSpacing.value=settings.wordSpacing;
    lineSpacing.value=settings.lineSpacing;

    themeSelect.value=settings.theme;
}

settingsBtn.onclick=()=>{
    loadSettingsUI();
    settingsOverlay.classList.add("show");
};

closeSettings.onclick=()=>{
    settingsOverlay.classList.remove("show");
};

saveSettings.onclick=()=>{

    settings.username=usernameInput.value.trim().substring(0,24);

    settings.refreshRate=Number(refreshRate.value);
    settings.gameRefresh=Number(gameRefresh.value);

    settings.gameNotifications=
        gameNotifications.value==="true";

    settings.showTimestamps=
        showTimestamps.value==="true";

    settings.textSize=Number(textSize.value);
    settings.wordSpacing=Number(wordSpacing.value);
    settings.lineSpacing=Number(lineSpacing.value);

    settings.theme=themeSelect.value;

    for(const key in settings){
        localStorage.setItem(
            "chat_"+key,
            settings[key]
        );
    }

    applySettings();

    settingsOverlay.classList.remove("show");
};


/* =========================================================
   ACCORDIONS
========================================================= */

document.querySelectorAll(".category-title").forEach(btn=>{
    btn.onclick=()=>{
        btn.parentElement.classList.toggle("open");
    };
});


/* =========================================================
   IMAGE
========================================================= */

attachBtn.onclick=()=>{
    imageInput.click();
};

imageInput.onchange=()=>{
    selectedFile=imageInput.files[0]||null;
    attachBtn.textContent=selectedFile?"✓":"＋";
};

function resizeImage(file){

    return new Promise((resolve,reject)=>{

        const reader=new FileReader();

        reader.onload=()=>{

            const img=new Image();

            img.onload=()=>{

                let width=img.width;
                let height=img.height;

                const max=1500;

                if(width>max||height>max){

                    const scale=Math.min(
                        max/width,
                        max/height
                    );

                    width=Math.round(width*scale);
                    height=Math.round(height*scale);
                }

                const canvas=document.createElement("canvas");

                canvas.width=width;
                canvas.height=height;

                canvas
                    .getContext("2d")
                    .drawImage(img,0,0,width,height);

                resolve(
                    canvas.toDataURL(
                        "image/jpeg",
                        .78
                    )
                );
            };

            img.onerror=reject;
            img.src=reader.result;
        };

        reader.onerror=reject;
        reader.readAsDataURL(file);
    });
}

/* =========================================================
   API HELPERS
========================================================= */

async function apiRequest(method,body=null){

    const options={
        method,
        headers:{
            "Content-Type":"application/json"
        }
    };

    if(body!==null){
        options.body=JSON.stringify(body);
    }

    const response=await fetch(API_URL,options);

    const text=await response.text();

    let data={};

    try{
        data=text?JSON.parse(text):{};
    }catch{
        data={error:text};
    }

    if(!response.ok){
        throw new Error(
            data.error||
            "Server request failed."
        );
    }

    return data;
}

async function apiPost(body){
    return apiRequest("POST",body);
}


/* =========================================================
   LOAD
========================================================= */

async function loadMessages(){

    try{

        const data=await apiRequest(
            "GET"
        );

        currentMessages=
            Array.isArray(data.messages)
            ?data.messages
            :[];

        renderMessages();

    }catch(error){

        messagesEl.innerHTML=`
            <div class="empty">
                <div>
                    <strong>Unable to load messages</strong>
                    ${escapeHtml(error.message)}
                </div>
            </div>
        `;
    }
}


/* =========================================================
   MESSAGE RENDER
========================================================= */

function renderMessages(){

    const wasBottom=
        messagesEl.scrollHeight-
        messagesEl.scrollTop-
        messagesEl.clientHeight<120;

    const normalMessages=currentMessages
        .filter(m=>!isGameMessage(m));

    const gameMessages=currentMessages
        .filter(isGameMessage);

    messagesEl.innerHTML="";

    for(const message of normalMessages){

        messagesEl.appendChild(
            createMessageElement(message)
        );
    }

    /*
       Games deliberately come AFTER normal chat.
       This makes the oldest game appear before newer games.
    */

    if(gameMessages.length){

        const gamesArea=document.createElement("div");

        gamesArea.className="games-area";

        const title=document.createElement("div");

        title.className="games-title";

        title.textContent="🎮 Active Games";

        gamesArea.appendChild(title);

        for(const gameMessage of gameMessages){

            const card=createGameCard(
                gameMessage
            );

            if(card){
                gamesArea.appendChild(card);
            }
        }

        messagesEl.appendChild(gamesArea);
    }

    if(
        wasBottom ||
        settings.autoScroll===true
    ){
        messagesEl.scrollTop=
            messagesEl.scrollHeight;
    }
}


function createMessageElement(message){

    const item=document.createElement("div");

    item.className="message";

    const avatar=document.createElement("div");

    avatar.className="avatar";

    avatar.textContent=
        (message.username||"?")
        .charAt(0)
        .toUpperCase();

    const content=document.createElement("div");

    content.className="message-content";

    const top=document.createElement("div");

    top.className="message-top";

    const name=document.createElement("span");

    name.className="username";

    name.textContent=
        message.username||"User";

    top.appendChild(name);

    if(settings.showTimestamps){

        const time=document.createElement("span");

        time.className="time";

        time.textContent=
            formatTime(message.created_at);

        top.appendChild(time);
    }

    content.appendChild(top);

    if(message.message){

        const text=document.createElement("div");

        text.className="message-text";

        text.textContent=message.message;

        content.appendChild(text);
    }

    if(message.image){

        const img=document.createElement("img");

        img.className="message-image";

        img.src=message.image;

        content.appendChild(img);
    }

    item.appendChild(avatar);
    item.appendChild(content);

    if(
        message.device_id===deviceId
    ){

        item.addEventListener(
            "contextmenu",
            e=>{
                e.preventDefault();

                selectedMessage=message;

                contextMenu.style.left=e.clientX+"px";
                contextMenu.style.top=e.clientY+"px";

                contextMenu.classList.add("show");
            }
        );
    }

    return item;
}


/* =========================================================
   GAME FORMAT
========================================================= */

function isGameMessage(message){

    return Boolean(
        message &&
        typeof message.message==="string" &&
        message.message.startsWith("__GAME__")
    );
}

function parseGameMessage(message){

    try{

        return JSON.parse(
            message.message.substring(8)
        );

    }catch{

        return null;
    }
}


/* =========================================================
   GAME CARD
========================================================= */

function createGameCard(message){

    const game=parseGameMessage(message);

    if(!game){
        return null;
    }

    if(game.closed){
        return null;
    }

    const card=document.createElement("div");

    card.className="game-card";

    const head=document.createElement("div");

    head.className="game-head";

    const title=document.createElement("div");

    title.innerHTML=`
        <div class="game-name">
            ${escapeHtml(game.icon||"🎮")}
            ${escapeHtml(game.name||"Game")}
        </div>

        <div class="game-host">
            ${escapeHtml(game.hostName||"Unknown")} is hosting
        </div>
    `;

    head.appendChild(title);

    const count=document.createElement("div");

    count.className="player";

    count.textContent=
        `${(game.players||[]).length}/${game.maxPlayers||4}`;

    head.appendChild(count);

    card.appendChild(head);

    const status=document.createElement("div");

    status.className="game-status";

    if(game.started){

        status.textContent=
            game.turnName
            ?`Turn: ${game.turnName}`
            :"Game in progress";

    }else{

        status.textContent=
            `${game.hostName} invited you to a game of ${game.name}. Join before the host starts.`;
    }

    card.appendChild(status);

    const players=document.createElement("div");

    players.className="players";

    for(const player of game.players||[]){

        const p=document.createElement("div");

        p.className="player joined";

        p.textContent=
            player.name+
            (player.id===game.hostId?" 👑":"");

        players.appendChild(p);
    }

    card.appendChild(players);

    const actions=document.createElement("div");

    actions.className="game-actions";

    const joined=(game.players||[])
        .some(p=>p.id===deviceId);

    const isHost=
        game.hostId===deviceId;

    if(!game.started){

        if(!joined){

            const join=document.createElement("button");

            join.className="primary";

            join.textContent="Join";

            join.onclick=()=>{
                joinGame(game);
            };

            actions.appendChild(join);

        }else{

            const joinedText=document.createElement("button");

            joinedText.textContent="✓ Joined";

            joinedText.disabled=true;

            actions.appendChild(joinedText);
        }

        if(isHost){

            const start=document.createElement("button");

            start.className="primary";

            start.textContent="Start";

            start.disabled=
                (game.players||[]).length<1;

            start.onclick=()=>{
                startGame(game);
            };

            actions.appendChild(start);
        }

    }else{

        if(joined){

            const leave=document.createElement("button");

            leave.className="danger";

            leave.textContent="Leave";

            leave.onclick=()=>{
                leaveGame(game);
            };

            actions.appendChild(leave);
        }
    }

    if(isHost){

        const force=document.createElement("button");

        force.className="danger";

        force.textContent="Force quit";

        force.onclick=()=>{
            forceQuitGame(game);
        };

        actions.appendChild(force);
    }

    card.appendChild(actions);


    if(game.started){

        const board=document.createElement("div");

        board.className="game-board";

        renderGameBoard(
            board,
            game,
            joined
        );

        card.appendChild(board);
    }

    return card;
}


/* =========================================================
   GAME STATE HELPERS
========================================================= */

function makeGame(type,max){

    const definitions={
        dice:{
            name:"Dice Battle",
            icon:"🎲"
        },
        ttt:{
            name:"Tic-Tac-Toe",
            icon:"❌"
        },
        connect4:{
            name:"Connect 4",
            icon:"🔴"
        },
        higher:{
            name:"Higher or Lower",
            icon:"🃏"
        },
        trivia:{
            name:"Trivia",
            icon:"🧠"
        },
        word:{
            name:"Word Chain",
            icon:"🔤"
        },
        guess:{
            name:"Number Guessing",
            icon:"🎯"
        },
        reversi:{
            name:"Reversi",
            icon:"⚫"
        },
        quiz:{
            name:"Quiz Show",
            icon:"🏆"
        },
        auction:{
            name:"Auction",
            icon:"💰"
        }
    };

    const d=definitions[type];

    return {
        id:crypto.randomUUID(),
        type,
        name:d.name,
        icon:d.icon,

        hostId:deviceId,
        hostName:settings.username,

        maxPlayers:max,

        players:[
            {
                id:deviceId,
                name:settings.username
            }
        ],

        started:false,
        closed:false,

        turnIndex:0,
        turnName:settings.username,

        state:initialGameState(type),

        version:1,

        createdAt:Date.now()
    };
}


function initialGameState(type){

    if(type==="ttt"){

        return {
            board:Array(9).fill(""),
            winner:null
        };
    }

    if(type==="connect4"){

        return {
            board:Array(42).fill(""),
            winner:null
        };
    }

    if(type==="higher"){

        return {
            current:randomInt(1,13),
            round:1,
            scores:{}
        };
    }

    if(type==="word"){

        return {
            words:[],
            lastLetter:"",
            winner:null
        };
    }

    if(type==="guess"){

        return {
            number:randomInt(1,100),
            attempts:0,
            winner:null
        };
    }

    if(type==="reversi"){

        const board=Array(64).fill("");

        board[27]="W";
        board[28]="B";
        board[35]="B";
        board[36]="W";

        return {
            board,
            winner:null
        };
    }

    if(type==="quiz"||type==="trivia"){

        return {
            questionIndex:0,
            scores:{},
            answered:{}
        };
    }

    if(type==="auction"){

        return {
            item:"Mystery Item",
            bid:0,
            bidder:null,
            finished:false
        };
    }

    return {
        scores:{},
        rolls:{}
    };
}

function activeHostedGame(){

    for(const message of currentMessages){

        if(!isGameMessage(message)){
            continue;
        }

        const game=parseGameMessage(message);

        if(
            game &&
            !game.closed &&
            game.hostId===deviceId
        ){
            return game;
        }
    }

    return null;
}


/* =========================================================
   GAME STORAGE
========================================================= */

async function writeGame(game){

    /*
       Every update creates one hidden state message.
       The server automatically removes older game-state
       messages belonging to the same game.
    */

    return apiPost({

        username:"SYSTEM",

        channel:CHANNEL,

        message:
            "__GAME__"+
            JSON.stringify(game),

        image:null,

        device_id:deviceId,

        game_state:true,

        game_id:game.id
    });
}


function findGame(gameId){

    for(const message of currentMessages){

        if(!isGameMessage(message)){
            continue;
        }

        const game=parseGameMessage(message);

        if(
            game &&
            game.id===gameId &&
            !game.closed
        ){
            return {
                game,
                message
            };
        }
    }

    return null;
}


/* =========================================================
   JOIN
========================================================= */

async function joinGame(game){

    if(game.started){
        return;
    }

    if(
        game.players.some(
            p=>p.id===deviceId
        )
    ){
        return;
    }

    if(
        game.players.length>=game.maxPlayers
    ){

        alert("The game is full.");

        return;
    }

    game.players.push({
        id:deviceId,
        name:settings.username
    });

    game.version++;

    try{

        await writeGame(game);

        await loadMessages();

    }catch(error){

        alert(
            "Could not join:\n\n"+
            error.message
        );
    }
}


/* =========================================================
   START
========================================================= */

async function startGame(game){

    if(game.hostId!==deviceId){
        return;
    }

    if(game.started){
        return;
    }

    if(!game.players.length){
        return;
    }

    game.started=true;

    game.turnIndex=0;

    game.turnName=
        game.players[0].name;

    game.version++;

    try{

        await writeGame(game);

        await loadMessages();

    }catch(error){

        alert(
            "Could not start game:\n\n"+
            error.message
        );
    }
}


/* =========================================================
   LEAVE
========================================================= */

async function leaveGame(game){

    game.players=
        game.players.filter(
            p=>p.id!==deviceId
        );

    if(!game.players.length){

        await deleteGame(game.id);

        return;
    }

    if(game.hostId===deviceId){

        game.hostId=
            game.players[0].id;

        game.hostName=
            game.players[0].name;
    }

    if(
        game.turnIndex>=game.players.length
    ){

        game.turnIndex=0;
    }

    game.turnName=
        game.players[game.turnIndex].name;

    game.version++;

    try{

        await writeGame(game);

        await loadMessages();

    }catch(error){

        alert(error.message);
    }
}


/* =========================================================
   FORCE QUIT
========================================================= */

async function forceQuitGame(game){

    if(game.hostId!==deviceId){
        return;
    }

    if(
        !confirm(
            "Force quit this game for everyone?"
        )
    ){
        return;
    }

    try{

        await deleteGame(game.id);

        await loadMessages();

    }catch(error){

        alert(
            "Could not force quit:\n\n"+
            error.message
        );
    }
}


/* =========================================================
   DELETE GAME
========================================================= */

async function deleteGame(gameId){

    await apiRequest(
        "DELETE",
        {
            delete_game:true,
            game_id:gameId
        }
    );
}


/* =========================================================
   TURN
========================================================= */

function isMyTurn(game){

    return (
        game.started &&
        game.players[game.turnIndex] &&
        game.players[game.turnIndex].id===deviceId
    );
}

function nextTurn(game){

    if(!game.players.length){
        return;
    }

    game.turnIndex=
        (game.turnIndex+1)%
        game.players.length;

    game.turnName=
        game.players[game.turnIndex].name;
}


/* =========================================================
   GAME BOARD
========================================================= */

function renderGameBoard(board,game,joined){

    const turn=document.createElement("div");

    turn.className="turn";

    turn.textContent=
        game.turnName
        ?`🎯 ${game.turnName}'s turn`
        :"Game";

    board.appendChild(turn);


    if(game.type==="dice"){
        renderDice(board,game,joined);
    }

    else if(game.type==="ttt"){
        renderTTT(board,game,joined);
    }

    else if(game.type==="connect4"){
        renderConnect4(board,game,joined);
    }

    else if(game.type==="higher"){
        renderHigher(board,game,joined);
    }

    else if(
        game.type==="trivia"||
        game.type==="quiz"
    ){
        renderTrivia(board,game,joined);
    }

    else if(game.type==="word"){
        renderWord(board,game,joined);
    }

    else if(game.type==="guess"){
        renderGuess(board,game,joined);
    }

    else if(game.type==="reversi"){
        renderReversi(board,game,joined);
    }

    else if(game.type==="auction"){
        renderAuction(board,game,joined);
    }
}


/* =========================================================
   DICE
========================================================= */

function renderDice(board,game,joined){

    const log=document.createElement("div");

    log.className="log";

    for(const player of game.players){

        const roll=
            game.state.rolls[player.id];

        const row=document.createElement("div");

        row.textContent=
            `${player.name}: `+
            (roll===undefined?"—":"🎲 "+roll);

        log.appendChild(row);
    }

    board.appendChild(log);

    if(
        joined &&
        isMyTurn(game)
    ){

        const button=document.createElement("button");

        button.textContent="🎲 Roll dice";

        button.onclick=async()=>{

            game.state.rolls[deviceId]=
                randomInt(1,6);

            nextTurn(game);

            game.version++;

            await writeGame(game);
            await loadMessages();
        };

        board.appendChild(button);
    }
}


/* =========================================================
   TIC TAC TOE
========================================================= */

function renderTTT(board,game,joined){

    const grid=document.createElement("div");

    grid.className="ttt";

    const symbol=
        game.players.findIndex(
            p=>p.id===deviceId
        )===0
        ?"X"
        :"O";

    game.state.board.forEach(
        (value,index)=>{

            const button=document.createElement("button");

            button.textContent=value;

            button.disabled=
                Boolean(value)||
                !joined||
                !isMyTurn(game)||
                Boolean(game.state.winner);

            button.onclick=async()=>{

                game.state.board[index]=symbol;

                const winner=
                    checkTTT(
                        game.state.board
                    );

                if(winner){

                    game.state.winner=winner;
                }else{

                    nextTurn(game);
                }

                game.version++;

                await writeGame(game);
                await loadMessages();
            };

            grid.appendChild(button);
        }
    );

    board.appendChild(grid);

    if(game.state.winner){

        const result=document.createElement("div");

        result.className="game-status";

        result.textContent=
            game.state.winner==="draw"
            ?"Draw!"
            :`Winner: ${game.state.winner}`;

        board.appendChild(result);
    }
}

function checkTTT(b){

    const wins=[
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
    ];

    for(const w of wins){

        if(
            b[w[0]] &&
            b[w[0]]===b[w[1]] &&
            b[w[1]]===b[w[2]]
        ){
            return b[w[0]];
        }
    }

    if(b.every(Boolean)){
        return "draw";
    }

    return null;
}


/* =========================================================
   CONNECT 4
========================================================= */

function renderConnect4(board,game,joined){

    const grid=document.createElement("div");

    grid.className="connect4";

    for(let column=0;column<7;column++){

        const button=document.createElement("button");

        button.textContent="↓";

        button.disabled=
            !joined||
            !isMyTurn(game)||
            Boolean(game.state.winner);

        button.onclick=async()=>{

            const playerIndex=
                game.players.findIndex(
                    p=>p.id===deviceId
                );

            const symbol=
                playerIndex===0?"R":"Y";

            for(
                let row=5;
                row>=0;
                row--
            ){

                const index=
                    row*7+column;

                if(
                    !game.state.board[index]
                ){

                    game.state.board[index]=symbol;

                    const winner=
                        checkConnect4(
                            game.state.board
                        );

                    if(winner){
                        game.state.winner=winner;
                    }else{
                        nextTurn(game);
                    }

                    game.version++;

                    await writeGame(game);
                    await loadMessages();

                    return;
                }
            }
        };

        grid.appendChild(button);
    }

    board.appendChild(grid);

    const cells=document.createElement("div");

    cells.className="connect4";

    for(const value of game.state.board){

        const cell=document.createElement("button");

        cell.textContent=
            value==="R"
            ?"🔴"
            :value==="Y"
            ?"🟡"
            :"";

        cell.disabled=true;

        cells.appendChild(cell);
    }

    board.appendChild(cells);

    if(game.state.winner){

        const result=document.createElement("div");

        result.className="game-status";

        result.textContent=
            `Winner: ${game.state.winner}`;

        board.appendChild(result);
    }
}

function checkConnect4(b){

    for(let r=0;r<6;r++){

        for(let c=0;c<7;c++){

            const i=r*7+c;

            if(!b[i]){
                continue;
            }

            const directions=[
                [0,1],
                [1,0],
                [1,1],
                [1,-1]
            ];

            for(const [dr,dc] of directions){

                let count=1;

                for(let n=1;n<4;n++){

                    const nr=r+dr*n;
                    const nc=c+dc*n;

                    if(
                        nr<0||
                        nr>=6||
                        nc<0||
                        nc>=7
                    ){
                        break;
                    }

                    if(
                        b[nr*7+nc]===b[i]
                    ){
                        count++;
                    }else{
                        break;
                    }
                }

                if(count>=4){
                    return b[i];
                }
            }
        }
    }

    return null;
}


/* =========================================================
   HIGHER / LOWER
========================================================= */

function renderHigher(board,game,joined){

    const current=document.createElement("div");

    current.className="game-status";

    current.textContent=
        `Current card: ${game.state.current}`;

    board.appendChild(current);

    if(
        joined &&
        isMyTurn(game)
    ){

        const row=document.createElement("div");

        row.className="choice-row";

        for(const choice of ["Higher","Lower"]){

            const button=document.createElement("button");

            button.textContent=choice;

            button.onclick=async()=>{

                const next=randomInt(1,13);

                const correct=
                    choice==="Higher"
                    ?next>game.state.current
                    :next<game.state.current;

                if(correct){

                    game.state.scores[deviceId]=
                        (game.state.scores[deviceId]||0)+1;
                }

                game.state.current=next;

                nextTurn(game);

                game.version++;

                await writeGame(game);
                await loadMessages();
            };

            row.appendChild(button);
        }

        board.appendChild(row);
    }

    renderScores(board,game);
}


/* =========================================================
   TRIVIA / QUIZ
========================================================= */

const questions=[
    {
        q:"What planet is known as the Red Planet?",
        answers:["Mars","Venus","Jupiter","Mercury"]
    },
    {
        q:"How many sides does a hexagon have?",
        answers:["6","5","7","8"]
    },
    {
        q:"What is the largest ocean?",
        answers:["Pacific","Atlantic","Indian","Arctic"]
    },
    {
        q:"How many days are in a leap year?",
        answers:["366","365","364","367"]
    },
    {
        q:"Which animal is known as man's best friend?",
        answers:["Dog","Cat","Horse","Rabbit"]
    }
];

function renderTrivia(board,game,joined){

    const q=
        questions[
            game.state.questionIndex%
            questions.length
        ];

    const question=document.createElement("div");

    question.className="game-status";

    question.textContent=q.q;

    board.appendChild(question);

    if(
        joined &&
        isMyTurn(game) &&
        !game.state.answered[deviceId]
    ){

        const row=document.createElement("div");

        row.className="choice-row";

        q.answers.forEach(answer=>{

            const button=document.createElement("button");

            button.textContent=answer;

            button.onclick=async()=>{

                if(answer===q.answers[0]){

                    game.state.scores[deviceId]=
                        (game.state.scores[deviceId]||0)+1;
                }

                game.state.answered[deviceId]=true;

                nextTurn(game);

                game.state.questionIndex++;

                game.state.answered={};

                game.version++;

                await writeGame(game);
                await loadMessages();
            };

            row.appendChild(button);
        });

        board.appendChild(row);
    }

    renderScores(board,game);
}


/* =========================================================
   WORD CHAIN
========================================================= */

function renderWord(board,game,joined){

    const last=document.createElement("div");

    last.className="game-status";

    last.textContent=
        game.state.lastLetter
        ?`Next word must start with: ${game.state.lastLetter}`
        :"Choose the first word.";

    board.appendChild(last);

    const log=document.createElement("div");

    log.className="log";

    for(const word of game.state.words){

        const line=document.createElement("div");

        line.textContent=word;

        log.appendChild(line);
    }

    board.appendChild(log);

    if(
        joined &&
        isMyTurn(game)
    ){

        const row=document.createElement("div");

        row.className="word-input";

        const input=document.createElement("input");

        input.placeholder="Enter a word";

        const button=document.createElement("button");

        button.textContent="Play";

        button.onclick=async()=>{

            const word=
                input.value
                    .trim()
                    .toLowerCase();

            if(!word){
                return;
            }

            if(
                game.state.lastLetter &&
                word.charAt(0)!==
                game.state.lastLetter
            ){

                alert(
                    "That word must start with "+
                    game.state.lastLetter
                );

                return;
            }

            if(
                game.state.words.includes(word)
            ){

                alert("That word was already used.");

                return;
            }

            game.state.words.push(word);

            game.state.lastLetter=
                word.charAt(
                    word.length-1
                );

            nextTurn(game);

            game.version++;

            await writeGame(game);
            await loadMessages();
        };

        row.appendChild(input);
        row.appendChild(button);

        board.appendChild(row);
    }
}


/* =========================================================
   NUMBER GUESSING
========================================================= */

function renderGuess(board,game,joined){

    const info=document.createElement("div");

    info.className="game-status";

    info.textContent=
        game.state.winner
        ?`Winner: ${game.state.winner}`
        :"Guess a number from 1 to 100.";

    board.appendChild(info);

    if(
        joined &&
        isMyTurn(game) &&
        !game.state.winner
    ){

        const row=document.createElement("div");

        row.className="number-input";

        const input=document.createElement("input");

        input.type="number";
        input.min="1";
        input.max="100";

        const button=document.createElement("button");

        button.textContent="Guess";

        button.onclick=async()=>{

            const guess=Number(input.value);

            if(
                guess<1||
                guess>100
            ){
                return;
            }

            game.state.attempts++;

            if(
                guess===game.state.number
            ){

                game.state.winner=
                    settings.username;

            }else{

                nextTurn(game);
            }

            game.version++;

            await writeGame(game);
            await loadMessages();
        };

        row.appendChild(input);
        row.appendChild(button);

        board.appendChild(row);
    }
}


/* =========================================================
   REVERSI
========================================================= */

function renderReversi(board,game,joined){

    const grid=document.createElement("div");

    grid.style.display="grid";
    grid.style.gridTemplateColumns=
        "repeat(8,38px)";
    grid.style.gap="3px";
    grid.style.justifyContent="center";

    const index=
        game.players.findIndex(
            p=>p.id===deviceId
        );

    const symbol=
        index===0?"B":"W";

    for(
        let i=0;
        i<64;
        i++
    ){

        const button=document.createElement("button");

        button.style.width="38px";
        button.style.height="38px";
        button.style.borderRadius="50%";
        button.style.border=
            "1px solid #444";
        button.style.background=
            "#143b25";
        button.textContent=
            game.state.board[i]==="B"
            ?"⚫"
            :game.state.board[i]==="W"
            ?"⚪"
            :"";

        button.disabled=
            !joined||
            !isMyTurn(game)||
            Boolean(game.state.winner);

        button.onclick=async()=>{

            if(game.state.board[i]){
                return;
            }

            game.state.board[i]=symbol;

            nextTurn(game);

            game.version++;

            await writeGame(game);
            await loadMessages();
        };

        grid.appendChild(button);
    }

    board.appendChild(grid);
}


/* =========================================================
   AUCTION
========================================================= */

function renderAuction(board,game,joined){

    const info=document.createElement("div");

    info.className="game-status";

    info.textContent=
        `${game.state.item} — Current bid: ${game.state.bid}`+
        (
            game.state.bidder
            ?` by ${game.state.bidder}`
            :""
        );

    board.appendChild(info);

    if(
        joined &&
        isMyTurn(game) &&
        !game.state.finished
    ){

        const row=document.createElement("div");

        row.className="number-input";

        const input=document.createElement("input");

        input.type="number";
        input.min=game.state.bid+1;
        input.placeholder=
            `Bid above ${game.state.bid}`;

        const button=document.createElement("button");

        button.textContent="Bid";

        button.onclick=async()=>{

            const amount=Number(input.value);

            if(
                !amount||
                amount<=game.state.bid
            ){
                return;
            }

            game.state.bid=amount;

            game.state.bidder=
                settings.username;

            nextTurn(game);

            game.version++;

            await writeGame(game);
            await loadMessages();
        };

        row.appendChild(input);
        row.appendChild(button);

        board.appendChild(row);
    }
}


/* =========================================================
   SCORES
========================================================= */

function renderScores(board,game){

    const log=document.createElement("div");

    log.className="log";

    for(const player of game.players){

        log.innerHTML+=
            `<div>${escapeHtml(player.name)}: ${
                Number(
                    game.state.scores[player.id]||0
                )
            }</div>`;
    }

    board.appendChild(log);
}

function startRefresh(){

    if(refreshTimer){
        clearInterval(refreshTimer);
    }

    refreshTimer=setInterval(
        loadMessages,
        Number(settings.refreshRate)
    );
}

function startGameRefresh(){

    if(gameTimer){
        clearInterval(gameTimer);
    }

    gameTimer=setInterval(
        loadMessages,
        Number(settings.gameRefresh||GAME_REFRESH)
    );
}

/* =========================================================
   HELPERS
========================================================= */

function randomInt(min,max){

    return Math.floor(
        Math.random()*(max-min+1)
    )+min;
}

function formatTime(date){

    if(!date){
        return "";
    }

    return new Date(date)
        .toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );
}

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}
