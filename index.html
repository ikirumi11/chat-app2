<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Game Chat</title>

<style>
*{
    box-sizing:border-box;
}

:root{
    --bg:#080a0d;
    --bg2:#0d1014;
    --panel:#11151a;
    --panel2:#171c22;
    --panel3:#1d232b;
    --border:#272e38;
    --border2:#323a46;

    --text:#f2f4f7;
    --text2:#c4cad2;
    --muted:#7d8794;

    --accent:#e9edf2;
    --accentText:#101216;

    --green:#65d99b;
    --red:#ff737d;
    --yellow:#e5c56c;

    --radius:12px;
    --ui-scale:1;
    --text-size:16px;
    --word-spacing:0px;
    --line-spacing:1.45;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,Helvetica,sans-serif;
}

body{
    overflow:hidden;
    font-size:calc(16px * var(--ui-scale));
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    cursor:not-allowed;
}

/* =========================================================
   APP
========================================================= */

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:
        radial-gradient(
            circle at 50% -20%,
            rgba(255,255,255,.035),
            transparent 40%
        ),
        var(--bg);
}

/* =========================================================
   HEADER
========================================================= */

.header{
    height:64px;
    min-height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    background:rgba(14,17,21,.94);
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(18px);
    z-index:10;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
}

.logo-icon{
    width:36px;
    height:36px;
    flex:none;
    display:grid;
    place-items:center;
    border-radius:11px;
    background:linear-gradient(
        145deg,
        #222831,
        #15191f
    );
    border:1px solid var(--border2);
    box-shadow:0 5px 18px #0005;
}

.logo-name{
    font-size:16px;
    font-weight:800;
    white-space:nowrap;
}

.channel{
    color:var(--muted);
    font-size:14px;
    white-space:nowrap;
}

.header-right{
    display:flex;
    align-items:center;
    gap:8px;
}

.online-indicator{
    display:flex;
    align-items:center;
    gap:7px;
    padding:8px 11px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#12161b;
    color:var(--muted);
    font-size:12px;
}

.online-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 10px rgba(101,217,155,.5);
}

.icon-btn{
    width:40px;
    height:40px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#151a20;
    color:var(--text);
    transition:
        background .15s,
        transform .15s,
        border-color .15s;
}

.icon-btn:hover{
    background:#20262e;
    border-color:var(--border2);
}

.icon-btn:active{
    transform:scale(.95);
}

/* =========================================================
   CHAT
========================================================= */

.messages{
    flex:1;
    overflow-y:auto;
    padding:24px max(16px,calc((100vw - 1100px)/2));
    scroll-behavior:smooth;
}

.messages::-webkit-scrollbar{
    width:8px;
}

.messages::-webkit-scrollbar-thumb{
    background:#252b33;
    border-radius:10px;
}

.messages::-webkit-scrollbar-track{
    background:transparent;
}

.message{
    display:flex;
    gap:11px;
    margin-bottom:13px;
    animation:messageIn .18s ease;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(5px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.avatar{
    width:38px;
    height:38px;
    min-width:38px;
    display:grid;
    place-items:center;
    border-radius:11px;
    background:linear-gradient(
        145deg,
        #20262e,
        #15191f
    );
    border:1px solid var(--border);
    color:#e8ebef;
    font-weight:800;
    font-size:13px;
    user-select:none;
}

.message-wrap{
    min-width:0;
    max-width:820px;
}

.message-bubble{
    display:inline-block;
    max-width:100%;
    padding:9px 12px 10px;
    border-radius:4px 12px 12px 12px;
    background:#151a20;
    border:1px solid #242b34;
    box-shadow:0 4px 14px rgba(0,0,0,.08);
}

.message-top{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:3px;
}

.username{
    font-size:13px;
    font-weight:800;
}

.time,
.edited{
    color:var(--muted);
    font-size:10px;
}

.message-text{
    color:#dce1e7;
    font-size:var(--text-size);
    line-height:var(--line-spacing);
    word-spacing:var(--word-spacing);
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.message-image{
    display:block;
    max-width:min(600px,75vw);
    max-height:500px;
    margin-top:8px;
    border-radius:10px;
    border:1px solid var(--border);
}

.message.mine .message-bubble{
    background:#1b2027;
    border-color:#2b333e;
}

.message.game-system{
    justify-content:center;
}

.message.game-system .message-bubble{
    background:#10151a;
    border-color:#292f38;
    color:var(--muted);
}

/* =========================================================
   EMPTY
========================================================= */

.empty{
    min-height:100%;
    display:grid;
    place-items:center;
    text-align:center;
    color:var(--muted);
}

.empty-inner{
    padding:30px;
}

.empty-icon{
    width:58px;
    height:58px;
    margin:0 auto 14px;
    display:grid;
    place-items:center;
    border-radius:17px;
    background:#151a20;
    border:1px solid var(--border);
    font-size:25px;
}

.empty strong{
    display:block;
    color:#cbd1d8;
    margin-bottom:5px;
}

/* =========================================================
   COMPOSER
========================================================= */

.composer{
    padding:10px 16px 16px;
    background:rgba(12,15,19,.96);
    border-top:1px solid var(--border);
}

.composer-inner{
    width:min(100%,1100px);
    margin:auto;
}

.composer-box{
    display:flex;
    align-items:flex-end;
    gap:8px;
    padding:7px;
    border:1px solid var(--border2);
    border-radius:14px;
    background:#14181e;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

textarea{
    flex:1;
    min-height:42px;
    max-height:150px;
    resize:none;
    border:0;
    outline:none;
    background:transparent;
    color:white;
    padding:10px;
    line-height:1.4;
}

textarea::placeholder{
    color:#626c78;
}

.send-btn{
    height:42px;
    padding:0 18px;
    border:0;
    border-radius:10px;
    background:var(--accent);
    color:var(--accentText);
    font-weight:800;
    transition:.15s;
}

.send-btn:hover{
    filter:brightness(1.08);
}

.send-btn:active{
    transform:scale(.96);
}

/* =========================================================
   GAME CARD
========================================================= */

.game-message{
    width:min(900px,100%);
    margin:0 auto 18px;
    animation:messageIn .2s ease;
}

.game-card{
    overflow:hidden;
    border:1px solid var(--border2);
    border-radius:16px;
    background:
        linear-gradient(
            145deg,
            rgba(30,35,42,.98),
            rgba(14,17,21,.98)
        );
    box-shadow:
        0 16px 45px rgba(0,0,0,.25),
        inset 0 1px 0 rgba(255,255,255,.025);
}

.game-header{
    min-height:64px;
    padding:14px 17px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    border-bottom:1px solid var(--border);
}

.game-title{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
}

.game-icon{
    width:40px;
    height:40px;
    display:grid;
    place-items:center;
    flex:none;
    border-radius:11px;
    background:#13181e;
    border:1px solid var(--border);
}

.game-title-text{
    min-width:0;
}

.game-title-text strong{
    display:block;
    font-size:15px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.game-host{
    color:var(--muted);
    font-size:11px;
    margin-top:2px;
}

.game-status{
    flex:none;
    padding:6px 9px;
    border-radius:999px;
    background:#171c22;
    border:1px solid var(--border);
    color:#b9c1ca;
    font-size:11px;
}

.game-status.playing{
    color:#86e9ad;
    border-color:#28553d;
    background:#122219;
}

.game-status.finished{
    color:#e3c877;
    border-color:#554925;
    background:#201d12;
}

.game-body{
    padding:17px;
}

.game-info{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:13px;
}

.game-pill{
    padding:6px 9px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#12171c;
    color:#aeb6c0;
    font-size:11px;
}

.game-pill strong{
    color:#eef1f4;
}

.game-description{
    color:#8c96a2;
    line-height:1.45;
    font-size:13px;
    margin-bottom:14px;
}

.players-list{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin:12px 0;
}

.player-chip{
    display:flex;
    align-items:center;
    gap:5px;
    padding:6px 9px;
    border-radius:8px;
    background:#12171c;
    border:1px solid var(--border);
    color:#aeb6c0;
    font-size:11px;
}

.player-chip.host{
    border-color:#5c4d28;
    color:#e7ce78;
}

.turn-banner{
    margin:12px 0;
    padding:10px 12px;
    border-radius:9px;
    border:1px solid var(--border);
    background:#12171c;
    color:#9ea7b2;
    font-size:12px;
}

.turn-banner strong{
    color:#f0f2f4;
}

.game-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.game-btn{
    border:1px solid var(--border2);
    border-radius:9px;
    padding:9px 13px;
    background:#20262e;
    color:#edf0f4;
    font-weight:700;
    font-size:12px;
    transition:.15s;
}

.game-btn:hover:not(:disabled){
    background:#29313a;
}

.game-btn.primary{
    background:#e8ebef;
    color:#111317;
}

.game-btn.green{
    background:#153526;
    border-color:#285b41;
    color:#93efb8;
}

.game-btn.danger{
    background:#351a1e;
    border-color:#693039;
    color:#ff9299;
}

.game-btn:disabled{
    opacity:.4;
}

/* =========================================================
   TIC TAC TOE
========================================================= */

.ttt{
    display:grid;
    gap:5px;
    width:min(360px,100%);
    margin:16px auto;
}

.ttt button{
    aspect-ratio:1;
    border:1px solid var(--border);
    border-radius:8px;
    background:#11161b;
    color:white;
    font-size:clamp(20px,5vw,32px);
    font-weight:900;
}

.ttt button:hover:not(:disabled){
    background:#222931;
}

.ttt button.x{
    color:#8eb9ff;
}

.ttt button.o{
    color:#ff9b9b;
}

/* =========================================================
   REACTION
========================================================= */

.reaction-area{
    text-align:center;
    padding:8px 0;
}

.reaction-box{
    width:190px;
    height:190px;
    margin:15px auto;
    display:grid;
    place-items:center;
    border-radius:20px;
    border:2px solid var(--border2);
    background:#181d23;
    color:#858f9c;
    font-size:21px;
    font-weight:800;
    user-select:none;
    transition:.15s;
}

.reaction-box.ready{
    background:#153b29;
    border-color:#3a8d60;
    color:#7dffad;
}

.reaction-box.go{
    background:#3c191d;
    border-color:#913d46;
    color:#ff818a;
}

.reaction-box.done{
    background:#24233a;
    border-color:#4e4b7b;
    color:#b8b6ff;
}

/* =========================================================
   TYPE GAME
========================================================= */

.type-area{
    text-align:center;
}

.type-sentence{
    max-width:650px;
    margin:12px auto;
    padding:17px;
    border-radius:11px;
    background:#12171c;
    border:1px solid var(--border);
    color:#f1f3f5;
    font-size:20px;
    font-weight:700;
}

.type-input{
    width:100%;
    max-width:600px;
    padding:12px;
    border-radius:10px;
    border:1px solid var(--border2);
    outline:none;
    background:#0e1318;
    color:white;
}

.type-input:focus{
    border-color:#555e69;
}

.type-stats{
    display:flex;
    justify-content:center;
    gap:18px;
    margin:10px 0;
    color:#8d97a3;
    font-size:12px;
}

.type-stats strong{
    color:#fff;
}

/* =========================================================
   BOSS
========================================================= */

.boss-area{
    text-align:center;
}

.boss-monster-name{
    font-size:25px;
    font-weight:900;
    color:#ff6875;
    margin:8px 0;
}

.boss-health-bar{
    width:100%;
    height:28px;
    position:relative;
    overflow:hidden;
    margin:12px auto;
    border-radius:14px;
    background:#151719;
    border:1px solid #343434;
}

.boss-health-fill{
    height:100%;
    width:100%;
    background:linear-gradient(
        90deg,
        #e53d49,
        #ff7044
    );
    transition:width .25s;
}

.boss-health-text{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    font-size:12px;
    font-weight:800;
    color:white;
    text-shadow:0 1px 4px black;
}

.boss-stats{
    display:flex;
    justify-content:center;
    gap:18px;
    flex-wrap:wrap;
    color:#929ca8;
    font-size:12px;
    margin:10px;
}

.boss-stats strong{
    color:#fff;
}

.boss-damage-display{
    font-size:28px;
    font-weight:900;
    color:#ff744a;
}

/* =========================================================
   OVERLAYS
========================================================= */

.overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:14px;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(7px);
    z-index:100;
}

.overlay.show{
    display:flex;
}

.panel{
    width:min(650px,100%);
    max-height:calc(100vh - 28px);
    overflow-y:auto;
    border:1px solid var(--border2);
    border-radius:16px;
    background:#11151a;
    box-shadow:0 25px 90px #000b;
}

.panel::-webkit-scrollbar{
    width:7px;
}

.panel::-webkit-scrollbar-thumb{
    background:#303640;
    border-radius:10px;
}

.panel-header{
    min-height:62px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 17px;
    border-bottom:1px solid var(--border);
}

.panel-header h2{
    margin:0;
    font-size:18px;
}

.panel-body{
    padding:17px;
}

.panel-description{
    color:#8d97a3;
    line-height:1.5;
    font-size:13px;
}

/* =========================================================
   SETTINGS
========================================================= */

.category{
    margin-bottom:9px;
    overflow:hidden;
    border:1px solid var(--border);
    border-radius:11px;
    background:#151a20;
}

.category-title{
    width:100%;
    padding:13px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border:0;
    background:transparent;
    color:white;
    text-align:left;
    font-weight:800;
}

.category-arrow{
    color:#69737f;
    transition:.15s;
}

.category.open .category-arrow{
    transform:rotate(180deg);
}

.category-body{
    display:none;
    padding:0 13px 14px;
}

.category.open .category-body{
    display:block;
}

.setting{
    margin-top:13px;
}

.setting label{
    display:block;
    margin-bottom:6px;
    color:#aab3bd;
    font-size:12px;
}

.setting input,
.setting select{
    width:100%;
    padding:10px;
    outline:none;
    border:1px solid var(--border);
    border-radius:9px;
    background:#0f1419;
    color:white;
}

.setting input:focus,
.setting select:focus{
    border-color:#4a535e;
}

.setting input[type=range]{
    padding:0;
}

.setting-value{
    margin-top:5px;
    color:#69737f;
    font-size:11px;
}

.save-btn{
    width:100%;
    margin-top:5px;
    padding:12px;
    border:0;
    border-radius:10px;
    background:#e8ebef;
    color:#111317;
    font-weight:800;
}

.danger-zone{
    margin-top:18px;
    padding-top:17px;
    border-top:1px solid #3d2529;
}

.danger-title{
    color:#ff8088;
    font-weight:800;
}

.danger-zone p{
    color:#7e8793;
    line-height:1.45;
    font-size:12px;
}

.danger-btn{
    width:100%;
    padding:11px;
    border-radius:9px;
    border:1px solid #693039;
    background:#241519;
    color:#ff8b93;
}

/* =========================================================
   GAME CREATOR
========================================================= */

.game-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.game-choice{
    min-height:84px;
    padding:13px;
    border:1px solid var(--border);
    border-radius:11px;
    background:#151a20;
    color:white;
    text-align:left;
    transition:.15s;
}

.game-choice:hover{
    background:#1e252d;
    border-color:#39424d;
    transform:translateY(-1px);
}

.game-choice strong{
    display:block;
    margin-bottom:5px;
    font-size:13px;
}

.game-choice span{
    display:block;
    color:#7e8793;
    font-size:11px;
    line-height:1.35;
}

.game-players{
    display:inline-block;
    margin-top:7px;
    padding:3px 7px;
    border-radius:8px;
    background:#10151a;
    color:#8d97a3;
    font-size:9px;
}

/* =========================================================
   CONFIRM
========================================================= */

.confirm-actions{
    display:flex;
    gap:8px;
    justify-content:flex-end;
    margin-top:15px;
}

/* =========================================================
   TOAST
========================================================= */

.toast-container{
    position:fixed;
    right:18px;
    bottom:85px;
    z-index:300;
    display:flex;
    flex-direction:column;
    gap:7px;
    pointer-events:none;
}

.toast{
    padding:10px 13px;
    border:1px solid var(--border2);
    border-radius:10px;
    background:#171c22;
    box-shadow:0 10px 35px #0007;
    color:#dce1e6;
    font-size:12px;
    animation:toastIn .18s ease;
}

@keyframes toastIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:700px){

    .header{
        padding:0 11px;
    }

    .channel,
    .online-indicator{
        display:none;
    }

    .messages{
        padding:17px 10px;
    }

    .message-wrap{
        max-width:calc(100vw - 62px);
    }

    .message-bubble{
        max-width:100%;
    }

    .game-grid{
        grid-template-columns:1fr;
    }

    .game-header{
        padding:12px;
    }

    .game-body{
        padding:13px;
    }

    .reaction-box{
        width:150px;
        height:150px;
    }

    .type-sentence{
        font-size:17px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="logo">
        <div class="logo-icon">🎮</div>
        <div class="logo-name">Game Chat</div>
        <div class="channel"># general</div>
    </div>

    <div class="header-right">

        <div class="online-indicator">
            <span class="online-dot"></span>
            Connected
        </div>

        <button
            class="icon-btn"
            id="gamesBtn"
            title="Games"
        >🎮</button>

        <button
            class="icon-btn"
            id="settingsBtn"
            title="Settings"
        >⚙</button>

    </div>

</header>

<main
    class="messages"
    id="messages"
></main>

<div class="composer">

    <div class="composer-inner">

        <div class="composer-box">

            <textarea
                id="messageInput"
                rows="1"
                placeholder="Message #general"
            ></textarea>

            <button
                class="send-btn"
                id="sendBtn"
            >
                Send
            </button>

        </div>

    </div>

</div>

</div>

 This prevents the visible "refresh/flicker".

function escapeHTML(value){

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

}


function safeText(value){

    return String(
        value ?? ""
    );
}


function initials(name){

    const clean =
        safeText(name)
            .trim();

    if(!clean){
        return "?";
    }

    const parts =
        clean.split(/\s+/);

    if(parts.length >= 2){

        return (
            parts[0][0] +
            parts[1][0]
        ).toUpperCase();

    }

    return clean
        .slice(0,2)
        .toUpperCase();
}


function formatTime(date){

    const d =
        new Date(date);

    if(
        Number.isNaN(
            d.getTime()
        )
    ){
        return "";
    }

    return d.toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}

        el.style.transform =
            "translateY(5px)";

        setTimeout(
            () => el.remove(),
            180
        );

    },2600);
}

/* =========================================================
   API REQUEST
========================================================= */

async function apiRequest(
    method,
    body = null
){

    const options = {
        method,
        headers:{
            "Content-Type":
                "application/json"
        }
    };

    if(body !== null){

        options.body =
            JSON.stringify(body);

    }

    const response =
        await fetch(
            API_URL +
            "?channel=" +
            encodeURIComponent(CHANNEL),
            options
        );

    const text =
        await response.text();

    let data = {};

    try{
        data =
            text
                ? JSON.parse(text)
                : {};
    }catch{
        data = {
            error:text
        };
    }

    if(!response.ok){

        throw new Error(
            data.error ||
            "Server request failed"
        );

    }

    return data;
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

    const text =
        messageInput.value
            .trim();

    if(!text){
        return;
    }

    const username =
        settings.username
            .trim();

    if(!username){

        settingsOverlay.classList.add(
            "show"
        );

        loadSettingsUI();

        usernameInput.focus();

        toast(
            "Set your name first"
        );

        return;
    }

    sendBtn.disabled = true;

    try{

        await apiRequest(
            "POST",
            {
                username,
                channel:CHANNEL,
                message:text,
                device_id:deviceId
            }
        );

        messageInput.value = "";

        autoResizeTextarea();

        /*
         Do NOT force a complete render here.

         The next sync will find the new message
         and append it only once.
        */

        await syncMessages(true);

    }catch(error){

        console.error(error);

        toast(
            "Could not send message"
        );

    }finally{

        sendBtn.disabled = false;

        messageInput.focus();

    }
}


sendBtn.onclick =
    sendMessage;


messageInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey &&
            settings.enterToSend
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);

/* =========================================================
   INCREMENTAL NORMAL CHAT SYNC
========================================================= */

function syncNormalMessages(
    serverMessages
){

    const normalMessages =
        serverMessages.filter(
            message =>
                message.username !==
                GAME_SERVER_USERNAME
        );

    const serverIds =
        new Set(
            normalMessages.map(
                message =>
                    String(message.id)
            )
        );

    /*
     REMOVE ONLY messages which
     genuinely disappeared from server.
    */

    for(
        const [
            id,
            element
        ] of messageElements
    ){

        if(!serverIds.has(id)){

            element.remove();

            messageElements.delete(id);

        }

    }

    /*
     ADD OR UPDATE.

     Existing DOM nodes are reused.
    */

    for(
        const message
        of normalMessages
    ){

        const id =
            String(message.id);

        const existing =
            messageElements.get(id);

        if(existing){

            updateMessageElement(
                existing,
                message
            );

        }else{

            const element =
                createMessageElement(
                    message
                );

            messageElements.set(
                id,
                element
            );

            messagesEl.appendChild(
                element
            );

        }

    }

}


/* =========================================================
   GAME STATE
========================================================= */

function parseGameMessage(
    message
){

    if(
        !message.message ||
        typeof message.message !== "string"
    ){
        return null;
    }

    try{

        const data =
            JSON.parse(
                message.message
            );

        if(
            !data ||
            data.type !== "game"
        ){
            return null;
        }

        return data;

    }catch{

        return null;

    }
}

/* =========================================================

){

    const finished =
        state === "finished";

    const playing =
        state === "playing";

        Array.isArray(game.players)
            ? game.players
            : [];

    const hostName =
        game.hostName ||
        "Unknown";

    const strong =
        document.createElement("strong");

    strong.textContent =

    host.className =

    titleText.appendChild(strong);
    titleText.appendChild(host);

    title.appendChild(icon);
    title.appendChild(titleText);

    const status =
        document.createElement("div");

    status.className =
        "game-status";

    if(playing){
        status.classList.add("playing");
    }

    if(finished){
        status.classList.add("finished");
    }

    status.textContent =
        statusText;

    header.appendChild(title);
    header.appendChild(status);

    card.appendChild(header);

    const body =
        document.createElement("div");

    body.className =
        "game-body";

    const info =
        document.createElement("div");

    info.className =
        "game-info";

    const playerPill =
        document.createElement("div");

    playerPill.className =
        "game-pill";

    playerPill.innerHTML =
        "<strong>" +
        players.length +
        "</strong> / " +
        type.max +
        " players";

    info.appendChild(
        playerPill

    if(game.winner){

        const winnerPill =

            escapeHTML(

        info.appendChild(
            winnerPill
        );

    }

    body.appendChild(info);

    const desc =
        document.createElement("div");

    desc.className =
        "game-description";

    desc.textContent =
        finished
            ? (
                game.result ||
                "The game has finished."
            )
            : type.desc;

    body.appendChild(desc);

    const playersList =
        document.createElement("div");

    playersList.className =
        "players-list";

    players.forEach(player => {

        const chip =
            document.createElement("div");

        chip.className =
            "player-chip";

        if(
            player.deviceId ===
            game.hostDeviceId
        ){
            chip.classList.add(
                "host"
            );
        }

        chip.textContent =
            player.name +
            (
                player.deviceId ===
                game.hostDeviceId
                    ? " 👑"
                    : ""
            );

        playersList.appendChild(
            chip
        );

    });

    body.appendChild(
        playersList
    );

    if(
        !finished &&
        game.turnName
    ){

        const turn =
            document.createElement("div");

        turn.className =
            "turn-banner";

        turn.innerHTML =
            "Turn: <strong>" +
            escapeHTML(
                game.turnName
            ) +
            "</strong>";

        body.appendChild(turn);

    }

    const gameContent =
        document.createElement("div");

    gameContent.className =
        "game-content";

    body.appendChild(
        gameContent
    );

    /*
     Render actual game.
    */

    if(
        game.gameType.startsWith(
            "ttt"
        )
    ){

        renderTicTacToe(
            gameContent,
            serverMessage,
            game
        );

    }else if(
        game.gameType === "reaction"
    ){

        renderReaction(
            gameContent,
            serverMessage,
            game
        );

    }else if(
        game.gameType === "type"
    ){

        renderTypeGame(
            gameContent,
            serverMessage,
            game
        );

    }else if(
        game.gameType === "boss"
    ){

        renderBossGame(
            gameContent,
            serverMessage,
            game
        );

    }

    const actions =
        document.createElement("div");

    actions.className =
        "game-actions";

    /*
     Lobby actions.
    */

    if(state === "lobby"){

        const joined =
            players.some(
                player =>
                    player.deviceId ===
                    deviceId
            );

        if(!joined){

            if(
                players.length <
                type.max
            ){

                const join =
                    document.createElement(
                        "button"
                    );

                join.className =
                    "game-btn primary";

                join.textContent =
                    "Join game";

                join.onclick =
                    () => joinGame(
                        serverMessage,
                        game
                    );

                actions.appendChild(
                    join
                );

            }

        }else{

            const leave =
                document.createElement(
                    "button"
                );

            leave.className =
                "game-btn danger";

            leave.textContent =
                "Leave";

            leave.onclick =
                () => leaveGame(
                    serverMessage,
                    game
                );

            actions.appendChild(
                leave
            );

        }

        if(
            game.hostDeviceId ===
            deviceId
        ){

            const start =
                document.createElement(
                    "button"
                );

            start.className =
                "game-btn green";

            start.textContent =
                "Start game";

            start.disabled =
                players.length <
                type.min;

            start.onclick =
                () => startGame(
                    serverMessage,
                    game
                );

            actions.appendChild(
                start
            );

        }

    }

    /*
     Host can remove active game.
    */

    if(
        game.hostDeviceId ===
        deviceId &&
        !finished
    ){

        const close =
            document.createElement(
                "button"
            );

        close.className =
            "game-btn danger";

        close.textContent =
            "End game";

        close.onclick =
            () => removeGame(
                serverMessage,
                game
            );

        actions.appendChild(
            close
        );

    }

    if(
        actions.children.length
    ){

        body.appendChild(
            actions
        );

    }

    card.appendChild(body);
}


/* =========================================================
   TIC TAC TOE
========================================================= */

function renderTicTacToe(
    container,
    serverMessage,
    game
){

    const type =
        GAME_TYPES[
            game.gameType
        ];

    const size =
        type.size;

    const board =
        Array.isArray(game.board)
            ? game.board
            : Array(
                size * size
            ).fill("");

    if(game.state !== "playing"){
        return;
    }

    const grid =
        document.createElement("div");

    grid.className =
        "ttt";

    grid.style.gridTemplateColumns =
        `repeat(${size},1fr)`;

    const myPlayer =
        game.players?.find(
            player =>
                player.deviceId ===
                deviceId
        );

    const mySymbol =
        myPlayer?.symbol ||
        "";

    const myTurn =
        game.turnDeviceId ===
        deviceId;

    board.forEach(
        (value,index) => {

            const button =
                document.createElement(
                    "button"
                );

            button.textContent =
                value;

            if(value === "X"){
                button.classList.add("x");
            }

            if(value === "O"){
                button.classList.add("o");
            }

            button.disabled =
                Boolean(value) ||
                !myTurn ||
                !mySymbol;

            button.onclick =
                () => {

                    makeTTTMove(
                        serverMessage,
                        game,
                        index
                    );

                };

            grid.appendChild(
                button
            );

        }
    );

    container.appendChild(
        grid
    );
}


async function makeTTTMove(
    serverMessage,
    game,
    index
){

    if(
        game.hostDeviceId !==
        deviceId
    ){

        /*
         Non-host clients cannot PATCH
         because the supplied API only allows
         the game host to update game state.

         We therefore send a request to the
         host through the game's action queue.
        */

        await sendGameAction(
            game,
            {
                action:"ttt_move",
                index,
                deviceId
            }
        );

        return;
    }

    applyHostGameAction(
        serverMessage,
        game,
        {
            action:"ttt_move",
            index,
            deviceId
        }
    );

}


/* =========================================================
   GAME ACTION QUEUE
========================================================= */

function queueKey(game){

    return (
        game.gameId ||
        game.id ||
        ""
    );
}


/*
 Actions are placed inside the shared
 game JSON state.

 Host reads them and processes them.

 This lets normal players interact with
 a game while the existing API only allows
 the host to PATCH the game message.
*/

async function sendGameAction(
    game,
    action
){

    if(
        game.hostDeviceId ===
        deviceId
    ){
        return;
    }

    const key =
        queueKey(game);

    const current =
        Array.isArray(
            game.actions
        )
            ? game.actions
            : [];

    const next =
        current.concat({
            id:
                Date.now() +
                "_" +
                Math.random()
                    .toString(36)
                    .slice(2),

            ...action,

            createdAt:
                Date.now()
        });

    /*
     We cannot PATCH another host's game.

     Store pending action locally so the
     client can display a waiting state.
    */

    localStorage.setItem(
        "pending_game_action_" +
        key,
        JSON.stringify(
            next[next.length - 1]
        )
    );

    toast(
        "Waiting for game host..."
    );
}


/* =========================================================
   HOST ACTION PROCESSOR
========================================================= */

async function processHostActions(
    serverMessage,
    game
){

    if(
        game.hostDeviceId !==
        deviceId
    ){
        return;
    }

    if(
        !Array.isArray(game.actions) ||
        !game.actions.length
    ){
        return;
    }

    /*
     The supplied API does not provide a
     dedicated action endpoint.

     This section keeps the state architecture
     ready for host-side actions.

     For same-host games actions are processed.
    */

    const actions =
        game.actions.slice();

    game.actions = [];

    for(
        const action of actions
    ){

        applyHostGameAction(
            serverMessage,
            game,
            action,
            false
        );

    }

}


/* =========================================================
   APPLY GAME ACTION
========================================================= */

async function applyHostGameAction(
    serverMessage,
    game,
    action,
    writeImmediately = true
){

    if(
        action.action ===
        "ttt_move"
    ){

        const type =
            GAME_TYPES[
                game.gameType
            ];

        const size =
            type.size;

        const board =
            Array.isArray(game.board)
                ? game.board.slice()
                : Array(
                    size * size
                ).fill("");

        if(
            action.index < 0 ||
            action.index >= board.length
        ){
            return;
        }

        if(board[action.index]){
            return;
        }

        if(
            game.turnDeviceId !==
            action.deviceId
        ){

            /*
             Host itself can make the move.
             For other players the current supplied
             API cannot receive a client action.
            */

            if(
                action.deviceId !==
                deviceId
            ){
                return;
            }

        }

        const player =
            game.players?.find(
                p =>
                    p.deviceId ===
                    action.deviceId
            );

        if(!player){
            return;
        }

        board[action.index] =
            player.symbol;

        game.board =
            board;

        const winner =
            checkTTTWinner(
                board,
                size,
                player.symbol
            );

        if(winner){

            game.state =
                "finished";

            game.winner =
                player.name;

            game.result =
                player.name +
                " won!";

            scheduleGameRemoval(
                serverMessage.id,
                game,
                3000
            );

        }else if(
            board.every(Boolean)
        ){

            game.state =
                "finished";

            game.result =
                "Draw!";

            scheduleGameRemoval(
                serverMessage.id,
                game,
                3000
            );

        }else{

            const next =
                game.players.find(
                    p =>
                        p.deviceId !==
                        action.deviceId
                );

            if(next){

                game.turnDeviceId =
                    next.deviceId;

                game.turnName =
                    next.name;

            }

        }

        if(writeImmediately){

            await updateGame(
                serverMessage.id,
                game
            );

        }

    }

}


function checkTTTWinner(
    board,
    size,
    symbol
){

    const needed =
        size;

    function line(
        start,
        delta
    ){

        for(
            let i = 0;
            i < needed;
            i++
        ){

            if(
                board[
                    start +
                    delta * i
                ] !== symbol
            ){
                return false;
            }

        }

        return true;
    }

    for(
        let row=0;
        row<size;
        row++
    ){

        if(
            line(
                row * size,
                1
            )
        ){
            return true;
        }

    }

    for(
        let col=0;
        col<size;
        col++
    ){

        if(
            line(
                col,
                size
            )
        ){
            return true;
        }

    }

    if(
        line(
            0,
            size + 1
        )
    ){
        return true;
    }

    if(
        line(
            size - 1,
            size - 1
        )
    ){
        return true;
    }

    return false;
}

function renderReaction(
    container,
    serverMessage,
    game
){

    if(game.state !== "playing"){
        return;
    }

    const area =
        document.createElement(
            "div"
        );

    area.className =
        "reaction-area";

    const box =
        document.createElement(
            "div"
        );

    box.className =
        "reaction-box";

    const result =
        game.reactionResults?.find(
            x =>
                x.deviceId ===
                deviceId
        );

    if(result){

        box.classList.add(
            "done"
        );

        box.textContent =
            result.ms + " ms";

    }else{

        box.textContent =
            game.reactionGo
                ? "CLICK!"
                : "WAIT...";

        if(game.reactionGo){
            box.classList.add(
                "go"
            );
        }else{
            box.classList.add(
                "ready"
            );
        }

        box.onclick =
            () => reactionClick(
                serverMessage,
                game
            );

    }

    area.appendChild(box);

    container.appendChild(area);
}


async function reactionClick(
    serverMessage,
    game
){

    const start =
        Number(
            game.reactionStart
        );

    if(!start){
        return;
    }

    const ms =
        Math.max(
            1,
            Date.now() -
            start
        );

    /*
     Same limitation as other games:
     only host can update server state.

     The host can click normally.
    */

    if(
        game.hostDeviceId ===
        deviceId
    ){

        game.reactionResults =
            Array.isArray(
                game.reactionResults
            )
                ? game.reactionResults
                : [];

        game.reactionResults.push({
            deviceId,
            name:
                settings.username,
            ms
        });

        await updateGame(
            serverMessage.id,
            game
        );

    }else{

        toast(
            "Reaction recorded locally"
        );

    }

}

function renderTypeGame(
    container,
    serverMessage,
    game
){

    if(game.state !== "playing"){
        return;
    }

    const area =
        document.createElement(
            "div"
        );

    area.className =
        "type-area";

    const sentence =
        document.createElement(
            "div"
        );

    sentence.className =
        "type-sentence";

    sentence.textContent =
        game.sentence ||
        "Get ready...";

    const input =
        document.createElement(
            "input"
        );

    input.className =
        "type-input";

    input.placeholder =
        "Type the sentence...";

        "off";

    input.spellcheck =
        false;

        game.typeResults?.find(

                x.deviceId ===
                deviceId
        );

            true;

            () => {

async function finishTypeGame(
    serverMessage,
    game
){

    const start =
        Number(
            game.typeStart ||
            Date.now()
        );

    const ms =
        Math.max(
            1,
            Date.now() -
            start
        );

    if(
        game.hostDeviceId ===
        deviceId
    ){

        game.typeResults =
            Array.isArray(
                game.typeResults
            )
                ? game.typeResults
                : [];

        game.typeResults.push({
            deviceId,
            name:
                settings.username,
            ms
        });

        if(
            game.typeResults.length >=
            game.players.length
        ){

            finishTypeState(game);

        }

        await updateGame(
            serverMessage.id,
            game
        );

    }else{

        toast(
            "Finished! Waiting for host..."
        );

    }

}


function finishTypeState(game){

    const results =
        game.typeResults || [];

    results.sort(
        (a,b) =>
            a.ms - b.ms
    );

    if(results.length){

        game.winner =
            results[0].name;

        game.result =
            results[0].name +
            " won!";

    }

    game.state =
        "finished";

    scheduleGameRemoval(
        game.id,
        game,
        3000
    );
}
