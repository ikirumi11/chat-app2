<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #111;
    color: #eee;
}

body {
    display: flex;
}

/* ================================
   APP
================================ */

#app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: #111;
}

/* ================================
   HEADER
================================ */

.header {
    height: 64px;
    flex-shrink: 0;

    display: flex;
    align-items: center;

    padding: 0 18px;

    background: #181818;
    border-bottom: 1px solid #292929;
}

.logo {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .5px;
}

.channel {
    margin-left: 20px;

    padding: 7px 12px;

    border-radius: 7px;

    background: #222;
    color: #aaa;

    font-size: 14px;
}

.status {
    margin-left: auto;

    display: flex;
    align-items: center;
    gap: 7px;

    font-size: 12px;
    color: #777;
}

.status-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #555;
}

.status-dot.online {
    background: #55c878;
}

/* ================================
   MESSAGES
================================ */

#messages {
    flex: 1;

    overflow-y: auto;
    overflow-x: hidden;

    padding: 18px;

    scroll-behavior: auto;
}

#messages::-webkit-scrollbar {
    width: 8px;
}

#messages::-webkit-scrollbar-track {
    background: transparent;
}

#messages::-webkit-scrollbar-thumb {
    background: #303030;
    border-radius: 10px;
}

.message {
    width: 100%;

    display: flex;
    gap: 12px;

    padding: 10px 8px;

    border-radius: 8px;

    /* IMPORTANT:
       No animation.
       No opacity transition.
       No fade effect.
    */
}

.message:hover {
    background: #181818;
}

.avatar {
    width: 38px;
    height: 38px;

    flex-shrink: 0;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #292929;

    color: #bbb;

    font-weight: bold;
    font-size: 14px;
}

.message-content {
    min-width: 0;
    flex: 1;
}

.message-top {
    display: flex;
    align-items: baseline;
    gap: 9px;

    margin-bottom: 3px;
}

.username {
    font-size: 14px;
    font-weight: 700;
    color: #ddd;
}

.time {
    font-size: 11px;
    color: #555;
}

.message-text {
    white-space: pre-wrap;
    word-break: break-word;

    font-size: 14px;
    line-height: 1.45;

    color: #ccc;
}

/* ================================
   IMAGES
================================ */

.chat-image {
    display: block;

    max-width: min(500px, 80vw);
    max-height: 500px;

    margin-top: 9px;

    border-radius: 8px;

    cursor: pointer;

    object-fit: contain;

    background: #080808;

    /* NO TRANSITION */
    transition: none;
}

.chat-image:hover {
    opacity: .9;
}

/* ================================
   EMPTY
================================ */

#empty {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #555;

    font-size: 14px;
}

/* ================================
   INPUT AREA
================================ */

.input-area {
    flex-shrink: 0;

    padding: 12px 16px 16px;

    background: #151515;

    border-top: 1px solid #292929;
}

.input-row {
    display: flex;
    gap: 8px;

    max-width: 1100px;
    margin: auto;
}

/* ================================
   INPUT
================================ */

#messageInput {
    flex: 1;

    min-width: 0;

    height: 46px;

    padding: 0 14px;

    border: 1px solid #303030;
    border-radius: 9px;

    outline: none;

    background: #202020;
    color: #eee;

    font-size: 14px;
}

#messageInput:focus {
    border-color: #4b4b4b;
}

#messageInput::placeholder {
    color: #666;
}

/* ================================
   BUTTONS
================================ */

button {
    border: none;
    outline: none;

    cursor: pointer;

    font-family: inherit;
}

#imageButton {
    width: 46px;
    height: 46px;

    border-radius: 9px;

    background: #252525;
    color: #ccc;

    font-size: 20px;
}

#imageButton:hover {
    background: #303030;
}

#sendButton {
    height: 46px;

    padding: 0 19px;

    border-radius: 9px;

    background: #eee;
    color: #111;

    font-weight: 700;
}

#sendButton:hover {
    background: #fff;
}

#sendButton:disabled {
    opacity: .4;
    cursor: default;
}

/* ================================
   SELECTED IMAGE
================================ */

#selectedImage {
    display: none;

    max-width: 1100px;

    margin: 0 auto 8px;

    padding: 8px 10px;

    border-radius: 8px;

    background: #202020;

    color: #aaa;

    font-size: 12px;
}

#selectedImage.visible {
    display: flex;
    align-items: center;
    gap: 8px;
}

#removeImage {
    margin-left: auto;

    background: transparent;
    color: #888;

    font-size: 18px;
}

#removeImage:hover {
    color: #fff;
}

/* ================================
   USERNAME
================================ */

#usernameBox {
    max-width: 1100px;
    margin: 0 auto 8px;

    display: flex;
    align-items: center;
    gap: 8px;
}

#usernameInput {
    width: 180px;
    height: 30px;

    padding: 0 9px;

    border: 1px solid #2c2c2c;
    border-radius: 6px;

    outline: none;

    background: #1d1d1d;
    color: #ddd;

    font-size: 12px;
}

#usernameInput::placeholder {
    color: #555;
}

.username-label {
    font-size: 11px;
    color: #555;
}

/* ================================
   FULLSCREEN IMAGE
================================ */

#imageViewer {
    position: fixed;

    inset: 0;

    z-index: 9999;

    display: none;

    background: rgba(0, 0, 0, .96);
}

#imageViewer.open {
    display: flex;
    align-items: center;
    justify-content: center;
}

#fullscreenImage {
    max-width: calc(100vw - 40px);
    max-height: calc(100vh - 100px);

    object-fit: contain;

    user-select: none;
}

#backButton {
    position: fixed;

    top: 18px;
    left: 18px;

    z-index: 10000;

    height: 42px;

    padding: 0 16px;

    border-radius: 8px;

    background: #222;
    color: #eee;

    border: 1px solid #333;

    font-size: 14px;
}

#backButton:hover {
    background: #303030;
}

#imageName {
    position: fixed;

    bottom: 18px;
    left: 50%;

    transform: translateX(-50%);

    max-width: 80vw;

    color: #777;

    font-size: 12px;
}

/* ================================
   ERROR
================================ */

#errorBox {
    position: fixed;

    left: 50%;
    bottom: 90px;

    transform: translateX(-50%);

    z-index: 5000;

    display: none;

    max-width: 90vw;

    padding: 11px 15px;

    border-radius: 8px;

    background: #291818;
    border: 1px solid #4b2727;

    color: #e88;

    font-size: 12px;
}

#errorBox.show {
    display: block;
}

/* ================================
   MOBILE
================================ */

@media (max-width: 600px) {

    .header {
        height: 56px;
        padding: 0 12px;
    }

    .logo {
        font-size: 17px;
    }

    .channel {
        margin-left: 10px;
        font-size: 12px;
    }

    .status {
        display: none;
    }

    #messages {
        padding: 10px;
    }

    .message {
        padding: 8px 3px;
    }

    .avatar {
        width: 32px;
        height: 32px;
    }

    .chat-image {
        max-width: 85vw;
        max-height: 400px;
    }

    .input-area {
        padding: 8px;
    }

    #usernameInput {
        width: 140px;
    }

    #sendButton {
        padding: 0 14px;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            Chat
        </div>

        <div class="channel">
            # general
        </div>

        <div class="status">

            <div
                id="statusDot"
                class="status-dot">
            </div>

            <span id="statusText">
                Connecting...
            </span>

        </div>

    </header>


    <!-- MESSAGES -->

    <main id="messages">

        <div id="empty">
            No messages yet.
        </div>

    </main>


    <!-- INPUT -->

    <section class="input-area">

        <div id="usernameBox">

            <span class="username-label">
                NAME
            </span>

            <input
                id="usernameInput"
                maxlength="24"
                placeholder="Username"
                autocomplete="off"
            >

        </div>


        <div
            id="selectedImage">

            <span id="selectedImageName">
                Image selected
            </span>

            <button
                id="removeImage"
                type="button">
                ×
            </button>

        </div>


        <div class="input-row">

            <button
                id="imageButton"
                type="button"
                title="Choose image">
                +
            </button>

            <input
                id="fileInput"
                type="file"
                accept="image/*"
                hidden
            >

            <input
                id="messageInput"
                type="text"
                maxlength="2000"
                placeholder="Message #general"
                autocomplete="off"
            >

            <button
                id="sendButton"
                type="button">
                Send
            </button>

        </div>

    </section>

</div>


<!-- FULLSCREEN IMAGE VIEWER -->

<div id="imageViewer">

    <button
        id="backButton"
        type="button">
        ← Back
    </button>

    <img
        id="fullscreenImage"
        alt="Full size image"
    >

    <div id="imageName"></div>

</div>


<!-- ERROR -->

<div id="errorBox"></div>


<script>

/* =========================================================
   SETTINGS
========================================================= */

const API_URL =
    "/api/messages";

const CHANNEL =
    "general";

const MAX_IMAGE_SIZE =
    1500;

const REFRESH_TIME =
    3000;


/* =========================================================
   ELEMENTS
========================================================= */

const messagesElement =
    document.getElementById(
        "messages"
    );

const messageInput =
    document.getElementById(
        "messageInput"
    );

const usernameInput =
    document.getElementById(
        "usernameInput"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const imageButton =
    document.getElementById(
        "imageButton"
    );

const fileInput =
    document.getElementById(
        "fileInput"
    );

const selectedImage =
    document.getElementById(
        "selectedImage"
    );

const selectedImageName =
    document.getElementById(
        "selectedImageName"
    );

const removeImage =
    document.getElementById(
        "removeImage"
    );

const statusText =
    document.getElementById(
        "statusText"
    );

const statusDot =
    document.getElementById(
        "statusDot"
    );

const errorBox =
    document.getElementById(
        "errorBox"
    );

const imageViewer =
    document.getElementById(
        "imageViewer"
    );

const fullscreenImage =
    document.getElementById(
        "fullscreenImage"
    );

const backButton =
    document.getElementById(
        "backButton"
    );

const imageName =
    document.getElementById(
        "imageName"
    );


/* =========================================================
   STATE
========================================================= */

let selectedImageBase64 =
    null;

let selectedImageFileName =
    "";

let messagesCache =
    new Map();

let loading =
    false;


/* =========================================================
   USERNAME
========================================================= */

const savedUsername =
    localStorage.getItem(
        "chat_username"
    );

if (savedUsername) {

    usernameInput.value =
        savedUsername;

}


usernameInput.addEventListener(
    "input",
    () => {

        localStorage.setItem(
            "chat_username",
            usernameInput.value
        );

    }
);


/* =========================================================
   ERROR
========================================================= */

function showError(message) {

    errorBox.textContent =
        message;

    errorBox.classList.add(
        "show"
    );

    clearTimeout(
        showError.timer
    );

    showError.timer =
        setTimeout(
            () => {

                errorBox.classList.remove(
                    "show"
                );

            },
            6000
        );

}


/* =========================================================
   STATUS
========================================================= */

function setOnline() {

    statusDot.classList.add(
        "online"
    );

    statusText.textContent =
        "Connected";

}


function setOffline() {

    statusDot.classList.remove(
        "online"
    );

    statusText.textContent =
        "Connection error";

}


/* =========================================================
   IMAGE SELECT
========================================================= */

imageButton.addEventListener(
    "click",
    () => {

        fileInput.click();

    }
);


fileInput.addEventListener(
    "change",
    async () => {

        const file =
            fileInput.files[0];

        if (!file) {
            return;
        }

        if (
            !file.type.startsWith(
                "image/"
            )
        ) {

            showError(
                "Please choose an image file."
            );

            return;
        }

        try {

            selectedImageBase64 =
                await resizeImage(
                    file,
                    MAX_IMAGE_SIZE
                );

            selectedImageFileName =
                file.name;

            selectedImageName.textContent =
                file.name +
                " selected";

            selectedImage.classList.add(
                "visible"
            );

        } catch (error) {

            console.error(error);

            showError(
                "Could not process the image."
            );

        }

    }
);


/* =========================================================
   REMOVE IMAGE
========================================================= */

removeImage.addEventListener(
    "click",
    () => {

        clearSelectedImage();

    }
);


function clearSelectedImage() {

    selectedImageBase64 =
        null;

    selectedImageFileName =
        "";

    fileInput.value =
        "";

    selectedImage.classList.remove(
        "visible"
    );

}


/* =========================================================
   RESIZE IMAGE
========================================================= */

function resizeImage(
    file,
    maxSize
) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () => {

                    const img =
                        new Image();

                    img.onload =
                        () => {

                            let width =
                                img.naturalWidth;

                            let height =
                                img.naturalHeight;


                            /*
                             * Keep the original
                             * aspect ratio.
                             */

                            if (
                                width >
                                    maxSize ||
                                height >
                                    maxSize
                            ) {

                                const scale =
                                    Math.min(
                                        maxSize /
                                            width,
                                        maxSize /
                                            height
                                    );

                                width =
                                    Math.round(
                                        width *
                                        scale
                                    );

                                height =
                                    Math.round(
                                        height *
                                        scale
                                    );

                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );

                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const context =
                                canvas.getContext(
                                    "2d"
                                );


                            context.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );


                            /*
                             * JPEG keeps Base64
                             * much smaller.
                             */

                            const result =
                                canvas.toDataURL(
                                    "image/jpeg",
                                    0.82
                                );


                            resolve(result);

                        };


                    img.onerror =
                        () => {

                            reject(
                                new Error(
                                    "Image could not be loaded."
                                )
                            );

                        };


                    img.src =
                        reader.result;

                };


            reader.onerror =
                () => {

                    reject(
                        new Error(
                            "Could not read image."
                        )
                    );

                };


            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =========================================================
   CREATE MESSAGE ELEMENT
========================================================= */

function createMessageElement(
    msg
) {

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message";

    /*
     * Stable ID.
     * This lets us update only messages
     * that actually changed.
     */

    wrapper.dataset.id =
        String(
            msg.id
        );


    /* AVATAR */

    const avatar =
        document.createElement(
            "div"
        );

    avatar.className =
        "avatar";

    avatar.textContent =
        getInitial(
            msg.username
        );


    /* CONTENT */

    const content =
        document.createElement(
            "div"
        );

    content.className =
        "message-content";


    /* TOP */

    const top =
        document.createElement(
            "div"
        );

    top.className =
        "message-top";


    const username =
        document.createElement(
            "span"
        );

    username.className =
        "username";

    username.textContent =
        msg.username ||
        "Unknown";


    const time =
        document.createElement(
            "span"
        );

    time.className =
        "time";

    time.textContent =
        formatTime(
            msg.created_at
        );


    top.appendChild(
        username
    );

    top.appendChild(
        time
    );


    content.appendChild(
        top
    );


    /* TEXT */

    if (
        msg.message &&
        String(msg.message).trim()
    ) {

        const text =
            document.createElement(
                "div"
            );

        text.className =
            "message-text";

        text.textContent =
            msg.message;

        content.appendChild(
            text
        );

    }


    /* IMAGE */

    if (
        msg.image &&
        typeof msg.image ===
            "string"
    ) {

        const image =
            document.createElement(
                "img"
            );

        image.className =
            "chat-image";

        image.src =
            msg.image;

        image.alt =
            "Image";

        image.loading =
            "lazy";

        image.decoding =
            "async";


        image.addEventListener(
            "click",
            () => {

                openImage(
                    msg.image,
                    msg.username
                );

            }
        );


        content.appendChild(
            image
        );

    }


    wrapper.appendChild(
        avatar
    );

    wrapper.appendChild(
        content
    );


    return wrapper;

}


/* =========================================================
   INITIAL
========================================================= */

function getInitial(
    name
) {

    const value =
        String(
            name ||
            "?"
        ).trim();

    return value
        ? value
            .charAt(0)
            .toUpperCase()
        : "?";

}


/* =========================================================
   TIME
========================================================= */

function formatTime(
    value
) {

    if (!value) {
        return "";
    }

    const date =
        new Date(
            value
        );

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";

    }

    return date.toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(
    incoming
) {

    if (
        !Array.isArray(
            incoming
        )
    ) {

        return;

    }


    /*
     * Remember whether the user was
     * already near the bottom.
     */

    const wasNearBottom =
        messagesElement.scrollHeight -
        messagesElement.scrollTop -
        messagesElement.clientHeight <
        120;


    const empty =
        document.getElementById(
            "empty"
        );


    if (incoming.length === 0) {

        if (!empty) {

            const emptyElement =
                document.createElement(
                    "div"
                );

            emptyElement.id =
                "empty";

            emptyElement.textContent =
                "No messages yet.";

            messagesElement.appendChild(
                emptyElement
            );

        }

        return;

    }


    if (empty) {

        empty.remove();

    }


    /*
     * IMPORTANT:
     *
     * We do NOT clear innerHTML.
     *
     * We do NOT fade messages.
     *
     * We do NOT rebuild the entire list.
     *
     * We only add/update/remove what
     * actually changed.
     */


    const incomingIds =
        new Set();


    for (
        const msg of incoming
    ) {

        const id =
            String(
                msg.id
            );

        incomingIds.add(
            id
        );


        const old =
            messagesCache.get(
                id
            );


        /*
         * Existing message:
         * leave its DOM alone.
         */

        if (old) {

            continue;

        }


        /*
         * New message.
         */

        const element =
            createMessageElement(
                msg
            );

        messagesElement.appendChild(
            element
        );

        messagesCache.set(
            id,
            msg
        );

    }


    /*
     * Remove messages that no longer
     * exist on the server.
     */

    for (
        const [
            id
        ] of messagesCache
    ) {

        if (
            !incomingIds.has(
                id
            )
        ) {

            const element =
                messagesElement.querySelector(
                    `[data-id="${CSS.escape(id)}"]`
                );

            if (element) {
                element.remove();
            }

            messagesCache.delete(
                id
            );

        }

    }


    /*
     * Only scroll automatically if
     * already near the bottom.
     */

    if (wasNearBottom) {

        messagesElement.scrollTop =
            messagesElement.scrollHeight;

    }

}


/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages() {

    if (loading) {
        return;
    }

    loading =
        true;


    try {

        const response =
            await fetch(
                API_URL +
                "?channel=" +
                encodeURIComponent(
                    CHANNEL
                ),
                {
                    method:
                        "GET",

                    cache:
                        "no-store",

                    headers: {
                        "Accept":
                            "application/json"
                    }
                }
            );


        const text =
            await response.text();


        let data;


        try {

            data =
                JSON.parse(
                    text
                );

        } catch {

            throw new Error(
                "Server returned invalid JSON."
            );

        }


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status +
                ": " +
                (
                    data.error ||
                    "Server error"
                )
            );

        }


        if (
            data.success !== true
        ) {

            throw new Error(
                data.error ||
                "API request failed."
            );

        }


        setOnline();

        renderMessages(
            data.messages
        );


    } catch (error) {

        console.error(
            "LOAD ERROR:",
            error
        );

        setOffline();

        /*
         * Don't erase existing messages
         * when a refresh fails.
         */

        if (
            messagesCache.size === 0
        ) {

            showError(
                error.message
            );

        }

    } finally {

        loading =
            false;

    }

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    if (
        sendButton.disabled
    ) {

        return;

    }


    const username =
        usernameInput.value
            .trim()
            .substring(
                0,
                24
            );

    const message =
        messageInput.value
            .trim()
            .substring(
                0,
                2000
            );


    if (!username) {

        showError(
            "Enter a username first."
        );

        usernameInput.focus();

        return;

    }


    if (
        !message &&
        !selectedImageBase64
    ) {

        showError(
            "Type a message or choose an image."
        );

        return;

    }


    sendButton.disabled =
        true;

    sendButton.textContent =
        "Sending...";


    try {

        const payload = {

            username:
                username,

            channel:
                CHANNEL,

            message:
                message,

            image:
                selectedImageBase64

        };


        const response =
            await fetch(
                API_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            payload
                        )

                }
            );


        const text =
            await response.text();


        let data;


        try {

            data =
                JSON.parse(
                    text
                );

        } catch {

            throw new Error(
                "Server returned invalid JSON."
            );

        }


        if (!response.ok) {

            let errorMessage =
                data.error ||
                "Failed to send message.";


            if (data.fix) {

                errorMessage +=
                    "\n\n" +
                    data.fix;

            }


            throw new Error(
                errorMessage
            );

        }


        if (
            data.success !== true
        ) {

            throw new Error(
                data.error ||
                "Message was not accepted."
            );

        }


        /*
         * Clear input only after
         * successful sending.
         */

        messageInput.value =
            "";

        clearSelectedImage();


        setOnline();


        /*
         * Fetch immediately so the new
         * message appears.
         */

        await loadMessages();


    } catch (error) {

        console.error(
            "SEND ERROR:",
            error
        );

        showError(
            error.message
        );

    } finally {

        sendButton.disabled =
            false;

        sendButton.textContent =
            "Send";

    }

}


/* =========================================================
   SEND BUTTON
========================================================= */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =========================================================
   ENTER TO SEND
========================================================= */

messageInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
                "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================================
   FULLSCREEN IMAGE
========================================================= */

function openImage(
    src,
    name
) {

    fullscreenImage.src =
        src;

    imageName.textContent =
        name
            ? "Sent by " + name
            : "";

    imageViewer.classList.add(
        "open"
    );

    document.body.style.overflow =
        "hidden";

}


/* =========================================================
   CLOSE FULLSCREEN
========================================================= */

function closeImage() {

    imageViewer.classList.remove(
        "open"
    );

    fullscreenImage.src =
        "";

    document.body.style.overflow =
        "hidden";

}


backButton.addEventListener(
    "click",
    closeImage
);


/*
 * Clicking the dark background also
 * closes the image.
 */

imageViewer.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            imageViewer
        ) {

            closeImage();

        }

    }
);


/*
 * ESC closes fullscreen.
 */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
                "Escape" &&
            imageViewer.classList.contains(
                "open"
            )
        ) {

            closeImage();

        }

    }
);


/* =========================================================
   START
========================================================= */

loadMessages();


/*
 * Refresh messages without rebuilding
 * the existing DOM.
 *
 * Existing messages therefore stay
 * completely instant and visible.
 */

setInterval(
    loadMessages,
    REFRESH_TIME
);

</script>

</body>
</html>
