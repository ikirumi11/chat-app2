<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat App 2</title>
<link rel="stylesheet" href="https://raw.githubusercontent.com/ikirumi11/chat-app2/main/style.css">
</head>
<body>
<div id="join" class="panel"><div class="card"><div class="heroLogo">✦</div><h1>Chat App 2</h1><p>Private browser-to-browser chat with text, media, files and screen sharing.</p><div class="profileSetup"><div id="pfpPreview" class="pfpPreview">G</div><div><button type="button" id="pfpPick" class="pfpPick">Choose profile picture</button><input id="pfpInput" type="file" accept="image/*" class="hidden"></div></div><input id="name" maxlength="30" placeholder="Your name"><div class="row"><input id="room" maxlength="40" placeholder="Room code"><button id="joinBtn">Join room</button></div><div class="small">Use the same room code on each browser. Your profile picture stays on this device.</div></div></div>
<div id="app" class="app hidden"><header class="top"><div class="brand"><div id="myAvatar" class="logo">✦</div><div><div class="title">Chat App 2</div><div id="status" class="status">Waiting for peers</div></div></div><div class="topActions"><button id="shareBtn">Share screen + audio</button><button id="saveBtn" class="ghost">Download chat</button><button id="copyBtn" class="ghost">Copy room</button><button id="leaveBtn">Leave</button></div></header><div class="room"><input id="roomDisplay" readonly><button id="copyRoomBtn">Copy</button></div><main id="messages" class="messages"><div class="empty"><div><div class="emptyIcon">✦</div><div>Join the room from another browser to start chatting.</div></div></main><form id="send" class="send"><input id="fileInput" type="file" multiple accept="image/*,video/*,*/*" class="hidden"><button type="button" id="attachBtn" class="attach" title="Send files">＋</button><input id="message" autocomplete="off" placeholder="Write a message…"><button class="sendBtn">Send</button></form></div><div id="toast" class="toast"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://raw.githubusercontent.com/ikirumi11/chat-app2/main/app.js"></script>
</body>
</html>
