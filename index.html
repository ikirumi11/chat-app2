<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat</title>

<style>
*{box-sizing:border-box}

:root{
    --bg:#0b0d10;
    --panel:#111419;
    --panel2:#181c22;
    --panel3:#20252d;
    --border:#292f38;
    --text:#edf0f4;
    --muted:#7e8793;
    --accent:#e8eaed;
    --danger:#ff7070;
    --success:#70d890;
    --radius:12px;
    --ui-scale:1;
    --text-size:16px;
    --word-spacing:0px;
    --line-spacing:1.45;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

body{
    overflow:hidden;
    font-size:calc(16px * var(--ui-scale));
}

button,input,textarea,select{
    font:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:64px;
    min-height:64px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel);
    border-bottom:1px solid var(--border);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
}

.logo-icon{
    width:35px;
    height:35px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:var(--panel2);
    border:1px solid var(--border);
}

.channel{
    color:var(--muted);
    font-weight:400;
}

/* TABS */

.tabs{
    height:48px;
    min-height:48px;
    display:flex;
    align-items:center;
    gap:5px;
    padding:5px 12px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
}

.tab{
    height:38px;
    padding:0 16px;
    border:1px solid transparent;
    border-radius:9px;
    background:transparent;
    color:var(--muted);
    font-weight:700;
}

.tab:hover{
    background:var(--panel2);
    color:var(--text);
}

.tab.active{
    background:var(--panel2);
    border-color:var(--border);
    color:var(--text);
}

.icon-btn{
    width:39px;
    height:39px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
}

.icon-btn:hover{
    filter:brightness(1.15);
}

/* VIEWS */

.view{
    flex:1;
    min-height:0;
    display:none;
}

.view.active{
    display:flex;
}

/* CHAT */

.chat-view{
    flex-direction:column;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    display:flex;
    gap:11px;
    margin-bottom:17px;
}

.avatar{
    flex:0 0 40px;
    width:40px;
    height:40px;
    display:grid;
    place-items:center;
    border-radius:var(--radius);
    background:var(--panel2);
    border:1px solid var(--border);
    font-weight:700;
}

.message-content{
    min-width:0;
    max-width:min(850px,calc(100vw - 90px));
}

.message-top{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:3px;
}

.username{
    font-weight:700;
}

.time,.edited{
    color:var(--muted);
    font-size:11px;
}

.message-text{
    color:#d8dde4;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    font-size:var(--text-size);
    word-spacing:var(--word-spacing);
    line-height:var(--line-spacing);
}

.message-image{
    display:block;
    max-width:min(500px,80vw);
    max-height:500px;
    margin-top:8px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:#000;
    object-fit:contain;
    cursor:pointer;
}

.composer{
    padding:12px 16px 16px;
    background:var(--panel);
    border-top:1px solid var(--border);
}

.composer-box{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:8px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:14px;
}

textarea{
    flex:1;
    min-height:42px;
    max-height:150px;
    resize:none;
    border:0;
    outline:none;
    background:transparent;
    color:white;
    padding:10px;
}

.attach-btn,
.send-btn{
    height:42px;
    border:0;
    border-radius:9px;
}

.attach-btn{
    width:42px;
    background:transparent;
    color:#adb5c0;
    font-size:20px;
}

.attach-btn:hover{
    background:#242932;
}

.send-btn{
    padding:0 18px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

/* GAMES */

.games-view{
    overflow-y:auto;
    flex-direction:column;
    padding:20px;
}

.games-container{
    width:min(1200px,100%);
    margin:auto;
}

.games-heading{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
    margin-bottom:20px;
}

.games-heading h1{
    margin:0 0 5px;
    font-size:25px;
}

.games-heading p{
    margin:0;
    color:var(--muted);
}

.game-actions{
    display:flex;
    gap:8px;
}

.primary-btn,
.secondary-btn,
.danger-btn,
.success-btn{
    border-radius:9px;
    padding:10px 15px;
    border:1px solid var(--border);
    font-weight:700;
}

.primary-btn{
    background:var(--accent);
    color:#111;
}

.secondary-btn{
    background:var(--panel2);
    color:var(--text);
}

.success-btn{
    background:#183a27;
    border-color:#28653e;
    color:#91e4aa;
}

.danger-btn{
    background:#291719;
    border-color:#633136;
    color:#ff8585;
}

.game-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:12px;
}

.game-card{
    position:relative;
    padding:18px;
    min-height:190px;
    border:1px solid var(--border);
    border-radius:14px;
    background:var(--panel);
    transition:.15s;
}

.game-card:hover{
    transform:translateY(-2px);
    border-color:#3c444f;
}

.game-icon{
    width:50px;
    height:50px;
    display:grid;
    place-items:center;
    font-size:26px;
    border-radius:13px;
    background:var(--panel2);
    border:1px solid var(--border);
    margin-bottom:12px;
}

.game-card h3{
    margin:0 0 6px;
}

.game-card p{
    color:var(--muted);
    margin:0 0 15px;
    line-height:1.4;
}

.game-meta{
    color:#9aa3ae;
    font-size:12px;
    margin-bottom:12px;
}

.game-board-panel{
    margin-top:15px;
    padding:18px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
}

.game-topbar{
    display:flex;
    justify-content:space-between;
    gap:15px;
    flex-wrap:wrap;
    align-items:center;
    padding-bottom:15px;
    border-bottom:1px solid var(--border);
}

.game-title{
    display:flex;
    gap:10px;
    align-items:center;
}

.game-title h2{
    margin:0;
}

.game-status{
    color:var(--muted);
    font-size:13px;
}

.players-list{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin:15px 0;
}

.player-chip{
    display:flex;
    align-items:center;
    gap:6px;
    padding:7px 10px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:8px;
    font-size:13px;
}

.player-chip.host{
    border-color:#75662c;
}

.player-chip.turn{
    border-color:#34704b;
    box-shadow:0 0 0 1px #34704b inset;
}

.turn-banner{
    padding:12px;
    margin-bottom:15px;
    border-radius:10px;
    background:var(--panel2);
    border:1px solid var(--border);
    text-align:center;
    font-weight:700;
}

.board{
    margin:20px auto;
    width:min(430px,100%);
}

/* TIC TAC TOE */

.ttt-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
}

.ttt-cell{
    aspect-ratio:1;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--panel2);
    color:var(--text);
    font-size:clamp(35px,10vw,70px);
    font-weight:800;
}

.ttt-cell:hover:not(:disabled){
    background:var(--panel3);
}

/* DICE */

.dice-board{
    text-align:center;
}

.dice-number{
    font-size:90px;
    line-height:1;
    margin:20px;
}

/* CONNECT FOUR */

.connect-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:5px;
    padding:8px;
    background:#10151b;
    border-radius:12px;
}

.connect-cell{
    aspect-ratio:1;
    border-radius:50%;
    border:1px solid var(--border);
    background:#242a31;
}

.connect-cell.red{
    background:#d95757;
}

.connect-cell.yellow{
    background:#e0c44d;
}

.connect-columns{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:5px;
    margin-bottom:5px;
}

.connect-column{
    padding:7px 2px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    border-radius:7px;
}

/* HIGHER/LOWER */

.hl-board{
    text-align:center;
}

.hl-number{
    font-size:75px;
    font-weight:800;
    margin:20px;
}

/* ROCK PAPER SCISSORS */

.rps-buttons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
}

.rps-button{
    min-width:95px;
    padding:14px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--panel2);
    color:var(--text);
    font-size:25px;
}

/* LOBBY */

.lobby-note{
    margin-top:20px;
    padding:12px;
    color:var(--muted);
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--panel2);
}

.empty-games{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
    border:1px dashed var(--border);
    border-radius:14px;
}

/* MODALS */

.overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.72);
    z-index:100;
}

.overlay.show{
    display:flex;
}

.panel{
    width:min(520px,calc(100vw - 25px));
    max-height:calc(100vh - 25px);
    overflow-y:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
    box-shadow:0 25px 80px #000b;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px;
    border-bottom:1px solid var(--border);
}

.panel-header h2{
    margin:0;
}

.panel-body{
    padding:18px;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    color:#aab2bd;
    font-size:13px;
    margin-bottom:7px;
}

.form-group input,
.form-group select{
    width:100%;
    padding:11px;
    border:1px solid var(--border);
    border-radius:9px;
    background:#101419;
    color:white;
    outline:none;
}

.form-buttons{
    display:flex;
    gap:8px;
    justify-content:flex-end;
}

/* SETTINGS */

.category{
    margin-bottom:12px;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    background:var(--panel2);
}

.category-title{
    width:100%;
    padding:14px;
    border:0;
    background:transparent;
    color:var(--text);
    display:flex;
    justify-content:space-between;
    font-weight:700;
    text-align:left;
}

.category-body{
    display:none;
    padding:0 14px 14px;
}

.category.open .category-body{
    display:block;
}

.setting{
    margin-top:14px;
}

.setting label{
    display:block;
    margin-bottom:7px;
    color:#aab2bd;
    font-size:13px;
}

.setting input,
.setting select{
    width:100%;
    padding:10px;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
    background:#101419;
    color:white;
}

.setting input[type="range"]{
    padding:0;
}

.setting-value{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.save-btn{
    width:100%;
    margin-top:8px;
    padding:12px;
    border:0;
    border-radius:9px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

/* CONTEXT */

.context-menu{
    position:fixed;
    display:none;
    width:160px;
    padding:5px;
    z-index:200;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:9px;
    box-shadow:0 15px 40px #0009;
}

.context-menu.show{
    display:block;
}

.context-menu button{
    width:100%;
    padding:9px 10px;
    text-align:left;
    border:0;
    border-radius:6px;
    background:transparent;
    color:var(--text);
}

.context-menu button:hover{
    background:#252b33;
}

.delete-option{
    color:#ff7777!important;
}

/* IMAGE */

.image-viewer{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000f;
    z-index:300;
}

.image-viewer.show{
    display:flex;
}

.full-image{
    max-width:95vw;
    max-height:90vh;
    object-fit:contain;
}

.back-image{
    position:absolute;
    top:18px;
    left:18px;
    padding:10px 16px;
    border-radius:9px;
    border:1px solid #3a4049;
    background:#171b21;
    color:white;
}

/* EMPTY */

.empty{
    height:100%;
    display:grid;
    place-items:center;
    color:#656d78;
    text-align:center;
}

.empty strong{
    display:block;
    color:#aab2bd;
    margin-bottom:5px;
}

/* RESPONSIVE */

@media(max-width:600px){

    .header{
        padding:0 11px;
    }

    .messages{
        padding:15px 11px;
    }

    .channel{
        display:none;
    }

    .message-content{
        max-width:calc(100vw - 70px);
    }

    .games-view{
        padding:12px;
    }

    .games-heading{
        flex-direction:column;
    }

    .game-actions{
        width:100%;
    }

    .game-actions button{
        flex:1;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="logo">
        <div class="logo-icon">💬</div>
        <span>Chat</span>
        <span class="channel"># general</span>
    </div>

    <button class="icon-btn" id="settingsBtn">⚙</button>

</header>


<!-- TABS -->

<nav class="tabs">

    <button class="tab active" data-view="chatView">
        💬 Chat
    </button>

    <button class="tab" data-view="gamesView">
        🎮 Games
    </button>

</nav>


<!-- CHAT VIEW -->

<main class="view chat-view active" id="chatView">

    <main class="messages" id="messages"></main>

    <div class="composer">

        <div class="composer-box">

            <input
                type="file"
                id="imageInput"
                accept="image/*"
                hidden
            >

            <button
                class="attach-btn"
                id="attachBtn"
            >＋</button>

            <textarea
                id="messageInput"
                rows="1"
                placeholder="Message #general"
            ></textarea>

            <button
                class="send-btn"
                id="sendBtn"
            >Send</button>

        </div>

    </div>

</main>


<!-- GAMES VIEW -->

<section class="view games-view" id="gamesView">

<div class="games-container">

    <div class="games-heading">

        <div>
            <h1>🎮 Games</h1>
            <p>
                Play games with everyone without filling the chat with game data.
            </p>
        </div>

        <div class="game-actions">

            <button
                class="secondary-btn"
                id="refreshGamesBtn"
            >
                ↻ Refresh
            </button>

            <button
                class="primary-btn"
                id="createGameBtn"
            >
                ＋ Create game
            </button>

        </div>

    </div>


    <div id="gamesLobby"></div>

    <div
        class="game-board-panel"
        id="activeGamePanel"
        style="display:none"
    ></div>

</div>

</section>

</div>


<!-- CREATE GAME -->

<div class="overlay" id="createGameOverlay">

<div class="panel">

    <div class="panel-header">

        <h2>Create a game</h2>

        <button class="icon-btn" id="closeCreateGame">×</button>

    </div>

    <div class="panel-body">

        <div class="form-group">

            <label>Game</label>

            <select id="gameTypeSelect">

                <option value="tictactoe">⭕ Tic-Tac-Toe</option>
                <option value="connect4">🔴 Connect Four</option>
                <option value="dice">🎲 Dice Battle</option>
                <option value="higherlower">🔢 Higher or Lower</option>
                <option value="rps">✊ Rock Paper Scissors</option>

            </select>

        </div>

        <div class="form-group">

            <label>Game name</label>

            <input
                id="gameNameInput"
                maxlength="35"
                placeholder="My game"
            >

        </div>

        <div class="form-group">

            <label>Maximum players</label>

            <select id="maxPlayersSelect">

                <option value="2">2 players</option>
                <option value="3">3 players</option>
                <option value="4">4 players</option>
                <option value="5">5 players</option>
                <option value="6">6 players</option>
                <option value="8">8 players</option>

            </select>

        </div>

        <div class="lobby-note">
            You can host only one game at a time.
            Players must join before you press Start.
        </div>

        <div class="form-buttons" style="margin-top:15px">

            <button
                class="secondary-btn"
                id="cancelCreateGame"
            >
                Cancel
            </button>

            <button
                class="primary-btn"
                id="confirmCreateGame"
            >
                Create lobby
            </button>

        </div>

    </div>

</div>

</div>


<!-- SETTINGS -->

<div class="overlay" id="settingsOverlay">

<div class="panel">

<div class="panel-header">

    <h2>Settings</h2>

    <button
        class="icon-btn"
        id="closeSettings"
    >×</button>

</div>

<div class="panel-body">


<div class="category open">

<button class="category-title">
    <span>👤 Profile</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Your name</label>

<input
    id="usernameInput"
    maxlength="24"
    placeholder="Enter your name"
>

</div>

<div class="setting">

<label>Device ID</label>

<input
    id="deviceIdInput"
    readonly
>

</div>

</div>
</div>


<div class="category">

<button class="category-title">
    <span>📝 Text</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Text size</label>

<input
    id="textSize"
    type="range"
    min="12"
    max="24"
    step="1"
>

<div class="setting-value" id="textSizeValue"></div>

</div>

<div class="setting">

<label>Word spacing</label>

<input
    id="wordSpacing"
    type="range"
    min="0"
    max="12"
    step="1"
>

<div class="setting-value" id="wordSpacingValue"></div>

</div>

<div class="setting">

<label>Line spacing</label>

<input
    id="lineSpacing"
    type="range"
    min="1"
    max="2"
    step=".05"
>

<div class="setting-value" id="lineSpacingValue"></div>

</div>

</div>
</div>


<div class="category">

<button class="category-title">
    <span>💬 Chat</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Refresh rate</label>

<select id="refreshRate">

<option value="10000">10 seconds</option>
<option value="5000">5 seconds</option>
<option value="3000">3 seconds</option>
<option value="2000">2 seconds</option>
<option value="1000">1 second</option>
<option value="500">0.5 seconds</option>
<option value="100">0.1 seconds</option>

</select>

</div>

<div class="setting">

<label>Show timestamps</label>

<select id="showTimestamps">

<option value="true">On</option>
<option value="false">Off</option>

</select>

</div>

<div class="setting">

<label>Compact messages</label>

<select id="compactMessages">

<option value="false">Off</option>
<option value="true">On</option>

</select>

</div>

</div>
</div>


<div class="category">

<button class="category-title">
    <span>🎨 Appearance</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Theme</label>

<select id="themeSelect">

<option value="dark">Dark</option>
<option value="midnight">Midnight</option>
<option value="slate">Slate</option>
<option value="black">Pure Black</option>
<option value="blue">Dark Blue</option>

function resizeImage(file){

    return new Promise((resolve,reject)=>{

        const reader=
            new FileReader();

        reader.onload=()=>{

            const img=
                new Image();

            img.onload=()=>{

                let width=img.width;
                let height=img.height;

                const max=1500;

                if(
                    width>max||
                    height>max
                ){

                    const scale=
                        Math.min(
                            max/width,
                            max/height
                        );

                    width=
                        Math.round(
                            width*scale
                        );

                    height=
                        Math.round(
                            height*scale
                        );

                }

                const canvas=
                    document.createElement(
                        "canvas"
                    );

                canvas.width=width;
                canvas.height=height;

                const ctx=
                    canvas.getContext("2d");

                ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                );

                resolve(
                    canvas.toDataURL(
                        "image/jpeg",
                        .78
                    )
                );

            };

            img.onerror=reject;
            img.src=reader.result;

        };

        reader.onerror=reject;

        reader.readAsDataURL(file);

    });

}

async function sendMessage(){

    const text=
        messageInput.value.trim();

    if(!settings.username){

        settingsBtn.click();

        usernameInput.focus();

        alert(
            "Set your name in Settings first."
        );

        return;

    }

    if(!text&&!selectedFile)
        return;

    sendBtn.disabled=true;

    try{

        let image=null;

        if(selectedFile){
            image=
                await resizeImage(
                    selectedFile
                );
        }

        const response=
            await fetch(
                API_URL,
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({

                            username:
                                settings.username,

                            channel:
                                CHANNEL,

                            message:text,

                            image:image,

                            device_id:
                                deviceId

                        })
                }
            );

        const data=
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error||
                "Failed to send message."
            );

        }

        messageInput.value="";

        messageInput.style.height=
            "auto";

        selectedFile=null;

        imageInput.value="";

        attachBtn.textContent="＋";

        await loadMessages();

    }catch(error){

        alert(
            "Failed to send:\n\n"+
            error.message
        );

    }finally{

        sendBtn.disabled=false;

    }

}


async function loadMessages(){

    try{

        const response=
            await fetch(
                API_URL+
                "?channel="+
                encodeURIComponent(CHANNEL)
            );

        const data=
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error||
                "Failed to load messages."
            );

        }

        currentMessages=
            Array.isArray(data.messages)
            ?data.messages
            :[];

        renderMessages();

    }catch(error){

        messagesEl.innerHTML=`
            <div class="empty">
                <div>
                    <strong>Unable to load messages</strong>
                    ${escapeHtml(error.message)}
                </div>
            </div>
        `;

    }

}


function renderMessages(){

    const wasBottom=
        messagesEl.scrollHeight-
        messagesEl.scrollTop-
        messagesEl.clientHeight<100;

    if(!currentMessages.length){

        messagesEl.innerHTML=`
            <div class="empty">
                <div>
                    <strong>No messages yet</strong>
                    Be the first to send something.
                </div>
            </div>
        `;

        return;

    }

    const fragment=
        document.createDocumentFragment();

    currentMessages.forEach(message=>{

        const item=
            document.createElement("div");

        item.className="message";

        item.dataset.id=
            message.id;

        const avatar=
            document.createElement("div");

        avatar.className="avatar";

        avatar.textContent=
            (message.username||"?")
            .charAt(0)
            .toUpperCase();

        const content=
            document.createElement("div");

        content.className=
            "message-content";

        const top=
            document.createElement("div");

        top.className="message-top";

        const name=
            document.createElement("span");

        name.className="username";

        name.textContent=
            message.username||
            "User";

        top.appendChild(name);

        if(settings.showTimestamps){

            const time=
                document.createElement(
                    "span"
                );

            time.className="time";

            time.textContent=
                formatTime(
                    message.created_at
                );

            top.appendChild(time);

        }

        if(message.edited){

            const edited=
                document.createElement(
                    "span"
                );

            edited.className="edited";

            edited.textContent=
                "(edited)";

            top.appendChild(edited);

        }

        content.appendChild(top);

        if(message.message){

            const text=
                document.createElement(
                    "div"
                );

            text.className=
                "message-text";

            text.textContent=
                message.message;

            content.appendChild(text);

        }

        if(message.image){

            const img=
                document.createElement(
                    "img"
                );

            img.className=
                "message-image";

            img.src=
                message.image;

            img.alt="Image";

            img.onclick=()=>{
                openImage(
                    message.image
                );
            };

            content.appendChild(img);

        }

        item.appendChild(avatar);
        item.appendChild(content);

        if(
            message.device_id &&
            message.device_id===deviceId
        ){

            item.addEventListener(
                "contextmenu",
                event=>{

                    event.preventDefault();

                    showContextMenu(
                        event.clientX,
                        event.clientY,
                        message
                    );

                }
            );

        }

        fragment.appendChild(item);

    });

    messagesEl.replaceChildren(
        fragment
    );

    if(
        wasBottom &&
        settings.autoScroll
    ){

        messagesEl.scrollTop=
            messagesEl.scrollHeight;

    }

}

){

    const options={
        method,
        headers:{
            "Content-Type":
                "application/json"
        }
    };

    if(body!==null){

        options.body=
            JSON.stringify(body);

    }

    const response=
        await fetch(
            GAMES_API+
            query,
            options
        );

    const data=
        await response.json()
        .catch(()=>({}));

    if(!response.ok){

        throw new Error(
            data.error||
            "Game server error."
        );

    }

    return data;

}


/*
=========================================================
LOAD GAMES
=========================================================
*/

async function loadGames(){

    try{

        const data=
            await gameRequest(
                "GET",
                null,
                "?channel="+
                encodeURIComponent(CHANNEL)
            );

        games=
            Array.isArray(data.games)
            ?data.games
            :[];

        renderGames();

    }catch(error){

        gamesLobby.innerHTML=`
            <div class="empty-games">
                <strong>Game server unavailable</strong>
                <br><br>
                ${escapeHtml(error.message)}
            </div>
        `;

    }

}


/*
=========================================================
RENDER GAME LOBBY
=========================================================
*/

function renderGames(){

    if(activeGame){

        const found=
            games.find(
                game=>
                    String(game.id)===
                    String(activeGame.id)
            );

        if(found){

            activeGame=
                found;

            renderActiveGame();

        }else{

            activeGame=null;

            activeGamePanel.style.display=
                "none";

        }

    }

    const visibleGames=
        games.filter(
            game=>
                game.status!=="finished" &&
                game.status!=="stopped" &&
                (
                    Number(game.player_count||0)>0
                )
        );

    if(!visibleGames.length){

        gamesLobby.innerHTML=`
            <div class="empty-games">

                <div style="font-size:40px">
                    🎮
                </div>

                <h2>No active games</h2>

                <p>
                    Create a game and invite everyone to play.
                </p>

            </div>
        `;

        return;

    }

    gamesLobby.innerHTML=`

        <div class="game-grid">

            ${visibleGames.map(
                renderGameCard
            ).join("")}

        </div>

    `;

    document
        .querySelectorAll(
            "[data-join-game]"
        )
        .forEach(button=>{

            button.onclick=()=>{
                joinGame(
                    button.dataset.joinGame
                );
            };

        });

    document
        .querySelectorAll(
            "[data-spectate-game]"
        )
        .forEach(button=>{

            button.onclick=()=>{
                spectateGame(
                    button.dataset.spectateGame
                );
            };

        });

}


function renderGameCard(game){

    const def=
        gameDefinitions[
            game.game_type
        ]||
        gameDefinitions.tictactoe;

    const players=
        Array.isArray(game.players)
        ?game.players
        :[];

    const joined=
        players.some(
            p=>
                p.device_id===deviceId
        );

    const isHost=
        game.host_device_id===
        deviceId;

    const started=
        game.status==="playing";

    let button="";

    if(isHost){

        button=`
            <button
                class="success-btn"
                data-spectate-game="${escapeAttr(game.id)}"
            >
                ${started?"Open game":"Open lobby"}
            </button>
        `;

    }else if(joined){

        button=`
            <button
                class="success-btn"
                data-spectate-game="${escapeAttr(game.id)}"
            >
                ${started?"Play / spectate":"Joined ✓"}
            </button>
        `;

    }else if(!started){

        button=`
            <button
                class="primary-btn"
                data-join-game="${escapeAttr(game.id)}"
            >
                Join game
            </button>
        `;

    }else{

        button=`
            <button
                class="secondary-btn"
                data-spectate-game="${escapeAttr(game.id)}"
            >
                Spectate
            </button>
        `;

    }

    return `

        <div class="game-card">

            <div class="game-icon">
                ${def.icon}
            </div>

            <h3>
                ${escapeHtml(
                    game.name||
                    def.name
                )}
            </h3>

            <p>
                ${escapeHtml(
                    def.description
                )}
            </p>

            <div class="game-meta">

                👑 Host:
                ${escapeHtml(
                    game.host_username||
                    "Unknown"
                )}

                <br>

                👥
                ${players.length}
                /
                ${Number(game.max_players||2)}
                players

                <br>

                ${
                    started
                    ?"🟢 In progress"
                    :"🟡 Waiting for players"
                }

            </div>

            ${button}

        </div>
    `;

}

};


closeCreateGame.onclick=()=>{

};

cancelCreateGame.onclick=()=>{

    );
};


gameTypeSelect.onchange=()=>{

    const def=
        gameDefinitions[
            gameTypeSelect.value
        ];

    const max=
        Number(
            maxPlayersSelect.value
        );

    if(
        def &&
        def.maxPlayers<
        max
    ){

        maxPlayersSelect.value=
            String(
                def.maxPlayers
            );

    }

};


confirmCreateGame.onclick=
async()=>{

    if(!settings.username){

        alert(
            "Set your name first."
        );

        return;

    }

    confirmCreateGame.disabled=
        true;

    try{

        const data=
            await gameRequest(
                "POST",
                {

                    action:"create",

                    channel:
                        CHANNEL,

                    game_type:
                        gameTypeSelect.value,

                    name:
                        gameNameInput.value
                        .trim()
                        .substring(0,35),

        return;

    activeGame=
        game;

    renderActiveGame();

    activeGamePanel.scrollIntoView({
        behavior:"smooth",
        block:"start"
    });

/*
=========================================================
ACTIVE GAME
=========================================================
*/

function renderActiveGame(){

    if(!activeGame){

        activeGamePanel.style.display=
            "none";

        return;

    }

    const def=
        gameDefinitions[
            activeGame.game_type
        ]||
        gameDefinitions.tictactoe;

    const players=
        Array.isArray(activeGame.players)
        ?activeGame.players
        :[];

    const myPlayer=
        players.find(
            p=>
                p.device_id===
                deviceId
        );

    const isHost=
        activeGame.host_device_id===
        deviceId;

    const isJoined=
        !!myPlayer;

    const started=
        activeGame.status==="playing";

    let turnPlayer=null;

    if(
        activeGame.turn_device_id
    ){

        turnPlayer=
            players.find(
                p=>
                    p.device_id===
                    activeGame.turn_device_id
            );

    }

    const turnText=
        turnPlayer
        ?(
            turnPlayer.device_id===
            deviceId
            ?"🎯 Your turn!"
            :"⏳ "+escapeHtml(
                turnPlayer.username
            )+"'s turn"
        )
        :"Waiting for game to start";

    let controls="";

    if(!started){

        if(isHost){

            controls=`

                <button
                    class="success-btn"
                    id="startGameButton"
                    ${players.length<1?"disabled":""}
                >
                    ▶ Start game
                </button>

                <button
                    class="danger-btn"
                    id="forceQuitGameButton"
                >
                    Force quit
                </button>

            `;

        }else if(isJoined){

            controls=`

                <button
                    class="danger-btn"
                    id="leaveGameButton"
                >
                    Leave game
                </button>

            `;

        }

    }else{

        if(isHost){

            controls=`

                <button
                    class="danger-btn"
                    id="forceQuitGameButton"
                >
                    Force quit
                </button>

            `;

        }else if(isJoined){

            controls=`

                <button
                    class="danger-btn"
                    id="leaveGameButton"
                >
                    Leave
                </button>

            `;

        }

    }

    activeGamePanel.innerHTML=`

        <div class="game-topbar">

            <div class="game-title">

                <div style="font-size:35px">
                    ${def.icon}
                </div>

                <div>

                    <h2>
                        ${escapeHtml(
                            activeGame.name||
                            def.name
                        )}
                    </h2>

                    <div class="game-status">

                        ${started
                            ?"Game in progress"
                            :"Lobby — waiting for host"
                        }

                    </div>

                </div>

            </div>

            <div class="game-actions">

                ${controls}

            </div>

        </div>


        <div class="players-list">

            ${players.map(
                player=>`

                    <div
                        class="
                            player-chip
                            ${player.device_id===
                              activeGame.host_device_id
                              ?"host":""}
                            ${player.device_id===
                              activeGame.turn_device_id
                              ?"turn":""}
                        "
                    >

                        ${
                            player.device_id===
                            activeGame.host_device_id
                            ?"👑 "
                            :""
                        }

                        ${escapeHtml(
                            player.username
                        )}

                        ${
                            player.device_id===
                            deviceId
                            ?" (You)"
                            :""
                        }

                    </div>

                `
            ).join("")}

        </div>


        <div class="turn-banner">

            ${turnText}

        </div>


        <div
            class="board"
            id="gameBoard"
        ></div>

    `;

    renderGameBoard(
        activeGame,
        myPlayer
    );

    const startBtn=
        document.getElementById(
            "startGameButton"
        );

    if(startBtn){

        startBtn.onclick=
            startGame;

    }

    const leaveBtn=
        document.getElementById(
            "leaveGameButton"
        );

    if(leaveBtn){

        leaveBtn.onclick=
            leaveGame;

    }

    const forceBtn=
        document.getElementById(
            "forceQuitGameButton"
        );

    if(forceBtn){

        forceBtn.onclick=
            forceQuitGame;

    }

}


/*
=========================================================
START / LEAVE / FORCE QUIT
=========================================================
*/

async function startGame(){

    if(!activeGame)
        return;

    try{

        const data=
            await gameRequest(
                "PATCH",
                {

                    action:"start",

                    game_id:
                        activeGame.id,

                    device_id:
                        deviceId

                }
            );

        if(data.game)
            activeGame=
                data.game;

        await loadGames();

    }catch(error){

        alert(
            "Could not start game:\n\n"+
            error.message
        );

    }

}


async function leaveGame(){

    if(!activeGame)
        return;

    try{

        await gameRequest(
            "PATCH",
            {

                action:"leave",

                game_id:
                    activeGame.id,

                device_id:
                    deviceId

            }
        );

        activeGame=null;

        activeGamePanel.style.display=
            "none";

        await loadGames();

    }catch(error){

        alert(
            "Could not leave game:\n\n"+
            error.message
        );

    }

}


async function forceQuitGame(){

    if(!activeGame)
        return;

    const yes=
        confirm(
            "Force quit this game?\n\nEveryone will be removed from the game."
        );

    if(!yes)
        return;

    try{

        await gameRequest(
            "DELETE",
            {

                game_id:
                    activeGame.id,

                device_id:
                    deviceId

            }
        );

        activeGame=null;

        activeGamePanel.style.display=
            "none";

        await loadGames();

    }catch(error){

        alert(
            "Could not force quit game:\n\n"+
            error.message
        );

    }

}


/*
=========================================================
GAME BOARD
=========================================================
*/

function renderGameBoard(
    game,
    myPlayer
){

    const board=
        document.getElementById(
            "gameBoard"
        );

    if(!board)
        return;

    if(game.status!=="playing"){

        board.innerHTML=`

            <div class="lobby-note">

                ${
                    game.host_device_id===
                    deviceId

                    ?`
                        <strong>
                            You are the host.
                        </strong>
                        <br>
                        Everyone who wants to play
                        needs to join before you start.
                    `

                    :`
                        ${
                            myPlayer
                            ?"You joined this game. Waiting for the host to start."
                            :"You are spectating. Join before the host starts to play."
                        }
                    `
                }

            </div>
        `;

        return;

    }

    switch(game.game_type){

        case "tictactoe":
            renderTicTacToe(
                board,
                game,
                myPlayer
            );
            break;

        case "connect4":
            renderConnectFour(
                board,
                game,
                myPlayer
            );
            break;

        case "dice":
            renderDice(
                board,
                game,
                myPlayer
            );
            break;

        case "higherlower":
            renderHigherLower(
                board,
                game,
                myPlayer
            );
            break;

        case "rps":
            renderRPS(
                board,
                game,
                myPlayer
            );
            break;

        default:

            board.innerHTML=
                "<div class='empty-games'>Unknown game.</div>";

    }

}


/*
=========================================================
TIC TAC TOE
=========================================================
*/

function renderTicTacToe(
    board,
    game,
    myPlayer
){

    const state=
        game.state||{};

    const cells=
        Array.isArray(state.board)
        ?state.board
        :Array(9).fill("");

    const playable=
        !!myPlayer &&
        game.turn_device_id===
        deviceId &&
        game.status==="playing";

    board.innerHTML=`

        <div class="ttt-grid">

            ${cells.map(
                (cell,index)=>`

                    <button
                        class="ttt-cell"
                        data-ttt="${index}"
                        ${cell||!playable?"disabled":""}
                    >
                        ${cell||""}
                    </button>

                `
            ).join("")}

        </div>

    `;

    board
        .querySelectorAll(
            "[data-ttt]"
        )
        .forEach(button=>{

            button.onclick=()=>{

                playGameAction({
                    action:"move",
                    position:
                        Number(
                            button.dataset.ttt
                        )
                });

            };

        });

}


/*
=========================================================
CONNECT FOUR
=========================================================
*/

function renderConnectFour(
    board,
    game,
    myPlayer
){

    const state=
        game.state||{};

    const cells=
        Array.isArray(state.board)
        ?state.board
        :Array(42).fill("");

    const playable=
        !!myPlayer &&
        game.turn_device_id===
        deviceId;

    board.innerHTML=`

        <div class="connect-columns">

            ${Array.from(
                {length:7},
                (_,i)=>`

                    <button
                        class="connect-column"
                        data-connect-column="${i}"
                        ${!playable?"disabled":""}
                    >
                        ↓
                    </button>

                `
            ).join("")}

        </div>

        <div class="connect-grid">

            ${cells.map(
                cell=>`

                    <div
                        class="
                            connect-cell
                            ${
                                cell==="R"
                                ?"red"
                                :cell==="Y"
                                ?"yellow"
                                :""
                            }
                        "
                    ></div>

                `
            ).join("")}

        </div>

    `;

    board
        .querySelectorAll(
            "[data-connect-column]"
        )
        .forEach(button=>{

            button.onclick=()=>{

                playGameAction({

                    action:"move",

                    column:
                        Number(
                            button.dataset
                                .connectColumn
                        )

                });

            };

        });

}

async function playGameAction(
    action
){

    if(!activeGame)
        return;

    try{

        const data=
            await gameRequest(
                "PATCH",
                {

                    ...action,

                    game_id:
                        activeGame.id,

                    device_id:
                        deviceId,

                    username:
                        settings.username

                }
            );

        if(data.game){

            activeGame=
                data.game;

        }

        await loadGames();

    }catch(error){

        alert(
            "Game action failed:\n\n"+
            error.message
        );

    }

}


/*
=========================================================
GAME REFRESH
=========================================================
*/

async function refreshGamesSilently(){

    if(
        !document
            .getElementById("gamesView")
            .classList
            .contains("active")
    ){

        return;

    }

    try{

        const data=
            await gameRequest(
                "GET",
                null,
                "?channel="+
                encodeURIComponent(CHANNEL)
            );

        games=
            Array.isArray(data.games)
            ?data.games
            :[];

        if(activeGame){

            const found=
                games.find(
                    game=>
                        String(game.id)===
                        String(activeGame.id)
                );

            if(found){

                activeGame=
                    found;

            }else{

                activeGame=null;

                activeGamePanel.style.display=
                    "none";

            }

        }

        renderGames();

    }catch(error){

        /*
        Silent refresh errors are ignored so
        the game UI does not constantly popup errors.
        */

    }

}


function startGamesRefresh(){

    if(gamesRefreshTimer)
        clearInterval(
            gamesRefreshTimer
        );

    /*
    Games deliberately refresh every 0.5 seconds,
    independently of the normal chat refresh setting.
    */

    gamesRefreshTimer=
        setInterval(
            refreshGamesSilently,
            500
        );

}


/*
=========================================================
HELPERS
=========================================================
*/

function formatTime(date){

    if(!date)
        return "";

    return new Date(date)
        .toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

}


function escapeHtml(value){

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


function escapeAttr(value){

    return escapeHtml(value);

}
