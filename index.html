<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>General Chat</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#101114;
    color:#eee;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    background:var(--bg);
}

:root{
    --bg:#101114;
    --panel:#17191e;
    --panel2:#1d2026;
    --input:#23262d;
    --border:#30343d;
    --text:#f1f1f1;
    --muted:#969ba6;
    --accent:#6d8cff;
    --hover:#292d35;
    --danger:#d95353;
}

body.theme-blue{
    --bg:#0e1118;
    --panel:#151a25;
    --panel2:#1c2330;
    --input:#242c3b;
    --border:#303b50;
    --accent:#658cff;
}

body.theme-purple{
    --bg:#110e16;
    --panel:#19141f;
    --panel2:#231b2c;
    --input:#2a2134;
    --border:#3a2d48;
    --accent:#a66cff;
}

body.theme-red{
    --bg:#140d0e;
    --panel:#1d1315;
    --panel2:#28191b;
    --input:#302022;
    --border:#473033;
    --accent:#e65c62;
}

body.theme-green{
    --bg:#0d1410;
    --panel:#141d17;
    --panel2:#1c2820;
    --input:#253229;
    --border:#304239;
    --accent:#59b878;
}

body.theme-orange{
    --bg:#15100c;
    --panel:#1e1711;
    --panel2:#292016;
    --input:#30261c;
    --border:#493b2d;
    --accent:#e79650;
}

body.theme-cyan{
    --bg:#0a1315;
    --panel:#101d20;
    --panel2:#17272b;
    --input:#203338;
    --border:#2e454b;
    --accent:#4ec6d3;
}

body.theme-pink{
    --bg:#150d12;
    --panel:#1f131b;
    --panel2:#2a1a25;
    --input:#33202c;
    --border:#49303e;
    --accent:#e66ca8;
}

body.theme-gray{
    --bg:#111;
    --panel:#181818;
    --panel2:#222;
    --input:#292929;
    --border:#373737;
    --accent:#aaa;
}

body.theme-light{
    --bg:#e7e7e7;
    --panel:#f4f4f4;
    --panel2:#fff;
    --input:#e1e1e1;
    --border:#c9c9c9;
    --text:#171717;
    --muted:#666;
    --accent:#536dfe;
    --hover:#d7d7d7;
}

body.theme-midnight{
    --bg:#05070c;
    --panel:#090d16;
    --panel2:#101722;
    --input:#151d2a;
    --border:#222d3e;
    --accent:#7898ff;
}

.topbar{
    height:64px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:38px;
    height:38px;
    border-radius:10px;
    background:var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-weight:bold;
    font-size:17px;
}

.title{
    font-size:17px;
    font-weight:700;
}

.subtitle{
    color:var(--muted);
    font-size:12px;
    margin-top:2px;
}

.topButtons{
    display:flex;
    gap:8px;
}

.iconButton{
    width:40px;
    height:40px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    border-radius:9px;
}

.iconButton:hover{
    background:var(--hover);
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:18px;
}

.message{
    width:100%;
    display:flex;
    gap:11px;
    margin-bottom:18px;
}

.avatar{
    width:38px;
    height:38px;
    flex-shrink:0;
    border-radius:50%;
    background:var(--accent);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.messageMain{
    min-width:0;
    max-width:850px;
}

.messageHeader{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:4px;
}

.username{
    font-weight:700;
}

.time{
    color:var(--muted);
    font-size:11px;
}

.edited{
    color:var(--muted);
    font-size:11px;
}

.messageText{
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    line-height:1.45;
    font-size:14px;
}

.messageImage{
    display:block;
    max-width:min(500px,100%);
    max-height:500px;
    margin-top:8px;
    border-radius:9px;
    cursor:pointer;
    object-fit:contain;
    border:1px solid var(--border);
}

.messageImage:hover{
    filter:brightness(.9);
}

.composer{
    flex-shrink:0;
    padding:12px 18px;
    border-top:1px solid var(--border);
    background:var(--panel);
}

.imagePreview{
    display:none;
    margin-bottom:8px;
    padding:8px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:9px;
}

.imagePreview.show{
    display:flex;
    align-items:center;
    gap:10px;
}

.imagePreview img{
    width:65px;
    height:65px;
    object-fit:cover;
    border-radius:7px;
}

.previewInfo{
    flex:1;
    min-width:0;
}

.previewName{
    font-size:13px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.previewRemove{
    border:0;
    background:transparent;
    color:var(--muted);
    font-size:20px;
}

.inputRow{
    display:flex;
    gap:8px;
}

.messageInput{
    flex:1;
    min-width:0;
    height:46px;
    border:1px solid var(--border);
    border-radius:10px;
    outline:none;
    background:var(--input);
    color:var(--text);
    padding:0 14px;
}

.messageInput:focus{
    border-color:var(--accent);
}

.attachButton,
.sendButton{
    height:46px;
    border-radius:10px;
    border:1px solid var(--border);
    padding:0 15px;
}

.attachButton{
    background:var(--panel2);
    color:var(--text);
}

.sendButton{
    background:var(--accent);
    color:white;
    border-color:var(--accent);
    font-weight:700;
}

.attachButton:hover{
    background:var(--hover);
}

.sendButton:hover{
    filter:brightness(1.08);
}

.hidden{
    display:none!important;
}

/* Context menu */

.contextMenu{
    position:fixed;
    z-index:1000;
    display:none;
    min-width:150px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:9px;
    padding:5px;
    box-shadow:0 12px 35px #0008;
}

.contextMenu button{
    width:100%;
    padding:9px 11px;
    text-align:left;
    background:transparent;
    border:0;
    color:var(--text);
    border-radius:6px;
}

.contextMenu button:hover{
    background:var(--hover);
}

.contextMenu .danger{
    color:#ff6868;
}

/* Settings */

.overlay{
    position:fixed;
    inset:0;
    z-index:900;
    background:#0009;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.overlay.show{
    display:flex;
}

.settings{
    width:min(480px,100%);
    max-height:90vh;
    overflow-y:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
    padding:20px;
    box-shadow:0 20px 70px #0009;
}

.settingsHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.settingsHeader h2{
    margin:0;
}

.closeButton{
    width:35px;
    height:35px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
}

.setting{
    margin-bottom:20px;
}

.settingTitle{
    font-weight:700;
    margin-bottom:8px;
}

.themeGrid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
}

.themeButton{
    height:40px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    border-radius:8px;
}

.themeButton:hover{
    border-color:var(--accent);
}

.deleteEverything{
    width:100%;
    min-height:45px;
    border:1px solid #a83f3f;
    border-radius:9px;
    background:#471d1d;
    color:#ff8585;
    font-weight:700;
}

.deviceInfo{
    font-size:11px;
    color:var(--muted);
    word-break:break-all;
    padding:9px;
    background:var(--panel2);
    border-radius:8px;
}

/* Fullscreen image */

.imageViewer{
    position:fixed;
    inset:0;
    z-index:2000;
    display:none;
    background:#000;
}

.imageViewer.show{
    display:block;
}

.fullImage{
    width:100%;
    height:100%;
    object-fit:contain;
}

.backImage{
    position:absolute;
    top:18px;
    left:18px;
    z-index:2;
    border:1px solid #ffffff33;
    background:#111b;
    color:white;
    padding:10px 16px;
    border-radius:9px;
    font-weight:700;
}

/* Dialog */

.dialog{
    width:min(450px,100%);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
}

.dialog h3{
    margin:0 0 10px;
}

.dialog p{
    color:var(--muted);
    line-height:1.5;
}

.dialogButtons{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:18px;
}

.dialogButtons button{
    padding:10px 15px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
}

.dialogButtons .dangerButton{
    background:#a73535;
    border-color:#a73535;
    color:white;
}

@media(max-width:600px){

    .topbar{
        padding:0 10px;
    }

    .messages{
        padding:12px;
    }

    .composer{
        padding:10px;
    }

    .attachButton{
        width:46px;
        padding:0;
        font-size:0;
    }

    .attachButton::after{
        content:"📎";
        font-size:18px;
    }

    .sendButton{
        width:60px;
        padding:0;
    }

    .messageImage{
        max-width:100%;
    }

}
</style>
</head>

<body>

<div class="app">

    <header class="topbar">

        <div class="brand">

            <div class="logo">G</div>

            <div>
                <div class="title">General</div>
                <div class="subtitle">Community chat</div>
            </div>

        </div>

        <div class="topButtons">

            <button
                class="iconButton"
                id="settingsButton"
                title="Settings"
            >⚙</button>

        </div>

    </header>


    <main
        class="messages"
        id="messages"
    ></main>


    <div class="composer">

        <div
            class="imagePreview"
            id="imagePreview"
        >

            <img
                id="previewImage"
                alt=""
            >

            <div class="previewInfo">

                <div
                    class="previewName"
                    id="previewName"
                ></div>

            </div>

            <button
                class="previewRemove"
                id="removePreview"
            >×</button>

        </div>


        <div class="inputRow">

            <input
                type="file"
                id="imageInput"
                class="hidden"
                accept="image/*"
            >

            <button
                class="attachButton"
                id="attachButton"
                title="Choose image"
            >Image</button>

            <input
                class="messageInput"
                id="messageInput"
                maxlength="2000"
                autocomplete="off"
                placeholder="Message #general"
            >

            <button
                class="sendButton"
                id="sendButton"
            >Send</button>

        </div>

    </div>

</div>


<!-- Context menu -->

<div
    class="contextMenu"
    id="contextMenu"
>

    <button id="editMessageButton">
        Edit
    </button>

    <button
        id="deleteMessageButton"
        class="danger"
    >
        Delete
    </button>

</div>


<!-- Settings -->

<div
    class="overlay"
    id="settingsOverlay"
>

    <div class="settings">

        <div class="settingsHeader">

            <h2>Settings</h2>

            <button
                class="closeButton"
                id="closeSettings"
            >×</button>

        </div>


        <div class="setting">

            <div class="settingTitle">
                Theme
            </div>

            <div class="themeGrid">

                <button class="themeButton" data-theme="dark">
                    Dark
                </button>

                <button class="themeButton" data-theme="blue">
                    Blue
                </button>

                <button class="themeButton" data-theme="purple">
                    Purple
                </button>

                <button class="themeButton" data-theme="red">
                    Red
                </button>

                <button class="themeButton" data-theme="green">
                    Green
                </button>

                <button class="themeButton" data-theme="orange">
                    Orange
                </button>

                <button class="themeButton" data-theme="cyan">
                    Cyan
                </button>

                <button class="themeButton" data-theme="pink">
                    Pink
                </button>

                <button class="themeButton" data-theme="gray">
                    Gray
                </button>

                <button class="themeButton" data-theme="light">
                    Light
                </button>

                <button class="themeButton" data-theme="midnight">
                    Midnight
                </button>

            </div>

        </div>


        <div class="setting">

            <div class="settingTitle">
                Your device
            </div>

            <div
                class="deviceInfo"
                id="deviceInfo"
            ></div>

        </div>


        <div class="setting">

            <div class="settingTitle">
                Danger zone
            </div>

            <button
                class="deleteEverything"
                id="deleteEverything"
            >
                Remove my messages
            </button>

        </div>

    </div>

</div>


<!-- Confirmation dialog -->

<div
    class="overlay"
    id="confirmOverlay"
>

    <div class="dialog">

        <h3 id="confirmTitle">
            Are you sure?
        </h3>

        <p id="confirmText"></p>

        <div class="dialogButtons">

            <button id="confirmNo">
                Cancel
            </button>

            <button
                class="dangerButton"
                id="confirmYes"
            >
                Yes
            </button>

        </div>

    </div>

</div>


<!-- Fullscreen image -->

<div
    class="imageViewer"
    id="imageViewer"
>

    <button
        class="backImage"
        id="backImage"
    >
        ← Back
    </button>

    <img
        class="fullImage"
        id="fullImage"
        alt=""
    >

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API_URL =
    "/api/messages";

const CHANNEL =
    "general";


/* =========================================================
   DEVICE ID
========================================================= */

let deviceId =
    localStorage.getItem(
        "chat_device_id"
    );

if (!deviceId) {

    if (
        window.crypto &&
        crypto.randomUUID
    ) {

        deviceId =
            crypto.randomUUID();

    } else {

        deviceId =
            Date.now().toString(36) +
            Math.random()
                .toString(36)
                .substring(2);

    }

    localStorage.setItem(
        "chat_device_id",
        deviceId
    );

}


/* =========================================================
   USERNAME
========================================================= */

let username =
    localStorage.getItem(
        "chat_username"
    );

if (!username) {

    username =
        prompt(
            "Choose a username:"
        ) ||
        "User";

    username =
        username
            .trim()
            .substring(0,24) ||
        "User";

    localStorage.setItem(
        "chat_username",
        username
    );

}


/* =========================================================
   ELEMENTS
========================================================= */

const messagesEl =
    document.getElementById(
        "messages"
    );

const messageInput =
    document.getElementById(
        "messageInput"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const imageInput =
    document.getElementById(
        "imageInput"
    );

const attachButton =
    document.getElementById(
        "attachButton"
    );

const imagePreview =
    document.getElementById(
        "imagePreview"
    );

const previewImage =
    document.getElementById(
        "previewImage"
    );

const previewName =
    document.getElementById(
        "previewName"
    );

const removePreview =
    document.getElementById(
        "removePreview"
    );

const contextMenu =
    document.getElementById(
        "contextMenu"
    );

const editMessageButton =
    document.getElementById(
        "editMessageButton"
    );

const deleteMessageButton =
    document.getElementById(
        "deleteMessageButton"
    );

const settingsOverlay =
    document.getElementById(
        "settingsOverlay"
    );

const settingsButton =
    document.getElementById(
        "settingsButton"
    );

const closeSettings =
    document.getElementById(
        "closeSettings"
    );

const deviceInfo =
    document.getElementById(
        "deviceInfo"
    );

const deleteEverything =
    document.getElementById(
        "deleteEverything"
    );

const confirmOverlay =
    document.getElementById(
        "confirmOverlay"
    );

const confirmTitle =
    document.getElementById(
        "confirmTitle"
    );

const confirmText =
    document.getElementById(
        "confirmText"
    );

const confirmNo =
    document.getElementById(
        "confirmNo"
    );

const confirmYes =
    document.getElementById(
        "confirmYes"
    );

const imageViewer =
    document.getElementById(
        "imageViewer"
    );

const fullImage =
    document.getElementById(
        "fullImage"
    );

const backImage =
    document.getElementById(
        "backImage"
    );


/* =========================================================
   STATE
========================================================= */

let selectedImage =
    null;

let selectedImageName =
    "";

let selectedMessage =
    null;

let currentMessages =
    [];


/* =========================================================
   DEVICE DISPLAY
========================================================= */

deviceInfo.textContent =
    deviceId;


/* =========================================================
   THEME
========================================================= */

const savedTheme =
    localStorage.getItem(
        "chat_theme"
    ) || "dark";

applyTheme(
    savedTheme
);

document
    .querySelectorAll(
        ".themeButton"
    )
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                const theme =
                    button.dataset.theme;

                applyTheme(
                    theme
                );

                localStorage.setItem(
                    "chat_theme",
                    theme
                );

            }
        );

    });


function applyTheme(theme) {

    document.body.className =
        theme === "dark"
            ? ""
            : "theme-" + theme;

}


/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages() {

    try {

        const response =
            await fetch(
                API_URL +
                "?channel=" +
                encodeURIComponent(
                    CHANNEL
                ),
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Failed to load messages."
            );

        }


        currentMessages =
            Array.isArray(
                data.messages
            )
                ? data.messages
                : [];


        renderMessages();

    } catch(error) {

        console.error(
            error
        );

        messagesEl.innerHTML = "";

        const errorBox =
            document.createElement(
                "div"
            );

        errorBox.style.color =
            "#ff6868";

        errorBox.style.padding =
            "20px";

        errorBox.textContent =
            "Failed to load messages: " +
            error.message;

        messagesEl.appendChild(
            errorBox
        );

    }

}


/* =========================================================
   RENDER
========================================================= */

function renderMessages() {

    const wasNearBottom =
        messagesEl.scrollHeight -
        messagesEl.scrollTop -
        messagesEl.clientHeight <
        100;


    messagesEl.innerHTML =
        "";


    for (
        const message of currentMessages
    ) {

        const element =
            createMessageElement(
                message
            );

        messagesEl.appendChild(
            element
        );

    }


    if (
        wasNearBottom ||
        currentMessages.length === 1
    ) {

        messagesEl.scrollTop =
            messagesEl.scrollHeight;

    }

}


/* =========================================================
   CREATE MESSAGE
========================================================= */

function createMessageElement(
    message
) {

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message";


    const avatar =
        document.createElement(
            "div"
        );

    avatar.className =
        "avatar";

    avatar.textContent =
        (
            message.username ||
            "?"
        )
        .charAt(0)
        .toUpperCase();


    const main =
        document.createElement(
            "div"
        );

    main.className =
        "messageMain";


    const header =
        document.createElement(
            "div"
        );

    header.className =
        "messageHeader";


    const name =
        document.createElement(
            "span"
        );

    name.className =
        "username";

    name.textContent =
        message.username ||
        "User";


    const time =
        document.createElement(
            "span"
        );

    time.className =
        "time";

    time.textContent =
        formatTime(
            message.created_at
        );


    header.appendChild(
        name
    );

    header.appendChild(
        time
    );


    if (
        message.edited
    ) {

        const edited =
            document.createElement(
                "span"
            );

        edited.className =
            "edited";

        edited.textContent =
            "(edited)";

        header.appendChild(
            edited
        );

    }


    const text =
        document.createElement(
            "div"
        );

    text.className =
        "messageText";

    text.textContent =
        message.message ||
        "";


    main.appendChild(
        header
    );


    if (
        message.message
    ) {

        main.appendChild(
            text
        );

    }


    if (
        message.image
    ) {

        const img =
            document.createElement(
                "img"
            );

        img.className =
            "messageImage";

        img.src =
            message.image;

        img.alt =
            "Sent image";

        img.addEventListener(
            "click",
            () => {

                openFullscreenImage(
                    message.image
                );

            }
        );

        main.appendChild(
            img
        );

    }


    wrapper.appendChild(
        avatar
    );

    wrapper.appendChild(
        main
    );


    /* Right click only on own message */

    if (
        message.device_id ===
        deviceId
    ) {

        wrapper.addEventListener(
            "contextmenu",
            event => {

                event.preventDefault();

                selectedMessage =
                    message;

                showContextMenu(
                    event.clientX,
                    event.clientY
                );

            }
        );

    }


    return wrapper;

}


/* =========================================================
   TIME
========================================================= */

function formatTime(
    value
) {

    if (!value) {
        return "";
    }

    const date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";

    }

    return date.toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================================================
   SEND
========================================================= */

async function sendMessage() {

    const message =
        messageInput.value
            .trim();


    if (
        !message &&
        !selectedImage
    ) {

        return;

    }


    sendButton.disabled =
        true;


    try {

        const response =
            await fetch(
                API_URL,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            username:
                                username,

                            channel:
                                CHANNEL,

                            message:
                                message,

                            image:
                                selectedImage,

                            device_id:
                                deviceId

                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                formatServerError(
                    data
                )
            );

        }


        messageInput.value =
            "";

        clearImage();


        if (
            data.message
        ) {

            currentMessages.push(
                data.message
            );

            renderMessages();

        } else {

            await loadMessages();

        }


    } catch(error) {

        alert(
            error.message
        );

    } finally {

        sendButton.disabled =
            false;

        messageInput.focus();

    }

}


/* =========================================================
   IMAGE SELECT
========================================================= */

attachButton.addEventListener(
    "click",
    () => {

        imageInput.click();

    }
);


imageInput.addEventListener(
    "change",
    async () => {

        const file =
            imageInput.files[0];

        if (!file) {
            return;
        }


        try {

            const result =
                await resizeImage(
                    file,
                    1500,
                    1500,
                    0.82
                );


            selectedImage =
                result;

            selectedImageName =
                file.name;


            previewImage.src =
                result;

            previewName.textContent =
                file.name;

            imagePreview.classList.add(
                "show"
            );


        } catch(error) {

            alert(
                "Could not process image: " +
                error.message
            );

            clearImage();

        }

    }
);


/* =========================================================
   IMAGE RESIZE
========================================================= */

function resizeImage(
    file,
    maxWidth,
    maxHeight,
    quality
) {

    return new Promise(
        (resolve,reject) => {

            const reader =
                new FileReader();


            reader.onload =
                event => {

                    const img =
                        new Image();


                    img.onload =
                        () => {

                            let width =
                                img.naturalWidth;

                            let height =
                                img.naturalHeight;


                            const scale =
                                Math.min(
                                    1,
                                    maxWidth /
                                        width,
                                    maxHeight /
                                        height
                                );


                            width =
                                Math.round(
                                    width *
                                    scale
                                );

                            height =
                                Math.round(
                                    height *
                                    scale
                                );


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );


                            resolve(
                                canvas.toDataURL(
                                    "image/jpeg",
                                    quality
                                )
                            );

                        };


                    img.onerror =
                        () =>
                            reject(
                                new Error(
                                    "Invalid image."
                                )
                            );


                    img.src =
                        event.target.result;

                };


            reader.onerror =
                () =>
                    reject(
                        new Error(
                            "Could not read image."
                        )
                    );


            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =========================================================
   CLEAR IMAGE
========================================================= */

function clearImage() {

    selectedImage =
        null;

    selectedImageName =
        "";

    imageInput.value =
        "";

    previewImage.src =
        "";

    previewName.textContent =
        "";

    imagePreview.classList.remove(
        "show"
    );

}


removePreview.addEventListener(
    "click",
    clearImage
);


/* =========================================================
   CONTEXT MENU
========================================================= */

function showContextMenu(
    x,
    y
) {

    contextMenu.style.display =
        "block";

    const width =
        contextMenu.offsetWidth;

    const height =
        contextMenu.offsetHeight;


    contextMenu.style.left =
        Math.min(
            x,
            window.innerWidth -
                width -
                8
        ) + "px";


    contextMenu.style.top =
        Math.min(
            y,
            window.innerHeight -
                height -
                8
        ) + "px";

}


function hideContextMenu() {

    contextMenu.style.display =
        "none";

}


document.addEventListener(
    "click",
    event => {

        if (
            !contextMenu.contains(
                event.target
            )
        ) {

            hideContextMenu();

        }

    }
);


/* =========================================================
   EDIT
========================================================= */

editMessageButton.addEventListener(
    "click",
    async () => {

        hideContextMenu();


        if (!selectedMessage) {
            return;
        }


        if (
            selectedMessage.device_id !==
            deviceId
        ) {

            alert(
                "You can only edit your own messages."
            );

            return;

        }


        const newMessage =
            prompt(
                "Edit message:",
                selectedMessage.message ||
                ""
            );


        if (
            newMessage === null
        ) {

            return;

        }


        const clean =
            newMessage.trim();


        if (!clean) {

            alert(
                "Message cannot be empty."
            );

            return;

        }


        try {

            const response =
                await fetch(
                    API_URL,
                    {

                        method:"PATCH",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                id:
                                    selectedMessage.id,

                                username:
                                    username,

                                message:
                                    clean,

                                device_id:
                                    deviceId

                            })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    formatServerError(
                        data
                    )
                );

            }


            await loadMessages();


        } catch(error) {

            alert(
                error.message
            );

        }

    }
);


/* =========================================================
   DELETE ONE
========================================================= */

deleteMessageButton.addEventListener(
    "click",
    async () => {

        hideContextMenu();


        if (!selectedMessage) {
            return;
        }


        if (
            selectedMessage.device_id !==
            deviceId
        ) {

            alert(
                "You can only delete your own messages."
            );

            return;

        }


        const sure =
            confirm(
                "Delete this message forever?"
            );


        if (!sure) {
            return;
        }


        try {

            const response =
                await fetch(
                    API_URL,
                    {

                        method:"DELETE",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                id:
                                    selectedMessage.id,

                                device_id:
                                    deviceId

                            })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    formatServerError(
                        data
                    )
                );

            }


            await loadMessages();


        } catch(error) {

            alert(
                error.message
            );

        }

    }
);


/* =========================================================
   SETTINGS
========================================================= */

settingsButton.addEventListener(
    "click",
    () => {

        settingsOverlay.classList.add(
            "show"
        );

    }
);


closeSettings.addEventListener(
    "click",
    () => {

        settingsOverlay.classList.remove(
            "show"
        );

    }
);


settingsOverlay.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            settingsOverlay
        ) {

            settingsOverlay.classList.remove(
                "show"
            );

        }

    }
);


/* =========================================================
   REMOVE MY MESSAGES
========================================================= */

deleteEverything.addEventListener(
    "click",
    () => {

        settingsOverlay.classList.remove(
            "show"
        );


        showDeleteConfirmation();

    }
);


function showDeleteConfirmation() {

    confirmTitle.textContent =
        "Remove your messages?";

    confirmText.textContent =
        "This will permanently remove every message and image created by this device. Other users' messages will not be removed.";

    confirmOverlay.classList.add(
        "show"
    );


    confirmYes.onclick =
        () => {

            confirmOverlay.classList.remove(
                "show"
            );

            showSecondConfirmation();

        };

}


function showSecondConfirmation() {

    confirmTitle.textContent =
        "Are you absolutely sure?";

    confirmText.textContent =
        "Your messages and images from this device will be permanently removed from the database. This cannot be undone.";

    confirmOverlay.classList.add(
        "show"
    );


    confirmYes.onclick =
        () => {

            confirmOverlay.classList.remove(
                "show"
            );

            showFinalConfirmation();

        };

}


function showFinalConfirmation() {

    confirmTitle.textContent =
        "Last time — ultra sure?";

    confirmText.textContent =
        "Every message and image belonging to this device will be removed. After deletion, there will be no record of those messages in the chat.";

    confirmOverlay.classList.add(
        "show"
    );


    confirmYes.onclick =
        async () => {

            confirmOverlay.classList.remove(
                "show"
            );

            await removeAllMyMessages();

        };

}


confirmNo.addEventListener(
    "click",
    () => {

        confirmOverlay.classList.remove(
            "show"
        );

    }
);


/* =========================================================
   DELETE ALL MY MESSAGES
========================================================= */

async function removeAllMyMessages() {

    try {

        const response =
            await fetch(
                API_URL,
                {

                    method:"DELETE",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            deleteAll:
                                true,

                            device_id:
                                deviceId

                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                formatServerError(
                    data
                )
            );

        }


        currentMessages =
            currentMessages.filter(
                message =>
                    message.device_id !==
                    deviceId
            );


        renderMessages();


        alert(
            "Your messages have been removed."
        );


    } catch(error) {

        alert(
            "Could not remove messages:\n\n" +
            error.message
        );

    }

}


/* =========================================================
   FULLSCREEN IMAGE
========================================================= */

function openFullscreenImage(
    src
) {

    fullImage.src =
        src;

    imageViewer.classList.add(
        "show"
    );

}


function closeFullscreenImage() {

    imageViewer.classList.remove(
        "show"
    );

    fullImage.src =
        "";

}


backImage.addEventListener(
    "click",
    closeFullscreenImage
);


imageViewer.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            imageViewer
        ) {

            closeFullscreenImage();

        }

    }
);


/* =========================================================
   KEYBOARD
========================================================= */

messageInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


sendButton.addEventListener(
    "click",
    sendMessage
);


/* =========================================================
   SERVER ERROR FORMAT
========================================================= */

function formatServerError(
    data
) {

    if (!data) {
        return "Unknown server error.";
    }


    let result =
        data.error ||
        "Request failed.";


    if (data.fix) {

        result +=
            "\n\n" +
            data.fix;

    }


    return result;

}


/* =========================================================
   INITIAL LOAD
========================================================= */

loadMessages();


/* =========================================================
   POLLING
   Instant replacement, no fade animation.
========================================================= */

setInterval(
    loadMessages,
    3000
);

</script>
