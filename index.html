<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat</title>

<style>
*{
    box-sizing:border-box;
}

:root{
    --bg:#0b0d10;
    --panel:#111419;
    --panel2:#181c22;
    --border:#292f38;
    --text:#edf0f4;
    --muted:#7e8793;
    --accent:#e8eaed;
    --danger:#ff7070;
    --success:#71df91;
    --radius:12px;
    --ui-scale:1;
    --text-size:16px;
    --word-spacing:0px;
    --line-spacing:1.45;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

body{
    overflow:hidden;
    font-size:calc(16px * var(--ui-scale));
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:64px;
    min-height:64px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel);
    border-bottom:1px solid var(--border);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
}

.logo-icon{
    width:35px;
    height:35px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:var(--panel2);
    border:1px solid var(--border);
}

.channel{
    color:var(--muted);
    font-weight:400;
}

.icon-btn{
    width:39px;
    height:39px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
}

.icon-btn:hover{
    filter:brightness(1.15);
}

/* MESSAGES */

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    display:flex;
    gap:11px;
    margin-bottom:17px;
}

.avatar{
    flex:0 0 40px;
    width:40px;
    height:40px;
    display:grid;
    place-items:center;
    border-radius:var(--radius);
    background:var(--panel2);
    border:1px solid var(--border);
    font-weight:700;
}

.message-content{
    min-width:0;
    max-width:min(850px,calc(100vw - 90px));
}

.message-top{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:3px;
}

.username{
    font-weight:700;
}

.time,
.edited{
    color:var(--muted);
    font-size:11px;
}

.message-text{
    color:#d8dde4;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    font-size:var(--text-size);
    word-spacing:var(--word-spacing);
    line-height:var(--line-spacing);
}

.message-image{
    display:block;
    max-width:min(500px,80vw);
    max-height:500px;
    margin-top:8px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:#000;
    object-fit:contain;
    cursor:pointer;
}

/* GAME CARD */

.game-card{
    width:min(650px,calc(100vw - 90px));
    margin-top:8px;
    border:1px solid #343b46;
    border-radius:16px;
    overflow:hidden;
    background:#101419;
    box-shadow:0 12px 35px #0005;
}

.game-card-header{
    padding:16px;
    background:#171c23;
    border-bottom:1px solid var(--border);
}

.game-title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.game-name{
    font-size:19px;
    font-weight:800;
}

.game-status{
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:700;
    background:#222932;
    color:#aeb7c3;
}

.game-status.live{
    background:#16321f;
    color:#75e398;
}

.game-status.finished{
    background:#302718;
    color:#e5b967;
}

.game-info{
    color:#9aa4b1;
    margin-top:7px;
    font-size:13px;
}

.game-body{
    padding:16px;
}

.game-players{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:14px;
}

.player-pill{
    padding:7px 10px;
    border-radius:9px;
    border:1px solid var(--border);
    background:#181e25;
    font-size:12px;
}

.player-pill.host{
    border-color:#75652e;
}

.player-pill.you{
    border-color:#4c6d8c;
}

.game-turn{
    padding:11px 13px;
    border-radius:10px;
    background:#181d24;
    border:1px solid var(--border);
    margin-bottom:12px;
    color:#cbd2db;
}

.game-turn strong{
    color:white;
}

.game-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.game-btn{
    padding:9px 13px;
    border-radius:9px;
    border:1px solid var(--border);
    background:#20262e;
    color:white;
}

.game-btn:hover{
    filter:brightness(1.15);
}

.game-btn.primary{
    background:#e8eaed;
    color:#111;
    border-color:#e8eaed;
}

.game-btn.danger{
    background:#351c20;
    border-color:#69323a;
    color:#ff9696;
}

.game-btn.success{
    background:#173021;
    border-color:#315f40;
    color:#86e8a2;
}

.game-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.game-board{
    margin:15px auto;
    width:min(360px,100%);
    aspect-ratio:1;
    display:grid;
    gap:6px;
}

.board-cell{
    border:1px solid #343b45;
    border-radius:9px;
    background:#171c22;
    color:white;
    font-size:28px;
    font-weight:800;
    display:grid;
    place-items:center;
}

.board-cell:hover{
    background:#222933;
}

.dice-result{
    text-align:center;
    padding:25px;
    font-size:50px;
    font-weight:900;
}

.game-winner{
    padding:16px;
    text-align:center;
    border-radius:12px;
    background:#211d13;
    border:1px solid #5d4a25;
    color:#ffd875;
    font-size:18px;
    font-weight:800;
}

/* COMPOSER */

.composer{
    padding:12px 16px 16px;
    background:var(--panel);
    border-top:1px solid var(--border);
}

.composer-box{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:8px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:14px;
}

textarea{
    flex:1;
    min-height:42px;
    max-height:150px;
    resize:none;
    border:0;
    outline:none;
    background:transparent;
    color:white;
    padding:10px;
}

.attach-btn,
.send-btn{
    height:42px;
    border:0;
    border-radius:9px;
}

.attach-btn{
    width:42px;
    background:transparent;
    color:#adb5c0;
    font-size:20px;
}

.attach-btn:hover{
    background:#242932;
}

.send-btn{
    padding:0 18px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

.send-btn:disabled{
    opacity:.5;
}

/* GAME CREATOR */

.game-selector{
    display:grid;
    gap:9px;
    margin-top:12px;
}

.game-option{
    padding:13px;
    border:1px solid var(--border);
    background:#171c22;
    border-radius:10px;
    color:white;
    text-align:left;
}

.game-option:hover{
    border-color:#58616d;
}

.game-option strong{
    display:block;
}

.game-option small{
    display:block;
    margin-top:4px;
    color:var(--muted);
}

/* OVERLAY */

.overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000b;
    z-index:1000;
}

.overlay.show{
    display:flex;
}

.panel{
    width:min(520px,calc(100vw - 25px));
    max-height:calc(100vh - 25px);
    overflow-y:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px;
    border-bottom:1px solid var(--border);
}

.panel-header h2{
    margin:0;
}

.panel-body{
    padding:18px;
}

.setting{
    margin-top:14px;
}

.setting label{
    display:block;
    margin-bottom:7px;
    color:#aab2bd;
    font-size:13px;
}

.setting input,
.setting select{
    width:100%;
    padding:10px;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
    background:#101419;
    color:white;
}

.save-btn{
    width:100%;
    margin-top:18px;
    padding:12px;
    border:0;
    border-radius:9px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

/* EMPTY */

.empty{
    height:100%;
    display:grid;
    place-items:center;
    color:#656d78;
    text-align:center;
}

.empty strong{
    display:block;
    color:#aab2bd;
    margin-bottom:5px;
}

/* DIALOG */

.dialog{
    width:min(450px,calc(100vw - 30px));
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
}

.dialog h2{
    margin-top:0;
}

.dialog p{
    color:#aab2bd;
    line-height:1.5;
}

.dialog-buttons{
    display:flex;
    gap:8px;
    justify-content:flex-end;
}

.dialog-buttons button{
    padding:10px 16px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#20252c;
    color:white;
}

.dialog-buttons .danger{
    background:#6b2929;
    border-color:#813434;
}

@media(max-width:600px){

    .header{
        padding:0 11px;
    }

    .messages{
        padding:15px 11px;
    }

    .channel{
        display:none;
    }

    .message-content{
        max-width:calc(100vw - 70px);
    }

    .game-card{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="logo">
        <div class="logo-icon">💬</div>
        <span>Chat</span>
        <span class="channel"># general</span>
    </div>

    <div style="display:flex;gap:7px">

        <button
            class="icon-btn"
            id="gamesBtn"
            title="Games"
        >🎮</button>

        <button
            class="icon-btn"
            id="settingsBtn"
            title="Settings"
        >⚙</button>

    </div>

</header>

<main
    class="messages"
    id="messages"
></main>

<div class="composer">

    <div class="composer-box">

        <textarea
            id="messageInput"
            rows="1"
            placeholder="Message #general"
        ></textarea>

        <button
            class="send-btn"
            id="sendBtn"
        >Send</button>

    </div>

</div>

</div>


<!-- GAME CREATOR -->

<div
    class="overlay"
    id="gamesOverlay"
>

<div class="panel">

<div class="panel-header">

    <h2>🎮 Games</h2>

    <button
        class="icon-btn"
        id="closeGames"
    >×</button>

</div>

<div class="panel-body">

<p style="color:#9aa4b1">
Create a game and invite everyone in chat.
Players must press <b>Join</b> before you start.
</p>

<div class="game-selector">

<button
    class="game-option"
    data-game="tictactoe"
>
    <strong>⭕ Tic-Tac-Toe</strong>
    <small>2 players · Classic 3×3 game</small>
</button>

<button
    class="game-option"
    data-game="dice"
>
    <strong>🎲 Dice Battle</strong>
    <small>2–8 players · Highest roll wins</small>
</button>

<button
    class="game-option"
    data-game="connect4"
>
    <strong>🔴 Connect Four</strong>
    <small>2 players · Get four in a row</small>
</button>

<button
    class="game-option"
    data-game="reaction"
>
    <strong>⚡ Reaction Race</strong>
    <small>2–8 players · Fastest player wins</small>
</button>

<button
    class="game-option"
    data-game="numbers"
>
    <strong>🔢 Number Battle</strong>
    <small>2–8 players · Closest to the target wins</small>
</button>

</div>

</div>
</div>
</div>


<!-- SETTINGS -->

<div
    class="overlay"
    id="settingsOverlay"
>

<div class="panel">

<div class="panel-header">

    <h2>Settings</h2>

    <button
        class="icon-btn"
        id="closeSettings"
    >×</button>

</div>

<div class="panel-body">

<div class="setting">

<label>Your name</label>

<input
    id="usernameInput"
    maxlength="24"
    placeholder="Enter your name"
>

</div>

<div class="setting">

<label>Refresh rate</label>

<select id="refreshRate">

<option value="10000">10 seconds</option>
<option value="5000">5 seconds</option>
<option value="3000">3 seconds</option>
<option value="1000">1 second</option>
<option value="500">0.5 seconds</option>

</select>

</div>

<button
    class="save-btn"
    id="saveSettings"
>
Save settings
</button>

</div>
</div>
</div>


<!-- CONFIRM -->

<div
    class="overlay"
    id="dialogOverlay"
>

<div class="dialog">

<h2 id="dialogTitle">Confirm</h2>

<p id="dialogText"></p>

<div class="dialog-buttons">

<button id="dialogCancel">
Cancel
</button>

<button
    class="danger"
    id="dialogConfirm"
>
Confirm
</button>

</div>

</div>
</div>


<script>

/* =========================================================
   CHAT
========================================================= */

const API_URL="/api/messages";
const CHANNEL="general";

let deviceId=localStorage.getItem("chat_device_id");

if(!deviceId){

    deviceId=
        crypto.randomUUID();

    localStorage.setItem(
        "chat_device_id",
        deviceId
    );
}


/* =========================================================
   SETTINGS
========================================================= */

const settings={

    username:
        localStorage.getItem("chat_username")||"",

    refreshRate:
        Number(
            localStorage.getItem("chat_refreshRate")
        )||500

};

const usernameInput=
    document.getElementById("usernameInput");

const refreshRate=
    document.getElementById("refreshRate");

usernameInput.value=settings.username;
refreshRate.value=settings.refreshRate;


/* =========================================================
   ELEMENTS
========================================================= */

const messagesEl=
    document.getElementById("messages");

const messageInput=
    document.getElementById("messageInput");

const sendBtn=
    document.getElementById("sendBtn");

const settingsBtn=
    document.getElementById("settingsBtn");

const settingsOverlay=
    document.getElementById("settingsOverlay");

const closeSettings=
    document.getElementById("closeSettings");

const saveSettings=
    document.getElementById("saveSettings");

const gamesBtn=
    document.getElementById("gamesBtn");

const gamesOverlay=
    document.getElementById("gamesOverlay");

const closeGames=
    document.getElementById("closeGames");

const dialogOverlay=
    document.getElementById("dialogOverlay");

const dialogTitle=
    document.getElementById("dialogTitle");

const dialogText=
    document.getElementById("dialogText");

const dialogCancel=
    document.getElementById("dialogCancel");

const dialogConfirm=
    document.getElementById("dialogConfirm");


let currentMessages=[];
let refreshTimer=null;
let dialogCallback=null;


/* =========================================================
   GAME CONSTANTS
========================================================= */

const GAME_PREFIX="__CHAT_GAME__";

const GAME_TYPES={

    tictactoe:{
        name:"Tic-Tac-Toe",
        min:2,
        max:2
    },

    dice:{
        name:"Dice Battle",
        min:2,
        max:8
    },

    connect4:{
        name:"Connect Four",
        min:2,
        max:2
    },

    reaction:{
        name:"Reaction Race",
        min:2,
        max:8
    },

    numbers:{
        name:"Number Battle",
        min:2,
        max:8
    }

};


/* =========================================================
   GAME STATE
========================================================= */

function newGame(type){

    const info=GAME_TYPES[type];

    return {

        version:1,

        id:
            crypto.randomUUID(),

        type,

        name:info.name,

        host:deviceId,

        hostName:settings.username,

        maxPlayers:info.max,

        minPlayers:info.min,

        players:[

            {

                id:deviceId,

                name:settings.username

            }

        ],

        started:false,

        finished:false,

        winner:null,

        winnerName:null,

        turn:0,

        turnPlayer:null,

        board:type==="tictactoe"
            ?Array(9).fill("")
            :type==="connect4"
                ?Array(42).fill("")
                :[],

        rolls:{},

        answers:{},

        target:
            Math.floor(
                Math.random()*90
            )+10,

        createdAt:Date.now(),

        updatedAt:Date.now(),

        finishAt:null

    };

}


/* =========================================================
   GAME MESSAGE FORMAT
========================================================= */

function encodeGame(game){

    return GAME_PREFIX+
        JSON.stringify(game);
}


function decodeGame(message){

    if(
        typeof message.message!=="string" ||
        !message.message.startsWith(GAME_PREFIX)
    ){

        return null;

    }

    try{

        return JSON.parse(
            message.message.substring(
                GAME_PREFIX.length
            )
        );

    }catch{

        return null;

    }

}


/* =========================================================
   GAME MESSAGE FINDING
========================================================= */

function getGameMessages(){

    return currentMessages
        .map(message=>({

            message,

            game:decodeGame(message)

        }))
        .filter(x=>x.game);

}


function findGame(gameId){

    return getGameMessages()
        .find(x=>x.game.id===gameId);

}


/* =========================================================
   CHECK IF HOST ALREADY HAS GAME
========================================================= */

function amHostingGame(){

    return getGameMessages()
        .some(x=>
            x.game.host===deviceId &&
            !x.game.finished
        );

}


/* =========================================================
   CREATE GAME
========================================================= */

async function createGame(type){

    if(!settings.username){

        alert(
            "Set your name in Settings first."
        );

        settingsOverlay.classList.add("show");

        return;

    }

    if(amHostingGame()){

        alert(
            "You are already hosting a game."
        );

        return;

    }

    const game=
        newGame(type);

    gamesOverlay.classList.remove("show");

    await saveGame(game);

}


/* =========================================================
   SAVE GAME
========================================================= */

async function saveGame(game,messageId=null){

    game.updatedAt=Date.now();

    try{

        if(messageId){

            const response=
                await fetch(
                    API_URL,
                    {

                        method:"PATCH",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({

                            id:messageId,

                            device_id:
                                deviceId,

                            message:
                                encodeGame(game)

                        })

                    }
                );

            if(!response.ok){

                const data=
                    await safeJson(response);

                throw new Error(
                    data.error||
                    "Could not update game."
                );

            }

        }else{

            const response=
                await fetch(
                    API_URL,
                    {

                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({

                            username:
                                game.hostName,

                            channel:
                                CHANNEL,

                            message:
                                encodeGame(game),

                            image:null,

                            device_id:
                                game.host

                        })

                    }
                );

            if(!response.ok){

                const data=
                    await safeJson(response);

                throw new Error(
                    data.error||
                    "Could not create game."
                );

            }

        }

        await loadMessages();

    }catch(error){

        alert(
            "Game error:\n\n"+
            error.message
        );

    }

}


/* =========================================================
   DELETE GAME MESSAGE
========================================================= */

async function deleteGameMessage(message){

    if(!message)return false;

    try{

        const response=
            await fetch(
                API_URL,
                {

                    method:"DELETE",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        id:message.id,

                        device_id:
                            deviceId,

                        /*
                         * Special server-side request.
                         * The API must allow game hosts to
                         * remove the game message.
                         */
                        game_delete:true,

                        game_id:
                            decodeGame(message)?.id||null,

                        host_device_id:
                            decodeGame(message)?.host||null

                    })

                }
            );

        if(!response.ok){

            const data=
                await safeJson(response);

            console.warn(
                "Game deletion failed:",
                data
            );

            return false;

        }

        return true;

    }catch(error){

        console.warn(
            "Game deletion error:",
            error
        );

        return false;

    }

}


/* =========================================================
   FORCE QUIT
========================================================= */

async function forceQuitGame(game,message){

    if(
        !game ||
        game.host!==deviceId
    ){

        return;

    }

    await deleteGameMessage(message);

    await loadMessages();

}


/* =========================================================
   LEAVE GAME
========================================================= */

async function leaveGame(game,message){

    if(!game)return;

    const index=
        game.players.findIndex(
            player=>
                player.id===deviceId
        );

    if(index===-1){

        return;

    }

    game.players.splice(index,1);

    /*
     * If nobody is left, remove the game completely.
     */
    if(game.players.length===0){

        await deleteGameMessage(message);

        return;

    }

    /*
     * If host leaves, transfer host.
     */
    if(game.host===deviceId){

        const newHost=
            game.players[0];

        game.host=
            newHost.id;

        game.hostName=
            newHost.name;

        /*
         * The new host's device id is required by
         * the API update permission.
         *
         * Since the old host cannot patch using the
         * new device id, delete and recreate the
         * temporary game message.
         */
        await deleteGameMessage(message);

        game.updatedAt=Date.now();

        await createGameMessageAsHost(game,newHost);

        return;

    }

    /*
     * If the game has already started and the current
     * player was the current turn, move to another player.
     */
    if(
        game.started &&
        game.turnPlayer===deviceId
    ){

        if(game.players.length){

            game.turn=
                game.turn%
                game.players.length;

            game.turnPlayer=
                game.players[
                    game.turn
                ].id;

        }

    }

    await saveGame(
        game,
        message.id
    );

}

async function joinGame(game,message){

/* =========================================================
   START
========================================================= */

async function startGame(game,message){

    if(!game)return;

    if(game.host!==deviceId){

        return;

    }

    if(game.started){

        return;

    }

    if(
        game.players.length<
        game.minPlayers
    ){

        alert(
            "You need at least "+
            game.minPlayers+
            " players to start this game."
        );

        return;

    }

    game.started=true;

    game.turn=0;

    game.turnPlayer=
        game.players[0].id;

    game.updatedAt=Date.now();

    await saveGame(
        game,
        message.id
    );

}


/* =========================================================
   GAME FINISH
========================================================= */

async function finishGame(
    game,
    message,
    winner,
    winnerName
){

    if(game.finished){

        return;

    }

    game.finished=true;

    game.winner=
        winner;

    game.winnerName=
        winnerName;

    game.finishAt=
        Date.now();

    await saveGame(
        game,
        message.id
    );

    /*
     * IMPORTANT:
     * Do NOT delete immediately.
     *
     * Everyone gets approximately 3 seconds
     * to see the winner.
     */
    setTimeout(
        async()=>{

            /*
             * Re-fetch before deleting so that
             * another client cannot accidentally
             * recreate old state.
             */
            const latest=
                findGame(game.id);

            if(!latest){

                return;

            }

            const latestGame=
                latest.game;

            if(!latestGame.finished){

                return;

            }

            if(
                Date.now()-
                latestGame.finishAt<
                2800
            ){

                return;

            }

            await deleteGameMessage(
                latest.message
            );

            /*
             * Force an immediate refresh.
             */
            await loadMessages();

        },
        3100
    );

}

function nextTurn(game){

    }

        )%

/* =========================================================
   TIC TAC TOE
========================================================= */

async function ticTacToeMove(
    game,
    message,
    index
){

    if(!game.started||game.finished){

        return;

    }

    if(game.turnPlayer!==deviceId){

        return;

    }

    if(game.board[index]){

        return;

    }

    const playerIndex=
        game.players.findIndex(
            p=>p.id===deviceId
        );

    const symbol=
        playerIndex===0
        ?"X"
        :"O";

    game.board[index]=symbol;

    const winner=
        checkTicTacToe(
            game.board
        );

    if(winner){

        const winnerPlayer=
            game.players[
                winner==="X"?0:1
            ];

        await finishGame(
            game,
            message,
            winnerPlayer.id,
            winnerPlayer.name
        );

        return;

    }

    if(
        game.board.every(
            cell=>cell!==""
        )
    ){

        await finishGame(
            game,
            message,
            null,
            "Draw"
        );

        return;

    }

    nextTurn(game);

    await saveGame(
        game,
        message.id
    );

}


function checkTicTacToe(board){

    const wins=[

        [0,1,2],
        [3,4,5],
        [6,7,8],

        [0,3,6],
        [1,4,7],
        [2,5,8],

        [0,4,8],
        [2,4,6]

    ];

    for(const line of wins){

        const a=board[line[0]];
        const b=board[line[1]];
        const c=board[line[2]];

        if(
            a &&
            a===b &&
            b===c
        ){

            return a;

        }

    }

    return null;

}


/* =========================================================
   DICE
========================================================= */

async function rollDice(
    game,
    message
){

    if(!game.started||game.finished){

        return;

    }

    if(game.turnPlayer!==deviceId){

        return;

    }

    const roll=
        Math.floor(
            Math.random()*6
        )+1;

    game.rolls[deviceId]=roll;

    /*
     * Once everyone has rolled, highest wins.
     */
    if(
        Object.keys(game.rolls).length>=
        game.players.length
    ){

        let winner=null;
        let highest=-1;

        for(const player of game.players){

            const value=
                game.rolls[player.id];

            if(value>highest){

                highest=value;
                winner=player;

            }

        }

        await finishGame(
            game,
            message,
            winner.id,
            winner.name
        );

        return;

    }

    nextTurn(game);

    await saveGame(
        game,
        message.id
    );

}


/* =========================================================
   CONNECT FOUR
========================================================= */

function connect4Drop(
    board,
    column,
    symbol
){

    for(
        let row=5;
        row>=0;
        row--
    ){

        const index=
            row*7+column;

        if(!board[index]){

            board[index]=symbol;

            return index;

        }

    }

    return -1;

}


function checkConnect4(
    board,
    symbol
){

    for(let row=0;row<6;row++){

        for(let col=0;col<7;col++){

            const index=
                row*7+col;

            if(board[index]!==symbol){

                continue;

            }

            const directions=[

                [1,0],
                [0,1],
                [1,1],
                [1,-1]

            ];

            for(
                const [dx,dy]
                of directions
            ){

                let count=1;

                for(
                    let step=1;
                    step<4;
                    step++
                ){

                    const x=
                        col+
                        dx*step;

                    const y=
                        row+
                        dy*step;

                    if(
                        x<0||
                        x>=7||
                        y<0||
                        y>=6
                    ){

                        break;

                    }

                    if(
                        board[
                            y*7+x
                        ]===symbol
                    ){

                        count++;

                    }else{

                        break;

                    }

                }

                if(count>=4){

                    return true;

                }

            }

        }

    }

    return false;

}


async function connect4Move(
    game,
    message,
    column
){

    if(!game.started||game.finished){

        return;

    }

    if(game.turnPlayer!==deviceId){

        return;

    }

    const playerIndex=
        game.players.findIndex(
            p=>p.id===deviceId
        );

    const symbol=
        playerIndex===0
        ?"🔴"
        :"🟡";

    const index=
        connect4Drop(
            game.board,
            column,
            symbol
        );

    if(index===-1){

        return;

    }

    if(
        checkConnect4(
            game.board,
            symbol
        )
    ){

        const player=
            game.players[
                playerIndex
            ];

        await finishGame(
            game,
            message,
            player.id,
            player.name
        );

        return;

    }

    if(
        game.board.every(
            x=>x
        )
    ){

        await finishGame(
            game,
            message,
            null,
            "Draw"
        );

        return;

    }

    nextTurn(game);

    await saveGame(
        game,
        message.id
    );

}


/* =========================================================
   REACTION GAME
========================================================= */

async function reactionAnswer(
    game,
    message
){

    if(!game.started||game.finished){

        return;

    }

    if(
        game.answers[deviceId]
    ){

        return;

    }

    game.answers[deviceId]=
        Date.now();

    if(
        Object.keys(game.answers).length>=
        game.players.length
    ){

        let winner=null;
        let fastest=Infinity;

        for(
            const player of game.players
        ){

            const time=
                game.answers[player.id];

            if(time<fastest){

                fastest=time;
                winner=player;

            }

        }

        await finishGame(
            game,
            message,
            winner.id,
            winner.name
        );

        return;

    }

    await saveGame(
        game,
        message.id
    );

}


/* =========================================================
   NUMBER GAME
========================================================= */

async function numberAnswer(
    game,
    message,
    value
){

    if(!game.started||game.finished){

        return;

    }

    if(
        game.answers[deviceId]!==undefined
    ){

        return;

    }

    const number=
        Number(value);

    if(
        !Number.isFinite(number)||
        number<0||
        number>100
    ){

        return;

    }

    game.answers[deviceId]=number;

    if(
        Object.keys(game.answers).length>=
        game.players.length
    ){

        let winner=null;
        let best=Infinity;

        for(
            const player of game.players
        ){

            const difference=
                Math.abs(
                    game.answers[player.id]-
                    game.target
                );

            if(difference<best){

                best=difference;
                winner=player;

            }

        }

        await finishGame(
            game,
            message,
            winner.id,
            winner.name
        );

        return;

    }

    await saveGame(
        game,
        message.id
    );

}

        document.createElement("div");

    body.className="game-body";

        document.createElement("div");

    players.className=
        "game-players";

    game.players.forEach(
        player=>{

            const pill=
                document.createElement("div");

            pill.className=
                "player-pill";

            if(
                player.id===
                game.host
            ){

                pill.classList.add(
                    "host"
                );

            }

            if(
                player.id===
                deviceId
            ){

                pill.classList.add(
                    "you"
                );

            }

            pill.textContent=
                player.name+
                (
                    player.id===
                    game.host
                    ?" 👑"
                    :""
                )+
                (
                    player.id===
                    deviceId
                    ?" (You)"
                    :""
                );

            players.appendChild(pill);

        }
    );

    body.appendChild(players);


    /* WINNER */

    if(game.finished){

        const winner=
            document.createElement("div");

        winner.className=
            "game-winner";

        if(game.winnerName==="Draw"){

            winner.textContent=
                "🤝 Draw!";

        }else{

            winner.textContent=
                "🏆 "+
                game.winnerName+
                " wins!";

        }

        body.appendChild(winner);

        card.appendChild(body);

        return card;

    }


    /* TURN */

    if(game.started){

        const turn=
            document.createElement("div");

        turn.className=
            "game-turn";

        const current=
            game.players.find(
                p=>
                    p.id===
                    game.turnPlayer
            );

        if(current){

            turn.innerHTML=
                "<strong>Turn:</strong> "+
                escapeHtml(
                    current.name
                )+
                (
                    current.id===
                    deviceId
                    ?" · Your turn!"
                    :""
                );

        }

        body.appendChild(turn);

    }


    /* GAME BOARD */

    if(
        game.started
    ){

        if(
            game.type===
            "tictactoe"
        ){

            body.appendChild(
                createTicTacToeBoard(
                    game,
                    message
                )
            );

        }

        if(
            game.type===
            "connect4"
        ){

            body.appendChild(
                createConnect4Board(
                    game,
                    message
                )
            );

        }

        if(
            game.type===
            "dice"
        ){

            body.appendChild(
                createDiceUI(
                    game,
                    message
                )
            );

        }

        if(
            game.type===
            "reaction"
        ){

            body.appendChild(
                createReactionUI(
                    game,
                    message
                )
            );

        }

        if(
            game.type===
            "numbers"
        ){

            body.appendChild(
                createNumbersUI(
                    game,
                    message
                )
            );

        }

    }


    /* ACTIONS */

    const actions=
        document.createElement("div");

    actions.className=
        "game-actions";


    const joined=
        game.players.some(
            p=>
                p.id===
                deviceId
        );


    if(
        !game.started &&
        !joined &&
        game.players.length<
        game.maxPlayers
    ){

        const join=
            button(
                "Join",
                "success"
            );

        join.onclick=()=>{
            joinGame(
                game,
                message
            );
        };

        actions.appendChild(join);

    }


    if(
        !game.started &&
        game.host===
        deviceId
    ){

        const start=
            button(
                "Start Game",
                "primary"
            );

        start.disabled=
            game.players.length<
            game.minPlayers;

        start.title=
            start.disabled
            ?"Need at least "+
             game.minPlayers+
             " players"
            :"Start game";

        start.onclick=()=>{
            startGame(
                game,
                message
            );
        };

        actions.appendChild(start);

    }


    if(
        joined &&
        !game.finished
    ){

        const leave=
            button(
                "Leave",
                "danger"
            );

        leave.onclick=()=>{

            openConfirm(
                "Leave game?",
                "You will leave this game.",
                ()=>leaveGame(
                    game,
                    message
                )
            );

        };

        actions.appendChild(leave);

    }


    if(
        game.host===
        deviceId &&
        !game.finished
    ){

        const force=
            button(
                "Force Quit",
                "danger"
            );

        force.onclick=()=>{

            openConfirm(
                "Force quit game?",
                "Everyone will be removed from the game.",
                ()=>forceQuitGame(
                    game,
                    message
                )
            );

        };

        actions.appendChild(force);

    }


    body.appendChild(actions);

    card.appendChild(body);

    return card;

}

                    document.createElement(
                        "div"
                    );

                item.className="message";

                const avatar=
                    document.createElement(
                        "div"
                    );

                avatar.className="avatar";

                avatar.textContent=
                    (
                        message.username||
                        "?"
                    )
                    .charAt(0)
                    .toUpperCase();

                const content=
                    document.createElement(
                        "div"
                    );

                content.className=
                    "message-content";

                const top=
                    document.createElement(
                        "div"
                    );

                top.className=
                    "message-top";

                const name=
                    document.createElement(
                        "span"
                    );

                name.className="username";

                name.textContent=
                    message.username||
                    "User";

                top.appendChild(name);

                const time=
                    document.createElement(
                        "span"
                    );

                time.className="time";

                time.textContent=
                    formatTime(
                        message.created_at
                    );

                top.appendChild(time);

                content.appendChild(top);

                if(message.message){

                    const text=
                        document.createElement(
                            "div"
                        );

                    text.className=
                        "message-text";

                    text.textContent=
                        message.message;

                    content.appendChild(text);

                }

                item.appendChild(avatar);
                item.appendChild(content);

                fragment.appendChild(item);

            }
        );

    }

    messagesEl.replaceChildren(
        fragment
    );

    if(
        wasBottom
    ){

        messagesEl.scrollTop=
            messagesEl.scrollHeight;

    }

}


/* =========================================================
   HIDE OLD FINISHED GAME
========================================================= */

function shouldHideGame(game){

    if(!game){

        return true;

    }

    if(
        game.finished &&
        game.finishAt &&
        Date.now()-
        game.finishAt>=
        3000
    ){

        return true;

    }

    return false;

}


/* =========================================================
   AUTOMATIC GAME CLEANUP
========================================================= */

async function cleanupGames(){

    const games=
        getGameMessages();

    for(
        const entry of games
    ){

        const game=
            entry.game;

        /*
         * Finished games are deleted after 3 seconds.
         */
        if(
            game.finished &&
            game.finishAt &&
            Date.now()-
            game.finishAt>=
            3000
        ){

            /*
             * Only the host attempts deletion.
             *
             * This prevents every client from
             * simultaneously sending DELETE requests.
             */
            if(
                game.host===
                deviceId
            ){

                await deleteGameMessage(
                    entry.message
                );

            }

            continue;

        }


        /*
         * Empty games are removed.
         */
        if(
            !game.finished &&
            game.players.length===0
        ){

            if(
                game.host===
                deviceId
            ){

                await deleteGameMessage(
                    entry.message
                );

            }

        }

    }

}


/* =========================================================
   LOAD MESSAGES
========================================================= */

let loading=false;

async function loadMessages(){

    if(loading){

        return;

    }

    loading=true;

    try{

        const response=
            await fetch(
                API_URL+
                "?channel="+
                encodeURIComponent(
                    CHANNEL
                )+
                "&_="+
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        const data=
            await safeJson(
                response
            );

        if(!response.ok){

            throw new Error(
                data.error||
                "Failed to load messages."
            );

        }

        currentMessages=
            Array.isArray(
                data.messages
            )
            ?data.messages
            :[];

        renderMessages();

    }catch(error){

        console.error(
            "LOAD ERROR:",
            error
        );

    }finally{

        loading=false;

    }

}


/* =========================================================
   SEND NORMAL MESSAGE
========================================================= */

sendBtn.onclick=
    sendNormalMessage;


messageInput.addEventListener(
    "keydown",
    event=>{

        if(
            event.key==="Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendNormalMessage();

        }

    }
);


async function sendNormalMessage(){

    const text=
        messageInput.value.trim();

    if(!text){

        return;

    }

    if(!settings.username){

        settingsOverlay.classList.add(
            "show"
        );

        alert(
            "Set your name first."
        );

        return;

    }

    sendBtn.disabled=true;

    try{

        const response=
            await fetch(
                API_URL,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        username:
                            settings.username,

                        channel:
                            CHANNEL,

                        message:
                            text,

                        image:null,

                        device_id:
                            deviceId

                    })

                }
            );

        const data=
            await safeJson(
                response
            );

        if(!response.ok){

            throw new Error(
                data.error||
                "Failed to send."
            );

        }

        messageInput.value="";

        await loadMessages();

    }catch(error){

        alert(
            "Failed to send:\n\n"+
            error.message
        );

    }finally{

        sendBtn.disabled=false;

    }

}


/* =========================================================
   SETTINGS
========================================================= */

settingsBtn.onclick=()=>{

    usernameInput.value=
        settings.username;

    refreshRate.value=
        settings.refreshRate;

    settingsOverlay.classList.add(
        "show"
    );

};

closeSettings.onclick=()=>{

    settingsOverlay.classList.remove(
        "show"
    );

};

saveSettings.onclick=()=>{

    settings.username=
        usernameInput.value
            .trim()
            .substring(0,24);

    settings.refreshRate=
        Number(
            refreshRate.value
        );

    localStorage.setItem(
        "chat_username",
        settings.username
    );

    localStorage.setItem(
        "chat_refreshRate",
        settings.refreshRate
    );

    settingsOverlay.classList.remove(
        "show"
    );

    startRefresh();

};

   GAME MENU
========================================================= */

gamesBtn.onclick=()=>{

    gamesOverlay.classList.add(

    );

};

closeGames.onclick=()=>{

    );

/* =========================================================
   CONFIRM
========================================================= */

function openConfirm(
    title,
    text,
    callback
){

    dialogTitle.textContent=
        title;

    dialogText.textContent=
        text;

    dialogCallback=
        callback;

    dialogOverlay.classList.add(
        "show"
    );

}

dialogCancel.onclick=()=>{

    dialogOverlay.classList.remove(
        "show"
    );

    dialogCallback=null;

};

dialogConfirm.onclick=async()=>{

    const callback=
        dialogCallback;

    dialogOverlay.classList.remove(
        "show"
    );

    dialogCallback=null;

    if(callback){

        await callback();

    }

};


/* =========================================================
   REFRESH
========================================================= */

function startRefresh(){

    if(refreshTimer){

        clearInterval(
            refreshTimer
        );

    }

    /*
     * The selected refresh setting controls
     * normal chat refresh.
     *
     * Game cleanup always runs at 500ms
     * independently.
     */
    refreshTimer=
        setInterval(
            async()=>{

                await loadMessages();

            },
            settings.refreshRate
        );

}


/* =========================================================
   GAME FAST LOOP
========================================================= */

setInterval(
    async()=>{

        /*
         * Games update quickly without changing
         * the user's normal chat refresh setting.
         */
        await loadMessages();

        await cleanupGames();

    },
    500
);


/* =========================================================
   HELPERS
========================================================= */

async function safeJson(response){

    const text=
        await response.text();

    if(!text){

        return {};

    }

    try{

        return JSON.parse(text);

    }catch{

        return {
            error:text
        };

    }

}


function formatTime(date){

    if(!date){

        return "";

    }

    return new Date(date)
        .toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

}


function escapeHtml(value){

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================================
   START
========================================================= */

startRefresh();

loadMessages();

</script>
