<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat</title>

<style>
*{
    box-sizing:border-box;
}

:root{
    --bg:#0b0d10;
    --panel:#111419;
    --panel2:#181c22;
    --panel3:#20252d;
    --border:#292f38;
    --text:#edf0f4;
    --muted:#7e8793;
    --accent:#e8eaed;
    --danger:#ff7070;
    --green:#70e0a0;
    --yellow:#e5c66b;
    --radius:12px;
    --text-size:16px;
    --word-spacing:0px;
    --line-spacing:1.45;
    --ui-scale:1;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

body{
    overflow:hidden;
    font-size:calc(16px * var(--ui-scale));
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:64px;
    min-height:64px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel);
    border-bottom:1px solid var(--border);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
}

.logo-icon{
    width:35px;
    height:35px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:var(--panel2);
    border:1px solid var(--border);
}

.channel{
    color:var(--muted);
    font-weight:400;
}

.header-actions{
    display:flex;
    gap:7px;
}

.icon-btn{
    width:39px;
    height:39px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
}

.icon-btn:hover{
    filter:brightness(1.15);
}

/* MESSAGES */

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    display:flex;
    gap:11px;
    margin-bottom:17px;
}

.avatar{
    flex:0 0 40px;
    width:40px;
    height:40px;
    display:grid;
    place-items:center;
    border-radius:var(--radius);
    background:var(--panel2);
    border:1px solid var(--border);
    font-weight:700;
}

.message-content{
    min-width:0;
    max-width:min(850px,calc(100vw - 90px));
}

.message-top{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:3px;
}

.username{
    font-weight:700;
}

.time,
.edited{
    color:var(--muted);
    font-size:11px;
}

.message-text{
    color:#d8dde4;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    font-size:var(--text-size);
    word-spacing:var(--word-spacing);
    line-height:var(--line-spacing);
}

.message-image{
    display:block;
    max-width:min(500px,80vw);
    max-height:500px;
    margin-top:8px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:#000;
    object-fit:contain;
    cursor:pointer;
}

/* GAME CARDS */

.game-message{
    margin:0 auto 18px;
    max-width:900px;
}

.game-card{
    border:1px solid var(--border);
    border-radius:16px;
    background:linear-gradient(
        145deg,
        var(--panel2),
        #101318
    );
    overflow:hidden;
    box-shadow:0 12px 40px #0005;
}

.game-header{
    padding:17px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
}

.game-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:18px;
    font-weight:800;
}

.game-status{
    font-size:12px;
    padding:6px 9px;
    border-radius:999px;
    background:#252b33;
    color:#bfc6cf;
}

.game-body{
    padding:18px;
}

.game-info{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:15px;
}

.game-pill{
    padding:7px 10px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#13171d;
    color:#bfc6cf;
    font-size:12px;
}

.game-pill strong{
    color:white;
}

.game-description{
    color:#969faa;
    margin-bottom:16px;
    line-height:1.45;
}

.game-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.game-btn{
    border:1px solid var(--border);
    border-radius:9px;
    padding:10px 14px;
    background:#222830;
    color:white;
    font-weight:700;
}

.game-btn:hover{
    filter:brightness(1.15);
}

.game-btn.primary{
    background:#e8eaed;
    color:#111;
}

.game-btn.green{
    background:#193b2b;
    border-color:#2c6348;
    color:#9bf0bc;
}

.game-btn.danger{
    background:#3a1c20;
    border-color:#71333b;
    color:#ff9292;
}

.game-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

/* PLAYERS */

.players-list{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin:13px 0;
}

.player-chip{
    padding:7px 10px;
    border-radius:8px;
    background:#13171d;
    border:1px solid var(--border);
    font-size:12px;
}

.player-chip.host{
    border-color:#65552a;
    color:#ead17a;
}

.turn-banner{
    margin:12px 0;
    padding:11px 13px;
    border-radius:10px;
    background:#151a20;
    border:1px solid var(--border);
    color:#c8ced6;
}

.turn-banner strong{
    color:white;
}

/* TIC TAC TOE */

.ttt{
    display:grid;
    grid-template-columns:repeat(3,70px);
    gap:7px;
    justify-content:center;
    margin:18px auto;
}

.ttt button{
    width:70px;
    height:70px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#11151b;
    color:white;
    font-size:29px;
    font-weight:900;
}

.ttt button:hover{
    background:#222831;
}

/* CONNECT FOUR */

.connect-board{
    display:grid;
    grid-template-columns:repeat(7,42px);
    gap:5px;
    padding:10px;
    width:max-content;
    max-width:100%;
    overflow:auto;
    margin:15px auto;
    background:#11161d;
    border:1px solid var(--border);
    border-radius:12px;
}

.connect-cell{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#252b33;
    border:1px solid #343b45;
}

.connect-cell.red{
    background:#d65353;
}

.connect-cell.yellow{
    background:#e0c454;
}

/* DICE */

.dice-area{
    text-align:center;
    padding:15px;
}

.dice{
    width:100px;
    height:100px;
    margin:15px auto;
    display:grid;
    place-items:center;
    border-radius:18px;
    background:#e9ebee;
    color:#111;
    font-size:52px;
    font-weight:900;
    border:2px solid #fff;
}

/* HIGHER LOWER */

.card-number{
    width:150px;
    height:190px;
    margin:20px auto;
    display:grid;
    place-items:center;
    border-radius:16px;
    background:#e8eaed;
    color:#111;
    font-size:54px;
    font-weight:900;
}

/* RPS */

.rps-buttons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:9px;
    margin:18px 0;
}

.rps-btn{
    width:90px;
    height:65px;
    border-radius:12px;
    border:1px solid var(--border);
    background:#151a20;
    color:white;
    font-size:25px;
}

/* COMPOSER */

.composer{
    padding:12px 16px 16px;
    background:var(--panel);
    border-top:1px solid var(--border);
}

.composer-box{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:8px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:14px;
}

textarea{
    flex:1;
    min-height:42px;
    max-height:150px;
    resize:none;
    border:0;
    outline:none;
    background:transparent;
    color:white;
    padding:10px;
}

.attach-btn,
.send-btn{
    height:42px;
    border:0;
    border-radius:9px;
}

.attach-btn{
    width:42px;
    background:transparent;
    color:#adb5c0;
    font-size:20px;
}

.send-btn{
    padding:0 18px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

.send-btn:disabled{
    opacity:.5;
}

/* OVERLAYS */

.overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000b;
    z-index:100;
}

.overlay.show{
    display:flex;
}

.panel{
    width:min(560px,calc(100vw - 25px));
    max-height:calc(100vh - 25px);
    overflow-y:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
    box-shadow:0 25px 80px #000b;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px;
    border-bottom:1px solid var(--border);
}

.panel-header h2{
    margin:0;
}

.panel-body{
    padding:18px;
}

/* CATEGORIES */

.category{
    margin-bottom:12px;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    background:var(--panel2);
}

.category-title{
    width:100%;
    padding:14px;
    border:0;
    background:transparent;
    color:var(--text);
    display:flex;
    justify-content:space-between;
    font-weight:700;
    text-align:left;
}

.category-body{
    display:none;
    padding:0 14px 14px;
}

.category.open .category-body{
    display:block;
}

.setting{
    margin-top:14px;
}

.setting label{
    display:block;
    margin-bottom:7px;
    color:#aab2bd;
    font-size:13px;
}

.setting input,
.setting select{
    width:100%;
    padding:10px;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
    background:#101419;
    color:white;
}

.setting input[type=range]{
    padding:0;
}

.setting-value{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.save-btn{
    width:100%;
    margin-top:8px;
    padding:12px;
    border:0;
    border-radius:9px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

/* GAME CREATOR */

.game-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.game-choice{
    min-height:100px;
    padding:13px;
    text-align:left;
    border-radius:12px;
    border:1px solid var(--border);
    background:#151a20;
    color:white;
}

.game-choice:hover{
    background:#20262e;
}

.game-choice strong{
    display:block;
    margin-bottom:5px;
}

.game-choice span{
    color:#818b97;
    font-size:12px;
}

/* DANGER */

.danger-zone{
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid #402529;
}

.danger-title{
    color:var(--danger);
    font-weight:700;
    margin-bottom:7px;
}

.danger-zone p{
    color:var(--muted);
    line-height:1.45;
}

.danger-btn{
    width:100%;
    padding:12px;
    border-radius:9px;
    border:1px solid #743333;
    background:#241719;
    color:#ff8585;
}

/* CONTEXT MENU */

.context-menu{
    position:fixed;
    display:none;
    width:160px;
    padding:5px;
    z-index:200;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:9px;
}

.context-menu.show{
    display:block;
}

.context-menu button{
    width:100%;
    padding:9px 10px;
    text-align:left;
    border:0;
    border-radius:6px;
    background:transparent;
    color:white;
}

.delete-option{
    color:#ff7777!important;
}

/* EMPTY */

.empty{
    height:100%;
    min-height:200px;
    display:grid;
    place-items:center;
    color:#656d78;
    text-align:center;
}

.empty strong{
    display:block;
    color:#aab2bd;
    margin-bottom:5px;
}

@media(max-width:600px){

    .header{
        padding:0 11px;
    }

    .messages{
        padding:15px 11px;
    }

    .channel{
        display:none;
    }

    .message-content{
        max-width:calc(100vw - 70px);
    }

    .game-grid{
        grid-template-columns:1fr;
    }

    .ttt{
        grid-template-columns:repeat(3,62px);
    }

    .ttt button{
        width:62px;
        height:62px;
    }

    .connect-board{
        grid-template-columns:repeat(7,36px);
    }

    .connect-cell{
        width:36px;
        height:36px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="logo">
        <div class="logo-icon">💬</div>
        <span>Chat</span>
        <span class="channel"># general</span>
    </div>

    <div class="header-actions">

        <button
            class="icon-btn"
            id="gamesBtn"
            title="Games"
        >🎮</button>

        <button
            class="icon-btn"
            id="settingsBtn"
            title="Settings"
        >⚙</button>

    </div>

</header>

<main
    class="messages"
    id="messages"
></main>

<div class="composer">

    <div class="composer-box">

        <textarea
            id="messageInput"
            rows="1"
            placeholder="Message #general"
        ></textarea>

        <button
            class="send-btn"
            id="sendBtn"
        >Send</button>

    </div>

</div>

</div>


<!-- GAME CREATOR -->

<div
    class="overlay"
    id="gamesOverlay"
>

<div class="panel">

<div class="panel-header">

    <h2>🎮 Games</h2>

    <button
        class="icon-btn"
        id="closeGames"
    >×</button>

</div>

<div class="panel-body">

<p style="color:#929aa5;line-height:1.5">
Choose a game to create a lobby. Other people can spectate,
but only people who press <b>Join</b> before you press
<b>Start</b> become players.
</p>

<div class="game-grid">

<button
    class="game-choice"
    data-game="ttt"
>
    <strong>⭕ Tic-Tac-Toe</strong>
    <span>2 players</span>
</button>

<button
    class="game-choice"
    data-game="connect4"
>
    <strong>🔴 Connect Four</strong>
    <span>2 players</span>
</button>

<button
    class="game-choice"
    data-game="dice"
>
    <strong>🎲 Dice Duel</strong>
    <span>2–6 players</span>
</button>

<button
    class="game-choice"
    data-game="higher"
>
    <strong>🃏 Higher or Lower</strong>
    <span>2–6 players</span>
</button>

<button
    class="game-choice"
    data-game="rps"
>
    <strong>✊ Rock Paper Scissors</strong>
    <span>2–6 players</span>
</button>

</div>

</div>
</div>
</div>


<!-- SETTINGS -->

<div
    class="overlay"
    id="settingsOverlay"
>

<div class="panel">

<div class="panel-header">

    <h2>Settings</h2>

    <button
        class="icon-btn"
        id="closeSettings"
    >×</button>

</div>

<div class="panel-body">

<div class="category open">

<button class="category-title">
    <span>👤 Profile</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Your name</label>

<input
    id="usernameInput"
    maxlength="24"
    placeholder="Enter your name"
>

</div>

<div class="setting">

<label>Device ID</label>

<input
    id="deviceIdInput"
    readonly
>

</div>

</div>
</div>


<div class="category">

<button class="category-title">
    <span>📝 Text</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Text size</label>

<input
    id="textSize"
    type="range"
    min="12"
    max="24"
    value="16"
>

<div
    class="setting-value"
    id="textSizeValue"
></div>

</div>

<div class="setting">

<label>Word spacing</label>

<input
    id="wordSpacing"
    type="range"
    min="0"
    max="12"
    value="0"
>

<div
    class="setting-value"
    id="wordSpacingValue"
></div>

</div>

<div class="setting">

<label>Line spacing</label>

<input
    id="lineSpacing"
    type="range"
    min="1"
    max="2"
    step=".05"
    value="1.45"
>

<div
    class="setting-value"
    id="lineSpacingValue"
></div>

</div>

</div>
</div>


<div class="category">

<button class="category-title">
    <span>💬 Chat</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Refresh rate</label>

<select id="refreshRate">

<option value="10000">10 seconds</option>
<option value="5000">5 seconds</option>
<option value="3000">3 seconds</option>
<option value="2000">2 seconds</option>
<option value="1000">1 second</option>
<option value="500" selected>0.5 seconds</option>
<option value="100">0.1 seconds</option>

</select>

</div>

<div class="setting">

<label>Show timestamps</label>

<select id="showTimestamps">
<option value="true">On</option>
<option value="false">Off</option>
</select>

</div>

<div class="setting">

<label>Compact messages</label>

<select id="compactMessages">
<option value="false">Off</option>
<option value="true">On</option>
</select>

</div>

</div>
</div>


<div class="category">

<button class="category-title">
    <span>🎨 Appearance</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Theme</label>

<select id="themeSelect">

<option value="dark">Dark</option>
<option value="midnight">Midnight</option>
<option value="slate">Slate</option>
<option value="black">Pure Black</option>
<option value="blue">Dark Blue</option>
<option value="purple">Dark Purple</option>
<option value="green">Dark Green</option>
<option value="red">Dark Red</option>
<option value="gray">Classic Gray</option>
<option value="light">Light</option>
<option value="oled">OLED</option>

</select>

</div>

<div class="setting">

<label>Corner roundness</label>

<input
    id="cornerRadius"
    type="range"
    min="0"
    max="25"
    value="12"
>

<div
    class="setting-value"
    id="cornerRadiusValue"
></div>

</div>

<div class="setting">

<label>UI scale</label>

<input
    id="uiScale"
    type="range"
    min=".8"
    max="1.2"
    step=".05"
    value="1"
>

<div
    class="setting-value"
    id="uiScaleValue"
></div>

</div>

</div>
</div>


<div class="category">

<button class="category-title">
    <span>⚙️ Behavior</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Enter to send</label>

<select id="enterToSend">
<option value="true">On</option>
<option value="false">Off</option>
</select>

</div>

<div class="setting">

<label>Auto-scroll</label>

<select id="autoScroll">
<option value="true">On</option>
<option value="false">Off</option>
</select>

</div>

</div>
</div>


<button
    class="save-btn"
    id="saveSettings"
>
Save settings
</button>


<div class="danger-zone">

<div class="danger-title">
⚠ Danger Zone
</div>

<p>
Remove every normal chat message. Game messages are also
cleaned up when their games are removed.
</p>

<button
    class="danger-btn"
    id="removeEverything"
>
Remove everything
</button>

</div>

</div>
</div>
</div>


<!-- CONFIRM -->

<div
    class="overlay"
    id="confirmOverlay"
>

<div class="panel">

<div class="panel-header">

<h2 id="confirmTitle">
Confirm
</h2>

</div>

<div class="panel-body">

<p
    id="confirmText"
    style="color:#9da5b0;line-height:1.5"
></p>

<div class="game-actions">

<button
    class="game-btn"
    id="confirmCancel"
>
Cancel
</button>

<button
    class="game-btn danger"
    id="confirmYes"
>
Confirm
</button>

</div>

</div>
</div>
</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const API_URL="/api/messages";
const CHANNEL="general";

/*
    Special messages begin with this marker.

    They are normal Supabase messages underneath,
    but this HTML never renders them as chat messages.
*/
const GAME_PREFIX="__CHAT_GAME_STATE__:";


/* =====================================================
   DEVICE
===================================================== */

let deviceId=localStorage.getItem("chat_device_id");

if(!deviceId){

    if(window.crypto && crypto.randomUUID){
        deviceId=crypto.randomUUID();
    }else{
        deviceId=
            Date.now().toString(36)+
            Math.random().toString(36).slice(2);
    }

    localStorage.setItem(

/* =====================================================

===================================================== */

async function apiPost(body){

    const response=
        await fetch(
            API_URL,
            {
                method:"POST",
                headers:{
                    "Content-Type":
                        "application/json"
                },
                body:
                    JSON.stringify(body)
            }
        );

    const data=
        await safeJson(response);

    if(!response.ok){

        throw new Error(
            data.error ||
            "Request failed."
        );
    }

    return data;
}


async function apiDelete(body){

    const response=
        await fetch(
            API_URL,
            {
                method:"DELETE",
                headers:{

                        "application/json"
                },
                body:
                    JSON.stringify(body)
            }
        );

    if(!response.ok){

async function apiPatch(body){

    const response=
        await fetch(
            API_URL,
            {
                method:"PATCH",
                headers:{
                    "Content-Type":
                        "application/json"
                },
                body:
                    JSON.stringify(body)
            }
        );

async function safeJson(response){

    const text=
        await response.text();

    if(!text)return {};

    try{
        return JSON.parse(text);
    }catch{
        return {
            error:text
        };
    }
}


/* =====================================================
   LOAD MESSAGES
===================================================== */

async function loadMessages(){

    if(syncing)return;

    syncing=true;

    try{

        const response=
            await fetch(
                API_URL+
                "?channel="+
                encodeURIComponent(
                    CHANNEL
                )+
                "&_="+
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        const data=
            await safeJson(response);

        if(!response.ok){

            throw new Error(
                data.error ||
                "Failed to load messages."
            );
        }

        const newMessages=
            Array.isArray(
                data.messages
            )
            ?data.messages
            :[];

        // Check if messages changed before updating
        const changed = messagesChanged(currentMessages, newMessages);
        
        if (changed) {
            currentMessages = newMessages;
            processGameMessages();
            renderMessages();
        }

    }catch(error){

        if(
            !currentMessages.length
        ){

            messagesEl.innerHTML=`
                <div class="empty">
                    <div>
                        <strong>Unable to load messages</strong>
                        ${escapeHtml(
                            error.message
                        )}
                    </div>
                </div>
            `;
        }

    }finally{

        syncing=false;
    }
}

// Check if messages arrays are different
function messagesChanged(oldMessages, newMessages) {
    if (oldMessages.length !== newMessages.length) return true;
    
    for (let i = 0; i < oldMessages.length; i++) {
        const oldMsg = oldMessages[i];
        const newMsg = newMessages[i];
        
        if (oldMsg.id !== newMsg.id) return true;
        if (oldMsg.message !== newMsg.message) return true;
        if (oldMsg.username !== newMsg.username) return true;
        if (oldMsg.edited !== newMsg.edited) return true;
        if (oldMsg.image !== newMsg.image) return true;
    }
    
    return false;
}


/* =====================================================
   GAME MESSAGE PARSING
===================================================== */

function isGameMessage(message){

    return (
        message &&
        typeof message.message==="string" &&
        message.message.startsWith(
            GAME_PREFIX
        )
    );
}


function parseGameMessage(message){

    if(!isGameMessage(message)){
        return null;
    }

    try{

        return JSON.parse(
            message.message.substring(
                GAME_PREFIX.length
            )
        );

    }catch{

        return null;
    }
}


function processGameMessages(){

    const map=new Map();

    for(const message of currentMessages){

        if(!isGameMessage(message)){
            continue;
        }

        const state=
            parseGameMessage(message);

        if(!state){
            continue;
        }

        if(
            state.type!=="game"
        ){
            continue;
        }

        /*
            Only the latest message for a
            game ID is used.
        */
        map.set(
            state.id,
            {
                ...state,
                messageId:
                    message.id,
                hostDeviceId:
                    state.hostDeviceId ||
                    message.device_id ||
                    ""
            }
        );
    }

    games=[
        ...map.values()
    ];
}


/* =====================================================
   RENDER MESSAGES - SMART UPDATE
===================================================== */

function renderMessages(){

    // Get all normal messages (non-game)
    const normal =
        currentMessages.filter(
            message =>
                !isGameMessage(message)
        );

    // Get active games
    const activeGames =
        games.filter(
            game =>
                game.status !== "finished" &&
                game.status !== "forcequit"
        );

    // If no messages and no games, show empty state
    if (!normal.length && !activeGames.length) {
        messagesEl.innerHTML = `
            <div class="empty">
                <div>
                    <strong>No messages yet</strong>
                    Be the first to send something.
                </div>
            </div>
        `;
        renderedElements.clear();
        return;
    }

    // Build the desired DOM structure as a document fragment
    const fragment = document.createDocumentFragment();
    const elementIds = [];

    // Add normal messages first (top)
    for (const message of normal) {
        const item = createMessageElement(message);
        fragment.appendChild(item);
        elementIds.push('msg_' + message.id);
    }

    // Add game messages last (bottom)
    for (const game of activeGames) {
        const gameEl = createGameElement(game);
        fragment.appendChild(gameEl);
        elementIds.push('game_' + game.id);
    }

    // Get current children
    const currentChildren = messagesEl.children;
    const currentIds = [];

    // Build list of current element IDs
    for (let i = 0; i < currentChildren.length; i++) {
        const child = currentChildren[i];
        if (child.dataset && child.dataset.id) {
            currentIds.push(child.dataset.id);
        } else {
            // If no data-id, treat it as a temporary element that should be replaced
            currentIds.push('__temp_' + i);
        }
    }

    // Compare and update
    const newChildren = Array.from(fragment.children);
    
    // If the structure is completely different, replace everything
    if (currentIds.length !== elementIds.length || 
        currentIds.some((id, idx) => id !== elementIds[idx])) {
        
        // Replace all children
        messagesEl.replaceChildren(fragment);
        
        // Store references
        renderedElements.clear();
        for (let i = 0; i < newChildren.length; i++) {
            const el = newChildren[i];
            if (el.dataset && el.dataset.id) {
                renderedElements.set(el.dataset.id, el);
            }
        }
        
        return;
    }

    // Update existing elements in place
    for (let i = 0; i < newChildren.length; i++) {
        const newEl = newChildren[i];
        const oldEl = currentChildren[i];
        
        // If the element ID matches, update its content
        if (newEl.dataset && newEl.dataset.id === oldEl.dataset.id) {
            // Replace the old element's content with the new element's content
            oldEl.replaceWith(newEl);
            renderedElements.set(newEl.dataset.id, newEl);
        } else {
            // IDs don't match, replace the whole thing
            oldEl.replaceWith(newEl);
            if (newEl.dataset && newEl.dataset.id) {
                renderedElements.set(newEl.dataset.id, newEl);
            }
        }
    }

    // Clean up any stale references
    const validIds = new Set(elementIds);
    for (const [id, el] of renderedElements) {
        if (!validIds.has(id)) {
            renderedElements.delete(id);
        }
    }
}

function createMessageElement(message) {

        document.createElement("div");

    top.className =
        "message-top";

    const name =
        document.createElement("span");

    name.className =
        "username";

    name.textContent =
        message.username ||
        "User";

    top.appendChild(name);

    if (settings.showTimestamps) {

        const time =
            document.createElement("span");

        time.className = "time";

        time.textContent =
            formatTime(
                message.created_at
            );

        top.appendChild(time);
    }

    if (message.edited) {

        const edited =
            document.createElement("span");

        edited.className =
            "edited";

        edited.textContent =
            "(edited)";

        top.appendChild(edited);
    }

    content.appendChild(top);

    if (message.message) {

        const text =
            document.createElement("div");

        text.className =
            "message-text";

        text.textContent =
            message.message;

        content.appendChild(text);
    }

    item.appendChild(avatar);
    item.appendChild(content);

    return item;
}

async function createGame(gameType){

    if(!settings.username){

        settingsBtn.click();

        alert(
            "Set your name before creating a game."
        );

        return;
    }

    /*
        One host can only own one game.
    */
    const existing=
        games.find(
            game=>
                game.hostDeviceId===
                    deviceId &&
                game.status!=="finished" &&
                game.status!=="forcequit"
        );

    if(existing){

        alert(
            "You are already hosting a game."
        );

        gamesOverlay.classList.remove(
            "show"
        );

        return;
    }

    const info=
        GAME_TYPES[gameType];

    if(!info)return;

    const game={

        type:"game",

        id:
            "game_"+

            Date.now().toString(36)+

            "_"+

            Math.random()
                .toString(36)
                .slice(2,8),

        gameType,

        name:
            info.name,

        icon:
            info.icon,

        host:
            settings.username,

        hostDeviceId:
            deviceId,

        status:
            "lobby",

        players:[

            {
                deviceId,
                username:
                    settings.username
            }

        ],

        maxPlayers:
            info.max,

        turn:0,

        turnIndex:0,

        createdAt:
            Date.now(),

        board:
            createInitialBoard(
                gameType
            ),

        winner:null,

        data:{}
    };

    /*
        The game state is stored as a
        special message created by the host.
    */
    try{

        await writeGameState(
            game
        );

        gamesOverlay.classList.remove(
            "show"
        );

        await loadMessages();

    }catch(error){

        alert(
            "Could not create game:\n\n"+
            error.message
        );
    }
}

function createInitialBoard(type){

    if(type==="ttt"){
        return Array(9).fill("");
    }

    if(type==="connect4"){
        return Array(42).fill("");
    }

    return [];
}

async function writeGameState(game){

    /*
        IMPORTANT:
        The state message uses the HOST device ID.

        That allows the host browser to request
        deletion of its game-state messages through
        the existing API.

    const payload=

        username:
            "__GAME__",

        channel:
            CHANNEL,

        message:
            payload,

        image:null,

        device_id:
            game.hostDeviceId
    });
}

            if(
                player.deviceId===
                game.hostDeviceId
            ){

                chip.classList.add(
                    "host"
                );
            }

            chip.textContent=
                player.username+
                (
                    player.deviceId===
                    game.hostDeviceId
                    ?" 👑"
                    :""
                );

            players.appendChild(chip);
        }
    );

    body.appendChild(players);


    /* TURN */

    if(
        game.status==="playing"
    ){

        const turn=
            document.createElement("div");

        turn.className=
            "turn-banner";

        const current=
            game.players[
                game.turnIndex %
                Math.max(
                    game.players.length,
                    1
                )
            ];

        if(current){

            turn.innerHTML=
                "Current turn: <strong>"+
                escapeHtml(
                    current.username
                )+
                "</strong>";
        }

        body.appendChild(turn);
    }


    /* GAME BOARD */

    const board=
        createGameBoard(
            game
        );

    if(board){
        body.appendChild(board);
    }


    /* ACTIONS */

    const actions=
        document.createElement("div");

    actions.className=
        "game-actions";


    if(game.status==="lobby"){

        const joined=
            game.players.some(
                p=>
                    p.deviceId===
                    deviceId
            );

        if(!joined){

            if(
                game.players.length<
                game.maxPlayers
            ){

                const join=
                    document.createElement(
                        "button"
                    );

                join.className=
                    "game-btn green";

                join.textContent=
                    "Join game";

                join.onclick=async()=>{

                    await joinGame(
                        game
                    );
                };

                actions.appendChild(
                    join
                );
            }

        }else{

            const leave=
                document.createElement(
                    "button"
                );

            leave.className=
                "game-btn";

            leave.textContent=
                "Leave";

            leave.onclick=async()=>{

                await leaveGame(
                    game
                );
            };

            actions.appendChild(
                leave
            );
        }


        if(
            game.hostDeviceId===
            deviceId
        ){

            const start=
                document.createElement(
                    "button"
                );

            start.className=
                "game-btn primary";

            start.textContent=
                "Start game";

            start.disabled=
                game.players.length<
                GAME_TYPES[
                    game.gameType
                ].min;

            start.onclick=async()=>{

                await startGame(
                    game
                );
            };

            actions.appendChild(
                start
            );

            const quit=
                document.createElement(
                    "button"
                );

            quit.className=
                "game-btn danger";

            quit.textContent=
                "Force quit";

            quit.onclick=async()=>{

                openConfirm(
                    "Force quit game?",
                    "Everyone will be removed from this game.",
                    ()=>forceQuitGame(
                        game
                    )
                );
            };

            actions.appendChild(
                quit
            );
        }

    }else if(
        game.status==="playing"
    ){

        const mine=
            game.players.some(
                p=>
                    p.deviceId===
                    deviceId
            );

        if(mine){

            const leave=
                document.createElement(
                    "button"
                );

            leave.className=
                "game-btn";

            leave.textContent=
                "Leave game";

            leave.onclick=async()=>{

                await leaveGame(
                    game
                );
            };

            actions.appendChild(
                leave
            );
        }


        if(
            game.hostDeviceId===
            deviceId
        ){

            const quit=
                document.createElement(
                    "button"
                );

            quit.className=
                "game-btn danger";

            quit.textContent=
                "Force quit";

            quit.onclick=async()=>{

                openConfirm(
                    "Force quit game?",
                    "Everyone will be removed and the temporary game data will be deleted.",
                    ()=>forceQuitGame(
                        game
                    )
                );
            };

            actions.appendChild(
                quit
            );
        }
    }


    body.appendChild(actions);

    card.appendChild(header);
    card.appendChild(body);

    wrapper.appendChild(card);

    return wrapper;
}


/* =====================================================

function getGameDescription(game){

    switch(game.gameType){

        case "ttt":
            return "Take turns placing your symbol. Get three in a row.";

        case "connect4":
            return "Drop pieces into the board. Get four in a row.";

        case "dice":
            return "Roll the dice when it is your turn. Highest total wins.";

        case "higher":

            return "Choose rock, paper or scissors when it is your turn.";

        default:
            return "Game in progress.";
    }
}


/* =====================================================
   GAME BOARD
===================================================== */

function createGameBoard(game){

    if(game.status!=="playing"){
        return null;
    }

    if(game.gameType==="ttt"){
        return createTTT(game);
    }

    if(game.gameType==="connect4"){
        return createConnect4(game);
    }

    if(game.gameType==="dice"){
        return createDice(game);
    }

    if(game.gameType==="higher"){
        return createHigher(game);
    }

    if(game.gameType==="rps"){
        return createRPS(game);
    }

    return null;
}


/* =====================================================
   TIC TAC TOE
===================================================== */

function createTTT(game){

    const board=

    board.className="ttt";

            p=>
                p.deviceId===
                deviceId
        );

            game.turnIndex %

        ];

    for(let i=0;i<9;i++){

            );

            game.board[i] || "";

            !myTurn ||
            !!game.board[i] ||
            !!game.winner;

        button.onclick=async()=>{

            await performTTTMove(
                game,
                i
            );
        };

        board.appendChild(button);
    }

    return board;

async function performTTTMove(
    game,
    index
){

    const current=
        game.players[
            game.turnIndex %
            game.players.length
        ];

    if(
        !current ||
        current.deviceId!==deviceId ||
        game.board[index]
    ){
        return;
    }

    const copy=
        JSON.parse(
            JSON.stringify(game)
        );

    copy.board[index]=
        game.turnIndex%2===0
            ?"X"
            :"O";

    const result=
        checkTTT(
            copy.board
        );

    if(result){

        copy.winner=
            result;

        copy.status=
            "finished";

    }else{

        copy.turnIndex++;
    }

    await publishGameAndCleanup(
        game,
        copy
    );
}


function checkTTT(board){

    const wins=[

        [0,1,2],
        [3,4,5],
        [6,7,8],

        [0,3,6],
        [1,4,7],
        [2,5,8],

        [0,4,8],
        [2,4,6]
    ];

    for(const line of wins){

        const [a,b,c]=line;

        if(
            board[a] &&
            board[a]===board[b] &&
            board[a]===board[c]
        ){

            return board[a];
        }
    }

    if(
        board.every(Boolean)
    ){
        return "draw";
    }

    return null;
}


/* =====================================================

===================================================== */

function createConnect4(game){

    const board=

    board.className=

            p=>
                p.deviceId===

        ];

    const myTurn=

    for(let row=0;row<6;row++){

        for(
            let col=0;
            col<7;
            col++
        ){

            const index=
                row*7+col;

            const cell=
                document.createElement(

                );

            cell.className=
                "connect-cell";

            if(
                game.board[index]==="R"
            ){
                cell.classList.add(

                );
            }

            if(

            ){

                );

            cell.onclick=async()=>{

}


async function performConnectMove(
    game,
    column
){

    const current=
        game.players[
            game.turnIndex %
            game.players.length
        ];

    if(
        !current ||
        current.deviceId!==deviceId
    ){
        return;
    }

    const copy=
        JSON.parse(
            JSON.stringify(game)
        );

    const piece=
        game.turnIndex%2===0
            ?"R"
            :"Y";

    let placed=-1;

    for(
        let row=5;
        row>=0;
        row--
    ){

        const index=
            row*7+column;

        if(!copy.board[index]){

            copy.board[index]=piece;

            placed=index;

            break;
        }
    }

    if(placed===-1){
        return;
    }

    if(
        checkConnectWin(
            copy.board,
            placed
        )
    ){

        copy.winner=
            current.username;

        copy.status=
            "finished";

    }else if(
        copy.board.every(Boolean)
    ){

        copy.winner=
            "draw";

        copy.status=
            "finished";

    }else{

        copy.turnIndex++;
    }

    await publishGameAndCleanup(
        game,
        copy
    );
}


function checkConnectWin(
    board,
    index
){

    const row=
        Math.floor(index/7);

    const col=
        index%7;

    const value=
        board[index];

    const dirs=[
        [1,0],
        [0,1],
        [1,1],
        [1,-1]
    ];

    for(const [dr,dc] of dirs){

        let count=1;

        for(
            let direction of [-1,1]
        ){

            let r=row+
                dr*direction;

            let c=col+
                dc*direction;

            while(
                r>=0 &&
                r<6 &&
                c>=0 &&
                c<7 &&
                board[r*7+c]===value
            ){

                count++;

                r+=dr*direction;
                c+=dc*direction;
            }
        }

        if(count>=4){
            return true;
        }
    }

    return false;
}

async function performRPS(
    game,
    choice
){

    const current=
        game.players[
            game.turnIndex %
            game.players.length
        ];

    if(
        !current ||
        current.deviceId!==deviceId
    ){
        return;
    }

    const copy=
        JSON.parse(
            JSON.stringify(game)
        );

    const options=[
        "rock",
        "paper",
        "scissors"
    ];

    const computer=
        options[
            Math.floor(
                Math.random()*
                options.length
            )
        ];

    let result;

    if(choice===computer){

    }else if(

        (
            choice==="rock" &&

        ) ||
        (

        ) ||
        (

        )

    ){

/* =====================================================
   JOIN
===================================================== */

async function joinGame(game){

    if(
        game.status!=="lobby"
    ){
        return;
    }

    if(
        game.players.some(
            p=>
                p.deviceId===
                deviceId
        )
    ){
        return;
    }

    if(
        game.players.length>=
        game.maxPlayers
    ){
        return;
    }

    /*
        The join is represented by
        a temporary state message.
    */

    const copy=
        JSON.parse(
            JSON.stringify(game)
        );

    copy.players.push({

        deviceId,

        username:
            settings.username
    });

    /*
        Because the game state belongs
        to the host, we publish the
        updated state using the host ID.
    */

    await writeGameState(copy);

    await loadMessages();
}


/* =====================================================
   LEAVE
===================================================== */

async function leaveGame(game){

    const copy=
        JSON.parse(
            JSON.stringify(game)
        );

    copy.players=
        copy.players.filter(
            player=>
                player.deviceId!==deviceId
        );

    /*
        If nobody is left, remove the game.
    */

    if(copy.players.length===0){

        await removeGameMessages(
            game
        );

        await loadMessages();

        return;
    }

    /*
        If host leaves, the next player
        becomes host.
    */

    if(
        game.hostDeviceId===
        deviceId
    ){

        const newHost=
            copy.players[0];

        copy.host=
            newHost.username;

        copy.hostDeviceId=
            newHost.deviceId;
    }

    if(
        copy.status==="playing" &&
        copy.turnIndex>=
        copy.players.length
    ){

        copy.turnIndex=0;
    }

    await writeGameState(
        copy
    );

    /*
        Remove the old state.
        This is requested using the
        previous host ID.
    */
    await deleteStateMessage(
        game
    );

    await loadMessages();
}


/* =====================================================
   START GAME
===================================================== */

async function startGame(game){

    if(
        game.hostDeviceId!==deviceId
    ){
        return;
    }

    if(
        game.players.length<
        GAME_TYPES[
            game.gameType
        ].min
    ){
        return;
    }

    const copy=
        JSON.parse(
            JSON.stringify(game)
        );

    copy.status=
        "playing";

    copy.turnIndex=0;

    if(
        copy.gameType==="higher"
    ){

        copy.data.currentCard=
            Math.floor(
                Math.random()*13
            )+1;
    }

    await publishGameAndCleanup(
        game,
        copy
    );
}


/* =====================================================
   FORCE QUIT
===================================================== */

async function forceQuitGame(game){

    if(
        game.hostDeviceId!==deviceId
    ){
        return;
    }

    try{

        await removeGameMessages(
            game
        );

        await loadMessages();

    }catch(error){

        alert(
            "Could not remove game:\n\n"+
            error.message
        );
    }
}


/* =====================================================
   PUBLISH NEW STATE
===================================================== */

async function publishGameAndCleanup(
    oldGame,
    newGame
){

    if(
        newGame.status==="finished"
    ){

        /*
            The finished game is not rendered.
            Remove temporary state.
        */

        await removeGameMessages(
            oldGame
        );

        await loadMessages();

        return;
    }

    await writeGameState(
        newGame
    );

    /*
        Remove previous state message.
    */

    if(
        oldGame.messageId
    ){

        try{

            await apiDelete({

                id:
                    oldGame.messageId,

                device_id:
                    oldGame.hostDeviceId
            });

        }catch{

            /*
                Do not break the game if
                an old temporary message has
                already disappeared.
            */
        }
    }

    await loadMessages();
}


/* =====================================================
   REMOVE GAME MESSAGES
===================================================== */

async function removeGameMessages(game){

    /*
        Find ALL messages belonging to
        this game and request deletion.

        The game messages use the host
        device ID, allowing the existing
        DELETE endpoint to remove them.
    */

    const gameMessages=
        currentMessages.filter(
            message=>{

                if(
                    !isGameMessage(message)
                ){
                    return false;
                }

                const state=
                    parseGameMessage(
                        message
                    );

                return (
                    state &&
                    state.id===
                    game.id
                );
            }
        );

    /*
        Delete newest/known messages.
    */

    for(
        const message
        of gameMessages
    ){

        try{

            await apiDelete({

                id:
                    message.id,

                device_id:
                    game.hostDeviceId
            });

        }catch{

            /*
                Ignore already deleted
                messages.
            */
        }
    }
}


async function deleteStateMessage(game){

    if(!game.messageId){
        return;
    }

    try{

        await apiDelete({

            id:
                game.messageId,

            device_id:
                game.hostDeviceId
        });

    }catch{

        /* Already removed. */
    }
}


/* =====================================================
   REFRESH
===================================================== */

function restartRefresh(){

    if(refreshTimer){

        clearInterval(
            refreshTimer
        );
    }

    /*
        Games synchronize every 0.5 seconds
        regardless of the normal chat refresh
        setting.

        This keeps game controls responsive.
    */

    refreshTimer=
        setInterval(
            loadMessages,
            500
        );
}


/* =====================================================
   CONFIRM
===================================================== */

function openConfirm(
    title,
    text,
    callback
){

    confirmTitle.textContent=
        title;

    confirmText.textContent=
        text;

    confirmCallback=
        callback;

    confirmOverlay.classList.add(
        "show"
    );
}


confirmCancel.onclick=()=>{

    confirmOverlay.classList.remove(
        "show"
    );

    confirmCallback=null;
};


confirmYes.onclick=async()=>{

    const callback=
        confirmCallback;

    confirmOverlay.classList.remove(
        "show"
    );

    confirmCallback=null;

    if(callback){

        try{

            await callback();

        }catch(error){

            alert(
                error.message
            );
        }
    }
};


/* =====================================================
   REMOVE EVERYTHING
===================================================== */

removeEverything.onclick=()=>{

    openConfirm(
        "Remove everything?",
        "This permanently removes every message from the chat.",
        async()=>{

            try{

                /*
                    Existing API supports delete_all.
                */

                await apiDelete({

                    delete_all:true
                });

                currentMessages=[];
                games=[];
                renderedElements.clear();

                renderMessages();

            }catch(error){

                alert(
                    "Failed to wipe chat:\n\n"+
                    error.message
                );
            }
        }
    );
};


/* =====================================================
   HELPERS
===================================================== */

function formatTime(date){

    if(!date)return "";

    return new Date(date)
        .toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );
}


function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =====================================================
   START
===================================================== */

loadSettingsUI();

applySettings();

loadMessages();

</script>
