<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat</title>

<style>
*{box-sizing:border-box}

:root{
    --bg:#0b0d10;
    --panel:#111419;
    --panel2:#181c22;
    --border:#292f38;
    --text:#edf0f4;
    --muted:#7e8793;
    --accent:#e8eaed;
    --danger:#ff7070;
    --radius:12px;
    --ui-scale:1;
    --text-size:16px;
    --word-spacing:0px;
    --line-spacing:1.45;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

body{
    overflow:hidden;
    font-size:calc(16px * var(--ui-scale));
}

button,input,textarea,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:64px;
    min-height:64px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel);
    border-bottom:1px solid var(--border);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
}

.logo-icon{
    width:35px;
    height:35px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:var(--panel2);
    border:1px solid var(--border);
}

.channel{
    color:var(--muted);
    font-weight:400;
}

.icon-btn{
    width:39px;
    height:39px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
}

.icon-btn:hover{
    filter:brightness(1.15);
}

/* MESSAGES */

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    display:flex;
    gap:11px;
    margin-bottom:17px;
}

.message.compact{
    margin-bottom:6px;
}

.avatar{
    flex:0 0 40px;
    width:40px;
    height:40px;
    display:grid;
    place-items:center;
    border-radius:var(--radius);
    background:var(--panel2);
    border:1px solid var(--border);
    font-weight:700;
}

.message-content{
    min-width:0;
    max-width:min(850px,calc(100vw - 90px));
}

.message-top{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:3px;
}

.username{
    font-weight:700;
}

.time,.edited{
    color:var(--muted);
    font-size:11px;
}

.message-text{
    color:#d8dde4;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    font-size:var(--text-size);
    word-spacing:var(--word-spacing);
    line-height:var(--line-spacing);
}

.message-image{
    display:block;
    max-width:min(500px,80vw);
    max-height:500px;
    margin-top:8px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:#000;
    object-fit:contain;
    cursor:pointer;
}

/* COMPOSER */

.composer{
    padding:12px 16px 16px;
    background:var(--panel);
    border-top:1px solid var(--border);
}

.composer-box{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:8px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:14px;
}

textarea{
    flex:1;
    min-height:42px;
    max-height:150px;
    resize:none;
    border:0;
    outline:none;
    background:transparent;
    color:white;
    padding:10px;
}

.attach-btn,
.send-btn{
    height:42px;
    border:0;
    border-radius:9px;
}

.attach-btn{
    width:42px;
    background:transparent;
    color:#adb5c0;
    font-size:20px;
}

.attach-btn:hover{
    background:#242932;
}

.send-btn{
    padding:0 18px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

.send-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* OVERLAYS */

.overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.72);
    z-index:100;
}

.overlay.show{
    display:flex;
}

.panel{
    width:min(520px,calc(100vw - 25px));
    max-height:calc(100vh - 25px);
    overflow-y:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
    box-shadow:0 25px 80px #000b;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px;
    border-bottom:1px solid var(--border);
}

.panel-header h2{
    margin:0;
}

.panel-body{
    padding:18px;
}

/* SETTINGS */

.category{
    margin-bottom:12px;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    background:var(--panel2);
}

.category-title{
    width:100%;
    padding:14px;
    border:0;
    background:transparent;
    color:var(--text);
    display:flex;
    justify-content:space-between;
    font-weight:700;
    text-align:left;
}

.category-title span:last-child{
    color:var(--muted);
}

.category-body{
    display:none;
    padding:0 14px 14px;
}

.category.open .category-body{
    display:block;
}

.setting{
    margin-top:14px;
}

.setting label{
    display:block;
    margin-bottom:7px;
    color:#aab2bd;
    font-size:13px;
}

.setting input,
.setting select{
    width:100%;
    padding:10px;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
    background:#101419;
    color:white;
}

.setting input[type="range"]{
    padding:0;
}

.setting-value{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.save-btn{
    width:100%;
    margin-top:8px;
    padding:12px;
    border:0;
    border-radius:9px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

/* DANGER */

.danger-zone{
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid #402529;
}

.danger-title{
    color:var(--danger);
    font-weight:700;
    margin-bottom:7px;
}

.danger-zone p{
    color:var(--muted);
    line-height:1.45;
}

.danger-btn{
    width:100%;
    padding:12px;
    border-radius:9px;
    border:1px solid #743333;
    background:#241719;
    color:#ff8585;
}

/* CONTEXT MENU */

.context-menu{
    position:fixed;
    display:none;
    width:160px;
    padding:5px;
    z-index:200;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:9px;
    box-shadow:0 15px 40px #0009;
}

.context-menu.show{
    display:block;
}

.context-menu button{
    width:100%;
    padding:9px 10px;
    text-align:left;
    border:0;
    border-radius:6px;
    background:transparent;
    color:var(--text);
}

.context-menu button:hover{
    background:#252b33;
}

.delete-option{
    color:#ff7777!important;
}

/* IMAGE VIEWER */

.image-viewer{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000f;
    z-index:300;
}

.image-viewer.show{
    display:flex;
}

.full-image{
    max-width:95vw;
    max-height:90vh;
    object-fit:contain;
}

.back-image{
    position:absolute;
    top:18px;
    left:18px;
    padding:10px 16px;
    border-radius:9px;
    border:1px solid #3a4049;
    background:#171b21;
    color:white;
}

/* DIALOG */

.dialog{
    width:min(450px,calc(100vw - 30px));
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
}

.dialog h2{
    margin-top:0;
}

.dialog p{
    color:#aab2bd;
    line-height:1.5;
}

.dialog-buttons{
    display:flex;
    gap:8px;
    justify-content:flex-end;
}

.dialog-buttons button{
    padding:10px 16px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#20252c;
    color:white;
}

.dialog-buttons .danger{
    background:#6b2929;
    border-color:#813434;
}

/* EMPTY */

.empty{
    height:100%;
    display:grid;
    place-items:center;
    color:#656d78;
    text-align:center;
}

.empty strong{
    display:block;
    color:#aab2bd;
    margin-bottom:5px;
}

/* WINDOWS NOTIFICATION PREVIEW */

.windows-notification{
    position:fixed;
    right:18px;
    bottom:18px;
    width:min(390px,calc(100vw - 30px));
    background:#202020;
    border:1px solid #4b4b4b;
    border-radius:8px;
    box-shadow:0 18px 50px #000b;
    padding:14px;
    z-index:1000;
    display:none;
    animation:notificationIn .25s ease;
}

.windows-notification.show{
    display:block;
}

.notification-top{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:9px;
}

.notification-icon{
    width:30px;
    height:30px;
    display:grid;
    place-items:center;
    background:#303030;
    border-radius:5px;
}

.notification-title{
    font-weight:700;
    flex:1;
}

.notification-close{
    background:none;
    border:0;
    color:#aaa;
    font-size:18px;
}

.notification-body{
    color:#e5e5e5;
    font-size:14px;
    line-height:1.4;
    overflow-wrap:anywhere;
}

.notification-link{
    color:#58a6ff;
    text-decoration:underline;
    cursor:pointer;
}

@keyframes notificationIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:600px){

    .header{
        padding:0 11px;
    }

    .messages{
        padding:15px 11px;
    }

    .channel{
        display:none;
    }

    .message-content{
        max-width:calc(100vw - 70px);
    }

    .windows-notification{
        right:10px;
        bottom:10px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="logo">
        <div class="logo-icon">💬</div>
        <span>Chat</span>
        <span class="channel"># general</span>
    </div>

    <button
        class="icon-btn"
        id="settingsBtn"
        title="Settings"
    >⚙</button>

</header>

<main class="messages" id="messages"></main>

<div class="composer">

    <div class="composer-box">

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
        >

        <button
            class="attach-btn"
            id="attachBtn"
            title="Choose image"
        >＋</button>

        <textarea
            id="messageInput"
            rows="1"
            placeholder="Message #general"
        ></textarea>

        <button
            class="send-btn"
            id="sendBtn"
        >Send</button>

    </div>

</div>

</div>


<!-- SETTINGS -->

<div class="overlay" id="settingsOverlay">

<div class="panel">

<div class="panel-header">

    <h2>Settings</h2>

    <button class="icon-btn" id="closeSettings">×</button>

</div>

<div class="panel-body">

<!-- PROFILE -->

<div class="category open">

<button class="category-title">
    <span>👤 Profile</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Your name</label>
<input id="usernameInput" maxlength="24" placeholder="Enter your name">
</div>

<div class="setting">
<label>Device ID</label>
<input id="deviceIdInput" readonly>
</div>

</div>
</div>


<!-- TEXT -->

<div class="category">

<button class="category-title">
    <span>📝 Text</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Text size</label>
<input id="textSize" type="range" min="12" max="24" step="1">
<div class="setting-value" id="textSizeValue"></div>
</div>

<div class="setting">
<label>Word spacing</label>
<input id="wordSpacing" type="range" min="0" max="12" step="1">
<div class="setting-value" id="wordSpacingValue"></div>
</div>

<div class="setting">
<label>Line spacing</label>
<input id="lineSpacing" type="range" min="1" max="2" step=".05">
<div class="setting-value" id="lineSpacingValue"></div>
</div>

</div>
</div>


<!-- CHAT -->

<div class="category">

<button class="category-title">
    <span>💬 Chat</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Refresh rate</label>

<select id="refreshRate">
<option value="10000">10 seconds</option>
<option value="5000">5 seconds</option>
<option value="3000">3 seconds</option>
<option value="2000">2 seconds</option>
<option value="1000">1 second</option>
<option value="500">0.5 seconds</option>
<option value="100">0.1 seconds</option>
</select>
</div>

<div class="setting">
<label>Show timestamps</label>
<select id="showTimestamps">
<option value="true">On</option>
<option value="false">Off</option>
</select>
</div>

<div class="setting">
<label>Compact messages</label>
<select id="compactMessages">
<option value="false">Off</option>
<option value="true">On</option>
</select>
</div>

</div>
</div>


<!-- APPEARANCE -->

<div class="category">

<button class="category-title">
    <span>🎨 Appearance</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Theme</label>

<select id="themeSelect">
<option value="dark">Dark</option>
<option value="midnight">Midnight</option>
<option value="slate">Slate</option>
<option value="black">Pure Black</option>
<option value="blue">Dark Blue</option>
<option value="purple">Dark Purple</option>
<option value="green">Dark Green</option>
<option value="red">Dark Red</option>
<option value="gray">Classic Gray</option>
<option value="light">Light</option>
<option value="oled">OLED</option>
</select>
</div>

<div class="setting">
<label>Corner roundness</label>
<input id="cornerRadius" type="range" min="0" max="25">
<div class="setting-value" id="cornerRadiusValue"></div>
</div>

<div class="setting">
<label>UI scale</label>
<input id="uiScale" type="range" min=".8" max="1.2" step=".05">
<div class="setting-value" id="uiScaleValue"></div>
</div>

</div>
</div>


<!-- NOTIFICATIONS -->

<div class="category">

<button class="category-title">
    <span>🔔 Notifications</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Notification sound</label>

<select id="notificationSound">
<option value="false">Off</option>
<option value="true">On</option>
</select>
</div>

<div class="setting">
<label>Sound</label>

<select id="notificationSoundType">
<option value="1">1 — Classic</option>
<option value="2">2 — Soft</option>
<option value="3">3 — Double Beep</option>
<option value="4">4 — Digital</option>
<option value="5">5 — Bell</option>
<option value="6">6 — Rising</option>
<option value="7">7 — Falling</option>
<option value="8">8 — Pulse</option>
<option value="9">9 — Alert</option>
<option value="10">10 — Deep</option>
<option value="11">11 — Nuclear Alarm</option>
<option value="12">12 — Opera</option>
</select>
</div>

<div class="setting">
<label>Sound volume</label>
<input id="notificationVolume" type="range" min="0" max="100" value="70">
<div class="setting-value" id="notificationVolumeValue">70%</div>
</div>

<div class="setting">
<label>Sound duration</label>

<select id="notificationDuration">
<option value="500">0.5 second</option>
<option value="1000">1 second</option>
<option value="2000">2 seconds</option>
<option value="3000">3 seconds</option>
<option value="5000">5 seconds</option>
<option value="10000">10 seconds</option>
</select>
</div>

<div class="setting">
<label>Desktop notifications</label>

<select id="desktopNotifications">
<option value="false">Off</option>
<option value="true">On</option>
</select>
</div>

<div class="setting">
<label>Mention notifications</label>

<select id="mentionNotifications">
<option value="false">Off</option>
<option value="true">On</option>
</select>
</div>

<div class="setting">

<button
    class="save-btn"
    id="testNotification"
    type="button"
>
Test Windows notification
</button>

</div>

</div>
</div>


<!-- BEHAVIOR -->

<div class="category">

<button class="category-title">
    <span>⚙️ Behavior</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Enter to send</label>
<select id="enterToSend">
<option value="true">On</option>
<option value="false">Off</option>
</select>
</div>

<div class="setting">
<label>Auto-scroll</label>
<select id="autoScroll">
<option value="true">On</option>
<option value="false">Off</option>
</select>
</div>

<div class="setting">
<label>Confirm before deleting</label>
<select id="confirmDelete">
<option value="true">On</option>
<option value="false">Off</option>
</select>
</div>

</div>
</div>


<button class="save-btn" id="saveSettings">
Save settings
</button>


<!-- DANGER -->

<div class="danger-zone">

<div class="danger-title">
    ⚠ Danger Zone
</div>

<p>
Remove every message from the chat permanently.
This affects everyone using the chat.
</p>

<button class="danger-btn" id="removeEverything">
Remove everything
</button>

</div>

</div>
</div>
</div>


<!-- CONTEXT MENU -->

<div class="context-menu" id="contextMenu">

<button id="editMessage">
Edit
</button>

<button class="delete-option" id="deleteMessage">
Delete
</button>

</div>


<!-- IMAGE VIEWER -->

<div class="image-viewer" id="imageViewer">

<button class="back-image" id="backImage">
← Back
</button>

<img class="full-image" id="fullImage" alt="Full image">

</div>


<!-- DIALOG -->

<div class="overlay" id="dialogOverlay">

<div class="dialog">

<h2 id="dialogTitle">Confirm</h2>

<p id="dialogText"></p>

<div class="dialog-buttons">

<button id="dialogCancel">
Cancel
</button>

<button class="danger" id="dialogConfirm">
Yes
</button>

</div>

</div>
</div>


<!-- WINDOWS STYLE NOTIFICATION -->

<div
    class="windows-notification"
    id="windowsNotification"
>

<div class="notification-top">

<div class="notification-icon">
💬
</div>

<div class="notification-title">
Chat
</div>

<button
    class="notification-close"
    id="notificationClose"
>
×
</button>

</div>

<div
    class="notification-body"
    id="notificationBody"
>
New message
</div>

</div>


<script>

const API_URL="/api/messages";
const CHANNEL="general";


/* =========================================================
DEVICE
========================================================= */

let deviceId=localStorage.getItem("chat_device_id");

if(!deviceId){

    deviceId=crypto.randomUUID();

    localStorage.setItem(
        "chat_device_id",
        deviceId
    );
}


/* =========================================================
SETTINGS
========================================================= */

const defaults={

    username:"",

    theme:"dark",

    refreshRate:500,

    showTimestamps:true,

    compactMessages:false,

    textSize:16,

    wordSpacing:0,

    lineSpacing:1.45,

    cornerRadius:12,

    uiScale:1,

    notificationSound:true,

    notificationSoundType:1,

    notificationVolume:70,

    notificationDuration:1000,

    desktopNotifications:true,

    mentionNotifications:true,

    enterToSend:true,

    autoScroll:true,

    confirmDelete:true

};


function getSetting(key){

    const value=
        localStorage.getItem(
            "chat_"+key
        );

    if(value===null){
        return defaults[key];
    }

    if(
        value==="true"||
        value==="false"
    ){
        return value==="true";
    }

    const number=Number(value);

    return Number.isNaN(number)
        ?value
        :number;
}


let settings={};

Object.keys(defaults).forEach(
    key=>{
        settings[key]=getSetting(key);
    }
);


/* =========================================================
ELEMENTS
========================================================= */

const messagesEl=
    document.getElementById("messages");

const messageInput=
    document.getElementById("messageInput");

const sendBtn=
    document.getElementById("sendBtn");

const imageInput=
    document.getElementById("imageInput");

const attachBtn=
    document.getElementById("attachBtn");

const settingsBtn=
    document.getElementById("settingsBtn");

const settingsOverlay=
    document.getElementById("settingsOverlay");

const closeSettings=
    document.getElementById("closeSettings");

const saveSettings=
    document.getElementById("saveSettings");

const usernameInput=
    document.getElementById("usernameInput");

const deviceIdInput=
    document.getElementById("deviceIdInput");

const themeSelect=
    document.getElementById("themeSelect");

const refreshRate=
    document.getElementById("refreshRate");

const showTimestamps=
    document.getElementById("showTimestamps");

const compactMessages=
    document.getElementById("compactMessages");

const textSize=
    document.getElementById("textSize");

const wordSpacing=
    document.getElementById("wordSpacing");

const lineSpacing=
    document.getElementById("lineSpacing");

const cornerRadius=
    document.getElementById("cornerRadius");

const uiScale=
    document.getElementById("uiScale");

const notificationSound=
    document.getElementById("notificationSound");

const notificationSoundType=
    document.getElementById(
        "notificationSoundType"
    );

const notificationVolume=
    document.getElementById(
        "notificationVolume"
    );

const notificationDuration=
    document.getElementById(
        "notificationDuration"
    );

const desktopNotifications=
    document.getElementById(
        "desktopNotifications"
    );

const mentionNotifications=
    document.getElementById(
        "mentionNotifications"
    );

const testNotification=
    document.getElementById(
        "testNotification"
    );

/* =========================================================
SETTINGS APPLY
========================================================= */

function applySettings(){

    document.documentElement.style.setProperty(
        "--text-size",
        settings.textSize+"px"
    );

    document.documentElement.style.setProperty(
        "--word-spacing",
        settings.wordSpacing+"px"
    );

    document.documentElement.style.setProperty(
        "--line-spacing",
        settings.lineSpacing
    );

    document.documentElement.style.setProperty(
        "--radius",
        settings.cornerRadius+"px"
    );

    document.documentElement.style.setProperty(
        "--ui-scale",
        settings.uiScale
    );

    applyTheme(settings.theme);

    renderMessages();

    startRefreshTimer();
}


/* =========================================================
THEMES
========================================================= */

function applyTheme(name){

    const themes={

        dark:["#0b0d10","#111419"],

        midnight:["#080b14","#101522"],

        slate:["#101418","#171d22"],

        black:["#000","#090909"],

        blue:["#091018","#101c29"],

        purple:["#100b17","#191021"],

        green:["#09120d","#101b15"],

        red:["#140b0b","#1e1111"],

        gray:["#151515","#202020"],

        light:["#eeeeee","#fff"],

        oled:["#000","#000"]

    };

    const t=
        themes[name]||
        themes.dark;

    document.documentElement.style.setProperty(
        "--bg",
        t[0]
    );

    document.documentElement.style.setProperty(
        "--panel",
        t[1]
    );

    document.body.style.background=t[0];
}

/* =========================================================
IMAGE RESIZE
========================================================= */

function resizeImage(file){

    return new Promise(
        (resolve,reject)=>{

            const reader=
                new FileReader();

            reader.onload=()=>{

                const img=
                    new Image();

                img.onload=()=>{

                    let width=
                        img.width;

                    let height=
                        img.height;

                    const max=1500;

                    if(
                        width>max||
                        height>max
                    ){

                        const scale=
                            Math.min(
                                max/width,
                                max/height
                            );

                        width=
                            Math.round(
                                width*scale
                            );

                        height=
                            Math.round(
                                height*scale
                            );
                    }

                    const canvas=
                        document.createElement(
                            "canvas"
                        );

                    canvas.width=
                        width;

                    canvas.height=
                        height;

                    const ctx=
                        canvas.getContext(
                            "2d"
                        );

                    ctx.drawImage(
                        img,
                        0,
                        0,
                        width,
                        height
                    );

                    resolve(
                        canvas.toDataURL(
                            "image/jpeg",
                            .78
                        )
                    );

                };

                img.onerror=reject;

                img.src=
                    reader.result;
            };

            reader.onerror=reject;

            reader.readAsDataURL(file);

        }
    );
}

async function sendMessage(){

    const text=
        messageInput.value.trim();

    if(!settings.username){

        settingsBtn.click();

        usernameInput.focus();

        alert(
            "Set your name in Settings first."
        );

        return;
    }

    if(!text&&!selectedFile){
        return;
    }

    sendBtn.disabled=true;

    try{

        let image=null;

        if(selectedFile){

            image=
                await resizeImage(
                    selectedFile
                );
        }

        const response=
            await fetch(
                API_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        username:
                            settings.username,

                        channel:
                            CHANNEL,

                        message:
                            text,

                        image:
                            image,

                        device_id:
                            deviceId

                    })
                }
            );

        const data=
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error||
                "Failed to send message."
            );
        }

        messageInput.value="";

        messageInput.style.height=
            "auto";

        selectedFile=null;

        imageInput.value="";

        attachBtn.textContent="＋";

        await loadMessages();

    }catch(error){

        alert(
            "Failed to send:\n\n"+
            error.message
        );

    }finally{

        sendBtn.disabled=false;

    }
}


/* =========================================================
LOAD
========================================================= */

async function loadMessages(){

    try{

        const response=
            await fetch(
                API_URL+
                "?channel="+
                encodeURIComponent(
                    CHANNEL
                ),
                {
                    cache:"no-store"
                }
            );

        const data=
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error||
                "Failed to load messages."
            );
        }

        const newMessages=
            Array.isArray(data.messages)
            ?data.messages
            :[];

        /*
         * Detect messages that appeared since
         * the previous refresh.
         */

        if(!firstMessageLoad){

            const newOnes=
                newMessages.filter(
                    msg=>
                        msg.id &&
                        !lastKnownMessageIds.has(
                            msg.id
                        )
                );

            for(
                const message
                of newOnes
            ){

                handleIncomingMessage(
                    message
                );

            }
        }

        currentMessages=
            newMessages;

        lastKnownMessageIds=
            new Set(
                currentMessages
                .map(
                    message=>message.id
                )
                .filter(Boolean)
            );

        firstMessageLoad=false;

        renderMessages();

    }catch(error){

        messagesEl.innerHTML=`
            <div class="empty">
                <div>
                    <strong>
                        Unable to load messages
                    </strong>
                    ${escapeHtml(
                        error.message
                    )}
                </div>
            </div>
        `;

    }

}


/* =========================================================
INCOMING MESSAGE
========================================================= */

function handleIncomingMessage(
    message
){

    /*
     * Do not notify for your own messages.
     */

    if(
        message.device_id &&
        message.device_id===deviceId
    ){

        return;
    }

    /*
     * IMPORTANT:
     *
     * When the user is actively looking at
     * the page, don't play a sound and don't
     * show a desktop notification.
     */

    if(
        document.visibilityState==="visible" &&
        document.hasFocus()
    ){

        return;
    }

    /*
     * Mention filtering.
     */

    if(
        settings.mentionNotifications &&
        settings.username &&
        message.message
    ){

        const escaped=
            settings.username
            .replace(
                /[.*+?^${}()|[\]\\]/g,
                "\\$&"
            );

        const mentionRegex=
            new RegExp(
                "(^|\\s)@?"+
                escaped+
                "(\\s|$)",
                "i"
            );

        if(
            !mentionRegex.test(
                message.message
            )
        ){

            /*
             * If mention notifications
             * are specifically enabled,
             * normal messages still notify.
             *
             * This intentionally does not
             * suppress normal messages.
             */

        }
    }

    const preview=
        message.message||
        (
            message.image
            ?"📷 Image"
            :"New message"
        );

    showWindowsNotification(
        message.username||
        "Chat",
        preview
    );

    if(
        settings.notificationSound
    ){

        playNotificationSound(
            settings.notificationSoundType,
            settings.notificationVolume/100,
            settings.notificationDuration
        );

    }
}


/* =========================================================
WINDOWS STYLE NOTIFICATION
========================================================= */

function showWindowsNotification(
    title,
    body
){

    if(
        settings.desktopNotifications
    ){

        requestDesktopPermission()
        .then(permission=>{

            if(
                permission==="granted" &&
                "Notification" in window
            ){

                try{

                    const notification=
                        new Notification(
                            title,
                            {
                                body:
                                    stripHtml(
                                        body
                                    ),
                                icon:
                                    "data:image/svg+xml,"+
                                    encodeURIComponent(
                                        `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">
                                        <rect width="64" height="64" rx="12" fill="#202020"/>
                                        <text x="32" y="43" text-anchor="middle" font-size="32">💬</text>
                                        </svg>`
                                    ),
                                tag:"chat-message"
                            }
                        );

                    notification.onclick=()=>{
                        window.focus();
                        notification.close();
                    };

                }catch(error){

                    console.warn(
                        "Desktop notification failed:",
                        error
                    );

                }

            }

        });

    }


    /*
     * Also show our custom Windows-style
     * notification while the page exists.
     */

    notificationBody.textContent=
        body;

    windowsNotification
        .classList
        .add("show");

    if(notificationTimeout){

        clearTimeout(
            notificationTimeout
        );

    }

    notificationTimeout=
        setTimeout(
            ()=>{
                windowsNotification
                    .classList
                    .remove("show");
            },
            Math.max(
                3000,
                settings.notificationDuration
            )
        );
}


notificationClose.onclick=()=>{

    windowsNotification
        .classList
        .remove("show");

};


async function requestDesktopPermission(){

    if(
        !("Notification" in window)
    ){

        return "denied";
    }

    if(
        Notification.permission===
        "granted"
    ){

        return "granted";
    }

    if(
        Notification.permission===
        "denied"
    ){

        return "denied";
    }

    try{

        return await Notification.requestPermission();

    }catch{

        return "denied";
    }
}

/* =========================================================
AUDIO ENGINE
========================================================= */

let audioContext=null;


function getAudioContext(){

    if(!audioContext){

        const AudioCtx=
            window.AudioContext||
            window.webkitAudioContext;

        if(!AudioCtx){
            return null;
        }

        audioContext=
            new AudioCtx();
    }

    if(
        audioContext.state==="suspended"
    ){

        audioContext.resume()
        .catch(()=>{});

    }

    return audioContext;
}


/*
 * Creates one synthesized note.
 */

function playTone(
    frequency,
    startTime,
    duration,
    volume,
    type="sine"
){

    const ctx=
        getAudioContext();

    if(!ctx){
        return;
    }

    const oscillator=
        ctx.createOscillator();

    const gain=
        ctx.createGain();

    oscillator.type=type;

    oscillator.frequency.setValueAtTime(
        frequency,
        startTime
    );

    gain.gain.setValueAtTime(
        0,
        startTime
    );

    gain.gain.linearRampToValueAtTime(
        volume,
        startTime+0.015
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        startTime+duration
    );

    oscillator.connect(gain);

    gain.connect(ctx.destination);

    oscillator.start(startTime);

    oscillator.stop(
        startTime+duration+0.03
    );
}


/* =========================================================
12 NOTIFICATION SOUNDS
========================================================= */

function playNotificationSound(
    type,
    volume,
    duration
){

    const ctx=
        getAudioContext();

    if(!ctx){
        return;
    }

    const now=
        ctx.currentTime+0.02;

    const maxDuration=
        Math.max(
            0.1,
            duration/1000
        );

    /*
     * 1 Classic
     */

    if(type===1){

        playTone(
            880,
            now,
            maxDuration*.45,
            volume*.35,
            "sine"
        );

        playTone(
            1175,
            now+maxDuration*.45,
            maxDuration*.45,
            volume*.3,
            "sine"
        );

    }


    /*
     * 2 Soft
     */

    else if(type===2){

        playTone(
            523.25,
            now,
            maxDuration*.8,
            volume*.22,
            "sine"
        );

    }


    /*
     * 3 Double beep
     */

    else if(type===3){

        playTone(
            740,
            now,
            maxDuration*.25,
            volume*.35,
            "square"
        );

        playTone(
            740,
            now+maxDuration*.35,
            maxDuration*.25,
            volume*.35,
            "square"
        );

    }


    /*
     * 4 Digital
     */

    else if(type===4){

        playTone(
            1000,
            now,
            maxDuration*.18,
            volume*.28,
            "square"
        );

        playTone(
            1500,
            now+maxDuration*.22,
            maxDuration*.18,
            volume*.25,
            "square"
        );

        playTone(
            2000,
            now+maxDuration*.44,
            maxDuration*.18,
            volume*.2,
            "square"
        );

    }


    /*
     * 5 Bell
     */

    else if(type===5){

        playTone(
            784,
            now,
            maxDuration*.9,
            volume*.3,
            "sine"
        );

        playTone(
            1174,
            now,
            maxDuration*.7,
            volume*.13,
            "sine"
        );

    }


    /*
     * 6 Rising
     */

    else if(type===6){

        const notes=[
            440,
            554,
            659,
            880
        ];

        notes.forEach(
            (freq,i)=>{

                playTone(
                    freq,
                    now+
                    i*
                    Math.min(
                        .16,
                        maxDuration/
                        notes.length
                    ),
                    maxDuration*.3,
                    volume*.22,
                    "sine"
                );

            }
        );

    }


    /*
     * 7 Falling
     */

    else if(type===7){

        const notes=[
            880,
            659,
            554,
            440
        ];

        notes.forEach(
            (freq,i)=>{

                playTone(
                    freq,
                    now+
                    i*
                    Math.min(
                        .16,
                        maxDuration/
                        notes.length
                    ),
                    maxDuration*.3,
                    volume*.22,
                    "sine"
                );

            }
        );

    }


    /*
     * 8 Pulse
     */

    else if(type===8){

        for(
            let i=0;
            i<5;
            i++
        ){

            playTone(
                600,
                now+i*.13,
                .08,
                volume*.3,
                "square"
            );

        }

    }


    /*
     * 9 Alert
     */

    else if(type===9){

        for(
            let i=0;
            i<4;
            i++
        ){

            playTone(
                i%2===0
                ?900
                :650,
                now+i*.18,
                .14,
                volume*.35,
                "square"
            );

        }

    }


    /*
     * 10 Deep
     */

    else if(type===10){

        playTone(
            130,
            now,
            maxDuration*.85,
            volume*.35,
            "sine"
        );

        playTone(
            196,
            now+maxDuration*.25,
            maxDuration*.55,
            volume*.18,
            "triangle"
        );

    }


    /*
     * 11 Nuclear alarm
     *
     * Fast alternating alarm pattern.
     */

    else if(type===11){

        const end=
            now+maxDuration;

        let t=now;

        let high=false;

        while(t<end){

            const frequency=
                high
                ?1050
                :620;

            playTone(
                frequency,
                t,
                .38,
                volume*.32,
                "sawtooth"
            );

            t+=.42;

            high=!high;
        }

    }


    /*
     * 12 Opera
     *
     * A completely synthesized original
     * vocal-like melody made from many notes.
     */

    else if(type===12){

        /*
         * Notes are based on a dramatic
         * original melody.
         */

        const melody=[

            [392,.20],
            [440,.20],
            [523.25,.25],
            [587.33,.28],

            [659.25,.30],
            [587.33,.20],
            [523.25,.20],
            [440,.30],

            [392,.20],
            [523.25,.20],
            [659.25,.28],
            [783.99,.35],

            [659.25,.22],
            [587.33,.22],
            [523.25,.28],
            [440,.35],

            [392,.22],
            [440,.22],
            [493.88,.25],
            [587.33,.30],

            [659.25,.25],
            [783.99,.30],
            [659.25,.20],
            [587.33,.30],

            [523.25,.25],
            [440,.25],
            [392,.45]

        ];

        let position=now;

        const scale=
            Math.min(
                1,
                maxDuration/4
            );

        melody.forEach(
            ([frequency,length])=>{

                if(
                    position>
                    now+maxDuration
                ){

                    return;
                }

                const actual=
                    Math.min(
                        length*scale,
                        now+
                        maxDuration-
                        position
                    );

                if(actual<=0){
                    return;
                }

                /*
                 * Main "voice"
                 */

                playTone(
                    frequency,
                    position,
                    actual,
                    volume*.16,
                    "triangle"
                );

                /*
                 * Harmonic voice.
                 */

                playTone(
                    frequency*2,
                    position,
                    actual*.8,
                    volume*.055,
                    "sine"
                );

                position+=
                    length*scale;
            }
        );

    }
}

/* =========================================================
RENDER
========================================================= */

function renderMessages(){

    const wasBottom=
        messagesEl.scrollHeight-
        messagesEl.scrollTop-
        messagesEl.clientHeight<
        100;

    if(!currentMessages.length){

        messagesEl.innerHTML=`
            <div class="empty">
                <div>
                    <strong>No messages yet</strong>
                    Be the first to send something.
                </div>
            </div>
        `;

        return;
    }

    const fragment=
        document.createDocumentFragment();

    currentMessages.forEach(
        message=>{

            const item=
                document.createElement(
                    "div"
                );

            item.className=
                "message"+
                (
                    settings.compactMessages
                    ?" compact"
                    :""
                );

            item.dataset.id=
                message.id;

            const avatar=
                document.createElement(
                    "div"
                );

            avatar.className="avatar";

            avatar.textContent=
                (
                    message.username||
                    "?"
                )
                .charAt(0)
                .toUpperCase();

            const content=
                document.createElement(
                    "div"
                );

            content.className=
                "message-content";

            const top=
                document.createElement(
                    "div"
                );

            top.className=
                "message-top";

            const name=
                document.createElement(
                    "span"
                );

            name.className=
                "username";

            name.textContent=
                message.username||
                "User";

            top.appendChild(name);

            if(settings.showTimestamps){

                const time=
                    document.createElement(
                        "span"
                    );

                time.className="time";

                time.textContent=
                    formatTime(
                        message.created_at
                    );

                top.appendChild(time);
            }

            if(message.edited){

                const edited=
                    document.createElement(
                        "span"
                    );

                edited.className=
                    "edited";

                edited.textContent=
                    "(edited)";

                top.appendChild(edited);
            }

            content.appendChild(top);

            if(message.message){

                const text=
                    document.createElement(
                        "div"
                    );

                text.className=
                    "message-text";

                text.textContent=
                    message.message;

                content.appendChild(text);
            }

            if(message.image){

                const img=
                    document.createElement(
                        "img"
                    );

                img.className=
                    "message-image";

                img.src=
                    message.image;

                img.alt="Image";

                img.onclick=()=>{
                    openImage(
                        message.image
                    );
                };

                content.appendChild(img);
            }

            item.appendChild(avatar);

            item.appendChild(content);

            if(
                message.device_id &&
                message.device_id===deviceId
            ){

                item.addEventListener(
                    "contextmenu",
                    event=>{

                        event.preventDefault();

                        showContextMenu(
                            event.clientX,
                            event.clientY,
                            message
                        );

                    }
                );

            }

            fragment.appendChild(item);

        }
    );

    messagesEl.replaceChildren(
        fragment
    );

    if(
        wasBottom &&
        settings.autoScroll
    ){

        messagesEl.scrollTop=
            messagesEl.scrollHeight;

    }
}


/* =========================================================
CONTEXT MENU
========================================================= */

function showContextMenu(
    x,
    y,
    message
){

    selectedMessage=
        message;

    contextMenu.style.left=
        Math.min(
            x,
            window.innerWidth-170
        )+"px";

    contextMenu.style.top=
        Math.min(
            y,
            window.innerHeight-100
        )+"px";

    contextMenu.classList.add(
        "show"
    );
}


document.addEventListener(
    "click",
    ()=>{
        contextMenu.classList.remove(
            "show"
        );
    }
);


/* =========================================================
EDIT
========================================================= */

editMessageBtn.onclick=
    async event=>{

        event.stopPropagation();

        contextMenu.classList.remove(
            "show"
        );

        if(!selectedMessage){
            return;
        }

        const newText=
            prompt(
                "Edit message:",
                selectedMessage.message||
                ""
            );

        if(newText===null){
            return;
        }

        try{

            const response=
                await fetch(
                    API_URL,
                    {
                        method:"PATCH",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({

                            id:
                                selectedMessage.id,

                            device_id:
                                deviceId,

                            message:
                                newText.trim()

                        })
                    }
                );

            const data=
                await response.json();

            if(!response.ok){

                throw new Error(
                    data.error||
                    "Failed to edit message."
                );
            }

            await loadMessages();

        }catch(error){

            alert(
                "Failed to edit:\n\n"+
                error.message
            );

        }
    };


/* =========================================================
DELETE
========================================================= */

deleteMessageBtn.onclick=
    event=>{

        event.stopPropagation();

        contextMenu.classList.remove(
            "show"
        );

        if(!selectedMessage){
            return;
        }

        if(settings.confirmDelete){

            openConfirm(
                "Delete message?",
                "This message will be permanently removed.",
                deleteSelectedMessage
            );

        }else{

            deleteSelectedMessage();

        }
    };


async function deleteSelectedMessage(){

    if(!selectedMessage){
        return;
    }

    try{

        const response=
            await fetch(
                API_URL,
                {
                    method:"DELETE",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        id:
                            selectedMessage.id,

                        device_id:
                            deviceId

                    })
                }
            );

        const data=
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error||
                "Failed to delete message."
            );
        }

        selectedMessage=null;

        await loadMessages();

    }catch(error){

        alert(
            "Failed to delete:\n\n"+
            error.message
        );

    }
}


/* =========================================================
IMAGE VIEWER
========================================================= */

function openImage(src){

    fullImage.src=
        src;

    imageViewer.classList.add(
        "show"
    );
}


function closeImage(){

    imageViewer.classList.remove(
        "show"
    );

    fullImage.src="";
}


backImage.onclick=
    closeImage;


imageViewer.onclick=
    event=>{

        if(
            event.target===
            imageViewer
        ){

            closeImage();

        }

    };


document.addEventListener(
    "keydown",
    event=>{

        if(
            event.key==="Escape" &&
            imageViewer.classList.contains(
                "show"
            )
        ){

            closeImage();

        }

    }
);


/* =========================================================
CONFIRM
========================================================= */

function openConfirm(
    title,
    text,
    callback
){

    dialogTitle.textContent=
        title;

    dialogText.textContent=
        text;

    confirmCallback=
        callback;

    dialogOverlay.classList.add(
        "show"
    );
}


dialogCancel.onclick=()=>{

    dialogOverlay.classList.remove(
        "show"
    );

    confirmCallback=null;

};


dialogConfirm.onclick=
    async()=>{

        const callback=
            confirmCallback;

        dialogOverlay.classList.remove(
            "show"
        );

        confirmCallback=null;

        if(callback){

            await callback();

        }

    };


/* =========================================================
REMOVE EVERYTHING
========================================================= */

removeEverything.onclick=()=>{

    openConfirm(
        "Remove everything?",
        "This will permanently remove every message and image from the chat for EVERYONE.",
        ()=>{
            openConfirm(
                "I know",
                "You understand that the entire chat history will be deleted.",
                ()=>{
                    openConfirm(
                        "Are you ultra sure?",
                        "Last time: every stored message and image will be permanently removed.",
                        permanentlyDeleteEverything
                    );
                }
            );
        }
    );

};


async function permanentlyDeleteEverything(){

    try{

        const response=
            await fetch(
                API_URL,
                {
                    method:"DELETE",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        delete_all:true
                    })
                }
            );

        const data=
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error||
                "Failed to remove everything."
            );
        }

        currentMessages=[];

        lastKnownMessageIds=
            new Set();

        renderMessages();

        alert(
            "The entire chat has been wiped."
        );

    }catch(error){

        alert(
            "Failed to wipe chat:\n\n"+
            error.message
        );

    }
}


/* =========================================================
REFRESH
========================================================= */

function startRefreshTimer(){

    if(refreshTimer){

        clearInterval(
            refreshTimer
        );

    }

    refreshTimer=
        setInterval(
            loadMessages,
            Number(
                settings.refreshRate
            )
        );
}


/* =========================================================
HELPERS
========================================================= */

function formatTime(date){

    if(!date){
        return "";
    }

    return new Date(date)
        .toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );
}


function escapeHtml(value){

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}


function stripHtml(value){

    const div=
        document.createElement(
            "div"
        );

    div.textContent=
        value;

    return div.textContent;
}


/* =========================================================
AUDIO UNLOCK
========================================================= */

function unlockAudio(){

    const ctx=
        getAudioContext();

    if(ctx){

        if(
            ctx.state===
            "suspended"
        ){

            ctx.resume()
            .catch(()=>{});

        }

    }
}


/*
 * Browsers require a user interaction before
 * audio can normally start.
 */

document.addEventListener(
    "click",
    unlockAudio,
    {
        once:false,
        passive:true
    }
);

document.addEventListener(
    "keydown",
    unlockAudio,
    {
        once:false,
        passive:true
    }
);

START
========================================================= */

loadSettingsUI();

applySettings();

loadMessages();
