<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat</title>

<style>
*{box-sizing:border-box}

:root{
    --bg:#0b0d10;
    --panel:#111419;
    --panel2:#181c22;
    --border:#292f38;
    --text:#edf0f4;
    --muted:#7e8793;
    --accent:#e8eaed;
    --danger:#ff6666;
    --success:#67d38b;
    --radius:12px;
    --text-size:16px;
    --word-spacing:0px;
    --line-spacing:1.45;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

body{overflow:hidden}

button,input,textarea,select{font:inherit}
button{cursor:pointer}

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

.header{
    height:64px;
    min-height:64px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel);
    border-bottom:1px solid var(--border);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
}

.logo-icon{
    width:35px;
    height:35px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:var(--panel2);
    border:1px solid var(--border);
}

.channel{
    color:var(--muted);
    font-weight:400;
}

.icon-btn{
    width:39px;
    height:39px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    display:flex;
    gap:11px;
    margin-bottom:17px;
}

.message.compact{
    margin-bottom:5px;
}

.avatar{
    flex:0 0 40px;
    width:40px;
    height:40px;
    display:grid;
    place-items:center;
    border-radius:var(--radius);
    background:var(--panel2);
    border:1px solid var(--border);
    font-weight:700;
}

.message-content{
    min-width:0;
    max-width:min(900px,calc(100vw - 90px));
}

.message-top{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:3px;
}

.username{font-weight:700}

.time,.edited{
    color:var(--muted);
    font-size:11px;
}

.message-text{
    color:#d8dde4;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    font-size:var(--text-size);
    word-spacing:var(--word-spacing);
    line-height:var(--line-spacing);
}

.message-link{
    color:#7db7ff;
    text-decoration:underline;
    cursor:pointer;
}

.message-image{
    display:block;
    max-width:min(500px,80vw);
    max-height:500px;
    margin-top:8px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:#000;
    object-fit:contain;
    cursor:pointer;
}

/* =====================================================
   GAME MESSAGE
===================================================== */

.game-card{
    width:min(650px,calc(100vw - 70px));
    margin-top:8px;
    background:linear-gradient(145deg,#151a21,#101318);
    border:1px solid #303844;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 10px 35px #0005;
}

.game-card-header{
    padding:15px 17px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
}

.game-title{
    display:flex;
    align-items:center;
    gap:11px;
    font-weight:800;
}

.game-icon{
    width:42px;
    height:42px;
    display:grid;
    place-items:center;
    border-radius:11px;
    background:#202631;
    border:1px solid #363e4b;
    font-size:22px;
}

.game-status{
    color:var(--muted);
    font-size:12px;
}

.game-body{padding:16px}

.game-description{
    color:#aeb6c2;
    font-size:13px;
    margin-bottom:14px;
}

.game-players{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 12px;
    background:#0d1014;
    border:1px solid var(--border);
    border-radius:10px;
    margin-bottom:12px;
}

.player-list{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.player-pill{
    padding:5px 8px;
    background:#202630;
    border:1px solid #363d49;
    border-radius:7px;
    font-size:12px;
}

.player-pill.me{
    border-color:#65707f;
}

.game-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.game-btn{
    border:1px solid #363d49;
    background:#202630;
    color:white;
    border-radius:9px;
    padding:9px 13px;
}

.game-btn:hover{
    filter:brightness(1.15);
}

.game-btn.primary{
    background:#e8eaed;
    color:#111;
}

.game-btn.danger{
    background:#32191c;
    border-color:#6e3035;
    color:#ff8585;
}

.game-btn.success{
    background:#183021;
    border-color:#315f40;
    color:#79db98;
}

.game-board{
    margin-top:14px;
    padding:15px;
    background:#0a0d11;
    border:1px solid var(--border);
    border-radius:12px;
}

.turn-bar{
    padding:10px 12px;
    margin-bottom:12px;
    border-radius:9px;
    background:#171d25;
    color:#cbd2dc;
    font-size:13px;
}

.turn-bar strong{color:white}

.board{
    display:grid;
    gap:5px;
    justify-content:center;
}

.cell{
    width:58px;
    height:58px;
    border:1px solid #343b46;
    border-radius:8px;
    background:#151a20;
    color:white;
    display:grid;
    place-items:center;
    font-size:25px;
    font-weight:800;
}

.cell:hover{background:#202630}

.cell:disabled{
    cursor:not-allowed;
    opacity:.75;
}

.game-small{
    color:var(--muted);
    font-size:12px;
    margin-top:9px;
}

.game-result{
    margin-top:12px;
    padding:11px;
    border-radius:9px;
    background:#171d25;
    text-align:center;
    font-weight:700;
}

.game-in-chat{
    animation:gameAppear .2s ease;
}

@keyframes gameAppear{
    from{
        opacity:0;
        transform:translateY(5px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

/* DICE */

.dice-result{
    font-size:52px;
    text-align:center;
    padding:15px;
}

.dice-roll-box{
    text-align:center;
}

/* BOARD */

.board-grid{
    display:grid;
    grid-template-columns:repeat(5,48px);
    grid-template-rows:repeat(5,48px);
    gap:4px;
    justify-content:center;
}

.board-cell{
    width:48px;
    height:48px;
    border-radius:7px;
    background:#151a20;
    border:1px solid #303742;
    display:grid;
    place-items:center;
    font-size:20px;
}

/* CONNECT FOUR */

.connect4{
    display:grid;
    grid-template-columns:repeat(7,42px);
    gap:5px;
    justify-content:center;
    padding:8px;
    background:#131a25;
    border-radius:12px;
}

.c4-cell{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#080b0f;
    border:2px solid #333b48;
    display:grid;
    place-items:center;
    cursor:pointer;
}

.c4-cell:hover{
    border-color:#707b8b;
}

.c4-cell.red{
    background:#d84b55;
    border-color:#ff6973;
}

.c4-cell.yellow{
    background:#d8b842;
    border-color:#ffe36b;
}

/* REACTION */

.reaction-box{
    min-height:170px;
    border:1px solid var(--border);
    border-radius:12px;
    background:#10151b;
    display:grid;
    place-items:center;
    text-align:center;
    padding:20px;
}

.reaction-target{
    width:120px;
    height:120px;
    border-radius:50%;
    border:2px solid #56606e;
    background:#202630;
    color:white;
    display:grid;
    place-items:center;
    font-size:14px;
    font-weight:700;
}

.reaction-target.ready{
    background:#243426;
    border-color:#67d38b;
}

.reaction-target.go{
    background:#683238;
    border-color:#ff6973;
}

/* COMPOSER */

.composer{
    padding:12px 16px 16px;
    background:var(--panel);
    border-top:1px solid var(--border);
}

.composer-box{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:8px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:14px;
}

textarea{
    flex:1;
    min-height:42px;
    max-height:150px;
    resize:none;
    border:0;
    outline:none;
    background:transparent;
    color:white;
    padding:10px;
}

.attach-btn,.send-btn{
    height:42px;
    border:0;
    border-radius:9px;
}

.attach-btn{
    width:42px;
    background:transparent;
    color:#adb5c0;
    font-size:20px;
}

.send-btn{
    padding:0 18px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

/* OVERLAY */

.overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000b;
    z-index:100;
}

.overlay.show{display:flex}

.panel{
    width:min(600px,calc(100vw - 25px));
    max-height:calc(100vh - 25px);
    overflow-y:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px;
    border-bottom:1px solid var(--border);
}

.panel-header h2{margin:0}

.panel-body{padding:18px}

.category{
    margin-bottom:12px;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    background:var(--panel2);
}

.category-title{
    width:100%;
    padding:14px;
    border:0;
    background:transparent;
    color:var(--text);
    display:flex;
    justify-content:space-between;
    font-weight:700;
    text-align:left;
}

.category-body{
    display:none;
    padding:0 14px 14px;
}

.category.open .category-body{display:block}

.setting{margin-top:14px}

.setting label{
    display:block;
    margin-bottom:7px;
    color:#aab2bd;
    font-size:13px;
}

.setting input,.setting select{
    width:100%;
    padding:10px;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
    background:#101419;
    color:white;
}

.setting input[type=range]{padding:0}

.setting-value{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.save-btn{
    width:100%;
    margin-top:8px;
    padding:12px;
    border:0;
    border-radius:9px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

.danger-zone{
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid #402529;
}

.danger-title{
    color:var(--danger);
    font-weight:700;
    margin-bottom:7px;
}

.danger-zone p{color:var(--muted)}

.danger-btn{
    width:100%;
    padding:12px;
    border-radius:9px;
    border:1px solid #743333;
    background:#241719;
    color:#ff8585;
}

/* GAME CREATOR */

.game-list{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:9px;
}

.game-choice{
    padding:15px;
    border-radius:12px;
    background:#171c23;
    border:1px solid var(--border);
    color:white;
    text-align:left;
}

.game-choice:hover{background:#202630}

.game-choice-icon{
    font-size:28px;
    margin-bottom:8px;
}

.game-choice strong{display:block}

.game-choice small{color:var(--muted)}

.field{margin-top:14px}

.field label{
    display:block;
    color:#aab2bd;
    font-size:13px;
    margin-bottom:6px;
}

.field input,.field select{
    width:100%;
    padding:10px;
    border-radius:9px;
    border:1px solid var(--border);
    background:#101419;
    color:white;
}

/* CONTEXT */

.context-menu{
    position:fixed;
    display:none;
    width:160px;
    padding:5px;
    z-index:200;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:9px;
}

.context-menu.show{display:block}

.context-menu button{
    width:100%;
    padding:9px 10px;
    text-align:left;
    border:0;
    background:transparent;
    color:white;
}

.delete-option{color:#ff7777!important}

/* IMAGE */

.image-viewer{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000f;
    z-index:300;
}

.image-viewer.show{display:flex}

.full-image{
    max-width:95vw;
    max-height:90vh;
}

.back-image{
    position:absolute;
    top:18px;
    left:18px;
    padding:10px 16px;
    border-radius:9px;
    border:1px solid #3a4049;
    background:#171b21;
    color:white;
}

/* DIALOG */

.dialog{
    width:min(450px,calc(100vw - 30px));
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
}

.dialog h2{margin-top:0}

.dialog p{
    color:#aab2bd;
    line-height:1.5;
}

.dialog-buttons{
    display:flex;
    gap:8px;
    justify-content:flex-end;
}

.dialog-buttons button{
    padding:10px 16px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#20252c;
    color:white;
}

.dialog-buttons .danger{background:#6b2929}

.empty{
    height:100%;
    display:grid;
    place-items:center;
    color:#656d78;
    text-align:center;
}

.empty strong{
    display:block;
    color:#aab2bd;
    margin-bottom:5px;
}

@media(max-width:600px){

    .messages{
        padding:15px 10px;
    }

    .channel{display:none}

    .message-content{
        max-width:calc(100vw - 70px);
    }

    .game-card{width:100%}

    .cell{
        width:46px;
        height:46px;
    }

    .connect4{
        grid-template-columns:repeat(7,34px);
        gap:3px;
    }

    .c4-cell{
        width:34px;
        height:34px;
    }

    .board-grid{
        grid-template-columns:repeat(5,40px);
        grid-template-rows:repeat(5,40px);
    }

    .board-cell{
        width:40px;
        height:40px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="logo">

        <div class="logo-icon">💬</div>

        <span>Chat</span>

        <span class="channel"># general</span>

    </div>

    <div style="display:flex;gap:7px">

        <button
            class="icon-btn"
            id="gamesBtn"
            title="Create game"
        >🎮</button>

        <button
            class="icon-btn"
            id="settingsBtn"
            title="Settings"
        >⚙</button>

    </div>

</header>

<main
    class="messages"
    id="messages"
></main>

<div class="composer">

    <div class="composer-box">

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
        >

        <button
            class="attach-btn"
            id="attachBtn"
        >＋</button>

        <textarea
            id="messageInput"
            rows="1"
            placeholder="Message #general"
        ></textarea>

        <button
            class="send-btn"
            id="sendBtn"
        >Send</button>

    </div>

</div>

</div>


<!-- =====================================================
     GAME CREATOR
===================================================== -->

<div
    class="overlay"
    id="gamesOverlay"
>

<div class="panel">

<div class="panel-header">

    <h2>🎮 Create a game</h2>

    <button
        class="icon-btn"
        id="closeGames"
    >×</button>

</div>

<div class="panel-body">

<div id="gameCreator">

<p style="color:#89929e">
Choose a game. The game will appear directly inside the chat.
</p>

<div class="game-list">

<button
    class="game-choice"
    data-game="tictactoe"
>
    <div class="game-choice-icon">❌</div>
    <strong>Tic Tac Toe</strong>
    <small>2 players</small>
</button>

<button
    class="game-choice"
    data-game="connect4"
>
    <div class="game-choice-icon">🔴</div>
    <strong>Connect Four</strong>
    <small>2 players</small>
</button>

<button
    class="game-choice"
    data-game="dice"
>
    <div class="game-choice-icon">🎲</div>
    <strong>Dice Duel</strong>
    <small>2–8 players</small>
</button>

<button
    class="game-choice"
    data-game="reaction"
>
    <div class="game-choice-icon">⚡</div>
    <strong>Reaction</strong>
    <small>2–8 players</small>
</button>

<button
    class="game-choice"
    data-game="board"
>
    <div class="game-choice-icon">♟️</div>
    <strong>Board Race</strong>
    <small>2–8 players</small>
</button>

</div>

<div
    id="gameSetup"
    style="display:none"
>

<div class="field">

<label>Game</label>

<input
    id="selectedGameName"
    readonly
>

</div>

<div class="field">

<label>Maximum players</label>

<select id="maxPlayers"></select>

</div>

<div
    style="display:flex;gap:8px;margin-top:15px"
>

<button
    class="game-btn"
    id="cancelGameSetup"
>
Cancel
</button>

<button
    class="game-btn primary"
    id="createGame"
>
Create game
</button>

</div>

</div>

</div>

</div>

</div>

</div>


<!-- =====================================================
     SETTINGS
===================================================== -->

<div
    class="overlay"
    id="settingsOverlay"
>

<div class="panel">

<div class="panel-header">

<h2>Settings</h2>

<button
    class="icon-btn"
    id="closeSettings"
>
×
</button>

</div>

<div class="panel-body">

<div class="category open">

<button class="category-title">

<span>👤 Profile</span>
<span>⌄</span>

</button>

<div class="category-body">

<div class="setting">

<label>Your name</label>

<input
    id="usernameInput"
    maxlength="24"
>

</div>

<div class="setting">

<label>Device ID</label>

<input
    id="deviceIdInput"
    readonly
>

</div>

</div>

</div>


<div class="category">

<button class="category-title">

<span>📝 Text</span>
<span>⌄</span>

</button>

<div class="category-body">

<div class="setting">

<label>Text size</label>

<input
    id="textSize"
    type="range"
    min="12"
    max="24"
    step="1"
>

<div
    class="setting-value"
    id="textSizeValue"
></div>

</div>

<div class="setting">

<label>Word spacing</label>

<input
    id="wordSpacing"
    type="range"
    min="0"
    max="12"
>

<div
    class="setting-value"
    id="wordSpacingValue"
></div>

</div>

<div class="setting">

<label>Line spacing</label>

<input
    id="lineSpacing"
    type="range"
    min="1"
    max="2"
    step=".05"
>

<div
    class="setting-value"
    id="lineSpacingValue"
></div>

</div>

</div>

</div>


<div class="category">

<button class="category-title">

<span>💬 Chat</span>
<span>⌄</span>

</button>

<div class="category-body">

<div class="setting">

<label>Refresh rate</label>

<select id="refreshRate">

<option value="10000">10 seconds</option>
<option value="5000">5 seconds</option>
<option value="3000">3 seconds</option>
<option value="2000">2 seconds</option>
<option value="1000">1 second</option>
<option value="500">0.5 seconds</option>
<option value="100">0.1 seconds</option>

</select>

</div>

<div class="setting">

<label>Show timestamps</label>

<select id="showTimestamps">

<option value="true">On</option>
<option value="false">Off</option>

</select>

</div>

<div class="setting">

<label>Compact messages</label>

<select id="compactMessages">

<option value="false">Off</option>
<option value="true">On</option>

</select>

</div>

</div>

</div>


<div class="category">

<button class="category-title">

<span>🎨 Appearance</span>
<span>⌄</span>

</button>

<div class="category-body">

<div class="setting">

<label>Theme</label>

<select id="themeSelect">

<option value="dark">Dark</option>
<option value="midnight">Midnight</option>
<option value="slate">Slate</option>
<option value="black">Pure Black</option>
<option value="blue">Dark Blue</option>
<option value="purple">Dark Purple</option>
<option value="green">Dark Green</option>
<option value="red">Dark Red</option>
<option value="gray">Classic Gray</option>
<option value="light">Light</option>
<option value="oled">OLED</option>

</select>

</div>

<div class="setting">

<label>Corner roundness</label>

<input
    id="cornerRadius"
    type="range"
    min="0"
    max="25"
>

/* =====================================================
   GAME MESSAGE WRITE
===================================================== */

async function writeGameState(state){

    const encoded=
        GAME_PREFIX+
        JSON.stringify(state);

    const response=
        await fetch(
            API_URL,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({

                    username:"SYSTEM",

                    channel:CHANNEL,

                    message:encoded,

                    image:null,

                    device_id:
                        "GAME_"+state.game_id

                })

            }
        );

    let data=null;

    try{
        data=await response.json();
    }catch{}

    if(!response.ok){

        throw new Error(
            data?.error ||
            "Could not save game state."
        );

    }

    return data?.message;
}


/* =====================================================
   GAME PARSING
===================================================== */

function parseGameMessage(message){

    if(
        !message ||
        !message.message ||
        !message.message.startsWith(
            GAME_PREFIX
        )
    )
        return null;

    try{

        return JSON.parse(
            message.message.substring(
                GAME_PREFIX.length
            )
        );

    }catch{

        return null;

    }
}


/* =====================================================
   GAME REFRESH
===================================================== */

function refreshGameData(){

    games={};

    /*
     Important:
     Messages are sorted oldest -> newest.
     Every newer game state replaces the older state.
    */

    currentMessages.forEach(message=>{

        const state=
            parseGameMessage(message);

        if(!state)
            return;

        if(!state.game_id)
            return;

        if(state.finished){

            delete games[state.game_id];

            return;

        }

        games[state.game_id]={
            ...state,
            message_id:message.id
        };

    });

    myHostedGame=null;

    for(
        const game of Object.values(games)
    ){

        if(
            game &&
            game.host_device_id===deviceId
        ){

            myHostedGame=
                game.game_id;

        }

        if(
            game &&
            game.players?.some(
                p=>p.device_id===deviceId
            )
        ){

            myJoinedGames.add(
                game.game_id
            );

        }

    }

}


/* =====================================================
   GAME ACTION
===================================================== */

async function gameAction(
    game,
    action,
    extra={}
){

    if(!game)
        return;

    const state={

        ...game,

        ...extra,

        action,

        previous_message_id:
            game.message_id,

        updated_at:
            Date.now()

    };

    const info=
        GAME_INFO[
            state.game_type
        ];

    if(
        action==="start" &&
        state.players.length<info.min
    ){

        alert(
            "You need at least "+
            info.min+
            " players to start."
        );

        return;

    }

    try{

        await writeGameState(state);

        await loadMessages(true);

    }catch(error){

        alert(
            "Game update failed:\n\n"+
            error.message
        );

    }

}

async function startGame(game){

/* =====================================================
   INITIAL BOARDS
===================================================== */

function createInitialBoard(type){

    if(type==="tictactoe")
        return Array(9).fill("");

    if(type==="connect4")
        return Array(42).fill("");

    if(type==="board")
        return Array(25).fill("");

    return [];

}


/* =====================================================
   TURN
===================================================== */

function getCurrentPlayer(game){

    if(
        !game.players ||
        !game.players.length
    )
        return null;

    return game.players[
        game.turn_index %
        game.players.length
    ];

}

function isMyTurn(game){

    const player=
        getCurrentPlayer(game);

    return !!player &&
        player.device_id===deviceId;

}

function nextTurn(game){

    return (
        game.turn_index+1
    ) % game.players.length;

}


/* =====================================================
   TIC TAC TOE
===================================================== */

async function playTicTacToe(
    game,
    index
){

    if(!game.started)
        return;

    if(!isMyTurn(game))
        return;

    if(game.board[index])
        return;

    const board=[
        ...game.board
    ];

    const symbol=
        game.turn_index%2===0
        ?"X"
        :"O";

    board[index]=symbol;

    const winner=
        checkTicTacToe(board);

    if(winner){

        await gameAction(
            game,
            "finish",
            {
                board,
                finished:true,
                winner
            }
        );

        return;

    }

    if(board.every(cell=>cell)){

        await gameAction(
            game,
            "finish",
            {
                board,
                finished:true,
                winner:"draw"
            }
        );

        return;

    }

    await gameAction(
        game,
        "move",
        {
            board,

            turn_index:
                nextTurn(game)
        }
    );

}

function checkTicTacToe(board){

    const lines=[

        [0,1,2],
        [3,4,5],
        [6,7,8],

        [0,3,6],
        [1,4,7],
        [2,5,8],

        [0,4,8],
        [2,4,6]

    ];

    for(const line of lines){

        const [a,b,c]=line;

        if(
            board[a] &&
            board[a]===board[b] &&
            board[a]===board[c]
        )
            return board[a];

    }

    return null;

}


/* =====================================================
   CONNECT FOUR
===================================================== */

async function playConnect4(
    game,
    column
){

    if(!game.started)
        return;

    if(!isMyTurn(game))
        return;

    const board=[
        ...game.board
    ];

    const ROWS=6;
    const COLS=7;

    let row=-1;

    for(
        let r=ROWS-1;
        r>=0;
        r--
    ){

        const index=
            r*COLS+column;

        if(!board[index]){

            row=r;

            break;

        }

    }

    if(row<0)
        return;

    const symbol=
        game.turn_index%2===0
        ?"R"
        :"Y";

    board[
        row*COLS+column
    ]=symbol;

    const winner=
        checkConnect4(
            board,
            row,
            column,
            symbol
        );

    if(winner){

        await gameAction(
            game,
            "finish",
            {
                board,
                finished:true,
                winner:symbol
            }
        );

        return;

    }

    if(board.every(cell=>cell)){

        await gameAction(
            game,
            "finish",
            {
                board,
                finished:true,
                winner:"draw"
            }
        );

        return;

    }

    await gameAction(
        game,
        "move",
        {
            board,
            turn_index:
                nextTurn(game)
        }
    );

}

function checkConnect4(
    board,
    row,
    col,
    symbol
){

    const dirs=[
        [1,0],
        [0,1],
        [1,1],
        [1,-1]
    ];

    for(
        const [dr,dc] of dirs
    ){

        let count=1;

        for(
            let direction of [-1,1]
        ){

            let r=row+
                dr*
                direction;

            let c=col+
                dc*
                direction;

            while(
                r>=0 &&
                r<6 &&
                c>=0 &&
                c<7 &&
                board[
                    r*7+c
                ]===symbol
            ){

                count++;

                r+=
                    dr*
                    direction;

                c+=
                    dc*
                    direction;

            }

        }

        if(count>=4)
            return true;

    }

    return false;

}


/* =====================================================
   DICE
===================================================== */

async function rollDice(game){

    if(!game.started)
        return;

    if(!isMyTurn(game))
        return;

    const roll=
        Math.floor(
            Math.random()*6
        )+1;

    const values={
        ...(game.values||{})
    };

    values[deviceId]=roll;

    const next=
        nextTurn(game);

    const finished=
        Object.keys(values).length>=
        game.players.length;

    if(finished){

        let winnerId=null;
        let highest=-1;

        game.players.forEach(player=>{

            const value=
                values[player.device_id];

            if(
                value>highest
            ){

                highest=value;
                winnerId=
                    player.device_id;

            }

        });

        await gameAction(
            game,
            "finish",
            {
                values,
                finished:true,
                winner:winnerId
            }
        );

        return;

    }

    await gameAction(
        game,
        "roll",
        {
            values,
            turn_index:next
        }
    );

}


/* =====================================================
   REACTION GAME
===================================================== */

async function reactionStart(game){

    if(
        game.host_device_id!==deviceId
    )
        return;

    if(!game.started)
        return;

    const delay=
        1200+
        Math.random()*3500;

    const state={
        ...game,

        reaction_phase:"waiting",

        reaction_started_at:null,

        reaction_go_at:
            Date.now()+delay,

        reactions:{},

        action:"reaction_wait",

        updated_at:Date.now()

    };

    await gameAction(
        game,
        "reaction_wait",
        {
            reaction_phase:"waiting",
            reaction_go_at:
                Date.now()+delay,
            reactions:{}
        }
    );

}


async function reactionClick(game){

    if(!game.started)
        return;

    if(
        game.reaction_phase!=="go"
    )
        return;

    if(
        game.reactions &&
        game.reactions[deviceId]
    )
        return;

    const reactions={
        ...(game.reactions||{})
    };

    reactions[deviceId]=
        Date.now();

    if(
        Object.keys(reactions).length>=
        game.players.length
    ){

        let winner=null;
        let fastest=Infinity;

        Object.entries(reactions)
        .forEach(
            ([id,time])=>{

                if(time<fastest){

                    fastest=time;
                    winner=id;

                }

            }
        );

        await gameAction(
            game,
            "finish",
            {
                reactions,
                finished:true,
                winner
            }
        );

        return;

    }

    await gameAction(
        game,
        "reaction",
        {
            reactions
        }
    );

}


function processReactionTimers(){

    Object.values(games)
    .forEach(game=>{

        if(
            !game ||
            game.game_type!=="reaction" ||
            !game.started
        )
            return;

        if(
            game.reaction_phase==="waiting" &&
            game.reaction_go_at &&
            Date.now()>=game.reaction_go_at
        ){

            /*
             Only host changes the shared
             reaction state.
            */

            if(
                game.host_device_id===
                deviceId
            ){

                gameAction(
                    game,
                    "reaction_go",
                    {
                        reaction_phase:"go",
                        reaction_started_at:
                            Date.now()
                    }
                );

            }

        }

    });

}


/* =====================================================
   BOARD RACE
===================================================== */

async function boardMove(game){

    if(!game.started)
        return;

    if(!isMyTurn(game))
        return;

    const positions={
        ...(game.values||{})
    };

    const current=
        Number(
            positions[deviceId]||0
        );

    const roll=
        Math.floor(
            Math.random()*6
        )+1;

    const next=
        Math.min(
            24,
            current+roll
        );

    positions[deviceId]=next;

    const winner=
        next>=24;

    if(winner){

        await gameAction(
            game,
            "finish",
            {
                values:positions,
                finished:true,
                winner:deviceId
            }
        );

        return;

    }

    await gameAction(
        game,
        "move",
        {
            values:positions,
            turn_index:
                nextTurn(game)
        }
    );

}

function getWinnerName(game){

    if(!game.winner)
        return "";

    if(game.winner==="draw")
        return "Draw";

    if(
        game.game_type==="tictactoe"
    ){

        return game.winner+
            " wins!";

    }

    if(
        game.game_type==="connect4"
    ){

        return game.winner==="R"
            ?"🔴 Red wins!"
            :"🟡 Yellow wins!";

    }

    const player=
        game.players.find(
            p=>
                p.device_id===
                game.winner
        );

    return player
        ?player.username+" wins!"
        :"Game finished";

}


/* =====================================================

function escapeHTML(value){

    return String(value??"")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function getGameDescription(game){

    switch(game.game_type){

        case "tictactoe":
            return "Take turns placing X and O. Get three in a row to win.";

        case "connect4":
            return "Drop your pieces into the columns. Connect four to win.";

        case "dice":
            return "Roll the dice when it is your turn. Highest roll wins.";

        case "reaction":
            return "Wait for GO, then click as fast as possible.";

        case "board":
            return "Roll the dice and race to the final square.";

        default:
            return "Multiplayer game";

    }

}

    if(game.game_type==="dice")

                    message.image;

                image.loading=
                    "lazy";

                image.onclick=()=>{

                    fullImage.src=
                        message.image;

                    imageViewer.classList.add(
                        "show"
                    );

                };

                content.appendChild(
                    image
                );

            }


            wrapper.appendChild(
                content
            );

            wrapper.oncontextmenu=
                event=>{

                    event.preventDefault();

                    if(
                        message.device_id===
                        deviceId
                    ){

                        selectedMessage=
                            message;

                        contextMenu.style.left=
                            event.clientX+
                            "px";

                        contextMenu.style.top=
                            event.clientY+
                            "px";

                        contextMenu.classList.add(
                            "show"
                        );

                    }

                };


            messagesEl.appendChild(
                wrapper
            );

        }
    );


    if(
        settings.autoScroll &&
        wasAtBottom
    ){

        messagesEl.scrollTop=
            messagesEl.scrollHeight;

    }

}


/* =====================================================
   LINKIFY
===================================================== */

function linkify(text){

    const escaped=
        escapeHTML(text);

    const urlRegex=
        /(https?:\/\/[^\s<]+)/g;

    return escaped.replace(
        urlRegex,
        match=>{

            const clean=
                match.replace(
                    /[.,!?;:]+$/,
                    ""
                );

            const ending=
                match.substring(
                    clean.length
                );

            return `
                <a
                    class="message-link"
                    href="${clean}"
                    target="_blank"
                    rel="noopener noreferrer"
                >${clean}</a>${ending}
            `;

        }
    );

}


/* =====================================================
   TIME
===================================================== */

function formatTime(value){

    if(!value)
        return "";

    const date=
        new Date(value);

    if(
        Number.isNaN(
            date.getTime()
        )
    )
        return "";

    return date.toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}

function getInitial(name){

    return (
        String(name||"?")
        .trim()
        .charAt(0)
        .toUpperCase()
    ) || "?";

}


/* =====================================================
   LOAD MESSAGES
===================================================== */

async function loadMessages(forceScroll=false){

    try{

        const response=
            await fetch(
                API_URL+
                "?channel="+
                encodeURIComponent(
                    CHANNEL
                ),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok)
            throw new Error(
                "HTTP "+
                response.status
            );

        const data=
            await response.json();

        let messages=
            Array.isArray(data)
            ?data
            :(
                data.messages||
                data.data||
                []
            );

        /*
         Sort oldest first.
        */

        messages.sort(
            (a,b)=>
                new Date(
                    a.created_at||0
                )-
                new Date(
                    b.created_at||0
                )
        );

        currentMessages=
            messages;

        refreshGameData();

        renderMessages();

        if(forceScroll){

            messagesEl.scrollTop=
                messagesEl.scrollHeight;

        }

    }catch(error){

        console.error(
            "Chat loading error:",
            error
        );

    }

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

    const text=
        messageInput.value.trim();

    if(
        !text &&
        !selectedFile
    )
        return;

    if(!settings.username){

        settingsOverlay.classList.add(
            "show"
        );

        loadSettingsUI();

        alert(
            "Set your name before sending messages."
        );

        return;

    }


    let image=null;

    if(selectedFile){

        image=
            await fileToDataURL(
                selectedFile
            );

    }

    const body={

        username:
            settings.username,

        channel:
            CHANNEL,

        message:
            text,

        image,

        device_id:
            deviceId

    };


    sendBtn.disabled=true;

    try{

        const response=
            await fetch(
                API_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(body)
                }
            );

        if(!response.ok){

            let errorData={};

            try{
                errorData=
                    await response.json();
            }catch{}

            throw new Error(
                errorData.error||
                "Message failed."
            );

        }

        messageInput.value="";

        messageInput.style.height=
            "42px";

        selectedFile=null;

        imageInput.value="";

        await loadMessages(true);

    }catch(error){

        alert(
            "Could not send message:\n\n"+
            error.message
        );

    }finally{

        sendBtn.disabled=false;

    }

}


/* =====================================================
   FILE
===================================================== */

function fileToDataURL(file){

    return new Promise(
        (resolve,reject)=>{

            const reader=
                new FileReader();

            reader.onload=
                ()=>resolve(
                    reader.result
                );

            reader.onerror=
                reject;

            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =====================================================
   COMPOSER
===================================================== */

sendBtn.onclick=
    sendMessage;

attachBtn.onclick=()=>
    imageInput.click();

imageInput.onchange=()=>{

    selectedFile=
        imageInput.files[0]||
        null;

};


messageInput.addEventListener(
    "keydown",
    event=>{

        if(
            event.key==="Enter" &&
            !event.shiftKey &&
            settings.enterToSend
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


messageInput.addEventListener(
    "input",
    ()=>{

        messageInput.style.height=
            "42px";

        messageInput.style.height=
            Math.min(
                messageInput.scrollHeight,
                150
            )+
            "px";

    }
);


/* =====================================================
   CONTEXT MENU
===================================================== */

document.addEventListener(
    "click",
    ()=>{
        contextMenu.classList.remove(
            "show"
        );
    }
);


editMessageBtn.onclick=
async()=>{

    if(!selectedMessage)
        return;

    const old=
        selectedMessage.message||"";

    const edited=
        prompt(
            "Edit message:",
            old
        );

    if(
        edited===null ||
        edited===old
    )
        return;

    try{

        const response=
            await fetch(
                API_URL,
                {
                    method:"PATCH",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            id:
                                selectedMessage.id,

                            message:
                                edited,

                            device_id:
                                deviceId

                        })
                }
            );

        if(!response.ok)
            throw new Error(
                "Could not edit message."
            );

        await loadMessages();

    }catch(error){

        alert(error.message);

    }

};


deleteMessageBtn.onclick=
async()=>{

    if(!selectedMessage)
        return;

    const doDelete=async()=>{

        try{

            const response=
                await fetch(
                    API_URL,
                    {
                        method:"DELETE",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                id:
                                    selectedMessage.id,

                                device_id:
                                    deviceId

                            })
                    }
                );

            if(!response.ok)
                throw new Error(
                    "Could not delete message."
                );

            await loadMessages();

        }catch(error){

            alert(error.message);

        }

    };


    if(settings.confirmDelete){

        showConfirm(
            "Delete message",
            "Are you sure you want to delete this message?",
            doDelete
        );

    }else{

        doDelete();

    }

};


/* =====================================================
   IMAGE VIEWER
===================================================== */

backImage.onclick=()=>{

    imageViewer.classList.remove(
        "show"
    );

    fullImage.src="";

};

imageViewer.onclick=
    event=>{

        if(

        ){

            );

            fullImage.src="";

    };


/* =====================================================
   CONFIRM
===================================================== */

function showConfirm(
    title,
    text,
    callback
){

    dialogTitle.textContent=
        title;

    dialogText.textContent=
        text;

    confirmCallback=
        callback;

    dialogOverlay.classList.add(
        "show"
    );

}

dialogCancel.onclick=()=>{

    confirmCallback=null;

    dialogOverlay.classList.remove(
        "show"
    );

};

dialogConfirm.onclick=()=>{

    const callback=
        confirmCallback;

    confirmCallback=null;

    dialogOverlay.classList.remove(
        "show"
    );

    if(callback)
        callback();

};


/* =====================================================
   REMOVE EVERYTHING
===================================================== */

removeEverything.onclick=()=>{

    showConfirm(
        "Remove everything",
        "This will remove every message from the chat. This cannot be undone.",
        deleteEverything
    );

};


async function deleteEverything(){

    try{

        /*
         First retrieve latest messages.
        */

        await loadMessages();

        for(
            const message of currentMessages
        ){

            if(
                message.device_id===
                deviceId
            ){

                await fetch(
                    API_URL,
                    {
                        method:"DELETE",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                id:
                                    message.id,

                                device_id:
                                    deviceId

                            })
                    }
                );

            }

        }

        await loadMessages();

    }catch(error){

        alert(
            "Could not remove messages:\n\n"+
            error.message
        );

    }

}


/* =====================================================
   REFRESH TIMER
===================================================== */

function startRefreshTimer(){

    if(refreshTimer)
        clearInterval(
            refreshTimer
        );

    refreshTimer=
        setInterval(
            ()=>{
                loadMessages();
                processReactionTimers();
            },
            Math.max(
                100,
                Number(
                    settings.refreshRate
                )
            )
        );

}


/* =====================================================
   INITIALIZE
===================================================== */

applySettings();

loadSettingsUI();

loadMessages(true);

startRefreshTimer();


/*
Process reaction timers frequently even if
chat refresh is slower.
*/

setInterval(
    processReactionTimers,
    100
);


/* =====================================================
   CLOSE OVERLAYS WITH ESC
===================================================== */

document.addEventListener(
    "keydown",
    event=>{

        if(event.key!=="Escape")
            return;

        document
            .querySelectorAll(
                ".overlay.show"
            )
            .forEach(
                overlay=>
                    overlay.classList.remove(
                        "show"
                    )
            );

        imageViewer.classList.remove(
            "show"
        );

    }
);
