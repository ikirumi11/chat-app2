<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat</title>

<style>
*{box-sizing:border-box}

:root{
    --bg:#0b0d10;
    --panel:#111419;
    --panel2:#181c22;
    --border:#292f38;
    --text:#edf0f4;
    --muted:#7e8793;
    --accent:#e8eaed;
    --danger:#ff6666;
    --success:#67d38b;
    --radius:12px;
    --text-size:16px;
    --word-spacing:0px;
    --line-spacing:1.45;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

body{
    overflow:hidden;
}

button,input,textarea,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

.header{
    height:64px;
    min-height:64px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel);
    border-bottom:1px solid var(--border);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
}

.logo-icon{
    width:35px;
    height:35px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:var(--panel2);
    border:1px solid var(--border);
}

.channel{
    color:var(--muted);
    font-weight:400;
}

.icon-btn{
    width:39px;
    height:39px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    display:flex;
    gap:11px;
    margin-bottom:17px;
}

.message.compact{
    margin-bottom:7px;
}

.avatar{
    flex:0 0 40px;
    width:40px;
    height:40px;
    display:grid;
    place-items:center;
    border-radius:var(--radius);
    background:var(--panel2);
    border:1px solid var(--border);
    font-weight:700;
}

.message-content{
    min-width:0;
    max-width:min(900px,calc(100vw - 90px));
}

.message-top{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:3px;
}

.username{
    font-weight:700;
}

.time,
.edited{
    color:var(--muted);
    font-size:11px;
}

.message-text{
    color:#d8dde4;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    font-size:var(--text-size);
    word-spacing:var(--word-spacing);
    line-height:var(--line-spacing);
}

.message-link{
    color:#7db7ff;
    text-decoration:underline;
    cursor:pointer;
}

.message-image{
    display:block;
    max-width:min(500px,80vw);
    max-height:500px;
    margin-top:8px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:#000;
    object-fit:contain;
    cursor:pointer;
}

/* =========================================================
   GAME CHAT CARD
========================================================= */

.game-card{
    width:min(650px,calc(100vw - 90px));
    margin-top:8px;
    background:linear-gradient(145deg,#151a21,#101318);
    border:1px solid #303844;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 10px 35px #0005;
}

.game-card-header{
    padding:15px 17px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
}

.game-title{
    display:flex;
    align-items:center;
    gap:11px;
    font-weight:800;
}

.game-icon{
    width:42px;
    height:42px;
    display:grid;
    place-items:center;
    border-radius:11px;
    background:#202631;
    border:1px solid #363e4b;
    font-size:22px;
}

.game-status{
    color:var(--muted);
    font-size:12px;
}

.game-body{
    padding:16px;
}

.game-description{
    color:#aeb6c2;
    font-size:13px;
    margin-bottom:14px;
}

.game-players{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 12px;
    background:#0d1014;
    border:1px solid var(--border);
    border-radius:10px;
    margin-bottom:12px;
}

.player-list{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:8px;
}

.player-pill{
    padding:5px 8px;
    border-radius:7px;
    background:#1b2129;
    border:1px solid #303742;
    color:#dbe0e7;
    font-size:12px;
}

.player-pill.host{
    border-color:#596273;
}

.game-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.game-btn{
    border:1px solid #363d49;
    background:#202630;
    color:white;
    border-radius:9px;
    padding:9px 13px;
}

.game-btn:hover{
    filter:brightness(1.15);
}

.game-btn.primary{
    background:#e8eaed;
    color:#111;
}

.game-btn.danger{
    background:#32191c;
    border-color:#6e3035;
    color:#ff8585;
}

.game-btn.success{
    background:#183021;
    border-color:#315f40;
    color:#79db98;
}

.game-board{
    margin-top:14px;
    padding:15px;
    background:#0a0d11;
    border:1px solid var(--border);
    border-radius:12px;
}

.turn-bar{
    padding:10px 12px;
    margin-bottom:12px;
    border-radius:9px;
    background:#171d25;
    color:#cbd2dc;
    font-size:13px;
}

.turn-bar strong{
    color:white;
}

.board{
    display:grid;
    gap:5px;
    justify-content:center;
}

.cell{
    width:58px;
    height:58px;
    border:1px solid #343b46;
    border-radius:8px;
    background:#151a20;
    color:white;
    display:grid;
    place-items:center;
    font-size:25px;
    font-weight:800;
}

.cell:hover{
    background:#202630;
}

.cell:disabled{
    cursor:not-allowed;
    opacity:.75;
}

.game-small{
    color:var(--muted);
    font-size:12px;
    margin-top:9px;
}

.game-finished{
    padding:12px;
    border-radius:10px;
    background:#171d25;
    color:#cbd2dc;
    text-align:center;
    margin-top:10px;
}

/* DICE */

.dice-result{
    font-size:52px;
    text-align:center;
    padding:15px;
}

/* BOARD */

.board-grid{
    display:grid;
    grid-template-columns:repeat(5,48px);
    grid-template-rows:repeat(5,48px);
    gap:4px;
    justify-content:center;
}

.board-cell{
    width:48px;
    height:48px;
    border-radius:7px;
    background:#151a20;
    border:1px solid #303742;
    display:grid;
    place-items:center;
    font-size:20px;
}

/* =========================================================
   COMPOSER
========================================================= */

.composer{
    padding:12px 16px 16px;
    background:var(--panel);
    border-top:1px solid var(--border);
}

.composer-box{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:8px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:14px;
}

textarea{
    flex:1;
    min-height:42px;
    max-height:150px;
    resize:none;
    border:0;
    outline:none;
    background:transparent;
    color:white;
    padding:10px;
}

.attach-btn,
.send-btn{
    height:42px;
    border:0;
    border-radius:9px;
}

.attach-btn{
    width:42px;
    background:transparent;
    color:#adb5c0;
    font-size:20px;
}

.send-btn{
    padding:0 18px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

/* =========================================================
   OVERLAY
========================================================= */

.overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000b;
    z-index:100;
}

.overlay.show{
    display:flex;
}

.panel{
    width:min(600px,calc(100vw - 25px));
    max-height:calc(100vh - 25px);
    overflow-y:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px;
    border-bottom:1px solid var(--border);
}

.panel-header h2{
    margin:0;
}

.panel-body{
    padding:18px;
}

.category{
    margin-bottom:12px;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    background:var(--panel2);
}

.category-title{
    width:100%;
    padding:14px;
    border:0;
    background:transparent;
    color:var(--text);
    display:flex;
    justify-content:space-between;
    font-weight:700;
    text-align:left;
}

.category-body{
    display:none;
    padding:0 14px 14px;
}

.category.open .category-body{
    display:block;
}

.setting{
    margin-top:14px;
}

.setting label{
    display:block;
    margin-bottom:7px;
    color:#aab2bd;
    font-size:13px;
}

.setting input,
.setting select{
    width:100%;
    padding:10px;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
    background:#101419;
    color:white;
}

.setting input[type=range]{
    padding:0;
}

.setting-value{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.save-btn{
    width:100%;
    margin-top:8px;
    padding:12px;
    border:0;
    border-radius:9px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

.danger-zone{
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid #402529;
}

.danger-title{
    color:var(--danger);
    font-weight:700;
    margin-bottom:7px;
}

.danger-zone p{
    color:var(--muted);
}

.danger-btn{
    width:100%;
    padding:12px;
    border-radius:9px;
    border:1px solid #743333;
    background:#241719;
    color:#ff8585;
}

/* =========================================================
   GAME CREATOR
========================================================= */

.game-list{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:9px;
}

.game-choice{
    padding:15px;
    border-radius:12px;
    background:#171c23;
    border:1px solid var(--border);
    color:white;
    text-align:left;
}

.game-choice:hover{
    background:#202630;
}

.game-choice-icon{
    font-size:28px;
    margin-bottom:8px;
}

.game-choice strong{
    display:block;
}

.game-choice small{
    color:var(--muted);
}

.field{
    margin-top:14px;
}

.field label{
    display:block;
    color:#aab2bd;
    font-size:13px;
    margin-bottom:6px;
}

.field input,
.field select{
    width:100%;
    padding:10px;
    border-radius:9px;
    border:1px solid var(--border);
    background:#101419;
    color:white;
}

/* =========================================================
   CONTEXT
========================================================= */

.context-menu{
    position:fixed;
    display:none;
    width:160px;
    padding:5px;
    z-index:200;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:9px;
}

.context-menu.show{
    display:block;
}

.context-menu button{
    width:100%;
    padding:9px 10px;
    text-align:left;
    border:0;
    background:transparent;
    color:white;
}

.delete-option{
    color:#ff7777!important;
}

/* =========================================================
   IMAGE
========================================================= */

.image-viewer{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000f;
    z-index:300;
}

.image-viewer.show{
    display:flex;
}

.full-image{
    max-width:95vw;
    max-height:90vh;
}

.back-image{
    position:absolute;
    top:18px;
    left:18px;
    padding:10px 16px;
    border-radius:9px;
    border:1px solid #3a4049;
    background:#171b21;
    color:white;
}

/* =========================================================
   DIALOG
========================================================= */

.dialog{
    width:min(450px,calc(100vw - 30px));
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
}

.dialog h2{
    margin-top:0;
}

.dialog p{
    color:#aab2bd;
    line-height:1.5;
}

.dialog-buttons{
    display:flex;
    gap:8px;
    justify-content:flex-end;
}

.dialog-buttons button{
    padding:10px 16px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#20252c;
    color:white;
}

.dialog-buttons .danger{
    background:#6b2929;
}

/* =========================================================
   EMPTY
========================================================= */

.empty{
    height:100%;
    display:grid;
    place-items:center;
    color:#656d78;
    text-align:center;
}

.empty strong{
    display:block;
    color:#aab2bd;
    margin-bottom:5px;
}

@media(max-width:600px){

    .messages{
        padding:15px 10px;
    }

    .channel{
        display:none;
    }

    .message-content{
        max-width:calc(100vw - 70px);
    }

    .game-card{
        width:100%;
    }

    .cell{
        width:46px;
        height:46px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="logo">

        <div class="logo-icon">💬</div>

        <span>Chat</span>

        <span class="channel">
            # general
        </span>

    </div>

    <div style="display:flex;gap:7px">

        <button
            class="icon-btn"
            id="gamesBtn"
            title="Games"
        >
            🎮
        </button>

        <button
            class="icon-btn"
            id="settingsBtn"
            title="Settings"
        >
            ⚙
        </button>

    </div>

</header>

<main
    class="messages"
    id="messages"
></main>

<div class="composer">

    <div class="composer-box">

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
        >

        <button
            class="attach-btn"
            id="attachBtn"
        >
            ＋
        </button>

        <textarea
            id="messageInput"
            rows="1"
            placeholder="Message #general"
        ></textarea>

        <button
            class="send-btn"
            id="sendBtn"
        >
            Send
        </button>

    </div>

</div>

</div>


<!-- =====================================================
     GAME CREATOR
===================================================== -->

<div
    class="overlay"
    id="gamesOverlay"
>

<div class="panel">

<div class="panel-header">

    <h2>🎮 Games</h2>

    <button
        class="icon-btn"
        id="closeGames"
    >
        ×
    </button>

</div>

<div class="panel-body">

<div id="gameCreator">

<p style="color:#89929e">
Choose a game to create. Once created, the game will appear directly inside the chat so everyone can see and join it.
</p>

<div class="game-list">

<button
    class="game-choice"
    data-game="tictactoe"
>

    <div class="game-choice-icon">
        ❌
    </div>

    <strong>
        Tic Tac Toe
    </strong>

    <small>
        2 players
    </small>

</button>


<button
    class="game-choice"
    data-game="connect4"
>

    <div class="game-choice-icon">
        🔴
    </div>

    <strong>
        Connect Four
    </strong>

    <small>
        2 players
    </small>

</button>


<button
    class="game-choice"
    data-game="dice"
>

    <div class="game-choice-icon">
        🎲
    </div>

    <strong>
        Dice Duel
    </strong>

    <small>
        2–8 players
    </small>

</button>


<button
    class="game-choice"
    data-game="reaction"
>

    <div class="game-choice-icon">
        ⚡
    </div>

    <strong>
        Reaction
    </strong>

    <small>
        2–8 players
    </small>

</button>


<button
    class="game-choice"
    data-game="board"
>

    <div class="game-choice-icon">
        ♟️
    </div>

    <strong>
        Board Race
    </strong>

    <small>
        2–8 players
    </small>

</button>

</div>


<div
    id="gameSetup"
    style="display:none"
>

<div class="field">

<label>
Game
</label>

<input
    id="selectedGameName"
    readonly
>

</div>


<div class="field">

<label>
Maximum players
</label>

<select id="maxPlayers"></select>

</div>


<div
    style="
    display:flex;
    gap:8px;
    margin-top:15px
    "
>

<button
    class="game-btn"
    id="cancelGameSetup"
>
Cancel
</button>

<button
    class="game-btn primary"
    id="createGame"
>
Create game
</button>

</div>

</div>

</div>

</div>

</div>

</div>


<!-- =====================================================
     SETTINGS
===================================================== -->

<div
    class="overlay"
    id="settingsOverlay"
>

<div class="panel">

<div class="panel-header">

<h2>
Settings
</h2>

<button
    class="icon-btn"
    id="closeSettings"
>
×
</button>

</div>

<div class="panel-body">


<div class="category open">

<button class="category-title">

<span>
👤 Profile
</span>

<span>
⌄
</span>

</button>

<div class="category-body">

<div class="setting">

<label>
Your name
</label>

<input
    id="usernameInput"
    maxlength="24"
>

</div>

<div class="setting">

<label>
Device ID
</label>

<input
    id="deviceIdInput"
    readonly
>

</div>

</div>

</div>


<div class="category">

<button class="category-title">

<span>
📝 Text
</span>

<span>
⌄
</span>

</button>

<div class="category-body">

<div class="setting">

<label>
Text size
</label>

<input
    id="textSize"
    type="range"
    min="12"
    max="24"
    step="1"
>

<div
    class="setting-value"
    id="textSizeValue"
></div>

</div>


<div class="setting">

<label>
Word spacing
</label>

<input
    id="wordSpacing"
    type="range"
    min="0"
    max="12"
>

<div
    class="setting-value"
    id="wordSpacingValue"
></div>

</div>


<div class="setting">

<label>
Line spacing
</label>

<input
    id="lineSpacing"
    type="range"
    min="1"
    max="2"
    step=".05"
>

<div
    class="setting-value"
    id="lineSpacingValue"
></div>

</div>

</div>

</div>


<div class="category">

<button class="category-title">

<span>
💬 Chat
</span>

<span>
⌄
</span>

</button>

<div class="category-body">

<div class="setting">

<label>
Refresh rate
</label>

<select id="refreshRate">

<option value="10000">
10 seconds
</option>

<option value="5000">
5 seconds
</option>

<option value="3000">
3 seconds
</option>

<option value="2000">
2 seconds
</option>

<option value="1000">
1 second
</option>

<option value="500">
0.5 seconds
</option>

<option value="100">
0.1 seconds
</option>

</select>

</div>


<div class="setting">

<label>
Show timestamps
</label>

<select id="showTimestamps">

<option value="true">
On
</option>

<option value="false">
Off
</option>

</select>

</div>


<div class="setting">

<label>
Compact messages
</label>

<select id="compactMessages">

<option value="false">
Off
</option>

<option value="true">
On
</option>

</select>

</div>

</div>

</div>


<div class="category">

<button class="category-title">

<span>
🎨 Appearance
</span>

<span>
⌄
</span>

</button>

<div class="category-body">

<div class="setting">

<label>
Theme
</label>

<select id="themeSelect">

<option value="dark">
Dark
</option>

<option value="midnight">
Midnight
</option>

<option value="slate">
Slate
</option>

<option value="black">
Pure Black
</option>

<option value="blue">
Dark Blue
</option>

<option value="purple">
Dark Purple
</option>

<option value="green">
Dark Green
</option>

<option value="red">
Dark Red
</option>

<option value="gray">
Classic Gray
</option>

<option value="light">
Light
</option>

<option value="oled">
OLED
</option>

</select>

</div>


<div class="setting">

<label>
Corner roundness
</label>

<input
    id="cornerRadius"
    type="range"
    min="0"
    max="25"
>

<div
    class="setting-value"
    id="cornerRadiusValue"
></div>

</div>


<div class="setting">

<label>
UI scale
</label>

<input
    id="uiScale"
    type="range"
    min=".8"
    max="1.2"
    step=".05"
>

<div
    class="setting-value"
    id="uiScaleValue"
></div>

</div>

</div>

</div>


<div class="category">

function createInitialBoard(type){

    if(type==="tictactoe")
        return Array(9).fill("");

        return Array(42).fill("");

    if(type==="board")
        return Array(25).fill("");

}


/*
=========================================================
CREATE GAME
=========================================================
*/

createGame.onclick=
async()=>{

    if(!settings.username){

        gamesOverlay
            .classList
            .remove("show");

        settingsBtn.click();

        alert(
            "Set your name before hosting a game."
        );

        return;
    }


    if(!selectedGameType)
        return;


    const alreadyHosting=
        Object.values(games)
        .some(game=>

            game &&
            !game.finished &&
            game.host_device_id===
                deviceId

        );


    if(alreadyHosting){

        alert(
            "You are already hosting a game."
        );

        return;
    }


    const info=
        GAME_INFO[
            selectedGameType
        ];

    const max=
        Number(
            maxPlayers.value
        );


    const gameId=
        crypto.randomUUID();


    const state={

        game_id:
            gameId,

        game_type:
            selectedGameType,

        host_device_id:
            deviceId,

        host_name:
            settings.username,

        max_players:
            max,

        players:[
            {
                device_id:
                    deviceId,

                username:
                    settings.username
            }
        ],

        started:false,

        finished:false,

        turn_index:0,

        board:
            createInitialBoard(
                selectedGameType
            ),

        values:{},

        created_at:
            Date.now(),

        updated_at:
            Date.now()

    };


    try{

        await createGameOnServer(
            state
        );

        gameSetup.style.display=
            "none";

        gameCreator.style.display=
            "block";

        gamesOverlay
            .classList
            .remove("show");


        await loadMessages();


        /*
        Scroll directly to the new
        game inside the chat.
        */

        setTimeout(()=>{

            const card=
                document.querySelector(
                    `[data-game-id="${gameId}"]`
                );

            if(card){

                card.scrollIntoView({
                    behavior:"smooth",
                    block:"center"
                });

            }

        },100);


    }catch(error){

        console.error(error);

        alert(
            "Could not create game:\n\n"+
            error.message
        );

    }

};


/*
=========================================================
SERVER GAME CREATE
=========================================================
*/

async function createGameOnServer(
    state
){

    const response=
        await fetch(
            API_URL,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({

                        username:
                            "__GAME_SERVER__",

                        channel:
                            CHANNEL,

                        message:
                            GAME_PREFIX+
                            JSON.stringify(
                                state
                            ),

                        device_id:
                            state.host_device_id,

                        game_server:true

                    })
            }
        );


    const data=
        await response.json();


    if(!response.ok){

        throw new Error(
            data.error ||
            "Game creation failed."
        );

    }


    return data.game;
}


/*
=========================================================
LOAD CHAT
=========================================================
*/

async function loadMessages(){

    try{

        const response=
            await fetch(
                API_URL+
                "?channel="+
                encodeURIComponent(
                    CHANNEL
                )
            );


        const data=
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error ||
                "Could not load chat."
            );

        }


        currentMessages=
            Array.isArray(
                data.messages
            )
            ?data.messages
            :[];


        refreshGameData();

        renderMessages();


    }catch(error){

        console.error(
            "LOAD ERROR",
            error
        );

    }

}


/*
=========================================================
REFRESH
=========================================================
*/

function startRefreshTimer(){

    if(refreshTimer)
        clearInterval(
            refreshTimer
        );

    refreshTimer=
        setInterval(
            loadMessages,
            Math.max(
                100,
                Number(
                    settings.refreshRate
                )
            )
        );

}


loadMessages();
startRefreshTimer();


/*
=========================================================
PARSE GAME
=========================================================
*/

function parseGameMessage(message){

    if(!message)
        return null;

    if(
        message.username!==
        "__GAME_SERVER__"
    )
        return null;


    if(
        !message.message ||
        !message.message.startsWith(
            GAME_PREFIX
        )
    )
        return null;


    try{

        const state=
            JSON.parse(
                message.message.substring(
                    GAME_PREFIX.length
                )
            );


        state.message_id=
            message.id;

        state.server_device_id=
            message.device_id;


        return state;

    }catch(error){

        console.warn(
            "Invalid game state",
            error
        );

        return null;

    }

}


/*
=========================================================
GAME DATA
=========================================================
*/

function refreshGameData(){

    games={};


    for(
        const message
        of currentMessages
    ){

        const state=
            parseGameMessage(
                message
            );


        if(!state)
            continue;


        /*
        The API returns messages oldest
        to newest, so the newest state
        replaces the old state.
        */

        games[
            state.game_id
        ]=
            state;

    }


    /*
    Finished games should disappear
    from the chat.
    */

    for(
        const id
        of Object.keys(games)
    ){

        if(
            games[id].finished
        ){

            delete games[id];

        }

    }

}


/*
=========================================================
RENDER CHAT
=========================================================
*/

function renderMessages(){

    const wasNearBottom=
        messagesEl.scrollHeight-
        messagesEl.scrollTop-
        messagesEl.clientHeight<
        150;


    messagesEl.innerHTML="";


    const visibleMessages=
        currentMessages.filter(
            message=>
                message.username!==
                "__GAME_SERVER__"
        );


    const gameMessages=
        currentMessages.filter(
            message=>
                message.username===
                "__GAME_SERVER__"
        );


    const normalByTime=[
        ...visibleMessages
    ];


    /*
    Render normal messages and games
    together in their real chat order.
    */

    for(
        const message
        of currentMessages
    ){

        if(
            message.username===
            "__GAME_SERVER__"
        ){

            const game=
                parseGameMessage(
                    message
                );

            if(
                game &&
                !game.finished
            ){

                messagesEl.appendChild(
                    renderGameMessage(
                        game
                    )
                );

            }

            continue;
        }


        messagesEl.appendChild(
            renderNormalMessage(
                message
            )
        );

    }


    if(
        settings.autoScroll &&
        wasNearBottom
    ){

        messagesEl.scrollTop=
            messagesEl.scrollHeight;

    }


    if(!messagesEl.children.length){

        messagesEl.innerHTML=`

            <div class="empty">

                <div>

                    <strong>
                    No messages yet
                    </strong>

                    Start the conversation.

                </div>

            </div>

        `;

    }

}


/*
=========================================================
NORMAL MESSAGE
=========================================================
*/

function renderNormalMessage(
    message
){

    const wrapper=
        document.createElement(
            "div"
        );

    wrapper.className=
        "message"+
        (
            settings.compactMessages
            ?" compact"
            :""
        );


    const avatar=
        document.createElement(
            "div"
        );

    avatar.className=
        "avatar";

    avatar.textContent=
        String(
            message.username ||
            "?"
        )
        .charAt(0)
        .toUpperCase();


    const content=
        document.createElement(
            "div"
        );

    content.className=
        "message-content";


    const top=
        document.createElement(
            "div"
        );

    top.className=
        "message-top";


    const username=
        document.createElement(
            "span"
        );

    username.className=
        "username";

    username.textContent=
        message.username ||
        "Unknown";


    top.appendChild(
        username
    );


    if(settings.showTimestamps){

        const time=
            document.createElement(
                "span"
            );

        time.className=
            "time";

        time.textContent=
            formatTime(
                message.created_at
            );

        top.appendChild(
            time
        );

    }


    if(message.edited){

        const edited=
            document.createElement(
                "span"
            );

        edited.className=
            "edited";

        edited.textContent=
            "(edited)";

        top.appendChild(
            edited
        );

    }


    content.appendChild(
        top
    );


    if(message.message){

        const text=
            document.createElement(
                "div"
            );

        text.className=
            "message-text";


        appendTextWithLinks(
            text,
            message.message
        );


        content.appendChild(
            text
        );

    }


    if(message.image){

        const img=
            document.createElement(
                "img"
            );

        img.className=
            "message-image";

        img.src=
            message.image;

        img.onclick=()=>{

            fullImage.src=
                message.image;

            imageViewer
                .classList
                .add("show");

        };


        content.appendChild(
            img
        );

    }


    wrapper.appendChild(
        avatar
    );

    wrapper.appendChild(
        content
    );


    wrapper.oncontextmenu=
        event=>{

            event.preventDefault();

            if(
                message.device_id===
                deviceId
            ){

                selectedMessage=
                    message;

                showContextMenu(
                    event.clientX,
                    event.clientY
                );

            }

        };


    return wrapper;

}


/*
=========================================================
LINK DETECTION
=========================================================
*/

function appendTextWithLinks(
    element,
    text
){

    const urlRegex=
        /(https?:\/\/[^\s]+)/g;

    let last=0;

    const matches=
        text.matchAll(
            urlRegex
        );


    for(
        const match
        of matches
    ){

        const index=
            match.index;

        if(index>last){

            element.appendChild(
                document.createTextNode(
                    text.substring(
                        last,
                        index
                    )
                )
            );

        }


        const url=
            match[0];

        const cleanUrl=
            url.replace(
                /[),.!?]+$/,
                ""
            );


        const link=
            document.createElement(
                "a"
            );

        link.className=
            "message-link";

        link.textContent=
            cleanUrl;

        link.href=
            cleanUrl;

        link.target=
            "_blank";

        link.rel=
            "noopener noreferrer";


        element.appendChild(
            link
        );


        last=
            index+
            cleanUrl.length;

    }


    if(last<text.length){

        element.appendChild(
            document.createTextNode(
                text.substring(
                    last
                )
            )
        );

    }

}

/*
=========================================================
CURRENT PLAYER
=========================================================
*/

function getCurrentPlayer(
    game
){

    if(
        !game.players ||
        !game.players.length
    )
        return null;


    return game.players[
        game.turn_index %
        game.players.length
    ];

}


function isMyTurn(
    game
){

    const player=
        getCurrentPlayer(
            game
        );


    return !!player &&
        player.device_id===
        deviceId;

}


function nextTurn(
    game
){

    return (
        game.turn_index+
        1
    ) %
    game.players.length;

}


/*
=========================================================
UPDATE GAME ON SERVER
=========================================================
*/

async function updateGame(
    game,
    changes
){

    const state={
        ...game,
        ...changes,
        updated_at:
            Date.now()
    };


    const response=
        await fetch(
            API_URL,
            {
                method:"PATCH",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({

                        id:
                            game.message_id,

                        device_id:
                            game.host_device_id,

                        game_server:true,

                        game_state:
                            GAME_PREFIX+
                            JSON.stringify(
                                state
                            )

                    })

            }
        );


    const data=
        await response.json();


    if(!response.ok){

        throw new Error(
            data.error ||
            "Game update failed."
        );

    }


    await loadMessages();

}


/*
=========================================================
JOIN
=========================================================
*/

async function joinGame(
    game
){

    if(game.started){

        alert(
            "This game has already started."
        );

        return;

    }


    if(!settings.username){

        settingsBtn.click();

        alert(
            "Set your name before joining."
        );

        return;

    }


    if(
        game.players.some(
            player=>
                player.device_id===
                deviceId
        )
    )
        return;


    if(
        game.players.length>=
        game.max_players
    ){

        alert(
            "This game is full."
        );

        return;

    }


    const players=[
        ...game.players,
        {
            device_id:
                deviceId,
            username:
                settings.username
        }
    ];


    /*
    Important:
    Only the host can PATCH the game
    with the server code provided.
    
    Therefore joining sends a new game
    server message instead of attempting
    to edit the host's message.
    */

    const state={
        ...game,
        players,
        action:"join",
        updated_at:
            Date.now()
    };


    try{

        await createGameOnServer(
            state
        );

        await loadMessages();

    }catch(error){

        alert(
            "Could not join game:\n\n"+
            error.message
        );

    }

}


/*
=========================================================
LEAVE
=========================================================
*/

async function leaveGame(
    game
){

    if(!game)
        return;


    const players=
        game.players.filter(
            player=>
                player.device_id!==
                deviceId
        );


    if(
        game.host_device_id===
        deviceId
    ){

        await forceQuitGame(
            game
        );

        return;

    }


    /*
    A player cannot PATCH the host's
    game message. Create a new state
    so the newest state becomes active.
    */

    const state={
        ...game,
        players,
        action:"leave",
        updated_at:
            Date.now()
    };


    try{

        await createGameOnServer(
            state
        );

        await loadMessages();

    }catch(error){

        alert(
            "Could not leave game:\n\n"+
            error.message
        );

    }

}

/*
=========================================================
TIC TAC TOE
=========================================================
*/

async function playTicTacToe(
    game,
    index
){

    if(!game.started)
        return;

    if(!isMyTurn(game))
        return;

    if(game.board[index])
        return;


    /*
    Only host can PATCH.
    For multiplayer moves, send a
    new game state message.
    */

    const board=[
        ...game.board
    ];


    const symbol=
        game.turn_index%2===0
        ?"X"
        :"O";


    board[index]=
        symbol;


    const winner=
        checkTicTacToe(
            board
        );


    let changes={
        board,
        action:"move",
        turn_index:
            nextTurn(game)
    };


    if(winner){

        changes={
            board,
            finished:true,
            winner,
            action:"finish"
        };

    }


    else if(
        board.every(
            cell=>cell
        )
    ){

        changes={
            board,
            finished:true,
            winner:"draw",
            action:"finish"
        };

    }


    try{

        await createGameOnServer({
            ...game,
            ...changes
        });

        await loadMessages();

    }catch(error){

        alert(
            error.message
        );

    }

}


function checkTicTacToe(
    board
){

    const lines=[

        [0,1,2],
        [3,4,5],
        [6,7,8],

        [0,3,6],
        [1,4,7],
        [2,5,8],

        [0,4,8],
        [2,4,6]

    ];


    for(
        const line
        of lines
    ){

        const [
            a,b,c
        ]=line;


        if(
            board[a] &&
            board[a]===
            board[b] &&
            board[a]===
            board[c]
        ){

            return board[a];

        }

    }


    return null;

}


/*
=========================================================
CONNECT FOUR
=========================================================
*/

async function playConnect4(
    game,
    column
){

    if(!game.started)
        return;

    if(!isMyTurn(game))
        return;


    const board=[
        ...game.board
    ];


    let placed=-1;


    for(
        let row=5;
        row>=0;
        row--
    ){

        const index=
            row*7+
            column;


        if(!board[index]){

            placed=index;

            break;

        }

    }


    if(placed===-1)
        return;


    const symbol=
        game.turn_index%2===0
        ?"🔴"
        :"🟡";


    board[placed]=
        symbol;


    const winner=
        checkConnect4(
            board,
            placed,
            symbol
        );


    let changes={

        board,

        action:"move",

        turn_index:
            nextTurn(game)

    };


    if(winner){

        changes={
            board,
            finished:true,
            winner:symbol,
            action:"finish"
        };

    }


    try{

        await createGameOnServer({
            ...game,
            ...changes
        });

        await loadMessages();

    }catch(error){

        alert(
            error.message
        );

    }

}


function checkConnect4(
    board,
    placed,
    symbol
){

    const row=
        Math.floor(
            placed/7
        );

    const col=
        placed%7;


    const directions=[

        [1,0],
        [0,1],
        [1,1],
        [1,-1]

    ];


    for(
        const [
            dr,
            dc
        ]
        of directions
    ){

        let count=1;


        for(
            let direction
            of [-1,1]
        ){

            let r=row+
                dr*
                direction;

            let c=col+
                dc*
                direction;


            while(
                r>=0 &&
                r<6 &&
                c>=0 &&
                c<7 &&
                board[
                    r*7+c
                ]===
                symbol
            ){

                count++;

                r+=
                    dr*
                    direction;

                c+=
                    dc*
                    direction;

            }

        }


        if(count>=4)
            return true;

    }


    return false;

}

/*

BOARD RACE
=========================================================
*/

async function boardMove(
    game,
    index
){

    if(!isMyTurn(game))
        return;


    const board=[
        ...game.board
    ];


    if(board[index])
        return;


    board[index]=
        game.players[
            game.turn_index %
            game.players.length
        ].username;


    try{

        await createGameOnServer({

            ...game,

            board,

            turn_index:
                nextTurn(game),

            action:"move"

        });


        await loadMessages();

    }catch(error){

        alert(
            error.message
        );

    }

}


/*
=========================================================
SEND MESSAGE
=========================================================
*/

sendBtn.onclick=
    sendMessage;


async function sendMessage(){

    const text=
        messageInput.value
        .trim();


    if(!text && !selectedFile)
        return;


    if(!settings.username){

        settingsBtn.click();

        alert(
            "Set your name before sending messages."
        );

        return;

    }


    let image=null;


    if(selectedFile){

        image=
            await fileToDataURL(
                selectedFile
            );

    }


    try{

        sendBtn.disabled=true;


        const response=
            await fetch(
                API_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            username:
                                settings.username,

                            channel:
                                CHANNEL,

                            message:
                                text,

                            image,

                            device_id:
                                deviceId

                        })

                }
            );


        const data=
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error ||
                "Message could not be sent."
            );

        }


        messageInput.value="";
        selectedFile=null;
        imageInput.value="";


        await loadMessages();


    }catch(error){

        alert(
            "Could not send message:\n\n"+
            error.message
        );

    }finally{

        sendBtn.disabled=false;

    }

}


function fileToDataURL(
    file
){

    return new Promise(
        (resolve,reject)=>{

            const reader=
                new FileReader();


            reader.onload=
                ()=>resolve(
                    reader.result
                );


            reader.onerror=
                reject;


            reader.readAsDataURL(
                file
            );

        }
    );

}

function formatTime(
    date
){

    if(!date)
        return "";

    const d=
        new Date(date);


    return d.toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/*

ESCAPE
=========================================================
*/

function escapeHtml(
    value
){

    return String(
        value
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}
