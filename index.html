<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta
 name="viewport"
 content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
>

<title>Chat</title>

<style>

:root{
 --bg:#0b0d10;
 --panel:#111419;
 --panel2:#171a20;
 --panel3:#1d2129;
 --border:#282d36;
 --text:#f1f3f5;
 --muted:#8d96a3;
 --accent:#5865f2;
 --accent2:#4752c4;
 --danger:#ed4245;
 --success:#3ba55c;
 --warning:#faa61a;
 --text-size:15px;
 --word-spacing:0px;
 --line-spacing:1.35;
 --radius:8px;
 --ui-scale:1;
}

*{
 box-sizing:border-box;
}

html,
body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:var(--bg);
 color:var(--text);
 font-family:
  Inter,
  Arial,
  sans-serif;
}

button,
input,
textarea,
select{
 font:inherit;
}

button{
 cursor:pointer;
}

#app{
 width:100%;
 height:100%;
 display:flex;
 flex-direction:column;
 transform-origin:top left;
}

.header{
 height:58px;
 min-height:58px;
 background:var(--panel);
 border-bottom:1px solid var(--border);
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 16px;
}

.header-left{
 display:flex;
 align-items:center;
 gap:12px;
 min-width:0;
}

.logo{
 width:34px;
 height:34px;
 border-radius:9px;
 background:var(--accent);
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:900;
 color:white;
}

.channel-name{
 font-weight:800;
 font-size:16px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.channel-name span{
 color:var(--muted);
 font-weight:500;
}

.header-actions{
 display:flex;
 gap:7px;
}

.icon-btn{
 width:36px;
 height:36px;
 border:0;
 border-radius:var(--radius);
 background:transparent;
 color:var(--muted);
 font-size:18px;
}

.icon-btn:hover{
 background:var(--panel3);
 color:var(--text);
}

.main{
 flex:1;
 min-height:0;
 display:flex;
}

.sidebar{
 width:240px;
 background:var(--panel);
 border-right:1px solid var(--border);
 padding:12px;
 overflow:auto;
}

.sidebar-title{
 color:var(--muted);
 text-transform:uppercase;
 font-size:11px;
 font-weight:800;
 letter-spacing:.08em;
 margin:8px 8px;
}

.channel{
 padding:9px 10px;
 border-radius:7px;
 color:var(--muted);
 cursor:pointer;
}

.channel.active{
 color:var(--text);
 background:var(--panel3);
}

.channel:hover{
 background:var(--panel3);
 color:var(--text);
}

.chat{
 flex:1;
 min-width:0;
 min-height:0;
 display:flex;
 flex-direction:column;
 background:var(--bg);
}

.messages{
 flex:1;
 min-height:0;
 overflow-y:auto;
 padding:18px 20px 30px;
 scroll-behavior:smooth;
}

.message{
 display:flex;
 gap:11px;
 padding:7px 8px;
 border-radius:7px;
 position:relative;
}

.message:hover{
 background:rgba(255,255,255,.025);
}

.avatar{
 width:38px;
 height:38px;
 min-width:38px;
 border-radius:50%;
 background:var(--accent);
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:800;
 color:white;
}

.message-content{
 min-width:0;
 flex:1;
}

.message-top{
 display:flex;
 align-items:center;
 gap:8px;
 min-height:20px;
}

.username{
 font-weight:800;
 font-size:14px;
}

.time,
.edited{
 color:var(--muted);
 font-size:11px;
}

.message-text{
 margin-top:2px;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
 font-size:var(--text-size);
 word-spacing:var(--word-spacing);
 line-height:var(--line-spacing);
}

.message-image{
 display:block;
 max-width:min(500px,100%);
 max-height:400px;
 margin-top:8px;
 border-radius:8px;
 cursor:pointer;
 object-fit:contain;
}

.composer{
 padding:10px 16px 14px;
}

.composer-box{
 background:var(--panel2);
 border:1px solid var(--border);
 border-radius:10px;
 display:flex;
 align-items:flex-end;
 padding:7px;
 gap:7px;
}

.message-input{
 flex:1;
 min-width:0;
 max-height:150px;
 resize:none;
 border:0;
 outline:0;
 background:transparent;
 color:var(--text);
 padding:9px;
 line-height:1.4;
}

.message-input::placeholder{
 color:#6f7782;
}

.attach-btn,
.send-btn{
 width:38px;
 height:38px;
 border:0;
 border-radius:8px;
 display:flex;
 align-items:center;
 justify-content:center;
 flex-shrink:0;
}

.attach-btn{
 background:transparent;
 color:var(--muted);
 font-size:22px;
}

.attach-btn:hover{
 background:var(--panel3);
 color:var(--text);
}

.send-btn{
 background:var(--accent);
 color:white;
 font-weight:800;
}

.send-btn:hover{
 background:var(--accent2);
}

.send-btn:disabled{
 opacity:.5;
 cursor:not-allowed;
}

/* ==============================
   GAME MESSAGE
============================== */

.game-message{
 margin:12px 8px;
 border:1px solid var(--border);
 border-radius:12px;
 overflow:hidden;
 background:var(--panel);
 box-shadow:0 5px 20px rgba(0,0,0,.2);
}

.game-header{
 padding:14px;
 background:var(--panel2);
 border-bottom:1px solid var(--border);
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
}

.game-title-row{
 display:flex;
 align-items:center;
 gap:11px;
 min-width:0;
}

.game-icon{
 width:42px;
 height:42px;
 border-radius:10px;
 background:var(--accent);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:22px;
}

.game-title{
 min-width:0;
}

.game-title strong{
 display:block;
 font-size:15px;
}

.game-title span{
 display:block;
 color:var(--muted);
 font-size:12px;
 margin-top:2px;
}

.game-status{
 font-size:12px;
 color:var(--muted);
 text-align:right;
}

.game-body{
 padding:14px;
}

.game-players{
 display:flex;
 flex-wrap:wrap;
 gap:7px;
 margin-bottom:12px;
}

.player-chip{
 background:var(--panel3);
 border:1px solid var(--border);
 border-radius:999px;
 padding:5px 9px;
 font-size:12px;
}

.player-chip.host{
 border-color:var(--warning);
}

.game-controls{
 display:flex;
 flex-wrap:wrap;
 gap:7px;
 margin-top:12px;
}

.primary-btn,
.secondary-btn,
.danger-btn{
 border:0;
 border-radius:7px;
 padding:8px 12px;
 font-weight:700;
 color:white;
}

.primary-btn{
 background:var(--accent);
}

.primary-btn:hover{
 background:var(--accent2);
}

.secondary-btn{
 background:var(--panel3);
 border:1px solid var(--border);
}

.secondary-btn:hover{
 background:#252a33;
}

.danger-btn{
 background:var(--danger);
}

.danger-btn:hover{
 filter:brightness(.9);
}

.game-note{
 color:var(--muted);
 font-size:12px;
 margin-top:8px;
}

/* TIC TAC TOE */

.ttt{
 width:min(300px,100%);
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:7px;
 margin:10px auto;
}

.ttt button{
 aspect-ratio:1;
 border:1px solid var(--border);
 background:var(--panel3);
 border-radius:8px;
 color:var(--text);
 font-size:30px;
 font-weight:900;
}

.ttt button:hover{
 background:#292e38;
}

/* CONNECT FOUR */

.connect4{
 width:min(420px,100%);
 margin:10px auto;
 background:#202b55;
 padding:8px;
 border-radius:10px;
 display:grid;
 grid-template-columns:repeat(7,1fr);
 gap:6px;
}

.connect4-column{
 border:0;
 background:transparent;
 padding:0;
 display:flex;
 flex-direction:column;
 gap:6px;
}

.connect4-column:hover{
 opacity:.8;
}

.connect4-cell{
 aspect-ratio:1;
 border-radius:50%;
 background:#0c0f15;
 border:2px solid rgba(255,255,255,.06);
}

.connect4-cell.red{
 background:#ed4245;
}

.connect4-cell.yellow{
 background:#faa61a;
}

/* DICE */

.dice-result{
 text-align:center;
 padding:18px;
}

.dice-number{
 font-size:58px;
 font-weight:900;
}

/* HIGHER LOWER */

.hl-number{
 text-align:center;
 font-size:48px;
 font-weight:900;
 margin:10px;
}

.hl-buttons{
 display:flex;
 justify-content:center;
 gap:8px;
}

/* RPS */

.rps-buttons{
 display:flex;
 flex-wrap:wrap;
 justify-content:center;
 gap:8px;
}

/* CONTEXT */

.context-menu{
 position:fixed;
 z-index:1000;
 display:none;
 min-width:160px;
 background:var(--panel2);
 border:1px solid var(--border);
 border-radius:8px;
 padding:5px;
 box-shadow:0 10px 30px rgba(0,0,0,.45);
}

.context-menu.show{
 display:block;
}

.context-menu button{
 display:block;
 width:100%;
 border:0;
 background:transparent;
 color:var(--text);
 text-align:left;
 padding:9px 10px;
 border-radius:5px;
}

.context-menu button:hover{
 background:var(--panel3);
}

.context-menu .delete{
 color:#ff6b6b;
}

/* SETTINGS */

.overlay{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.7);
 z-index:900;
 display:none;
 align-items:center;
 justify-content:center;
 padding:15px;
}

.overlay.show{
 display:flex;
}

.settings{
 width:min(600px,100%);
 max-height:90vh;
 overflow:auto;
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:12px;
 box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.settings-header{
 padding:16px;
 border-bottom:1px solid var(--border);
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.settings-body{
 padding:16px;
}

.category-title{
 width:100%;
 border:0;
 background:var(--panel2);
 color:var(--text);
 padding:11px;
 text-align:left;
 border-radius:7px;
 margin:7px 0;
 font-weight:800;
}

.category-content{
 display:none;
 padding:5px 5px 10px;
}

.category.open .category-content{
 display:block;
}

.setting{
 margin:13px 0;
}

.setting label{
 display:flex;
 justify-content:space-between;
 margin-bottom:6px;
 color:var(--muted);
 font-size:13px;
}

.setting input,
.setting select{
 width:100%;
 background:var(--panel2);
 color:var(--text);
 border:1px solid var(--border);
 border-radius:7px;
 padding:9px;
 outline:none;
}

.setting input[type="range"]{
 padding:0;
}

.settings-footer{
 padding:14px 16px;
 border-top:1px solid var(--border);
 display:flex;
 justify-content:flex-end;
 gap:8px;
}

/* IMAGE VIEWER */

.image-viewer{
 position:fixed;
 inset:0;
 z-index:1100;
 display:none;
 align-items:center;
 justify-content:center;
 background:rgba(0,0,0,.9);
 padding:30px;
}

.image-viewer.show{
 display:flex;
}

.image-viewer img{
 max-width:100%;
 max-height:100%;
 object-fit:contain;
}

/* EMPTY */

.empty{
 color:var(--muted);
 text-align:center;
 padding:50px 20px;
}

/* MOBILE */

@media(max-width:700px){

 .sidebar{
  display:none;
 }

 .messages{
  padding:10px 8px 20px;
 }

 .composer{
  padding:7px;
 }

 .game-message{
  margin-left:2px;
  margin-right:2px;
 }

 .header{
  padding:0 10px;
 }

}

/* COMPACT */

.compact .message{
 padding-top:2px;
 padding-bottom:2px;
}

.compact .avatar{
 width:30px;
 height:30px;
 min-width:30px;
 font-size:12px;
}

</style>

</head>

<body>

<div id="app">

 <header class="header">

  <div class="header-left">

   <div class="logo">C</div>

   <div class="channel-name">
    # <span id="channelName">general</span>
   </div>

  </div>

  <div class="header-actions">

   <button
    class="icon-btn"
    id="settingsBtn"
    title="Settings">
    ⚙
   </button>

  </div>

 </header>


 <main class="main">

  <aside class="sidebar">

   <div class="sidebar-title">
    Channels
   </div>

   <div class="channel active">
    # general
   </div>

   <div class="sidebar-title">
    Games
   </div>

   <div
    class="channel"
    id="createGameButton">
    🎮 Create Game
   </div>

  </aside>


  <section class="chat">

   <div
    class="messages"
    id="messages">
   </div>


   <div class="composer">

    <div class="composer-box">

     <button
      class="attach-btn"
      id="attachBtn"
      title="Attach image">
      ＋
     </button>

     <input
      type="file"
      id="imageInput"
      accept="image/*"
      hidden
     >

     <textarea
      class="message-input"
      id="messageInput"
      rows="1"
      placeholder="Message #general..."
     ></textarea>

     <button
      class="send-btn"
      id="sendBtn">
      ➤
     </button>

    </div>

   </div>

  </section>

 </main>

</div>


<!-- CONTEXT MENU -->

<div
 class="context-menu"
 id="contextMenu">

 <button id="editMessageBtn">
  ✏️ Edit
 </button>

 <button
  class="delete"
  id="deleteMessageBtn">
  🗑 Delete
 </button>

</div>


<!-- SETTINGS -->

<div
 class="overlay"
 id="settingsOverlay">

 <div class="settings">

  <div class="settings-header">

   <strong>
    Settings
   </strong>

   <button
    class="icon-btn"
    id="closeSettings">
    ×
   </button>

  </div>


  <div class="settings-body">


   <div class="category open">

    <button class="category-title">
     👤 Account
    </button>

    <div class="category-content">

     <div class="setting">

      <label>
       Username
      </label>

      <input
       id="usernameInput"
       maxlength="24"
       placeholder="Your name"
      >

     </div>


     <div class="setting">

      <label>
       Device ID
      </label>

      <input
       id="deviceIdInput"
       readonly
      >

     </div>

    </div>

   </div>


   <div class="category">

    <button class="category-title">
     🎨 Appearance
    </button>

    <div class="category-content">

     <div class="setting">

      <label>
       Theme
      </label>

      <select id="themeSelect">

       <option value="dark">
        Dark
       </option>

       <option value="midnight">
        Midnight
       </option>

       <option value="black">
        Black
       </option>

       <option value="blue">
        Blue
       </option>

       <option value="purple">
        Purple
       </option>

       <option value="green">
        Green
       </option>

       <option value="red">
        Red
       </option>

       <option value="gray">
        Gray
       </option>

       <option value="light">
        Light
       </option>

       <option value="oled">
        OLED
       </option>

      </select>

     </div>


     <div class="setting">

      <label>
       Text size
       <span id="textSizeValue"></span>
      </label>

      <input
       type="range"
       id="textSize"
       min="11"
       max="24"
       step="1"
      >

     </div>


     <div class="setting">

      <label>
       Word spacing
       <span id="wordSpacingValue"></span>
      </label>

      <input
       type="range"
       id="wordSpacing"
       min="0"
       max="10"
       step="1"
      >

     </div>


     <div class="setting">

      <label>
       Line spacing
       <span id="lineSpacingValue"></span>
      </label>

      <input
       type="range"
       id="lineSpacing"
       min="1"
       max="2"
       step=".05"
      >

     </div>


     <div class="setting">

      <label>
       Corner radius
       <span id="cornerRadiusValue"></span>
      </label>

      <input
       type="range"
       id="cornerRadius"
       min="0"
       max="20"
       step="1"
      >

     </div>


     <div class="setting">

      <label>
       UI scale
       <span id="uiScaleValue"></span>
      </label>

      <input
       type="range"
       id="uiScale"
       min=".8"
       max="1.2"
       step=".05"
      >

     </div>

    </div>

   </div>


   <div class="category">

    <button class="category-title">
     💬 Chat
    </button>

    <div class="category-content">

     <div class="setting">

      <label>
       Refresh rate
      </label>

      <select id="refreshRate">

       <option value="500">0.5 seconds</option>
       <option value="1000">1 second</option>
       <option value="2000">2 seconds</option>
       <option value="5000">5 seconds</option>

      </select>

     </div>


     <div class="setting">

      <label>
       Show timestamps
      </label>

      <select id="showTimestamps">

       <option value="true">Yes</option>
       <option value="false">No</option>

      </select>

     </div>


     <div class="setting">

      <label>
       Compact messages
      </label>

      <select id="compactMessages">

       <option value="false">No</option>
       <option value="true">Yes</option>

      </select>

     </div>


     <div class="setting">

      <label>
       Enter sends message
      </label>

      <select id="enterToSend">

       <option value="true">Yes</option>
       <option value="false">No</option>

      </select>

     </div>


     <div class="setting">

      <label>
       Auto scroll
      </label>

      <select id="autoScroll">

       <option value="true">Yes</option>
       <option value="false">No</option>

      </select>

     </div>


     <div class="setting">

      <label>
       Confirm delete
      </label>

      <select id="confirmDelete">

       <option value="true">Yes</option>
       <option value="false">No</option>

      </select>

     </div>

    </div>

   </div>

  </div>


  <div class="settings-footer">

   <button
    class="secondary-btn"
    id="closeSettings2">
    Cancel
   </button>

   <button
    class="primary-btn"
    id="saveSettings">
    Save
   </button>

  </div>

 </div>

</div>


<!-- IMAGE VIEWER -->

<div
 class="image-viewer"
 id="imageViewer">

 <img id="fullImage">

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const API_URL="/api/message.js";

const CHANNEL="general";


/* =====================================================
   STATE
===================================================== */

let deviceId=
 localStorage.getItem("chat_device_id");

if(!deviceId){

 deviceId=
  crypto.randomUUID();

 localStorage.setItem(
  "chat_device_id",
  deviceId
 );

}


const defaultSettings={

 username:"",
 theme:"dark",
 refreshRate:1000,
 showTimestamps:true,
 compactMessages:false,
 textSize:15,
 wordSpacing:0,
 lineSpacing:1.35,
 cornerRadius:8,
 uiScale:1,
 enterToSend:true,
 autoScroll:true,
 confirmDelete:true

};


const settings={};

Object.keys(defaultSettings).forEach(key=>{

 const saved=
  localStorage.getItem("chat_"+key);

 if(saved===null){

  settings[key]=
   defaultSettings[key];

 }else{

  if(
   typeof defaultSettings[key]==="boolean"
  ){

   settings[key]=
    saved==="true";

  }else if(
   typeof defaultSettings[key]==="number"
  ){

   settings[key]=Number(saved);

  }else{

   settings[key]=saved;

  }

 }

});


let currentMessages=[];
let games=[];
let selectedFile=null;
let selectedMessage=null;
let chatRefreshTimer=null;
let gameRefreshTimer=null;


/* =====================================================
   ELEMENTS
===================================================== */

const messagesEl=
 document.getElementById("messages");

const messageInput=
 document.getElementById("messageInput");

const sendBtn=
 document.getElementById("sendBtn");

const attachBtn=
 document.getElementById("attachBtn");

const imageInput=
 document.getElementById("imageInput");

const settingsBtn=
 document.getElementById("settingsBtn");

const settingsOverlay=
 document.getElementById("settingsOverlay");

const closeSettings=
 document.getElementById("closeSettings");

const closeSettings2=
 document.getElementById("closeSettings2");

const saveSettings=
 document.getElementById("saveSettings");

const usernameInput=
 document.getElementById("usernameInput");

const deviceIdInput=
 document.getElementById("deviceIdInput");

const themeSelect=
 document.getElementById("themeSelect");

const refreshRate=
 document.getElementById("refreshRate");

const showTimestamps=
 document.getElementById("showTimestamps");

const compactMessages=
 document.getElementById("compactMessages");

const textSize=
 document.getElementById("textSize");

const wordSpacing=
 document.getElementById("wordSpacing");

const lineSpacing=
 document.getElementById("lineSpacing");

const cornerRadius=
 document.getElementById("cornerRadius");

const uiScale=
 document.getElementById("uiScale");

const enterToSend=
 document.getElementById("enterToSend");

const autoScroll=
 document.getElementById("autoScroll");

const confirmDelete=
 document.getElementById("confirmDelete");

const textSizeValue=
 document.getElementById("textSizeValue");

const wordSpacingValue=
 document.getElementById("wordSpacingValue");

const lineSpacingValue=
 document.getElementById("lineSpacingValue");

const cornerRadiusValue=
 document.getElementById("cornerRadiusValue");

const uiScaleValue=
 document.getElementById("uiScaleValue");

const contextMenu=
 document.getElementById("contextMenu");

const editMessageBtn=
 document.getElementById("editMessageBtn");

const deleteMessageBtn=
 document.getElementById("deleteMessageBtn");

const fullImage=
 document.getElementById("fullImage");

const imageViewer=
 document.getElementById("imageViewer");


/* =====================================================
   GAME DEFINITIONS

   FIXED PLAYER LIMITS
===================================================== */

const gameDefinitions={

 tictactoe:{
  name:"Tic Tac Toe",
  icon:"❌",
  min:2,
  max:2
 },

 connect4:{
  name:"Connect Four",
  icon:"🔴",
  min:2,
  max:2
 },

 dice:{
  name:"Dice Battle",
  icon:"🎲",
  min:2,
  max:6
 },

 higherlower:{
  name:"Higher or Lower",
  icon:"🔢",
  min:2,
  max:6
 },

 rps:{
  name:"Rock Paper Scissors",
  icon:"✊",
  min:2,
  max:6
 }

};


/* =====================================================
   API
===================================================== */

async function apiRequest(
 method,
 body=null
){

 const options={
  method,
  headers:{
   "Content-Type":
    "application/json"
  }
 };

 if(body)
  options.body=
   JSON.stringify(body);

 const response=
  await fetch(
   API_URL+
   "?channel="+
   encodeURIComponent(CHANNEL),
   options
  );

 const data=
  await response.json();

 if(!response.ok){

  throw new Error(
   data.error||
   "Server request failed."
  );

 }

 return data;

}


/* =====================================================
   LOAD CHAT
===================================================== */

async function loadMessages(){

 try{

  const response=
   await fetch(
    API_URL+
    "?channel="+
    encodeURIComponent(CHANNEL)
   );

  const data=
   await response.json();

  if(!response.ok)
   throw new Error(
    data.error||
    "Failed to load messages."
   );

  currentMessages=
   Array.isArray(data.messages)
   ?data.messages
   :[];


  games=[];

  for(const message of currentMessages){

   if(
    message.username===
    "__GAME_SERVER__"
   ){

    try{

     const game=
      JSON.parse(
       message.message
      );

     if(
      game &&
      game.id
     ){

      game.server_message_id=
       message.id;

      games.push(game);

     }

    }catch{}

   }

  }


  renderMessages();

 }catch(error){

  console.error(
   "Load error:",
   error
  );

 }

}


/* =====================================================
   FIND GAME
===================================================== */

function findGame(id){

 return games.find(
  g=>g.id===id
 );

}


/* =====================================================
   CREATE GAME
===================================================== */

function createGame(type){

 const def=
  gameDefinitions[type];

 if(!def)return;


 if(
  games.some(
   g=>
    g.status==="lobby"||
    g.status==="playing"
  )
 ){

  alert(
   "There is already an active game in chat."
  );

  return;

 }


 const game={

  id:
   "game_"+Date.now()+"_"+Math.random()
   .toString(36)
   .substring(2,8),

  game_type:type,

  name:def.name,

  host_device_id:deviceId,

  host_username:
   settings.username||"Player",

  players:[

   {
    device_id:deviceId,
    username:
     settings.username||"Player"
   }

  ],

  min_players:def.min,

  max_players:def.max,

  status:"lobby",

  turn_index:0,

  turn_device_id:null,

  created_at:Date.now(),

  updated_at:Date.now(),

  state:createInitialState(type)

 };


 saveGame(game);

}


/* =====================================================
   INITIAL GAME STATE
===================================================== */

function createInitialState(type){

 if(type==="tictactoe"){

  return{
   board:Array(9).fill(null),
   winner:null,
   draw:false
  };

 }

 if(type==="connect4"){

  return{
   board:Array(42).fill(null),
   winner:null,
   draw:false
  };

 }

 if(type==="dice"){

  return{
   rolls:{},
   last_roll:null,
   round:1,
   message:"Roll the dice!"
  };

 }

 if(type==="higherlower"){

  return{
   current_number:
    Math.floor(Math.random()*100)+1,
   message:"Guess higher or lower!"
  };

 }

 if(type==="rps"){

  return{
   choices:{},
   message:"Choose your move!"
  };

 }

 return{};

}


/* =====================================================
   SAVE GAME
===================================================== */

async function saveGame(game){

 try{

  game.updated_at=Date.now();

  if(!game.server_message_id){

   const result=
    await apiRequest(
     "POST",
     {
      username:
       "__GAME_SERVER__",

      channel:CHANNEL,

      message:
       JSON.stringify(game),

      device_id:deviceId,

      game_server:true
     }
    );

   game.server_message_id=
    result.game?.id;

  }else{

   await apiRequest(
    "PATCH",
    {
     id:game.server_message_id,
     device_id:
      game.host_device_id,

     game_server:true,

     game_state:
      JSON.stringify(game)
    }
   );

  }

  await loadMessages();

 }catch(error){

  console.error(
   "Save game error:",
   error
  );

 }

}


/* =====================================================
   FORCE STOP GAME

   IMPORTANT:
   Deletes the actual game-server
   message from Supabase.

   Everyone's refresh therefore removes it.
===================================================== */

async function forceQuitGame(gameId){

 const game=
  findGame(gameId);

 if(!game)return;

 if(
  game.host_device_id!==deviceId
 ){

  return;

 }


 try{

  await apiRequest(
   "DELETE",
   {
    id:game.server_message_id,
    device_id:deviceId,
    game_server:true
   }
  );

  await loadMessages();

 }catch(error){

  alert(
   "Could not stop game:\n\n"+
   error.message
  );

 }

}


/* =====================================================
   JOIN GAME
===================================================== */

async function joinGame(gameId){

 const game=
  findGame(gameId);

 if(!game)return;

 if(game.status!=="lobby")return;

 if(
  game.players.some(
   p=>p.device_id===deviceId
  )
 ){

  return;

 }

 if(
  game.players.length>=
  game.max_players
 ){

  alert("This game is full.");

  return;

 }

 game.players.push({

  device_id:deviceId,

  username:
   settings.username||
   "Player"

 });

 game.updated_at=Date.now();

 await saveGameAsHost(game);

}


/* =====================================================
   LEAVE GAME
===================================================== */

async function leaveGame(gameId){

 const game=
  findGame(gameId);

 if(!game)return;

 const index=
  game.players.findIndex(
   p=>p.device_id===deviceId
  );

 if(index<0)return;


 /*
  If host leaves, the entire game
  is removed for everyone.
 */

 if(
  game.host_device_id===deviceId
 ){

  await forceQuitGame(gameId);

  return;

 }


 game.players.splice(
  index,
  1
 );


 if(
  game.players.length<
  game.min_players
 ){

  game.status="lobby";

 }


 if(
  game.turn_device_id===deviceId
 ){

  if(game.players.length){

   game.turn_index=
    game.turn_index%
    game.players.length;

   game.turn_device_id=
    game.players[
     game.turn_index
    ].device_id;

  }else{

   game.turn_device_id=null;

  }

 }


 await saveGameAsHost(game);

}


/* =====================================================
   HOST SAVE

   The host is the only device allowed
   to change the shared game message.
===================================================== */

async function saveGameAsHost(game){

 if(
  game.host_device_id!==deviceId
 ){

  /*
   A player who joins/leaves cannot
   directly PATCH the host's message
   using the old API.

   Instead send a request through the
   game action system below.
  */

  await sendGameAction(
   game,
   "update_players"
  );

  return;

 }

 await saveGame(game);

}


/* =====================================================
   GAME ACTION SYSTEM

   Player actions are sent as a temporary
   normal message understood by the host.

   This keeps your existing API compatible.
===================================================== */

async function sendGameAction(
 game,
 action,
 data={}
){

 /*
  The current simple API does not provide
  a dedicated game-action table.

  We therefore use a game server message
  update only when the current device is host.

  For non-host changes, we create a small
  action message. The host sees it on refresh.
 */

 try{

  await apiRequest(
   "POST",
   {
    username:
     "__GAME_ACTION__",

    channel:CHANNEL,

    message:
     JSON.stringify({

      game_id:game.id,

      action,

      data,

      device_id:deviceId,

      username:
       settings.username||
       "Player"

     }),

    device_id:deviceId
   }
  );

  await loadMessages();

 }catch(error){

  console.error(
   error
  );

 }

}


/* =====================================================
   START GAME
===================================================== */

async function startGame(gameId){

 const game=
  findGame(gameId);

 if(!game)return;

 if(
  game.host_device_id!==deviceId
 ){

  return;

 }

 if(
  game.players.length<
  game.min_players
 ){

  alert(
   "You need at least "+
   game.min_players+
   " players to start."
  );

  return;

 }

 game.status="playing";

 game.turn_index=0;

 game.turn_device_id=
  game.players[0].device_id;

 game.updated_at=Date.now();

 await saveGame(game);

}


/* =====================================================
   HANDLE GAME ACTIONS
===================================================== */

async function processGameActions(){

 const actionMessages=
  currentMessages.filter(
   m=>
    m.username===
    "__GAME_ACTION__"
  );

 for(const message of actionMessages){

  try{

   const action=
    JSON.parse(message.message);

   const game=
    findGame(action.game_id);

   if(!game)continue;

   if(
    game.host_device_id!==deviceId
   )continue;

   if(
    game._processedActions &&
    game._processedActions[
     message.id
    ]
   )continue;

   if(!game._processedActions)
    game._processedActions={};

   game._processedActions[
    message.id
   ]=true;


   if(
    action.action==="update_players"
   ){

    /*
     Player join/leave cannot safely
     modify the host state directly.

     Re-read the action list and rebuild
     player membership from the actions.
    */

    /*
     For simplicity this action is
     intentionally ignored here unless
     a dedicated game table is used.
    */

   }

  }catch{}

 }

}


/* =====================================================
   NEXT TURN
===================================================== */

function nextTurn(game){

 if(!game.players.length){

  game.turn_device_id=null;

  return;

 }

 game.turn_index=
  (
   Number(game.turn_index)+1
  )%
  game.players.length;

 game.turn_device_id=
  game.players[
   game.turn_index
  ].device_id;

}


/* =====================================================
   PLAY MOVE
===================================================== */

async function playMove(
 gameId,
 position
){

 const game=
  findGame(gameId);

 if(!game)return;

 if(
  game.game_type==="connect4"
 ){

  await connect4Move(
   game,
   position
  );

  return;

 }

 if(
  game.game_type!=="tictactoe"
 )return;

 if(
  game.status!=="playing"
 )return;

 if(
  game.turn_device_id!==deviceId
 )return;

 const board=[
  ...game.state.board
 ];

 if(board[position])
  return;

 const symbol=
  game.turn_index===0
  ?"X"
  :"O";

 board[position]=symbol;

 game.state.board=board;


 const winner=
  checkTTT(board);

 if(winner){

  game.state.winner=
   winner==="X"
   ?game.players[0]?.username
   :game.players[1]?.username;

  game.status="finished";

  await saveGameAsHost(game);

  return;

 }


 if(board.every(Boolean)){

  game.state.draw=true;

  game.status="finished";

  await saveGameAsHost(game);

  return;

 }


 nextTurn(game);

 await saveGameAsHost(game);

}


/* =====================================================
   TTT CHECK
===================================================== */

function checkTTT(board){

 const lines=[

  [0,1,2],
  [3,4,5],
  [6,7,8],

  [0,3,6],
  [1,4,7],
  [2,5,8],

  [0,4,8],
  [2,4,6]

 ];

 for(
  const line of lines
 ){

  const[a,b,c]=line;

  if(
   board[a] &&
   board[a]===board[b] &&
   board[a]===board[c]
  ){

   return board[a];

  }

 }

 return null;

}


/* =====================================================
   CONNECT FOUR
===================================================== */

async function connect4Move(
 game,
 column
){

 if(
  game.status!=="playing"
 )return;

 if(
  game.turn_device_id!==deviceId
 )return;

 const board=[
  ...game.state.board
 ];

 let row=-1;

 for(
  let r=5;
  r>=0;
  r--
 ){

  const index=
   r*7+column;

  if(!board[index]){

   row=r;

   break;

  }

 }

 if(row<0)return;

 const symbol=
  game.turn_index===0
  ?"R"
  :"Y";

 board[
  row*7+column
 ]=symbol;

 game.state.board=board;


 if(
  checkConnect4(
   board,
   symbol
  )
 ){

  const player=
   game.players[
    game.turn_index
   ];

  game.state.winner=
   player?.username||
   "Player";

  game.status="finished";

  await saveGameAsHost(game);

  return;

 }


 if(
  board.every(Boolean)
 ){

  game.state.draw=true;

  game.status="finished";

  await saveGameAsHost(game);

  return;

 }


 nextTurn(game);

 await saveGameAsHost(game);

}


/* =====================================================
   CONNECT FOUR CHECK
===================================================== */

function checkConnect4(
 board,
 symbol
){

 for(
  let r=0;
  r<6;
  r++
 ){

  for(
   let c=0;
   c<7;
   c++
  ){

   const i=
    r*7+c;

   if(board[i]!==symbol)
    continue;


   if(
    c<=3 &&
    board[i+1]===symbol &&
    board[i+2]===symbol &&
    board[i+3]===symbol
   )
    return true;


   if(
    r<=2 &&
    board[i+7]===symbol &&
    board[i+14]===symbol &&
    board[i+21]===symbol
   )
    return true;


   if(
    r<=2 &&
    c<=3 &&
    board[i+8]===symbol &&
    board[i+16]===symbol &&
    board[i+24]===symbol
   )
    return true;


   if(
    r<=2 &&
    c>=3 &&
    board[i+6]===symbol &&
    board[i+12]===symbol &&
    board[i+18]===symbol
   )
    return true;

  }

 }

 return false;

}


/* =====================================================
   DICE
===================================================== */

async function rollDice(gameId){

 const game=
  findGame(gameId);

 if(!game)return;

 if(
  game.status!=="playing"
 )return;

 if(
  game.turn_device_id!==deviceId
 )return;


 const roll=
  Math.floor(
   Math.random()*6
  )+1;

 game.state.rolls[
  deviceId
 ]=roll;

 game.state.last_roll=
  roll;

 game.state.message=
  settings.username+
  " rolled "+
  roll;


 if(
  Object.keys(
   game.state.rolls
  ).length>=game.players.length
 ){

  let winner=null;
  let best=-1;

  for(
   const player of game.players
  ){

   const value=
    game.state.rolls[
     player.device_id
    ]||0;

   if(value>best){

    best=value;

    winner=player;

   }

  }

  game.state.message=
   "🏆 "+
   (
    winner?.username||
    "Player"
   )+
   " wins with "+
   best+"!";

  game.state.rolls={};

  game.state.round++;

 }

 nextTurn(game);

 await saveGameAsHost(game);

}


/* =====================================================
   HIGHER LOWER
===================================================== */

async function higherLower(
 gameId,
 guess
){

 const game=
  findGame(gameId);

 if(!game)return;

 if(
  game.status!=="playing"
 )return;

 if(
  game.turn_device_id!==deviceId
 )return;


 const old=
  Number(
   game.state.current_number
  );

 const next=
  Math.floor(
   Math.random()*100
  )+1;

 const correct=
  guess==="higher"
  ?next>old
  :next<old;


 game.state.current_number=
  next;


 game.state.message=
  correct
  ?"✅ Correct! "+
   settings.username+
   " guessed "+
   guess+"."
  :"❌ Wrong! "+
   settings.username+
   " guessed "+
   guess+".";


 nextTurn(game);

 await saveGameAsHost(game);

}


/* =====================================================
   RPS
===================================================== */

async function playRPS(
 gameId,
 choice
){

 const game=
  findGame(gameId);

 if(!game)return;

 if(
  game.status!=="playing"
 )return;

 if(
  game.turn_device_id!==deviceId
 )return;


 game.state.choices[
  deviceId
 ]=choice;


 const chosen=
  Object.keys(
   game.state.choices
  ).length;


 if(
  chosen<
  game.players.length
 ){

  nextTurn(game);

  game.state.message=
   settings.username+
   " selected a move.";

  await saveGameAsHost(game);

  return;

 }


 const choices=
  game.state.choices;

 const wins={};

 for(
  const player of game.players
 ){

  wins[
   player.device_id
  ]=0;

 }


 const ids=
  game.players.map(
   p=>p.device_id
  );


 function beats(a,b){

  return(

   a==="rock" &&
   b==="scissors"

   ||

   a==="paper" &&
   b==="rock"

   ||

   a==="scissors" &&
   b==="paper"

  );

 }


 for(
  let i=0;
  i<ids.length;
  i++
 ){

  for(
   let j=i+1;
   j<ids.length;
   j++
  ){

   const a=
    choices[ids[i]];

   const b=
    choices[ids[j]];

   if(a===b)
    continue;

   if(beats(a,b))
    wins[ids[i]]++;
   else
    wins[ids[j]]++;

  }

 }


 let winnerId=null;
 let best=-1;

 for(
  const id of ids
 ){

  if(
   wins[id]>best
  ){

   best=wins[id];

   winnerId=id;

  }

 }


 const winner=
  game.players.find(
   p=>
    p.device_id===
    winnerId
  );


 game.state.message=
  "🏆 "+
  (
   winner?.username||
   "Player"
  )+
  " wins!";


 game.state.winner=
  winner?.username||
  "Player";


 game.state.choices={};

 game.turn_index=0;

 game.turn_device_id=
  game.players[0]?.device_id||
  null;


 await saveGameAsHost(game);

}


/* =====================================================
   RENDER MESSAGES

   Games are rendered directly into
   the same chat message list.
===================================================== */

function renderMessages(){

 const oldBottom=
  messagesEl.scrollHeight-
  messagesEl.scrollTop-
  messagesEl.clientHeight<
  100;


 const fragment=
  document.createDocumentFragment();


 for(
  const message of currentMessages
 ){

  /*
   Hide game server messages.
  */

  if(
   message.username===
   "__GAME_SERVER__"
  ){

   const game=
    games.find(
     g=>
      g.server_message_id===
      message.id
    );

   if(game){

    fragment.appendChild(
     createGameElement(game)
    );

   }

   continue;

  }


  /*
   Hide internal game action messages.
  */

  if(
   message.username===
   "__GAME_ACTION__"
  ){

   continue;

  }


  const item=
   document.createElement("div");

  item.className="message";

  item.dataset.id=
   message.id;


  const avatar=
   document.createElement("div");

  avatar.className="avatar";

  avatar.textContent=
   (
    message.username||
    "?"
   )
   .charAt(0)
   .toUpperCase();


  const content=
   document.createElement("div");

  content.className=
   "message-content";


  const top=
   document.createElement("div");

  top.className="message-top";


  const name=
   document.createElement("span");

  name.className="username";

  name.textContent=
   message.username||
   "User";


  top.appendChild(name);


  if(
   settings.showTimestamps
  ){

   const time=
    document.createElement("span");

   time.className="time";

   time.textContent=
    formatTime(
     message.created_at
    );

   top.appendChild(time);

  }


  if(message.edited){

   const edited=
    document.createElement("span");

   edited.className="edited";

   edited.textContent=
    "(edited)";

   top.appendChild(edited);

  }


  content.appendChild(top);


  if(message.message){

   const text=
    document.createElement("div");

   text.className=
    "message-text";

   text.textContent=
    message.message;

   content.appendChild(text);

  }


  if(message.image){

   const img=
    document.createElement("img");

   img.className=
    "message-image";

   img.src=
    message.image;

   img.alt="Image";

   img.onclick=()=>{
    openImage(
     message.image
    );
   };

   content.appendChild(img);

  }


  item.appendChild(avatar);

  item.appendChild(content);


  if(
   message.device_id===
   deviceId
  ){

   item.oncontextmenu=e=>{

    e.preventDefault();

    selectedMessage=
     message;

    contextMenu.style.left=
     Math.min(
      e.clientX,
      innerWidth-170
     )+"px";

    contextMenu.style.top=
     Math.min(
      e.clientY,
      innerHeight-100
     )+"px";

    contextMenu.classList.add(
     "show"
    );

   };

  }


  fragment.appendChild(item);

 }


 messagesEl.replaceChildren(
  fragment
 );


 if(
  oldBottom &&
  settings.autoScroll
 ){

  messagesEl.scrollTop=
   messagesEl.scrollHeight;

 }

}


/* =====================================================
   GAME ELEMENT
===================================================== */

function createGameElement(game){

 const wrapper=
  document.createElement("div");

 wrapper.className=
  "game-message";

 const def=
  gameDefinitions[
   game.game_type
  ];


 const joined=
  game.players.some(
   p=>
    p.device_id===
    deviceId
  );


 const host=
  game.host_device_id===
  deviceId;


 const header=
  document.createElement("div");

 header.className=
  "game-header";


 const titleRow=
  document.createElement("div");

 titleRow.className=
  "game-title-row";


 const icon=
  document.createElement("div");

 icon.className=
  "game-icon";

 icon.textContent=
  def?.icon||
  "🎮";


 const title=
  document.createElement("div");

 title.className=
  "game-title";


 const strong=
  document.createElement("strong");

 strong.textContent=
  game.name;


 const subtitle=
  document.createElement("span");

 subtitle.textContent=
  def.name+
  " • "+
  def.min+
  "-"+
  def.max+
  " players";


 title.appendChild(strong);
 title.appendChild(subtitle);

 titleRow.appendChild(icon);
 titleRow.appendChild(title);


 const status=
  document.createElement("div");

 status.className=
  "game-status";


 if(game.status==="lobby"){

  status.textContent=
   "Waiting for players";

 }else if(
  game.status==="playing"
 ){

  const turn=
   game.players[
    game.turn_index
   ];

  status.textContent=

 }else{

 }


 header.appendChild(titleRow);

 body.className=

  );

 /*

 controls.className=

 if(

/* =====================================================
   GAME BOARD RENDER
===================================================== */

function renderGameBoard(
 container,
 game
){

 if(
  game.game_type==="tictactoe"
 ){

  const board=
   document.createElement("div");

  board.className="ttt";


  game.state.board.forEach(
   (value,index)=>{

    const button=
     document.createElement("button");

    button.textContent=
     value||"";

    button.onclick=()=>{
     playMove(
      game.id,
      index
     );
    };

    board.appendChild(
     button
    );

   }
  );


  container.appendChild(board);


  if(game.state.winner){

   addGameResult(
    container,
    "🏆 "+
    game.state.winner+
    " wins!"
   );

  }else if(game.state.draw){

   addGameResult(
    container,
    "🤝 Draw!"
   );

  }

  return;

 }


 if(
  game.game_type==="connect4"
 ){

  const board=
   document.createElement("div");

  board.className=
   "connect4";


  for(
   let column=0;
   column<7;
   column++
  ){

   const button=
    document.createElement("button");

   button.className=
    "connect4-column";

   button.onclick=()=>{
    connect4Move(
     game,
     column
    );
   };


   for(
    let row=0;
    row<6;
    row++
   ){

    const cell=
     document.createElement("div");

    cell.className=
     "connect4-cell";


    const value=
     game.state.board[
      row*7+column
     ];


    if(value==="R")
     cell.classList.add(
      "red"
     );

    if(value==="Y")
     cell.classList.add(
      "yellow"
     );


    button.appendChild(cell);

   }


   board.appendChild(button);

  }


  container.appendChild(board);


  if(game.state.winner){

   addGameResult(
    container,
    "🏆 "+
    game.state.winner+
    " wins!"
   );

  }else if(game.state.draw){

   addGameResult(
    container,
    "🤝 Draw!"
   );

  }

  return;

 }


 if(
  game.game_type==="dice"
 ){

  const result=
   document.createElement("div");

  result.className=
   "dice-result";


  if(
   game.state.last_roll
  ){

   result.innerHTML=
    '<div class="dice-number">'+
    escapeHtml(
     game.state.last_roll
    )+
    '</div>';

  }else{

   result.textContent=
    "Roll the dice!";

  }


  if(
   game.state.message
  ){

   const msg=
    document.createElement("div");

   msg.className=
    "game-note";

   msg.textContent=
    game.state.message;

   result.appendChild(msg);

  }


  if(
   game.status==="playing" &&
   game.turn_device_id===
   deviceId
  ){

   const button=
    document.createElement("button");

   button.className=
    "primary-btn";

   button.textContent=
    "🎲 Roll Dice";

   button.onclick=()=>{
    rollDice(game.id);
   };

   result.appendChild(button);

  }


  container.appendChild(result);

  return;

 }


 if(
  game.game_type==="higherlower"
 ){

  const number=
   document.createElement("div");

  number.className=
   "hl-number";

  number.textContent=
   game.state.current_number;


  container.appendChild(number);


  if(
   game.status==="playing" &&
   game.turn_device_id===
   deviceId
  ){

   const buttons=
    document.createElement("div");

   buttons.className=
    "hl-buttons";


   const higher=
    document.createElement("button");

   higher.className=
    "primary-btn";

   higher.textContent=
    "⬆ Higher";

   higher.onclick=()=>{
    higherLower(
     game.id,
     "higher"
    );
   };


   const lower=
    document.createElement("button");

   lower.className=
    "secondary-btn";

   lower.textContent=
    "⬇ Lower";

   lower.onclick=()=>{
    higherLower(
     game.id,
     "lower"
    );
   };


   buttons.appendChild(higher);
   buttons.appendChild(lower);

   container.appendChild(buttons);

  }


  if(game.state.message){

   addGameResult(
    container,
    game.state.message
   );

  }

  return;

 }


 if(
  game.game_type==="rps"
 ){

  if(
   game.status==="playing" &&
   game.turn_device_id===
   deviceId
  ){

   const buttons=
    document.createElement("div");

   buttons.className=
    "rps-buttons";


   [
    ["rock","✊ Rock"],
    ["paper","✋ Paper"],
    ["scissors","✌️ Scissors"]
   ].forEach(
    ([value,label])=>{

     const button=
      document.createElement("button");

     button.className=
      "primary-btn";

     button.textContent=
      label;

     button.onclick=()=>{
      playRPS(
       game.id,
       value
      );
     };

     buttons.appendChild(
      button
     );

    }
   );


   container.appendChild(buttons);

  }


  if(game.state.message){

   addGameResult(
    container,
    game.state.message
   );

  }

 }

}

function resizeImage(file){

 return new Promise(
  (resolve,reject)=>{

   const reader=
    new FileReader();


   reader.onload=()=>{

    const img=
     new Image();


    img.onload=()=>{

     let w=
      img.width;

     let h=
      img.height;

     const max=
      1500;


     if(
      w>max||
      h>max
     ){

      const scale=
       Math.min(
        max/w,
        max/h
       );

      w=
       Math.round(
        w*scale
       );

      h=
       Math.round(
        h*scale
       );

     }


     const canvas=
      document.createElement(
       "canvas"
      );

     canvas.width=w;

     canvas.height=h;


     canvas
      .getContext("2d")
      .drawImage(
       img,
       0,
       0,
       w,
       h
      );


     resolve(
      canvas.toDataURL(
       "image/jpeg",
       .78
      )
     );

    };


    img.onerror=reject;

    img.src=
     reader.result;

   };


   reader.onerror=reject;

   reader.readAsDataURL(file);

  }
 );

}

  .replaceAll(
   "&",
   "&amp;"
  )

  .replaceAll(
   "<",

   ">",
