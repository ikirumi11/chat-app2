<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat App</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family: Inter, Arial, sans-serif;
    background: #0b0d10;
    color: #eee;
}

body {
    overflow: hidden;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* HEADER */

.header {
    height: 64px;
    min-height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    background: #111419;
    border-bottom: 1px solid #252a31;
}

.logo {
    display: flex;
    align-items: center;
    gap: 11px;
    font-size: 18px;
    font-weight: 700;
}

.logo-icon {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    background: #1b2028;
    border: 1px solid #303640;
}

.channel {
    color: #aeb6c2;
    font-size: 14px;
}

.header-buttons {
    display: flex;
    gap: 8px;
}

.icon-btn {
    width: 38px;
    height: 38px;
    border: 1px solid #2b3038;
    background: #171b21;
    color: #dce1e8;
    border-radius: 9px;
    transition: .15s;
}

.icon-btn:hover {
    background: #20252d;
}

/* CHAT */

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 18px;
    scroll-behavior: auto;
}

.message {
    display: flex;
    gap: 11px;
    margin-bottom: 18px;
    position: relative;
}

.avatar {
    flex: 0 0 40px;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    background: #20252d;
    color: #dbe1e9;
    font-weight: 700;
    border: 1px solid #303640;
}

.message-content {
    min-width: 0;
    max-width: min(850px, calc(100vw - 90px));
}

.message-top {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 3px;
}

.username {
    font-weight: 700;
    color: #f1f3f5;
}

.time {
    font-size: 11px;
    color: #6f7782;
}

.edited {
    font-size: 10px;
    color: #68717d;
}

.message-text {
    color: #d7dce2;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.45;
}

.message-image {
    display: block;
    max-width: min(500px, 80vw);
    max-height: 500px;
    margin-top: 8px;
    border-radius: 10px;
    border: 1px solid #303640;
    cursor: pointer;
    object-fit: contain;
    background: #080a0d;
}

/* COMPOSER */

.composer {
    padding: 12px 16px 16px;
    background: #111419;
    border-top: 1px solid #252a31;
}

.composer-box {
    max-width: 1100px;
    margin: auto;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: #181c22;
    border: 1px solid #2a3038;
    border-radius: 13px;
    padding: 8px;
}

.composer textarea {
    flex: 1;
    min-height: 42px;
    max-height: 150px;
    resize: none;
    border: 0;
    outline: none;
    background: transparent;
    color: white;
    padding: 10px;
}

.composer textarea::placeholder {
    color: #69717c;
}

.send-btn {
    height: 42px;
    padding: 0 18px;
    border: 0;
    border-radius: 9px;
    background: #e8eaed;
    color: #111;
    font-weight: 700;
}

.send-btn:hover {
    background: white;
}

.send-btn:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.attach-btn {
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: #aeb6c2;
    font-size: 20px;
}

.attach-btn:hover {
    background: #242932;
}

/* SETTINGS */

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
}

.overlay.show {
    display: flex;
}

.panel {
    width: min(480px, calc(100vw - 30px));
    max-height: calc(100vh - 30px);
    overflow-y: auto;
    background: #12161b;
    border: 1px solid #303640;
    border-radius: 15px;
    box-shadow: 0 25px 80px rgba(0,0,0,.55);
}

.panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px;
    border-bottom: 1px solid #292e36;
}

.panel-header h2 {
    margin: 0;
    font-size: 18px;
}

.panel-body {
    padding: 18px;
}

.setting {
    margin-bottom: 20px;
}

.setting label {
    display: block;
    margin-bottom: 7px;
    font-size: 13px;
    color: #9ca5b1;
}

.setting input,
.setting select {
    width: 100%;
    padding: 11px;
    border-radius: 9px;
    border: 1px solid #303640;
    outline: none;
    background: #1a1f26;
    color: white;
}

.save-btn {
    width: 100%;
    padding: 11px;
    border: 0;
    border-radius: 9px;
    background: #e8eaed;
    color: #111;
    font-weight: 700;
}

.danger-zone {
    margin-top: 25px;
    padding-top: 20px;
    border-top: 1px solid #30262a;
}

.danger-title {
    color: #ff7777;
    font-weight: 700;
    margin-bottom: 7px;
}

.danger-zone p {
    color: #929aa5;
    line-height: 1.5;
}

.danger-btn {
    width: 100%;
    padding: 11px;
    border-radius: 9px;
    border: 1px solid #743333;
    background: #241719;
    color: #ff8585;
}

.danger-btn:hover {
    background: #321c1e;
}

/* CONTEXT MENU */

.context-menu {
    position: fixed;
    display: none;
    z-index: 200;
    width: 160px;
    padding: 5px;
    background: #171b21;
    border: 1px solid #343a43;
    border-radius: 9px;
    box-shadow: 0 15px 40px rgba(0,0,0,.5);
}

.context-menu.show {
    display: block;
}

.context-menu button {
    width: 100%;
    text-align: left;
    padding: 9px 10px;
    border: 0;
    background: transparent;
    color: #e4e8ed;
    border-radius: 6px;
}

.context-menu button:hover {
    background: #252b33;
}

.context-menu .delete-option {
    color: #ff7777;
}

/* IMAGE VIEWER */

.image-viewer {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.96);
    display: none;
    z-index: 300;
    align-items: center;
    justify-content: center;
}

.image-viewer.show {
    display: flex;
}

.full-image {
    max-width: 95vw;
    max-height: 90vh;
    object-fit: contain;
}

.back-image {
    position: absolute;
    top: 18px;
    left: 18px;
    padding: 10px 16px;
    border-radius: 9px;
    border: 1px solid #3a4049;
    background: #171b21;
    color: white;
}

/* DIALOG */

.dialog {
    width: min(450px, calc(100vw - 30px));
    background: #14181e;
    border: 1px solid #303640;
    border-radius: 14px;
    padding: 20px;
}

.dialog h2 {
    margin-top: 0;
}

.dialog p {
    color: #aab2bd;
    line-height: 1.5;
}

.dialog-buttons {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 18px;
}

.dialog-buttons button {
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid #343a43;
    background: #20252c;
    color: white;
}

.dialog-buttons .danger {
    background: #6b2929;
    border-color: #813434;
}

/* EMPTY */

.empty {
    height: 100%;
    display: grid;
    place-items: center;
    color: #656d78;
    text-align: center;
}

.empty strong {
    display: block;
    color: #aab2bd;
    margin-bottom: 5px;
}

/* MOBILE */

@media (max-width: 600px) {

    .header {
        padding: 0 11px;
    }

    .messages {
        padding: 15px 11px;
    }

    .message-content {
        max-width: calc(100vw - 70px);
    }

    .message-image {
        max-width: 80vw;
    }

    .channel {
        display: none;
    }

    .logo {
        font-size: 16px;
    }

}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="logo">

        <div class="logo-icon">
            💬
        </div>

        <span>Chat</span>

        <span class="channel">
            # general
        </span>

    </div>

    <div class="header-buttons">

        <button
            class="icon-btn"
            id="settingsBtn"
            title="Settings"
        >
            ⚙
        </button>

    </div>

</header>


<main
    class="messages"
    id="messages"
></main>


<div class="composer">

    <div class="composer-box">

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
        >

        <button
            class="attach-btn"
            id="attachBtn"
            title="Choose image"
        >
            ＋
        </button>

        <textarea
            id="messageInput"
            placeholder="Message #general"
            rows="1"
        ></textarea>

        <button
            class="send-btn"
            id="sendBtn"
        >
            Send
        </button>

    </div>

</div>

</div>


<!-- SETTINGS -->

<div
    class="overlay"
    id="settingsOverlay"
>

<div class="panel">

<div class="panel-header">

    <h2>Settings</h2>

    <button
        class="icon-btn"
        id="closeSettings"
    >
        ×
    </button>

</div>


<div class="panel-body">

<div class="setting">

    <label>Your name</label>

    <input
        id="usernameInput"
        maxlength="24"
        placeholder="Enter your name"
    >

</div>


<div class="setting">

    <label>Theme</label>

    <select id="themeSelect">

        <option value="dark">
            Dark
        </option>

        <option value="midnight">
            Midnight
        </option>

        <option value="slate">
            Slate
        </option>

        <option value="black">
            Pure Black
        </option>

        <option value="blue">
            Dark Blue
        </option>

        <option value="purple">
            Dark Purple
        </option>

        <option value="green">
            Dark Green
        </option>

        <option value="red">
            Dark Red
        </option>

        <option value="gray">
            Classic Gray
        </option>

        <option value="light">
            Light
        </option>

        <option value="oled">
            OLED
        </option>

    </select>

</div>


<div class="setting">

    <label>Message refresh rate</label>

    <select id="refreshSelect">

        <option value="10000">
            10 seconds
        </option>

        <option value="5000">
            5 seconds
        </option>

        <option value="3000">
            3 seconds
        </option>

        <option value="2000">
            2 seconds
        </option>

        <option value="1000">
            1 second
        </option>

        <option value="500">
            0.5 seconds
        </option>

        <option value="100">
            0.1 seconds
        </option>

    </select>

</div>


<button
    class="save-btn"
    id="saveSettings"
>
    Save settings
</button>


<div class="danger-zone">

    <div class="danger-title">
        Danger zone
    </div>

    <p>
        Permanently remove every message from
        the chat database.
    </p>

    <button
        class="danger-btn"
        id="removeEverything"
    >
        Remove everything
    </button>

</div>

</div>

</div>

</div>


<!-- CONTEXT MENU -->

<div
    class="context-menu"
    id="contextMenu"
>

<button id="editMessage">
    Edit
</button>

<button
    class="delete-option"
    id="deleteMessage"
>
    Delete
</button>

</div>


<!-- IMAGE VIEWER -->

<div
    class="image-viewer"
    id="imageViewer"
>

<button
    class="back-image"
    id="backImage"
>
    ← Back
</button>

<img
    class="full-image"
    id="fullImage"
    alt="Full image"
>

</div>


<!-- DIALOG -->

<div
    class="overlay"
    id="dialogOverlay"
>

<div class="dialog">

<h2 id="dialogTitle">
    Confirm
</h2>

<p id="dialogText"></p>

<div class="dialog-buttons">

<button id="dialogCancel">
    Cancel
</button>

<button
    class="danger"
    id="dialogConfirm"
>
    Yes
</button>

</div>

</div>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const API_URL =
    "/api/messages";

const CHANNEL =
    "general";


/* =====================================================
   DEVICE ID
===================================================== */

let deviceId =
    localStorage.getItem(
        "chat_device_id"
    );

if (!deviceId) {

    deviceId =
        crypto.randomUUID();

    localStorage.setItem(
        "chat_device_id",
        deviceId
    );

}


/* =====================================================
   USER SETTINGS
===================================================== */

let username =
    localStorage.getItem(
        "chat_username"
    ) || "";

let theme =
    localStorage.getItem(
        "chat_theme"
    ) || "dark";

/*
   DEFAULT REFRESH = 0.5 SECOND
*/

let refreshRate =
    Number(
        localStorage.getItem(
            "chat_refresh_rate"
        )
    );

if (
    !refreshRate ||
    ![
        10000,
        5000,
        3000,
        2000,
        1000,
        500,
        100
    ].includes(refreshRate)
) {

    refreshRate = 500;

    localStorage.setItem(
        "chat_refresh_rate",
        "500"
    );

}


/* =====================================================
   ELEMENTS
===================================================== */

const messagesEl =
    document.getElementById(
        "messages"
    );

const messageInput =
    document.getElementById(
        "messageInput"
    );

const sendBtn =
    document.getElementById(
        "sendBtn"
    );

const imageInput =
    document.getElementById(
        "imageInput"
    );

const attachBtn =
    document.getElementById(
        "attachBtn"
    );

const settingsBtn =
    document.getElementById(
        "settingsBtn"
    );

const settingsOverlay =
    document.getElementById(
        "settingsOverlay"
    );

const closeSettings =
    document.getElementById(
        "closeSettings"
    );

const usernameInput =
    document.getElementById(
        "usernameInput"
    );

const themeSelect =
    document.getElementById(
        "themeSelect"
    );

const refreshSelect =
    document.getElementById(
        "refreshSelect"
    );

const saveSettings =
    document.getElementById(
        "saveSettings"
    );

const contextMenu =
    document.getElementById(
        "contextMenu"
    );

const editMessageBtn =
    document.getElementById(
        "editMessage"
    );

const deleteMessageBtn =
    document.getElementById(
        "deleteMessage"
    );

const imageViewer =
    document.getElementById(
        "imageViewer"
    );

const fullImage =
    document.getElementById(
        "fullImage"
    );

const backImage =
    document.getElementById(
        "backImage"
    );

const dialogOverlay =
    document.getElementById(
        "dialogOverlay"
    );

const dialogTitle =
    document.getElementById(
        "dialogTitle"
    );

const dialogText =
    document.getElementById(
        "dialogText"
    );

const dialogCancel =
    document.getElementById(
        "dialogCancel"
    );

const dialogConfirm =
    document.getElementById(
        "dialogConfirm"
    );

const removeEverything =
    document.getElementById(
        "removeEverything"
    );


/* =====================================================
   STATE
===================================================== */

let selectedMessage =
    null;

let selectedFile =
    null;

let currentMessages =
    [];

let refreshTimer =
    null;


/* =====================================================
   THEME
===================================================== */

function applyTheme(name) {

    const themes = {

        dark: {
            bg: "#0b0d10",
            panel: "#12161b"
        },

        midnight: {
            bg: "#080b14",
            panel: "#101522"
        },

        slate: {
            bg: "#101418",
            panel: "#171d22"
        },

        black: {
            bg: "#000000",
            panel: "#090909"
        },

        blue: {
            bg: "#091018",
            panel: "#101c29"
        },

        purple: {
            bg: "#100b17",
            panel: "#191021"
        },

        green: {
            bg: "#09120d",
            panel: "#101b15"
        },

        red: {
            bg: "#140b0b",
            panel: "#1e1111"
        },

        gray: {
            bg: "#151515",
            panel: "#202020"
        },

        light: {
            bg: "#eeeeee",
            panel: "#ffffff"
        },

        oled: {
            bg: "#000000",
            panel: "#000000"
        }

    };

    const selected =
        themes[name] ||
        themes.dark;

    document.body.style.background =
        selected.bg;

    document.querySelector(
        ".header"
    ).style.background =
        selected.panel;

    document.querySelector(
        ".composer"
    ).style.background =
        selected.panel;

}


applyTheme(theme);

themeSelect.value =
    theme;

refreshSelect.value =
    String(refreshRate);

usernameInput.value =
    username;


/* =====================================================
   REFRESH TIMER
===================================================== */

function startRefreshTimer() {

    if (refreshTimer) {

        clearInterval(
            refreshTimer
        );

    }

    refreshTimer =
        setInterval(
            loadMessages,
            refreshRate
        );

}


/* =====================================================
   SETTINGS
===================================================== */

settingsBtn.onclick = () => {

    usernameInput.value =
        username;

    themeSelect.value =
        theme;

    refreshSelect.value =
        String(refreshRate);

    settingsOverlay.classList.add(
        "show"
    );

};


closeSettings.onclick = () => {

    settingsOverlay.classList.remove(
        "show"
    );

};


saveSettings.onclick = () => {

    username =
        usernameInput.value
            .trim()
            .substring(
                0,
                24
            );

    /*
       Keep a valid default so sending
       can never fail because the name
       is empty.
    */

    if (!username) {

        username =
            "User";

    }

    theme =
        themeSelect.value;

    refreshRate =
        Number(
            refreshSelect.value
        );

    if (![
        10000,
        5000,
        3000,
        2000,
        1000,
        500,
        100
    ].includes(refreshRate)) {

        refreshRate =
            500;

    }

    localStorage.setItem(
        "chat_username",
        username
    );

    localStorage.setItem(
        "chat_theme",
        theme
    );

    localStorage.setItem(
        "chat_refresh_rate",
        String(refreshRate)
    );

    applyTheme(
        theme
    );

    startRefreshTimer();

    settingsOverlay.classList.remove(
        "show"
    );

};


/* =====================================================
   AUTO RESIZE
===================================================== */

messageInput.addEventListener(
    "input",
    () => {

        messageInput.style.height =
            "auto";

        messageInput.style.height =
            Math.min(
                messageInput.scrollHeight,
                150
            ) + "px";

    }
);


/* =====================================================
   IMAGE PICKER
===================================================== */

attachBtn.onclick = () => {

    imageInput.click();

};


imageInput.onchange = () => {

    selectedFile =
        imageInput.files[0] ||
        null;

    attachBtn.textContent =
        selectedFile
        ? "✓"
        : "＋";

};


/* =====================================================
   RESIZE IMAGE
   MAXIMUM 1500 × 1500
===================================================== */

function resizeImage(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload = () => {

                const img =
                    new Image();

                img.onload = () => {

                    let width =
                        img.width;

                    let height =
                        img.height;

                    const max =
                        1500;

                    if (
                        width > max ||
                        height > max
                    ) {

                        const scale =
                            Math.min(
                                max / width,
                                max / height
                            );

                        width =
                            Math.round(
                                width * scale
                            );

                        height =
                            Math.round(
                                height * scale
                            );

                    }

                    const canvas =
                        document.createElement(
                            "canvas"
                        );

                    canvas.width =
                        width;

                    canvas.height =
                        height;

                    const ctx =
                        canvas.getContext(
                            "2d"
                        );

                    ctx.drawImage(
                        img,
                        0,
                        0,
                        width,
                        height
                    );

                    resolve(
                        canvas.toDataURL(
                            "image/jpeg",
                            0.78
                        )
                    );

                };

                img.onerror =
                    reject;

                img.src =
                    reader.result;

            };

            reader.onerror =
                reject;

            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =====================================================
   SEND
===================================================== */

sendBtn.onclick =
    sendMessage;


messageInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


async function sendMessage() {

    /*
       Make sure the username is always
       available from localStorage.
    */

    username =
        localStorage.getItem(
            "chat_username"
        ) ||
        username ||
        "User";

    username =
        username
            .trim()
            .substring(
                0,
                24
            );

    if (!username) {

        username =
            "User";

    }

    localStorage.setItem(
        "chat_username",
        username
    );

    const text =
        messageInput.value.trim();

    if (
        !text &&
        !selectedFile
    ) {

        return;

    }

    sendBtn.disabled =
        true;

    try {

        let image =
            null;

        if (selectedFile) {

            image =
                await resizeImage(
                    selectedFile
                );

        }

        const response =
            await fetch(
                API_URL,
                {

                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            username:
                                username,

                            channel:
                                CHANNEL,

                            message:
                                text,

                            image:
                                image,

                            device_id:
                                deviceId

                        })

                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Failed to send message."
            );

        }

        messageInput.value =
            "";

        messageInput.style.height =
            "auto";

        selectedFile =
            null;

        imageInput.value =
            "";

        attachBtn.textContent =
            "＋";

        await loadMessages();

    } catch (error) {

        alert(
            "Failed to send:\n\n" +
            error.message
        );

    } finally {

        sendBtn.disabled =
            false;

    }

}


/* =====================================================
   LOAD MESSAGES
===================================================== */

async function loadMessages() {

    try {

        const response =
            await fetch(
                API_URL +
                "?channel=" +
                encodeURIComponent(
                    CHANNEL
                ),
                {
                    cache: "no-store"
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Failed to load messages."
            );

        }

        currentMessages =
            Array.isArray(
                data.messages
            )
            ? data.messages
            : [];

        renderMessages();

    } catch (error) {

        /*
           Don't replace existing messages
           with an error every refresh.
        */

        if (!currentMessages.length) {

            messagesEl.innerHTML = `
                <div class="empty">
                    <div>
                        <strong>Unable to load messages</strong>
                        ${escapeHtml(error.message)}
                    </div>
                </div>
            `;

        }

    }

}


/* =====================================================
   RENDER
===================================================== */

function renderMessages() {

    const wasAtBottom =
        messagesEl.scrollHeight -
        messagesEl.scrollTop -
        messagesEl.clientHeight <
        100;

    if (!currentMessages.length) {

        messagesEl.innerHTML = `
            <div class="empty">
                <div>
                    <strong>No messages yet</strong>
                    Be the first to send something.
                </div>
            </div>
        `;

        return;

    }

    const fragment =
        document.createDocumentFragment();

    currentMessages.forEach(
        message => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "message";

            item.dataset.id =
                message.id;

            item.dataset.deviceId =
                message.device_id ||
                "";

            const avatar =
                document.createElement(
                    "div"
                );

            avatar.className =
                "avatar";

            avatar.textContent =
                (
                    message.username ||
                    "?"
                )
                .charAt(0)
                .toUpperCase();

            const content =
                document.createElement(
                    "div"
                );

            content.className =
                "message-content";

            const top =
                document.createElement(
                    "div"
                );

            top.className =
                "message-top";

            const name =
                document.createElement(
                    "span"
                );

            name.className =
                "username";

            name.textContent =
                message.username ||
                "User";

            const time =
                document.createElement(
                    "span"
                );

            time.className =
                "time";

            time.textContent =
                formatTime(
                    message.created_at
                );

            top.appendChild(
                name
            );

            top.appendChild(
                time
            );

            if (message.edited) {

                const edited =
                    document.createElement(
                        "span"
                    );

                edited.className =
                    "edited";

                edited.textContent =
                    "(edited)";

                top.appendChild(
                    edited
                );

            }

            content.appendChild(
                top
            );

            if (message.message) {

                const text =
                    document.createElement(
                        "div"
                    );

                text.className =
                    "message-text";

                text.textContent =
                    message.message;

                content.appendChild(
                    text
                );

            }

            if (message.image) {

                const img =
                    document.createElement(
                        "img"
                    );

                img.className =
                    "message-image";

                img.src =
                    message.image;

                img.alt =
                    "Image";

                img.onclick =
                    () => openImage(
                        message.image
                    );

                content.appendChild(
                    img
                );

            }

            item.appendChild(
                avatar
            );

            item.appendChild(
                content
            );

            /*
               Only the same DEVICE ID can
               open edit/delete controls.
            */

            item.addEventListener(
                "contextmenu",
                event => {

                    event.preventDefault();

                    if (
                        String(
                            message.device_id ||
                            ""
                        ) ===
                        String(
                            deviceId
                        )
                    ) {

                        showContextMenu(
                            event.clientX,
                            event.clientY,
                            message
                        );

                    }

                }
            );

            fragment.appendChild(
                item
            );

        }
    );

    messagesEl.replaceChildren(
        fragment
    );

    if (wasAtBottom) {

        messagesEl.scrollTop =
            messagesEl.scrollHeight;

    }

}


/* =====================================================
   CONTEXT MENU
===================================================== */

function showContextMenu(
    x,
    y,
    message
) {

    selectedMessage =
        message;

    contextMenu.style.left =
        Math.min(
            x,
            window.innerWidth - 170
        ) + "px";

    contextMenu.style.top =
        Math.min(
            y,
            window.innerHeight - 100
        ) + "px";

    contextMenu.classList.add(
        "show"
    );

}


document.addEventListener(
    "click",
    () => {

        contextMenu.classList.remove(
            "show"
        );

    }
);


/* =====================================================
   EDIT
===================================================== */

editMessageBtn.onclick =
    async event => {

        event.stopPropagation();

        contextMenu.classList.remove(
            "show"
        );

        if (!selectedMessage) {
            return;
        }

        /*
           Double-check DEVICE ID on the
           client before sending edit.
        */

        if (
            String(
                selectedMessage.device_id ||
                ""
            ) !==
            String(
                deviceId
            )
        ) {

            alert(
                "You can only edit your own messages."
            );

            return;

        }

        const newText =
            prompt(
                "Edit message:",
                selectedMessage.message ||
                ""
            );

        if (
            newText === null
        ) {

            return;

        }

        try {

            const response =
                await fetch(
                    API_URL,
                    {

                        method:
                            "PATCH",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                id:
                                    selectedMessage.id,

                                device_id:
                                    deviceId,

                                message:
                                    newText.trim()

                            })

                    }
                );

            const data =
                await response.json();

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Failed to edit message."
                );

            }

            await loadMessages();

        } catch (error) {

            alert(
                "Failed to edit:\n\n" +
                error.message
            );

        }

    };


/* =====================================================
   DELETE
===================================================== */

deleteMessageBtn.onclick =
    event => {

        event.stopPropagation();

        contextMenu.classList.remove(
            "show"
        );

        if (!selectedMessage) {
            return;
        }

        if (
            String(
                selectedMessage.device_id ||
                ""
            ) !==
            String(
                deviceId
            )
        ) {

            alert(
                "You can only delete your own messages."
            );

            return;

        }

        openConfirm(
            "Delete message?",
            "This message will be permanently removed.",
            async () => {

                try {

                    const response =
                        await fetch(
                            API_URL,
                            {

                                method:
                                    "DELETE",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        id:
                                            selectedMessage.id,

                                        device_id:
                                            deviceId

                                    })

                            }
                        );

                    const data =
                        await response.json();

                    if (!response.ok) {

                        throw new Error(
                            data.error ||
                            "Failed to delete message."
                        );

                    }

                    await loadMessages();

                } catch (error) {

                    alert(
                        "Failed to delete:\n\n" +
                        error.message
                    );

                }

            }
        );

    };


/* =====================================================
   IMAGE FULLSCREEN
===================================================== */

function openImage(src) {

    fullImage.src =
        src;

    imageViewer.classList.add(
        "show"
    );

}


function closeImage() {

    imageViewer.classList.remove(
        "show"
    );

    fullImage.src =
        "";

}


backImage.onclick =
    closeImage;


imageViewer.onclick =
    event => {

        if (
            event.target ===
            imageViewer
        ) {

            closeImage();

        }

    };


document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeImage();

        }

    }
);


/* =====================================================
   CONFIRM DIALOG
===================================================== */

let confirmCallback =
    null;


function openConfirm(
    title,
    text,
    callback
) {

    dialogTitle.textContent =
        title;

    dialogText.textContent =
        text;

    confirmCallback =
        callback;

    dialogOverlay.classList.add(
        "show"
    );

}


dialogCancel.onclick =
    () => {

        dialogOverlay.classList.remove(
            "show"
        );

        confirmCallback =
            null;

    };


dialogConfirm.onclick =
    async () => {

        const callback =
            confirmCallback;

        dialogOverlay.classList.remove(
            "show"
        );

        confirmCallback =
            null;

        if (callback) {

            await callback();

        }

    };


/* =====================================================
   REMOVE EVERYTHING
===================================================== */

removeEverything.onclick =
    () => {

        openConfirm(
            "Remove everything?",
            "This will remove every message forever. There will be no messages left in the chat.",
            () => {

                openConfirm(
                    "I know",
                    "You are about to permanently delete every message. Continue only if you understand.",
                    () => {

                        openConfirm(
                            "Are you sure?",
                            "Every stored message will be permanently removed.",
                            () => {

                                openConfirm(
                                    "Last time",
                                    "Are you ultra sure every memory is being removed and has no evidence of existing?",
                                    permanentlyDeleteEverything
                                );

                            }
                        );

                    }
                );

            }
        );

    };


async function permanentlyDeleteEverything() {

    try {

        const response =
            await fetch(
                API_URL,
                {

                    method:
                        "DELETE",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            delete_all:
                                true,

                            device_id:
                                deviceId

                        })

                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Failed to remove everything."
            );

        }

        currentMessages =
            [];

        renderMessages();

        alert(
            "All messages were removed."
        );

    } catch (error) {

        alert(
            "Failed to remove everything:\n\n" +
            error.message
        );

    }

}


/* =====================================================
   HELPERS
===================================================== */

function formatTime(date) {

    if (!date) {
        return "";
    }

    const d =
        new Date(date);

    return d.toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


function escapeHtml(value) {

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =====================================================
   START
===================================================== */

loadMessages();

/*
   Default:
   0.5 seconds = 500 ms
*/

startRefreshTimer();

</script>
