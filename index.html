```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat</title>

<style>
*{box-sizing:border-box}

:root{
 --bg:#0b0d10;
 --panel:#111419;
 --panel2:#181c22;
 --panel3:#20252d;
 --border:#292f38;
 --text:#edf0f4;
 --muted:#7e8793;
 --accent:#e8eaed;
 --danger:#ff7070;
 --success:#70d890;
 --radius:12px;
 --ui-scale:1;
 --text-size:16px;
 --word-spacing:0px;
 --line-spacing:1.45;
}

html,body{
 margin:0;
 width:100%;
 height:100%;
 background:var(--bg);
 color:var(--text);
 font-family:Inter,Arial,sans-serif;
}

body{
 overflow:hidden;
 font-size:calc(16px * var(--ui-scale));
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}

.app{
 width:100%;
 height:100vh;
 display:flex;
 flex-direction:column;
}

.header{
 height:64px;
 min-height:64px;
 padding:0 18px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 background:var(--panel);
 border-bottom:1px solid var(--border);
}

.logo{
 display:flex;
 align-items:center;
 gap:10px;
 font-weight:700;
}

.logo-icon{
 width:35px;
 height:35px;
 display:grid;
 place-items:center;
 border-radius:10px;
 background:var(--panel2);
 border:1px solid var(--border);
}

.channel{
 color:var(--muted);
 font-weight:400;
}

.tabs{
 height:48px;
 min-height:48px;
 display:flex;
 align-items:center;
 gap:5px;
 padding:5px 12px;
 background:var(--panel);
 border-bottom:1px solid var(--border);
}

.tab{
 height:38px;
 padding:0 16px;
 border:1px solid transparent;
 border-radius:9px;
 background:transparent;
 color:var(--muted);
 font-weight:700;
}

.tab:hover,
.tab.active{
 background:var(--panel2);
 color:var(--text);
}

.tab.active{border-color:var(--border)}

.icon-btn{
 width:39px;
 height:39px;
 border-radius:10px;
 border:1px solid var(--border);
 background:var(--panel2);
 color:var(--text);
}

.view{
 flex:1;
 min-height:0;
 display:none;
}

.view.active{display:flex}

.chat-view{
 flex-direction:column;
}

.messages{
 flex:1;
 overflow-y:auto;
 padding:20px;
}

.message{
 display:flex;
 gap:11px;
 margin-bottom:17px;
}

.avatar{
 flex:0 0 40px;
 width:40px;
 height:40px;
 display:grid;
 place-items:center;
 border-radius:var(--radius);
 background:var(--panel2);
 border:1px solid var(--border);
 font-weight:700;
}

.message-content{
 min-width:0;
 max-width:min(850px,calc(100vw - 90px));
}

.message-top{
 display:flex;
 align-items:baseline;
 gap:8px;
 margin-bottom:3px;
}

.username{font-weight:700}

.time,.edited{
 color:var(--muted);
 font-size:11px;
}

.message-text{
 color:#d8dde4;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
 font-size:var(--text-size);
 word-spacing:var(--word-spacing);
 line-height:var(--line-spacing);
}

.message-image{
 display:block;
 max-width:min(500px,80vw);
 max-height:500px;
 margin-top:8px;
 border:1px solid var(--border);
 border-radius:var(--radius);
 background:#000;
 object-fit:contain;
 cursor:pointer;
}

.composer{
 padding:12px 16px 16px;
 background:var(--panel);
 border-top:1px solid var(--border);
}

.composer-box{
 max-width:1100px;
 margin:auto;
 display:flex;
 align-items:flex-end;
 gap:7px;
 padding:8px;
 background:var(--panel2);
 border:1px solid var(--border);
 border-radius:14px;
}

textarea{
 flex:1;
 min-height:42px;
 max-height:150px;
 resize:none;
 border:0;
 outline:none;
 background:transparent;
 color:white;
 padding:10px;
}

.attach-btn,.send-btn{
 height:42px;
 border:0;
 border-radius:9px;
}

.attach-btn{
 width:42px;
 background:transparent;
 color:#adb5c0;
 font-size:20px;
}

.send-btn{
 padding:0 18px;
 background:var(--accent);
 color:#111;
 font-weight:700;
}

/* GAME CARDS */

.game-card{
 margin:12px 0;
 padding:15px;
 background:linear-gradient(145deg,#15191f,#101318);
 border:1px solid #303641;
 border-radius:15px;
 box-shadow:0 8px 30px #0004;
}

.game-card-header{
 display:flex;
 align-items:center;
 gap:12px;
}

.game-icon{
 width:46px;
 height:46px;
 display:grid;
 place-items:center;
 border-radius:12px;
 background:var(--panel2);
 border:1px solid var(--border);
 font-size:24px;
}

.game-card-title{
 flex:1;
 min-width:0;
}

.game-card-title strong{
 display:block;
 font-size:15px;
}

.game-card-title span{
 color:var(--muted);
 font-size:12px;
}

.game-invite{
 margin-top:12px;
 padding:12px;
 border-radius:10px;
 background:#0e1116;
 border:1px solid var(--border);
}

.game-players{
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 margin:10px 0;
}

.player-chip{
 padding:6px 9px;
 border-radius:8px;
 background:var(--panel2);
 border:1px solid var(--border);
 font-size:12px;
}

.player-chip.host{border-color:#75662c}
.player-chip.turn{
 border-color:#34704b;
 box-shadow:0 0 0 1px #34704b inset;
}

.game-buttons{
 display:flex;
 flex-wrap:wrap;
 gap:7px;
 margin-top:10px;
}

.primary-btn,
.secondary-btn,
.danger-btn,
.success-btn{
 border-radius:9px;
 padding:9px 13px;
 border:1px solid var(--border);
 font-weight:700;
}

.primary-btn{
 background:var(--accent);
 color:#111;
}

.secondary-btn{
 background:var(--panel2);
 color:var(--text);
}

.success-btn{
 background:#183a27;
 border-color:#28653e;
 color:#91e4aa;
}

.danger-btn{
 background:#291719;
 border-color:#633136;
 color:#ff8585;
}

.game-board{
 margin-top:12px;
 padding:14px;
 background:#0b0e12;
 border:1px solid var(--border);
 border-radius:12px;
}

.turn-banner{
 padding:10px;
 margin-bottom:12px;
 text-align:center;
 border-radius:9px;
 background:var(--panel2);
 border:1px solid var(--border);
 font-weight:700;
}

/* TIC TAC TOE */

.ttt-grid{
 width:min(330px,100%);
 margin:auto;
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:6px;
}

.ttt-cell{
 aspect-ratio:1;
 border:1px solid var(--border);
 border-radius:10px;
 background:var(--panel2);
 color:var(--text);
 font-size:55px;
 font-weight:800;
}

.ttt-cell:hover:not(:disabled){
 background:var(--panel3);
}

/* CONNECT FOUR */

.connect-columns,
.connect-grid{
 width:min(430px,100%);
 margin:auto;
 display:grid;
 grid-template-columns:repeat(7,1fr);
 gap:5px;
}

.connect-columns{margin-bottom:5px}

.connect-column{
 padding:6px 1px;
 border:1px solid var(--border);
 border-radius:7px;
 background:var(--panel2);
 color:var(--text);
}

.connect-grid{
 padding:7px;
 background:#10151b;
 border-radius:10px;
}

.connect-cell{
 aspect-ratio:1;
 border-radius:50%;
 background:#252a30;
 border:1px solid var(--border);
}

.connect-cell.red{background:#d95757}
.connect-cell.yellow{background:#e0c44d}

/* DICE */

.dice-board{text-align:center}

.dice-number{
 font-size:80px;
 font-weight:800;
 margin:15px;
}

/* HIGHER LOWER */

.hl-board{text-align:center}

.hl-number{
 font-size:70px;
 font-weight:800;
 margin:15px;
}

/* RPS */

.rps-buttons{
 display:flex;
 justify-content:center;
 flex-wrap:wrap;
 gap:8px;
}

.rps-button{
 min-width:85px;
 padding:14px;
 border:1px solid var(--border);
 border-radius:10px;
 background:var(--panel2);
 color:var(--text);
 font-size:25px;
}

/* MODALS */

.overlay{
 position:fixed;
 inset:0;
 display:none;
 align-items:center;
 justify-content:center;
 background:#000b;
 z-index:100;
}

.overlay.show{display:flex}

.panel{
 width:min(520px,calc(100vw - 25px));
 max-height:calc(100vh - 25px);
 overflow:auto;
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:15px;
 box-shadow:0 25px 80px #000b;
}

.panel-header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:18px;
 border-bottom:1px solid var(--border);
}

.panel-header h2{margin:0}

.panel-body{padding:18px}

.form-group{margin-bottom:15px}

.form-group label,
.setting label{
 display:block;
 color:#aab2bd;
 font-size:13px;
 margin-bottom:7px;
}

.form-group input,
.form-group select,
.setting input,
.setting select{
 width:100%;
 padding:10px;
 border:1px solid var(--border);
 border-radius:9px;
 background:#101419;
 color:white;
 outline:none;
}

.form-buttons{
 display:flex;
 gap:8px;
 justify-content:flex-end;
}

.lobby-note{
 padding:12px;
 color:var(--muted);
 border:1px solid var(--border);
 border-radius:10px;
 background:var(--panel2);
 line-height:1.45;
}

.category{
 margin-bottom:12px;
 border:1px solid var(--border);
 border-radius:12px;
 overflow:hidden;
 background:var(--panel2);
}

.category-title{
 width:100%;
 padding:14px;
 border:0;
 background:transparent;
 color:var(--text);
 display:flex;
 justify-content:space-between;
 font-weight:700;
 text-align:left;
}

.category-body{
 display:none;
 padding:0 14px 14px;
}

.category.open .category-body{display:block}

.setting{margin-top:14px}

.save-btn{
 width:100%;
 margin-top:8px;
 padding:12px;
 border:0;
 border-radius:9px;
 background:var(--accent);
 color:#111;
 font-weight:700;
}

.context-menu{
 position:fixed;
 display:none;
 width:160px;
 padding:5px;
 z-index:200;
 background:var(--panel2);
 border:1px solid var(--border);
 border-radius:9px;
 box-shadow:0 15px 40px #0009;
}

.context-menu.show{display:block}

.context-menu button{
 width:100%;
 padding:9px;
 text-align:left;
 border:0;
 border-radius:6px;
 background:transparent;
 color:var(--text);
}

.context-menu button:hover{background:#252b33}

.delete-option{color:#ff7777!important}

.image-viewer{
 position:fixed;
 inset:0;
 display:none;
 align-items:center;
 justify-content:center;
 background:#000f;
 z-index:300;
}

.image-viewer.show{display:flex}

.full-image{
 max-width:95vw;
 max-height:90vh;
 object-fit:contain;
}

.back-image{
 position:absolute;
 top:18px;
 left:18px;
 padding:10px 16px;
 border-radius:9px;
 border:1px solid #3a4049;
 background:#171b21;
 color:white;
}

.empty{
 height:100%;
 display:grid;
 place-items:center;
 color:#656d78;
 text-align:center;
}

.empty strong{
 display:block;
 color:#aab2bd;
 margin-bottom:5px;
}

@media(max-width:600px){
 .header{padding:0 11px}
 .messages{padding:12px 9px}
 .channel{display:none}
 .message-content{max-width:calc(100vw - 70px)}
}
</style>
</head>

<body>

<div class="app">

<header class="header">
 <div class="logo">
  <div class="logo-icon">💬</div>
  <span>Chat</span>
  <span class="channel"># general</span>
 </div>
 <button class="icon-btn" id="settingsBtn">⚙</button>
</header>

<nav class="tabs">
 <button class="tab active" data-view="chatView">💬 Chat</button>
 <button class="tab" data-view="gamesView">🎮 Games</button>
</nav>

<main class="view chat-view active" id="chatView">

 <main class="messages" id="messages"></main>

 <div class="composer">
  <div class="composer-box">

   <input type="file" id="imageInput" accept="image/*" hidden>

   <button class="attach-btn" id="attachBtn">＋</button>

   <textarea
    id="messageInput"
    rows="1"
    placeholder="Message #general"></textarea>

   <button class="send-btn" id="sendBtn">Send</button>

  </div>
 </div>

</main>

<!--
 The Games tab is only a game lobby/management screen.
 Actual active games are rendered into the chat as messages.
-->

<section class="view" id="gamesView" style="overflow:auto;padding:20px">

 <div style="width:min(1000px,100%);margin:auto">

  <div style="
   display:flex;
   justify-content:space-between;
   align-items:center;
   gap:10px;
   margin-bottom:18px;
   flex-wrap:wrap;
  ">

   <div>
    <h1 style="margin:0 0 5px">🎮 Games</h1>
    <div style="color:var(--muted)">
     Create a game and invite people from chat.
    </div>
   </div>

   <button class="primary-btn" id="createGameBtn">
    ＋ Create game
   </button>

  </div>

  <div id="gamesLobby"></div>

 </div>

</section>

</div>


<!-- CREATE GAME -->

<div class="overlay" id="createGameOverlay">

<div class="panel">

 <div class="panel-header">
  <h2>Create a game</h2>
  <button class="icon-btn" id="closeCreateGame">×</button>
 </div>

 <div class="panel-body">

  <div class="form-group">
   <label>Game</label>

   <select id="gameTypeSelect">
    <option value="tictactoe">⭕ Tic-Tac-Toe</option>
    <option value="connect4">🔴 Connect Four</option>
    <option value="dice">🎲 Dice Battle</option>
    <option value="higherlower">🔢 Higher or Lower</option>
    <option value="rps">✊ Rock Paper Scissors</option>
   </select>
  </div>

  <div class="form-group">
   <label>Game name</label>

   <input
    id="gameNameInput"
    maxlength="35"
    placeholder="My game">
  </div>

  <div class="form-group">
   <label>Maximum players</label>

   <select id="maxPlayersSelect">
    <option value="2">2 players</option>
    <option value="3">3 players</option>
    <option value="4">4 players</option>
    <option value="5">5 players</option>
    <option value="6">6 players</option>
    <option value="8">8 players</option>
   </select>
  </div>

  <div class="lobby-note">
   You can host only <b>one game at a time</b>.
   Players who join before Start become the actual players.
   Everyone else can spectate.
  </div>

  <div class="form-buttons" style="margin-top:15px">
   <button class="secondary-btn" id="cancelCreateGame">Cancel</button>
   <button class="primary-btn" id="confirmCreateGame">Create lobby</button>
  </div>

 </div>
</div>
</div>


<!-- SETTINGS -->

<div class="overlay" id="settingsOverlay">

<div class="panel">

 <div class="panel-header">
  <h2>Settings</h2>
  <button class="icon-btn" id="closeSettings">×</button>
 </div>

 <div class="panel-body">

  <div class="category open">

   <button class="category-title">
    <span>👤 Profile</span><span>⌄</span>
   </button>

   <div class="category-body">

    <div class="setting">
     <label>Your name</label>
     <input id="usernameInput" maxlength="24">
    </div>

    <div class="setting">
     <label>Device ID</label>
     <input id="deviceIdInput" readonly>
    </div>

   </div>
  </div>

  <div class="category">

   <button class="category-title">
    <span>📝 Text</span><span>⌄</span>
   </button>

   <div class="category-body">

    <div class="setting">
     <label>Text size</label>
     <input id="textSize" type="range" min="12" max="24">
     <div class="setting-value" id="textSizeValue"></div>
    </div>

    <div class="setting">
     <label>Word spacing</label>
     <input id="wordSpacing" type="range" min="0" max="12">
     <div class="setting-value" id="wordSpacingValue"></div>
    </div>

    <div class="setting">
     <label>Line spacing</label>
     <input id="lineSpacing" type="range" min="1" max="2" step=".05">
     <div class="setting-value" id="lineSpacingValue"></div>
    </div>

   </div>
  </div>

  <div class="category">

   <button class="category-title">
    <span>💬 Chat</span><span>⌄</span>
   </button>

   <div class="category-body">

    <div class="setting">
     <label>Refresh rate</label>

     <select id="refreshRate">
      <option value="10000">10 seconds</option>
      <option value="5000">5 seconds</option>
      <option value="3000">3 seconds</option>
      <option value="2000">2 seconds</option>
      <option value="1000">1 second</option>
      <option value="500">0.5 seconds</option>
      <option value="100">0.1 seconds</option>
     </select>
    </div>

    <div class="setting">
     <label>Show timestamps</label>
     <select id="showTimestamps">
      <option value="true">On</option>
      <option value="false">Off</option>
     </select>
    </div>

    <div class="setting">
     <label>Compact messages</label>
     <select id="compactMessages">
      <option value="false">Off</option>
      <option value="true">On</option>
     </select>
    </div>

   </div>
  </div>

  <div class="category">

   <button class="category-title">
    <span>🎨 Appearance</span><span>⌄</span>
   </button>

   <div class="category-body">

    <div class="setting">
     <label>Theme</label>

     <select id="themeSelect">
      <option value="dark">Dark</option>
      <option value="midnight">Midnight</option>
      <option value="black">Pure Black</option>
      <option value="blue">Dark Blue</option>
      <option value="purple">Dark Purple</option>
      <option value="green">Dark Green</option>
      <option value="red">Dark Red</option>
      <option value="gray">Classic Gray</option>
      <option value="light">Light</option>
      <option value="oled">OLED</option>
     </select>
    </div>

    <div class="setting">
     <label>Corner roundness</label>
     <input id="cornerRadius" type="range" min="0" max="25">
     <div class="setting-value" id="cornerRadiusValue"></div>
    </div>

    <div class="setting">
     <label>UI scale</label>
     <input id="uiScale" type="range" min=".8" max="1.2" step=".05">
     <div class="setting-value" id="uiScaleValue"></div>
    </div>

   </div>
  </div>

  <div class="category">

   <button class="category-title">
    <span>⚙️ Behavior</span><span>⌄</span>
   </button>

   <div class="category-body">

    <div class="setting">
     <label>Enter to send</label>
     <select id="enterToSend">
      <option value="true">On</option>
      <option value="false">Off</option>
     </select>
    </div>

    <div class="setting">
     <label>Auto-scroll</label>
     <select id="autoScroll">
      <option value="true">On</option>
      <option value="false">Off</option>
     </select>
    </div>

    <div class="setting">
     <label>Confirm before deleting</label>
     <select id="confirmDelete">
      <option value="true">On</option>
      <option value="false">Off</option>
     </select>
    </div>

   </div>
  </div>

  <button class="save-btn" id="saveSettings">
   Save settings
  </button>

 </div>
</div>
</div>


<!-- CONTEXT MENU -->

<div class="context-menu" id="contextMenu">
 <button id="editMessage">Edit</button>
 <button class="delete-option" id="deleteMessage">Delete</button>
</div>


<!-- IMAGE -->

<div class="image-viewer" id="imageViewer">
 <button class="back-image" id="backImage">← Back</button>
 <img class="full-image" id="fullImage">
</div>


<script>
/* =====================================================
   CONFIG
===================================================== */

const API_URL="/api/messages";
const CHANNEL="general";

/*
   Game state is stored inside the messages table.

   This is deliberately hidden from normal chat rendering.
*/
const GAME_PREFIX="__CHAT_GAME_STATE__:";


/* =====================================================
   DEVICE
===================================================== */

let deviceId=localStorage.getItem("chat_device_id");

if(!deviceId){
 deviceId=crypto.randomUUID();
 localStorage.setItem("chat_device_id",deviceId);
}


/* =====================================================
   SETTINGS
===================================================== */

const defaults={
 username:"",
 theme:"dark",
 refreshRate:500,
 showTimestamps:true,
 compactMessages:false,
 textSize:16,
 wordSpacing:0,
 lineSpacing:1.45,
 cornerRadius:12,
 uiScale:1,
 enterToSend:true,
 autoScroll:true,
 confirmDelete:true
};

function getSetting(key){
 const value=localStorage.getItem("chat_"+key);

 if(value===null)return defaults[key];
 if(value==="true")return true;
 if(value==="false")return false;

 const n=Number(value);
 return Number.isNaN(n)?value:n;
}

let settings={};

Object.keys(defaults).forEach(k=>{
 settings[k]=getSetting(k);
});


/* =====================================================
   ELEMENTS
===================================================== */

const messagesEl=document.getElementById("messages");
const messageInput=document.getElementById("messageInput");
const sendBtn=document.getElementById("sendBtn");
const imageInput=document.getElementById("imageInput");
const attachBtn=document.getElementById("attachBtn");

const settingsBtn=document.getElementById("settingsBtn");
const settingsOverlay=document.getElementById("settingsOverlay");
const closeSettings=document.getElementById("closeSettings");
const saveSettings=document.getElementById("saveSettings");

const usernameInput=document.getElementById("usernameInput");
const deviceIdInput=document.getElementById("deviceIdInput");
const themeSelect=document.getElementById("themeSelect");
const refreshRate=document.getElementById("refreshRate");
const showTimestamps=document.getElementById("showTimestamps");
const compactMessages=document.getElementById("compactMessages");
const textSize=document.getElementById("textSize");
const wordSpacing=document.getElementById("wordSpacing");
const lineSpacing=document.getElementById("lineSpacing");
const cornerRadius=document.getElementById("cornerRadius");
const uiScale=document.getElementById("uiScale");
const enterToSend=document.getElementById("enterToSend");
const autoScroll=document.getElementById("autoScroll");
const confirmDelete=document.getElementById("confirmDelete");

const textSizeValue=document.getElementById("textSizeValue");
const wordSpacingValue=document.getElementById("wordSpacingValue");
const lineSpacingValue=document.getElementById("lineSpacingValue");

/* =====================================================
   GAME MESSAGE ENCODING
===================================================== */

function encodeGame(game){
 return GAME_PREFIX+JSON.stringify(game);
}

function decodeGame(message){

 if(
  !message ||
  typeof message.message!=="string" ||
  !message.message.startsWith(GAME_PREFIX)
 ){
  return null;
 }

 try{
  return JSON.parse(
   message.message.substring(
    GAME_PREFIX.length
   )
  );
 }catch{
  return null;
 }
}


/* =====================================================
   CHAT LOAD
===================================================== */

async function loadMessages(){

 try{

  const response=await fetch(
   API_URL+
   "?channel="+
   encodeURIComponent(CHANNEL)
  );

  const data=await response.json();

  if(!response.ok){
   throw new Error(
    data.error||"Failed to load messages."
   );
  }

  const all=
   Array.isArray(data.messages)
   ?data.messages
   :[];

  /*
   Split ordinary chat and invisible game messages.
  */

  currentMessages=all.filter(
   m=>!String(m.message||"")
    .startsWith(GAME_PREFIX)
  );

  gameMessages=all.filter(
   m=>String(m.message||"")
    .startsWith(GAME_PREFIX)
  );

  renderMessages();
  rebuildGames();

 }catch(error){

  messagesEl.innerHTML=`
   <div class="empty">
    <div>
     <strong>Unable to load messages</strong>
     ${escapeHtml(error.message)}
    </div>
   </div>
  `;

 }

}


/* =====================================================
   REBUILD GAMES
===================================================== */

function rebuildGames(){

 const map=new Map();

 for(const msg of gameMessages){

  const game=decodeGame(msg);

  if(!game||!game.id)continue;

  /*
   Latest message wins.
  */

  map.set(String(game.id),{
   ...game,
   _messageId:msg.id,
   _hostMessageDevice:msg.device_id
  });

 }

 games=[...map.values()];

 /*
   Remove games that are already finished/stopped.
 */
 games=games.filter(
  g=>g.status!=="finished" &&
     g.status!=="stopped"
 );

 renderGameMessages();
 renderGamesLobby();

}


/* =====================================================
   GAME CLEANUP
===================================================== */

async function deleteGameMessage(game){

 if(!game || !game._messageId)return;

 try{

  /*
   The game message belongs to the host.
   Use the host device ID when deleting it.
  */

  await fetch(
   API_URL,
   {
    method:"DELETE",
    headers:{
     "Content-Type":"application/json"
    },
    body:JSON.stringify({
     id:game._messageId,
     device_id:game.host_device_id
    })
   }
  );

 }catch{}

}


/*
 Delete all old state messages for a game.

 This removes older snapshots as well as the current one.
*/
async function cleanupGameMessages(gameId){

 const matches=gameMessages.filter(msg=>{
  const g=decodeGame(msg);
  return g && String(g.id)===String(gameId);
 });

 for(const msg of matches){

  /*
   The original game host owns these messages.
  */

  const g=decodeGame(msg);

  if(!g)continue;

  try{

   await fetch(
    API_URL,
    {
     method:"DELETE",
     headers:{
      "Content-Type":"application/json"
     },
     body:JSON.stringify({
      id:msg.id,
      device_id:g.host_device_id
     })
    }
   );

  }catch{}

 }

}


/* =====================================================
   GAME SNAPSHOT
===================================================== */

async function saveGame(game){

 /*
  To keep only one visible game-state message,
  delete old snapshots first.

  Then create the newest snapshot.
 */

 const old=gameMessages.filter(msg=>{
  const g=decodeGame(msg);
  return g && String(g.id)===String(game.id);
 });

 for(const msg of old){

  try{

   await fetch(
    API_URL,
    {
     method:"DELETE",
     headers:{
      "Content-Type":"application/json"
     },
     body:JSON.stringify({
      id:msg.id,
      device_id:game.host_device_id
     })
    }
   );

  }catch{}

 }

 const response=await fetch(
  API_URL,
  {
   method:"POST",
   headers:{
    "Content-Type":"application/json"
   },
   body:JSON.stringify({

    username:game.host_username,

    channel:CHANNEL,

    message:encodeGame(game),

    device_id:game.host_device_id,

    image:null

   })
  }
 );

 const data=await response.json().catch(()=>({}));

 if(!response.ok){

  throw new Error(
   data.error||
   "Could not save game."
  );

 }

 return data;
}

/* =====================================================
   INITIAL GAME STATES
===================================================== */

function initialGameState(type){

 switch(type){

  case "tictactoe":
   return {
    board:Array(9).fill(""),
    winner:null,
    draw:false
   };

  case "connect4":
   return {
    board:Array(42).fill(""),
    winner:null,
    draw:false
   };

  case "dice":
   return {
    last_roll:null,
    rolls:{},
    round:1,
    message:"Roll the dice!"
   };

  case "higherlower":
   return {
    current_number:
     Math.floor(Math.random()*90)+10,
    message:"Choose higher or lower.",
    winner:null
   };

  case "rps":
   return {
    choices:{},
    message:"Choose your move.",
    winner:null
   };

 }

 return {};
}


/* =====================================================
   JOIN GAME
===================================================== */

async function joinGame(gameId){

 const game=findGame(gameId);

 if(!game)return;

 if(game.status!=="lobby"){

  alert(
   "This game has already started.\n"+
   "You can spectate it."
  );

  return;
 }

 if(
  game.players.some(
   p=>p.device_id===deviceId
  )
 ){

  openGameFromChat(game.id);
  return;

 }

 if(
  game.players.length>=
  Number(game.max_players)
 ){

  alert("This game is full.");
  return;

 }

 try{

  /*
   Important:
   Only players who joined before Start
   are added to players[].
  */

  game.players.push({
   device_id:deviceId,
   username:settings.username
  });

  game.updated_at=Date.now();

  await saveGame(game);

  await loadMessages();

 }catch(error){

  alert(
   "Could not join game:\n\n"+
   error.message
  );

 }

}


/* =====================================================
   LEAVE GAME
===================================================== */

async function leaveGame(gameId){

 const game=findGame(gameId);

 if(!game)return;

 /*
  Host cannot leave normally.
  Host uses Force Quit.
 */

 if(game.host_device_id===deviceId){

  await forceQuitGame(gameId);
  return;

 }

 game.players=
  game.players.filter(
   p=>p.device_id!==deviceId
  );

 /*
  If nobody is left, remove the game.
 */

 if(game.players.length===0){

  await cleanupGameMessages(game.id);

  activeGameId=null;

  await loadMessages();

  return;
 }

 /*
  If game is currently playing and the leaving player
  owns the current turn, move to the next player.
 */

 if(
  game.status==="playing" &&
  game.turn_device_id===deviceId
 ){

  nextTurn(game);

 }

 try{

  await saveGame(game);
  await loadMessages();

 }catch(error){

  alert(
   "Could not leave game:\n\n"+
   error.message
  );

 }

}


/* =====================================================
   FORCE QUIT
===================================================== */

async function forceQuitGame(gameId){

 const game=findGame(gameId);

 if(!game)return;

 if(game.host_device_id!==deviceId){

  alert("Only the host can force quit the game.");
  return;

 }

 if(
  !confirm(
   "Force quit this game?\n\n"+
   "Everyone will be removed and the game message "+
   "will be deleted."
  )
 )return;

 try{

  /*
   Delete every game-state message.
  */

  await cleanupGameMessages(game.id);

  activeGameId=null;

  await loadMessages();

 }catch(error){

  alert(
   "Could not force quit game:\n\n"+
   error.message
  );

 }

}


/* =====================================================
   START GAME
===================================================== */

async function startGame(gameId){

 const game=findGame(gameId);

 if(!game)return;

 if(game.host_device_id!==deviceId){

  alert("Only the host can start the game.");
  return;

 }

 if(game.status!=="lobby")return;

 if(game.players.length<1){

  alert("There are no players.");
  return;

 }

 /*
  Players are frozen here.
  Anyone joining after this cannot become a player.
 */

 game.status="playing";

 game.turn_index=0;

 game.turn_device_id=
  game.players[0].device_id;

 game.updated_at=Date.now();

 await saveGame(game);

 await loadMessages();

}

/* =====================================================
   RENDER GAME MESSAGES
===================================================== */

function renderGameMessages(){

 /*
  Remove previous rendered game cards.
 */

 document
  .querySelectorAll(".game-message-rendered")
  .forEach(el=>el.remove());

 /*
  Games appear as their own chat messages.
 */

 for(const game of games){

  const wrapper=
   document.createElement("div");

  wrapper.className=
   "game-message-rendered";

  wrapper.dataset.gameCard=
   game.id;

  wrapper.innerHTML=
   renderGameHTML(game);

  /*
   Insert at the end of the chat.
  */

  messagesEl.appendChild(wrapper);

  attachGameEvents(wrapper,game);

 }

}

   GAME HTML
===================================================== */

  gameDefinitions[game.game_type]||
  gameDefinitions.tictactoe;

 const joined=
  game.players.some(
   p=>p.device_id===deviceId
  );

 const isHost=
  game.host_device_id===deviceId;

 const started=
  game.status==="playing";

 let turnPlayer=null;

 if(game.turn_device_id){

  turnPlayer=
   game.players.find(
    p=>p.device_id===game.turn_device_id
   );

 }

 let turnText="Waiting for host to start";

 if(started && turnPlayer){

  turnText=
   turnPlayer.device_id===deviceId
   ?"🎯 Your turn!"
   :"⏳ "+escapeHtml(
    turnPlayer.username
   )+"'s turn";

 }

 let buttons="";

 if(!started){

  if(!joined && game.players.length<game.max_players){

   buttons+=`
    <button
     class="primary-btn"
     data-action="join">
     Join game
    </button>
   `;

  }

  if(joined && !isHost){

   buttons+=`
    <button
     class="danger-btn"
     data-action="leave">
     Leave
    </button>
   `;

  }

  if(isHost){

   buttons+=`
    <button
     class="success-btn"
     data-action="start">
     ▶ Start
    </button>

    <button
     class="danger-btn"
     data-action="force">
     Force quit
    </button>
   `;

  }

 }else{

  if(joined){

   buttons+=`
    <button
     class="danger-btn"
     data-action="leave">
     Leave
    </button>
   `;

  }

  if(isHost){

   buttons+=`
    <button
     class="danger-btn"
     data-action="force">
     Force quit
    </button>
   `;

  }

 }

 return `

  <div class="game-card">

   <div class="game-card-header">

    <div class="game-icon">
     ${def.icon}
    </div>

    <div class="game-card-title">

     <strong>
      ${escapeHtml(game.name)}
     </strong>

     <span>
      ${escapeHtml(def.name)}
      · hosted by
      ${escapeHtml(game.host_username)}
     </span>

    </div>

   </div>

   <div class="game-invite">

    ${
     !started
     ?`
      <b>
       ${escapeHtml(game.host_username)}
       invited you to a game of
       ${escapeHtml(def.name)}
      </b>
     `
     :`
      <b>
       🎮 ${escapeHtml(game.name)}
      </b>
     `
    }

    <div class="game-players">

     ${game.players.map(p=>`

      <div class="
       player-chip
       ${p.device_id===game.host_device_id?"host":""}
       ${p.device_id===game.turn_device_id?"turn":""}
      ">

       ${
        p.device_id===game.host_device_id
        ?"👑 "
        :""
       }

       ${escapeHtml(p.username)}

       ${
        p.device_id===deviceId
        ?" (You)"
        :""
       }

      </div>

     `).join("")}

    </div>

    <div style="color:var(--muted);font-size:12px">

     👥 ${game.players.length}/${game.max_players}

     ${
      started
      ?" · 🟢 Playing"
      :" · 🟡 Waiting for host"
     }

    </div>

    ${
     started
     ?`
      <div class="turn-banner">
       ${turnText}
      </div>

      <div class="game-board">
       ${renderBoardHTML(game)}
      </div>
     `
     :""
    }

    <div class="game-buttons">
     ${buttons}
    </div>

   </div>

  </div>

 `;

}

/* =====================================================
   GAME EVENTS
===================================================== */

function attachGameEvents(wrapper,game){

 wrapper
  .querySelector("[data-action='join']")
  ?.addEventListener(
   "click",
   ()=>joinGame(game.id)
  );

 wrapper
  .querySelector("[data-action='leave']")
  ?.addEventListener(
   "click",
   ()=>leaveGame(game.id)
  );

 wrapper
  .querySelector("[data-action='start']")
  ?.addEventListener(
   "click",
   ()=>startGame(game.id)
  );

 wrapper
  .querySelector("[data-action='force']")
  ?.addEventListener(
   "click",
   ()=>forceQuitGame(game.id)
  );

 wrapper
  .querySelectorAll("[data-move]")
  .forEach(btn=>{
   btn.onclick=()=>{

    playMove(
     game.id,
     Number(btn.dataset.move)
    );

   };
  });

 wrapper
  .querySelectorAll("[data-column]")
  .forEach(btn=>{
   btn.onclick=()=>{

    playMove(
     game.id,
     Number(btn.dataset.column)
    );

   };
  });

 wrapper
  .querySelector("[data-roll]")
  ?.addEventListener(
   "click",
   ()=>rollDice(game.id)
  );

 wrapper
  .querySelector("[data-higher]")
  ?.addEventListener(
   "click",
   ()=>higherLower(game.id,"higher")
  );

 wrapper
  .querySelector("[data-lower]")
  ?.addEventListener(
   "click",
   ()=>higherLower(game.id,"lower")
  );

 wrapper
  .querySelectorAll("[data-rps]")
  .forEach(btn=>{
   btn.onclick=()=>{

    playRPS(
     game.id,
     btn.dataset.rps
    );

   };
  });

}


/* =====================================================
   NEXT TURN
===================================================== */

function nextTurn(game){

 if(!game.players.length){

  game.turn_device_id=null;
  return;

 }

 game.turn_index=
  (Number(game.turn_index)+1)%
  game.players.length;

 game.turn_device_id=
  game.players[game.turn_index].device_id;

}


/* =====================================================
   TIC TAC TOE MOVE
===================================================== */

async function playMove(gameId,pos){

 const game=findGame(gameId);

 if(!game)return;

 if(game.game_type==="connect4"){

  await connect4Move(
   game,
   pos
  );

  return;

 }

 if(game.game_type!=="tictactoe")return;

 if(game.turn_device_id!==deviceId)return;

 const board=[
  ...game.state.board
 ];

 if(board[pos])return;

 const symbol=
  game.turn_index===0
  ?"X"
  :"O";

 board[pos]=symbol;

 game.state.board=board;

 const winner=
  checkTTT(board);

 if(winner){

  game.state.winner=
   winner==="X"
   ?game.players[0]?.username
   :game.players[1]?.username;

  game.status="finished";

  await finishGame(game);

  return;

 }

 if(board.every(Boolean)){

  game.state.draw=true;
  game.state.message="Draw!";
  game.status="finished";

  await finishGame(game);

  return;

 }

 nextTurn(game);

 game.updated_at=Date.now();

 await saveGame(game);
 await loadMessages();

}


function checkTTT(b){

 const lines=[
  [0,1,2],
  [3,4,5],
  [6,7,8],
  [0,3,6],
  [1,4,7],
  [2,5,8],
  [0,4,8],
  [2,4,6]
 ];

 for(const line of lines){

  const[a,c,d]=line;

  if(
   b[a] &&
   b[a]===b[c] &&
   b[a]===b[d]
  ){

   return b[a];

  }

 }

 return null;

}


/* =====================================================
   CONNECT FOUR
===================================================== */

async function connect4Move(game,column){

 if(game.turn_device_id!==deviceId)return;

 const b=[...game.state.board];

 let row=-1;

 for(let r=5;r>=0;r--){

  const i=r*7+column;

  if(!b[i]){

   row=r;
   break;

  }

 }

 if(row<0)return;

 const symbol=
  game.turn_index===0
  ?"R"
  :"Y";

 b[row*7+column]=symbol;

 game.state.board=b;

 if(checkConnect4(b,symbol)){

  const player=
   game.players[game.turn_index];

  game.state.winner=
   player?.username||"Player";

  game.status="finished";

  await finishGame(game);

  return;

 }

 if(b.every(Boolean)){

  game.state.draw=true;
  game.status="finished";

  await finishGame(game);

  return;

 }

 nextTurn(game);

 game.updated_at=Date.now();

 await saveGame(game);
 await loadMessages();

}


function checkConnect4(b,s){

 for(let r=0;r<6;r++){

  for(let c=0;c<7;c++){

   const i=r*7+c;

   if(b[i]!==s)continue;

   if(c<=3 &&
      b[i+1]===s &&
      b[i+2]===s &&
      b[i+3]===s)
    return true;

   if(r<=2 &&
      b[i+7]===s &&
      b[i+14]===s &&
      b[i+21]===s)
    return true;

   if(r<=2 && c<=3 &&
      b[i+8]===s &&
      b[i+16]===s &&
      b[i+24]===s)
    return true;

   if(r<=2 && c>=3 &&
      b[i+6]===s &&
      b[i+12]===s &&
      b[i+18]===s)
    return true;

  }

 }

 return false;

}


/* =====================================================
   DICE
===================================================== */

async function rollDice(gameId){

 const game=findGame(gameId);

 if(!game)return;

 if(game.turn_device_id!==deviceId)return;

 const roll=
  Math.floor(Math.random()*6)+1;

 game.state.last_roll=roll;

 game.state.rolls[deviceId]=roll;

 game.state.message=
  settings.username+
  " rolled "+roll;

 /*
  Every player gets a turn.
 */

 if(
  Object.keys(game.state.rolls).length>=
  game.players.length
 ){

  let winnerId=null;
  let best=-1;

  for(const p of game.players){

   const r=
    game.state.rolls[p.device_id]||0;

   if(r>best){

    best=r;
    winnerId=p.device_id;

   }

  }

  const winner=
   game.players.find(
    p=>p.device_id===winnerId
   );

  game.state.message=
   "🏆 "+
   (winner?.username||"Player")+
   " wins with "+best+"!";

  game.state.rolls={};

  /*
   New round.
  */

  game.state.round++;

 }

 nextTurn(game);

 game.updated_at=Date.now();

 await saveGame(game);
 await loadMessages();

}


/* =====================================================
   HIGHER LOWER
===================================================== */

async function higherLower(gameId,guess){

 const game=findGame(gameId);

 if(!game)return;

 if(game.turn_device_id!==deviceId)return;

 const old=
  Number(game.state.current_number);

 const next=
  Math.floor(Math.random()*100)+1;

 const correct=
  guess==="higher"
  ?next>old
  :next<old;

 game.state.current_number=next;

 if(correct){

  game.state.message=
   "✅ Correct! "+
   settings.username+
   " guessed "+guess+".";

 }else{

  game.state.message=
   "❌ Wrong! "+
   settings.username+
   " guessed "+guess+".";

 }

 nextTurn(game);

 game.updated_at=Date.now();

 await saveGame(game);
 await loadMessages();

}


/* =====================================================
   RPS
===================================================== */

async function playRPS(gameId,choice){

 const game=findGame(gameId);

 if(!game)return;

 if(game.turn_device_id!==deviceId)return;

 game.state.choices[deviceId]=choice;

 /*
  Move to the next player until everyone chose.
 */

 const chosen=
  Object.keys(game.state.choices).length;

 if(chosen<game.players.length){

  nextTurn(game);

  game.state.message=
   settings.username+
   " selected a move.";

  await saveGame(game);
  await loadMessages();

  return;

 }

 /*
  Determine winner.

  For more than two players we count wins.
 */

 const choices=game.state.choices;

 let wins={};

 for(const p of game.players)
  wins[p.device_id]=0;

 const ids=game.players.map(
  p=>p.device_id
 );

 function beats(a,b){

  return(
   a==="rock"&&b==="scissors"||
   a==="paper"&&b==="rock"||
   a==="scissors"&&b==="paper"
  );

 }

 for(let i=0;i<ids.length;i++){

  for(let j=i+1;j<ids.length;j++){

   const a=choices[ids[i]];
   const b=choices[ids[j]];

   if(a===b)continue;

   if(beats(a,b))
    wins[ids[i]]++;
   else
    wins[ids[j]]++;

  }

 }

 let best=-1;
 let winnerId=null;

 for(const id of ids){

  if(wins[id]>best){

   best=wins[id];
   winnerId=id;

  }

 }

 const winner=
  game.players.find(
   p=>p.device_id===winnerId
  );

 game.state.message=
  "🏆 "+
  (winner?.username||"Player")+
  " wins!";

 game.state.winner=
  winner?.username||"Player";

 game.state.choices={};

 /*
  Start another round instead of immediately ending.
 */

 game.turn_index=0;

 game.turn_device_id=
  game.players[0].device_id;

 await saveGame(game);
 await loadMessages();

}


/* =====================================================
   FINISH GAME
===================================================== */

async function finishGame(game){

 /*
  Show result very briefly through state,
  then remove the game message.

  This keeps the server from accumulating finished games.
 */

 game.updated_at=Date.now();

 await saveGame(game);

 await loadMessages();

 setTimeout(
  async()=>{

   await cleanupGameMessages(game.id);

   await loadMessages();

  },
  5000
 );

}

function renderMessages(){

  const name=
   document.createElement("span");

  name.className="username";

   message.username||"User";

  top.appendChild(name);

  if(settings.showTimestamps){

   const time=
    document.createElement("span");

   time.className="time";

   time.textContent=
    formatTime(message.created_at);

   top.appendChild(time);

  }

  if(message.edited){

   const edited=
    document.createElement("span");

   edited.className="edited";
   edited.textContent="(edited)";

   top.appendChild(edited);

  }

  content.appendChild(top);

  if(message.message){

   const text=
    document.createElement("div");

   text.className="message-text";
   text.textContent=message.message;

   content.appendChild(text);

  }

  if(message.image){

   const img=
    document.createElement("img");

   img.className="message-image";
   img.src=message.image;
   img.alt="Image";

   img.onclick=()=>{
    openImage(message.image);
   };

   content.appendChild(img);

  }

  item.appendChild(avatar);
  item.appendChild(content);

  if(
   message.device_id===deviceId
  ){

   item.oncontextmenu=e=>{

    e.preventDefault();

    selectedMessage=message;

    contextMenu.style.left=
     Math.min(
      e.clientX,
      innerWidth-170
     )+"px";

    contextMenu.style.top=
     Math.min(
      e.clientY,
      innerHeight-100
     )+"px";

    contextMenu.classList.add("show");

   };

  }

  fragment.appendChild(item);

 }

 /*
  Important:
  Game messages are rendered separately after ordinary messages.
 */

 messagesEl.replaceChildren(fragment);

 if(oldBottom && settings.autoScroll){

  messagesEl.scrollTop=
   messagesEl.scrollHeight;

 }

}

function resizeImage(file){

 return new Promise((resolve,reject)=>{

  const reader=new FileReader();

  reader.onload=()=>{

   const img=new Image();

   img.onload=()=>{

    let w=img.width;
    let h=img.height;
    const max=1500;

    if(w>max||h>max){

     const scale=Math.min(
      max/w,
      max/h
     );

     w=Math.round(w*scale);
     h=Math.round(h*scale);

    }

    const canvas=document.createElement("canvas");

    canvas.width=w;
    canvas.height=h;

    canvas
     .getContext("2d")
     .drawImage(img,0,0,w,h);

    resolve(
     canvas.toDataURL(
      "image/jpeg",
      .78
     )
    );

   };

   img.onerror=reject;
   img.src=reader.result;

  };

  reader.onerror=reject;
  reader.readAsDataURL(file);

 });

}
