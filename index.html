<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat</title>

<style>
*{box-sizing:border-box}

:root{
    --bg:#0b0d10;
    --panel:#111419;
    --panel2:#181c22;
    --border:#292f38;
    --text:#edf0f4;
    --muted:#7e8793;
    --accent:#e8eaed;
    --danger:#ff7070;
    --green:#72e09b;
    --radius:12px;
    --ui-scale:1;
    --text-size:16px;
    --word-spacing:0px;
    --line-spacing:1.45;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

body{
    overflow:hidden;
    font-size:calc(16px * var(--ui-scale));
}

button,input,textarea,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:64px;
    min-height:64px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel);
    border-bottom:1px solid var(--border);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
}

.logo-icon{
    width:35px;
    height:35px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:var(--panel2);
    border:1px solid var(--border);
}

.channel{
    color:var(--muted);
    font-weight:400;
}

.icon-btn{
    width:39px;
    height:39px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
}

.icon-btn:hover{
    filter:brightness(1.15);
}

/* CHAT */

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    display:flex;
    gap:11px;
    margin-bottom:17px;
}

.avatar{
    flex:0 0 40px;
    width:40px;
    height:40px;
    display:grid;
    place-items:center;
    border-radius:var(--radius);
    background:var(--panel2);
    border:1px solid var(--border);
    font-weight:700;
}

.message-content{
    min-width:0;
    max-width:min(850px,calc(100vw - 90px));
}

.message-top{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:3px;
}

.username{
    font-weight:700;
}

.time,.edited{
    color:var(--muted);
    font-size:11px;
}

.message-text{
    color:#d8dde4;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    font-size:var(--text-size);
    word-spacing:var(--word-spacing);
    line-height:var(--line-spacing);
}

.message-image{
    display:block;
    max-width:min(500px,80vw);
    max-height:500px;
    margin-top:8px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:#000;
    object-fit:contain;
    cursor:pointer;
}

/* GAMES IN CHAT */

.game-card{
    margin:8px 0 20px 51px;
    width:min(680px,calc(100% - 55px));
    background:linear-gradient(
        145deg,
        #171b22,
        #101318
    );
    border:1px solid #303743;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 12px 35px #0005;
}

.game-card-header{
    padding:16px 17px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
}

.game-title{
    font-size:18px;
    font-weight:800;
}

.game-invite{
    color:#cbd1d9;
    font-size:13px;
    margin-top:4px;
}

.game-invite strong{
    color:white;
}

.game-status{
    padding:5px 9px;
    border-radius:20px;
    background:#252b34;
    color:#aeb7c3;
    font-size:11px;
    font-weight:700;
    white-space:nowrap;
}

.game-status.playing{
    color:var(--green);
    background:#14251c;
}

.game-body{
    padding:15px;
}

.game-player-count{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

.game-turn{
    padding:10px 12px;
    background:#0c0f13;
    border:1px solid var(--border);
    border-radius:10px;
    margin-bottom:12px;
}

.game-turn strong{
    color:white;
}

.game-players{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:13px;
}

.game-player{
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px 9px;
    background:#20252d;
    border:1px solid #303641;
    border-radius:8px;
    font-size:12px;
}

.player-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--green);
}

.host-badge{
    font-size:9px;
    padding:2px 5px;
    border-radius:5px;
    background:#343b47;
    color:#cbd1da;
}

.game-actions{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.game-btn{
    border:1px solid var(--border);
    border-radius:9px;
    padding:9px 13px;
    background:#20252d;
    color:white;
}

.game-btn:hover{
    filter:brightness(1.15);
}

.game-btn.primary{
    background:#e8eaed;
    color:#111;
}

.game-btn.danger{
    color:#ff8b8b;
    background:#28191b;
    border-color:#593035;
}

.game-board{
    display:grid;
    gap:6px;
    margin:15px auto;
    max-width:420px;
}

.ttt-board{
    grid-template-columns:repeat(3,1fr);
}

.ttt-cell{
    aspect-ratio:1;
    border:1px solid var(--border);
    border-radius:10px;
    background:#171b21;
    color:white;
    font-size:35px;
    font-weight:800;
}

.ttt-cell:hover{
    background:#222832;
}

.dice-result{
    text-align:center;
    padding:30px 10px;
    font-size:55px;
    font-weight:900;
}

.game-message{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    padding:8px;
}

/* COMPOSER */

.composer{
    padding:12px 16px 16px;
    background:var(--panel);
    border-top:1px solid var(--border);
}

.composer-box{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:8px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:14px;
}

textarea{
    flex:1;
    min-height:42px;
    max-height:150px;
    resize:none;
    border:0;
    outline:none;
    background:transparent;
    color:white;
    padding:10px;
}

.attach-btn,
.send-btn{
    height:42px;
    border:0;
    border-radius:9px;
}

.attach-btn{
    width:42px;
    background:transparent;
    color:#adb5c0;
    font-size:20px;
}

.attach-btn:hover{
    background:#242932;
}

.send-btn{
    padding:0 18px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

.send-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* OVERLAYS */

.overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.72);
    z-index:100;
}

.overlay.show{
    display:flex;
}

.panel{
    width:min(560px,calc(100vw - 25px));
    max-height:calc(100vh - 25px);
    overflow-y:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
    box-shadow:0 25px 80px #000b;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px;
    border-bottom:1px solid var(--border);
}

.panel-header h2{
    margin:0;
}

.panel-body{
    padding:18px;
}

/* SETTINGS */

.category{
    margin-bottom:12px;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    background:var(--panel2);
}

.category-title{
    width:100%;
    padding:14px;
    border:0;
    background:transparent;
    color:var(--text);
    display:flex;
    justify-content:space-between;
    font-weight:700;
    text-align:left;
}

.category-body{
    display:none;
    padding:0 14px 14px;
}

.category.open .category-body{
    display:block;
}

.setting{
    margin-top:14px;
}

.setting label{
    display:block;
    margin-bottom:7px;
    color:#aab2bd;
    font-size:13px;
}

.setting input,
.setting select{
    width:100%;
    padding:10px;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
    background:#101419;
    color:white;
}

.setting input[type=range]{
    padding:0;
}

.setting-value{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.save-btn{
    width:100%;
    margin-top:8px;
    padding:12px;
    border:0;
    border-radius:9px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

.danger-zone{
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid #402529;
}

.danger-title{
    color:var(--danger);
    font-weight:700;
}

.danger-zone p{
    color:var(--muted);
    line-height:1.45;
}

.danger-btn{
    width:100%;
    padding:12px;
    border-radius:9px;
    border:1px solid #743333;
    background:#241719;
    color:#ff8585;
}

/* GAME CREATOR */

.game-list{
    display:grid;
    gap:9px;
}

.game-choice{
    width:100%;
    text-align:left;
    padding:13px;
    border-radius:11px;
    border:1px solid var(--border);
    background:#181d24;
    color:white;
}

.game-choice:hover{
    background:#222832;
}

.game-choice strong{
    display:block;
}

.game-choice span{
    display:block;
    margin-top:4px;
    color:var(--muted);
    font-size:12px;
}

/* CONTEXT */

.context-menu{
    position:fixed;
    display:none;
    width:160px;
    padding:5px;
    z-index:200;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:9px;
    box-shadow:0 15px 40px #0009;
}

.context-menu.show{
    display:block;
}

.context-menu button{
    width:100%;
    padding:9px 10px;
    text-align:left;
    border:0;
    border-radius:6px;
    background:transparent;
    color:var(--text);
}

.context-menu button:hover{
    background:#252b33;
}

.delete-option{
    color:#ff7777!important;
}

/* IMAGE */

.image-viewer{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000f;
    z-index:300;
}

.image-viewer.show{
    display:flex;
}

.full-image{
    max-width:95vw;
    max-height:90vh;
    object-fit:contain;
}

.back-image{
    position:absolute;
    top:18px;
    left:18px;
    padding:10px 16px;
    border-radius:9px;
    border:1px solid #3a4049;
    background:#171b21;
    color:white;
}

/* EMPTY */

.empty{
    height:100%;
    display:grid;
    place-items:center;
    color:#656d78;
    text-align:center;
}

.empty strong{
    display:block;
    color:#aab2bd;
    margin-bottom:5px;
}

@media(max-width:600px){

    .header{
        padding:0 11px;
    }

    .messages{
        padding:15px 11px;
    }

    .channel{
        display:none;
    }

    .message-content{
        max-width:calc(100vw - 70px);
    }

    .game-card{
        margin-left:0;
        width:100%;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">
    <div class="logo">
        <div class="logo-icon">💬</div>
        <span>Chat</span>
        <span class="channel"># general</span>
    </div>

    <div style="display:flex;gap:7px">
        <button class="icon-btn" id="gamesBtn" title="Games">🎮</button>
        <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
    </div>
</header>

<main class="messages" id="messages"></main>

<div class="composer">

    <div class="composer-box">

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
        >

        <button
            class="attach-btn"
            id="attachBtn"
        >＋</button>

        <textarea
            id="messageInput"
            rows="1"
            placeholder="Message #general"
        ></textarea>

        <button
            class="send-btn"
            id="sendBtn"
        >Send</button>

    </div>

</div>

</div>


<!-- GAME CREATOR -->

<div class="overlay" id="gamesOverlay">

<div class="panel">

<div class="panel-header">
    <h2>🎮 Games</h2>

    <button
        class="icon-btn"
        id="closeGames"
    >×</button>
</div>

<div class="panel-body">

<p style="color:var(--muted)">
Choose a game to host. Other people can spectate the game,
but only people who press Join before you start become players.
</p>

<div class="game-list">

<button class="game-choice" data-game="tictactoe">
    <strong>⭕ Tic Tac Toe</strong>
    <span>2 players • Classic 3×3 game</span>
</button>

<button class="game-choice" data-game="dice">
    <strong>🎲 Dice Battle</strong>
    <span>2–6 players • Highest roll wins</span>
</button>

<button class="game-choice" data-game="connect4">
    <strong>🔴 Connect Four</strong>
    <span>2 players • Connect four pieces</span>
</button>

<button class="game-choice" data-game="memory">
    <strong>🧠 Memory</strong>
    <span>2–6 players • Match hidden pairs</span>
</button>

<button class="game-choice" data-game="reaction">
    <strong>⚡ Reaction</strong>
    <span>2–8 players • Fastest reaction wins</span>
</button>

</div>

</div>
</div>
</div>


<!-- SETTINGS -->

<div class="overlay" id="settingsOverlay">

<div class="panel">

<div class="panel-header">
    <h2>Settings</h2>

    <button
        class="icon-btn"
        id="closeSettings"
    >×</button>
</div>

<div class="panel-body">

<div class="category open">

<button class="category-title">
    <span>👤 Profile</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Your name</label>
<input id="usernameInput" maxlength="24">
</div>

<div class="setting">
<label>Device ID</label>
<input id="deviceIdInput" readonly>
</div>

</div>
</div>


<div class="category">

<button class="category-title">
    <span>📝 Text</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Text size</label>
<input id="textSize" type="range" min="12" max="24">
<div class="setting-value" id="textSizeValue"></div>
</div>

<div class="setting">
<label>Word spacing</label>
<input id="wordSpacing" type="range" min="0" max="12">
<div class="setting-value" id="wordSpacingValue"></div>
</div>

<div class="setting">
<label>Line spacing</label>
<input id="lineSpacing" type="range" min="1" max="2" step=".05">
<div class="setting-value" id="lineSpacingValue"></div>
</div>

</div>
</div>


<div class="category">

<button class="category-title">
    <span>💬 Chat</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Refresh rate</label>
<select id="refreshRate">
<option value="10000">10 seconds</option>
<option value="5000">5 seconds</option>
<option value="3000">3 seconds</option>
<option value="2000">2 seconds</option>
<option value="1000">1 second</option>
<option value="500" selected>0.5 seconds</option>
<option value="100">0.1 seconds</option>
</select>
</div>

<div class="setting">
<label>Show timestamps</label>
<select id="showTimestamps">
<option value="true">On</option>
<option value="false">Off</option>
</select>
</div>

<div class="setting">
<label>Compact messages</label>
<select id="compactMessages">
<option value="false">Off</option>
<option value="true">On</option>
</select>
</div>

</div>
</div>


<div class="category">

<button class="category-title">
    <span>🎨 Appearance</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Theme</label>

<select id="themeSelect">
<option value="dark">Dark</option>
<option value="midnight">Midnight</option>
<option value="slate">Slate</option>
<option value="black">Pure Black</option>
<option value="blue">Dark Blue</option>
<option value="purple">Dark Purple</option>
<option value="green">Dark Green</option>
<option value="red">Dark Red</option>
<option value="gray">Classic Gray</option>
<option value="light">Light</option>
<option value="oled">OLED</option>
</select>
</div>

<div class="setting">
<label>Corner roundness</label>
<input id="cornerRadius" type="range" min="0" max="25">
<div class="setting-value" id="cornerRadiusValue"></div>
</div>

<div class="setting">
<label>UI scale</label>
<input id="uiScale" type="range" min=".8" max="1.2" step=".05">
<div class="setting-value" id="uiScaleValue"></div>
</div>

</div>
</div>


<div class="category">

<button class="category-title">
    <span>⚙️ Behavior</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Enter to send</label>
<select id="enterToSend">
<option value="true">On</option>
<option value="false">Off</option>
</select>
</div>

<div class="setting">
<label>Auto-scroll</label>
<select id="autoScroll">
<option value="true">On</option>
<option value="false">Off</option>
</select>
</div>

<div class="setting">
<label>Confirm before deleting</label>
<select id="confirmDelete">
<option value="true">On</option>
<option value="false">Off</option>
</select>
</div>

</div>
</div>


<button class="save-btn" id="saveSettings">
Save settings
</button>


<div class="danger-zone">

<div class="danger-title">
⚠ Danger Zone
</div>

<p>
Remove every normal message and game-state message from the chat.
This affects everyone.
</p>

<button class="danger-btn" id="removeEverything">
Remove everything
</button>

</div>

</div>
</div>
</div>


<!-- CONTEXT -->

<div class="context-menu" id="contextMenu">

<button id="editMessage">
Edit
</button>

<button
    class="delete-option"
    id="deleteMessage"
>
Delete
</button>

</div>


<!-- IMAGE VIEWER -->

<div class="image-viewer" id="imageViewer">

<button class="back-image" id="backImage">
← Back
</button>

<img
    class="full-image"
    id="fullImage"
    alt="Full image"
>

</div>


<!-- CONFIRM -->

<div class="overlay" id="dialogOverlay">

<div style="
width:min(450px,calc(100vw - 30px));
background:var(--panel);
border:1px solid var(--border);
border-radius:14px;
padding:20px;
">

<h2 id="dialogTitle">Confirm</h2>

<p
    id="dialogText"
    style="color:#aab2bd;line-height:1.5"
></p>

<div style="
display:flex;
gap:8px;
justify-content:flex-end
">

<button
    id="dialogCancel"
    class="game-btn"
>
Cancel
</button>

<button
    id="dialogConfirm"
    class="game-btn danger"
>
Yes
</button>

</div>
</div>
</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API_URL="/api/messages";
const CHANNEL="general";

/*
    Game state is stored as invisible messages.

    GAME_STATE:
    <JSON>

    These messages are never displayed as normal chat.
*/


/* =========================================================
   DEVICE
========================================================= */

let deviceId=localStorage.getItem("chat_device_id");

if(!deviceId){

    deviceId=
        crypto.randomUUID();

    localStorage.setItem(
        "chat_device_id",
        deviceId
    );
}


/* =========================================================
   SETTINGS
========================================================= */

const defaults={
    username:"",
    theme:"dark",
    refreshRate:500,
    showTimestamps:true,
    compactMessages:false,
    textSize:16,
    wordSpacing:0,
    lineSpacing:1.45,
    cornerRadius:12,
    uiScale:1,
    enterToSend:true,
    autoScroll:true,
    confirmDelete:true
};

function getSetting(key){

    const value=
        localStorage.getItem("chat_"+key);

    if(value===null)
        return defaults[key];

    if(value==="true")
        return true;

    if(value==="false")
        return false;

    const n=Number(value);

    return Number.isNaN(n)
        ?value
        :n;
}

let settings={};

Object.keys(defaults).forEach(key=>{
    settings[key]=getSetting(key);
});


/* =========================================================
   ELEMENTS
========================================================= */

const messagesEl=
    document.getElementById("messages");

const messageInput=
    document.getElementById("messageInput");

const sendBtn=
    document.getElementById("sendBtn");

const imageInput=
    document.getElementById("imageInput");

const attachBtn=
    document.getElementById("attachBtn");

const settingsBtn=
    document.getElementById("settingsBtn");

const settingsOverlay=
    document.getElementById("settingsOverlay");

const closeSettings=
    document.getElementById("closeSettings");

const saveSettings=
    document.getElementById("saveSettings");

const gamesBtn=
    document.getElementById("gamesBtn");

const gamesOverlay=
    document.getElementById("gamesOverlay");

function applySettings(){

    document.documentElement.style.setProperty(
        "--text-size",
        settings.textSize+"px"
    );

    document.documentElement.style.setProperty(
        "--word-spacing",
        settings.wordSpacing+"px"
    );

    document.documentElement.style.setProperty(
        "--line-spacing",
        settings.lineSpacing
    );

    document.documentElement.style.setProperty(
        "--radius",
        settings.cornerRadius+"px"
    );

    document.documentElement.style.setProperty(
        "--ui-scale",
        settings.uiScale
    );

    applyTheme(settings.theme);

    renderMessages();

    startRefreshTimer();
}


function applyTheme(name){

    const themes={

        dark:["#0b0d10","#111419"],

        midnight:["#080b14","#101522"],

        slate:["#101418","#171d22"],

        black:["#000","#090909"],

        blue:["#091018","#101c29"],

        purple:["#100b17","#191021"],

        green:["#09120d","#101b15"],

        red:["#140b0b","#1e1111"],

        gray:["#151515","#202020"],

        light:["#eeeeee","#fff"],

        oled:["#000","#000"]
    };

    const t=
        themes[name]||themes.dark;

    document.documentElement.style.setProperty(
        "--bg",
        t[0]
    );

    document.documentElement.style.setProperty(
        "--panel",
        t[1]
    );

    document.body.style.background=
        t[0];
}

function resizeImage(file){

    return new Promise((resolve,reject)=>{

        const reader=
            new FileReader();

        reader.onload=()=>{

            const img=
                new Image();

            img.onload=()=>{

                let width=
                    img.width;

                let height=
                    img.height;

                const max=1500;

                if(
                    width>max||
                    height>max
                ){

                    const scale=
                        Math.min(
                            max/width,
                            max/height
                        );

                    width=
                        Math.round(
                            width*scale
                        );

                    height=
                        Math.round(
                            height*scale
                        );
                }

                const canvas=
                    document.createElement(
                        "canvas"
                    );

                canvas.width=
                    width;

                canvas.height=
                    height;

                canvas
                    .getContext("2d")
                    .drawImage(
                        img,
                        0,
                        0,
                        width,
                        height
                    );

                resolve(
                    canvas.toDataURL(
                        "image/jpeg",
                        .78
                    )
                );
            };

            img.onerror=reject;

            img.src=
                reader.result;
        };

        reader.onerror=reject;

        reader.readAsDataURL(file);
    });
}

async function sendMessage(){

    const text=
        messageInput.value
        .trim();

    if(!settings.username){

        settingsBtn.click();

        usernameInput.focus();

        alert(
            "Set your name in Settings first."
        );

        return;
    }

    if(!text&&!selectedFile)
        return;

    sendBtn.disabled=true;

    try{

        let image=null;

        if(selectedFile){

            image=
                await resizeImage(
                    selectedFile
                );
        }

        const response=
            await fetch(
                API_URL,
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({

                            username:
                                settings.username,

                            channel:
                                CHANNEL,

                            message:
                                text,

                            image:
                                image,

                            device_id:
                                deviceId,

                            edited:false
                        })
                }
            );

        const data=
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error||
                "Failed to send message."
            );
        }

        messageInput.value="";

        messageInput.style.height=
            "auto";

        selectedFile=null;

        imageInput.value="";

        attachBtn.textContent="＋";

        await loadMessages();

    }catch(error){

        alert(
            "Failed to send:\n\n"+
            error.message
        );

    }finally{

        sendBtn.disabled=false;
    }
}


/* =========================================================
   LOAD
========================================================= */

async function loadMessages(){

    try{

        const response=
            await fetch(
                API_URL+
                "?channel="+
                encodeURIComponent(
                    CHANNEL
                )+
                "&_="+
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        const data=
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error||
                "Failed to load messages."
            );
        }

        const all=
            Array.isArray(
                data.messages
            )
            ?data.messages
            :[];

        currentMessages=
            all.filter(
                message=>
                    !isGameMessage(message)
            );

        gameStates=
            parseGameMessages(all);

        await cleanDeadGames();

        renderMessages();

    }catch(error){

        messagesEl.innerHTML=`
            <div class="empty">
                <div>
                    <strong>
                        Unable to load messages
                    </strong>
                    ${escapeHtml(error.message)}
                </div>
            </div>
        `;
    }
}


/* =========================================================
   GAME STATE MESSAGE
========================================================= */

function isGameMessage(message){

    return typeof message.message==="string" &&
        message.message.startsWith(
            "__CHAT_GAME_STATE__:"
        );
}


function encodeGame(game){

    return "__CHAT_GAME_STATE__:"+
        JSON.stringify(game);
}


function decodeGame(message){

    try{

        return JSON.parse(
            message.message.substring(
                "__CHAT_GAME_STATE__:".length
            )
        );

    }catch{

        return null;
    }
}


function parseGameMessages(all){

    const states=[];

    for(const message of all){

        if(!isGameMessage(message))
            continue;

        const game=
            decodeGame(message);

        if(!game)
            continue;

        game._messageId=
            message.id;

        game._createdAt=
            message.created_at;

        states.push(game);
    }

    return states;
}


/* =========================================================
   GAME HELPERS
========================================================= */

const GAME_INFO={

    tictactoe:{
        name:"Tic Tac Toe",
        max:2
    },

    dice:{
        name:"Dice Battle",
        max:6
    },

    connect4:{
        name:"Connect Four",
        max:2
    },

    memory:{
        name:"Memory",
        max:6
    },

    reaction:{
        name:"Reaction",
        max:8
    }
};


function createGame(type){

    const info=
        GAME_INFO[type];

    const game={

        id:crypto.randomUUID(),

        type:type,

        gameName:
            info.name,

        hostId:
            deviceId,

        hostName:
            settings.username,

        maxPlayers:
            info.max,

        players:[
            {
                id:deviceId,
                name:settings.username
            }
        ],

        started:false,

        finished:false,

        forceQuit:false,

        currentTurn:0,

        turnNumber:0,

        created_at:
            new Date().toISOString(),

        data:
            createInitialGameData(type)
    };

    return game;
}


function createInitialGameData(type){

    if(type==="tictactoe"){

        return {
            board:[
                "","","",
                "","","",
                "","",""
            ],
            winner:null
        };
    }

    if(type==="connect4"){

        return {
            board:
                Array.from(
                    {length:42},
                    ()=>""
                ),
            winner:null
        };
    }

    if(type==="dice"){

        return {
            rolls:{},
            round:0,
            results:[]
        };
    }

    if(type==="memory"){

        const values=[
            "🍎","🍎",
            "🍌","🍌",
            "🍇","🍇",
            "🍉","🍉",
            "⭐","⭐",
            "🔥","🔥"
        ];

        values.sort(
            ()=>Math.random()-.5
        );

        return {
            cards:values,
            revealed:[],
            matched:[],
            scores:{}
        };
    }

    if(type==="reaction"){

        return {
            started:false,
            winner:null,
            round:0,
            startAt:0,
            finishedPlayers:[]
        };
    }

    return {};
}

async function createGameMessage(game){

    const response=
        await fetch(
            API_URL,
            {
                method:"POST",
                headers:{
                    "Content-Type":
                        "application/json"
                },
                body:
                    JSON.stringify({

                        username:
                            game.hostName,

                        channel:
                            CHANNEL,

                        message:
                            encodeGame(game),

                        image:null,

                        device_id:
                            game.hostId,

                        edited:false
                    })
            }
        );

    const data=
        await response.json();

    if(!response.ok){

        throw new Error(
            data.error||
            "Could not create game."
        );
    }

    return data;
}

    if(!game)
        return;

    const response=
        await fetch(
            API_URL,
            {
                method:"PATCH",
                headers:{
                    "Content-Type":
                        "application/json"
                },
                body:
                    JSON.stringify({

                        id:
                            game._messageId,

                        device_id:
                            game.hostId,

                        message:
                            encodeGame(game)
                    })
            }
        );

    const data=
        await response.json();

    if(!response.ok){

        throw new Error(
            data.error||
            "Could not update game."
        );
    }

    return data;
}

/* =========================================================
   DEAD GAME CLEANUP
========================================================= */

async function cleanDeadGames(){

    for(const game of gameStates){

        if(
            game.finished||
            game.forceQuit||
            !game.players||
            game.players.length===0
        ){

            if(game._messageId){

                await deleteServerMessage(
                    game._messageId,
                    game.hostId
                );
            }
        }
    }
}


/* =========================================================
   RENDER
========================================================= */

function renderMessages(){

    const wasBottom=
        messagesEl.scrollHeight-
        messagesEl.scrollTop-
        messagesEl.clientHeight<100;

    const items=[];

    for(const message of currentMessages){

        items.push({
            type:"message",
            created_at:
                message.created_at,
            data:message
        });
    }

    for(const game of gameStates){

        if(
            game.finished||
            game.forceQuit||
            !game.players||
            !game.players.length
        )
            continue;

        items.push({
            type:"game",
            created_at:
                game._createdAt||
                game.created_at,
            data:game
        });
    }

    items.sort(
        (a,b)=>
            new Date(a.created_at)-
            new Date(b.created_at)
    );

    if(!items.length){

        messagesEl.innerHTML=`
            <div class="empty">
                <div>
                    <strong>No messages yet</strong>
                    Be the first to send something.
                </div>
            </div>
        `;

        return;
    }

    const fragment=
        document.createDocumentFragment();

    for(const item of items){

        if(item.type==="game"){

            renderGameCard(
                item.data,
                fragment
            );

        }else{

            renderNormalMessage(
                item.data,
                fragment
            );
        }
    }

    messagesEl.replaceChildren(
        fragment
    );

    if(
        wasBottom &&
        settings.autoScroll
    ){

        messagesEl.scrollTop=
            messagesEl.scrollHeight;
    }
}


/* =========================================================
   NORMAL MESSAGE
========================================================= */

function renderNormalMessage(
    message,
    fragment
){

    const item=
        document.createElement("div");

    item.className="message";

    item.dataset.id=
        message.id;

    const avatar=
        document.createElement("div");

    avatar.className="avatar";

    avatar.textContent=
        (message.username||"?")
        .charAt(0)
        .toUpperCase();

    const content=
        document.createElement("div");

    content.className=
        "message-content";

    const top=
        document.createElement("div");

    top.className=
        "message-top";

    const name=
        document.createElement("span");

    name.className=
        "username";

    name.textContent=
        message.username||
        "User";

    top.appendChild(name);

    if(settings.showTimestamps){

        const time=
            document.createElement("span");

        time.className="time";

        time.textContent=
            formatTime(
                message.created_at
            );

        top.appendChild(time);
    }

    if(message.edited){

        const edited=
            document.createElement("span");

        edited.className="edited";

        edited.textContent=
            "(edited)";

        top.appendChild(edited);
    }

    content.appendChild(top);

    if(message.message){

        const text=
            document.createElement("div");

        text.className=
            "message-text";

        text.textContent=
            message.message;

        content.appendChild(text);
    }

    if(message.image){

        const img=
            document.createElement("img");

        img.className=
            "message-image";

        img.src=
            message.image;

        img.alt="Image";

        img.onclick=()=>{
            openImage(
                message.image
            );
        };

        content.appendChild(img);
    }

    item.appendChild(avatar);

    item.appendChild(content);

    if(
        message.device_id===
        deviceId
    ){

        item.addEventListener(
            "contextmenu",
            event=>{

                event.preventDefault();

                selectedMessage=
                    message;

                contextMenu.style.left=
                    Math.min(
                        event.clientX,
                        window.innerWidth-170
                    )+"px";

                contextMenu.style.top=
                    Math.min(
                        event.clientY,
                        window.innerHeight-100
                    )+"px";

                contextMenu.classList.add(
                    "show"
                );
            }
        );
    }

    fragment.appendChild(item);
}


/* =========================================================
   GAME CARD
========================================================= */

function renderGameCard(
    game,
    fragment
){

    const card=
        document.createElement("div");

    card.className=
        "game-card";

    card.dataset.gameId=
        game.id;

    const isPlayer=
        game.players.some(
            player=>
                player.id===deviceId
        );

    const isHost=
        game.hostId===
        deviceId;

    const status=
        game.finished||
        game.forceQuit
        ?"Finished"
        :game.started
        ?"Playing"
        :"Waiting";

    const playerText=
        `${game.players.length} / ${game.maxPlayers} players`;

    card.innerHTML=`

        <div class="game-card-header">

            <div>

                <div class="game-title">
                    🎮 ${escapeHtml(
                        game.gameName
                    )}
                </div>

                <div class="game-invite">
                    <strong>
                        ${escapeHtml(
                            game.hostName
                        )}
                    </strong>
                    invited you to a game
                    of
                    <strong>
                        ${escapeHtml(
                            game.gameName
                        )}
                    </strong>
                </div>

                <div class="game-player-count">
                    ${playerText}
                </div>

            </div>

            <div class="game-status ${
                game.started
                    ?"playing"
                    :""
            }">
                ${status}
            </div>

        </div>

        <div class="game-body">

            ${
                game.started
                ?`
                    <div class="game-turn">
                        Turn:
                        <strong>
                            ${escapeHtml(
                                getCurrentTurnName(
                                    game
                                )
                            )}
                        </strong>
                    </div>
                `
                :`
                    <div class="game-turn">
                        Waiting for the host
                        to start...
                    </div>
                `
            }

            <div class="game-players">

                ${game.players.map(
                    player=>`

                    <div class="game-player">

                        <span class="player-dot"></span>

                        ${escapeHtml(
                            player.name
                        )}

                        ${
                            player.id===
                            game.hostId
                            ?`
                            <span class="host-badge">
                                HOST
                            </span>
                            `
                            :""
                        }

                    </div>
                `
                ).join("")}

            </div>

            <div class="game-actions">

                ${
                    !isPlayer &&
                    !game.started
                    ?`
                        <button
                            class="game-btn primary"
                            data-action="join">
                            Join
                        </button>
                    `
                    :""
                }

                ${
                    isPlayer &&
                    !isHost &&
                    !game.finished
                    ?`
                        <button
                            class="game-btn"
                            data-action="leave">
                            Leave
                        </button>
                    `
                    :""
                }

                ${
                    isHost &&
                    !game.started
                    ?`
                        <button
                            class="game-btn primary"
                            data-action="start">
                            Start Game
                        </button>
                    `
                    :""
                }

                ${
                    isHost &&
                    !game.finished
                    ?`
                        <button
                            class="game-btn danger"
                            data-action="force">
                            Force Quit
                        </button>
                    `
                    :""
                }

            </div>

            ${
                game.started
                ?renderGameArea(game)
                :""
            }

        </div>
    `;

    card
    .querySelectorAll("[data-action]")
    .forEach(button=>{

        button.onclick=event=>{

            event.stopPropagation();

            const action=
                button.dataset.action;

            if(action==="join")
                joinGame(game.id);

            if(action==="leave")
                leaveGame(game.id);

            if(action==="start")
                startGame(game.id);

            if(action==="force")
                forceQuitGame(game.id);
        };
    });

    fragment.appendChild(card);
}


/* =========================================================

========================================================= */

function getCurrentTurnName(game){

    if(
        !game.players||
        !game.players.length
    )
        return "Nobody";

    const player=
        game.players[
            game.currentTurn %
            game.players.length
        ];

    return player
        ?player.name

/* =========================================================
   JOIN
========================================================= */

async function joinGame(gameId){

    const game=
        gameStates.find(
            g=>g.id===gameId
        );

    if(!game)return;

    if(game.started){

        alert(
            "This game has already started."
        );

        return;
    }

    if(
        game.players.some(
            player=>
                player.id===deviceId
        )
    )
        return;

    if(
        game.players.length>=
        game.maxPlayers
    ){

        alert(
            "This game is full."
        );

        return;
    }

    game.players.push({
        id:deviceId,
        name:settings.username
    });

    try{

        await updateGame(game);

        await loadMessages();

    }catch(error){

        alert(
            "Could not join game:\n\n"+
            error.message
        );
    }
}


/* =========================================================
   LEAVE
========================================================= */

async function leaveGame(gameId){

    const game=
        gameStates.find(
            g=>g.id===gameId
        );

    if(!game)return;

    game.players=
        game.players.filter(
            player=>
                player.id!==deviceId
        );

    if(!game.players.length){

        game.finished=true;

        await deleteServerMessage(
            game._messageId,
            game.hostId
        );

        await loadMessages();

        return;
    }

    /*
        If the host leaves, the game is
        stopped rather than secretly
        transferring host ownership.
    */

    if(game.hostId===deviceId){

        game.forceQuit=true;

        await deleteServerMessage(
            game._messageId,
            game.hostId
        );

        await loadMessages();

        return;
    }

    try{

        await updateGame(game);

        await loadMessages();

    }catch(error){

        alert(
            "Could not leave game:\n\n"+
            error.message
        );
    }
}


/* =========================================================
   START
========================================================= */

async function startGame(gameId){

    const game=
        gameStates.find(
            g=>g.id===gameId
        );

    if(!game)return;

    if(game.hostId!==deviceId){

        alert(
            "Only the host can start the game."
        );

        return;
    }

    if(game.started)
        return;

    if(game.players.length<1){

        alert(
            "Nobody has joined."
        );

        return;
    }

    game.started=true;

    game.finished=false;

    game.currentTurn=0;

    game.turnNumber=0;

    if(game.type==="reaction"){

        game.data.started=true;

        game.data.startAt=
            Date.now()+2000;
    }

    try{

        await updateGame(game);

        await loadMessages();

    }catch(error){

        alert(
            "Could not start game:\n\n"+
            error.message
        );
    }
}

/* =========================================================
   TURN
========================================================= */

function advanceTurn(game){

    if(!game.players.length)
        return;

    game.currentTurn=
        (
            game.currentTurn+1
        )%
        game.players.length;

    game.turnNumber++;
}


/* =========================================================
   TIC TAC TOE PLAY
========================================================= */

async function playTicTacToe(
    game,
    index
){

    if(game.finished)
        return;

    const current=
        game.players[
            game.currentTurn
        ];

    if(
        !current||
        current.id!==deviceId
    )
        return;

    if(game.data.board[index])
        return;

    const symbol=
        game.currentTurn===0
        ?"X"
        :"O";

    game.data.board[index]=
        symbol;

    const winner=
        checkTicTacToe(
            game.data.board
        );

    if(winner){

        game.data.winner=
            current.name;

        game.finished=true;

    }else{

        advanceTurn(game);
    }

    await updateGame(game);

    if(game.finished){

        setTimeout(
            ()=>removeFinishedGame(game),
            2500
        );
    }

    await loadMessages();
}


function checkTicTacToe(board){

    const wins=[

        [0,1,2],
        [3,4,5],
        [6,7,8],

        [0,3,6],
        [1,4,7],
        [2,5,8],

        [0,4,8],
        [2,4,6]
    ];

    for(const line of wins){

        const a=board[line[0]];

        if(
            a &&
            a===board[line[1]] &&
            a===board[line[2]]
        )
            return a;
    }

    if(
        board.every(Boolean)
    )
        return "Draw";

    return null;
}


/* =========================================================
   DICE PLAY
========================================================= */

async function playDice(game){

    const current=
        game.players[
            game.currentTurn
        ];

    if(
        !current||
        current.id!==deviceId
    )
        return;

    if(
        game.data.rolls[deviceId]
    )
        return;

    const roll=
        Math.floor(
            Math.random()*6
        )+1;

    game.data.rolls[deviceId]=
        roll;

    const allRolled=
        game.players.every(
            player=>
                game.data.rolls[
                    player.id
                ]
        );

    if(allRolled){

        game.data.results=
            game.players.map(
                player=>({

                    name:player.name,

                    roll:
                        game.data.rolls[
                            player.id
                        ]
                })
            );

        const winner=
            [...game.data.results]
            .sort(
                (a,b)=>
                    b.roll-a.roll
            )[0];

        game.data.winner=
            winner.name;

        game.finished=true;

    }else{

        advanceTurn(game);
    }

    await updateGame(game);

    if(game.finished){

        setTimeout(
            ()=>removeFinishedGame(game),
            2500
        );
    }

    await loadMessages();
}


/* =========================================================
   CONNECT FOUR
========================================================= */

async function playConnect4(
    game,
    index
){

    const current=
        game.players[
            game.currentTurn
        ];

    if(
        !current||
        current.id!==deviceId
    )
        return;

    const column=
        index%7;

    let target=-1;

    for(let row=5;row>=0;row--){

        const i=
            row*7+column;

        if(
            !game.data.board[i]
        ){

            target=i;

            break;
        }
    }

    if(target<0)
        return;

    const token=
        game.currentTurn===0
        ?"R"
        :"Y";

    game.data.board[target]=
        token;

    if(
        checkConnectFour(
            game.data.board,
            target,
            token
        )
    ){

        game.data.winner=
            current.name;

        game.finished=true;

    }else{

        advanceTurn(game);
    }

    await updateGame(game);

    if(game.finished){

        setTimeout(
            ()=>removeFinishedGame(game),
            2500
        );
    }

    await loadMessages();
}


function checkConnectFour(
    board,
    index,
    token
){

    const row=
        Math.floor(index/7);

    const col=
        index%7;

    const dirs=[
        [1,0],
        [0,1],
        [1,1],
        [1,-1]
    ];

    for(const [
        dr,
        dc
    ] of dirs){

        let count=1;

        for(
            let direction of [-1,1]
        ){

            let r=row;
            let c=col;

            while(true){

                r+=
                    dr*
                    direction;

                c+=
                    dc*
                    direction;

                if(
                    r<0||
                    r>=6||
                    c<0||
                    c>=7
                )
                    break;

                if(
                    board[
                        r*7+c
                    ]!==token
                )
                    break;

                count++;
            }
        }

        if(count>=4)
            return true;
    }

    return false;
}


/* =========================================================
   MEMORY
========================================================= */

async function playMemory(
    game,
    index
){

    const current=
        game.players[
            game.currentTurn
        ];

    if(
        !current||
        current.id!==deviceId
    )
        return;

    if(
        game.data.matched.includes(
            index
        )
    )
        return;

    if(
        game.data.revealed.includes(
            index
        )
    )
        return;

    if(
        game.data.revealed.length>=2
    )
        return;

    game.data.revealed.push(index);

    if(
        game.data.revealed.length===2
    ){

        const a=
            game.data.revealed[0];

        const b=
            game.data.revealed[1];

        if(
            game.data.cards[a]===
            game.data.cards[b]
        ){

            game.data.matched.push(
                a,
                b
            );

            game.data.scores[
                current.id
            ]=
                (
                    game.data.scores[
                        current.id
                    ]||0
                )+1;

            game.data.revealed=[];

        }else{

            await updateGame(game);

            await loadMessages();

            setTimeout(
                async()=>{

                    game.data.revealed=[];

                    advanceTurn(game);

                    await updateGame(game);

                    await loadMessages();

                },
                900
            );

            return;
        }
    }

    if(
        game.data.matched.length===
        game.data.cards.length
    ){

        let winner=
            game.players[0];

        for(const player of game.players){

            if(
                (
                    game.data.scores[
                        player.id
                    ]||0
                )>
                (
                    game.data.scores[
                        winner.id
                    ]||0
                )
            ){

                winner=player;
            }
        }

        game.data.winner=
            winner.name;

        game.finished=true;

    }else{

        advanceTurn(game);
    }

    await updateGame(game);

    if(game.finished){

        setTimeout(
            ()=>removeFinishedGame(game),
            2500
        );
    }

    await loadMessages();
}


/* =========================================================
   REACTION
========================================================= */

async function playReaction(game){

    if(!game.started)
        return;

    if(
        game.data.finishedPlayers
            .includes(deviceId)
    )
        return;

    game.data.finishedPlayers.push(
        deviceId
    );

    if(!game.data.winner){

        const player=
            game.players.find(
                p=>p.id===deviceId
            );

        if(player){

            game.data.winner=
                player.name;

            game.finished=true;
        }
    }

    await updateGame(game);

    if(game.finished){

        setTimeout(
            ()=>removeFinishedGame(game),
            2500
        );
    }

    await loadMessages();
}

/* =========================================================
   REFRESH
========================================================= */

function startRefreshTimer(){

    if(refreshTimer)
        clearInterval(
            refreshTimer
        );

    /*
        Games always check quickly.

        Normal chat still uses the
        user's selected refresh rate.

        This keeps games responsive
        without changing the setting
        shown to the user.
    */

    refreshTimer=
        setInterval(
            loadMessages,
            Math.min(
                Number(
                    settings.refreshRate
                ),
                500
            )
        );
}


/* =========================================================
   HELPERS
========================================================= */

function formatTime(date){

    if(!date)
        return "";

    return new Date(date)
        .toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );
}


function escapeHtml(value){

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}


/* =========================================================
   START
========================================================= */

loadSettingsUI();

applySettings();

loadMessages();

</script>
