    const myTurn = mine && current && current.deviceId === deviceId;

    // Initialize board
    if (!game.data.board) {
        const b = Array(size * size).fill("");
        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                if ((r + c) % 2 === 1) {
                    if (r < size/2 - 1) b[r*size + c] = "black";
                    else if (r > size/2) b[r*size + c] = "red";
                }
            }
        }
        game.data.board = b;
        game.data.currentPlayer = "black";
        game.data.selected = null;
        game.data.validMoves = [];
    }

    const boardData = game.data.board;
    const currentPlayer = game.data.currentPlayer || "black";
    const selected = game.data.selected;
    const validMoves = game.data.validMoves || [];

    const playerColor = game.players.findIndex(p => p.deviceId === deviceId) % 2 === 0 ? "black" : "red";

    for (let i = 0; i < boardData.length; i++) {
        const row = Math.floor(i / size);
        const col = i % size;
        const cell = document.createElement("div");
        cell.className = "checkers-cell " + ((row + col) % 2 === 0 ? "light" : "dark");
        
        const piece = boardData[i];
        if (piece) {
            const p = document.createElement("div");
            p.className = "checkers-piece " + piece;
            if (piece.includes("king")) p.classList.add("king");
            if (selected === i) p.classList.add("selected");
            
            // Check if it's this player's piece and it's their turn
            const isMyPiece = piece.includes(playerColor);
            if (isMyPiece && myTurn && !game.winner) {
                p.style.cursor = "pointer";
                p.onclick = async () => {
                    const copy = JSON.parse(JSON.stringify(game));
                    // Clear previous selection
                    const moves = getCheckersMoves(copy.data.board, size, i, currentPlayer);
                    copy.data.selected = i;
                    copy.data.validMoves = moves;
                    await publishGameAndCleanup(game, copy);
                };
            }
            cell.appendChild(p);
        }
        
        // Valid move highlighting
        if (validMoves.includes(i)) {
            cell.classList.add("valid-move");
            if (myTurn && !game.winner) {
                cell.onclick = async () => {
                    const copy = JSON.parse(JSON.stringify(game));
                    const from = copy.data.selected;
                    const to = i;
                    const pieceType = copy.data.board[from];
                    copy.data.board[to] = pieceType;
                    copy.data.board[from] = "";
                    
                    // Check for jump
                    const dr = Math.floor(to / size) - Math.floor(from / size);
                    const dc = (to % size) - (from % size);
                    if (Math.abs(dr) === 2) {
                        const jumped = (from + to) / 2;
                        copy.data.board[jumped] = "";
                    }
                    
                    // King me
                    const toRow = Math.floor(to / size);
                    if ((pieceType === "black" && toRow === size - 1) || 
                        (pieceType === "red" && toRow === 0)) {
                        copy.data.board[to] = pieceType + "-king";
                    }
                    
                    copy.data.selected = null;
                    copy.data.validMoves = [];
                    
                    // Check win
                    const pieces = { black: 0, red: 0 };
                    for (const p of copy.data.board) {
                        if (p.includes("black")) pieces.black++;
                        else if (p.includes("red")) pieces.red++;
                    }
                    if (pieces.black === 0) {
                        copy.winner = "Red wins!";
                        copy.status = "finished";
                    } else if (pieces.red === 0) {
                        copy.winner = "Black wins!";
                        copy.status = "finished";
                    } else {
                        copy.turnIndex++;
                        copy.data.currentPlayer = currentPlayer === "black" ? "red" : "black";
                    }
                    await publishGameAndCleanup(game, copy);
                };
            }
        }
        
        board.appendChild(cell);
    }
    area.appendChild(board);

    // Turn indicator
    const turn = document.createElement("div");
    turn.className = "turn-banner";
    turn.style.textAlign = "center";
    turn.textContent = "⚫ " + (currentPlayer === "black" ? "Black" : "Red") + "'s turn";
    area.appendChild(turn);

    return area;
}

function getCheckersMoves(board, size, pos, player){
    const row = Math.floor(pos / size);
    const col = pos % size;
    const piece = board[pos];
    const moves = [];
    const dirs = player === "black" ? [[1,-1],[1,1]] : [[-1,-1],[-1,1]];
    const isKing = piece.includes("king");
    if (isKing) dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
    
    for (const [dr, dc] of dirs) {
        let r = row + dr, c = col + dc;
        if (r < 0 || r >= size || c < 0 || c >= size) continue;
        let idx = r * size + c;
        if (!board[idx]) {
            moves.push(idx);
        } else if (!board[idx].includes(player)) {
            // Jump
            r += dr; c += dc;
            if (r >= 0 && r < size && c >= 0 && c < size) {
                idx = r * size + c;
                if (!board[idx]) moves.push(idx);
            }
        }
    }
    return moves;
}


/* =====================================================
   GOMOKU (Five in a Row)
===================================================== */

function createGomoku(game){
    const area = document.createElement("div");
    const size = game.data.boardSize || 15;
    const board = document.createElement("div");
    board.className = "othello-board";
    board.style.gridTemplateColumns = `repeat(${size}, 36px)`;
    board.style.gridTemplateRows = `repeat(${size}, 36px)`;
    board.style.background = "#d4b896";
    board.style.padding = "4px";

    const mine = game.players.some(p => p.deviceId === deviceId);
    const current = game.players[game.turnIndex % game.players.length];
    const myTurn = mine && current && current.deviceId === deviceId;

    if (!game.data.board) {
        game.data.board = Array(size * size).fill("");
        game.data.currentPlayer = "black";
    }

    const boardData = game.data.board;

    for (let i = 0; i < boardData.length; i++) {
        const cell = document.createElement("div");
        cell.className = "othello-cell";
        cell.style.background = "#d4b896";
        cell.style.width = "36px";
        cell.style.height = "36px";
        
        const disc = boardData[i];
        if (disc) {
            const d = document.createElement("div");
            d.className = "othello-cell disc " + disc;
            d.style.width = "30px";
            d.style.height = "30px";
            cell.appendChild(d);
        } else if (myTurn && !game.winner) {
            cell.style.cursor = "pointer";
            cell.onclick = async () => {
                const copy = JSON.parse(JSON.stringify(game));
                const playerColor = copy.turnIndex % 2 === 0 ? "black" : "white";
                copy.data.board[i] = playerColor;
                
                if (checkGomokuWin(copy.data.board, size, i, playerColor)) {
                    copy.winner = current.username;
                    copy.status = "finished";
                } else {
                    copy.turnIndex++;
                }
                await publishGameAndCleanup(game, copy);
            };
        }
        board.appendChild(cell);
    }
    area.appendChild(board);

    // Turn indicator
    const turn = document.createElement("div");
    turn.className = "turn-banner";
    turn.style.textAlign = "center";
    turn.textContent = (game.turnIndex % 2 === 0 ? "⚫ Black" : "⚪ White") + "'s turn";
    area.appendChild(turn);

    return area;
}

function checkGomokuWin(board, size, pos, player){
    const row = Math.floor(pos / size);
    const col = pos % size;
    const dirs = [[1,0],[0,1],[1,1],[1,-1]];
    for (const [dr, dc] of dirs) {
        let count = 1;
        for (const dir of [-1,1]) {
            let r = row + dr * dir, c = col + dc * dir;
            while (r >= 0 && r < size && c >= 0 && c < size && board[r * size + c] === player) {
                count++;
                r += dr * dir;
                c += dc * dir;
            }
        }
        if (count >= 5) return true;
    }
    return false;
}


/* =====================================================
   SOS
===================================================== */

function createSOS(game){
    const area = document.createElement("div");
    const size = game.data.gridSize || 5;
    const board = document.createElement("div");
    board.className = "othello-board";
    board.style.gridTemplateColumns = `repeat(${size}, 50px)`;
    board.style.gridTemplateRows = `repeat(${size}, 50px)`;
    board.style.background = "#1a2a3a";
    board.style.padding = "4px";

    const mine = game.players.some(p => p.deviceId === deviceId);
    const current = game.players[game.turnIndex % game.players.length];
    const myTurn = mine && current && current.deviceId === deviceId;

    if (!game.data.board) {
        game.data.board = Array(size * size).fill("");
        game.data.scores = {};
        game.data.currentPlayer = 0;
    }

    const boardData = game.data.board;

    for (let i = 0; i < boardData.length; i++) {
        const cell = document.createElement("div");
        cell.className = "othello-cell";
        cell.style.background = "#1a2a3a";
        cell.style.width = "50px";
        cell.style.height = "50px";
        cell.style.border = "1px solid #2a3a4a";
        cell.style.borderRadius = "0";
        cell.style.fontSize = "24px";
        cell.style.fontWeight = "bold";
        cell.style.color = "white";
        
        if (boardData[i]) {
            cell.textContent = boardData[i];
        } else if (myTurn && !game.winner) {
            cell.style.cursor = "pointer";
            cell.onclick = async () => {
                const copy = JSON.parse(JSON.stringify(game));
                // Let player choose S or O
                const choice = confirm("Place S or O?") ? "S" : "O";
                copy.data.board[i] = choice;
                
                // Check for SOS
                const sosCount = countSOS(copy.data.board, size, i);
                if (sosCount > 0) {
                    copy.data.scores = copy.data.scores || {};
                    copy.data.scores[current.deviceId] = (copy.data.scores[current.deviceId] || 0) + sosCount;
                    // Player goes again
                } else {
                    copy.turnIndex++;
                }
                
                // Check if board full
                if (copy.data.board.every(c => c)) {
                    let winner = null, max = -1;
                    for (const [id, score] of Object.entries(copy.data.scores || {})) {
                        if (score > max) { max = score; winner = copy.players.find(p => p.deviceId === id)?.username; }
                    }
                    copy.winner = winner || "draw";
                    copy.status = "finished";
                }
                await publishGameAndCleanup(game, copy);
            };
        }
        board.appendChild(cell);
    }
    area.appendChild(board);

    // Scores
    const scoreDiv = document.createElement("div");
    scoreDiv.style.cssText = "text-align:center;margin-top:10px;color:#9da5b0;";
    const scores = game.data.scores || {};
    scoreDiv.textContent = game.players.map(p => 
        escapeHtml(p.username) + ": " + (scores[p.deviceId] || 0)
    ).join(" · ");
    area.appendChild(scoreDiv);

    return area;
}

function countSOS(board, size, pos){
    const row = Math.floor(pos / size);
    const col = pos % size;
    const letter = board[pos];
    let count = 0;
    const dirs = [[1,0],[0,1],[1,1],[1,-1]];
    
    for (const [dr, dc] of dirs) {
        // Check S-O-S in both directions
        for (const start of [-2, -1, 0, 1]) {
            const r1 = row + dr * start;
            const c1 = col + dc * start;
            const r2 = row + dr * (start + 1);
            const c2 = col + dc * (start + 1);
            const r3 = row + dr * (start + 2);
            const c3 = col + dc * (start + 2);
            
            if (r1 >= 0 && r1 < size && c1 >= 0 && c1 < size &&
                r2 >= 0 && r2 < size && c2 >= 0 && c2 < size &&
                r3 >= 0 && r3 < size && c3 >= 0 && c3 < size) {
                const letters = [board[r1*size + c1], board[r2*size + c2], board[r3*size + c3]];
                if (letters.every(l => l)) {
                    if (letters[0] === "S" && letters[1] === "O" && letters[2] === "S") {
                        count++;
                    }
                }
            }
        }
    }
    return count;
}


/* =====================================================
   GAME HELPERS
===================================================== */

async function joinGame(game){
    if (game.status !== "lobby") return;
    if (game.players.some(p => p.deviceId === deviceId)) return;
    if (game.players.length >= game.maxPlayers) return;
    
    const copy = JSON.parse(JSON.stringify(game));
    copy.players.push({ deviceId, username: settings.username });
    await writeGameState(copy);
    await loadMessages();
}

async function leaveGame(game){
    const copy = JSON.parse(JSON.stringify(game));
    copy.players = copy.players.filter(p => p.deviceId !== deviceId);
    
    if (copy.players.length === 0) {
        await removeGameMessages(game);
        await loadMessages();
        return;
    }
    
    if (game.hostDeviceId === deviceId) {
        const newHost = copy.players[0];
        copy.host = newHost.username;
        copy.hostDeviceId = newHost.deviceId;
    }
    
    if (copy.status === "playing" && copy.turnIndex >= copy.players.length) {
        copy.turnIndex = 0;
    }
    
    await writeGameState(copy);
    await deleteStateMessage(game);
    await loadMessages();
}

async function startGame(game){
    if (game.hostDeviceId !== deviceId) return;
    if (game.players.length < GAME_TYPES[game.gameType].min) return;
    
    const copy = JSON.parse(JSON.stringify(game));
    copy.status = "playing";
    copy.turnIndex = 0;
    
    // Initialize game-specific data
    if (copy.gameType === "mastermind") {
        copy.data.codeSetter = copy.players[0].deviceId;
        copy.data.code = null;
        copy.data.guesses = [];
    }
    if (copy.gameType === "hangman") {
        copy.data.wordSetter = copy.players[0].deviceId;
        copy.data.word = null;
        copy.data.guessed = [];
        copy.data.wrong = 0;
        copy.data.maxWrong = 6;
    }
    if (copy.gameType === "memory") {
        const emojis = ["🍎","🍊","🍋","🍇","🍉","🍓","🍑","🍒","🥝","🍍","🥭","🍌","🍈","🫐","🍐","🥥"];
        const gridSize = copy.data.gridSize || 4;
        const pairs = (gridSize * gridSize) / 2;
        let cards = [...emojis.slice(0, pairs), ...emojis.slice(0, pairs)];
        for (let i = cards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [cards[i], cards[j]] = [cards[j], cards[i]];
        }
        copy.data.cards = cards;
        copy.data.flipped = [];
        copy.data.matched = [];
        copy.data.scores = {};
    }
    if (copy.gameType === "dots") {
        copy.data.lines = {};
        copy.data.boxes = {};
        copy.data.gridSize = copy.data.gridSize || 4;
    }
    if (copy.gameType === "othello") {
        copy.data.board = null; // Will be initialized on render
        copy.data.boardSize = copy.data.boardSize || 8;
    }
    if (copy.gameType === "checkers") {
        copy.data.board = null;
        copy.data.boardSize = copy.data.boardSize || 8;
        copy.data.currentPlayer = "black";
        copy.data.selected = null;
        copy.data.validMoves = [];
    }
    if (copy.gameType === "gomoku") {
        copy.data.board = null;
        copy.data.boardSize = copy.data.boardSize || 15;
    }
    if (copy.gameType === "sos") {
        copy.data.board = null;
        copy.data.gridSize = copy.data.gridSize || 5;
        copy.data.scores = {};
    }
    if (copy.gameType === "connect4") {
        copy.data.playerColors = {};
        copy.players.forEach((p, idx) => {
            copy.data.playerColors[p.deviceId] = idx % 2 === 0 ? "R" : "Y";
        });
    }
    
    await publishGameAndCleanup(game, copy);
}

async function forceQuitGame(game){
    if (game.hostDeviceId !== deviceId) return;
    try {
        await removeGameMessages(game);
        await loadMessages();
    } catch(error) {
        alert("Could not remove game:\n\n" + error.message);
    }
}

async function publishGameAndCleanup(oldGame, newGame){
    if (newGame.status === "finished") {
        await removeGameMessages(oldGame);
        await loadMessages();
        return;
    }
    
    await writeGameState(newGame);
    
    if (oldGame.messageId) {
        try {
            await apiDelete({ id: oldGame.messageId, device_id: oldGame.hostDeviceId });
        } catch {}
    }
    
    await loadMessages();
}

async function removeGameMessages(game){
    const gameMessages = currentMessages.filter(message => {
        if (!isGameMessage(message)) return false;
        const state = parseGameMessage(message);
        return state && state.id === game.id;
    });
    
    for (const message of gameMessages) {
        try {
            await apiDelete({ id: message.id, device_id: game.hostDeviceId });
        } catch {}
    }
}

async function deleteStateMessage(game){
    if (!game.messageId) return;
    try {
        await apiDelete({ id: game.messageId, device_id: game.hostDeviceId });
    } catch {}
}

   REFRESH
===================================================== */

function restartRefresh(){
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(loadMessages, 500);
}


/* =====================================================
   CONFIRM
===================================================== */

function openConfirm(title, text, callback){
    confirmTitle.textContent = title;
    confirmText.textContent = text;
    confirmCallback = callback;
    confirmOverlay.classList.add("show");
}

confirmCancel.onclick = () => {
    confirmOverlay.classList.remove("show");
    confirmCallback = null;
};

confirmYes.onclick = async () => {
    const callback = confirmCallback;
    confirmOverlay.classList.remove("show");
    confirmCallback = null;
    if (callback) {
        try { await callback(); } 
        catch(error) { alert(error.message); }
    }
};


/* =====================================================
   REMOVE EVERYTHING
===================================================== */

removeEverything.onclick = () => {
    openConfirm("Remove everything?", "This permanently removes every message from the chat.", async () => {
        try {
            await apiDelete({ delete_all: true });
            currentMessages = [];
            games = [];
            renderedElements.clear();
            seenMessageIds.clear();
            seenGameIds.clear();
            renderMessages();
        } catch(error) {
            alert("Failed to wipe chat:\n\n" + error.message);
        }
    });
};


/* =====================================================
   HELPERS
===================================================== */

function formatTime(date){
    if (!date) return "";
    return new Date(date).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function escapeHtml(value){
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

applySettings();
