<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Game Chat</title>

<style>
*{
    box-sizing:border-box;
}

:root{
    --bg:#0b0d10;
    --panel:#111419;
    --panel2:#181c22;
    --panel3:#20252d;
    --border:#292f38;
    --text:#edf0f4;
    --muted:#7e8793;
    --accent:#e8eaed;
    --danger:#ff7070;
    --green:#70e0a0;
    --yellow:#e5c66b;
    --radius:12px;
    --text-size:16px;
    --word-spacing:0px;
    --line-spacing:1.45;
    --ui-scale:1;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

body{
    overflow:hidden;
    font-size:calc(16px * var(--ui-scale));
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:64px;
    min-height:64px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel);
    border-bottom:1px solid var(--border);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
}

.logo-icon{
    width:35px;
    height:35px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:var(--panel2);
    border:1px solid var(--border);
}

.channel{
    color:var(--muted);
    font-weight:400;
}

.header-actions{
    display:flex;
    gap:7px;
}

.icon-btn{
    width:39px;
    height:39px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
}

.icon-btn:hover{
    filter:brightness(1.15);
}

/* ONLINE STATUS */

.connection{
    display:flex;
    align-items:center;
    gap:7px;
    color:var(--muted);
    font-size:12px;
    margin-right:8px;
}

.connection-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#777;
}

.connection.online .connection-dot{
    background:#65e49b;
    box-shadow:0 0 8px #65e49b;
}

.connection.offline .connection-dot{
    background:#ff6565;
}

/* MESSAGES */

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    display:flex;
    gap:11px;
    margin-bottom:17px;
}

.avatar{
    flex:0 0 40px;
    width:40px;
    height:40px;
    display:grid;
    place-items:center;
    border-radius:var(--radius);
    background:var(--panel2);
    border:1px solid var(--border);
    font-weight:700;
}

.message-content{
    min-width:0;
    max-width:min(850px,calc(100vw - 90px));
}

.message-top{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:3px;
}

.username{
    font-weight:700;
}

.time,
.edited{
    color:var(--muted);
    font-size:11px;
}

.message-text{
    color:#d8dde4;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    font-size:var(--text-size);
    word-spacing:var(--word-spacing);
    line-height:var(--line-spacing);
}

.message-image{
    display:block;
    max-width:min(600px,100%);
    max-height:500px;
    margin-top:8px;
    border-radius:10px;
    border:1px solid var(--border);
}

/* GAME CARDS */

.game-message{
    margin:0 auto 18px;
    max-width:900px;
}

.game-card{
    border:1px solid var(--border);
    border-radius:16px;
    background:linear-gradient(
        145deg,
        var(--panel2),
        #101318
    );
    overflow:hidden;
    box-shadow:0 12px 40px #0005;
}

.game-header{
    padding:17px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
}

.game-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:18px;
    font-weight:800;
}

.game-status{
    font-size:12px;
    padding:6px 9px;
    border-radius:999px;
    background:#252b33;
    color:#bfc6cf;
}

.game-body{
    padding:18px;
}

.game-info{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:15px;
}

.game-pill{
    padding:7px 10px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#13171d;
    color:#bfc6cf;
    font-size:12px;
}

.game-pill strong{
    color:white;
}

.game-description{
    color:#969faa;
    margin-bottom:16px;
    line-height:1.45;
}

.game-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.game-btn{
    border:1px solid var(--border);
    border-radius:9px;
    padding:10px 14px;
    background:#222830;
    color:white;
    font-weight:700;
}

.game-btn:hover{
    filter:brightness(1.15);
}

.game-btn.primary{
    background:#e8eaed;
    color:#111;
}

.game-btn.green{
    background:#193b2b;
    border-color:#2c6348;
    color:#9bf0bc;
}

.game-btn.danger{
    background:#3a1c20;
    border-color:#71333b;
    color:#ff9292;
}

.game-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.game-btn.boss{
    background:#4a1a2a;
    border-color:#8a3a5a;
    color:#ff8aaa;
    font-size:18px;
    padding:15px 25px;
}

/* PLAYERS */

.players-list{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin:13px 0;
}

.player-chip{
    padding:7px 10px;
    border-radius:8px;
    background:#13171d;
    border:1px solid var(--border);
    font-size:12px;
}

.player-chip.host{
    border-color:#65552a;
    color:#ead17a;
}

.turn-banner{
    margin:12px 0;
    padding:11px 13px;
    border-radius:10px;
    background:#151a20;
    border:1px solid var(--border);
    color:#c8ced6;
}

.turn-banner strong{
    color:white;
}

/* TIC TAC TOE */

.ttt{
    display:grid;
    gap:5px;
    justify-content:center;
    margin:15px auto;
}

.ttt button{
    border-radius:8px;
    border:1px solid var(--border);
    background:#11151b;
    color:white;
    font-weight:900;
    transition:.15s;
}

.ttt button:hover:not(:disabled){
    background:#222831;
}

.ttt button.mine{
    color:#8ee7ff;
}

.ttt button.enemy{
    color:#ff8a8a;
}

/* REACTION */

.reaction-area{
    text-align:center;
    padding:20px;
}

.reaction-box{
    width:200px;
    height:200px;
    margin:15px auto;
    border-radius:20px;
    border:3px solid var(--border);
    display:grid;
    place-items:center;
    font-size:24px;
    font-weight:700;
    cursor:pointer;
    background:#1a1f26;
    color:var(--muted);
}

.reaction-box.waiting{
    background:#1a1f26;
}

.reaction-box.ready{
    background:#1a3a2a;
    border-color:#2a6a4a;
    color:#7affb0;
}

.reaction-box.go{
    background:#3a1a1a;
    border-color:#6a2a2a;
    color:#ff7a7a;
}

.reaction-box.done{
    background:#2a2a4a;
    border-color:#4a4a7a;
    color:#aaaaff;
}

/* TYPE */

.type-area{
    text-align:center;
    padding:15px;
}

.type-sentence{
    font-size:24px;
    font-weight:700;
    color:white;
    padding:20px;
    background:#1a1f26;
    border-radius:12px;
    border:1px solid var(--border);
    margin:10px auto;
    max-width:600px;
    word-break:break-word;
}

.type-input{
    width:100%;
    max-width:500px;
    padding:12px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#101419;
    color:white;
    font-size:18px;
    text-align:center;
}

.type-stats{
    display:flex;
    justify-content:center;
    gap:20px;
    margin:10px 0;
    color:#9da5b0;
}

.type-stats strong{
    color:white;
}

/* BOSS */

.boss-area{
    text-align:center;
    padding:10px;
}

.boss-health-bar{
    width:100%;
    max-width:500px;
    height:30px;
    margin:10px auto;
    background:#1a1a1a;
    border-radius:15px;
    border:2px solid #333;
    overflow:hidden;
    position:relative;
}

.boss-health-fill{
    height:100%;
    background:linear-gradient(90deg,#ff3333,#ff6a33);
    border-radius:15px;
    transition:width .3s ease;
}

.boss-health-text{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    font-weight:700;
    color:white;
}

.boss-stats{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin:10px 0;
    color:#9da5b0;
}

.boss-stats strong{
    color:white;
}

.boss-damage-display{
    font-size:32px;
    font-weight:900;
    color:#ff6a33;
}

.boss-monster-name{
    font-size:28px;
    font-weight:900;
    color:#ff4466;
}

/* COMPOSER */

.composer{
    padding:12px 16px 16px;
    background:var(--panel);
    border-top:1px solid var(--border);
}

.composer-box{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:8px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:14px;
}

textarea{
    flex:1;
    min-height:42px;
    max-height:150px;
    resize:none;
    border:0;
    outline:none;
    background:transparent;
    color:white;
    padding:10px;
}

.send-btn{
    height:42px;
    border:0;
    border-radius:9px;
    padding:0 18px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

/* OVERLAYS */

.overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000b;
    z-index:100;
}

.overlay.show{
    display:flex;
}

.panel{
    width:min(620px,calc(100vw - 25px));
    max-height:calc(100vh - 25px);
    overflow-y:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
    box-shadow:0 25px 80px #000b;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px;
    border-bottom:1px solid var(--border);
}

.panel-header h2{
    margin:0;
}

.panel-body{
    padding:18px;
}

/* CATEGORIES */

.category{
    margin-bottom:12px;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    background:var(--panel2);
}

.category-title{
    width:100%;
    padding:14px;
    border:0;
    background:transparent;
    color:var(--text);
    display:flex;
    justify-content:space-between;
    font-weight:700;
    text-align:left;
}

.category-body{
    display:none;
    padding:0 14px 14px;
}

.category.open .category-body{
    display:block;
}

.setting{
    margin-top:14px;
}

.setting label{
    display:block;
    margin-bottom:7px;
    color:#aab2bd;
    font-size:13px;
}

.setting input,
.setting select{
    width:100%;
    padding:10px;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
    background:#101419;
    color:white;
}

.setting input[type=range]{
    padding:0;
}

.setting-value{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.save-btn{
    width:100%;
    margin-top:8px;
    padding:12px;
    border:0;
    border-radius:9px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

/* GAME GRID */

.game-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.game-choice{
    min-height:80px;
    padding:13px;
    text-align:left;
    border-radius:12px;
    border:1px solid var(--border);
    background:#151a20;
    color:white;
}

.game-choice:hover{
    background:#20262e;
}

.game-choice strong{
    display:block;
    margin-bottom:3px;
    font-size:15px;
}

.game-choice span{
    color:#818b97;
    font-size:11px;
}

.game-players{
    display:inline-block;
    background:#1a1f26;
    padding:1px 8px;
    border-radius:10px;
    color:#aab2bd;
    font-size:10px;
    margin-top:4px;
}

/* EMPTY */

.empty{
    height:100%;
    min-height:200px;
    display:grid;
    place-items:center;
    color:#656d78;
    text-align:center;
}

.empty strong{
    display:block;
    color:#aab2bd;
    margin-bottom:5px;
}

@media(max-width:600px){

    .header{
        padding:0 11px;
    }

    .messages{
        padding:15px 11px;
    }

    .channel{
        display:none;
    }

    .connection{
        display:none;
    }

    .message-content{
        max-width:calc(100vw - 70px);
    }

    .game-grid{
        grid-template-columns:1fr;
    }

    .reaction-box{
        width:150px;
        height:150px;
        font-size:18px;
    }

    .boss-monster-name{
        font-size:22px;
    }

    .type-sentence{
        font-size:18px;
        padding:15px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="logo">
        <div class="logo-icon">🎮</div>
        <span>Game Chat</span>
        <span class="channel"># general</span>
    </div>

    <div style="display:flex;align-items:center">

        <div
            class="connection"
            id="connection"
        >
            <span class="connection-dot"></span>
            <span id="connectionText">Connecting</span>
        </div>

        <div class="header-actions">

            <button
                class="icon-btn"
                id="gamesBtn"
                title="Games"
            >🎮</button>

            <button
                class="icon-btn"
                id="settingsBtn"
                title="Settings"
            >⚙</button>

        </div>

    </div>

</header>

<main
    class="messages"
    id="messages"
></main>

<div class="composer">

    <div class="composer-box">

        <textarea
            id="messageInput"
            rows="1"
            placeholder="Message #general"
        ></textarea>

        <button
            class="send-btn"
            id="sendBtn"
        >Send</button>

    </div>

</div>

</div>


<!-- GAME CREATOR -->

<div
    class="overlay"
    id="gamesOverlay"
>

<div class="panel">

<div class="panel-header">

<h2>🎮 Create Game</h2>

<button
    class="icon-btn"
    id="closeGames"
>×</button>

</div>

<div class="panel-body">

<p style="color:#929aa5;line-height:1.5">
Create a multiplayer game. Everyone connected to this channel will see it.
</p>

<div class="game-grid">

<button class="game-choice" data-game="ttt3">
<strong>⭕ Tic-Tac-Toe 3x3</strong>
<span>Classic 3x3 grid</span>
<div class="game-players">2 players</div>
</button>

<button class="game-choice" data-game="ttt4">
<strong>⭕ Tic-Tac-Toe 4x4</strong>
<span>4x4 grid</span>
<div class="game-players">2 players</div>
</button>

<button class="game-choice" data-game="ttt5">
<strong>⭕ Tic-Tac-Toe 5x5</strong>
<span>5x5 grid</span>
<div class="game-players">2 players</div>
</button>

<button class="game-choice" data-game="ttt6">
<strong>⭕ Tic-Tac-Toe 6x6</strong>
<span>6x6 grid</span>
<div class="game-players">2 players</div>
</button>

<button class="game-choice" data-game="reaction">
<strong>⚡ Reaction Time</strong>
<span>Fastest player wins</span>
<div class="game-players">2-6 players</div>
</button>

<button class="game-choice" data-game="type">
<strong>⌨️ Type Sentence</strong>
<span>Type the sentence fastest</span>
<div class="game-players">2-6 players</div>
</button>

<button class="game-choice" data-game="boss">
<strong>👹 Boss Battle</strong>
<span>Work together against the boss</span>
<div class="game-players">2-6 players</div>
</button>

</div>

</div>
</div>
</div>


<!-- SETTINGS -->

<div
    class="overlay"
    id="settingsOverlay"
>

<div class="panel">

<div class="panel-header">

<h2>Settings</h2>

<button
    class="icon-btn"
    id="closeSettings"
>×</button>

</div>

<div class="panel-body">

<div class="category open">

<button class="category-title">
<span>👤 Profile</span>
<span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Your name</label>

<input
    id="usernameInput"
    maxlength="24"
    placeholder="Enter your name"
>

</div>

<div class="setting">

<label>Device ID</label>

<input
    id="deviceIdInput"
    readonly
>

</div>

</div>
</div>


<div class="category">

<button class="category-title">
<span>📝 Text</span>
<span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Text size</label>

<input
    id="textSize"
    type="range"
    min="12"
    max="24"
    value="16"
>

<div class="setting-value" id="textSizeValue"></div>

</div>

<div class="setting">

<label>Word spacing</label>

<input
    id="wordSpacing"
    type="range"
    min="0"
    max="12"
    value="0"
>

<div class="setting-value" id="wordSpacingValue"></div>

</div>

<div class="setting">

<label>Line spacing</label>

<input
    id="lineSpacing"
    type="range"
    min="1"
    max="2"
    step=".05"
    value="1.45"
>

<div class="setting-value" id="lineSpacingValue"></div>

</div>

</div>
</div>


<div class="category">

<button class="category-title">
<span>💬 Chat</span>
<span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Refresh rate</label>

<select id="refreshRate">

<option value="10000">10 seconds</option>
<option value="5000">5 seconds</option>
<option value="3000">3 seconds</option>
<option value="2000">2 seconds</option>
<option value="1000">1 second</option>
<option value="500">0.5 seconds</option>
<option value="100">0.1 seconds</option>

</select>

</div>

<div class="setting">

<label>Show timestamps</label>

<select id="showTimestamps">
<option value="true">On</option>
<option value="false">Off</option>
</select>

</div>

</div>
</div>


<div class="category">

<button class="category-title">
<span>🎨 Appearance</span>
<span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Theme</label>

<select id="themeSelect">

<option value="dark">Dark</option>
<option value="midnight">Midnight</option>
<option value="slate">Slate</option>
<option value="black">Pure Black</option>
<option value="blue">Dark Blue</option>
<option value="purple">Dark Purple</option>
<option value="green">Dark Green</option>
<option value="red">Dark Red</option>
<option value="gray">Classic Gray</option>
<option value="light">Light</option>
<option value="oled">OLED</option>

</select>

</div>

<div class="setting">

<label>Corner roundness</label>

<input
    id="cornerRadius"
    type="range"
    min="0"
    max="25"
    value="12"
>

<div class="setting-value" id="cornerRadiusValue"></div>

</div>

<div class="setting">

<label>UI scale</label>

<input
    id="uiScale"
    type="range"
    min=".8"
    max="1.2"
    step=".05"
    value="1"
>

<div class="setting-value" id="uiScaleValue"></div>

</div>

</div>
</div>


<div class="category">

<button class="category-title">
<span>⚙️ Behavior</span>
<span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Enter to send</label>

<select id="enterToSend">
<option value="true">On</option>
<option value="false">Off</option>
</select>

</div>

<div class="setting">

<label>Auto-scroll</label>

<select id="autoScroll">
<option value="true">On</option>
<option value="false">Off</option>
</select>

</div>

</div>
</div>

<button
    class="save-btn"
    id="saveSettings"
>
Save settings
</button>

<div
    style="
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid #402529;
    "
>

<div style="color:#ff7070;font-weight:700">
⚠ Danger Zone
</div>

<p style="color:#7e8793;line-height:1.45">
Delete all chat and game messages from the server.
This affects everyone.
</p>

<button
    class="game-btn danger"
    id="removeEverything"

/* =========================================================
   API REQUEST
========================================================= */

async function apiRequest(
    method,
    body=null
){

    const options={
        method,
        headers:{
            "Content-Type":
                "application/json",
            "Accept":
                "application/json"
        }
    };

    if(body!==null){

        options.body=
            JSON.stringify(body);

    }

    const response=
        await fetch(
            API_URL+
            "?channel="+
            encodeURIComponent(CHANNEL),
            options
        );

    const text=
        await response.text();

    let data={};

    try{

        data=
            text
                ?JSON.parse(text)
                :{};

    }catch{

        data={
            error:text
        };

    }

    if(!response.ok){

        throw new Error(
            data.error ||
            data.message ||
            "API error "+response.status
        );

    }

    return data;
}


/* =========================================================
   LOAD EVERYTHING
========================================================= */

async function sync(){

    if(syncing)
        return;

    syncing=true;

    try{

        const data=
            await apiRequest("GET");

        /*
         * IMPORTANT:
         *
         * The API returns BOTH:
         *
         * normal messages
         *
         * AND
         *
         * __GAME_SERVER__ messages
         *
         * We separate them here.
         */

        const all=
            Array.isArray(data.messages)
                ?data.messages
                :[];


        currentMessages=
            all.filter(
                m=>
                    m.username!==
                    GAME_SERVER
            );


        games=
            all.filter(
                m=>
                    m.username===
                    GAME_SERVER
            );


        setConnection(true);

        renderMessages();

    }catch(error){

        console.error(
            "SYNC ERROR:",
            error
        );

        setConnection(false);

    }finally{

        syncing=false;

    }
}


/* =========================================================
   RENDER
========================================================= */

function renderMessages(){

    const wasBottom=
        messagesEl.scrollHeight-
        messagesEl.scrollTop-
        messagesEl.clientHeight<
        100;


    messagesEl.innerHTML="";


    if(
        currentMessages.length===0 &&
        games.length===0
    ){

        messagesEl.innerHTML=`

            <div class="empty">

                <div>

                    <strong>No messages yet</strong>

                    Start the conversation.

                </div>

            </div>

        `;

        return;

    }


    /*
     * MERGE NORMAL MESSAGES AND GAMES
     * BACK INTO THEIR REAL DATABASE ORDER.
     */

    const all=[
        ...currentMessages,
        ...games
    ];

    all.sort(
        (a,b)=>
            new Date(a.created_at)-
            new Date(b.created_at)
    );


    for(const item of all){

        if(item.username===GAME_SERVER){

            renderGameMessage(item);

        }else{

            renderNormalMessage(item);

        }

    }


    if(
        settings.autoScroll &&
        (wasBottom || messagesEl.children.length<=1)
    ){

        messagesEl.scrollTop=
            messagesEl.scrollHeight;

    }

}


/* =========================================================
   NORMAL MESSAGE
========================================================= */

function renderNormalMessage(msg){

/* =========================================================
   GAME DATA
========================================================= */

function readGame(row){

    try{

        const data=
            JSON.parse(row.message);

        if(!data)
            return null;

        data.__row=row;

        data.id=
            data.id ||
            row.id;

        data.hostDevice=
            data.hostDevice ||
            row.device_id;

        data.players=
            Array.isArray(data.players)
                ?data.players
                :[];

        return data;

    }catch(error){

        console.warn(
            "Invalid game state:",
            row
        );

        return null;

    }

}

========================================================= */

    ){

        addPlayingButtons(
            actions,

        );

    }


    /*

     */

    if(
        game.hostDevice===deviceId
    ){

    card.appendChild(body);

    wrapper.appendChild(card);

/* =========================================================
   BUILD GAME UI
========================================================= */

function buildGameUI(
    container,
    game,
    row
){

    if(game.status!=="playing")
        return;


    if(
        game.type.startsWith("ttt")
    ){

        buildTTT(
            container,
            game
        );

        return;

    }


    if(game.type==="reaction"){

        buildReaction(
            container,
            game
        );

        return;

    }


    if(game.type==="type"){

        buildTyping(
            container,
            game
        );

        return;

    }


    if(game.type==="boss"){

        buildBoss(
            container,
            game
        );

        return;

    }

}


/* =========================================================
   TTT
========================================================= */

function buildTTT(
    container,
    game
){

    const type=
        GAME_TYPES[game.type];

    const size=
        type.size;

    const board=
        Array.isArray(game.board)
            ?game.board
            :Array(size*size).fill("");

    const area=
        document.createElement("div");

    area.className="ttt";

    area.style.gridTemplateColumns=
        `repeat(${size},45px)`;


    board.forEach(
        (cell,index)=>{

            const button=
                document.createElement("button");

            button.style.width="45px";
            button.style.height="45px";

            button.textContent=
                cell || "";

            if(cell==="X")
                button.classList.add("mine");

            if(cell==="O")
                button.classList.add("enemy");


            const me=
                game.players.find(
                    p=>
                        p.deviceId===
                        deviceId
                );


            const mySymbol=
                me
                    ?me.symbol
                    :null;


            const myTurn=
                game.turn===mySymbol;


            button.disabled=
                Boolean(cell) ||
                !myTurn ||
                game.status!=="playing";


            button.onclick=()=>{

                tttMove(
                    game,
                    index
                );

            };


            area.appendChild(button);

        }
    );


    container.appendChild(area);


    const turn=
        document.createElement("div");

    turn.className="turn-banner";


    const me=
        game.players.find(
            p=>
                p.deviceId===
                deviceId
        );


    if(me){

        if(game.turn===me.symbol){

            turn.innerHTML=
                "<strong>Your turn!</strong>";

        }else{

            turn.innerHTML=
                "<strong>"+
                escapeHTML(
                    game.turn
                )+
                "</strong> player's turn";

        }

    }


    container.appendChild(turn);

}


/* =========================================================
   TTT MOVE
========================================================= */

async function tttMove(
    game,
    index
){

    if(game.hostDevice===deviceId){

        game.board[index]=
            getMySymbol(game);

        game.turn=
            game.turn==="X"
                ?"O"
                :"X";

        game.winner=
            checkWinner(
                game.board,
                GAME_TYPES[game.type].size
            );

        if(game.winner){

            game.status="finished";

        }

        await updateGame(game);

        return;
    }


    /*
     * Non-host players send a move request
     * through the game state.
     *
     * The host processes it on its next poll.
     */

    game.pendingMove={
        deviceId,
        index
    };

    await updateGame(game);

}


/* =========================================================
   HOST GAME PROCESSING
========================================================= */

function processHostGame(game){

    if(
        game.hostDevice!==
        deviceId
    )
        return;


    if(
        game.pendingMove &&
        game.status==="playing"
    ){

        const request=
            game.pendingMove;

        const player=
            game.players.find(
                p=>
                    p.deviceId===
                    request.deviceId
            );


        if(
            player &&
            game.turn===player.symbol &&
            !game.board[request.index]
        ){

            game.board[request.index]=
                player.symbol;

            game.turn=
                player.symbol==="X"
                    ?"O"
                    :"X";


            const winner=
                checkWinner(
                    game.board,
                    GAME_TYPES[game.type].size
                );


            if(winner){

                game.winner=
                    winner;

                game.status=
                    "finished";

            }else if(
                game.board.every(Boolean)
            ){

                game.winner="draw";

                game.status=
                    "finished";

            }

        }

        game.pendingMove=null;

        updateGame(game);

    }

}


/* =========================================================
   WINNER
========================================================= */

function checkWinner(
    board,
    size
){

    const directions=[
        [1,0],
        [0,1],
        [1,1],
        [1,-1]
    ];


    for(let y=0;y<size;y++){

        for(let x=0;x<size;x++){

            const value=
                board[y*size+x];

            if(!value)
                continue;


            for(const [dx,dy] of directions){

                let count=1;

                for(
                    let step=1;
                    step<size;
                    step++
                ){

                    const nx=
                        x+dx*step;

                    const ny=
                        y+dy*step;

                    if(
                        nx<0 ||
                        ny<0 ||
                        nx>=size ||
                        ny>=size
                    )
                        break;

                    if(
                        board[ny*size+nx]===
                        value
                    ){

                        count++;

                    }else{

                        break;

                    }

                }

                if(count>=size)
                    return value;

            }

        }

    }

    return null;

}


function getMySymbol(game){

    const p=
        game.players.find(
            x=>
                x.deviceId===
                deviceId
        );

    return p
        ?p.symbol
        :null;

        box.classList.add("done");


    box.onclick=()=>{

        if(
            game.reactionState!=="go"
        )
            return;


        game.reactionResults=
            game.reactionResults || [];


        if(
            game.reactionResults.some(
                r=>
                    r.deviceId===
                    deviceId
            )
        )
            return;


        game.reactionResults.push({

            deviceId,

            name:
                getMyName(game),

            time:
                Date.now()-
                game.goTime

        });


        updateGame(game);

    };


    area.appendChild(box);


    const results=
        document.createElement("div");

    if(
        Array.isArray(
            game.reactionResults
        )
    ){

        results.innerHTML=
            game.reactionResults
                .map(
                    r=>
                        `<div>
                        ${escapeHTML(r.name)}
                        -
                        ${r.time} ms
                        </div>`
                )
                .join("");

    }


    area.appendChild(results);

    container.appendChild(area);

}


/* =========================================================
   HOST REACTION
========================================================= */

function processReactionHost(game){

    if(
        game.hostDevice!==deviceId
    )
        return;


    if(
        game.reactionState==="waiting"
    ){

        if(!game.reactionStart){

            game.reactionStart=
                Date.now();

            game.reactionDelay=
                1500+
                Math.random()*3500;

            updateGame(game);

            return;

        }


        if(
            Date.now()-
            game.reactionStart>=
            game.reactionDelay
        ){

            game.reactionState="go";

            game.goTime=
                Date.now();

            updateGame(game);

        }

    }


    if(
        game.reactionState==="go" &&
        game.reactionResults &&
        game.reactionResults.length>=
        game.players.length
    ){

        game.reactionState=
            "finished";

        updateGame(game);

    }

}

/* =========================================================
   BOSS ATTACK
========================================================= */

async function bossAttack(game){

    if(
        game.status!=="playing"
    )
        return;


    game.pendingDamage=
        game.pendingDamage || [];


    if(
        game.pendingDamage.some(
            d=>
                d.deviceId===
                deviceId
        )
    )
        return;


    game.pendingDamage.push({

        deviceId,

        damage:
            100+
            Math.floor(
                Math.random()*900
            )

    });


    await updateGame(game);

}


/* =========================================================
   HOST BOSS
========================================================= */

function processBossHost(game){

    if(
        game.hostDevice!==deviceId
    )
        return;


    if(
        game.pendingDamage &&
        game.pendingDamage.length
    ){

        let total=0;


        for(
            const damage of
            game.pendingDamage
        ){

            total+=
                Number(
                    damage.damage
                ) || 0;

        }


        game.bossHP=
            Math.max(
                0,
                Number(game.bossHP)-
                total
            );


        game.lastDamage=
            total;


        game.pendingDamage=[];


        if(game.bossHP<=0){

            game.status=
                "finished";

        }


        updateGame(game);

    }

}

/* =========================================================
   JOIN
========================================================= */

async function joinGame(game){

    if(
        game.status!=="lobby"
    )
        return;


    if(
        game.players.some(
            p=>
                p.deviceId===
                deviceId
        )
    )
        return;


    if(
        game.players.length>=
        GAME_TYPES[game.type].max
    )
        return;


    const player={

        deviceId,

        name:
            settings.username ||
            "Player",

        symbol:
            game.type.startsWith("ttt")
                ?(
                    game.players.length===0
                        ?"X"
                        :"O"
                )
                :null

    };


    game.players.push(player);


    /*
     * Only the host should update the actual
     * game state. For a simple lobby, however,
     * we let the joining player submit a join
     * request.
     */

    if(game.hostDevice===deviceId){

        await updateGame(game);

    }else{

        game.joinRequest={
            deviceId,
            name:player.name,
            symbol:player.symbol
        };

        await updateGame(game);

    }

}


/* =========================================================
   HOST PROCESS JOIN
========================================================= */

function processHostJoin(game){

    if(
        game.hostDevice!==deviceId
    )
        return;


    if(!game.joinRequest)
        return;


    const request=
        game.joinRequest;


    if(
        !game.players.some(
            p=>
                p.deviceId===
                request.deviceId
        )
    ){

        if(
            game.players.length<
            GAME_TYPES[game.type].max
        ){

            game.players.push({

                deviceId:
                    request.deviceId,

                name:
                    request.name ||
                    "Player",

                symbol:
                    request.symbol ||
                    null

            });

        }

    }


    game.joinRequest=null;

    updateGame(game);

}


/* =========================================================
   CREATE GAME
========================================================= */

document
.querySelectorAll(".game-choice")

async function createGame(type){

    const config=
        GAME_TYPES[type];


    const player={

        deviceId,

        name:
            settings.username ||
            "Player",

        symbol:
            type.startsWith("ttt")
                ?"X"
                :null

    };


    const game={

        id:makeId(),

        type,

        status:"lobby",

        hostDevice:deviceId,

        hostName:
            player.name,

        players:[player],

        createdAt:
            Date.now()

    };


    if(type.startsWith("ttt")){

        game.board=
            Array(
                config.size*
                config.size
            ).fill("");

        game.turn="X";

    }


    if(type==="reaction"){

        game.reactionState=
            "waiting";

        game.reactionResults=[];

    }


    if(type==="type"){

        game.sentence=
            sentences[
                Math.floor(
                    Math.random()*
                    sentences.length
                )
            ];

        game.typeResults=[];

    }


    if(type==="boss"){

        game.bossName=
            "THE JØLLE";

        game.maxBossHP=
            100000000;

        game.bossHP=
            100000000;

        game.pendingDamage=[];

    }


    try{

        await createGameOnServer(
            game
        );

    }catch(error){

        console.error(error);

        alert(
            "Could not create game:\n"+
            error.message
        );

    }

}


/* =========================================================
   CREATE SERVER GAME
========================================================= */

async function createGameOnServer(game){

    const response=
        await fetch(
            API_URL+
            "?channel="+
            encodeURIComponent(CHANNEL),
            {

                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json",
                    "Accept":
                        "application/json"
                },

                body:
                    JSON.stringify({

                        username:
                            GAME_SERVER,

                        channel:
                            CHANNEL,

                        message:
                            JSON.stringify(game),

                        device_id:
                            deviceId,

                        game_server:true

                    })

            }
        );


    const text=
        await response.text();


    let data={};

    try{

        data=
            text
                ?JSON.parse(text)
                :{};

    }catch{

        data={
            error:text
        };

    }


    if(!response.ok){

        throw new Error(
            data.error ||
            "Could not create game"
        );

    }

}


/* =========================================================
   UPDATE GAME
========================================================= */

async function updateGame(game){

    const row=
        game.__row;


    if(!row || !row.id)
        return;


    try{

        const response=
            await fetch(
                API_URL,
                {

                    method:"PATCH",

                    headers:{
                        "Content-Type":
                            "application/json",
                        "Accept":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            id:
                                row.id,

                            device_id:
                                game.hostDevice,

                            game_server:true,

                            game_state:
                                JSON.stringify(
                                    stripGame(game)
                                )

                        })

                }
            );


        const text=
            await response.text();


        let data={};

        try{

            data=
                text
                    ?JSON.parse(text)
                    :{};

        }catch{

            data={
                error:text
            };

        }


        if(!response.ok){

            console.error(
                "GAME UPDATE:",
                data
            );

        }

    }catch(error){

        console.error(
            "GAME UPDATE ERROR:",
            error
        );

    }

}


/*
 * Don't send the database row itself
 * inside the game JSON.
 */

function stripGame(game){

    const copy=
        JSON.parse(
            JSON.stringify(game)
        );

    delete copy.__row;

    return copy;

}


/* =========================================================
   START GAME
========================================================= */

async function startGame(game){

    if(
        game.hostDevice!==deviceId
    )
        return;


    if(
        game.players.length<
        GAME_TYPES[game.type].min
    )
        return;


    game.status="playing";


    if(game.type==="reaction"){

        game.reactionState=
            "waiting";

        game.reactionStart=null;

        game.reactionResults=[];

    }


    if(game.type==="type"){

        game.typeStart=
            Date.now();

        game.typeResults=[];

    }


    await updateGame(game);

}


/* =========================================================
   DELETE GAME
========================================================= */

async function deleteGame(game){

    if(
        game.hostDevice!==deviceId
    )
        return;


    const row=
        game.__row;


    if(!row || !row.id)
        return;


    try{

        const response=
            await fetch(
                API_URL,
                {

                    method:"DELETE",

                    headers:{
                        "Content-Type":
                            "application/json",
                        "Accept":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            id:
                                row.id,

                            device_id:
                                deviceId,

                            game_server:true

                        })

                }
            );


        if(!response.ok){

            const text=
                await response.text();

            console.error(
                "DELETE GAME:",
                text
            );

        }

        await sync();

    }catch(error){

        console.error(error);

    }

}


/* =========================================================
   HOST PROCESSING
========================================================= */

function processGames(){

    for(const row of games){

        const game=
            readGame(row);

        if(!game)
            continue;


        /*
         * HOST IS THE ONLY DEVICE THAT
         * CHANGES THE OFFICIAL GAME STATE.
         */

        if(
            game.hostDevice===
            deviceId
        ){

            processHostJoin(game);

            processHostGame(game);

            if(game.type==="reaction"){

                processReactionHost(game);

            }

            if(game.type==="boss"){

                processBossHost(game);

            }

        }

    }

}


/* =========================================================
   POLL
========================================================= */

async function poll(){

    await sync();

    processGames();

}


/* =========================================================
   REFRESH TIMER
========================================================= */

function restartRefresh(){

    if(refreshTimer){

        clearInterval(
            refreshTimer
        );

    }


    refreshTimer=
        setInterval(
            poll,
            Math.max(
                100,
                Number(
                    settings.refreshRate
                ) || 500
            )
        );

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

    const text=
        messageInput.value
            .trim();


    if(!text)
        return;


    const username=
        settings.username
            .trim();


    if(!username){

        settingsOverlay.classList.add(
            "show"
        );

        loadSettingsUI();

        usernameInput.focus();

        alert(
            "Set your name in Settings first."
        );

        return;

    }


    sendBtn.disabled=true;


    try{

        const response=
            await fetch(
                API_URL,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",
                        "Accept":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            username,

                            channel:
                                CHANNEL,

                            message:text,

                            device_id:
                                deviceId

                        })

                }
            );


        const raw=
            await response.text();


        let data={};

        try{

            data=
                raw
                    ?JSON.parse(raw)
                    :{};

        }catch{

            data={
                error:raw
            };

        }


        if(!response.ok){

            throw new Error(
                data.error ||
                data.message ||
                "Message failed"
            );

        }


        messageInput.value="";

        messageInput.style.height=
            "42px";


        await sync();

    }catch(error){

        console.error(error);

        alert(
            "Could not send message:\n"+
            error.message
        );

    }finally{

        sendBtn.disabled=false;

    }

}
