<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat App 2</title>
<style>
:root{--bg:#07080c;--panel:#0d1017;--panel2:#121620;--panel3:#171c27;--line:#252b38;--text:#f7f8fb;--muted:#858da0;--accent:#7c6cff;--accent2:#5b4de6;--good:#55d88a}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{border:0;color:#fff;cursor:pointer}input{outline:0;color:#fff}.hidden{display:none!important}
.app{width:100%;height:100dvh;display:flex;flex-direction:column;background:linear-gradient(135deg,#090b10,#07080c 55%,#0b0d13)}
.top{height:68px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:#0b0e14e8;backdrop-filter:blur(20px)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}.logo{width:39px;height:39px;flex:none;border-radius:12px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,#8b7fff,#5546df);box-shadow:0 8px 28px #685bff35}.title{font-size:15px;font-weight:800}.status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:2px}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--good);box-shadow:0 0 10px #55d88a88}
.topActions{display:flex;gap:7px}.topActions button{padding:9px 12px;border-radius:10px;background:#151923;border:1px solid var(--line);font-size:12px;transition:.18s}.topActions button:hover{background:#1b202c;border-color:#363d4d;transform:translateY(-1px)}.topActions button:first-child{background:#6658ee;border-color:#786cff}
.room{height:49px;flex:none;display:flex;align-items:center;gap:8px;padding:7px 16px;border-bottom:1px solid var(--line);background:#0a0d12}.room input{flex:1;min-width:0;height:34px;padding:0 11px;border:1px solid var(--line);background:#10141c;border-radius:9px;font-size:12px;color:#aeb5c4}.room button{height:34px;padding:0 13px;border-radius:9px;background:#171c26;border:1px solid var(--line);font-size:12px}
.messages{flex:1;min-height:0;overflow:auto;padding:24px max(16px,calc((100vw - 980px)/2));scroll-behavior:smooth}.messages::-webkit-scrollbar{width:7px}.messages::-webkit-scrollbar-thumb{background:#252b37;border-radius:10px}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted)}.emptyIcon{width:58px;height:58px;margin:0 auto 13px;border-radius:18px;display:grid;place-items:center;font-size:25px;background:#141823;border:1px solid var(--line);color:#958bff}
.msg{display:flex;gap:11px;max-width:820px;margin:0 auto 17px;animation:msgIn .2s ease}.msg.mine{flex-direction:row-reverse}.avatar{width:38px;height:38px;flex:none;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#6658ee,#342c8e);display:grid;place-items:center;font-size:15px;font-weight:800;color:#fff;border:1px solid #ffffff12}.avatar img{width:100%;height:100%;object-fit:cover}.bubbleWrap{min-width:0;max-width:min(78%,680px)}.msg.mine .bubbleWrap{align-items:flex-end;display:flex;flex-direction:column}.name{font-size:11px;color:#9fa7b8;margin:1px 0 5px;font-weight:700}.mine .name{color:#bcb5ff}.bubble{padding:10px 13px;border:1px solid var(--line);background:linear-gradient(145deg,#131720,#10131a);border-radius:15px 15px 15px 4px;box-shadow:0 7px 25px #0002}.mine .bubble{background:linear-gradient(145deg,#6155e6,#4a40b9);border-color:#756bff;border-radius:15px 15px 4px 15px}.text{white-space:pre-wrap;word-break:break-word;line-height:1.45;font-size:14px}
.fileCard{margin-top:7px;border-radius:12px;overflow:hidden;background:#080a0f55;border:1px solid #ffffff14}.fileCard img,.fileCard video{display:block;width:100%;max-height:390px;object-fit:contain;background:#050608}.fileMeta{padding:9px 10px;display:flex;align-items:center;gap:8px}.fileIcon{font-size:21px}.fileInfo{min-width:0;flex:1}.fileName{font-weight:700;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fileSize{font-size:10px;opacity:.6;margin-top:2px}.download{padding:7px 9px;border-radius:8px;color:#fff;text-decoration:none;background:#ffffff14;font-size:11px}.progress{height:3px;background:#ffffff12}.progress i{display:block;height:100%;width:0;background:#aaa2ff;transition:width .15s}
.send{flex:none;display:flex;gap:8px;padding:12px max(14px,calc((100vw - 980px)/2));border-top:1px solid var(--line);background:#0b0e14f0;backdrop-filter:blur(20px)}.send input:not(.hidden){height:44px;flex:1;min-width:0;padding:0 14px;border:1px solid var(--line);background:#11151e;border-radius:12px;font-size:13px}.send input:focus{border-color:#6559e8;box-shadow:0 0 0 3px #6c60ff15}.attach{width:44px;height:44px;flex:none;border-radius:12px;background:#151a24;border:1px solid var(--line);font-size:22px}.sendBtn{width:76px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:700}
.panel{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,#25204b 0,#090b10 50%,#06070a 100%);z-index:10}.card{width:min(470px,100%);padding:30px;border:1px solid #303645;background:#10131bdd;backdrop-filter:blur(28px);border-radius:24px;box-shadow:0 30px 100px #000b;animation:cardIn .45s ease}.heroLogo{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;font-size:27px;font-weight:900;margin-bottom:17px;background:linear-gradient(135deg,#8b7fff,#5546df);box-shadow:0 12px 35px #685bff35}.card h1{margin:0;font-size:28px;letter-spacing:-.7px}.card p{color:#969eae;line-height:1.5;margin:8px 0 19px;font-size:13px}.row{display:flex;gap:8px;margin-top:9px}.row>*{flex:1}.card input{width:100%;height:44px;padding:0 13px;border:1px solid var(--line);background:#0c1017;border-radius:11px}.small{font-size:11px;color:#70798a;margin-top:12px;line-height:1.4}.profileSetup{display:flex;align-items:center;gap:10px;margin-bottom:10px}.pfpPreview{width:44px;height:44px;border-radius:13px;overflow:hidden;background:#191e29;border:1px solid var(--line);display:grid;place-items:center;font-weight:800}.pfpPreview img{width:100%;height:100%;object-fit:cover}.pfpPick{height:34px;padding:0 10px;border-radius:9px;background:#181d27;border:1px solid var(--line);font-size:11px}
.toast{position:fixed;left:50%;bottom:82px;transform:translate(-50%,15px);padding:9px 13px;border-radius:10px;background:#171b25;border:1px solid #333a49;opacity:0;pointer-events:none;transition:.2s;z-index:30;font-size:12px}.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes cardIn{from{opacity:0;transform:translateY(15px) scale(.98)}to{opacity:1;transform:none}}@keyframes msgIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(max-width:650px){.top{height:auto;min-height:64px;padding:9px 10px;gap:8px}.topActions{flex-wrap:wrap;justify-content:flex-end}.topActions button{padding:8px 9px;font-size:11px}.room{padding:7px 10px}.messages{padding:16px 9px}.msg{gap:8px}.avatar{width:34px;height:34px;border-radius:10px}.bubbleWrap{max-width:84%}.bubble{padding:9px 11px}.send{padding:9px}.sendBtn{width:64px}.card{padding:24px}.row{flex-direction:column}}
</style>
</head>
<body>
<div id="join" class="panel"><div class="card"><div class="heroLogo">✦</div><h1>Chat App 2</h1><p>Private browser-to-browser chat with text, media, files and screen sharing.</p><div class="profileSetup"><div id="pfpPreview" class="pfpPreview">G</div><div><button type="button" id="pfpPick" class="pfpPick">Choose profile picture</button><input id="pfpInput" type="file" accept="image/*" class="hidden"></div></div><input id="name" maxlength="30" placeholder="Your name"><div class="row"><input id="room" maxlength="40" placeholder="Room code"><button id="joinBtn">Join room</button></div><div class="small">Use the same room code on each browser. Your profile picture stays on this device.</div></div></div>
<div id="app" class="app hidden"><header class="top"><div class="brand"><div id="myAvatar" class="logo">✦</div><div><div class="title">Chat App 2</div><div id="status" class="status">Waiting for peers</div></div></div><div class="topActions"><button id="shareBtn">Share screen + audio</button><button id="saveBtn" class="ghost">Download chat</button><button id="copyBtn" class="ghost">Copy room</button><button id="leaveBtn">Leave</button></div></header><div class="room"><input id="roomDisplay" readonly><button id="copyRoomBtn">Copy</button></div><main id="messages" class="messages"><div class="empty"><div><div class="emptyIcon">✦</div><div>Join the room from another browser to start chatting.</div></div></div></main><form id="send" class="send"><input id="fileInput" type="file" multiple accept="image/*,video/*,*/*" class="hidden"><button type="button" id="attachBtn" class="attach" title="Send files">＋</button><input id="message" autocomplete="off" placeholder="Write a message…"><button class="sendBtn">Send</button></form></div><div id="toast" class="toast"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=id=>document.getElementById(id);let peer=null,room="",name="",pfp="",connections=new Map(),transfers=new Map(),screenStream=null;const CHUNK=48*1024;
const clean=s=>String(s||"").trim().replace(/[^a-zA-Z0-9_-]/g,"-").slice(0,40),formatSize=n=>n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":n<1073741824?(n/1048576).toFixed(1)+" MB":(n/1073741824).toFixed(1)+" GB";
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>$("toast").classList.remove("show"),1800)}
function setStatus(){let n=connections.size;$("status").textContent=n?"Connected":"Waiting for peers"}
function scroll(){let b=$("messages");b.scrollTop=b.scrollHeight}
function avatarHtml(d,mine){let src=mine?pfp:(d.pfp||"");return src?'<img src="'+src.replace(/"/g,"&quot;")+'">':(mine?(name||"G").charAt(0):(d.name||"G").charAt(0))}
function renderFile(f){
 let card=document.createElement("div");card.className="fileCard";let url=URL.createObjectURL(f.blob);
 if(f.type.startsWith("image/")){let x=document.createElement("img");x.src=url;x.alt=f.name;card.append(x)}
 else if(f.type.startsWith("video/")){let x=document.createElement("video");x.src=url;x.controls=true;x.playsInline=true;card.append(x)}
 let meta=document.createElement("div");meta.className="fileMeta";let icon=document.createElement("div");icon.className="fileIcon";icon.textContent=f.type.startsWith("image/")?"🖼️":f.type.startsWith("video/")?"🎬":"📎";let info=document.createElement("div");info.className="fileInfo";let nm=document.createElement("div");nm.className="fileName";nm.textContent=f.name;let sz=document.createElement("div");sz.className="fileSize";sz.textContent=formatSize(f.size);info.append(nm,sz);let dl=document.createElement("a");dl.className="download";dl.textContent="Save";dl.href=url;dl.download=f.name;meta.append(icon,info,dl);card.append(meta);return card
}
function addMessage(d,mine=false){
 let box=$("messages"),empty=box.querySelector(".empty");if(empty)empty.remove();let el=document.createElement("div");el.className="msg"+(mine?" mine":"");let av=document.createElement("div");av.className="avatar";av.innerHTML=avatarHtml(d,mine);let wrap=document.createElement("div");wrap.className="bubbleWrap";let n=document.createElement("div");n.className="name";n.textContent=mine?"You":d.name||"Guest";wrap.append(n);let bubble=document.createElement("div");bubble.className="bubble";if(d.text){let t=document.createElement("div");t.className="text";t.textContent=d.text;bubble.append(t)}if(d.file)bubble.append(renderFile(d.file));wrap.append(bubble);el.append(av,wrap);box.append(el);scroll()
}
function broadcast(d,except){for(let [id,c] of connections)if(id!==except&&c.open)try{c.send(d)}catch(e){}}
function receiveChunk(d,from){
 let t=transfers.get(d.id);if(!t){t={name:d.name,size:d.size,type:d.mime,chunks:[],received:0,total:d.total};transfers.set(d.id,t)}
 t.chunks[d.index]=d.chunk;t.received++;broadcast(d,from);
 if(d.end){let blob=new Blob(t.chunks,{type:t.type||"application/octet-stream"});transfers.delete(d.id);addMessage({name:d.sender||"Guest",pfp:d.pfp||"",file:{name:t.name,size:t.size,type:t.type,blob}},false)}
}
async function sendFile(file){
 if(!connections.size){toast("Connect to a peer first");return}
 let id=name+"-"+Date.now()+"-"+Math.random().toString(36).slice(2),total=Math.ceil(file.size/CHUNK)||1;addMessage({file:{name:file.name,size:file.size,type:file.type,blob:file}},true);
 let msg=$("messages").lastElementChild,bar=document.createElement("div");bar.className="progress";let i=document.createElement("i");bar.append(i);msg.querySelector(".fileCard").append(bar);
 for(let n=0;n<total;n++){let chunk=await file.slice(n*CHUNK,(n+1)*CHUNK).arrayBuffer();broadcast({type:"file",id,name:file.name,size:file.size,mime:file.type,total,index:n,chunk,sender:name,pfp,end:n===total-1});i.style.width=((n+1)/total*100)+"%";await new Promise(r=>setTimeout(r,0))}setTimeout(()=>bar.remove(),500)
}
function attach(c){
 connections.set(c.peer,c);setStatus();c.on("open",()=>{setStatus();try{c.send({type:"hello",name,pfp})}catch(e){}});c.on("data",d=>{if(d.type==="hello"){if(d.name)addMessage({name:d.name,pfp:d.pfp,text:"joined the room"});return}if(d.type==="chat"){addMessage(d);broadcast(d,c.peer);return}if(d.type==="file"){receiveChunk(d,c.peer)}});c.on("close",()=>{connections.delete(c.peer);setStatus()});c.on("error",()=>{connections.delete(c.peer);setStatus()})
}
function connectTo(id){if(!peer||id===peer.id||connections.has(id))return;attach(peer.connect(id,{reliable:true}))}
function start(){
 room=clean($("room").value)||Math.random().toString(36).slice(2,8);name=($("name").value.trim()||"Guest").slice(0,30);$("roomDisplay").value=room;$("join").classList.add("hidden");$("app").classList.remove("hidden");$("myAvatar").innerHTML=pfp?'<img src="'+pfp.replace(/"/g,"&quot;")+'" style="width:100%;height:100%;object-fit:cover;border-radius:12px">':"✦";
 const prefix="p2p-chat-"+room+"-",slots=Array.from({length:12},(_,i)=>prefix+i),tried=new Set();
 function trySlot(){const available=slots.filter(x=>!tried.has(x));if(!available.length){toast("Room is full");return}const id=available[Math.floor(Math.random()*available.length)];tried.add(id);peer=new Peer(id,{host:"0.peerjs.com",port:443,path:"/",secure:true});peer.on("open",myId=>{setStatus();slots.filter(x=>x!==myId).forEach(connectTo);localStorage.setItem("p2p-last-room",room)});peer.on("connection",attach);peer.on("call",call=>{call.answer();call.on("error",()=>{});call.on("stream",stream=>{let box=$("messages"),empty=box.querySelector(".empty");if(empty)empty.remove();let el=document.createElement("div");el.className="msg";let av=document.createElement("div");av.className="avatar";let wrap=document.createElement("div");wrap.className="bubbleWrap";let n=document.createElement("div");n.className="name";n.textContent=(call.metadata&&call.metadata.name)||"Guest";wrap.append(n);let bubble=document.createElement("div");bubble.className="bubble";let t=document.createElement("div");t.className="text";t.textContent="Live screen share";bubble.append(t);let v=document.createElement("video");v.srcObject=stream;v.autoplay=true;v.playsInline=true;v.controls=true;v.style.cssText="display:block;width:100%;max-height:390px;object-fit:contain;background:#050608;border-radius:10px";bubble.append(v);wrap.append(bubble);el.append(av,wrap);box.append(el);scroll()})});peer.on("error",e=>{if(e.type==="unavailable-id"){trySlot();return}toast("Connection error: "+e.type);$("status").textContent="Connection error"})}trySlot()
}
$("pfpPick").onclick=()=>$("pfpInput").click();$("pfpInput").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{pfp=r.result;$("pfpPreview").innerHTML='<img src="'+pfp+'" style="width:100%;height:100%;object-fit:cover">';localStorage.setItem("chat2-pfp",pfp)};r.readAsDataURL(f)};
$("name").value=localStorage.getItem("chat2-name")||"";pfp=localStorage.getItem("chat2-pfp")||"";if(pfp)$("pfpPreview").innerHTML='<img src="'+pfp+'" style="width:100%;height:100%;object-fit:cover">';
$("joinBtn").onclick=()=>{localStorage.setItem("chat2-name",$("name").value.trim());start()};$("room").addEventListener("keydown",e=>{if(e.key==="Enter"){$("joinBtn").click()}});
$("send").onsubmit=e=>{e.preventDefault();let text=$("message").value.trim();if(!text)return;let d={type:"chat",name,pfp,text,time:Date.now()};addMessage(d,true);broadcast(d);$("message").value="";$("message").focus()};
$("attachBtn").onclick=()=>$("fileInput").click();$("fileInput").onchange=e=>{[...e.target.files].forEach(sendFile);e.target.value=""};
$("shareBtn").onclick=async()=>{if(screenStream){screenStream.getTracks().forEach(t=>t.stop());screenStream=null;$("shareBtn").textContent="Share screen + audio";return}try{screenStream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});$("shareBtn").textContent="Stop sharing";screenStream.getVideoTracks()[0].onended=()=>{screenStream=null;$("shareBtn").textContent="Share screen + audio"};for(let [id,c] of connections)if(c.open){try{const call=peer.call(id,screenStream,{metadata:{name,pfp}});call.on("error",()=>toast("Screen share connection failed"))}catch(e){toast("Could not share with a peer")}}}catch(e){toast("Screen sharing cancelled")}};
function saveChat(){const clone=$("messages").cloneNode(true);clone.querySelectorAll(".progress").forEach(x=>x.remove());clone.querySelectorAll("video").forEach(v=>{const wrap=document.createElement("div");wrap.className="savedVideo";wrap.innerHTML="<div class=\"videoIcon\">▶</div><div><b>Video</b><div>Video from chat</div></div>";v.replaceWith(wrap)});const css=document.querySelector("style").textContent;const safeRoom=room.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");const html='<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat - '+safeRoom+'</title><style>'+css+'body{overflow:auto;background:#07080c}.saved{width:100%;max-width:1000px;margin:0 auto;min-height:100vh}.savedHead{padding:22px 18px;border-bottom:1px solid var(--line);background:#0b0e14}.savedHead h1{margin:0;font-size:20px}.savedHead p{margin:5px 0 0;color:var(--muted);font-size:12px}.messages{height:auto;overflow:visible}.savedVideo{height:180px;display:flex;align-items:center;gap:14px;padding:20px;background:#090c12;border-radius:10px;color:#fff}.videoIcon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#6658ee;font-size:20px}.savedNote{padding:18px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}</style></head><body><div class="saved"><div class="savedHead"><h1>Chat App 2</h1><p>Room: '+safeRoom+' · Saved chat</p></div>'+clone.outerHTML+'<div class="savedNote">This is a saved copy of the chat. Sending controls and live screen-sharing controls are not included.</div></div></body></html>';const blob=new Blob([html],{type:"text/html;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="chat-"+(room||"saved")+"-"+new Date().toISOString().slice(0,10)+".html";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("Chat saved as HTML")}
async function copyRoom(){try{await navigator.clipboard.writeText(room);toast("Room code copied")}catch(e){toast(room)}}$("saveBtn").onclick=saveChat;$("copyBtn").onclick=copyRoom;$("copyRoomBtn").onclick=copyRoom;$("leaveBtn").onclick=()=>location.reload();
</script></body></html>
