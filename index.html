<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat - Multiplayer Games</title>

<style>
*{
    box-sizing:border-box;
}

:root{
    --bg:#0b0d10;
    --panel:#111419;
    --panel2:#181c22;
    --panel3:#20252d;
    --border:#292f38;
    --text:#edf0f4;
    --muted:#7e8793;
    --accent:#e8eaed;
    --danger:#ff7070;
    --green:#70e0a0;
    --yellow:#e5c66b;
    --radius:12px;
    --text-size:16px;
    --word-spacing:0px;
    --line-spacing:1.45;
    --ui-scale:1;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

body{
    overflow:hidden;
    font-size:calc(16px * var(--ui-scale));
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:64px;
    min-height:64px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel);
    border-bottom:1px solid var(--border);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
}

.logo-icon{
    width:35px;
    height:35px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:var(--panel2);
    border:1px solid var(--border);
}

.channel{
    color:var(--muted);
    font-weight:400;
}

.header-actions{
    display:flex;
    gap:7px;
}

.icon-btn{
    width:39px;
    height:39px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
}

.icon-btn:hover{
    filter:brightness(1.15);
}

/* MESSAGES */

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    display:flex;
    gap:11px;
    margin-bottom:17px;
}

.avatar{
    flex:0 0 40px;
    width:40px;
    height:40px;
    display:grid;
    place-items:center;
    border-radius:var(--radius);
    background:var(--panel2);
    border:1px solid var(--border);
    font-weight:700;
}

.message-content{
    min-width:0;
    max-width:min(850px,calc(100vw - 90px));
}

.message-top{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:3px;
}

.username{
    font-weight:700;
}

.time,
.edited{
    color:var(--muted);
    font-size:11px;
}

.message-text{
    color:#d8dde4;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    font-size:var(--text-size);
    word-spacing:var(--word-spacing);
    line-height:var(--line-spacing);
}

.message-image{
    display:block;
    max-width:min(500px,80vw);
    max-height:500px;
    margin-top:8px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:#000;
    object-fit:contain;
    cursor:pointer;
}

/* GAME CARDS */

.game-message{
    margin:0 auto 18px;
    max-width:900px;
}

.game-card{
    border:1px solid var(--border);
    border-radius:16px;
    background:linear-gradient(
        145deg,
        var(--panel2),
        #101318
    );
    overflow:hidden;
    box-shadow:0 12px 40px #0005;
}

.game-header{
    padding:17px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
}

.game-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:18px;
    font-weight:800;
}

.game-status{
    font-size:12px;
    padding:6px 9px;
    border-radius:999px;
    background:#252b33;
    color:#bfc6cf;
}

.game-body{
    padding:18px;
}

.game-info{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:15px;
}

.game-pill{
    padding:7px 10px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#13171d;
    color:#bfc6cf;
    font-size:12px;
}

.game-pill strong{
    color:white;
}

.game-description{
    color:#969faa;
    margin-bottom:16px;
    line-height:1.45;
}

.game-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.game-btn{
    border:1px solid var(--border);
    border-radius:9px;
    padding:10px 14px;
    background:#222830;
    color:white;
    font-weight:700;
}

.game-btn:hover{
    filter:brightness(1.15);
}

.game-btn.primary{
    background:#e8eaed;
    color:#111;
}

.game-btn.green{
    background:#193b2b;
    border-color:#2c6348;
    color:#9bf0bc;
}

.game-btn.danger{
    background:#3a1c20;
    border-color:#71333b;
    color:#ff9292;
}

.game-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.game-btn.boss{
    background:#4a1a2a;
    border-color:#8a3a5a;
    color:#ff8aaa;
    font-size:18px;
    padding:15px 25px;
}

.game-btn.boss:hover:not(:disabled){
    background:#5a2a3a;
}

/* PLAYERS */

.players-list{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin:13px 0;
}

.player-chip{
    padding:7px 10px;
    border-radius:8px;
    background:#13171d;
    border:1px solid var(--border);
    font-size:12px;
}

.player-chip.host{
    border-color:#65552a;
    color:#ead17a;
}

.turn-banner{
    margin:12px 0;
    padding:11px 13px;
    border-radius:10px;
    background:#151a20;
    border:1px solid var(--border);
    color:#c8ced6;
}

.turn-banner strong{
    color:white;
}

/* TIC TAC TOE */

.ttt{
    display:grid;
    gap:5px;
    justify-content:center;
    margin:15px auto;
}

.ttt button{
    border-radius:8px;
    border:1px solid var(--border);
    background:#11151b;
    color:white;
    font-weight:900;
    transition:0.15s;
    font-size:28px;
}

.ttt button:hover:not(:disabled){
    background:#222831;
}

/* REACTION TIME */

.reaction-area{
    text-align:center;
    padding:20px;
}

.reaction-box{
    width:200px;
    height:200px;
    margin:15px auto;
    border-radius:20px;
    border:3px solid var(--border);
    display:grid;
    place-items:center;
    font-size:24px;
    font-weight:700;
    transition:0.2s;
    cursor:pointer;
    background:#1a1f26;
    color:var(--muted);
}

.reaction-box.waiting{
    background:#1a1f26;
    color:var(--muted);
}

.reaction-box.ready{
    background:#1a3a2a;
    border-color:#2a6a4a;
    color:#7affb0;
}

.reaction-box.go{
    background:#3a1a1a;
    border-color:#6a2a2a;
    color:#ff7a7a;
}

.reaction-box.done{
    background:#2a2a4a;
    border-color:#4a4a7a;
    color:#aaaaff;
}

/* BOSS BATTLE */

.boss-area{
    text-align:center;
    padding:10px;
}

.boss-health-bar{
    width:100%;
    max-width:500px;
    height:30px;
    margin:10px auto;
    background:#1a1a1a;
    border-radius:15px;
    border:2px solid #333;
    overflow:hidden;
    position:relative;
}

.boss-health-fill{
    height:100%;
    background:linear-gradient(90deg,#ff3333,#ff6a33);
    border-radius:15px;
    transition:width 0.3s ease;
    width:100%;
}

.boss-health-text{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    font-weight:700;
    font-size:14px;
    color:white;
    text-shadow:0 0 10px rgba(0,0,0,0.8);
}

.boss-stats{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin:10px 0;
    color:#9da5b0;
    font-size:14px;
}

.boss-stats strong{
    color:white;
}

.boss-upgrades{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    margin:10px 0;
}

.boss-upgrade-btn{
    padding:8px 16px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#1a1f26;
    color:white;
    font-size:12px;
    transition:0.15s;
}

.boss-upgrade-btn:hover:not(:disabled){
    background:#2a303a;
    transform:scale(1.05);
}

.boss-upgrade-btn:disabled{
    opacity:0.3;
    cursor:not-allowed;
}

.boss-upgrade-btn .cost{
    color:#ffcc44;
    font-weight:700;
}

.boss-damage-display{
    font-size:32px;
    font-weight:900;
    color:#ff6a33;
    margin:5px 0;
}

.boss-monster-name{
    font-size:28px;
    font-weight:900;
    color:#ff4466;
    text-shadow:0 0 20px rgba(255,68,102,0.3);
}

/* COMPOSER */

.composer{
    padding:12px 16px 16px;
    background:var(--panel);
    border-top:1px solid var(--border);
}

.composer-box{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:8px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:14px;
}

textarea{
    flex:1;
    min-height:42px;
    max-height:150px;
    resize:none;
    border:0;
    outline:none;
    background:transparent;
    color:white;
    padding:10px;
}

.attach-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:9px;
    background:transparent;
    color:#adb5c0;
    font-size:20px;
    display:grid;
    place-items:center;
}

.attach-btn:hover{
    background:#222830;
}

.send-btn{
    height:42px;
    border:0;
    border-radius:9px;
    padding:0 18px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

.send-btn:disabled{
    opacity:.5;
}

/* OVERLAYS */

.overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000b;
    z-index:100;
}

.overlay.show{
    display:flex;
}

.panel{
    width:min(620px,calc(100vw - 25px));
    max-height:calc(100vh - 25px);
    overflow-y:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
    box-shadow:0 25px 80px #000b;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px;
    border-bottom:1px solid var(--border);
}

.panel-header h2{
    margin:0;
}

.panel-body{
    padding:18px;
}

/* CATEGORIES */

.category{
    margin-bottom:12px;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    background:var(--panel2);
}

.category-title{
    width:100%;
    padding:14px;
    border:0;
    background:transparent;
    color:var(--text);
    display:flex;
    justify-content:space-between;
    font-weight:700;
    text-align:left;
}

.category-body{
    display:none;
    padding:0 14px 14px;
}

.category.open .category-body{
    display:block;
}

.setting{
    margin-top:14px;
}

.setting label{
    display:block;
    margin-bottom:7px;
    color:#aab2bd;
    font-size:13px;
}

.setting input,
.setting select{
    width:100%;
    padding:10px;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
    background:#101419;
    color:white;
}

.setting input[type=range]{
    padding:0;
}

.setting-value{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.save-btn{
    width:100%;
    margin-top:8px;
    padding:12px;
    border:0;
    border-radius:9px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

/* GAME CREATOR */

.game-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.game-choice{
    min-height:80px;
    padding:13px;
    text-align:left;
    border-radius:12px;
    border:1px solid var(--border);
    background:#151a20;
    color:white;
    font-size:13px;
}

.game-choice:hover{
    background:#20262e;
}

.game-choice strong{
    display:block;
    margin-bottom:3px;
    font-size:15px;
}

.game-choice span{
    color:#818b97;
    font-size:11px;
}

.game-choice .game-players{
    display:inline-block;
    background:#1a1f26;
    padding:1px 8px;
    border-radius:10px;
    color:#aab2bd;
    font-size:10px;
    margin-top:4px;
}

.game-choice .game-options{
    font-size:10px;
    color:#6a7a8a;
    margin-top:3px;
}

/* GAME SETTINGS - LOBBY */

.game-settings{
    background:#0d1015;
    border-radius:10px;
    padding:12px;
    margin:10px 0;
}

.game-settings h4{
    margin:0 0 10px 0;
    color:#aab2bd;
    font-size:13px;
    font-weight:600;
}

.game-settings-row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:center;
    margin:6px 0;
}

.game-settings-row label{
    color:#aab2bd;
    font-size:12px;
    min-width:70px;
}

.game-settings-row select,
.game-settings-row input[type=number]{
    background:#1a1f26;
    border:1px solid var(--border);
    border-radius:6px;
    color:white;
    padding:5px 10px;
    font-size:12px;
    flex:1;
    min-width:80px;
}

/* DANGER */

.danger-zone{
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid #402529;
}

.danger-title{
    color:var(--danger);
    font-weight:700;
    margin-bottom:7px;
}

.danger-zone p{
    color:var(--muted);
    line-height:1.45;
}

.danger-btn{
    width:100%;
    padding:12px;
    border-radius:9px;
    border:1px solid #743333;
    background:#241719;
    color:#ff8585;
}

/* EMPTY */

.empty{
    height:100%;
    min-height:200px;
    display:grid;
    place-items:center;
    color:#656d78;
    text-align:center;
}

.empty strong{
    display:block;
    color:#aab2bd;
    margin-bottom:5px;
}

/* TYPE SENTENCE */

.type-area{
    text-align:center;
    padding:15px;
}

.type-sentence{
    font-size:24px;
    font-weight:700;
    color:white;
    padding:20px;
    background:#1a1f26;
    border-radius:12px;
    border:1px solid var(--border);
    margin:10px auto;
    max-width:600px;
    word-break:break-word;
}

.type-input{
    width:100%;
    max-width:500px;
    padding:12px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#101419;
    color:white;
    font-size:18px;
    text-align:center;
}

.type-input:focus{
    outline:2px solid var(--accent);
}

.type-stats{
    display:flex;
    justify-content:center;
    gap:20px;
    margin:10px 0;
    color:#9da5b0;
}

.type-stats strong{
    color:white;
}

/* MEMORY MATCH */

.memory-grid{
    display:grid;
    gap:8px;
    justify-content:center;
    margin:15px auto;
    max-width:100%;
}

.memory-card{
    width:70px;
    height:70px;
    border-radius:10px;
    border:2px solid var(--border);
    background:#1a1f26;
    display:grid;
    place-items:center;
    font-size:30px;
    cursor:pointer;
    transition:0.2s;
    color:transparent;
    user-select:none;
}

.memory-card.flipped{
    background:#2a303a;
    color:white;
}

.memory-card.matched{
    background:#1a3a2a;
    border-color:#2a6a4a;
    color:#7affb0;
    cursor:default;
}

.memory-card:hover:not(.flipped):not(.matched){
    transform:scale(1.05);
}

/* QUICK DRAW */

.quickdraw-area{
    text-align:center;
    padding:20px;
}

.quickdraw-box{
    width:300px;
    height:200px;
    margin:15px auto;
    border-radius:20px;
    border:3px solid var(--border);
    display:grid;
    place-items:center;
    font-size:32px;
    font-weight:900;
    transition:0.2s;
    background:#1a1f26;
    color:var(--muted);
}

.quickdraw-box.waiting{
    background:#1a1f26;
    color:var(--muted);
}

.quickdraw-box.countdown{
    background:#2a2a1a;
    border-color:#6a6a2a;
    color:#ddcc44;
}

.quickdraw-box.draw{
    background:#1a3a2a;
    border-color:#2a6a4a;
    color:#7affb0;
    cursor:pointer;
}

.quickdraw-box.punish{
    background:#3a1a1a;
    border-color:#6a2a2a;
    color:#ff7a7a;
}

/* COIN FLIP */

.coin-area{
    text-align:center;
    padding:15px;
}

.coin-display{
    font-size:80px;
    margin:15px 0;
}

.coin-buttons{
    display:flex;
    gap:15px;
    justify-content:center;
    flex-wrap:wrap;
}

.coin-btn{
    padding:12px 30px;
    border-radius:12px;
    border:2px solid var(--border);
    background:#1a1f26;
    color:white;
    font-size:18px;
    font-weight:700;
    transition:0.15s;
}

.coin-btn:hover:not(:disabled){
    transform:scale(1.05);
    background:#2a303a;
}

.coin-btn:disabled{
    opacity:0.3;
    cursor:not-allowed;
}

.coin-btn.selected{
    border-color:#ffcc44;
    background:#2a2a1a;
}

/* NUMBER GUESS */

.numberguess-area{
    text-align:center;
    padding:15px;
}

.numberguess-input{
    padding:12px 20px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#1a1f26;
    color:white;
    font-size:18px;
    width:150px;
    text-align:center;
}

.numberguess-hint{
    font-size:20px;
    padding:10px;
    margin:10px 0;
    border-radius:10px;
    background:#1a1f26;
    border:1px solid var(--border);
}

/* TARGET CLICK */

.target-area{
    text-align:center;
    padding:15px;
    position:relative;
    min-height:300px;
}

.target-box{
    width:100%;
    height:300px;
    border-radius:16px;
    border:2px solid var(--border);
    background:#11161d;
    position:relative;
    overflow:hidden;
    cursor:pointer;
}

.target-dot{
    position:absolute;
    width:60px;
    height:60px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #ff6a6a, #cc2222);
    cursor:pointer;
    transition:0.1s;
    box-shadow:0 0 30px rgba(255,0,0,0.3);
    transform:translate(-50%, -50%);
}

.target-dot:hover{
    transform:translate(-50%, -50%) scale(1.1);
}

.target-stats{
    display:flex;
    justify-content:center;
    gap:30px;
    margin:10px 0;
    color:#9da5b0;
}

.target-stats strong{
    color:white;
}

@media(max-width:600px){

    .header{
        padding:0 11px;
    }

    .messages{
        padding:15px 11px;
    }

    .channel{
        display:none;
    }

    .message-content{
        max-width:calc(100vw - 70px);
    }

    .game-grid{
        grid-template-columns:1fr;
    }

    .ttt button{
        font-size:20px;
    }

    .reaction-box{
        width:150px;
        height:150px;
        font-size:18px;
    }

    .boss-monster-name{
        font-size:22px;
    }

    .type-sentence{
        font-size:18px;
        padding:15px;
    }

    .memory-card{
        width:55px;
        height:55px;
        font-size:24px;
    }

    .quickdraw-box{
        width:200px;
        height:150px;
        font-size:24px;
    }

    .target-dot{
        width:45px;
        height:45px;
    }

    .game-settings-row{
        flex-direction:column;
        align-items:stretch;
    }

    .game-settings-row label{
        min-width:auto;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="logo">
        <div class="logo-icon">🎮</div>
        <span>Game Chat</span>
        <span class="channel"># general</span>
    </div>

    <div class="header-actions">

        <button
            class="icon-btn"
            id="gamesBtn"
            title="Games"

function resizeImage(file, maxSize) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                let width = img.width;
                let height = img.height;
                
                if (width > maxSize || height > maxSize) {
                    const ratio = Math.min(maxSize / width, maxSize / height);
                    width = Math.round(width * ratio);
                    height = Math.round(height * ratio);
                }
                
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                
                resolve(canvas.toDataURL('image/jpeg', 0.8));
            };
            img.onerror = reject;
            img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

async function apiPost(body){

    const response=
        await fetch(
            API_URL,
            {
                method:"POST",
                headers:{
                    "Content-Type":
                        "application/json"
                },
                body:
                    JSON.stringify(body)
            }
        );

    const data=
        await safeJson(response);

    if(!response.ok){

        throw new Error(
            data.error ||
            "Request failed."
        );
    }

    return data;
}

                    "Content-Type":

                },
                body:
                    JSON.stringify(body)
            }
        );

    const data=
        await safeJson(response);

    if(!response.ok){

        throw new Error(
            data.error ||
            "Delete failed."
        );
    }

    return data;
}


async function apiPatch(body){

    const response=
        await fetch(
            API_URL,
            {
                method:"PATCH",
                headers:{
                    "Content-Type":
                        "application/json"
                },
                body:
                    JSON.stringify(body)
            }
        );

    const data=
        await safeJson(response);

    if(!response.ok){

        throw new Error(
            data.error ||
            "Update failed."
        );
    }

    return data;
}


async function safeJson(response){

    const text=
        await response.text();

    if(!text)return {};

    try{
        return JSON.parse(text);
    }catch{
        return {
            error:text
        };
    }
}


/* =====================================================
   LOAD MESSAGES
===================================================== */

async function loadMessages(){

    if(syncing)return;

    syncing=true;

    try{

        const response=
            await fetch(
                API_URL+
                "?channel="+
                encodeURIComponent(
                    CHANNEL
                )+
                "&_="+
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        const data=
            await safeJson(response);

        if(!response.ok){

            throw new Error(
                data.error ||
                "Failed to load messages."
            );
        }

        const newMessages=
            Array.isArray(
                data.messages
            )
            ?data.messages
            :[];

        const changeInfo = getMessageChanges(currentMessages, newMessages);
        
        if (changeInfo.changed) {
            let hasNewMessages = false;
            let hasNewGames = false;
            
            for (const msg of newMessages) {
                if (!seenMessageIds.has(msg.id)) {
                    if (!isGameMessage(msg)) {
                        hasNewMessages = true;
                    }
                    seenMessageIds.add(msg.id);
                }
            }
            
            const oldGames = [...games];
            currentMessages = newMessages;
            processGameMessages();
            
            for (const game of games) {
                if (!seenGameIds.has(game.id)) {
                    hasNewGames = true;
                    seenGameIds.add(game.id);
                }
            }
            
            const oldGameIds = new Set(oldGames.map(g => g.id));
            const newGameIds = new Set(games.map(g => g.id));
            for (const id of oldGameIds) {
                if (!newGameIds.has(id)) {
                    seenGameIds.delete(id);
                }
            }
            
            const shouldScroll = settings.autoScroll && (hasNewMessages || hasNewGames);
            const wasNearBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 100;
            
            renderMessages(shouldScroll || (wasNearBottom && settings.autoScroll));
        }

    }catch(error){

        if(
            !currentMessages.length
        ){

            messagesEl.innerHTML=`
                <div class="empty">
                    <div>
                        <strong>Unable to load messages</strong>
                        ${escapeHtml(
                            error.message
                        )}
                    </div>
                </div>
            `;
        }

    }finally{

        syncing=false;
    }
}

function getMessageChanges(oldMessages, newMessages) {
    if (oldMessages.length !== newMessages.length) {
        return { changed: true };
    }
    
    let changed = false;
    for (let i = 0; i < oldMessages.length; i++) {
        const oldMsg = oldMessages[i];
        const newMsg = newMessages[i];
        
        if (oldMsg.id !== newMsg.id || 
            oldMsg.message !== newMsg.message || 
            oldMsg.username !== newMsg.username || 
            oldMsg.edited !== newMsg.edited ||
            oldMsg.image !== newMsg.image) {
            changed = true;
            break;
        }
    }
    
    return { changed };
}


/* =====================================================
   GAME MESSAGE PARSING
===================================================== */

function isGameMessage(message){

    return (
        message &&
        typeof message.message==="string" &&
        message.message.startsWith(
            GAME_PREFIX
        )
    );
}


function parseGameMessage(message){

    if(!isGameMessage(message)){
        return null;
    }

    try{

        return JSON.parse(
            message.message.substring(
                GAME_PREFIX.length
            )
        );

    }catch{

        return null;
    }
}


function processGameMessages(){

    const map=new Map();

    for(const message of currentMessages){

        if(!isGameMessage(message)){
            continue;
        }

        const state=
            parseGameMessage(message);

        if(!state){
            continue;
        }

        if(
            state.type!=="game"
        ){
            continue;
        }

        map.set(
            state.id,
            {
                ...state,
                messageId:
                    message.id,
                hostDeviceId:
                    state.hostDeviceId ||
                    message.device_id ||
                    ""
            }
        );
    }

    games=[
        ...map.values()
    ];
}


/* =====================================================
   RENDER MESSAGES
===================================================== */

function renderMessages(shouldAutoScroll){

    const normal =
        currentMessages.filter(
            message =>
                !isGameMessage(message)
        );

    const activeGames =
        games.filter(
            game =>
                game.status !== "finished" &&
                game.status !== "forcequit"
        );

    if (!normal.length && !activeGames.length) {
        messagesEl.innerHTML = `
            <div class="empty">
                <div>
                    <strong>No messages yet</strong>
                    Be the first to send something.
                </div>
            </div>
        `;
        renderedElements.clear();
        return;
    }

    const fragment = document.createDocumentFragment();
    const elementIds = [];

    for (const message of normal) {
        const item = createMessageElement(message);
        fragment.appendChild(item);
        elementIds.push('msg_' + message.id);
    }

    for (const game of activeGames) {
        const gameEl = createGameElement(game);
        fragment.appendChild(gameEl);
        elementIds.push('game_' + game.id);
    }

    const currentChildren = messagesEl.children;
    const currentIds = [];

    for (let i = 0; i < currentChildren.length; i++) {
        const child = currentChildren[i];
        if (child.dataset && child.dataset.id) {
            currentIds.push(child.dataset.id);
        } else {
            currentIds.push('__temp_' + i);
        }
    }

    const newChildren = Array.from(fragment.children);
    
    if (currentIds.length !== elementIds.length || 
        currentIds.some((id, idx) => id !== elementIds[idx])) {
        
        messagesEl.replaceChildren(fragment);
        
        renderedElements.clear();
        for (let i = 0; i < newChildren.length; i++) {
            const el = newChildren[i];
            if (el.dataset && el.dataset.id) {
                renderedElements.set(el.dataset.id, el);
            }
        }
        
        if (shouldAutoScroll && settings.autoScroll) {
            requestAnimationFrame(() => {
                messagesEl.scrollTop = messagesEl.scrollHeight;
            });
        }
        
        return;
    }

    let hasNewElement = false;
    
    for (let i = 0; i < newChildren.length; i++) {
        const newEl = newChildren[i];
        const oldEl = currentChildren[i];
        
        if (newEl.dataset && newEl.dataset.id !== oldEl.dataset.id) {
            hasNewElement = true;
        }
        
        if (newEl.dataset && newEl.dataset.id === oldEl.dataset.id) {
            oldEl.replaceWith(newEl);
            renderedElements.set(newEl.dataset.id, newEl);
        } else {
            oldEl.replaceWith(newEl);
            if (newEl.dataset && newEl.dataset.id) {
                renderedElements.set(newEl.dataset.id, newEl);
            }
            hasNewElement = true;
        }
    }

    const validIds = new Set(elementIds);
    for (const [id, el] of renderedElements) {
        if (!validIds.has(id)) {
            renderedElements.delete(id);
        }
    }

    if (shouldAutoScroll && settings.autoScroll) {
        requestAnimationFrame(() => {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        });
    }
}

        "message-content";

        document.createElement("div");

    top.className =
        "message-top";

    const name =
        document.createElement("span");

    name.className =
        "username";

    name.textContent =
        message.username ||
        "User";

    top.appendChild(name);

    if (settings.showTimestamps) {

        const time =
            document.createElement("span");

        time.className = "time";

        time.textContent =
            formatTime(
                message.created_at
            );

        top.appendChild(time);
    }

    if (message.edited) {

        const edited =
            document.createElement("span");

        edited.className =
            "edited";

        edited.textContent =
            "(edited)";

        top.appendChild(edited);
    }

    content.appendChild(top);

    if (message.message) {

        const text =
            document.createElement("div");

        text.className =
            "message-text";

        text.textContent =
            message.message;

        content.appendChild(text);
    }

    // Image
    if (message.image) {
        const img = document.createElement("img");
        img.className = "message-image";
        img.src = message.image;
        img.alt = "Image";
        img.onclick = () => {
            window.open(message.image, '_blank');
        };
        content.appendChild(img);
    }

    item.appendChild(avatar);
    item.appendChild(content);

    return item;
}

async function createGame(gameType){

    if(!settings.username){

        settingsBtn.click();

        alert(
            "Set your name before creating a game."
        );

        return;
    }

    const existing=
        games.find(
            game=>
                game.hostDeviceId===
                    deviceId &&
                game.status!=="finished" &&
                game.status!=="forcequit"
        );

    if(existing){

        alert(
            "You are already hosting a game."
        );

        gamesOverlay.classList.remove(
            "show"
        );

        return;
    }

    const info=
        GAME_TYPES[gameType];

    if(!info)return;

    const game={

        type:"game",

        id:
            "game_"+

            Date.now().toString(36)+

            "_"+

            Math.random()
                .toString(36)
                .slice(2,8),

        gameType,

        name:
            info.name,

        icon:
            info.icon,

        host:
            settings.username,

        hostDeviceId:
            deviceId,

        status:
            "lobby",

        players:[

            {
                deviceId,
                username:
                    settings.username
            }

        ],

        maxPlayers:
            info.max,

        turnIndex:0,

        createdAt:
            Date.now(),

        board:[],

        winner:null,

        data:{
            settings: getDefaultSettings(gameType)
        }
    };

    // Set game-specific size
    if (info.size) {
        game.data.settings.boardSize = info.size;
        game.data.settings.players = info.players || 2;
    }

    try{

        await writeGameState(
            game
        );

        gamesOverlay.classList.remove(
            "show"
        );

        await loadMessages();

    }catch(error){

        alert(
            "Could not create game:\n\n"+
            error.message
        );
    }
}

function getDefaultSettings(gameType){
    const settings = {
        ttt3: { boardSize: 3, players: 2 },
        ttt4: { boardSize: 4, players: 2 },
        ttt5: { boardSize: 5, players: 2 },
        ttt6: { boardSize: 6, players: 2 },
        ttt3p: { boardSize: 4, players: 3 },
        memory: { gridSize: 4 },
        quickdraw: { rounds: 3 },

        numberguess: { maxNumber: 100 },

/* =====================================================

===================================================== */

function createGameElement(game){
    const wrapper = document.createElement("div");
    wrapper.className = "game-message";
    wrapper.dataset.id = 'game_' + game.id;

    const card = document.createElement("div");
    card.className = "game-card";

    // Header
    const header = document.createElement("div");
    header.className = "game-header";

    const title = document.createElement("div");
    title.className = "game-title";
    title.textContent = game.icon + " " + game.name;

    const status = document.createElement("div");
    status.className = "game-status";
    status.textContent = game.status === "lobby" ? "WAITING" : "PLAYING";

    header.appendChild(title);
    header.appendChild(status);

    // Body
    const body = document.createElement("div");
    body.className = "game-body";

    // Info
    const info = document.createElement("div");
    info.className = "game-info";
    info.innerHTML = `
        <div class="game-pill">
            Host: <strong>${escapeHtml(game.host)}</strong>
        </div>
        <div class="game-pill">
            Players: <strong>${game.players.length}/${game.maxPlayers}</strong>
        </div>
    `;
    body.appendChild(info);

    // Description
    const desc = document.createElement("div");
    desc.className = "game-description";
    desc.textContent = game.status === "lobby" 
        ? "Join before the host starts. Everyone else can spectate."
        : getGameDescription(game);
    body.appendChild(desc);

    // Players
    const players = document.createElement("div");
    players.className = "players-list";
    game.players.forEach(player => {
        const chip = document.createElement("div");
        chip.className = "player-chip";
        if (player.deviceId === game.hostDeviceId) chip.classList.add("host");
        chip.textContent = player.username + (player.deviceId === game.hostDeviceId ? " 👑" : "");
        players.appendChild(chip);
    });
    body.appendChild(players);

    // GAME SETTINGS - Only show in lobby to host
    if (game.status === "lobby" && game.hostDeviceId === deviceId) {
        const settingsDiv = document.createElement("div");
        settingsDiv.className = "game-settings";
        settingsDiv.innerHTML = `<h4>⚙️ Game Settings (Host only)</h4>`;
        settingsDiv.appendChild(createSettingsUI(game));
        body.appendChild(settingsDiv);
    }

    // Turn banner
    if (game.status === "playing") {
        const turn = document.createElement("div");
        turn.className = "turn-banner";
        const current = game.players[game.turnIndex % Math.max(game.players.length, 1)];
        if (current) {
            turn.innerHTML = "Current turn: <strong>" + escapeHtml(current.username) + "</strong>";
        }
        body.appendChild(turn);
    }

    // Game board
    const board = createGameBoard(game);
    if (board) body.appendChild(board);

    // Actions
    const actions = document.createElement("div");
    actions.className = "game-actions";

    if (game.status === "lobby") {
        const joined = game.players.some(p => p.deviceId === deviceId);
        
        if (!joined && game.players.length < game.maxPlayers) {
            const join = document.createElement("button");
            join.className = "game-btn green";
            join.textContent = "Join game";
            join.onclick = async () => await joinGame(game);
            actions.appendChild(join);
        } else if (joined) {
            const leave = document.createElement("button");
            leave.className = "game-btn";
            leave.textContent = "Leave";
            leave.onclick = async () => await leaveGame(game);
            actions.appendChild(leave);
        }

        if (game.hostDeviceId === deviceId) {
            const start = document.createElement("button");
            start.className = "game-btn primary";
            start.textContent = "Start game";
            start.disabled = game.players.length < GAME_TYPES[game.gameType].min;
            start.onclick = async () => await startGame(game);
            actions.appendChild(start);

            const quit = document.createElement("button");
            quit.className = "game-btn danger";
            quit.textContent = "Force quit";
            quit.onclick = () => openConfirm("Force quit game?", "Everyone will be removed from this game.", () => forceQuitGame(game));
            actions.appendChild(quit);
        }
    } else if (game.status === "playing") {
        const mine = game.players.some(p => p.deviceId === deviceId);
        
        if (mine) {
            const leave = document.createElement("button");
            leave.className = "game-btn";
            leave.textContent = "Leave game";
            leave.onclick = async () => await leaveGame(game);
            actions.appendChild(leave);
        }

        if (game.hostDeviceId === deviceId) {
            const quit = document.createElement("button");
            quit.className = "game-btn danger";
            quit.textContent = "Force quit";
            quit.onclick = () => openConfirm("Force quit game?", "Everyone will be removed.", () => forceQuitGame(game));
            actions.appendChild(quit);
        }
    }

    body.appendChild(actions);
    card.appendChild(header);
    card.appendChild(body);
    wrapper.appendChild(card);

    return wrapper;
}

/* =====================================================
   TIC TAC TOE (2 Player)
===================================================== */

function createTTT(game){
    const size = game.data.settings?.boardSize || 3;
    const total = size * size;
    const winCount = size;
    
    if (!game.data.board || game.data.board.length !== total) {
        game.data.board = Array(total).fill("");
    }

    const board = document.createElement("div");
    board.className = "ttt";
    const cellSize = size <= 3 ? 80 : size <= 4 ? 70 : size <= 5 ? 60 : 50;
    board.style.gridTemplateColumns = `repeat(${size}, ${cellSize}px)`;
    board.style.gridTemplateRows = `repeat(${size}, ${cellSize}px)`;

    const mine = game.players.some(p => p.deviceId === deviceId);
    const current = game.players[game.turnIndex % game.players.length];
    const myTurn = mine && current && current.deviceId === deviceId;

    const symbols = ["X", "O"];

    for (let i = 0; i < total; i++) {
        const button = document.createElement("button");
        button.textContent = game.data.board[i] || "";
        button.style.fontSize = size <= 3 ? "32px" : size <= 4 ? "28px" : size <= 5 ? "24px" : "20px";
        button.disabled = !myTurn || !!game.data.board[i] || !!game.winner;
        button.onclick = async () => {
            const copy = JSON.parse(JSON.stringify(game));
            const idx = copy.turnIndex % copy.players.length;
            const symbol = symbols[idx];
            copy.data.board[i] = symbol;
            
            if (checkTTTWin(copy.data.board, size, i, symbol, winCount)) {
                copy.winner = current.username;
                copy.status = "finished";
            } else if (copy.data.board.every(c => c)) {
                copy.winner = "draw";
                copy.status = "finished";
            } else {
                copy.turnIndex++;
            }
            await publishGameAndCleanup(game, copy);
        };
        board.appendChild(button);
    }
    return board;
}

function checkTTTWin(board, size, pos, symbol, winCount){
    const row = Math.floor(pos / size);
    const col = pos % size;
    
    const dirs = [[1,0],[0,1],[1,1],[1,-1]];
    for (const [dr, dc] of dirs) {
        let count = 1;
        for (const dir of [-1,1]) {
            let r = row + dr * dir, c = col + dc * dir;
            while (r >= 0 && r < size && c >= 0 && c < size && board[r * size + c] === symbol) {
                count++;
                r += dr * dir;
                c += dc * dir;
            }
        }
        if (count >= winCount) return true;
    }
    return false;
}

/* =====================================================
   MEMORY MATCH
===================================================== */

function createMemory(game){
    const area = document.createElement("div");
    const emojis = ["🍎","🍊","🍋","🍇","🍉","🍓","🍑","🍒","🥝","🍍","🥭","🍌","🍈","🫐","🍐","🥥","🧸","🎈","🎀","🎁","🌟","🌈","🦄","🐉","🐱","🐶","🐰","🦊","🐼","🐨"];
    
    const gridSize = game.data.settings?.gridSize || 4;
    const totalCards = gridSize * gridSize;
    const pairs = totalCards / 2;
    const usedEmojis = emojis.slice(0, pairs);
    let cards = [...usedEmojis, ...usedEmojis];
    
    if (!game.data.cards) {
        for (let i = cards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [cards[i], cards[j]] = [cards[j], cards[i]];
        }
        game.data.cards = cards;
        game.data.flipped = [];
        game.data.matched = [];
        game.data.scores = {};
    }

    const grid = document.createElement("div");
    grid.className = "memory-grid";
    grid.style.gridTemplateColumns = `repeat(${gridSize}, ${gridSize <= 4 ? 70 : 60}px)`;

    const mine = game.players.some(p => p.deviceId === deviceId);
    const current = game.players[game.turnIndex % game.players.length];
    const myTurn = mine && current && current.deviceId === deviceId;

    const flipped = game.data.flipped || [];
    const matched = game.data.matched || [];

    for (let i = 0; i < game.data.cards.length; i++) {
        const card = document.createElement("div");
        card.className = "memory-card";
        if (matched.includes(i)) {
            card.classList.add("matched");
            card.textContent = game.data.cards[i];
        } else if (flipped.includes(i)) {
            card.classList.add("flipped");
            card.textContent = game.data.cards[i];
        }
        
        if (!matched.includes(i) && myTurn && !flipped.includes(i) && flipped.length < 2) {
            card.onclick = async () => {
                const copy = JSON.parse(JSON.stringify(game));
                const flips = copy.data.flipped || [];
                if (flips.includes(i) || flips.length >= 2) return;
                flips.push(i);
                copy.data.flipped = flips;
                
                if (flips.length === 2) {
                    const cardsData = copy.data.cards;
                    if (cardsData[flips[0]] === cardsData[flips[1]]) {
                        copy.data.matched = (copy.data.matched || []).concat(flips);
                        copy.data.flipped = [];
                        copy.data.scores = copy.data.scores || {};
                        copy.data.scores[current.deviceId] = (copy.data.scores[current.deviceId] || 0) + 1;
                        if (copy.data.matched.length === copy.data.cards.length) {
                            // Find winner
                            let winner = null;
                            let max = -1;
                            for (const [id, score] of Object.entries(copy.data.scores)) {
                                if (score > max) {
                                    max = score;
                                    winner = copy.players.find(p => p.deviceId === id)?.username;
                                }
                            }
                            copy.winner = winner || "draw";
                            copy.status = "finished";
                        }
                    } else {
                        copy.turnIndex++;
                        setTimeout(async () => {
                            const resetCopy = JSON.parse(JSON.stringify(copy));
                            resetCopy.data.flipped = [];
                            await publishGameAndCleanup(game, resetCopy);
                        }, 800);
                        await publishGameAndCleanup(game, copy);
                        return;
                    }
                }
                await publishGameAndCleanup(game, copy);
            };
        }
        grid.appendChild(card);
    }
    area.appendChild(grid);

    // Score display
    const scoreDiv = document.createElement("div");
    scoreDiv.style.cssText = "text-align:center;margin-top:10px;color:#9da5b0;";
    const scores = game.data.scores || {};
    scoreDiv.textContent = game.players.map(p => 
        escapeHtml(p.username) + ": " + (scores[p.deviceId] || 0)
    ).join(" · ");
    area.appendChild(scoreDiv);

    return area;
}


/* =====================================================
   QUICK DRAW
===================================================== */

function createQuickDraw(game){
    const area = document.createElement("div");
    area.className = "quickdraw-area";

    const mine = game.players.some(p => p.deviceId === deviceId);
    const current = game.players[game.turnIndex % game.players.length];
    const myTurn = mine && current && current.deviceId === deviceId;

    const state = game.data.state || "waiting";
    const round = game.data.round || 0;
    const results = game.data.results || {};
    const totalRounds = game.data.settings?.rounds || 3;

    const box = document.createElement("div");
    box.className = "quickdraw-box " + state;

    if (state === "waiting") {
        box.textContent = "⏳ Round " + (round + 1) + "/" + totalRounds + "\nWaiting for " + (myTurn ? "you" : current.username);
        if (myTurn) {
            box.onclick = async () => {
                const copy = JSON.parse(JSON.stringify(game));
                copy.data.state = "countdown";
                copy.data.startTime = Date.now() + 1000 + Math.random() * 3000;
                copy.data.round = round;
                await publishGameAndCleanup(game, copy);
            };
        }
    } else if (state === "countdown") {
        const remaining = Math.max(0, (game.data.startTime - Date.now()) / 1000);
        box.textContent = "⏳ " + Math.ceil(remaining);
        if (remaining < 0.5 && myTurn) {
            setTimeout(async () => {
                const copy = JSON.parse(JSON.stringify(game));
                copy.data.state = "draw";
                copy.data.drawTime = Date.now();
                await publishGameAndCleanup(game, copy);
            }, Math.max(0, game.data.startTime - Date.now() + 100));
        }
    } else if (state === "draw") {
        box.textContent = "🟢 DRAW! CLICK!";
        box.style.cursor = "pointer";
        if (myTurn) {
            box.onclick = async () => {
                const reactionTime = Date.now() - game.data.drawTime;
                const copy = JSON.parse(JSON.stringify(game));
                copy.data.results = copy.data.results || {};
                copy.data.results[deviceId] = reactionTime;
                copy.turnIndex++;
                copy.data.round = (round + 1);
                
                if (copy.data.round >= totalRounds) {
                    // All done
                    let winner = null;
                    let best = Infinity;
                    // Find player with best average
                    const averages = {};
                    for (const player of copy.players) {
                        const times = [];
                        for (const [id, time] of Object.entries(copy.data.results || {})) {
                            if (id === player.deviceId) times.push(time);
                        }
                        if (times.length > 0) {
                            averages[player.deviceId] = times.reduce((a,b) => a+b, 0) / times.length;
                        }
                    }
                    for (const [id, avg] of Object.entries(averages)) {
                        if (avg < best) {
                            best = avg;
                            winner = copy.players.find(p => p.deviceId === id)?.username;
                        }
                    }
                    copy.winner = winner + " (" + Math.round(best) + "ms avg)";
                    copy.status = "finished";
                } else {
                    copy.data.state = "waiting";
                }
                await publishGameAndCleanup(game, copy);
            };
        } else {
            box.textContent = "🟢 Waiting for " + current.username + "...";
        }
    } else if (state === "punish") {
        box.textContent = "❌ Too early! Punished!";
        box.classList.add("punish");
        setTimeout(async () => {
            const copy = JSON.parse(JSON.stringify(game));
            copy.data.state = "waiting";
            copy.turnIndex++;
            await publishGameAndCleanup(game, copy);
        }, 1000);
    }

    area.appendChild(box);

    // Show results so far
    if (Object.keys(results).length > 0) {
        const resultsDiv = document.createElement("div");
        resultsDiv.style.cssText = "color:#9da5b0;margin-top:10px;font-size:13px;";
        const sorted = Object.entries(results).sort((a,b) => a[1] - b[1]);
        resultsDiv.innerHTML = sorted.map(([id, time]) => {
            const name = game.players.find(p => p.deviceId === id)?.username || "Unknown";
            return `<span style="margin:0 8px;">${escapeHtml(name)}: ${time}ms</span>`;
        }).join("");
        area.appendChild(resultsDiv);
    }

    return area;
}

            const copy = JSON.parse(JSON.stringify(game));
            copy.data.choices = copy.data.choices || {};
            copy.data.choices[deviceId] = choice;
            
            // If everyone has chosen, flip
            const allChosen = copy.players.every(p => copy.data.choices[p.deviceId]);

                copy.data.state = "flipping";
                const result = Math.random() < 0.5 ? "heads" : "tails";
                copy.data.coinResult = result;
                
                // Check winners
                for (const player of copy.players) {
                    if (copy.data.choices[player.deviceId] === result) {
                        copy.data.scores = copy.data.scores || {};
                        copy.data.scores[player.deviceId] = (copy.data.scores[player.deviceId] || 0) + 1;
                    }
                }
                
                // Check if anyone reached target
                let winner = null;
                for (const player of copy.players) {
                    if ((copy.data.scores[player.deviceId] || 0) >= targetScore) {
                        winner = player.username;
                        break;
                    }
                }
                
                if (winner) {
                    copy.winner = winner;
                    copy.status = "finished";
                } else {
                    // Reset for next round
                    copy.data.choices = {};
                    copy.data.coinResult = null;
                    copy.data.state = "waiting";
                    copy.turnIndex++;
                }
            }
            await publishGameAndCleanup(game, copy);
        };
        choiceDiv.appendChild(btn);
    });
    area.appendChild(choiceDiv);

    // Flip button (host only)
    if (game.hostDeviceId === deviceId && state !== "flipping") {
        const flipBtn = document.createElement("button");
        flipBtn.className = "game-btn primary";
        flipBtn.textContent = "🪙 Flip Coin";
        flipBtn.onclick = async () => {
            const copy = JSON.parse(JSON.stringify(game));
            // Force flip if everyone hasn't chosen
            const result = Math.random() < 0.5 ? "heads" : "tails";
            copy.data.coinResult = result;
            copy.data.state = "flipping";
            
            // Check winners for those who chose
            for (const player of copy.players) {
                if (copy.data.choices[player.deviceId] === result) {
                    copy.data.scores = copy.data.scores || {};
                    copy.data.scores[player.deviceId] = (copy.data.scores[player.deviceId] || 0) + 1;
                }
            }
            
            let winner = null;
            for (const player of copy.players) {
                if ((copy.data.scores[player.deviceId] || 0) >= targetScore) {
                    winner = player.username;
                    break;
                }
            }
            
            if (winner) {
                copy.winner = winner;
                copy.status = "finished";
            } else {
                copy.data.choices = {};
                copy.data.coinResult = null;
                copy.data.state = "waiting";
                copy.turnIndex++;
            }
            await publishGameAndCleanup(game, copy);
        };
        area.appendChild(flipBtn);
    }

    return area;
}

function createNumberGuess(game){

        win.textContent = "🎉 " + game.winner + " guessed it! The number was " + game.data.secretNumber;

    }

    if (!myTurn) {
        const waiting = document.createElement("div");
        waiting.className = "turn-banner";

        return area;

    area.appendChild(hint);

    const input = document.createElement("input");
    input.className = "numberguess-input";
    input.type = "number";
    input.min = 1;
    input.max = maxNumber;
    input.placeholder = "Guess...";
    input.autofocus = true;

    input.onkeydown = async (e) => {
        if (e.key === "Enter") {
            const guess = parseInt(input.value);
            if (isNaN(guess) || guess < 1 || guess > maxNumber) return;
            
            const copy = JSON.parse(JSON.stringify(game));
            const secret = copy.data.secretNumber;
            
            if (guess === secret) {
                copy.winner = current.username;
                copy.status = "finished";
            } else {
                copy.data.hint = guess < secret ? "⬆ Higher! (" + guess + ")" : "⬇ Lower! (" + guess + ")";
                copy.data.guesses = copy.data.guesses || [];
                copy.data.guesses.push({ player: current.username, guess });
                copy.turnIndex++;
            }
            input.value = "";
            await publishGameAndCleanup(game, copy);
        }
    };

    area.appendChild(input);

    // Previous guesses
    if (game.data.guesses && game.data.guesses.length > 0) {
        const guessesDiv = document.createElement("div");
        guessesDiv.style.cssText = "color:#6a7a8a;font-size:12px;margin-top:10px;";

        guessesDiv.textContent = "Recent: " + lastGuesses.map(g => g.player + "→" + g.guess).join(", ");
        area.appendChild(guessesDiv);
    }

    return area;
}

                        copy.data.results = copy.data.results || {};
                        copy.data.results[deviceId] = {
                            hits: copy.data.hits,
                            total: copy.data.total,
                            time: time,
                            accuracy: Math.round((copy.data.hits / copy.data.total) * 100)
                        };
                        copy.data.state = "done";
                        copy.turnIndex++;
                        
                        if (copy.turnIndex >= copy.players.length) {
                            // Find winner
                            let winner = null;
                            let bestScore = -1;
                            for (const [id, res] of Object.entries(copy.data.results)) {
                                const score = res.hits * 100 + (100 - res.time / 10);
                                if (score > bestScore) {
                                    bestScore = score;
                                    winner = copy.players.find(p => p.deviceId === id)?.username;
                                }
                            }
                            copy.winner = winner;
                            copy.status = "finished";
                        } else {
                            copy.data.state = "waiting";
                        }
                    } else {
                        spawnTarget(copy);
                    }
                    await publishGameAndCleanup(game, copy);
                };
            }
            box.appendChild(dot);
        }
    } else if (state === "done") {
        const res = results[deviceId];
        if (res) {
            box.innerHTML = `<div style="display:grid;place-items:center;height:100%;color:#7affb0;font-size:20px;">✅ Done!<br>Hits: ${res.hits}/${res.total}<br>Accuracy: ${res.accuracy}%<br>Time: ${(res.time/1000).toFixed(1)}s</div>`;
        } else {
            box.innerHTML = `<div style="display:grid;place-items:center;height:100%;color:#6a7a8a;font-size:20px;">⏳ Waiting for others...</div>`;
        }
    }

    area.appendChild(box);

    // Stats
    const stats = document.createElement("div");
    stats.className = "target-stats";
    const res = results[deviceId];
    stats.innerHTML = `
        <div>Hits: <strong>${hits}</strong></div>
        <div>Total: <strong>${total}</strong></div>
        <div>Accuracy: <strong>${total > 0 ? Math.round((hits/total)*100) : 0}%</strong></div>
    `;
    area.appendChild(stats);

    return area;
}

function spawnTarget(game) {
    const x = 10 + Math.random() * 80;
    const y = 10 + Math.random() * 80;
    game.data.targets = game.data.targets || [];
    game.data.targets.push({ x, y });
}


/* =====================================================
   REACTION TIME
===================================================== */

function createReaction(game){
    const area = document.createElement("div");
    area.className = "reaction-area";

    const mine = game.players.some(p => p.deviceId === deviceId);
    const current = game.players[game.turnIndex % game.players.length];
    const myTurn = mine && current && current.deviceId === deviceId;

    const state = game.data.state || "waiting";
    const startTime = game.data.startTime || 0;
    const results = game.data.results || {};

    const box = document.createElement("div");
    box.className = "reaction-box " + state;

    if (state === "waiting") {
        box.textContent = "⏳ Waiting for " + (myTurn ? "you" : current.username) + "...";
        if (myTurn) {
            box.onclick = async () => {
                const copy = JSON.parse(JSON.stringify(game));
                copy.data.state = "ready";
                copy.data.startTime = Date.now() + 1000 + Math.random() * 3000;
                await publishGameAndCleanup(game, copy);
            };
        }
    } else if (state === "ready") {
        const remaining = Math.max(0, (startTime - Date.now()) / 1000);
        box.textContent = "🟢 Get ready... " + remaining.toFixed(1) + "s";
        if (remaining < 0.5 && myTurn) {
            setTimeout(async () => {
                const copy = JSON.parse(JSON.stringify(game));
                copy.data.state = "go";
                copy.data.goTime = Date.now();
                await publishGameAndCleanup(game, copy);
            }, Math.max(0, startTime - Date.now() + 100));
        }
    } else if (state === "go") {
        box.textContent = "🟢 CLICK NOW!";
        box.style.cursor = "pointer";
        if (myTurn) {
            box.onclick = async () => {
                const reactionTime = Date.now() - game.data.goTime;
                const copy = JSON.parse(JSON.stringify(game));
                copy.data.results = copy.data.results || {};
                copy.data.results[deviceId] = reactionTime;
                copy.turnIndex++;
                if (copy.turnIndex >= copy.players.length) {
                    let winner = null;
                    let best = Infinity;
                    for (const [id, time] of Object.entries(copy.data.results)) {
                        if (time < best) {
                            best = time;
                            winner = copy.players.find(p => p.deviceId === id)?.username;
                        }
                    }
                    copy.winner = winner + " (" + best + "ms)";
                    copy.status = "finished";
                } else {
                    copy.data.state = "waiting";
                }
                await publishGameAndCleanup(game, copy);
            };
        } else {
            box.textContent = "🟢 Waiting for " + current.username + "...";
        }
    } else if (state === "done") {
        box.textContent = "✅ Done!";
        box.classList.add("done");
    }

    area.appendChild(box);

    if (Object.keys(results).length > 0) {
        const resultsDiv = document.createElement("div");
        resultsDiv.style.cssText = "color:#9da5b0;margin-top:10px;";
        const sorted = Object.entries(results).sort((a,b) => a[1] - b[1]);
        resultsDiv.innerHTML = sorted.map(([id, time]) => {
            const name = game.players.find(p => p.deviceId === id)?.username || "Unknown";
            return `<div>${escapeHtml(name)}: ${time}ms</div>`;
        }).join("");
        area.appendChild(resultsDiv);
    }

    return area;
}

}

    if (Math.random() < (game.data.critChance || 0)) {

    }
    const multiHits = game.data.multiHit || 1;
    const totalDisplayDamage = displayDamage * multiHits;
    
    attackBtn.textContent = `⚔️ ATTACK! (${totalDisplayDamage.toLocaleString()} dmg)`;
    
    attackBtn.onclick = async () => {
        const copy = JSON.parse(JSON.stringify(game));
        let dmg = copy.data.damage || 1;
        
        let crit = 1;
        if (Math.random() < (copy.data.critChance || 0)) {
            crit = 2;
        }
        
        const multi = copy.data.multiHit || 1;
        const totalDmg = Math.floor(dmg * crit * multi);
        
        copy.data.bossHealth = Math.max(0, copy.data.bossHealth - totalDmg);
        copy.data.totalDamageDealt = copy.data.totalDamageDealt || {};
        copy.data.totalDamageDealt[deviceId] = (copy.data.totalDamageDealt[deviceId] || 0) + totalDmg;

        }
        
        await publishGameAndCleanup(game, copy);
    };
    area.appendChild(attackBtn);

    const dmgDisplay = document.createElement("div");
    dmgDisplay.className = "boss-damage-display";
    dmgDisplay.textContent = "⚔️ " + damage.toLocaleString() + " base damage";
    area.appendChild(dmgDisplay);

    const upgradesDiv = document.createElement("div");
    upgradesDiv.className = "boss-upgrades";

    dmgUpgrade.innerHTML = `⚔️ +20% Damage <span class="cost">(${upgradeCosts.damage} pts)</span>`;
    dmgUpgrade.disabled = upgradePoints < upgradeCosts.damage;
    dmgUpgrade.onclick = async () => {
        const copy = JSON.parse(JSON.stringify(game));
        copy.data.upgrades = copy.data.upgrades || {};
        copy.data.upgrades[deviceId] = (copy.data.upgrades[deviceId] || 0) - upgradeCosts.damage;
        copy.data.damage = Math.floor((copy.data.damage || 1) * 1.2);
        await publishGameAndCleanup(game, copy);
    };
    upgradesDiv.appendChild(dmgUpgrade);

    const critUpgrade = document.createElement("button");
    critUpgrade.className = "boss-upgrade-btn";
    critUpgrade.innerHTML = `💥 +10% Crit Chance <span class="cost">(${upgradeCosts.crit} pts)</span>`;
    critUpgrade.disabled = upgradePoints < upgradeCosts.crit;
    critUpgrade.onclick = async () => {
        const copy = JSON.parse(JSON.stringify(game));
        copy.data.upgrades = copy.data.upgrades || {};
        copy.data.upgrades[deviceId] = (copy.data.upgrades[deviceId] || 0) - upgradeCosts.crit;
        copy.data.critChance = Math.min(1, (copy.data.critChance || 0) + 0.1);
        await publishGameAndCleanup(game, copy);
    };
    upgradesDiv.appendChild(critUpgrade);

    multiUpgrade.className = "boss-upgrade-btn";

        copy.data.upgrades[deviceId] = (copy.data.upgrades[deviceId] || 0) - upgradeCosts.multi;
        copy.data.multiHit = (copy.data.multiHit || 1) + 1;
        await publishGameAndCleanup(game, copy);
    };
    upgradesDiv.appendChild(multiUpgrade);

    area.appendChild(upgradesDiv);

    return area;
}


/* =====================================================

===================================================== */

async function joinGame(game){
    if (game.status !== "lobby") return;
    if (game.players.some(p => p.deviceId === deviceId)) return;
    if (game.players.length >= game.maxPlayers) return;
    
    const copy = JSON.parse(JSON.stringify(game));
    copy.players.push({ deviceId, username: settings.username });
    await writeGameState(copy);
    await loadMessages();
}

async function leaveGame(game){
    const copy = JSON.parse(JSON.stringify(game));
    copy.players = copy.players.filter(p => p.deviceId !== deviceId);
    
    if (copy.players.length === 0) {
        await removeGameMessages(game);
        await loadMessages();
        return;
    }
    
    if (game.hostDeviceId === deviceId) {
        const newHost = copy.players[0];
        copy.host = newHost.username;
        copy.hostDeviceId = newHost.deviceId;
    }
    
    if (copy.status === "playing" && copy.turnIndex >= copy.players.length) {
        copy.turnIndex = 0;
    }
    
    await writeGameState(copy);
    await deleteStateMessage(game);
    await loadMessages();
}

async function startGame(game){
    if (game.hostDeviceId !== deviceId) return;
    if (game.players.length < GAME_TYPES[game.gameType].min) return;
    
    const copy = JSON.parse(JSON.stringify(game));
    copy.status = "playing";
    copy.turnIndex = 0;
    
    // Initialize game data
    const settings = copy.data.settings || {};
    
    if (copy.gameType === "ttt3" || copy.gameType === "ttt4" || copy.gameType === "ttt5" || copy.gameType === "ttt6") {
        const size = settings.boardSize || 3;
        copy.data.board = Array(size * size).fill("");
    }
    if (copy.gameType === "ttt3p") {
        copy.data.board = Array(16).fill("");
    }
    if (copy.gameType === "memory") {
        const gridSize = settings.gridSize || 4;
        const emojis = ["🍎","🍊","🍋","🍇","🍉","🍓","🍑","🍒","🥝","🍍","🥭","🍌","🍈","🫐","🍐","🥥","🧸","🎈","🎀","🎁","🌟","🌈","🦄","🐉","🐱","🐶","🐰","🦊","🐼","🐨"];
        const pairs = (gridSize * gridSize) / 2;
        let cards = [...emojis.slice(0, pairs), ...emojis.slice(0, pairs)];
        for (let i = cards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [cards[i], cards[j]] = [cards[j], cards[i]];
        }
        copy.data.cards = cards;
        copy.data.flipped = [];
        copy.data.matched = [];
        copy.data.scores = {};
    }
    if (copy.gameType === "quickdraw") {
        copy.data.state = "waiting";
        copy.data.round = 0;
        copy.data.results = {};
        copy.data.startTime = 0;
        copy.data.drawTime = 0;
    }
    if (copy.gameType === "coinflip") {
        copy.data.state = "waiting";
        copy.data.choices = {};
        copy.data.scores = {};
        copy.data.coinResult = null;
    }
    if (copy.gameType === "numberguess") {
        const maxNum = settings.maxNumber || 100;
        copy.data.secretNumber = Math.floor(Math.random() * maxNum) + 1;
        copy.data.guesses = [];
        copy.data.hint = "🔢 Guess a number between 1 and " + maxNum;
    }
    if (copy.gameType === "target") {
        copy.data.state = "waiting";
        copy.data.hits = 0;
        copy.data.total = 0;
        copy.data.startTime = 0;
        copy.data.results = {};
        copy.data.targets = [];
        copy.data.targetIndex = 0;
        copy.data.totalTargets = settings.targets || 5;
    }
    if (copy.gameType === "reaction") {
        copy.data.state = "waiting";
        copy.data.startTime = 0;
        copy.data.results = {};
        copy.data.goTime = 0;
    }
    if (copy.gameType === "type") {
        const sentences = [
            "The quick brown fox jumps over the lazy dog.",
            "Pack my box with five dozen liquor jugs.",
            "How vexingly quick daft zebras jump.",
            "The five boxing wizards jump quickly.",
            "Jazz and swing fans like fast music.",
            "Crazy Fredericka bought many very exquisite opal jewels.",
            "We promptly judged antique ivory buckles for the next prize."
        ];
        copy.data.sentence = sentences[Math.floor(Math.random() * sentences.length)];
        copy.data.startTime = 0;
        copy.data.results = {};
        copy.data.done = false;
    }
    if (copy.gameType === "boss") {
        const maxHealth = settings.bossHealth || 100000000;
        copy.data.bossHealth = maxHealth;
        copy.data.maxHealth = maxHealth;
        copy.data.damage = 1;
        copy.data.upgrades = {};
        copy.data.totalDamageDealt = {};
        copy.data.bossDefeated = false;
        copy.data.critChance = 0;
        copy.data.multiHit = 1;
        const names = ["Cthulhu", "Mega Dragon", "Shadow Lord", "Void Beast", "Eldritch Horror", "Demon King"];
        copy.data.monsterName = names[Math.floor(Math.random() * names.length)];
    }
    
    await publishGameAndCleanup(game, copy);
}

async function forceQuitGame(game){
    if (game.hostDeviceId !== deviceId) return;
    try {
        await removeGameMessages(game);
        await loadMessages();
    } catch(error) {
        alert("Could not remove game:\n\n" + error.message);
    }
}

async function publishGameAndCleanup(oldGame, newGame){
    if (newGame.status === "finished") {
        await removeGameMessages(oldGame);
        await loadMessages();
        return;
    }
    
    await writeGameState(newGame);
    
    if (oldGame.messageId) {
        try {
            await apiDelete({ id: oldGame.messageId, device_id: oldGame.hostDeviceId });
        } catch {}
    }
    
    await loadMessages();
}

async function removeGameMessages(game){
    const gameMessages = currentMessages.filter(message => {
        if (!isGameMessage(message)) return false;
        const state = parseGameMessage(message);
        return state && state.id === game.id;
    });
    
    for (const message of gameMessages) {
        try {
            await apiDelete({ id: message.id, device_id: game.hostDeviceId });
        } catch {}
    }
}

async function deleteStateMessage(game){
    if (!game.messageId) return;
    try {
        await apiDelete({ id: game.messageId, device_id: game.hostDeviceId });
    } catch {}
}

    confirmCallback = null;
    if (callback) {
        try { await callback(); } 
        catch(error) { alert(error.message); }
    }
};


/* =====================================================
   REMOVE EVERYTHING
===================================================== */

removeEverything.onclick = () => {
    openConfirm("Remove everything?", "This permanently removes every message from the chat.", async () => {
        try {
            await apiDelete({ delete_all: true });
            currentMessages = [];
            games = [];
            renderedElements.clear();
            seenMessageIds.clear();
            seenGameIds.clear();
            renderMessages();
        } catch(error) {
            alert("Failed to wipe chat:\n\n" + error.message);
        }
    });
};


/* =====================================================
   HELPERS
===================================================== */

function formatTime(date){
    if (!date) return "";
    return new Date(date).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function escapeHtml(value){
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =====================================================
   START
===================================================== */

loadSettingsUI();
applySettings();
loadMessages();
