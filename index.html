<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Game Chat</title>

<style>
*{
    box-sizing:border-box;
}

:root{
    --bg:#080a0d;
    --sidebar:#0d1014;
    --panel:#11151a;
    --panel2:#171c22;
    --panel3:#1d232b;
    --bubble:#171c22;
    --bubbleMine:#20262e;
    --border:#272e37;
    --border2:#333b46;
    --text:#f2f4f7;
    --text2:#c8ced6;
    --muted:#7f8995;
    --accent:#e9edf2;
    --accentText:#111318;
    --success:#6fe0a0;
    --danger:#ff7777;
    --warning:#e7c86b;

    --radius:12px;
    --ui-scale:1;
    --text-size:16px;
    --word-spacing:0px;
    --line-spacing:1.45;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

body{
    overflow:hidden;
    font-size:calc(16px * var(--ui-scale));
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible{
    outline:2px solid var(--border2);
    outline-offset:2px;
}

/* =========================================================
   APP
========================================================= */

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:
        radial-gradient(
            circle at 50% -20%,
            #ffffff05,
            transparent 45%
        ),
        var(--bg);
}

/* =========================================================
   HEADER
========================================================= */

.header{
    height:64px;
    min-height:64px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    background:#0c0f13eF;
    border-bottom:1px solid var(--border);

    backdrop-filter:blur(16px);

    position:relative;
    z-index:5;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
    min-width:0;
}

.brand-icon{
    width:38px;
    height:38px;

    display:grid;
    place-items:center;

    border-radius:11px;

    background:var(--panel2);
    border:1px solid var(--border);

    font-size:19px;

    box-shadow:
        inset 0 1px #ffffff06,
        0 5px 20px #0004;
}

.brand-text{
    min-width:0;
}

.brand-name{
    font-size:15px;
    font-weight:800;
    letter-spacing:-.2px;
}

.brand-channel{
    color:var(--muted);
    font-size:12px;
    margin-top:1px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:7px;
}

.connection{
    display:flex;
    align-items:center;
    gap:7px;

    color:var(--muted);
    font-size:11px;

    margin-right:4px;
}

.connection-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--success);
    box-shadow:0 0 10px #6fe0a077;
}

.connection-dot.offline{
    background:var(--danger);
    box-shadow:0 0 10px #ff777777;
}

.icon-btn{
    width:38px;
    height:38px;

    border-radius:10px;

    border:1px solid var(--border);
    background:var(--panel2);

    color:var(--text);

    display:grid;
    place-items:center;

    transition:
        background .15s,
        border-color .15s,
        transform .15s;
}

.icon-btn:hover{
    background:var(--panel3);
    border-color:var(--border2);
}

.icon-btn:active{
    transform:scale(.96);
}

/* =========================================================
   CHAT
========================================================= */

.messages{
    flex:1;
    overflow-y:auto;

    padding:
        22px
        max(18px,calc((100vw - 1100px)/2));

    scroll-behavior:smooth;
}

.messages::-webkit-scrollbar{
    width:8px;
}

.messages::-webkit-scrollbar-track{
    background:transparent;
}

.messages::-webkit-scrollbar-thumb{
    background:#ffffff14;
    border-radius:20px;
}

.messages::-webkit-scrollbar-thumb:hover{
    background:#ffffff22;
}

/* =========================================================
   MESSAGE
========================================================= */

.message{
    display:flex;
    gap:10px;

    margin:0 auto 10px;

    max-width:900px;

    animation:
        messageIn .18s ease-out;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(4px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.avatar{
    flex:0 0 34px;

    width:34px;
    height:34px;

    margin-top:2px;

    display:grid;
    place-items:center;

    border-radius:10px;

    background:var(--panel2);
    border:1px solid var(--border);

    color:var(--text2);

    font-size:12px;
    font-weight:800;
}

.message-content{
    min-width:0;
    max-width:calc(100% - 45px);
}

.message-bubble{
    width:fit-content;
    max-width:100%;

    padding:9px 12px 10px;

    background:var(--bubble);

    border:1px solid var(--border);

    border-radius:
        4px
        var(--radius)
        var(--radius)
        var(--radius);

    box-shadow:
        0 3px 14px #0002;

    position:relative;
}

.message.mine .message-bubble{
    background:var(--bubbleMine);
}

.message-top{
    display:flex;
    align-items:center;
    gap:7px;

    margin-bottom:3px;

    line-height:1;
}

.username{
    font-size:12px;
    font-weight:800;
}

.time{
    color:var(--muted);
    font-size:10px;
}

.edited{
    color:var(--muted);
    font-size:9px;
}

.message-text{
    color:var(--text2);

    font-size:var(--text-size);

    white-space:pre-wrap;
    overflow-wrap:anywhere;

    word-spacing:var(--word-spacing);
    line-height:var(--line-spacing);
}

.message-image{
    display:block;

    max-width:min(520px,70vw);
    max-height:420px;

    margin-top:8px;

    border-radius:10px;

    border:1px solid var(--border);

    object-fit:contain;
}

.message-actions{
    display:none;

    position:absolute;

    right:7px;
    top:-15px;

    padding:3px;

    background:var(--panel3);

    border:1px solid var(--border);

    border-radius:8px;

    box-shadow:0 8px 20px #0006;
}

.message:hover .message-actions{
    display:flex;
}

.message-action{
    border:0;
    background:transparent;
    color:var(--muted);

    width:26px;
    height:25px;

    border-radius:6px;
}

.message-action:hover{
    background:#ffffff08;
    color:var(--text);
}

.message-action.delete:hover{
    color:var(--danger);
}

/* =========================================================
   DATE / EMPTY
========================================================= */

.date-divider{
    max-width:900px;
    margin:18px auto;

    display:flex;
    align-items:center;
    gap:10px;

    color:var(--muted);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.08em;
}

.date-divider::before,
.date-divider::after{
    content:"";
    height:1px;
    flex:1;
    background:var(--border);
}

.empty{
    height:100%;

    display:grid;
    place-items:center;

    color:var(--muted);

    text-align:center;
}

.empty-icon{
    width:58px;
    height:58px;

    margin:0 auto 12px;

    display:grid;
    place-items:center;

    border-radius:16px;

    background:var(--panel2);
    border:1px solid var(--border);

    font-size:25px;
}

.empty strong{
    display:block;
    color:var(--text);
    font-size:15px;
    margin-bottom:4px;
}

.empty span{
    font-size:12px;
}

/* =========================================================
   GAME CARD
========================================================= */

.game-message{
    max-width:900px;
    margin:15px auto;
}

.game-card{
    overflow:hidden;

    border:1px solid var(--border);

    border-radius:16px;

    background:
        linear-gradient(
            145deg,
            var(--panel2),
            var(--panel)
        );

    box-shadow:
        0 12px 40px #0004;
}

.game-header{
    padding:15px 17px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:1px solid var(--border);
}

.game-title{
    display:flex;
    align-items:center;
    gap:9px;

    font-size:15px;
    font-weight:800;
}

.game-icon{
    width:34px;
    height:34px;

    display:grid;
    place-items:center;

    border-radius:10px;

    background:#ffffff07;
    border:1px solid var(--border);
}

.game-status{
    padding:5px 9px;

    border-radius:999px;

    background:#ffffff08;
    border:1px solid var(--border);

    color:var(--muted);

    font-size:10px;
}

.game-body{
    padding:17px;
}

.game-info{
    display:flex;
    flex-wrap:wrap;
    gap:6px;

    margin-bottom:12px;
}

.game-pill{
    padding:5px 8px;

    border-radius:7px;

    background:#ffffff05;
    border:1px solid var(--border);

    color:var(--muted);

    font-size:10px;
}

.game-pill strong{
    color:var(--text2);
}

.game-description{
    color:var(--muted);
    font-size:13px;
    line-height:1.5;

    margin-bottom:14px;
}

.game-actions{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.game-btn{
    border:1px solid var(--border);

    border-radius:9px;

    padding:9px 13px;

    background:var(--panel3);

    color:var(--text);

    font-size:12px;
    font-weight:700;

    transition:.15s;
}

.game-btn:hover{
    background:#ffffff0b;
    border-color:var(--border2);
    transform:translateY(-1px);
}

.game-btn.primary{
    background:var(--accent);
    color:var(--accentText);
    border-color:transparent;
}

.game-btn.green{
    background:#143022;
    color:#88e9ae;
    border-color:#28573c;
}

.game-btn.danger{
    background:#32191d;
    color:#ff9292;
    border-color:#653038;
}

.game-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
    transform:none;
}

/* =========================================================
   PLAYERS
========================================================= */

.players-list{
    display:flex;
    flex-wrap:wrap;
    gap:6px;

    margin:12px 0;
}

.player-chip{
    padding:6px 9px;

    border-radius:8px;

    background:#ffffff05;
    border:1px solid var(--border);

    color:var(--text2);

    font-size:10px;
}

.player-chip.host{
    color:var(--warning);
    border-color:#66582d;
}

.turn-banner{
    margin:10px 0;
    padding:9px 11px;

    border-radius:9px;

    background:#ffffff04;
    border:1px solid var(--border);

    color:var(--muted);

    font-size:12px;
}

.turn-banner strong{
    color:var(--text);
}

/* =========================================================
   TIC TAC TOE
========================================================= */

.ttt{
    display:grid;

    gap:5px;

    width:min(330px,90vw);

    margin:15px auto;
}

.ttt button{
    aspect-ratio:1;

    border-radius:8px;

    border:1px solid var(--border);

    background:#0f1318;

    color:var(--text);

    font-size:20px;
    font-weight:900;

    transition:.12s;
}

.ttt button:hover:not(:disabled){
    background:#ffffff09;
    border-color:var(--border2);
}

.ttt button:disabled{
    cursor:default;
}

/* =========================================================
   REACTION
========================================================= */

.reaction-area{
    text-align:center;
    padding:8px;
}

.reaction-box{
    width:min(220px,65vw);
    aspect-ratio:1;

    margin:15px auto;

    border-radius:18px;

    border:2px solid var(--border);

    display:grid;
    place-items:center;

    font-size:20px;
    font-weight:800;

    cursor:pointer;

    background:#151a20;
    color:var(--muted);

    user-select:none;

    transition:
        background .2s,
        border .2s,
        transform .1s;
}

.reaction-box:hover{
    transform:scale(1.01);
}

.reaction-box.waiting{
    background:#151a20;
}

.reaction-box.ready{
    background:#163724;
    border-color:#347452;
    color:#7ff0a8;
}

.reaction-box.go{
    background:#35191c;
    border-color:#71343a;
    color:#ff8585;
}

.reaction-box.done{
    background:#20213b;
    border-color:#44477b;
    color:#aaaaff;
}

/* =========================================================
   TYPE GAME
========================================================= */

.type-area{
    text-align:center;
    padding:8px;
}

.type-sentence{
    font-size:20px;
    font-weight:700;

    color:var(--text);

    padding:17px;

    background:#ffffff04;

    border-radius:11px;
    border:1px solid var(--border);

    margin:10px auto;

    max-width:650px;

    word-break:break-word;
}

.type-input{
    width:100%;
    max-width:550px;

    padding:11px 13px;

    border-radius:9px;

    border:1px solid var(--border);

    background:#0d1116;

    color:white;

    font-size:16px;

    text-align:center;
}

.type-input:focus{
    outline:none;
    border-color:var(--border2);
}

.type-stats{
    display:flex;
    justify-content:center;
    gap:20px;

    margin:10px 0;

    color:var(--muted);

    font-size:12px;
}

.type-stats strong{
    color:var(--text);
}

/* =========================================================
   BOSS
========================================================= */

.boss-area{
    text-align:center;
    padding:8px;
}

.boss-monster-name{
    font-size:25px;
    font-weight:900;

    color:#ff6680;

    margin:3px 0;
}

.boss-health-bar{
    width:100%;
    max-width:550px;

    height:26px;

    margin:12px auto;

    background:#171719;

    border-radius:99px;

    border:1px solid var(--border);

    overflow:hidden;

    position:relative;
}

.boss-health-fill{
    height:100%;

    background:linear-gradient(
        90deg,
        #d43c4d,
        #ff7147
    );

    transition:width .3s;

    width:100%;
}

.boss-health-text{
    position:absolute;
    inset:0;

    display:grid;
    place-items:center;

    font-size:11px;
    font-weight:800;

    color:white;
}

.boss-stats{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;

    margin:9px;

    color:var(--muted);

    font-size:11px;
}

.boss-stats strong{
    color:var(--text);
}

.boss-damage-display{
    font-size:28px;
    font-weight:900;

    color:#ff7147;

    margin:5px;
}

.boss-upgrades{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:7px;

    margin:10px 0;
}

.boss-upgrade-btn{
    padding:7px 11px;

    border-radius:8px;

    border:1px solid var(--border);

    background:var(--panel3);

    color:var(--text);

    font-size:10px;
}

.boss-upgrade-btn:hover:not(:disabled){
    background:#ffffff0a;
}

.boss-upgrade-btn:disabled{
    opacity:.35;
}

.boss-upgrade-btn .cost{
    color:var(--warning);
}

/* =========================================================
   COMPOSER
========================================================= */

.composer{
    padding:
        10px
        max(16px,calc((100vw - 1100px)/2))
        14px;

    background:#0b0e12E8;

    border-top:1px solid var(--border);

    backdrop-filter:blur(18px);
}

.composer-box{
    max-width:900px;

    margin:auto;

    display:flex;
    align-items:flex-end;
    gap:7px;

    padding:6px;

    background:var(--panel);

    border:1px solid var(--border);

    border-radius:14px;

    box-shadow:
        0 8px 30px #0003;
}

textarea{
    flex:1;

    min-height:40px;
    max-height:150px;

    resize:none;

    border:0;
    outline:none;

    background:transparent;

    color:var(--text);

    padding:10px;

    line-height:1.4;
}

textarea::placeholder{
    color:#68727e;
}

.send-btn{
    height:40px;

    border:0;

    border-radius:9px;

    padding:0 17px;

    background:var(--accent);
    color:var(--accentText);

    font-weight:800;

    transition:.15s;
}

.send-btn:hover:not(:disabled){
    filter:brightness(1.08);
    transform:translateY(-1px);
}

.send-btn:disabled{
    opacity:.35;
}

/* =========================================================
   OVERLAYS
========================================================= */

.overlay{
    position:fixed;
    inset:0;

    display:none;
    align-items:center;
    justify-content:center;

    padding:15px;

    background:#000b;

    backdrop-filter:blur(8px);

    z-index:100;
}

.overlay.show{
    display:flex;
}

.panel{
    width:min(650px,100%);

    max-height:calc(100vh - 30px);

    overflow:auto;

    background:var(--panel);

    border:1px solid var(--border);

    border-radius:16px;

    box-shadow:
        0 30px 100px #000b;

    animation:
        panelIn .18s ease-out;
}

@keyframes panelIn{
    from{
        opacity:0;
        transform:translateY(8px) scale(.98);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.panel::-webkit-scrollbar{
    width:7px;
}

.panel::-webkit-scrollbar-thumb{
    background:#ffffff14;
    border-radius:20px;
}

.panel-header{
    min-height:60px;

    padding:13px 15px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:1px solid var(--border);
}

.panel-header h2{
    margin:0;

    font-size:17px;
}

.panel-body{
    padding:15px;
}

/* =========================================================
   CATEGORIES
========================================================= */

.category{
    margin-bottom:8px;

    border:1px solid var(--border);

    border-radius:11px;

    overflow:hidden;

    background:var(--panel2);
}

.category-title{
    width:100%;

    padding:12px 13px;

    border:0;

    background:transparent;

    color:var(--text);

    display:flex;
    justify-content:space-between;

    font-size:13px;
    font-weight:750;

    text-align:left;
}

.category-title:hover{
    background:#ffffff04;
}

.category-body{
    display:none;

    padding:0 13px 13px;
}

.category.open .category-body{
    display:block;
}

.setting{
    margin-top:13px;
}

.setting label{
    display:block;

    margin-bottom:6px;

    color:var(--text2);

    font-size:11px;
    font-weight:600;
}

.setting input,
.setting select{
    width:100%;

    padding:9px 10px;

    border:1px solid var(--border);

    border-radius:8px;

    outline:none;

    background:#0e1217;

    color:var(--text);

    font-size:12px;
}

.setting input:focus,
.setting select:focus{
    border-color:var(--border2);
}

.setting input[type=range]{
    padding:0;
}

.setting-value{
    color:var(--muted);

    font-size:10px;

    margin-top:5px;
}

.save-btn{
    width:100%;

    margin-top:8px;

    padding:11px;

    border:0;

    border-radius:9px;

    background:var(--accent);

    color:var(--accentText);

    font-weight:800;
}

/* =========================================================
   GAME CREATOR
========================================================= */

.game-grid{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:8px;
}

.game-choice{
    min-height:85px;

    padding:12px;

    text-align:left;

    border-radius:11px;

    border:1px solid var(--border);

    background:#151a20;

    color:var(--text);

    transition:.15s;
}

.game-choice:hover{
    background:#1b2128;
    border-color:var(--border2);
    transform:translateY(-1px);
}

.game-choice strong{
    display:block;

    margin-bottom:4px;

    font-size:13px;
}

.game-choice span{
    color:var(--muted);

    font-size:10px;

    line-height:1.35;
}

.game-players{
    display:inline-block;

    background:#ffffff07;

    padding:3px 7px;

    border-radius:6px;

    color:var(--muted);

    font-size:9px;

    margin-top:6px;
}

/* =========================================================
   DANGER
========================================================= */

.danger-zone{
    margin-top:17px;

    padding-top:17px;

    border-top:1px solid #49262b;
}

.danger-title{
    color:var(--danger);

    font-weight:750;

    font-size:12px;

    margin-bottom:5px;
}

.danger-zone p{
    color:var(--muted);

    line-height:1.5;

    font-size:11px;
}

.danger-btn{
    width:100%;

    padding:10px;

    border-radius:9px;

    border:1px solid #673139;

    background:#24171a;

    color:#ff8585;

    font-weight:700;

    font-size:12px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .header{
        padding:0 10px;
    }

    .connection{
        display:none;
    }

    .messages{
        padding:
            15px
            10px;
    }

    .composer{
        padding:
            8px
            9px
            10px;
    }

    .message{
        gap:8px;
    }

    .avatar{
        flex-basis:31px;
        width:31px;
        height:31px;
    }

<script>

/* =========================================================
   API
========================================================= */

const API_URL="/api/messages";
const CHANNEL="general";

const GAME_SERVER="__GAME_SERVER__";


/* =========================================================
   DEVICE ID
========================================================= */

let deviceId=
    localStorage.getItem("chat_device_id");

if(!deviceId){

    if(
        window.crypto &&
        crypto.randomUUID
    ){
        deviceId=
            crypto.randomUUID();
    }else{
        deviceId=
            Date.now().toString(36)+
            Math.random()
                .toString(36)
                .slice(2);
    }

    localStorage.setItem(
        "chat_device_id",
        deviceId
    );
}


/* =========================================================
   SETTINGS
========================================================= */

const defaults={

    username:"",

    refreshRate:500,

    showTimestamps:true,

    textSize:16,

    wordSpacing:0,

    lineSpacing:1.45,

    cornerRadius:12,

    uiScale:1,

    theme:"dark",

    enterToSend:true,

    autoScroll:true
};


function getSetting(key){

    const value=
        localStorage.getItem(
            "chat_"+key
        );

    if(value===null){
        return defaults[key];
    }

    if(
        value==="true" ||
        value==="false"
    ){
        return value==="true";
    }

    const number=Number(value);

    return Number.isNaN(number)
        ?value
        :number;
}


let settings={};

Object.keys(defaults).forEach(key=>{

    settings[key]=
        getSetting(key);

});


/* =========================================================
   ELEMENTS
========================================================= */

const messagesEl=
    document.getElementById(
        "messages"
    );

const messageInput=
    document.getElementById(
        "messageInput"
    );

const sendBtn=
    document.getElementById(
        "sendBtn"
    );

const gamesBtn=
    document.getElementById(
        "gamesBtn"
    );

const gamesOverlay=
    document.getElementById(
        "gamesOverlay"
    );

const closeGames=
    document.getElementById(
        "closeGames"
    );

const settingsBtn=
    document.getElementById(
        "settingsBtn"
    );

const settingsOverlay=
    document.getElementById(
        "settingsOverlay"
    );

const closeSettings=
    document.getElementById(
        "closeSettings"
    );

const saveSettings=
    document.getElementById(
        "saveSettings"
    );

const usernameInput=
    document.getElementById(
        "usernameInput"
    );

const deviceIdInput=
    document.getElementById(
        "deviceIdInput"
    );

const refreshRate=
    document.getElementById(
        "refreshRate"
    );

const showTimestamps=
    document.getElementById(
        "showTimestamps"
    );

const themeSelect=
    document.getElementById(
        "themeSelect"
    );

const textSize=
    document.getElementById(
        "textSize"
    );

const wordSpacing=
    document.getElementById(
        "wordSpacing"
    );

const lineSpacing=
    document.getElementById(
        "lineSpacing"
    );

const cornerRadius=
    document.getElementById(
        "cornerRadius"
    );

const uiScale=
    document.getElementById(
        "uiScale"
    );

const enterToSend=
    document.getElementById(
        "enterToSend"
    );

const autoScroll=
    document.getElementById(
        "autoScroll"
    );

const textSizeValue=
    document.getElementById(
        "textSizeValue"
    );

const wordSpacingValue=
    document.getElementById(
        "wordSpacingValue"
    );

const lineSpacingValue=
    document.getElementById(
        "lineSpacingValue"
    );

const cornerRadiusValue=
    document.getElementById(
        "cornerRadiusValue"
    );

const uiScaleValue=
    document.getElementById(
        "uiScaleValue"
    );

const confirmOverlay=
    document.getElementById(
        "confirmOverlay"
    );

const confirmTitle=
    document.getElementById(
        "confirmTitle"
    );

const confirmText=
    document.getElementById(
        "confirmText"
    );

const confirmCancel=
    document.getElementById(
        "confirmCancel"
    );

const confirmYes=
    document.getElementById(
        "confirmYes"
    );

const removeEverything=
    document.getElementById(
        "removeEverything"
    );

const connectionDot=
    document.getElementById(
        "connectionDot"
    );

const connectionText=
    document.getElementById(
        "connectionText"
    );


/* =========================================================
   STATE
========================================================= */

let currentMessages=[];
let games=[];
let refreshTimer=null;
let syncing=false;
let confirmCallback=null;

let reactionTimers={};
let reactionStarted={};

let localGameInputs={};


/* =========================================================
   GAME TYPES
========================================================= */

const GAME_TYPES={

    ttt3:{
        name:"Tic-Tac-Toe 3×3",
        icon:"⭕",
        min:2,
        max:2,
        desc:"Classic 3×3. Get three in a row.",
        size:3
    },

    ttt4:{
        name:"Tic-Tac-Toe 4×4",
        icon:"⭕",
        min:2,
        max:2,
        desc:"4×4 board. Get four in a row.",
        size:4
    },

    ttt5:{
        name:"Tic-Tac-Toe 5×5",
        icon:"⭕",
        min:2,
        max:2,
        desc:"5×5 board. Get five in a row.",
        size:5
    },

    ttt6:{
        name:"Tic-Tac-Toe 6×6",
        icon:"⭕",
        min:2,
        max:2,
        desc:"6×6 board. Get six in a row.",
        size:6
    },

    reaction:{
        name:"Reaction Time",
        icon:"⚡",
        min:2,
        max:6,
        desc:"Wait for green and click instantly."
    },

    type:{
        name:"Type Sentence",
        icon:"⌨️",
        min:2,
        max:6,
        desc:"Type the sentence faster than everyone."
    },

    boss:{
        name:"Boss Battle",
        icon:"👹",
        min:2,
        max:6,
        desc:"Work together to defeat the boss."
    }
};


/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function initials(name){

    const parts=
        String(name || "?")
            .trim()
            .split(/\s+/)
            .filter(Boolean);

    if(!parts.length){
        return "?";
    }

    if(parts.length===1){
        return parts[0]
            .slice(0,2)
            .toUpperCase();
    }

    return (
        parts[0][0]+
        parts[1][0]
    ).toUpperCase();
}


function formatTime(date){

    return new Date(date)
        .toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );
}


function formatDate(date){

    return new Date(date)
        .toLocaleDateString(
            [],
            {
                weekday:"long",
                month:"short",
                day:"numeric"
            }
        );
}


function isNearBottom(){

    return (
        messagesEl.scrollHeight -
        messagesEl.scrollTop -
        messagesEl.clientHeight
    ) < 100;
}


function scrollBottom(){

    messagesEl.scrollTop=
        messagesEl.scrollHeight;
}


/* =========================================================
   CONNECTION
========================================================= */

function setConnection(ok){

    connectionDot.classList.toggle(
        "offline",
        !ok
    );

    connectionText.textContent=
        ok
            ?"Connected"
            :"Offline";
}


/* =========================================================
   API REQUEST
========================================================= */

async function apiRequest(
    method,
    body=null
){

    const options={
        method,
        headers:{
            "Content-Type":
                "application/json"
        }
    };

    if(body!==null){
        options.body=
            JSON.stringify(body);
    }

    const response=
        await fetch(
            API_URL+
            "?channel="+
            encodeURIComponent(
                CHANNEL
            ),
            options
        );

    let data={};

    try{
        data=
            await response.json();
    }catch{
        data={};
    }

    if(!response.ok){

        throw new Error(
            data.error ||
            "Server request failed."
        );

    }

    return data;
}


/* =========================================================
   LOAD MESSAGES
========================================================= */

async function sync(){

    if(syncing){
        return;
    }

    syncing=true;

    try{

        const data=
            await apiRequest(
                "GET"
            );

        currentMessages=
            Array.isArray(data.messages)
                ?data.messages
                :[];

        setConnection(true);

        renderMessages();

    }catch(error){

        console.error(error);

        setConnection(false);

    }finally{

        syncing=false;

    }
}


/* =========================================================
   RENDER
========================================================= */

function renderMessages(){

    const shouldScroll=
        settings.autoScroll &&
        isNearBottom();

    if(!currentMessages.length){

        messagesEl.innerHTML=`

            <div class="empty">

                <div>

                    <div class="empty-icon">
                        💬
                    </div>

                    <strong>
                        No messages yet
                    </strong>

                    <span>
                        Be the first person to say something.
                    </span>

                </div>

            </div>

        `;

        return;
    }


    const normal=
        currentMessages.filter(
            m=>
                m.username !==
                GAME_SERVER
        );


    const gameMessages=
        currentMessages.filter(
            m=>
                m.username ===
                GAME_SERVER
        );


    games=
        gameMessages
            .map(parseGame)
            .filter(Boolean);


    let html="";

    let lastDate="";


    normal.forEach(message=>{

        const dateKey=
            new Date(
                message.created_at
            ).toDateString();


        if(dateKey!==lastDate){

            html+=`

                <div class="date-divider">
                    ${escapeHTML(
                        formatDate(
                            message.created_at
                        )
                    )}
                </div>

            `;

            lastDate=dateKey;

        }


        html+=renderMessage(
            message
        );

    });


    games.forEach(game=>{

        html+=renderGame(
            game
        );

    });


    messagesEl.innerHTML=
        html ||
        `
            <div class="empty">
                <div>
                    <div class="empty-icon">
                        💬
                    </div>
                    <strong>
                        No messages yet
                    </strong>
                    <span>
                        Be the first person to say something.
                    </span>
                </div>
            </div>
        `;


    attachMessageEvents();
    attachGameEvents();


    if(shouldScroll){
        requestAnimationFrame(
            scrollBottom
        );
    }
}


/* =========================================================
   NORMAL MESSAGE
========================================================= */

function renderMessage(message){

    const mine=
        message.device_id ===
        deviceId;

    const username=
        escapeHTML(
            message.username ||
            "Unknown"
        );

    const text=
        escapeHTML(
            message.message ||
            ""
        );


    let image="";

    if(
        message.image &&
        typeof message.image==="string"
    ){

        image=`

            <img
                class="message-image"
                src="${escapeHTML(
                    message.image
                )}"
                alt="Image"
                loading="lazy"
            >

        `;

    }


    const time=
        settings.showTimestamps
            ?`
                <span class="time">
                    ${formatTime(
                        message.created_at
                    )}
                </span>
            `
            :"";


    const edited=
        message.edited
            ?`
                <span class="edited">
                    edited
                </span>
            `
            :"";


    const actions=
        mine
            ?`

                <div class="message-actions">

                    <button
                        class="message-action edit-message"
                        data-id="${escapeHTML(
                            message.id
                        )}"
                        title="Edit"
                    >
                        ✎
                    </button>

                    <button
                        class="message-action delete delete-message"
                        data-id="${escapeHTML(
                            message.id
                        )}"
                        title="Delete"
                    >
                        ×
                    </button>

                </div>

            `
            :"";


    return `

        <article
            class="message ${mine?"mine":""}"
        >

            <div class="avatar">
                ${escapeHTML(
                    initials(
                        message.username
                    )
                )}
            </div>

            <div class="message-content">

                <div class="message-bubble">

                    ${actions}

                    <div class="message-top">

                        <span class="username">
                            ${username}
                        </span>

                        ${time}

                        ${edited}

                    </div>

                    ${
                        text
                            ?`
                                <div class="message-text">
                                    ${text}
                                </div>
                            `
                            :""
                    }

                    ${image}

                </div>

            </div>

        </article>

    `;
}


/* =========================================================
   GAME STATE
========================================================= */

function parseGame(message){

    try{

        const data=
            JSON.parse(
                message.message
            );

        if(
            !data ||
            data.type!=="chat_game"
        ){
            return null;
        }

        data.serverId=
            message.id;

        return data;

    }catch{

        return null;

    }
}


function gameStateFor(game){

    return JSON.stringify(
        game
    );
}


/* =========================================================
   CREATE GAME
========================================================= */

async function createGame(type){

    const info=
        GAME_TYPES[type];

    if(!info){
        return;
    }


    const game={

        type:"chat_game",

        gameType:type,

        id:
            "game_"+

            Date.now()+"_"+

            Math.random()
                .toString(36)
                .slice(2,8),

        hostDevice:deviceId,

        hostName:
            settings.username ||
            "Player",

        players:[
            {
                deviceId,
                name:
                    settings.username ||
                    "Player"
            }
        ],

        status:"lobby",

        createdAt:
            new Date().toISOString()

    };


    if(type.startsWith("ttt")){

        const size=
            info.size;

        game.board=
            Array(
                size*size
            ).fill("");

        game.turn=0;
        game.winner="";
        game.started=false;

    }


    if(type==="reaction"){

        game.started=false;
        game.round=0;
        game.results={};
        game.goAt=0;

    }


    if(type==="type"){

        game.sentence=
            randomSentence();

        game.started=false;
        game.results={};

    }


    if(type==="boss"){

        game.hp=100000000;
        game.maxHp=100000000;

        game.damage={};

        game.started=false;

    }


    try{

        const result=
            await apiRequest(
                "POST",
                {
                    username:
                        GAME_SERVER,

                    channel:CHANNEL,

                    message:
                        gameStateFor(
                            game
                        ),

                    device_id:
                        deviceId,

                    game_server:true
                }
            );


        if(
            result.game
        ){

            gamesOverlay.classList.remove(
                "show"
            );

            await sync();

        }

    }catch(error){

        alert(
            error.message
        );

    }

}

async function startGame(game){

    if(
        game.hostDevice !==
        deviceId
    ){
        return;
    }


    const info=
        GAME_TYPES[
            game.gameType
        ];

        game.players.length <

    ){

            "You need at least "+
            info.min+

        );

    }


    game.status="playing";
    game.started=true;


    if(
        game.gameType.startsWith(
            "ttt"
        )
    ){

        game.winner="";

    if(
        game.gameType==="reaction"
    ){

        game.round++;
        game.goAt=
            Date.now()+
            2000+
            Math.floor(
                Math.random()*4000
            );

        game.results={};

    }


    await updateGame(
        game
    );


    if(
        game.gameType==="reaction"
    ){

        scheduleReaction(
            game
        );

    }

}


/* =========================================================
   TIC TAC TOE
========================================================= */

function checkWinner(
    board,
    size
){

    const lines=[];


    for(
        let r=0;
        r<size;
        r++
    ){

        const line=[];

        for(
            let c=0;
            c<size;
            c++
        ){
            line.push(
                r*size+c
            );
        }

        lines.push(line);

    }


    for(
        let c=0;
        c<size;
        c++
    ){

        const line=[];

        for(
            let r=0;
            r<size;
            r++
        ){
            line.push(
                r*size+c
            );
        }

        lines.push(line);

    }


    const diag1=[];

    for(
        let i=0;
        i<size;
        i++
    ){
        diag1.push(
            i*size+i
        );
    }

    lines.push(diag1);


    const diag2=[];

    for(
        let i=0;
        i<size;
        i++
    ){
        diag2.push(
            i*size+
            (size-1-i)
        );
    }

    lines.push(diag2);


    for(const line of lines){

        const first=
            board[line[0]];

        if(!first){
            continue;
        }

        if(
            line.every(
                index=>
                    board[index]===
                    first
            )
        ){
            return first;
        }

    }


    if(
        board.every(
            Boolean
        )
    ){
        return "draw";
    }


    return "";
}


async function playTTT(
    game,
    index
){

    if(
        game.status!=="playing"
    ){
        return;
    }


    if(
        game.winner
    ){
        return;
    }


    const playerIndex=
        game.players.findIndex(
            p=>
                p.deviceId===
                deviceId
        );


    if(
        playerIndex<0
    ){
        return;
    }


    if(
        game.turn !==
        playerIndex
    ){
        return;
    }


    if(
        game.board[index]
    ){
        return;
    }


    const mark=
        playerIndex===0
            ?"X"
            :"O";


    game.board[index]=
        mark;


    const info=
        GAME_TYPES[
            game.gameType
        ];


    const winner=
        checkWinner(
            game.board,
            info.size
        );


    if(winner){

        game.winner=
            winner;

        game.status=
            "finished";

    }else{

        game.turn=
            game.turn===0
                ?1
                :0;

    }


    await updateGame(
        game
    );

}


/* =========================================================
   REACTION GAME
========================================================= */

function scheduleReaction(game){

    const key=
        game.id;

    clearTimeout(
        reactionTimers[key]
    );


    const delay=
        Math.max(
            100,
            game.goAt -
            Date.now()
        );


    reactionStarted[key]=false;


    reactionTimers[key]=
        setTimeout(
            ()=>{
                reactionStarted[key]=true;
                renderMessages();
            },
            delay
        );

}


async function reactionClick(
    game
){

    if(
        !game.started ||
        game.status!=="playing"
    ){
        return;
    }


    if(
        !reactionStarted[game.id]
    ){

        alert(
            "Too early!"
        );

        return;

    }


    if(
        game.results &&
        game.results[deviceId]
    ){
        return;
    }


    const reaction=
        Date.now()-
        game.goAt;


    if(!game.results){
        game.results={};
    }


    game.results[deviceId]=
        reaction;


    const allDone=
        game.players.every(
            p=>
                game.results[p.deviceId]
                !==undefined
        );


    if(allDone){

        game.status=
            "finished";

    }


    await updateGame(
        game
    );

}

    );

/* =========================================================
   BOSS
========================================================= */

async function damageBoss(
    game,
    amount
){

    if(
        game.status!=="playing"
    ){
        return;
    }


    if(
        !game.damage
    ){
        game.damage={};
    }


    game.damage[deviceId]=
        (
            game.damage[deviceId]||
            0
        )+
        amount;


    game.hp=
        Math.max(
            0,
            game.hp-
            amount
        );


    if(
        game.hp<=0
    ){

        game.status=
            "finished";

    }


    await updateGame(
        game
    );

}

        game.gameType==="reaction"

    }


    if(
        game.gameType==="type"
    ){

        body+=

                            ?`

                                        info.desc

                </div>

/* =========================================================

function renderTTT(game){

    const info=
        GAME_TYPES[
            game.gameType
        ];

    const size=
        info.size;


    if(
        game.status==="lobby"
    ){
        return "";
    }


    let board="";


    game.board.forEach(
        (cell,index)=>{

            board+=`

                <button
                    class="ttt-cell"
                    data-game="${escapeHTML(
                        game.serverId
                    )}"
                    data-index="${index}"
                    ${
                        cell
                            ?"disabled"
                            :""
                    }
                >
                    ${escapeHTML(cell)}
                </button>

            `;

        }
    );


    let banner="";


    if(game.winner){

        banner=
            game.winner==="draw"
                ?"It's a draw."
                :"Winner: "+
                    (
                        game.winner==="X"
                            ?escapeHTML(
                                game.players[0]?.name||
                                "Player 1"
                            )
                            :escapeHTML(
                                game.players[1]?.name||
                                "Player 2"
                            )
                    );

    }else{

        const player=
            game.players[
                game.turn
            ];

        banner=
            "Turn: <strong>"+
            escapeHTML(
                player?.name||
                "Player"
            )+
            "</strong>";

    }


    return `

        <div class="turn-banner">
            ${banner}
        </div>

        <div
            class="ttt"
            style="
                grid-template-columns:
                repeat(${size},1fr)
            "
        >
            ${board}
        </div>

    `;

}


/* =========================================================
   RENDER REACTION
========================================================= */

function renderReaction(game){

    if(
        game.status==="lobby"
    ){
        return "";
    }


    if(
        game.status==="finished"
    ){

        const results=
            Object.entries(
                game.results||{}
            )
            .sort(
                (a,b)=>
                    a[1]-b[1]
            );


        let resultHTML="";

        results.forEach(
            ([id,time],index)=>{

                const player=
                    game.players.find(
                        p=>
                            p.deviceId===id
                    );

                resultHTML+=`

                    <div class="player-chip">

                        #${index+1}
                        ${
                            escapeHTML(
                                player?.name||
                                "Player"
                            )
                        }

                        —
                        ${time}ms

                    </div>

                `;

            }
        );


        return `

            <div class="reaction-area">

                <div class="turn-banner">
                    Finished
                </div>

                <div class="players-list">
                    ${resultHTML}
                </div>

            </div>

        `;

    }


    if(
        !reactionStarted[game.id]
    ){

        scheduleReaction(
            game
        );

    }


    return `

        <div class="reaction-area">

            <div class="reaction-box waiting">

                ${
                    reactionStarted[game.id]
                        ?"CLICK!"
                        :"Wait..."
                }

            </div>

        </div>

    `;

}

/* =========================================================

========================================================= */

function renderBoss(game){

    if(
        game.status==="lobby"
    ){
        return "";
    }


    const hp=
        Math.max(
            0,
            Number(game.hp)||
            0
        );

    const maxHp=
        Number(game.maxHp)||
        100000000;


    const percent=
        Math.max(
            0,
            Math.min(
                100,
                hp/maxHp*100
            )
        );


    let totalDamage=0;

    Object.values(
        game.damage||{}
    )
    .forEach(
        amount=>{
            totalDamage+=
                Number(amount)||0;
        }
    );


    return `

            <div class="boss-monster-name">
                THE BOSS

                    class="boss-health-fill"

                    "

                    ${hp.toLocaleString()}
                    /
                    ${maxHp.toLocaleString()}
                </div>

            </div>

            <div class="boss-stats">

                <span>
                    Total damage:
                    <strong>
                        ${totalDamage.toLocaleString()}
                    </strong>
                </span>

            </div>

            ${

                    ?`

                            }

        );


    document
        .querySelectorAll(
            ".ttt-cell"
        )
        .forEach(
            button=>{

                button.onclick=
                    async()=>{

                        const game=
                            games.find(
                                g=>
                                    String(
                                        g.serverId
                                    )===
                                    String(
                                        button.dataset.game
                                    )
                            );

                        if(game){

                            await playTTT(
                                game,
                                Number(
                                    button.dataset.index
                                )
                            );

                        }

                    };

            }
        );


    document
        .querySelectorAll(
            ".reaction-box"
        )
        .forEach(
            box=>{

                box.onclick=
                    async()=>{

                        const card=
                            box.closest(
                                ".game-message"
                            );

                        const buttonGame=
                            card?.querySelector(
                                ".reaction-box"
                            );

                        const game=
                            games.find(
                                g=>
                                    g.id &&
                                    card &&
                                    card.innerHTML.includes(
                                        g.id
                                    )
                            );


                        if(game){

                            await reactionClick(
                                game
                            );

                        }else{

                            const visibleGame=
                                games.find(
                                    g=>
                                        g.gameType===
                                        "reaction"
                                );

                            if(visibleGame){
                                await reactionClick(
                                    visibleGame
                                );
                            }

                        }

                    };

            }
        );


    document
        .querySelectorAll(
            ".type-input"
        )
        .forEach(
            input=>{

                input.addEventListener(
                    "keydown",
                    async event=>{

                        if(
                            event.key!=="Enter"
                        ){
                            return;
                        }

                        event.preventDefault();

                        const game=
                            games.find(
                                g=>
                                    String(
                                        g.serverId
                                    )===
                                    String(
                                        input.dataset.game
                                    )
                            );

                        if(game){

                            await submitType(
                                game,
                                input.value
                            );

                        }

                    }
                );

            }
        );


    document
        .querySelectorAll(
            ".damage-boss"
        )
        .forEach(
            button=>{

                button.onclick=
                    async()=>{

                        const game=
                            games.find(
                                g=>
                                    String(
                                        g.serverId
                                    )===
                                    String(
                                        button.dataset.game
                                    )
                            );

                        if(game){

                            await damageBoss(
                                game,
                                Number(
                                    button.dataset.damage
                                )
                            );

                        }

                    };

            }
        );

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

    const text=
        messageInput.value.trim();


    if(!text){
        return;
    }


    if(
        !settings.username
    ){

        settingsOverlay.classList.add(
            "show"
        );

        loadSettingsUI();

        usernameInput.focus();

        alert(
            "Set your username first."
        );

        return;

    }


    sendBtn.disabled=true;


    try{

        await apiRequest(
            "POST",
            {

                username:
                    settings.username,

                channel:
                    CHANNEL,

                message:
                    text,

                device_id:
                    deviceId

            }
        );


        messageInput.value="";

        autoResize();

        await sync();

    }catch(error){

        alert(
            error.message
        );

    }finally{

        sendBtn.disabled=false;

        messageInput.focus();

    }

}


/* =========================================================
   AUTO RESIZE
========================================================= */

function autoResize(){

    messageInput.style.height=
        "auto";

    messageInput.style.height=
        Math.min(
            messageInput.scrollHeight,
            150
        )+
        "px";

}


messageInput.addEventListener(
    "input",
    autoResize
);


/* =========================================================
   ENTER TO SEND
========================================================= */

messageInput.addEventListener(
    "keydown",
    event=>{

        if(
            event.key==="Enter" &&
            !event.shiftKey &&
            settings.enterToSend
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


sendBtn.onclick=
    sendMessage;


/* =========================================================
   SETTINGS UI
========================================================= */

function loadSettingsUI(){

    usernameInput.value=
        settings.username;

    deviceIdInput.value=
        deviceId;

    refreshRate.value=
        String(
            settings.refreshRate
        );

    showTimestamps.value=
        String(
            settings.showTimestamps
        );

    themeSelect.value=
        settings.theme;

    textSize.value=
        settings.textSize;

    wordSpacing.value=
        settings.wordSpacing;

    lineSpacing.value=
        settings.lineSpacing;

    cornerRadius.value=
        settings.cornerRadius;

    uiScale.value=
        settings.uiScale;

    enterToSend.value=
        String(
            settings.enterToSend
        );

    autoScroll.value=
        String(
            settings.autoScroll
        );

    updateRangeLabels();

}


function updateRangeLabels(){

    textSizeValue.textContent=
        textSize.value+
        "px";

    wordSpacingValue.textContent=
        wordSpacing.value+
        "px";

    lineSpacingValue.textContent=
        lineSpacing.value;

    cornerRadiusValue.textContent=
        cornerRadius.value+
        "px";

    uiScaleValue.textContent=
        Math.round(
            Number(
                uiScale.value
            )*
            100
        )+
        "%";

}


[
    textSize,
    wordSpacing,
    lineSpacing,
    cornerRadius,
    uiScale
].forEach(
    element=>{

        element.addEventListener(
            "input",
            updateRangeLabels
        );

    }
);


/* =========================================================
   SETTINGS SAVE
========================================================= */

saveSettings.onclick=
    ()=>{

        settings.username=
            usernameInput.value
                .trim()
                .slice(0,24);

        settings.refreshRate=
            Number(
                refreshRate.value
            );

        settings.showTimestamps=
            showTimestamps.value===
            "true";

        settings.theme=
            themeSelect.value;

        settings.textSize=
            Number(
                textSize.value
            );

        settings.wordSpacing=
            Number(
                wordSpacing.value
            );

        settings.lineSpacing=
            Number(
                lineSpacing.value
            );

        settings.cornerRadius=
            Number(
                cornerRadius.value
            );

        settings.uiScale=
            Number(
                uiScale.value
            );

        settings.enterToSend=
            enterToSend.value===
            "true";

        settings.autoScroll=
            autoScroll.value===
            "true";


        Object.keys(settings)
            .forEach(
                key=>{

                    localStorage.setItem(
                        "chat_"+key,
                        String(
                            settings[key]
                        )
                    );

                }
            );


        applySettings();


        settingsOverlay.classList.remove(
            "show"
        );

    };


function applySettings(){

    document.documentElement.style.setProperty(
        "--text-size",
        settings.textSize+
        "px"
    );

    document.documentElement.style.setProperty(
        "--word-spacing",
        settings.wordSpacing+
        "px"
    );

    document.documentElement.style.setProperty(
        "--line-spacing",
        settings.lineSpacing
    );

    document.documentElement.style.setProperty(
        "--radius",
        settings.cornerRadius+
        "px"
    );

    document.documentElement.style.setProperty(
        "--ui-scale",
        settings.uiScale
    );

    applyTheme(
        settings.theme
    );

    restartRefresh();

    renderMessages();

}


function applyTheme(name){

    const themes={

        dark:{
            bg:"#080a0d",
            panel:"#11151a"
        },

        midnight:{
            bg:"#070a13",
            panel:"#101522"
        },

        slate:{
            bg:"#101418",
            panel:"#171d22"
        },

        black:{
            bg:"#000000",
            panel:"#090909"
        },

        blue:{
            bg:"#081018",
            panel:"#101c29"
        },

        purple:{
            bg:"#100a17",
            panel:"#191021"
        },

        green:{
            bg:"#08120d",
            panel:"#101b15"
        },

        red:{
            bg:"#140909",
            panel:"#1e1111"
        },

        gray:{
            bg:"#151515",
            panel:"#202020"
        },

        light:{
            bg:"#eeeeee",
            panel:"#ffffff"
        }

    };


    const theme=
        themes[name]||
        themes.dark;


    document.documentElement.style.setProperty(
        "--bg",
        theme.bg
    );

    document.documentElement.style.setProperty(
        "--panel",
        theme.panel
    );

}


/* =========================================================
   CATEGORY TOGGLE
========================================================= */

document
    .querySelectorAll(
        ".category-title"
    )
    .forEach(
        button=>{

            button.onclick=
                ()=>{

                    button
                        .parentElement
                        .classList
                        .toggle(
                            "open"
                        );

                };

        }
    );


/* =========================================================
   OVERLAYS
========================================================= */

settingsBtn.onclick=
    ()=>{

        loadSettingsUI();

        settingsOverlay.classList.add(
            "show"
        );

    };


closeSettings.onclick=
    ()=>{

        settingsOverlay.classList.remove(
            "show"
        );

    };


gamesBtn.onclick=
    ()=>{

        gamesOverlay.classList.add(
            "show"
        );

    };


closeGames.onclick=
    ()=>{

        gamesOverlay.classList.remove(
            "show"
        );

    };


[

/* =========================================================
   GAME CREATOR BUTTONS
========================================================= */

document
    .querySelectorAll(
        ".game-choice"
    )
    .forEach(
        button=>{

            button.onclick=
                ()=>{

                    createGame(
                        button.dataset.game
                    );

                };

        }
    );


/* =========================================================
   CONFIRM
========================================================= */

function askConfirm(
    title,
    text,
    callback
){

    confirmTitle.textContent=
        title;

    confirmText.textContent=
        text;

    confirmCallback=
        callback;

    confirmOverlay.classList.add(
        "show"
    );

}


confirmCancel.onclick=
    ()=>{

        confirmCallback=null;

        confirmOverlay.classList.remove(
            "show"
        );

    };


confirmYes.onclick=
    async()=>{

        const callback=
            confirmCallback;

        confirmCallback=null;

        confirmOverlay.classList.remove(
            "show"
        );

        if(callback){
            await callback();
        }

    };


/* =========================================================
   DELETE EVERYTHING
========================================================= */

removeEverything.onclick=
    ()=>{

        askConfirm(
            "Delete everything?",
            "This permanently removes every chat message and game from the server.",
            async()=>{

                try{

                    await apiRequest(
                        "DELETE",
                        {
                            delete_all:true
                        }
                    );

                    await sync();

                }catch(error){

                    alert(
                        error.message
                    );

                }

            }
        );

    };


/* =========================================================
   REFRESH
========================================================= */

function restartRefresh(){

    if(refreshTimer){
        clearInterval(
            refreshTimer
        );
    }


    refreshTimer=
        setInterval(
            sync,
            Math.max(
                100,
                Number(
                    settings.refreshRate
                )||
                500
            )
        );

}


/* =========================================================
   START
========================================================= */

applySettings();

loadSettingsUI();

sync();

restartRefresh();


/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    ()=>{

        if(
            !document.hidden
        ){
            sync();
        }

    }
);


/* =========================================================
   ESCAPE
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.key==="Escape"
        ){

            document
                .querySelectorAll(
                    ".overlay.show"
                )
                .forEach(
                    overlay=>
                        overlay.classList.remove(
                            "show"
                        )
                );

        }

    }
);

</script>
