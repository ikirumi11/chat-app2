<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Chat</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #101010;
    color: #eee;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

button,
input {
    font-family: inherit;
}

button {
    cursor: pointer;
}

/* =========================================
   APP
========================================= */

#app {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;

    background: #101010;
}

/* =========================================
   HEADER
========================================= */

.header {
    height: 62px;
    flex-shrink: 0;

    display: flex;
    align-items: center;

    padding: 0 18px;

    background: #181818;
    border-bottom: 1px solid #292929;
}

.logo {
    font-size: 20px;
    font-weight: 700;
}

.channel {
    margin-left: 18px;

    padding: 7px 11px;

    border-radius: 7px;

    background: #242424;

    color: #aaa;

    font-size: 13px;
}

.header-right {
    margin-left: auto;

    display: flex;
    align-items: center;
    gap: 12px;
}

.connection {
    display: flex;
    align-items: center;
    gap: 6px;

    color: #666;

    font-size: 11px;
}

.connection-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #555;
}

.connection-dot.online {
    background: #55c878;
}

#settingsButton {
    width: 36px;
    height: 36px;

    border: 1px solid #303030;
    border-radius: 8px;

    background: #222;
    color: #bbb;

    font-size: 18px;
}

#settingsButton:hover {
    background: #2d2d2d;
    color: white;
}

/* =========================================
   MESSAGES
========================================= */

#messages {
    flex: 1;

    overflow-y: auto;
    overflow-x: hidden;

    padding: 16px;

    scroll-behavior: auto;
}

#messages::-webkit-scrollbar {
    width: 8px;
}

#messages::-webkit-scrollbar-thumb {
    background: #303030;
    border-radius: 10px;
}

#messages::-webkit-scrollbar-track {
    background: transparent;
}

.message {
    display: flex;

    width: 100%;

    padding: 9px 7px;

    border-radius: 8px;

    /*
       IMPORTANT:
       No animations.
       No fading.
       No transitions.
    */
}

.message:hover {
    background: #181818;
}

.avatar {
    width: 38px;
    height: 38px;

    flex-shrink: 0;

    margin-right: 11px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #292929;
    color: #bbb;

    font-size: 14px;
    font-weight: bold;
}

.message-content {
    min-width: 0;
    flex: 1;
}

.message-top {
    display: flex;
    align-items: baseline;
    gap: 8px;

    margin-bottom: 3px;
}

.username {
    color: #ddd;

    font-size: 14px;
    font-weight: 700;
}

.time {
    color: #555;

    font-size: 10px;
}

.edited {
    color: #666;

    font-size: 10px;
}

.message-text {
    color: #ccc;

    font-size: 14px;
    line-height: 1.45;

    white-space: pre-wrap;
    word-break: break-word;
}

.chat-image {
    display: block;

    max-width: min(500px, 80vw);
    max-height: 500px;

    margin-top: 9px;

    border-radius: 8px;

    background: #080808;

    object-fit: contain;

    cursor: pointer;
}

.chat-image:hover {
    opacity: .9;
}

/* =========================================
   EMPTY
========================================= */

#empty {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #555;

    font-size: 14px;
}

/* =========================================
   INPUT
========================================= */

.input-area {
    flex-shrink: 0;

    padding: 9px 14px 14px;

    background: #151515;
    border-top: 1px solid #292929;
}

.username-row {
    max-width: 1100px;

    margin: 0 auto 7px;

    display: flex;
    align-items: center;
    gap: 8px;
}

.username-label {
    color: #555;
    font-size: 10px;
}

#usernameInput {
    width: 180px;
    height: 29px;

    padding: 0 9px;

    outline: none;

    border: 1px solid #2c2c2c;
    border-radius: 6px;

    background: #1d1d1d;
    color: #ddd;

    font-size: 12px;
}

#usernameInput:focus {
    border-color: #444;
}

.input-row {
    max-width: 1100px;

    margin: auto;

    display: flex;
    gap: 8px;
}

#messageInput {
    flex: 1;

    min-width: 0;

    height: 46px;

    padding: 0 14px;

    outline: none;

    border: 1px solid #303030;
    border-radius: 9px;

    background: #202020;
    color: #eee;

    font-size: 14px;
}

#messageInput:focus {
    border-color: #444;
}

#messageInput::placeholder {
    color: #666;
}

#imageButton,
#sendButton {
    height: 46px;

    border-radius: 9px;
}

#imageButton {
    width: 46px;

    border: 0;

    background: #252525;
    color: #ccc;

    font-size: 19px;
}

#imageButton:hover {
    background: #303030;
}

#sendButton {
    padding: 0 18px;

    border: 0;

    background: #eee;
    color: #111;

    font-weight: bold;
}

#sendButton:hover {
    background: white;
}

#sendButton:disabled {
    opacity: .4;
    cursor: default;
}

/* =========================================
   SELECTED IMAGE
========================================= */

#selectedImage {
    display: none;

    max-width: 1100px;

    margin: 0 auto 7px;

    padding: 7px 10px;

    border-radius: 7px;

    background: #202020;

    color: #aaa;

    font-size: 11px;
}

#selectedImage.visible {
    display: flex;
    align-items: center;
}

#removeImage {
    margin-left: auto;

    border: 0;

    background: transparent;
    color: #888;

    font-size: 18px;
}

#removeImage:hover {
    color: white;
}

/* =========================================
   CONTEXT MENU
========================================= */

#contextMenu {
    position: fixed;

    z-index: 10000;

    display: none;

    min-width: 150px;

    padding: 5px;

    background: #202020;

    border: 1px solid #363636;
    border-radius: 8px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.45);
}

#contextMenu button {
    display: block;

    width: 100%;

    padding: 9px 11px;

    border: 0;
    border-radius: 5px;

    background: transparent;

    color: #ccc;

    text-align: left;

    font-size: 13px;
}

#contextMenu button:hover {
    background: #303030;
    color: white;
}

#contextDelete {
    color: #e58b8b !important;
}

/* =========================================
   SETTINGS
========================================= */

#settingsOverlay {
    position: fixed;

    inset: 0;

    z-index: 8000;

    display: none;

    background: rgba(0,0,0,.72);
}

#settingsOverlay.open {
    display: flex;

    align-items: center;
    justify-content: center;
}

.settings {
    width: min(430px, calc(100vw - 30px));

    max-height: 85vh;

    overflow-y: auto;

    padding: 20px;

    background: #191919;

    border: 1px solid #333;
    border-radius: 12px;

    box-shadow:
        0 20px 70px rgba(0,0,0,.6);
}

.settings-title {
    margin-bottom: 4px;

    font-size: 20px;
    font-weight: bold;
}

.settings-subtitle {
    margin-bottom: 20px;

    color: #666;

    font-size: 12px;
}

.settings-section {
    margin-top: 18px;

    padding-top: 16px;

    border-top: 1px solid #292929;
}

.settings-label {
    margin-bottom: 8px;

    color: #aaa;

    font-size: 11px;
    font-weight: bold;
}

.settings-close {
    width: 100%;
    height: 40px;

    margin-top: 18px;

    border: 1px solid #333;
    border-radius: 7px;

    background: #242424;
    color: #ddd;
}

.settings-close:hover {
    background: #303030;
}

/* =========================================
   DANGER AREA
========================================= */

.danger-box {
    padding: 13px;

    border: 1px solid #4b2929;
    border-radius: 8px;

    background: #211717;
}

.danger-title {
    margin-bottom: 5px;

    color: #e58b8b;

    font-size: 13px;
    font-weight: bold;
}

.danger-description {
    margin-bottom: 12px;

    color: #888;

    font-size: 11px;
    line-height: 1.5;
}

#removeEverythingButton {
    width: 100%;
    height: 38px;

    border: 1px solid #613232;
    border-radius: 7px;

    background: #321c1c;
    color: #ed9999;

    font-size: 12px;
    font-weight: bold;
}

#removeEverythingButton:hover {
    background: #472222;
}

/* =========================================
   CONFIRMATION MODAL
========================================= */

#confirmOverlay {
    position: fixed;

    inset: 0;

    z-index: 11000;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(0,0,0,.82);
}

#confirmOverlay.open {
    display: flex;
}

.confirm-box {
    width: min(440px, 100%);

    padding: 22px;

    background: #1b1b1b;

    border: 1px solid #3b3b3b;
    border-radius: 12px;

    box-shadow:
        0 20px 80px rgba(0,0,0,.7);
}

.confirm-title {
    margin-bottom: 12px;

    color: #eee;

    font-size: 18px;
    font-weight: bold;
}

.confirm-text {
    color: #aaa;

    font-size: 13px;
    line-height: 1.55;
}

.confirm-warning {
    margin-top: 13px;

    padding: 10px;

    border-radius: 7px;

    background: #281818;

    color: #e59898;

    font-size: 12px;
}

.confirm-buttons {
    display: flex;

    gap: 8px;

    margin-top: 18px;
}

.confirm-buttons button {
    flex: 1;

    height: 40px;

    border-radius: 7px;

    font-weight: bold;
}

#confirmCancel {
    border: 1px solid #333;

    background: #252525;
    color: #ccc;
}

#confirmAction {
    border: 1px solid #673535;

    background: #3a2020;
    color: #ed9999;
}

/* =========================================
   FULLSCREEN IMAGE
========================================= */

#imageViewer {
    position: fixed;

    inset: 0;

    z-index: 12000;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.97);
}

#imageViewer.open {
    display: flex;
}

#fullscreenImage {
    max-width: calc(100vw - 40px);
    max-height: calc(100vh - 100px);

    object-fit: contain;
}

#backButton {
    position: fixed;

    top: 18px;
    left: 18px;

    height: 42px;

    padding: 0 16px;

    border: 1px solid #333;
    border-radius: 8px;

    background: #222;
    color: #eee;
}

#backButton:hover {
    background: #303030;
}

#imageName {
    position: fixed;

    left: 50%;
    bottom: 17px;

    transform: translateX(-50%);

    color: #777;

    font-size: 11px;
}

/* =========================================
   EDIT MODAL
========================================= */

#editOverlay {
    position: fixed;

    inset: 0;

    z-index: 10500;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(0,0,0,.75);
}

#editOverlay.open {
    display: flex;
}

.edit-box {
    width: min(500px, 100%);

    padding: 20px;

    border: 1px solid #333;
    border-radius: 11px;

    background: #1b1b1b;
}

.edit-title {
    margin-bottom: 12px;

    font-size: 18px;
    font-weight: bold;
}

#editInput {
    width: 100%;
    min-height: 110px;

    resize: vertical;

    padding: 11px;

    outline: none;

    border: 1px solid #333;
    border-radius: 7px;

    background: #111;
    color: #eee;

    font-size: 14px;
}

.edit-buttons {
    display: flex;

    gap: 8px;

    margin-top: 10px;
}

.edit-buttons button {
    flex: 1;

    height: 40px;

    border-radius: 7px;
}

#editCancel {
    border: 1px solid #333;

    background: #252525;
    color: #ccc;
}

#editSave {
    border: 0;

    background: #eee;
    color: #111;

    font-weight: bold;
}

/* =========================================
   ERROR
========================================= */

#errorBox {
    position: fixed;

    left: 50%;
    bottom: 90px;

    z-index: 20000;

    display: none;

    max-width: 90vw;

    transform: translateX(-50%);

    padding: 11px 15px;

    border: 1px solid #4b2727;
    border-radius: 8px;

    background: #291818;
    color: #e88;

    white-space: pre-wrap;

    font-size: 12px;
}

#errorBox.show {
    display: block;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:600px) {

    .header {
        height: 56px;
        padding: 0 12px;
    }

    .logo {
        font-size: 17px;
    }

    .channel {
        margin-left: 10px;
        font-size: 12px;
    }

    .connection {
        display: none;
    }

    #messages {
        padding: 9px;
    }

    .avatar {
        width: 32px;
        height: 32px;

        margin-right: 8px;
    }

    .chat-image {
        max-width: 86vw;
        max-height: 400px;
    }

    .input-area {
        padding: 8px;
    }

    #usernameInput {
        width: 140px;
    }

    #sendButton {
        padding: 0 13px;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            Chat
        </div>

        <div class="channel">
            # general
        </div>

        <div class="header-right">

            <div class="connection">

                <div
                    id="connectionDot"
                    class="connection-dot">
                </div>

                <span id="connectionText">
                    Connecting...
                </span>

            </div>

            <button
                id="settingsButton"
                type="button"
                title="Settings">
                ⚙
            </button>

        </div>

    </header>


    <!-- MESSAGES -->

    <main id="messages">

        <div id="empty">
            No messages yet.
        </div>

    </main>


    <!-- INPUT -->

    <section class="input-area">

        <div class="username-row">

            <span class="username-label">
                NAME
            </span>

            <input
                id="usernameInput"
                maxlength="24"
                placeholder="Username"
                autocomplete="off">

        </div>


        <div
            id="selectedImage">

            <span id="selectedImageName">
                Image selected
            </span>

            <button
                id="removeImage"
                type="button">
                ×
            </button>

        </div>


        <div class="input-row">

            <button
                id="imageButton"
                type="button"
                title="Choose image">
                +
            </button>

            <input
                id="fileInput"
                type="file"
                accept="image/*"
                hidden>

            <input
                id="messageInput"
                maxlength="2000"
                placeholder="Message #general"
                autocomplete="off">

            <button
                id="sendButton"
                type="button">
                Send
            </button>

        </div>

    </section>

</div>


<!-- =========================================
     CONTEXT MENU
========================================= -->

<div id="contextMenu">

    <button
        id="contextEdit"
        type="button">
        Edit
    </button>

    <button
        id="contextDelete"
        type="button">
        Delete
    </button>

</div>


<!-- =========================================
     SETTINGS
========================================= -->

<div id="settingsOverlay">

    <div class="settings">

        <div class="settings-title">
            Settings
        </div>

        <div class="settings-subtitle">
            Chat settings
        </div>


        <div class="settings-section">

            <div class="settings-label">
                CHANNEL
            </div>

            <div class="channel">
                # general
            </div>

        </div>


        <div class="settings-section">

            <div class="settings-label">
                DANGER ZONE
            </div>

            <div class="danger-box">

                <div class="danger-title">
                    Remove everything
                </div>

                <div class="danger-description">
                    This permanently requests deletion of
                    every message in the chat.
                    This action cannot be undone.
                </div>

                <button
                    id="removeEverythingButton"
                    type="button">
                    Remove everything
                </button>

            </div>

        </div>


        <button
            id="settingsClose"
            class="settings-close"
            type="button">
            Close
        </button>

    </div>

</div>


<!-- =========================================
     CONFIRMATION
========================================= -->

<div id="confirmOverlay">

    <div class="confirm-box">

        <div
            id="confirmTitle"
            class="confirm-title">
            Are you sure?
        </div>

        <div
            id="confirmText"
            class="confirm-text">
        </div>

        <div
            id="confirmWarning"
            class="confirm-warning">
        </div>

        <div class="confirm-buttons">

            <button
                id="confirmCancel"
                type="button">
                Cancel
            </button>

            <button
                id="confirmAction"
                type="button">
                Continue
            </button>

        </div>

    </div>

</div>


<!-- =========================================
     EDIT
========================================= -->

<div id="editOverlay">

    <div class="edit-box">

        <div class="edit-title">
            Edit message
        </div>

        <textarea
            id="editInput"
            maxlength="2000"></textarea>

        <div class="edit-buttons">

            <button
                id="editCancel"
                type="button">
                Cancel
            </button>

            <button
                id="editSave"
                type="button">
                Save
            </button>

        </div>

    </div>

</div>


<!-- =========================================
     IMAGE VIEWER
========================================= -->

<div id="imageViewer">

    <button
        id="backButton"
        type="button">
        ← Back
    </button>

    <img
        id="fullscreenImage"
        alt="Full size image">

    <div id="imageName"></div>

</div>


<div id="errorBox"></div>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const API_URL =
    "/api/messages";

const CHANNEL =
    "general";

const MAX_IMAGE_SIZE =
    1500;

const REFRESH_TIME =
    3000;


/*
 * Put the username that should be allowed
 * to perform administrator actions here.
 *
 * IMPORTANT:
 * This is only a UI check.
 *
 * Real admin protection MUST also be
 * implemented by your server/API.
 */
const ADMIN_USERNAME =
    "admin";


/* =========================================================
   ELEMENTS
========================================================= */

const messagesElement =
    document.getElementById("messages");

const usernameInput =
    document.getElementById("usernameInput");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const imageButton =
    document.getElementById("imageButton");

const fileInput =
    document.getElementById("fileInput");

const selectedImage =
    document.getElementById("selectedImage");

const selectedImageName =
    document.getElementById("selectedImageName");

const removeImage =
    document.getElementById("removeImage");

const connectionDot =
    document.getElementById("connectionDot");

const connectionText =
    document.getElementById("connectionText");

const errorBox =
    document.getElementById("errorBox");

const contextMenu =
    document.getElementById("contextMenu");

const contextEdit =
    document.getElementById("contextEdit");

const contextDelete =
    document.getElementById("contextDelete");

const settingsButton =
    document.getElementById("settingsButton");

const settingsOverlay =
    document.getElementById("settingsOverlay");

const settingsClose =
    document.getElementById("settingsClose");

const removeEverythingButton =
    document.getElementById(
        "removeEverythingButton"
    );

const confirmOverlay =
    document.getElementById("confirmOverlay");

const confirmTitle =
    document.getElementById("confirmTitle");

const confirmText =
    document.getElementById("confirmText");

const confirmWarning =
    document.getElementById("confirmWarning");

const confirmCancel =
    document.getElementById("confirmCancel");

const confirmAction =
    document.getElementById("confirmAction");

const editOverlay =
    document.getElementById("editOverlay");

const editInput =
    document.getElementById("editInput");

const editCancel =
    document.getElementById("editCancel");

const editSave =
    document.getElementById("editSave");

const imageViewer =
    document.getElementById("imageViewer");

const fullscreenImage =
    document.getElementById("fullscreenImage");

const backButton =
    document.getElementById("backButton");

const imageName =
    document.getElementById("imageName");


/* =========================================================
   STATE
========================================================= */

let selectedImageBase64 =
    null;

let messagesCache =
    new Map();

let selectedMessage =
    null;

let editMessage =
    null;

let confirmationStep =
    0;

let loading =
    false;


/* =========================================================
   USERNAME
========================================================= */

const savedUsername =
    localStorage.getItem(
        "chat_username"
    );

if (savedUsername) {
    usernameInput.value =
        savedUsername;
}

usernameInput.addEventListener(
    "input",
    () => {

        localStorage.setItem(
            "chat_username",
            usernameInput.value
        );

    }
);


/* =========================================================
   ERRORS
========================================================= */

function showError(
    text
) {

    errorBox.textContent =
        text;

    errorBox.classList.add(
        "show"
    );

    clearTimeout(
        showError.timer
    );

    showError.timer =
        setTimeout(
            () => {

                errorBox.classList.remove(
                    "show"
                );

            },
            7000
        );

}


/* =========================================================
   CONNECTION
========================================================= */

function setOnline() {

    connectionDot.classList.add(
        "online"
    );

    connectionText.textContent =
        "Connected";

}

function setOffline() {

    connectionDot.classList.remove(
        "online"
    );

    connectionText.textContent =
        "Connection error";

}


/* =========================================================
   IMAGE UPLOAD
========================================================= */

imageButton.addEventListener(
    "click",
    () => {

        fileInput.click();

    }
);


fileInput.addEventListener(
    "change",
    async () => {

        const file =
            fileInput.files[0];

        if (!file) {
            return;
        }

        if (
            !file.type.startsWith(
                "image/"
            )
        ) {

            showError(
                "Please choose an image."
            );

            return;

        }

        try {

            selectedImageBase64 =
                await resizeImage(
                    file,
                    MAX_IMAGE_SIZE
                );

            selectedImageName.textContent =
                file.name +
                " selected";

            selectedImage.classList.add(
                "visible"
            );

        } catch {

            showError(
                "Could not process image."
            );

        }

    }
);


removeImage.addEventListener(
    "click",
    clearSelectedImage
);


function clearSelectedImage() {

    selectedImageBase64 =
        null;

    fileInput.value =
        "";

    selectedImage.classList.remove(
        "visible"
    );

}


/* =========================================================
   IMAGE RESIZE
========================================================= */

function resizeImage(
    file,
    maxSize
) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () => {

                    const img =
                        new Image();

                    img.onload =
                        () => {

                            let width =
                                img.naturalWidth;

                            let height =
                                img.naturalHeight;

                            if (
                                width >
                                    maxSize ||
                                height >
                                    maxSize
                            ) {

                                const scale =
                                    Math.min(
                                        maxSize /
                                            width,
                                        maxSize /
                                            height
                                    );

                                width =
                                    Math.round(
                                        width *
                                        scale
                                    );

                                height =
                                    Math.round(
                                        height *
                                        scale
                                    );

                            }

                            const canvas =
                                document.createElement(
                                    "canvas"
                                );

                            canvas.width =
                                width;

                            canvas.height =
                                height;

                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );

                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );

                            resolve(
                                canvas.toDataURL(
                                    "image/jpeg",
                                    .82
                                )
                            );

                        };

                    img.onerror =
                        reject;

                    img.src =
                        reader.result;

                };

            reader.onerror =
                reject;

            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =========================================================
   CREATE MESSAGE
========================================================= */

function createMessageElement(
    msg
) {

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message";

    wrapper.dataset.id =
        String(msg.id);


    /* RIGHT CLICK */

    wrapper.addEventListener(
        "contextmenu",
        event => {

            event.preventDefault();

            const currentUsername =
                usernameInput.value
                    .trim();

            /*
             * Only allow context menu
             * for the user's own messages.
             */

            if (
                msg.username !==
                currentUsername
            ) {

                return;

            }

            selectedMessage =
                msg;

            openContextMenu(
                event.clientX,
                event.clientY
            );

        }
    );


    /* AVATAR */

    const avatar =
        document.createElement(
            "div"
        );

    avatar.className =
        "avatar";

    avatar.textContent =
        String(
            msg.username ||
            "?"
        )
        .trim()
        .charAt(0)
        .toUpperCase();


    /* CONTENT */

    const content =
        document.createElement(
            "div"
        );

    content.className =
        "message-content";


    /* TOP */

    const top =
        document.createElement(
            "div"
        );

    top.className =
        "message-top";


    const username =
        document.createElement(
            "span"
        );

    username.className =
        "username";

    username.textContent =
        msg.username ||
        "Unknown";


    const time =
        document.createElement(
            "span"
        );

    time.className =
        "time";

    time.textContent =
        formatTime(
            msg.created_at
        );


    top.appendChild(
        username
    );

    top.appendChild(
        time
    );


    if (msg.edited === true) {

        const edited =
            document.createElement(
                "span"
            );

        edited.className =
            "edited";

        edited.textContent =
            "(edited)";

        top.appendChild(
            edited
        );

    }


    content.appendChild(
        top
    );


    /* MESSAGE */

    if (
        msg.message &&
        String(msg.message).trim()
    ) {

        const text =
            document.createElement(
                "div"
            );

        text.className =
            "message-text";

        text.textContent =
            msg.message;

        content.appendChild(
            text
        );

    }


    /* IMAGE */

    if (
        msg.image &&
        typeof msg.image ===
            "string"
    ) {

        const image =
            document.createElement(
                "img"
            );

        image.className =
            "chat-image";

        image.src =
            msg.image;

        image.alt =
            "Image";

        image.loading =
            "lazy";

        image.addEventListener(
            "click",
            () => {

                openImage(
                    msg.image,
                    msg.username
                );

            }
        );

        content.appendChild(
            image
        );

    }


    wrapper.appendChild(
        avatar
    );

    wrapper.appendChild(
        content
    );

    return wrapper;

}


/* =========================================================
   TIME
========================================================= */

function formatTime(
    value
) {

    if (!value) {
        return "";
    }

    const date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return "";
    }

    return date.toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =========================================================
   RENDER
========================================================= */

function renderMessages(
    incoming
) {

    if (
        !Array.isArray(
            incoming
        )
    ) {
        return;
    }


    const nearBottom =
        messagesElement.scrollHeight -
        messagesElement.scrollTop -
        messagesElement.clientHeight <
        120;


    const empty =
        document.getElementById(
            "empty"
        );


    if (
        incoming.length === 0
    ) {

        if (!empty) {

            const element =
                document.createElement(
                    "div"
                );

            element.id =
                "empty";

            element.textContent =
                "No messages yet.";

            messagesElement.appendChild(
                element
            );

        }

        return;

    }


    if (empty) {
        empty.remove();
    }


    const incomingIds =
        new Set();


    for (
        const msg of incoming
    ) {

        const id =
            String(msg.id);

        incomingIds.add(id);


        const old =
            messagesCache.get(id);


        /*
         * If nothing changed,
         * leave the existing DOM alone.
         */

        if (
            old &&
            JSON.stringify(old) ===
                JSON.stringify(msg)
        ) {

            continue;

        }


        const oldElement =
            messagesElement.querySelector(
                `[data-id="${CSS.escape(id)}"]`
            );


        const newElement =
            createMessageElement(
                msg
            );


        if (oldElement) {

            /*
             * Replace only this one message.
             */

            oldElement.replaceWith(
                newElement
            );

        } else {

            messagesElement.appendChild(
                newElement
            );

        }


        messagesCache.set(
            id,
            msg
        );

    }


    /*
     * Remove messages no longer
     * returned by the server.
     */

    for (
        const [
            id
        ] of messagesCache
    ) {

        if (
            !incomingIds.has(id)
        ) {

            const element =
                messagesElement.querySelector(
                    `[data-id="${CSS.escape(id)}"]`
                );

            if (element) {
                element.remove();
            }

            messagesCache.delete(id);

        }

    }


    if (nearBottom) {

        messagesElement.scrollTop =
            messagesElement.scrollHeight;

    }

}


/* =========================================================
   LOAD
========================================================= */

async function loadMessages() {

    if (loading) {
        return;
    }

    loading =
        true;

    try {

        const response =
            await fetch(
                API_URL +
                "?channel=" +
                encodeURIComponent(
                    CHANNEL
                ),
                {
                    cache:
                        "no-store"
                }
            );


        const text =
            await response.text();


        let data;

        try {

            data =
                JSON.parse(
                    text
                );

        } catch {

            throw new Error(
                "Server returned invalid JSON."
            );

        }


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status +
                "\n" +
                (
                    data.error ||
                    "Request failed."
                )
            );

        }


        setOnline();

        renderMessages(
            data.messages || []
        );


    } catch (error) {

        console.error(error);

        setOffline();

        if (
            messagesCache.size === 0
        ) {

            showError(
                error.message
            );

        }

    } finally {

        loading =
            false;

    }

}


/* =========================================================
   SEND
========================================================= */

async function sendMessage() {

    const username =
        usernameInput.value
            .trim()
            .substring(
                0,
                24
            );

    const message =
        messageInput.value
            .trim()
            .substring(
                0,
                2000
            );


    if (!username) {

        showError(
            "Enter a username first."
        );

        return;

    }


    if (
        !message &&
        !selectedImageBase64
    ) {

        showError(
            "Type a message or choose an image."
        );

        return;

    }


    sendButton.disabled =
        true;

    sendButton.textContent =
        "Sending...";


    try {

        const response =
            await fetch(
                API_URL,
                {

                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            username:
                                username,

                            channel:
                                CHANNEL,

                            message:
                                message,

                            image:
                                selectedImageBase64

                        })

                }
            );


        const text =
            await response.text();


        let data;

        try {

            data =
                JSON.parse(text);

        } catch {

            throw new Error(
                "Server returned invalid JSON."
            );

        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Message could not be sent." +
                (
                    data.fix
                        ? "\n\n" +
                          data.fix
                        : ""
                )
            );

        }


        messageInput.value =
            "";

        clearSelectedImage();

        await loadMessages();


    } catch (error) {

        showError(
            error.message
        );

    } finally {

        sendButton.disabled =
            false;

        sendButton.textContent =
            "Send";

    }

}


sendButton.addEventListener(
    "click",
    sendMessage
);


messageInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================================
   CONTEXT MENU
========================================================= */

function openContextMenu(
    x,
    y
) {

    contextMenu.style.display =
        "block";

    const width =
        contextMenu.offsetWidth;

    const height =
        contextMenu.offsetHeight;


    contextMenu.style.left =
        Math.min(
            x,
            window.innerWidth -
                width -
                8
        ) + "px";


    contextMenu.style.top =
        Math.min(
            y,
            window.innerHeight -
                height -
                8
        ) + "px";

}


function closeContextMenu() {

    contextMenu.style.display =
        "none";

    selectedMessage =
        null;

}


document.addEventListener(
    "click",
    event => {

        if (
            !contextMenu.contains(
                event.target
            )
        ) {

            closeContextMenu();

        }

    }
);


/* =========================================================
   EDIT
========================================================= */

contextEdit.addEventListener(
    "click",
    () => {

        if (!selectedMessage) {
            return;
        }

        editMessage =
            selectedMessage;

        editInput.value =
            editMessage.message ||
            "";

        editOverlay.classList.add(
            "open"
        );

        editInput.focus();

        closeContextMenu();

    }
);


editCancel.addEventListener(
    "click",
    () => {

        editOverlay.classList.remove(
            "open"
        );

        editMessage =
            null;

    }
);


editSave.addEventListener(
    "click",
    async () => {

        if (!editMessage) {
            return;
        }


        const newMessage =
            editInput.value
                .trim()
                .substring(
                    0,
                    2000
                );


        if (!newMessage) {

            showError(
                "Message cannot be empty."
            );

            return;

        }


        editSave.disabled =
            true;


        try {

            const response =
                await fetch(
                    API_URL,
                    {

                        method:
                            "PATCH",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                id:
                                    editMessage.id,

                                username:
                                    usernameInput.value
                                        .trim(),

                                message:
                                    newMessage,

                                channel:
                                    CHANNEL

                            })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Could not edit message."
                );

            }


            editOverlay.classList.remove(
                "open"
            );

            editMessage =
                null;


            await loadMessages();


        } catch (error) {

            showError(
                error.message
            );

        } finally {

            editSave.disabled =
                false;

        }

    }
);


/* =========================================================
   DELETE MESSAGE
========================================================= */

contextDelete.addEventListener(
    "click",
    async () => {

        if (!selectedMessage) {
            return;
        }


        const message =
            selectedMessage;


        closeContextMenu();


        const sure =
            confirm(
                "Delete this message?\n\nThis cannot be undone."
            );


        if (!sure) {
            return;
        }


        try {

            const response =
                await fetch(
                    API_URL,
                    {

                        method:
                            "DELETE",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                id:
                                    message.id,

                                username:
                                    usernameInput.value
                                        .trim(),

                                channel:
                                    CHANNEL

                            })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Could not delete message."
                );

            }


            await loadMessages();


        } catch (error) {

            showError(
                error.message
            );

        }

    }
);


/* =========================================================
   SETTINGS
========================================================= */

settingsButton.addEventListener(
    "click",
    () => {

        settingsOverlay.classList.add(
            "open"
        );

    }
);


settingsClose.addEventListener(
    "click",
    () => {

        settingsOverlay.classList.remove(
            "open"
        );

    }
);


/* =========================================================
   REMOVE EVERYTHING
========================================================= */

removeEverythingButton.addEventListener(
    "click",
    () => {

        /*
         * Optional client-side admin check.
         *
         * Real security must be done
         * server-side.
         */

        const username =
            usernameInput.value
                .trim();


        if (
            username !==
            ADMIN_USERNAME
        ) {

            showError(
                "You do not have permission to remove everything."
            );

            return;

        }


        confirmationStep =
            1;

        showConfirmation();

    }
);


/* =========================================================
   CONFIRMATION SYSTEM
========================================================= */

function showConfirmation() {

    confirmOverlay.classList.add(
        "open"
    );


    if (
        confirmationStep === 1
    ) {

        confirmTitle.textContent =
            "Remove every message?";

        confirmText.textContent =
            "This will request permanent deletion of every message in the general channel.";

        confirmWarning.textContent =
            "Messages, images, edits and other stored message data may be permanently removed.";

        confirmAction.textContent =
            "I know";

    }


    else if (
        confirmationStep === 2
    ) {

        confirmTitle.textContent =
            "Are you sure?";

        confirmText.textContent =
            "You are about to remove every message. There will be no normal undo option.";

        confirmWarning.textContent =
            "Please make sure you really want to continue.";

        confirmAction.textContent =
            "Yes";

    }


    else if (
        confirmationStep === 3
    ) {

        confirmTitle.textContent =
            "Last time.";

        confirmText.textContent =
            "Are you ultra sure every memory is being removed and has no evidence of existing?";

        confirmWarning.textContent =
            "This is the final confirmation before the server is asked to delete the messages.";

        confirmAction.textContent =
            "Yes, delete everything";

    }

}


confirmCancel.addEventListener(
    "click",
    cancelConfirmation
);


function cancelConfirmation() {

    confirmationStep =
        0;

    confirmOverlay.classList.remove(
        "open"
    );

}


confirmAction.addEventListener(
    "click",
    async () => {

        if (
            confirmationStep < 3
        ) {

            confirmationStep++;

            showConfirmation();

            return;

        }


        await deleteEverything();

    }
);


/* =========================================================
   DELETE EVERYTHING REQUEST
========================================================= */

async function deleteEverything() {

    confirmAction.disabled =
        true;

    confirmAction.textContent =
        "Deleting...";


    try {

        const username =
            usernameInput.value
                .trim();


        const response =
            await fetch(
                API_URL,
                {

                    method:
                        "DELETE",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            action:
                                "delete_all",

                            username:
                                username,

                            channel:
                                CHANNEL

                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "The server rejected the deletion request."
            );

        }


        messagesCache.clear();

        messagesElement.innerHTML =
            '<div id="empty">No messages yet.</div>';


        confirmationStep =
            0;

        confirmOverlay.classList.remove(
            "open"
        );

        settingsOverlay.classList.remove(
            "open"
        );


    } catch (error) {

        showError(
            error.message
        );

    } finally {

        confirmAction.disabled =
            false;

        confirmAction.textContent =
            "Continue";

    }

}


/* =========================================================
   FULLSCREEN IMAGE
========================================================= */

function openImage(
    src,
    username
) {

    fullscreenImage.src =
        src;

    imageName.textContent =
        username
            ? "Sent by " + username
            : "";

    imageViewer.classList.add(
        "open"
    );

}


function closeImage() {

    imageViewer.classList.remove(
        "open"
    );

    fullscreenImage.src =
        "";

}


backButton.addEventListener(
    "click",
    closeImage
);


imageViewer.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            imageViewer
        ) {

            closeImage();

        }

    }
);


document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            if (
                imageViewer.classList.contains(
                    "open"
                )
            ) {

                closeImage();

            }

            if (
                editOverlay.classList.contains(
                    "open"
                )
            ) {

                editOverlay.classList.remove(
                    "open"
                );

            }

            if (
                confirmOverlay.classList.contains(
                    "open"
                )
            ) {

                cancelConfirmation();

            }

        }

    }
);


/* =========================================================
   CLOSE MODALS BY BACKGROUND
========================================================= */

settingsOverlay.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            settingsOverlay
        ) {

            settingsOverlay.classList.remove(
                "open"
            );

        }

    }
);


editOverlay.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            editOverlay
        ) {

            editOverlay.classList.remove(
                "open"
            );

            editMessage =
                null;

        }

    }
);


/* =========================================================
   START
========================================================= */

loadMessages();


/*
 * Existing messages are NOT cleared
 * during refresh.
 */

setInterval(
    loadMessages,
    REFRESH_TIME
);

</script>
