<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5548cf">
<title>Chat</title>
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{"imports":{"react":"https://esm.sh/react@18.3.1","react-dom/client":"https://esm.sh/react-dom@18.3.1/client","yjs":"https://esm.sh/yjs@13.6.18","y-webrtc":"https://esm.sh/y-webrtc@10.2.3?deps=yjs@13.6.18"}}
</script>
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="module">
const app=document.getElementById("app");
const showError=e=>{
app.innerHTML="<div style=\"min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f5fa;font-family:system-ui;color:#20243a\"><div style=\"max-width:700px;padding:24px;background:white;border:1px solid #e4e6ef;border-radius:16px\"><h2>Chat failed to load</h2><pre style=\"white-space:pre-wrap;overflow:auto\">"+String(e?.stack||e)+"</pre></div></div>";
};
(async()=>{
try{
const [appSource,messageSource]=await Promise.all([fetch("./app.jsx").then(r=>{if(!r.ok)throw Error("Could not load app.jsx");return r.text()}),fetch("./Message.jsx").then(r=>{if(!r.ok)throw Error("Could not load Message.jsx");return r.text()})]);
const messageCode=Babel.transform(messageSource,{presets:["react"]}).code;
const messageUrl=URL.createObjectURL(new Blob([messageCode],{type:"text/javascript"}));
const appCode=Babel.transform(appSource.replace('from"./Message.jsx"','from"'+messageUrl+'"'),{presets:["react"]}).code;
const appUrl=URL.createObjectURL(new Blob([appCode],{type:"text/javascript"}));
await import(appUrl);
}catch(e){showError(e)}
})();
</script>
</body>
</html>
