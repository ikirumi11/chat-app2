<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat App 2</title>
<style>:root{--bg:#08090f;--surface:#0e1018;--surface2:#131621;--surface3:#191c29;--line:#252a3a;--line2:#343a4e;--text:#f7f7fb;--muted:#8d93a6;--accent:#796cff;--accent2:#5949df;--good:#55dc91;--danger:#ff667a}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}button{border:0;color:#fff;cursor:pointer}input{outline:0;color:#fff}.hidden{display:none!important}
body:before{content:"";position:fixed;inset:-30%;pointer-events:none;background:radial-gradient(circle at 72% 10%,#6555ff20,transparent 28%),radial-gradient(circle at 15% 90%,#4b3de012,transparent 25%);filter:blur(20px)}
.app{position:relative;width:100%;height:100dvh;display:flex;flex-direction:column;background:linear-gradient(135deg,#090a10,#08090f 52%,#0b0d15)}
.top{height:76px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 24px;border-bottom:1px solid #ffffff0b;background:#0b0d14dc;backdrop-filter:blur(26px);z-index:2}
.brand{display:flex;align-items:center;gap:13px;min-width:0}.logo{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:18px;font-weight:900;background:linear-gradient(145deg,#9389ff,#5645df);border:1px solid #ffffff22;box-shadow:0 12px 38px #6658ff35,0 0 0 5px #7769ff08}.title{font-size:15px;font-weight:850;letter-spacing:-.2px}.status{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);margin-top:4px}.status:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 13px #55dc91aa}
.topActions{display:flex;align-items:center;gap:8px}.topActions button{height:38px;padding:0 13px;border-radius:11px;background:#141721;border:1px solid #ffffff0d;color:#cdd1dc;font-size:11px;font-weight:650;transition:transform .18s,background .18s,border-color .18s,box-shadow .18s}.topActions button:hover{transform:translateY(-1px);background:#1b1e2b;border-color:#ffffff1b;box-shadow:0 8px 24px #0004}.topActions button:first-child{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:#8d83ff;color:#fff;box-shadow:0 8px 28px #685aff35}
.room{height:58px;flex:none;display:flex;align-items:center;gap:9px;padding:9px 24px;border-bottom:1px solid #ffffff08;background:#0b0d14b8}.room input{flex:1;min-width:0;height:38px;padding:0 13px;border:1px solid #ffffff0c;background:#10131c;border-radius:11px;font-size:11px;color:#aeb5c5}.room input:focus{border-color:#7064f0}.room button{height:38px;padding:0 14px;border-radius:11px;background:#171a25;border:1px solid #ffffff0d;color:#d2d5df;font-size:11px;font-weight:650}.room button:hover{background:#202431}
.messages{flex:1;min-height:0;overflow:auto;padding:30px max(18px,calc((100vw - 1040px)/2));scroll-behavior:smooth}.messages::-webkit-scrollbar{width:8px}.messages::-webkit-scrollbar-thumb{background:#292e3e;border-radius:20px}.messages::-webkit-scrollbar-track{background:transparent}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted)}.empty>div{max-width:390px}.emptyIcon{width:76px;height:76px;margin:0 auto 18px;border-radius:24px;display:grid;place-items:center;font-size:30px;color:#a69fff;background:linear-gradient(145deg,#181a28,#10121a);border:1px solid #ffffff10;box-shadow:0 24px 70px #0008,0 0 45px #6758ff12}.empty div:last-child{font-size:13px;line-height:1.6}
.msg{display:flex;gap:12px;max-width:900px;margin:0 auto 20px;animation:msgIn .22s ease}.msg.mine{flex-direction:row-reverse}.avatar{width:42px;height:42px;flex:none;border-radius:14px;overflow:hidden;background:linear-gradient(145deg,#7467f7,#39309d);display:grid;place-items:center;font-size:15px;font-weight:850;color:#fff;border:1px solid #ffffff18;box-shadow:0 8px 24px #0004}.avatar img{width:100%;height:100%;object-fit:cover}.bubbleWrap{min-width:0;max-width:min(78%,720px)}.msg.mine .bubbleWrap{align-items:flex-end;display:flex;flex-direction:column}.name{font-size:10px;color:#9299ab;margin:2px 0 6px;font-weight:750;letter-spacing:.1px}.mine .name{color:#bdb6ff}.bubble{padding:12px 15px;border:1px solid #ffffff0b;background:linear-gradient(145deg,#171a24,#11141c);border-radius:17px 17px 17px 5px;box-shadow:0 10px 30px #0003}.mine .bubble{background:linear-gradient(145deg,#695cf0,#4d40bd);border-color:#8177ff;border-radius:17px 17px 5px 17px;box-shadow:0 10px 30px #5145df35}.text{white-space:pre-wrap;word-break:break-word;line-height:1.55;font-size:13.5px}
.fileCard{margin-top:8px;border-radius:14px;overflow:hidden;background:#090b11aa;border:1px solid #ffffff12;box-shadow:0 8px 25px #0003}.fileCard img,.fileCard video{display:block;width:100%;max-height:440px;object-fit:contain;background:#050608}.fileMeta{padding:11px 12px;display:flex;align-items:center;gap:10px}.fileIcon{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;background:#ffffff0d;font-size:17px}.fileInfo{min-width:0;flex:1}.fileName{font-weight:750;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fileSize{font-size:9px;color:#8d95a5;margin-top:3px}.download{padding:8px 11px;border-radius:9px;color:#fff;text-decoration:none;background:#ffffff12;border:1px solid #ffffff0c;font-size:10px;font-weight:700}.download:hover{background:#ffffff1d}.progress{height:3px;background:#ffffff0b}.progress i{display:block;height:100%;width:0;background:#aaa2ff;transition:width .15s}
.send{flex:none;display:flex;gap:9px;padding:14px max(18px,calc((100vw - 1040px)/2));border-top:1px solid #ffffff09;background:#0b0d14e8;backdrop-filter:blur(26px);z-index:2}.send input:not(.hidden){height:48px;flex:1;min-width:0;padding:0 16px;border:1px solid #ffffff0d;background:#12151f;border-radius:14px;font-size:13px;box-shadow:inset 0 1px #ffffff04}.send input:focus{border-color:#7165ef;box-shadow:0 0 0 3px #6c60ff12}.attach{width:48px;height:48px;flex:none;border-radius:14px;background:#151923;border:1px solid #ffffff0d;font-size:24px;color:#cbd0dc;transition:.18s}.attach:hover{background:#1d2230;transform:translateY(-1px)}.sendBtn{width:84px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:800;font-size:12px;box-shadow:0 9px 28px #6659ff28;transition:.18s}.sendBtn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.panel{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,#342b6b55,transparent 42%),radial-gradient(circle at 50% 100%,#20184b22,transparent 45%),#07080e;z-index:10}.card{position:relative;width:min(500px,100%);padding:36px;border:1px solid #ffffff14;background:linear-gradient(145deg,#141722f2,#0d1018f5);backdrop-filter:blur(34px);border-radius:30px;box-shadow:0 40px 120px #000c,0 0 80px #6659ff0d;animation:cardIn .45s cubic-bezier(.2,.8,.2,1)}.heroLogo{width:70px;height:70px;border-radius:22px;display:grid;place-items:center;font-size:30px;font-weight:900;margin-bottom:21px;background:linear-gradient(145deg,#958aff,#5645df);border:1px solid #ffffff22;box-shadow:0 18px 45px #685bff3d,0 0 0 7px #7769ff08}.card h1{margin:0;font-size:31px;letter-spacing:-1.2px}.card p{color:#969daf;line-height:1.6;margin:9px 0 23px;font-size:13px;max-width:420px}.profileSetup{display:flex;align-items:center;gap:12px;margin-bottom:11px}.pfpPreview{width:50px;height:50px;border-radius:16px;overflow:hidden;background:#191d29;border:1px solid #ffffff10;display:grid;place-items:center;font-weight:850}.pfpPreview img{width:100%;height:100%;object-fit:cover}.pfpPick{height:38px;padding:0 12px;border-radius:10px;background:#191d28;border:1px solid #ffffff0d;font-size:10px;font-weight:700}.pfpPick:hover{background:#222736}.card>input,.card .row input{height:48px;padding:0 14px;border:1px solid #ffffff0d;background:#0c1018;border-radius:13px;font-size:12px}.card input:focus{border-color:#7064f0;box-shadow:0 0 0 3px #6c60ff12}.row{display:flex;gap:9px;margin-top:9px}.row>*{flex:1}.row button{height:48px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:800;font-size:12px;box-shadow:0 9px 26px #6659ff25}.small{font-size:10px;color:#70798a;margin-top:14px;line-height:1.55}
.toast{position:fixed;left:50%;bottom:94px;transform:translate(-50%,16px);padding:10px 15px;border-radius:12px;background:#191d28f7;border:1px solid #ffffff16;box-shadow:0 16px 45px #0009;opacity:0;pointer-events:none;transition:.22s;z-index:30;font-size:11px;color:#eef0f6}.toast.show{opacity:1;transform:translate(-50%,0)}
.savedVideo{min-height:190px;display:flex;align-items:center;gap:14px;padding:20px;background:#090c12;border-radius:13px;color:#fff}.videoIcon{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:#6658ee;font-size:20px}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.975)}to{opacity:1;transform:none}}@keyframes msgIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media(max-width:760px){.top{height:auto;min-height:70px;padding:10px 11px;gap:10px}.brand{gap:9px}.logo{width:40px;height:40px}.topActions{flex-wrap:wrap;justify-content:flex-end;gap:5px;max-width:66%}.topActions button{height:34px;padding:0 9px;font-size:10px}.room{padding:8px 10px}.messages{padding:20px 9px}.msg{gap:8px;margin-bottom:16px}.avatar{width:36px;height:36px;border-radius:12px}.bubbleWrap{max-width:85%}.bubble{padding:10px 12px}.send{padding:9px}.send input:not(.hidden){height:45px}.attach,.sendBtn{height:45px}.sendBtn{width:68px}.card{padding:27px;border-radius:25px}.card h1{font-size:27px}.row{flex-direction:column}}
@media(max-width:440px){.title{font-size:13px}.status{font-size:10px}.topActions{max-width:72%}.topActions button:nth-child(2){display:none}.messages{padding-left:6px;padding-right:6px}.bubbleWrap{max-width:82%}.card{padding:23px}.heroLogo{width:62px;height:62px}}
</style>
</head>
<body>
<div id="join" class="panel"><div class="card"><div class="heroLogo">✦</div><h1>Chat App 2</h1><p>Private browser-to-browser chat with text, media, files and screen sharing.</p><div class="profileSetup"><div id="pfpPreview" class="pfpPreview">G</div><div><button type="button" id="pfpPick" class="pfpPick">Choose profile picture</button><input id="pfpInput" type="file" accept="image/*" class="hidden"></div></div><input id="name" maxlength="30" placeholder="Your name"><button id="joinBtn" style="width:100%;height:48px;margin-top:9px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:800;font-size:12px;box-shadow:0 9px 26px #6659ff25">Enter chat</button><div class="small">Everyone automatically joins the same chat. Your profile picture stays on this device.</div></div></div>
<div id="app" class="app hidden"><header class="top"><div class="brand"><div id="myAvatar" class="logo">✦</div><div><div class="title">Chat App 2</div><div id="status" class="status">Waiting for peers</div></div></div><div class="topActions"><button id="shareBtn">Share screen + audio</button><button id="saveBtn" class="ghost">Download chat</button><button id="copyBtn" class="ghost">Copy room</button><button id="leaveBtn">Leave</button></div></header><div id="roomBar" class="room hidden"><input id="roomDisplay" readonly><button id="copyRoomBtn">Copy</button></div><main id="messages" class="messages"><div class="empty"><div><div class="emptyIcon">✦</div><div>Join the room from another browser to start chatting.</div></div></div></main><form id="send" class="send"><input id="fileInput" type="file" multiple accept="image/*,video/*,*/*" class="hidden"><button type="button" id="attachBtn" class="attach" title="Send files">＋</button><input id="message" autocomplete="off" placeholder="Write a message…"><button class="sendBtn">Send</button></form></div><div id="toast" class="toast"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=id=>document.getElementById(id);let peer=null,room="",name="",pfp="",connections=new Map(),transfers=new Map(),screenStream=null;const CHUNK=48*1024;
const clean=s=>String(s||"").trim().replace(/[^a-zA-Z0-9_-]/g,"-").slice(0,40),formatSize=n=>n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":n<1073741824?(n/1048576).toFixed(1)+" MB":(n/1073741824).toFixed(1)+" GB";
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>$("toast").classList.remove("show"),1800)}
function setStatus(){let n=connections.size;$("status").textContent=n?"Connected":"Waiting for peers"}
function scroll(){let b=$("messages");b.scrollTop=b.scrollHeight}
function avatarHtml(d,mine){let src=mine?pfp:(d.pfp||"");return src?'<img src="'+src.replace(/"/g,"&quot;")+'">':(mine?(name||"G").charAt(0):(d.name||"G").charAt(0))}
function renderFile(f){
 let card=document.createElement("div");card.className="fileCard";let url=URL.createObjectURL(f.blob);
 if(f.type.startsWith("image/")){let x=document.createElement("img");x.src=url;x.alt=f.name;card.append(x)}
 else if(f.type.startsWith("video/")){let x=document.createElement("video");x.src=url;x.controls=true;x.playsInline=true;card.append(x)}
 let meta=document.createElement("div");meta.className="fileMeta";let icon=document.createElement("div");icon.className="fileIcon";icon.textContent=f.type.startsWith("image/")?"🖼️":f.type.startsWith("video/")?"🎬":"📎";let info=document.createElement("div");info.className="fileInfo";let nm=document.createElement("div");nm.className="fileName";nm.textContent=f.name;let sz=document.createElement("div");sz.className="fileSize";sz.textContent=formatSize(f.size);info.append(nm,sz);let dl=document.createElement("a");dl.className="download";dl.textContent="Save";dl.href=url;dl.download=f.name;meta.append(icon,info,dl);card.append(meta);return card
}
function addMessage(d,mine=false){
 let box=$("messages"),empty=box.querySelector(".empty");if(empty)empty.remove();let el=document.createElement("div");el.className="msg"+(mine?" mine":"");let av=document.createElement("div");av.className="avatar";av.innerHTML=avatarHtml(d,mine);let wrap=document.createElement("div");wrap.className="bubbleWrap";let n=document.createElement("div");n.className="name";n.textContent=mine?"You":d.name||"Guest";wrap.append(n);let bubble=document.createElement("div");bubble.className="bubble";if(d.text){let t=document.createElement("div");t.className="text";t.textContent=d.text;bubble.append(t)}if(d.file)bubble.append(renderFile(d.file));wrap.append(bubble);el.append(av,wrap);box.append(el);scroll()
}
function broadcast(d,except){for(let [id,c] of connections)if(id!==except&&c.open)try{c.send(d)}catch(e){}}
function receiveChunk(d,from){
 let t=transfers.get(d.id);if(!t){t={name:d.name,size:d.size,type:d.mime,chunks:[],received:0,total:d.total};transfers.set(d.id,t)}
 t.chunks[d.index]=d.chunk;t.received++;broadcast(d,from);
 if(d.end){let blob=new Blob(t.chunks,{type:t.type||"application/octet-stream"});transfers.delete(d.id);addMessage({name:d.sender||"Guest",pfp:d.pfp||"",file:{name:t.name,size:t.size,type:t.type,blob}},false)}
}
async function sendFile(file){
 if(!connections.size){toast("Connect to a peer first");return}
 let id=name+"-"+Date.now()+"-"+Math.random().toString(36).slice(2),total=Math.ceil(file.size/CHUNK)||1;addMessage({file:{name:file.name,size:file.size,type:file.type,blob:file}},true);
 let msg=$("messages").lastElementChild,bar=document.createElement("div");bar.className="progress";let i=document.createElement("i");bar.append(i);msg.querySelector(".fileCard").append(bar);
 for(let n=0;n<total;n++){let chunk=await file.slice(n*CHUNK,(n+1)*CHUNK).arrayBuffer();broadcast({type:"file",id,name:file.name,size:file.size,mime:file.type,total,index:n,chunk,sender:name,pfp,end:n===total-1});i.style.width=((n+1)/total*100)+"%";await new Promise(r=>setTimeout(r,0))}setTimeout(()=>bar.remove(),500)
}
function attach(c){
 connections.set(c.peer,c);setStatus();c.on("open",()=>{setStatus();try{c.send({type:"hello",name,pfp})}catch(e){}});c.on("data",d=>{if(d.type==="hello"){if(d.name)addMessage({name:d.name,pfp:d.pfp,text:"joined the room"});return}if(d.type==="chat"){addMessage(d);broadcast(d,c.peer);return}if(d.type==="file"){receiveChunk(d,c.peer)}});c.on("close",()=>{connections.delete(c.peer);setStatus()});c.on("error",()=>{connections.delete(c.peer);setStatus()})
}
function connectTo(id){if(!peer||id===peer.id||connections.has(id))return;attach(peer.connect(id,{reliable:true}))}
function start(){
 room="global";name=($("name").value.trim()||"Guest").slice(0,30);$("roomDisplay").value=room;$("join").classList.add("hidden");$("app").classList.remove("hidden");$("myAvatar").innerHTML=pfp?'<img src="'+pfp.replace(/"/g,"&quot;")+'" style="width:100%;height:100%;object-fit:cover;border-radius:12px">':"✦";
 const prefix="p2p-chat-"+room+"-",slots=Array.from({length:12},(_,i)=>prefix+i),tried=new Set();
 function trySlot(){const available=slots.filter(x=>!tried.has(x));if(!available.length){toast("Room is full");return}const id=available[Math.floor(Math.random()*available.length)];tried.add(id);peer=new Peer(id,{host:"0.peerjs.com",port:443,path:"/",secure:true});peer.on("open",myId=>{setStatus();slots.filter(x=>x!==myId).forEach(connectTo);localStorage.setItem("p2p-last-room",room)});peer.on("connection",attach);peer.on("call",call=>{call.answer();call.on("error",()=>{});call.on("stream",stream=>{let box=$("messages"),empty=box.querySelector(".empty");if(empty)empty.remove();let el=document.createElement("div");el.className="msg";let av=document.createElement("div");av.className="avatar";let wrap=document.createElement("div");wrap.className="bubbleWrap";let n=document.createElement("div");n.className="name";n.textContent=(call.metadata&&call.metadata.name)||"Guest";wrap.append(n);let bubble=document.createElement("div");bubble.className="bubble";let t=document.createElement("div");t.className="text";t.textContent="Live screen share";bubble.append(t);let v=document.createElement("video");v.srcObject=stream;v.autoplay=true;v.playsInline=true;v.controls=true;v.style.cssText="display:block;width:100%;max-height:390px;object-fit:contain;background:#050608;border-radius:10px";bubble.append(v);wrap.append(bubble);el.append(av,wrap);box.append(el);scroll()})});peer.on("error",e=>{if(e.type==="unavailable-id"){trySlot();return}toast("Connection error: "+e.type);$("status").textContent="Connection error"})}trySlot()
}
$("pfpPick").onclick=()=>$("pfpInput").click();$("pfpInput").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{pfp=r.result;$("pfpPreview").innerHTML='<img src="'+pfp+'" style="width:100%;height:100%;object-fit:cover">';localStorage.setItem("chat2-pfp",pfp)};r.readAsDataURL(f)};
$("name").value=localStorage.getItem("chat2-name")||"";pfp=localStorage.getItem("chat2-pfp")||"";if(pfp)$("pfpPreview").innerHTML='<img src="'+pfp+'" style="width:100%;height:100%;object-fit:cover">';
$("joinBtn").onclick=()=>{localStorage.setItem("chat2-name",$("name").value.trim());start()};$("name").addEventListener("keydown",e=>{if(e.key==="Enter")$("joinBtn").click()});
$("send").onsubmit=e=>{e.preventDefault();let text=$("message").value.trim();if(!text)return;let d={type:"chat",name,pfp,text,time:Date.now()};addMessage(d,true);broadcast(d);$("message").value="";$("message").focus()};
$("attachBtn").onclick=()=>$("fileInput").click();$("fileInput").onchange=e=>{[...e.target.files].forEach(sendFile);e.target.value=""};
$("shareBtn").onclick=async()=>{if(screenStream){screenStream.getTracks().forEach(t=>t.stop());screenStream=null;$("shareBtn").textContent="Share screen + audio";return}try{screenStream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});$("shareBtn").textContent="Stop sharing";screenStream.getVideoTracks()[0].onended=()=>{screenStream=null;$("shareBtn").textContent="Share screen + audio"};for(let [id,c] of connections)if(c.open){try{const call=peer.call(id,screenStream,{metadata:{name,pfp}});call.on("error",()=>toast("Screen share connection failed"))}catch(e){toast("Could not share with a peer")}}}catch(e){toast("Screen sharing cancelled")}};
function saveChat(){const clone=$("messages").cloneNode(true);clone.querySelectorAll(".progress").forEach(x=>x.remove());clone.querySelectorAll("video").forEach(v=>{const wrap=document.createElement("div");wrap.className="savedVideo";wrap.innerHTML="<div class=\"videoIcon\">▶</div><div><b>Video</b><div>Video from chat</div></div>";v.replaceWith(wrap)});const css=document.querySelector("style").textContent;const safeRoom=room.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");const html='<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat - '+safeRoom+'</title><style>'+css+'body{overflow:auto;background:#07080c}.saved{width:100%;max-width:1000px;margin:0 auto;min-height:100vh}.savedHead{padding:22px 18px;border-bottom:1px solid var(--line);background:#0b0e14}.savedHead h1{margin:0;font-size:20px}.savedHead p{margin:5px 0 0;color:var(--muted);font-size:12px}.messages{height:auto;overflow:visible}.savedVideo{height:180px;display:flex;align-items:center;gap:14px;padding:20px;background:#090c12;border-radius:10px;color:#fff}.videoIcon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#6658ee;font-size:20px}.savedNote{padding:18px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}</style></head><body><div class="saved"><div class="savedHead"><h1>Chat App 2</h1><p>Room: '+safeRoom+' · Saved chat</p></div>'+clone.outerHTML+'<div class="savedNote">This is a saved copy of the chat. Sending controls and live screen-sharing controls are not included.</div></div></body></html>';const blob=new Blob([html],{type:"text/html;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="chat-"+(room||"saved")+"-"+new Date().toISOString().slice(0,10)+".html";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("Chat saved as HTML")}
async function copyRoom(){try{await navigator.clipboard.writeText(room);toast("Room code copied")}catch(e){toast(room)}}$("saveBtn").onclick=saveChat;$("copyBtn").onclick=copyRoom;$("copyRoomBtn").onclick=copyRoom;$("leaveBtn").onclick=()=>location.reload();
</script></body></html>
