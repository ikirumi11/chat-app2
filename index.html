<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b0d12">

<title>MyChat</title>

<style>

*{
    box-sizing:border-box;
}

:root{
    --bg:#080a0f;
    --panel:#0d1017;
    --panel2:#11151d;
    --panel3:#171b24;
    --border:rgba(255,255,255,.07);
    --text:#f5f7fb;
    --muted:#858c9a;
    --accent:#6d7cff;
    --accent2:#8b5cf6;
    --green:#43e08b;
    --danger:#ff5d6c;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    background:
        radial-gradient(
            circle at 20% 0%,
            rgba(109,124,255,.09),
            transparent 35%
        ),
        radial-gradient(
            circle at 100% 100%,
            rgba(139,92,246,.07),
            transparent 35%
        ),
        var(--bg);

    color:var(--text);

    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    overflow:hidden;
}


/* ========================================
   APP
======================================== */

.app{
    width:100%;
    height:100%;
    display:flex;
}


/* ========================================
   SIDEBAR
======================================== */

.sidebar{
    width:270px;
    height:100%;

    background:
        linear-gradient(
            180deg,
            rgba(18,21,29,.98),
            rgba(9,11,16,.98)
        );

    border-right:1px solid var(--border);

    display:flex;
    flex-direction:column;

    padding:20px;

    flex-shrink:0;
}


/* BRAND */

.brand{
    display:flex;
    align-items:center;
    gap:12px;

    padding:8px 4px 25px;
}

.brand-icon{
    width:42px;
    height:42px;

    border-radius:13px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:19px;
    font-weight:900;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    box-shadow:
        0 8px 30px
        rgba(109,124,255,.28);
}

.brand-name{
    font-size:18px;
    font-weight:800;
    letter-spacing:-.4px;
}

.brand-sub{
    font-size:11px;
    color:var(--muted);
    margin-top:2px;
}


/* CHANNEL SECTION */

.section-title{
    color:#666d7b;
    font-size:10px;
    font-weight:800;

    text-transform:uppercase;
    letter-spacing:1.3px;

    margin:
        5px 5px
        10px;
}

.channel{
    width:100%;

    display:flex;
    align-items:center;

    gap:10px;

    padding:11px 12px;

    border-radius:10px;

    color:#9da4b1;

    cursor:pointer;

    transition:
        background .18s,
        color .18s,
        transform .18s;

    user-select:none;
}

.channel:hover{
    background:rgba(255,255,255,.045);
    color:white;
}

.channel.active{
    background:
        linear-gradient(
            90deg,
            rgba(109,124,255,.18),
            rgba(109,124,255,.06)
        );

    color:white;

    box-shadow:
        inset 2px 0 0 var(--accent);
}

.channel-hash{
    font-size:20px;
    color:#707786;
    line-height:0;
}

.channel.active .channel-hash{
    color:#8794ff;
}

.channel-name{
    font-size:14px;
    font-weight:600;
}


/* SIDEBAR BOTTOM */

.sidebar-bottom{
    margin-top:auto;

    padding-top:15px;

    border-top:1px solid var(--border);
}

.profile{
    display:flex;
    align-items:center;
    gap:10px;

    padding:9px;
}

.avatar{
    width:38px;
    height:38px;

    border-radius:12px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-weight:800;
    font-size:13px;

    background:
        linear-gradient(
            135deg,
            #6675ff,
            #925cff
        );
}

.profile-name{
    font-size:13px;
    font-weight:700;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.profile-status{
    display:flex;
    align-items:center;
    gap:5px;

    color:#727987;

    font-size:11px;

    margin-top:2px;
}

.profile-dot{
    width:6px;
    height:6px;

    border-radius:50%;

    background:var(--green);

    box-shadow:
        0 0 8px
        rgba(67,224,139,.7);
}


/* ========================================
   CHAT AREA
======================================== */

.chat{
    min-width:0;
    flex:1;

    display:flex;
    flex-direction:column;

    position:relative;
}


/* HEADER */

.header{
    height:70px;

    display:flex;
    align-items:center;

    padding:0 25px;

    background:
        rgba(13,16,23,.82);

    backdrop-filter:
        blur(18px);

    border-bottom:
        1px solid var(--border);

    flex-shrink:0;

    z-index:10;
}

.header-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.header-hash{
    font-size:27px;
    font-weight:300;

    color:#6e7582;
}

.header-channel{
    font-size:15px;
    font-weight:800;
}

.header-description{
    color:#626a78;
    font-size:12px;

    margin-left:7px;

    padding-left:12px;

    border-left:
        1px solid var(--border);
}


/* CONNECTION */

.connection{
    margin-left:auto;

    display:flex;
    align-items:center;
    gap:8px;

    padding:8px 11px;

    border:
        1px solid var(--border);

    background:
        rgba(255,255,255,.025);

    border-radius:10px;

    color:#8b929f;

    font-size:11px;
}

.connection-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#777;
}

.connection.connected .connection-dot{
    background:var(--green);

    box-shadow:
        0 0 10px
        rgba(67,224,139,.7);
}

.connection.error .connection-dot{
    background:var(--danger);
}


/* ========================================
   MESSAGES
======================================== */

.messages{
    flex:1;

    overflow-y:auto;

    padding:
        25px
        clamp(15px,4vw,70px)
        30px;

    scroll-behavior:smooth;
}


/* SCROLLBAR */

.messages::-webkit-scrollbar{
    width:7px;
}

.messages::-webkit-scrollbar-track{
    background:transparent;
}

.messages::-webkit-scrollbar-thumb{
    background:#252a35;
    border-radius:20px;
}

.messages::-webkit-scrollbar-thumb:hover{
    background:#323846;
}


/* MESSAGE */

.message{
    display:flex;

    gap:13px;

    max-width:900px;

    margin:
        0 auto
        20px;

    animation:
        messageIn
        .25s
        ease;
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:translateY(6px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.message-avatar{
    width:40px;
    height:40px;

    flex-shrink:0;

    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:13px;
    font-weight:800;

    background:
        linear-gradient(
            135deg,
            #6675ff,
            #925cff
        );

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.25);
}

.message-content{
    min-width:0;
}

.message-meta{
    display:flex;
    align-items:baseline;

    gap:8px;

    margin-bottom:4px;
}

.message-user{
    font-size:14px;
    font-weight:800;
}

.message-time{
    color:#555c69;
    font-size:10px;
}

.message-text{
    color:#d7dae1;

    font-size:14px;

    line-height:1.6;

    white-space:pre-wrap;
    overflow-wrap:anywhere;
}


/* EMPTY */

.empty{
    height:100%;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    color:#737a88;
}

.empty-icon{
    width:70px;
    height:70px;

    border-radius:22px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin:
        0 auto
        18px;

    font-size:32px;

    background:
        linear-gradient(
            135deg,
            rgba(109,124,255,.15),
            rgba(139,92,246,.12)
        );

    border:
        1px solid
        rgba(109,124,255,.15);
}

.empty-title{
    color:#e7e9ef;
    font-size:17px;
    font-weight:800;

    margin-bottom:6px;
}

.empty-text{
    font-size:12px;
    color:#686f7d;
}


/* ========================================
   COMPOSER
======================================== */

.composer{
    padding:
        10px
        clamp(15px,4vw,70px)
        22px;

    flex-shrink:0;
}

.composer-inner{
    max-width:900px;

    margin:auto;

    display:flex;
    align-items:flex-end;

    padding:6px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(24,28,37,.9);

    border-radius:16px;

    box-shadow:
        0 15px 50px
        rgba(0,0,0,.25);

    transition:
        border .2s,
        box-shadow .2s;
}

.composer-inner:focus-within{
    border-color:
        rgba(109,124,255,.4);

    box-shadow:
        0 15px 50px
        rgba(0,0,0,.3),
        0 0 0 3px
        rgba(109,124,255,.06);
}

textarea{
    flex:1;

    min-height:44px;
    max-height:150px;

    resize:none;

    border:0;
    outline:0;

    background:transparent;

    color:white;

    padding:
        12px
        13px;

    font:
        inherit;

    font-size:14px;
}

textarea::placeholder{
    color:#666d7b;
}

.send{
    width:44px;
    height:44px;

    border:0;

    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    color:white;

    cursor:pointer;

    transition:
        transform .15s,
        filter .15s;

    font-size:18px;
}

.send:hover{
    filter:brightness(1.12);
    transform:translateY(-1px);
}

.send:active{
    transform:scale(.95);
}

.send:disabled{
    opacity:.4;
    cursor:not-allowed;
}


/* ========================================
   LOGIN
======================================== */

.login{
    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(109,124,255,.12),
            transparent 40%
        ),
        #07090d;

    z-index:1000;
}

.login-box{
    width:430px;
    max-width:
        calc(100% - 30px);

    padding:38px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:24px;

    background:
        rgba(17,20,28,.88);

    backdrop-filter:
        blur(25px);

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.55);

    animation:
        loginIn
        .35s
        ease;
}

@keyframes loginIn{

    from{
        opacity:0;
        transform:
            translateY(15px)
            scale(.98);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }

}

.login-logo{
    width:60px;
    height:60px;

    border-radius:19px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:22px;

    font-size:26px;
    font-weight:900;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    box-shadow:
        0 12px 40px
        rgba(109,124,255,.3);
}

.login-title{
    font-size:28px;
    font-weight:900;

    letter-spacing:-1px;

    margin-bottom:8px;
}

.login-description{
    color:#818895;

    font-size:13px;

    line-height:1.6;

    margin-bottom:25px;
}

.login-input{
    width:100%;
    height:50px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:12px;

    background:#0b0e14;

    color:white;

    outline:0;

    padding:0 15px;

    font-size:14px;

    transition:
        border .2s,
        box-shadow .2s;
}

.login-input:focus{
    border-color:
        rgba(109,124,255,.6);

    box-shadow:
        0 0 0 3px
        rgba(109,124,255,.08);
}

.login-button{
    width:100%;
    height:50px;

    margin-top:12px;

    border:0;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    color:white;

    font-size:14px;
    font-weight:800;

    cursor:pointer;

    transition:
        transform .15s,
        filter .15s;
}

.login-button:hover{
    filter:brightness(1.1);
    transform:translateY(-1px);
}

.login-error{
    color:var(--danger);
    font-size:12px;
    margin-top:12px;
}


/* ========================================
   ERROR
======================================== */

.error-screen{
    position:fixed;
    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    padding:20px;

    background:
        rgba(0,0,0,.8);

    backdrop-filter:
        blur(12px);

    z-index:2000;
}

.error-box{
    width:700px;
    max-width:100%;

    padding:28px;

    border:
        1px solid
        rgba(255,93,108,.3);

    border-radius:18px;

    background:#11151d;

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.5);
}

.error-title{
    color:#ff6877;

    font-size:20px;
    font-weight:900;

    margin-bottom:15px;
}

.error-code{
    padding:15px;

    background:#080a0e;

    border-radius:10px;

    color:#ff8a96;

    font:
        12px/1.6
        monospace;

    white-space:pre-wrap;

    overflow:auto;

    max-height:250px;
}

.error-fix{
    margin-top:15px;

    color:#a6acb7;

    font-size:12px;

    line-height:1.7;

    white-space:pre-wrap;
}

.error-buttons{
    display:flex;
    gap:8px;

    margin-top:20px;
}

.error-button{
    border:0;

    padding:
        10px
        15px;

    border-radius:9px;

    background:#242936;

    color:white;

    cursor:pointer;
}

.error-button.primary{
    background:var(--accent);
}

.copy-success{
    color:var(--green);

    font-size:11px;

    margin-top:10px;

    display:none;
}


/* ========================================
   MOBILE
======================================== */

@media(max-width:700px){

    .sidebar{
        width:72px;
        padding:12px 8px;
    }

    .brand{
        justify-content:center;
        padding-bottom:18px;
    }

    .brand-text{
        display:none;
    }

    .section-title{
        display:none;
    }

    .channel{
        justify-content:center;
        padding:13px 5px;
    }

    .channel-name{
        display:none;
    }

    .sidebar-bottom{
        display:none;
    }

    .header{
        height:62px;
        padding:0 15px;
    }

    .header-description{
        display:none;
    }

    .connection-text{
        display:none;
    }

    .messages{
        padding:
            18px
            12px
            20px;
    }

    .composer{
        padding:
            8px
            10px
            12px;
    }

    .message{
        gap:9px;
        margin-bottom:17px;
    }

    .message-avatar{
        width:35px;
        height:35px;
        border-radius:10px;
    }

    .message-text{
        font-size:13px;
    }

    .login-box{
        padding:28px;
    }

}


/* ========================================
   HIDE
======================================== */

.hidden{
    display:none!important;
}

</style>
</head>


<body>


<!-- ========================================
     LOGIN
======================================== -->

<div
    id="login"
    class="login">

    <div class="login-box">

        <div class="login-logo">
            M
        </div>

        <div class="login-title">
            Welcome to MyChat
        </div>

        <div class="login-description">
            Choose a username to join the conversation.
            Your username will be saved on this device.
        </div>

        <input
            id="username"
            class="login-input"
            maxlength="24"
            autocomplete="off"
            placeholder="Enter your username">

        <button
            class="login-button"
            onclick="login()">

            Enter MyChat

        </button>

        <div
            id="loginError"
            class="login-error">
        </div>

    </div>

</div>


<!-- ========================================
     ERROR
======================================== -->

<div
    id="errorScreen"
    class="error-screen">

    <div class="error-box">

        <div class="error-title">
            Connection Error
        </div>

        <div
            id="errorCode"
            class="error-code">
        </div>

        <div
            id="errorFix"
            class="error-fix">
        </div>

        <div class="error-buttons">

            <button
                class="error-button primary"
                onclick="testServer()">

                Retry

            </button>

            <button
                class="error-button"
                onclick="copyError()">

                Copy Error

            </button>

            <button
                class="error-button"
                onclick="closeError()">

                Close

            </button>

        </div>

        <div
            id="copySuccess"
            class="copy-success">

            Error copied.

        </div>

    </div>

</div>


<!-- ========================================
     APP
======================================== -->

<div class="app">


    <!-- SIDEBAR -->

    <aside class="sidebar">


        <div class="brand">

            <div class="brand-icon">
                M
            </div>

            <div class="brand-text">

                <div class="brand-name">
                    MyChat
                </div>

                <div class="brand-sub">
                    Community
                </div>

            </div>

        </div>


        <div class="section-title">
            Channel
        </div>


        <div
            class="channel active">

            <span class="channel-hash">
                #
            </span>

            <span class="channel-name">
                general
            </span>

        </div>


        <div class="sidebar-bottom">

            <div class="profile">

                <div
                    id="profileAvatar"
                    class="avatar">

                    ?

                </div>

                <div>

                    <div
                        id="profileName"
                        class="profile-name">

                        User

                    </div>

                    <div class="profile-status">

                        <span class="profile-dot">
                        </span>

                        Online

                    </div>

                </div>

            </div>

        </div>

    </aside>


    <!-- CHAT -->

    <main class="chat">


        <!-- HEADER -->

        <header class="header">

            <div class="header-left">

                <span class="header-hash">
                    #
                </span>

                <span class="header-channel">
                    general
                </span>

                <span class="header-description">
                    Chat with everyone
                </span>

            </div>


            <div
                id="connection"
                class="connection">

                <span
                    id="connectionDot"
                    class="connection-dot">
                </span>

                <span
                    id="connectionText"
                    class="connection-text">

                    Connecting

                </span>

            </div>

        </header>


        <!-- MESSAGES -->

        <div
            id="messages"
            class="messages">

            <div class="empty">

                <div>

                    <div class="empty-icon">
                        #
                    </div>

                    <div class="empty-title">
                        Welcome to #general
                    </div>

                    <div class="empty-text">
                        This is the beginning of the conversation.
                    </div>

                </div>

            </div>

        </div>


        <!-- COMPOSER -->

        <div class="composer">

            <div class="composer-inner">

                <textarea
                    id="messageInput"
                    maxlength="2000"
                    rows="1"
                    placeholder="Message #general">
                </textarea>


                <button
                    id="sendButton"
                    class="send"
                    onclick="sendMessage()"
                    title="Send">

                    ↑

                </button>

            </div>

        </div>

    </main>

</div>


<script>


/* ========================================
   API
======================================== */

const API_URL =
    "/api/messages";


let username =
    localStorage.getItem(
        "chat_username"
    ) || "";


/* ========================================
   ELEMENTS
======================================== */

const messagesElement =
    document.getElementById(
        "messages"
    );

const input =
    document.getElementById(
        "messageInput"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const connection =
    document.getElementById(
        "connection"
    );

const connectionText =
    document.getElementById(
        "connectionText"
    );


/* ========================================
   STATUS
======================================== */

function setConnection(
    state,
    text
){

    connection.className =
        "connection " +
        state;

    connectionText.textContent =
        text;

}


/* ========================================
   AVATAR
======================================== */

function avatarLetter(
    name
){

    return (
        name ||
        "?"
    )
    .trim()
    .charAt(0)
    .toUpperCase();

}


/* ========================================
   LOGIN
======================================== */

function login(){

    const usernameInput =
        document.getElementById(
            "username"
        );

    const error =
        document.getElementById(
            "loginError"
        );

    const name =
        usernameInput.value.trim();


    if(!name){

        error.textContent =
            "Please enter a username.";

        return;

    }


    if(name.length < 2){

        error.textContent =
            "Username must be at least 2 characters.";

        return;

    }


    username =
        name.substring(
            0,
            24
        );


    localStorage.setItem(
        "chat_username",
        username
    );


    document.getElementById(
        "login"
    ).classList.add(
        "hidden"
    );


    updateProfile();

    loadMessages();

}


/* ========================================
   PROFILE
======================================== */

function updateProfile(){

    document.getElementById(
        "profileName"
    ).textContent =
        username;


    document.getElementById(
        "profileAvatar"
    ).textContent =
        avatarLetter(
            username
        );

}


/* ========================================
   LOAD MESSAGES
======================================== */

async function loadMessages(){

    setConnection(
        "",
        "Connecting"
    );


    try{

        const response =
            await fetch(
                API_URL +
                "?channel=general" +
                "&t=" +
                Date.now(),
                {
                    method:"GET",

                    headers:{
                        "Accept":
                            "application/json"
                    },

                    cache:"no-store"
                }
            );


        const text =
            await response.text();


        let data;


        try{

            data =
                JSON.parse(
                    text
                );

        }catch{

            throw new Error(
                "Server did not return JSON.\n\n" +
                "HTTP: " +
                response.status +
                "\n\n" +
                text.substring(
                    0,
                    2000
                )
            );

        }


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status +
                "\n\n" +
                (
                    data.error ||
                    "Server error"
                )
            );

        }


        displayMessages(
            data.messages || []
        );


        setConnection(
            "connected",
            "Connected"
        );


    }catch(error){

        console.error(
            error
        );


        let message =
            error.message ||
            String(error);


        if(
            message ===
            "Failed to fetch"
        ){

            message =
                "FAILED TO FETCH\n\n" +
                "The browser could not reach:\n" +
                window.location.origin +
                API_URL +
                "\n\n" +
                "Make sure this page is opened from your Vercel website, not from file://.";

        }


        setConnection(
            "error",
            "Offline"
        );


        showError(
            message
        );

    }

}


/* ========================================
   DISPLAY MESSAGES
======================================== */

function displayMessages(
    messages
){

    messagesElement.innerHTML =
        "";


    if(
        !Array.isArray(messages) ||
        messages.length === 0
    ){

        messagesElement.innerHTML = `

            <div class="empty">

                <div>

                    <div class="empty-icon">
                        #
                    </div>

                    <div class="empty-title">
                        Welcome to #general
                    </div>

                    <div class="empty-text">
                        Be the first person to send a message.
                    </div>

                </div>

            </div>

        `;

        return;

    }


    messages.forEach(
        message => {

            const wrapper =
                document.createElement(
                    "div"
                );

            wrapper.className =
                "message";


            const avatar =
                document.createElement(
                    "div"
                );

            avatar.className =
                "message-avatar";

            avatar.textContent =
                avatarLetter(
                    message.username
                );


            const content =
                document.createElement(
                    "div"
                );

            content.className =
                "message-content";


            const meta =
                document.createElement(
                    "div"
                );

            meta.className =
                "message-meta";


            const name =
                document.createElement(
                    "span"
                );

            name.className =
                "message-user";

            name.textContent =
                message.username ||
                "Unknown";


            const time =
                document.createElement(
                    "span"
                );

            time.className =
                "message-time";


            if(
                message.created_at
            ){

                const date =
                    new Date(
                        message.created_at
                    );


                time.textContent =
                    date.toLocaleString();

            }


            const text =
                document.createElement(
                    "div"
                );

            text.className =
                "message-text";

            text.textContent =
                message.message ||
                "";


            meta.appendChild(
                name
            );

            meta.appendChild(
                time
            );


            content.appendChild(
                meta
            );

            content.appendChild(
                text
            );


            wrapper.appendChild(
                avatar
            );

            wrapper.appendChild(
                content
            );


            messagesElement.appendChild(
                wrapper
            );

        }
    );


    messagesElement.scrollTop =
        messagesElement.scrollHeight;

}


/* ========================================
   SEND
======================================== */

async function sendMessage(){

    const message =
        input.value.trim();


    if(!username){

        document.getElementById(
            "login"
        ).classList.remove(
            "hidden"
        );

        return;

    }


    if(!message){

        return;

    }


    sendButton.disabled =
        true;


    setConnection(
        "",
        "Sending"
    );


    try{

        const response =
            await fetch(
                API_URL,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            username:
                                username,

                            channel:
                                "general",

                            message:
                                message

                        })

                }
            );


        const text =
            await response.text();


        let data;


        try{

            data =
                JSON.parse(
                    text
                );

        }catch{

            throw new Error(
                "Server did not return JSON.\n\n" +
                "HTTP: " +
                response.status +
                "\n\n" +
                text.substring(
                    0,
                    2000
                )
            );

        }


        if(!response.ok){

            throw new Error(

                "HTTP " +
                response.status +
                "\n\n" +

                (
                    data.error ||
                    "Message was rejected."
                ) +

                (
                    data.fix
                    ? "\n\n" +
                      data.fix
                    : ""
                )

            );

        }


        input.value =
            "";


        autoResize();


        await loadMessages();


    }catch(error){

        console.error(
            error
        );


        let message =
            error.message ||
            String(error);


        if(
            message ===
            "Failed to fetch"
        ){

            message =
                "FAILED TO FETCH\n\n" +
                "The browser could not reach " +
                window.location.origin +
                API_URL;

        }


        showError(
            message
        );

    }


    sendButton.disabled =
        false;

}


/* ========================================
   TEXTAREA RESIZE
======================================== */

function autoResize(){

    input.style.height =
        "auto";

    input.style.height =
        Math.min(
            input.scrollHeight,
            150
        ) +
        "px";

}


input.addEventListener(
    "input",
    autoResize
);


/* ========================================
   ENTER
======================================== */

input.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* ========================================
   ERROR
======================================== */

let lastError =
    "";


function showError(
    error
){

    lastError =
        String(error);


    document.getElementById(
        "errorCode"
    ).textContent =
        lastError;


    document.getElementById(
        "errorFix"
    ).textContent =
        getErrorFix(
            lastError
        );


    document.getElementById(
        "errorScreen"
    ).style.display =
        "flex";

}


function closeError(){

    document.getElementById(
        "errorScreen"
    ).style.display =
        "none";

}


function getErrorFix(
    error
){

    const e =
        error.toLowerCase();


    if(
        e.includes("row-level security") ||
        e.includes("rls")
    ){

        return (
            "Supabase RLS is blocking the message.\n\n" +
            "Make sure your messages table has an INSERT policy " +
            "with the expression:\n\n" +
            "true"
        );

    }


    if(
        e.includes("401") ||
        e.includes("api key")
    ){

        return (
            "Supabase rejected the API key.\n\n" +
            "Check your Supabase API key and Vercel configuration."
        );

    }


    if(
        e.includes("404")
    ){

        return (
            "The /api/messages endpoint was not found.\n\n" +
            "Make sure messages.js is inside:\n\n" +
            "api/messages.js"
        );

    }


    if(
        e.includes("failed to fetch")
    ){

        return (
            "The browser could not reach the server.\n\n" +
            "Make sure you're using your Vercel website URL " +
            "and not opening index.html directly."
        );

    }


    return (
        "Check the exact error above. " +
        "Your private Supabase key should never be placed in the HTML."
    );

}


async function testServer(){

    closeError();

    await loadMessages();

}


async function copyError(){

    try{

        await navigator.clipboard.writeText(
            lastError
        );


        const success =
            document.getElementById(
                "copySuccess"
            );


        success.style.display =
            "block";


        setTimeout(
            () => {

                success.style.display =
                    "none";

            },
            2000
        );

    }catch{

        alert(
            lastError
        );

    }

}


/* ========================================
   START
======================================== */

if(username){

    document.getElementById(
        "login"
    ).classList.add(
        "hidden"
    );

    updateProfile();

}else{

    document.getElementById(
        "login"
    ).classList.remove(
        "hidden"
    );

}


loadMessages();


/* ========================================
   AUTO REFRESH
======================================== */

setInterval(
    () => {

        if(
            username &&
            document
                .getElementById(
                    "errorScreen"
                )
                .style
                .display !== "flex"
        ){

            loadMessages();

        }

    },
    5000
);

</script>
