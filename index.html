<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat</title>

<style>
*{box-sizing:border-box}

:root{
    --bg:#0b0d10;
    --panel:#111419;
    --panel2:#181c22;
    --border:#292f38;
    --text:#edf0f4;
    --muted:#7e8793;
    --accent:#e8eaed;
    --danger:#ff7070;
    --green:#6ee7a0;
    --radius:12px;
    --ui-scale:1;
    --text-size:16px;
    --word-spacing:0px;
    --line-spacing:1.45;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

body{
    overflow:hidden;
    font-size:calc(16px * var(--ui-scale));
}

button,input,textarea,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:64px;
    min-height:64px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel);
    border-bottom:1px solid var(--border);
}

.header-left{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
}

.logo-icon{
    width:35px;
    height:35px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:var(--panel2);
    border:1px solid var(--border);
}

.channel{
    color:var(--muted);
    font-weight:400;
}

.icon-btn{
    width:39px;
    height:39px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
}

.icon-btn:hover{
    filter:brightness(1.15);
}

/* PAGE NAVIGATION */

.page-tabs{
    display:flex;
    gap:5px;
    padding:8px 14px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
}

.page-tab{
    border:1px solid transparent;
    background:transparent;
    color:var(--muted);
    padding:8px 14px;
    border-radius:9px;
    font-weight:600;
}

.page-tab:hover{
    background:var(--panel2);
    color:var(--text);
}

.page-tab.active{
    background:var(--panel2);
    border-color:var(--border);
    color:var(--text);
}

/* PAGES */

.page{
    flex:1;
    min-height:0;
    display:none;
}

.page.active{
    display:flex;
}

/* CHAT PAGE */

.chat-page{
    flex-direction:column;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    display:flex;
    gap:11px;
    margin-bottom:17px;
}

.avatar{
    flex:0 0 40px;
    width:40px;
    height:40px;
    display:grid;
    place-items:center;
    border-radius:var(--radius);
    background:var(--panel2);
    border:1px solid var(--border);
    font-weight:700;
}

.message-content{
    min-width:0;
    max-width:min(850px,calc(100vw - 90px));
}

.message-top{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:3px;
}

.username{
    font-weight:700;
}

.time,.edited{
    color:var(--muted);
    font-size:11px;
}

.message-text{
    color:#d8dde4;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    font-size:var(--text-size);
    word-spacing:var(--word-spacing);
    line-height:var(--line-spacing);
}

.message-image{
    display:block;
    max-width:min(500px,80vw);
    max-height:500px;
    margin-top:8px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:#000;
    object-fit:contain;
    cursor:pointer;
}

/* COMPOSER */

.composer{
    padding:12px 16px 16px;
    background:var(--panel);
    border-top:1px solid var(--border);
}

.composer-box{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:8px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:14px;
}

textarea{
    flex:1;
    min-height:42px;
    max-height:150px;
    resize:none;
    border:0;
    outline:none;
    background:transparent;
    color:white;
    padding:10px;
}

.attach-btn,
.send-btn{
    height:42px;
    border:0;
    border-radius:9px;
}

.attach-btn{
    width:42px;
    background:transparent;
    color:#adb5c0;
    font-size:20px;
}

.attach-btn:hover{
    background:#242932;
}

.send-btn{
    padding:0 18px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

.send-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* SCREEN SHARE */

.screen-page{
    flex-direction:column;
    overflow:auto;
    padding:20px;
}

.screen-header{
    width:min(1200px,100%);
    margin:0 auto 16px;
}

.screen-header h1{
    margin:0 0 5px;
}

.screen-header p{
    margin:0;
    color:var(--muted);
}

.screen-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:18px;
}

.screen-btn{
    padding:11px 17px;
    border-radius:9px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    font-weight:600;
}

.screen-btn:hover{
    filter:brightness(1.15);
}

.screen-btn.primary{
    background:var(--accent);
    color:#111;
}

.screen-btn.danger{
    border-color:#743333;
    background:#241719;
    color:#ff8585;
}

.screen-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.screen-status{
    margin-top:12px;
    color:var(--muted);
}

.screen-status.connected{
    color:var(--green);
}

.video-grid{
    width:min(1200px,100%);
    margin:20px auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:14px;
}

.video-card{
    position:relative;
    min-height:240px;
    background:#050607;
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
}

.video-card video{
    width:100%;
    height:100%;
    min-height:240px;
    display:block;
    object-fit:contain;
    background:#000;
}

.video-label{
    position:absolute;
    left:10px;
    top:10px;
    padding:6px 9px;
    border-radius:7px;
    background:#000b;
    color:white;
    font-size:12px;
}

.no-video{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    color:var(--muted);
}

/* SETTINGS */

.overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.72);
    z-index:100;
}

.overlay.show{
    display:flex;
}

.panel{
    width:min(520px,calc(100vw - 25px));
    max-height:calc(100vh - 25px);
    overflow-y:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
    box-shadow:0 25px 80px #000b;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px;
    border-bottom:1px solid var(--border);
}

.panel-header h2{
    margin:0;
}

.panel-body{
    padding:18px;
}

.category{
    margin-bottom:12px;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    background:var(--panel2);
}

.category-title{
    width:100%;
    padding:14px;
    border:0;
    background:transparent;
    color:var(--text);
    display:flex;
    justify-content:space-between;
    font-weight:700;
    text-align:left;
}

.category-title span:last-child{
    color:var(--muted);
}

.category-body{
    display:none;
    padding:0 14px 14px;
}

.category.open .category-body{
    display:block;
}

.setting{
    margin-top:14px;
}

.setting label{
    display:block;
    margin-bottom:7px;
    color:#aab2bd;
    font-size:13px;
}

.setting input,
.setting select{
    width:100%;
    padding:10px;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
    background:#101419;
    color:white;
}

.setting input[type="range"]{
    padding:0;
}

.setting-value{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.save-btn{
    width:100%;
    margin-top:8px;
    padding:12px;
    border:0;
    border-radius:9px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

/* CONTEXT MENU */

.context-menu{
    position:fixed;
    display:none;
    width:160px;
    padding:5px;
    z-index:200;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:9px;
    box-shadow:0 15px 40px #0009;
}

.context-menu.show{
    display:block;
}

.context-menu button{
    width:100%;
    padding:9px 10px;
    text-align:left;
    border:0;
    border-radius:6px;
    background:transparent;
    color:var(--text);
}

.context-menu button:hover{
    background:#252b33;
}

.delete-option{
    color:#ff7777!important;
}

/* IMAGE VIEWER */

.image-viewer{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000f;
    z-index:300;
}

.image-viewer.show{
    display:flex;
}

.full-image{
    max-width:95vw;
    max-height:90vh;
    object-fit:contain;
}

.back-image{
    position:absolute;
    top:18px;
    left:18px;
    padding:10px 16px;
    border-radius:9px;
    border:1px solid #3a4049;
    background:#171b21;
    color:white;
}

/* DIALOG */

.dialog{
    width:min(450px,calc(100vw - 30px));
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
}

.dialog h2{
    margin-top:0;
}

.dialog p{
    color:#aab2bd;
    line-height:1.5;
}

.dialog-buttons{
    display:flex;
    gap:8px;
    justify-content:flex-end;
}

.dialog-buttons button{
    padding:10px 16px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#20252c;
    color:white;
}

.dialog-buttons .danger{
    background:#6b2929;
    border-color:#813434;
}

/* EMPTY */

.empty{
    height:100%;
    display:grid;
    place-items:center;
    color:#656d78;
    text-align:center;
}

.empty strong{
    display:block;
    color:#aab2bd;
    margin-bottom:5px;
}

@media(max-width:600px){

    .header{
        padding:0 11px;
    }

    .messages{
        padding:15px 11px;
    }

    .channel{
        display:none;
    }

    .message-content{
        max-width:calc(100vw - 70px);
    }

    .screen-page{
        padding:12px;
    }

    .video-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="header-left">

        <div class="logo">
            <div class="logo-icon">💬</div>
            <span>Chat</span>
        </div>

        <span
            class="channel"
            id="currentChannel"
        ># general</span>

    </div>

    <button
        class="icon-btn"
        id="settingsBtn"
        title="Settings"
    >⚙</button>

</header>


<!-- PAGE TABS -->

<nav class="page-tabs">

    <button
        class="page-tab active"
        data-page="general"
    >
        💬 General
    </button>

    <button
        class="page-tab"
        data-page="screenshare"
    >
        🖥️ Screen Share
    </button>

</nav>


<!-- GENERAL -->

<section
    class="page chat-page active"
    id="generalPage"
>

<main
    class="messages"
    id="messages"
></main>

<div class="composer">

    <div class="composer-box">

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
        >

        <button
            class="attach-btn"
            id="attachBtn"
        >＋</button>

        <textarea
            id="messageInput"
            rows="1"
            placeholder="Message #general"
        ></textarea>

        <button
            class="send-btn"
            id="sendBtn"
        >Send</button>

    </div>

</div>

</section>


<!-- SCREEN SHARE -->

<section
    class="page screen-page"
    id="screensharePage"
>

<div class="screen-header">

    <h1>Screen Share</h1>

    <p>
        Host your screen or watch a screen being shared by another user.
    </p>

    <div class="screen-actions">

        <button
            class="screen-btn primary"
            id="startShareBtn"
        >
            🖥️ Share my screen
        </button>

        <button
            class="screen-btn danger"
            id="stopShareBtn"
            disabled
        >
            Stop sharing
        </button>

    </div>

    <div
        class="screen-status"
        id="screenStatus"
    >
        Not connected
    </div>

</div>

<div
    class="video-grid"
    id="videoGrid"
>

<div class="video-card" id="localVideoCard">

    <video
        id="localVideo"
        autoplay
        muted
        playsinline
    ></video>

    <div class="video-label">
        Your screen
    </div>

</div>

</div>

</section>

</div>


<!-- SETTINGS -->

<div
    class="overlay"
    id="settingsOverlay"
>

<div class="panel">

<div class="panel-header">

<h2>Settings</h2>

<button
    class="icon-btn"
    id="closeSettings"
>×</button>

</div>

<div class="panel-body">


<div class="category open">

<button class="category-title">
<span>👤 Profile</span>
<span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Your name</label>

<input
    id="usernameInput"
    maxlength="24"
    placeholder="Enter your name"
>

</div>

<div class="setting">

<label>Device ID</label>

<input
    id="deviceIdInput"
    readonly
>

</div>

</div>
</div>


<div class="category">

<button class="category-title">
<span>📝 Text</span>
<span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Text size</label>

<input
    id="textSize"
    type="range"
    min="12"
    max="24"
    step="1"
>

<div
    class="setting-value"
    id="textSizeValue"
></div>

</div>

<div class="setting">

<label>Word spacing</label>

<input
    id="wordSpacing"
    type="range"
    min="0"
    max="12"
    step="1"
>

<div
    class="setting-value"
    id="wordSpacingValue"
></div>

</div>

<div class="setting">

<label>Line spacing</label>

<input
    id="lineSpacing"
    type="range"
    min="1"
    max="2"
    step=".05"
>

<div
    class="setting-value"
    id="lineSpacingValue"
></div>

</div>

</div>
</div>


<div class="category">

<button class="category-title">
<span>💬 Chat</span>
<span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Refresh rate</label>

<select id="refreshRate">

<option value="10000">10 seconds</option>
<option value="5000">5 seconds</option>
<option value="3000">3 seconds</option>
<option value="2000">2 seconds</option>
<option value="1000">1 second</option>
<option value="500">0.5 seconds</option>
<option value="100">0.1 seconds</option>

</select>

</div>

<div class="setting">

<label>Show timestamps</label>

<select id="showTimestamps">

<option value="true">On</option>
<option value="false">Off</option>

</select>

</div>

<div class="setting">

<label>Compact messages</label>

<select id="compactMessages">

<option value="false">Off</option>
<option value="true">On</option>

</select>

</div>

</div>
</div>


<div class="category">

<button class="category-title">
<span>🎨 Appearance</span>
<span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Theme</label>

<select id="themeSelect">

<option value="dark">Dark</option>
<option value="midnight">Midnight</option>
<option value="slate">Slate</option>
<option value="black">Pure Black</option>
<option value="blue">Dark Blue</option>
<option value="purple">Dark Purple</option>
<option value="green">Dark Green</option>
<option value="red">Dark Red</option>
<option value="gray">Classic Gray</option>
<option value="light">Light</option>
<option value="oled">OLED</option>

</select>

</div>

<div class="setting">

<label>Corner roundness</label>

<input
    id="cornerRadius"
    type="range"
    min="0"
    max="25"
>

<div
    class="setting-value"
    id="cornerRadiusValue"
></div>

</div>

<div class="setting">

<label>UI scale</label>

<input
    id="uiScale"
    type="range"
    min=".8"
    max="1.2"
    step=".05"
>

<div
    class="setting-value"
    id="uiScaleValue"
></div>

</div>

</div>
</div>


<div class="category">

<button class="category-title">
<span>🖥️ Screen Share</span>
<span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Preferred quality</label>

<select id="screenQuality">

<option value="1080">1080p</option>
<option value="720">720p</option>
<option value="480">480p</option>

</select>

</div>

<div class="setting">

<label>Frame rate</label>

<select id="screenFPS">

<option value="60">60 FPS</option>
<option value="30">30 FPS</option>
<option value="15">15 FPS</option>

</select>

</div>

<div class="setting">

<label>Automatically switch to Screen Share</label>

<select id="autoScreenPage">

<option value="false">Off</option>
<option value="true">On</option>

</select>

</div>

</div>
</div>


<div class="category">

<button class="category-title">
<span>🔔 Notifications</span>
<span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Desktop notifications</label>

<select id="desktopNotifications">

<option value="false">Off</option>
<option value="true">On</option>

</select>

</div>

<div class="setting">

<label>Notification sound</label>

<select id="notificationSound">

<option value="false">Off</option>
<option value="true">On</option>

</select>

</div>

</div>
</div>


<div class="category">

<button class="category-title">
<span>⚙️ Behavior</span>
<span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Enter to send</label>

<select id="enterToSend">

<option value="true">On</option>
<option value="false">Off</option>

</select>

</div>

<div class="setting">

<label>Auto-scroll</label>

<select id="autoScroll">

<option value="true">On</option>
<option value="false">Off</option>

</select>

</div>

<div class="setting">

<label>Confirm before deleting</label>

<select id="confirmDelete">

<option value="true">On</option>
<option value="false">Off</option>

</select>

</div>

</div>
</div>


<button
    class="save-btn"
    id="saveSettings"
>
Save settings
</button>


</div>
</div>
</div>


<!-- CONTEXT MENU -->

<div
    class="context-menu"
    id="contextMenu"
>

<button id="editMessage">
Edit
</button>

<button
    class="delete-option"
    id="deleteMessage"
>
Delete
</button>

</div>


<!-- IMAGE VIEWER -->

<div
    class="image-viewer"
    id="imageViewer"
>

<button
    class="back-image"
    id="backImage"
>
← Back
</button>

<img
    class="full-image"
    id="fullImage"
>

</div>


<!-- DIALOG -->

<div
    class="overlay"
    id="dialogOverlay"
>

<div class="dialog">

<h2 id="dialogTitle">
Confirm
</h2>

<p id="dialogText"></p>

<div class="dialog-buttons">

<button id="dialogCancel">
Cancel
</button>

<button
    class="danger"
    id="dialogConfirm"
>
Yes
</button>

</div>

</div>

</div>


<script>

/* =========================================================
   CHAT
========================================================= */

const API_URL="/api/messages";
const CHANNEL="general";


let deviceId=localStorage.getItem("chat_device_id");

if(!deviceId){

    deviceId=crypto.randomUUID();

    localStorage.setItem(
        "chat_device_id",
        deviceId
    );
}


const defaults={

    username:"",

    theme:"dark",

    refreshRate:500,

    showTimestamps:true,

    compactMessages:false,

    textSize:16,

    wordSpacing:0,

    lineSpacing:1.45,

    cornerRadius:12,

    uiScale:1,

    desktopNotifications:false,

    notificationSound:false,

    enterToSend:true,

    autoScroll:true,

    confirmDelete:true,

    screenQuality:1080,

    screenFPS:30,

    autoScreenPage:false
};


function getSetting(key){

    const value=
        localStorage.getItem("chat_"+key);

    if(value===null)
        return defaults[key];

    if(
        value==="true"||
        value==="false"
    )
        return value==="true";

    const number=Number(value);

    return Number.isNaN(number)
        ?value
        :number;

function resizeImage(file){

    return new Promise((resolve,reject)=>{

        const reader=new FileReader();

        reader.onload=()=>{

            const img=new Image();

            img.onload=()=>{

                let width=img.width;

                let height=img.height;

                const max=1500;

                if(
                    width>max||
                    height>max
                ){

                    const scale=
                        Math.min(
                            max/width,
                            max/height
                        );

                    width=
                        Math.round(
                            width*scale
                        );

                    height=
                        Math.round(
                            height*scale
                        );

                }


                const canvas=
                    document.createElement(
                        "canvas"
                    );

                canvas.width=width;

                canvas.height=height;

                const ctx=
                    canvas.getContext("2d");

                ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                );


                resolve(
                    canvas.toDataURL(
                        "image/jpeg",
                        .78
                    )
                );

            };

            img.onerror=reject;

            img.src=reader.result;

        };

        reader.onerror=reject;

        reader.readAsDataURL(file);

    });

}

async function sendMessage(){

        messageInput.value.trim();


    if(!settings.username){

        settingsBtn.click();

        usernameInput.focus();

        alert(
            "Set your name in Settings first."
        );

        return;
    }


    if(!text&&!selectedFile)
        return;


    sendBtn.disabled=true;


    try{

        if(selectedFile){

            image=
                await resizeImage(
                    selectedFile

        const response=
            await fetch(
                API_URL,

                    headers:{
                        "Content-Type":

                    },

                    body:JSON.stringify({

                        username:

                        channel:
                            CHANNEL,

                        message:
                            text,

                        image:
                            image,

                        device_id:
                            deviceId

                    })

                }
            );


        const data=
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error||
                "Failed to send message."
            );

        }


        messageInput.value="";

        messageInput.style.height="auto";

        selectedFile=null;

        imageInput.value="";

        attachBtn.textContent="＋";


        await loadMessages();


    }catch(error){

            error.message
        );

    }

}

/* =========================================================
   RENDER
========================================================= */

function renderMessages(){

    const wasBottom=
        messagesEl.scrollHeight-
        messagesEl.scrollTop-
        messagesEl.clientHeight
        <100;


    if(!currentMessages.length){

        messagesEl.innerHTML=`

            <div class="empty">

                <div>

                    <strong>
                        No messages yet
                    </strong>

                    Be the first to send something.

                </div>

            </div>

        `;

        return;

    }


    const fragment=
        document.createDocumentFragment();


    currentMessages.forEach(message=>{

        const item=
            document.createElement("div");

        item.className="message";

        item.dataset.id=
            message.id;


        const avatar=
            document.createElement("div");

        avatar.className="avatar";

        avatar.textContent=
            (message.username||"?")
            .charAt(0)
            .toUpperCase();


        const content=
            document.createElement("div");

        content.className=
            "message-content";


        const top=
            document.createElement("div");

        top.className="message-top";


        const name=
            document.createElement("span");

        name.className="username";

        name.textContent=
            message.username||"User";


        top.appendChild(name);


        if(settings.showTimestamps){

            const time=
                document.createElement(
                    "span"
                );

            time.className="time";

            time.textContent=
                formatTime(
                    message.created_at
                );

            top.appendChild(time);

        }


        if(message.edited){

            const edited=
                document.createElement(
                    "span"
                );

            edited.className="edited";

            edited.textContent=
                "(edited)";

            top.appendChild(edited);

        }


        content.appendChild(top);


        if(message.message){

            const text=
                document.createElement(
                    "div"
                );

            text.className=
                "message-text";

            text.textContent=
                message.message;

            content.appendChild(text);

        }


        if(message.image){

            const img=
                document.createElement(
                    "img"
                );

            img.className=
                "message-image";

            img.src=
                message.image;

            img.alt="Image";

            img.onclick=()=>{
                openImage(
                    message.image
                );
            };

            content.appendChild(img);

        }


        item.appendChild(avatar);

        item.appendChild(content);


        if(
            message.device_id &&
            message.device_id===deviceId
        ){

            item.addEventListener(
                "contextmenu",
                event=>{

                    event.preventDefault();

                    showContextMenu(
                        event.clientX,
                        event.clientY,
                        message
                    );

                }
            );

        }


        fragment.appendChild(item);

    });


    messagesEl.replaceChildren(
        fragment
    );


    if(
        wasBottom &&
        settings.autoScroll
    ){

        messagesEl.scrollTop=
            messagesEl.scrollHeight;

    }

}

        .toLocaleTimeString(

function escapeHtml(value){

        .replaceAll(

            "&amp;"

        )
        .replaceAll(
            ">",

        )

            '"',

        )
        .replaceAll(
            "'",

        );

}

const SIGNAL_URL=

){

    screenStatus.textContent=

/* CONNECT SIGNAL SERVER */

function connectSignal(){

    return new Promise(
        (resolve,reject)=>{

            if(
                signalSocket &&
                signalSocket.readyState===
                WebSocket.OPEN
            ){

                resolve();

                return;

            }


            signalSocket=
                new WebSocket(
                    SIGNAL_URL
                );


            signalSocket.onopen=()=>{

                resolve();

            };


            signalSocket.onerror=
                ()=>{

                    reject(
                        new Error(
                            "Could not connect to screen-share server."
                        )
                    );

                };


            signalSocket.onclose=()=>{

                signalSocket=null;

                peers.forEach(
                    peer=>{
                        peer.close();
                    }
                );

                peers.clear();

            };


            signalSocket.onmessage=
                async event=>{

                    try{

                        const data=
                            JSON.parse(
                                event.data
                            );

                        await handleSignal(
                            data
                        );

                    }catch(error){

                        console.error(
                            "Signal error:",
                            error
                        );

                    }

                };

        }
    );

}


/* SIGNAL */

function sendSignal(data){

    if(
        !signalSocket ||
        signalSocket.readyState!==
        WebSocket.OPEN
    )
        return;

    signalSocket.send(
        JSON.stringify(data)
    );

}


/* START SHARING */

startShareBtn.onclick=
async()=>{

    if(isHost)
        return;


    try{

        await connectSignal();


        roomId=
            crypto.randomUUID();


        const quality=
            Number(
                settings.screenQuality
            );

        const fps=
            Number(
                settings.screenFPS
            );


        screenStream=
            await navigator.mediaDevices
            .getDisplayMedia({

                video:{
                    width:{
                        ideal:quality
                    },

                    height:{
                        ideal:Math.round(
                            quality*9/16
                        )
                    },

                    frameRate:{
                        ideal:fps
                    }
                },

                audio:false

            });


        localVideo.srcObject=
            screenStream;


        isHost=true;


        startShareBtn.disabled=
            true;

        stopShareBtn.disabled=
            false;


        setScreenStatus(
            "Hosting screen share",
            true
        );


        sendSignal({

            type:"host",

            roomId:roomId,

            userId:deviceId,

            username:
                settings.username||
                "Host"

        });


        const track=
            screenStream
            .getVideoTracks()[0];


        track.addEventListener(
            "ended",
            stopScreenShare
        );


    }catch(error){

        console.error(error);

        alert(
            "Could not start screen sharing.\n\n"+
            error.message
        );

    }

};


/* STOP SHARING */

stopShareBtn.onclick=
stopScreenShare;


function stopScreenShare(){

    if(screenStream){

        screenStream
            .getTracks()
            .forEach(
                track=>{
                    track.stop();
                }
            );

        screenStream=null;

    }


    localVideo.srcObject=null;


    peers.forEach(
        peer=>{
            peer.close();
        }
    );

    peers.clear();


    if(signalSocket){

        sendSignal({

            type:"host-stop",

            roomId:roomId,

            userId:deviceId

        });

    }


    isHost=false;

    roomId=null;


    startShareBtn.disabled=
        false;

    stopShareBtn.disabled=
        true;


    setScreenStatus(
        "Not connected"
    );


    removeRemoteVideos();

}


/* HOST DISCOVERY */

async function handleSignal(data){

    if(
        data.userId===
        deviceId
    )
        return;


    /* Another user started hosting */

    if(data.type==="host"){

        if(isHost)
            return;


        if(
            settings.autoScreenPage
        ){

            switchToScreenPage();

        }


        await connectToHost(
            data.roomId,
            data.userId,
            data.username
        );

        return;

    }


    if(data.type==="host-stop"){

        if(
            data.roomId===
            roomId
        ){

            removeRemoteVideos();

            peers.forEach(
                peer=>{
                    peer.close();
                }
            );

            peers.clear();

            setScreenStatus(
                "Host stopped sharing"
            );

        }

        return;

    }


    if(data.type==="viewer-ready"){

        if(
            !isHost ||
            data.roomId!==roomId
        )
            return;


        await createOfferForViewer(
            data.userId
        );

        return;

    }


    if(data.type==="offer"){

        await handleOffer(data);

        return;

    }


    if(data.type==="answer"){

        const peer=
            peers.get(
                data.from
            );

        if(!peer)
            return;


        await peer.setRemoteDescription(
            new RTCSessionDescription(
                data.answer
            )
        );

        return;

    }


    if(data.type==="ice"){

        const peer=
            peers.get(
                data.from
            );

        if(!peer)
            return;


        try{

            await peer.addIceCandidate(
                new RTCIceCandidate(
                    data.candidate
                )
            );

        }catch(error){

            console.warn(
                "ICE error:",
                error
            );

        }

    }

}


/* CONNECT VIEWER */

async function connectToHost(
    hostRoomId,
    hostId,
    hostName
){

    roomId=
        hostRoomId;


    setScreenStatus(
        "Connecting to "+hostName+"...",
        true
    );


    const peer=
        createPeer(
            hostId,
            false
        );


    peers.set(
        hostId,
        peer
    );


    sendSignal({

        type:"viewer-ready",

        roomId:roomId,

        userId:deviceId,

        target:hostId

    });

}


/* HOST OFFER */

async function createOfferForViewer(
    viewerId
){

    const peer=
        createPeer(
            viewerId,
            true
        );


    peers.set(
        viewerId,
        peer
    );


    if(screenStream){

        screenStream
            .getTracks()
            .forEach(
                track=>{

                    peer.addTrack(
                        track,
                        screenStream
                    );

                }
            );

    }


    const offer=
        await peer.createOffer();


    await peer.setLocalDescription(
        offer
    );


    sendSignal({

        type:"offer",

        roomId:roomId,

        from:deviceId,

        target:viewerId,

        offer:offer

    });

}


/* OFFER */

async function handleOffer(data){

    if(
        data.target &&
        data.target!==deviceId
    )
        return;


    let peer=
        peers.get(
            data.from
        );


    if(!peer){

        peer=
            createPeer(
                data.from,
                false
            );

        peers.set(
            data.from,
            peer
        );

    }


    await peer.setRemoteDescription(
        new RTCSessionDescription(
            data.offer
        )
    );


    const answer=
        await peer.createAnswer();


    await peer.setLocalDescription(
        answer
    );


    sendSignal({

        type:"answer",

        roomId:data.roomId,

        from:deviceId,

        target:data.from,

        answer:answer

    });

}


/* CREATE PEER */

function createPeer(
    remoteId,
    hostSide
){

    const peer=
        new RTCPeerConnection({

            iceServers:[

                {
                    urls:
                        "stun:stun.l.google.com:19302"
                },

                {
                    urls:
                        "stun:stun1.l.google.com:19302"
                }

            ]

        });


    peer.onicecandidate=
        event=>{

            if(!event.candidate)
                return;


            sendSignal({

                type:"ice",

                roomId:roomId,

                from:deviceId,

                target:remoteId,

                candidate:
                    event.candidate

            });

        };


    peer.ontrack=
        event=>{

            if(!event.streams[0])
                return;


            showRemoteVideo(
                remoteId,
                event.streams[0]
            );


            setScreenStatus(
                "Watching screen share",
                true
            );

        };


    peer.onconnectionstatechange=
        ()=>{

            const state=
                peer.connectionState;


            if(
                state==="failed"||
                state==="closed"
            ){

                peer.close();

                peers.delete(
                    remoteId
                );

                removeRemoteVideo(
                    remoteId
                );

            }

        };


    return peer;

}


/* REMOTE VIDEO */

function showRemoteVideo(
    id,
    stream
){

    let card=
        document.getElementById(
            "remote-"+id
        );


    if(!card){

        card=
            document.createElement(
                "div"
            );

        card.className=
            "video-card";

        card.id=
            "remote-"+id;


        const video=
            document.createElement(
                "video"
            );

        video.autoplay=true;

        video.playsInline=true;

        video.srcObject=
            stream;


        const label=
            document.createElement(
                "div"
            );

        label.className=
            "video-label";

        label.textContent=
            "Shared screen";


        card.appendChild(video);

        card.appendChild(label);

        videoGrid.appendChild(
            card
        );

    }else{

        const video=
            card.querySelector(
                "video"
            );

        if(video)
            video.srcObject=
                stream;

    }

}


/* REMOVE REMOTE */

function removeRemoteVideo(id){

    const card=
        document.getElementById(
            "remote-"+id
        );

    if(card)
        card.remove();

}


function removeRemoteVideos(){

    document
        .querySelectorAll(
            '[id^="remote-"]'
        )
        .forEach(
            element=>{
                element.remove();
            }
        );

}


/* SWITCH PAGE */

function switchToScreenPage(){

    const tab=
        document.querySelector(
            '[data-page="screenshare"]'
        );

    if(tab)
        tab.click();

}


/* =========================================================
   START
========================================================= */

loadSettingsUI();

applySettings();

loadMessages();


/*
   Try connecting to the signaling server
   when Screen Share is opened.
*/

document
.querySelector(
    '[data-page="screenshare"]'
)
.addEventListener(
    "click",
    async()=>{

        try{

            await connectSignal();

            setScreenStatus(
                "Connected — waiting for a host"
            );

        }catch(error){

            setScreenStatus(
                "Screen-share server unavailable"
            );

            console.warn(error);

        }

    }
);


/*
   Close connections when leaving page.
*/

window.addEventListener(
    "beforeunload",
    ()=>{

        if(screenStream)
            stopScreenShare();

        if(signalSocket)
            signalSocket.close();

    }
);

</script>
