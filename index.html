<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0">

<title>Chat</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Inter,Arial,sans-serif;
    background:#101114;
    color:#eee;
}

body{
    transition:
        background .25s ease,
        color .25s ease;
}

/* ==============================
   APP
============================== */

.app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

/* ==============================
   TOP BAR
============================== */

.topbar{
    height:64px;
    min-height:64px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    background:#17181d;
    border-bottom:1px solid #292b32;

    z-index:20;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:36px;
    height:36px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:10px;

    background:#252832;

    font-size:18px;
}

.title{
    font-weight:700;
    font-size:17px;
}

.subtitle{
    color:#777c87;
    font-size:12px;
    margin-top:2px;
}

.topButtons{
    display:flex;
    gap:7px;
}

.iconButton{
    width:40px;
    height:40px;

    border:0;
    border-radius:10px;

    background:#22242b;
    color:#ddd;

    cursor:pointer;

    font-size:18px;

    transition:
        background .18s ease,
        transform .18s ease;
}

.iconButton:hover{
    background:#2d3039;
}

.iconButton:active{
    transform:scale(.94);
}

/* ==============================
   MAIN
============================== */

.main{
    flex:1;
    min-height:0;

    display:flex;
}

/* ==============================
   CHANNEL SIDEBAR
============================== */

.sidebar{
    width:230px;
    min-width:230px;

    background:#15161a;
    border-right:1px solid #292b32;

    padding:18px 12px;
}

.channelTitle{
    color:#737783;
    font-size:11px;
    font-weight:700;

    text-transform:uppercase;
    letter-spacing:.08em;

    padding:0 10px 10px;
}

.channel{
    width:100%;

    display:flex;
    align-items:center;

    gap:9px;

    padding:11px 12px;

    border-radius:9px;

    color:#aaaeba;

    cursor:pointer;

    font-size:14px;
}

.channel.active{
    background:#252831;
    color:#fff;
}

.channelIcon{
    color:#747985;
    font-size:18px;
}

.channel.active .channelIcon{
    color:#aaa;
}

/* ==============================
   CHAT
============================== */

.chat{
    flex:1;
    min-width:0;
    min-height:0;

    display:flex;
    flex-direction:column;
}

.messages{
    flex:1;
    min-height:0;

    overflow-y:auto;
    overflow-x:hidden;

    padding:20px 22px 12px;

    scroll-behavior:smooth;
}

.messages::-webkit-scrollbar{
    width:8px;
}

.messages::-webkit-scrollbar-thumb{
    background:#30333b;
    border-radius:10px;
}

/* ==============================
   MESSAGE
============================== */

.message{
    display:flex;

    gap:11px;

    padding:8px 10px;
    margin-bottom:2px;

    border-radius:9px;

    transition:
        background .15s ease;
}

.message:hover{
    background:rgba(255,255,255,.025);
}

.avatar{
    width:38px;
    height:38px;

    min-width:38px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#282b33;

    color:#d8d8dc;

    font-weight:700;
    font-size:14px;
}

.messageContent{
    min-width:0;
    flex:1;
}

.messageHeader{
    display:flex;
    align-items:baseline;

    gap:8px;

    min-height:20px;
}

.username{
    font-size:14px;
    font-weight:700;
}

.time{
    color:#666b75;
    font-size:10px;
}

.messageText{
    margin-top:2px;

    font-size:14px;
    line-height:1.5;

    color:#d5d7dc;

    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.messageImage{
    display:block;

    max-width:min(420px,80vw);
    max-height:420px;

    margin-top:8px;

    border-radius:10px;

    object-fit:contain;

    cursor:pointer;

    background:#0b0c0e;

    border:1px solid #292c33;

    transition:
        transform .18s ease,
        opacity .18s ease;
}

.messageImage:hover{
    opacity:.9;
    transform:scale(1.01);
}

/* ==============================
   EMPTY
============================== */

.empty{
    height:100%;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    color:#656a74;

    text-align:center;
}

.emptyIcon{
    font-size:40px;
    margin-bottom:10px;
}

.emptyTitle{
    color:#b9bcc4;
    font-size:16px;
    font-weight:700;
}

.emptyText{
    margin-top:5px;
    font-size:13px;
}

/* ==============================
   INPUT
============================== */

.inputArea{
    padding:12px 18px 16px;

    background:#101114;
}

.inputBox{
    display:flex;
    align-items:flex-end;

    gap:8px;

    padding:8px;

    background:#1a1c21;

    border:1px solid #292c34;

    border-radius:13px;

    transition:border .2s ease;
}

.inputBox:focus-within{
    border-color:#414550;
}

.input{
    flex:1;

    min-width:0;

    max-height:150px;

    resize:none;

    border:0;
    outline:0;

    background:transparent;

    color:#eee;

    font-family:inherit;
    font-size:14px;

    line-height:1.45;

    padding:8px;
}

.input::placeholder{
    color:#666b75;
}

.attach{
    width:40px;
    height:40px;

    border:0;
    border-radius:9px;

    background:transparent;
    color:#8b909b;

    cursor:pointer;

    font-size:19px;
}

.attach:hover{
    background:#252830;
    color:#ddd;
}

.send{
    width:42px;
    height:40px;

    border:0;
    border-radius:9px;

    background:#30333b;
    color:#eee;

    cursor:pointer;

    font-size:16px;

    transition:
        background .18s ease,
        transform .18s ease;
}

.send:hover{
    background:#3b3f49;
}

.send:active{
    transform:scale(.94);
}

.send:disabled{
    opacity:.45;
    cursor:not-allowed;
}

/* ==============================
   IMAGE PREVIEW
============================== */

.preview{
    display:none;

    margin-bottom:8px;

    padding:8px;

    border-radius:10px;

    background:#1b1d22;
    border:1px solid #292c33;
}

.preview.show{
    display:flex;
    align-items:center;
    gap:10px;
}

.preview img{
    width:70px;
    height:70px;

    object-fit:cover;

    border-radius:7px;
}

.previewInfo{
    flex:1;
    min-width:0;
}

.previewName{
    color:#ddd;
    font-size:13px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.previewSize{
    color:#737783;
    font-size:11px;
    margin-top:3px;
}

.removeImage{
    width:32px;
    height:32px;

    border:0;
    border-radius:7px;

    background:#292b32;
    color:#aaa;

    cursor:pointer;
}

/* ==============================
   SETTINGS
============================== */

.overlay{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.62);

    display:none;

    align-items:center;
    justify-content:center;

    z-index:100;

    backdrop-filter:blur(5px);
}

.overlay.show{
    display:flex;
}

.settings{
    width:min(480px,92vw);
    max-height:85vh;

    overflow:auto;

    background:#191b20;

    border:1px solid #30333b;

    border-radius:15px;

    box-shadow:0 20px 70px rgba(0,0,0,.5);

    padding:20px;
}

.settingsHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:18px;
}

.settingsTitle{
    font-size:19px;
    font-weight:700;
}

.close{
    width:36px;
    height:36px;

    border:0;
    border-radius:8px;

    background:#262930;
    color:#bbb;

    cursor:pointer;
}

.settingSection{
    margin-top:18px;
}

.settingLabel{
    color:#858a95;

    font-size:11px;
    font-weight:700;

    text-transform:uppercase;

    letter-spacing:.08em;

    margin-bottom:9px;
}

.themes{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:8px;
}

.theme{
    padding:11px;

    border:1px solid #30333b;

    background:#22242a;

    color:#bbb;

    border-radius:9px;

    cursor:pointer;

    text-align:left;

    transition:.18s ease;
}

.theme:hover{
    background:#2a2d34;
}

.theme.active{
    border-color:#777;
    color:#fff;
}

.themeDot{
    display:inline-block;

    width:10px;
    height:10px;

    border-radius:50%;

    margin-right:7px;

    background:#777;
}

/* ==============================
   FULLSCREEN IMAGE VIEWER
============================== */

.imageViewer{
    position:fixed;
    inset:0;

    background:#050506;

    z-index:300;

    display:none;

    flex-direction:column;
}

.imageViewer.show{
    display:flex;
}

.viewerTop{
    height:60px;
    min-height:60px;

    display:flex;
    align-items:center;

    padding:0 15px;

    background:rgba(12,13,15,.96);

    border-bottom:1px solid #25272d;
}

.backButton{
    height:40px;

    padding:0 15px;

    border:0;
    border-radius:9px;

    background:#24262c;

    color:#eee;

    cursor:pointer;

    font-size:14px;
}

.backButton:hover{
    background:#30333b;
}

.viewerTitle{
    margin-left:12px;

    color:#aaa;

    font-size:13px;
}

.viewerContent{
    flex:1;
    min-height:0;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.viewerContent img{
    max-width:100%;
    max-height:100%;

    object-fit:contain;

    user-select:none;
}

/* ==============================
   STATUS
============================== */

.status{
    position:fixed;

    left:50%;
    bottom:80px;

    transform:
        translate(-50%,10px);

    opacity:0;

    pointer-events:none;

    padding:9px 14px;

    border-radius:9px;

    background:#25272d;

    border:1px solid #353840;

    color:#ddd;

    font-size:12px;

    transition:
        opacity .2s ease,
        transform .2s ease;

    z-index:500;
}

.status.show{
    opacity:1;

    transform:
        translate(-50%,0);
}

/* ==============================
   MOBILE
============================== */

@media(max-width:700px){

    .sidebar{
        display:none;
    }

    .messages{
        padding:15px 8px 8px;
    }

    .message{
        padding:8px 5px;
    }

    .inputArea{
        padding:
            8px
            8px
            calc(8px + env(safe-area-inset-bottom));
    }

    .messageImage{
        max-width:85vw;
        max-height:350px;
    }

    .themes{
        grid-template-columns:1fr;
    }

}

/* ==============================
   THEMES
============================== */

body.theme-midnight{
    background:#0e1013;
}

body.theme-slate{
    background:#11161b;
}

body.theme-carbon{
    background:#0c0c0d;
}

body.theme-purple{
    background:#120f17;
}

body.theme-blue{
    background:#0d131b;
}

body.theme-red{
    background:#160f10;
}

body.theme-green{
    background:#0d1511;
}

body.theme-ocean{
    background:#0b1417;
}

body.theme-amoled{
    background:#000;
}

body.theme-coffee{
    background:#15110e;
}

body.theme-gray{
    background:#151515;
}

</style>

<script type="module">

/* =====================================================
   SETTINGS
===================================================== */

const API =
    "/api/messages";

const CHANNEL =
    "general";


/* =====================================================
   ELEMENTS
===================================================== */

const messagesEl =
    document.getElementById(
        "messages"
    );

const emptyEl =
    document.getElementById(
        "empty"
    );

const input =
    document.getElementById(
        "messageInput"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const attachButton =
    document.getElementById(
        "attachButton"
    );

const fileInput =
    document.getElementById(
        "fileInput"
    );

const preview =
    document.getElementById(
        "preview"
    );

const previewImage =
    document.getElementById(
        "previewImage"
    );

const previewName =
    document.getElementById(
        "previewName"
    );

const previewSize =
    document.getElementById(
        "previewSize"
    );

const removeImage =
    document.getElementById(
        "removeImage"
    );

const statusEl =
    document.getElementById(
        "status"
    );

const settingsButton =
    document.getElementById(
        "settingsButton"
    );

const settingsOverlay =
    document.getElementById(
        "settingsOverlay"
    );

const closeSettings =
    document.getElementById(
        "closeSettings"
    );

const imageViewer =
    document.getElementById(
        "imageViewer"
    );

const fullscreenImage =
    document.getElementById(
        "fullscreenImage"
    );

const backImage =
    document.getElementById(
        "backImage"
    );


/* =====================================================
   USERNAME
===================================================== */

let username =
    localStorage.getItem(
        "chat_username"
    );

if(!username){

    username =
        prompt(
            "Choose a username:"
        );

    if(!username){

        username =
            "User";

    }

    username =
        username
        .trim()
        .substring(0,24);

    localStorage.setItem(
        "chat_username",
        username
    );

}


/* =====================================================
   STATE
===================================================== */

let selectedImage =
    null;

let selectedImageName =
    "";

let messagesCache =
    new Map();

let firstLoad =
    true;

let loading =
    false;


/* =====================================================
   STATUS
===================================================== */

let statusTimer;

function showStatus(text){

    clearTimeout(
        statusTimer
    );

    statusEl.textContent =
        text;

    statusEl.classList.add(
        "show"
    );

    statusTimer =
        setTimeout(
            () => {

                statusEl.classList.remove(
                    "show"
                );

            },
            3000
        );

}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(value){

    const date =
        new Date(value);

    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "";

    }

    return date.toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =====================================================
   ESCAPE TEXT
===================================================== */

function escapeHTML(text){

    return String(text)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =====================================================
   AVATAR
===================================================== */

function avatarLetter(name){

    return (
        String(name || "U")
        .trim()
        .charAt(0)
        .toUpperCase()
    ) || "U";

}


/* =====================================================
   CREATE MESSAGE ELEMENT
===================================================== */

function createMessageElement(msg){

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message";

    const avatar =
        document.createElement(
            "div"
        );

    avatar.className =
        "avatar";

    avatar.textContent =
        avatarLetter(
            msg.username
        );


    const content =
        document.createElement(
            "div"
        );

    content.className =
        "messageContent";


    const header =
        document.createElement(
            "div"
        );

    header.className =
        "messageHeader";


    const name =
        document.createElement(
            "span"
        );

    name.className =
        "username";

    name.textContent =
        msg.username ||
        "User";


    const time =
        document.createElement(
            "span"
        );

    time.className =
        "time";

    time.textContent =
        formatTime(
            msg.created_at
        );


    header.appendChild(
        name
    );

    header.appendChild(
        time
    );


    content.appendChild(
        header
    );


    if(msg.message){

        const text =
            document.createElement(
                "div"
            );

        text.className =
            "messageText";

        text.textContent =
            msg.message;

        content.appendChild(
            text
        );

    }


    if(msg.image){

        const image =
            document.createElement(
                "img"
            );

        image.className =
            "messageImage";

        image.src =
            msg.image;

        image.alt =
            "Image sent by " +
            (
                msg.username ||
                "User"
            );

        image.loading =
            "lazy";


        image.addEventListener(
            "click",
            () => {

                openImage(
                    msg.image
                );

            }
        );


        content.appendChild(
            image
        );

    }


    wrapper.appendChild(
        avatar
    );

    wrapper.appendChild(
        content
    );


    return wrapper;

}


/* =====================================================
   RENDER WITHOUT FLICKER
===================================================== */

function renderMessages(data){

    if(!Array.isArray(data)){
        return;
    }


    const wasAtBottom =
        messagesEl.scrollHeight -
        messagesEl.scrollTop -
        messagesEl.clientHeight
        < 80;


    const newIds =
        new Set();


    for(
        const msg of data
    ){

        const id =
            String(
                msg.id ??
                (
                    String(
                        msg.created_at
                    ) +
                    "|" +
                    String(
                        msg.username
                    ) +
                    "|" +
                    String(
                        msg.message
                    )
                )
            );


        newIds.add(
            id
        );


        if(
            !messagesCache.has(
                id
            )
        ){

            messagesCache.set(
                id,
                msg
            );


            const element =
                createMessageElement(
                    msg
                );

            element.dataset.id =
                id;


            messagesEl.appendChild(
                element
            );

        }

    }


    for(
        const [id] of messagesCache
    ){

        if(
            !newIds.has(id)
        ){

            messagesCache.delete(
                id
            );

            const old =
                messagesEl.querySelector(
                    `[data-id="${CSS.escape(id)}"]`
                );

            if(old){

                old.remove();

            }

        }

    }


    emptyEl.style.display =
        data.length
            ? "none"
            : "flex";


    if(
        firstLoad ||
        wasAtBottom
    ){

        messagesEl.scrollTop =
            messagesEl.scrollHeight;

    }


    firstLoad =
        false;

}


/* =====================================================
   LOAD MESSAGES
===================================================== */

async function loadMessages(){

    if(loading){
        return;
    }

    loading =
        true;

    try{

        const response =
            await fetch(
                API +
                "?channel=" +
                encodeURIComponent(
                    CHANNEL
                ),
                {
                    method:"GET",
                    cache:"no-store",
                    headers:{
                        "Accept":
                            "application/json"
                    }
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error ||
                "HTTP " +
                response.status
            );

        }


        renderMessages(
            data.messages || []
        );


    }catch(error){

        console.error(
            error
        );

        if(firstLoad){

            showStatus(
                "Failed to load messages"
            );

        }

    }finally{

        loading =
            false;

    }

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

    if(
        sendButton.disabled
    ){

        return;

    }


    const text =
        input.value
        .trim();


    if(
        !text &&
        !selectedImage
    ){

        return;

    }


    sendButton.disabled =
        true;


    try{

        const response =
            await fetch(
                API,
                {

                    method:
                        "POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            username:
                                username,

                            channel:
                                CHANNEL,

                            message:
                                text,

                            image:
                                selectedImage

                        })

                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error ||
                "HTTP " +
                response.status
            );

        }


        input.value =
            "";

        input.style.height =
            "auto";


        clearImage();


        if(
            data.message
        ){

            const msg =
                data.message;

            const id =
                String(
                    msg.id ??
                    (
                        String(
                            msg.created_at
                        ) +
                        "|" +
                        String(
                            msg.username
                        ) +
                        "|" +
                        String(
                            msg.message
                        )
                    )
                );


            if(
                !messagesCache.has(id)
            ){

                messagesCache.set(
                    id,
                    msg
                );

                emptyEl.style.display =
                    "none";


                const element =
                    createMessageElement(
                        msg
                    );

                element.dataset.id =
                    id;

                messagesEl.appendChild(
                    element
                );

                messagesEl.scrollTop =
                    messagesEl.scrollHeight;

            }

        }


    }catch(error){

        console.error(
            error
        );

        showStatus(
            error.message ||
            "Failed to send message"
        );

    }finally{

        sendButton.disabled =
            false;

        input.focus();

    }

}


/* =====================================================
   IMAGE RESIZE
===================================================== */

function resizeImage(
    file
){

    return new Promise(
        (
            resolve,
            reject
        ) => {

            const reader =
                new FileReader();


            reader.onload =
                () => {

                    const image =
                        new Image();


                    image.onload =
                        () => {

                            const max =
                                1500;


                            let width =
                                image.naturalWidth;

                            let height =
                                image.naturalHeight;


                            if(
                                width >
                                max ||
                                height >
                                max
                            ){

                                const scale =
                                    Math.min(
                                        max /
                                        width,

                                        max /
                                        height
                                    );


                                width =
                                    Math.round(
                                        width *
                                        scale
                                    );

                                height =
                                    Math.round(
                                        height *
                                        scale
                                    );

                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            ctx.drawImage(
                                image,
                                0,
                                0,
                                width,
                                height
                            );


                            /*
                             * JPEG keeps Base64
                             * much smaller than
                             * the original image.
                             */

                            const base64 =
                                canvas.toDataURL(
                                    "image/jpeg",
                                    0.82
                                );


                            resolve({
                                base64:
                                    base64,

                                width:
                                    width,

                                height:
                                    height
                            });

                        };


                    image.onerror =
                        () => {

                            reject(
                                new Error(
                                    "Could not read image."
                                )
                            );

                        };


                    image.src =
                        reader.result;

                };


            reader.onerror =
                () => {

                    reject(
                        new Error(
                            "Could not read file."
                        )
                    );

                };


            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =====================================================
   SELECT IMAGE
===================================================== */

fileInput.addEventListener(
    "change",
    async () => {

        const file =
            fileInput.files?.[0];


        if(!file){
            return;
        }


        if(
            !file.type.startsWith(
                "image/"
            )
        ){

            showStatus(
                "Please choose an image."
            );

            return;

        }


        try{

            showStatus(
                "Preparing image..."
            );


            const result =
                await resizeImage(
                    file
                );


            selectedImage =
                result.base64;

            selectedImageName =
                file.name;


            previewImage.src =
                selectedImage;


            previewName.textContent =
                file.name;


            previewSize.textContent =
                result.width +
                " × " +
                result.height +
                " • optimized";


            preview.classList.add(
                "show"
            );


        }catch(error){

            console.error(
                error
            );

            showStatus(
                "Could not prepare image."
            );

        }


        fileInput.value =
            "";

    }
);


/* =====================================================
   CLEAR IMAGE
===================================================== */

function clearImage(){

    selectedImage =
        null;

    selectedImageName =
        "";

    previewImage.src =
        "";

    preview.classList.remove(
        "show"
    );

}


removeImage.addEventListener(
    "click",
    clearImage
);


attachButton.addEventListener(
    "click",
    () => {

        fileInput.click();

    }
);


/* =====================================================
   INPUT AUTO RESIZE
===================================================== */

input.addEventListener(
    "input",
    () => {

        input.style.height =
            "auto";

        input.style.height =
            Math.min(
                input.scrollHeight,
                150
            ) +
            "px";

    }
);


/* =====================================================
   ENTER TO SEND
===================================================== */

input.addEventListener(
    "keydown",
    event => {

        if(
            event.key ===
            "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   SEND BUTTON
===================================================== */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =====================================================
   SETTINGS
===================================================== */

settingsButton.addEventListener(
    "click",
    () => {

        settingsOverlay.classList.add(
            "show"
        );

    }
);


closeSettings.addEventListener(
    "click",
    () => {

        settingsOverlay.classList.remove(
            "show"
        );

    }
);


settingsOverlay.addEventListener(
    "click",
    event => {

        if(
            event.target ===
            settingsOverlay
        ){

            settingsOverlay.classList.remove(
                "show"
            );

        }

    }
);


/* =====================================================
   THEMES
===================================================== */

const themeButtons =
    document.querySelectorAll(
        ".theme"
    );


function setTheme(
    theme
){

    document.body.className =
        "theme-" +
        theme;


    localStorage.setItem(
        "chat_theme",
        theme
    );


    themeButtons.forEach(
        button => {

            button.classList.toggle(
                "active",
                button.dataset.theme ===
                theme
            );

        }
    );

}


themeButtons.forEach(
    button => {

        button.addEventListener(
            "click",
            () => {

                setTheme(
                    button.dataset.theme
                );

            }
        );

    }
);


const savedTheme =
    localStorage.getItem(
        "chat_theme"
    );


if(savedTheme){

    setTheme(
        savedTheme
    );

}


/* =====================================================
   FULLSCREEN IMAGE
===================================================== */

function openImage(
    src
){

    fullscreenImage.src =
        src;

    imageViewer.classList.add(
        "show"
    );

    document.body.style.overflow =
        "hidden";

}


function closeImage(){

    imageViewer.classList.remove(
        "show"
    );

    fullscreenImage.src =
        "";

    document.body.style.overflow =
        "";

}


backImage.addEventListener(
    "click",
    closeImage
);


/* ESC CLOSES IMAGE */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key ===
            "Escape"
        ){

            if(
                imageViewer.classList.contains(
                    "show"
                )
            ){

                closeImage();

            }

            else if(
                settingsOverlay.classList.contains(
                    "show"
                )
            ){

                settingsOverlay.classList.remove(
                    "show"
                );

            }

        }

    }
);


/* =====================================================
   START
===================================================== */

loadMessages();


/*
 * Poll the API without rebuilding
 * existing messages.
 *
 * This prevents the text from
 * flashing/reloading.
 */

setInterval(
    loadMessages,
    2000
);

</script>
