<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Game Hub - Chat & Games</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#0b0d10;
    --panel:#111419;
    --panel2:#181c22;
    --panel3:#20252d;
    --border:#292f38;
    --text:#edf0f4;
    --muted:#7e8793;
    --accent:#e8eaed;
    --danger:#ff7070;
    --green:#70e0a0;
    --yellow:#e5c66b;
    --radius:12px;
    --text-size:16px;
    --word-spacing:0px;
    --line-spacing:1.45;
    --ui-scale:1;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
}

body{
    overflow:hidden;
    font-size:calc(16px * var(--ui-scale));
    position:fixed;
    inset:0;
}

button,
input,
textarea,
select{
    font:inherit;
    -webkit-appearance:none;
    appearance:none;
}

button{
    cursor:pointer;
    touch-action:manipulation;
}

.app{
    width:100%;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
}

/* ============================================
   OPENING SCREEN
============================================ */

.opening-screen{
    position:fixed;
    inset:0;
    z-index:1000;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transition:opacity 0.6s ease, transform 0.6s ease;
    padding:20px;
}

.opening-screen.hidden{
    opacity:0;
    transform:scale(1.05);
    pointer-events:none;
}

.opening-logo{
    font-size:72px;
    margin-bottom:10px;
    animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.1); }
}

.opening-title{
    font-size:32px;
    font-weight:900;
    background:linear-gradient(135deg,#ff6b6b,#ffd93d,#4ecdc4);
    -webkit-background-clip:text;
    -webkit-text-color:transparent;
    background-clip:text;
    margin-bottom:5px;
}

.opening-sub{
    color:var(--muted);
    font-size:14px;
    margin-bottom:30px;
}

.opening-btn{
    padding:14px 40px;
    border-radius:14px;
    border:none;
    background:var(--accent);
    color:#111;
    font-weight:700;
    font-size:18px;
    transition:0.2s;
    touch-action:manipulation;
}

.opening-btn:active{
    transform:scale(0.95);
}

.opening-version{
    position:absolute;
    bottom:20px;
    color:var(--muted);
    font-size:11px;
    opacity:0.5;
}

/* ============================================
   HEADER
============================================ */

.header{
    height:56px;
    min-height:56px;
    padding:0 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    flex-shrink:0;
    position:sticky;
    top:0;
    z-index:50;
}

.logo{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:700;
    font-size:18px;
}

.logo-icon{
    width:32px;
    height:32px;
    display:grid;
    place-items:center;
    border-radius:8px;
    background:var(--panel2);
    border:1px solid var(--border);
    font-size:16px;
}

.header-actions{
    display:flex;
    gap:4px;
    align-items:center;
}

.icon-btn{
    width:36px;
    height:36px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    display:grid;
    place-items:center;
    font-size:18px;
    position:relative;
    touch-action:manipulation;
}

.icon-btn:active{
    transform:scale(0.92);
}

.icon-btn .badge{
    position:absolute;
    top:-4px;
    right:-4px;
    width:18px;
    height:18px;
    border-radius:50%;
    background:#ff6b6b;
    color:white;
    font-size:10px;
    font-weight:700;
    display:grid;
    place-items:center;
}

.icon-btn.recording{
    border-color:#ff6b6b;
    animation:recordingPulse 1s ease-in-out infinite;
}

@keyframes recordingPulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(255,107,107,0.4); }
    50%{ box-shadow:0 0 0 8px rgba(255,107,107,0); }
}

/* ============================================
   MESSAGES
============================================ */

.messages{
    flex:1;
    overflow-y:auto;
    padding:12px;
    -webkit-overflow-scrolling:touch;
}

.message{
    display:flex;
    gap:10px;
    margin-bottom:14px;
    animation: fadeIn 0.2s ease;
}

@keyframes fadeIn{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
}

.avatar{
    flex:0 0 36px;
    width:36px;
    height:36px;
    display:grid;
    place-items:center;
    border-radius:var(--radius);
    background:var(--panel2);
    border:1px solid var(--border);
    font-weight:700;
    font-size:14px;
}

.message-content{
    min-width:0;
    max-width:min(700px,calc(100vw - 60px));
}

.message-top{
    display:flex;
    align-items:baseline;
    gap:6px;
    margin-bottom:2px;
    flex-wrap:wrap;
}

.username{
    font-weight:700;
    font-size:14px;
}

.time,.edited{
    color:var(--muted);
    font-size:10px;
}

.message-text{
    color:#d8dde4;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    font-size:calc(var(--text-size) * 0.9);
    word-spacing:var(--word-spacing);
    line-height:var(--line-spacing);
}

.message-image{
    display:block;
    max-width:min(400px,80vw);
    max-height:400px;
    margin-top:6px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:#000;
    object-fit:contain;
    cursor:pointer;
}

/* FILE ATTACHMENT */
.message-file{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    margin-top:6px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:var(--panel2);
    cursor:pointer;
    transition:0.2s;
    text-decoration:none;
    color:var(--text);
}

.message-file:hover{
    background:var(--panel3);
}

.message-file .file-icon{
    font-size:28px;
    flex-shrink:0;
}

.message-file .file-info{
    flex:1;
    min-width:0;
}

.message-file .file-name{
    font-weight:600;
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.message-file .file-size{
    color:var(--muted);
    font-size:11px;
}

.message-file .file-download{
    color:var(--accent);
    font-size:20px;
    flex-shrink:0;
}

/* VOICE MESSAGE */
.message-voice{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 14px;
    margin-top:6px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:var(--panel2);
    min-width:200px;
}

.message-voice .voice-play-btn{
    width:36px;
    height:36px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    font-size:16px;
    display:grid;
    place-items:center;
    flex-shrink:0;
    transition:0.15s;
}

.message-voice .voice-play-btn:active{
    transform:scale(0.9);
}

.message-voice .voice-play-btn.playing{
    border-color:var(--green);
    color:var(--green);
}

.message-voice .voice-wave{
    flex:1;
    height:30px;
    display:flex;
    align-items:center;
    gap:2px;
}

.message-voice .voice-wave .bar{
    width:3px;
    background:var(--muted);
    border-radius:2px;
    transition:height 0.1s;
    height:8px;
}

.message-voice .voice-wave .bar.active{
    background:var(--green);
}

.message-voice .voice-duration{
    color:var(--muted);
    font-size:12px;
    font-variant-numeric:tabular-nums;
    min-width:40px;
    text-align:right;
}

/* ============================================
   GAME CARDS
============================================ */

.game-message{
    margin:0 auto 14px;
    max-width:700px;
}

.game-card{
    border:1px solid var(--border);
    border-radius:14px;
    background:linear-gradient(145deg,var(--panel2),#101318);
    overflow:hidden;
    box-shadow:0 8px 30px #0005;
}

.game-header{
    padding:12px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
    gap:4px;
}

.game-title{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:15px;
    font-weight:800;
}

.game-status{
    font-size:10px;
    padding:4px 10px;
    border-radius:999px;
    background:#252b33;
    color:#bfc6cf;
    font-weight:600;
}

.game-body{
    padding:12px 14px;
}

.game-info{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
    margin-bottom:8px;
}

.game-pill{
    padding:3px 8px;
    border-radius:6px;
    border:1px solid var(--border);
    background:#13171d;
    color:#bfc6cf;
    font-size:10px;
}

.game-pill strong{
    color:white;
}

.game-description{
    color:#969faa;
    margin-bottom:10px;
    line-height:1.4;
    font-size:12px;
}

.game-actions{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.game-btn{
    border:1px solid var(--border);
    border-radius:8px;
    padding:6px 12px;
    background:#222830;
    color:white;
    font-weight:600;
    font-size:12px;
    touch-action:manipulation;
}

.game-btn:active{
    transform:scale(0.95);
}

.game-btn.primary{
    background:#e8eaed;
    color:#111;
}

.game-btn.green{
    background:#193b2b;
    border-color:#2c6348;
    color:#9bf0bc;
}

.game-btn.danger{
    background:#3a1c20;
    border-color:#71333b;
    color:#ff9292;
}

.game-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
}

/* PLAYERS */

.players-list{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
    margin:8px 0;
}

.player-chip{
    padding:3px 8px;
    border-radius:6px;
    background:#13171d;
    border:1px solid var(--border);
    font-size:10px;
}

.player-chip.host{
    border-color:#65552a;
    color:#ead17a;
}

.turn-banner{
    margin:8px 0;
    padding:8px 10px;
    border-radius:8px;
    background:#151a20;
    border:1px solid var(--border);
    color:#c8ced6;
    font-size:12px;
}

.turn-banner strong{
    color:white;
}

/* ============================================
   COMPOSER
============================================ */

.composer{
    padding:8px 12px 12px;
    background:var(--panel);
    border-top:1px solid var(--border);
    flex-shrink:0;
    padding-bottom:max(12px,env(safe-area-inset-bottom));
}

.composer-box{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:6px;
    padding:6px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:12px;
}

.composer-left{
    display:flex;
    gap:4px;
    align-items:center;
    flex-shrink:0;
}

textarea{
    flex:1;
    min-height:36px;
    max-height:100px;
    resize:none;
    border:0;
    outline:none;
    background:transparent;
    color:white;
    padding:8px;
    font-size:14px;
    line-height:1.4;
}

.composer-btn{
    width:36px;
    height:36px;
    border:0;
    border-radius:8px;
    background:transparent;
    color:#adb5c0;
    font-size:18px;
    display:grid;
    place-items:center;
    flex-shrink:0;
    touch-action:manipulation;
    transition:0.15s;
}

.composer-btn:active{
    transform:scale(0.9);
}

.composer-btn:hover{
    background:var(--panel3);
}

.composer-btn.has-file{
    color:#7affb0;
}

.send-btn{
    height:36px;
    border:0;
    border-radius:8px;
    padding:0 16px;
    background:var(--accent);
    color:#111;
    font-weight:700;
    font-size:14px;
    flex-shrink:0;
    touch-action:manipulation;
}

.send-btn:active{
    transform:scale(0.95);
}

.send-btn:disabled{
    opacity:.5;
}

/* VOICE RECORDING UI */
.voice-recording-indicator{
    display:none;
    align-items:center;
    gap:10px;
    padding:6px 12px;
    background:#3a1a1a;
    border-radius:8px;
    border:1px solid #6a2a2a;
    flex-shrink:0;
}

.voice-recording-indicator.active{
    display:flex;
}

.voice-recording-indicator .rec-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#ff3333;
    animation:recordingPulse 0.8s ease-in-out infinite;
}

.voice-recording-indicator .rec-time{
    color:#ff7a7a;
    font-size:14px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    min-width:50px;
}

.voice-recording-indicator .rec-cancel{
    color:#ff7a7a;
    font-size:16px;
    cursor:pointer;
    padding:2px 6px;
}

.voice-recording-indicator .rec-cancel:active{
    transform:scale(0.9);
}

/* ============================================
   OVERLAYS / WINDOWS
============================================ */

.overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000c;
    z-index:200;
    padding:12px;
    animation:fadeInOverlay 0.2s ease;
}

@keyframes fadeInOverlay{
    from{ opacity:0; }
    to{ opacity:1; }
}

.overlay.show{
    display:flex;
}

.window{
    width:min(580px,calc(100vw - 24px));
    max-height:calc(100vh - 24px);
    overflow-y:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:0 30px 80px #000d;
    animation:slideUp 0.25s ease;
}

@keyframes slideUp{
    from{ opacity:0; transform:translateY(30px) scale(0.95); }
    to{ opacity:1; transform:translateY(0) scale(1); }
}

.window-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 18px;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    background:var(--panel);
    z-index:1;
}

.window-header h2{
    margin:0;
    font-size:18px;
}

.window-close{
    width:32px;
    height:32px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    font-size:20px;
    display:grid;
    place-items:center;
    touch-action:manipulation;
}

.window-close:active{
    transform:scale(0.9);
}

.window-body{
    padding:16px 18px;
}

/* GAME GRID */

.game-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.game-choice{
    min-height:70px;
    padding:12px;
    text-align:left;
    border-radius:10px;
    border:1px solid var(--border);
    background:#151a20;
    color:white;
    font-size:12px;
    touch-action:manipulation;
}

.game-choice:active{
    transform:scale(0.97);
}

.game-choice strong{
    display:block;
    margin-bottom:2px;
    font-size:14px;
}

.game-choice span{
    color:#818b97;
    font-size:10px;
}

.game-choice .game-players{
    display:inline-block;
    background:#1a1f26;
    padding:1px 8px;
    border-radius:8px;
    color:#aab2bd;
    font-size:9px;
    margin-top:3px;
}

/* SETTINGS */

.settings-category{
    margin-bottom:10px;
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    background:var(--panel2);
}

.settings-category-title{
    width:100%;
    padding:12px 14px;
    border:0;
    background:transparent;
    color:var(--text);
    display:flex;
    justify-content:space-between;
    font-weight:700;
    font-size:14px;
    text-align:left;
}

.settings-category-body{
    display:none;
    padding:0 14px 14px;
}

.settings-category.open .settings-category-body{
    display:block;
}

.setting{
    margin-top:12px;
}

.setting label{
    display:block;
    margin-bottom:4px;
    color:#aab2bd;
    font-size:12px;
}

.setting input,
.setting select{
    width:100%;
    padding:8px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    outline:none;
    background:#101419;
    color:white;
    font-size:14px;
}

.setting input[type=range]{
    padding:0;
    -webkit-appearance:slider-vertical;
}

.setting-value{
    color:var(--muted);
    font-size:11px;
    margin-top:4px;
}

.save-btn{
    width:100%;
    margin-top:10px;
    padding:12px;
    border:0;
    border-radius:10px;
    background:var(--accent);
    color:#111;
    font-weight:700;
    font-size:15px;
    touch-action:manipulation;
}

.save-btn:active{
    transform:scale(0.97);
}

.danger-zone{
    margin-top:16px;
    padding-top:16px;
    border-top:1px solid #402529;
}

.danger-title{
    color:var(--danger);
    font-weight:700;
    margin-bottom:4px;
}

.danger-zone p{
    color:var(--muted);
    line-height:1.4;
    font-size:13px;
}

.danger-btn{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid #743333;
    background:#241719;
    color:#ff8585;
    font-weight:600;
    touch-action:manipulation;
}

.danger-btn:active{
    transform:scale(0.97);
}

/* ============================================
   NOTIFICATION
============================================ */

.notification{
    position:fixed;
    bottom:80px;
    left:50%;
    transform:translateX(-50%) translateY(100px);
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 20px;
    z-index:150;
    opacity:0;
    transition:all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events:none;
    max-width:90vw;
    box-shadow:0 10px 40px #0008;
    font-size:14px;
    text-align:center;
}

.notification.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
    pointer-events:auto;
}

.notification .notif-icon{
    margin-right:8px;
}

/* ============================================
   CONFIRM
============================================ */

.confirm-window .window-body{
    text-align:center;
}

.confirm-text{
    color:#9da5b0;
    line-height:1.5;
    margin-bottom:16px;
}

.confirm-actions{
    display:flex;
    gap:8px;
    justify-content:center;
}

/* ============================================
   EMPTY STATE
============================================ */

.empty{
    height:100%;
    min-height:150px;
    display:grid;
    place-items:center;
    color:#656d78;
    text-align:center;
    padding:20px;
}

.empty strong{
    display:block;
    color:#aab2bd;
    margin-bottom:4px;
    font-size:16px;
}

.empty span{
    font-size:13px;
}

/* ============================================
   PHONE OPTIMIZATIONS
============================================ */

@media(max-width:600px){

    .header{
        height:50px;
        min-height:50px;
        padding:0 10px;
    }

    .logo{
        font-size:16px;
        gap:6px;
    }

    .logo-icon{
        width:28px;
        height:28px;
        font-size:14px;
    }

    .icon-btn{
        width:32px;
        height:32px;
        font-size:16px;
    }

    .messages{
        padding:10px;
    }

    .message{
        gap:8px;
        margin-bottom:12px;
    }

    .avatar{
        flex:0 0 32px;
        width:32px;
        height:32px;
        font-size:12px;
    }

    .message-content{
        max-width:calc(100vw - 52px);
    }

    .username{
        font-size:13px;
    }

    .message-text{
        font-size:14px;
    }

    .game-message{
        margin:0 auto 10px;
    }

    .game-header{
        padding:10px 12px;
    }

    .game-title{
        font-size:14px;
    }

    .game-body{
        padding:10px 12px;
    }

    .game-info{
        gap:4px;
    }

    .game-pill{
        font-size:10px;
        padding:3px 8px;
    }

    .game-description{
        font-size:12px;
    }

    .game-btn{
        font-size:12px;

/* ============================================
   GAME UI - Tic Tac Toe
============================================ */

.ttt-board{
    display:grid;
    gap:4px;
    justify-content:center;
    margin:10px auto;
    max-width:320px;
}

.ttt-cell{
    aspect-ratio:1;
    border-radius:8px;
    border:2px solid var(--border);
    background:#11151b;
    color:white;
    font-weight:900;
    font-size:28px;
    display:grid;
    place-items:center;
    transition:0.15s;
    touch-action:manipulation;
}

.ttt-cell:active:not(:disabled){
    transform:scale(0.93);
}

.ttt-cell:hover:not(:disabled){
    background:#222831;
}

.ttt-cell:disabled{
    opacity:0.7;
    cursor:not-allowed;
}

.ttt-cell .symbol-X{ color:#ff6b6b; }
.ttt-cell .symbol-O{ color:#4ecdc4; }
.ttt-cell .symbol-triangle{ color:#ffd93d; }

/* ============================================
   GAME UI - Connect Four
============================================ */

.connect-board{
    display:grid;
    gap:4px;
    padding:8px;
    margin:10px auto;
    background:#11161d;
    border:1px solid var(--border);
    border-radius:12px;
    max-width:100%;
    overflow:auto;
}

.connect-cell{
    aspect-ratio:1;
    border-radius:50%;
    background:#252b33;
    border:1px solid #343b45;
    transition:0.15s;
    touch-action:manipulation;
}

.connect-cell:active:not(.taken){
    transform:scale(0.9);
}

.connect-cell.red{
    background:#d65353;
}

.connect-cell.yellow{
    background:#e0c454;
}

.connect-cell.taken{
    cursor:default;
}

/* ============================================
   GAME UI - Memory Match
============================================ */

.memory-grid{
    display:grid;
    gap:6px;
    justify-content:center;
    margin:10px auto;
    max-width:100%;
}

.memory-card{
    aspect-ratio:1;
    border-radius:8px;
    border:2px solid var(--border);
    background:#1a1f26;
    display:grid;
    place-items:center;
    font-size:28px;
    cursor:pointer;
    transition:0.2s;
    color:transparent;
    user-select:none;
    touch-action:manipulation;
}

.memory-card:active:not(.flipped):not(.matched){
    transform:scale(0.93);
}

.memory-card.flipped{

}

.memory-card.matched{
    background:#1a3a2a;

/* =====================================================
   CONFIG
===================================================== */

const API_URL="/api/messages";
const CHANNEL="general";
const GAME_PREFIX="__CHAT_GAME_STATE__:";


/* =====================================================
   DEVICE
===================================================== */

let deviceId=localStorage.getItem("chat_device_id");

if(!deviceId){
    if(window.crypto && crypto.randomUUID){
        deviceId=crypto.randomUUID();
    }else{
        deviceId=Date.now().toString(36)+Math.random().toString(36).slice(2);
    }
    localStorage.setItem("chat_device_id",deviceId);
}


/* =====================================================
   SETTINGS
===================================================== */

    username:"",
    refreshRate:500,
    showTimestamps:true,

    wordSpacing:0,
    lineSpacing:1.45,
    cornerRadius:12,
    uiScale:1,
    theme:"dark",
    enterToSend:true,
    autoScroll:true
};

function getSetting(key){
    const value=localStorage.getItem("chat_"+key);
    if(value===null) return defaults[key];
    if(value==="true"||value==="false") return value==="true";
    const number=Number(value);
    return Number.isNaN(number)?value:number;
}

let settings={};
Object.keys(defaults).forEach(key=>{ settings[key]=getSetting(key); });


/* =====================================================
   ELEMENTS

    notification.querySelector(".notif-icon").textContent=icon;
    notification.classList.add("show");
    clearTimeout(notificationTimeout);
    notificationTimeout=setTimeout(()=>{

function updateGameBadge(){
    const count=games.filter(g=>g.status==="lobby"||g.status==="playing").length;
    activeGameCount=count;
    if(count>0){
        gameBadge.style.display="grid";
        gameBadge.textContent=count;
        gameBadge.classList.add("pulse");
        setTimeout(()=>gameBadge.classList.remove("pulse"),1500);

/* =====================================================
   FILE HANDLING
===================================================== */

function getFileIcon(fileName){
    const ext=fileName.split('.').pop().toLowerCase();
    const icons={
        pdf:'📄', doc:'📝', docx:'📝', xls:'📊', xlsx:'📊', ppt:'📽️', pptx:'📽️',
        zip:'📦', rar:'📦', 7z:'📦', txt:'📃', md:'📃',
        mp3:'🎵', wav:'🎵', ogg:'🎵', flac:'🎵',
        mp4:'🎬', avi:'🎬', mkv:'🎬', mov:'🎬', webm:'🎬',
        jpg:'🖼️', jpeg:'🖼️', png:'🖼️', gif:'🖼️', svg:'🖼️', webp:'🖼️',
        exe:'⚙️', dmg:'💿', app:'📱', apk:'📱',
        js:'📜', html:'🌐', css:'🎨', json:'📊', xml:'📋',
        py:'🐍', java:'☕', cpp:'⚡', c:'🔧', go:'🐹', rs:'🦀',
        psd:'🎨', ai:'🎨', sketch:'🎨', fig:'🎨'
    };
    return icons[ext]||'📎';
}

function formatFileSize(bytes){
    if(bytes<1024) return bytes+' B';
    if(bytes<1048576) return (bytes/1024).toFixed(1)+' KB';
    if(bytes<1073741824) return (bytes/1048576).toFixed(1)+' MB';
    return (bytes/1073741824).toFixed(1)+' GB';
}

function fileToBase64(file){
    return new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onload=()=>resolve(reader.result);
        reader.onerror=reject;
        reader.readAsDataURL(file);
    });
}

attachBtn.onclick=()=>{ fileInput.click(); };

fileInput.onchange=async()=>{
    const file=fileInput.files[0];
    if(!file)return;
    try{
        // For images, resize them
        if(file.type.startsWith('image/')){
            const resized=await resizeImage(file,1500);
            pendingFileData=resized;
            pendingFileName=file.name;
            pendingFileType='image';
        }else{
            // For other files, keep as base64
            const data=await fileToBase64(file);
            // Limit file size to 10MB for non-images
            if(data.length>10*1024*1024){
                showNotification("File too large! Max 10MB","⚠️");
                fileInput.value='';
                return;
            }
            pendingFileData=data;
            pendingFileName=file.name;
            pendingFileType='file';
        }
        attachBtn.textContent='✅';
        attachBtn.style.color='#7affb0';
        attachBtn.classList.add('has-file');
        showNotification("File attached: "+file.name,"📎");
    }catch(error){
        showNotification("Failed to load file: "+error.message,"❌");
    }
    fileInput.value='';
};

function resizeImage(file,maxSize){
    return new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onload=function(e){
            const img=new Image();
            img.onload=function(){
                let width=img.width,height=img.height;
                if(width>maxSize||height>maxSize){
                    const ratio=Math.min(maxSize/width,maxSize/height);
                    width=Math.round(width*ratio);
                    height=Math.round(height*ratio);
                }
                const canvas=document.createElement('canvas');
                canvas.width=width;canvas.height=height;
                const ctx=canvas.getContext('2d');
                ctx.drawImage(img,0,0,width,height);
                resolve(canvas.toDataURL('image/jpeg',0.8));
            };
            img.onerror=reject;
            img.src=e.target.result;
        };
        reader.onerror=reject;
        reader.readAsDataURL(file);
    });
}


/* =====================================================
   VOICE RECORDING
===================================================== */

let audioContext=null;

voiceBtn.onclick=async()=>{
    if(isRecording){
        stopRecording();
        return;
    }
    startRecording();
};

recCancel.onclick=()=>{
    cancelRecording();
};

async function startRecording(){
    try{
        const stream=await navigator.mediaDevices.getUserMedia({audio:true});
        mediaRecorder=new MediaRecorder(stream);
        audioChunks=[];
        
        mediaRecorder.ondataavailable=(event)=>{
            if(event.data.size>0) audioChunks.push(event.data);
        };
        
        mediaRecorder.onstop=()=>{
            const audioBlob=new Blob(audioChunks,{type:'audio/webm'});
            const reader=new FileReader();
            reader.onload=()=>{
                const base64Data=reader.result;
                pendingFileData=base64Data;
                pendingFileName='voice-' + Date.now() + '.webm';
                pendingFileType='voice';
                attachBtn.textContent='🎤';
                attachBtn.style.color='#7affb0';
                attachBtn.classList.add('has-file');
                showNotification("Voice message recorded!","🎤");
                // Clean up
                stream.getTracks().forEach(track=>track.stop());
            };
            reader.readAsDataURL(audioBlob);
            isRecording=false;
            voiceBtn.classList.remove('recording');
            voiceIndicator.classList.remove('active');
            clearInterval(recordingTimer);
        };
        
        mediaRecorder.start(1000);
        isRecording=true;
        recordingStartTime=Date.now();
        voiceBtn.classList.add('recording');
        voiceIndicator.classList.add('active');
        updateRecTime();
        recordingTimer=setInterval(updateRecTime,100);
        showNotification("Recording... tap 🎤 again to stop","🔴");
    }catch(error){
        showNotification("Could not access microphone: "+error.message,"❌");
    }
}

function stopRecording(){
    if(mediaRecorder&&isRecording){
        mediaRecorder.stop();
    }
}

function cancelRecording(){
    if(mediaRecorder&&isRecording){
        mediaRecorder.onstop=()=>{
            audioChunks=[];
            isRecording=false;
            voiceBtn.classList.remove('recording');
            voiceIndicator.classList.remove('active');
            clearInterval(recordingTimer);
            // Clean up
            if(mediaRecorder.stream) mediaRecorder.stream.getTracks().forEach(track=>track.stop());
            showNotification("Recording cancelled","✕");
        };
        mediaRecorder.stop();
    }
}

function updateRecTime(){
    const elapsed=Math.floor((Date.now()-recordingStartTime)/1000);
    const mins=Math.floor(elapsed/60);
    const secs=elapsed%60;
    recTime.textContent=mins+':'+String(secs).padStart(2,'0');
}

async function apiPost(body){
    const response=await fetch(API_URL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(body)
    });
    const data=await safeJson(response);
    if(!response.ok) throw new Error(data.error||"Request failed.");
    return data;
}

async function apiDelete(body){
    const response=await fetch(API_URL,{
        method:"DELETE",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(body)
    });
    const data=await safeJson(response);
    if(!response.ok) throw new Error(data.error||"Delete failed.");
    return data;
}

async function safeJson(response){
    const text=await response.text();
    if(!text)return{};
    try{ return JSON.parse(text); }
    catch{ return {error:text}; }
}


/* =====================================================
   LOAD MESSAGES
===================================================== */

async function loadMessages(){
    if(syncing)return;
    syncing=true;
    try{
        const response=await fetch(API_URL+"?channel="+encodeURIComponent(CHANNEL)+"&_="+Date.now(),{cache:"no-store"});
        const data=await safeJson(response);
        if(!response.ok) throw new Error(data.error||"Failed to load messages.");
        const newMessages=Array.isArray(data.messages)?data.messages:[];
        const changeInfo=getMessageChanges(currentMessages,newMessages);
        if(changeInfo.changed){
            let hasNewMessages=false;
            let hasNewGames=false;
            for(const msg of newMessages){
                if(!seenMessageIds.has(msg.id)){
                    if(!isGameMessage(msg)) hasNewMessages=true;
                    seenMessageIds.add(msg.id);
                }
            }
            const oldGames=[...games];
            currentMessages=newMessages;
            processGameMessages();
            for(const game of games){
                if(!seenGameIds.has(game.id)){ hasNewGames=true; seenGameIds.add(game.id); }
            }
            const oldGameIds=new Set(oldGames.map(g=>g.id));
            const newGameIds=new Set(games.map(g=>g.id));
            for(const id of oldGameIds){ if(!newGameIds.has(id)) seenGameIds.delete(id); }
            updateGameBadge();
            const shouldScroll=settings.autoScroll&&(hasNewMessages||hasNewGames);
            const wasNearBottom=messagesEl.scrollHeight-messagesEl.scrollTop-messagesEl.clientHeight<100;
            renderMessages(shouldScroll||(wasNearBottom&&settings.autoScroll));
        }
    }catch(error){
        if(!currentMessages.length){
            messagesEl.innerHTML=`<div class="empty"><div><strong>Unable to load messages</strong><span>${escapeHtml(error.message)}</span></div></div>`;
        }
    }finally{
        syncing=false;
    }
}

function getMessageChanges(oldMessages,newMessages){
    if(oldMessages.length!==newMessages.length) return {changed:true};
    for(let i=0;i<oldMessages.length;i++){
        const oldMsg=oldMessages[i],newMsg=newMessages[i];
        if(oldMsg.id!==newMsg.id||oldMsg.message!==newMsg.message||
           oldMsg.username!==newMsg.username||oldMsg.edited!==newMsg.edited||
           oldMsg.image!==newMsg.image||oldMsg.file_name!==newMsg.file_name) return {changed:true};
    }
    return {changed:false};
}


/* =====================================================
   GAME MESSAGE PARSING
===================================================== */

function isGameMessage(message){
    return message&&typeof message.message==="string"&&message.message.startsWith(GAME_PREFIX);
}

function parseGameMessage(message){
    if(!isGameMessage(message)) return null;
    try{ return JSON.parse(message.message.substring(GAME_PREFIX.length)); }
    catch{ return null; }
}

function processGameMessages(){
    const map=new Map();
    for(const message of currentMessages){
        if(!isGameMessage(message)) continue;
        const state=parseGameMessage(message);
        if(!state||state.type!=="game") continue;
        map.set(state.id,{
            ...state,
            messageId:message.id,
            hostDeviceId:state.hostDeviceId||message.device_id||""
        });
    }
    games=[...map.values()];
    updateGameBadge();
}


/* =====================================================
   RENDER MESSAGES
===================================================== */

function renderMessages(shouldAutoScroll){
    const normal=currentMessages.filter(message=>!isGameMessage(message));
    const activeGames=games.filter(game=>game.status!=="finished"&&game.status!=="forcequit");

    if(!normal.length&&!activeGames.length){
        messagesEl.innerHTML=`<div class="empty"><div><strong>No messages yet</strong><span>Be the first to send something!</span></div></div>`;
        renderedElements.clear();
        return;
    }

    const fragment=document.createDocumentFragment();
    const elementIds=[];

    for(const message of normal){
        const item=createMessageElement(message);
        fragment.appendChild(item);
        elementIds.push('msg_'+message.id);
    }

    for(const game of activeGames){
        const gameEl=createGameElement(game);
        fragment.appendChild(gameEl);
        elementIds.push('game_'+game.id);
    }

    const currentChildren=messagesEl.children;
    const currentIds=[];
    for(let i=0;i<currentChildren.length;i++){
        const child=currentChildren[i];
        currentIds.push(child.dataset&&child.dataset.id?child.dataset.id:'__temp_'+i);
    }

    const newChildren=Array.from(fragment.children);
    if(currentIds.length!==elementIds.length||currentIds.some((id,idx)=>id!==elementIds[idx])){
        messagesEl.replaceChildren(fragment);
        renderedElements.clear();
        for(let i=0;i<newChildren.length;i++){
            const el=newChildren[i];
            if(el.dataset&&el.dataset.id) renderedElements.set(el.dataset.id,el);
        }
        if(shouldAutoScroll&&settings.autoScroll){
            requestAnimationFrame(()=>{ messagesEl.scrollTop=messagesEl.scrollHeight; });
        }
        return;
    }

    for(let i=0;i<newChildren.length;i++){
        const newEl=newChildren[i],oldEl=currentChildren[i];
        if(newEl.dataset&&newEl.dataset.id===oldEl.dataset.id){
            oldEl.replaceWith(newEl);
            renderedElements.set(newEl.dataset.id,newEl);
        }else{
            oldEl.replaceWith(newEl);
            if(newEl.dataset&&newEl.dataset.id) renderedElements.set(newEl.dataset.id,newEl);
        }
    }

    const validIds=new Set(elementIds);
    for(const [id,el] of renderedElements){
        if(!validIds.has(id)) renderedElements.delete(id);
    }

    if(shouldAutoScroll&&settings.autoScroll){
        requestAnimationFrame(()=>{ messagesEl.scrollTop=messagesEl.scrollHeight; });
    }
}

   CREATE MESSAGE ELEMENT

function createMessageElement(message){
    const item=document.createElement("div");
    item.className="message";
    item.dataset.id='msg_'+message.id;

    const avatar=document.createElement("div");
    avatar.className="avatar";
    avatar.textContent=(message.username||"?").charAt(0).toUpperCase();

    const content=document.createElement("div");
    content.className="message-content";

    const top=document.createElement("div");
    top.className="message-top";

    const name=document.createElement("span");
    name.className="username";
    name.textContent=message.username||"User";
    top.appendChild(name);

    if(settings.showTimestamps){
        const time=document.createElement("span");
        time.className="time";
        time.textContent=formatTime(message.created_at);
        top.appendChild(time);
    }

    if(message.edited){
        const edited=document.createElement("span");
        edited.className="edited";
        edited.textContent="(edited)";
        top.appendChild(edited);
    }

    content.appendChild(top);

    if(message.message){
        const text=document.createElement("div");
        text.className="message-text";
        text.textContent=message.message;
        content.appendChild(text);
    }

    // Image
    if(message.image){
        const img=document.createElement("img");
        img.className="message-image";
        img.src=message.image;
        img.alt="Image";
        img.onclick=()=>{ window.open(message.image,'_blank'); };
        content.appendChild(img);
    }

    // File attachment
    if(message.file_name && message.file_data){
        const fileEl=document.createElement("a");
        fileEl.className="message-file";
        fileEl.href=message.file_data;
        fileEl.download=message.file_name;
        fileEl.target="_blank";
        fileEl.innerHTML=`
            <span class="file-icon">${getFileIcon(message.file_name)}</span>
            <span class="file-info">
                <span class="file-name">${escapeHtml(message.file_name)}</span>
                ${message.file_size ? `<span class="file-size">${formatFileSize(message.file_size)}</span>` : ''}
            </span>
            <span class="file-download">⬇</span>
        `;
        content.appendChild(fileEl);
    }

    // Voice message
    if(message.file_type==='voice' && message.file_data){
        const voiceEl=document.createElement("div");
        voiceEl.className="message-voice";
        voiceEl.dataset.audio=message.file_data;
        
        const playBtn=document.createElement("button");
        playBtn.className="voice-play-btn";
        playBtn.textContent="▶";
        
        const wave=document.createElement("div");
        wave.className="voice-wave";
        for(let i=0;i<20;i++){
            const bar=document.createElement("div");
            bar.className="bar";
            bar.style.height=(4+Math.random()*20)+"px";
            wave.appendChild(bar);
        }
        
        const duration=document.createElement("span");
        duration.className="voice-duration";
        duration.textContent="0:00";
        
        let audio=null;
        let playing=false;
        
        playBtn.onclick=()=>{
            if(!audio){
                audio=new Audio(message.file_data);
                audio.onloadedmetadata=()=>{
                    duration.textContent=formatDuration(audio.duration);
                };
                audio.onended=()=>{
                    playing=false;
                    playBtn.textContent="▶";
                    playBtn.classList.remove("playing");
                    wave.querySelectorAll('.bar').forEach(b=>b.classList.remove('active'));
                };
                audio.ontimeupdate=()=>{
                    const progress=audio.currentTime/audio.duration;
                    const bars=wave.querySelectorAll('.bar');
                    const activeCount=Math.floor(progress*bars.length);
                    bars.forEach((b,i)=>b.classList.toggle('active',i<activeCount));
                };
            }
            if(playing){
                audio.pause();
                playing=false;
                playBtn.textContent="▶";
                playBtn.classList.remove("playing");
            }else{
                audio.play();
                playing=true;
                playBtn.textContent="⏸";
                playBtn.classList.add("playing");
            }
        };
        
        voiceEl.appendChild(playBtn);
        voiceEl.appendChild(wave);
        voiceEl.appendChild(duration);
        content.appendChild(voiceEl);
    }

    item.appendChild(avatar);
    item.appendChild(content);
    return item;
}

function formatDuration(seconds){
    const mins=Math.floor(seconds/60);
    const secs=Math.floor(seconds%60);
    return mins+':'+String(secs).padStart(2,'0');
}

async function createGame(gameType){
    if(!settings.username){
        settingsBtn.click();
        showNotification("Set your name first!","⚠️");
        return;
    }
    const existing=games.find(g=>g.hostDeviceId===deviceId&&g.status!=="finished"&&g.status!=="forcequit");
    if(existing){
        showNotification("You're already hosting a game!","⚠️");
        gamesOverlay.classList.remove("show");
        return;
    }
    const info=GAME_TYPES[gameType];
    if(!info)return;

    const game={
        type:"game",
        id:"game_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8),
        gameType,
        name:info.name,
        icon:info.icon,
        host:settings.username,
        hostDeviceId:deviceId,
        status:"lobby",
        players:[{deviceId,username:settings.username}],
        maxPlayers:info.max,
        minPlayers:info.min,
        turnIndex:0,
        createdAt:Date.now(),
        board:[],
        winner:null,
        data:{settings:getDefaultSettings(gameType)}
    };
    if(info.size) game.data.settings.boardSize=info.size;

    try{
        await writeGameState(game);
        gamesOverlay.classList.remove("show");
        showNotification("Game created! Waiting for players...","🎮");
        await loadMessages();
    }catch(error){
        showNotification("Could not create game: "+error.message,"❌");
    }
}

function getDefaultSettings(gameType){

        ttt:{boardSize:3},
        connect4:{boardSize:"7x6"},
        memory:{gridSize:4},
        reaction:{rounds:1},
        boss:{bossHealth:100000000},
        coinflip:{targetScore:3},
        numberguess:{maxNumber:100},

        quickdraw:{rounds:3},

        turn.className="turn-banner";

        if(current) turn.innerHTML="Current turn: <strong>"+escapeHtml(current.username)+"</strong>";
        body.appendChild(turn);
    }

    const board=createGameBoard(game);
    if(board) body.appendChild(board);

    const actions=document.createElement("div");
    actions.className="game-actions";

    if(game.status==="lobby"){
        const joined=game.players.some(p=>p.deviceId===deviceId);
        if(!joined&&game.players.length<game.maxPlayers){
            const join=document.createElement("button");
            join.className="game-btn green";
            join.textContent="Join";
            join.onclick=async()=>await joinGame(game);
            actions.appendChild(join);
        }else if(joined){
            const leave=document.createElement("button");
            leave.className="game-btn";
            leave.textContent="Leave";
            leave.onclick=async()=>await leaveGame(game);
            actions.appendChild(leave);
        }
        if(game.hostDeviceId===deviceId){
            const start=document.createElement("button");
            start.className="game-btn primary";
            start.textContent="Start";
            start.disabled=game.players.length<(game.minPlayers||1);
            start.onclick=async()=>await startGame(game);
            actions.appendChild(start);
            const quit=document.createElement("button");
            quit.className="game-btn danger";
            quit.textContent="✕";
            quit.onclick=()=>openConfirm("Force quit?","Everyone will be removed.",()=>forceQuitGame(game));
            actions.appendChild(quit);
        }
    }else if(game.status==="playing"){
        const mine=game.players.some(p=>p.deviceId===deviceId);
        if(mine){
            const leave=document.createElement("button");
            leave.className="game-btn";
            leave.textContent="Leave";
            leave.onclick=async()=>await leaveGame(game);
            actions.appendChild(leave);
        }
        if(game.hostDeviceId===deviceId){
            const quit=document.createElement("button");
            quit.className="game-btn danger";
            quit.textContent="✕";
            quit.onclick=()=>openConfirm("Force quit?","Everyone will be removed.",()=>forceQuitGame(game));
            actions.appendChild(quit);
        }
    }

    body.appendChild(actions);
    card.appendChild(header);
    card.appendChild(body);
    wrapper.appendChild(card);
    return wrapper;
}

/* =====================================================
   TIC TAC TOE
===================================================== */

function createTTT(game){
    const size=game.data.settings?.boardSize||3;
    const total=size*size;
    if(!game.data.board||game.data.board.length!==total) game.data.board=Array(total).fill("");

    const board=document.createElement("div");
    board.className="ttt-board";
    board.style.gridTemplateColumns=`repeat(${size}, 1fr)`;
    board.style.maxWidth=Math.min(size*80,360)+"px";

    const mine=game.players.some(p=>p.deviceId===deviceId);
    const current=game.players[game.turnIndex%game.players.length];
    const myTurn=mine&&current&&current.deviceId===deviceId;
    const symbols=["❌","⭕","🔺"];
    const symbolClasses=["symbol-X","symbol-O","symbol-triangle"];

    for(let i=0;i<total;i++){
        const cell=document.createElement("button");
        cell.className="ttt-cell";
        const value=game.data.board[i];
        cell.textContent=value||"";
        if(value){const idx=symbols.indexOf(value);if(idx!==-1)cell.classList.add(symbolClasses[idx]);}
        cell.disabled=!myTurn||!!game.data.board[i]||!!game.winner;
        cell.onclick=async()=>{
            const copy=JSON.parse(JSON.stringify(game));
            const idx=copy.turnIndex%copy.players.length;
            const symbol=symbols[idx];
            copy.data.board[i]=symbol;
            if(checkTTTWin(copy.data.board,size,i,symbol)){
                copy.winner=current.username;
                copy.status="finished";
            }else if(copy.data.board.every(c=>c)){
                copy.winner="draw";
                copy.status="finished";
            }else{
                copy.turnIndex++;
            }
            await publishGameAndCleanup(game,copy);
        };
        board.appendChild(cell);
    }
    return board;
}

function checkTTTWin(board,size,pos,symbol){
    const row=Math.floor(pos/size),col=pos%size;
    const dirs=[[1,0],[0,1],[1,1],[1,-1]];
    for(const [dr,dc] of dirs){
        let count=1;
        for(const dir of[-1,1]){
            let r=row+dr*dir,c=col+dc*dir;
            while(r>=0&&r<size&&c>=0&&c<size&&board[r*size+c]===symbol){count++;r+=dr*dir;c+=dc*dir;}
        }
        if(count>=size) return true;
    }
    return false;
}


/* =====================================================
   CONNECT FOUR
===================================================== */

function createConnect4(game){
    const boardSize=game.data.settings?.boardSize||"7x6";
    const [cols,rows]=boardSize.split('x').map(Number);
    const total=cols*rows;
    if(!game.data.board||game.data.board.length!==total) game.data.board=Array(total).fill("");

    const board=document.createElement("div");
    board.className="connect-board";
    board.style.gridTemplateColumns=`repeat(${cols}, 1fr)`;
    board.style.maxWidth=Math.min(cols*48,400)+"px";

    const mine=game.players.some(p=>p.deviceId===deviceId);
    const current=game.players[game.turnIndex%game.players.length];
    const myTurn=mine&&current&&current.deviceId===deviceId;

    for(let row=0;row<rows;row++){
        for(let col=0;col<cols;col++){
            const index=row*cols+col;
            const cell=document.createElement("button");
            cell.className="connect-cell";
            if(game.data.board[index]==="red") cell.classList.add("red");
            if(game.data.board[index]==="yellow") cell.classList.add("yellow");
            if(game.data.board[index]) cell.classList.add("taken");
            cell.disabled=!myTurn||!!game.data.board[index];
            cell.onclick=async()=>{
                let placed=-1;
                for(let r=rows-1;r>=0;r--){
                    const idx=r*cols+col;
                    if(!game.data.board[idx]){placed=idx;break;}
                }
                if(placed===-1)return;
                const copy=JSON.parse(JSON.stringify(game));
                const color=copy.turnIndex%2===0?"red":"yellow";
                copy.data.board[placed]=color;
                if(checkConnectWin(copy.data.board,cols,rows,placed,color)){
                    copy.winner=current.username;
                    copy.status="finished";
                }else if(copy.data.board.every(c=>c)){
                    copy.winner="draw";
                    copy.status="finished";
                }else{
                    copy.turnIndex++;
                }
                await publishGameAndCleanup(game,copy);
            };
            board.appendChild(cell);
        }
    }
    return board;
}

function checkConnectWin(board,cols,rows,pos,color){
    const row=Math.floor(pos/cols),col=pos%cols;
    const dirs=[[1,0],[0,1],[1,1],[1,-1]];
    for(const [dr,dc] of dirs){
        let count=1;
        for(const dir of[-1,1]){
            let r=row+dr*dir,c=col+dc*dir;
            while(r>=0&&r<rows&&c>=0&&c<cols&&board[r*cols+c]===color){count++;r+=dr*dir;c+=dc*dir;}
        }
        if(count>=4)return true;
    }
    return false;
}


/* =====================================================
   MEMORY MATCH
===================================================== */

function createMemory(game){
    const area=document.createElement("div");
    const emojis=["🍎","🍊","🍋","🍇","🍉","🍓","🍑","🍒","🥝","🍍","🥭","🍌","🍈","🫐","🍐","🥥"];
    
    const gridSize=game.data.settings?.gridSize||4;
    const totalCards=gridSize*gridSize;
    const pairs=totalCards/2;
    const usedEmojis=emojis.slice(0,pairs);
    let cards=[...usedEmojis,...usedEmojis];
    
    if(!game.data.cards){
        for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}
        game.data.cards=cards;
        game.data.flipped=[];
        game.data.matched=[];
        game.data.scores={};
    }

    const grid=document.createElement("div");
    grid.className="memory-grid";
    grid.style.gridTemplateColumns=`repeat(${gridSize}, 1fr)`;
    grid.style.maxWidth=Math.min(gridSize*72,400)+"px";

    const mine=game.players.some(p=>p.deviceId===deviceId);
    const current=game.players[game.turnIndex%game.players.length];
    const myTurn=mine&&current&&current.deviceId===deviceId;

    const flipped=game.data.flipped||[];
    const matched=game.data.matched||[];

    for(let i=0;i<game.data.cards.length;i++){
        const card=document.createElement("div");
        card.className="memory-card";
        if(matched.includes(i)){
            card.classList.add("matched");
            card.textContent=game.data.cards[i];
        }else if(flipped.includes(i)){
            card.classList.add("flipped");
            card.textContent=game.data.cards[i];
        }
        if(!matched.includes(i)&&myTurn&&!flipped.includes(i)&&flipped.length<2){
            card.onclick=async()=>{
                const copy=JSON.parse(JSON.stringify(game));
                const flips=copy.data.flipped||[];
                if(flips.includes(i)||flips.length>=2)return;
                flips.push(i);
                copy.data.flipped=flips;
                if(flips.length===2){
                    const cardsData=copy.data.cards;
                    if(cardsData[flips[0]]===cardsData[flips[1]]){
                        copy.data.matched=(copy.data.matched||[]).concat(flips);
                        copy.data.flipped=[];
                        copy.data.scores=copy.data.scores||{};
                        copy.data.scores[current.deviceId]=(copy.data.scores[current.deviceId]||0)+1;
                        if(copy.data.matched.length===copy.data.cards.length){
                            let winner=null,max=-1;
                            for(const [id,score] of Object.entries(copy.data.scores)){
                                if(score>max){max=score;winner=copy.players.find(p=>p.deviceId===id)?.username;}
                            }
                            copy.winner=winner||"draw";
                            copy.status="finished";
                        }
                    }else{
                        copy.turnIndex++;
                        setTimeout(async()=>{
                            const resetCopy=JSON.parse(JSON.stringify(copy));
                            resetCopy.data.flipped=[];
                            await publishGameAndCleanup(game,resetCopy);
                        },800);
                        await publishGameAndCleanup(game,copy);
                        return;
                    }
                }
                await publishGameAndCleanup(game,copy);
            };
        }
        grid.appendChild(card);
    }
    area.appendChild(grid);

    const scoreDiv=document.createElement("div");
    scoreDiv.style.cssText="text-align:center;margin-top:8px;color:#9da5b0;font-size:13px;";
    const scores=game.data.scores||{};
    scoreDiv.textContent=game.players.map(p=>escapeHtml(p.username)+": "+(scores[p.deviceId]||0)).join(" · ");
    area.appendChild(scoreDiv);

    return area;
}


/* =====================================================
   REACTION TIME
===================================================== */

function createReaction(game){
    const area=document.createElement("div");
    area.style.textAlign="center";
    area.style.padding="10px";

    const mine=game.players.some(p=>p.deviceId===deviceId);
    const current=game.players[game.turnIndex%game.players.length];
    const myTurn=mine&&current&&current.deviceId===deviceId;

    const state=game.data.state||"waiting";
    const startTime=game.data.startTime||0;
    const results=game.data.results||{};

    const box=document.createElement("div");
    box.className="reaction-box "+state;

    if(state==="waiting"){
        box.textContent="⏳ Waiting for "+(myTurn?"you":current.username);
        if(myTurn){
            box.onclick=async()=>{
                const copy=JSON.parse(JSON.stringify(game));
                copy.data.state="ready";
                copy.data.startTime=Date.now()+1000+Math.random()*3000;
                await publishGameAndCleanup(game,copy);
            };
        }
    }else if(state==="ready"){
        const remaining=Math.max(0,(startTime-Date.now())/1000);
        box.textContent="🟢 Get ready... "+remaining.toFixed(1)+"s";
        if(remaining<0.5&&myTurn){
            setTimeout(async()=>{
                const copy=JSON.parse(JSON.stringify(game));
                copy.data.state="go";
                copy.data.goTime=Date.now();
                await publishGameAndCleanup(game,copy);
            },Math.max(0,startTime-Date.now()+100));
        }
    }else if(state==="go"){
        box.textContent="🟢 CLICK NOW!";
        if(myTurn){
            box.onclick=async()=>{
                const reactionTime=Date.now()-game.data.goTime;
                const copy=JSON.parse(JSON.stringify(game));
                copy.data.results=copy.data.results||{};
                copy.data.results[deviceId]=reactionTime;
                copy.turnIndex++;
                if(copy.turnIndex>=copy.players.length){
                    let winner=null,best=Infinity;
                    for(const [id,time] of Object.entries(copy.data.results)){
                        if(time<best){best=time;winner=copy.players.find(p=>p.deviceId===id)?.username;}
                    }
                    copy.winner=winner+" ("+best+"ms)";
                    copy.status="finished";
                }else{
                    copy.data.state="waiting";
                }
                await publishGameAndCleanup(game,copy);
            };
        }else{
            box.textContent="🟢 Waiting for "+current.username+"...";
        }
    }else if(state==="done"){
        box.textContent="✅ Done!";
        box.classList.add("done");
    }

    area.appendChild(box);

    if(Object.keys(results).length>0){
        const resultsDiv=document.createElement("div");
        resultsDiv.style.cssText="color:#9da5b0;margin-top:8px;font-size:13px;";
        const sorted=Object.entries(results).sort((a,b)=>a[1]-b[1]);
        resultsDiv.innerHTML=sorted.map(([id,time])=>{
            const name=game.players.find(p=>p.deviceId===id)?.username||"Unknown";
            return `<div>${escapeHtml(name)}: ${time}ms</div>`;
        }).join("");
        area.appendChild(resultsDiv);
    }

    return area;
}


/* =====================================================
   BOSS BATTLE
===================================================== */

function createBossBattle(game){
    const area=document.createElement("div");
    area.className="boss-area";

    const BOSS_MAX_HEALTH=game.data.settings?.bossHealth||100000000;

    if(!game.data.bossHealth){
        game.data.bossHealth=BOSS_MAX_HEALTH;
        game.data.maxHealth=BOSS_MAX_HEALTH;
        game.data.damage=1;
        game.data.upgrades={};
        game.data.totalDamageDealt={};
        game.data.bossDefeated=false;
        game.data.critChance=0;
        game.data.multiHit=1;
    }

    const health=game.data.bossHealth;
    const maxHealth=game.data.maxHealth;
    const damage=game.data.damage||1;
    const totalDamage=game.data.totalDamageDealt||{};
    const playerDamage=totalDamage[deviceId]||0;

    const monsterName=document.createElement("div");
    monsterName.className="boss-monster-name";
    const names=["Cthulhu","Mega Dragon","Shadow Lord","Void Beast","Demon King"];
    if(!game.data.monsterName) game.data.monsterName=names[Math.floor(Math.random()*names.length)];
    monsterName.textContent="👹 "+game.data.monsterName;
    area.appendChild(monsterName);

    const healthBar=document.createElement("div");
    healthBar.className="boss-health-bar";
    const healthFill=document.createElement("div");
    healthFill.className="boss-health-fill";
    const percent=Math.max(0,(health/maxHealth)*100);
    healthFill.style.width=percent+"%";
    healthBar.appendChild(healthFill);
    const healthText=document.createElement("div");
    healthText.className="boss-health-text";
    healthText.textContent=Math.floor(health).toLocaleString()+" / "+maxHealth.toLocaleString()+" HP";
    healthBar.appendChild(healthText);
    area.appendChild(healthBar);

    const stats=document.createElement("div");
    stats.className="boss-stats";
    stats.innerHTML=`
        <div>⚔️ Damage: <strong>${damage.toLocaleString()}</strong></div>
        <div>💪 Your damage: <strong>${playerDamage.toLocaleString()}</strong></div>
        <div>👥 Players: <strong>${game.players.length}</strong></div>
        <div>💥 Crit: <strong>${Math.round((game.data.critChance||0)*100)}%</strong></div>
        <div>🌀 Multi: <strong>${game.data.multiHit||1}x</strong></div>
    `;
    area.appendChild(stats);

    if(game.data.bossDefeated){
        const win=document.createElement("div");
        win.className="turn-banner";
        win.style.cssText="background:#1a3a2a;border-color:#2a6a4a;color:#7affb0;font-size:18px;padding:16px;";
        win.innerHTML="🎉 BOSS DEFEATED! 🎉<br><span style='font-size:13px;color:#9da5b0;'>The "+game.data.monsterName+" has been slain!</span>";
        area.appendChild(win);
        return area;
    }

    const attackBtn=document.createElement("button");
    attackBtn.className="boss-attack-btn";
    let displayDamage=damage;
    if(Math.random()<(game.data.critChance||0)) displayDamage=Math.floor(damage*2);
    const multiHits=game.data.multiHit||1;
    const totalDisplayDamage=displayDamage*multiHits;
    attackBtn.textContent="⚔️ ATTACK! ("+totalDisplayDamage.toLocaleString()+" dmg)";
    attackBtn.onclick=async()=>{
        const copy=JSON.parse(JSON.stringify(game));
        let dmg=copy.data.damage||1;
        let crit=1;
        if(Math.random()<(copy.data.critChance||0)) crit=2;
        const multi=copy.data.multiHit||1;
        const totalDmg=Math.floor(dmg*crit*multi);
        copy.data.bossHealth=Math.max(0,copy.data.bossHealth-totalDmg);
        copy.data.totalDamageDealt=copy.data.totalDamageDealt||{};
        copy.data.totalDamageDealt[deviceId]=(copy.data.totalDamageDealt[deviceId]||0)+totalDmg;
        if(copy.data.bossHealth<=0){
            copy.data.bossDefeated=true;
            copy.data.bossHealth=0;
            let mvp=null,maxDmg=-1;
            for(const [id,d] of Object.entries(copy.data.totalDamageDealt)){
                if(d>maxDmg){maxDmg=d;mvp=copy.players.find(p=>p.deviceId===id)?.username;}
            }
            copy.winner="🏆 MVP: "+(mvp||"Everyone!")+" 🏆";
            copy.status="finished";
        }
        if(Math.random()<0.15&&!copy.data.bossDefeated){
            copy.data.upgrades=copy.data.upgrades||{};
            copy.data.upgrades[deviceId]=(copy.data.upgrades[deviceId]||0)+1;
        }
        await publishGameAndCleanup(game,copy);
    };
    area.appendChild(attackBtn);

    const dmgDisplay=document.createElement("div");
    dmgDisplay.className="boss-damage-display";
    dmgDisplay.textContent="⚔️ "+damage.toLocaleString()+" base damage";
    area.appendChild(dmgDisplay);

    const upgradesDiv=document.createElement("div");
    upgradesDiv.className="boss-upgrades";
    const upgradeCosts={damage:5,crit:10,multi:20};
    const upgradePoints=game.data.upgrades[deviceId]||0;
    const upgradeInfo=document.createElement("div");
    upgradeInfo.style.cssText="width:100%;text-align:center;color:#9da5b0;font-size:11px;margin-bottom:4px;";
    upgradeInfo.textContent="🔧 Upgrade points: "+upgradePoints;
    upgradesDiv.appendChild(upgradeInfo);

    const dmgUpgrade=document.createElement("button");
    dmgUpgrade.className="boss-upgrade-btn";
    dmgUpgrade.innerHTML=`⚔️ +20% Damage <span class="cost">(${upgradeCosts.damage} pts)</span>`;
    dmgUpgrade.disabled=upgradePoints<upgradeCosts.damage;
    dmgUpgrade.onclick=async()=>{
        const copy=JSON.parse(JSON.stringify(game));
        copy.data.upgrades[deviceId]=(copy.data.upgrades[deviceId]||0)-upgradeCosts.damage;
        copy.data.damage=Math.floor((copy.data.damage||1)*1.2);
        await publishGameAndCleanup(game,copy);
    };
    upgradesDiv.appendChild(dmgUpgrade);

    const critUpgrade=document.createElement("button");
    critUpgrade.className="boss-upgrade-btn";
    critUpgrade.innerHTML=`💥 +10% Crit <span class="cost">(${upgradeCosts.crit} pts)</span>`;
    critUpgrade.disabled=upgradePoints<upgradeCosts.crit;
    critUpgrade.onclick=async()=>{
        const copy=JSON.parse(JSON.stringify(game));
        copy.data.upgrades[deviceId]=(copy.data.upgrades[deviceId]||0)-upgradeCosts.crit;
        copy.data.critChance=Math.min(1,(copy.data.critChance||0)+0.1);
        await publishGameAndCleanup(game,copy);
    };
    upgradesDiv.appendChild(critUpgrade);

    const multiUpgrade=document.createElement("button");
    multiUpgrade.className="boss-upgrade-btn";
    multiUpgrade.innerHTML=`🌀 +1 Multi-hit <span class="cost">(${upgradeCosts.multi} pts)</span>`;
    multiUpgrade.disabled=upgradePoints<upgradeCosts.multi;
    multiUpgrade.onclick=async()=>{
        const copy=JSON.parse(JSON.stringify(game));
        copy.data.upgrades[deviceId]=(copy.data.upgrades[deviceId]||0)-upgradeCosts.multi;
        copy.data.multiHit=(copy.data.multiHit||1)+1;
        await publishGameAndCleanup(game,copy);
    };
    upgradesDiv.appendChild(multiUpgrade);

    area.appendChild(upgradesDiv);
    return area;
}


/* =====================================================
   COIN FLIP
===================================================== */

function createCoinFlip(game){
    const area=document.createElement("div");
    area.className="coin-area";

    const mine=game.players.some(p=>p.deviceId===deviceId);
    const current=game.players[game.turnIndex%game.players.length];
    const myTurn=mine&&current&&current.deviceId===deviceId;

    const targetScore=game.data.settings?.targetScore||3;
    const scores=game.data.scores||{};
    const state=game.data.state||"waiting";
    const coinResult=game.data.coinResult||null;

    if(!game.data.choices) game.data.choices={};

    const scoreDiv=document.createElement("div");
    scoreDiv.style.cssText="color:#9da5b0;margin-bottom:8px;font-size:14px;";
    scoreDiv.textContent=game.players.map(p=>escapeHtml(p.username)+": "+(scores[p.deviceId]||0)+"/"+targetScore).join(" | ");
    area.appendChild(scoreDiv);

    const coinDisplay=document.createElement("div");
    coinDisplay.className="coin-display";
    if(coinResult==="heads") coinDisplay.textContent="🪙 Heads";
    else if(coinResult==="tails") coinDisplay.textContent="🪙 Tails";
    else coinDisplay.textContent="🪙";
    area.appendChild(coinDisplay);

    if(game.winner){
        const win=document.createElement("div");
        win.className="turn-banner";
        win.textContent="🏆 "+game.winner+" wins!";
        area.appendChild(win);
        return area;
    }

    if(!myTurn){
        const waiting=document.createElement("div");
        waiting.className="turn-banner";
        waiting.textContent="Waiting for "+current.username+"...";
        area.appendChild(waiting);
        return area;
    }

    const choiceDiv=document.createElement("div");
    choiceDiv.className="coin-buttons";
    ["heads","tails"].forEach(choice=>{
        const btn=document.createElement("button");
        btn.className="coin-btn";
        if(game.data.choices[deviceId]===choice) btn.classList.add("selected");
        btn.textContent=choice==="heads"?"🪙 Heads":"🪙 Tails";
        btn.disabled=state==="flipping";
        btn.onclick=async()=>{
            const copy=JSON.parse(JSON.stringify(game));
            copy.data.choices[deviceId]=choice;
            const allChosen=copy.players.every(p=>copy.data.choices[p.deviceId]);
            if(allChosen&&copy.data.state!=="flipping"){
                copy.data.state="flipping";
                const result=Math.random()<0.5?"heads":"tails";
                copy.data.coinResult=result;
                for(const player of copy.players){
                    if(copy.data.choices[player.deviceId]===result){
                        copy.data.scores[player.deviceId]=(copy.data.scores[player.deviceId]||0)+1;
                    }
                }
                let winner=null;
                for(const player of copy.players){
                    if((copy.data.scores[player.deviceId]||0)>=targetScore){winner=player.username;break;}
                }
                if(winner){copy.winner=winner;copy.status="finished";}
                else{copy.data.choices={};copy.data.coinResult=null;copy.data.state="waiting";copy.turnIndex++;}
            }
            await publishGameAndCleanup(game,copy);
        };
        choiceDiv.appendChild(btn);
    });
    area.appendChild(choiceDiv);

    if(game.hostDeviceId===deviceId&&state!=="flipping"){
        const flipBtn=document.createElement("button");
        flipBtn.className="game-btn primary";
        flipBtn.textContent="🪙 Flip Coin";
        flipBtn.onclick=async()=>{
            const copy=JSON.parse(JSON.stringify(game));
            const result=Math.random()<0.5?"heads":"tails";
            copy.data.coinResult=result;
            copy.data.state="flipping";
            for(const player of copy.players){
                if(copy.data.choices[player.deviceId]===result){
                    copy.data.scores[player.deviceId]=(copy.data.scores[player.deviceId]||0)+1;
                }
            }
            let winner=null;
            for(const player of copy.players){
                if((copy.data.scores[player.deviceId]||0)>=targetScore){winner=player.username;break;}
            }
            if(winner){copy.winner=winner;copy.status="finished";}
            else{copy.data.choices={};copy.data.coinResult=null;copy.data.state="waiting";copy.turnIndex++;}
            await publishGameAndCleanup(game,copy);
        };
        area.appendChild(flipBtn);
    }

    return area;
}
