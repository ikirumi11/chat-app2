<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chat & Mini Games</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#0b0d10;
    --panel:#12161b;
    --panel2:#181d23;
    --input:#0e1216;
    --border:#272e36;
    --text:#f1f3f5;
    --muted:#8d98a5;
    --accent:#5b8cff;
    --accent2:#3d6fe8;
    --danger:#ef5350;
    --success:#45c47a;
    --shadow:0 15px 40px rgba(0,0,0,.35);
}

body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    overflow:hidden;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* ================= HEADER ================= */

.header{
    height:64px;
    min-height:64px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 14px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    z-index:10;
}

.logo{
    font-size:18px;
    font-weight:800;
    white-space:nowrap;
}

.channel{
    display:flex;
    align-items:center;
    gap:7px;
    color:var(--muted);
    font-size:14px;
}

.header-spacer{
    flex:1;
}

.icon-btn,
.header-btn{
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    border-radius:10px;
    height:40px;
    padding:0 12px;
    transition:.15s;
}

.icon-btn{
    width:40px;
    padding:0;
    display:grid;
    place-items:center;
    font-size:18px;
}

.icon-btn:hover,
.header-btn:hover{
    background:var(--border);
}

/* ================= MAIN ================= */

.main{
    flex:1;
    min-height:0;
    display:flex;
}

.sidebar{
    width:270px;
    min-width:270px;
    background:var(--panel);
    border-right:1px solid var(--border);
    padding:14px;
    overflow:auto;
}

.sidebar-title{
    color:var(--muted);
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px;
    margin:8px 8px 10px;
}

.user-card{
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px;
    margin-bottom:20px;
}

.user-name{
    font-weight:700;
    margin-bottom:3px;
}

.user-id{
    color:var(--muted);
    font-size:11px;
    overflow:hidden;
    text-overflow:ellipsis;
}

.side-button{
    width:100%;
    border:0;
    background:transparent;
    color:var(--muted);
    text-align:left;
    padding:11px;
    border-radius:9px;
    margin-bottom:4px;
}

.side-button:hover,
.side-button.active{
    background:var(--panel2);
    color:var(--text);
}

.games-section{
    margin-top:25px;
}

.game-card{
    width:100%;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    padding:12px;
    border-radius:11px;
    text-align:left;
    margin-bottom:8px;
}

.game-card:hover{
    border-color:var(--accent);
}

.game-card strong{
    display:block;
    margin-bottom:3px;
}

.game-card small{
    color:var(--muted);
}

/* ================= CHAT ================= */

.chat{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

.messages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:18px max(16px,calc((100% - 900px)/2));
    scroll-behavior:smooth;
}

.message{
    display:flex;
    gap:10px;
    margin-bottom:15px;
    max-width:900px;
}

.avatar{
    width:38px;
    height:38px;
    min-width:38px;
    border-radius:50%;
    background:var(--accent);
    display:grid;
    place-items:center;
    font-weight:800;
    color:white;
}

.message-body{
    min-width:0;
    flex:1;
}

.message-top{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:3px;
}

.username{
    font-size:14px;
    font-weight:800;
}

.time{
    color:var(--muted);
    font-size:11px;
}

.edited{
    color:var(--muted);
    font-size:10px;
}

.message-text{
    color:var(--text);
    white-space:pre-wrap;
    word-break:break-word;
    line-height:1.45;
}

.message-image{
    display:block;
    max-width:min(500px,100%);
    max-height:500px;
    border-radius:12px;
    margin-top:8px;
    border:1px solid var(--border);
    object-fit:contain;
    background:#000;
}

.message-actions{
    display:none;
    gap:5px;
    margin-top:5px;
}

.message:hover .message-actions{
    display:flex;
}

.small-btn{
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--muted);
    border-radius:7px;
    padding:4px 7px;
    font-size:11px;
}

.small-btn:hover{
    color:var(--text);
}

/* ================= COMPOSER ================= */

.composer{
    padding:10px 14px max(10px,env(safe-area-inset-bottom));
    border-top:1px solid var(--border);
    background:var(--panel);
}

.composer-inner{
    max-width:900px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:8px;
}

.message-input{
    flex:1;
    min-height:44px;
    max-height:150px;
    resize:none;
    border:1px solid var(--border);
    background:var(--input);
    color:var(--text);
    border-radius:12px;
    padding:12px;
    outline:none;
}

.message-input:focus{
    border-color:var(--accent);
}

.attach-btn,
.send-btn{
    height:44px;
    border-radius:11px;
    border:1px solid var(--border);
    padding:0 14px;
}

.attach-btn{
    background:var(--panel2);
    color:var(--text);
}

.send-btn{
    background:var(--accent);
    color:white;
    border-color:var(--accent);
    font-weight:700;
}

.send-btn:hover{
    background:var(--accent2);
}

#imageInput{
    display:none;
}

.image-preview{
    max-width:120px;
    max-height:80px;
    border-radius:8px;
    display:none;
    margin:0 0 8px auto;
}

/* ================= MODALS ================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(7px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:15px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(600px,100%);
    max-height:90vh;
    overflow:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:20px;
}

.modal-title{
    font-size:20px;
    font-weight:800;
    margin-bottom:18px;
}

.modal-close{
    float:right;
    border:0;
    background:transparent;
    color:var(--muted);
    font-size:22px;
}

.form-label{
    color:var(--muted);
    font-size:12px;
    margin-bottom:6px;
    display:block;
}

.form-input,
.form-select{
    width:100%;
    background:var(--input);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:9px;
    padding:10px;
    outline:none;
    margin-bottom:14px;
}

.primary{
    width:100%;
    padding:11px;
    border:0;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    font-weight:800;
}

.danger{
    background:var(--danger);
}

.setting-row{
    padding:13px 0;
    border-bottom:1px solid var(--border);
}

.theme-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.theme-button{
    padding:11px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    border-radius:9px;
    text-align:left;
}

.theme-button.active{
    border-color:var(--accent);
}

/* ================= GAME ================= */

.game-lobby{
    text-align:center;
}

.game-status{
    color:var(--muted);
    margin-bottom:18px;
}

.player-list{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.player-pill{
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:20px;
    padding:8px 12px;
}

.ttt{
    display:grid;
    grid-template-columns:repeat(3,90px);
    gap:7px;
    justify-content:center;
    margin:20px auto;
}

.cell{
    width:90px;
    height:90px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    border-radius:10px;
    font-size:35px;
    font-weight:900;
}

.cell:hover:not(:disabled){
    border-color:var(--accent);
}

.cell:disabled{
    cursor:default;
    opacity:.9;
}

.game-buttons{
    display:flex;
    gap:8px;
}

.game-buttons button{
    flex:1;
}

/* ================= TOAST ================= */

.toast-container{
    position:fixed;
    right:15px;
    bottom:75px;
    z-index:300;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.toast{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    box-shadow:var(--shadow);
    padding:12px 15px;
    min-width:220px;
    animation:toastIn .2s ease;
}

@keyframes toastIn{
    from{
        transform:translateY(10px);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    .header{
        height:58px;
        min-height:58px;
    }

    .logo{
        font-size:15px;
    }

    .channel{
        display:none;
    }

    .sidebar{
        display:none;
    }

    .messages{
        padding:14px 10px;
    }

    .message-image{
        max-width:100%;
    }

    .message-actions{
        display:flex;
    }

    .composer{
        padding-left:8px;
        padding-right:8px;
    }

    .attach-btn{
        width:44px;
        padding:0;
        font-size:0;
    }

    .attach-btn::after{
        content:"📎";
        font-size:18px;
    }

    .send-btn{
        width:55px;
        padding:0;
    }

    .ttt{
        grid-template-columns:repeat(3,76px);
    }

    .cell{
        width:76px;
        height:76px;
        font-size:30px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">
    <div class="logo">Chat</div>
    <div class="channel"># <span id="channelName">general</span></div>

    <div class="header-spacer"></div>

    <button class="icon-btn" id="gamesBtn" title="Games">🎮</button>
    <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
</header>

<main class="main">

<aside class="sidebar">

    <div class="sidebar-title">Account</div>

    <div class="user-card">
        <div class="user-name" id="sideUsername">Guest</div>
        <div class="user-id" id="deviceDisplay"></div>
    </div>

    <div class="sidebar-title">Chat</div>

    <button class="side-button active">
        💬 #general
    </button>

    <div class="games-section">

        <div class="sidebar-title">Mini Games</div>

        <button class="game-card" id="sideTtt">
            <strong>⭕ 3 Player Tic-Tac-Toe</strong>
            <small>Play with three players</small>
        </button>

    </div>

</aside>

<section class="chat">

    <div class="messages" id="messages"></div>

    <div class="composer">

        <img id="imagePreview" class="image-preview">

        <div class="composer-inner">

            <input
                type="file"
                id="imageInput"
                accept="image/png,image/jpeg,image/webp,image/gif"
            >

            <button class="attach-btn" id="attachBtn">
                📎
            </button>

            <textarea
                id="messageInput"
                class="message-input"
                placeholder="Type a message..."
                rows="1"
                maxlength="20000"
            ></textarea>

            <button class="send-btn" id="sendBtn">
                Send
            </button>

        </div>

    </div>

</section>

</main>
</div>


<!-- SETTINGS -->

<div class="modal" id="settingsModal">
<div class="modal-box">

<button class="modal-close" data-close="settingsModal">×</button>

<div class="modal-title">Settings</div>

<div class="setting-row">
    <label class="form-label">Username</label>

    <input
        class="form-input"
        id="usernameInput"
        maxlength="24"
        placeholder="Username"
    >

    <button class="primary" id="saveUsername">
        Save Username
    </button>
</div>

<div class="setting-row">

    <label class="form-label">Theme</label>

    <div class="theme-grid" id="themeGrid">

        <button class="theme-button" data-theme="dark">Dark</button>
        <button class="theme-button" data-theme="midnight">Midnight</button>
        <button class="theme-button" data-theme="slate">Slate</button>
        <button class="theme-button" data-theme="forest">Forest</button>
        <button class="theme-button" data-theme="purple">Purple</button>
        <button class="theme-button" data-theme="red">Red</button>
        <button class="theme-button" data-theme="blue">Blue</button>
        <button class="theme-button" data-theme="light">Light</button>
        <button class="theme-button" data-theme="oled">OLED</button>
        <button class="theme-button" data-theme="classic">Classic</button>

    </div>

</div>

<div class="setting-row">

    <button class="primary danger" id="clearLocal">
        Reset Local Settings
    </button>

</div>

</div>
</div>


<!-- GAMES -->

<div class="modal" id="gamesModal">
<div class="modal-box">

<button class="modal-close" data-close="gamesModal">×</button>

<div class="modal-title">Mini Games</div>

<button class="game-card" id="openTtt">
    <strong>⭕ 3 Player Tic-Tac-Toe</strong>
    <small>Three players take turns on one board.</small>
</button>

</div>
</div>


<!-- TTT -->

<div class="modal" id="tttModal">
<div class="modal-box">

<button class="modal-close" data-close="tttModal">×</button>

<div class="modal-title">3 Player Tic-Tac-Toe</div>

<div class="game-lobby">

    <div class="game-status" id="tttStatus">
        Waiting for players...
    </div>

    <div class="player-list" id="playerList"></div>

    <div class="ttt" id="tttBoard"></div>

    <div class="game-buttons">

        <button class="primary" id="tttStart">
            Start Game
        </button>

        <button class="primary danger" id="tttStop">
            Force Stop
        </button>

    </div>

</div>

</div>
</div>


<div class="toast-container" id="toastContainer"></div>


<script>
/* ============================================================
   CONFIG
============================================================ */

/*
 * If this HTML is hosted on the SAME Vercel project:
 *
 *     /api/messages
 *
 * is correct.
 *
 * If your API is deployed elsewhere, replace this with:
 *
 *     https://your-project.vercel.app/api/messages
 */
const API_URL = "/api/messages";

const CHANNEL = "general";

const MAX_IMAGE_SIZE = 1500;

const POLL_INTERVAL = 1200;

const GAME_SERVER_USERNAME = "__GAME_SERVER__";


/* ============================================================
   LOCAL STATE
============================================================ */

let username =
    localStorage.getItem("chat_username") ||
    "Guest";

let deviceId =
    localStorage.getItem("chat_device_id");

if(!deviceId){

    deviceId =
        crypto.randomUUID
        ? crypto.randomUUID()
        : "device-" +
          Date.now() +
          "-" +
          Math.random()
              .toString(36)
              .slice(2);

    localStorage.setItem(
        "chat_device_id",
        deviceId
    );
}

let messages = new Map();

let selectedImage = null;

let polling = false;

let firstLoad = true;

let game = null;


/* ============================================================
   ELEMENTS
============================================================ */

const messagesEl =
    document.getElementById("messages");

const input =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const imageInput =
    document.getElementById("imageInput");

const imagePreview =
    document.getElementById("imagePreview");

const settingsModal =
    document.getElementById("settingsModal");

const gamesModal =
    document.getElementById("gamesModal");

const tttModal =
    document.getElementById("tttModal");

const usernameInput =
    document.getElementById("usernameInput");

const sideUsername =
    document.getElementById("sideUsername");

const deviceDisplay =
    document.getElementById("deviceDisplay");

const tttStatus =
    document.getElementById("tttStatus");

const playerList =
    document.getElementById("playerList");

const tttBoard =
    document.getElementById("tttBoard");

const tttStart =
    document.getElementById("tttStart");

const tttStop =
    document.getElementById("tttStop");


/* ============================================================
   INITIAL UI
============================================================ */

document.getElementById("channelName").textContent =
    CHANNEL;

usernameInput.value =
    username;

sideUsername.textContent =
    username;

deviceDisplay.textContent =
    deviceId;


/* ============================================================
   THEMES
============================================================ */

const themes = {

    dark:{
        bg:"#0b0d10",
        panel:"#12161b",
        panel2:"#181d23",
        input:"#0e1216",
        border:"#272e36",
        text:"#f1f3f5",
        muted:"#8d98a5",
        accent:"#5b8cff",
        accent2:"#3d6fe8"
    },

    midnight:{
        bg:"#070b18",
        panel:"#0d1425",
        panel2:"#121c32",
        input:"#080f1e",
        border:"#23304b",
        text:"#edf3ff",
        muted:"#8291ac",
        accent:"#6b8cff",
        accent2:"#4b70df"
    },

    slate:{
        bg:"#101416",
        panel:"#181d20",
        panel2:"#20272b",
        input:"#121719",
        border:"#303a3f",
        text:"#e9edef",
        muted:"#8f9ba0",
        accent:"#7d9aa7",
        accent2:"#637f8d"
    },

    forest:{
        bg:"#08100c",
        panel:"#0e1913",
        panel2:"#15231a",
        input:"#0b130e",
        border:"#26392c",
        text:"#eef8f1",
        muted:"#8fa697",
        accent:"#55c77d",
        accent2:"#3ba565"
    },

    purple:{
        bg:"#100b17",
        panel:"#171020",
        panel2:"#21152c",
        input:"#120c18",
        border:"#392643",
        text:"#f7effb",
        muted:"#a594ac",
        accent:"#a66cff",
        accent2:"#8751d8"
    },

    red:{
        bg:"#130a0a",
        panel:"#1d1010",
        panel2:"#281616",
        input:"#160b0b",
        border:"#412424",
        text:"#fff0f0",
        muted:"#ad9292",
        accent:"#ed5c5c",
        accent2:"#c84444"
    },

    blue:{
        bg:"#071018",
        panel:"#0c1923",
        panel2:"#112432",
        input:"#09141c",
        border:"#1d3a4d",
        text:"#eef9ff",
        muted:"#87a3b2",
        accent:"#4da8e8",
        accent2:"#3288c5"
    },

    light:{
        bg:"#eef1f4",
        panel:"#ffffff",
        panel2:"#f4f5f7",
        input:"#ffffff",
        border:"#d8dde3",
        text:"#15181c",
        muted:"#69727c",
        accent:"#356fe8",
        accent2:"#285cc7"
    },

    oled:{
        bg:"#000000",
        panel:"#050505",
        panel2:"#0a0a0a",
        input:"#000000",
        border:"#1c1c1c",
        text:"#ffffff",
        muted:"#858585",
        accent:"#ffffff",
        accent2:"#cccccc"
    },

    classic:{
        bg:"#171513",
        panel:"#211e1a",
        panel2:"#2a2722",
        input:"#181613",
        border:"#474139",
        text:"#eee7dc",
        muted:"#a69d90",
        accent:"#c59a5a",
        accent2:"#a77b42"
    }

};


function applyTheme(name){

    const theme =
        themes[name] ||
        themes.dark;

    const root =
        document.documentElement;

    for(const key in theme){

        root.style.setProperty(
            "--" + key,
            theme[key]
        );
    }

    localStorage.setItem(
        "chat_theme",
        name
    );

    document
        .querySelectorAll(".theme-button")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.theme === name
            );
        });
}


applyTheme(
    localStorage.getItem("chat_theme") ||
    "dark"
);


/* ============================================================
   MODALS
============================================================ */

function openModal(modal){

    modal.classList.add("show");
}

function closeModal(modal){

    modal.classList.remove("show");
}

document
    .querySelectorAll("[data-close]")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                const modal =
                    document.getElementById(
                        button.dataset.close
                    );

                closeModal(modal);
            }
        );
    });

document
    .getElementById("settingsBtn")
    .onclick = () =>
        openModal(settingsModal);

document
    .getElementById("gamesBtn")
    .onclick = () =>
        openModal(gamesModal);

document
    .getElementById("sideTtt")
    .onclick = () => {

        closeModal(gamesModal);
        openTicTacToe();
    };

document
    .getElementById("openTtt")
    .onclick = () => {

        closeModal(gamesModal);
        openTicTacToe();
    };


/* ============================================================
   USERNAME
============================================================ */

============================================================ */

function showToast(text){

    const toast =
        document.createElement("div");

    toast.className =
        "toast";

    toast.textContent =
        text;

    document
        .getElementById("toastContainer")
        .appendChild(toast);

/* ============================================================
   NOTIFICATIONS
============================================================ */

async function requestNotifications(){

    if(
        "Notification" in window &&
        Notification.permission === "default"
    ){

        try{

            await Notification.requestPermission();

        }catch{}

    }
}


function notifyMessage(message){

    if(
        !("Notification" in window) ||
        Notification.permission !== "granted"
    ){

        return;
    }

    if(
        message.username === username ||
        message.username === GAME_SERVER_USERNAME
    ){

        return;
    }

    new Notification(
        message.username || "New message",
        {
            body:
                message.message ||
                "Sent an image"
        }
    );
}


/* ============================================================
   FETCH API
============================================================ */

async function api(
    method,
    body = null
){

    const options = {
        method,
        headers:{
            "Content-Type":
                "application/json"
        }
    };

    if(body){

        options.body =
            JSON.stringify(body);
    }

    const response =
        await fetch(
            API_URL +
            "?channel=" +
            encodeURIComponent(CHANNEL),
            options
        );

    const text =
        await response.text();

    let data = {};

    try{
        data =
            text
                ? JSON.parse(text)
                : {};
    }
    catch{
        data = {
            error:text
        };
    }

    if(!response.ok){

        throw new Error(
            data.error ||
            "API request failed"
        );
    }

    return data;
}


/* ============================================================
   LOAD / SYNC MESSAGES
============================================================ */

async function syncMessages(){

    if(polling){
        return;
    }

    polling = true;

    try{

        const data =
            await api("GET");

        const incoming =
            Array.isArray(data.messages)
                ? data.messages
                : [];

        const oldIds =
            new Set(messages.keys());

        /*
         * Build the latest server state.
         *
         * This means:
         * - new messages are added
         * - edited messages are updated
         * - deleted messages disappear
         * - refresh doesn't duplicate messages
         */

        const next =
            new Map();

        for(const message of incoming){

            /*
             * Game server messages NEVER enter
             * the normal chat UI.
             */

            if(
                message.username ===
                GAME_SERVER_USERNAME
            ){

                processGameServerMessage(
                    message
                );

                continue;
            }

            next.set(
                String(message.id),
                message
            );

            if(
                !firstLoad &&
                !oldIds.has(
                    String(message.id)
                )
            ){

                notifyMessage(message);
            }
        }

        messages =
            next;

        renderMessages();

        firstLoad = false;

    }
    catch(error){

        console.error(
            "Message sync failed:",
            error
        );

    }
    finally{

        polling = false;
    }
}


/* ============================================================
   RENDER MESSAGES
============================================================ */

function renderMessages(){

    const wasNearBottom =
        messagesEl.scrollHeight -
        messagesEl.scrollTop -
        messagesEl.clientHeight <
        120;

    const fragment =
        document.createDocumentFragment();

    for(const message of messages.values()){

        fragment.appendChild(
            createMessageElement(message)
        );
    }

    messagesEl.replaceChildren(
        fragment
    );

    if(wasNearBottom){

        messagesEl.scrollTop =
            messagesEl.scrollHeight;
    }
}


function createMessageElement(message){

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message";

    wrapper.dataset.id =
        message.id;

    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar";

    avatar.textContent =
        (
            message.username ||
            "?"
        )
        .charAt(0)
        .toUpperCase();

    const body =
        document.createElement("div");

    body.className =
        "message-body";

    const top =
        document.createElement("div");

    top.className =
        "message-top";

    const name =
        document.createElement("span");

    name.className =
        "username";

    name.textContent =
        message.username ||
        "Unknown";

    const time =
        document.createElement("span");

    time.className =
        "time";

    time.textContent =
        formatTime(
            message.created_at
        );

    top.append(
        name,
        time
    );

    if(message.edited){

        const edited =
            document.createElement("span");

        edited.className =
            "edited";

        edited.textContent =
            "(edited)";

        top.appendChild(
            edited
        );
    }

    body.appendChild(top);

    if(message.message){

        const text =
            document.createElement("div");

        text.className =
            "message-text";

        text.textContent =
            message.message;

        body.appendChild(text);
    }

    if(message.image){

        const image =
            document.createElement("img");

        image.className =
            "message-image";

        image.src =
            message.image;

        image.loading =
            "lazy";

        image.alt =
            "Image";

        body.appendChild(image);
    }

    if(
        message.device_id ===
        deviceId
    ){

        const actions =
            document.createElement("div");

        actions.className =
            "message-actions";

        const edit =
            document.createElement("button");

        edit.className =
            "small-btn";

        edit.textContent =
            "Edit";

        edit.onclick =
            () => editMessage(message);

        const del =
            document.createElement("button");

        del.className =
            "small-btn";

        del.textContent =
            "Delete";

        del.onclick =
            () => deleteMessage(message);

        actions.append(
            edit,
            del
        );

        body.appendChild(
            actions
        );
    }

    wrapper.append(
        avatar,
        body
    );

    return wrapper;
}


function formatTime(date){

    if(!date){
        return "";
    }

    const d =
        new Date(date);

    return d.toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}

async function sendMessage(){

    const text =
        input.value
            .trim();

    if(!text && !selectedImage){

        return;
    }

    sendBtn.disabled =
        true;

    try{

        const data =
            await api(
                "POST",
                {
                    username,
                    channel:CHANNEL,
                    message:text,
                    image:selectedImage,
                    device_id:deviceId
                }

        if(data.message){

        input.style.height =
            "44px";

    }
    catch(error){

        showToast(
            error.message
        );

    }
    finally{

        sendBtn.disabled =
            false;

        input.focus();
    }
}

   IMAGE HANDLING
============================================================ */

document
    .getElementById("attachBtn")
    .onclick = () =>
        imageInput.click();


imageInput.onchange =
    async () => {

        const file =
            imageInput.files[0];

        if(!file){
            return;
        }

        try{

            selectedImage =
                await resizeImage(
                    file,
                    MAX_IMAGE_SIZE
                );

            imagePreview.src =
                selectedImage;

            imagePreview.style.display =
                "block";

            showToast(
                "Image ready to send."
            );

        }
        catch(error){

            selectedImage =
                null;

            showToast(
                "Could not process image."
            );
        }

        imageInput.value = "";
    };


function resizeImage(
    file,
    maxSize
){

    return new Promise(
        (resolve,reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () => {

                    const img =
                        new Image();

                    img.onload =
                        () => {

                            let width =
                                img.naturalWidth;

                            let height =
                                img.naturalHeight;

                            const scale =
                                Math.min(
                                    1,
                                    maxSize /
                                    Math.max(
                                        width,
                                        height
                                    )
                                );

                            width =
                                Math.round(
                                    width * scale
                                );

                            height =
                                Math.round(
                                    height * scale
                                );

                            const canvas =
                                document.createElement(
                                    "canvas"
                                );

                            canvas.width =
                                width;

                            canvas.height =
                                height;

                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );

                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );

                            /*
                             * JPEG keeps Base64 reasonably
                             * small for normal photos.
                             */

                            resolve(
                                canvas.toDataURL(
                                    "image/jpeg",
                                    .88
                                )
                            );
                        };

                    img.onerror =
                        reject;

                    img.src =
                        reader.result;
                };

            reader.onerror =
                reject;

            reader.readAsDataURL(file);
        }
    );
}

}

/* ============================================================
   3 PLAYER TIC-TAC-TOE
============================================================ */

/*
 * Game state:
 *
 * {
 *   type:"ttt3",
 *   status:"waiting" | "playing" | "finished",
 *   host:"device id",
 *   players:[
 *      {deviceId,name,symbol}
 *   ],
 *   board:["","","","","","","","",""],
 *   turn:0,
 *   winner:null
 * }
 *
 * Symbols:
 *
 * Player 1 = X
 * Player 2 = O
 * Player 3 = △
 */

const TTT_SYMBOLS =
    ["X","O","△"];

const TTT_WIN_LINES = [
    [0,1,2],
    [3,4,5],
    [6,7,8],
    [0,3,6],
    [1,4,7],
    [2,5,8],
    [0,4,8],
    [2,4,6]
];


function openTicTacToe(){

    openModal(
        tttModal
    );

    renderGame();

    if(game){

        joinGameIfPossible();
    }
}


/* ============================================================
   GAME SERVER MESSAGE
============================================================ */

function processGameServerMessage(message){

    let state;

    try{

        state =
            JSON.parse(
                message.message
            );

    }
    catch{

        return;
    }

    if(
        !state ||
        state.type !== "ttt3"
    ){

        return;
    }

    /*
     * A new server state replaces the previous
     * local state. It does NOT create a chat message.
     */

    game = {
        ...state,
        serverId:
            String(message.id),
        serverDeviceId:
            message.device_id,
        updatedAt:
            Date.now()
    };

    renderGame();
}


/* ============================================================
   FIND HOST
============================================================ */

function isHost(){

    return !!(
        game &&
        game.host === deviceId
    );
}


function getMyPlayerIndex(){

    if(!game){
        return -1;
    }

    return game.players.findIndex(
        player =>
            player.deviceId === deviceId
    );
}


/* ============================================================
   JOIN
============================================================ */

function joinGameIfPossible(){

    if(!game){
        return;
    }

    if(game.status !== "waiting"){
        return;
    }

    if(
        game.players.some(
            p =>
                p.deviceId === deviceId
        )
    ){

        renderGame();
        return;
    }

    if(game.players.length >= 3){

        showToast(
            "This game already has 3 players."
        );

        return;
    }

    /*
     * IMPORTANT:
     * Only the host writes the game state.
     * A player sends a join request using a
     * normal API message would expose it.
     *
     * Instead, for this simple chat API, the
     * player joins through the host's next
     * state update.
     *
     * We send a hidden request message.
     */

    sendGameJoinRequest();
}


async function sendGameJoinRequest(){

    try{

        await api(
            "POST",
            {
                username:
                    GAME_SERVER_USERNAME,

                channel:
                    CHANNEL,

                message:
                    JSON.stringify({
                        type:"ttt3_join",
                        player:{
                            deviceId,
                            name:username
                        }
                    }),

                device_id:
                    deviceId,

                game_server:true
            }
        );

    }
    catch(error){

        console.error(
            "Join request failed",
            error
        );
    }
}


/* ============================================================
   HOST PROCESSING JOIN REQUESTS
============================================================ */

let processedJoinIds =
    new Set();


async function hostProcessJoinRequests(){

    if(!isHost()){
        return;
    }

    /*
     * The current API's GET endpoint returns
     * game-server messages too, but syncMessages
     * doesn't expose them.
     *
     * Fetch directly here so the host can see
     * join requests.
     */

    try{

        const response =
            await fetch(
                API_URL +
                "?channel=" +
                encodeURIComponent(CHANNEL)
            );

        const data =
            await response.json();

        const all =
            Array.isArray(data.messages)
                ? data.messages
                : [];

        for(const message of all){

            if(
                message.username !==
                GAME_SERVER_USERNAME
            ){

                continue;
            }

            if(
                processedJoinIds.has(
                    String(message.id)
                )
            ){

                continue;
            }

            let request;

            try{

                request =
                    JSON.parse(
                        message.message
                    );

            }
            catch{

                continue;
            }

            if(
                request.type !==
                "ttt3_join"
            ){

                continue;
            }

            processedJoinIds.add(
                String(message.id)
            );

            if(
                game &&
                game.status === "waiting" &&
                game.players.length < 3
            ){

                const exists =
                    game.players.some(
                        p =>
                            p.deviceId ===
                            request.player.deviceId
                    );

                if(!exists){

                    game.players.push({
                        deviceId:
                            request.player.deviceId,

                        name:
                            request.player.name ||
                            "Player",

                        symbol:
                            TTT_SYMBOLS[
                                game.players.length
                            ]
                    });

                    await updateGameState();
                }
            }
        }

    }
    catch(error){

        console.error(
            "Join request polling failed",
            error
        );
    }
}


/* ============================================================
   CREATE GAME
============================================================ */

async function createGame(){

    if(game){

        showToast(
            "A game already exists."
        );

        return;
    }

    game = {

        type:"ttt3",

        status:"waiting",

        host:deviceId,

        hostName:username,

        players:[
            {
                deviceId,
                name:username,
                symbol:"X"
            }
        ],

        board:[
            "",
            "",
            "",
            "",
            "",
            "",
            "",
            "",
            ""
        ],

        turn:0,

        winner:null,

        createdAt:
            Date.now()
    };

    try{

        const data =
            await api(
                "POST",
                {
                    username:
                        GAME_SERVER_USERNAME,

                    channel:
                        CHANNEL,

                    message:
                        JSON.stringify(game),

                    device_id:
                        deviceId,

                    game_server:true
                }
            );

        if(data.game){

            game.serverId =
                String(data.game.id);
        }

        renderGame();

    }
    catch(error){

        game = null;

        showToast(
            error.message
        );
    }
}


/* ============================================================
   UPDATE GAME
============================================================ */

async function updateGameState(){

    if(!game){
        return;
    }

    if(!isHost()){
        return;
    }

    if(!game.serverId){

        return;
    }

    try{

        const data =
            await api(
                "PATCH",
                {
                    id:
                        String(
                            game.serverId
                        ),

                    device_id:
                        deviceId,

                    game_server:true,

                    game_state:
                        JSON.stringify(game)
                }
            );

        if(data.game){

            game.serverId =
                String(data.game.id);
        }

    }
    catch(error){

        console.error(
            "Game update failed",
            error
        );
    }
}


/* ============================================================
   START GAME
============================================================ */

tttStart.onclick =
    async () => {

        if(!game){

            await createGame();

            return;
        }

        if(!isHost()){

            showToast(
                "Only the host can start the game."
            );

            return;
        }

        if(game.players.length !== 3){

            showToast(
                "You need 3 players."
            );

            return;
        }

        if(game.status !== "waiting"){

            return;
        }

        game.status =
            "playing";

        game.turn =
            0;

        game.winner =
            null;

        await updateGameState();

        renderGame();
    };

/* ============================================================
   BOARD
============================================================ */

function renderBoard(){

    tttBoard.replaceChildren();

    if(!game){

        return;
    }

    game.board.forEach(
        (value,index) => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "cell";

            button.textContent =
                value;

            button.disabled =
                !!value ||
                game.status !== "playing" ||
                getMyPlayerIndex() !==
                    game.turn;

            button.onclick =
                () =>
                    playCell(index);

            tttBoard.appendChild(
                button
            );
        }
    );
}


/* ============================================================
   PLAY CELL
============================================================ */

async function playCell(index){

    if(!game){
        return;
    }

    if(game.status !== "playing"){
        return;
    }

    const myIndex =
        getMyPlayerIndex();

    if(myIndex < 0){

        showToast(
            "You are not in this game."
        );

        return;
    }

    if(game.turn !== myIndex){

        showToast(
            "It isn't your turn."
        );

        return;
    }

    if(game.board[index]){
        return;
    }

    /*
     * Only the host writes the authoritative
     * game state.
     *
     * A player sends a move request to the
     * host as a hidden game message.
     */

    if(!isHost()){

        try{

            await api(
                "POST",
                {
                    username:
                        GAME_SERVER_USERNAME,

                    channel:
                        CHANNEL,

                    message:
                        JSON.stringify({
                            type:"ttt3_move",
                            gameId:
                                game.serverId,
                            player:
                                deviceId,
                            cell:index
                        }),

                    device_id:
                        deviceId,

                    game_server:true
                }
            );

        }
        catch(error){

            showToast(
                error.message
            );
        }

        return;
    }

    applyMove(
        myIndex,
        index
    );
}


/* ============================================================
   APPLY MOVE
============================================================ */

async function applyMove(
    playerIndex,
    cellIndex
){

    if(
        !game ||
        game.status !== "playing" ||
        game.turn !== playerIndex ||
        game.board[cellIndex]
    ){

        return;
    }

    game.board[cellIndex] =
        game.players[
            playerIndex
        ].symbol;

    const winner =
        checkWinner(
            game.board
        );

    if(winner){

        game.status =
            "finished";

        game.winner =
            playerIndex;

    }
    else if(
        game.board.every(
            cell => !!cell
        )
    ){

        game.status =
            "finished";

        game.winner =
            "draw";

    }
    else{

        game.turn =
            (
                game.turn + 1
            ) %
            game.players.length;
    }

    await updateGameState();

    renderGame();

    if(
        game.status ===
        "finished"
    ){

        setTimeout(
            async () => {

                if(
                    game &&
                    game.status ===
                    "finished" &&
                    isHost()
                ){

                    await removeGame();
                }

            },
            3000
        );
    }
}


/* ============================================================
   WIN CHECK
============================================================ */

function checkWinner(board){

    for(
        const line
        of TTT_WIN_LINES
    ){

        const [
            a,
            b,
            c
        ] = line;

        if(
            board[a] &&
            board[a] === board[b] &&
            board[a] === board[c]
        ){

            return board[a];
        }
    }

    return null;
}


/* ============================================================
   RENDER GAME
============================================================ */

function renderGame(){

    if(!game){

        tttStatus.textContent =
            "No game running. Create one to become host.";

        playerList.replaceChildren();

        tttBoard.replaceChildren();

        tttStart.textContent =
            "Create Game";

        tttStop.disabled =
            true;

        return;
    }

    tttStop.disabled =
        !isHost();

    if(game.status === "waiting"){

        if(game.players.length < 3){

            tttStatus.textContent =
                "Waiting for " +
                (
                    3 -
                    game.players.length
                ) +
                " more player(s)...";

        }
        else{

            tttStatus.textContent =
                "3 players ready. Host can start.";
        }

    }
    else if(game.status === "playing"){

        const player =
            game.players[
                game.turn
            ];

        if(
            player &&
            player.deviceId === deviceId
        ){

            tttStatus.textContent =
                "Your turn — " +
                player.symbol;

        }
        else{

            tttStatus.textContent =
                (
                    player?.name ||
                    "Player"
                ) +
                "'s turn — " +
                (
                    player?.symbol ||
                    ""
                );
        }

    }
    else if(game.status === "finished"){

        if(game.winner === "draw"){

            tttStatus.textContent =
                "Draw! Game ending...";

        }
        else{

            const player =
                game.players[
                    game.winner
                ];

            tttStatus.textContent =
                (
                    player?.name ||
                    "Player"
                ) +
                " wins! Game ending...";
        }
    }

    playerList.replaceChildren();

    game.players.forEach(
        (player,index) => {

            const pill =
                document.createElement(
                    "div"
                );

            pill.className =
                "player-pill";

            pill.textContent =
                player.symbol +
                " " +
                player.name +
                (
                    player.deviceId ===
                    game.host
                        ? " 👑"
                        : ""
                );

            playerList.appendChild(
                pill
            );
        }
    );

    renderBoard();

    tttStart.textContent =
        game.status === "waiting"
            ? (
                isHost()
                    ? (
                        game.players.length === 3
                            ? "Start Game"
                            : "Waiting for Players"
                    )
                    : "Waiting for Host"
            )
            : "Game Started";
}


/* ============================================================
   REMOVE GAME
============================================================ */

async function removeGame(){

    if(
        !game ||
        !isHost() ||
        !game.serverId
    ){

        game = null;

        renderGame();

        return;
    }

    const oldId =
        game.serverId;

    try{

        await api(
            "DELETE",
            {
                id:
                    String(oldId),

                device_id:
                    deviceId,

                game_server:true
            }
        );

    }
    catch(error){

        console.error(
            "Could not remove game:",
            error
        );
    }

    game = null;

    renderGame();
}


/* ============================================================
   HOST MOVE REQUEST PROCESSING
============================================================ */

async function hostProcessMoves(){

    if(!isHost() || !game){
        return;
    }

    if(game.status !== "playing"){
        return;
    }

    try{

        const response =
            await fetch(
                API_URL +
                "?channel=" +
                encodeURIComponent(CHANNEL)
            );

        const data =
            await response.json();

        const all =
            Array.isArray(data.messages)
                ? data.messages
                : [];

        for(const message of all){

            if(
                message.username !==
                GAME_SERVER_USERNAME
            ){

                continue;
            }

            let request;

            try{

                request =
                    JSON.parse(
                        message.message
                    );

            }
            catch{

                continue;
            }

            if(
                request.type !==
                "ttt3_move"
            ){

                continue;
            }

            if(
                String(
                    request.gameId
                ) !==
                String(
                    game.serverId
                )
            ){

                continue;
            }

            if(
                processedJoinIds.has(
                    "move:" +
                    String(message.id)
                )
            ){

                continue;
            }

            processedJoinIds.add(
                "move:" +
                String(message.id)
            );

            const playerIndex =
                game.players.findIndex(
                    p =>
                        p.deviceId ===
                        request.player
                );

            if(playerIndex < 0){
                continue;
            }

            await applyMove(
                playerIndex,
                Number(request.cell)
            );
        }

    }
    catch(error){

        console.error(
            "Move polling failed:",
            error
        );
    }
}


/* ============================================================
   HOST GAME LOOP
============================================================ */

setInterval(
    async () => {

        if(!game || !isHost()){
            return;
        }

        await hostProcessJoinRequests();

        await hostProcessMoves();

    },
    1000
);


/* ============================================================
   HOST DISCONNECT CLEANUP
============================================================ */

/*
 * The browser cannot guarantee a request after
 * a hard crash/power loss.
 *
 * This heartbeat lets other clients recognize
 * a stale host and remove the game locally.
 */

let lastHostUpdate =
    Date.now();


function updateHostHeartbeat(){

    if(
        game &&
        isHost()
    ){

        lastHostUpdate =
            Date.now();
    }
}


setInterval(
    updateHostHeartbeat,
    3000
);


/*
 * If a game has not received an update for a
 * while, clients consider it stale.
 *
 * This also prevents a game remaining forever
 * if the host closes the browser.
 */

setInterval(
    () => {

        if(!game){
            return;
        }

        if(isHost()){
            return;
        }

        const age =
            Date.now() -
            (
                game.updatedAt ||
                Date.now()
            );

        if(age > 15000){

            game = null;

            renderGame();

            showToast(
                "Game ended because the host disconnected."
            );
        }

    },
    3000
);


/* ============================================================
   BEFORE UNLOAD
============================================================ */

window.addEventListener(
    "beforeunload",
    () => {

        /*
         * Best effort only.
         *
         * The API may not receive this request
         * during a hard browser close.
         */
        if(
            game &&
            isHost() &&
            game.serverId
        ){

            try{

                fetch(
                    API_URL,
                    {
                        method:"DELETE",
                        headers:{
                            "Content-Type":
                                "application/json"
                        },
                        body:
                            JSON.stringify({
                                id:
                                    String(
                                        game.serverId
                                    ),

                                device_id:
                                    deviceId,

                                game_server:true
                            }),

                        keepalive:true
                    }
                );

            }
            catch{}
        }
    }
);


/* ============================================================
   REQUEST NOTIFICATIONS ON FIRST INTERACTION
============================================================ */

document.addEventListener(
    "click",
    () => {

        requestNotifications();

    },
    {
        once:true
    }
);


/* ============================================================
   POLLING
============================================================ */

syncMessages();

setInterval(
    syncMessages,
    POLL_INTERVAL
);


/* ============================================================
   OPEN GAME IF SERVER GAME EXISTS
============================================================ */

setInterval(
    () => {

        if(game){

            renderGame();
        }

    },
    1500
);


/* ============================================================
   INITIAL GAME UI
============================================================ */

renderGame();

</script>
