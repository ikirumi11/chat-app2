<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat App 2</title>
<link rel="stylesheet" href="https://raw.githubusercontent.com/ikirumi11/chat-app2/main/style.css?v=2"><style>:root{--bg:#07080d;--panel:#0d1119;--panel2:#111722;--panel3:#171e2b;--line:#252d3b;--text:#f6f7fb;--muted:#8993a6;--accent:#7769ff;--accent2:#594be8;--good:#55d98c;--danger:#ff6678}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}button{border:0;color:#fff;cursor:pointer}input{outline:0;color:#fff}.hidden{display:none!important}
.app{width:100%;height:100dvh;display:flex;flex-direction:column;background:radial-gradient(900px 500px at 85% -10%,#28205b55,transparent 65%),linear-gradient(145deg,#090b11,#07080d 55%,#0b0e15)}
.top{height:72px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 22px;border-bottom:1px solid #ffffff0c;background:#0b0f16dd;backdrop-filter:blur(24px)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.logo{width:42px;height:42px;flex:none;border-radius:13px;display:grid;place-items:center;font-weight:900;font-size:18px;background:linear-gradient(145deg,#9187ff,#5546df);box-shadow:0 8px 30px #695cff38;border:1px solid #ffffff18}.title{font-size:15px;font-weight:800;letter-spacing:-.2px}.status{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);margin-top:3px}.status:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 12px #55d98c88}
.topActions{display:flex;align-items:center;gap:7px}.topActions button{height:36px;padding:0 12px;border-radius:10px;background:#141923;border:1px solid #ffffff0d;color:#cbd1dc;font-size:12px;transition:transform .16s,background .16s,border-color .16s,box-shadow .16s}.topActions button:hover{background:#1b2130;border-color:#ffffff18;transform:translateY(-1px)}.topActions button:first-child{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:#877dff;color:#fff;box-shadow:0 7px 22px #6659ff25}
.room{height:52px;flex:none;display:flex;align-items:center;gap:9px;padding:8px 22px;border-bottom:1px solid #ffffff08;background:#090c12aa}.room input{flex:1;min-width:0;height:36px;padding:0 12px;border:1px solid #ffffff0b;background:#0f141d;border-radius:10px;font-size:12px;color:#aeb6c5}.room button{height:36px;padding:0 13px;border-radius:10px;background:#151b26;border:1px solid #ffffff0d;color:#cbd1dc;font-size:12px}.room button:hover{background:#1b2230}
.messages{flex:1;min-height:0;overflow:auto;padding:28px max(18px,calc((100vw - 980px)/2));scroll-behavior:smooth}.messages::-webkit-scrollbar{width:8px}.messages::-webkit-scrollbar-thumb{background:#252c39;border-radius:20px}.messages::-webkit-scrollbar-track{background:transparent}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted)}.empty>div{max-width:340px}.emptyIcon{width:66px;height:66px;margin:0 auto 16px;border-radius:21px;display:grid;place-items:center;font-size:26px;background:linear-gradient(145deg,#171b2a,#10141d);border:1px solid #ffffff10;color:#9c93ff;box-shadow:0 20px 50px #0004}.empty div:last-child{font-size:13px;line-height:1.5}
.msg{display:flex;gap:11px;max-width:850px;margin:0 auto 18px;animation:msgIn .2s ease}.msg.mine{flex-direction:row-reverse}.avatar{width:40px;height:40px;flex:none;border-radius:13px;overflow:hidden;background:linear-gradient(145deg,#7063f5,#39309c);display:grid;place-items:center;font-size:15px;font-weight:800;color:#fff;border:1px solid #ffffff14;box-shadow:0 6px 20px #0003}.avatar img{width:100%;height:100%;object-fit:cover}.bubbleWrap{min-width:0;max-width:min(78%,700px)}.msg.mine .bubbleWrap{align-items:flex-end;display:flex;flex-direction:column}.name{font-size:11px;color:#98a2b4;margin:1px 0 6px;font-weight:700}.mine .name{color:#bcb6ff}.bubble{padding:11px 14px;border:1px solid #ffffff0c;background:linear-gradient(145deg,#151a24,#10141b);border-radius:16px 16px 16px 5px;box-shadow:0 8px 30px #0003}.mine .bubble{background:linear-gradient(145deg,#6659ee,#4d42c2);border-color:#8177ff;border-radius:16px 16px 5px 16px;box-shadow:0 8px 28px #5b50e92b}.text{white-space:pre-wrap;word-break:break-word;line-height:1.5;font-size:14px}
.fileCard{margin-top:8px;border-radius:13px;overflow:hidden;background:#080b11aa;border:1px solid #ffffff10}.fileCard img,.fileCard video{display:block;width:100%;max-height:420px;object-fit:contain;background:#05070a}.fileMeta{padding:10px 11px;display:flex;align-items:center;gap:9px}.fileIcon{font-size:20px}.fileInfo{min-width:0;flex:1}.fileName{font-weight:700;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fileSize{font-size:10px;color:#8992a2;margin-top:3px}.download{padding:7px 10px;border-radius:9px;color:#fff;text-decoration:none;background:#ffffff12;border:1px solid #ffffff0a;font-size:11px}.download:hover{background:#ffffff1d}.progress{height:3px;background:#ffffff0b}.progress i{display:block;height:100%;width:0;background:#aaa2ff;transition:width .15s}
.send{flex:none;display:flex;gap:9px;padding:13px max(18px,calc((100vw - 980px)/2));border-top:1px solid #ffffff0a;background:#0b0f16e8;backdrop-filter:blur(24px)}.send input:not(.hidden){height:46px;flex:1;min-width:0;padding:0 15px;border:1px solid #ffffff0d;background:#111720;border-radius:13px;font-size:13px;box-shadow:inset 0 1px #ffffff04}.send input:focus{border-color:#7065f0;box-shadow:0 0 0 3px #6c60ff14}.attach{width:46px;height:46px;flex:none;border-radius:13px;background:#151b25;border:1px solid #ffffff0d;font-size:23px;color:#cbd1dc}.attach:hover{background:#1c2330}.sendBtn{width:78px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:750;box-shadow:0 8px 24px #6659ff22}.sendBtn:hover{filter:brightness(1.08)}
.panel{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:radial-gradient(700px 500px at 50% 0,#30256755,transparent 70%),#07090e;z-index:10}.card{width:min(480px,100%);padding:32px;border:1px solid #ffffff12;background:linear-gradient(145deg,#111620f2,#0d1118f2);backdrop-filter:blur(30px);border-radius:26px;box-shadow:0 35px 120px #000b;animation:cardIn .45s ease}.heroLogo{width:62px;height:62px;border-radius:19px;display:grid;place-items:center;font-size:27px;font-weight:900;margin-bottom:18px;background:linear-gradient(145deg,#9187ff,#5546df);box-shadow:0 14px 38px #685bff32;border:1px solid #ffffff18}.card h1{margin:0;font-size:29px;letter-spacing:-1px}.card p{color:#929cad;line-height:1.55;margin:8px 0 21px;font-size:13px}.row{display:flex;gap:9px;margin-top:10px}.row>*{flex:1}.card input{width:100%;height:45px;padding:0 13px;border:1px solid #ffffff0d;background:#0b1017;border-radius:11px}.card input:focus{border-color:#6e62ed;box-shadow:0 0 0 3px #6c60ff12}.row button{height:45px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:750;box-shadow:0 8px 24px #6659ff22}.small{font-size:11px;color:#70798a;margin-top:13px;line-height:1.5}.profileSetup{display:flex;align-items:center;gap:11px;margin-bottom:10px}.pfpPreview{width:46px;height:46px;border-radius:14px;overflow:hidden;background:#171d28;border:1px solid #ffffff0e;display:grid;place-items:center;font-weight:800}.pfpPreview img{width:100%;height:100%;object-fit:cover}.pfpPick{height:35px;padding:0 11px;border-radius:9px;background:#171d28;border:1px solid #ffffff0e;font-size:11px}.pfpPick:hover{background:#202735}
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,15px);padding:10px 14px;border-radius:11px;background:#171d28f5;border:1px solid #ffffff14;box-shadow:0 14px 40px #0007;opacity:0;pointer-events:none;transition:.22s;z-index:30;font-size:12px;color:#e9ebf1}.toast.show{opacity:1;transform:translate(-50%,0)}
.savedVideo{min-height:180px;display:flex;align-items:center;gap:14px;padding:20px;background:#090c12;border-radius:12px;color:#fff}.videoIcon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#6658ee;font-size:20px}
@keyframes cardIn{from{opacity:0;transform:translateY(15px) scale(.98)}to{opacity:1;transform:none}}@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(max-width:760px){.top{height:auto;min-height:68px;padding:9px 10px;align-items:flex-start}.brand{padding-top:2px}.topActions{flex-wrap:wrap;justify-content:flex-end;max-width:62%}.topActions button{height:34px;padding:0 9px;font-size:10px}.topActions button:first-child{font-size:10px}.room{padding:7px 10px}.messages{padding:18px 9px}.msg{gap:8px;margin-bottom:15px}.avatar{width:35px;height:35px;border-radius:11px}.bubbleWrap{max-width:84%}.bubble{padding:9px 11px}.send{padding:9px}.sendBtn{width:66px}.card{padding:25px}.row{flex-direction:column}}
@media(max-width:430px){.title{font-size:14px}.topActions{gap:5px;max-width:70%}.topActions button{padding:0 7px}.topActions button:nth-child(2){display:none}.messages{padding-left:7px;padding-right:7px}.bubbleWrap{max-width:82%}}
</style>
</head>
<body>
<div id="join" class="panel"><div class="card"><div class="heroLogo">✦</div><h1>Chat App 2</h1><p>Private browser-to-browser chat with text, media, files and screen sharing.</p><div class="profileSetup"><div id="pfpPreview" class="pfpPreview">G</div><div><button type="button" id="pfpPick" class="pfpPick">Choose profile picture</button><input id="pfpInput" type="file" accept="image/*" class="hidden"></div></div><input id="name" maxlength="30" placeholder="Your name"><div class="row"><input id="room" maxlength="40" placeholder="Room code"><button id="joinBtn">Join room</button></div><div class="small">Use the same room code on each browser. Your profile picture stays on this device.</div></div></div>
<div id="app" class="app hidden"><header class="top"><div class="brand"><div id="myAvatar" class="logo">✦</div><div><div class="title">Chat App 2</div><div id="status" class="status">Waiting for peers</div></div></div><div class="topActions"><button id="shareBtn">Share screen + audio</button><button id="saveBtn" class="ghost">Download chat</button><button id="copyBtn" class="ghost">Copy room</button><button id="leaveBtn">Leave</button></div></header><div class="room"><input id="roomDisplay" readonly><button id="copyRoomBtn">Copy</button></div><main id="messages" class="messages"><div class="empty"><div><div class="emptyIcon">✦</div><div>Join the room from another browser to start chatting.</div></div></main><form id="send" class="send"><input id="fileInput" type="file" multiple accept="image/*,video/*,*/*" class="hidden"><button type="button" id="attachBtn" class="attach" title="Send files">＋</button><input id="message" autocomplete="off" placeholder="Write a message…"><button class="sendBtn">Send</button></form></div><div id="toast" class="toast"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://raw.githubusercontent.com/ikirumi11/chat-app2/main/app.js"></script>
</body>
</html>
