<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat App</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#111214;
    color:#fff;
    font-family:Arial,sans-serif;
    height:100vh;
}

.app{
    height:100vh;
    display:flex;
}

.sidebar{
    width:230px;
    background:#18191c;
    padding:20px;
}

.sidebar h2{
    margin-top:0;
}

.channel{
    padding:12px;
    margin:5px 0;
    border-radius:5px;
    color:#aaa;
    cursor:pointer;
}

.channel:hover,
.channel.active{
    background:#404249;
    color:white;
}

.chat{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.header{
    height:60px;
    padding:0 20px;
    display:flex;
    align-items:center;
    border-bottom:1px solid #202225;
    background:#2b2d31;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    margin-bottom:18px;
}

.message-name{
    font-weight:bold;
}

.message-time{
    color:#777;
    font-size:11px;
    margin-left:8px;
}

.message-text{
    margin-top:4px;
    color:#ddd;
    white-space:pre-wrap;
}

.input-area{
    padding:15px;
    background:#2b2d31;
}

.input-box{
    display:flex;
    background:#383a40;
    border-radius:8px;
    padding:7px;
}

textarea{
    flex:1;
    background:transparent;
    border:0;
    outline:0;
    resize:none;
    color:white;
    padding:10px;
    font-size:15px;
}

button{
    background:#5865f2;
    border:0;
    border-radius:5px;
    color:white;
    padding:0 20px;
    cursor:pointer;
}

button:hover{
    background:#4752c4;
}

.login{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    display:flex;
    align-items:center;
    justify-content:center;
}

.login-box{
    width:350px;
    background:#313338;
    padding:30px;
    border-radius:8px;
}

.login-box input{
    width:100%;
    padding:12px;
    margin:15px 0;
    background:#1e1f22;
    border:0;
    color:white;
    border-radius:5px;
}

.login-box button{
    width:100%;
    height:42px;
}

.status{
    position:fixed;
    top:10px;
    right:10px;
    font-size:12px;
    color:#57f287;
}
</style>
</head>

<body>

<div class="status" id="status">
Connecting...
</div>

<div class="app">

    <aside class="sidebar">

        <h2>MyChat</h2>

        <div
            class="channel active"
            onclick="changeChannel('general',this)">
            # general
        </div>

        <div
            class="channel"
            onclick="changeChannel('gaming',this)">
            # gaming
        </div>

        <div
            class="channel"
            onclick="changeChannel('movies',this)">
            # movies
        </div>

    </aside>

    <main class="chat">

        <div class="header">
            # <span id="channelName">general</span>
        </div>

        <div
            class="messages"
            id="messages">
        </div>

        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="messageInput"
                    placeholder="Message #general"
                    rows="1">
                </textarea>

                <button
                    onclick="sendMessage()">
                    Send
                </button>

            </div>

        </div>

    </main>

</div>


<div
    class="login"
    id="login">

    <div class="login-box">

        <h2>Welcome to MyChat</h2>

        <p>Choose your username.</p>

        <input
            id="username"
            maxlength="24"
            placeholder="Username">

        <button
            onclick="login()">
            Enter Chat
        </button>

    </div>

</div>


<script>

const API = "/api/messages";

let user = "";
let channel = "general";


function login(){

    const input =
        document.getElementById("username");

    const name =
        input.value.trim();

    if(!name){

        alert("Enter a username.");

        return;
    }

    user = name;

    localStorage.setItem(
        "chatUsername",
        user
    );

    document.getElementById(
        "login"
    ).style.display = "none";

    loadMessages();
}


async function loadMessages(){

    try{

        const response =
            await fetch(
                API +
                "?channel=" +
                encodeURIComponent(channel)
            );

        if(!response.ok){

            throw new Error(
                "Server returned " +
                response.status
            );
        }

        const result =
            await response.json();

        displayMessages(
            result.messages || []
        );

        document.getElementById(
            "status"
        ).textContent =
            "● Connected";

    }catch(error){

        console.error(error);

        document.getElementById(
            "status"
        ).textContent =
            "● Server error";

    }
}


function displayMessages(messages){

    const container =
        document.getElementById(
            "messages"
        );

    container.innerHTML = "";

    messages.forEach(message => {

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "message";

        const name =
            document.createElement(
                "span"
            );

        name.className =
            "message-name";

        name.textContent =
            message.username;

        const time =
            document.createElement(
                "span"
            );

        time.className =
            "message-time";

        time.textContent =
            new Date(
                message.created_at
            ).toLocaleString();

        const text =
            document.createElement(
                "div"
            );

        text.className =
            "message-text";

        text.textContent =
            message.message;

        div.appendChild(name);
        div.appendChild(time);
        div.appendChild(text);

        container.appendChild(div);

    });

    container.scrollTop =
        container.scrollHeight;
}


async function sendMessage(){

    const input =
        document.getElementById(
            "messageInput"
        );

    const message =
        input.value.trim();

    if(!message || !user)
        return;

    try{

        const response =
            await fetch(
                API,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        username:user,

                        channel:channel,

                        message:message

                    })
                }
            );

        const result =
            await response.json();

        if(!response.ok){

            throw new Error(
                result.error ||
                "Failed to send"
            );
        }

        input.value = "";

        loadMessages();

    }catch(error){

        alert(
            "Could not send message:\n" +
            error.message
        );

    }
}


function changeChannel(
    newChannel,
    element
){

    channel =
        newChannel;

    document
        .querySelectorAll(
            ".channel"
        )
        .forEach(
            item =>
                item.classList.remove(
                    "active"
                )
        );

    element.classList.add(
        "active"
    );

    document.getElementById(
        "channelName"
    ).textContent =
        channel;

    document.getElementById(
        "messageInput"
    ).placeholder =
        "Message #" + channel;

    loadMessages();
}


document
    .getElementById(
        "messageInput"
    )
    .addEventListener(
        "keydown",
        event => {

            if(
                event.key === "Enter" &&
                !event.shiftKey
            ){

                event.preventDefault();

                sendMessage();

            }

        }
    );


const saved =
    localStorage.getItem(
        "chatUsername"
    );

if(saved){

    user = saved;

    document.getElementById(
        "login"
    ).style.display =
        "none";

    loadMessages();
}


setInterval(
    loadMessages,
    3000
);

</script>

</body>
</html>
