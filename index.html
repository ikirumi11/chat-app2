<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>
<title>Chat</title>

<style>
*{
    box-sizing:border-box;
}

:root{
    --bg:#0b0d10;
    --panel:#111419;
    --panel2:#181c22;
    --panel3:#20252c;
    --border:#292f38;
    --text:#edf0f4;
    --muted:#7e8793;
    --accent:#e8eaed;
    --danger:#ff7070;
    --good:#65d991;
    --radius:12px;
    --text-size:16px;
    --word-spacing:0px;
    --line-spacing:1.45;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

body{
    overflow:hidden;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:64px;
    min-height:64px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel);
    border-bottom:1px solid var(--border);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
}

.logo-icon{
    width:36px;
    height:36px;
    display:grid;
    place-items:center;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:10px;
}

.channel{
    color:var(--muted);
    font-weight:400;
}

.header-actions{
    display:flex;
    gap:7px;
}

.icon-btn{
    width:39px;
    height:39px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--panel2);
    color:var(--text);
}

.icon-btn:hover{
    filter:brightness(1.15);
}

/* MESSAGES */

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    display:flex;
    gap:11px;
    margin-bottom:17px;
}

.avatar{
    width:40px;
    min-width:40px;
    height:40px;
    display:grid;
    place-items:center;
    border-radius:var(--radius);
    background:var(--panel2);
    border:1px solid var(--border);
    font-weight:700;
}

.message-content{
    min-width:0;
    max-width:min(850px,calc(100vw - 90px));
}

.message-top{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:3px;
}

.username{
    font-weight:700;
}

.time,
.edited{
    color:var(--muted);
    font-size:11px;
}

.message-text{
    color:#d8dde4;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    font-size:var(--text-size);
    word-spacing:var(--word-spacing);
    line-height:var(--line-spacing);
}

.message-link{
    color:#8fbaff;
    text-decoration:underline;
}

.message-image{
    display:block;
    max-width:min(500px,80vw);
    max-height:500px;
    margin-top:8px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:#000;
    object-fit:contain;
    cursor:pointer;
}

/* GAME CARD */

.game-card{
    margin:0 0 20px 0;
    border:1px solid #303743;
    border-radius:16px;
    overflow:hidden;
    background:
        linear-gradient(
            145deg,
            #171b21,
            #101318
        );
    box-shadow:
        0 12px 35px rgba(0,0,0,.2);
}

.game-head{
    padding:17px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    border-bottom:1px solid var(--border);
}

.game-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:18px;
    font-weight:800;
}

.game-icon{
    width:42px;
    height:42px;
    display:grid;
    place-items:center;
    border-radius:12px;
    background:#222831;
    border:1px solid #363e49;
    font-size:21px;
}

.game-status{
    color:var(--good);
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
}

.game-body{
    padding:18px;
}

.game-info{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:15px;
}

.game-pill{
    padding:7px 10px;
    border-radius:8px;
    background:#20252c;
    border:1px solid #303640;
    color:#bbc2cc;
    font-size:12px;
}

.game-players{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:15px;
}

.player-pill{
    display:flex;
    align-items:center;
    gap:7px;
    padding:7px 10px;
    border-radius:9px;
    background:#171b20;
    border:1px solid #2b313a;
    font-size:12px;
}

.player-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#68717d;
}

.player-dot.host{
    background:#f1c75b;
}

.turn-box{
    padding:13px;
    margin-bottom:15px;
    border:1px solid #343b46;
    border-radius:11px;
    background:#15191e;
    text-align:center;
}

.turn-box strong{
    display:block;
    margin-bottom:4px;
}

.turn-box span{
    color:#8e98a6;
    font-size:12px;
}

.game-board{
    margin:15px auto;
    width:min(420px,100%);
}

.game-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.game-btn{
    padding:10px 14px;
    border-radius:9px;
    border:1px solid var(--border);
    background:#20252c;
    color:white;
    font-weight:700;
}

.game-btn:hover{
    background:#292f37;
}

.game-btn.primary{
    background:#e8eaed;
    color:#111;
}

.game-btn.danger{
    color:#ff8585;
    border-color:#633438;
    background:#28191b;
}

.game-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

/* TIC TAC TOE */

.ttt{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
}

.ttt button{
    aspect-ratio:1;
    border:1px solid #343b46;
    border-radius:10px;
    background:#1a1f25;
    color:white;
    font-size:clamp(25px,7vw,45px);
    font-weight:900;
}

.ttt button:hover{
    background:#252b33;
}

/* CONNECT 4 */

.connect4{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:5px;
    padding:8px;
    border-radius:12px;
    background:#151a20;
}

.c4-cell{
    aspect-ratio:1;
    border-radius:50%;
    background:#080a0c;
    border:1px solid #303640;
    cursor:pointer;
}

.c4-cell.p1{
    background:#e5e7eb;
}

.c4-cell.p2{
    background:#777f8b;
}

/* REACTION */

.reaction-box{
    min-height:180px;
    display:grid;
    place-items:center;
    border-radius:14px;
    border:1px solid #343b46;
    background:#15191e;
    font-size:20px;
    font-weight:800;
    text-align:center;
    padding:20px;
}

.reaction-box.ready{
    cursor:pointer;
}

.reaction-box.waiting{
    background:#191d23;
}

.reaction-box.go{
    background:#26352b;
}

/* MEMORY */

.memory-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
}

.memory-card{
    aspect-ratio:1;
    border:1px solid #363e48;
    border-radius:9px;
    background:#171b20;
    color:transparent;
    font-size:25px;
    cursor:pointer;
}

.memory-card.flipped,
.memory-card.matched{
    color:white;
    background:#252b33;
}

.memory-card.matched{
    border-color:#4a805d;
}

/* NUMBER */

.number-board{
    display:grid;
    gap:12px;
}

.number-value{
    text-align:center;
    font-size:32px;
    font-weight:900;
}

.number-input{
    width:100%;
    padding:12px;
    border-radius:9px;
    border:1px solid var(--border);
    background:#11151a;
    color:white;
    outline:none;
}

/* COMPOSER */

.composer{
    padding:12px 16px 16px;
    background:var(--panel);
    border-top:1px solid var(--border);
}

.composer-box{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:8px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:14px;
}

textarea{
    flex:1;
    min-height:42px;
    max-height:150px;
    resize:none;
    border:0;
    outline:none;
    background:transparent;
    color:white;
    padding:10px;
}

.attach-btn,
.send-btn{
    height:42px;
    border:0;
    border-radius:9px;
}

.attach-btn{
    width:42px;
    background:transparent;
    color:#adb5c0;
    font-size:20px;
}

.attach-btn:hover{
    background:#242932;
}

.send-btn{
    padding:0 18px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

.send-btn:disabled{
    opacity:.5;
}

/* OVERLAY */

.overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.72);
    z-index:100;
}

.overlay.show{
    display:flex;
}

.panel{
    width:min(540px,calc(100vw - 25px));
    max-height:calc(100vh - 25px);
    overflow-y:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
    box-shadow:0 25px 80px #000b;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px;
    border-bottom:1px solid var(--border);
}

.panel-header h2{
    margin:0;
}

.panel-body{
    padding:18px;
}

/* GAME CREATOR */

.game-list{
    display:grid;
    gap:9px;
}

.game-choice{
    width:100%;
    padding:14px;
    text-align:left;
    display:flex;
    gap:12px;
    align-items:center;
    border:1px solid var(--border);
    border-radius:11px;
    background:var(--panel2);
    color:white;
}

.game-choice:hover{
    background:#232830;
}

.game-choice-icon{
    width:40px;
    height:40px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:#252b33;
}

.game-choice strong{
    display:block;
}

.game-choice small{
    display:block;
    margin-top:3px;
    color:var(--muted);
}

/* SETTINGS */

.category{
    margin-bottom:12px;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    background:var(--panel2);
}

.category-title{
    width:100%;
    padding:14px;
    border:0;
    background:transparent;
    color:var(--text);
    display:flex;
    justify-content:space-between;
    font-weight:700;
    text-align:left;
}

.category-body{
    display:none;
    padding:0 14px 14px;
}

.category.open .category-body{
    display:block;
}

.setting{
    margin-top:14px;
}

.setting label{
    display:block;
    margin-bottom:7px;
    color:#aab2bd;
    font-size:13px;
}

.setting input,
.setting select{
    width:100%;
    padding:10px;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
    background:#101419;
    color:white;
}

.setting input[type="range"]{
    padding:0;
}

.setting-value{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.save-btn{
    width:100%;
    margin-top:8px;
    padding:12px;
    border:0;
    border-radius:9px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

.danger-zone{
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid #402529;
}

.danger-title{
    color:var(--danger);
    font-weight:700;
}

.danger-zone p{
    color:var(--muted);
    line-height:1.45;
}

.danger-btn{
    width:100%;
    padding:12px;
    border-radius:9px;
    border:1px solid #743333;
    background:#241719;
    color:#ff8585;
}

/* EMPTY */

.empty{
    height:100%;
    display:grid;
    place-items:center;
    color:#656d78;
    text-align:center;
}

.empty strong{
    display:block;
    color:#aab2bd;
    margin-bottom:5px;
}

@media(max-width:600px){

    .header{
        padding:0 11px;
    }

    .messages{
        padding:15px 11px;
    }

    .channel{
        display:none;
    }

    .message-content{
        max-width:calc(100vw - 70px);
    }

    .game-head{
        align-items:flex-start;
    }

    .game-actions{
        display:grid;
        grid-template-columns:1fr 1fr;
    }

    .game-btn{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="logo">
        <div class="logo-icon">💬</div>
        <span>Chat</span>
        <span class="channel"># general</span>
    </div>

    <div class="header-actions">

        <button
            class="icon-btn"
            id="gamesBtn"
            title="Games"
        >🎮</button>

        <button
            class="icon-btn"
            id="settingsBtn"
            title="Settings"
        >⚙</button>

    </div>

</header>

<main
    class="messages"
    id="messages"
></main>

<div class="composer">

    <div class="composer-box">

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
        >

        <button
            class="attach-btn"
            id="attachBtn"
        >＋</button>

        <textarea
            id="messageInput"
            rows="1"
            placeholder="Message #general"
        ></textarea>

        <button
            class="send-btn"
            id="sendBtn"
        >Send</button>

    </div>

</div>

</div>


<!-- GAME CREATOR -->

<div
    class="overlay"
    id="gamesOverlay"
>

<div class="panel">

<div class="panel-header">

    <h2>🎮 Activities</h2>

    <button
        class="icon-btn"
        id="closeGames"
    >×</button>

</div>

<div class="panel-body">

<p style="color:var(--muted);line-height:1.5">
Start a game in chat. Everyone can spectate, but only people who
press <b>Join</b> before the host starts become players.
</p>

<div class="game-list">

<button
    class="game-choice"
    data-game="ttt"
>
    <div class="game-choice-icon">⭕</div>
    <div>
        <strong>Tic-Tac-Toe</strong>
        <small>Classic 3 × 3 battle</small>
    </div>
</button>

<button
    class="game-choice"
    data-game="connect4"
>
    <div class="game-choice-icon">🔴</div>
    <div>
        <strong>Connect Four</strong>
        <small>Get four in a row</small>
    </div>
</button>

<button
    class="game-choice"
    data-game="reaction"
>
    <div class="game-choice-icon">⚡</div>
    <div>
        <strong>Reaction Race</strong>
        <small>Be the fastest player</small>
    </div>
</button>

<button
    class="game-choice"
    data-game="memory"
>
    <div class="game-choice-icon">🧠</div>
    <div>
        <strong>Memory Match</strong>
        <small>Find matching pairs</small>
    </div>
</button>

<button
    class="game-choice"
    data-game="number"
>
    <div class="game-choice-icon">🔢</div>
    <div>
        <strong>Number Guess</strong>
        <small>Guess the secret number</small>
    </div>
</button>

</div>

</div>
</div>
</div>


<!-- SETTINGS -->

<div
    class="overlay"
    id="settingsOverlay"
>

<div class="panel">

<div class="panel-header">

    <h2>Settings</h2>

    <button
        class="icon-btn"
        id="closeSettings"
    >×</button>

</div>

<div class="panel-body">

<div class="category open">

<button class="category-title">
    <span>👤 Profile</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Your name</label>

<input
    id="usernameInput"
    maxlength="24"
    placeholder="Enter your name"
>

</div>

<div class="setting">

<label>Device ID</label>

<input
    id="deviceIdInput"
    readonly
>

</div>

</div>
</div>


<div class="category">

<button class="category-title">
    <span>📝 Text</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Text size</label>
<input
    id="textSize"
    type="range"
    min="12"
    max="24"
>
<div
    class="setting-value"
    id="textSizeValue"
></div>
</div>

<div class="setting">
<label>Word spacing</label>
<input
    id="wordSpacing"
    type="range"
    min="0"
    max="12"
>
<div
    class="setting-value"
    id="wordSpacingValue"
></div>
</div>

<div class="setting">
<label>Line spacing</label>
<input
    id="lineSpacing"
    type="range"
    min="1"
    max="2"
    step=".05"
>
<div
    class="setting-value"
    id="lineSpacingValue"
></div>
</div>

</div>
</div>


<div class="category">

<button class="category-title">
    <span>💬 Chat</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Chat refresh</label>

<select id="refreshRate">
<option value="10000">10 seconds</option>
<option value="5000">5 seconds</option>
<option value="3000">3 seconds</option>
<option value="2000">2 seconds</option>
<option value="1000">1 second</option>
<option value="500">0.5 seconds</option>
<option value="100">0.1 seconds</option>
</select>

</div>

<div class="setting">

<label>Show timestamps</label>

<select id="showTimestamps">
<option value="true">On</option>
<option value="false">Off</option>
</select>

</div>

<div class="setting">

<label>Compact messages</label>

<select id="compactMessages">
<option value="false">Off</option>
<option value="true">On</option>
</select>

</div>

</div>
</div>


<div class="category">

<button class="category-title">
    <span>🎮 Games</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Game sync speed</label>

<select id="gameSyncMode">
<option value="adaptive">Adaptive 0.1–1 sec</option>
<option value="fast">Fast 0.1 sec</option>
<option value="normal">Normal 0.5 sec</option>
<option value="slow">Slow 1 sec</option>
</select>

</div>

<div class="setting">

<label>Show game invitations</label>

<select id="showGameInvites">
<option value="true">On</option>
<option value="false">Off</option>
</select>

</div>

<div class="setting">

<label>Auto-open active games</label>

<select id="autoOpenGames">
<option value="true">On</option>
<option value="false">Off</option>
</select>

</div>

</div>
</div>


<div class="category">

<button class="category-title">
    <span>🎨 Appearance</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Theme</label>

<select id="themeSelect">

<option value="dark">Dark</option>
<option value="midnight">Midnight</option>
<option value="slate">Slate</option>
<option value="black">Pure Black</option>
<option value="blue">Dark Blue</option>
<option value="purple">Dark Purple</option>
<option value="green">Dark Green</option>
<option value="red">Dark Red</option>
<option value="gray">Classic Gray</option>
<option value="light">Light</option>
<option value="oled">OLED</option>

</select>

</div>

<div class="setting">

<label>Corner roundness</label>

<input
    id="cornerRadius"
    type="range"
    min="0"
    max="25"
>

<div
    class="setting-value"
    id="cornerRadiusValue"
></div>

</div>

<div class="setting">

<label>UI scale</label>

<input
    id="uiScale"
    type="range"
    min=".8"
    max="1.2"
    step=".05"
>

<div
    class="setting-value"
    id="uiScaleValue"
></div>

</div>

</div>
</div>


<div class="category">

<button class="category-title">
    <span>⚙️ Behavior</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

<label>Enter to send</label>

<select id="enterToSend">
<option value="true">On</option>
<option value="false">Off</option>
</select>

</div>

<div class="setting">

<label>Auto-scroll</label>

<select id="autoScroll">
<option value="true">On</option>
<option value="false">Off</option>
</select>

</div>

<div class="setting">

<label>Confirm before deleting</label>

<select id="confirmDelete">
<option value="true">On</option>
<option value="false">Off</option>
</select>

</div>

</div>
</div>


<button
    class="save-btn"
    id="saveSettings"
>
Save settings
</button>


<div class="danger-zone">

<div class="danger-title">
⚠ Danger Zone
</div>

<p>
Remove every normal chat message and temporary game state.
This affects everyone.
</p>

<button
    class="danger-btn"

function resizeImage(file) {

    return new Promise(
        (resolve,reject) => {

            const reader =
                new FileReader();

            reader.onload = () => {

                const img =
                    new Image();

                img.onload = () => {

                    let width =
                        img.width;

                    let height =
                        img.height;

                    const max =
                        1500;

                    if (
                        width > max ||
                        height > max
                    ) {

                        const scale =
                            Math.min(
                                max / width,
                                max / height
                            );

                        width =
                            Math.round(
                                width * scale
                            );

                        height =
                            Math.round(
                                height * scale
                            );
                    }

                    const canvas =
                        document
                            .createElement(
                                "canvas"
                            );

                    canvas.width =
                        width;

                    canvas.height =
                        height;

                    const ctx =
                        canvas
                            .getContext(
                                "2d"
                            );

                    ctx.drawImage(
                        img,
                        0,
                        0,
                        width,
                        height
                    );

                    resolve(
                        canvas.toDataURL(
                            "image/jpeg",
                            .78
                        )
                    );

                };

                img.onerror =
                    reject;

                img.src =
                    reader.result;
            };

            reader.onerror =
                reject;

            reader.readAsDataURL(file);
        }
    );
}

async function sendMessage() {

    const text =
        messageInput.value
            .trim();

    if (!settings.username) {

        settingsOverlay
            .classList
            .add("show");

        usernameInput.focus();

        alert(
            "Set your name in Settings first."
        );

        return;
    }

    if (
        !text &&
        !selectedFile
    ) {
        return;
    }

    sendBtn.disabled =
        true;

    try {

        let image = null;

        if (selectedFile) {
            image =
                await resizeImage(
                    selectedFile
                );
        }

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            username:
                                settings.username,

                            channel:
                                CHANNEL,

                            message:
                                text,

                            image,

                            device_id:
                                deviceId
                        })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Failed to send message."
            );
        }

        messageInput.value = "";

        messageInput.style.height =
            "auto";

        selectedFile = null;

        imageInput.value = "";

        attachBtn.textContent =
            "＋";

        await loadMessages();

    } catch (error) {

        alert(
            "Failed to send:\n\n" +
            error.message
        );

    } finally {

        sendBtn.disabled =
            false;

    }
}


/* =========================================================
   CHAT LOADING
========================================================= */

async function loadMessages() {

    try {

        const response =
            await fetch(
                API_URL +
                "?channel=" +
                encodeURIComponent(
                    CHANNEL
                ),
                {
                    cache: "no-store"
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Failed to load messages."
            );
        }

        currentMessages =
            Array.isArray(
                data.messages
            )
                ? data.messages
                : [];

        renderMessages();

    } catch (error) {

        messagesEl.innerHTML = "";

        const empty =
            document.createElement(
                "div"
            );

        empty.className =
            "empty";

        empty.innerHTML =
            "<div><strong>Unable to load messages</strong>" +
            escapeHtml(
                error.message
            ) +
            "</div>";

        messagesEl.appendChild(
            empty
        );
    }
}


/* =========================================================
   CHAT RENDER
========================================================= */

function renderMessages() {

    const wasBottom =
        messagesEl.scrollHeight -
        messagesEl.scrollTop -
        messagesEl.clientHeight
        < 100;

    const fragment =
        document
            .createDocumentFragment();


    /*
     * Active game cards are inserted
     * before normal messages.
     */

    if (
        settings.showGameInvites &&
        activeGames.length
    ) {

        activeGames.forEach(
            game => {

                fragment.appendChild(
                    createGameCard(
                        game
                    )
                );

            }
        );
    }


    if (!currentMessages.length) {

        if (!activeGames.length) {

            const empty =
                document.createElement(
                    "div"
                );

            empty.className =
                "empty";

            empty.innerHTML =
                "<div>" +
                "<strong>No messages yet</strong>" +
                "Be the first to send something." +
                "</div>";

            fragment.appendChild(
                empty
            );
        }

    } else {

        currentMessages.forEach(
            message => {

                fragment.appendChild(
                    createMessage(
                        message
                    )
                );

            }
        );
    }

    messagesEl.replaceChildren(
        fragment
    );


    if (
        wasBottom &&
        settings.autoScroll
    ) {

        messagesEl.scrollTop =
            messagesEl.scrollHeight;
    }
}


function createMessage(message) {

    const item =
        document.createElement(
            "div"
        );

    item.className =
        "message";

    const avatar =
        document.createElement(
            "div"
        );

    avatar.className =
        "avatar";

    avatar.textContent =
        (
            message.username ||
            "?"
        )
        .charAt(0)
        .toUpperCase();


    const content =
        document.createElement(
            "div"
        );

    content.className =
        "message-content";


    const top =
        document.createElement(
            "div"
        );

    top.className =
        "message-top";


    const name =
        document.createElement(
            "span"
        );

    name.className =
        "username";

    name.textContent =
        message.username ||
        "User";

    top.appendChild(
        name
    );


    if (settings.showTimestamps) {

        const time =
            document.createElement(
                "span"
            );

        time.className =
            "time";

        time.textContent =
            formatTime(
                message.created_at
            );

        top.appendChild(
            time
        );
    }


    if (message.edited) {

        const edited =
            document.createElement(
                "span"
            );

        edited.className =
            "edited";

        edited.textContent =
            "(edited)";

        top.appendChild(
            edited
        );
    }


    content.appendChild(
        top
    );


    if (message.message) {

        const text =
            document.createElement(
                "div"
            );

        text.className =
            "message-text";

        appendLinkedText(
            text,
            message.message
        );

        content.appendChild(
            text
        );
    }


    if (message.image) {

        const img =
            document.createElement(
                "img"
            );

        img.className =
            "message-image";

        img.src =
            message.image;

        img.alt =
            "Image";

        content.appendChild(
            img
        );
    }


    item.appendChild(
        avatar
    );

    item.appendChild(
        content
    );

    return item;
}


/* =========================================================
   LINK SUPPORT
========================================================= */

function appendLinkedText(
    element,
    text
) {

    const urlRegex =
        /(https?:\/\/[^\s]+)/g;

    let last = 0;

    String(text)
        .split(urlRegex)
        .forEach(part => {

            if (
                /^https?:\/\//i
                    .test(part)
            ) {

                const link =
                    document.createElement(
                        "a"
                    );

                link.className =
                    "message-link";

                link.href =
                    part;

                link.target =
                    "_blank";

                link.rel =
                    "noopener noreferrer";

                link.textContent =
                    part;

                element.appendChild(
                    link
                );

            } else {

                element.appendChild(
                    document.createTextNode(
                        part
                    )
                );
            }

            last +=
                part.length;
        });
}

async function createGame(type) {

    if (!settings.username) {

        gamesOverlay
            .classList
            .remove("show");

        settingsOverlay
            .classList
            .add("show");

        usernameInput.focus();

        alert(
            "Set your name before hosting a game."
        );

        return;
    }


    const alreadyHosting =
        activeGames.some(
            game =>
                game.hostDeviceId ===
                deviceId
        );

    if (alreadyHosting) {

        alert(
            "You can only host one game at a time."
        );

        return;
    }


    const def =
        GAME_DEFS[type];

    if (!def) {
        return;
    }


    const gameId =
        crypto.randomUUID();


    const game = {

        gameId,

        gameType:
            type,

        title:
            def.title,

        channel:
            CHANNEL,

        hostDeviceId:
            deviceId,

        hostName:
            settings.username,

        status:
            "lobby",

        maxPlayers:
            def.maxPlayers,

        players: [
            {
                deviceId,
                name:
                    settings.username
            }
        ],

        turnIndex:
            0,

        state:
            createInitialGameState(
                type
            ),

        version:
            1,

        updatedAt:
            Date.now()
    };


    try {

        const response =
            await fetch(
                API_URL,
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            game_action:
                                "create",

                            game
                        })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Could not create game."
            );
        }

        gamesOverlay
            .classList
            .remove("show");

        await loadGames();

    } catch (error) {

        alert(
            "Could not start game:\n\n" +
            error.message
        );
    }
}


/* =========================================================
   INITIAL GAME STATES
========================================================= */

function createInitialGameState(
    type
) {

    if (type === "ttt") {

        return {
            board:
                Array(9).fill(""),
            winner:
                null
        };
    }


    if (type === "connect4") {

        return {
            board:
                Array(42).fill(0),
            winner:
                null
        };
    }


    if (type === "reaction") {

        return {
            phase:
                "waiting",
            winner:
                null,
            round:
                0
        };
    }


    if (type === "memory") {

        const cards =
            [
                "🍎","🍎",
                "🚗","🚗",
                "⭐","⭐",
                "🌙","🌙",
                "🔥","🔥",
                "🎵","🎵",
                "🐱","🐱",
                "🌈","🌈"
            ];

        shuffle(cards);

        return {
            cards,
            flipped: [],
            matched: [],
            scores: {},
            winner: null
        };
    }


    if (type === "number") {

        return {
            target:
                Math.floor(
                    Math.random() * 50
                ) + 1,

            winner:
                null,

            lastGuess:
                null
        };
    }


    return {};
}

        const response =
            await fetch(
                API_URL +
                "?channel=" +
                encodeURIComponent(
                    CHANNEL
                ) +
                "&games=true",
                {
                    cache:
                        "no-store"
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Failed to load games."
            );
        }

        const previous =
            activeGames;

        activeGames =
            Array.isArray(data.games)
                ? data.games
                : [];


        /*
         * Automatically remove games that
         * have somehow become invalid.
         */

        for (
            const game of activeGames
        ) {

            if (
                game.status ===
                    "finished" ||
                !game.players ||
                game.players.length === 0
            ) {

                if (
                    game.hostDeviceId ===
                    deviceId
                ) {

                    await deleteGame(
                        game,
                        false
                    );
                }
            }
        }


        /*
         * Re-render when game state changes.
         */

        if (
            JSON.stringify(previous) !==
            JSON.stringify(activeGames)
        ) {

            renderMessages();
        }

    } catch {
        /*
         * Keep the existing UI if
         * a temporary poll fails.
         */
    }
}


/* =========================================================
   ADAPTIVE GAME POLLING
========================================================= */

function getGameInterval() {

    if (
        !activeGames.length
    ) {

        return 1000;
    }

    if (
        settings.gameSyncMode ===
        "fast"
    ) {

        return 100;
    }

    if (
        settings.gameSyncMode ===
        "normal"
    ) {

        return 500;
    }

    if (
        settings.gameSyncMode ===
        "slow"
    ) {

        return 1000;
    }


    /*
     * Adaptive:
     * browser connection estimate +
     * measured network speed.
     */

    const connection =
        navigator.connection ||
        navigator.mozConnection ||
        navigator.webkitConnection;


    if (connection) {

        if (
            connection.saveData
        ) {
            return 1000;
        }

        const effective =
            connection.effectiveType;

        if (
            effective === "slow-2g" ||
            effective === "2g"
        ) {
            return 1000;
        }

        if (
            effective === "3g"
        ) {
            return 500;
        }

        if (
            effective === "4g"
        ) {
            return 100;
        }
    }

    return 250;
}


function startGameRefresh() {

    if (gameTimer) {

        clearTimeout(
            gameTimer
        );
    }


    async function tick() {

        await loadGames();

        gameTimer =
            setTimeout(
                tick,
                Math.max(
                    100,
                    Math.min(
                        1000,
                        getGameInterval()
                    )
                )
            );
    }


    tick();
}

   NORMAL CHAT REFRESH
========================================================= */

function startChatRefresh() {

    if (refreshTimer) {

        );
    }

    refreshTimer =
        setInterval(

            Math.max(
                100,
                Number(
                    settings.refreshRate
                )
            )
        );
}

/* =========================================================
   TTT
========================================================= */

function createTTT(game) {

    const wrap =
        document.createElement(
            "div"
        );

    wrap.className =
        "ttt";


    const board =
        game.state.board ||
        Array(9).fill("");


    board.forEach(
        (value,index) => {

            const button =
                document.createElement(
                    "button"
                );

            button.textContent =
                value;

            button.disabled =
                !canMakeMove(game) ||
                Boolean(value) ||
                game.state.winner;

            button.onclick =
                () =>
                    tttMove(
                        game,
                        index
                    );

            wrap.appendChild(
                button
            );
        }
    );


    if (game.state.winner) {

        const result =
            document.createElement(
                "div"
            );

        result.style.gridColumn =
            "1/-1";

        result.style.textAlign =
            "center";

        result.style.padding =
            "8px";

        result.style.color =
            "var(--good)";

        result.textContent =
            game.state.winner ===
            "draw"
                ? "Draw!"
                : game.state.winner +
                  " wins!";

        wrap.appendChild(
            result
        );
    }


    return wrap;
}


async function tttMove(
    game,
    index
) {

    if (!canMakeMove(game)) {
        return;
    }

    const next =
        cloneGame(game);

    const symbol =
        next.turnIndex === 0
            ? "X"
            : "O";

    if (
        next.state.board[index]
    ) {
        return;
    }

    next.state.board[index] =
        symbol;

    const winner =
        checkTTT(
            next.state.board
        );

    if (winner) {

        next.state.winner =
            winner;

        next.status =
            "finished";

    } else if (
        next.state.board
            .every(Boolean)
    ) {

        next.state.winner =
            "draw";

        next.status =
            "finished";

    } else {

        next.turnIndex =
            (
                next.turnIndex + 1
            ) %
            next.players.length;
    }

    await hostUpdateGame(
        next
    );
}


function checkTTT(
    board
) {

    const wins = [
        [0,1,2],
        [3,4,5],
        [6,7,8],
        [0,3,6],
        [1,4,7],
        [2,5,8],
        [0,4,8],
        [2,4,6]
    ];

    for (
        const line of wins
    ) {

        const [
            a,b,c
        ] = line;

        if (
            board[a] &&
            board[a] ===
            board[b] &&
            board[a] ===
            board[c]
        ) {

            return board[a];
        }
    }

    return null;
}


/* =========================================================
   CONNECT 4
========================================================= */

function createConnect4(
    game
) {

    const wrap =
        document.createElement(
            "div"
        );

    wrap.className =
        "connect4";


    const board =
        game.state.board ||
        Array(42).fill(0);


    board.forEach(
        (value,index) => {

            const cell =
                document.createElement(
                    "button"
                );

            cell.className =
                "c4-cell";

            if (value === 1) {
                cell.classList.add(
                    "p1"
                );
            }

            if (value === 2) {
                cell.classList.add(
                    "p2"
                );
            }

            cell.disabled =
                !canMakeMove(game) ||
                Boolean(
                    game.state.winner
                );

            cell.onclick =
                () =>
                    connect4Move(
                        game,
                        index % 7
                    );

            wrap.appendChild(
                cell
            );
        }
    );


    return wrap;
}


async function connect4Move(
    game,
    column
) {

    if (!canMakeMove(game)) {
        return;
    }

    const next =
        cloneGame(game);

    const board =
        next.state.board;

    let row = -1;

    for (
        let r = 5;
        r >= 0;
        r--
    ) {

        const index =
            r * 7 + column;

        if (!board[index]) {

            row = r;

            board[index] =
                next.turnIndex === 0
                    ? 1
                    : 2;

            break;
        }
    }

    if (row < 0) {
        return;
    }


    if (
        checkConnect4(
            board,
            row,
            column,
            board[
                row * 7 + column
            ]
        )
    ) {

        next.state.winner =
            next.turnIndex === 0
                ? "Player 1"
                : "Player 2";

        next.status =
            "finished";

    } else if (
        board.every(Boolean)
    ) {

        next.state.winner =
            "draw";

        next.status =
            "finished";

    } else {

        next.turnIndex =
            (
                next.turnIndex + 1
            ) %
            next.players.length;
    }

    await hostUpdateGame(
        next
    );
}


function checkConnect4(
    board,
    row,
    col,
    player
) {

    const dirs = [
        [1,0],
        [0,1],
        [1,1],
        [1,-1]
    ];

    for (
        const [
            dr,dc
        ] of dirs
    ) {

        let count = 1;

        for (
            const sign of [-1,1]
        ) {

            let r =
                row +
                dr * sign;

            let c =
                col +
                dc * sign;

            while (
                r >= 0 &&
                r < 6 &&
                c >= 0 &&
                c < 7 &&
                board[
                    r * 7 + c
                ] === player
            ) {

                count++;

                r +=
                    dr * sign;

                c +=
                    dc * sign;
            }
        }

        if (count >= 4) {
            return true;
        }
    }

    return false;
}


/* =========================================================
   REACTION
========================================================= */

function createReaction(
    game
) {

    const box =
        document.createElement(
            "div"
        );

    box.className =
        "reaction-box";


    const phase =
        game.state.phase;


    if (
        game.state.winner
    ) {

        box.textContent =
            game.state.winner +
            " won!";

        return box;
    }


    if (
        phase ===
        "go"
    ) {

        box.classList.add(
            "go"
        );

        box.textContent =
            "CLICK NOW!";

        box.onclick =
            () =>
                reactionClick(
                    game
                );

        return box;
    }


    box.classList.add(
        "waiting"
    );

    box.textContent =
        game.status ===
        "playing"
            ? "Wait for GO..."
            : "Waiting for game to start";

    return box;
}


async function reactionClick(
    game
) {

    if (!canMakeMove(game)) {
        return;
    }

    const next =
        cloneGame(game);

    const player =
        next.players[
            next.turnIndex %
            next.players.length
        ];

    next.state.winner =
        player.name;

    next.state.phase =
        "finished";

    next.status =
        "finished";

    await hostUpdateGame(
        next
    );
}


/* =========================================================
   MEMORY
========================================================= */

function createMemory(
    game
) {

    const wrap =
        document.createElement(
            "div"
        );

    wrap.className =
        "memory-grid";


    const cards =
        game.state.cards || [];


    cards.forEach(
        (value,index) => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "memory-card";

            const visible =
                game.state.flipped
                    ?.includes(index) ||
                game.state.matched
                    ?.includes(index);

            if (visible) {

                button.classList.add(
                    "flipped"
                );

                if (
                    game.state.matched
                        ?.includes(index)
                ) {

                    button.classList.add(
                        "matched"
                    );
                }
            }

            button.textContent =
                value;

            button.disabled =
                !canMakeMove(game) ||
                visible;

            button.onclick =
                () =>
                    memoryMove(
                        game,
                        index
                    );

            wrap.appendChild(
                button
            );
        }
    );


    return wrap;
}


async function memoryMove(
    game,
    index
) {

    if (!canMakeMove(game)) {
        return;
    }

    const next =
        cloneGame(game);

    if (
        next.state.flipped
            .includes(index)
    ) {
        return;
    }

    next.state.flipped.push(
        index
    );


    if (
        next.state.flipped.length >= 2
    ) {

        const [
            a,b
        ] =
            next.state.flipped
                .slice(-2);

        if (
            next.state.cards[a] ===
            next.state.cards[b]
        ) {

            next.state.matched.push(
                a,
                b
            );

            const player =
                next.players[
                    next.turnIndex
                ];

            next.state.scores[
                player.deviceId
            ] =
                (
                    next.state.scores[
                        player.deviceId
                    ] || 0
                ) + 1;

            next.state.flipped = [];

            if (
                next.state.matched
                    .length ===
                next.state.cards.length
            ) {

                let winner =
                    next.players[0];

                for (
                    const p of
                    next.players
                ) {

                    if (
                        (
                            next.state
                                .scores[
                                    p.deviceId
                                ] || 0
                        ) >
                        (
                            next.state
                                .scores[
                                    winner.deviceId
                                ] || 0
                        )
                    ) {

                        winner = p;
                    }
                }

                next.state.winner =
                    winner.name;

                next.status =
                    "finished";
            }

        } else {

            /*
             * Give the player a short
             * visible reveal, then hide.
             */

            await hostUpdateGame(
                next
            );

            await sleep(
                700
            );

            next.state.flipped = [];

            next.turnIndex =
                (
                    next.turnIndex + 1
                ) %
                next.players.length;
        }
    }

    await hostUpdateGame(
        next
    );
}


/* =========================================================
   NUMBER GUESS
========================================================= */

function createNumberGame(
    game
) {

    const wrap =
        document.createElement(
            "div"
        );

    wrap.className =
        "number-board";


    const number =
        document.createElement(
            "div"
        );

    number.className =
        "number-value";

    number.textContent =
        game.state.winner
            ? game.state.winner +
              " won!"
            : "1–50";


    const input =
        document.createElement(
            "input"
        );

    input.className =
        "number-input";

    input.type =
        "number";

    input.min =
        "1";

    input.max =
        "50";

    input.placeholder =
        "Your guess";


    const button =
        createButton(
            "Guess",
            "primary"
        );

    button.disabled =
        !canMakeMove(game) ||
        Boolean(
            game.state.winner
        );

    button.onclick =
        () =>
            numberGuess(
                game,
                input
            );


    wrap.appendChild(
        number
    );

    wrap.appendChild(
        input
    );

    wrap.appendChild(
        button
    );


    if (
        game.state.lastGuess
    ) {

        const hint =
            document.createElement(
                "div"
            );

        hint.style.textAlign =
            "center";

        hint.style.color =
            "var(--muted)";

        hint.textContent =
            game.state.lastGuess;

        wrap.appendChild(
            hint
        );
    }


    return wrap;
}


async function numberGuess(
    game,
    input
) {

    if (!canMakeMove(game)) {
        return;
    }

    const value =
        Number(input.value);

    if (
        !Number.isInteger(value) ||
        value < 1 ||
        value > 50
    ) {

        return;
    }


    const next =
        cloneGame(game);

    const player =
        next.players[
            next.turnIndex %
            next.players.length
        ];


    if (
        value ===
        next.state.target
    ) {

        next.state.winner =
            player.name;

        next.status =
            "finished";

    } else {

        next.state.lastGuess =
            player.name +
            " guessed " +
            value +
            (
                value <
                next.state.target
                    ? " — higher!"
                    : " — lower!"
            );

        next.turnIndex =
            (
                next.turnIndex + 1
            ) %
            next.players.length;
    }


    await hostUpdateGame(
        next
    );
}


/* =========================================================
   PLAYER ACTIONS
========================================================= */

async function joinGame(
    game
) {

    if (
        game.status !==
        "lobby"
    ) {
        return;
    }

    if (
        game.players.some(
            p =>
                p.deviceId ===
                deviceId
        )
    ) {
        return;
    }

    if (
        game.players.length >=
        game.maxPlayers
    ) {

        alert(
            "This game is full."
        );

        return;
    }


    /*
     * Only host can update the
     * actual game-state row.
     *
     * For this reason we send a
     * request through a special
     * join operation below.
     */

    try {

        const response =
            await fetch(
                API_URL,
                {
                    method:
                        "PATCH",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            game_action:
                                "join",

                            game_id:
                                game.gameId,

                            message_id:
                                game._messageId,

                            device_id:
                                deviceId,

                            player_name:
                                settings.username
                        })
                }
            );

        /*
         * The API above intentionally
         * rejects arbitrary non-host
         * state updates unless the
         * join operation is implemented.
         */

        const data =
            await response.json();

        if (!response.ok) {

            /*
             * Fallback:
             * Tell the user if the backend
             * needs the join handler.
             */

            throw new Error(
                data.error ||
                "Could not join game."
            );
        }

        await loadGames();

    } catch (error) {

        alert(
            "Could not join:\n\n" +
            error.message
        );
    }
}


async function leaveGame(
    game
) {

    /*
     * Host leaving ends the game.
     * Non-host leaving uses the same
     * game participant operation.
     */

    if (
        game.hostDeviceId ===
        deviceId
    ) {

        await deleteGame(
            game,
            true
        );

        return;
    }


    try {

        const response =
            await fetch(
                API_URL,
                {
                    method:
                        "PATCH",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            game_action:
                                "leave",

                            game_id:
                                game.gameId,

                            message_id:
                                game._messageId,

                            device_id:
                                deviceId
                        })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Could not leave."
            );
        }

        await loadGames();

    } catch (error) {

        alert(
            "Could not leave:\n\n" +
            error.message
        );
    }
}


async function startGame(
    game
) {

    if (
        game.hostDeviceId !==
        deviceId
    ) {
        return;
    }

    if (
        game.players.length < 2
    ) {

        alert(
            "At least two players are required."
        );

        return;
    }


    const next =
        cloneGame(game);

    next.status =
        "playing";

    next.turnIndex =
        0;

    next.version++;


    if (
        next.gameType ===
        "reaction"
    ) {

        next.state.phase =
            "go";
    }


    await hostUpdateGame(
        next
    );
}


async function forceQuitGame(
    game
) {

    if (
        game.hostDeviceId !==
        deviceId
    ) {
        return;
    }

    if (
        !confirm(
            "Force quit this game for everyone?"
        )
    ) {
        return;
    }

    await deleteGame(
        game,
        true
    );
}


async function deleteGame(
    game,
    refresh = true
) {

    if (
        game.hostDeviceId !==
        deviceId
    ) {
        return;
    }

    try {

        const response =
            await fetch(
                API_URL,
                {
                    method:
                        "DELETE",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            game_action:
                                "delete",

                            message_id:
                                game._messageId,

                            device_id:
                                deviceId
                        })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Could not remove game."
            );
        }

        activeGames =
            activeGames.filter(
                g =>
                    g.gameId !==
                    game.gameId
            );

        renderMessages();

        if (refresh) {
            await loadGames();
        }

    } catch (error) {

        alert(
            "Could not remove game:\n\n" +
            error.message
        );
    }
}


/* =========================================================
   HOST UPDATE
========================================================= */

async function hostUpdateGame(
    game
) {

    if (
        game.hostDeviceId !==
        deviceId
    ) {
        return;
    }

    game.version =
        Number(game.version || 0) + 1;

    game.updatedAt =
        Date.now();


    /*
     * Finished games are removed
     * instead of being kept in the DB.
     */

    if (
        game.status ===
        "finished"
    ) {

        await deleteGame(
            game,
            true
        );

        return;
    }


    try {

        const response =
            await fetch(
                API_URL,
                {
                    method:
                        "PATCH",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            game_action:
                                "update",

                            message_id:
                                game._messageId,

                            device_id:
                                deviceId,

                            game
                        })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Game update failed."
            );
        }

        activeGames =
            activeGames.map(
                g =>
                    g.gameId ===
                    game.gameId
                        ? game
                        : g
            );

        renderMessages();

    } catch (error) {

        console.error(
            "Game update:",
            error
        );
    }
}


/* =========================================================
   GAME MOVE CHECK
========================================================= */

function canMakeMove(
    game
) {

    if (
        game.status !==
        "playing"
    ) {
        return false;
    }

    if (!game.players.length) {
        return false;
    }

    const player =
        game.players[
            game.turnIndex %
            game.players.length
        ];

    return Boolean(
        player &&
        player.deviceId ===
        deviceId
    );
}


function cloneGame(game) {

    return JSON.parse(
        JSON.stringify(
            game
        )
    );
}


/* =========================================================
   CONFIRM / WIPE
========================================================= */

function openConfirm(
    title,
    text,
    callback
) {

    dialogTitle.textContent =
        title;

    dialogText.textContent =
        text;

    confirmCallback =
        callback;

    dialogOverlay
        .classList
        .add("show");
}


dialogCancel.onclick = () => {

    dialogOverlay
        .classList
        .remove("show");

    confirmCallback =
        null;
};


dialogConfirm.onclick =
    async () => {

        const callback =
            confirmCallback;

        dialogOverlay
            .classList
            .remove("show");

        confirmCallback =
            null;

        if (callback) {
            await callback();
        }
    };


removeEverything.onclick =
    () => {

        openConfirm(
            "Remove everything?",
            "This deletes the entire chat and every temporary game.",
            permanentlyWipe
        );
    };


async function permanentlyWipe() {

    try {

        const response =
            await fetch(
                API_URL,
                {
                    method:
                        "DELETE",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            delete_all:
                                true
                        })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Failed to wipe."
            );
        }

        currentMessages = [];

        activeGames = [];

        renderMessages();

        alert(
            "Chat and games were wiped."
        );

    } catch (error) {

        alert(
            "Wipe failed:\n\n" +
            error.message
        );
    }
}


/* =========================================================
   HELPERS
========================================================= */

function shuffle(array) {

    for (
        let i =
            array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];
    }

    return array;
}


function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );
}


function formatTime(date) {

    if (!date) {
        return "";
    }

    return new Date(
        date
    ).toLocaleTimeString(
        [],
        {
            hour:
                "2-digit",

            minute:
                "2-digit"
        }
    );
}


function escapeHtml(value) {

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}


/* =========================================================
   START
========================================================= */

loadSettingsUI();

applySettings();

loadMessages();

loadGames();
