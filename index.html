<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b0d10">
<title>Chat</title>

<style>
*{box-sizing:border-box}

:root{
    --bg:#080a0d;
    --panel:#101318;
    --panel2:#171b21;
    --panel3:#1d2229;
    --border:#292f38;
    --border2:#363d47;
    --text:#edf0f4;
    --text2:#d5dae1;
    --muted:#7f8995;
    --accent:#e8eaed;
    --danger:#ff6868;
    --success:#70d69a;
    --radius:12px;
    --ui-scale:1;
    --text-size:16px;
    --word-spacing:0px;
    --line-spacing:1.45;
    --message-gap:17px;
    --avatar-size:40px;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

body{
    overflow:hidden;
    font-size:calc(16px * var(--ui-scale));
}

button,input,textarea,select{
    font:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    cursor:not-allowed;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:64px;
    min-height:64px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    position:relative;
    z-index:10;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
}

.logo-icon{
    width:35px;
    height:35px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:var(--panel2);
    border:1px solid var(--border);
}

.channel{
    color:var(--muted);
    font-weight:400;
}

.header-right{
    display:flex;
    align-items:center;
    gap:7px;
}

.connection{
    display:flex;
    align-items:center;
    gap:6px;
    margin-right:5px;
    color:var(--muted);
    font-size:11px;
}

.connection-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--success);
}

.connection-dot.offline{
    background:var(--danger);
}

.icon-btn{
    width:39px;
    height:39px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
}

.icon-btn:hover{
    filter:brightness(1.15);
}

/* MESSAGES */

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
    scroll-behavior:smooth;
}

.message{
    display:flex;
    gap:11px;
    margin-bottom:var(--message-gap);
    animation:messageIn .16s ease;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(4px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.message.compact{
    margin-bottom:5px;
}

.message.compact .avatar{
    width:28px;
    height:28px;
    flex-basis:28px;
    font-size:11px;
}

.message.compact .message-top{
    margin-bottom:0;
}

.avatar{
    flex:0 0 var(--avatar-size);
    width:var(--avatar-size);
    height:var(--avatar-size);
    display:grid;
    place-items:center;
    border-radius:var(--radius);
    background:var(--panel2);
    border:1px solid var(--border);
    font-weight:700;
}

.message-content{
    min-width:0;
    max-width:min(850px,calc(100vw - 90px));
}

.message-top{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:3px;
    flex-wrap:wrap;
}

.username{
    font-weight:700;
}

.time,.edited{
    color:var(--muted);
    font-size:11px;
}

.message-text{
    color:var(--text2);
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    font-size:var(--text-size);
    word-spacing:var(--word-spacing);
    line-height:var(--line-spacing);
}

.message-text a{
    color:#82b9ff;
    text-decoration:underline;
    cursor:pointer;
}

.message-image{
    display:block;
    max-width:min(500px,80vw);
    max-height:500px;
    margin-top:8px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:#000;
    object-fit:contain;
    cursor:pointer;
}

.message-link-card{
    margin-top:8px;
    padding:10px;
    border:1px solid var(--border);
    background:var(--panel2);
    border-radius:10px;
    max-width:520px;
}

.message-link-card a{
    color:#82b9ff;
    overflow-wrap:anywhere;
}

/* NEW MESSAGE BUTTON */

.new-message{
    position:absolute;
    bottom:90px;
    left:50%;
    transform:translateX(-50%);
    display:none;
    z-index:20;
    border:1px solid var(--border2);
    background:var(--panel3);
    color:var(--text);
    padding:8px 14px;
    border-radius:20px;
    box-shadow:0 10px 30px #0008;
}

.new-message.show{
    display:block;
}

/* COMPOSER */

.composer{
    padding:12px 16px 16px;
    background:var(--panel);
    border-top:1px solid var(--border);
}

.composer-box{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:8px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:14px;
}

textarea{
    flex:1;
    min-height:42px;
    max-height:150px;
    resize:none;
    border:0;
    outline:none;
    background:transparent;
    color:white;
    padding:10px;
}

.attach-btn,
.send-btn{
    height:42px;
    border:0;
    border-radius:9px;
}

.attach-btn{
    width:42px;
    background:transparent;
    color:#adb5c0;
    font-size:20px;
}

.attach-btn:hover{
    background:#242932;
}

.send-btn{
    padding:0 18px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

.send-btn:disabled{
    opacity:.5;
}

/* SETTINGS */

.overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.72);
    z-index:100;
    padding:12px;
}

.overlay.show{
    display:flex;
}

.panel{
    width:min(620px,calc(100vw - 25px));
    max-height:calc(100vh - 25px);
    overflow-y:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
    box-shadow:0 25px 80px #000b;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    background:var(--panel);
    z-index:2;
}

.panel-header h2{
    margin:0;
}

.panel-body{
    padding:18px;
}

/* CATEGORIES */

.category{
    margin-bottom:12px;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    background:var(--panel2);
}

.category-title{
    width:100%;
    padding:14px;
    border:0;
    background:transparent;
    color:var(--text);
    display:flex;
    justify-content:space-between;
    font-weight:700;
    text-align:left;
}

.category-title span:last-child{
    color:var(--muted);
}

.category-body{
    display:none;
    padding:0 14px 14px;
}

.category.open .category-body{
    display:block;
}

.setting{
    margin-top:14px;
}

.setting label{
    display:block;
    margin-bottom:7px;
    color:#aab2bd;
    font-size:13px;
}

.setting input,
.setting select{
    width:100%;
    padding:10px;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
    background:#101419;
    color:white;
}

.setting input[type="range"]{
    padding:0;
}

.setting-value{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.setting-help{
    color:var(--muted);
    font-size:11px;
    line-height:1.4;
    margin-top:5px;
}

.save-btn,
.test-btn{
    width:100%;
    margin-top:8px;
    padding:12px;
    border:0;
    border-radius:9px;
    font-weight:700;
}

.save-btn{
    background:var(--accent);
    color:#111;
}

.test-btn{
    background:var(--panel3);
    border:1px solid var(--border);
    color:var(--text);
}

/* NOTIFICATION PREVIEW */

.notification-preview{
    margin-top:12px;
    padding:13px;
    border:1px solid var(--border);
    background:#191d23;
    border-radius:12px;
}

.preview-title{
    font-weight:700;
    margin-bottom:4px;
}

.preview-text{
    color:#aeb6c0;
    font-size:13px;
}

/* DANGER */

.danger-zone{
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid #402529;
}

.danger-title{
    color:var(--danger);
    font-weight:700;
    margin-bottom:7px;
}

.danger-zone p{
    color:var(--muted);
    line-height:1.45;
}

.danger-btn{
    width:100%;
    padding:12px;
    border-radius:9px;
    border:1px solid #743333;
    background:#241719;
    color:#ff8585;
}

/* CONTEXT MENU */

.context-menu{
    position:fixed;
    display:none;
    width:160px;
    padding:5px;
    z-index:200;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:9px;
    box-shadow:0 15px 40px #0009;
}

.context-menu.show{
    display:block;
}

.context-menu button{
    width:100%;
    padding:9px 10px;
    text-align:left;
    border:0;
    border-radius:6px;
    background:transparent;
    color:var(--text);
}

.context-menu button:hover{
    background:#252b33;
}

.delete-option{
    color:#ff7777!important;
}

/* IMAGE VIEWER */

.image-viewer{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000f;
    z-index:300;
}

.image-viewer.show{
    display:flex;
}

.full-image{
    max-width:95vw;
    max-height:90vh;
    object-fit:contain;
}

.back-image{
    position:absolute;
    top:18px;
    left:18px;
    padding:10px 16px;
    border-radius:9px;
    border:1px solid #3a4049;
    background:#171b21;
    color:white;
}

/* DIALOG */

.dialog{
    width:min(450px,calc(100vw - 30px));
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
}

.dialog h2{
    margin-top:0;
}

.dialog p{
    color:#aab2bd;
    line-height:1.5;
}

.dialog-buttons{
    display:flex;
    gap:8px;
    justify-content:flex-end;
}

.dialog-buttons button{
    padding:10px 16px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#20252c;
    color:white;
}

.dialog-buttons .danger{
    background:#6b2929;
    border-color:#813434;
}

/* EMPTY */

.empty{
    height:100%;
    display:grid;
    place-items:center;
    color:#656d78;
    text-align:center;
}

.empty strong{
    display:block;
    color:#aab2bd;
    margin-bottom:5px;
}

/* TOAST */

.toast-container{
    position:fixed;
    top:75px;
    right:16px;
    z-index:500;
    display:flex;
    flex-direction:column;
    gap:9px;
    pointer-events:none;
}

.toast{
    width:min(360px,calc(100vw - 32px));
    padding:13px;
    border:1px solid var(--border2);
    border-radius:12px;
    background:var(--panel2);
    box-shadow:0 15px 40px #0009;
    animation:toastIn .2s ease;
}

.toast-title{
    font-weight:700;
    margin-bottom:3px;
}

.toast-text{
    color:#aeb6c0;
    font-size:13px;
    overflow-wrap:anywhere;
}

@keyframes toastIn{
    from{
        opacity:0;
        transform:translateX(20px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

/* SEARCH */

.search-box{
    display:none;
    position:absolute;
    top:64px;
    left:0;
    right:0;
    padding:10px 16px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    z-index:9;
}

.search-box.show{
    display:block;
}

.search-box input{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--panel2);
    color:white;
    outline:none;
}

@media(max-width:700px){

    .header{
        padding:0 10px;
    }

    .connection{
        display:none;
    }

    .messages{
        padding:15px 11px;
    }

    .channel{
        display:none;
    }

    .message-content{
        max-width:calc(100vw - 70px);
    }

    .composer{
        padding:8px;
    }

    .send-btn{
        padding:0 13px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="logo">
        <div class="logo-icon">💬</div>
        <span>Chat</span>
        <span class="channel"># general</span>
    </div>

    <div class="header-right">

        <div class="connection">
            <span
                class="connection-dot"
                id="connectionDot"
            ></span>
            <span id="connectionText">Online</span>
        </div>

        <button
            class="icon-btn"
            id="searchBtn"
            title="Search"
        >⌕</button>

        <button
            class="icon-btn"
            id="settingsBtn"
            title="Settings"
        >⚙</button>

    </div>

</header>

<div
    class="search-box"
    id="searchBox"
>
    <input
        id="searchInput"
        placeholder="Search messages..."
    >
</div>

<main
    class="messages"
    id="messages"
></main>

<button
    class="new-message"
    id="newMessageBtn"
>
    ↓ New messages
</button>

<div class="composer">

    <div class="composer-box">

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
        >

        <button
            class="attach-btn"
            id="attachBtn"
            title="Choose image"
        >＋</button>

        <textarea
            id="messageInput"
            rows="1"
            placeholder="Message #general"
        ></textarea>

        <button
            class="send-btn"
            id="sendBtn"
        >Send</button>

    </div>

</div>

</div>


<!-- SETTINGS -->

<div
    class="overlay"
    id="settingsOverlay"
>

<div class="panel">

<div class="panel-header">

    <h2>Settings</h2>

    <button
        class="icon-btn"
        id="closeSettings"
    >×</button>

</div>

<div class="panel-body">


<!-- PROFILE -->

<div class="category open">

<button class="category-title">
    <span>👤 Profile</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Your name</label>
<input
    id="usernameInput"
    maxlength="24"
    placeholder="Enter your name"
>
</div>

<div class="setting">
<label>Device ID</label>
<input id="deviceIdInput" readonly>
</div>

</div>
</div>


<!-- TEXT -->

<div class="category">

<button class="category-title">
    <span>📝 Text</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Text size</label>
<input
    id="textSize"
    type="range"
    min="12"
    max="28"
    step="1"
>
<div class="setting-value" id="textSizeValue"></div>
</div>

<div class="setting">
<label>Word spacing</label>
<input
    id="wordSpacing"
    type="range"
    min="0"
    max="15"
    step="1"
>
<div class="setting-value" id="wordSpacingValue"></div>
</div>

<div class="setting">
<label>Line spacing</label>
<input
    id="lineSpacing"
    type="range"
    min="1"
    max="2"
    step=".05"
>
<div class="setting-value" id="lineSpacingValue"></div>
</div>

</div>
</div>


<!-- CHAT -->

<div class="category">

<button class="category-title">
    <span>💬 Chat</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Refresh rate</label>
<select id="refreshRate">
<option value="10000">10 seconds</option>
<option value="5000">5 seconds</option>
<option value="3000">3 seconds</option>
<option value="2000">2 seconds</option>
<option value="1000">1 second</option>
<option value="500">0.5 seconds</option>
<option value="100">0.1 seconds</option>
</select>
</div>

<div class="setting">
<label>Show timestamps</label>
<select id="showTimestamps">
<option value="true">On</option>
<option value="false">Off</option>
</select>
</div>

<div class="setting">
<label>Compact messages</label>
<select id="compactMessages">
<option value="false">Off</option>
<option value="true">On</option>
</select>
</div>

<div class="setting">
<label>Auto-scroll</label>
<select id="autoScroll">
<option value="true">On</option>
<option value="false">Off</option>
</select>
</div>

</div>
</div>


<!-- APPEARANCE -->

<div class="category">

<button class="category-title">
    <span>🎨 Appearance</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Theme</label>
<select id="themeSelect">
<option value="dark">Dark</option>
<option value="midnight">Midnight</option>
<option value="slate">Slate</option>
<option value="black">Pure Black</option>
<option value="blue">Dark Blue</option>
<option value="purple">Dark Purple</option>
<option value="green">Dark Green</option>
<option value="red">Dark Red</option>
<option value="gray">Classic Gray</option>
<option value="light">Light</option>
<option value="oled">OLED</option>
</select>
</div>

<div class="setting">
<label>Corner roundness</label>
<input
    id="cornerRadius"
    type="range"
    min="0"
    max="25"
>
<div class="setting-value" id="cornerRadiusValue"></div>
</div>

<div class="setting">
<label>UI scale</label>
<input
    id="uiScale"
    type="range"
    min=".8"
    max="1.2"
    step=".05"
>
<div class="setting-value" id="uiScaleValue"></div>
</div>

</div>
</div>


<!-- NOTIFICATIONS -->

<div class="category">

<button class="category-title">
    <span>🔔 Notifications</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Notification sound</label>
<select id="notificationSound">
<option value="false">Off</option>
<option value="true">On</option>
</select>
</div>

<div class="setting">
<label>Desktop notifications</label>
<select id="desktopNotifications">
<option value="false">Off</option>
<option value="true">On</option>
</select>
<div class="setting-help">
Notifications work while this page is open, including when the tab is in the background.
</div>
</div>

<div class="setting">
<label>Notification sound</label>
<select id="soundType">
<option value="windows">Windows</option>
<option value="ding">Ding</option>
<option value="pop">Pop</option>
<option value="bell">Bell</option>
<option value="double">Double</option>
<option value="digital">Digital</option>
<option value="soft">Soft</option>
<option value="alert">Alert</option>
<option value="chime">Chime</option>
<option value="pulse">Pulse</option>
<option value="alarm">Alarm</option>
<option value="opera">Opera</option>
</select>
</div>

<div class="setting">
<label>Notification volume</label>
<input
    id="notificationVolume"
    type="range"
    min="0"
    max="1"
    step=".01"
>
<div class="setting-value" id="notificationVolumeValue"></div>
</div>

<div class="setting">
<label>Notification duration</label>
<input
    id="notificationDuration"
    type="range"
    min="100"
    max="5000"
    step="100"
>
<div class="setting-value" id="notificationDurationValue"></div>
</div>

<button
    class="test-btn"
    id="testNotification"
>
    🔔 Test Windows notification
</button>

<div class="notification-preview">
    <div class="preview-title">
        💬 Chat
    </div>
    <div class="preview-text">
        This is what your notification will look like.
    </div>
</div>

</div>
</div>


<!-- BEHAVIOR -->

<div class="category">

<button class="category-title">
    <span>⚙️ Behavior</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Enter to send</label>
<select id="enterToSend">
<option value="true">On</option>
<option value="false">Off</option>
</select>
</div>

<div class="setting">
<label>Confirm before deleting</label>
<select id="confirmDelete">
<option value="true">On</option>
<option value="false">Off</option>
</select>
</div>

<div class="setting">
<label>Show new-message button</label>
<select id="showNewMessageButton">
<option value="true">On</option>
<option value="false">Off</option>
</select>
</div>

</div>
</div>


<!-- LINKS -->

<div class="category">

<button class="category-title">
    <span>🔗 Links & Media</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">

/* =========================================================
   NOTIFICATION PERMISSION
========================================================= */

async function requestNotificationPermission(){

    if(
        !("Notification" in window)
    ){
        return false;
    }

    if(Notification.permission==="granted"){
        return true;
    }

    if(Notification.permission==="denied"){
        return false;
    }

    try{

        const result=
            await Notification.requestPermission();

        return result==="granted";

    }catch(error){

        return false;

    }
}


/* =========================================================
   AUDIO ENGINE
========================================================= */

function getAudioContext(){

    if(!audioContext){

        const AudioContext=
            window.AudioContext||
            window.webkitAudioContext;

        if(!AudioContext){
            return null;
        }

        audioContext=
            new AudioContext();

    }

    if(audioContext.state==="suspended"){

        audioContext.resume().catch(()=>{});

    }

    return audioContext;
}


function tone(
    ctx,
    frequency,
    start,
    duration,
    volume,
    type="sine"
){

    const oscillator=
        ctx.createOscillator();

    const gain=
        ctx.createGain();

    oscillator.type=type;

    oscillator.frequency.setValueAtTime(
        frequency,
        start
    );

    gain.gain.setValueAtTime(
        0,
        start
    );

    gain.gain.linearRampToValueAtTime(
        volume,
        start+.01
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        start+duration
    );

    oscillator.connect(gain);

    gain.connect(ctx.destination);

    oscillator.start(start);

    oscillator.stop(
        start+duration+.03
    );
}


function playNotificationSound(type){

    if(!settings.notificationSound){
        return;
    }

    const ctx=getAudioContext();

    if(!ctx){
        return;
    }

    const now=ctx.currentTime;

    const volume=
        Math.max(
            .001,
            settings.notificationVolume
        );

    switch(type){

        case "windows":

            tone(ctx,659,now,.13,volume,"sine");
            tone(ctx,784,now+.09,.18,volume,"sine");

            break;


        case "ding":

            tone(ctx,880,now,.45,volume,"sine");

            break;


        case "pop":

            tone(ctx,240,now,.08,volume,"triangle");
            tone(ctx,520,now+.04,.12,volume,"triangle");

            break;


        case "bell":

            tone(ctx,700,now,.5,volume,"sine");
            tone(ctx,1050,now,.45,volume*.45,"sine");

            break;


        case "double":

            tone(ctx,720,now,.15,volume,"sine");
            tone(ctx,720,now+.2,.15,volume,"sine");

            break;


        case "digital":

            tone(ctx,950,now,.07,volume,"square");
            tone(ctx,1200,now+.08,.07,volume,"square");
            tone(ctx,1500,now+.16,.08,volume,"square");

            break;


        case "soft":

            tone(ctx,440,now,.4,volume*.5,"sine");
            tone(ctx,660,now+.1,.45,volume*.35,"sine");

            break;


        case "alert":

            tone(ctx,800,now,.18,volume,"square");
            tone(ctx,500,now+.2,.18,volume,"square");
            tone(ctx,800,now+.4,.18,volume,"square");

            break;


        case "chime":

            tone(ctx,523,now,.4,volume,"sine");
            tone(ctx,659,now+.12,.5,volume*.8,"sine");
            tone(ctx,784,now+.24,.6,volume*.6,"sine");

            break;


        case "pulse":

            tone(ctx,150,now,.12,volume,"sine");
            tone(ctx,300,now+.16,.12,volume,"sine");
            tone(ctx,600,now+.32,.12,volume,"sine");

            break;


        case "alarm":

            for(let i=0;i<7;i++){

                const f=
                    i%2===0
                    ?650
                    :950;

                tone(
                    ctx,
                    f,
                    now+i*.35,
                    .27,
                    volume,
                    "sawtooth"
                );

            }

            break;


        case "opera":

            /*
             * Original generated vocal-like
             * musical notification.
             */

            const notes=[
                392,
                440,
                523,
                494,
                523,
                659,
                587,
                523,
                440,
                392
            ];

            notes.forEach((f,i)=>{

                tone(
                    ctx,
                    f,
                    now+i*.18,
                    .3,
                    volume*.45,
                    "triangle"
                );

                tone(
                    ctx,
                    f*2,
                    now+i*.18,
                    .22,
                    volume*.12,
                    "sine"
                );

            });

            break;

    }
}


/* =========================================================
   WINDOWS-STYLE NOTIFICATION
========================================================= */

async function showWindowsNotification(
    username,
    message,
    isTest=false
){

    /*
     * Do not notify while the user is actively
     * looking at the page.
     */

    if(
        !isTest &&
        document.visibilityState==="visible"
    ){
        return;
    }


    if(settings.notificationSound){

        playNotificationSound(
            settings.soundType
        );

    }


    if(
        !settings.desktopNotifications ||
        !("Notification" in window)
    ){

        if(!isTest){
            showToast(
                username||"Chat",
                message||"New message"
            );
        }

        return;
    }


    let permission=
        Notification.permission;


    if(permission==="default"){

        permission=
            await requestNotificationPermission();

    }


    if(permission!=="granted"){

        showToast(
            username||"Chat",
            message||"New message"
        );

        return;
    }


    try{

        const notification=
            new Notification(
                username||"Chat",
                {
                    body:
                        message||
                        "Sent an image",
                    tag:
                        isTest
                        ?"chat-test"
                        :"chat-"+Date.now(),
                    renotify:true,
                    silent:true
                }
            );


        notification.onclick=()=>{

            window.focus();

            notification.close();

        };


        setTimeout(
            ()=>{
                try{
                    notification.close();
                }catch(e){}
            },
            Math.max(
                1000,
                settings.notificationDuration
            )
        );

    }catch(error){

        showToast(
            username||"Chat",
            message||"New message"
        );

    }

}

function showToast(title,text){

    const toast=
        document.createElement("div");

    toast.className="toast";

    const titleEl=
        document.createElement("div");

    titleEl.className="toast-title";

    titleEl.textContent=title;

    const textEl=
        document.createElement("div");

    textEl.className="toast-text";

    textEl.textContent=text;

    toast.appendChild(titleEl);

    toast.appendChild(textEl);

    toastContainer.appendChild(toast);

    setTimeout(()=>{

        toast.style.opacity="0";

        setTimeout(
            ()=>toast.remove(),
            250
        );

    },3500);

}

/* =========================================================
   IMAGE RESIZE
========================================================= */

function resizeImage(file){

    return new Promise(
        (resolve,reject)=>{

            const reader=
                new FileReader();

            reader.onload=()=>{

                const img=
                    new Image();

                img.onload=()=>{

                    let width=img.width;
                    let height=img.height;

                    const max=1500;

                    if(
                        width>max||
                        height>max
                    ){

                        const scale=
                            Math.min(
                                max/width,
                                max/height
                            );

                        width=
                            Math.round(
                                width*scale
                            );

                        height=
                            Math.round(
                                height*scale
                            );

                    }


                    const canvas=
                        document.createElement(
                            "canvas"
                        );

                    canvas.width=width;

                    canvas.height=height;

                    const ctx=
                        canvas.getContext("2d");

                    ctx.drawImage(
                        img,
                        0,
                        0,
                        width,
                        height
                    );

                    resolve(
                        canvas.toDataURL(
                            "image/jpeg",
                            .78
                        )
                    );

                };

                img.onerror=reject;

                img.src=reader.result;

            };

            reader.onerror=reject;

            reader.readAsDataURL(file);

        }
    );
}


/* =========================================================
   SEND
========================================================= */

sendBtn.onclick=sendMessage;


messageInput.addEventListener(
    "keydown",
    event=>{

        if(
            event.key==="Enter" &&
            !event.shiftKey &&
            settings.enterToSend
        ){

            event.preventDefault();

    }
);


async function sendMessage(){

    const text=
        messageInput.value.trim();


    if(!settings.username){

        settingsBtn.click();

        usernameInput.focus();

        alert(
            "Set your name in Settings first."
        );

        return;

    }


    if(!text&&!selectedFile){
        return;
    }


    sendBtn.disabled=true;


    try{

        let image=null;

        if(selectedFile){

            image=
                await resizeImage(
                    selectedFile
                );

        }


        const response=
            await fetch(
                API_URL,
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({

                        username:
                            settings.username,

                        channel:
                            CHANNEL,

                        message:
                            text,

                        image:
                            image,

                        device_id:
                            deviceId

                    })
                }
            );


        const data=
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error||
                "Failed to send message."
            );

        }


        messageInput.value="";

        messageInput.style.height=
            "auto";

        selectedFile=null;

        imageInput.value="";

        attachBtn.textContent="＋";


        await loadMessages();


    }catch(error){

        alert(
            "Failed to send:\n\n"+
            error.message
        );

    }finally{

        sendBtn.disabled=false;

    }

}


/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages(){

    try{

        const response=
            await fetch(
                API_URL+
                "?channel="+
                encodeURIComponent(
                    CHANNEL
                ),
                {
                    cache:"no-store"
                }
            );


        const data=
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error||
                "Failed to load messages."
            );

        }


        const newMessages=
            Array.isArray(data.messages)
            ?data.messages
            :[];


        /*
         * Detect new messages.
         */

        if(!firstLoad){

            const newOnes=
                newMessages.filter(
                    message=>
                        message.id &&
                        !knownMessageIds.has(
                            String(message.id)
                        )
                );


            const foreignNewOnes=
                newOnes.filter(
                    message=>
                        message.device_id!==
                        deviceId
                );


            if(foreignNewOnes.length){

                const latest=
                    foreignNewOnes[
                        foreignNewOnes.length-1
                    ];


                /*
                 * Notification ONLY when
                 * the site is open but not
                 * currently being viewed.
                 */

                if(
                    document.visibilityState!==
                    "visible"
                ){

                    showWindowsNotification(
                        latest.username||
                            "New message",
                        latest.message||
                            "Sent an image"
                    );

                }

            }

        }


        currentMessages=
            newMessages;


        knownMessageIds.clear();

        currentMessages.forEach(
            message=>{

                if(message.id){

                    knownMessageIds.add(
                        String(message.id)
                    );

                }

            }
        );


        firstLoad=false;


        setConnection(true);

        renderMessages();


    }catch(error){

        setConnection(false);


        messagesEl.innerHTML=`
            <div class="empty">
                <div>
                    <strong>
                        Unable to load messages
                    </strong>
                    ${escapeHtml(
                        error.message
                    )}
                </div>
            </div>
        `;

    }

}

/* =========================================================
   LINK PARSER
========================================================= */

function createMessageText(text){

    const wrapper=
        document.createElement("div");

    wrapper.className="message-text";


    if(!settings.clickableLinks){

        wrapper.textContent=text;

        return wrapper;

    }


    const urlRegex=
        /(https?:\/\/[^\s<]+)/gi;

    let lastIndex=0;

    let match;


    while(
        (match=urlRegex.exec(text))!==null
    ){

        const before=
            text.slice(
                lastIndex,
                match.index
            );

        if(before){

            wrapper.appendChild(
                document.createTextNode(
                    before
                )
            );

        }


        let url=
            match[0];

        let punctuation="";


        while(
            /[.,!?;:)]+$/.test(url)
        ){

            punctuation=
                url.slice(-1)+
                punctuation;

            url=
                url.slice(0,-1);

        }


        const link=
            document.createElement("a");

        link.href=url;

        link.target="_blank";

        link.rel="noopener noreferrer";

        link.textContent=url;

        wrapper.appendChild(link);


        if(punctuation){

            wrapper.appendChild(
                document.createTextNode(
                    punctuation
                )
            );

        }


        lastIndex=
            match.index+
            match[0].length;

    }


    if(lastIndex<text.length){

        wrapper.appendChild(
            document.createTextNode(
                text.slice(lastIndex)
            )
        );

    }


    return wrapper;

}


/* =========================================================
   URL IMAGE PREVIEW
========================================================= */

function addURLPreview(
    content,
    text
){

    if(
        !settings.imagePreviews
    ){
        return;
    }


    const regex=
        /(https?:\/\/[^\s<]+)/gi;

    const matches=
        text.match(regex)||[];


    matches.forEach(raw=>{

        const url=
            raw.replace(
                /[.,!?;:)]+$/,
                ""
            );


        if(
            !settings.gifPreviews &&
            /\.gif(\?|$)/i.test(url)
        ){
            return;
        }


        if(
            !/\.(png|jpe?g|gif|webp|bmp)(\?|$)/i
                .test(url)
        ){
            return;
        }


        const img=
            document.createElement("img");

        img.className=
            "message-image";

        img.src=url;

        img.alt="Linked image";

        img.loading="lazy";

        img.onclick=()=>{
            openImage(url);
        };

        img.onerror=()=>{
            img.remove();
        };

        content.appendChild(img);

    });

}


/* =========================================================
   RENDER
========================================================= */

function renderMessages(){

    const wasBottom=
        messagesEl.scrollHeight-
        messagesEl.scrollTop-
        messagesEl.clientHeight<
        100;


    const search=
        searchInput.value
        .trim()
        .toLowerCase();


    let filtered=
        currentMessages;


    if(search){

        filtered=
            currentMessages.filter(
                message=>
                    String(
                        message.username||""
                    )
                    .toLowerCase()
                    .includes(search)||
                    String(
                        message.message||""
                    )
                    .toLowerCase()
                    .includes(search)
            );

    }


    if(!filtered.length){

        messagesEl.innerHTML=`

            <div class="empty">

                <div>

                    <strong>
                        ${
                            search
                            ?"No matching messages"
                            :"No messages yet"
                        }
                    </strong>

                    ${
                        search
                        ?"Try another search."
                        :"Be the first to send something."
                    }

                </div>

            </div>
        `;

        return;

    }


    const fragment=
        document.createDocumentFragment();


    filtered.forEach(message=>{

        const item=
            document.createElement("div");

        item.className="message";

        if(settings.compactMessages){

            item.classList.add(
                "compact"
            );

        }


        item.dataset.id=
            message.id;


        const avatar=
            document.createElement("div");

        avatar.className="avatar";

        avatar.textContent=
            (message.username||"?")
            .charAt(0)
            .toUpperCase();


        const content=
            document.createElement("div");

        content.className=
            "message-content";


        const top=
            document.createElement("div");

        top.className="message-top";


        const name=
            document.createElement("span");

        name.className="username";

        name.textContent=
            message.username||
            "User";

        top.appendChild(name);


        if(settings.showTimestamps){

            const time=
                document.createElement("span");

            time.className="time";

            time.textContent=
                formatTime(
                    message.created_at
                );

            top.appendChild(time);

        }


        if(message.edited){

            const edited=
                document.createElement("span");

            edited.className="edited";

            edited.textContent=
                "(edited)";

            top.appendChild(edited);

        }


        content.appendChild(top);


        if(message.message){

            const text=
                createMessageText(
                    message.message
                );

            content.appendChild(text);

            addURLPreview(
                content,
                message.message
            );

        }


        if(message.image){

            const img=
                document.createElement("img");

            img.className=
                "message-image";

            img.src=
                message.image;

            img.alt="Image";

            img.loading="lazy";

            img.onclick=()=>{

                openImage(
                    message.image
                );

            };

            content.appendChild(img);

        }


        item.appendChild(avatar);

        item.appendChild(content);


        /*
         * Only the owner gets the
         * edit/delete context menu.
         */

        if(
            message.device_id &&
            message.device_id===deviceId
        ){

            item.addEventListener(
                "contextmenu",
                event=>{

                    event.preventDefault();

                    showContextMenu(
                        event.clientX,
                        event.clientY,
                        message
                    );

                }
            );

        }


        fragment.appendChild(item);

    });


    messagesEl.replaceChildren(
        fragment
    );


    if(
        wasBottom &&
        settings.autoScroll
    ){

        messagesEl.scrollTop=
            messagesEl.scrollHeight;

    }

}


/* =========================================================
   CONTEXT MENU
========================================================= */

function showContextMenu(
    x,
    y,
    message
){

    selectedMessage=message;


    contextMenu.style.left=
        Math.min(
            x,
            window.innerWidth-170
        )+"px";


    contextMenu.style.top=
        Math.min(
            y,
            window.innerHeight-100
        )+"px";


    contextMenu.classList.add(
        "show"
    );

}

    "click",
    ()=>{
        contextMenu.classList.remove(
            "show"
        );
    }
);

    contextMenu.classList.remove(
        "show"

        return;
    }


    const newText=
        prompt(
            "Edit message:",

    if(newText===null){
        return;
    }


    try{

        const response=
            await fetch(
                API_URL,
                {
                    method:"PATCH",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({

                        id:
                            selectedMessage.id,

                        device_id:
                            deviceId,

                        message:
                            newText.trim()

                    })
                }
            );


        const data=
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error||
                "Failed to edit message."
            );

        }


        await loadMessages();


    }catch(error){

        alert(
            "Failed to edit:\n\n"+

        );

    }

};

/* =========================================================
   HELPERS
========================================================= */

function formatTime(date){

    if(!date){
        return "";
    }


    const parsed=
        new Date(date);


    if(
        Number.isNaN(
            parsed.getTime()
        )
    ){

        return "";

    }


    return parsed.toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


function escapeHtml(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}
