<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

</head>
<body>
<div id="startupScreen" aria-hidden="true"><div class="startup-inner"><div class="startup-icon">🎮</div><h1 class="startup-title">Game Chat</h1><div class="startup-subtitle">Connecting to your games...</div><div class="startup-loader"></div></div></div>
<div class="app">
<header class="header"><div class="logo"><div class="logo-icon">🎮</div><span>Game Chat</span><span class="channel"># public</span></div><div class="header-actions"><button class="icon-btn" id="screenShareBtn" title="Live TV / Screen Share" aria-label="Live TV / Screen Share">📺</button><button class="icon-btn" id="gamesBtn" title="Games" aria-label="Games">🎮</button><button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">⚙</button></div></header>
<main class="messages" id="messages"></main>
<div class="composer"><div class="composer-box"><button class="games-composer-btn" id="gamesComposerBtn" title="Games" aria-label="Games">🎮</button><button class="attach-btn" id="attachBtn" title="Attach files">📎</button><button class="attach-btn voice-btn" id="voiceBtn" title="Record voice message" aria-label="Record voice message">🎙️</button><input type="file" id="fileInput" accept="image/*,video/*,*/*" multiple style="display:none"><div class="file-preview" id="filePreview"></div><div class="voice-recording-status" id="voiceStatus"><span class="voice-dot"></span><span id="voiceStatusText">Recording 0:00</span></div><textarea id="messageInput" rows="1" placeholder="Message Public Chat · "></textarea><button class="send-btn" id="sendBtn">Send</button></div></div></div>
<div class="overlay" id="gamesOverlay"><div class="panel"><div class="panel-header"><h2>🎮 Games</h2><button class="icon-btn" id="closeGames">×</button></div><div class="panel-body"><p style="color:#929aa5;line-height:1.5">All games are single-player. You play against local bots.</p><div class="game-grid"></div></div></div></div>
<div class="overlay" id="settingsOverlay"><div class="panel"><div class="panel-header"><h2>Settings</h2><button class="icon-btn" id="closeSettings">×</button></div><div class="panel-body"><div class="category open"><button class="category-title"><span>👤 Profile</span><span>⌄</span></button><div class="category-body"><div class="setting"><label>Your name</label><input id="usernameInput" maxlength="24" placeholder="Enter your name"></div><div class="setting"><label>Profile picture</label><input id="profilePictureInput" type="file" accept="image/*"><img id="profilePicturePreview" class="profile-preview" alt="Profile picture preview"></div><div class="setting"><label>Device ID</label><input id="deviceIdInput" readonly></div></div></div><div class="category"><button class="category-title"><span>📝 Text</span><span>⌄</span></button><div class="category-body"><div class="setting"><label>Text size</label><input id="textSize" type="range" min="12" max="24" value="16"><div class="setting-value" id="textSizeValue"></div></div><div class="setting"><label>Word spacing</label><input id="wordSpacing" type="range" min="0" max="12" value="0"><div class="setting-value" id="wordSpacingValue"></div></div><div class="setting"><label>Line spacing</label><input id="lineSpacing" type="range" min="1" max="2" step=".05" value="1.45"><div class="setting-value" id="lineSpacingValue"></div></div></div></div><div class="category"><button class="category-title"><span>💬 Chat</span><span>⌄</span></button><div class="category-body"><div class="setting"><label>Show timestamps</label><select id="showTimestamps"><option value="true">On</option><option value="false">Off</option></select></div></div></div><div class="category"><button class="category-title"><span>🎨 Appearance</span><span>⌄</span></button><div class="category-body"><div class="setting"><label>Theme</label><select id="themeSelect"><option value="dark">Dark</option><option value="midnight">Midnight</option><option value="slate">Slate</option><option value="black">Pure Black</option><option value="blue">Dark Blue</option><option value="purple">Dark Purple</option><option value="green">Dark Green</option><option value="red">Dark Red</option><option value="gray">Classic Gray</option><option value="light">Light</option><option value="oled">OLED</option></select></div><div class="setting"><label>Corner roundness</label><input id="cornerRadius" type="range" min="0" max="25" value="12"><div class="setting-value" id="cornerRadiusValue"></div></div><div class="setting"><label>UI scale</label><input id="uiScale" type="range" min=".8" max="1.2" step=".05" value="1"><div class="setting-value" id="uiScaleValue"></div></div></div></div><div class="category"><button class="category-title"><span>⚙️ Behavior</span><span>⌄</span></button><div class="category-body"><div class="setting"><label>Enter to send</label><select id="enterToSend"><option value="true">On</option><option value="false">Off</option></select></div><div class="setting"><label>Auto-scroll</label><select id="autoScroll"><option value="true">On</option><option value="false">Off</option></select></div><input id="refreshRate" type="hidden" value="50"></div></div><button class="save-btn" id="saveSettings">Save settings</button></div></div></div>
<div class="overlay" id="confirmOverlay"><div class="panel"><div class="panel-header"><h2 id="confirmTitle">Confirm</h2></div><div class="panel-body"><p id="confirmText" style="color:#9da5b0;line-height:1.5"></p><div class="game-actions"><button class="game-btn" id="confirmCancel">Cancel</button><button class="game-btn danger" id="confirmYes">Confirm</button></div></div></div></div>

<!-- Delay all Supabase/API network requests for 1 second on startup. -->
<script>
(function(){
    'use strict';
    const originalFetch = window.fetch.bind(window);
    const startedAt = Date.now();
    const wait = new Promise(resolve => setTimeout(resolve, 1000));
    window.chatServerStartupReady = wait;

    window.fetch = function(input, init){
        const url = typeof input === 'string' ? input : (input && input.url) || '';
        const isChatServer = url.includes('/api/messages') || url.includes('iecpzrqvvuyghybchpva.supabase.co');
        if (!isChatServer) return originalFetch(input, init);
        const remaining = Math.max(0, 1000 - (Date.now() - startedAt));
        return (remaining ? new Promise(resolve => setTimeout(resolve, remaining)) : Promise.resolve())
            .then(() => originalFetch(input, init));
    };
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-chat.js"></script>
<script src="games.js"></script><script src="app.js"></script><script src="game-message-mode.js"></script><script src="games-ui.js"></script><script src="game-settings.js"></script><script src="chat-features.js"></script><script src="global-background.js"></script><script src="solo-player-fix.js"></script><script src="singleplayer-games.js"></script><script src="screen-share.js"></script><script src="ui-animations.js"></script>
<script>
(function(){const btn=document.getElementById('screenShareBtn');if(!btn)return;btn.addEventListener('click',function(){if(typeof window.openScreenShare==='function'){window.openScreenShare();return;}let tries=0;const timer=setInterval(()=>{if(typeof window.openScreenShare==='function'){clearInterval(timer);window.openScreenShare();return;}const card=document.querySelector('.ss-card');if(card){clearInterval(timer);card.click();return;}if(++tries>=40)clearInterval(timer);},100);});})();
</script>
<script>
(function(){
    'use strict';
    const API_URL='/api/messages';
    const getDeviceId=()=>localStorage.getItem('chat_device_id')||'';
    let messageMap=new Map();
    let loading=false;

    const style=document.createElement('style');
    style.textContent=`
      .own-message-actions{position:absolute;top:8px;right:8px;z-index:20}
      .message-actions-trigger{width:30px;height:30px;border:0;border-radius:8px;background:rgba(0,0,0,.28);color:inherit;cursor:pointer;font-size:18px;line-height:1;opacity:.72}
      .message-actions-trigger:hover,.own-message-actions.open .message-actions-trigger{opacity:1;background:rgba(0,0,0,.48)}
      .message-actions-menu{position:absolute;top:34px;right:0;min-width:120px;padding:5px;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:#20242b;box-shadow:0 10px 28px rgba(0,0,0,.35);display:none}
      .own-message-actions.open .message-actions-menu{display:block}
      .message-actions-menu button{display:block;width:100%;padding:9px 10px;border:0;border-radius:7px;background:transparent;color:#f1f3f5;text-align:left;cursor:pointer;font:inherit}
      .message-actions-menu button:hover{background:rgba(255,255,255,.08)}
      .message-actions-menu .delete-action{color:#ff7272}
    `;
    document.head.appendChild(style);

    async function loadOwnership(){
        if(loading)return;
        loading=true;
        try{
            const r=await fetch(API_URL,{cache:'no-store'});
            if(!r.ok)return;
            const data=await r.json();
            const rows=Array.isArray(data)?data:(data.messages||data.data||[]);
            const next=new Map();
            rows.forEach(row=>{if(row&&row.id)next.set(String(row.id),row)});
            messageMap=next;
            applyMenus();
        }catch(e){console.warn('Message actions sync failed:',e)}
        finally{loading=false}
    }

    function applyMenus(){
        const root=document.getElementById('messages');
        const device=getDeviceId();
        if(!root||!device)return;
        root.querySelectorAll('[data-id]').forEach(el=>{
            const id=String(el.getAttribute('data-id')||'');
            if(!id||id.startsWith('game_'))return;
            const row=messageMap.get(id);
            const own=!!row&&String(row.device_id||'')===device&&!row.game_message;
            const existing=el.querySelector(':scope > .own-message-actions');
            if(!own){if(existing)existing.remove();return}
            if(existing)return;
            if(getComputedStyle(el).position==='static')el.style.position='relative';

            const actions=document.createElement('div');
            actions.className='own-message-actions';
            const trigger=document.createElement('button');
            trigger.type='button';trigger.className='message-actions-trigger';trigger.textContent='⋯';trigger.title='Message options';
            const menu=document.createElement('div');menu.className='message-actions-menu';
            const edit=document.createElement('button');edit.type='button';edit.textContent='Edit';
            const del=document.createElement('button');del.type='button';del.textContent='Delete';del.className='delete-action';

            trigger.onclick=e=>{
                e.stopPropagation();
                document.querySelectorAll('.own-message-actions.open').forEach(x=>{if(x!==actions)x.classList.remove('open')});
                actions.classList.toggle('open');
            };
            edit.onclick=async e=>{e.stopPropagation();actions.classList.remove('open');await editMessage(id,row)};
            del.onclick=async e=>{e.stopPropagation();actions.classList.remove('open');await deleteMessage(id,row)};
            menu.append(edit,del);actions.append(trigger,menu);el.appendChild(actions);
        });
    }

    async function editMessage(id,row){
        if(!row||String(row.device_id||'')!==getDeviceId())return;
        const oldText=String(row.message||'');
        const next=window.prompt('Edit message',oldText);
        if(next===null)return;
        const message=next.trim();
        if(!message){alert('Message cannot be empty.');return}
        if(message===oldText)return;
        const r=await fetch(API_URL,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,message,device_id:getDeviceId()})});
        if(!r.ok){alert('Could not edit this message.');return}
        await loadOwnership();
    }

    async function deleteMessage(id,row){
        if(!row||String(row.device_id||'')!==getDeviceId())return;
        if(!window.confirm('Delete this message?'))return;
        const r=await fetch(API_URL,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,device_id:getDeviceId()})});
        if(!r.ok){alert('Could not delete this message.');return}
        await loadOwnership();
    }

    document.addEventListener('click',e=>{
        if(!e.target.closest('.own-message-actions'))document.querySelectorAll('.own-message-actions.open').forEach(x=>x.classList.remove('open'));
    });

    const observer=new MutationObserver(()=>applyMenus());
    observer.observe(document.documentElement,{childList:true,subtree:true});
    window.addEventListener('load',()=>{loadOwnership();setInterval(loadOwnership,1500)});
})();
</script>
</body></html>
