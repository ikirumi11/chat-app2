<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat - Games & P2P Chat</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="ui-polish.css">
<link rel="stylesheet" href="ui-animations.css">
<style>
/* Screen Share is opened from the TV button, not the Games menu. */
#gamesOverlay .ss-card{display:none!important}
</style>
</head>
<body>
<div id="startupScreen" aria-hidden="true"><div class="startup-inner"><div class="startup-icon">🎮</div><h1 class="startup-title">Game Chat</h1><div class="startup-subtitle">Connecting to your games...</div><div class="startup-loader"></div></div></div>
<div class="app">
<header class="header"><div class="logo"><div class="logo-icon">🎮</div><span>Game Chat</span><span class="channel"># public</span></div><div class="header-actions"><button class="icon-btn" id="screenShareBtn" title="Live TV / Screen Share" aria-label="Live TV / Screen Share">📺</button><button class="icon-btn" id="gamesBtn" title="Games" aria-label="Games">🎮</button><button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">⚙</button></div></header>
<main class="messages" id="messages"></main>
<div class="composer"><div class="composer-box"><button class="games-composer-btn" id="gamesComposerBtn" title="Games" aria-label="Games">🎮</button><button class="attach-btn" id="attachBtn" title="Attach files">📎</button><button class="attach-btn voice-btn" id="voiceBtn" title="Record voice message" aria-label="Record voice message">🎙️</button><input type="file" id="fileInput" accept="image/*,video/*,*/*" multiple style="display:none"><div class="file-preview" id="filePreview"></div><div class="voice-recording-status" id="voiceStatus"><span class="voice-dot"></span><span id="voiceStatusText">Recording 0:00</span></div><textarea id="messageInput" rows="1" placeholder="Message Public Chat · "></textarea><button class="send-btn" id="sendBtn">Send</button></div></div></div>
<div class="overlay" id="gamesOverlay"><div class="panel"><div class="panel-header"><h2>🎮 Games</h2><button class="icon-btn" id="closeGames">×</button></div><div class="panel-body"><p style="color:#929aa5;line-height:1.5">All games are single-player. You play against local bots.</p><div class="game-grid"></div></div></div></div>
<div class="overlay" id="settingsOverlay"><div class="panel"><div class="panel-header"><h2>Settings</h2><button class="icon-btn" id="closeSettings">×</button></div><div class="panel-body"><div class="category open"><button class="category-title"><span>👤 Profile</span><span>⌄</span></button><div class="category-body"><div class="setting"><label>Your name</label><input id="usernameInput" maxlength="24" placeholder="Enter your name"></div><div class="setting"><label>Profile picture</label><input id="profilePictureInput" type="file" accept="image/*"><img id="profilePicturePreview" class="profile-preview" alt="Profile picture preview"></div><div class="setting"><label>Device ID</label><input id="deviceIdInput" readonly></div></div></div><div class="category"><button class="category-title"><span>📝 Text</span><span>⌄</span></button><div class="category-body"><div class="setting"><label>Text size</label><input id="textSize" type="range" min="12" max="24" value="16"><div class="setting-value" id="textSizeValue"></div></div><div class="setting"><label>Word spacing</label><input id="wordSpacing" type="range" min="0" max="12" value="0"><div class="setting-value" id="wordSpacingValue"></div></div><div class="setting"><label>Line spacing</label><input id="lineSpacing" type="range" min="1" max="2" step=".05" value="1.45"><div class="setting-value" id="lineSpacingValue"></div></div></div></div><div class="category"><button class="category-title"><span>💬 Chat</span><span>⌄</span></button><div class="category-body"><div class="setting"><label>Show timestamps</label><select id="showTimestamps"><option value="true">On</option><option value="false">Off</option></select></div></div></div><div class="category"><button class="category-title"><span>🎨 Appearance</span><span>⌄</span></button><div class="category-body"><div class="setting"><label>Theme</label><select id="themeSelect"><option value="dark">Dark</option><option value="midnight">Midnight</option><option value="slate">Slate</option><option value="black">Pure Black</option><option value="blue">Dark Blue</option><option value="purple">Dark Purple</option><option value="green">Dark Green</option><option value="red">Dark Red</option><option value="gray">Classic Gray</option><option value="light">Light</option><option value="oled">OLED</option></select></div><div class="setting"><label>Corner roundness</label><input id="cornerRadius" type="range" min="0" max="25" value="12"><div class="setting-value" id="cornerRadiusValue"></div></div><div class="setting"><label>UI scale</label><input id="uiScale" type="range" min=".8" max="1.2" step=".05" value="1"><div class="setting-value" id="uiScaleValue"></div></div></div></div><div class="category"><button class="category-title"><span>⚙️ Behavior</span><span>⌄</span></button><div class="category-body"><div class="setting"><label>Enter to send</label><select id="enterToSend"><option value="true">On</option><option value="false">Off</option></select></div><div class="setting"><label>Auto-scroll</label><select id="autoScroll"><option value="true">On</option><option value="false">Off</option></select></div><input id="refreshRate" type="hidden" value="500"></div></div><button class="save-btn" id="saveSettings">Save settings</button><div class="danger-zone"><div class="danger-title">⚠ Danger Zone</div><p>Remove normal chat messages only from this device. Other people keep their local copies.</p><button class="danger-btn" id="removeEverything">Remove everything locally</button><button class="danger-btn" id="wipeProfilesBtn" style="margin-top:8px">Wipe saved usernames &amp; profile pictures</button></div></div></div></div>
<div class="overlay" id="confirmOverlay"><div class="panel"><div class="panel-header"><h2 id="confirmTitle">Confirm</h2></div><div class="panel-body"><p id="confirmText" style="color:#9da5b0;line-height:1.5"></p><div class="game-actions"><button class="game-btn" id="confirmCancel">Cancel</button><button class="game-btn danger" id="confirmYes">Confirm</button></div></div></div></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="p2p-chat.js"></script>
<script src="google-sites-storage-client.js"></script>
<script src="local-save-verification.js"></script>
<script src="local-save-state.js"></script>
<script src="p2p-compat.js"></script>
<script src="games.js"></script><script src="app.js"></script><script src="game-message-mode.js"></script><script src="games-ui.js"></script><script src="game-settings.js"></script><script src="chat-features.js"></script><script src="global-background.js"></script><script src="solo-player-fix.js"></script><script src="profile-cache.js"></script><script src="singleplayer-games.js"></script><script src="game-settings-persistence.js"></script><script src="screen-share.js"></script><script src="ui-animations.js"></script>
<script src="chat-export.js"></script>
<script>
(function(){
  const btn=document.getElementById('screenShareBtn');
  if(!btn)return;
  btn.addEventListener('click',function(){
    if(typeof window.openScreenShare==='function'){window.openScreenShare();return;}
    let tries=0;
    const timer=setInterval(()=>{
      if(typeof window.openScreenShare==='function'){clearInterval(timer);window.openScreenShare();return;}
      const card=document.querySelector('.ss-card');
      if(card){clearInterval(timer);card.click();return;}
      if(++tries>=40)clearInterval(timer);
    },100);
  });
})();
</script>
</body></html>
