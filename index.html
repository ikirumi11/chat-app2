            game.maxHP ||
            100000000
        );

    const hp =
        Math.max(
            0,
            Number(
                game.hp ??
                maxHP
            )
        );

    fill.style.width =
        (
            hp /
            maxHP *
            100
        ) + "%";

    const hpText =
        document.createElement(
            "div"
        );

    hpText.className =
        "boss-health-text";

    hpText.textContent =
        hp.toLocaleString() +
        " / " +
        maxHP.toLocaleString();

    bar.appendChild(fill);
    bar.appendChild(hpText);

    const stats =
        document.createElement(
            "div"
        );

    stats.className =
        "boss-stats";

    stats.innerHTML =
        "<span>HP <strong>" +
        hp.toLocaleString() +
        "</strong></span>" +
        "<span>Players <strong>" +
        (game.players?.length || 0) +
        "</strong></span>";

    const damage =
        document.createElement(
            "div"
        );

    damage.className =
        "boss-damage-display";

    damage.textContent =
        "⚔ " +
        Number(
            game.lastDamage || 0
        ).toLocaleString();

    area.appendChild(name);
    area.appendChild(bar);
    area.appendChild(stats);
    area.appendChild(damage);

    container.appendChild(area);
}


/* =========================================================
   CREATE GAME
========================================================= */

document
    .querySelectorAll(".game-choice")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                const type =
                    button.dataset.game;

                createGame(type);

            }
        );

    });


async function createGame(
    gameType
){

    const type =
        GAME_TYPES[gameType];

    if(!type){
        return;
    }

    const username =
        settings.username.trim();

    if(!username){

        gamesOverlay.classList.remove(
            "show"
        );

        settingsOverlay.classList.add(
            "show"
        );

        loadSettingsUI();

        usernameInput.focus();

        toast(
            "Set your name first"
        );

        return;
    }

    const gameId =
        "game_" +
        Date.now().toString(36) +
        "_" +
        Math.random()
            .toString(36)
            .slice(2,8);

    const player = {

        deviceId,

        name:username,

        symbol:
            gameType.startsWith("ttt")
                ? "X"
                : null
    };

    const game = {

        type:"game",

        gameId,

        gameType,

        hostDeviceId:deviceId,

        hostName:username,

        state:"lobby",

        players:[player],

        heartbeat:Date.now(),

        createdAt:Date.now(),

        actions:[]
    };

    if(
        gameType.startsWith("ttt")
    ){

        const size =
            type.size;

        game.board =
            Array(
                size * size
            ).fill("");

        game.turnDeviceId =
            deviceId;

        game.turnName =
            username;

    }

    if(gameType === "boss"){

        game.maxHP =
            100000000;

        game.hp =
            100000000;

        game.bossName =
            "THE UNKNOWN";

    }

    if(gameType === "type"){

        game.sentence =
            TYPE_SENTENCES[
                Math.floor(
                    Math.random() *
                    TYPE_SENTENCES.length
                )
            ];

    }

    try{

        await apiRequest(
            "POST",
            {
                username:
                    GAME_SERVER_USERNAME,

                channel:CHANNEL,

                message:
                    JSON.stringify(
                        game
                    ),

                device_id:
                    deviceId,

                game_server:true
            }
        );

        gamesOverlay.classList.remove(
            "show"
        );

        await syncMessages(true);

        toast(
            "Game created"
        );

    }catch(error){

        console.error(error);

        toast(
            "Could not create game"
        );

    }

}


/* =========================================================
   JOIN GAME
========================================================= */

async function joinGame(
    serverMessage,
    game
){

    if(
        game.state !== "lobby"
    ){
        return;
    }

    if(
        game.players.some(
            p =>
                p.deviceId ===
                deviceId
        )
    ){
        return;
    }

    const type =
        GAME_TYPES[
            game.gameType
        ];

    if(
        game.players.length >=
        type.max
    ){
        return;
    }

    /*
     The supplied API only allows the host
     to PATCH the game state.

     We use a lightweight local join request.
     The host browser can pick it up if the
     game state is extended by the host.

     To make normal lobby joining work with
     the provided API, the join request is
     sent as a normal chat message with a
     reserved prefix.
    */

    const request = {

        type:"game_join_request",

        gameId:
            game.gameId,

        gameType:
            game.gameType,

        deviceId,

        name:
            settings.username
    };

    try{

        await apiRequest(
            "POST",
            {
                username:
                    GAME_SERVER_USERNAME,

                channel:CHANNEL,

                message:
                    "__GAME_JOIN__:" +
                    JSON.stringify(
                        request
                    ),

                device_id:
                    deviceId,

                game_server:true
            }
        );

        toast(
            "Join request sent"
        );

    }catch(error){

        console.error(error);

        toast(
            "Could not join game"
        );

    }

}


/* =========================================================
   LEAVE GAME
========================================================= */

async function leaveGame(
    serverMessage,
    game
){

    /*
     Only the host can update/delete
     a game with the supplied API.

     For host:
     remove immediately.

     For non-host:
     send leave request to host.
    */

    if(
        game.hostDeviceId ===
        deviceId
    ){

        await removeGame(
            serverMessage,
            game
        );

        return;

    }

    try{

        await apiRequest(
            "POST",
            {
                username:
                    GAME_SERVER_USERNAME,

                channel:CHANNEL,

                message:
                    "__GAME_LEAVE__:" +
                    JSON.stringify({
                        gameId:
                            game.gameId,

                        deviceId,

                        name:
                            settings.username
                    }),

                device_id:
                    deviceId,

                game_server:true
            }
        );

        toast(
            "Leave request sent"
        );

    }catch(error){

        toast(
            "Could not leave game"
        );

    }

}


/* =========================================================
   START GAME
========================================================= */

async function startGame(
    serverMessage,
    game
){

    if(
        game.hostDeviceId !==
        deviceId
    ){
        return;
    }

    const type =
        GAME_TYPES[
            game.gameType
        ];

    if(
        game.players.length <
        type.min
    ){

        toast(
            "Not enough players"
        );

        return;

    }

    game.state =
        "playing";

    game.startedAt =
        Date.now();

    game.heartbeat =
        Date.now();

    if(
        game.gameType ===
        "reaction"
    ){

        game.reactionGo =
            false;

        game.reactionStart =
            0;

        scheduleReactionGo(
            serverMessage.id,
            game
        );

    }

    if(
        game.gameType ===
        "type"
    ){

        game.typeStart =
            Date.now();

    }

    if(
        game.gameType ===
        "boss"
    ){

        game.hp =
            game.maxHP ||
            100000000;

    }

    await updateGame(
        serverMessage.id,
        game
    );

}


/* =========================================================
   REACTION START
========================================================= */

function scheduleReactionGo(
    messageId,
    game
){

    const delay =
        1000 +
        Math.random() *
        3000;

    const timer =
        setTimeout(
            async () => {

                game.reactionGo =
                    true;

                game.reactionStart =
                    Date.now();

                const found =
                    games.find(
                        x =>
                            String(
                                x.serverId
                            ) ===
                            String(
                                messageId
                            )
                    );

                if(found){

                    await updateGame(
                        messageId,
                        game
                    );

                }

            },
            delay
        );

    reactionTimers.set(
        messageId,
        timer
    );

}


/* =========================================================
   UPDATE GAME
========================================================= */

async function updateGame(
    messageId,
    game
){

    if(
        game.hostDeviceId !==
        deviceId
    ){
        return;
    }

    game.heartbeat =
        Date.now();

    try{

        await apiRequest(
            "PATCH",
            {
                id:
                    messageId,

                device_id:
                    deviceId,

                game_server:true,

                game_state:
                    JSON.stringify(
                        game
                    )
            }
        );

    }catch(error){

        console.error(
            "Game update failed",
            error
        );

    }

}


/* =========================================================
   GAME HEARTBEAT
========================================================= */

function startGameHeartbeat(
    serverMessage,
    game
){

    const id =
        String(
            serverMessage.id
        );

    if(
        game.hostDeviceId !==
        deviceId
    ){
        return;
    }

    if(
        gameHeartbeatTimers.has(id)
    ){
        return;
    }

    const timer =
        setInterval(
            async () => {

                /*
                 Stop if game is no longer
                 in our current list.
                */

                const current =
                    games.find(
                        g =>
                            String(
                                g.serverId
                            ) === id
                    );

                if(!current){

                    clearInterval(timer);

                    gameHeartbeatTimers.delete(
                        id
                    );

                    return;

                }

                const state =
                    current.game;

                if(
                    state.state ===
                    "finished"
                ){

                    clearInterval(timer);

                    gameHeartbeatTimers.delete(
                        id
                    );

                    return;

                }

                state.heartbeat =
                    Date.now();

                await updateGame(
                    id,
                    state
                );

            },
            2000
        );

    gameHeartbeatTimers.set(
        id,
        timer
    );

}


/* =========================================================
   STOP GAME HEARTBEAT
========================================================= */

function stopGameHeartbeat(
    id
){

    const timer =
        gameHeartbeatTimers.get(
            String(id)
        );

    if(timer){

        clearInterval(timer);

        gameHeartbeatTimers.delete(
            String(id)
        );

    }

}


/* =========================================================
   REMOVE GAME
========================================================= */

async function removeGame(
    serverMessage,
    game
){

    if(
        game.hostDeviceId !==
        deviceId
    ){

        toast(
            "Only the host can remove the game"
        );

        return;

    }

    stopGameHeartbeat(
        serverMessage.id
    );

    try{

        await apiRequest(
            "DELETE",
            {
                id:
                    serverMessage.id,

                device_id:
                    deviceId,

                game_server:true
            }
        );

        await syncMessages(true);

        toast(
            "Game removed"
        );

    }catch(error){

        console.error(error);

        toast(
            "Could not remove game"
        );

    }

}


/* =========================================================
   AUTO REMOVE FINISHED GAME
========================================================= */

function scheduleGameRemoval(
    messageId,
    game,
    delay = 3000
){

    const id =
        String(messageId);

    if(
        gameFinishTimers.has(id)
    ){
        return;
    }

    /*
     EVERY client schedules removal
     after seeing a finished game.

     Only the host actually DELETEs it.
    */

    const timer =
        setTimeout(
            async () => {

                gameFinishTimers.delete(
                    id
                );

                if(
                    game.hostDeviceId ===
                    deviceId
                ){

                    try{

                        await apiRequest(
                            "DELETE",
                            {
                                id:
                                    messageId,

                                device_id:
                                    deviceId,

                                game_server:true
                            }
                        );

                    }catch(error){

                        console.error(
                            "Finished game cleanup failed",
                            error
                        );

                    }

                }

            },
            delay
        );

    gameFinishTimers.set(
        id,
        timer
    );

}


/* =========================================================
   GAME HOST DISCONNECT DETECTION
========================================================= */

/*
 The API itself has no websocket/disconnect event.

 Therefore the game contains:

     heartbeat: Date.now()

 The host updates it every 2 seconds.

 Other clients consider a host disconnected
 when the heartbeat is older than 6 seconds.

 The host's page also tries to DELETE the game
 when it closes.

 This means:
   normal close  -> DELETE
   crash/browser kill/network loss
             -> heartbeat timeout
*/

const HOST_TIMEOUT = 6500;


async function checkDeadGameHosts(){

    const now =
        Date.now();

    for(
        const entry of games
    ){

        const game =
            entry.game;

        if(!game){
            continue;
        }

        if(
            game.state ===
            "finished"
        ){
            continue;
        }

        if(
            !game.hostDeviceId
        ){
            continue;
        }

        /*
         Don't delete our own game
         based on our own heartbeat.
        */

        if(
            game.hostDeviceId ===
            deviceId
        ){
            continue;
        }

        const heartbeat =
            Number(
                game.heartbeat ||
                game.createdAt ||
                0
            );

        if(
            heartbeat > 0 &&
            now - heartbeat >
            HOST_TIMEOUT
        ){

            /*
             We cannot delete another host's
             game because the API correctly
             requires the host device ID.

             We remove it locally immediately.
             The database row will disappear once
             the server-side host cleanup or another
             maintenance mechanism removes it.
            */

            removeGameElement(
                String(
                    entry.serverId
                )
            );

        }

    }

}


/* =========================================================
   REMOVE GAME ELEMENT ONLY
========================================================= */

function removeGameElement(
    id
){

    const element =
        gameElements.get(
            String(id)
        );

    if(element){

        element.style.opacity =
            "0";

        element.style.transform =
            "translateY(5px)";

        element.style.transition =
            ".15s";

        setTimeout(
            () => {

                element.remove();

            },
            150
        );

        gameElements.delete(
            String(id)
        );

    }

    stopGameHeartbeat(id);

}


/* =========================================================
   GAME SYNC
========================================================= */

function syncGames(
    serverMessages
){

    const gameMessages =
        serverMessages
            .filter(
                message =>
                    message.username ===
                    GAME_SERVER_USERNAME
            );

    const serverIds =
        new Set(
            gameMessages.map(
                message =>
                    String(message.id)
            )
        );

    /*
     Remove game elements that are actually
     gone from the server.
    */

    for(
        const [
            id,
            element
        ] of gameElements
    ){

        if(
            !serverIds.has(id)
        ){

            element.remove();

            gameElements.delete(id);

            stopGameHeartbeat(id);

        }

    }

    games = [];

    for(
        const serverMessage
        of gameMessages
    ){

        const game =
            parseGameMessage(
                serverMessage
            );

        if(!game){
            continue;
        }

        /*
         Ignore join/leave request messages.
        */

        if(
            game.type !== "game"
        ){
            continue;
        }

        const id =
            String(serverMessage.id);

        games.push({
            serverId:id,
            game
        });

        /*
         Finished games are scheduled for
         automatic deletion.
        */

        if(
            game.state ===
            "finished"
        ){

            scheduleGameRemoval(
                serverMessage.id,
                game,
                3000
            );

        }

        const existing =
            gameElements.get(id);

        if(existing){

            const card =
                existing.querySelector(
                    ".game-card"
                );

            if(card){

                renderGameCard(
                    card,
                    serverMessage,
                    game
                );

            }

        }else{

            const element =
                createGameElement(
                    serverMessage,
                    game
                );

            gameElements.set(
                id,
                element
            );

            messagesEl.appendChild(
                element
            );

        }

        /*
         Host heartbeat.
        */

        if(
            game.hostDeviceId ===
            deviceId &&
            game.state !==
            "finished"
        ){

            startGameHeartbeat(
                serverMessage,
                game
            );

        }else{

            stopGameHeartbeat(id);

        }

    }

}


/* =========================================================
   JOIN / LEAVE REQUEST PROCESSING
========================================================= */

function findRequests(
    serverMessages,
    gameId
){

    const requests = [];

    for(
        const message
        of serverMessages
    ){

        if(
            message.username !==
            GAME_SERVER_USERNAME
        ){
            continue;
        }

        if(
            !message.message ||
            typeof message.message !==
            "string"
        ){
            continue;
        }

        if(
            message.message
                .startsWith(
                    "__GAME_JOIN__:"
                )
        ){

            try{

                const request =
                    JSON.parse(
                        message.message
                            .substring(
                                "__GAME_JOIN__:".length
                            )
                    );

                if(
                    request.gameId ===
                    gameId
                ){

                    requests.push({
                        ...request,
                        serverId:
                            message.id
                    });

                }

            }catch{}

        }

    }

    return requests;
}


async function processHostRequests(
    serverMessages
){

    /*
     Only the host handles requests.

     The request itself is a normal game-server
     message, so it is visible to the API but
     ignored by the UI.
    */

    for(
        const entry of games
    ){

        const game =
            entry.game;

        if(
            game.hostDeviceId !==
            deviceId
        ){
            continue;
        }

        if(
            game.state !==
            "lobby"
        ){
            continue;
        }

        const requests =
            findRequests(
                serverMessages,
                game.gameId
            );

        let changed = false;

        for(
            const request
            of requests
        ){

            if(
                game.players.some(
                    p =>
                        p.deviceId ===
                        request.deviceId
                )
            ){
                continue;
            }

            const type =
                GAME_TYPES[
                    game.gameType
                ];

            if(
                game.players.length >=
                type.max
            ){
                continue;
            }

            if(
                !request.name
            ){
                continue;
            }

            const player = {

                deviceId:
                    request.deviceId,

                name:
                    request.name,

                symbol:
                    game.gameType
                        .startsWith("ttt")
                        ? (
                            game.players
                                .some(
                                    p =>
                                        p.symbol ===
                                        "O"
                                )
                                ? "X"
                                : "O"
                        )
                        : null
            };

            game.players.push(
                player
            );

            changed = true;

        }

        if(changed){

            await updateGame(
                entry.serverId,
                game
            );

        }

    }

}


/* =========================================================
   MAIN SYNC
========================================================= */

async function syncMessages(
    forceScroll = false
){

    if(syncing){
        return;
    }

    syncing = true;

    const shouldScroll =
        forceScroll ||
        (
            settings.autoScroll &&
            isNearBottom()
        );

    try{

        const data =
            await apiRequest(
                "GET"
            );

        const serverMessages =
            Array.isArray(
                data.messages
            )
                ? data.messages
                : [];

        /*
         IMPORTANT:
         No clearHTML.
         No innerHTML replacement.
         Existing elements stay.
        */

        syncNormalMessages(
            serverMessages
        );

        syncGames(
            serverMessages
        );

        await processHostRequests(
            serverMessages
        );

        /*
         Check stale hosts.
        */

        await checkDeadGameHosts();

        currentMessages =
            serverMessages;

        /*
         Only scroll after incremental changes.
        */

        if(shouldScroll){

            requestAnimationFrame(
                () => {

                    messagesEl.scrollTop =
                        messagesEl.scrollHeight;

                }
            );

        }

        updateEmptyState();

    }catch(error){

        console.error(
            "Chat sync failed:",
            error
        );

    }finally{

        syncing = false;

    }

}


/* =========================================================
   EMPTY STATE
========================================================= */

function updateEmptyState(){

    const visibleMessages =
        messagesEl.querySelectorAll(
            ".message,.game-message"
        );

    let empty =
        document.getElementById(
            "emptyState"
        );

    if(
        visibleMessages.length === 0
    ){

        if(!empty){

            empty =
                document.createElement(
                    "div"
                );

            empty.id =
                "emptyState";

            empty.className =
                "empty";

            empty.innerHTML = `
                <div class="empty-inner">
                    <div class="empty-icon">💬</div>
                    <strong>No messages yet</strong>
                    Start the conversation.
                </div>
            `;

            messagesEl.appendChild(
                empty
            );

        }

    }else{

        if(empty){
            empty.remove();
        }

    }

}


/* =========================================================
   REFRESH TIMER
========================================================= */

function restartRefresh(){

    if(refreshTimer){

        clearInterval(
            refreshTimer
        );

    }

    refreshTimer =
        setInterval(
            () => {

                syncMessages();

            },
            Math.max(
                100,
                Number(
                    settings.refreshRate
                ) || 500
            )
        );

}


document.addEventListener(
    "visibilitychange",
    () => {

        if(
            document.visibilityState ===
            "visible"
        ){

            syncMessages();

        }

    }
);


/* =========================================================
   PAGE EXIT
========================================================= */

/*
 Try to remove games hosted by this browser
 when the page closes.

 sendBeacon cannot send DELETE with the exact
 JSON body reliably, so fetch keepalive is used.
*/

window.addEventListener(
    "pagehide",
    () => {

        for(
            const entry of games
        ){

            const game =
                entry.game;

            if(
                game.hostDeviceId !==
                deviceId
            ){
                continue;
            }

            if(
                game.state ===
                "finished"
            ){
                continue;
            }

            try{

                fetch(
                    API_URL +
                    "?channel=" +
                    encodeURIComponent(
                        CHANNEL
                    ),
                    {
                        method:"DELETE",
                        headers:{
                            "Content-Type":
                                "application/json"
                        },
                        body:
                            JSON.stringify({
                                id:
                                    entry.serverId,

                                device_id:
                                    deviceId,

                                game_server:true
                            }),
                        keepalive:true
                    }
                );

            }catch{}

        }

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

function initialize(){

    applySettings();

    loadSettingsUI();

    /*
     First load.
    */

    syncMessages(true);

    /*
     Poll without rebuilding the UI.
    */

    restartRefresh();

    updateEmptyState();

}


initialize();


/* =========================================================
   REMOVE EVERYTHING
========================================================= */

removeEverything.onclick =
    () => {

        confirmAction(
            "Delete everything?",
            "This permanently removes all normal messages and games from the chat.",
            async () => {

                try{

                    await apiRequest(
                        "DELETE",
                        {
                            delete_all:true
                        }
                    );

                    /*
                     Clear DOM only because the
                     server really was wiped.
                    */

                    messageElements.forEach(
                        element =>
                            element.remove()
                    );

                    gameElements.forEach(
                        element =>
                            element.remove()
                    );

                    messageElements.clear();
                    gameElements.clear();

                    games = [];
                    currentMessages = [];

                    toast(
                        "Everything deleted"
                    );

                    updateEmptyState();

                }catch(error){

                    console.error(error);

                    toast(
                        "Could not delete everything"
                    );

                }

            }
        );

    };


/* =========================================================
   LIGHTWEIGHT LOCAL HOST GAME LOOP
========================================================= */

/*
 The host periodically checks its game and
 updates heartbeat.

 This is intentionally separate from the
 message polling loop so a slow chat refresh
 does not stop the game heartbeat.
*/

setInterval(
    () => {

        for(
            const entry of games
        ){

            if(
                entry.game.hostDeviceId ===
                deviceId &&
                entry.game.state !==
                "finished"
            ){

                entry.game.heartbeat =
                    Date.now();

            }

        }

    },
    1000
);
