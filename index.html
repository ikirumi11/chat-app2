<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat - Multiplayer Games</title>

<style>
*{
    box-sizing:border-box;
}

:root{
    --bg:#0b0d10;
    --panel:#111419;
    --panel2:#181c22;
    --panel3:#20252d;
    --border:#292f38;
    --text:#edf0f4;
    --muted:#7e8793;
    --accent:#e8eaed;
    --danger:#ff7070;
    --green:#70e0a0;
    --yellow:#e5c66b;
    --radius:12px;
    --text-size:16px;
    --word-spacing:0px;
    --line-spacing:1.45;
    --ui-scale:1;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

body{
    overflow:hidden;
    font-size:calc(16px * var(--ui-scale));
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:64px;
    min-height:64px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel);
    border-bottom:1px solid var(--border);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
}

.logo-icon{
    width:35px;
    height:35px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:var(--panel2);
    border:1px solid var(--border);
}

.channel{
    color:var(--muted);
    font-weight:400;
}

.header-actions{
    display:flex;
    gap:7px;
}

.icon-btn{
    width:39px;
    height:39px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
}

.icon-btn:hover{
    filter:brightness(1.15);
}

/* MESSAGES */

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    display:flex;
    gap:11px;
    margin-bottom:17px;
}

.avatar{
    flex:0 0 40px;
    width:40px;
    height:40px;
    display:grid;
    place-items:center;
    border-radius:var(--radius);
    background:var(--panel2);
    border:1px solid var(--border);
    font-weight:700;
}

.message-content{
    min-width:0;
    max-width:min(850px,calc(100vw - 90px));
}

.message-top{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:3px;
}

.username{
    font-weight:700;
}

.time,
.edited{
    color:var(--muted);
    font-size:11px;
}

.message-text{
    color:#d8dde4;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    font-size:var(--text-size);
    word-spacing:var(--word-spacing);
    line-height:var(--line-spacing);
}

.message-video{display:block;max-width:min(600px,80vw);max-height:500px;margin-top:8px;border:1px solid var(--border);border-radius:var(--radius);background:#000;object-fit:contain;}

.message-image{
    display:block;
    max-width:min(500px,80vw);
    max-height:500px;
    margin-top:8px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:#000;
    object-fit:contain;
    cursor:pointer;
}

.message-file{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    margin-top:6px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:var(--radius);
    cursor:pointer;
    transition:0.15s;
    max-width:400px;
}

.message-file:hover{
    background:var(--panel3);
}

.message-file .file-icon{
    font-size:24px;
    flex-shrink:0;
}

.message-file .file-info{
    min-width:0;
    flex:1;
}

.message-file .file-name{
    font-weight:600;
    font-size:14px;
    color:var(--text);
    word-break:break-all;
}

.message-file .file-size{
    font-size:11px;
    color:var(--muted);
}

.file-list{
    margin-top:6px;
}

/* GAME CARDS */

.game-message{
    margin:0 auto 18px;
    max-width:900px;
}

.game-card{
    border:1px solid var(--border);
    border-radius:16px;
    background:linear-gradient(
        145deg,
        var(--panel2),
        #101318
    );
    overflow:hidden;
    box-shadow:0 12px 40px #0005;
}

.game-header{
    padding:17px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
}

.game-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:18px;
    font-weight:800;
}

.game-status{
    font-size:12px;
    padding:6px 9px;
    border-radius:999px;
    background:#252b33;
    color:#bfc6cf;
}

.game-body{
    padding:18px;
}

.game-info{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:15px;
}

.game-pill{
    padding:7px 10px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#13171d;
    color:#bfc6cf;
    font-size:12px;
}

.game-pill strong{
    color:white;
}

.game-description{
    color:#969faa;
    margin-bottom:16px;
    line-height:1.45;
}

.game-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.game-btn{
    border:1px solid var(--border);
    border-radius:9px;
    padding:10px 14px;
    background:#222830;
    color:white;
    font-weight:700;
}

.game-btn:hover{
    filter:brightness(1.15);
}

.game-btn.primary{
    background:#e8eaed;
    color:#111;
}

.game-btn.green{
    background:#193b2b;
    border-color:#2c6348;
    color:#9bf0bc;
}

.game-btn.danger{
    background:#3a1c20;
    border-color:#71333b;
    color:#ff9292;
}

.game-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.game-btn.boss{
    background:#4a1a2a;
    border-color:#8a3a5a;
    color:#ff8aaa;
    font-size:18px;
    padding:15px 25px;
}

.game-btn.boss:hover:not(:disabled){
    background:#5a2a3a;
}

/* PLAYERS */

.players-list{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin:13px 0;
}

.player-chip{
    padding:7px 10px;
    border-radius:8px;
    background:#13171d;
    border:1px solid var(--border);
    font-size:12px;
}

.player-chip.host{
    border-color:#65552a;
    color:#ead17a;
}

.turn-banner{
    margin:12px 0;
    padding:11px 13px;
    border-radius:10px;
    background:#151a20;
    border:1px solid var(--border);
    color:#c8ced6;
}

.turn-banner strong{
    color:white;
}

/* TIC TAC TOE */

.ttt{
    display:grid;
    gap:5px;
    justify-content:center;
    margin:15px auto;
}

.ttt button{
    border-radius:8px;
    border:1px solid var(--border);
    background:#11151b;
    color:white;
    font-weight:900;
    transition:0.15s;
    font-size:28px;
}

.ttt button:hover:not(:disabled){
    background:#222831;
}

.ttt .symbol-X{ color:#ff6b6b; }
.ttt .symbol-O{ color:#4ecdc4; }
.ttt .symbol-triangle{ color:#ffd93d; }

/* REACTION TIME */

.reaction-area{
    text-align:center;
    padding:20px;
}

.reaction-box{
    width:200px;
    height:200px;
    margin:15px auto;
    border-radius:20px;
    border:3px solid var(--border);
    display:grid;
    place-items:center;
    font-size:24px;
    font-weight:700;
    transition:0.2s;
    cursor:pointer;
    background:#1a1f26;
    color:var(--muted);
}

.reaction-box.waiting{
    background:#1a1f26;
    color:var(--muted);
}

.reaction-box.ready{
    background:#1a3a2a;
    border-color:#2a6a4a;
    color:#7affb0;
}

.reaction-box.go{
    background:#3a1a1a;
    border-color:#6a2a2a;
    color:#ff7a7a;
}

.reaction-box.done{
    background:#2a2a4a;
    border-color:#4a4a7a;
    color:#aaaaff;
}

/* BOSS BATTLE */

.boss-area{
    text-align:center;
    padding:10px;
}

.boss-health-bar{
    width:100%;
    max-width:500px;
    height:30px;
    margin:10px auto;
    background:#1a1a1a;
    border-radius:15px;
    border:2px solid #333;
    overflow:hidden;
    position:relative;
}

.boss-health-fill{
    height:100%;
    background:linear-gradient(90deg,#ff3333,#ff6a33);
    border-radius:15px;
    transition:width 0.3s ease;
    width:100%;
}

.boss-health-text{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    font-weight:700;
    font-size:14px;
    color:white;
    text-shadow:0 0 10px rgba(0,0,0,0.8);
}

.boss-stats{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin:10px 0;
    color:#9da5b0;
    font-size:14px;
}

.boss-stats strong{
    color:white;
}

.boss-upgrades{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    margin:10px 0;
}

.boss-upgrade-btn{
    padding:8px 16px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#1a1f26;
    color:white;
    font-size:12px;
    transition:0.15s;
}

.boss-upgrade-btn:hover:not(:disabled){
    background:#2a303a;
    transform:scale(1.05);
}

.boss-upgrade-btn:disabled{
    opacity:0.3;
    cursor:not-allowed;
}

.boss-upgrade-btn .cost{
    color:#ffcc44;
    font-weight:700;
}

.boss-damage-display{
    font-size:32px;
    font-weight:900;
    color:#ff6a33;
    margin:5px 0;
}

.boss-monster-name{
    font-size:28px;
    font-weight:900;
    color:#ff4466;
    text-shadow:0 0 20px rgba(255,68,102,0.3);
}

/* COMPOSER */

.composer{
    padding:12px 16px 16px;
    background:var(--panel);
    border-top:1px solid var(--border);
}

.composer-box{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:8px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:14px;
    flex-wrap:wrap;
}

textarea{
    flex:1;
    min-height:42px;
    max-height:150px;
    resize:none;
    border:0;
    outline:none;
    background:transparent;
    color:white;
    padding:10px;
    min-width:120px;
}

.attach-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:9px;
    background:transparent;
    color:#adb5c0;
    font-size:20px;
    display:grid;
    place-items:center;
    flex-shrink:0;
}

.attach-btn:hover{
    background:#222830;
}

.file-preview{
    width:100%;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    padding:4px 8px;
}

.file-preview-item{
    display:flex;
    align-items:center;
    gap:6px;
    padding:4px 10px 4px 8px;
    background:#1a1f26;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:12px;
}

.file-preview-item .remove-file{
    cursor:pointer;
    color:var(--muted);
    font-weight:700;
    font-size:14px;
}

.file-preview-item .remove-file:hover{
    color:#ff7070;
}

.send-btn{
    height:42px;
    border:0;
    border-radius:9px;
    padding:0 18px;
    background:var(--accent);
    color:#111;
    font-weight:700;
    flex-shrink:0;
}

.send-btn:disabled{
    opacity:.5;
}

/* OVERLAYS */

.overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000b;
    z-index:100;
}

.overlay.show{
    display:flex;
}

.panel{
    width:min(620px,calc(100vw - 25px));
    max-height:calc(100vh - 25px);
    overflow-y:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
    box-shadow:0 25px 80px #000b;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px;
    border-bottom:1px solid var(--border);
}

.panel-header h2{
    margin:0;
}

.panel-body{
    padding:18px;
}

/* CATEGORIES */

.category{
    margin-bottom:12px;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    background:var(--panel2);
}

.category-title{
    width:100%;
    padding:14px;
    border:0;
    background:transparent;
    color:var(--text);
    display:flex;
    justify-content:space-between;
    font-weight:700;
    text-align:left;
}

.category-body{
    display:none;
    padding:0 14px 14px;
}

.category.open .category-body{
    display:block;
}

.setting{
    margin-top:14px;
}

.setting label{
    display:block;
    margin-bottom:7px;
    color:#aab2bd;
    font-size:13px;
}

.setting input,
.setting select{
    width:100%;
    padding:10px;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
    background:#101419;
    color:white;
}

.setting input[type=range]{
    padding:0;
}

.setting-value{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.save-btn{
    width:100%;
    margin-top:8px;
    padding:12px;
    border:0;
    border-radius:9px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

/* GAME CREATOR */

.game-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.game-choice{
    min-height:80px;
    padding:13px;
    text-align:left;
    border-radius:12px;
    border:1px solid var(--border);
    background:#151a20;
    color:white;
    font-size:13px;
}

.game-choice:hover{
    background:#20262e;
}

.game-choice strong{
    display:block;
    margin-bottom:3px;
    font-size:15px;
}

.game-choice span{
    color:#818b97;
    font-size:11px;
}

.game-choice .game-players{
    display:inline-block;
    background:#1a1f26;
    padding:1px 8px;
    border-radius:10px;
    color:#aab2bd;
    font-size:10px;
    margin-top:4px;
}

.game-choice .game-options{
    font-size:10px;
    color:#6a7a8a;
    margin-top:3px;
}

/* GAME SETTINGS - LOBBY */

.game-settings{
    background:#0d1015;
    border-radius:10px;
    padding:12px;
    margin:10px 0;
}

.game-settings h4{
    margin:0 0 10px 0;
    color:#aab2bd;
    font-size:13px;
    font-weight:600;
}

.game-settings-row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:center;
    margin:6px 0;
}

.game-settings-row label{
    color:#aab2bd;
    font-size:12px;
    min-width:70px;
}

.game-settings-row select,
.game-settings-row input[type=number]{
    background:#1a1f26;
    border:1px solid var(--border);
    border-radius:6px;
    color:white;
    padding:5px 10px;
    font-size:12px;
    flex:1;
    min-width:80px;
}

/* DANGER */

.danger-zone{
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid #402529;
}

.danger-title{
    color:var(--danger);
    font-weight:700;
    margin-bottom:7px;
}

.danger-zone p{
    color:var(--muted);
    line-height:1.45;
}

.danger-btn{
    width:100%;
    padding:12px;
    border-radius:9px;
    border:1px solid #743333;
    background:#241719;
    color:#ff8585;
}

/* EMPTY */

.empty{
    height:100%;
    min-height:200px;
    display:grid;
    place-items:center;
    color:#656d78;
    text-align:center;
}

.empty strong{
    display:block;
    color:#aab2bd;
    margin-bottom:5px;
}

/* TYPE SENTENCE */

.type-area{
    text-align:center;
    padding:15px;
}

.type-sentence{
    font-size:24px;
    font-weight:700;
    color:white;
    padding:20px;
    background:#1a1f26;
    border-radius:12px;
    border:1px solid var(--border);
    margin:10px auto;
    max-width:600px;
    word-break:break-word;
}

.type-input{
    width:100%;
    max-width:500px;
    padding:12px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#101419;
    color:white;
    font-size:18px;
    text-align:center;
}

.type-input:focus{
    outline:2px solid var(--accent);
}

.type-stats{
    display:flex;
    justify-content:center;
    gap:20px;
    margin:10px 0;
    color:#9da5b0;
}

.type-stats strong{
    color:white;
}

/* MEMORY MATCH */

.memory-grid{
    display:grid;
    gap:8px;
    justify-content:center;
    margin:15px auto;
    max-width:100%;
}

.memory-card{
    width:70px;
    height:70px;
    border-radius:10px;
    border:2px solid var(--border);
    background:#1a1f26;
    display:grid;
    place-items:center;
    font-size:30px;
    cursor:pointer;
    transition:0.2s;
    color:transparent;
    user-select:none;
}

.memory-card.flipped{
    background:#2a303a;
    color:white;
}

.memory-card.matched{
    background:#1a3a2a;
    border-color:#2a6a4a;
    color:#7affb0;
    cursor:default;
}

.memory-card:hover:not(.flipped):not(.matched){
    transform:scale(1.05);
}

/* QUICK DRAW */

.quickdraw-area{
    text-align:center;
    padding:20px;
}

.quickdraw-box{
    width:300px;
    height:200px;
    margin:15px auto;
    border-radius:20px;
    border:3px solid var(--border);
    display:grid;
    place-items:center;
    font-size:32px;
    font-weight:900;
    transition:0.2s;
    background:#1a1f26;
    color:var(--muted);
}

.quickdraw-box.waiting{
    background:#1a1f26;
    color:var(--muted);
}

.quickdraw-box.countdown{
    background:#2a2a1a;
    border-color:#6a6a2a;
    color:#ddcc44;
}

.quickdraw-box.draw{
    background:#1a3a2a;
    border-color:#2a6a4a;
    color:#7affb0;
    cursor:pointer;
}

.quickdraw-box.punish{
    background:#3a1a1a;
    border-color:#6a2a2a;
    color:#ff7a7a;
}

/* COIN FLIP */

.coin-area{
    text-align:center;
    padding:15px;
}

.coin-display{
    font-size:80px;
    margin:15px 0;
}

.coin-buttons{
    display:flex;
    gap:15px;
    justify-content:center;
    flex-wrap:wrap;
}

.coin-btn{
    padding:12px 30px;
    border-radius:12px;
    border:2px solid var(--border);
    background:#1a1f26;
    color:white;
    font-size:18px;
    font-weight:700;
    transition:0.15s;
}

.coin-btn:hover:not(:disabled){
    transform:scale(1.05);
    background:#2a303a;
}

.coin-btn:disabled{
    opacity:0.3;
    cursor:not-allowed;
}

.coin-btn.selected{
    border-color:#ffcc44;
    background:#2a2a1a;
}

/* NUMBER GUESS */

.numberguess-area{
    text-align:center;
    padding:15px;
}

.numberguess-input{
    padding:12px 20px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#1a1f26;
    color:white;
    font-size:18px;
    width:150px;
    text-align:center;
}

.numberguess-hint{
    font-size:20px;
    padding:10px;
    margin:10px 0;
    border-radius:10px;
    background:#1a1f26;
    border:1px solid var(--border);
}

/* TARGET CLICK */

.target-area{
    text-align:center;
    padding:15px;
    position:relative;
    min-height:300px;
}

.target-box{
    width:100%;
    height:300px;
    border-radius:16px;
    border:2px solid var(--border);
    background:#11161d;
    position:relative;
    overflow:hidden;
    cursor:pointer;
}

.target-dot{
    position:absolute;
    width:60px;
    height:60px;
    border-radius:50%;

    if(window.crypto && crypto.randomUUID){
        deviceId=crypto.randomUUID();
    }else{
        deviceId=

    const value=
        localStorage.getItem(
            "chat_"+key

    if(value===null){
        return defaults[key];
    }

    if(
        value==="true" ||
        value==="false"
    ){
        return value==="true";
    }

    const number=Number(value);

    return Number.isNaN(number)

const MAX_IMAGE_DIMENSION = 1500;
const MAX_VIDEO_BYTES = 5 * 1024 * 1024;
const MAX_VIDEO_DURATION_SECONDS = 60 * 60;

function formatFileSize(bytes) {
    if (!Number.isFinite(bytes)) return '';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(1) + ' MB';
}

function getFileIcon(mimeType, fileName) {
    const type = (mimeType || '').toLowerCase();
    if (type.startsWith('image/')) return '🖼️';
    if (type.startsWith('video/')) return '🎬';
    if (type.startsWith('audio/')) return '🎵';
    if (type.includes('pdf')) return '📄';
    if (type.includes('zip') || type.includes('rar') || type.includes('7z')) return '📦';
    if (type.includes('text')) return '📝';
    if (type.includes('word') || type.includes('document')) return '📘';
    if (type.includes('sheet') || type.includes('excel')) return '📊';
    if (type.includes('presentation') || type.includes('powerpoint')) return '📙';
    if (type.includes('json') || type.includes('xml')) return '📋';
    if (type.includes('javascript') || type.includes('python') || type.includes('html')) return '💻';
    return '📎';
}

function readFileAsDataURL(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('Could not read the file.'));
        reader.readAsDataURL(file);
    });
}

function loadImageFromFile(file) {
    return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
            URL.revokeObjectURL(url);
            resolve(img);
        };
        img.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error(`"${file.name}" could not be read as an image.`));
        };
        img.src = url;
    });
}

function canvasToDataURL(canvas, type, quality) {
    return new Promise((resolve, reject) => {
        canvas.toBlob(blob => {
            if (!blob) {
                reject(new Error('Could not convert image.'));
                return;
            }
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(new Error('Could not encode image.'));
            reader.readAsDataURL(blob);
        }, type, quality);
    });
}

async function imageToBase64(file) {
    const img = await loadImageFromFile(file);
    const originalWidth = img.naturalWidth || img.width;
    const originalHeight = img.naturalHeight || img.height;

    const scale = Math.min(
        1,
        MAX_IMAGE_DIMENSION / originalWidth,
        MAX_IMAGE_DIMENSION / originalHeight
    );

    const width = Math.max(1, Math.round(originalWidth * scale));
    const height = Math.max(1, Math.round(originalHeight * scale));
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;

    const ctx = canvas.getContext('2d', { alpha: true });
    if (!ctx) throw new Error('Your browser does not support image conversion.');

    const inputType = (file.type || '').toLowerCase();
    const outputType = inputType === 'image/png' ? 'image/png' : 'image/jpeg';

    if (outputType === 'image/jpeg') {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, height);
    }

    ctx.drawImage(img, 0, 0, width, height);

    const data = await canvasToDataURL(
        canvas,
        outputType,
        outputType === 'image/png' ? undefined : 0.88
    );

    return {
        name: file.name.replace(/\.[^.]+$/, '') + (outputType === 'image/png' ? '.png' : '.jpg'),
        data,
        size: Math.round((data.length - data.indexOf(',') - 1) * 0.75),
        type: outputType,
        base64: true,
        image: true,
        width,
        height,
        originalSize: file.size
    };
}

function getVideoMetadata(file) {
    return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const video = document.createElement('video');
        video.preload = 'metadata';
        video.onloadedmetadata = () => {
            const result = {
                width: video.videoWidth || 1280,
                height: video.videoHeight || 720,
                duration: Number.isFinite(video.duration) ? video.duration : 0
            };
            URL.revokeObjectURL(url);
            resolve(result);
        };
        video.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error(`"${file.name}" could not be read as a video.`));
        };
        video.src = url;
    });
}

function blobToDataURL(blob) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('Could not encode video.'));
        reader.readAsDataURL(blob);
    });
}

function chooseVideoMimeType() {
    const types = [
        'video/webm;codecs=vp9',
        'video/webm;codecs=vp8',
        'video/webm'
    ];
    return types.find(type =>
        window.MediaRecorder && MediaRecorder.isTypeSupported(type)
    ) || '';
}

async function encodeVideo(file, width, height, bitrate) {
    const mimeType = chooseVideoMimeType();
    if (!mimeType) return null;

    const sourceURL = URL.createObjectURL(file);
    const video = document.createElement('video');
    video.src = sourceURL;
    video.preload = 'auto';
    video.muted = true;
    video.playsInline = true;

    await new Promise((resolve, reject) => {
        video.onloadedmetadata = resolve;
        video.onerror = () => reject(new Error('Could not load video.'));
    });

    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    if (!ctx) {
        URL.revokeObjectURL(sourceURL);
        throw new Error('Canvas video encoding is not supported.');
    }

    const stream = canvas.captureStream(30);
    const recorder = new MediaRecorder(stream, {
        mimeType,
        videoBitsPerSecond: bitrate
    });
    const chunks = [];

    const finished = new Promise((resolve, reject) => {
        recorder.ondataavailable = e => {
            if (e.data && e.data.size) chunks.push(e.data);
        };
        recorder.onerror = () => reject(new Error('Video encoding failed.'));
        recorder.onstop = () => resolve(new Blob(chunks, { type: mimeType }));
    });

    let drawing = true;
    const draw = () => {
        if (!drawing) return;
        if (!video.paused && !video.ended) {
            ctx.drawImage(video, 0, 0, width, height);
        }
        requestAnimationFrame(draw);
    };

    recorder.start(250);
    try {
        await video.play();
    } catch (error) {
        drawing = false;
        if (recorder.state !== 'inactive') recorder.stop();
        URL.revokeObjectURL(sourceURL);
        throw new Error('This video could not be played for compression.');
    }

    draw();

    await new Promise(resolve => {
        video.onended = resolve;
    });

    drawing = false;
    if (recorder.state !== 'inactive') recorder.stop();
    const blob = await finished;
    URL.revokeObjectURL(sourceURL);
    return blob;
}

async function compressVideoToBase64(file) {
    const meta = await getVideoMetadata(file);

    if (meta.duration > MAX_VIDEO_DURATION_SECONDS) {
        throw new Error('Video is too long. Maximum video length is 60 minutes.');
    }

    // Files already under the 5 MB file limit do not need re-encoding.
    if (file.size <= MAX_VIDEO_BYTES) {
        return {
            name: file.name,
            data: await readFileAsDataURL(file),
            size: file.size,
            type: file.type || 'video/mp4',
            base64: true,
            image: false,
            video: true
        };
    }

    if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) {
        throw new Error('This browser cannot compress this video. Please choose a video under 5 MB.');
    }

    // Keep enough room for the Base64 string in the request while targeting
    // a real binary file size of <= 5 MB.
    const duration = Math.max(meta.duration, 1);
    const targetTotalBitrate = Math.max(
        160000,
        Math.floor((MAX_VIDEO_BYTES * 8 * 0.90) / duration)
    );

    const presets = [
        { scale: 1.00, bitrate: Math.min(2800000, targetTotalBitrate) },
        { scale: 0.85, bitrate: Math.min(2000000, targetTotalBitrate) },
        { scale: 0.70, bitrate: Math.min(1400000, targetTotalBitrate) },
        { scale: 0.55, bitrate: Math.min(900000, targetTotalBitrate) },
        { scale: 0.40, bitrate: Math.min(550000, targetTotalBitrate) },
        { scale: 0.30, bitrate: Math.min(350000, targetTotalBitrate) }
    ];

    for (const preset of presets) {
        const width = Math.max(2, Math.floor(meta.width * preset.scale / 2) * 2);
        const height = Math.max(2, Math.floor(meta.height * preset.scale / 2) * 2);
        const bitrate = Math.max(120000, preset.bitrate);

        try {
            const blob = await encodeVideo(file, width, height, bitrate);
            if (!blob) continue;

            if (blob.size <= MAX_VIDEO_BYTES) {
                return {
                    name: file.name.replace(/\.[^.]+$/, '') + '.webm',
                    data: await blobToDataURL(blob),
                    size: blob.size,
                    type: 'video/webm',
                    base64: true,
                    image: false,
                    video: true,
                    width,
                    height,
                    originalSize: file.size
                };
            }
        } catch (error) {
            // Try the next, smaller preset.
        }
    }

    throw new Error('This video could not be compressed below 5 MB. Try a shorter video.');
}

attachBtn.onclick = () => fileInput.click();

fileInput.onchange = async () => {
    const files = Array.from(fileInput.files || []);
    if (!files.length) return;

    for (const file of files) {
        if (pendingFiles.length >= MAX_FILES) {
            alert(`Maximum ${MAX_FILES} files per message.`);
            break;
        }

        const type = (file.type || '').toLowerCase();
        const isImage = type.startsWith('image/');
        const isVideo = type.startsWith('video/');

        // Images and videos have their own processing rules.
        if (!isImage && !isVideo && file.size > MAX_FILE_SIZE) {
            alert(
                `File "${file.name}" is too large ` +
                `(${formatFileSize(file.size)}). ` +
                `Max ${formatFileSize(MAX_FILE_SIZE)}.`
            );
            continue;
        }

        try {
            let processed;

            if (isImage) {
                processed = await imageToBase64(file);
            } else if (isVideo) {
                processed = await compressVideoToBase64(file);
            } else {
                processed = {
                    name: file.name,
                    data: await readFileAsDataURL(file),
                    size: file.size,
                    type: file.type || 'application/octet-stream',
                    base64: true,
                    image: false,
                    video: false
                };
            }

            pendingFiles.push(processed);
        } catch (error) {
            alert(`Could not process "${file.name}":\n\n${error.message}`);
        }
    }

    renderFilePreview();
    fileInput.value = '';
};

function renderFilePreview() {
    filePreview.innerHTML = '';
    if (!pendingFiles.length) return;

    pendingFiles.forEach((file, index) => {
        const item = document.createElement('div');
        item.className = 'file-preview-item';

        const icon = document.createElement('span');
        icon.textContent = getFileIcon(file.type, file.name);

        const name = document.createElement('span');
        name.textContent = file.name;

        const remove = document.createElement('span');
        remove.className = 'remove-file';
        remove.dataset.index = index;
        remove.textContent = '✕';

        item.appendChild(icon);
        item.appendChild(name);
        item.appendChild(remove);
        filePreview.appendChild(item);
    });

    filePreview.querySelectorAll('.remove-file').forEach(el => {
        el.onclick = () => {
            pendingFiles.splice(Number(el.dataset.index), 1);
            renderFilePreview();
        };
    });
}

function applyTheme(name){

    const themes={

        dark:["#0b0d10","#111419"],
        midnight:["#080b14","#101522"],
        slate:["#101418","#171d22"],
        black:["#000","#090909"],
        blue:["#091018","#101c29"],
        purple:["#100b17","#191021"],
        green:["#09120d","#101b15"],
        red:["#140b0b","#1e1111"],
        gray:["#151515","#202020"],
        light:["#eeeeee","#ffffff"],
        oled:["#000","#000"]
    };

    const t=
        themes[name] ||
        themes.dark;

    document.documentElement.style.setProperty(
        "--bg",
        t[0]
    );

    document.documentElement.style.setProperty(
        "--panel",
        t[1]
    );

    document.body.style.background=
        t[0];
}

async function sendChatMessage(){

    const text=
        messageInput.value
            .trim();

    const files = pendingFiles.length ? [...pendingFiles] : [];

    if(!text && !files.length)return;

    if(!settings.username){

        settingsBtn.click();

        alert(
            "Set your name in Settings first."
        );

        return;
    }

    sendBtn.disabled=true;

    try{

        await apiPost({

            username:
                settings.username,

            channel:
                CHANNEL,

            message:
                text || '',

            image: null,

            files: files,

            device_id:
                deviceId
        });

        messageInput.value="";
        messageInput.style.height=
            "auto";
        
        pendingFiles = [];
        renderFilePreview();

        await loadMessages();

    }catch(error){

        alert(
            "Failed to send:\n\n"+
            error.message
        );

    }finally{

        sendBtn.disabled=false;

    }
}


/* =====================================================
   API
===================================================== */

async function apiPost(body){

    const response=
        await fetch(
            API_URL,
            {
                method:"POST",
                headers:{
                    "Content-Type":
                        "application/json"
                },
                body:
                    JSON.stringify(body)
            }
        );

    const data=
        await safeJson(response);

    if(!response.ok){

        throw new Error(
            data.error ||
            "Request failed."
        );
    }

    return data;
}


async function apiDelete(body){

    const response=
        await fetch(
            API_URL,
            {
                method:"DELETE",
                headers:{
                    "Content-Type":
                        "application/json"
                },
                body:
                    JSON.stringify(body)
            }
        );

    const data=
        await safeJson(response);

    if(!response.ok){

        throw new Error(
            data.error ||
            "Delete failed."
        );
    }

    return data;
}


async function apiPatch(body){

    const response=
        await fetch(
            API_URL,
            {
                method:"PATCH",
                headers:{
                    "Content-Type":
                        "application/json"
                },
                body:
                    JSON.stringify(body)
            }
        );

    const data=
        await safeJson(response);

    if(!response.ok){

        throw new Error(
            data.error ||
            "Update failed."
        );
    }

    return data;
}


async function safeJson(response){

    const text=
        await response.text();

    if(!text)return {};

    try{
        return JSON.parse(text);
    }catch{
        return {
            error:text
        };
    }
}


/* =====================================================
   LOAD MESSAGES
===================================================== */

async function loadMessages(){

    if(syncing)return;

    syncing=true;

    try{

        const response=
            await fetch(
                API_URL+
                "?channel="+
                encodeURIComponent(
                    CHANNEL
                )+
                "&_="+
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        const data=
            await safeJson(response);

        if(!response.ok){

            throw new Error(
                data.error ||
                "Failed to load messages."
            );
        }

        const newMessages=
            Array.isArray(
                data.messages
            )
            ?data.messages
            :[];

        const changeInfo = getMessageChanges(currentMessages, newMessages);
        
        if (changeInfo.changed) {
            let hasNewMessages = false;
            let hasNewGames = false;
            
            for (const msg of newMessages) {
                if (!seenMessageIds.has(msg.id)) {
                    if (!isGameMessage(msg)) {
                        hasNewMessages = true;
                    }
                    seenMessageIds.add(msg.id);
                }
            }
            
            const oldGames = [...games];
            currentMessages = newMessages;
            processGameMessages();
            
            for (const game of games) {
                if (!seenGameIds.has(game.id)) {
                    hasNewGames = true;
                    seenGameIds.add(game.id);
                }
            }
            
            const oldGameIds = new Set(oldGames.map(g => g.id));
            const newGameIds = new Set(games.map(g => g.id));
            for (const id of oldGameIds) {
                if (!newGameIds.has(id)) {
                    seenGameIds.delete(id);
                }
            }
            
            const shouldScroll = settings.autoScroll && (hasNewMessages || hasNewGames);
            const wasNearBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 100;
            
            renderMessages(shouldScroll || (wasNearBottom && settings.autoScroll));
        }

    }catch(error){

        if(
            !currentMessages.length
        ){

            messagesEl.innerHTML=`
                <div class="empty">
                    <div>
                        <strong>Unable to load messages</strong>
                        ${escapeHtml(
                            error.message
                        )}
                    </div>
                </div>
            `;
        }

    }finally{

        syncing=false;
    }
}

function getMessageChanges(oldMessages, newMessages) {
    if (oldMessages.length !== newMessages.length) {
        return { changed: true };
    }
    
    let changed = false;
    for (let i = 0; i < oldMessages.length; i++) {
        const oldMsg = oldMessages[i];
        const newMsg = newMessages[i];
        
        if (oldMsg.id !== newMsg.id || 
            oldMsg.message !== newMsg.message || 
            oldMsg.username !== newMsg.username || 
            oldMsg.edited !== newMsg.edited ||
            oldMsg.image !== newMsg.image ||
            oldMsg.files !== newMsg.files) {
            changed = true;
            break;
        }
    }
    
    return { changed };
}


/* =====================================================
   GAME MESSAGE PARSING
===================================================== */

function isGameMessage(message){

    return (
        message &&
        typeof message.message==="string" &&
        message.message.startsWith(
            GAME_PREFIX
        )
    );
}


function parseGameMessage(message){

    if(!isGameMessage(message)){
        return null;
    }

    try{

        return JSON.parse(
            message.message.substring(
                GAME_PREFIX.length
            )
        );

    }catch{

        return null;
    }
}


function processGameMessages(){

    const map=new Map();

    for(const message of currentMessages){

        if(!isGameMessage(message)){
            continue;
        }

        const state=
            parseGameMessage(message);

        if(!state){
            continue;
        }

        if(
            state.type!=="game"
        ){
            continue;
        }

        map.set(
            state.id,
            {
                ...state,
                messageId:
                    message.id,
                hostDeviceId:
                    state.hostDeviceId ||
                    message.device_id ||
                    ""
            }
        );
    }

    games=[
        ...map.values()
    ];
}


/* =====================================================
   RENDER MESSAGES
===================================================== */

function renderMessages(shouldAutoScroll){

    const normal =
        currentMessages.filter(
            message =>
                !isGameMessage(message)
        );

    const activeGames =
        games.filter(
            game =>
                game.status !== "finished" &&
                game.status !== "forcequit"
        );

    if (!normal.length && !activeGames.length) {
        messagesEl.innerHTML = `
            <div class="empty">
                <div>
                    <strong>No messages yet</strong>
                    Be the first to send something.
                </div>
            </div>
        `;
        renderedElements.clear();
        return;
    }

    const fragment = document.createDocumentFragment();
    const elementIds = [];

    for (const message of normal) {
        const item = createMessageElement(message);
        fragment.appendChild(item);
        elementIds.push('msg_' + message.id);
    }

    for (const game of activeGames) {
        const gameEl = createGameElement(game);
        fragment.appendChild(gameEl);
        elementIds.push('game_' + game.id);
    }

    const currentChildren = messagesEl.children;
    const currentIds = [];

    for (let i = 0; i < currentChildren.length; i++) {
        const child = currentChildren[i];
        if (child.dataset && child.dataset.id) {
            currentIds.push(child.dataset.id);
        } else {
            currentIds.push('__temp_' + i);
        }
    }

    const newChildren = Array.from(fragment.children);
    
    if (currentIds.length !== elementIds.length || 
        currentIds.some((id, idx) => id !== elementIds[idx])) {
        
        messagesEl.replaceChildren(fragment);
        
        renderedElements.clear();
        for (let i = 0; i < newChildren.length; i++) {
            const el = newChildren[i];
            if (el.dataset && el.dataset.id) {
                renderedElements.set(el.dataset.id, el);
            }
        }
        
        if (shouldAutoScroll && settings.autoScroll) {
            requestAnimationFrame(() => {
                messagesEl.scrollTop = messagesEl.scrollHeight;
            });
        }
        
        return;
    }

    let hasNewElement = false;
    
    for (let i = 0; i < newChildren.length; i++) {
        const newEl = newChildren[i];
        const oldEl = currentChildren[i];
        
        if (newEl.dataset && newEl.dataset.id !== oldEl.dataset.id) {
            hasNewElement = true;
        }
        
        if (newEl.dataset && newEl.dataset.id === oldEl.dataset.id) {
            oldEl.replaceWith(newEl);
            renderedElements.set(newEl.dataset.id, newEl);
        } else {
            oldEl.replaceWith(newEl);
            if (newEl.dataset && newEl.dataset.id) {
                renderedElements.set(newEl.dataset.id, newEl);
            }
            hasNewElement = true;
        }
    }

    const validIds = new Set(elementIds);
    for (const [id, el] of renderedElements) {
        if (!validIds.has(id)) {
            renderedElements.delete(id);
        }
    }

    if (shouldAutoScroll && settings.autoScroll) {
        requestAnimationFrame(() => {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        });
    }
}

function escapeHtml(value) {
    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function createMessageElement(message) {

    const item =
        document.createElement("div");

    item.className = "message";
    item.dataset.id = 'msg_' + message.id;

    const avatar =
        document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
        (
            message.username ||
            "?"
        )
        .charAt(0)
        .toUpperCase();

    const content =
        document.createElement("div");

    content.className =
        "message-content";

    const top =
        document.createElement("div");

    top.className =
        "message-top";

    const name =
        document.createElement("span");

    name.className =
        "username";

    name.textContent =
        message.username ||
        "User";

    top.appendChild(name);

    if (settings.showTimestamps) {

        const time =
            document.createElement("span");

        time.className = "time";

        time.textContent =
            formatTime(
                message.created_at
            );

        top.appendChild(time);
    }

    if (message.edited) {

        const edited =
            document.createElement("span");

        edited.className =
            "edited";

        edited.textContent =
            "(edited)";

        top.appendChild(edited);
    }

    content.appendChild(top);

    if (message.message) {

        const text =
            document.createElement("div");

        text.className =
            "message-text";

        text.textContent =
            message.message;

        content.appendChild(text);
    }

    // Image (legacy single image support)
    if (message.image) {
        const img = document.createElement("img");
        img.className = "message-image";
        img.src = message.image;
        img.alt = "Image";
        img.onclick = () => {
            window.open(message.image, '_blank');
        };
        content.appendChild(img);
    }

    // Files / Images
    // Images are stored by the server as Base64 data URLs.
    if (message.files && Array.isArray(message.files) && message.files.length) {
        const fileList = document.createElement("div");
        fileList.className = "file-list";

        message.files.forEach(file => {
            const type = file.type || '';
            const isImage =
                file.image === true ||
                type.startsWith('image/') ||
                (
                    typeof file.data === 'string' &&
                    file.data.startsWith('data:image/')
                );

            if (isImage && file.data) {
                const img = document.createElement("img");
                img.className = "message-image";
                img.src = file.data;
                img.alt = file.name || "Image";
                img.loading = "lazy";
                img.decoding = "async";

                img.onclick = () => {
                    const viewer = window.open('', '_blank');
                    if (viewer) {
                        viewer.document.write(`
                            <!DOCTYPE html>
                            <html>
                            <head>
                                <title>${escapeHtml(file.name || 'Image')}</title>
                                <style>
                                    html,body{
                                        margin:0;
                                        min-height:100%;
                                        background:#111;
                                        display:grid;
                                        place-items:center;
                                    }
                                    img{
                                        max-width:100vw;
                                        max-height:100vh;
                                        object-fit:contain;
                                    }
                                </style>
                            </head>
                            <body>
                                <img src="${file.data}" alt="">
                            </body>
                            </html>
                        `);
                        viewer.document.close();
                    }
                };

                content.appendChild(img);
                return;
            }

            // Videos are shown as previews with controls. They never autoplay.
            const isVideo =
                file.video === true ||
                type.startsWith('video/') ||
                (typeof file.data === 'string' && file.data.startsWith('data:video/'));

            if (isVideo && file.data) {
                const video = document.createElement('video');
                video.className = 'message-video';
                video.src = file.data;
                video.controls = true;
                video.autoplay = false;
                video.preload = 'metadata';
                video.playsInline = true;
                video.setAttribute('playsinline', '');
                content.appendChild(video);
                return;
            }

            // Non-image files remain downloadable Base64 data URLs.
            const fileEl = document.createElement("div");
            fileEl.className = "message-file";

            const icon = document.createElement("span");
            icon.className = "file-icon";
            icon.textContent =
                getFileIcon(type, file.name || 'file');

            const info = document.createElement("div");
            info.className = "file-info";

            const nameEl = document.createElement("div");
            nameEl.className = "file-name";
            nameEl.textContent =
                file.name || 'Unknown file';

            const sizeEl = document.createElement("div");
            sizeEl.className = "file-size";
            sizeEl.textContent =
                file.size ? formatFileSize(file.size) : '';

            info.appendChild(nameEl);
            info.appendChild(sizeEl);

            fileEl.appendChild(icon);
            fileEl.appendChild(info);

            fileEl.onclick = () => {
                if (file.data) {
                    const a =
                        document.createElement('a');

                    a.href = file.data;
                    a.download =
                        file.name || 'download';
                    a.target = '_blank';
                    a.click();
                }
            };

            fileList.appendChild(fileEl);
        });

        if (fileList.children.length) {
            content.appendChild(fileList);
        }
    }

    item.appendChild(avatar);
    item.appendChild(content);

    return item;
}

async function createGame(gameType){

    if(!settings.username){

        settingsBtn.click();

        alert(
            "Set your name before creating a game."
        );

        return;
    }

    const existing=
        games.find(
            game=>
                game.hostDeviceId===
                    deviceId &&
                game.status!=="finished" &&
                game.status!=="forcequit"
        );

    if(existing){

        alert(
            "You are already hosting a game."
        );

        gamesOverlay.classList.remove(
            "show"
        );

        return;
    }

    const info=
        GAME_TYPES[gameType];

    if(!info)return;

    const game={

        type:"game",

        id:
            "game_"+

            Date.now().toString(36)+

            "_"+

            Math.random()
                .toString(36)
                .slice(2,8),

        gameType,

        name:
            info.name,

        icon:
            info.icon,

        host:
            settings.username,

        hostDeviceId:
            deviceId,

        status:
            "lobby",

        players:[

            {
                deviceId,
                username:
                    settings.username
            }

        ],

        maxPlayers:
            info.max,

        minPlayers:
            info.min,

        turnIndex:0,

        createdAt:
            Date.now(),

        board:[],

        winner:null,

        data:{
            settings: getDefaultSettings(gameType)
        }
    };

    // Set game-specific size
    if (info.size) {
        game.data.settings.boardSize = info.size;
    }

    try{

        await writeGameState(
            game
        );

        gamesOverlay.classList.remove(
            "show"
        );

        await loadMessages();

    }catch(error){

        alert(
            "Could not create game:\n\n"+
            error.message
        );
    }
}

function getDefaultSettings(gameType){
    const settings = {
        ttt3: { boardSize: 3 },
        ttt4: { boardSize: 4 },
        ttt5: { boardSize: 5 },
        ttt6: { boardSize: 6 },
        memory: { gridSize: 4 },
        quickdraw: { rounds: 3 },
        coinflip: { targetScore: 3 },
        numberguess: { maxNumber: 100 },
        target: { targets: 5 },
        reaction: { rounds: 1 },
        type: { sentenceCount: 1 },
        boss: { bossHealth: 100000000 },
        trivia: { questions: 5 },
        wordscramble: { rounds: 5 },
        mathrace: { problems: 5 },
        ttttournament: { rounds: 3 },
        rpstournament: { rounds: 3 }
    };
    return settings[gameType] || {};
}

async function writeGameState(game){

    const payload=
        GAME_PREFIX+
        JSON.stringify(game);

    await apiPost({

        username:
            "__GAME__",

        channel:
            CHANNEL,

        message:
            payload,

        image:null,

        files: [],

        device_id:
            game.hostDeviceId
    });
}

   CREATE GAME ELEMENT - DISPATCHER
===================================================== */

function createGameElement(game){
    const wrapper = document.createElement("div");
    wrapper.className = "game-message";
    wrapper.dataset.id = 'game_' + game.id;

    const card = document.createElement("div");
    card.className = "game-card";

    // Header
    const header = document.createElement("div");
    header.className = "game-header";

    const title = document.createElement("div");
    title.className = "game-title";
    title.textContent = game.icon + " " + game.name;

    const status = document.createElement("div");
    status.className = "game-status";
    status.textContent = game.status === "lobby" ? "WAITING" : "PLAYING";

    header.appendChild(title);
    header.appendChild(status);

    // Body
    const body = document.createElement("div");
    body.className = "game-body";

    // Info
    const info = document.createElement("div");
    info.className = "game-info";
    info.innerHTML = `
        <div class="game-pill">
            Host: <strong>${escapeHtml(game.host)}</strong>
        </div>
        <div class="game-pill">
            Players: <strong>${game.players.length}/${game.maxPlayers}</strong>
        </div>
        <div class="game-pill">
            Min Players: <strong>${game.minPlayers || 2}</strong>
        </div>
    `;
    body.appendChild(info);

    // Description
    const desc = document.createElement("div");
    desc.className = "game-description";
    desc.textContent = game.status === "lobby" 
        ? "Join before the host starts. Everyone else can spectate."
        : getGameDescription(game);
    body.appendChild(desc);

    // Players
    const players = document.createElement("div");
    players.className = "players-list";
    game.players.forEach(player => {
        const chip = document.createElement("div");
        chip.className = "player-chip";
        if (player.deviceId === game.hostDeviceId) chip.classList.add("host");
        chip.textContent = player.username + (player.deviceId === game.hostDeviceId ? " 👑" : "");
        players.appendChild(chip);
    });
    body.appendChild(players);

    // GAME SETTINGS - Only show in lobby to host
    if (game.status === "lobby" && game.hostDeviceId === deviceId) {
        const settingsDiv = document.createElement("div");
        settingsDiv.className = "game-settings";
        settingsDiv.innerHTML = `<h4>⚙️ Game Settings (Host only)</h4>`;
        settingsDiv.appendChild(createSettingsUI(game));
        body.appendChild(settingsDiv);
    }

    // Turn banner
    if (game.status === "playing") {
        const turn = document.createElement("div");
        turn.className = "turn-banner";
        const current = game.players[game.turnIndex % Math.max(game.players.length, 1)];
        if (current) {
            turn.innerHTML = "Current turn: <strong>" + escapeHtml(current.username) + "</strong>";
        }
        body.appendChild(turn);
    }

    // Game board
    const board = createGameBoard(game);
    if (board) body.appendChild(board);

    // Actions
    const actions = document.createElement("div");
    actions.className = "game-actions";

    if (game.status === "lobby") {
        const joined = game.players.some(p => p.deviceId === deviceId);
        
        if (!joined && game.players.length < game.maxPlayers) {
            const join = document.createElement("button");
            join.className = "game-btn green";
            join.textContent = "Join game";
            join.onclick = async () => await joinGame(game);
            actions.appendChild(join);
        } else if (joined) {
            const leave = document.createElement("button");
            leave.className = "game-btn";
            leave.textContent = "Leave";
            leave.onclick = async () => await leaveGame(game);
            actions.appendChild(leave);
        }

        if (game.hostDeviceId === deviceId) {
            const start = document.createElement("button");
            start.className = "game-btn primary";
            start.textContent = "Start game";
            start.disabled = game.players.length < (game.minPlayers || 2);
            start.onclick = async () => await startGame(game);
            actions.appendChild(start);

            const quit = document.createElement("button");
            quit.className = "game-btn danger";
            quit.textContent = "Force quit";
            quit.onclick = () => openConfirm("Force quit game?", "Everyone will be removed from this game.", () => forceQuitGame(game));
            actions.appendChild(quit);
        }
    } else if (game.status === "playing") {
        const mine = game.players.some(p => p.deviceId === deviceId);
        
        if (mine) {
            const leave = document.createElement("button");
            leave.className = "game-btn";
            leave.textContent = "Leave game";
            leave.onclick = async () => await leaveGame(game);
            actions.appendChild(leave);
        }

        if (game.hostDeviceId === deviceId) {
            const quit = document.createElement("button");
            quit.className = "game-btn danger";
            quit.textContent = "Force quit";
            quit.onclick = () => openConfirm("Force quit game?", "Everyone will be removed.", () => forceQuitGame(game));
            actions.appendChild(quit);
        }
    }

    body.appendChild(actions);
    card.appendChild(header);
    card.appendChild(body);
    wrapper.appendChild(card);

    return wrapper;
}

/* =====================================================
   TIC TAC TOE (2-3 Players)
===================================================== */

function createTTT(game){
    const size = game.data.settings?.boardSize || 3;
    const total = size * size;
    const winCount = size;
    const playerCount = game.players.length;
    
    if (!game.data.board || game.data.board.length !== total) {
        game.data.board = Array(total).fill("");
    }

    const board = document.createElement("div");
    board.className = "ttt";
    const cellSize = size <= 3 ? 80 : size <= 4 ? 70 : size <= 5 ? 60 : 50;
    board.style.gridTemplateColumns = `repeat(${size}, ${cellSize}px)`;
    board.style.gridTemplateRows = `repeat(${size}, ${cellSize}px)`;

    const mine = game.players.some(p => p.deviceId === deviceId);
    const current = game.players[game.turnIndex % game.players.length];
    const myTurn = mine && current && current.deviceId === deviceId;

    const symbols = ["❌", "⭕", "🔺"];
    const symbolClasses = ["symbol-X", "symbol-O", "symbol-triangle"];

    for (let i = 0; i < total; i++) {
        const button = document.createElement("button");
        const value = game.data.board[i];
        button.textContent = value || "";
        if (value) {
            const idx = symbols.indexOf(value);
            if (idx !== -1) button.className = symbolClasses[idx];
        }
        button.style.fontSize = size <= 3 ? "32px" : size <= 4 ? "28px" : size <= 5 ? "24px" : "20px";
        button.disabled = !myTurn || !!game.data.board[i] || !!game.winner;
        button.onclick = async () => {
            const copy = JSON.parse(JSON.stringify(game));
            const idx = copy.turnIndex % copy.players.length;
            const symbol = symbols[idx];
            copy.data.board[i] = symbol;
            
            if (checkTTTWin(copy.data.board, size, i, symbol, winCount)) {
                copy.winner = current.username;
                copy.status = "finished";
            } else if (copy.data.board.every(c => c)) {
                copy.winner = "draw";
                copy.status = "finished";
            } else {
                copy.turnIndex++;
            }
            await publishGameAndCleanup(game, copy);
        };
        board.appendChild(button);
    }
    return board;
}

function checkTTTWin(board, size, pos, symbol, winCount){
    const row = Math.floor(pos / size);
    const col = pos % size;
    
    const dirs = [[1,0],[0,1],[1,1],[1,-1]];
    for (const [dr, dc] of dirs) {
        let count = 1;
        for (const dir of [-1,1]) {
            let r = row + dr * dir, c = col + dc * dir;
            while (r >= 0 && r < size && c >= 0 && c < size && board[r * size + c] === symbol) {
                count++;
                r += dr * dir;
                c += dc * dir;
            }
        }
        if (count >= winCount) return true;
    }
    return false;
}


/* =====================================================
   MEMORY MATCH
===================================================== */

function createMemory(game){
    const area = document.createElement("div");
    const emojis = ["🍎","🍊","🍋","🍇","🍉","🍓","🍑","🍒","🥝","🍍","🥭","🍌","🍈","🫐","🍐","🥥","🧸","🎈","🎀","🎁","🌟","🌈","🦄","🐉","🐱","🐶","🐰","🦊","🐼","🐨"];
    
    const gridSize = game.data.settings?.gridSize || 4;
    const totalCards = gridSize * gridSize;
    const pairs = totalCards / 2;
    const usedEmojis = emojis.slice(0, pairs);
    let cards = [...usedEmojis, ...usedEmojis];
    
    if (!game.data.cards) {
        for (let i = cards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [cards[i], cards[j]] = [cards[j], cards[i]];
        }
        game.data.cards = cards;
        game.data.flipped = [];
        game.data.matched = [];
        game.data.scores = {};
    }

    const grid = document.createElement("div");
    grid.className = "memory-grid";
    grid.style.gridTemplateColumns = `repeat(${gridSize}, ${gridSize <= 4 ? 70 : 60}px)`;

    const mine = game.players.some(p => p.deviceId === deviceId);
    const current = game.players[game.turnIndex % game.players.length];
    const myTurn = mine && current && current.deviceId === deviceId;

    const flipped = game.data.flipped || [];
    const matched = game.data.matched || [];

    for (let i = 0; i < game.data.cards.length; i++) {
        const card = document.createElement("div");
        card.className = "memory-card";
        if (matched.includes(i)) {
            card.classList.add("matched");
            card.textContent = game.data.cards[i];
        } else if (flipped.includes(i)) {
            card.classList.add("flipped");
            card.textContent = game.data.cards[i];
        }
        
        if (!matched.includes(i) && myTurn && !flipped.includes(i) && flipped.length < 2) {
            card.onclick = async () => {
                const copy = JSON.parse(JSON.stringify(game));
                const flips = copy.data.flipped || [];
                if (flips.includes(i) || flips.length >= 2) return;
                flips.push(i);
                copy.data.flipped = flips;
                
                if (flips.length === 2) {
                    const cardsData = copy.data.cards;
                    if (cardsData[flips[0]] === cardsData[flips[1]]) {
                        copy.data.matched = (copy.data.matched || []).concat(flips);
                        copy.data.flipped = [];
                        copy.data.scores = copy.data.scores || {};
                        copy.data.scores[current.deviceId] = (copy.data.scores[current.deviceId] || 0) + 1;
                        if (copy.data.matched.length === copy.data.cards.length) {
                            let winner = null;
                            let max = -1;
                            for (const [id, score] of Object.entries(copy.data.scores)) {
                                if (score > max) {
                                    max = score;
                                    winner = copy.players.find(p => p.deviceId === id)?.username;
                                }
                            }
                            copy.winner = winner || "draw";
                            copy.status = "finished";
                        }
                    } else {
                        copy.turnIndex++;
                        setTimeout(async () => {
                            const resetCopy = JSON.parse(JSON.stringify(copy));
                            resetCopy.data.flipped = [];
                            await publishGameAndCleanup(game, resetCopy);
                        }, 800);
                        await publishGameAndCleanup(game, copy);
                        return;
                    }
                }
                await publishGameAndCleanup(game, copy);
            };
        }
        grid.appendChild(card);
    }
    area.appendChild(grid);

    const scoreDiv = document.createElement("div");
    scoreDiv.style.cssText = "text-align:center;margin-top:10px;color:#9da5b0;";
    const scores = game.data.scores || {};
    scoreDiv.textContent = game.players.map(p => 
        escapeHtml(p.username) + ": " + (scores[p.deviceId] || 0)
    ).join(" · ");
    area.appendChild(scoreDiv);

    return area;
}


/* =====================================================
   QUICK DRAW
===================================================== */

function createQuickDraw(game){
    const area = document.createElement("div");
    area.className = "quickdraw-area";

    const mine = game.players.some(p => p.deviceId === deviceId);
    const current = game.players[game.turnIndex % game.players.length];
    const myTurn = mine && current && current.deviceId === deviceId;

    const state = game.data.state || "waiting";
    const round = game.data.round || 0;
    const results = game.data.results || {};
    const totalRounds = game.data.settings?.rounds || 3;

    const box = document.createElement("div");
    box.className = "quickdraw-box " + state;

    if (state === "waiting") {
        box.textContent = "⏳ Round " + (round + 1) + "/" + totalRounds + "\nWaiting for " + (myTurn ? "you" : current.username);
        if (myTurn) {
            box.onclick = async () => {
                const copy = JSON.parse(JSON.stringify(game));
                copy.data.state = "countdown";
                copy.data.startTime = Date.now() + 1000 + Math.random() * 3000;
                copy.data.round = round;
                await publishGameAndCleanup(game, copy);
            };
        }
    } else if (state === "countdown") {
        const remaining = Math.max(0, (game.data.startTime - Date.now()) / 1000);
        box.textContent = "⏳ " + Math.ceil(remaining);
        if (remaining < 0.5 && myTurn) {
            setTimeout(async () => {
                const copy = JSON.parse(JSON.stringify(game));
                copy.data.state = "draw";
                copy.data.drawTime = Date.now();
                await publishGameAndCleanup(game, copy);
            }, Math.max(0, game.data.startTime - Date.now() + 100));
        }
    } else if (state === "draw") {
        box.textContent = "🟢 DRAW! CLICK!";
        box.style.cursor = "pointer";
        if (myTurn) {
            box.onclick = async () => {
                const reactionTime = Date.now() - game.data.drawTime;
                const copy = JSON.parse(JSON.stringify(game));
                copy.data.results = copy.data.results || {};
                copy.data.results[deviceId] = reactionTime;
                copy.turnIndex++;
                copy.data.round = (round + 1);
                
                if (copy.data.round >= totalRounds) {
                    let winner = null;
                    let best = Infinity;
                    const averages = {};
                    for (const player of copy.players) {
                        const times = [];
                        for (const [id, time] of Object.entries(copy.data.results || {})) {
                            if (id === player.deviceId) times.push(time);
                        }
                        if (times.length > 0) {
                            averages[player.deviceId] = times.reduce((a,b) => a+b, 0) / times.length;
                        }
                    }
                    for (const [id, avg] of Object.entries(averages)) {
                        if (avg < best) {
                            best = avg;
                            winner = copy.players.find(p => p.deviceId === id)?.username;
                        }
                    }
                    copy.winner = winner + " (" + Math.round(best) + "ms avg)";
                    copy.status = "finished";
                } else {
                    copy.data.state = "waiting";
                }
                await publishGameAndCleanup(game, copy);
            };
        } else {
            box.textContent = "🟢 Waiting for " + current.username + "...";
        }
    } else if (state === "punish") {
        box.textContent = "❌ Too early! Punished!";
        box.classList.add("punish");
        setTimeout(async () => {
            const copy = JSON.parse(JSON.stringify(game));
            copy.data.state = "waiting";
            copy.turnIndex++;
            await publishGameAndCleanup(game, copy);
        }, 1000);
    }

    area.appendChild(box);

    if (Object.keys(results).length > 0) {
        const resultsDiv = document.createElement("div");
        resultsDiv.style.cssText = "color:#9da5b0;margin-top:10px;font-size:13px;";
        const sorted = Object.entries(results).sort((a,b) => a[1] - b[1]);
        resultsDiv.innerHTML = sorted.map(([id, time]) => {
            const name = game.players.find(p => p.deviceId === id)?.username || "Unknown";
            return `<span style="margin:0 8px;">${escapeHtml(name)}: ${time}ms</span>`;
        }).join("");
        area.appendChild(resultsDiv);
    }

    return area;
}

function createNumberGuess(game){
    const area = document.createElement("div");
    area.className = "numberguess-area";

    const maxNumber = game.data.settings?.maxNumber || 100;
    const mine = game.players.some(p => p.deviceId === deviceId);
    const current = game.players[game.turnIndex % game.players.length];
    const myTurn = mine && current && current.deviceId === deviceId;

    if (!game.data.secretNumber) {
        game.data.secretNumber = Math.floor(Math.random() * maxNumber) + 1;
        game.data.guesses = [];
        game.data.hint = "🔢 Guess a number between 1 and " + maxNumber;
    }

    if (game.winner) {
        const win = document.createElement("div");
        win.className = "turn-banner";
        win.textContent = "🎉 " + game.winner + " guessed it! The number was " + game.data.secretNumber;
        area.appendChild(win);
        return area;
    }

    if (!myTurn) {
        const waiting = document.createElement("div");
        waiting.className = "turn-banner";
        waiting.textContent = "Waiting for " + current.username + "...";
        area.appendChild(waiting);
        return area;
    }

    const hint = document.createElement("div");
    hint.className = "numberguess-hint";
    hint.textContent = game.data.hint || "🔢 Guess a number";
    area.appendChild(hint);

    const input = document.createElement("input");
    input.className = "numberguess-input";
    input.type = "number";
    input.min = 1;
    input.max = maxNumber;
    input.placeholder = "Guess...";
    input.autofocus = true;

    input.onkeydown = async (e) => {
        if (e.key === "Enter") {
            const guess = parseInt(input.value);
            if (isNaN(guess) || guess < 1 || guess > maxNumber) return;
            
            const copy = JSON.parse(JSON.stringify(game));
            const secret = copy.data.secretNumber;
            
            if (guess === secret) {
                copy.winner = current.username;
                copy.status = "finished";
            } else {
                copy.data.hint = guess < secret ? "⬆ Higher! (" + guess + ")" : "⬇ Lower! (" + guess + ")";
                copy.data.guesses = copy.data.guesses || [];
                copy.data.guesses.push({ player: current.username, guess });
                copy.turnIndex++;
            }
            input.value = "";
            await publishGameAndCleanup(game, copy);
        }
    };

    area.appendChild(input);

    if (game.data.guesses && game.data.guesses.length > 0) {
        const guessesDiv = document.createElement("div");
        guessesDiv.style.cssText = "color:#6a7a8a;font-size:12px;margin-top:10px;";
        const lastGuesses = game.data.guesses.slice(-5);
        guessesDiv.textContent = "Recent: " + lastGuesses.map(g => g.player + "→" + g.guess).join(", ");
        area.appendChild(guessesDiv);
    }

    return area;
}
