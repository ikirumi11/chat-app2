<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Chat</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{

    --bg:#0b0b0d;
    --panel:#121216;
    --panel2:#18181d;
    --panel3:#202026;

    --text:#eeeeee;
    --muted:#85858f;

    --accent:#6d7cff;
    --accent2:#8793ff;

    --border:#292930;

    --danger:#ff5c6c;
    --success:#55d98b;

}

body{

    font-family:
        Inter,
        Arial,
        sans-serif;

    background:
        var(--bg);

    color:
        var(--text);

    height:100vh;

    overflow:hidden;

}


/* =====================================================
   APP
===================================================== */

.app{

    height:100vh;

    display:flex;

}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

    width:260px;

    background:
        var(--panel);

    border-right:
        1px solid var(--border);

    display:flex;

    flex-direction:column;

    transition:
        .25s;

}


.logo{

    height:70px;

    display:flex;

    align-items:center;

    padding:
        0 22px;

    border-bottom:
        1px solid var(--border);

    font-size:21px;

    font-weight:800;

}


.logo span{

    color:
        var(--accent);

}


.channels{

    padding:
        20px 12px;

    flex:1;

}


.channel-title{

    color:
        var(--muted);

    font-size:11px;

    font-weight:800;

    text-transform:
        uppercase;

    letter-spacing:
        1px;

    padding:
        0 10px 10px;

}


.channel{

    width:100%;

    border:0;

    background:
        transparent;

    color:
        var(--muted);

    padding:
        11px 12px;

    border-radius:
        8px;

    text-align:left;

    font-size:14px;

    cursor:pointer;

}


.channel:hover{

    background:
        var(--panel2);

    color:
        var(--text);

}


.channel.active{

    background:
        var(--panel3);

    color:
        var(--text);

}


.channel-icon{

    margin-right:8px;

    color:
        var(--muted);

}


/* =====================================================
   SIDEBAR FOOTER
===================================================== */

.sidebar-footer{

    padding:
        12px;

    border-top:
        1px solid var(--border);

}


.settings-button{

    width:100%;

    border:0;

    background:
        transparent;

    color:
        var(--muted);

    padding:
        11px;

    border-radius:
        8px;

    cursor:pointer;

    text-align:left;

}


.settings-button:hover{

    background:
        var(--panel2);

    color:
        var(--text);

}


/* =====================================================
   MAIN
===================================================== */

.main{

    flex:1;

    min-width:0;

    display:flex;

    flex-direction:column;

}


/* =====================================================
   HEADER
===================================================== */

.header{

    height:70px;

    border-bottom:
        1px solid var(--border);

    background:
        var(--panel);

    display:flex;

    align-items:center;

    padding:
        0 22px;

}


.channel-name{

    font-size:17px;

    font-weight:700;

}


.channel-name span{

    color:
        var(--muted);

    margin-right:6px;

}


.status{

    margin-left:auto;

    font-size:12px;

    color:
        var(--muted);

}


.status-dot{

    display:inline-block;

    width:7px;

    height:7px;

    border-radius:50%;

    background:
        var(--success);

    margin-right:6px;

}


/* =====================================================
   MESSAGES
===================================================== */

.messages{

    flex:1;

    overflow-y:auto;

    padding:
        25px;

    scroll-behavior:smooth;

}


.messages::-webkit-scrollbar{

    width:8px;

}


.messages::-webkit-scrollbar-thumb{

    background:
        var(--panel3);

    border-radius:20px;

}


.message{

    display:flex;

    gap:12px;

    margin-bottom:22px;

    animation:
        messageIn .18s ease;

}


@keyframes messageIn{

    from{

        opacity:0;

        transform:
            translateY(5px);

    }

    to{

        opacity:1;

        transform:
            translateY(0);

    }

}


.avatar{

    width:38px;

    height:38px;

    border-radius:50%;

    background:
        var(--accent);

    display:flex;

    align-items:center;

    justify-content:center;

    flex-shrink:0;

    font-size:14px;

    font-weight:800;

    color:white;

}


.message-content{

    min-width:0;

}


.message-top{

    display:flex;

    align-items:center;

    gap:9px;

    margin-bottom:4px;

}


.username{

    font-weight:700;

    font-size:14px;

}


.time{

    color:
        var(--muted);

    font-size:11px;

}


.message-text{

    color:
        #d6d6db;

    font-size:14px;

    line-height:1.55;

    white-space:pre-wrap;

    word-break:break-word;

}


.message-image{

    display:block;

    max-width:min(500px, 100%);

    max-height:500px;

    object-fit:contain;

    border-radius:10px;

    margin-top:9px;

    border:
        1px solid var(--border);

    cursor:pointer;

}


/* =====================================================
   EMPTY
===================================================== */

.empty{

    height:100%;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    color:
        var(--muted);

}


.empty-icon{

    font-size:45px;

    margin-bottom:12px;

}


.empty h2{

    color:
        var(--text);

    margin-bottom:5px;

}


/* =====================================================
   INPUT
===================================================== */

.input-area{

    padding:
        14px 20px 20px;

}


.image-preview{

    display:none;

    margin-bottom:8px;

    background:
        var(--panel);

    border:
        1px solid var(--border);

    border-radius:10px;

    padding:8px;

    position:relative;

    width:max-content;

    max-width:100%;

}


.image-preview img{

    display:block;

    max-width:200px;

    max-height:150px;

    border-radius:6px;

}


.remove-image{

    position:absolute;

    top:-8px;

    right:-8px;

    width:25px;

    height:25px;

    border:0;

    border-radius:50%;

    background:
        var(--danger);

    color:white;

    cursor:pointer;

    font-weight:bold;

}


.input-box{

    display:flex;

    align-items:flex-end;

    gap:8px;

    background:
        var(--panel2);

    border:
        1px solid var(--border);

    border-radius:12px;

    padding:7px;

}


.input-box:focus-within{

    border-color:
        var(--accent);

}


textarea{

    flex:1;

    resize:none;

    border:0;

    outline:0;

    background:transparent;

    color:
        var(--text);

    font-family:inherit;

    font-size:14px;

    line-height:1.5;

    min-height:42px;

    max-height:180px;

    padding:
        10px;

}


textarea::placeholder{

    color:
        var(--muted);

}


.icon-button{

    width:40px;

    height:40px;

    border:0;

    border-radius:8px;

    background:transparent;

    color:
        var(--muted);

    cursor:pointer;

    font-size:18px;

}


.icon-button:hover{

    background:
        var(--panel3);

    color:
        var(--text);

}


.send-button{

    width:44px;

    height:40px;

    border:0;

    border-radius:8px;

    background:
        var(--accent);

    color:white;

    cursor:pointer;

    font-size:17px;

}


.send-button:hover{

    background:
        var(--accent2);

}


.send-button:disabled{

    opacity:.45;

    cursor:not-allowed;

}


.input-hint{

    font-size:10px;

    color:
        var(--muted);

    margin-top:7px;

    text-align:right;

}


/* =====================================================
   USERNAME SETUP
===================================================== */

.overlay{

    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.75);

    backdrop-filter:
        blur(8px);

    display:none;

    align-items:center;

    justify-content:center;

    z-index:100;

}


.setup-card{

    width:min(420px, calc(100% - 30px));

    background:
        var(--panel);

    border:
        1px solid var(--border);

    border-radius:15px;

    padding:28px;

}


.setup-card h2{

    margin-bottom:8px;

}


.setup-card p{

    color:
        var(--muted);

    font-size:13px;

    margin-bottom:20px;

}


.input{

    width:100%;

    background:
        var(--panel2);

    border:
        1px solid var(--border);

    border-radius:8px;

    color:
        var(--text);

    padding:12px;

    outline:0;

}


.input:focus{

    border-color:
        var(--accent);

}


.primary{

    width:100%;

    border:0;

    border-radius:8px;

    background:
        var(--accent);

    color:white;

    padding:12px;

    margin-top:12px;

    cursor:pointer;

    font-weight:700;

}


/* =====================================================
   SETTINGS
===================================================== */

.settings-panel{

    position:fixed;

    right:20px;

    top:80px;

    width:300px;

    background:
        var(--panel);

    border:
        1px solid var(--border);

    border-radius:14px;

    padding:18px;

    z-index:50;

    box-shadow:
        0 20px 60px rgba(0,0,0,.4);

    display:none;

}


.settings-panel.open{

    display:block;

}


.settings-title{

    font-weight:800;

    margin-bottom:15px;

}


.setting-label{

    font-size:12px;

    color:
        var(--muted);

    margin-bottom:8px;

}


.themes{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:7px;

}


.theme{

    border:
        1px solid var(--border);

    background:
        var(--panel2);

    color:
        var(--text);

    padding:9px;

    border-radius:7px;

    cursor:pointer;

    text-align:left;

    font-size:12px;

}


.theme:hover{

    border-color:
        var(--accent);

}


/* =====================================================
   MOBILE
===================================================== */

.mobile-menu{

    display:none;

}


@media(max-width:700px){

    .sidebar{

        position:fixed;

        left:-270px;

        top:0;

        bottom:0;

        z-index:80;

    }


    .sidebar.open{

        left:0;

    }


    .mobile-menu{

        display:block;

        width:38px;

        height:38px;

        border:0;

        background:transparent;

        color:var(--text);

        font-size:20px;

        margin-right:8px;

    }


    .messages{

        padding:
            18px 14px;

    }


    .input-area{

        padding:
            10px;

    }


    .header{

        padding:
            0 10px;

    }


    .status{

        display:none;

    }


    .settings-panel{

        right:10px;

        left:10px;

        width:auto;

    }

}

</style>
</head>

<body>

<div class="app">


    <!-- =================================================
         SIDEBAR
    ================================================== -->

    <aside class="sidebar" id="sidebar">

        <div class="logo">

            Chat<span>.</span>

        </div>


        <div class="channels">

            <div class="channel-title">

                Channels

            </div>


            <button
                class="channel active"
                id="generalChannel">

                <span class="channel-icon">#</span>

                general

            </button>

        </div>


        <div class="sidebar-footer">

            <button
                class="settings-button"
                id="settingsButton">

                ⚙ Settings

            </button>

        </div>

    </aside>


    <!-- =================================================
         MAIN
    ================================================== -->

    <main class="main">


        <header class="header">

            <button
                class="mobile-menu"
                id="mobileMenu">

                ☰

            </button>


            <div class="channel-name">

                <span>#</span> general

            </div>


            <div class="status">

                <span class="status-dot"></span>

                Connected

            </div>

        </header>


        <!-- =================================================
             MESSAGES
        ================================================== -->

        <section
            class="messages"
            id="messages">

            <div class="empty" id="empty">

                <div>

                    <div class="empty-icon">

                        💬

                    </div>

                    <h2>

                        Welcome to general

                    </h2>

                    <p>

                        Be the first to send a message.

                    </p>

                </div>

            </div>

        </section>


        <!-- =================================================
             INPUT
        ================================================== -->

        <div class="input-area">


            <div
                class="image-preview"
                id="imagePreview">

                <img
                    id="previewImage"
                    alt="Image preview">

                <button
                    class="remove-image"
                    id="removeImage">

                    ×

                </button>

            </div>


            <div class="input-box">


                <button
                    class="icon-button"
                    id="imageButton"
                    title="Send image">

                    📎

                </button>


                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                    hidden>


                <textarea
                    id="messageInput"
                    placeholder="Message #general"
                    rows="1"></textarea>


                <button
                    class="send-button"
                    id="sendButton">

                    ➤

                </button>


            </div>


            <div class="input-hint">

                Enter to send · Shift+Enter for new line

            </div>

        </div>

    </main>

</div>


<!-- =====================================================
     SETTINGS
===================================================== -->

<div
    class="settings-panel"
    id="settingsPanel">

    <div class="settings-title">

        Settings

    </div>


    <div class="setting-label">

        Theme

    </div>


    <div class="themes">


        <button
            class="theme"
            data-theme="dark">

            Dark

        </button>


        <button
            class="theme"
            data-theme="midnight">

            Midnight

        </button>


        <button
            class="theme"
            data-theme="purple">

            Purple

        </button>


        <button
            class="theme"
            data-theme="blue">

            Ocean

        </button>


        <button
            class="theme"
            data-theme="red">

            Red

        </button>


        <button
            class="theme"
            data-theme="green">

            Forest

        </button>


        <button
            class="theme"
            data-theme="orange">

            Ember

        </button>


        <button
            class="theme"
            data-theme="pink">

            Pink

        </button>


        <button
            class="theme"
            data-theme="cyan">

            Cyan

        </button>


        <button
            class="theme"
            data-theme="gray">

            Slate

        </button>


    </div>

</div>


<!-- =====================================================
     USERNAME SETUP
===================================================== -->

<div
    class="overlay"
    id="setupOverlay">

    <div class="setup-card">

        <h2>

            Welcome

        </h2>

        <p>

            Choose a username to enter the chat.

        </p>


        <input
            class="input"
            id="usernameInput"
            maxlength="24"
            placeholder="Username">


        <button
            class="primary"
            id="joinButton">

            Enter Chat

        </button>

    </div>

</div>


<script>

/* ========================================================
   CONFIG
======================================================== */

// Because this HTML is deployed on the SAME Vercel project
// as /api/messages.js, this works automatically.

const API_URL = "/api/messages";

const CHANNEL = "general";


/* ========================================================
   ELEMENTS
======================================================== */

const messagesElement =
    document.getElementById("messages");

const emptyElement =
    document.getElementById("empty");

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const imageButton =
    document.getElementById("imageButton");

const imageInput =
    document.getElementById("imageInput");

const imagePreview =
    document.getElementById("imagePreview");

const previewImage =
    document.getElementById("previewImage");

const removeImage =
    document.getElementById("removeImage");

const setupOverlay =
    document.getElementById("setupOverlay");

const usernameInput =
    document.getElementById("usernameInput");

const joinButton =
    document.getElementById("joinButton");

const settingsButton =
    document.getElementById("settingsButton");

const settingsPanel =
    document.getElementById("settingsPanel");

const sidebar =
    document.getElementById("sidebar");

const mobileMenu =
    document.getElementById("mobileMenu");


/* ========================================================
   STATE
======================================================== */

let username =
    localStorage.getItem("chat_username") || "";

let selectedImage = null;

let loadingMessages = false;


/* ========================================================
   USERNAME
======================================================== */

if(!username){

    setupOverlay.style.display =
        "flex";

    setTimeout(() => {

        usernameInput.focus();

    },100);

}


/* ========================================================
   JOIN
======================================================== */

joinButton.addEventListener(
    "click",
    saveUsername
);


usernameInput.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){

            saveUsername();

        }

    }
);


function saveUsername(){

    const name =
        usernameInput.value
        .trim()
        .substring(0,24);


    if(!name){

        alert(
            "Please enter a username."
        );

        return;

    }


    username =
        name;


    localStorage.setItem(
        "chat_username",
        username
    );


    setupOverlay.style.display =
        "none";


    loadMessages();

}


/* ========================================================
   IMAGE BUTTON
======================================================== */

imageButton.addEventListener(
    "click",
    () => {

        imageInput.click();

    }
);


/* ========================================================
   IMAGE SELECT
======================================================== */

imageInput.addEventListener(
    "change",
    async event => {

        const file =
            event.target.files[0];


        if(!file){

            return;

        }


        if(!file.type.startsWith("image/")){

            alert(
                "Please choose an image."
            );

            return;

        }


        try{

            selectedImage =
                await resizeImage(file);


            previewImage.src =
                selectedImage;


            imagePreview.style.display =
                "block";

        }
        catch(error){

            console.error(error);

            alert(
                "Could not process the image."
            );

        }

    }
);


/* ========================================================
   IMAGE RESIZE
======================================================== */

function resizeImage(file){

    return new Promise(
        (resolve,reject) => {

            const reader =
                new FileReader();


            reader.onload =
                event => {

                    const img =
                        new Image();


                    img.onload =
                        () => {

                            const MAX =
                                1500;


                            let width =
                                img.width;

                            let height =
                                img.height;


                            /*
                             * Keep original size if
                             * already below 1500x1500.
                             */

                            if(
                                width > MAX ||
                                height > MAX
                            ){

                                const scale =
                                    Math.min(
                                        MAX / width,
                                        MAX / height
                                    );


                                width =
                                    Math.round(
                                        width * scale
                                    );


                                height =
                                    Math.round(
                                        height * scale
                                    );

                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            /*
                             * Better resizing quality.
                             */

                            ctx.imageSmoothingEnabled =
                                true;

                            ctx.imageSmoothingQuality =
                                "high";


                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );


                            /*
                             * JPEG compression.
                             *
                             * 0.78 = good quality
                             * with much smaller Base64.
                             */

                            const result =
                                canvas.toDataURL(
                                    "image/jpeg",
                                    0.78
                                );


                            resolve(result);

                        };


                    img.onerror =
                        reject;


                    img.src =
                        event.target.result;

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(file);

        }
    );

}


/* ========================================================
   REMOVE IMAGE
======================================================== */

removeImage.addEventListener(
    "click",
    clearImage
);


function clearImage(){

    selectedImage =
        null;

    imageInput.value =
        "";

    previewImage.src =
        "";

    imagePreview.style.display =
        "none";

}


/* ========================================================
   SEND
======================================================== */

sendButton.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* ========================================================
   SEND MESSAGE
======================================================== */

async function sendMessage(){

    const message =
        input.value
        .trim();


    if(
        !message &&
        !selectedImage
    ){

        return;

    }


    if(!username){

        setupOverlay.style.display =
            "flex";

        return;

    }


    sendButton.disabled =
        true;


    try{

        const response =
            await fetch(
                API_URL,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            username:
                                username,

                            channel:
                                CHANNEL,

                            message:
                                message,

                            image:
                                selectedImage

                        })

                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error ||
                "Message could not be sent."
            );

        }


        input.value =
            "";

        input.style.height =
            "42px";


        clearImage();


        await loadMessages(true);

    }
    catch(error){

        console.error(error);

        alert(
            "SEND ERROR\n\n" +
            error.message
        );

    }
    finally{

        sendButton.disabled =
            false;

    }

}


/* ========================================================
   LOAD MESSAGES
======================================================== */

async function loadMessages(
    keepBottom = false
){

    if(loadingMessages){

        return;

    }


    loadingMessages =
        true;


    try{

        const response =
            await fetch(
                API_URL +
                "?channel=" +
                encodeURIComponent(
                    CHANNEL
                ),
                {
                    cache:"no-store"
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error ||
                "Could not load messages."
            );

        }


        renderMessages(
            data.messages || [],
            keepBottom
        );

    }
    catch(error){

        console.error(
            "LOAD ERROR:",
            error
        );

        /*
         * Only show an error if there
         * isn't already a conversation.
         */

        if(
            messagesElement
            .children.length === 1
        ){

            emptyElement.innerHTML = `

                <div>

                    <div class="empty-icon">
                        ⚠️
                    </div>

                    <h2>
                        Could not connect
                    </h2>

                    <p>
                        ${escapeHTML(
                            error.message
                        )}
                    </p>

                </div>

            `;

        }

    }
    finally{

        loadingMessages =
            false;

    }

}


/* ========================================================
   RENDER
======================================================== */

function renderMessages(
    messages,
    keepBottom
){

    const wasAtBottom =
        messagesElement.scrollHeight -
        messagesElement.scrollTop -
        messagesElement.clientHeight
        < 100;


    messagesElement.innerHTML =
        "";


    if(!messages.length){

        messagesElement.appendChild(
            emptyElement
        );

        emptyElement.style.display =
            "flex";

        return;

    }


    emptyElement.style.display =
        "none";


    messages.forEach(
        message => {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "message";


            const initial =
                (
                    message.username ||
                    "?"
                )
                .charAt(0)
                .toUpperCase();


            const date =
                message.created_at
                    ? new Date(
                        message.created_at
                      )
                    : new Date();


            const time =
                date.toLocaleTimeString(
                    [],
                    {
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                );


            let html = `

                <div class="avatar">

                    ${escapeHTML(initial)}

                </div>

                <div class="message-content">

                    <div class="message-top">

                        <span class="username">

                            ${escapeHTML(
                                message.username ||
                                "Anonymous"
                            )}

                        </span>

                        <span class="time">

                            ${time}

                        </span>

                    </div>

            `;


            if(message.message){

                html += `

                    <div class="message-text">

                        ${escapeHTML(
                            message.message
                        )}

                    </div>

                `;

            }


            if(
                message.image &&
                typeof message.image ===
                    "string"
            ){

                html += `

                    <img
                        class="message-image"
                        src="${escapeAttribute(
                            message.image
                        )}"
                        loading="lazy"
                        alt="Sent image"
                    >

                `;

            }


            html += `

                </div>

            `;


            element.innerHTML =
                html;


            messagesElement.appendChild(
                element
            );

        }
    );


    if(
        keepBottom ||
        wasAtBottom
    ){

        requestAnimationFrame(
            () => {

                messagesElement.scrollTop =
                    messagesElement.scrollHeight;

            }
        );

    }

}


/* ========================================================
   ESCAPE HTML
======================================================== */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function escapeAttribute(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll('"',"&quot;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;");

}

document

.forEach(
    button => {

        button.addEventListener(
            "click",
            () => {

                const theme =
                    button.dataset.theme;


                applyTheme(
                    theme
                );


                localStorage.setItem(
                    "chat_theme",
                    theme
                );

            }
        );

    }
);


function applyTheme(name){

    const theme =
        themes[name] ||
        themes.dark;


    const root =
        document.documentElement;


    Object.keys(theme)
        .forEach(
            key => {

                root.style.setProperty(
                    "--" + key,
                    theme[key]
                );

            }
        );

}
