<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat</title>

<style>
*{box-sizing:border-box}

:root{
    --bg:#090b0e;
    --panel:#111419;
    --panel2:#181c22;
    --panel3:#20252d;
    --border:#2a3039;
    --text:#edf0f4;
    --muted:#858e9a;
    --accent:#e8eaed;
    --danger:#ff7070;
    --green:#72df9b;
    --radius:12px;
    --text-size:16px;
    --word-spacing:0px;
    --line-spacing:1.45;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

body{
    overflow:hidden;
}

button,input,textarea,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:64px;
    min-height:64px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel);
    border-bottom:1px solid var(--border);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
}

.logo-icon{
    width:35px;
    height:35px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:var(--panel2);
    border:1px solid var(--border);
}

.channel{
    color:var(--muted);
    font-weight:400;
}

.icon-btn{
    width:39px;
    height:39px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
}

/* MESSAGES */

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    display:flex;
    gap:11px;
    margin-bottom:17px;
}

.avatar{
    flex:0 0 40px;
    width:40px;
    height:40px;
    display:grid;
    place-items:center;
    border-radius:var(--radius);
    background:var(--panel2);
    border:1px solid var(--border);
    font-weight:700;
}

.message-content{
    min-width:0;
    max-width:min(900px,calc(100vw - 90px));
}

.message-top{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:3px;
}

.username{
    font-weight:700;
}

.time,.edited{
    color:var(--muted);
    font-size:11px;
}

.message-text{
    color:#d8dde4;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    font-size:var(--text-size);
    word-spacing:var(--word-spacing);
    line-height:var(--line-spacing);
}

.message-image{
    display:block;
    max-width:min(500px,80vw);
    max-height:500px;
    margin-top:8px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:#000;
    object-fit:contain;
}

/* GAME CARD */

.game-card{
    width:min(620px,90vw);
    margin-top:9px;
    border:1px solid #353c47;
    border-radius:16px;
    overflow:hidden;
    background:#101318;
    box-shadow:0 12px 40px #0006;
}

.game-header{
    padding:15px;
    background:linear-gradient(180deg,#1b2027,#14181e);
    border-bottom:1px solid var(--border);
}

.game-title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.game-title{
    font-size:18px;
    font-weight:800;
}

.game-status{
    padding:5px 9px;
    border-radius:999px;
    font-size:11px;
    font-weight:700;
    background:#252b34;
    color:#c5ccd5;
}

.game-status.waiting{
    color:#ffd479;
}

.game-status.running{
    color:var(--green);
}

.game-status.finished{
    color:#aeb6c2;
}

.game-invite{
    color:#aeb6c2;
    font-size:13px;
    margin-top:6px;
}

.game-body{
    padding:15px;
}

.game-info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:12px;
}

.game-info-box{
    padding:10px;
    border-radius:10px;
    background:#181d24;
    border:1px solid var(--border);
}

.game-info-label{
    font-size:10px;
    text-transform:uppercase;
    color:#747d89;
}

.game-info-value{
    margin-top:3px;
    font-size:13px;
    font-weight:700;
}

.game-players{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:12px;
}

.player-pill{
    padding:7px 10px;
    border-radius:999px;
    background:#202630;
    border:1px solid #303742;
    font-size:12px;
}

.player-pill.host{
    border-color:#8b7441;
}

.player-pill.you{
    border-color:#667f9e;
}

.turn-box{
    padding:10px;
    margin-bottom:12px;
    border-radius:10px;
    background:#151a20;
    border:1px solid var(--border);
    text-align:center;
    font-size:13px;
}

.game-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.game-actions button{
    border:1px solid var(--border);
    border-radius:9px;
    padding:9px 13px;
    background:#20252d;
    color:white;
}

.game-actions button:hover{
    filter:brightness(1.15);
}

.game-actions .primary{
    background:#e8eaed;
    color:#111;
}

.game-actions .danger{
    color:#ff8585;
    border-color:#663437;
    background:#261719;
}

.game-actions .leave{
    color:#ffc878;
}

.game-area{
    margin-top:14px;
    padding:14px;
    border-radius:13px;
    background:#0d1014;
    border:1px solid var(--border);
}

/* TIC TAC TOE */

.ttt{
    display:grid;
    grid-template-columns:repeat(3,80px);
    gap:7px;
    justify-content:center;
}

.ttt button{
    width:80px;
    height:80px;
    border:1px solid #343b45;
    border-radius:10px;
    background:#1a1f26;
    color:white;
    font-size:30px;
    font-weight:800;
}

/* DICE */

.dice{
    text-align:center;
}

.dice-number{
    font-size:72px;
    margin:8px;
}

/* COIN */

.coin{
    text-align:center;
}

.coin-result{
    min-height:100px;
    display:grid;
    place-items:center;
    font-size:45px;
}

/* CONNECT FOUR */

.connect4{
    display:grid;
    grid-template-columns:repeat(7,42px);
    gap:5px;
    justify-content:center;
}

.connect4 button{
    width:42px;
    height:42px;
    border:1px solid #343b45;
    border-radius:50%;
    background:#20252c;
}

.connect4 button.red{
    background:#c64c4c;
}

.connect4 button.yellow{
    background:#d8b848;
}

/* HIGH LOW */

.highlow{
    text-align:center;
}

.highlow-number{
    font-size:55px;
    font-weight:800;
    margin:10px;
}

/* COMPOSER */

.composer{
    padding:12px 16px 16px;
    background:var(--panel);
    border-top:1px solid var(--border);
}

.composer-box{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:8px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:14px;
}

textarea{
    flex:1;
    min-height:42px;
    max-height:150px;
    resize:none;
    border:0;
    outline:none;
    background:transparent;
    color:white;
    padding:10px;
}

.attach-btn,
.send-btn{
    height:42px;
    border:0;
    border-radius:9px;
}

.attach-btn{
    width:42px;
    background:transparent;
    color:#adb5c0;
}

.send-btn{
    padding:0 18px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

.send-btn:disabled{
    opacity:.5;
}

/* SETTINGS */

.overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000b;
    z-index:100;
}

.overlay.show{
    display:flex;
}

.panel{
    width:min(520px,calc(100vw - 25px));
    max-height:calc(100vh - 25px);
    overflow-y:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px;
    border-bottom:1px solid var(--border);
}

.panel-header h2{
    margin:0;
}

.panel-body{
    padding:18px;
}

.category{
    margin-bottom:12px;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    background:var(--panel2);
}

.category-title{
    width:100%;
    padding:14px;
    border:0;
    background:transparent;
    color:var(--text);
    display:flex;
    justify-content:space-between;
    font-weight:700;
    text-align:left;
}

.category-body{
    display:none;
    padding:0 14px 14px;
}

.category.open .category-body{
    display:block;
}

.setting{
    margin-top:14px;
}

.setting label{
    display:block;
    margin-bottom:7px;
    color:#aab2bd;
    font-size:13px;
}

.setting input,
.setting select{
    width:100%;
    padding:10px;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
    background:#101419;
    color:white;
}

.setting input[type=range]{
    padding:0;
}

.save-btn{
    width:100%;
    margin-top:8px;
    padding:12px;
    border:0;
    border-radius:9px;
    background:var(--accent);
    color:#111;
    font-weight:700;
}

/* GAMES PANEL */

.game-create{
    display:grid;
    gap:10px;
}

.game-create select{
    width:100%;
    padding:11px;
    background:#101419;
    color:white;
    border:1px solid var(--border);
    border-radius:9px;
}

.game-create button{
    padding:12px;
    border:0;
    border-radius:9px;
    background:#e8eaed;
    color:#111;
    font-weight:700;
}

/* EMPTY */

.empty{
    height:100%;
    display:grid;
    place-items:center;
    color:#656d78;
    text-align:center;
}

.empty strong{
    display:block;
    color:#aab2bd;
    margin-bottom:5px;
}

@media(max-width:600px){

    .header{
        padding:0 11px;
    }

    .messages{
        padding:15px 11px;
    }

    .channel{
        display:none;
    }

    .message-content{
        max-width:calc(100vw - 70px);
    }

    .game-info{
        grid-template-columns:1fr;
    }

    .ttt{
        grid-template-columns:repeat(3,65px);
    }

    .ttt button{
        width:65px;
        height:65px;
    }

    .connect4{
        grid-template-columns:repeat(7,35px);
    }

    .connect4 button{
        width:35px;
        height:35px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">
    <div class="logo">
        <div class="logo-icon">💬</div>
        <span>Chat</span>
        <span class="channel"># general</span>
    </div>

    <div style="display:flex;gap:7px">
        <button class="icon-btn" id="gamesBtn" title="Games">🎮</button>
        <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
    </div>
</header>

<main class="messages" id="messages"></main>

<div class="composer">

    <div class="composer-box">

        <textarea
            id="messageInput"
            rows="1"
            placeholder="Message #general"
        ></textarea>

        <button class="send-btn" id="sendBtn">Send</button>

    </div>

</div>

</div>


<!-- SETTINGS -->

<div class="overlay" id="settingsOverlay">

<div class="panel">

<div class="panel-header">
    <h2>Settings</h2>
    <button class="icon-btn" id="closeSettings">×</button>
</div>

<div class="panel-body">

<div class="category open">

<button class="category-title">
    <span>👤 Profile</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Your name</label>
<input id="usernameInput" maxlength="24">
</div>

<div class="setting">
<label>Device ID</label>
<input id="deviceIdInput" readonly>
</div>

</div>
</div>


<div class="category">

<button class="category-title">
    <span>📝 Text</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Text size</label>
<input id="textSize" type="range" min="12" max="24" step="1">
</div>

<div class="setting">
<label>Word spacing</label>
<input id="wordSpacing" type="range" min="0" max="12" step="1">
</div>

<div class="setting">
<label>Line spacing</label>
<input id="lineSpacing" type="range" min="1" max="2" step=".05">
</div>

</div>
</div>


<div class="category">

<button class="category-title">
    <span>💬 Chat</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Normal refresh rate</label>
<select id="refreshRate">
<option value="10000">10 seconds</option>
<option value="5000">5 seconds</option>
<option value="3000">3 seconds</option>
<option value="2000">2 seconds</option>
<option value="1000">1 second</option>
<option value="500" selected>0.5 seconds</option>
<option value="100">0.1 seconds</option>
</select>
</div>

<div class="setting">
<label>Show timestamps</label>
<select id="showTimestamps">
<option value="true">On</option>
<option value="false">Off</option>
</select>
</div>

<div class="setting">
<label>Compact messages</label>
<select id="compactMessages">
<option value="false">Off</option>
<option value="true">On</option>
</select>
</div>

</div>
</div>


<div class="category">

<button class="category-title">
    <span>🎮 Games</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Game synchronization</label>
<select id="gameRefresh">
<option value="100">0.1 seconds</option>
<option value="250">0.25 seconds</option>
<option value="500" selected>0.5 seconds</option>
<option value="1000">1 second</option>
</select>
</div>

<div class="setting">
<label>Allow game invites</label>
<select id="allowGames">
<option value="true">On</option>
<option value="false">Off</option>
</select>
</div>

</div>
</div>


<div class="category">

<button class="category-title">
    <span>🎨 Appearance</span>
    <span>⌄</span>
</button>

<div class="category-body">

<div class="setting">
<label>Theme</label>
<select id="themeSelect">
<option value="dark">Dark</option>
<option value="midnight">Midnight</option>
<option value="black">Pure Black</option>
<option value="gray">Classic Gray</option>
<option value="light">Light</option>
</select>
</div>

<div class="setting">
<label>Corner roundness</label>
<input id="cornerRadius" type="range" min="0" max="25">
</div>

</div>
</div>


<button class="save-btn" id="saveSettings">
Save settings
</button>

</div>
</div>
</div>


<!-- GAMES -->

<div class="overlay" id="gamesOverlay">

<div class="panel">

<div class="panel-header">
    <h2>🎮 Games</h2>
    <button class="icon-btn" id="closeGames">×</button>
</div>

<div class="panel-body">

<div class="game-create">

<select id="gameType">

<option value="tictactoe">
⭕ Tic-Tac-Toe
</option>

<option value="dice">
🎲 Dice Duel
</option>

<option value="coin">
🪙 Coin Flip
</option>

<option value="connect4">
🔴 Connect Four
</option>

<option value="highlow">
🔢 High / Low
</option>

</select>

<button id="createGame">
Host Game
</button>

</div>

<p style="color:#858e9a;font-size:13px;line-height:1.5">
Players must press <b>Join</b> before the host starts.
Spectators can watch without joining.
A host can only host one game at a time.
</p>

</div>
</div>
</div>


<script>

const API_URL="/api/messages";
const CHANNEL="general";

/*
 IMPORTANT:

 Game data is stored inside messages using this prefix:

 __CHAT_GAME__

 It is rendered as a game card instead of normal text.

 When a game ends, this script sends DELETE requests
 for all game-state messages it created.
*/


/* =========================================================
   DEVICE
========================================================= */

let deviceId=localStorage.getItem("chat_device_id");

if(!deviceId){

    deviceId=crypto.randomUUID();

    localStorage.setItem(
        "chat_device_id",
        deviceId
    );
}


/* =========================================================
   SETTINGS
========================================================= */

const defaults={

    username:"",

    theme:"dark",

    refreshRate:500,

    textSize:16,

    wordSpacing:0,

    lineSpacing:1.45,

    cornerRadius:12,

    gameRefresh:500,

    allowGames:true,

    showTimestamps:true,

    compactMessages:false
};

function getSetting(key){

    const value=
        localStorage.getItem(
            "chat_"+key
        );

    if(value===null){
        return defaults[key];
    }

    if(value==="true"){
        return true;
    }

    if(value==="false"){
        return false;
    }

    const n=Number(value);

    return Number.isNaN(n)
        ?value
        :n;
}

let settings={};

Object.keys(defaults).forEach(
    key=>{
        settings[key]=getSetting(key);
    }
);


/* =========================================================
   ELEMENTS
========================================================= */

const messagesEl=
    document.getElementById("messages");

const messageInput=
    document.getElementById("messageInput");

const sendBtn=
    document.getElementById("sendBtn");

const settingsBtn=
    document.getElementById("settingsBtn");

const settingsOverlay=
    document.getElementById("settingsOverlay");

const closeSettings=
    document.getElementById("closeSettings");

const saveSettings=
    document.getElementById("saveSettings");

const gamesBtn=
    document.getElementById("gamesBtn");

const gamesOverlay=
    document.getElementById("gamesOverlay");

const closeGames=
    document.getElementById("closeGames");

const createGame=
    document.getElementById("createGame");

const gameType=
    document.getElementById("gameType");


/* =========================================================
   GAME STATE
========================================================= */

let currentMessages=[];

let refreshTimer=null;

let gameTimer=null;

let activeGames=new Map();

let selectedGame=null;


/* =========================================================
   APPLY SETTINGS
========================================================= */

function applySettings(){

    document.documentElement.style.setProperty(
        "--text-size",
        settings.textSize+"px"
    );

    document.documentElement.style.setProperty(
        "--word-spacing",
        settings.wordSpacing+"px"
    );

    document.documentElement.style.setProperty(
        "--line-spacing",
        settings.lineSpacing
    );

    document.documentElement.style.setProperty(
        "--radius",
        settings.cornerRadius+"px"
    );

    applyTheme(
        settings.theme
    );

    startRefresh();

}


/* =========================================================
   THEME
========================================================= */

function applyTheme(name){

    const themes={

        dark:["#090b0e","#111419"],

        midnight:["#070a12","#0e1420"],

        black:["#000","#080808"],

        gray:["#151515","#202020"],

        light:["#eeeeee","#ffffff"]
    };

    const t=
        themes[name]||
        themes.dark;

    document.documentElement.style.setProperty(
        "--bg",
        t[0]
    );

    document.documentElement.style.setProperty(
        "--panel",
        t[1]
    );

    document.body.style.background=
        t[0];
}


/* =========================================================
   SETTINGS UI
========================================================= */

function loadSettingsUI(){

    usernameInput.value=
        settings.username;

    deviceIdInput.value=
        deviceId;

    textSize.value=
        settings.textSize;

    wordSpacing.value=
        settings.wordSpacing;

    lineSpacing.value=
        settings.lineSpacing;

    refreshRate.value=
        settings.refreshRate;

    gameRefresh.value=
        settings.gameRefresh;

    allowGames.value=
        String(settings.allowGames);

    showTimestamps.value=
        String(settings.showTimestamps);

    compactMessages.value=
        String(settings.compactMessages);

    themeSelect.value=
        settings.theme;

    cornerRadius.value=
        settings.cornerRadius;
}


const usernameInput=
    document.getElementById("usernameInput");

const deviceIdInput=
    document.getElementById("deviceIdInput");

const textSize=
    document.getElementById("textSize");

const wordSpacing=
    document.getElementById("wordSpacing");

const lineSpacing=
    document.getElementById("lineSpacing");

const refreshRate=
    document.getElementById("refreshRate");

const gameRefresh=
    document.getElementById("gameRefresh");

const allowGames=
    document.getElementById("allowGames");

const showTimestamps=
    document.getElementById("showTimestamps");

const compactMessages=
    document.getElementById("compactMessages");

const themeSelect=
    document.getElementById("themeSelect");

const cornerRadius=
    document.getElementById("cornerRadius");


saveSettings.onclick=()=>{

    settings.username=
        usernameInput.value
        .trim()
        .substring(0,24);

    settings.textSize=
        Number(textSize.value);

    settings.wordSpacing=
        Number(wordSpacing.value);

    settings.lineSpacing=
        Number(lineSpacing.value);

    settings.refreshRate=
        Number(refreshRate.value);

    settings.gameRefresh=
        Number(gameRefresh.value);

    settings.allowGames=
        allowGames.value==="true";

    settings.showTimestamps=
        showTimestamps.value==="true";

    settings.compactMessages=
        compactMessages.value==="true";

    settings.theme=
        themeSelect.value;

    settings.cornerRadius=
        Number(cornerRadius.value);

    Object.keys(settings).forEach(key=>{

        localStorage.setItem(
            "chat_"+key,
            settings[key]
        );

    });

    applySettings();

    settingsOverlay.classList.remove("show");
};


settingsBtn.onclick=()=>{

    loadSettingsUI();

    settingsOverlay.classList.add("show");
};

closeSettings.onclick=()=>{

    settingsOverlay.classList.remove("show");
};


/* =========================================================

/* =========================================================

========================================================= */

async function apiGet(){

    const response=
        await fetch(
            API_URL+
            "?channel="+
            encodeURIComponent(CHANNEL)
        );

    const data=
        await response.json();

    if(!response.ok){

        throw new Error(
            data.error||
            "Could not load chat."
        );
    }

    return Array.isArray(data.messages)
        ?data.messages
        :[];
}


async function apiPost(body){

    const response=
        await fetch(
            API_URL,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(body)
            }
        );

    const data=
        await response.json();

    if(!response.ok){

        throw new Error(
            data.error||
            "Request failed."
        );
    }

    return data;
}


async function apiDelete(id){

        await fetch(

/* =========================================================
   CREATE GAME STATE
========================================================= */

function createGameState(type){

    const id=
        crypto.randomUUID();

    const base={

        id:id,

        type:type,

        host:
            settings.username,

        hostDeviceId:
            deviceId,

        players:[{

            name:
                settings.username,

            deviceId:
                deviceId
        }],

        status:
            "waiting",

        turn:0,

        createdAt:
            Date.now(),

        version:1
    };


    if(type==="tictactoe"){

        base.board=
            ["","","","","","","","",""];

        base.turn=0;
    }


    if(type==="dice"){

        base.rolls=[];

        base.round=1;

        base.scores={};
    }


    if(type==="coin"){

        base.result="";

        base.round=1;

        base.scores={};
    }


    if(type==="connect4"){

        base.board=
            Array(42).fill("");

        base.turn=0;
    }


    if(type==="highlow"){

        base.number=
            Math.floor(
                Math.random()*100
            )+1;

        base.guesses=[];

        base.turn=0;
    }


    return base;
}


/* =========================================================
   GAME MESSAGE
========================================================= */

function encodeGame(game){

    return "__CHAT_GAME__"+
        JSON.stringify(game);
}


function decodeGame(message){

    if(
        !message ||
        typeof message.message!=="string"
    ){

        return null;
    }

    if(
        !message.message.startsWith(
            "__CHAT_GAME__"
        )
    ){

        return null;
    }

    try{

        return JSON.parse(
            message.message.substring(
                "__CHAT_GAME__".length
            )
        );

    }catch{

        return null;
    }
}


/* =========================================================
   FIND LATEST GAME STATE
========================================================= */

function rebuildGames(){

    activeGames.clear();

    currentMessages.forEach(message=>{

        const game=
            decodeGame(message);

        if(!game)return;

        /*
          Latest message for a game wins.
        */

        game.__messageId=
            message.id;

        activeGames.set(
            game.id,
            game
        );

    });
}


/* =========================================================
   WRITE GAME STATE
========================================================= */

async function writeGameState(game){

    await apiPost({

        username:
            "__GAME__",

        channel:
            CHANNEL,

        message:
            encodeGame(game),

        image:null,

        device_id:
            game.hostDeviceId

    });
}


/* =========================================================
   UPDATE GAME
========================================================= */

async function updateGame(game){

    game.version=
        Number(game.version||0)+1;

    game.updatedAt=
        Date.now();

    await writeGameState(game);
}


/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages(){

    try{

        const oldGames=
            new Map(activeGames);

        const messages=
            await apiGet();

        currentMessages=
            messages;

        rebuildGames();

        renderMessages();

        /*
          Cleanup games that have no players.
        */

        for(
            const game of activeGames.values()
        ){

            if(
                game.status!=="finished" &&
                (!game.players||
                 game.players.length===0)
            ){

                await endGame(
                    game,
                    false
                );
            }
        }

    }catch(error){

        messagesEl.innerHTML=
            `<div class="empty">
                <div>
                    <strong>
                        Unable to load messages
                    </strong>
                    ${escapeHtml(error.message)}
                </div>
            </div>`;

    }

}


/* =========================================================
   RENDER
========================================================= */

function renderMessages(){

    if(!currentMessages.length){

        messagesEl.innerHTML=
            `<div class="empty">
                <div>
                    <strong>
                        No messages yet
                    </strong>
                    Be the first to send something.
                </div>
            </div>`;

        return;
    }

    const fragment=
        document.createDocumentFragment();

    currentMessages.forEach(message=>{

        const game=
            decodeGame(message);

        if(game){

            /*
              Hidden game-state messages are NOT displayed
              as normal chat messages.
            */

            const card=
                buildGameCard(
                    game,
                    message.id
                );

            if(card){

                fragment.appendChild(card);

            }

            return;
        }


        const item=
            document.createElement("div");

        item.className="message";

        const avatar=
            document.createElement("div");

        avatar.className="avatar";

        avatar.textContent=
            (message.username||"?")
            .charAt(0)
            .toUpperCase();

        const content=
            document.createElement("div");

        content.className=
            "message-content";

        const top=
            document.createElement("div");

        top.className=
            "message-top";

        const name=
            document.createElement("span");

        name.className=
            "username";

        name.textContent=
            message.username||
            "User";

        top.appendChild(name);

        if(settings.showTimestamps){

            const time=
                document.createElement("span");

            time.className="time";

            time.textContent=
                formatTime(
                    message.created_at
                );

            top.appendChild(time);
        }

        content.appendChild(top);

        if(message.message){

            const text=
                document.createElement("div");

            text.className=
                "message-text";

            text.textContent=
                message.message;

            content.appendChild(text);
        }

        if(message.image){

            const img=
                document.createElement("img");

            img.className=
                "message-image";

            img.src=
                message.image;

            content.appendChild(img);
        }

        item.appendChild(avatar);
        item.appendChild(content);

        fragment.appendChild(item);

    });

    messagesEl.replaceChildren(
        fragment
    );

    if(settings.autoScroll!==false){

        messagesEl.scrollTop=
            messagesEl.scrollHeight;
    }
}


/* =========================================================
   GAME CARD
========================================================= */

function buildGameCard(
    game,
    messageId
){

    const card=
        document.createElement("div");

    card.className=
        "message-content";

    const gameCard=
        document.createElement("div");

    gameCard.className=
        "game-card";

    const title=
        gameName(game.type);

    const status=
        game.status;

    gameCard.innerHTML=`

        <div class="game-header">

            <div class="game-title-row">

                <div class="game-title">
                    🎮 ${escapeHtml(title)}
                </div>

                <div class="game-status ${status}">
                    ${escapeHtml(status)}
                </div>

            </div>

            <div class="game-invite">
                ${escapeHtml(game.host)}
                invited you to a game of
                <b>${escapeHtml(title)}</b>
            </div>

        </div>

        <div class="game-body">

            <div class="game-info">

                <div class="game-info-box">
                    <div class="game-info-label">
                        Host
                    </div>
                    <div class="game-info-value">
                        ${escapeHtml(game.host)}
                    </div>
                </div>

                <div class="game-info-box">
                    <div class="game-info-label">
                        Players
                    </div>
                    <div class="game-info-value">
                        ${game.players.length}/${maxPlayers(game.type)}
                    </div>
                </div>

                <div class="game-info-box">
                    <div class="game-info-label">
                        State
                    </div>
                    <div class="game-info-value">
                        ${game.status==="waiting"
                            ?"Waiting"
                            :"Running"}
                    </div>
                </div>

            </div>

            <div class="game-players"></div>

            <div class="turn-box"></div>

            <div class="game-actions"></div>

            <div class="game-area"></div>

        </div>
    `;


    const playersEl=
        gameCard.querySelector(
            ".game-players"
        );

    game.players.forEach(player=>{

        const pill=
            document.createElement("div");

        pill.className=
            "player-pill";

        if(
            player.deviceId===
            game.hostDeviceId
        ){

            pill.classList.add(
                "host"
            );
        }

        if(
            player.deviceId===
            deviceId
        ){

            pill.classList.add(
                "you"
            );
        }

        pill.textContent=
            player.name+
            (
                player.deviceId===
                game.hostDeviceId
                ?" 👑"
                :""
            );

        playersEl.appendChild(
            pill
        );

    });


    const turnBox=
        gameCard.querySelector(
            ".turn-box"
        );

    turnBox.textContent=
        getTurnText(game);


    const actions=
        gameCard.querySelector(
            ".game-actions"
        );


    const isPlayer=
        game.players.some(
            player=>
                player.deviceId===
                deviceId
        );


    const isHost=
        game.hostDeviceId===
        deviceId;


    if(game.status==="waiting"){

        if(!isPlayer){

            addButton(
                actions,
                "Join Game",
                "primary",
                ()=>{
                    joinGame(game);
                }
            );

        }else{

            addButton(
                actions,
                "Joined ✓",
                "",
                null,
                true
            );

        }


        addButton(
            actions,
            "Leave",
            "leave",
            ()=>{
                leaveGame(game);
            }
        );


        if(isHost){

            const enough=
                game.players.length>=
                minimumPlayers(game.type);

            addButton(
                actions,
                enough
                    ?"Start Game"
                    :"Need "+
                     minimumPlayers(game.type)+
                     " players",
                "primary",
                enough
                    ?()=>{
                        startGame(game);
                    }
                    :null,
                !enough
            );


            addButton(
                actions,
                "Force Quit",
                "danger",
                ()=>{
                    endGame(game,true);
                }
            );

        }

    }else if(game.status==="running"){

        if(isPlayer){

            addButton(
                actions,
                "Leave Game",
                "leave",
                ()=>{
                    leaveGame(game);
                }
            );

        }else{

            addButton(
                actions,
                "Spectating",
                "",
                null,
                true
            );

        }


        if(isHost){

            addButton(
                actions,
                "Force Quit",
                "danger",
                ()=>{
                    endGame(game,true);
                }
            );

        }

    }


    const area=
        gameCard.querySelector(
            ".game-area"
        );

    renderGameArea(
        area,
        game,
        isPlayer
    );


    card.appendChild(
        gameCard
    );

    return card;
}

function addButton(
    parent,
    text,
    className,
    callback,
    disabled=false
){

    const button=
        document.createElement("button");

    button.textContent=
        text;

    if(className){

        button.className=
            className;
    }

    button.disabled=
        disabled;

            event=>{

                event.stopPropagation();

                callback();

            };
    }

    );
}


/* =========================================================
   GAME INFORMATION
========================================================= */

function gameName(type){

    const names={

        tictactoe:
            "Tic-Tac-Toe",

        dice:
            "Dice Duel",

        coin:
            "Coin Flip",

        connect4:
            "Connect Four",

        highlow:
            "High / Low"
    };

    return names[type]||"Game";
}


function maxPlayers(type){

    if(type==="tictactoe"){
        return 2;
    }

    if(type==="dice"){
        return 6;
    }

    if(type==="coin"){
        return 6;
    }

    if(type==="connect4"){
        return 2;
    }

    if(type==="highlow"){
        return 2;
    }

    return 2;
}


function minimumPlayers(type){

    return 2;
}


function getTurnText(game){

    if(game.status==="waiting"){

        const needed=
            minimumPlayers(game.type)-
            game.players.length;

        if(needed>0){

            return "Waiting for "+
                needed+
                " more player"+
                (needed===1?"":"s")+
                " to start.";

        }

        return "Ready to start.";
    }

    if(game.status==="finished"){

        return "Game finished.";
    }

    const player=
        game.players[
            game.turn%
            game.players.length
        ];

    return player
        ?player.name+"'s turn"
        :"Waiting...";
}


/* =========================================================
   JOIN
========================================================= */

async function joinGame(game){

    if(game.status!=="waiting"){

        alert(
            "This game has already started."
        );

        return;
    }

    if(
        game.players.some(
            player=>
                player.deviceId===
                deviceId
        )
    ){

        return;
    }

    if(
        game.players.length>=
        maxPlayers(game.type)
    ){

        alert(
            "This game is full."
        );

        return;
    }

    game.players.push({

        name:
            settings.username,

        deviceId:
            deviceId

    });

    await updateGame(game);

    await loadMessages();
}


/* =========================================================
   LEAVE
========================================================= */

async function leaveGame(game){

    const index=
        game.players.findIndex(
            player=>
                player.deviceId===
                deviceId
        );

    if(index===-1)return;

    const wasHost=
        game.hostDeviceId===
        deviceId;

    game.players.splice(
        index,
        1
    );


    /*
      If nobody is left, completely remove
      the game and all of its hidden messages.
    */

    if(game.players.length===0){

        await endGame(
            game,
            false
        );

        return;
    }


    /*
      If host leaves, promote another player.
    */

    if(wasHost){

        const newHost=
            game.players[0];

        game.host=
            newHost.name;

        game.hostDeviceId=
            newHost.deviceId;
    }


    if(
        game.status==="running" &&
        game.turn>=game.players.length
    ){

        game.turn=0;
    }

    await updateGame(game);

    await loadMessages();
}


/* =========================================================
   START
========================================================= */

async function startGame(game){

    if(
        game.hostDeviceId!==
        deviceId
    ){

        return;
    }

    if(
        game.players.length<
        minimumPlayers(game.type)
    ){

        alert(
            "You need at least "+
            minimumPlayers(game.type)+
            " players."
        );

        return;
    }

    if(game.status!=="waiting"){
        return;
    }

    game.status=
        "running";

    game.turn=0;

    await updateGame(game);

    await loadMessages();
}


/* =========================================================
   FORCE QUIT / END
========================================================= */

async function endGame(
    game,
    force
){

    if(!game)return;

    /*
      Only host may force quit.
    */

    if(
        force &&
        game.hostDeviceId!==
        deviceId
    ){

        return;
    }


    /*
      Find EVERY hidden game-state message
      belonging to this game and delete it.
    */

    const messagesToDelete=
        currentMessages.filter(
            message=>{

                const state=
                    decodeGame(message);

                return state &&
                    state.id===
                    game.id;

            }
        );


    activeGames.delete(
        game.id
    );


    /*
      Delete all game messages.
    */

    await Promise.all(
        messagesToDelete.map(
            message=>
                apiDelete(
                    message.id
                ).catch(
                    ()=>{}
                )
        )
    );


    currentMessages=
        currentMessages.filter(
            message=>{

                const state=
                    decodeGame(message);

                return !(
                    state &&
                    state.id===
                    game.id
                );
            }
        );


    renderMessages();
}


/* =========================================================
   GAME AREA
========================================================= */

function renderGameArea(
    area,
    game,
    isPlayer
){

    if(game.status!=="running"){

        area.style.display=
            "none";

        return;
    }

    area.style.display=
        "block";


    if(game.type==="tictactoe"){

        renderTicTacToe(
            area,
            game,
            isPlayer
        );

        return;
    }


    if(game.type==="dice"){

        renderDice(
            area,
            game,
            isPlayer
        );

        return;
    }


    if(game.type==="coin"){

        renderCoin(
            area,
            game,
            isPlayer
        );

        return;
    }


    if(game.type==="connect4"){

        renderConnect4(
            area,
            game,
            isPlayer
        );

        return;
    }


    if(game.type==="highlow"){

        renderHighLow(
            area,
            game,
            isPlayer
        );

        return;
    }
}


/* =========================================================
   TIC TAC TOE
========================================================= */

function renderTicTacToe(
    area,
    game,
    isPlayer
){

    const board=
        document.createElement("div");

    board.className="ttt";

    game.board.forEach(
        (value,index)=>{

            const button=
                document.createElement(
                    "button"
                );

            button.textContent=
                value;

            const myTurn=
                game.players[
                    game.turn
                ]?.deviceId===
                deviceId;

            button.disabled=
                !isPlayer||
                !myTurn||
                !!value;

            button.onclick=
                ()=>{

                    if(
                        !isPlayer||
                        !myTurn||
                        game.board[index]
                    ){

                        return;
                    }

                    game.board[index]=
                        game.turn===0
                        ?"X"
                        :"O";

                    const winner=
                        checkTicTacToe(
                            game.board
                        );

                    if(winner){

                        game.status=
                            "finished";

                    }else{

                        game.turn=
                            game.turn===0
                            ?1
                            :0;
                    }

                    updateGame(game)
                        .then(
                            loadMessages
                        );
                };

            board.appendChild(
                button
            );
        }
    );

    area.appendChild(
        board
    );
}


function checkTicTacToe(board){

    const wins=[

        [0,1,2],
        [3,4,5],
        [6,7,8],

        [0,3,6],
        [1,4,7],
        [2,5,8],

        [0,4,8],
        [2,4,6]
    ];

    for(
        const win of wins
    ){

        if(
            board[win[0]] &&
            board[win[0]]===
            board[win[1]] &&
            board[win[1]]===
            board[win[2]]
        ){

            return board[win[0]];
        }
    }

    if(
        board.every(Boolean)
    ){

        return "draw";
    }

    return null;
}


/* =========================================================
   DICE
========================================================= */

function renderDice(
    area,
    game,
    isPlayer
){

    const wrap=
        document.createElement("div");

    wrap.className="dice";

    const result=
        document.createElement("div");

    result.className=
        "dice-number";

    result.textContent=
        game.lastRoll||
        "🎲";

    wrap.appendChild(result);

    const myTurn=
        game.players[
            game.turn
        ]?.deviceId===
        deviceId;

    if(isPlayer&&myTurn){

        const button=
            document.createElement("button");

        button.className=
            "game-actions";

        button.textContent=
            "Roll Dice";

        button.onclick=
            ()=>{

                const roll=
                    Math.floor(
                        Math.random()*6
                    )+1;

                game.lastRoll=
                    roll;

                game.rolls=
                    game.rolls||[];

                game.rolls.push({

                    player:
                        settings.username,

                    roll:
                        roll

                });

                game.turn=
                    (game.turn+1)%
                    game.players.length;

                updateGame(game)
                    .then(
                        loadMessages
                    );
            };

        wrap.appendChild(
            button
        );
    }

    area.appendChild(
        wrap
    );
}


/* =========================================================
   COIN
========================================================= */

function renderCoin(
    area,
    game,
    isPlayer
){

    const wrap=
        document.createElement("div");

    wrap.className="coin";

    const result=
        document.createElement("div");

    result.className=
        "coin-result";

    result.textContent=
        game.result||
        "🪙";

    wrap.appendChild(
        result
    );

    const myTurn=
        game.players[
            game.turn
        ]?.deviceId===
        deviceId;

    if(isPlayer&&myTurn){

        const button=
            document.createElement("button");

        button.textContent=
            "Flip Coin";

        button.onclick=
            ()=>{

                game.result=
                    Math.random()<.5
                    ?"HEADS"
                    :"TAILS";

                game.turn=
                    (game.turn+1)%
                    game.players.length;

                updateGame(game)
                    .then(
                        loadMessages
                    );
            };

        wrap.appendChild(
            button
        );
    }

    area.appendChild(
        wrap
    );
}


/* =========================================================
   CONNECT FOUR
========================================================= */

function renderConnect4(
    area,
    game,
    isPlayer
){

    const board=
        document.createElement("div");

    board.className=
        "connect4";

    for(
        let i=0;
        i<42;
        i++
    ){

        const button=
            document.createElement(
                "button"
            );

        const value=
            game.board[i];

        if(value){
            button.classList.add(
                value
            );
        }

        const myTurn=
            game.players[
                game.turn
            ]?.deviceId===
            deviceId;

        button.disabled=
            !isPlayer||
            !myTurn||
            !!value;

        button.onclick=
            ()=>{

                if(
                    !isPlayer||
                    !myTurn||
                    value
                ){

                    return;
                }

                const column=
                    i%7;

                let target=-1;

                for(
                    let row=5;
                    row>=0;
                    row--
                ){

                    const index=
                        row*7+
                        column;

                    if(
                        !game.board[index]
                    ){

                        target=index;

                        break;
                    }
                }

                if(target===-1)return;

                game.board[target]=
                    game.turn===0
                    ?"red"
                    :"yellow";

                if(
                    checkConnect4(
                        game.board,
                        game.board[target]
                    )
                ){

                    game.status=
                        "finished";

                }else{

                    game.turn=
                        game.turn===0
                        ?1
                        :0;
                }

                updateGame(game)
                    .then(
                        loadMessages
                    );
            };

        board.appendChild(
            button
        );
    }

    area.appendChild(
        board
    );
}


function checkConnect4(
    board,
    color
){

    for(
        let row=0;
        row<6;
        row++
    ){

        for(
            let col=0;
            col<7;
            col++
        ){

            const index=
                row*7+col;

            if(
                board[index]!==color
            ){

                continue;
            }

            if(
                col<=3 &&
                board[index+1]===color &&
                board[index+2]===color &&
                board[index+3]===color
            ){

                return true;
            }

            if(
                row<=2 &&
                board[index+7]===color &&
                board[index+14]===color &&
                board[index+21]===color
            ){

                return true;
            }

            if(
                col<=3 &&
                row<=2 &&
                board[index+8]===color &&
                board[index+16]===color &&
                board[index+24]===color
            ){

                return true;
            }

            if(
                col>=3 &&
                row<=2 &&
                board[index+6]===color &&
                board[index+12]===color &&
                board[index+18]===color
            ){

                return true;
            }
        }
    }

    return false;
}


/* =========================================================
   HIGH / LOW
========================================================= */

function renderHighLow(
    area,
    game,
    isPlayer
){

    const wrap=
        document.createElement("div");

    wrap.className=
        "highlow";

    const number=
        document.createElement("div");

    number.className=
        "highlow-number";

    number.textContent=
        game.number;

    wrap.appendChild(
        number
    );

    const myTurn=
        game.players[
            game.turn
        ]?.deviceId===
        deviceId;

    if(isPlayer&&myTurn){

        ["Higher","Lower"].forEach(
            choice=>{

                const button=
                    document.createElement(
                        "button"
                    );

                button.textContent=
                    choice;

                button.style.margin=
                    "4px";

                button.onclick=
                    ()=>{

                        const old=
                            game.number;

                        game.number=
                            Math.floor(
                                Math.random()*100
                            )+1;

                        game.guesses=
                            game.guesses||[];

                        game.guesses.push({

                            player:
                                settings.username,

                            choice:
                                choice,

                            old:
                                old,

                            new:
                                game.number
                        });

                        const correct=
                            choice==="Higher"
                            ?game.number>old
                            :game.number<old;

                        if(!correct){

                            game.status=
                                "finished";

                        }else{

                            game.turn=
                                (game.turn+1)%
                                game.players.length;
                        }

                        updateGame(game)
                            .then(
                                loadMessages
                            );
                    };

                wrap.appendChild(
                    button
                );
            }
        );
    }

    area.appendChild(
        wrap
    );
}


/* =========================================================
   REFRESH
========================================================= */

function startRefresh(){

    if(refreshTimer){

        clearInterval(
            refreshTimer
        );
    }

    if(gameTimer){

        clearInterval(
            gameTimer
        );
    }

    /*
      Chat uses the user's selected refresh.
    */

    refreshTimer=
        setInterval(
            loadMessages,
            Number(
                settings.refreshRate
            )
        );


    /*
      Games ALWAYS sync using their own
      setting, independent of chat refresh.
    */

    gameTimer=
        setInterval(
            syncGames,
            Number(
                settings.gameRefresh
            )
        );
}


async function syncGames(){

    try{

        const messages=
            await apiGet();

        currentMessages=
            messages;

        rebuildGames();

        renderMessages();

    }catch{

        /* silently retry */
    }
}


/* =========================================================
   HELPERS
========================================================= */

function formatTime(date){

    if(!date)return "";

    return new Date(date)
        .toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );
}


function escapeHtml(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}


/* =========================================================
   START
========================================================= */

applySettings();

loadMessages();
